{"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 比赛已经结束了。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 火车站附近有很多宾馆。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 您好，一共是十元三角。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 她把房间打扫得干干净净。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 两点半开会，大家不要迟到。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 这儿的风景真美！", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 抱歉，打扰您一下。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 第一印象往往很重要。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 先生，这儿禁止抽烟。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 他从小就养成了写日记的习惯。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81210_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81210_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 你对中学生出国留学怎么看？", "images": []}, "14": {"type": "answer", "question": "Câu 14: 烦恼的时候，你会怎么办？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 比赛已经结束了。<br>2. 火车站附近有很多宾馆。<br>3. 您好，一共是十元三角。<br>4. 她把房间打扫得干干净净。<br>5. 两点半开会，大家不要迟到。<br>6. 这儿的风景真美！<br>7. 抱歉，打扰您一下。<br>8. 第一印象往往很重要。<br>9. 先生，这儿禁止抽烟。<br>10. 他从小就养成了写日记的习惯。", "1. Cuộc thi đã kết thúc rồi. · 2. Gần nhà ga tàu hỏa có rất nhiều khách sạn. · 3. Chào bạn, tổng cộng là mười tệ ba hào. · 4. Cô ấy dọn dẹp căn phòng sạch sẽ tinh tươm. · 5. Hai giờ rưỡi họp, mọi người đừng đến muộn. · 6. Phong cảnh ở đây đẹp thật! · 7. Xin lỗi, làm phiền bạn một chút. · 8. Ấn tượng đầu tiên thường rất quan trọng. · 9. Thưa ông, ở đây cấm hút thuốc. · 10. Anh ấy từ nhỏ đã hình thành thói quen viết nhật ký."], ["Câu 11 · Bài mẫu tham khảo", "这张图片里，一个女孩正用手遮住一个男孩的眼睛。男孩坐在地上，手里拿着一份礼物，脸上带着开心的笑容。我想，这应该是女孩给男孩准备的一个惊喜。今天是男孩的生日，女孩想让他猜猜礼物是什么。男孩虽然看不见，但他一定猜到了，所以笑得很开心。这种朋友或者情侣之间的互动非常温馨，让人觉得很幸福。生活中，我们偶尔给身边的人制造一些小惊喜，不仅能让对方开心，也能让我们的关系变得更好。", "Trong bức tranh này, một cô gái đang dùng tay che mắt một chàng trai. Chàng trai đang ngồi trên sàn, tay cầm một món quà, trên mặt nở nụ cười hạnh phúc. Tôi nghĩ đây chắc hẳn là một bất ngờ mà cô gái dành tặng cho chàng trai. Hôm nay là sinh nhật của chàng trai, cô gái muốn anh ấy đoán xem món quà là gì. Dù không nhìn thấy, nhưng chắc hẳn anh ấy đã đoán ra rồi nên mới cười vui vẻ như vậy. Sự tương tác giữa bạn bè hoặc người yêu như thế này rất ấm áp, khiến người ta cảm thấy hạnh phúc. Trong cuộc sống, thỉnh thoảng tạo ra những bất ngờ nhỏ cho người bên cạnh không chỉ khiến đối phương vui vẻ mà còn giúp mối quan hệ của chúng ta trở nên tốt đẹp hơn."], ["Câu 12 · Bài mẫu tham khảo", "图片里，一位医生正在给病人打针。病人是一个年轻女孩，她看起来有点儿紧张，所以把头转到了一边。医生穿着白大褂，动作很专业，正在细心地为她注射。这让我想起了我上次去医院看病的情景。那时候我也很害怕打针，但是医生一直安慰我，让我放松。其实，打针是为了我们的健康，虽然有一点儿疼，但很快就会过去。我们生病的时候，应该听医生的话，积极配合治疗，这样身体才能早点儿好起来。", "Trong tranh, một bác sĩ đang tiêm cho bệnh nhân. Bệnh nhân là một cô gái trẻ, cô ấy trông có vẻ hơi căng thẳng nên đã quay đầu sang một bên. Bác sĩ mặc áo blouse trắng, thao tác rất chuyên nghiệp, đang cẩn thận tiêm cho cô ấy. Điều này làm tôi nhớ đến lần tôi đi khám bệnh. Lúc đó tôi cũng rất sợ tiêm, nhưng bác sĩ luôn an ủi và bảo tôi thả lỏng. Thực ra, tiêm thuốc là vì sức khỏe của chúng ta, tuy có hơi đau một chút nhưng sẽ nhanh chóng qua đi. Khi bị ốm, chúng ta nên nghe lời bác sĩ, tích cực phối hợp điều trị, như vậy cơ thể mới sớm khỏe lại được."], ["Câu 13 · Bài mẫu tham khảo", "关于中学生出国留学，我认为有利也有弊。好处是，出国留学可以让学生开阔眼界，学习不同的文化，还能提高外语水平，培养独立生活的能力。这对他们未来的发展很有帮助。但是，中学生年纪还小，心理还不成熟，独自在国外生活可能会遇到很多困难，比如孤独、想家，甚至可能因为不适应环境而影响学习。此外，出国留学的费用很高，会给家庭带来很大的经济压力。所以，我认为如果学生已经做好了心理准备，并且有自理能力，出国留学是一个不错的选择。但如果学生还太小，留在国内学习可能更好。", "Về việc học sinh trung học đi du học, tôi nghĩ có lợi cũng có hại. Lợi ích là, đi du học có thể giúp học sinh mở mang tầm mắt, học hỏi các nền văn hóa khác nhau, nâng cao trình độ ngoại ngữ và rèn luyện khả năng sống độc lập. Điều này rất có ích cho sự phát triển tương lai của các em. Tuy nhiên, học sinh trung học còn nhỏ, tâm lý chưa trưởng thành, sống một mình ở nước ngoài có thể gặp nhiều khó khăn, ví dụ như cô đơn, nhớ nhà, thậm chí có thể vì không thích nghi được môi trường mà ảnh hưởng đến việc học. Ngoài ra, chi phí du học rất đắt đỏ, sẽ gây áp lực kinh tế lớn cho gia đình. Vì vậy, tôi nghĩ nếu học sinh đã chuẩn bị tốt về mặt tâm lý và có khả năng tự lập, thì đi du học là một lựa chọn tốt. Nhưng nếu học sinh còn quá nhỏ, ở lại trong nước học có lẽ sẽ tốt hơn."], ["Câu 14 · Bài mẫu tham khảo", "每个人在生活中都会遇到烦恼，我也不例外。当我感到烦恼的时候，我通常会选择几种方法来调节心情。首先，我会找好朋友聊天，把心里的不愉快说出来，这样心情会轻松很多。如果不想说话，我会选择听音乐或者看电影，让自己沉浸在另一个世界里，暂时忘记烦恼。有时候，我也会去公园跑步或者散步，运动可以让我感到快乐。如果烦恼是因为工作或学习压力太大，我会选择休息一下，睡个好觉。总之，面对烦恼时，我们要学会调节自己，不要让负面情绪影响我们的生活。", "Ai trong cuộc sống cũng sẽ gặp phải phiền muộn, tôi cũng không ngoại lệ. Khi cảm thấy phiền não, tôi thường chọn vài cách để điều chỉnh tâm trạng. Đầu tiên, tôi sẽ tìm bạn thân để trò chuyện, nói ra những điều không vui trong lòng, như vậy tâm trạng sẽ nhẹ nhàng hơn nhiều. Nếu không muốn nói chuyện, tôi sẽ chọn nghe nhạc hoặc xem phim, để bản thân chìm đắm vào một thế giới khác và tạm thời quên đi phiền muộn. Đôi khi, tôi cũng đi chạy bộ hoặc đi dạo ở công viên, vận động có thể khiến tôi cảm thấy vui vẻ. Nếu phiền não là do áp lực công việc hoặc học tập quá lớn, tôi sẽ chọn nghỉ ngơi một chút, ngủ một giấc thật ngon. Tóm lại, khi đối mặt với phiền não, chúng ta phải học cách tự điều chỉnh, đừng để cảm xúc tiêu cực ảnh hưởng đến cuộc sống của mình."]]};</script>
