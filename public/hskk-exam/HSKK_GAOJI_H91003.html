<script>window.EXAM={"level": 6, "subj": "HSKK（高级）", "title": "HSKK（高级）", "sub": "H91003", "examName": "HSKK Cao cấp · H91003", "file": "HSKK_GAOJI_H91003", "isNew": true, "total": "26 phút", "prep": "10 phút", "desc": "Đề thi thật HSKK cao cấp H91003: 3 phần, 6 câu, chạy theo file nghe gốc của Hanban.", "struct": [["1", "听后复述 — Nghe rồi thuật lại", "3", "khoảng 2分钟 / câu"], ["2", "朗读 — Đọc thành tiếng", "1", "2分钟"], ["3", "回答问题 — Trả lời câu hỏi", "2", "2.5分钟 / câu"]], "parts": [{"cn": "第一部分", "title": "第1-3题：听后复述", "time": "（每题2分钟左右）", "note": "Nghe một đoạn văn, sau tiếng “嘀” hãy thuật lại nội dung bằng lời của mình — càng đủ ý càng tốt."}, {"cn": "第二部分", "title": "第4题：朗读", "time": "（2分钟）", "read": "人们一般会有一种投机的心理，我们把它称为“中彩票”的心理，这种渴望一夜暴富的心理，对成功是没有好处的。我们生活在一个充满竞争的社会中，要想在竞争中立于不败之地，必须有真才实学，而不是靠投机取巧。做演员的“台上一分钟，台下十年功”，做教师的“要给学生一碗水，自己就需要有一桶水”。也就是说，做演员的，如果没有扎实的基本功，那么你就无法给观众带来精彩的表演；做教师的，如果没有长期的积累，那么你就无法赢得学生的尊重。我们都渴望成功，可是，成功其实是没有什么特别方法的。千里之行，始于足下。要想成功，就需要平时一点一滴的积累；要想成功，就需要不断地努力。", "also": 2, "draft": true, "note": "Trước phần 2 có 10 phút chuẩn bị chung cho phần 2 và phần 3. Sau tiếng “嘀” hãy đọc to, rõ đoạn văn."}, {"cn": "第三部分", "title": "第5-6题：回答问题", "time": "（每题2.5分钟）", "draft": true, "draftOf": 1, "ask": [[5, "如果现在你有一个月的假期，你打算做什么？", "2.5分钟"], [6, "你认为小孩子该不该有零花钱？为什么？", "2.5分钟"]], "note": "Trả lời từng câu hỏi: nêu quan điểm → lý do → ví dụ → kết luận."}], "windows": [{"k": "intro", "hint": "你好！你叫什么名字？— Trả lời họ tên."}, {"k": "intro", "hint": "你是哪国人？— Trả lời quốc tịch."}, {"k": "intro", "hint": "你的序号是多少？— Đọc số báo danh."}, {"k": "ans", "q": 1, "part": 0, "hint": "Thuật lại đoạn vừa nghe: ai? chuyện gì? kết quả / ý nghĩa?"}, {"k": "ans", "q": 2, "part": 0, "hint": "Thuật lại đoạn vừa nghe: ai? chuyện gì? kết quả / ý nghĩa?"}, {"k": "ans", "q": 3, "part": 0, "hint": "Thuật lại đoạn vừa nghe: ai? chuyện gì? kết quả / ý nghĩa?"}, {"k": "prep", "part": 1, "hint": "10 phút: đọc thầm đoạn văn câu 4 (chú ý chữ khó, ngắt câu) và ghi dàn ý cho câu 5–6."}, {"k": "ans", "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 35.22}, {"t": "win", "d": 10}, {"t": "play", "a": 35.22, "b": 37.35}, {"t": "win", "d": 5}, {"t": "play", "a": 37.35, "b": 39.92}, {"t": "win", "d": 10}, {"t": "play", "a": 39.92, "b": 114.78}, {"t": "win", "d": 110}, {"t": "play", "a": 114.78, "b": 176.16}, {"t": "win", "d": 110}, {"t": "play", "a": 176.16, "b": 235.11}, {"t": "win", "d": 110}, {"t": "play", "a": 235.11, "b": 258.64}, {"t": "win", "d": 602}, {"t": "play", "a": 258.64, "b": 262.7}, {"t": "win", "d": 110}, {"t": "play", "a": 262.7, "b": 278.1}, {"t": "win", "d": 140}, {"t": "play", "a": 278.1, "b": 293.83}, {"t": "win", "d": 140}, {"t": "play", "a": 293.83, "b": 329.98}], "audio": "audio/hskkg_H91003.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "如果现在你有一个月的假期，你打算做什么？", "6": "你认为小孩子该不该有零花钱？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 人们一般会有一种投机的心理，我们把它称为“中彩票”的心理，这种渴望一夜暴富的心理，对成功是没有好处的。我们生活在一个充满…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 如果现在你有一个月的假期，你打算做什么？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 你认为小孩子该不该有零花钱？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "一天，老鼠们聚在一起开会，他们在讨论怎样才能不被猫抓住。有一只老鼠想了一个好办法：在猫的脖子上挂一个铜铃。这样，只要猫一走过来，它们就会听到铜铃的声音。老鼠们都兴高采烈地喊道：“这个主意太好了！”但另一只老鼠提出一个问题：“怎样才能把铜铃挂到猫的脖子上呢？”大家都沉默了。一只年老的老鼠叹了口气，说道：“看来，没有可操作性的办法，不是好办法。”", "Ý chính: Chuột họp bàn cách không bị mèo bắt → Một con chuột đề nghị đeo chuông đồng vào cổ mèo → Con chuột khác hỏi làm sao để đeo chuông lên → Lũ chuột đều im lặng → Biện pháp không có tính khả thi không phải là biện pháp tốt"], ["Câu 2 · Lời đoạn nghe", "当孩子讲故事时，父母应该善于做孩子的听众。不管故事有多么老，你都要表现出好像是第一次听到的那种新鲜感，甚至可以一边听，一边好奇地发问。这样的小互动，不仅能引起孩子的兴趣，更能让孩子获得阅读的成就感。如果能经常这样的话，父母会惊奇地发现，孩子已经喜欢上了阅读。", "Ý chính: Cha mẹ nên làm thính giả của con. → Thể hiện sự tươi mới và tò mò đặt câu hỏi. → Khơi gợi hứng thú, có được cảm giác thành tựu. → Khiến trẻ yêu thích việc đọc sách."], ["Câu 3 · Lời đoạn nghe", "30岁以前就尝到失业的滋味，当然是一件不幸的事，但不一定是坏事。30岁之前就过早地固定在一个职业上，一辈子做相同的工作，也许才是最大的不幸。失业，也许让你想起埋藏很久的梦想，也许会激发起连你自己都从未发现的潜力。也许你本来就没什么梦想，这时候也会逼着自己去做梦。", "Ý chính: Thất nghiệp trước 30 tuổi là bất hạnh nhưng không phải chuyện xấu → Cố định nghề nghiệp quá sớm có lẽ là bất hạnh lớn nhất → Thất nghiệp có thể đánh thức giấc mơ chôn vùi lâu ngày → Thất nghiệp có thể khơi dậy tiềm năng chưa từng thấy → Thất nghiệp sẽ ép bản thân phải có ước mơ"], ["Câu 4 · 朗读 · Đoạn văn", "人们一般会有一种投机的心理，我们把它称为“中彩票”的心理，这种渴望一夜暴富的心理，对成功是没有好处的。我们生活在一个充满竞争的社会中，要想在竞争中立于不败之地，必须有真才实学，而不是靠投机取巧。做演员的“台上一分钟，台下十年功”，做教师的“要给学生一碗水，自己就需要有一桶水”。也就是说，做演员的，如果没有扎实的基本功，那么你就无法给观众带来精彩的表演；做教师的，如果没有长期的积累，那么你就无法赢得学生的尊重。我们都渴望成功，可是，成功其实是没有什么特别方法的。千里之行，始于足下。要想成功，就需要平时一点一滴的积累；要想成功，就需要不断地努力。", ""], ["Câu 5 · Bài mẫu tham khảo", "如果现在我有一个月的假期，我会把它安排得充实而有意义。<br>第一周，我想好好休息一下。平时工作太忙，常常睡不够，所以我要先把觉补回来。然后回老家陪陪父母，帮他们做做家务，带他们去附近走走。<br>第二周和第三周，我打算去中国旅行。我想去云南，看看那里的少数民族风情和美丽的自然风光。一路上，我还可以和中国人聊天，练习汉语，了解当地的文化。<br>最后一周，我想学一样新东西，比如做菜或者摄影，再读几本一直想读却没时间读的书，为回去工作做好准备。<br>我觉得，假期不应该只是睡觉、玩手机，而应该让自己休息好、长见识、有收获。这样一个月以后，我就能以更好的状态回到工作中。", "Nếu bây giờ tôi có một tháng nghỉ phép, tôi sẽ sắp xếp nó một cách phong phú và ý nghĩa.\nTuần đầu tiên, tôi muốn nghỉ ngơi thật tốt. Ngày thường công việc quá bận rộn, thường xuyên ngủ không đủ giấc, thế nên trước tiên tôi phải bù lại giấc ngủ cái đã. Sau đó về quê thăm hỏi bố mẹ, giúp họ làm một số việc nhà, đưa họ đi dạo quanh đây.\nTuần thứ hai và tuần thứ ba, tôi dự định đi du lịch Trung Quốc. Tôi muốn đến Vân Nam, ngắm nhìn phong tình dân tộc thiểu số và phong cảnh tự nhiên tươi đẹp nơi đó. Trên suốt chặng đường, tôi còn có thể trò chuyện với người Trung Quốc, luyện tập tiếng Trung, tìm hiểu văn hóa bản địa.\nTuần cuối cùng, tôi muốn học một thứ gì đó mới, ví dụ như nấu ăn hoặc nhiếp ảnh, tiện thể đọc vài cuốn sách mà vẫn luôn muốn đọc nhưng không có thời gian đọc, chuẩn bị sẵn sàng cho việc quay lại làm việc.\nTôi thấy rằng, kỳ nghỉ không nên chỉ là ngủ nghỉ, chơi điện thoại, mà nên khiến bản thân được nghỉ ngơi tốt, mở mang tầm mắt, thu hoạch được nhiều điều. Cứ như vậy một tháng sau, tôi có thể quay trở lại công việc với trạng thái tốt hơn."], ["Câu 6 · Bài mẫu tham khảo", "我认为小孩子应该有零花钱，但父母要给得适量，并且教会孩子怎么用。<br>首先，零花钱能让孩子学会管理钱。孩子有了自己的零花钱，就要自己决定买什么、不买什么，慢慢就会知道钱不是用不完的，要合理安排。这对孩子以后的生活很有帮助。<br>其次，零花钱能培养孩子的责任感。如果他把一个月的零花钱很快就花光了，就要承担后果，下次就会更加小心。<br>当然，如果零花钱给得太多，又没有引导，孩子可能会乱花钱，甚至和同学攀比，养成不好的习惯。<br>所以我建议，父母可以根据孩子的年龄，每周或者每月给一定数量的零花钱，让孩子记账，定期和孩子一起看看钱都花在了哪里。<br>总之，零花钱本身不是问题，关键是父母要借这个机会，教孩子学会正确对待金钱。", "Tôi nghĩ trẻ em nên có tiền tiêu vặt, nhưng bố mẹ phải cho với số lượng vừa phải và dạy con cách sử dụng.\nTrước hết, tiền tiêu vặt có thể giúp trẻ học cách quản lý tiền bạc. Khi trẻ có tiền tiêu vặt của riêng mình, chúng phải tự quyết định nên mua gì và không nên mua gì, dần dần chúng sẽ hiểu rằng tiền không phải là tiêu mãi không hết và phải biết sắp xếp hợp lý. Điều này rất có ích cho cuộc sống sau này của trẻ.\nThứ hai, tiền tiêu vặt có thể bồi dưỡng tinh thần trách nhiệm cho trẻ. Nếu trẻ tiêu hết veo tiền tiêu vặt của một tháng trong thời gian ngắn, chúng sẽ phải gánh chịu hậu quả và lần sau sẽ cẩn thận hơn.\nĐương nhiên, nếu cho quá nhiều tiền tiêu vặt mà lại không có sự định hướng, trẻ có thể tiêu tiền bừa bãi, thậm chí so bì với bạn bè và hình thành những thói quen xấu.\nVì vậy, tôi đề xuất bố mẹ có thể dựa vào độ tuổi của trẻ để cho một khoản tiền tiêu vặt cố định theo tuần hoặc theo tháng, hướng dẫn con ghi chép sổ sách và định kỳ cùng con xem lại tiền đã tiêu vào những việc gì.\nTóm lại, bản thân tiền tiêu vặt không phải là vấn đề, quan trọng là bố mẹ phải mượn cơ hội này để dạy con học cách đối xử đúng đắn với tiền bạc."]]};</script>
