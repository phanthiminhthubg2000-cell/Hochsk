, {"k": "ans", "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.65}, {"t": "win", "d": 10}, {"t": "play", "a": 33.65, "b": 35.96}, {"t": "win", "d": 5}, {"t": "play", "a": 35.96, "b": 39.13}, {"t": "win", "d": 10}, {"t": "play", "a": 39.13, "b": 95.22}, {"t": "win", "d": 64}, {"t": "play", "a": 95.22, "b": 150.08}, {"t": "win", "d": 67}, {"t": "play", "a": 150.08, "b": 202.84}, {"t": "win", "d": 69}, {"t": "play", "a": 202.84, "b": 222.9}, {"t": "win", "d": 600}, {"t": "play", "a": 222.9, "b": 226.26}, {"t": "win", "d": 110}, {"t": "play", "a": 226.26, "b": 239.61}, {"t": "win", "d": 140}, {"t": "play", "a": 239.61, "b": 253.09}, {"t": "win", "d": 140}, {"t": "play", "a": 253.09, "b": 287.56}], "audio": "audio/hskkg_H91002.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "你对自己的哪些方面感到满意？请简单介绍一下。", "6": "中国有句话叫“知足常乐”，你怎么看？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 小张在公司做白领，觉得自己的能力没有得到上级的认可，他经常想：如果有一天能见到老总，有机会展示一下自己的才干就好了。小张…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 你对自己的哪些方面感到满意？请简单介绍一下。", "images": []}, "6": {"type": "answer", "question": "Câu 6: 中国有句话叫“知足常乐”，你怎么看？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "有个国王没有儿子，他打算从全国选一个男孩做王子，于是给每个男孩一颗种子，看谁种的花最漂亮，就选谁做王子。到了选王子的那天，几乎所有的小孩都捧着鲜艳漂亮的花来了，只有一个小孩捧着一个空花盆伤心落泪，他没有种出花来。但是，他被选中了。原来，所有的种子都是被煮过的。", "Ý chính: Vua phát hạt giống chọn một bé trai làm hoàng tử → Xem ai trồng hoa đẹp nhất thì sẽ chọn người đó → Hôm tuyển chọn hầu hết mọi người đều ôm hoa rực rỡ → Chỉ có một cậu bé ôm chậu hoa trống rỗng khóc → Cậu bé ôm chậu hoa trống cuối cùng lại được chọn → Thì ra tất cả hạt giống đều đã bị luộc chín"], ["Câu 2 · Lời đoạn nghe", "孤独是每个人都曾经有过的心理体验，它并不可怕，重要的是你用什么方式去对待它。要战胜孤独，就要学会为别人着想，只要花一些时间和精力去关心、关注别人，相信你会，在良好的人际关系中体验到一种自我价值感，而不是孤独感。“去点燃温暖别人的火，它也会温暖你自己。”", "Ý chính: Cô đơn là trải nghiệm tâm lý ai cũng từng trải qua → Cô đơn không đáng sợ, quan trọng là cách đối diện với nó → Muốn chiến thắng sự cô đơn phải học cách nghĩ cho người khác → Dành thời gian và tâm sức quan tâm đến người khác → Cảm nhận giá trị bản thân trong mối quan hệ tốt đẹp → Sưởi ấm người khác cũng chính là sưởi ấm chính mình"], ["Câu 3 · Lời đoạn nghe", "虽然我们知道一些优秀的电视节目对人有教育指导作用，但是在对人智力发展的贡献上，看电视是无论如何也不能代替阅读的。因为人在看电视和读书时，参与活动的心理机制是不同的。电视画面给人提供了丰富多彩的形象，但留给人想象的空间就小了，人只能被动接受信息。读书则相反。", "Ý chính: Xem TV không thể thay thế việc đọc sách về mặt đóng góp trí tuệ → Cơ chế tâm lý khi xem TV và đọc sách là khác nhau → Hình ảnh TV phong phú nhưng không gian tưởng tượng nhỏ → Xem TV khiến con người tiếp nhận thông tin thụ động → Đọc sách thì hoàn toàn ngược lại với xem TV"], ["Câu 4 · 朗读 · Đoạn văn", "小张在公司做白领，觉得自己的能力没有得到上级的认可，他经常想：如果有一天能见到老总，有机会展示一下自己的才干就好了。小张的同事小刘，也有同样的想法。但他更进一步，去打听老总上下班的时间，算好老总大概在何时候进电梯，他也在这个时候去坐电梯，希望能遇到老总，有机会可以打个招呼。他们的同事小李更进一步，他详细了解老总的奋斗经历、毕业院校、人际风格、关心的问题等，精心设计了几句简单却有分量的开场白，在算好的时间去坐电梯，跟老总打过几次招呼后，终于有一天跟老总谈了一次，不久就争取到了更好的职位。愚者失机会，智者善抓机会，成功者创造机会。机会只给准备好的人，这准备二字，并非说说而已。", ""], ["Câu 5 · Bài mẫu tham khảo", "我对自己比较满意的地方，主要有以下几个方面。<br>第一，我的性格比较乐观。遇到不顺利的事情，我很少抱怨，总是相信办法总比困难多。因为性格开朗，我的人缘也不错，身边有很多好朋友。<br>第二，我做事认真负责。不管是工作还是学习，只要是答应别人的事情，我都会尽力做好。领导和同事都说，把工作交给我，他们很放心。<br>第三，我很爱学习。工作以后，我还坚持学汉语，现在已经能用汉语和中国客户谈生意了。我觉得，能一直保持学习的习惯，是我最自豪的地方。<br>当然，我也有不满意的地方，比如有时候太急躁，做决定不够冷静。我正在努力改正。<br>总之，我觉得每个人都应该学会欣赏自己，同时也要不断完善自己。", "Những điểm khiến tôi khá hài lòng về bản thân chủ yếu gồm các mặt sau đây.\nThứ nhất, tính cách của tôi khá lạc quan. Khi gặp chuyện không thuận lợi, tôi hiếm khi phàn nàn, luôn tin rằng cách giải quyết bao giờ cũng nhiều hơn khó khăn. Vì tính cách cởi mở nên các mối quan hệ xã hội của tôi cũng khá tốt, xung quanh có rất nhiều bạn tốt.\nThứ hai, tôi làm việc rất cẩn thận và có trách nhiệm. Bất kể là công việc hay học tập, hễ là việc đã hứa với người khác, tôi đều cố gắng làm thật tốt. Lãnh đạo và đồng nghiệp đều nói rằng giao việc cho tôi, họ rất yên tâm.\nThứ thứ ba, tôi rất thích học hỏi. Sau khi đi làm, tôi vẫn kiên trì học tiếng Trung, hiện tại đã có thể dùng tiếng Trung để bàn chuyện làm ăn với khách hàng Trung Quốc. Tôi cảm thấy việc có thể duy trì thói quen học tập suốt là điều khiến tôi tự hào nhất.\nTất nhiên, tôi cũng có những điểm chưa vừa ý, ví dụ như đôi khi quá nôn nóng, đưa ra quyết định chưa đủ bình tĩnh. Tôi đang nỗ lực sửa đổi.\nTóm lại, tôi cảm thấy mỗi người đều nên học cách trân trọng bản thân, đồng thời cũng phải không ngừng hoàn thiện chính mình."], ["Câu 6 · Bài mẫu tham khảo", "“知足常乐”的意思是，一个人如果懂得满足，就会经常感到快乐。我基本同意这句话。<br>首先，知足能让我们更容易感到幸福。现在很多人总是不满足，有了一个好工作，还想要更好的；有了房子，还想要更大的。他们一直在追求，却总是觉得不快乐。如果我们能珍惜已经拥有的，比如健康的身体、爱我们的家人，就会发现生活其实已经很美好了。<br>其次，知足能减少烦恼。很多烦恼都来自和别人比较。懂得知足的人不会盲目攀比，心态更平和。<br>但是，知足并不等于不思进取。在学习和工作上，我们还是应该有目标，不断提高自己。<br>所以我认为，在物质上我们可以知足一点，但在精神上、在自我成长方面，要永不满足。这样才能既快乐又有进步。", "Ý nghĩa của câu \"Tri túc thường lạc\" (Biết đủ là hạnh phúc) là, nếu một người biết đủ, họ sẽ thường xuyên cảm thấy vui vẻ. Tôi hoàn toàn đồng tình với câu nói này.\nĐầu tiên, biết đủ có thể giúp chúng ta dễ cảm thấy hạnh phúc hơn. Hiện nay, rất nhiều người luôn không biết đủ, có công việc tốt rồi lại muốn công việc tốt hơn; có nhà rồi lại muốn nhà to hơn. Họ vẫn luôn theo đuổi, nhưng lại luôn cảm thấy không vui. Nếu chúng ta có thể trân trọng những gì mình đang có, ví dụ như cơ thể khỏe mạnh, gia đình yêu thương chúng ta, thì sẽ phát hiện ra cuộc sống thực ra đã rất tốt đẹp rồi.\nThứ hai, biết đủ có thể giảm bớt phiền muộn. Rất nhiều phiền muộn đều xuất phát từ việc so sánh với người khác. Người biết đủ sẽ không so bì một cách mù quáng, tâm lý sẽ bình thản hơn.\nTuy nhiên, biết đủ không có nghĩa là không có chí tiến thủ. Trong học tập và công việc, chúng ta vẫn nên có mục tiêu và không ngừng nâng cao bản thân.\nVì vậy tôi cho rằng, về mặt vật chất chúng ta có thể biết đủ một chút, nhưng về mặt tinh thần, về mặt phát triển bản thân thì phải không bao giờ thỏa mãn. Như vậy mới vừa vui vẻ lại vừa có tiến bộ."]]};</script>
