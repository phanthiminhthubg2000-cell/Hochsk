吃饭，举起酒杯，祝贺彼此毕业，也祝大家以后工作顺利。","Tranh ❶ học nhóm trên lớp → ❷ lễ tốt nghiệp → ❸ nâng ly chúc mừng. Dùng: 常常、互相帮助、很快就……了、毕业、祝贺."],["Câu 4 · 七天假怎么安排？","如果给我七天假，我打算这样安排：前两天，我会在家好好休息，睡个懒觉，看看电影。然后，我想和朋友一起去大理旅游三天，看看那里的风景，尝尝当地的小吃。最后两天，我会回老家看看父母，陪他们聊聊天儿。这样安排既能放松，又能陪家人，我觉得很好。","Dùng trình tự: 首先/前两天 → 然后 → 最后; kết bằng 既……又……."],["Câu 5 · 怎么适应新公司？","刚到一个新公司，我会做三件事。首先，我会主动认识同事，向他们介绍自己，有问题就虚心请教。其次，我会尽快了解公司的规定和工作流程，按时完成自己的工作。最后，我会多参加公司的活动，这样能更快地融入集体。我相信，只要积极努力，很快就能适应新环境。","首先……其次……最后……; kết: 只要……就……."]],"examName":"Đề mẫu","file":"HSK4_KHAU_NGU","qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat","question":"Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"3":{"type":"picture","question":"Câu 3: 看图说话 · Kể chuyện theo tranh","images":["img/hskk4_1.jpg","img/hskk4_2.jpg","img/hskk4_3.jpg"]},"4":{"type":"answer","question":"Câu 4: 如果给你七天假，你打算怎么安排？","images":[]},"5":{"type":"answer","question":"Câu 5: 刚到一个新公司工作时，为了使自己更快适应环境，你会怎么做？","images":[]}},"timeline":[{"t":"play","a":0,"b":64.41},{"t":"win","d":10},{"t":"play","a":64.41,"b":66.78},{"t":"win","d":10},{"t":"play","a":66.78,"b":71.47},{"t":"win","d":10},{"t":"play","a":71.47,"b":106.8},{"t":"win","d":40},{"t":"play","a":106.8,"b":133.86},{"t":"win","d":40},{"t":"play","a":133.86,"b":154.06},{"t":"win","d":180},{"t":"play","a":154.06,"b":160.19},{"t":"win","d":120},{"t":"play","a":160.19,"b":174.67},{"t":"win","d":421},{"t":"play","a":174.67,"b":180.69},{"t":"win","d":120},{"t":"play","a":180.69,"b":186.37},{"t":"win","d":120},{"t":"play","a":186.37,"b":191.26}],"audio":"audio/hskk4.mp3"};</script>
