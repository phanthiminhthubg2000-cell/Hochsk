"Câu 1 · Lời đoạn nghe", "刘先生和儿子去火车站，进去以后，离开车只有五分钟了。他们跑了起来，刘先生跑得很快，先上了火车。他看见儿子还在车下面，就要下车。列车员说：“先生，不能下车，车就要开了，来不及了。”刘先生着急地说：“不行，是我儿子要坐车，我是来送他的。”", "Ý chính: Ông Lưu và con trai đi ga tàu, chỉ còn 5 phút là tàu chạy. → Ông Lưu chạy rất nhanh, lên tàu trước. → Ông phát hiện con trai vẫn ở dưới tàu, định xuống tàu. → Nhân viên đoàn tàu ngăn lại, nói tàu sắp chạy rồi. → Ông Lưu lo lắng nói ông đến để tiễn con trai."], ["Câu 2 · Lời đoạn nghe", "有一个班，大部分学生毕业前就找到了工作。最后，只剩下一个学生还没有找到工作。这时候，有个大公司来招聘销售代表，年薪三十万。于是，剩下的这名学生得到了最好的工作。他不是最优秀的，但其他人都已经没有了选择的机会。我们的一生也许可以更成功，但有时候早早地做出选择，会使我们失去更好的发展机会。", "Ý chính: Trước khi tốt nghiệp hầu hết học sinh tìm được việc, chỉ còn một người chưa tìm thấy. → Có công ty lớn tuyển đại diện bán hàng lương năm 300 nghìn. → Học sinh còn lại nhận được công việc tốt nhất. → Cậu ấy không xuất sắc nhất, nhưng người khác không còn cơ hội. → Đưa ra lựa chọn quá sớm sẽ khiến chúng ta mất cơ hội tốt hơn."], ["Câu 3 · Lời đoạn nghe", "冬天过去了，春天来到了。由于气温变化等原因，人们经常会觉得身体很疲劳，想睡觉。这就是我们常说的“春困”。春困虽然不是病，但是也会影响人们的学习和工作。不过，如果饮食合适，春困是可以减轻或者消失的。比如说，常吃水果、蔬菜、喝果汁，少吃油多的食物。", "Ý chính: Thay đổi nhiệt độ khiến cơ thể mệt mỏi muốn buồn ngủ chính là buồn ngủ mùa xuân. → Buồn ngủ mùa xuân không phải là bệnh nhưng ảnh hưởng học tập và công việc. → Thông qua ăn uống hợp lý có thể giảm hoặc xóa bỏ buồn ngủ mùa xuân. → Khuyên nên ăn nhiều trái cây rau củ uống nước ép, ít ăn đồ dầu mỡ."], ["Câu 4 · 朗读 · Đoạn văn", "微笑是对生活的一种态度，跟贫富、地位、处境没有必然的联系。一个富翁可能整天烦恼忧愁，而一个穷人却可能心情舒畅。只有心里有阳光的人，才能感受到现实的阳光，如果连自己都苦着脸，那生活如何美好？生活始终是一面镜子，当我们哭泣时，生活在哭泣；当我们微笑时，生活也在微笑。微笑是对他人的尊重，同时也是对生活的尊重。微笑是有“回报”的，人际关系就像物理学上所说的力的平衡，你怎样对别人，别人就会怎样对你，你对别人的微笑越多，别人对你的微笑也会越多。微笑是朋友间最好的语言，一个自然流露的微笑，胜过千言万语，无论是初次见面，还是相识已久，微笑都能拉近人与人之间的距离，令彼此倍感温暖。", ""], ["Câu 5 · Bài mẫu tham khảo", "我认为理想的生活状态，就是一种平衡的状态。<br>首先，要有一份自己喜欢的工作。工作不一定要让我很有钱，但是我要觉得它有意义，每天上班都有动力。同时，工作不能太忙，要有足够的时间休息。<br>其次，身体健康，家人平平安安地在身边。我觉得健康是一切的基础，没有健康，其他什么都没有意义。下班以后能和家人一起吃晚饭、聊聊天，周末带父母出去走走，对我来说就是最大的幸福。<br>第三，有时间做自己喜欢的事情。比如读读书、学学画画，每年去一两个没去过的地方旅行。生活不只有工作，还要有自己的爱好，这样人才会充满活力。<br>总的来说，我理想中的生活并不需要大富大贵，而是简单、自由、有爱。我相信只要努力，每个人都能过上自己理想的生活。", "Tôi cho rằng trạng thái cuộc sống lý tưởng chính là một trạng thái cân bằng.\nTrước hết, phải có một công việc mà mình yêu thích. Công việc không nhất thiết phải khiến tôi rất giàu có, nhưng tôi phải cảm thấy nó có ý nghĩa, mỗi ngày đi làm đều có động lực. Đồng thời, công việc không được quá bận rộn, phải có đủ thời gian để nghỉ ngơi.\nThứ hai, cơ thể khỏe mạnh, người nhà bình an ở bên cạnh. Tôi cảm thấy sức khỏe là nền tảng của mọi thứ, không có sức khỏe thì những thứ khác đều vô nghĩa. Sau khi tan làm có thể cùng người nhà ăn tối, trò chuyện, cuối tuần đưa bố mẹ đi đây đi đó, đối với tôi chính là hạnh phúc lớn nhất.\nThứ ba, có thời gian làm những việc mình thích. Ví dụ như đọc sách, học vẽ tranh, mỗi năm đi du lịch một, hai nơi chưa từng đến. Cuộc sống không chỉ có công việc, mà còn phải có sở thích riêng của mình, như vậy con người ta mới tràn đầy sức sống.\nNói chung, cuộc sống lý tưởng trong tưởng tượng của tôi không cần phải giàu sang phú quý, mà là sự đơn giản, tự do và tràn ngập tình yêu thương. Tôi tin rằng chỉ cần nỗ lực, mỗi người đều có thể có được cuộc sống lý tưởng của chính mình."], ["Câu 6 · Bài mẫu tham khảo", "我认为辩论会让双方更一致还是更对立，关键在于辩论的态度和目的。<br>如果辩论的目的是把问题弄清楚，那么辩论是很有好处的。在辩论中，双方都会把自己的理由说出来，这样我们就能了解对方为什么这么想，也能发现自己观点中的不足。很多时候，经过辩论，双方会找到一个大家都能接受的方案。正所谓“真理越辩越明”。<br>但是，如果辩论只是为了赢，那结果就不一样了。有的人在辩论时不听对方说什么，只想着怎么反驳，甚至攻击对方，这样的辩论只会让矛盾越来越大，让双方更加对立。<br>所以，我觉得在辩论的时候，要对事不对人，尊重对方，认真听对方的理由。只要大家都以解决问题为目的，辩论就能促进理解，而不是制造矛盾。", "Tôi cho rằng việc tranh luận khiến hai bên đồng thuận hơn hay đối lập hơn, mấu chốt nằm ở thái độ và mục đích tranh luận.\n\nNếu mục đích tranh luận là để làm rõ vấn đề, thì tranh luận sẽ mang lại rất nhiều lợi ích. Trong tranh luận, cả hai bên đều sẽ trình bày lý do của mình, như vậy chúng ta có thể hiểu được tại sao đối phương lại suy nghĩ như vậy, đồng thời cũng phát hiện ra những điểm thiếu sót trong quan điểm của chính mình. Rất nhiều lần, sau khi tranh luận, hai bên sẽ tìm ra một phương án mà mọi người đều có thể chấp nhận được. Đúng như câu \"càng tranh luận chân lý càng sáng tỏ\".\n\nTuy nhiên, nếu tranh luận chỉ vì để thắng, thì kết quả sẽ khác. Có những người khi tranh luận không nghe đối phương nói gì, chỉ nghĩ xem làm thế nào để phản bác, thậm chí tấn công đối phương, kiểu tranh luận như thế này chỉ khiến cho mâu thuẫn ngày càng lớn hơn, khiến hai bên càng đối lập nhau hơn.\n\nVì vậy, tôi cảm thấy khi tranh luận, cần phải nhắm vào sự việc chứ không nhắm vào con người, tôn trọng đối phương và lắng nghe cẩn thận lý do của đối phương. Chỉ cần tất cả mọi người đều lấy việc giải quyết vấn đề làm mục đích, thì tranh luận có thể thúc đẩy sự thấu hiểu chứ không phải tạo ra mâu thuẫn."]]};</script>
