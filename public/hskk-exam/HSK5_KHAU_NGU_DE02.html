<script>window.EXAM={"level":5,"title":"HSK（五级）","total":"23 phút","prep":"10 phút","desc":"Đề luyện số 02 HSK 5 khẩu ngữ theo dạng mới (新版HSK口语): 3 phần, 5 câu.","struct":[["1","听后复述 — Nghe rồi thuật lại","2","1.5 phút / câu"],["2","看图说话 — Nhìn tranh kể chuyện","1","2 phút (chuẩn bị 3 phút)"],["3","回答问题 — Trả lời câu hỏi","2","2.5 phút / câu (chuẩn bị 7 phút)"]],"parts":[{"cn":"第一部分","title":"第1-2题：听后复述","time":"（每题1.5分钟）","note":"Nghe một đoạn văn, sau tiếng “嘀” hãy thuật lại nội dung bằng lời của mình."},{"cn":"第二部分","title":"第3题：看图说话","time":"（2分钟）","imgs":["img/hskk5de02_1.jpg","img/hskk5de02_2.jpg","img/hskk5de02_3.jpg"],"story":true,"qs":[3,3,3],"note":"Ba bức tranh ❶❷❸ kể một câu chuyện. Hãy kể lại theo thứ tự.","draft":true},{"cn":"第三部分","title":"第4-5题：回答问题","time":"","draft":true,"ask":[[4,"如果现在具备一切条件，你最想做的是什么？请简单说说。","2.5分钟"],[5,"有人认为世界和平是有希望的，有人认为世界和平是不可能实现的。你怎么看？","2.5分钟"]]}],"windows":[{"k":"intro","hint":"你好！你叫什么名字？— Trả lời họ tên."},{"k":"intro","hint":"你是哪国人？— Trả lời quốc tịch."},{"k":"intro","hint":"你的序号是多少？— Đọc số báo danh."},{"k":"ans","q":1,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"ans","q":2,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"prep","part":1,"hint":"Xem các tranh, nghĩ cốt truyện: ai? ở đâu? chuyện gì xảy ra? kết quả?"},{"k":"ans","q":3,"part":1,"hint":"Kể câu chuyện theo các tranh."},{"k":"prep","part":2,"hint":"Đọc 2 câu hỏi, ghi dàn ý: quan điểm → lý do → ví dụ → kết luận."},{"k":"ans","q":4,"part":2,"hint":""},{"k":"ans","q":5,"part":2,"hint":""}],"answerQs":[1,2,3,4,5],"qText":{"1":"听后复述","2":"听后复述","3":"看图说话","4":"如果现在具备一切条件，你最想做的是什么？请简单说说。","5":"有人认为世界和平是有希望的，有人认为世界和平是不可能实现的。你怎么看？"},"rubric":["Phát âm & ngữ điệu tự nhiên","Thuật lại đủ ý chính (phần 1)","Kể chuyện theo tranh mạch lạc, có mở – thân – kết","Lập luận rõ ràng, có ví dụ (phần 3)","Từ vựng – ngữ pháp đa dạng, chính xác","Nói trôi chảy, dùng hết thời gian"],"samples":[["Câu 1 · Lời thoại đoạn nghe","从前有一个和尚跟一个屠夫是好朋友。和尚天天早上要起来念经，而屠夫天天要起来宰杀牲畜。为了不耽误各自早上的工作，他们约定早上轮流互相叫对方起床。多年以后，和尚与屠夫相继去世了。屠夫死后去了天堂，而和尚却下了地狱。这是为什么呢？因为屠夫天天做善事，叫和尚起来念经；而相反地，和尚却天天叫屠夫起来杀生。","Ý chính cần thuật lại: nhà sư và đồ tể là bạn → hẹn nhau gọi dậy mỗi sáng → sau khi chết đồ tể lên thiên đường, nhà sư xuống địa ngục → vì đồ tể gọi sư dậy tụng kinh (việc thiện), còn sư gọi đồ tể dậy sát sinh."],["Câu 2 · Lời thoại đoạn nghe","一辆公交车在行驶当中，一名女乘客突然晕倒，在车上数十名乘客的配合下，司机直接把公交车开到了最近的一家医院门口，6名乘客把病人抬到急诊室，并确认病情无碍之后才离开。这位乘客是由于未食用早餐而晕倒在车上的。医生提醒减肥人士，要采用科学健康的减肥方法，不吃早餐不仅会导致低血糖，甚至还可能给身体带来更严重的不良后果。","Ý chính: hành khách nữ ngất trên xe buýt → tài xế chở thẳng đến bệnh viện, 6 hành khách khiêng vào cấp cứu → nguyên nhân: nhịn ăn sáng để giảm cân → lời khuyên của bác sĩ: giảm cân khoa học, bỏ bữa sáng gây hạ đường huyết."],["Câu 3 · 看图说话（gợi ý）","小李是一个年轻的白领。有一天早上，她出门的时候，看见天气特别好，阳光明媚，就觉得今天不会下雨，于是把雨伞放在了家里。没想到，下午天气突然变了，下班的时候外面下起了大雨。小李站在公司门口，看着外面的大雨，不停地看手表，心里非常着急，因为她没有带伞，不知道怎么回家。正在这时，她的同事小王走了过来，笑着说：“别着急，我们一起走吧！”说完，他打开自己的大伞，和小李一起走进了雨里。小李非常感动。这个故事告诉我们，出门前最好看看天气预报；同时，同事之间互相帮助，会让人觉得特别温暖。","❶ Trời nắng, để ô ở nhà → ❷ tan làm mưa to, sốt ruột xem đồng hồ → ❸ đồng nghiệp che chung ô. Dùng: 没想到、于是、正在这时、说完、这个故事告诉我们."],["Câu 4 · 如果现在具备一切条件，你最想做的是什么？请简单说说。","如果现在具备一切条件，我最想做的是去世界各地旅行。第一，我从小就喜欢看介绍各国风景和文化的节目，一直想亲眼去看看金字塔、长城和极光。第二，旅行可以让我认识不同国家的朋友，了解他们的生活方式，开阔自己的眼界。第三，在旅行中我还可以练习外语，比如在中国说汉语。当然，现在我还是学生，还没有足够的时间和钱，所以我会先努力学习，以后找到好工作，一步一步实现这个梦想。","Nêu điều muốn làm → 2–3 lý do (第一/第二/第三) → hiện tại còn thiếu gì, sẽ làm gì để đạt được (当然……所以……)."],["Câu 5 · 有人认为世界和平是有希望的，有人认为世界和平是不可能实现的。你怎么看？","我认为世界和平是有希望的，但是需要所有人一起努力。一方面，现在各国之间的交流越来越多，经济、文化、教育上的合作让国家之间互相依靠，打仗对谁都没有好处。另一方面，很多国际组织一直在为和平努力，帮助解决矛盾，帮助战争中的难民。当然，我们也要承认，现在世界上还有一些地区存在战争和冲突，实现真正的和平并不容易。不过我相信，只要每个人从身边做起，尊重别人、多理解、少争吵，世界和平总有一天会实现。","Nêu quan điểm → lý do (一方面……另一方面……) → thừa nhận mặt khó (当然……并不容易) → kết luận (只要……就/总有一天……)."]],"sub":"模拟题 02","examName":"Đề 02","file":"HSK5_KHAU_NGU_DE02","isNew":false,"qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat","question":"Câu 2: 听后复述
