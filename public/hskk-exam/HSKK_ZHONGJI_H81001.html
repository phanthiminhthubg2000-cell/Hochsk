理解，请谈谈你的看法。"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 兴趣是最好的老师。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 你别忘了带照相机。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 桌子上放着一本书。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 这个问题必须马上解决。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 一年有春、夏、秋、冬四个季节。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 我们对你很有信心。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 这张卡的密码是你的生日。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 小李的男朋友特别幽默。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 公司安排我下周三出差。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 王教授的教学经验比我丰富。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81001_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81001_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 你有什么兴趣和爱好？请谈谈它对你的影响。", "images": []}, "14": {"type": "answer", "question": "Câu 14: 每个人对成功都有自己的理解，请谈谈你的看法。", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 兴趣是最好的老师。<br>2. 你别忘了带照相机。<br>3. 桌子上放着一本书。<br>4. 这个问题必须马上解决。<br>5. 一年有春、夏、秋、冬四个季节。<br>6. 我们对你很有信心。<br>7. 这张卡的密码是你的生日。<br>8. 小李的男朋友特别幽默。<br>9. 公司安排我下周三出差。<br>10. 王教授的教学经验比我丰富。", "1. Hứng thú là người thầy tốt nhất. · 2. Bạn đừng quên mang theo máy ảnh nhé. · 3. Trên bàn có đặt một cuốn sách. · 4. Vấn đề này bắt buộc phải giải quyết ngay lập tức. · 5. Một năm có bốn mùa: xuân, hạ, thu, đông. · 6. Chúng tôi rất tin tưởng vào bạn. · 7. Mật khẩu của chiếc thẻ này là ngày sinh nhật của bạn. · 8. Bạn trai của Tiêu Lý đặc biệt hài hước. · 9. Công ty sắp xếp cho tôi đi công tác vào thứ Tư tuần sau. · 10. Kinh nghiệm giảng dạy của giáo sư Vương phong phú hơn tôi."], ["Câu 11 · Bài mẫu tham khảo", "在这张照片中，有一个女人正趴在桌子上睡觉，旁边放着一台电脑。从她的动作可以看出，她觉得非常累。我想，她最近可能在加班工作，或者正在准备一个重要的考试。因为工作量太大，她没有时间好好休息，所以忍不住趴在电脑前睡着了。在生活中，我们经常会遇到这种情况。但是我认为，工作和学习虽然重要，身体健康更加重要。我们应该合理安排时间，累了就要休息，不要让身体太辛苦。只有保持健康的身体，才能更好地工作和生活。", "Trong bức ảnh này, có một người phụ nữ đang gục xuống bàn ngủ, bên cạnh có một chiếc máy tính. Từ động tác của cô ấy có thể thấy cô ấy đang rất mệt mỏi. Tôi nghĩ gần đây có thể cô ấy đang làm thêm giờ hoặc chuẩn bị cho một kỳ thi quan trọng. Vì khối lượng công việc quá lớn nên cô ấy không có thời gian nghỉ ngơi tử tế, vì vậy đã không nén nổi cơn buồn ngủ mà gục xuống trước máy tính. Trong cuộc sống, chúng ta thường xuyên gặp tình huống này. Tuy nhiên tôi cho rằng, công việc và học tập tuy quan trọng nhưng sức khỏe còn quan trọng hơn. Chúng ta nên sắp xếp thời gian hợp lý, mệt thì phải nghỉ ngơi, đừng để cơ thể quá vất vả. Chỉ khi giữ gìn được cơ thể khỏe mạnh thì mới có thể làm việc và sinh sống tốt hơn."], ["Câu 12 · Bài mẫu tham khảo", "在这张照片中，我看到了一家三口，有爸爸、妈妈和小女儿。他们手里拿着很多购物袋，正一边走一边开心地理笑。看起来，这是在一个周末，爸爸妈妈带女儿去商场购物。女儿看起来非常快乐，爸爸妈妈也很高兴。逛街不仅能买到需要的东西，还能增进家人之间的感情。现在大家的平时工作和学习都很忙，很少有时间陪家人。我觉得周末和家人一起出去逛街、吃美食，是一种很好的放松方式。家庭的幸福和温暖才是最重要的。", "Trong bức ảnh này, tôi thấy một gia đình ba người gồm bố, mẹ và con gái nhỏ. Trên tay họ cầm nhiều túi mua sắm, vừa đi vừa cười nói rất vui vẻ. Có vẻ như vào một ngày cuối tuần, bố mẹ đưa con gái đi trung tâm thương mại mua sắm. Cậu con gái trông rất hạnh phúc, bố mẹ cũng vô cùng vui vẻ. Đi mua sắm không chỉ mua được những đồ dùng cần thiết mà còn giúp tăng cường tình cảm giữa các thành viên trong gia đình. Ngày nay công việc và học tập hàng ngày của mọi người đều rất bận rộn, hiếm có thời gian ở bên gia đình. Tôi nghĩ cuối tuần cùng gia đình đi dạo phố, ăn đồ ăn ngon là một cách thư giãn rất tốt. Sự hạnh phúc và ấm áp của gia đình mới là điều quan trọng nhất."], ["Câu 13 · Bài mẫu tham khảo", "每个人都有自己的兴趣和爱好，我最大的爱好就是看书。无论工作多忙，我每天都会抽出一段时间来阅读。看书对我产生了很大的积极影响。首先，阅读能让我放松心情，减轻生活中的压力。每当我感到累的时候，静下心来看一本书，心情就会变好。其次，通过看书，我可以学到很多新的知识，开阔自己的眼界，了解不同的文化和思想。总之，看书不仅丰富了我的业余生活，还让我成为了一个更有智慧、更自信的人。我会一直坚持这个好习惯。", "Mỗi người đều có hứng thú và sở thích riêng, sở thích lớn nhất của tôi là đọc sách. Cho dù công việc bận rộn đến đâu, mỗi ngày tôi đều dành ra một khoảng thời gian để đọc. Việc đọc sách mang lại ảnh hưởng tích cực rất lớn đối với tôi. Trước hết, đọc sách giúp tôi thư giãn tâm trạng, giảm bớt áp lực trong cuộc sống. Mỗi khi cảm thấy mệt mỏi, tĩnh tâm đọc một cuốn sách, tâm trạng của tôi sẽ tốt lên. Thứ hai, thông qua việc đọc sách, tôi có thể học được nhiều kiến thức mới, mở rộng tầm mắt, hiểu thêm về các văn hóa và tư tưởng khác nhau. Tóm lại, đọc sách không chỉ làm phong phú thêm cuộc sống lúc rảnh rỗi của tôi, mà còn giúp tôi trở thành một người có trí tuệ và tự tin hơn. Tôi sẽ luôn duy trì thói quen tốt này."], ["Câu 14 · Bài mẫu tham khảo", "关于什么是成功，每个人都有不同的看法。有人觉得赚很多钱、拥有高地位就是成功。但我认为，成功并不只是看钱多不多。对我来说，成功意味着不断挑战自己，实现自己的梦想。只要今天比昨天有进步，在努力的过程中收获了成长，这就是一种成功。另外，拥有健康的身体、幸福的家庭和真诚的朋友，也是非常了不起的成功。总的来说，成功没有统一的标准。只要我们认真对待生活，坚持做自己喜欢的事，过得快乐和充实，就是成功的人生。", "Về việc thế nào là thành công, mỗi người đều có quan điểm khác nhau. Có người cho rằng kiếm được nhiều tiền, có địa vị cao mới là thành công. Nhưng tôi cho rằng, thành công không chỉ dựa vào việc có nhiều tiền hay không. Đối với tôi, thành công có nghĩa là liên tục thử thách bản thân, thực hiện giấc mơ của mình. Chỉ cần hôm nay có tiến bộ hơn ngày hôm qua, thu hoạch được sự trưởng thành trong quá trình nỗ lực, đó đã là một loại thành công. Ngoài ra, sở hữu một cơ thể khỏe mạnh, một gia đình hạnh phúc và những người bạn chân thành cũng là thành công rất tuyệt vời. Nói tóm lại, thành công không có tiêu chuẩn chung duy nhất. Chỉ cần chúng ta nghiêm túc với cuộc sống, kiên trì làm điều mình thích, sống vui vẻ và trọn vẹn thì đó chính là một cuộc đời thành công."]]};</script>
