, "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.74}, {"t": "win", "d": 10}, {"t": "play", "a": 33.74, "b": 36.06}, {"t": "win", "d": 5}, {"t": "play", "a": 36.06, "b": 39.22}, {"t": "win", "d": 10}, {"t": "play", "a": 39.22, "b": 86.67}, {"t": "win", "d": 73}, {"t": "play", "a": 86.67, "b": 134.29}, {"t": "win", "d": 74}, {"t": "play", "a": 134.29, "b": 182.46}, {"t": "win", "d": 74}, {"t": "play", "a": 182.46, "b": 202.52}, {"t": "win", "d": 600}, {"t": "play", "a": 202.52, "b": 205.88}, {"t": "win", "d": 110}, {"t": "play", "a": 205.88, "b": 219.22}, {"t": "win", "d": 140}, {"t": "play", "a": 219.22, "b": 232.71}, {"t": "win", "d": 140}, {"t": "play", "a": 232.71, "b": 267.13}], "audio": "audio/hskkg_H91001.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "遇到压力时，你一般用哪些办法来缓解它？", "6": "要成为一名合格的领导，需要具备哪些基本素质？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 有朋友说：“凡事要往好处想。”我却觉得需要将那位朋友的观点改成“好事要往坏处想，坏事要往好处想”。比如一个人中了百万元大…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 遇到压力时，你一般用哪些办法来缓解它？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 要成为一名合格的领导，需要具备哪些基本素质？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "早上，我从衣柜里拿出新买的衣服，对着镜子试了起来。一回头，发现5岁的女儿正在身后看着我。于是，我高兴地问她：“妈妈穿这件衣服合适不合适？”女儿从头到脚仔细地看了看，然后说：“衣服很合适，可是妈妈需要再高点、再瘦点。”", "Ý chính: Buổi sáng tôi lấy quần áo mới đứng trước gương thử → Phát hiện con gái 5 tuổi đứng sau nhìn mình → Tôi vui vẻ hỏi con gái mặc áo có hợp không → Con gái nhìn kỹ từ đầu đến chân → Con gái bảo áo rất hợp nhưng mẹ cần cao hơn và gầy hơn"], ["Câu 2 · Lời đoạn nghe", "现在社会上对机器人有很多疑惑，有人认为机器人应该无所不能。这些朋友是从电影、电视或小说中认识机器人的，他们眼中的机器人是神通广大的万能机器。当他们看到现实中的机器人时，会觉得很失望。他们认为现在的机器人太普通，形状也不像人，不能称之为机器人。", "Ý chính: Xã hội có nhiều thắc mắc về robot, có người nghĩ robot nên vạn năng. → Họ biết robot qua phim ảnh, tiểu thuyết và coi là máy vạn năng. → Khi thấy robot thực tế, họ cảm thấy rất thất vọng. → Họ cho rằng robot hiện nay quá bình thường và không giống người."], ["Câu 3 · Lời đoạn nghe", "我父亲是教育家，他从不把成绩单上的成绩看作是衡量孩子最重要的标准。他经常说，人的能力和特点是不同的，有的人擅长数学，有的人擅长语文，有的人则动手能力强。重要的是，家长和老师要尊重孩子，要发现每个人的特点和优点，不能让孩子产生人有高低之分的感觉。", "Ý chính: Cha không coi điểm số là tiêu chuẩn quan trọng nhất → Năng lực và đặc điểm của mỗi người khác nhau → Mỗi người giỏi môn khác nhau hoặc có năng lực thực hành riêng → Cha mẹ và thầy cô phải tôn trọng và phát hiện ưu điểm của trẻ → Không để trẻ cảm thấy con người có phân biệt cao thấp"], ["Câu 4 · 朗读 · Đoạn văn", "有朋友说：“凡事要往好处想。”我却觉得需要将那位朋友的观点改成“好事要往坏处想，坏事要往好处想”。比如一个人中了百万元大奖，这是天大的好事，但要冷静考虑这笔钱应该如何安排。如果是大吃大喝、请客送礼，不久便会把这笔钱花光，还会给以后的人生带来坏的影响。这是好事没有往坏处想，就将好事变成坏事了。反过来，只看到事物坏的一面，感到没有希望，前途黑暗，就没有把坏事变成好事的希望和动力，就永远不能解决问题，继续前进。总之，“好事要往坏处想，坏事要往好处想”要比“凡事要往好处想”来得全面，这样既看到了光明的一面，又看到了隐藏的危险，使我们永远保持良好的心态。", ""], ["Câu 5 · Bài mẫu tham khảo", "在生活和工作中，每个人都会遇到压力。我一般会用这样几个办法来缓解压力。<br>第一，运动。压力大的时候，我会去游泳或者跑步。运动的时候，我可以暂时忘记烦恼，运动完以后出一身汗，感觉整个人都轻松了。<br>第二，和家人、朋友聊天。把心里的压力说出来，心情就会好很多。而且他们有时候还能给我一些好的建议，帮我从不同的角度看问题。<br>第三，列一个计划。很多时候，压力是因为事情太多，不知道从哪里开始。这时候，我会把要做的事情一件一件写下来，分清楚先做什么、后做什么。每完成一件，压力就小一点。<br>另外，保证充足的睡眠也很重要。<br>总之，压力并不可怕，适当的压力还能变成动力。关键是要找到适合自己的方法，不要让压力影响我们的身体和生活。", "Trong cuộc sống và công việc, ai cũng sẽ gặp phải áp lực. Tôi thường dùng mấy cách sau đây để giải tỏa áp lực.\nThứ nhất, vận động. Khi áp lực lớn, tôi thường đi bơi hoặc chạy bộ. Lúc vận động, tôi có thể tạm thời quên đi những phiền muộn, vận động xong vã mồ hôi, cảm thấy toàn thân nhẹ nhõm hẳn.\nThứ hai, trò chuyện với người thân và bạn bè. Nói ra những áp lực trong lòng, tâm trạng sẽ tốt hơn rất nhiều. Hơn nữa, họ đôi khi còn có thể cho tôi một số lời khuyên hữu ích, giúp tôi nhìn nhận vấn đề từ các góc độ khác nhau.\nThứ ba, lên kế hoạch. Rất nhiều khi, áp lực là vì có quá nhiều việc, không biết bắt đầu từ đâu. Những lúc này, tôi sẽ viết những việc cần làm ra từng cái một, phân định rõ việc nào làm trước, việc nào làm sau. Hoàn thành được một việc, áp lực lại giảm đi một chút.\nNgoài ra, đảm bảo ngủ đủ giấc cũng rất quan trọng.\nNói chung, áp lực không hề đáng sợ, áp lực thích hợp còn có thể biến thành động lực. Quan trọng là phải tìm được phương pháp phù hợp với bản thân, đừng để áp lực ảnh hưởng đến cơ thể và cuộc sống của chúng ta."]]};</script>
