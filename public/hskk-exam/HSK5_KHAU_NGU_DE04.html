<script>window.EXAM={"level":5,"title":"HSK（五级）","total":"23 phút","prep":"10 phút","desc":"Đề luyện số 04 HSK 5 khẩu ngữ theo dạng mới (新版HSK口语): 3 phần, 5 câu.","struct":[["1","听后复述 — Nghe rồi thuật lại","2","1.5 phút / câu"],["2","看图说话 — Nhìn tranh kể chuyện","1","2 phút (chuẩn bị 3 phút)"],["3","回答问题 — Trả lời câu hỏi","2","2.5 phút / câu (chuẩn bị 7 phút)"]],"parts":[{"cn":"第一部分","title":"第1-2题：听后复述","time":"（每题1.5分钟）","note":"Nghe một đoạn văn, sau tiếng “嘀” hãy thuật lại nội dung bằng lời của mình."},{"cn":"第二部分","title":"第3题：看图说话","time":"（2分钟）","imgs":["img/hskk5de04_1.jpg","img/hskk5de04_2.jpg","img/hskk5de04_3.jpg"],"story":true,"qs":[3,3,3],"note":"Ba bức tranh ❶❷❸ kể một câu chuyện. Hãy kể lại theo thứ tự.","draft":true},{"cn":"第三部分","title":"第4-5题：回答问题","time":"","draft":true,"ask":[[4,"你对自己的哪些方面感到满意？请简单介绍一下。","2.5分钟"],[5,"中国有句话叫“知足常乐”，你怎么看？为什么？","2.5分钟"]]}],"windows":[{"k":"intro","hint":"你好！你叫什么名字？— Trả lời họ tên."},{"k":"intro","hint":"你是哪国人？— Trả lời quốc tịch."},{"k":"intro","hint":"你的序号是多少？— Đọc số báo danh."},{"k":"ans","q":1,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"ans","q":2,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"prep","part":1,"hint":"Xem các tranh, nghĩ cốt truyện: ai? ở đâu? chuyện gì xảy ra? kết quả?"},{"k":"ans","q":3,"part":1,"hint":"Kể câu chuyện theo các tranh."},{"k":"prep","part":2,"hint":"Đọc 2 câu hỏi, ghi dàn ý: quan điểm → lý do → ví dụ → kết luận."},{"k":"ans","q":4,"part":2,"hint":""},{"k":"ans","q":5,"part":2,"hint":""}],"answerQs":[1,2,3,4,5],"qText":{"1":"听后复述","2":"听后复述","3":"看图说话","4":"你对自己的哪些方面感到满意？请简单介绍一下。","5":"中国有句话叫“知足常乐”，你怎么看？为什么？"},"rubric":["Phát âm & ngữ điệu tự nhiên","Thuật lại đủ ý chính (phần 1)","Kể chuyện theo tranh mạch lạc, có mở – thân – kết","Lập luận rõ ràng, có ví dụ (phần 3)","Từ vựng – ngữ pháp đa dạng, chính xác","Nói trôi chảy, dùng hết thời gian"],"samples":[["Câu 1 · Lời thoại đoạn nghe","有个国王没有儿子，他打算从全国选一个男孩做王子。于是给每个男孩一棵种子，看谁种的花最漂亮就选谁做王子。到了选王子的那天，几乎所有的小孩都捧着鲜艳、漂亮的花来了，只有一个小孩捧着一个空花盆伤心落泪，他没有种出花来。但是，他被选中了。原来，所有的种子都是被煮过的。","Ý chính: vua không có con trai, muốn chọn hoàng tử → phát hạt giống cho các bé trai, ai trồng hoa đẹp nhất được chọn → hầu hết mang hoa đẹp đến, chỉ một em mang chậu rỗng, khóc → em đó được chọn → vì tất cả hạt giống đã bị luộc chín (bài học: trung thực)."],["Câu 2 · Lời thoại đoạn nghe","孤独是每个人都曾经有过的心理体验，它并不可怕，重要的是你用什么方式去对待它。要战胜孤独，就要学会为别人着想，只要花一些时间和精力去关心、关注别人，相信你会在良好的人际关系中体验到一种自我价值感，而不是孤独感。“去点燃温暖别人的火，它也会温暖你自己。”","Ý chính: ai cũng từng cô đơn, không đáng sợ, quan trọng là cách đối diện → muốn vượt qua phải biết nghĩ cho người khác, quan tâm người khác → sẽ thấy giá trị bản thân trong quan hệ tốt đẹp → \"thắp lửa sưởi ấm người khác cũng sưởi ấm chính mình\"."],["Câu 3 · 看图说话（gợi ý）","一天上午，一位老奶奶从菜市场买了很多菜和水果，两只手各提着一个大塑料袋，准备过马路。袋子太重了，她走得很慢，看起来非常吃力。这时候，一个放学回家的中学生看见了，马上跑过去说：“奶奶，我来帮您吧！”他一手帮奶奶提着袋子，一手扶着奶奶，小心地走过了人行横道。到了马路对面，奶奶非常感动，从袋子里拿出一个又红又大的苹果送给他，笑着说：“谢谢你，好孩子！”中学生不好意思地弯下腰，向奶奶表示感谢。这个故事告诉我们，帮助别人是一件快乐的事，我们应该尊敬老人，多关心身边需要帮助的人。","❶ Bà cụ xách đồ nặng qua đường, rất vất vả → ❷ học sinh chạy đến xách giúp, dìu bà qua → ❸ bà cảm động tặng quả táo. Dùng: 看起来很吃力、马上、一手……一手……、感动、这个故事告诉我们."],["Câu 4 · 你对自己的哪些方面感到满意？请简单介绍一下。","我对自己的很多方面都比较满意，我想主要说两点。第一，我是一个很有毅力的人。比如学汉语，刚开始的时候我觉得汉字特别难，但我每天坚持写半个小时，现在已经能看懂很多中文文章了。第二，我的人际关系很好。我性格开朗，愿意帮助别人，所以朋友们有什么事都喜欢找我商量。当然，我也有不足的地方，比如有时候做事不够细心。不过我相信，只要不断努力，我会成为更好的自己。","Nêu 2 điểm hài lòng (第一/第二) + ví dụ cụ thể (比如) → thừa nhận điểm chưa tốt (当然……不过……) → kết luận tích cực."],["Câu 5 · 中国有句话叫“知足常乐”，你怎么看？为什么？","“知足常乐”的意思是，一个人如果对自己现在拥有的东西感到满足，就会常常感到快乐。我比较同意这句话，但是我觉得要看在哪个方面。在物质生活上，我们应该知足。如果总是和别人比，想要更大的房子、更贵的车，就永远不会满足，也很难快乐。但是在学习和工作上，我们不能太容易满足，应该不断进步，否则就会被别人超过。所以我认为，生活上要知足，学习上要不知足，这样才能既快乐又有进步。","Giải thích câu nói → quan điểm (同意，但要看方面) → vật chất nên biết đủ / học tập không nên dừng (但是……否则……) → kết luận (既……又……)."]],"sub":"模拟题 04","examName":"Đề 04 · H91002","file":"HSK5_KHAU_NGU_DE04","isNew":true,"qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat"
