哪个更重要？请谈谈你的看法。"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 这附近有家超市。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 他向经理请假了。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 放心，我明天一定不会迟到。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 图书馆的电梯坏了。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 很多年轻人参加了这次比赛。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 我已经把材料翻译好了。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 对不起，这里不允许抽烟。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 李教授说话很幽默。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 那儿的景色美极了！", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 你最好先跟你父母商量商量。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81416_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81416_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 你觉得自己是个什么样的人？请说一说。", "images": []}, "14": {"type": "answer", "question": "Câu 14: 能力和态度哪个更重要？请谈谈你的看法。", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 这附近有家超市。<br>2. 他向经理请假了。<br>3. 放心，我明天一定不会迟到。<br>4. 图书馆的电梯坏了。<br>5. 很多年轻人参加了这次比赛。<br>6. 我已经把材料翻译好了。<br>7. 对不起，这里不允许抽烟。<br>8. 李教授说话很幽默。<br>9. 那儿的景色美极了！<br>10. 你最好先跟你父母商量商量。", "1. Gần đây có một siêu thị. · 2. Anh ấy đã xin phép nghỉ với quản lý. · 3. Yên tâm đi, ngày mai tôi nhất định sẽ không đến muộn. · 4. Thang máy của thư viện bị hỏng rồi. · 5. Rất nhiều người trẻ đã tham gia cuộc thi lần này. · 6. Tôi đã dịch xong tài liệu rồi. · 7. Xin lỗi, ở đây không cho phép hút thuốc. · 8. Giáo sư Lý nói chuyện rất hài hước. · 9. Phong cảnh ở đó đẹp tuyệt vời! · 10. Bạn tốt nhất nên thương lượng với bố mẹ trước."], ["Câu 11 · Bài mẫu tham khảo", "照片上有三个女大学生，她们都穿着学士服，戴着学士帽。看起来她们刚刚参加完毕业典礼。她们三个人的表情都很开心，正在一起自拍。我觉得她们一定是好朋友。大学四年，她们一起学习，一起生活，留下了很多美好的回忆。今天毕业了，她们想用照片记录下这个重要的时刻。虽然以后大家可能要去不同的城市工作，但她们的友谊一定会一直持续下去。祝她们前程似锦，未来越来越好。", "Trong ảnh có ba nữ sinh viên đại học, họ đều mặc lễ phục tốt nghiệp và đội mũ cử nhân. Có vẻ như họ vừa tham gia xong buổi lễ tốt nghiệp. Biểu cảm của cả ba người đều rất vui vẻ, đang cùng nhau chụp ảnh tự sướng. Tôi nghĩ họ chắc chắn là bạn thân. Bốn năm đại học, họ cùng nhau học tập, cùng nhau sinh hoạt, để lại rất nhiều kỷ niệm đẹp. Hôm nay tốt nghiệp, họ muốn dùng bức ảnh để ghi lại khoảnh khắc quan trọng này. Mặc dù sau này mọi người có thể phải đi làm ở những thành phố khác nhau, nhưng tình bạn của họ chắc chắn sẽ mãi bền lâu. Chúc họ tiền đồ tươi sáng, tương lai ngày càng tốt đẹp."], ["Câu 12 · Bài mẫu tham khảo", "照片里有两个男人，一个是车主，一个是修车师傅。车主穿着白衬衫，看起来像是去上班的路上车坏了。他正指着汽车的发动机，好像在问修车师傅哪里出了问题。修车师傅穿着蓝色的工作服，手里拿着工具，正在认真地检查。我觉得修车师傅经验很丰富，他很快就能找到问题并修好车。车主虽然很着急，但是有师傅帮忙，他应该很快就能去上班了。生活中总会遇到一些小麻烦，只要冷静处理，问题总会解决的。", "Trong ảnh có hai người đàn ông, một người là chủ xe, một người là thợ sửa xe. Chủ xe mặc áo sơ mi trắng, trông có vẻ như xe bị hỏng trên đường đi làm. Anh ấy đang chỉ vào động cơ ô tô, dường như đang hỏi thợ sửa xe xem chỗ nào bị hỏng. Thợ sửa xe mặc bộ đồ làm việc màu xanh, tay cầm dụng cụ, đang kiểm tra một cách nghiêm túc. Tôi nghĩ thợ sửa xe rất giàu kinh nghiệm, anh ấy sẽ sớm tìm ra vấn đề và sửa xong xe. Chủ xe tuy rất vội, nhưng có thợ giúp đỡ, anh ấy chắc sẽ sớm có thể đi làm. Trong cuộc sống luôn gặp phải những rắc rối nhỏ, chỉ cần bình tĩnh xử lý, vấn đề nào rồi cũng sẽ được giải quyết."], ["Câu 13 · Bài mẫu tham khảo", "我觉得我是一个比较乐观、开朗的人。无论遇到什么困难，我总是习惯先看到事情积极的一面，而不是抱怨。在学习和工作中，我很有耐心，做事也比较认真，答应别人的事情一定会努力做好。当然，我也有缺点，比如有时候做事比较慢。但我一直在努力改进，希望自己能变得更优秀。总之，我是一个热爱生活、积极向上的人。", "Tôi nghĩ mình là một người khá lạc quan và cởi mở. Dù gặp phải khó khăn gì, tôi luôn có thói quen nhìn vào mặt tích cực của sự việc trước, thay vì than vãn. Trong học tập và công việc, tôi rất kiên nhẫn, làm việc cũng khá nghiêm túc, chuyện đã hứa với người khác nhất định sẽ nỗ lực làm tốt. Tất nhiên, tôi cũng có khuyết điểm, ví dụ như đôi khi làm việc hơi chậm. Nhưng tôi vẫn luôn nỗ lực cải thiện, hy vọng bản thân có thể trở nên xuất sắc hơn. Tóm lại, tôi là một người yêu cuộc sống và luôn hướng về phía trước."], ["Câu 14 · Bài mẫu tham khảo", "关于能力和态度哪个更重要，我认为态度更重要。能力可以通过学习和实践不断提高，但态度决定了一个人对待工作的认真程度。如果你有很好的能力，但是工作态度不好，不负责任，那么你很难把事情做好。相反，如果你有一个积极、认真的态度，即使现在的能力还不够强，你也愿意去学习，去努力，最终一定会取得成功。所以，态度是基础，有了好的态度，能力才会发挥出最大的作用。", "Về việc năng lực và thái độ cái nào quan trọng hơn, tôi cho rằng thái độ quan trọng hơn. Năng lực có thể thông qua học tập và thực tiễn để không ngừng nâng cao, nhưng thái độ quyết định mức độ nghiêm túc của một người đối với công việc. Nếu bạn có năng lực rất tốt, nhưng thái độ làm việc không tốt, không có trách nhiệm, thì bạn rất khó làm tốt mọi việc. Ngược lại, nếu bạn có một thái độ tích cực, nghiêm túc, dù năng lực hiện tại chưa đủ mạnh, bạn cũng sẵn sàng học hỏi, nỗ lực, cuối cùng nhất định sẽ đạt được thành công. Vì vậy, thái độ là nền tảng, có thái độ tốt, năng lực mới phát huy được tác dụng lớn nhất."]]};</script>
