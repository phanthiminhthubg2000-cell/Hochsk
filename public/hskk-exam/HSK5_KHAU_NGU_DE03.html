<script>window.EXAM={"level":5,"title":"HSK（五级）","total":"23 phút","prep":"10 phút","desc":"Đề luyện số 03 HSK 5 khẩu ngữ theo dạng mới (新版HSK口语): 3 phần, 5 câu.","struct":[["1","听后复述 — Nghe rồi thuật lại","2","1.5 phút / câu"],["2","看图说话 — Nhìn tranh kể chuyện","1","2 phút (chuẩn bị 3 phút)"],["3","回答问题 — Trả lời câu hỏi","2","2.5 phút / câu (chuẩn bị 7 phút)"]],"parts":[{"cn":"第一部分","title":"第1-2题：听后复述","time":"（每题1.5分钟）","note":"Nghe một đoạn văn, sau tiếng “嘀” hãy thuật lại nội dung bằng lời của mình."},{"cn":"第二部分","title":"第3题：看图说话","time":"（2分钟）","imgs":["img/hskk5de03_1.jpg","img/hskk5de03_2.jpg","img/hskk5de03_3.jpg"],"story":true,"qs":[3,3,3],"note":"Ba bức tranh ❶❷❸ kể một câu chuyện. Hãy kể lại theo thứ tự.","draft":true},{"cn":"第三部分","title":"第4-5题：回答问题","time":"","draft":true,"ask":[[4,"广告在我们的生活中无处不在，广告对人们的生活有什么影响？","2.5分钟"],[5,"如果可以和一位历史人物交谈，你会选择谁？为什么？","2.5分钟"]]}],"windows":[{"k":"intro","hint":"你好！你叫什么名字？— Trả lời họ tên."},{"k":"intro","hint":"你是哪国人？— Trả lời quốc tịch."},{"k":"intro","hint":"你的序号是多少？— Đọc số báo danh."},{"k":"ans","q":1,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"ans","q":2,"part":0,"hint":"Thuật lại đoạn vừa nghe."},{"k":"prep","part":1,"hint":"Xem các tranh, nghĩ cốt truyện: ai? ở đâu? chuyện gì xảy ra? kết quả?"},{"k":"ans","q":3,"part":1,"hint":"Kể câu chuyện theo các tranh."},{"k":"prep","part":2,"hint":"Đọc 2 câu hỏi, ghi dàn ý: quan điểm → lý do → ví dụ → kết luận."},{"k":"ans","q":4,"part":2,"hint":""},{"k":"ans","q":5,"part":2,"hint":""}],"answerQs":[1,2,3,4,5],"qText":{"1":"听后复述","2":"听后复述","3":"看图说话","4":"广告在我们的生活中无处不在，广告对人们的生活有什么影响？","5":"如果可以和一位历史人物交谈，你会选择谁？为什么？"},"rubric":["Phát âm & ngữ điệu tự nhiên","Thuật lại đủ ý chính (phần 1)","Kể chuyện theo tranh mạch lạc, có mở – thân – kết","Lập luận rõ ràng, có ví dụ (phần 3)","Từ vựng – ngữ pháp đa dạng, chính xác","Nói trôi chảy, dùng hết thời gian"],"samples":[["Câu 1 · Lời thoại đoạn nghe","刘先生和儿子去火车站，进去以后，离开车只有五分钟了。他们跑了起来，刘先生跑得很快，先上了火车。他看见儿子还在车下面，就要下车。列车员说：“先生，不能下车，车就要开了，来不及了。”刘先生着急地说：“不行，是我儿子要坐车，我是来送他的。”","Ý chính: ông Lưu và con trai đến ga, còn 5 phút → hai người chạy, ông Lưu lên tàu trước → thấy con còn dưới sân ga, định xuống → nhân viên không cho → ông sốt ruột: người đi là con trai, ông chỉ ra tiễn."],["Câu 2 · Lời thoại đoạn nghe","有一个班，大部分学生毕业前就找到了工作，最后，只剩下一个学生还没有找到工作。这时候有个大公司来招聘销售代表，年薪三十万。于是剩下的这名学生得到了最好的工作。他不是最优秀的，但其他人都已经没有了选择的机会。我们的一生，也许可以更成功，但有时候早早地做出选择，会使我们失去更好的发展机会。","Ý chính: cả lớp đã có việc trước khi tốt nghiệp, chỉ còn 1 người → công ty lớn tuyển nhân viên kinh doanh lương năm 300 nghìn → người còn lại được việc tốt nhất dù không giỏi nhất → bài học: chọn quá sớm có thể mất cơ hội tốt hơn."],["Câu 3 · 看图说话（gợi ý）","小美今年十六岁，她一直想学做饭。有一天，她在网上找到了一个做菜的视频，就一边看手机，一边学着炒菜。开始的时候，她觉得很简单，心里特别得意。可是没过多久，因为火开得太大，锅里的菜全都炒糊了，厨房里冒出了很多黑烟，呛得她直咳嗽，她非常失望。这时候，妈妈走进厨房，耐心地教她怎么控制火候、什么时候放调料。在妈妈的帮助下，小美终于做出了几道好吃的菜。晚上，全家人坐在一起吃饭，爸爸一边吃一边夸她做得好吃，小美开心极了。这件事让她明白，学习任何东西都需要耐心，失败了也不要放弃。","❶ Tự tin nấu theo video → ❷ cháy chảo, khói mù, thất vọng → ❸ mẹ chỉ dạy, cả nhà ăn ngon. Dùng: 一边……一边……、没过多久、因为……所以……、在……的帮助下、终于、这件事让她明白."],["Câu 4 · 广告在我们的生活中无处不在，广告对人们的生活有什么影响？","我觉得广告对人们的生活既有好的影响，也有不好的影响。好的方面是，广告能让我们很快了解新产品的信息，比如价格、功能和优惠活动，给我们的购物带来了方便。另外，有些公益广告还能提醒大家保护环境、注意安全，有教育意义。不好的方面是，现在广告太多了，看视频、刷手机的时候常常被打断，让人觉得很烦。而且有些广告夸大产品的效果，甚至是虚假的，容易让人上当，买一些不需要的东西。所以，我认为我们在看广告的时候应该保持理性，不能完全相信广告。","Hai mặt: tích cực (信息、方便、公益广告) → tiêu cực (太多、虚假、乱消费) → kết luận: 保持理性. Cấu trúc 既……也……、另外、而且、所以."],["Câu 5 · 如果可以和一位历史人物交谈，你会选择谁？为什么？","如果可以和一位历史人物交谈，我会选择孔子。第一，孔子是中国最有名的思想家和教育家，他的很多思想到今天还影响着中国人，比如“学而时习之”“三人行，必有我师”。我很想问问他，他是怎么想到这些道理的。第二，我将来想当一名老师，孔子提出了“因材施教”，我想请他教我怎样根据每个学生的特点来教学。第三，我还想问他，如果他生活在今天这个网络时代，他会怎样看待现在的教育。我相信，和孔子的这次谈话一定会让我受益匪浅。","Nêu nhân vật → giới thiệu ngắn → 2–3 lý do / điều muốn hỏi (第一/第二/第三) → kết luận. Có thể thay bằng 李白、秦始皇、胡志明…"]],"sub":"模拟题 03","examName":"Đề 03","file":"HSK5_KHAU_NGU_DE03","isNew":false,"qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat","question":"Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"3":{"type":"picture","question":"Câu 3: 看图说话 · Kể chuyện theo tranh","images":["img/hskk5de03_1.jpg","img/hskk5de03_2.jpg","img/hskk5de03_3.jpg"]},"4":{"type":"answer","question":"Câu 4: 广告在我们的生活中无处不在，广告对人们的生活有什么影响？","images":[]},"5":{"type":"answer","question":"Câu 5: 如果可以和一位历史人物交谈，你会选择谁？为什么？","images":[]}},"timeline":[{"t":"play","a":0,"b":60.98},{"t":"win","d":10},{"t":"play","a":60.98,"b":63.2},{"t":"win","d":10},{"t":"play","a":63.2,"b":67.65},{"t":"win","d":10},{"t":"play","a":67.65,"b":125.59},{"t":"win","d":90},{"t":"play","a":125.59,"b":173.57},{"t":"win","d":90},{"t":"play","a":173.57,"b":191.46},{"t":"win","d":180},{"t":"play","a":191.46,"b":197.03},{"t":"win","d":120},{"t":"play","a":197.03,"b":210.17},{"t":"win","d":421},{"t":"play","a":210.17,"b":215.64},{"t":"win","d":150},{"t":"play","a":215.64,"b":220.74},{"t":"win","d":150},{"t":"play","a":220.74,"b":224.68}],"audio":"audio/hskk5_de03.mp3"};</script>
