qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 上周五的会议我参加了。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 他们学校有三百年的历史。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 春节是中国最重要的节日。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 你女儿越来越漂亮了。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 她对附近的环境很满意。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 我收到您的电子邮件了。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 我相信你这次一定会成功。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 昨天晚上的演出非常精彩。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 这个办法值得试一试。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 我们的生活每天都在发生变化。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81002_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81002_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 请介绍你的一次旅游经历。", "images": []}, "14": {"type": "answer", "question": "Câu 14: 有人说“办法总比问题多”，你怎么看这句话？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 上周五的会议我参加了。<br>2. 他们学校有三百年的历史。<br>3. 春节是中国最重要的节日。<br>4. 你女儿越来越漂亮了。<br>5. 她对附近的环境很满意。<br>6. 我收到您的电子邮件了。<br>7. 我相信你这次一定会成功。<br>8. 昨天晚上的演出非常精彩。<br>9. 这个办法值得试一试。<br>10. 我们的生活每天都在发生变化。", "1. Tôi đã tham gia hội nghị vào thứ Sáu tuần trước. · 2. Trường học của họ có lịch sử ba trăm năm. · 3. Tết Nguyên Đán là ngày lễ quan trọng nhất ở Trung Quốc. · 4. Con gái của bạn ngày càng xinh đẹp hơn. · 5. Cô ấy rất hài lòng với môi trường gần đây. · 6. Tôi đã nhận được thư điện tử của ngài rồi. · 7. Tôi tin rằng lần này bạn nhất định sẽ thành công. · 8. Buổi biểu diễn tối hôm qua vô cùng đặc sắc. · 9. Cách này rất đáng để thử một lần. · 10. Cuộc sống của chúng ta mỗi ngày đều đang xảy ra thay đổi."], ["Câu 11 · Bài mẫu tham khảo", "这张照片上有一个年轻的帅哥。他穿着一件深棕色的衬衫，黑色的头发很整齐。他正坐在一张棕色的沙发旁边，手里拿着手机在打电话。他的脸上带着高兴的微笑，看起来心情很不错。我想他应该是在跟好朋友或者家人聊天，聊得非常开心。这个年轻人平时工作或者学习一定很努力，所以现在休息的时候感觉很轻松。这也提醒我们，在忙碌的生活中，偶尔打个电话跟亲人问候一下，是一件非常幸福的事情，能让人忘掉所有的疲劳和烦恼。", "Bức ảnh này có một chàng trai trẻ đẹp trai. Anh ấy mặc áo sơ mi màu nâu đậm, tóc đen gọn gàng. Anh ấy đang ngồi cạnh một chiếc ghế sofa màu nâu, tay cầm điện thoại gọi điện. Trên mặt anh ấy nở nụ cười vui vẻ, trông tâm trạng rất tốt. Tôi nghĩ anh ấy chắc là đang trò chuyện với bạn bè hoặc người thân, trò chuyện rất vui vẻ. Thanh niên này bình thường chắc làm việc hoặc học tập rất chăm chỉ, nên lúc nghỉ ngơi bây giờ cảm thấy rất thoải mái. Điều này cũng nhắc nhở chúng ta, trong cuộc sống bận rộn, thỉnh thoảng gọi điện hỏi thăm người thân là một việc vô cùng hạnh phúc, có thể khiến người ta quên đi mọi mệt mỏi và phiền muộn."], ["Câu 12 · Bài mẫu tham khảo", "这张照片里有两个女人在办公室里工作。站着的那个穿着黑色的西装，看起来像是一个经验丰富的经理或者老板。坐着的那位穿着黑色的衣服，正在认真地看电脑，右手按着鼠标，左手在打字。站着的经理正看着她，脸上带着温和的微笑，好像在给予她一些鼓励或者指导。这两个人配合得非常好，办公室的氛围显得很轻松也很和谐。在工作中，有一个好的领导和和谐的同事真的很重要，不仅能提高工作效率，还能让大家每天都有一个好心情，一起把工作做得更好。", "Trong bức ảnh này có hai người phụ nữ đang làm việc ở văn phòng. Người đang đứng mặc bộ vest đen, trông giống như một giám đốc hoặc sếp có kinh nghiệm. Người đang ngồi mặc đồ đen, đang chăm chú nhìn máy tính, tay phải giữ chuột, tay trái đang gõ phím. Nữ giám đốc đang nhìn cô ấy, trên mặt mang nụ cười ôn hòa, giống như đang đưa ra cho cô ấy một số lời khích lệ hoặc chỉ đạo. Hai người này phối hợp rất tốt, bầu không khí văn phòng tỏ ra rất thoải mái và hài hòa. Trong công việc, có một người lãnh đạo tốt và những đồng nghiệp hòa hợp thực sự rất quan trọng, không chỉ có thể nâng cao hiệu suất công việc, mà còn có thể khiến mọi người mỗi ngày đều có tâm trạng tốt, cùng nhau làm việc tốt hơn."], ["Câu 13 · Bài mẫu tham khảo", "我非常喜欢旅游，去年夏天我和几个好朋友一起去了中国云南。那是我的第一次难忘的旅游经历。我们去了丽江古城，那里的风景非常美丽，有很多古老的房子和小桥流水。白天我们一起逛街，买了很多有特色的小礼物；晚上我们在小酒吧里听音乐，喝茶聊天，感觉特别舒服。除了丽江，我们还去了玉龙雪山。虽然爬山的时候很累，但是当我们看到山顶上美丽的雪景时，觉得所有的辛苦都是值得的。这次旅游不仅让我看到了祖国的大好河山，还让我结识了很多有趣的新朋友。通过旅游，我学到了很多书本上学不到的知识，也让我的心胸更加开阔了。以后有机会，我一定要去更多不同的地方看一看，体验一下不一样的风土人情。", "Tôi rất thích du lịch, mùa hè năm ngoái tôi cùng mấy người bạn thân đi Vân Nam, Trung Quốc. Đó là trải nghiệm du lịch khó quên đầu tiên của tôi. Chúng tôi đã đến thành cổ Lệ Giang, phong cảnh ở đó vô cùng đẹp, có rất nhiều ngôi nhà cổ và cầu nhỏ nước chảy. Ban ngày chúng tôi cùng nhau đi dạo phố, mua rất nhiều món quà nhỏ đặc sắc; buổi tối chúng tôi ở quán bar nhỏ nghe nhạc, uống trà trò chuyện, cảm giác đặc biệt thoải mái. Ngoài Lệ Giang, chúng tôi còn đến Núi tuyết Ngọc Long. Mặc dù lúc leo núi rất mệt, nhưng khi chúng tôi nhìn thấy phong cảnh tuyết đẹp trên đỉnh núi, cảm thấy mọi vất vả đều đáng giá. Chuyến du lịch này không chỉ khiến tôi nhìn thấy giang sơn gấm vóc của Tổ quốc, mà còn khiến tôi quen biết thêm rất nhiều bạn mới thú vị. Thông qua du lịch, tôi đã học được rất nhiều kiến thức không thể học được trên sách vở, cũng khiến tấm lòng của tôi cấy rộng mở hơn. Sau này có cơ hội, tôi nhất định phải đến nhiều nơi khác nhau hơn để xem, trải nghiệm phong tục tập quán khác biệt."], ["Câu 14 · Bài mẫu tham khảo", "对于“办法总比问题多”这句话，我非常赞同。在我们的生活和工作中，遇到困难和问题是不可避免的。有的人遇到问题就会慌张或者放弃，觉得太难了没办法解决。但是，只要我们保持冷静，积极动脑筋去想办法，就一定能找到解决问题的方法。因为问题是死的，而人的智慧是无限的。比如，我去年在准备汉语考试的时候，有一部分语法我总是学不懂，当时觉得压力很大。但是我没有放弃，而是去找老师请教，跟同学们一起讨论，最后不仅弄懂了那个语法点，还顺利通过了考试。这个经历让我明白，面对困难时，态度决定一切。只要我们有信心，勇敢地去面对，积极地寻找对策，就没有过不去的火焰山。所以，以后无论遇到什么挫折，我都会微笑着对自己说，办法总比问题多。", "Đối với câu nói “cách giải quyết luôn nhiều hơn vấn đề”, tôi vô cùng đồng tình. Trong cuộc sống và công việc của chúng ta, việc gặp phải khó khăn và vấn đề là không thể tránh khỏi. Có người gặp vấn đề là sẽ hoảng loạn hoặc từ bỏ, cảm thấy khó quá không có cách giải quyết. Thế nhưng, chỉ cần chúng ta giữ bình tĩnh, tích cực động não suy nghĩ cách giải quyết, nhất định sẽ tìm được phương pháp giải quyết vấn đề. Bởi vì vấn đề là chết, mà trí tuệ của con người là vô hạn. Ví dụ, năm ngoái khi tôi chuẩn bị thi Hán ngữ, có một phần ngữ pháp tôi mãi học không hiểu, lúc đó cảm thấy áp lực rất lớn. Nhưng tôi không từ bỏ, mà đi tìm giáo viên xin chỉ giáo, cùng các bạn thảo luận, cuối cùng không chỉ hiểu được điểm ngữ pháp đó, mà còn thuận lợi vượt qua kỳ thi. Trải nghiệm này khiến tôi hiểu rằng, đối mặt với khó khăn, thái độ quyết định tất cả. Chỉ cần chúng ta có lòng tin, dũng cảm đối mặt, tích cực tìm kiếm đối sách, thì không có ngọn núi lửa nào không qua được. Cho nên, sau này dù gặp phải trắc trở gì, tôi cũng sẽ mỉm cười nói với bản thân, cách giải quyết luôn nhiều hơn vấn đề."]]};</script>
