为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 问题终于解决了。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 新搬来的邻居很热情。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 王经理在开会呢。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 我打算坐地铁去那儿。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 还有几位客人没到，再等等。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 昨天的演出真精彩！", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 谢谢大家对我们工作的支持。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 他中文说得非常流利。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 打折是商场吸引顾客的方法之一。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 这次活动将推迟到下周举行。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81311_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81311_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 你最想感谢的人是谁？为什么？", "images": []}, "14": {"type": "answer", "question": "Câu 14: 你对自己现在的生活满意吗？为什么？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 问题终于解决了。<br>2. 新搬来的邻居很热情。<br>3. 王经理在开会呢。<br>4. 我打算坐地铁去那儿。<br>5. 还有几位客人没到，再等等。<br>6. 昨天的演出真精彩！<br>7. 谢谢大家对我们工作的支持。<br>8. 他中文说得非常流利。<br>9. 打折是商场吸引顾客的方法之一。<br>10. 这次活动将推迟到下周举行。", "1. Vấn đề cuối cùng cũng đã được giải quyết. · 2. Người hàng xóm mới chuyển đến rất nhiệt tình. · 3. Giám đốc Vương đang họp. · 4. Tôi định đi tàu điện ngầm đến đó. · 5. Vẫn còn vài vị khách chưa đến, chờ thêm chút nữa nhé. · 6. Buổi biểu diễn ngày hôm qua thật tuyệt vời! · 7. Cảm ơn mọi người đã ủng hộ công việc của chúng tôi. · 8. Cậu ấy nói tiếng Trung rất lưu loát. · 9. Giảm giá là một trong những phương pháp thu hút khách hàng của trung tâm thương mại. · 10. Hoạt động lần này sẽ hoãn đến tuần sau mới tổ chức."], ["Câu 11 · Bài mẫu tham khảo", "在这张照片里，我看到三个好朋友正在一起过生日。桌子上放着一个漂亮的生日蛋糕，上面插着很多蜡烛。站在左边的女孩正开心地看着蛋糕，其他两位朋友也笑得非常灿烂。我想，今天是其中一位女孩的生日，她们聚在一起为她庆祝。大家一起唱生日快乐歌，许愿吹蜡烛。这种朋友之间的关心和友情让我觉得非常温暖。看到她们这么高兴，我也感受到了快乐。这种难忘的时刻真的很有意义。", "Trong bức ảnh này, tôi thấy ba người bạn thân đang cùng nhau tổ chức sinh nhật. Trên bàn có một chiếc bánh sinh nhật rất đẹp, cắm nhiều cây nến. Cô gái bên trái đang vui vẻ nhìn chiếc bánh, hai người bạn còn lại cũng cười rất tươi. Tôi nghĩ hôm nay là sinh nhật của một trong các cô gái, họ tập hợp lại để chúc mừng cô ấy. Mọi người cùng hát bài chúc mừng sinh nhật, ước nguyện và thổi nến. Tình bạn và sự quan tâm lẫn nhau này khiến tôi cảm thấy rất ấm áp. Thấy họ vui vẻ như vậy, tôi cũng cảm nhận được niềm hạnh phúc. Những khoảnh khắc đáng nhớ như thế này thật sự rất có ý nghĩa."], ["Câu 12 · Bài mẫu tham khảo", "在这张照片里，有三个年轻人在户外去旅游。他们背着很大的背包，看起来像是去爬山或者徒步。其中一个男生手里拿着地图，旁边的女生高兴地向远处指着，好像发现了好玩的地方。我觉得他们是一群喜欢旅行的好朋友，趁着周末一起去大自然放松心情。虽然爬山有点累，但是能和朋友在一起欣赏美丽的风景，大家都感到非常开心和满足。这种有意义的旅行能让我们的生活更加丰富多彩。", "Trong bức ảnh này, có ba người trẻ tuổi đang đi du lịch dã ngoại. Họ đeo những chiếc balo rất to, trông như đang đi leo núi hoặc đi bộ đường dài. Một bạn nam trong đó cầm bản đồ trên tay, cô gái bên cạnh thì vui vẻ chỉ tay về phía xa, hình như vừa phát hiện ra một nơi thú vị. Tôi nghĩ họ là một nhóm bạn thân thích đi du lịch, nhân cơ hội cuối tuần cùng nhau hòa mình vào thiên nhiên để thư giãn. Tuy leo núi hơi mệt nhưng được ngắm cảnh đẹp cùng bạn bè, ai nấy đều cảm thấy rất vui vẻ và mãn nguyện. Những chuyến đi ý nghĩa thế này giúp cuộc sống của chúng ta thêm phong phú và nhiều màu sắc."], ["Câu 13 · Bài mẫu tham khảo", "在我的生活中，我最想感谢的人是我的妈妈。因为无论遇到什么困难，妈妈总是第一个关心我、支持我的人。在我学习遇到挫折时，她会耐心鼓励我，让我不要放弃。在我生病的时候，她会细心照顾我，让我感到很安心。妈妈不仅教会我怎么做人，还用她的爱陪伴我成长。所以我非常感谢妈妈，我希望她每天都能健康快乐，以后我也要好好照顾她。", "Trong cuộc sống, người mà tôi muốn cảm ơn nhất là mẹ của tôi. Bởi vì dù gặp bất kỳ khó khăn gì, mẹ luôn là người đầu tiên quan tâm và ủng hộ tôi. Khi tôi gặp trắc trở trong học tập, mẹ luôn kiên nhẫn động viên để tôi không bỏ cuộc. Những lúc tôi bị ốm, mẹ chăm sóc tôi rất chu đáo khiến tôi cảm thấy vô cùng yên tâm. Mẹ không chỉ dạy tôi cách làm người mà còn dùng tình yêu thương để đồng hành cùng tôi trưởng thành. Vì vậy tôi rất biết ơn mẹ, tôi mong mẹ mỗi ngày đều khỏe mạnh, vui vẻ, sau này tôi cũng sẽ chăm sóc mẹ thật tốt."], ["Câu 14 · Bài mẫu tham khảo", "对自己现在的生活非常满意。首先，我的工作和学习都很顺利，每天都能学到新的知识，让我觉得自己一直在进步。其次，我的家人都很健康，朋友们对我非常好，大家经常聚在一起聊天、放松。虽然平时也会有一些工作和生活上的压力，但我认为这些压力能让我变得更好。总的来说，我的生活充满希望和阳光，我会继续努力，把生活过得越来越精彩。", "Tôi rất hài lòng với cuộc sống hiện tại của mình. Trước hết, công việc và việc học của tôi đều rất thuận lợi, mỗi ngày tôi đều học thêm được kiến thức mới, giúp tôi cảm thấy bản身 luôn tiến bộ. Thứ hai, gia đình tôi đều khỏe mạnh, bạn bè đối xử với tôi rất tốt, mọi người thường xuyên tụ họp trò chuyện, thư giãn. Mặc dù bình thường cũng có một chút áp lực từ công việc và cuộc sống, nhưng tôi cho rằng những áp lực đó giúp tôi trở nên tốt hơn. Tóm lại, cuộc sống của tôi tràn ngập hy vọng và ánh nắng, tôi sẽ tiếp tục cố gắng để sống một cuộc đời ngày càng tuyệt vời hơn."]]};</script>
