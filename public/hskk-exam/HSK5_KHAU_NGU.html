着车，小男孩小心地往前骑。第三张图里，爸爸已经松开了手，可是小男孩并不知道，他自己骑得越来越好。从这个故事可以看出，做任何事情都不能怕失败，只要坚持，就一定能成功。","Bố cục: mở đầu → diễn biến theo 3 tranh → bài học (不怕失败、坚持)."],["Câu 4 · 互联网的影响","我认为互联网对我的生活产生了很大的影响。首先，学习更方便了，我可以在网上查资料、上网课。其次，生活更方便了，购物、点外卖、付款都可以用手机完成。另外，通过社交软件，我能随时和远方的朋友联系。但是，互联网也有不好的地方，比如有些人上网时间太长，影响了健康和学习。所以，我们应该合理地使用互联网。","Hai mặt: tích cực (首先/其次/另外) → tiêu cực (但是) → kết luận (所以/应该)."],["Câu 5 · 活到老，学到老","“活到老，学到老”的意思是，一个人不管多大年纪，都应该不断学习。我非常同意这句话。现在社会发展得很快，新知识、新技术越来越多，如果不学习，就会跟不上时代。比如我的奶奶七十岁了，还在学用智能手机，现在她能和我视频聊天儿了。所以，学习不只是学生的事，而是一辈子的事。","Giải thích câu nói → đồng ý → lý do + ví dụ thực tế → kết luận (不只是……而是……)."]],"examName":"Đề mẫu","file":"HSK5_KHAU_NGU","qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat","question":"Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"3":{"type":"picture","question":"Câu 3: 看图说话 · Kể chuyện theo tranh","images":["img/hskk5_1.jpg","img/hskk5_2.jpg","img/hskk5_3.jpg"]},"4":{"type":"answer","question":"Câu 4: 你认为互联网对你的生活产生了哪些影响？","images":[]},"5":{"type":"answer","question":"Câu 5: 人们常说：“活到老，学到老。”你是怎么理解这句话的？请谈谈你的看法。","images":[]}},"timeline":[{"t":"play","a":0,"b":60.98},{"t":"win","d":10},{"t":"play","a":60.98,"b":63.2},{"t":"win","d":10},{"t":"play","a":63.2,"b":67.65},{"t":"win","d":10},{"t":"play","a":67.65,"b":121.49},{"t":"win","d":90},{"t":"play","a":121.49,"b":161.25},{"t":"win","d":90},{"t":"play","a":161.25,"b":179.14},{"t":"win","d":180},{"t":"play","a":179.14,"b":184.71},{"t":"win","d":120},{"t":"play","a":184.71,"b":197.85},{"t":"win","d":421},{"t":"play","a":197.85,"b":203.32},{"t":"win","d":150},{"t":"play","a":203.32,"b":208.42},{"t":"win","d":150},{"t":"play","a":208.42,"b":212.36}],"audio":"audio/hskk5.mp3"};</script>
