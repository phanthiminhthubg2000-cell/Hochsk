”，你是怎么看的？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 学习是一件快乐的事。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 校长办公室在三楼。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 他女儿很可爱，也很聪明。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 服务员，再来两杯啤酒。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 表演马上就要开始了。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 我们差不多有五年没联系了。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 他接受了我们的邀请。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 你看起来心情不错。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 请把这些材料整理一下。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 小王在管理方面比我有经验。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81209_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81209_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 请说说你有哪些优点。", "images": []}, "14": {"type": "answer", "question": "Câu 14: 人们常说“机会只留给有准备的人”，你是怎么看的？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 学习是一件快乐的事。<br>2. 校长办公室在三楼。<br>3. 他女儿很可爱，也很聪明。<br>4. 服务员，再来两杯啤酒。<br>5. 表演马上就要开始了。<br>6. 我们差不多有五年没联系了。<br>7. 他接受了我们的邀请。<br>8. 你看起来心情不错。<br>9. 请把这些材料整理一下。<br>10. 小王在管理方面比我有经验。", "1. Học tập là một việc vui vẻ. · 2. Văn phòng hiệu trưởng ở tầng ba. · 3. Con gái anh ấy rất đáng yêu, cũng rất thông minh. · 4. Phục vụ ơi, cho thêm hai cốc bia nữa. · 5. Buổi biểu diễn sắp bắt đầu rồi. · 6. Chúng tôi gần như năm năm rồi không liên lạc. · 7. Anh ấy đã chấp nhận lời mời của chúng tôi. · 8. Trông tâm trạng bạn có vẻ tốt đấy. · 9. Xin hãy sắp xếp lại những tài liệu này một chút. · 10. Tiểu Vương có kinh nghiệm hơn tôi về mặt quản lý."], ["Câu 11 · Bài mẫu tham khảo", "在这张图片中，有一位穿西装的女士。她一手拉着行李箱，一手看着手表，好像在等车或者等朋友。从她的表情可以看出，她有点着急，可能快要迟到了。<br><br>在生活中，我也遇到过类似的情况。有一次，我要去外地参加一个重要的会议。因为路上堵车，我差点儿没赶上飞机。当时我也像图中的女士一样，不停地看时间，心里非常担心。<br><br>为了避免这种情况，我们以后出门一定要提前做好准备，留出足够的时间。这样才不会手忙脚乱，影响自己的安排。", "Trong bức tranh này, có một người phụ nữ mặc bộ đồ công sở. Một tay cô ấy kéo vali, tay kia đang xem đồng hồ, hình như đang chờ xe hoặc chờ bạn. Từ nét mặt có thể thấy cô ấy hơi sốt ruột, có lẽ sắp muộn giờ rồi.\n\nTrong cuộc sống, tôi cũng từng gặp trường hợp tương tự. Có một lần, tôi phải đi công tác ở tỉnh khác để tham dự một cuộc họp quan trọng. Vì tắc đường nên tôi suýt nữa không kịp lên máy bay. Lúc đó tôi cũng giống như người phụ nữ trong tranh, liên tục nhìn thời gian, trong lòng rất lo lắng.\n\nĐể tránh tình huống này, sau này khi ra ngoài chúng ta nhất định phải chuẩn bị trước, dành ra đủ thời gian. Như vậy mới không bị cuống quít, làm ảnh hưởng đến kế hoạch của mình."], ["Câu 12 · Bài mẫu tham khảo", "这张图片展示了四个好朋友聚在一起看比赛的热闹场景。他们坐在沙发上，看着电视里的体育比赛。大家高举双臂，正在为喜欢的队伍加油，看起来非常开心和激动。<br><br>这让我想起了我和朋友们的周末生活。每次有重要的足球比赛，我们都会聚在其中一个人的家里，准备一些饮料和零食，一边看比赛一边聊天。赢球的时候，大家会高兴地跳起来。<br><br>我觉得，和朋友们一起看比赛不仅能放松心情，还能增进大家之间的感情。这样的时光真的很美好！", "Bức tranh này thể hiện cảnh tượng náo nhiệt của bốn người bạn thân tụ tập cùng nhau xem thi đấu. Họ ngồi trên ghế sofa, xem trận đấu thể thao trên tivi. Mọi người giơ cao hai tay, đang cổ vũ cho đội bóng mình yêu thích, trông rất vui vẻ và hào hứng.\n\nĐiều này làm tôi nhớ đến cuộc sống cuối tuần của tôi và bạn bè. Mỗi lần có trận bóng đá quan trọng, chúng tôi đều tụ tập tại nhà của một người, chuẩn bị một ít đồ uống và đồ ăn vặt, vừa xem vừa trò chuyện. Khi đội nhà thắng, mọi người sẽ vui sướng nhảy hẫng lên.\n\nTôi cảm thấy, cùng bạn bè xem thi đấu không chỉ giúp thư giãn tâm trạng mà còn tăng cường tình cảm giữa mọi người. Những khoảng thời gian như vậy thật là tuyệt vời!"], ["Câu 13 · Bài mẫu tham khảo", "每个人都有自己的优点，我觉得我最大的优点是性格随和、有耐心，而且喜欢帮助别人。<br><br>首先，在学习和工作中，我很有耐心。遇到困难时，我不会轻易放弃，而是会仔细分析问题，一步一步去解决。其次，我很乐意帮助别人。当朋友或同事需要帮助时，我总是主动去关照他们。因此，大家都很喜欢和我一起合作。<br><br>这些优点不仅让我交到了很多好朋友，也让我在工作和学习中取得了不错的成绩。未来我会继续努力，让自己变得更加优秀。", "Mỗi người đều có ưu điểm riêng, tôi cảm thấy ưu điểm lớn nhất của mình là tính cách hòa đồng, kiên nhẫn và thích giúp đỡ người khác.\n\nTrước hết, trong học tập và công việc, tôi rất kiên nhẫn. Khi gặp khó khăn, tôi sẽ không dễ dàng bỏ cuộc mà sẽ phân tích kỹ vấn đề, giải quyết từng bước một. Thứ hai, tôi rất sẵn lòng giúp đỡ người khác. Khi bạn bè hoặc đồng nghiệp cần hỗ trợ, tôi luôn chủ động quan tâm đến họ. Vì vậy, mọi người đều rất thích hợp tác cùng tôi.\n\nNhững ưu điểm này không chỉ giúp tôi kết giao được nhiều bạn tốt mà còn giúp tôi đạt được kết quả khá tốt trong công việc và học tập. Trong tương lai, tôi sẽ tiếp tục cố gắng để bản thân ngày càng hoàn thiện hơn."], ["Câu 14 · Bài mẫu tham khảo", "我非常同意“机会只留给有准备的人”这句话。在生活中，机会虽然很重要，但如果我们平时不做好准备，机会来了也抓不住。<br><br>举个例子，在求职或者考试时，那些平时认真学习、积累知识的人，才能在关键时刻表现好，获得成功。相反，如果不努力，就算遇到了好机会，也可能会白白浪费掉。<br><br>所以，我觉得我们平时应该不断提高自己，认真做好每一件事。只有这样，当机会降临时，我们才能牢牢抓住它，实现自己的目标。", "Tôi rất đồng ý với câu nói \"Cơ hội chỉ dành cho những người có chuẩn bị\". Trong cuộc sống, cơ hội tuy rất quan trọng, nhưng nếu bình thường chúng ta không chuẩn bị tốt thì khi cơ hội đến cũng không thể nắm bắt được.\n\nVí dụ, khi xin việc hoặc thi cử, những người bình thường chăm chỉ học tập, tích lũy kiến thức mới có thể thể hiện tốt vào thời điểm quan trọng và đạt được thành công. Nhuợc lại, nếu không nỗ lực, dù có gặp cơ hội tốt thì cũng có thể lãng phí mất.\n\nVì vậy, tôi nghĩ bình thường chúng ta nên không ngừng nâng cao bản thân, làm tốt từng việc một. Chỉ có như vậy, khi cơ hội đến, chúng ta mới có thể nắm chắc lấy nó và thực hiện được mục tiêu của mình."]]};</script>
