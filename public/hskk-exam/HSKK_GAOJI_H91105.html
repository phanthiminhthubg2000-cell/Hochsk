 {"k": "ans", "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.67}, {"t": "win", "d": 10}, {"t": "play", "a": 33.67, "b": 36.0}, {"t": "win", "d": 10}, {"t": "play", "a": 36.0, "b": 39.16}, {"t": "win", "d": 10}, {"t": "play", "a": 39.16, "b": 85.92}, {"t": "win", "d": 90}, {"t": "play", "a": 85.92, "b": 120.49}, {"t": "win", "d": 87}, {"t": "play", "a": 120.49, "b": 163.1}, {"t": "win", "d": 80}, {"t": "play", "a": 163.1, "b": 172.35}, {"t": "win", "d": 600}, {"t": "play", "a": 172.35, "b": 177.14}, {"t": "win", "d": 120}, {"t": "play", "a": 177.14, "b": 181.84}, {"t": "win", "d": 150}, {"t": "play", "a": 181.84, "b": 186.5}, {"t": "win", "d": 150}, {"t": "play", "a": 186.5, "b": 210.15}], "audio": "audio/hskkg_H91105.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "如果可以重新开始，你最想改变什么？", "6": "有人选择贷款买房，有人选择存款买房，你会选择哪种方式？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 在现实生活中，问题和办法是一对双胞胎兄弟。遇到问题，逃避不是办法，主动去解决问题才是唯一的出路。办法总比问题多，自我限制…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 如果可以重新开始，你最想改变什么？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 有人选择贷款买房，有人选择存款买房，你会选择哪种方式？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "有一天，一位画家向一位哲学家抱怨：“我真不明白，为什么我画一幅画只需要一天的功夫，可是卖掉它却要花整整一年的时间。”“请您倒过来试试吧。”哲学家认真地说，“要是您花一年的功夫去画它，那么您肯定只用一天就能卖掉它。”", "Ý chính: Họa sĩ phàn nàn với triết học gia vẽ tranh nhanh bán tranh chậm → Vẽ một bức tranh chỉ cần một ngày → Bán tranh lại phải mất một năm → Triết học gia khuyên thử làm ngược lại → Dành một năm công sức vẽ tranh thì một ngày là bán được"], ["Câu 2 · Lời đoạn nghe", "相信专家，有时候不如相信自己。一般人总认为投资成功与否，取决于一个人的预测能力。其实，所有的专家和你一样，都无法预测未来，也要承担投资的风险。要知道，“只赢不输”的投资方法是不存在的，你只是要尽力做到“多赢少输”而已。", "Ý chính: Tin chuyên gia không bằng tin chính mình → Đầu tư thành công phụ thuộc dự đoán là hiểu lầm → Chuyên gia cũng không thể dự đoán tương lai và chịu rủi ro → Phương pháp chỉ thắng không thua không tồn tại → Mục tiêu là đạt được thắng nhiều thua ít"], ["Câu 3 · Lời đoạn nghe", "孩子不听话，往往是因为家长和他接触的时间不够多，使孩子在心理上和家长产生了距离感。特别是处于青春期的孩子，性格比较叛逆，喜欢和父母对着干。因此，家长要做的不是强迫孩子听你的命令，而是尝试着走进孩子的内心世界。即使工作再忙，也应尽量多抽出一些时间和孩子在一起，陪孩子做一些他喜欢做的事，多跟他聊聊天，拉近与孩子的心理距离。", "Ý chính: Trẻ không nghe lời vì ít tiếp xúc sinh ra khoảng cách → Trẻ tuổi dậy thì nổi loạn thích đối đầu cha mẹ → Cha mẹ không nên ép buộc mà phải vào nội tâm con → Dành thời gian đồng hành và trò chuyện để rút ngắn khoảng cách"], ["Câu 4 · 朗读 · Đoạn văn", "在现实生活中，问题和办法是一对双胞胎兄弟。遇到问题，逃避不是办法，主动去解决问题才是唯一的出路。办法总比问题多，自我限制是走向最大的障碍，阻止你前进的真正对手是你自己。在许多情况下，“问题”只不过是人们逃避责任、回避努力的借口。但是，一个优秀的员工，总是坚持这样的理念：“不找借口找办法，办法总比问题多。”这是一个充满自信的理念，也是一个更具建设性、创造性的理念。世上有解决不了的问题，只有不会解决问题的人。任何问题只要被发现了，在认真分析后，总能找到相应的解决办法。一个会解决问题的人，可以在复杂的环境中掌握自己的命运，把不可能变为可能，最后实现自己的目标。", ""], ["Câu 5 · Bài mẫu tham khảo", "如果可以重新开始，我最想改变的是：更早地开始学习，更加珍惜时间。<br>上大学的时候，我觉得时间还很多，每天花很多时间玩游戏、看电视剧，学习只是为了应付考试。直到工作以后，我才发现自己会的东西太少了，很多机会都因为能力不够而错过了。比如公司需要会汉语的人，我当时一句也不会说，只能看着别的同事去中国出差。<br>如果能重新开始，我会在大学的时候就开始学汉语，多参加社团活动，多去实习，给自己积累更多的经验。我还会养成运动的习惯，因为健康是一切的基础。<br>不过，我也知道，过去的事情不能改变。与其后悔，不如从现在开始努力。所以我现在每天下班以后都坚持学习，周末去跑步。<br>我相信，什么时候开始都不晚，只要现在行动起来。", "Nếu được bắt đầu lại, điều tôi muốn thay đổi nhất là: bắt đầu học tiếng Trung sớm hơn và trân trọng thời gian hơn.\nLúc học đại học, tôi cảm thấy thời gian còn rất nhiều, mỗi ngày đều dành nhiều thời gian chơi game, xem phim truyền hình, việc học chỉ để đối phó với kỳ thi. Cho đến khi đi làm, tôi mới phát hiện những gì mình biết quá ít, rất nhiều cơ hội đã vụt mất vì năng lực không đủ. Ví dụ công ty cần người biết tiếng Trung, hồi đó tôi một câu cũng không nói được, chỉ đành nhìn các đồng nghiệp khác đi công tác Trung Quốc.\nNếu có thể bắt đầu lại, tôi sẽ học tiếng Trung ngay từ hồi đại học, tham gia nhiều hoạt động câu lạc bộ hơn, đi thực tập nhiều hơn, tích lũy cho bản thân nhiều kinh nghiệm hơn. Tôi cũng sẽ rèn thói quen tập thể dục, vì sức khỏe là nền tảng của mọi thứ.\nTuy nhiên, tôi cũng biết rằng chuyện quá khứ không thể thay đổi. Thay vì hối hận, chi bằng hãy nỗ lực từ bây giờ. Thế nên bây giờ ngày nào sau khi tan làm tôi cũng kiên trì học tập, cuối tuần thì đi chạy bộ.\nTôi tin rằng, bắt đầu lúc nào cũng không muộn, miễn là bây giờ hành động."], ["Câu 6 · Bài mẫu tham khảo", "关于贷款买房还是存款买房，我会选择一个折中的办法：先存一部分钱付首付，再适度地贷款。<br>全部存够钱再买房，虽然没有压力，但是速度太慢了。现在房价很高，靠一点一点存钱，可能要存一二十年，到那时候房价可能又涨了很多。而且，年轻人结婚、有孩子以后，需要一个稳定的家，等不了那么久。<br>贷款买房的好处是可以提前住上自己的房子。但是贷款也有风险，每个月要还很多钱，如果工作不稳定，或者家里突然需要用钱，压力就会非常大，生活质量也会下降。<br>所以我的做法是：先努力存钱，存够首付，然后贷款的金额要控制在自己能承受的范围内，比如每个月还款不超过收入的三分之一。<br>总之，买房是一件大事，一定要量力而行，不能为了房子而让自己的生活变得很辛苦。", "Về việc vay tiền mua nhà hay gửi tiết kiệm mua nhà, tôi sẽ chọn một phương án trung dung: tiết kiệm một phần để trả tiền đặt cọc trước, sau đó vay tiền một cách hợp lý.\nToàn bộ gửi tiết kiệm đủ tiền rồi mới mua nhà tuy không có áp lực, nhưng tốc độ quá chậm. Giá nhà hiện nay rất cao, dựa vào việc tích cóp từng chút một, có thể phải mất từ một đến hai mươi năm, đến lúc đó giá nhà có lẽ lại tăng lên rất nhiều. Hơn nữa, thanh niên sau khi kết hôn, có con, cần một mái ấm ổn định, không thể đợi lâu như vậy.\nƯu điểm của việc vay mua nhà là có thể sớm dọn vào ở nhà của chính mình. Nhưng vay tiền cũng có rủi ro, mỗi tháng phải trả rất nhiều tiền, nếu công việc không ổn định, hoặc gia đình đột nhiên cần tiền, áp lực sẽ rất lớn, chất lượng cuộc sống cũng sẽ giảm xuống.\nVì vậy, cách làm của tôi là: nỗ lực tiết kiệm tiền trước, tiết kiệm đủ tiền trả trước, sau đó số tiền vay phải được kiểm soát trong phạm vi bản thân có thể chịu đựng được, ví dụ như tiền trả góp mỗi tháng không vượt quá một phần ba thu nhập.\nTóm lại, mua nhà là một việc lớn, nhất định phải lượng sức mình, không thể vì ngôi nhà mà khiến cuộc sống của bản thân trở nên quá vất vả."]]};</script>
