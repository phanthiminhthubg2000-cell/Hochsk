, "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.67}, {"t": "win", "d": 10}, {"t": "play", "a": 33.67, "b": 36.0}, {"t": "win", "d": 10}, {"t": "play", "a": 36.0, "b": 39.16}, {"t": "win", "d": 10}, {"t": "play", "a": 39.16, "b": 95.52}, {"t": "win", "d": 81}, {"t": "play", "a": 95.52, "b": 144.31}, {"t": "win", "d": 73}, {"t": "play", "a": 144.31, "b": 183.14}, {"t": "win", "d": 83}, {"t": "play", "a": 183.14, "b": 192.39}, {"t": "win", "d": 600}, {"t": "play", "a": 192.39, "b": 197.18}, {"t": "win", "d": 120}, {"t": "play", "a": 197.18, "b": 201.88}, {"t": "win", "d": 150}, {"t": "play", "a": 201.88, "b": 206.54}, {"t": "win", "d": 150}, {"t": "play", "a": 206.54, "b": 230.14}], "audio": "audio/hskkg_H91107.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "如果你是老板，你希望雇佣什么样的员工？", "6": "对成功而言，能力和运气，哪个更重要？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 当你拥有6个苹果的时候，千万不要把它们都吃掉，因为把它们全吃掉，你也只能吃到一种味道，那就是苹果的味道。如果你把6个苹果…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 如果你是老板，你希望雇佣什么样的员工？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 对成功而言，能力和运气，哪个更重要？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "有一位老人从一座城市步行到了遥远的另一座城市。在克服重重困难到达目的地的时候，记者采访了他。记者问老人：在路途中是否曾经被困难吓倒过，他又是如何鼓起勇气走下来的。老人回答说：“走一步路是不需要勇气的，我所做的就是这样。先走一步，接着再走一步，然后再走一步，最后我就到这里了。”", "Ý chính: Ông cụ đi bộ đến thành phố khác. → Phóng viên phỏng vấn ông về việc vượt qua khó khăn. → Ông cụ trả lời đi một bước đường không cần dũng khí. → Bí quyết là đi một bước trước rồi lại đi một bước tiếp theo. → Câu chuyện dạy chúng ta chia nhỏ mục tiêu để hoàn thành."], ["Câu 2 · Lời đoạn nghe", "有一对双胞胎，他们都非常爱吃蛋糕。可是每次妈妈买回蛋糕分给他们吃时，他们总是会吵架，因为他们俩都觉得对方的那块儿蛋糕比自己的大。后来，妈妈想了一个办法：她让一个孩子将蛋糕分成两份，然后，让另外一个孩子从切好的蛋糕中先挑选一块儿。从此，这对双胞胎再也没有因为吃蛋糕而争吵过。", "Ý chính: Một cặp song sinh rất thích ăn bánh ngọt → Mỗi lần chia bánh hai đứa đều cãi nhau → Đều cảm thấy miếng bánh của đối phương to hơn → Mẹ nghĩ ra cách để một đứa cắt, một đứa chọn trước → Từ đó về sau hai đứa không còn cãi nhau nữa"], ["Câu 3 · Lời đoạn nghe", "只有自己做了父母，品尝到了养育生命的天伦之乐，你才会知道不做一回父母是多么大的损失。只有走进书籍的宝库，品尝到了与书中优秀灵魂交谈的乐趣，你才会知道不读好书是多么大的损失。世界上真正的好东西都是如此，你只有亲自去品尝，才会知道它们在人生中具有多么无可替代的价值。", "Ý chính: Làm cha mẹ mới biết không làm cha mẹ là tổn thất. → Đọc sách mới biết không đọc sách hay là tổn thất. → Thực tế những điều tốt đẹp đều cần tự mình nếm trải. → Tự mình nếm trải mới biết giá trị không thể thay thế."], ["Câu 4 · 朗读 · Đoạn văn", "当你拥有6个苹果的时候，千万不要把它们都吃掉，因为把它们全吃掉，你也只能吃到一种味道，那就是苹果的味道。如果你把6个苹果中的5个拿出来给别人吃，尽管表面上你失掉了5个苹果，但实际上你却得到了其他5个人的友情和好感。以后你还能得到更多，当别人有了别的水果的时候，也一定会和你分享，你会从这个人手里得到一个桔子，从那个人手里得到一个梨，最后你就可能获得6种不同的水果，6种不同的味道，6个人的友谊。你一定要学会用你拥有的东西去换取对你来说更加重要的东西。所以说，放弃是一种智慧。每一次放弃都会是一次升华，否则就不要放弃；每一次选择也都是一次升华，否则就不要选择。", ""], ["Câu 5 · Bài mẫu tham khảo", "如果我是老板，我希望雇用这样的员工。<br>第一，诚实可靠，有责任心。能力可以培养，但品德很难改变。一个诚实、负责的员工，不管做什么工作，我都能放心地交给他。如果一个人能力很强，但是不诚实，反而可能给公司带来很大的损失。<br>第二，积极主动，愿意学习。我不喜欢那种领导说一句才做一句的员工。我希望我的员工能主动发现问题、提出想法，而且愿意不断学习新的知识，跟上时代的发展。<br>第三，有团队精神。现在的工作很少是一个人能完成的，需要大家的配合。一个只考虑自己、不愿意帮助同事的人，即使能力再强，也会影响整个团队的气氛。<br>当然，作为老板，我也会尊重员工，给他们合理的待遇和发展的机会。<br>我相信，好员工和好老板是互相成就的。", "Nếu tôi là sếp, tôi hy vọng sẽ tuyển dụng được những nhân viên thế này.\nThứ nhất, trung thực đáng tin cậy và có tinh thần trách nhiệm. Năng lực có thể bồi dưỡng, nhưng phẩm đức thì rất khó thay đổi. Một nhân viên trung thực, có trách nhiệm, dù làm công việc gì, tôi cũng có thể yên tâm giao phó.\nThứ hai, tích cực chủ động và sẵn sàng học hỏi. Tôi không thích kiểu nhân viên sếp bảo một câu mới làm một câu. Tôi hy vọng nhân viên của mình có thể chủ động phát hiện vấn đề, đưa ra ý tưởng, lại còn sẵn sàng không ngừng học hỏi kiến thức mới, bắt kịp sự phát triển của thời đại.\nThứ ba, có tinh thần đồng đội. Công việc hiện nay rất ít khi chỉ do một người hoàn thành, mà cần sự phối hợp của mọi người. Một người chỉ biết nghĩ cho bản thân, không chịu giúp đỡ đồng nghiệp, dù năng lực có giỏi đến đâu, cũng sẽ ảnh hưởng đến bầu không khí của cả tập thể.\nĐương nhiên, với tư cách là sếp, tôi cũng sẽ tôn trọng nhân viên, cho họ đãi ngộ hợp lý và cơ hội phát triển.\nTôi tin rằng, nhân viên tốt và sếp tốt là thành tựu lẫn nhau."], ["Câu 6 · Bài mẫu tham khảo", "对成功而言，我认为能力更重要，运气只是锦上添花。<br>首先，能力是成功的基础。没有能力，即使运气好，得到了一个很好的机会，也把握不住。比如有人运气好，中了彩票，可是因为不会理财，几年以后又变得一无所有。而有能力的人，即使一开始运气不好，也能靠自己的努力慢慢成功。<br>其次，能力是可以通过努力提高的，而运气是我们无法控制的。与其等待好运，不如把时间花在提高自己上。<br>当然，我不否认运气的作用。有时候，在对的时间遇到对的人、对的机会，确实能让人更快地成功。但是，这些“好运”往往是留给有准备的人的。<br>所以，我的态度是：努力提高自己的能力，同时保持积极的心态。这样，当好运来的时候，我们就能稳稳地抓住它。", "Đối với thành công mà nói, tôi cho rằng năng lực quan trọng hơn, vận may chỉ là gấm thêu hoa.\nĐầu tiên, năng lực là nền tảng của thành công. Không có năng lực, dù vận may có tốt, có được một cơ hội rất tốt thì cũng không nắm bắt được. Ví dụ như có người vận may tốt trúng vé số, nhưng vì không biết quản lý tài chính, mấy năm sau lại trở về tay trắng. Trong khi đó, người có năng lực, dù ban đầu vận may không tốt, cũng có thể dựa vào sự nỗ lực của bản thân để từ từ thành công.\nThứ hai, năng lực có thể được nâng cao thông qua sự nỗ lực, trong khi vận may là thứ chúng ta không thể kiểm soát. Thay vì chờ đợi vận may, chi bằng dành thời gian để nâng cao bản thân.\nTất nhiên, tôi không phủ nhận vai trò của vận may. Đôi khi, gặp đúng người, đúng cơ hội vào đúng thời điểm quả thực có thể giúp con người thành công nhanh hơn. Tuy nhiên, những \"vận may\" này thường là dành cho những người có sự chuẩn bị.\nVì vậy, thái độ của tôi là: nỗ lực nâng cao năng lực của bản thân, đồng thời duy trì tâm态 tích cực. Như vậy, khi vận may đến, chúng ta có thể nắm bắt nó thật vững vàng."]]};</script>
