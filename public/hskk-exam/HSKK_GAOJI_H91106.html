part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.67}, {"t": "win", "d": 10}, {"t": "play", "a": 33.67, "b": 36.0}, {"t": "win", "d": 10}, {"t": "play", "a": 36.0, "b": 39.16}, {"t": "win", "d": 10}, {"t": "play", "a": 39.16, "b": 92.13}, {"t": "win", "d": 84}, {"t": "play", "a": 92.13, "b": 131.73}, {"t": "win", "d": 82}, {"t": "play", "a": 131.73, "b": 174.93}, {"t": "win", "d": 79}, {"t": "play", "a": 174.93, "b": 184.19}, {"t": "win", "d": 600}, {"t": "play", "a": 184.19, "b": 188.98}, {"t": "win", "d": 120}, {"t": "play", "a": 188.98, "b": 193.68}, {"t": "win", "d": 150}, {"t": "play", "a": 193.68, "b": 198.34}, {"t": "win", "d": 150}, {"t": "play", "a": 198.34, "b": 221.96}], "audio": "audio/hskkg_H91106.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "你觉得一个人成熟的标志有哪些？", "6": "你觉得第一印象重要吗？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 社交不是与你的亲戚或者朋友聊天儿，而是开发我们身边的泛泛之交。一项调查显示，在几百个职业人士中，56%的人不是通过招聘广…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 你觉得一个人成熟的标志有哪些？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 你觉得第一印象重要吗？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "一只老鼠掉进了米缸，每天吃了睡、睡了吃。有时，它也为是否要跳出米缸进行过思想斗争，但终未能摆脱大米的诱惑。直到有一天它发现米缸见了底，才意识到，以米缸现在的高度，自己就是想跳出去，也无能为力了。人们把老鼠能跳出缸外的高度称为“生命的高度”。", "Ý chính: Chuột rơi vào hũ gạo, ăn rồi ngủ. → Từng đấu tranh tư tưởng nhưng không thoát khỏi cám dỗ. → Đến khi hũ gạo cạn đáy, muốn nhảy ra cũng không kịp. → Độ cao nhảy ra được gọi là 'độ cao của sinh mệnh'."], ["Câu 2 · Lời đoạn nghe", "很多人都有这种感觉，当我们在做自己喜欢的事情时，很少感到疲倦。比如在一个假日里你到湖边去钓鱼，整整坐了十个小时，可你一点儿都不觉得累，因为钓鱼是你的兴趣所在，你从中享受到了快乐。产生疲倦的主要原因，是对某项工作特别厌烦，心理上的疲倦感往往比肉体上的体力消耗更让人难以支撑。", "Ý chính: Làm việc mình thích thì hiếm khi cảm thấy mệt mỏi → Ví dụ ngày nghỉ câu cá ngồi mười tiếng cũng không thấy mệt → Vì đó là sở thích và tận hưởng được niềm vui → Nguyên nhân chính gây mệt mỏi là do chán ghét công việc → Mệt mỏi tâm lý khó chống đỡ hơn tiêu hao thể lực"], ["Câu 3 · Lời đoạn nghe", "我们不妨去追求最好——最好的生活、最好的职业、最好的婚姻、最好的友谊，等等。但是，能否得到最好，取决于许多因素，不是光靠努力就能成功的。因此，如果我们尽了力，结果得到的不是最好，而是次好，甚至更差，我们也应该坦然地接受。人生本来就是有缺憾的，在人生中需要妥协。不肯妥协，和自己过不去，其实是对人生的无知。", "Ý chính: Chúng ta hoàn toàn có thể theo đuổi những điều tốt đẹp nhất → Có thành công hay không phụ thuộc vào nhiều yếu tố → Nỗ lực hết mình rồi thì nên thản nhiên chấp nhận kết quả kém hơn → Cuộc đời vốn có khiếm khuyết, cần học cách thỏa hiệp → Tự làm khó bản thân thực chất là sự thiếu hiểu biết về cuộc đời"], ["Câu 4 · 朗读 · Đoạn văn", "社交不是与你的亲戚或者朋友聊天儿，而是开发我们身边的泛泛之交。一项调查显示，在几百个职业人士中，56%的人不是通过招聘广告，而是通过他们的私人关系找到工作的。更有意思的是，90%的人称他们的这种私人关系不过是泛泛之交。换句话说，我们的下一次机会很有可能并不是来自我们好朋友，而是来自那些跟我们并不太熟的人。既然泛泛之交如此重要，为什么我们不多给自己一些时间，与至少可以相视一笑、打个招呼的朋友交往呢？所以，我们应该去创造新的社交关系，比如参加你们行业内部的活动，去认识公司中那些你平时不是每天都打交道的人，去参加慈善公益活动，等等，这些都会使你认识更多的人。", ""], ["Câu 5 · Bài mẫu tham khảo", "我觉得一个人成熟的标志，主要有以下几个方面。<br>第一，能控制自己的情绪。不成熟的人遇到一点儿不开心的事就发脾气，而成熟的人会冷静下来，先想办法解决问题。成熟不是没有情绪，而是不被情绪控制。<br>第二，为自己的行为负责。成熟的人做错了事情，不会找借口、推卸责任，而是勇敢地承认，并且想办法弥补。他们做决定之前也会考虑后果。<br>第三，懂得理解和包容别人。成熟的人知道每个人都有自己的难处，看问题的时候会站在别人的角度想一想，不会随便批评别人。<br>另外，我觉得成熟和年龄没有必然的关系。有的人年纪很大了还很幼稚，有的人很年轻就已经很成熟了。成熟是在经历中慢慢成长起来的。<br>总之，成熟的人，是能照顾好自己、也能为别人着想的人。", "Tôi nghĩ những dấu hiệu của sự trưởng thành ở một người chủ yếu bao gồm các mặt sau đây.\nThứ nhất, có thể kiểm soát được cảm xúc của bản thân. Người chưa trưởng thành gặp chút chuyện không vui là nổi giận, trong khi người trưởng thành sẽ bình tĩnh lại, trước tiên tìm cách giải quyết vấn đề. Trưởng thành không phải là không có cảm xúc, mà là không bị cảm xúc chi phối.\nThứ hai, chịu trách nhiệm cho hành vi của chính mình. Người trưởng thành làm sai việc sẽ không tìm lý do hay đùn đẩy trách nhiệm, mà sẽ dũng cảm nhận lỗi, đồng thời tìm cách khắc phục. Trước khi đưa ra quyết định, họ cũng sẽ cân nhắc hậu quả.\nThứ ba, biết thấu hiểu và bao dung người khác. Người trưởng thành biết rằng ai cũng có hoàn cảnh khó khăn riêng, khi nhìn nhận vấn đề sẽ đặt mình vào vị trí của người khác để suy nghĩ, không tùy tiện phê bình người khác.\nNgoài ra, tôi cảm thấy sự trưởng thành và tuổi tác không có mối quan hệ tất yếu. Có người tuổi đã lớn nhưng vẫn rất trẻ con, có người tuổi còn rất trẻ nhưng đã rất trưởng thành. Trưởng thành là tích lũy và lớn lên từ những trải nghiệm.\nTóm lại, người trưởng thành là người có thể chăm sóc tốt cho bản thân và cũng biết nghĩ cho người khác."], ["Câu 6 · Bài mẫu tham khảo", "我觉得第一印象非常重要，但它不是全部。<br>首先，第一印象会影响别人对我们的判断。心理学研究发现，人们见面后的几秒钟，就会形成对对方的基本印象，而且这种印象很难改变。比如面试的时候，如果你迟到了，或者穿得不整齐，面试官可能就会觉得你不认真，即使你能力很强，也可能失去机会。<br>但是，第一印象有时候并不准确。有的人第一次见面时很安静，看起来不好接触，可是相处久了才发现，他其实很热情、很幽默。如果只凭第一印象判断一个人，就可能错过一个好朋友。<br>所以我认为，一方面，我们自己要注意给别人留下好的第一印象，比如穿着得体、准时、有礼貌；另一方面，在看别人的时候，也不要只凭第一印象下结论，而要多接触、多了解。<br>总之，日久见人心，第一印象只是开始。", "Tôi nghĩ ấn tượng đầu tiên rất quan trọng, nhưng nó không phải là tất cả.\nTrước hết, ấn tượng đầu tiên sẽ ảnh hưởng đến phán đoán của người khác về chúng ta. Nghiên cứu tâm lý học đã phát hiện ra rằng, chỉ vài giây sau khi gặp nhau, mọi người đã hình thành ấn tượng cơ bản về đối phương, hơn nữa ấn tượng này rất khó thay đổi. Ví dụ như khi phỏng vấn, nếu bạn đến muộn, hoặc ăn mặc không gọn gàng, người phỏng vấn có thể sẽ cảm thấy bạn không nghiêm túc, cho dù năng lực của bạn rất giỏi, thì cũng có thể mất đi cơ hội.\nNhưng ấn tượng đầu tiên đôi khi lại không chính xác. Có người lần đầu gặp mặt rất yên tĩnh, trông có vẻ khó tiếp xúc, nhưng ở lâu mới phát hiện ra, hóa ra anh ấy rất nhiệt tình, rất hài hước. Nếu chỉ dựa vào ấn tượng đầu tiên để đánh giá một người, thì có thể sẽ bỏ lỡ một người bạn tốt.\nCho nên tôi cho rằng, một mặt, bản thân chúng ta phải chú ý để lại ấn tượng đầu tiên thật tốt cho người khác, ví dụ như ăn mặc lịch sự, đúng giờ, lễ phép; mặt khác, khi nhìn nhận người khác, cũng không nên chỉ dựa vào ấn tượng đầu tiên để đưa ra kết luận, mà cần tiếp xúc nhiều hơn, tìm hiểu nhiều hơn.\nTóm lại, đường dài mới biết ngựa hay, ấn tượng đầu tiên chỉ là sự khởi đầu."]]};</script>
