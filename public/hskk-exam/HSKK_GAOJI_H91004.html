s", "q": 4, "part": 1, "hint": "Đọc to, rõ, đúng thanh điệu; ngắt nghỉ theo dấu câu."}, {"k": "ans", "q": 5, "part": 2, "hint": ""}, {"k": "ans", "q": 6, "part": 2, "hint": ""}], "timeline": [{"t": "play", "a": 0.0, "b": 33.67}, {"t": "win", "d": 10}, {"t": "play", "a": 33.67, "b": 36.0}, {"t": "win", "d": 10}, {"t": "play", "a": 36.0, "b": 39.16}, {"t": "win", "d": 10}, {"t": "play", "a": 39.16, "b": 94.9}, {"t": "win", "d": 81}, {"t": "play", "a": 94.9, "b": 133.69}, {"t": "win", "d": 83}, {"t": "play", "a": 133.69, "b": 170.24}, {"t": "win", "d": 86}, {"t": "play", "a": 170.24, "b": 179.49}, {"t": "win", "d": 600}, {"t": "play", "a": 179.49, "b": 184.27}, {"t": "win", "d": 120}, {"t": "play", "a": 184.27, "b": 188.97}, {"t": "win", "d": 150}, {"t": "play", "a": 188.97, "b": 193.63}, {"t": "win", "d": 150}, {"t": "play", "a": 193.63, "b": 217.28}], "audio": "audio/hskkg_H91004.mp3", "answerQs": [1, 2, 3, 4, 5, 6], "qText": {"1": "听后复述", "2": "听后复述", "3": "听后复述", "4": "朗读", "5": "你觉得自己和父母那一代人有什么相同和不同的地方？", "6": "有人认为“沉默是金”，你怎么看？为什么？"}, "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后复述 · Nghe rồi thuật lại đoạn văn", "images": []}, "4": {"type": "read", "question": "Câu 4: 朗读 · 现代人最大的担忧不再是战争和饥饿，而是肥胖和运动不足。这种因为工作、学习繁忙和自身懒惰所造成的运动量的不足，正在变成一个…", "images": []}, "5": {"type": "answer", "question": "Câu 5: 你觉得自己和父母那一代人有什么相同和不同的地方？", "images": []}, "6": {"type": "answer", "question": "Câu 6: 有人认为“沉默是金”，你怎么看？为什么？", "images": []}}, "rubric": ["Phát âm, thanh điệu, ngữ điệu tự nhiên", "Thuật lại đủ ý chính và trình tự (phần 1)", "Đọc đúng chữ, ngắt nghỉ hợp lý, trôi chảy (phần 2)", "Quan điểm rõ, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp cao cấp, đa dạng, chính xác", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1 · Lời đoạn nghe", "有个盲人在夜晚走路的时候，手里总是提着一个灯笼，别人看见了就好奇地问：“你自己看不见，为什么还要提着灯笼走路？”盲人回答说：“我提灯笼可以为别人照路，为别人提供光明。这样一来，别人也容易看到我，不会撞到我了。”是的，很多时候，我们在帮助别人的同时，其实也是在帮助自己。", "Ý chính: Người mù đi đêm xách đèn lồng → Người khác tò mò hỏi tại sao xách đèn → Người mù nói để soi đường cho người và tránh va chạm → Giúp đỡ người khác cũng chính là giúp mình"], ["Câu 2 · Lời đoạn nghe", "现在互联网得到了很大的普及，网上出现了很多流行语，备受年轻人的追捧，年轻人在聊天对话时都会不时地用到。但是这些词语不能乱用，在一些正式场合或者与长辈交流时不宜使用这类词语，否则对方听不懂你在说什么，产生误会就不好了。", "Ý chính: Internet phổ biến, trên mạng xuất hiện nhiều từ lóng. → Giới trẻ rất săn đón khi trò chuyện. → Dịp trang trọng hoặc giao tiếp với người lớn không nên dùng. → Tránh đối phương không hiểu gây ra hiểu lầm."], ["Câu 3 · Lời đoạn nghe", "心理学家研究发现，人们在知道自己犯错误的时候，第一个反应往往是自我保护。所以，如果对犯错的人批评不当，不但没有效果，甚至会让他们彻底失去改正错误的勇气和信心。因此帮助他人改正错误的最好办法，就是让他明白自己的优点，然后引导他用自身的优点去改正错误。", "Ý chính: Khi phạm lỗi, phản ứng của con người thường là tự bảo vệ. → Phê bình không đúng cách không chỉ vô hiệu mà còn mất niềm tin. → Cách tốt nhất giúp sửa lỗi là làm họ hiểu rõ ưu điểm. → Hướng dẫn họ dùng ưu điểm của bản thân để sửa lỗi."], ["Câu 4 · 朗读 · Đoạn văn", "现代人最大的担忧不再是战争和饥饿，而是肥胖和运动不足。这种因为工作、学习繁忙和自身懒惰所造成的运动量的不足，正在变成一个隐形的杀手，威胁着人们的健康。医学界及运动界所公认的最佳有氧运动为：长跑、游泳，还有就是骑自行车。其中，骑自行车可以说是最简单易行而又十分有趣的。在过去，自行车被视为一种交通工具，而现在，对苦于无运动休闲机会的现代人来说，骑自行车则提供了一种非常好的健身机会，它的健身效用是其他各种先进的交通工具所不能比的。自行车运动是一种最能改善人们心肺功能的耐力性有氧运动，它不限时间，不限速度，随时随地，只要有辆自行车就可以达到锻炼的目的和效果。", ""], ["Câu 5 · Bài mẫu tham khảo", "我和父母那一代人，既有相同的地方，也有很多不同的地方。<br>相同的是，我们都重视家庭，都认为家人是最重要的。另外，父母很勤劳，我也继承了这一点，做事情从来不怕吃苦。<br>不同的地方主要有这么几点。第一，生活条件不一样。父母年轻的时候物质条件比较差，很多人连大学都上不了；而我们这一代条件好多了，有更多的机会去学习、去旅游，甚至出国留学。<br>第二，观念不一样。父母那一代人觉得找一份稳定的工作最重要，一份工作做一辈子；而我们更看重工作是不是有意思、能不能发展。在婚姻方面，父母觉得到了年龄就应该结婚，我们则更重视自己的选择。<br>第三，获取信息的方式不一样。父母主要看电视、看报纸，我们则主要通过手机和网络。<br>我觉得，两代人有不同是很正常的，重要的是互相理解、互相尊重。", "Tôi và thế hệ bố mẹ vừa có điểm giống nhau, lại vừa có rất nhiều điểm khác nhau.\nĐiểm giống nhau là chúng ta đều coi trọng gia đình, đều cho rằng người nhà là quan trọng nhất. Ngoài ra, bố mẹ rất chăm chỉ, tôi cũng kế thừa điểm này, làm việc chưa bao giờ sợ vất vả.\nNhững điểm khác nhau chủ yếu có mấy điểm sau. Thứ nhất, điều kiện sống không giống nhau. Thời trẻ của bố mẹ điều kiện vật chất khá kém, nhiều người đến đại học cũng không được học; còn thế hệ chúng ta điều kiện tốt hơn nhiều, có nhiều cơ hội hơn để học tập, đi du lịch, thậm chí là du học nước ngoài.\nThứ hai, quan niệm không giống nhau. Thế hệ bố mẹ cho rằng tìm được một công việc ổn định là quan trọng nhất, làm một công việc suốt đời; còn chúng ta coi trọng hơn việc công việc đó có thú vị không, có thể phát triển được không. Về mặt hôn nhân, bố mẹ cho rằng đến tuổi thì nên kết hôn, còn chúng ta thì coi trọng sự lựa chọn của bản thân hơn.\nThứ ba, cách thức thu thập thông tin không giống nhau. Bố mẹ chủ yếu xem ti vi, đọc báo, còn chúng ta chủ yếu thông qua điện thoại và mạng internet.\nTôi thấy thế hệ hai bên có sự khác biệt là rất bình thường, quan trọng là phải hiểu lẫn nhau, tôn trọng lẫn nhau."], ["Câu 6 · Bài mẫu tham khảo", "“沉默是金”的意思是，有时候不说话比说话更有价值。我觉得这句话有道理，但要看情况。<br>在有些情况下，沉默确实是金。比如，当我们对一件事情不太了解的时候，最好不要随便发表意见，以免说错话；当我们很生气的时候，也最好先沉默一会儿，因为冲动之下说的话往往会伤害别人，事后再后悔就来不及了。<br>但是，在另外一些情况下，沉默就不是金了。比如在工作中，你明明有好的想法，却不敢说出来，就可能错过机会；看到不公平的事情，如果大家都沉默，问题就永远得不到解决。和家人朋友之间，有什么想法也要及时沟通，一直憋在心里，反而会产生误会。<br>所以我认为，我们要学会该说的时候说，该沉默的时候沉默。这需要智慧，也需要在生活中慢慢积累经验。", "Ý nghĩa của câu \"im lặng là vàng\" là đôi khi không nói gì còn có giá trị hơn là nói ra. Tôi thấy câu nói này có lý, nhưng còn phải tùy từng trường hợp.\nTrong một số trường hợp, im lặng quả thực là vàng. Ví dụ, khi chúng ta không hiểu rõ về một sự việc nào đó, tốt nhất không nên tùy tiện bày tỏ ý kiến để tránh nói hớ; khi chúng ta rất tức giận, cũng tốt nhất nên im lặng một lúc, bởi vì những lời nói trong lúc bốc đồng thường sẽ làm tổn thương người khác, đến lúc hối hận thì đã muộn.\nTuy nhiên, trong một số trường hợp khác, im lặng lại không phải là vàng. Ví dụ trong công việc, rõ ràng bạn có ý tưởng hay nhưng lại không dám nói ra, thì có thể sẽ bỏ lỡ cơ hội; nhìn thấy những việc bất công, nếu ai cũng im lặng thì vấn đề sẽ mãi không được giải quyết. Giữa bạn bè và người thân với nhau, có suy nghĩ gì cũng phải kịp thời giao tiếp, cứ giữ nén trong lòng ngược lại sẽ sinh ra hiểu lầm.\nCho nên tôi cho rằng, chúng ta phải học cách lúc nên nói thì nói, lúc nên im lặng thì im lặng. Điều này cần có trí tuệ, và cũng cần tích lũy kinh nghiệm dần dần trong cuộc sống."]]};</script>
