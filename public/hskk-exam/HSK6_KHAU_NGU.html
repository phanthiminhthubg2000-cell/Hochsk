那天，几位医生认真地配合，手术进行得非常顺利。手术以后，医生和护士每天都来病房看望李奶奶，关心她的恢复情况。在大家的精心照顾下，李奶奶很快就康复出院了。回到家，孙女高兴地跑过去迎接她，一家人终于又团聚了。这个故事让我们感受到医生的责任心，也明白了健康的重要。","❶ khám & xem phim X-quang → ❷ phẫu thuật → ❸ chăm sóc sau mổ → ❹ xuất viện, đoàn tụ gia đình."],["Câu 4 · 我和父母那一代人","我和父母那一代人既有相同的地方，也有不同的地方。相同的是，我们都重视家庭，都希望通过努力过上更好的生活。不同的地方有很多：第一，成长环境不同，父母小时候物质条件比较差，而我们从小生活就比较富足；第二，获取信息的方式不同，他们主要看报纸、电视，我们更习惯用手机和互联网；第三，在择业和婚姻方面，我们的选择更自由。虽然有差异，但只要多沟通、互相理解，两代人就能相处得很好。","Cấu trúc 既……也……; 相同的是…… / 不同的是……; kết: 只要……就……."],["Câu 5 · 最好的投资就是投资自己","我赞成这个观点。投资自己就是不断提高自己的知识、能力和身体素质。第一，钱可能会花完，房子、股票的价格会变化，但学到的知识和能力永远属于自己。第二，一个人的能力越强，机会就越多，收入也会越高，这是最稳定的回报。第三，投资健康同样重要，有了好身体，才能更好地工作和生活。当然，投资自己也需要合理规划，不能盲目报班。总之，把时间和金钱用在提高自己上，是最值得的投资。","Nêu quan điểm → 3 luận điểm (第一/第二/第三) → bổ sung (当然) → 总之 kết luận."]],"examName":"Đề mẫu","file":"HSK6_KHAU_NGU","qMeta":{"1":{"type":"repeat","question":"Câu 1: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"2":{"type":"repeat","question":"Câu 2: 听后复述 · Nghe rồi thuật lại đoạn văn","images":[]},"3":{"type":"picture","question":"Câu 3: 看图说话 · Kể chuyện theo tranh","images":["img/hskk6_1.jpg","img/hskk6_2.jpg","img/hskk6_3.jpg","img/hskk6_4.jpg"]},"4":{"type":"answer","question":"Câu 4: 你觉得自己和父母那一代人有什么相同和不同的地方？","images":[]},"5":{"type":"answer","question":"Câu 5: 有人说“最好的投资就是投资自己”，你赞成这个观点吗？请说明理由。","images":[]}},"timeline":[{"t":"play","a":0,"b":57.93},{"t":"win","d":10},{"t":"play","a":57.93,"b":60.06},{"t":"win","d":10},{"t":"play","a":60.06,"b":64.52},{"t":"win","d":10},{"t":"play","a":64.52,"b":114.16},{"t":"win","d":90},{"t":"play","a":114.16,"b":151.74},{"t":"win","d":90},{"t":"play","a":151.74,"b":167.98},{"t":"win","d":180},{"t":"play","a":167.98,"b":173.12},{"t":"win","d":120},{"t":"play","a":173.12,"b":185.73},{"t":"win","d":420},{"t":"play","a":185.73,"b":191.19},{"t":"win","d":150},{"t":"play","a":191.19,"b":196.26},{"t":"win","d":150},{"t":"play","a":196.26,"b":200.08}],"audio":"audio/hskk6.mp3"};</script>
