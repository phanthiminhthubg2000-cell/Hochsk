Meta": {"1": {"type": "repeat", "question": "Câu 1: 听后重复 · 经理对他非常满意。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 生气不能解决问题。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 表演已经结束了。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 他的成绩提高得很快。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 您真是越来越年轻了。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 他有丰富的教学经验。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 决定了就不要后悔。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 这个活动由王小姐负责。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 我偶尔会去打打网球。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 别担心，一切都会好起来的。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H81107_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H81107_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 你喜欢唱歌吗？为什么？", "images": []}, "14": {"type": "answer", "question": "Câu 14: 有人说“过程比结果更重要”，你怎么看？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 经理对他非常满意。<br>2. 生气不能解决问题。<br>3. 表演已经结束了。<br>4. 他的成绩提高得很快。<br>5. 您真是越来越年轻了。<br>6. 他有丰富的教学经验。<br>7. 决定了就不要后悔。<br>8. 这个活动由王小姐负责。<br>9. 我偶尔会去打打网球。<br>10. 别担心，一切都会好起来的。", "1. 经理对他非常满意。 · 2. 生气不能解决问题。 · 3. 表演已经结束了。 · 4. 他的成绩提高得很快。 · 5. 您真是越来越年轻了。 · 6. 他有丰富的教学经验。 · 7. 决定了就不要后悔。 · 8. 这个活动由王小姐负责。 · 9. 我偶尔会去打打网球。 · 10. 别担心，一切都会好起来的。"], ["Câu 11 · Bài mẫu tham khảo", "大家下午好。请看第一张图片。图上是一个年轻的女孩，她刚刚跑过了终点线，正在高兴地举起双手庆祝胜利。她的脸上充满着激动和开心的笑容，身上穿着运动衣和短裤，脚上穿着运动鞋。这让我想起了上个月学校举办的运动会。那天天气非常好，我和同学们都去操场参加比赛。我报名参加了八百米长跑，跑最后一圈的时候，我特别累，几乎没有力气了。但是，路边的同学们一直在大声喊我的名字，为我加油。听到他们的声音，我突然有了力量，最后拼命冲过了终点线。同学们都跑过来祝贺我，那一刻我真的觉得特别骄傲和快乐。运动不仅能让我们拥有健康的身体，还能让我们体会到努力的意义。谢谢大家。", "Chào buổi chiều mọi người. Xin hãy xem bức ảnh đầu tiên. Trong hình là một cô gái trẻ, cô ấy vừa chạy qua vạch đích, đang vui vẻ giơ hai tay ăn mừng chiến thắng. Khuôn mặt cô ấy tràn ngập nụ cười kích động và vui sướng, mặc áo thể thao và quần đùi, chân đi giày thể thao. Điều này làm tôi nhớ đến đại hội thể thao do trường tổ chức tháng trước. Hôm đó thời tiết rất đẹp, tôi và các bạn cùng ra sân vận động tham gia thi đấu. Tôi đăng ký chạy bền tám trăm mét, khi chạy vòng cuối cùng, tôi cực kỳ mệt, hầu như không còn chút sức lực nào. Thế nhưng, các bạn bên lề đường vẫn luôn lớn gọi tên tôi, cổ vũ cho tôi. Nghe thấy tiếng của họ, tôi đột nhiên có thêm sức mạnh, cuối cùng liều mạng lao qua vạch đích. Các bạn đều chạy tới chúc mừng tôi, khoảnh khắc đó tôi thực sự cảm thấy vô cùng tự hào và hạnh phúc. Thể thao không chỉ giúp chúng ta có cơ thể khỏe mạnh, mà còn giúp chúng ta thấu hiểu ý nghĩa của sự nỗ lực. Cảm ơn mọi người."], ["Câu 12 · Bài mẫu tham khảo", "大家好。请看第二张图片。图上是一个年轻的女人，她正站在一面大镜子前面试穿衣服。她手里拿着一件黑色的衣服，看着镜子里的自己，好像在认真地考虑这件衣服合不合适。这让我想起了上个周末的事情。因为下个月我要去参加一个重要的面试，所以我决定去商场买一套新的正装。那天我在服装店看了很久，试了好几条裤子和几件外套。服务员态度非常好，一直帮我挑选合适的尺寸。最后，我选中了一套非常满意的西装。买完衣服以后，我还顺便和好朋友一起去吃了一顿丰盛的晚餐。虽然那天逛街逛得很累，但是买到了喜欢的东西，心里觉得特别满足。我觉得买衣服不仅是为了好看，更是为了在不同的场合能表现得更自信。谢谢大家。", "Xin chào mọi người. Xin hãy xem bức ảnh thứ hai. Trong hình là một người phụ nữ trẻ, cô ấy đang đứng trước một chiếc gương lớn để thử quần áo. Trên tay cô ấy cầm một bộ đồ màu đen, nhìn vào chính mình trong gương, giống như đang nghiêm túc suy nghĩ xem bộ đồ này có phù hợp hay không. Điều này làm tôi nhớ đến chuyện cuối tuần trước. Vì tháng sau tôi phải đi tham gia một buổi phỏng vấn quan trọng, nên tôi quyết định đến trung tâm thương mại mua một bộ trang phục chính thức mới. Hôm đó tôi xem ở cửa hàng quần áo rất lâu, thử mấy chiếc quần và mấy chiếc áo khoác. Thái độ nhân viên rất tốt, cứ luôn giúp tôi chọn kích cỡ phù hợp. Cuối cùng, tôi đã chọn được một bộ vest vô cùng ưng ý. Mua đồ xong, tôi còn tiện thể cùng bạn thân đi ăn một bữa tối thịnh soạn. Mặc dù hôm đó đi dạo phố rất mệt, nhưng mua được món đồ yêu thích, trong lòng cảm thấy vô cùng thỏa mãn. Tôi thấy mua quần áo không chỉ vì đẹp, mà còn để có thể thể hiện sự tự tin hơn trong các dịp khác nhau. Cảm ơn mọi người."], ["Câu 13 · Bài mẫu tham khảo", "我很喜欢唱歌。因为音乐有一种特别的魔力，可以在我开心的时候陪伴我，也在我难过的时候安慰我。平时在家里做饭或者打扫房间的时候，我总是习惯一边听音乐一边跟着哼唱几句。周末如果不用上班，我和朋友们经常会去KTV唱歌。在唱歌的过程中，我可以把平时工作和生活中的所有压力都释放出来，整个人都会变得轻松很多。而且，通过唱歌我还认识了很多志同道合的新朋友，大家一起分享各自喜欢的歌曲，生活变得更加丰富多彩了。总之，唱歌不仅是一种很好的爱好，也是我生活中不可缺少的一部分。谢谢。", "Tôi rất thích ca hát. Bởi vì âm nhạc có một loại ma lực đặc biệt, có thể đồng hành cùng tôi lúc vui, và cũng an ủi tôi lúc buồn. Bình thường ở nhà nấu cơm hay dọn phòng, tôi luôn có thói quen vừa nghe nhạc vừa ngân theo vài câu. Cuối tuần nếu không phải đi làm, tôi và các bạn thường hay đi quán karaoke hát. Trong quá trình ca hát, tôi có thể giải tỏa hết mọi áp lực trong công việc và cuộc sống hằng ngày, cả người sẽ trở nên nhẹ nhõm hơn nhiều. Hơn nữa, thông qua việc ca hát tôi còn quen được rất nhiều người bạn mới có cùng chí hướng, mọi người cùng chia sẻ những bài hát mình yêu thích, cuộc sống trở nên phong phú và nhiều màu sắc hơn. Tóm lại, ca hát không chỉ là một sở thích rất hay, mà còn là một phần không thể thiếu trong cuộc sống của tôi. Cảm ơn."], ["Câu 14 · Bài mẫu tham khảo", "对于“过程比结果更重要”这句话，我有着很深的感触。我认为结果虽然能给我们带来暂时的成功和喜悦，但真正让我们成长和改变的，往往是在实现目标过程中经历的那些困难和努力。比如我们准备一场重要的考试，拿到高分的那一刻当然让人非常高兴，但是在复习的过程中，我们每天早起晚归、克服种种难题、不断积累知识的这段经历，才是最宝贵的财富。即使最后没有取得理想的成绩，但在努力的过程中，我们学会了坚持，锻炼了能力，也发现了自己的不足。这些宝贵的经验会让我们在未来的日子里变得更加成熟和自信。所以，我们应该认真对待每一个过程，享受奋斗的每一天。谢谢。", "Đối với câu nói “quá trình quan trọng hơn kết quả”, tôi có cảm nhận rất sâu sắc. Tôi cho rằng kết quả tuy có thể mang lại cho chúng ta thành công và niềm vui tạm thời, nhưng thứ thực sự khiến chúng ta trưởng thành và thay đổi, thường là những khó khăn và nỗ lực đã trải qua trong quá trình thực hiện mục tiêu. Ví dụ như chúng ta chuẩn bị cho một kỳ thi quan trọng, khoảnh khắc đạt điểm cao đương nhiên khiến người ta rất vui mừng, nhưng trong quá trình ôn tập, trải nghiệm ngày nào cũng dậy sớm về muộn, khắc phục đủ loại nan đề, không ngừng tích lũy kiến thức mới chính là tài sản quý giá nhất. Cho dù cuối cùng không đạt được thành tích lý tưởng, nhưng trong quá trình nỗ lực, chúng ta đã học được sự kiên trì, rèn luyện năng lực, cũng phát hiện ra điểm thiếu sót của bản thân. Những kinh nghiệm quý giá này sẽ khiến chúng ta trở nên trưởng thành và tự tin hơn trong những ngày tháng tương lai. Cho nên, chúng ta nên đối đãi nghiêm túc với từng quá trình, tận hưởng từng ngày phấn đấu. Cảm ơn."]]};</script>
