": {"type": "repeat", "question": "Câu 1: 听后重复 · 他最近经常去爬山。", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后重复 · 我们打算下个月结婚。", "images": []}, "3": {"type": "repeat", "question": "Câu 3: 听后重复 · 今天图书馆不开门。", "images": []}, "4": {"type": "repeat", "question": "Câu 4: 听后重复 · 大家都很关心您的健康。", "images": []}, "5": {"type": "repeat", "question": "Câu 5: 听后重复 · 我们必须想个好办法。", "images": []}, "6": {"type": "repeat", "question": "Câu 6: 听后重复 · 会议材料已经准备好了。", "images": []}, "7": {"type": "repeat", "question": "Câu 7: 听后重复 · 中国是个多民族的国家。", "images": []}, "8": {"type": "repeat", "question": "Câu 8: 听后重复 · 请告诉我您的护照号码。", "images": []}, "9": {"type": "repeat", "question": "Câu 9: 听后重复 · 他给我留下了很深的印象。", "images": []}, "10": {"type": "repeat", "question": "Câu 10: 听后重复 · 我觉得这条裙子很适合你。", "images": []}, "11": {"type": "picture", "question": "Câu 11: 看图说话", "images": ["img/hskkz_H80000_11.jpg"]}, "12": {"type": "picture", "question": "Câu 12: 看图说话", "images": ["img/hskkz_H80000_12.jpg"]}, "13": {"type": "answer", "question": "Câu 13: 周末你一般是怎么安排的？", "images": []}, "14": {"type": "answer", "question": "Câu 14: 父亲或母亲过生日时，你想送他（她）什么礼物？", "images": []}}, "rubric": ["Nhắc lại đúng, đủ từng câu (phần 1)", "Phát âm, thanh điệu rõ ràng", "Tả tranh có nội dung, có liên tưởng (phần 2)", "Trả lời đúng trọng tâm, có lý do và ví dụ (phần 3)", "Từ vựng – ngữ pháp trung cấp, ít lỗi", "Nói liên tục, dùng hết thời gian"], "samples": [["Câu 1–10 · Lời ghi âm", "1. 他最近经常去爬山。<br>2. 我们打算下个月结婚。<br>3. 今天图书馆不开门。<br>4. 大家都很关心您的健康。<br>5. 我们必须想个好办法。<br>6. 会议材料已经准备好了。<br>7. 中国是个多民族的国家。<br>8. 请告诉我您的护照号码。<br>9. 他给我留下了很深的印象。<br>10. 我觉得这条裙子很适合你。", "1. Anh ấy dạo này thường xuyên đi leo núi. · 2. Chúng tôi dự định tháng sau kết hôn. · 3. Hôm nay thư viện không mở cửa. · 4. Mọi người đều rất quan tâm đến sức khỏe của bạn. · 5. Chúng ta phải nghĩ ra một cách hay. · 6. Tài liệu cuộc họp đã chuẩn bị xong rồi. · 7. Trung Quốc là một quốc gia đa dân tộc. · 8. Xin vui lòng cho tôi biết số hộ chiếu của bạn. · 9. Anh ấy đã để lại cho tôi ấn tượng rất sâu sắc. · 10. Tôi cảm thấy chiếc váy này rất hợp với bạn."], ["Câu 11 · Bài mẫu tham khảo", "这张照片拍的是一个公园。外面天气很好，有很多绿色的树。桌子旁边站着一男一女，他们看起来很年轻。男的穿着黑色的衣服，手里拿着一个粉红色的礼物盒。女的穿着粉红色的裙子，她用手捂着嘴巴，脸上露出了非常惊讶和高兴的表情。桌子上还有一个小篮子。我觉得可能是男的今天过生日，或者是他们有什么特别的纪念日。男的想给女的一个惊喜，所以送了她一个漂亮的礼物。女的看到以后特别开心。我觉得他们俩的感情一定非常好，生活也一定很幸福。", "Bức ảnh này chụp ở một công viên. Thời tiết bên ngoài rất đẹp, có rất nhiều cây xanh. Bên cạnh chiếc bàn có một nam một nữ đang đứng, họ trông còn rất trẻ. Người nam mặc áo đen, trên tay cầm một hộp quà màu hồng. Người nữ mặc váy hồng, cô ấy dùng tay che miệng, trên mặt lộ ra biểu cảm vô cùng kinh ngạc và vui mừng. Trên bàn còn có một chiếc giỏ nhỏ. Tôi nghĩ có thể hôm nay là sinh nhật của người nữ, hoặc họ có ngày kỷ niệm đặc biệt nào đó. Người nam muốn mang lại bất ngờ cho người nữ nên đã tặng cô ấy một món quà đẹp. Người nữ nhìn thấy xong thì vô cùng vui vẻ. Tôi nghĩ tình cảm của hai người họ chắc chắn rất tốt, cuộc sống cũng rất hạnh phúc."], ["Câu 12 · Bài mẫu tham khảo", "这张照片拍的是一条街道上。外面正在下雨，地上都是水。图上有一个年轻的女人，她穿着黑色的西装，手里撑着一把红色的雨伞。她正站在路边，把一只手举得高高的，好像在叫车。她的表情看起来有点着急，可能是要快点去上班，或者有重要的事情。背景里可以看到一辆蓝色的轿车和一辆红色的公交车，车上的灯都亮着。我觉得出门遇到下雨天真的很不方便，特别是想坐车的时候很难找到空车。希望这个女人能快点坐上车，别被雨淋湿了，也希望她今天的工作一切顺利。", "Bức ảnh này chụp trên một con đường. Bên ngoài trời đang mưa, mặt đất đều có nước. Trong hình có một người phụ nữ trẻ, cô ấy mặc bộ vest màu đen, trên tay cầm một chiếc ô màu đỏ. Cô ấy đang đứng ven đường, giơ cao một tay, giống như đang gọi xe. Biểu cảm của cô ấy trông có vẻ hơi sốt ruột, có lẽ là phải đi làm nhanh, hoặc có việc quan trọng. Ở hậu cảnh có thể nhìn thấy một chiếc ô tô màu xanh và một chiếc xe buýt màu đỏ, đèn trên xe đều bật sáng. Tôi nghĩ ra ngoài gặp trời mưa thực sự rất bất tiện, đặc biệt là khi muốn bắt xe thì rất khó tìm xe trống. Hy vọng người phụ nữ này có thể nhanh chóng bắt được xe, không bị mưa ướt, và cũng chúc công việc hôm nay của cô ấy mọi thứ thuận lợi."], ["Câu 13 · Bài mẫu tham khảo", "我的周末一般安排得比较丰富。星期六早上我通常会睡个懒觉，八点多起床吃早饭。然后我会把房间打扫干净，洗洗衣服。下午我喜欢和朋友一起去外面逛街、喝咖啡，或者去电影院看最近上映的好电影。星期天我一般留在家里面休息。我会在网上买一周需要吃的菜，自己做一顿好吃的午饭。吃过饭以后，我会看看书，或者听听音乐，放松一下心情。有时候天气好的话，我也会去公园跑步或者散步。我觉得周末的时间过得总是特别快，但是能做自己喜欢的事情，心里就觉得很开心，也为下一周的工作做好了准备。", "Cuối tuần của tôi thường được sắp xếp khá phong phú. Sáng thứ bảy tôi thường ngủ nướng một chút, hơn tám giờ dậy ăn sáng. Sau đó tôi sẽ dọn dẹp phòng cửa sạch sẽ, giặt quần áo. Buổi chiều tôi thích cùng bạn bè ra ngoài đi dạo phố, uống cà phê, hoặc đến rạp chiếu phim xem những bộ phim hay mới công chiếu. Chủ nhật tôi thường ở nhà nghỉ ngơi. Tôi sẽ mua rau cần ăn trong tuần trên mạng, tự nấu một bữa trưa ngon lành. Ăn cơm xong, tôi sẽ đọc sách, hoặc nghe nhạc, thư giãn tâm trạng. Thỉnh thoảng thời tiết đẹp, tôi cũng sẽ đến công viên chạy bộ hoặc đi dạo. Tôi cảm thấy thời gian cuối tuần trôi qua luôn rất nhanh, nhưng có thể làm những việc mình thích, trong lòng liền cảm thấy rất vui, cũng đã chuẩn bị sẵn sàng cho công việc của tuần tới."], ["Câu 14 · Bài mẫu tham khảo", "如果父亲或母亲过生日，我想送他们一份特别的礼物。因为他们年纪大了，身体健康对我来说是最重要的。所以，我最想送他们一套好用的按摩椅，这样他们每天在家看电视或者休息的时候，都可以用按摩椅按按摩，放松一下僵硬的肌肉，缓解身体的疲劳。除了按摩椅，我还会亲手给他们做一个好吃的生日蛋糕，再送上一束鲜花，对他们说一声生日快乐。平时因为工作忙，陪他们的时间比较少，所以过生日的时候，我一定要亲自回家陪他们吃顿饭，跟他们多聊聊天。看到他们脸上的笑容，我就觉得所有的努力都是值得的，希望父母能够一直健康、快乐。", "Nếu bố hoặc mẹ qua sinh nhật, tôi muốn tặng họ một món quà đặc biệt. Bởi vì họ lớn tuổi rồi, sức khỏe là quan trọng nhất đối với tôi. Vì vậy, tôi rất muốn tặng họ một bộ ghế mát-xa dễ dùng, như vậy mỗi khi họ ở nhà xem ti vi hoặc nghỉ ngơi, đều có thể dùng ghế mát-xa để mát-xa, thư giãn cơ bắp cứng đờ, giảm bớt mệt mỏi cơ thể. Ngoài ghế mát-xa ra, tôi còn tự tay làm cho họ một chiếc bánh sinh nhật ngon, lại tặng thêm một bó hoa tươi, nói với họ một câu chúc sinh nhật vui vẻ. Bình thường vì bận công việc, thời gian ở bên họ khá ít, cho nên lúc sinh nhật, tôi nhất định phải tự mình về nhà cùng họ ăn một bữa cơm, trò chuyện nhiều hơn với họ. Nhìn thấy nụ cười trên mặt họ, tôi liền cảm thấy mọi nỗ lực đều xứng đáng, hy vọng bố mẹ có thể luôn khỏe mạnh, vui vẻ."]]};</script>
