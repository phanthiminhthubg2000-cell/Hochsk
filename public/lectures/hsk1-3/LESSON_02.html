,posVi:"động từ",vi:"là",hv:"thị",en:"be",note:"Nối hai danh từ: <b>A 是 B</b> (A là B). Phủ định: <b>A 不是 B</b>.",ex:[["我是白家月。","Wǒ shì Bái Jiāyuè.","Mình là Bạch Gia Nguyệt."],["我是学生。","Wǒ shì xuéshēng.","Mình là học sinh."]]},"不":{sgk:7,link:"不是 · 不客气 (bài 1)",py:"bù",pos:"adv.",posVi:"phó từ",vi:"không",hv:"bất",en:"not; no",note:"Đặt <b>trước động từ / tính từ</b> để phủ định: 不是. Trước thanh 4 đọc thành <b>bú</b>: 不是 bú shì.",ex:[["我不是安妮。","Wǒ bú shì Ānnī.","Mình không phải là Annie."],["我不是老师。","Wǒ bú shì lǎoshī.","Mình không phải là giáo viên."]]},"对不起":{sgk:9,link:"→ đáp: 没关系 / 没事",py:"duìbuqǐ",pos:"v.",posVi:"động từ",vi:"xin lỗi",hv:"đối bất khởi",en:"sorry",note:"不 ở giữa đọc <b>thanh nhẹ</b>: duìbuqǐ. Đáp lại bằng 没关系 hoặc 没事.",ex:[["——对不起！——没关系！","—Duìbuqǐ! —Méi guānxi!","—Xin lỗi! —Không sao!"]]},"没关系":{sgk:10,link:"đáp lại 对不起",py:"méi guānxi",pos:"",posVi:"cụm từ",vi:"không sao, không có gì",hv:"một quan hệ",en:"that's all right; never mind",note:"Câu đáp khi người khác xin lỗi. 系 đọc thanh nhẹ.",ex:[["——对不起！——没关系！","—Duìbuqǐ! —Méi guānxi!","—Xin lỗi! —Không sao!"]]},"没事":{sgk:11,link:"= 没关系 (khẩu ngữ)",py:"méishì",pos:"v.",posVi:"động từ",vi:"không sao, không việc gì",hv:"một sự",en:"it doesn't matter",note:"Cách nói thân mật trong khẩu ngữ, cũng hay nói lặp: <b>没事没事</b>.",ex:[["——对不起！——没事没事！","—Duìbuqǐ! —Méishì méishì!","—Xin lỗi! —Không sao đâu!"]]},"很":{sgk:12,link:"很 + 高兴",py:"hěn",pos:"adv.",posVi:"phó từ",vi:"rất",hv:"ngận",en:"very",note:"Đứng <b>trước tính từ</b>: 很高兴. Câu có vị ngữ là tính từ thường thêm 很, kể cả khi không nhấn mạnh “rất”.",ex:[["我很高兴。","Wǒ hěn gāoxìng.","Mình rất vui."],["很高兴认识你。","Hěn gāoxìng rènshi nǐ.","Rất vui được làm quen với bạn."]]},"高兴":{sgk:13,link:"很高兴",py:"gāoxìng",pos:"adj.",posVi:"tính từ",vi:"vui, vui mừng",hv:"cao hứng",en:"glad; happy",note:"Thường đi với 很: 很高兴.",ex:[["我很高兴。","Wǒ hěn gāoxìng.","Mình rất vui."]]},"认识":{sgk:14,link:"很高兴认识你",py:"rènshi",pos:"v.",posVi:"động từ",vi:"quen biết, làm quen",hv:"n )",note:"Nét móc xiên là nét đặc trưng của bộ này.",ex:[["成","chéng","thành"],["或","huò","hoặc"],["战","zhàn","chiến"]]},"日":{name:"日字头",py:"rìzìtóu",hv:"Nhật",kx:"日 · bộ số 72",n:4,vi:"mặt trời, ngày",note:"Đứng trên viết dẹt, đứng bên trái viết hẹp. Chữ có bộ này thường liên quan đến thời gian, ánh sáng.",ex:[["明","míng","sáng"],["早","zǎo","sớm"],["时","shí","thời gian"]]},"寸":{name:"寸",py:"cùn",hv:"Thốn",kx:"寸 · bộ số 41",n:3,vi:"tấc (đơn vị đo)",note:"Gồm ngang, sổ móc và một chấm.",ex:[["导","dǎo","dẫn"],["封","fēng","phong (bì thư)"],["寺","sì","chùa"]]},"走":{name:"走字旁",py:"zǒuzìpáng",hv:"Tẩu",kx:"走 · bộ số 156",n:7,vi:"đi, chạy",note:"Viết 走 trước, nét mác kéo dài đỡ phần bên phải.",ex:[["走","zǒu","đi"],["赶","gǎn","đuổi kịp"],["超","chāo","vượt"]]},"氵":{name:"三点水",py:"sāndiǎnshuǐ",hv:"Thủy",kx:"水 · bộ số 85",n:3,vi:"nước",note:"Dạng của 水 khi đứng bên trái: chấm, chấm, hất. Chữ có bộ này thường liên quan đến nước.",ex:[["汉","hàn","Hán (汉语)"],["河","hé","sông"],["洗","xǐ","rửa"]]},"丷":{name:"两点",py:"liǎngdiǎn",hv:"Bát",kx:"八 · bộ số 12",n:2,vi:"tám, chia ra",note:"Dạng của 八 khi đứng trên đầu chữ.",ex:[["半","bàn","một nửa"],["单","dān","đơn"],["并","bìng","cùng"]]},"糸":{name:"糸字底",py:"mìzìdǐ",hv:"Mịch",kx:"糸 · bộ số 120",n:6,vi:"sợi tơ",note:"Đứng bên dưới viết 糸; đứng bên trái viết gọn thành 纟.",ex:[["紧","jǐn","chặt"],["累","lèi","mệt"],["素","sù","mộc mạc"]]},"亅":{name:"竖钩",py:"shùgōu",hv:"Quyết",kx:"亅 · bộ số 6",n:1,vi:"nét sổ móc",note:"Bộ thủ chỉ có 1 nét sổ móc.",ex:[["了","le","(trợ từ)"],["予","yǔ","cho"]]},"彳":{name:"双人旁",py:"shuāngrénpáng",hv:"Xích",kx:"彳 · bộ số 60",n:3,vi:"bước chân",note:"“Người kép”: phẩy, phẩy, sổ. Chữ có bộ này thường liên quan đến đi lại.",ex:[["往","wǎng","đi tới"],["行","xíng","đi; được"],["得","dé","được"]]},"高":{name:"高",py:"gāo",hv:"Cao",kx:"高 · bộ số 189",n:10,vi:"cao",note:"高 vừa là chữ vừa là bộ thủ. Rất ít chữ thường dùng mang bộ này.",ex:[]},"八":{name:"八字底",py:"bāzìdǐ",hv:"Bát",kx:"八 · bộ số 12",n:2,vi:"tám, chia ra",note:"Hai nét tá ình."]]}]};const LESSON=window.LESSON;LESSON.meta={no:"第2课",titleHtml:"<ruby>我<rt>Wǒ</rt></ruby><ruby>叫<rt>jiào</rt></ruby><ruby>李文<rt>Lǐ Wén</rt></ruby>",kicker:"HSK GARDEN · 新HSK教程 1",subtitle:"Giới thiệu tên · Xin lỗi · Trật tự câu cơ bản · Họ tên người Trung Quốc",footer:["HSK GARDEN","HSK 1 · LESSON 2","我叫李文"],printTitle:"HSK 1 · Bài 2 · 我叫李文 — Phiếu luyện viết chữ Hán",cards:[{id:"objModal",icon:"🎯",cn:"目标",vi:"Mục tiêu",sub:"Mục tiêu bài học",desc:"Hôm nay học gì, làm được gì sau buổi học"},{id:"t1Modal",icon:"🙋",cn:"课文一",vi:"Bài khoá 1",sub:"Hỏi tên",desc:"Trong lớp: 请问，你叫什么名字？"},{id:"t2Modal",icon:"😅",cn:"课文二",vi:"Bài khoá 2",sub:"Nhận nhầm người",desc:"Trong sân trường: 对不起！没关系！"},{id:"t3Modal",icon:"🤝",cn:"课文三",vi:"Bài khoá 3",sub:"Lần đầu gặp mặt",desc:"Làm quen: 很高兴认识你。"},{id:"pronModal",icon:"🔊",cn:"语音",vi:"Luyện phát âm",sub:"Luyện phát âm",desc:"Biến điệu 不, thanh nhẹ, âm q · r · z, 绕口令"},{id:"hwModal",icon:"📒",cn:"作业",vi:"Bài tập về nhà",sub:"Bài tập về nhà",desc:"Bài tập dạng HSK, sắp xếp câu, luyện viết"}]},LESSON.objectives=[["Tự giới thiệu bằng tên tiếng Trung","能听懂并使用中文姓名自我介绍。","请问，你叫什么名字？ — 我叫…… — 很高兴认识你。"],["Xin lỗi và đáp lại lời xin lỗi","能听懂并使用致歉语，用“对不起”和“没关系”表达歉意和回应。","对不起！ — 没关系！/ 没事！"],["Nắm trật tự câu cơ bản của tiếng Trung","掌握汉语的基本语序。","Chủ ngữ + Vị ngữ + Tân ngữ: 我叫陈天中。"],["Hiểu cấu tạo họ tên người Trung Quốc","了解中文姓名的构成。","姓 (họ) + 名 (tên): 李 + 文."],["Thuộc {nVocab} từ mới + 4 tên riêng, viết đúng {nChars} chữ Hán mới","","Nhận biết bộ thủ của từng chữ; đọc đúng biến điệu 不 và thanh nhẹ."]],LESSON.flow=["Bài khoá 1 — 请问，你叫什么名字？","Bài khoá 2 — 是 / 不是 · 对不起 / 没关系 · trật tự câu","Bài khoá 3 — 很高兴认识你 · 也 · họ tên người Trung Quốc","Luyện phát âm — biến điệu 不 &amp; 绕口令","Giao bài tập về nhà + phiếu luyện viết"],LESSON.grammar=({ex:n,rv:A,spk:c})=>({t1:`\n<div class="gram-card"><h3><span class="no">1</span>Hỏi tên và trả lời</h3>\n  <div class="formula"><span class="slot fix">你</span><span class="plus">+</span><span class="slot fix">叫</span><span class="plus">+</span><span class="slot fix">什么名字</span><span class="plus">？</span></div>\n  <div class="formula"><span class="slot fix">我</span><span class="plus">+</span><span class="slot fix">叫</span><span class="plus">+</span><span class="slot">tên</span><span class="plus">。</span></div>\n  <table class="compare"><tr><th>Hỏi</th><td class="zh">你 叫 <b>什么名字</b>？</td></tr><tr><th>Đáp</th><td class="zh">我 叫 <b>陈天中</b>。</td></tr></table>\n  <p><b>什么</b> đứng đúng chỗ của thông tin cần hỏi; câu trả lời chỉ cần thay 什么名字 bằng tên. Giống tiếng Việt: “Bạn tên là <b>gì</b>?” → “Mình tên là <b>Trung</b>.”</p>\n  <div class="ex-list">${n("你叫什么名字？","Nǐ jiào shénme míngzi?","Bạn tên là gì?")}${n("我叫陈天中。","Wǒ jiào Chén Tiānzhōng.","Mình tên là Trần Thiên Trung.")}</div>\n  <div class="warn">⚠️ Không đưa 什么 lên đầu câu như tiếng Anh: <s>什么你叫名字？</s></div>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>Hỏi lịch sự: 请问 + câu hỏi</h3>\n  <div class="formula"><span class="slot fix">请问</span><span class="plus">，</span><span class="slot">câu hỏi</span><span class="plus">？</span></div>\n  <p>Khi hỏi thầy cô, người lớn hoặc người lạ, nên thêm 请问 ở đầu và có thể dùng 您 (bài 1).</p>\n  <div class="ex-list">${n("请问，你叫什么名字？","Qǐngwèn, nǐ jiào shénme míngzi?","Cho mình hỏi, bạn tên là gì?")}${n("请问，您叫什么名字？","Qǐngwèn, nín jiào shénme míngzi?","Xin hỏi, cô tên là gì ạ?")}</div>\n</div>\n<div class="check"><div class="check-title">✅ Kiểm tra nhanh: nói bằng tiếng Trung</div>\n  <div class="qa">1. Xin hỏi, cô tên là gì ạ? → ${A("请问，您叫什么名字？")}</div>\n  <div class="qa">2. Mình tên là Lý Văn. → ${A("我叫李文。")}</div>\n</div>`,t2:`\n<div class="gram-card"><h3><span class="no">1</span>汉语的基本语序 · Trật tự câu cơ bản <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <div class="formula"><span class="slot">主语 Chủ ngữ</span><span class="plus">+</span><span class="slot">谓语 Vị ngữ</span><span class="plus">+</span><span class="slot">宾语 Tân ngữ</span></div>\n  <table class="compare"><tr><th>主语 Chủ ngữ</th><th>谓语 Vị ngữ</th><th>宾语 Tân ngữ</th></tr>\n    <tr><td class="zh">我</td><td class="zh">叫</td><td class="zh">陈天中。</td></tr>\n    <tr><td class="zh">你</td><td class="zh">叫</td><td class="zh">什么名字？</td></tr>\n    <tr><td class="zh">我</td><td class="zh">叫</td><td class="zh">白家月。</td></tr>\n    <tr><td class="zh">我</td><td class="zh">是</td><td class="zh">学生。</td></tr></table>\n  <p>Trật tự này <b>giống tiếng Việt</b>: Tôi (chủ ngữ) – tên là (vị ngữ) – Trung (tân ngữ).</p>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${n("你叫什么名字？","Nǐ jiào shénme míngzi?","Bạn tên là gì?")}${n("我叫白家月。","Wǒ jiào Bái Jiāyuè.","Mình tên là Bạch Gia Nguyệt.")}${n("我是学生。","Wǒ shì xuéshēng.","Mình là học sinh.")}</div></div>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>A 是 B / A 不是 B</h3>\n  <div class="formula"><span class="slot">A</span><span class="plus">+</span><span class="slot fix">是</span><span class="plus">+</span><span class="slot">B</span></div>\n  <div class="formula"><span class="slot">A</span><span class="plus">+</span><span class="slot fix">不是</span><span class="plus">+</span><span class="slot">B</span></div>\n  <div class="ex-list">${n("我是白家月。","Wǒ shì Bái Jiāyuè.","Mình là Bạch Gia Nguyệt.")}${n("我不是安妮。","Wǒ bú shì Ānnī.","Mình không phải Annie.")}${n("我不是老师，我是学生。","Wǒ bú shì lǎoshī, wǒ shì xuéshēng.","Mình không phải giáo viên, mình là học sinh.")}</div>\n  <div class="warn">⚠️ 不 luôn đứng <b>trước</b> 是: nói 我不是…, không nói <s>我是不…</s>. 不是 đọc là <b>bú shì</b>.</div>\n</div>\n<div class="gram-card"><h3><span class="no">3</span>Xin lỗi và đáp lại</h3>\n  <div class="formula"><span class="slot fix">对不起</span><span class="plus">→</span><span class="slot fix">没关系 / 没事</span></div>\n  <table class="compare"><tr><th>Nói</th><th>Đáp</th><th>Sắc thái</th></tr>\n    <tr><td class="zh">对不起！</td><td class="zh">没关系！</td><td>dùng được mọi lúc</td></tr>\n    <tr><td class="zh">对不起！</td><td class="zh">没事！/ 没事没事！</td><td>thân mật, khẩu ngữ</td></tr></table>\n</div>\n<div class="check"><div class="check-title">✅ Kiểm tra nhanh</div>\n  <div class="qa">1. Mình không phải là giáo viên. → ${A("我不是老师。")}</div>\n  <div class="qa">2. Sắp xếp: 是 / 我 / 学生 → ${A("我是学生。")}</div>\n  <div class="qa">3. Đáp lại 对不起！ → ${A("没关系！/ 没事！")}</div>\n</div>`,t3:`\n<div class="gram-card"><h3><span class="no">1</span>Họ tên người Trung Quốc: 姓 + 名</h3>\n  <table class="compare"><tr><th>Họ tên</th><th>姓 Họ</th><th>名 Tên</th><th>Hán Việt</th></tr>\n    <tr><td class="zh">李文</td><td class="zh">李</td><td class="zh">文</td><td>Lý Văn</td></tr>\n    <tr><td class="zh">白家月</td><td class="zh">白</td><td class="zh">家月</td><td>Bạch Gia Nguyệt</td></tr>\n    <tr><td class="zh">陈天中</td><td class="zh">陈</td><td class="zh">天中</td><td>Trần Thiên Trung</td></tr>\n    <tr><td class="zh">王一飞</td><td class="zh">王</td><td class="zh">一飞</td><td>Vương Nhất Phi</td></tr></table>\n  <p>Giống người Việt: <b>họ đứng trước, tên đứng sau</b>. Gọi thầy cô bằng <b>họ + 老师</b>: 王老师 (bài 1).</p>\n  <div class="tip-box" style="margin-top:8px">💡 <b>Hoạt động:</b> Tra tên tiếng Trung của em. Ví dụ: Nguyễn → 阮 Ruǎn, Trần → 陈 Chén, Lê → 黎 Lí, Phạm → 范 Fàn.</div>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>很 + tính từ</h3>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">很</span><span class="plus">+</span><span class="slot">tính từ</span></div>\n  <div class="ex-list">${n("我很高兴。","Wǒ hěn gāoxìng.","Mình rất vui.")}${n("很高兴认识你。","Hěn gāoxìng rènshi nǐ.","Rất vui được làm quen với bạn.")}</div>\n  <p>Câu có vị ngữ là tính từ thường thêm 很, kể cả khi không thật sự nhấn mạnh “rất”.</p>\n</div>\n<div class="gram-card"><h3><span class="no">3</span>Phó từ 也 (cũng)</h3>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">也</span><span class="plus">+</span><sp   function mark(q,ok){q.d=true;q.ok=ok;q.el.classList.add("done");scoreUpd();}
  function playBtn(text){return '<button type="button" class="hx-play" data-hxsay="'+esc(text)+'">▶ Nghe</button>';}
  function head(n,inner){return '<div class="hd"><span class="num">'+n+'</span>'+inner+'</div>';}
  var num=0;
  /* chọn 1 đáp án */
  function choice(host,n,headHtml,opts,right,script,imgMode){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+opts.map(function(o,i){return '<button type="button" class="hx-opt'+(imgMode?" imgopt":"")+'" data-i="'+i+'"><b>'+LET[i]+'</b>'+(imgMode?'<img src="'+img(o)+'" alt="Tranh '+LET[i]+'">':esc(o))+'</button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  /* nối với chữ cái (tranh / câu trả lời) */
  function letters(host,n,headHtml,count,right,script){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+LET.slice(0,count).split("").map(function(c,i){return '<button type="button" class="hx-opt" data-i="'+i+'"><b style="margin:0">'+c+'</b></button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  function block(host,title,req){var b=document.createElement("div");b.className="hw-block";b.innerHTML='<h3>'+title+'</h3><div class="req">'+req+'</div>';host.appendChild(b);return b;}
  function legend(b,keys){var g=document.createElement("div");g.className="hx-legend";g.innerHTML=keys.map(function(k,i){return '<figure><img src="'+img(k)+'" alt="Tranh '+LET[i]+'"><figcaption>'+LET[i]+'</figcaption></figure>';}).join("");b.appendChild(g);}
  function dlg(s){return esc(s).split("|").join("<br>");}
  function legendFor(items,extra){var keys=[];items.forEach(function(it){if(keys.indexOf(it[1])<0)keys.push(it[1]);});
    (extra||[]).forEach(function(k){if(keys.indexOf(k)<0&&img(k))keys.push(k);});return shuf(keys);}
  var lv=X.lv||1;
  /* ---- dựng tab ---- */
  function scoreBar(host){var s=document.createElement("div");s.className="hx-score";s.innerHTML='<span>📝 Đề luyện HSK '+lv+' (dạng đề 3.0)</span><span class="t"></span><div class="bar"><i></i></div><button type="button" data-hxreset>↻ Làm lại</button>';host.appendChild(s);}
  function build(){
    Q=[];num=0;h2.innerHTML="";h3.innerHTML="";
    scoreBar(h2);
    var intro=document.createElement("div");intro.className="hw-block";intro.innerHTML='<h3>综合练习 · Đề luyện HSK '+lv+' (dạng đề HSK 3.0)</h3><div class="req">Câu hỏi soạn theo đúng các phần của đề thi HSK '+lv+' 3.0, dùng từ vựng và mẫu câu của bài này. Phần nghe dùng giọng đọc tự động: bấm <b>▶ Nghe</b> (có thể nghe lại). Chọn đáp án là chấm ngay; lời thoại hiện ra sau khi trả lời. Phần 阅读'+(lv>1?" và 书写":"")+' ở tab tiếp theo.</div>';h2.appendChild(intro);
    var band=document.createElement("div");band.className="hx-band";band.textContent="听力 · NGHE HIỂU";h2.appendChild(band);
    var pi=0;function pn(){return "第"+"一二三四五六"[pi++]+"部分";}
    /* nghe chọn tranh */
    if(useImg&&T.li&&T.li.length){var b=block(h2,pn()+" · Nghe, chọn tranh đúng","听录音，选出对应的图片。");
      T.li.forEach(function(it){var others=it[2]||shuf(IMGS.filter(function(k){return k!==it[1];})).slice(0,2);var opts=shuf([it[1]].concat(others));choice(b,++num,playBtn(it[0]),opts,opts.indexOf(it[1]),dlg(it[0]),true);});}
    /* HSK1: nghe câu chọn từ xuất hiện */
    if(lv===1&&T.lw&&T.lw.length){var b2=block(h2,pn()+" · Nghe câu, chọn từ có trong câu","听句子，选出句子中出现的词语。");
      T.lw.forEach(function(it){choice(b2,++num,playBtn(it[0]),it[1],it[2],dlg(it[0]));});}
    /* nghe hội thoại, nối tranh */
    if(useImg&&T.lm&&T.lm.length){var b3=block(h2,pn()+" · Nghe hội thoại, chọn tranh (mỗi tranh dùng 1 lần)","听对话，选出对应的图片。");var keys=legendFor(T.lm,T.lmx);legend(b3,keys);
      T.lm.forEach(function(it){letters(b3,++num,playBtn(it[0]),keys.length,keys.indexOf(it[1]),dlg(it[0]));});}
    /* nghe đoạn / hội thoại + câu hỏi */
    if(T.lq&&T.lq.length){var b4=block(h2,pn()+" · Nghe "+(lv===1?"một đoạn ngắn":"hội thoại")+" và câu hỏi, chọn đáp án","听"+(lv===1?"一段话":"对话")+"和问题，选出正确答案。");
      T.lq.forEach(function(it){choice(b4,++num,playBtn(it[0]+"|"+it[1]),it[2],it[3],dlg(it[0])+"<br><b>"+esc(it[1])+"</b>");});}
    /* ---------- 阅读 ---------- */
    scoreBar(h3);
    var bandR=document.createElement("div");bandR.className="hx-band";bandR.textContent="阅读 · ĐỌC HIỂU";h3.appendChild(bandR);pi=0;
    function rm(){if(useImg&&T.rm&&T.rm.length){var b=block(h3,pn()+" · Đọc câu, chọn tranh (mỗi tranh dùng 1 lần)","读句子，选出对应的图片。");var keys=legendFor(T.rm,T.rmx);legend(b,keys);
      T.rm.forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',keys.length,keys.indexOf(it[1]));});}}
    function rt(){if(T.rt&&T.rt[1].length){var b=block(h3,pn()+" · Chọn câu trả lời phù hợp","选择合适的答句。");var bk=document.createElement("div");bk.className="hx-bank";bk.style.flexDirection="column";bk.innerHTML=T.rt[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("");b.appendChild(bk);
      T.rt[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',T.rt[0].length,it[1]);});}}
    function rf(){if(T.rf&&T.rf[1].length){var b=block(h3,pn()+" · Chọn từ điền vào chỗ trống","选词填空。");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.rf[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");b.appendChild(bk);
      T.rf[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0]).replace("（ ）","（　）").split("|").join("<br>")+'</span>',T.rf[0].length,it[1]);});}}
    function rp(){if(T.rp&&T.rp.length){var b=block(h3,pn()+" · Đọc đoạn văn, chọn đáp án đúng","读一段话，选择正确答案。");
      T.rp.forEach(function(it){choice(b,++num,'<div><div class="hx-text">'+esc(it[0])+'</div><div class="hx-qs">'+esc(it[1])+'</div></div>',it[2],it[3]);});}}
    if(lv===1){rm();rt();rf();rp();}else{rm();rf();rt();rp();}
    /* ---------- 书写 (HSK2+) ---------- */
    if(lv>=2&&((T.wr&&T.wr[1].length)||(T.wc&&T.wc.length))){
      var bandW=document.createElement("div");bandW.className="hx-band";bandW.textContent="书写 · VIẾT";h3.appendChild(bandW);pi=0;
      if(T.wr&&T.wr[1].length){var bw=block(h3,pn()+" · Chọn bộ phận còn thiếu của chữ","选择合适的部件，组成正确的词语。(Mỗi từ có một chữ bị thiếu một bộ phận.)");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.wr[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");bw.appendChild(bk);
        T.wr[1].forEach(function(it){letters(bw,++num,'<span class="hx-text">'+esc(it[0])+'</span> <small style="color:var(--muted)">'+esc(it[1])+'</small>',T.wr[0].length,it[2],"→ "+esc(it[3]));});}
      if(T.wc&&T.wc.length){var bc=block(h3,pn()+" · Viết chữ Hán còn thiếu","写汉字。(Gõ chữ còn thiếu vào ô rồi bấm Kiểm tra.)");
        T.wc.forEach(function(it){var el=document.createElement("div");el.className="hx-q";var n=++num;
          el.innerHTML=head(n,'<span class="hx-text">'+esc(it[0]).replace("（ ）",'（<input class="hx-in" maxlength="2" aria-label="Chữ còn thiếu">）')+'</span> <button type="button" class="hx-play" data-hxchk>Kiểm tra</button> <span class="res"></span>')+(it[2]?'<div class="hx-script">'+esc(it[2])+'</div>':"");
          bc.appendChild(el);var q=reg(el);var inp=$("input",el);
          $("[data-hxchk]",el).addEventListener("click",function(){if(q.d||!inp.value.trim())return;var ok=inp.value.trim()===it[1];inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".res",el).innerHTML=ok?'<span class="hx-ok">✓ Đúng</span>':'<span class="hx-no">✗ Đáp án: '+esc(it[1])+'</span>';mark(q,ok);});});}
    }
    scoreUpd();
  }
  build();
  var b2=$('.sub-tab-btn[data-sub="h2"]'),b3=$('.sub-tab-btn[data-sub="h3"]');
  if(b2)b2.textContent="2 · Đề HSK: 听力";if(b3)b3.textContent="3 · Đề HSK: 阅读"+(lv>1?" & 书写":"");
  document.addEventListener("click",function(e){var r=e.target.closest&&e.target.closest("[data-hxreset]");if(r){speechSynthesis&&speechSynthesis.cancel();build();}});
}
/* ---------- chung ---------- */
document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-hxsay]");if(s){e.stopPropagation();speak(s.getAttribute("data-hxsay"),s.classList.contains("hx-play")?s:null);return;}
  var a=e.target.closest&&e.target.closest("[data-hxall]");if(a){var box=a.closest(".hx-tr");var any=$$(".reveal:not(.shown)",box).length>0;$$(".reveal",box).forEach(function(r){if(any!==r.classList.contains("shown"))r.click();});a.textContent=any?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";return;}
  var rv=e.target.closest&&e.target.closest(".hx-tr .reveal");if(rv){var li=rv.closest("li");setTimeout(function(){li.classList.toggle("shown",rv.classList.contains("shown"));},0);}
},true);
})();
</script>
</body></html>
