<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 32 · 有时，不妨悲伤 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-32",num:32,book:"HSK 标准教程 6（下）",unit:{n:8,zh:"人体探秘",vn:"Khám phá cơ thể người"},title:"有时，不妨悲伤",vn:"Đôi lúc cũng nên buồn",chars:1264,source:"改编自《参考消息》同名文章",goals:["Đọc hiểu bài nghị luận 1264 chữ: quan niệm <b>“男儿有泪不轻弹”</b> là một sự trói buộc; nước mắt giúp giải tỏa cảm xúc; khóc cũng cần đúng mức; nỗi buồn giúp con người trưởng thành.","Dùng được 52 từ mới, nhất là nhóm <b>phẩm chất – hình tượng</b>: <span class='zh'>上进 · 抱负 · 魄力 · 开阔 · 榜样 · 脆弱 · 理智 · 健全 · 尊严</span> và nhóm <b>thái độ – cảm xúc</b>: <span class='zh'>背叛 · 鄙视 · 讥笑 · 束缚 · 宣泄 · 忌讳 · 狭隘 · 偏见 · 阻挠 · 理睬 · 抹杀</span>.","Nắm <span class='zh'>哪怕 · 反之</span>.","Phân biệt <span class='zh'>许可 — 允许</span>; làm quen <b>修辞 (8): 排比 — điệp cấu trúc</b>.","Viết 缩写 bài khóa ≈400 chữ; luyện đề 缩写 HSK6."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Đoạn 1–4 · 哪怕 · 反之"],["Buổi 2","Nhóm 3 · Đoạn 5–9 · 许可—允许 · 排比 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"起",name:"Chuẩn mực đàn ông",paras:"Đoạn 1–3",zh:"顶天立地 · 男儿有泪不轻弹",vn:"Xã hội đòi hỏi đàn ông mạnh mẽ, đầy trách nhiệm; từ nhỏ đã được dạy không được khóc, vì khóc là yếu đuối."},{tag:"承",name:"Sự trói buộc",paras:"Đoạn 4",zh:"束缚 · 反之，释放情绪",vn:"Đàn ông cũng là người bằng xương thịt; kìm nén lâu dài có hại, giải tỏa đúng cách mới bình tâm."},{tag:"转",name:"Khoa học về khóc",paras:"Đoạn 5–7",zh:"痛苦激素 · 忧伤肺 · 不超过15分钟",vn:"Nước mắt thải “hoóc-môn đau khổ”; Đông y: buồn hại phổi; nhưng đừng khóc quá 15 phút kẻo hại dạ dày."},{tag:"合",name:"Điều chỉnh suy nghĩ",paras:"Đoạn 8–9",zh:"扔掉偏见 · 痛苦沉淀出智慧",vn:"Bỏ định kiến; cảm xúc tiêu cực giúp hiểu mình; nỗi đau giúp trưởng thành và lắng đọng thành trí tuệ."}],warm1:{q:"中国有句俗话“男儿有泪不轻弹”，你同意吗？你觉得应该怎样面对悲伤？",vn:"Khi buồn, bạn thường làm gì? Bấm 有 (có) / 无 (không).",items:[["💬","找朋友聊天儿","Tìm bạn trò chuyện"],["✈️","去旅行","Đi du lịch"],["🛍️","购物","Mua sắm"],["🍰","吃东西","Ăn uống"]],talk:["你同意“男儿有泪不轻弹”吗？为什么？","你觉得应该怎样面对悲伤？"],link:"Tiếng Việt cũng có câu “Đàn ông không được khóc” — cùng quan niệm với <span class='zh'>男儿有泪不轻弹</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"正",rule:"正 = <b>ngay thẳng, đúng đắn</b>.",w:[["正直","zhèngzhí","chính trực (có trong bài)"],["正常","zhèngcháng","bình thường"],["正规","zhèngguī","chính quy"],["正经","zhèngjing","đứng đắn"],["正路","zhènglù","con đường đúng"],["正派","zhèngpài","đứng đắn"],["正气","zhèngqì","chính khí"],["正确","zhèngquè","đúng"],["正式","zhèngshì","chính thức"],["正义","zhèngyì","chính nghĩa"],["公正","gōngzhèng","công bằng"],["真正","zhēnzhèng","thực sự"]]},{k:"进",rule:"进 = <b>tiến lên</b>.",w:[["上进","shàngjìn","cầu tiến (từ mới)"],["促进","cùjìn","thúc đẩy"],["前进","qiánjìn","tiến lên"],["先进","xiānjìn","tiên tiến"],["增进","zēngjìn","tăng cường"],["进步","jìnbù","tiến bộ"],["进程","jìnchéng","tiến trình"],["进度","jìndù","tiến độ"],["进而","jìn'ér","tiến thêm"],["进化","jìnhuà","tiến hóa"],["进取","jìnqǔ","tiến thủ"],["进展","jìnzhǎn","tiến triển"],["进退","jìntuì","tiến lui"],["进行","jìnxíng","tiến hành"]]},{k:"视",rule:"视 = <b>nhìn, đối xử, coi</b>.",w:[["鄙视","bǐshì","khinh thường (từ mới)"],["敌视","díshì","thù địch"],["忽视","hūshì","coi nhẹ"],["轻视","qīngshì","xem nhẹ"],["重视","zhòngshì","coi trọng"],["无视","wúshì","phớt lờ"],["珍视","zhēnshì","trân trọng"],["正视","zhèngshì","nhìn thẳng"],["仇视","chóushì","căm ghét"],["蔑视","mièshì","miệt thị"],["藐视","miǎoshì","coi khinh"],["漠视","mòshì","thờ ơ"],["歧视","qíshì","phân biệt đối xử"]]},{k:"神",rule:"神 = <b>thần, thần linh</b>.",w:[["神仙","shénxiān","thần tiên (từ mới)"],["神话","shénhuà","thần thoại"],["神灵","shénlíng","thần linh"],["神人","shénrén","thần nhân"],["神明","shénmíng","thần minh"],["神像","shénxiàng","tượng thần"],["神学","shénxué","thần học"],["财神","cáishén","thần tài"],["山神","shānshén","thần núi"],["天神","tiānshén","thiên thần"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Chuẩn mực đàn ông",from:1,to:24},{name:"Nhóm 2 · Đoạn 4–6",sub:"Trói buộc & khoa học về khóc",from:25,to:40},{name:"Nhóm 3 · Đoạn 7–9",sub:"Khóc đúng mức & trưởng thành",from:41,to:52}],V:[[1,"背叛","bèipàn","đgt.","bội phản","phản bội",1,"","投向敌对方面，反对原来所在的方面。","不背叛朋友","他背叛了自己的祖国。","Hắn đã phản bội tổ quốc.",[],"Bài tập 3①. SBT câu 19C."],[2,"上进","shàngjìn","đgt.","thượng tiến","năng động, năng nổ, cầu tiến",1,"","向上；进步。","男人要上进","他是个积极上进的青年。","Anh ấy là thanh niên tích cực cầu tiến.",["上进心"],"Khởi động 2: nhóm chữ <span class='zh'>进</span>. Bài tập 3①."],[3,"抱负","bàofù","dt.","bão phụ","hoài bão, tham vọng, khát vọng",1,"","远大的志向。","有抱负，有魄力","他是个有抱负的年轻人。","Anh ấy là người trẻ có hoài bão.",[],""],[4,"魄力","pòlì","dt.","phách lực","tính quyết đoán, sự gan dạ và cương quyết",1,"","处理事情时所具有的胆识和果断的作风。","有抱负，有魄力","他办事很有魄力。","Anh ấy làm việc rất quyết đoán.",[],"Bài 28: <span class='zh'>气魄</span>."],[5,"开阔","kāikuò","tt.","khai khoát","cởi mở, khoáng đạt",1,"","（面积或空间）宽广；（思想、心胸）开朗。","心胸开阔","旅行可以开阔眼界。","Du lịch có thể mở rộng tầm mắt.",[],"Bài tập 3①."],[6,"处境","chǔjìng","dt.","xử cảnh","cảnh ngộ, hoàn cảnh",1,"","所处的境地（多指不利的情况下）。","处境艰难而不退缩","他现在的处境很困难。","Hoàn cảnh hiện nay của anh ấy rất khó khăn.",[],"SBT câu 21A."],[7,"打击","dǎjī","đgt.","đả kích","đả kích, công kích, đánh",1,"","攻击；使受到挫折。","面对打击而不脆弱","失败对他打击很大。","Thất bại là cú đánh lớn với anh ấy.",[],"Bài tập 3①."],[8,"脆弱","cuìruò","tt.","thúy nhược","yếu đuối, yếu ớt",1,"","禁不起挫折；不坚强。","面对打击而不脆弱","她的感情很脆弱。","Tình cảm cô ấy rất mong manh.",[],"Bài tập 3②."],[9,"榜样","bǎngyàng","dt.","bảng dạng","tấm gương, gương tốt",1,"","作为仿效的人或事例。","男人是生活中的榜样","父母是孩子的榜样。","Cha mẹ là tấm gương của con.",[],"Bài tập 3①. SBT câu 21D."],[10,"光彩","guāngcǎi","dt.","quang thái","ánh sáng chói lọi, vẻ rực rỡ huy hoàng, vẻ đẹp lộng lẫy",1,"","颜色和光泽；光荣。","光彩照人","她今天光彩照人。","Hôm nay cô ấy rạng rỡ.",["光彩照人"],"Bài tập 1: <span class='zh'>光芒 · 光亮 · 月光 · 星光</span>. SBT nghe câu 3."],[11,"理智","lǐzhì","tt.","lý trí","có lý trí",1,"","能辨别是非、利害关系以及控制自己行为。","理智的男子汉","遇事要冷静理智。","Gặp chuyện phải bình tĩnh lý trí.",[],"SBT câu 23A."],[12,"哭泣","kūqì","đgt.","khốc khấp","khóc sụt sùi, khóc thút thít",1,"","小声地哭。","再悲伤也不轻易哭泣","她一个人在房间里哭泣。","Cô ấy khóc thút thít một mình trong phòng.",[],"SBT câu 18C."],[13,"否决","fǒujué","đgt.","phủ quyết","phủ quyết, bác bỏ",1,"","否定（议案）。","会被一票否决","这个方案被否决了。","Phương án này bị bác bỏ.",["一票否决"],"Bài tập 1 (ví dụ): <span class='zh'>否认 · 否定 · 是否 · 可否</span>. SBT câu 20D."],[14,"出息","chūxi","dt.","xuất tức","tiền đồ, tương lai rực rỡ",1,"","发展前途或志气。","男人流泪就意味着软弱、没出息","这孩子将来一定有出息。","Đứa trẻ này sau này nhất định thành đạt.",["没出息"],""],[15,"娃娃","wáwa","dt.","oa oa","em bé",1,"","小孩儿。","从娃娃时代","教育要从娃娃抓起。","Giáo dục phải bắt đầu từ trẻ nhỏ.",[],"Bài tập 2①. SBT câu 20B."],[16,"潜移默化","qiányí-mòhuà","thành ngữ","tiềm di mặc hóa","biến đổi ngầm, thay đổi một cách vô tri vô giác, âm thầm",1,"成","指人的思想或性格受其他方面的感染而不知不觉地起了变化。","潜移默化地在起作用","父母对孩子的影响是潜移默化的。","Ảnh hưởng của cha mẹ với con cái là âm thầm.",[],"SBT câu 20A."],[17,"鞭策","biāncè","đgt.","tiên sách","thúc giục, giục giã",1,"","用鞭和策赶马；比喻督促。","被这样的古训鞭策着","老师的话一直鞭策着我。","Lời thầy luôn thúc giục tôi.",[],""],[18,"赋予","fùyǔ","đgt.","phú dữ","trao cho, giao phó",1,"","交给（重大任务、使命等）。","我们的文化赋予了男人……形象","时代赋予我们新的使命。","Thời đại trao cho chúng ta sứ mệnh mới.",[],"Bài tập 1: <span class='zh'>给予 · 赐予 · 予以 · 生杀予夺</span>."],[19,"扮演","bànyǎn","đgt.","phẫn diễn","sắm vai, đóng vai",1,"","化装成某种人物出场表演。","在生活中必须扮演强者","他在电影里扮演一位老师。","Anh ấy đóng vai một thầy giáo trong phim.",[],"SBT câu 9D."],[20,"鄙视","bǐshì","đgt.","bỉ thị","xem thường, khinh thường",1,"","轻视；看不起。","为了不被鄙视","大家都鄙视他的行为。","Mọi người đều khinh hành vi của hắn.",[],"Khởi động 2: nhóm chữ <span class='zh'>视</span>. Bài tập 1: <span class='zh'>藐视 · 电视 · 视觉 · 视线</span>; 2②."],[21,"讥笑","jīxiào","đgt.","cơ tiếu","chế nhạo, nhạo báng",1,"","讥讽和嘲笑。","不被讥笑","不要讥笑别人的缺点。","Đừng chế giễu khuyết điểm người khác.",[],"Bài tập 1: <span class='zh'>微笑 · 笑话 · 可笑 · 笑口常开</span>; 2③."],[22,"恶心","ěxin","tt.","ác tâm","làm ghê tởm, buồn nôn",1,"","要呕吐的感觉；令人厌恶。","远离那些恶心、不体面的词汇","我有点儿恶心。","Tôi hơi buồn nôn.",[],"SBT nghe 11–13."],[23,"体面","tǐmiàn","tt.","thể diện","vẻ vang, vinh dự, chỉnh tề",1,"","光荣；有面子；（相貌或样子）好看。","不体面的词汇","他穿得很体面。","Anh ấy ăn mặc rất tươm tất.",[],"SBT câu 23C."],[24,"含糊","hánhu","tt.","hàm hồ","mơ hồ, mập mờ",1,"","不明确；不清晰；马虎。","什么时候都不能含糊的","他说话含含糊糊的。","Anh ta nói năng ấp úng.",["毫不含糊"],"Bài 31: <span class='zh'>不能含糊</span> = không được qua loa."],[25,"束缚","shùfù","đgt.","thúc phược","ràng buộc, trói buộc",1,"","使受到约束限制。","社会文化赋予男人的一种束缚","不要被旧观念束缚。","Đừng bị quan niệm cũ trói buộc.",[],""],[26,"魔鬼","móguǐ","dt.","ma quỷ","ma quỷ",1,"","宗教或神话传说中指迷惑人、害人性命的鬼怪。","男人不是魔鬼","他是一个魔鬼。","Hắn là một con quỷ.",[],"SBT nghe câu 5."],[27,"神仙","shénxiān","dt.","thần tiên","thần tiên",1,"","神话中指能力非凡、长生不老的人。","也不是神仙","过着神仙般的日子。","Sống những ngày như thần tiên.",[],"Khởi động 2: nhóm chữ <span class='zh'>神</span>."],[28,"健全","jiànquán","tt.","kiện toàn","khỏe mạnh, hoàn thiện, hoàn hảo",1,"","（生理和心理）强健而没有缺陷；（事物）完善。","有健全情感的人","健全的人格。","Nhân cách lành mạnh.",[],"SBT câu 15A."],[29,"塌","tā","đgt.","tháp","đổ, sụp",1,"","（支架起来的东西）倒下或陷下。","有被压塌的时候","房子塌了。","Nhà sập rồi.",[],"SBT nghe câu 1: <span class='zh'>天塌不下来</span>."],[30,"反之","fǎnzhī","liên.","phản chi","trái lại, ngược lại",1,"","与此相反；反过来说。","反之，以适当的方式将情绪释放一下","努力就会进步，反之就会落后。","Cố gắng thì tiến bộ, ngược lại sẽ tụt hậu.",[],"Xem <b>Ngữ pháp: 反之</b>. Bài tập 2⑤."],[31,"激素","jīsù","dt.","kích tố","hormone",1,"","内分泌腺分泌的物质。","痛苦激素","激素对人体有重要作用。","Hoóc-môn có tác dụng quan trọng với cơ thể.",[],"Bài 30 khởi động: nhóm <span class='zh'>素</span>."],[32,"转移","zhuǎnyí","đgt.","chuyển di","chuyển, thay đổi",1,"","改换位置；改变。","把情绪压力转移掉","转移注意力。","Đánh lạc hướng sự chú ý.",[],""],[33,"喉咙","hóulóng","dt.","hầu lung","cổ họng",1,"","咽部和喉部的统称。","喉咙里会觉得不舒服","我喉咙疼。","Tôi đau họng.",[],"Bài tập 3②. SBT câu 18B."],[34,"鼻涕","bítì","dt.","tị thế","nước mũi",1,"","鼻腔黏膜分泌的液体。","一把鼻涕一把泪","感冒了，一直流鼻涕。","Bị cảm, cứ chảy nước mũi.",["一把鼻涕一把泪"],"Bài tập 3②. SBT câu 19D."],[35,"之际","zhījì","","chi tế","vào lúc, nhân dịp",1,"","……的时候。","伤心难过之际，不妨痛哭","在新年到来之际……","Nhân dịp năm mới đến…",[],"SBT câu 21C."],[36,"修复","xiūfù","đgt.","tu phục","sửa chữa, phục hồi lại",1,"","修理使恢复完整。","一切都得到了修复","修复古建筑。","Trùng tu công trình cổ.",[],"Bài tập 3②. SBT câu 31A."],[37,"宣泄","xuānxiè","đgt.","tuyên tiết","thổ lộ, giải tỏa",1,"","舒散；吐露（心中的积郁）。","宣泄情绪的许可证","他需要宣泄一下心中的不满。","Anh ấy cần trút bỏ nỗi bất mãn.",[],"Xem đoạn 7: <span class='zh'>宣泄归宣泄</span>."],[38,"许可","xǔkě","đgt.","hứa khả","cho phép",1,"","准许；容许。","许可证","未经许可，不得入内。","Chưa được phép, không được vào.",["许可证"],"Xem <b>辨析 许可—允许</b>. SBT nghe câu 2."],[39,"倡导","chàngdǎo","đgt.","xướng đạo","khởi xướng, chủ trương",1,"","带头提倡。","我们倡导要给男人释放情绪的空间","倡导绿色生活。","Khởi xướng lối sống xanh.",[],"SBT câu 14A."],[40,"情理","qínglǐ","dt.","tình lý","lý, lẽ phải",1,"","人的常情和事情的一般道理。","男人流泪本在情理之中","这是情理之中的事。","Đây là chuyện hợp tình hợp lý.",["情理之中"],""],[41,"忌讳","jìhuì","đgt.","kỵ húy","kiêng kị, kiêng cữ",1,"","因风俗习惯或个人理由等，对某些言语或举动有所顾忌；对可能产生不利后果的事力求避免。","宣泄时忌讳哭泣时间过长","吃药时忌讳喝酒。","Uống thuốc thì kiêng rượu.",[],"Bài tập 3②. SBT câu 19A."],[42,"外界","wàijiè","dt.","ngoại giới","thế giới bên ngoài",1,"","某个物体以外的空间或某个集体以外的社会。","扔掉外界对男人流泪的鄙视","不要太在意外界的评价。","Đừng quá để ý đánh giá bên ngoài.",[],"SBT câu 22B."],[43,"狭隘","xiá'ài","tt.","hiệp ải","hẹp hòi, hạn hẹp",1,"","（心胸、气量、见识等）局限在一个小范围里；不宽广。","一种狭隘的偏见","他心胸狭隘。","Anh ta lòng dạ hẹp hòi.",[],"SBT câu 21A."],[44,"偏见","piānjiàn","dt.","thiên kiến","thành kiến",1,"","偏于一方面的见解；成见。","狭隘的偏见","我们要消除对他的偏见。","Chúng ta phải xóa bỏ định kiến với anh ấy.",[],"SBT câu 21C."],[45,"阻挠","zǔnáo","đgt.","trở nạo","cản trở, ngăn cản",1,"","阻止或暗中破坏使不能发展或成功。","不要阻挠男人流泪","他们百般阻挠我们的计划。","Họ tìm mọi cách cản trở kế hoạch của ta.",[],"Bài tập 2⑥. SBT câu 21D."],[46,"尊严","zūnyán","dt.","tôn nghiêm","danh dự, sự uy nghiêm",1,"","尊贵庄严；可尊敬的身份或地位。","也并不丧失尊严","维护国家尊严。","Bảo vệ tôn nghiêm quốc gia.",[],""],[47,"理睬","lǐcǎi","đgt.","lý thải","để ý, quan tâm",1,"","对别人的言行表示态度或意见（多用于否定）。","不必理睬别人说三道四","他生气了，谁也不理睬。","Anh ấy giận, chẳng để ý ai.",[],""],[48,"淹没","yānmò","đgt.","yêm một","chìm ngập",1,"","（大水）漫过；盖过。","淹没在忧伤、难过的情绪中","洪水淹没了村庄。","Lũ nhấn chìm làng mạc.",[],""],[49,"须知","xūzhī","đgt.","tu tri","nhất định phải biết",1,"","一定要知道。","须知，真正的个人成长……","须知，成功来之不易。","Phải biết rằng thành công không dễ.",[],"Còn là dt.: <span class='zh'>游客须知</span>. SBT câu 33–36."],[50,"抹杀","mǒshā","đgt.","mạt sát","gạt bỏ, xóa bỏ",1,"","一概不计；完全勾销。","不要抹杀掉痛苦在我们成长中的功劳","不能抹杀他的功劳。","Không thể phủ nhận công lao của anh ấy.",[],"SBT nghe câu 4."],[51,"岁月","suìyuè","dt.","tuế nguyệt","năm tháng",1,"","年月。","人生岁月中","岁月不饶人。","Năm tháng chẳng tha ai.",[],""],[52,"沉淀","chéndiàn","đgt.","trầm điện","lắng động, kết tủa",1,"","溶液中难溶解的固体物质从溶液中析出；比喻凝聚、积累。","可以沉淀出智慧","经验需要时间来沉淀。","Kinh nghiệm cần thời gian lắng đọng.",[],""]],extra:[["男儿有泪不轻弹","nán'ér yǒu lèi bù qīng tán","đàn ông có nước mắt không dễ rơi"],["刚毅","gāngyì","cương nghị"],["顶天立地","dǐngtiān-lìdì","đội trời đạp đất"],["靠山 · 支柱","kàoshān · zhīzhù","chỗ dựa · trụ cột"],["叮嘱","dīngzhǔ","dặn dò"],["有血有肉","yǒu xuè yǒu ròu","bằng xương bằng thịt"],["压抑 · 隐忍","yāyì · yǐnrěn","kìm nén · nhẫn nhịn"],["无精打采","wújīng-dǎcǎi","ủ rũ"],["忧伤肺","yōu shāng fèi","buồn rầu hại phổi (Đông y)"],["说三道四","shuōsān-dàosì","nói ra nói vào"],["磨难","mónàn","gian khổ"]],T:[{zh:"到今天为止，我们的社会对好男人的标准从没有改变过：男人要有责任心，为人正直、宽容、刚毅，不背叛朋友；男人要上进，有抱负，有魄力；男人要谦虚，诚实，大方；男人要有修养，心胸开阔，处境艰难而不退缩，面对打击而不脆弱；男人是生活中的榜样，家庭的靠山，社会的支柱。总之，男人要顶天立地，光彩照人，要有男人的气概。",vn:"Cho đến hôm nay, tiêu chuẩn của xã hội về người đàn ông tốt chưa bao giờ thay đổi: đàn ông phải có trách nhiệm, sống chính trực, bao dung, cương nghị, không phản bội bạn bè; đàn ông phải cầu tiến, có hoài bão, có bản lĩnh; đàn ông phải khiêm tốn, thật thà, hào phóng; đàn ông phải có tu dưỡng, lòng dạ rộng mở, hoàn cảnh khó khăn không lùi bước, đối mặt đả kích không yếu đuối; đàn ông là tấm gương trong cuộc sống, chỗ dựa của gia đình, trụ cột của xã hội. Tóm lại, đàn ông phải đội trời đạp đất, rạng rỡ chói lọi, có khí phách nam nhi.",idea:"Chuẩn mực đàn ông tốt.",q:["社会对好男人的标准是什么？"],note:[["男人要……；男人要……；男人要……；男人要……","Xem 修辞: 排比."],["……而不……","<span class='zh'>处境艰难而不退缩</span> = khó mà không lùi."]]},{zh:"不仅如此，男人们从小受到的教育就是“男儿有泪不轻弹”，意思是说，理智的男子汉再悲伤也不轻易哭泣，爱哭的男人走到哪儿都会被一票否决，因为男人流泪就意味着软弱、没出息，而这种教育是从娃娃时代就潜移默化地在起作用了，他们天天被这样的古训鞭策着。我们的文化赋予了男人高大、坚强的形象，他们在生活中必须扮演强者。",vn:"Không chỉ vậy, từ nhỏ đàn ông được dạy “nam nhi có nước mắt không dễ rơi”, nghĩa là người đàn ông lý trí dù buồn đến đâu cũng không dễ khóc; đàn ông hay khóc đi đâu cũng bị gạt bỏ, vì đàn ông rơi lệ nghĩa là yếu đuối, chẳng ra gì. Kiểu giáo dục này âm thầm tác động từ thuở còn bé, ngày ngày họ bị lời dạy cổ ấy thúc giục. Văn hóa của chúng ta trao cho đàn ông hình tượng cao lớn, cứng rắn; trong cuộc sống họ buộc phải đóng vai kẻ mạnh.",idea:"“男儿有泪不轻弹”.",q:["为什么“男儿有泪不轻弹”？"],note:[["再……也不……","Dù… đến đâu cũng không…"],["被一票否决","Bị gạt bỏ ngay."]]},{zh:"男人们为了不被鄙视，不被讥笑，为了远离那些恶心、不体面的词汇，千百次暗暗叮嘱自己：伤心是软弱的表现，哪怕遭受打击、面对失败、受尽委屈，也一定要坚强，这是什么时候都不能含糊的。",vn:"Để không bị khinh thường, không bị chế giễu, để tránh xa những từ ngữ đáng ghét, không thể diện, đàn ông nghìn trăm lần thầm dặn mình: đau lòng là biểu hiện của yếu đuối; dù bị đả kích, đối mặt thất bại, chịu đủ oan ức, cũng nhất định phải mạnh mẽ — điều này lúc nào cũng không được qua loa.",idea:"Đàn ông tự ép mình.",q:["为了不被讥笑，男人经常怎么办？"],note:[["哪怕……，也……","Xem Ngữ pháp 1."],["为了不被……，不被……，为了……","Câu bị động kép."]]},{zh:"实际情况是，“男儿有泪不轻弹”是社会文化赋予男人的一种束缚。男人不是魔鬼，也不是神仙，他们也是有血有肉、有健全情感的人。男人也有喜怒哀乐，也需要关怀，也需要温柔的抚慰，否则，再有力的肩膀也有被压塌的时候。事实表明，长期的压抑、隐忍对健康只有坏处，没有好处，反之，以适当的方式将情绪释放一下，人的心绪才会变得平和。",vn:"Thực tế là, “nam nhi có nước mắt không dễ rơi” là một sự trói buộc mà văn hóa xã hội trao cho đàn ông. Đàn ông không phải ma quỷ, cũng chẳng phải thần tiên, họ cũng là người bằng xương bằng thịt với tình cảm lành mạnh. Đàn ông cũng có hỉ nộ ái ố, cũng cần quan tâm, cần an ủi dịu dàng; nếu không, đôi vai dù khỏe đến đâu cũng có lúc bị đè sụp. Thực tế cho thấy, kìm nén, nhẫn nhịn lâu dài chỉ có hại cho sức khỏe; ngược lại, giải tỏa cảm xúc bằng cách thích hợp thì tâm trạng mới trở nên bình hòa.",idea:"Sự trói buộc.",q:["“男儿有泪不轻弹”对不对？"],note:[["不是……，也不是……","Phủ định hai vế."],["也有……，也需要……，也需要……","排比 nhỏ."],["反之","Xem Ngữ pháp 2."]]},{zh:"其实，眼泪是情绪释放的一种形式，人在情绪抑郁时会分泌一种被称为痛苦激素的物质，它会让人情绪低落、无精打采，眼泪恰恰可以将它排出体外。通常人们哭泣后，在情绪强度上会降低40%，如果不能利用眼泪把情绪压力转移掉，则会影响身体健康。",vn:"Thật ra, nước mắt là một hình thức giải tỏa cảm xúc. Khi u uất, cơ thể tiết ra một chất gọi là “hoóc-môn đau khổ”, khiến người ta chán chường, ủ rũ; nước mắt lại chính là thứ đẩy nó ra ngoài. Thông thường sau khi khóc, cường độ cảm xúc giảm 40%; nếu không dùng nước mắt chuyển đi áp lực cảm xúc thì sẽ ảnh hưởng sức khỏe.",idea:"Nước mắt thải hoóc-môn đau khổ.",q:["为什么说眼泪是情绪释放的一种形式？"],note:[["恰恰","Chính là, đúng lúc."],["如果……，则……","Nếu… thì… (văn viết)."]]},{zh:"中医认为，忧伤肺。当人难过、想哭的时候，喉咙里会觉得不舒服。喉咙直接通肺，喉咙不舒服，就是肺部受刺激了；人哭起来常常会一把鼻涕一把泪，之所以会流鼻涕，也是肺受了刺激。一旦悲伤难过没有了，也就不再流鼻涕了，喉咙也会舒适起来。这说明，悲伤难过对肺会有影响。伤心难过之际，不妨痛哭。哭完了，一切都得到了修复。因此，不发给男人宣泄情绪的许可证不是正道，男人也有流泪的权利。我们倡导要给男人释放情绪的空间，男人流泪本在情理之中。",vn:"Đông y cho rằng: buồn rầu hại phổi. Khi buồn, muốn khóc, cổ họng thấy khó chịu. Họng thông thẳng tới phổi, họng khó chịu tức là phổi bị kích thích; người khóc thường nước mắt nước mũi tèm lem, sở dĩ chảy nước mũi cũng vì phổi bị kích thích. Một khi hết buồn thì không chảy nước mũi nữa, cổ họng cũng dễ chịu lại. Điều này cho thấy buồn bã ảnh hưởng đến phổi. Lúc đau lòng buồn bã, chẳng ngại khóc một trận. Khóc xong, mọi thứ đều được phục hồi. Vì thế, không cấp cho đàn ông “giấy phép” giải tỏa cảm xúc không phải là đúng đắn; đàn ông cũng có quyền rơi lệ. Chúng tôi chủ trương cho đàn ông không gian giải tỏa cảm xúc; đàn ông khóc vốn là hợp tình hợp lý.",idea:"Đông y: khóc giúp phục hồi.",q:["哭有什么学问？"],note:[["之所以……，也是……","Sở dĩ… là vì…"],["伤心难过之际，不妨痛哭","<span class='zh'>不妨</span> = chẳng ngại, cứ việc."],["宣泄情绪的许可证","Xem 辨析 许可—允许."]]},{zh:"不过，宣泄归宣泄，宣泄时忌讳哭泣时间过长，一般不要超过15分钟，压抑的心情得到发泄、缓解后就不要再哭，否则对身体反而有害。因为人的胃肠机能对情绪极为敏感，忧愁悲伤或哭泣时间过长，胃的运动会减慢，会影响食欲，甚至引起其他胃部疾病。",vn:"Tuy nhiên, giải tỏa thì giải tỏa, khi giải tỏa kiêng khóc quá lâu, thường không quá 15 phút; tâm trạng dồn nén được trút ra, dịu đi rồi thì đừng khóc nữa, kẻo lại có hại. Vì chức năng dạ dày – ruột cực kỳ nhạy cảm với cảm xúc; buồn rầu hay khóc quá lâu, dạ dày co bóp chậm lại, ảnh hưởng sự thèm ăn, thậm chí gây bệnh dạ dày khác.",idea:"Khóc không quá 15 phút.",q:["哭泣时间过长有什么害处？"],note:[["A 归 A","<span class='zh'>宣泄归宣泄</span> = giải tỏa thì giải tỏa (nhưng…)."],["否则……反而……","Nếu không… ngược lại…"]]},{zh:"释放情绪除了哭泣，还应在想法上做调整：扔掉外界对男人流泪的鄙视，因为这种鄙视只是一种狭隘的偏见。不要阻挠男人流泪，男人流泪不等于软弱无用，也并不丧失尊严。男人本身也不必理睬别人说三道四，谁都不能长久地淹没在忧伤、难过的情绪中。偶尔具有负面情绪不是什么坏事，它能让我们更了解自己，让我们成长，让我们更深刻地体悟到什么是快乐。",vn:"Giải tỏa cảm xúc ngoài khóc ra, còn phải điều chỉnh suy nghĩ: vứt bỏ sự khinh thường của bên ngoài đối với đàn ông rơi lệ, vì đó chỉ là định kiến hẹp hòi. Đừng ngăn đàn ông khóc; đàn ông khóc không có nghĩa là yếu đuối vô dụng, cũng không mất tôn nghiêm. Bản thân đàn ông cũng không cần để ý người khác nói ra nói vào; không ai có thể mãi chìm trong buồn bã. Thỉnh thoảng có cảm xúc tiêu cực chẳng phải điều xấu, nó giúp ta hiểu mình hơn, giúp ta trưởng thành, giúp ta thấm thía hơn thế nào là hạnh phúc.",idea:"Điều chỉnh suy nghĩ.",q:["除了哭泣以外，还应该如何释放情绪？"],note:[["让我们……，让我们……，让我们……","排比."],["不等于……，也并不……","Không đồng nghĩa… cũng không…"]]},{zh:"须知，真正的个人成长往往来自于痛苦、磨难，而非快乐，不要抹杀掉痛苦在我们成长中的功劳。既然悲伤无可避免，就应该好好面对悲伤，不要妄想生命中从不出现这样的过程和阶段。毕竟，快乐往往是短暂的，人生岁月中更多地伴随着的是灰暗的情绪，而它却可以沉淀出智慧。",vn:"Phải biết rằng, sự trưởng thành thực sự thường đến từ đau khổ, gian truân chứ không phải niềm vui; đừng phủ nhận công lao của nỗi đau trong sự trưởng thành của chúng ta. Nỗi buồn đã không thể tránh, thì hãy đối diện cho tốt, đừng mơ tưởng đời mình chẳng bao giờ có giai đoạn ấy. Dù sao niềm vui thường ngắn ngủi, năm tháng đời người đi cùng nhiều hơn là những cảm xúc u ám — nhưng chính nó lại có thể lắng đọng thành trí tuệ.",idea:"Nỗi đau giúp trưởng thành.",q:["为什么说“有时，不妨悲伤”？"],note:[["……，而非……","…chứ không phải… (văn viết)."],["既然……，就……","Đã… thì…"],["毕竟","Dù sao thì."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"哪怕",py:"nǎpà",tag:"Chú thích 1 · liên từ",mean:"Liên từ, giống <span class='zh'>即使</span> — “cho dù, dẫu cho”. Sau <span class='zh'>哪怕</span> là tình huống giả định; vế kia thường đi với <span class='zh'>也 · 都</span>, biểu thị tình huống ấy <b>không ảnh hưởng đến kết quả / kết luận</b>. Thường dùng trong khẩu ngữ.",forms:["哪怕 + giả định，S + 也 / 都……","……，哪怕 + giả định"],ex:[["哪怕遭受打击、面对失败、受尽委屈，也一定要坚强，这是什么时候都不能含糊的。","",1],["她真的老了，记忆力越来越差，哪怕两三天以前的事情，也会记不清。","Bà thật sự già rồi, trí nhớ ngày càng kém, kể cả chuyện hai ba hôm trước cũng nhớ không rõ."],["您放心，我们一定会尽全力抢救病人，哪怕只有一线希望。","Ông yên tâm, chúng tôi nhất định dốc sức cứu bệnh nhân, dù chỉ còn một tia hy vọng."]],tips:["Bài 29: <span class='zh'>哪怕是私下里偷偷地笑</span>.","Bài tập 2④."],practice:{q:"用“哪怕”改写句子",type:"complete",items:[["她这个人真奇怪，走路的时候听音乐，吃饭的时候听音乐，就是看书，也要听音乐。","……哪怕是看书，也要听音乐。"],["渴死了，就算有一口水也是好的。","渴死了，哪怕有一口水也是好的。"],["说好了啊，即使晚点儿，你也一定要来。","说好了啊，哪怕晚点儿，你也一定要来。"]]}},{id:"g2",grp:1,word:"反之",zh:"反之",py:"fǎnzhī",tag:"Chú thích 2 · liên từ",mean:"Liên từ, nghĩa “<b>nói từ mặt ngược lại</b>” — “ngược lại”. Dùng giữa các vế câu, đoạn văn, có tác dụng chuyển ý, dẫn ra ý trái với phía trước. Sau <span class='zh'>反之</span> có ngắt câu (dấu phẩy).",forms:["A，……；反之，（非 A），……"],ex:[["事实表明，长期的压抑、隐忍对健康只有坏处，没有好处，反之，以适当的方式将情绪释放一下，人的心绪才会变得平和。","",1],["有些东西，越是一心想要得到，越是不能如愿，反之，不去在意的时候倒会有意外来临。","Có những thứ càng muốn càng không được, ngược lại lúc chẳng để ý lại có bất ngờ."],["经济发展了，百姓的收入增加了，消费能力就强，反之，百姓的消费能力就差。","Kinh tế phát triển, thu nhập tăng thì sức mua mạnh; ngược lại thì sức mua kém."]],tips:["Bài tập 2⑤: thay <span class='zh'>相反</span> bằng <span class='zh'>反之</span>."],practice:{q:"完成句子",type:"complete",items:[["雨水多，气候就比较湿润，反之，________。","……反之，气候就比较干燥。"],["有了充足的阳光、水分和空气，植物就能生长好，反之，________。","……反之，植物就没有生机。"],["不断地积累，经验就会丰富起来，反之，________。","……反之，永远不会有经验可谈。"]]}},{id:"g3",grp:0,word:"潜移默化",zh:"Thành ngữ & cụm từ",py:"",tag:"Từ vựng",mean:"<span class='zh'>潜移默化</span> = ảnh hưởng âm thầm. <span class='zh'>顶天立地</span> = đội trời đạp đất. <span class='zh'>有血有肉</span> = bằng xương thịt. <span class='zh'>一把鼻涕一把泪</span> = nước mắt nước mũi. <span class='zh'>说三道四</span> = nói ra nói vào. <span class='zh'>在情理之中</span> = hợp tình hợp lý.",forms:["潜移默化地 + V / 起作用","本在情理之中"],ex:[["这种教育是从娃娃时代就潜移默化地在起作用了。","",1],["男人流泪本在情理之中。","",1],["男人本身也不必理睬别人说三道四。","",1]],tips:["SBT câu 20A."]},{id:"g4",grp:1,word:"许可",zh:"许可 / 允许",py:"xǔkě / yǔnxǔ",tag:"Xem 辨析 bên dưới",mean:"Đều là động từ “cho phép”. <span class='zh'>许可</span>: <b>không mang tân ngữ</b>, có thể bổ nghĩa danh từ (<span class='zh'>许可证</span>). <span class='zh'>允许</span>: <b>mang được tân ngữ</b> (<span class='zh'>允许我……</span>), không bổ nghĩa danh từ.",forms:["得到 / 未经 + 许可；许可证","允许 + 人 + V"],ex:[["不发给男人宣泄情绪的许可证不是正道。","",1]],tips:["<span class='zh'>×允许证 · ×他许可我在这儿拍照</span>."]}],BX:{grp:1,word:"许可",cols:["√","×"],pair:"许可 — 允许",same:["Động từ, đều có nghĩa “<b>cho phép, được phép</b>”.","得到许可 / 允许，方可入内。"],diff:[["Sau “许可” <b>không mang tân ngữ</b>.","他许可我在这儿拍照。（×）　我在这儿拍照得到了他的许可。（√）","Sau “允许” <b>mang được tân ngữ</b>.<div class='zh' style='margin-top:4px'>他允许我在这儿拍照。（√）</div>"],["<b>Bổ nghĩa được</b> cho danh từ.","许可证（√）","<b>Không</b> bổ nghĩa cho danh từ.<div class='zh' style='margin-top:4px'>允许证（×）</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["私人物品，未经许可，不得动用。",0,"<span class='zh'>未经许可</span> — đúng."],["学校有明文规定：教室里不许可抽烟。",1,"Có tân ngữ (抽烟) → dùng <span class='zh'>不允许</span>."],["妈妈允许我每天玩儿半个小时游戏。",0,"<span class='zh'>允许 + 人 + V</span> — đúng."],["公司的经营允许证终于申请下来了。",1,"Bổ nghĩa danh từ → <span class='zh'>许可证</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>否</u>决","否认 · 否定 · 是否 · 可否"],items:[["<u>光</u>彩","光","光芒 · 光亮 · 月光 · 星光"],["赋<u>予</u>","予","给予 · 赐予 · 予以 · 生杀予夺"],["讥<u>笑</u>","笑","微笑 · 笑话 · 可笑 · 笑口常开"],["鄙<u>视</u>","视","藐视 · 电视 · 视觉 · 视线"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["老一辈教育家强调：“教育要从小孩子抓起”。","娃娃","老一辈教育家强调：“教育要从娃娃抓起”。"],["他这种不劳而获的行为被大多数人瞧不起。","鄙视","他这种不劳而获的行为被大多数人鄙视。"],["由于智力有问题，他从小就经常被村里的孩子们笑话。","讥笑","由于智力问题，他从小就经常被村里的孩子们讥笑。"],["衣服只要干净就行，就算旧点儿也没关系。","哪怕","衣服只要干净就行，哪怕旧点儿也没关系。"],["一切从实际出发，我们的事业就能顺利发展，相反，就会遇到挫折。","反之","一切从实际出发，我们的事业就能顺利发展，反之，就会遇到挫折。"],["为了不让那两家公司成功合作，他想尽办法进行阻止。","阻挠","为了不让那两家公司成功合作，他想尽办法进行阻挠。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["开阔","背叛","榜样","打击","上进"],text:"爸爸一直是我的{榜样}，他很坚强，面对{打击}从不退缩；他为人正直，从不{背叛}朋友；他心胸{开阔}，积极{上进}，是个顶天立地的男子汉。"},{bank:["脆弱","喉咙","忌讳","鼻涕","修复"],text:"最近我的身体不太舒服，{喉咙}痛，还打喷嚏，流{鼻涕}，可能是感冒了。生病时身体很{脆弱}，也最{忌讳}过于劳累，因此我打算减少工作量，去父母家住几天，好好休息，让身体进行自我{修复}。"}]},EX4:{q:"请给下面的排比句连线组成一段话并朗读",type:"pos",vn:"A. 娇得文学家想不出词句来描绘。　B. 香得外来人一到这苍山下，洱海边，顿觉飘飘然不酒而醉。　C. 多得园艺家定不出名字来称呼。　D. 艳得美术家调不出颜色来点染。",items:[["大理花多，","C","大理花多，多得园艺家定不出名字来称呼。",""],["大理花艳，","D","大理花艳，艳得美术家调不出颜色来点染。",""],["大理花娇，","A","大理花娇，娇得文学家想不出词句来描绘。",""],["大理花香，","B","大理花香，香得外来人一到这苍山下，洱海边，顿觉飘飘然不酒而醉。",""]]},EX5:{q:"根据提示，简述课文主要内容",rows:[["社会对好男人的标准是什么？","男人要……；要……；要……；要……；是……。总之……","男人要有责任心，要上进，要谦虚，要有修养；男人是生活中的榜样，家庭的靠山，社会的支柱。总之，男人要顶天立地。"],["为什么“男儿有泪不轻弹”？","理智的男子汉……，爱哭的男人……，男人流泪意味着……。这种教育……，……赋予男人……","理智的男子汉再悲伤也不轻易哭泣，因为男人流泪意味着软弱、没出息。这种教育从小就潜移默化地起作用，文化赋予了男人坚强的形象。"],["为了不被讥笑，男人经常怎么办？","为了不被……，不被……，为了远离……，……叮嘱自己……","为了不被鄙视、讥笑，男人们常常叮嘱自己：哪怕遭受打击，也一定要坚强。"],["“男儿有泪不轻弹”对不对？","束缚，男人不是……，也有……，也需要……，否则……","这是社会文化赋予男人的一种束缚。男人不是魔鬼，也不是神仙，也有喜怒哀乐，也需要关怀，否则再有力的肩膀也会被压塌。"],["为什么说眼泪是情绪释放的一种形式？","抑郁时分泌……，眼泪可以排出……，转移……","人抑郁时会分泌痛苦激素，眼泪可以把它排出体外，把情绪压力转移掉。"],["哭有什么学问？除了哭泣以外，还应该如何释放情绪？","忧伤肺，修复……，宣泄……，倡导……，忌讳……，过度哭泣，胃肠……；调整想法：扔掉……，不必理睬……，更了解……，不要抹杀……，好好面对……","中医认为忧伤肺，哭完一切都能得到修复；但哭泣不要超过15分钟，否则会影响胃肠。还要调整想法：扔掉偏见，不必理睬别人说三道四，好好面对悲伤。"]]},PZ:{title:"修辞（8）排比",vn:"Điệp cấu trúc",intro:"Đem những từ ngữ hoặc câu có <b>cấu trúc giống nhau, nội dung liên quan, ngữ khí thống nhất</b> xếp liền nhau, khiến khí thế mạnh hơn, hiệu quả diễn đạt tốt hơn — gọi là <b>排比</b>. Hay dùng để <b>lập luận</b> (lý lẽ chặt chẽ, thấu đáo) hoặc <b>trữ tình</b> (bộc lộ cảm xúc đầy đủ).",ex:[["蔚蓝的天空，飘浮的白云，摇摆的树影，更衬托出梯田的壮美。","Ba cụm “tính từ + 的 + danh từ”."],["没有理想，人生就如荒漠，没有生气；没有理想，人生就如黑夜，没有光明；没有理想，人生就如迷宫，没有方向。","Ba vế “没有理想，人生就如……”."],["男人要有责任心……；男人要上进……；男人要谦虚……；男人要有修养……","Đoạn 1 bài khóa — bốn vế “男人要……”."]],q:"指出下列哪句不是排比句",pvn:"(1) 床前明月光，疑是地上霜，举头望明月，低头思故乡。　(2) 拥有青春，就拥有了一份灿烂和辉煌；拥有知识，就拥有了无限的力量和财富；拥有友情，就拥有了一份理解和支持。　(3) 处理问题必须瞻前顾后，不仅要看到眼前，还要看到以后；不仅要看到局部，还要看到全局；……",practice:[["Câu nào KHÔNG phải 排比？","(1) — bài thơ 《静夜思》 (Lý Bạch), các câu không cùng cấu trúc lặp lại."]]},DP:[{title:"词汇：熟悉下列词语搭配",vn:"Kết hợp từ thường gặp.",items:[["出卖","chūmài","bán đứng","出卖朋友 / 出卖国家","他绝不会为金钱、利益出卖良心。"],["煎","jiān","rán, sắc","煎茶 / 煎药","不知从哪里飘来了煎牛排的香味。"],["捎","shāo","gửi kèm, nhắn","捎话 / 捎件衣服","麻烦您把这几样东西捎给我妹妹。"],["秃","tū","trọc, trụi","光秃秃","天气暖和了，光秃秃的树枝上冒出了新芽。"],["磨合","móhé","rèn khớp, làm quen","磨合期","经过一段时间的磨合，他们俩的双打配合得别提多默契了。"],["渣","zhā","bã, vụn","面包渣","这种再生纤维是用木材、竹子、甘蔗渣等天然物质制成的。"],["染","rǎn","nhuộm; nhiễm","染发","她家从来都是窗明几净，纤尘不染。"],["壮烈","zhuàngliè","oanh liệt","壮烈牺牲","他们的爱情注定是悲剧，是带有壮烈色彩的悲剧。"],["辩证","biànzhèng","biện chứng","辩证法","要注意培养学生的辩证思维能力。"],["公关","gōngguān","quan hệ công chúng","公关部门 / 公关活动","“公关”是“公共关系”的简称。"],["纪要","jìyào","biên bản tóm tắt","新闻纪要 / 会议纪要","这是一份完整的会议纪要。"],["清真","qīngzhēn","Hồi giáo (halal)","清真寺 / 清真食品","我最喜欢这家清真饭馆了。"],["蒸发","zhēngfā","bốc hơi","水分蒸发","天气炎热，刚下过雨，路上的水马上就蒸发了。"],["片断","piànduàn","đoạn, mẩu","文章片断 / 生活片断","我对这件事的记忆已经不完整了，只是一个个的片断。"],["集团","jítuán","tập đoàn","政治集团 / 集团公司","几家报社联合起来，组建了一个大的报业集团。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"乐观的人会有些主观，有些“傻”。他们习惯于“歪曲”现实世界，当现实世界不利于他们发展或有些危险时，他们倾向于人为地忽视危险，不把危险放在心上，乐观地认为，天塌不下来，睡醒再说。",o:["乐观的人有时会忽视危险","乐观的人经常会做些傻事","有人认为睡觉比什么都重要","天塌下来表示危险即将来临"],a:0,why:"“倾向于人为地忽视危险”. Có <span class='zh'>塌</span>."},{n:2,say:"日记是孩子成长过程中的心得体会，未经许可，家长是不应该看的。文具店里装潢漂亮、挂着小锁的日记本往往特别受欢迎，就是因为买主写完后可以将日记锁起来，以防被人偷看。",o:["有思想的孩子才记日记","家长都喜欢看孩子的日记","孩子的日记是写给自己的","家长喜欢漂亮的有锁的日记本"],a:2,why:"“未经许可，家长是不应该看的”. Có <span class='zh'>许可</span>."},{n:3,say:"服饰文化在人类文明史中占有很重要的地位。事实上，在各种服饰文化表象的背后，不论这种服饰是光彩四溢、如诗如画，还是朴实无华、素净淡雅，都存在着各种与之对应的服饰观念。",o:["服饰文化的历史不长","素净淡雅的服饰如诗如画","美丽的服饰能制造出非凡的效果","每种服饰文化都体现着相应的观念"],a:3,why:"“都存在着各种与之对应的服饰观念”. Có <span class='zh'>光彩</span>."},{n:4,say:"不要让对方认为你抹杀了他的一切，一点儿也不承认他的好处，这样很难使谈话融洽地进行下去。无论你的意见和对方的意见相差多远，冲突多厉害，都要表现出一切都可以商量的诚意。",o:["要善于发现别人的优点","人与人存在分歧很正常","与人发生冲突时要冷静","与人谈话态度诚恳很重要"],a:3,why:"“表现出一切都可以商量的诚意”. Có <span class='zh'>抹杀</span>."},{n:5,say:"万圣节也叫“鬼节”，起源于公元前5世纪，欢度万圣节的习俗由爱尔兰移民带到北美。万圣节前后，在儿童商场能买到各种魔鬼图案的化装衣服、帽子和脸谱，年龄大一些的孩子们还会自行设计魔鬼套装。",o:["爱尔兰先于北美过万圣节","大家喜欢自制万圣节服装","一般商场都会卖魔鬼服装","万圣节始于大约1500年前"],a:0,why:"Tục lệ do người di cư Ireland mang đến Bắc Mỹ. D sai: trước CN thế kỷ 5 (~2500 năm). Có <span class='zh'>魔鬼</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：参加“我是歌手”，对你来说有挑战吗？\n男：我不太会唱别人的歌，因为我以前都是唱自己写的歌。唱别人的歌是有挑战的，我的很多压力也来自于此。\n女：人有的时候还是需要一点儿压力的吧？\n男：对啊，就像有时候必须去考试一样。\n女：说实话，以后你还会参加这样的节目吗？\n男：不会了，这样的经历，一生有这么一次足矣，没必要总是做这样的事情。\n女：这些年你还是有了点儿改变……\n男：如果说成长和成熟是改变，那就是改变。\n女：其实更多地在坚持？\n男：坚持是不自觉的，我只想过做个歌手。也许我只适合做这类事，可以说这是坚持吧。别人看来是坚持，自己看来就是做喜欢的事。\n女：好多人都是在就要忘了你之前，又被你的突然出现感动。你是怎么做到的？\n男：在很多时候，你喜欢的未必别人喜欢，更未必被市场喜欢。但是，你喜欢的东西如果坚持做到底，把它做到极致，别人或者市场是有可能接受的。假如你做的东西既不是你喜欢的，又不是别人接受的，那么我觉得这样的事情做下去，是不可能有好结果的。\n女：你对音乐市场有什么看法？\n男：在我看来，做这行的没有什么人真正懂市场。每个人也就几首歌曲可以算是真正成功的……既然这样，为什么不做点儿自己真正喜欢的呢？做自己不喜欢的东西是很痛苦的，只有一种情况除外，那就是你本身根本不爱音乐，就是想成名，名利足够让你获得快感。\n女：这算是你在40岁时候的感悟吗？\n男：我的人生是相反的：30多岁的时候我是不惑的，40岁反而又困惑了。30岁不惑源于自己对世界的未知；可到了40岁，真正了解一点儿社会之后，发现很多问题其实是无解的。世界无时无刻不在变化，哪来的什么答案？",qs:[{n:6,q:"对参加“我是歌手”，男的是什么态度？",o:["兴奋","向往已久","不甚积极","像参加考试一样紧张"],a:2,why:"“一生有这么一次足矣，没必要总是做” → không mấy tích cực."},{n:7,q:"关于男的，下列哪项正确？",o:["越来越成熟","越来越乐观","尝试过很多职业","受到鼓励才坚持下来"],a:0,why:"“如果说成长和成熟是改变，那就是改变”."},{n:8,q:"男的认为，自己沉寂之后又能感动别人的原因是什么？",o:["他学会了顺应市场","社会从不缺少关怀","岁月不可能淹没美好的记忆","他坚持做好自己喜欢的东西"],a:3,why:"“你喜欢的东西如果坚持做到底……”. Có <span class='zh'>岁月 · 淹没 · 关怀</span> làm bẫy."},{n:9,q:"对音乐市场，男的怎么看？",o:["成功的歌手每一首歌都很成功","只有不断学习才能了解音乐市场","真正爱音乐的人会做自己喜欢的东西","歌手在音乐市场中扮演着痛苦的角色"],a:2,why:"“为什么不做点儿自己真正喜欢的呢？……除外……根本不爱音乐”."},{n:10,q:"男的40岁时有什么感悟？",o:["年轻时思想更开阔","40岁的人更趋于保守","30岁犯错误也在情理之中","世界在变化，很多事没有答案"],a:3,why:"“世界无时无刻不在变化，哪来的什么答案？”"}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"巨魔芋大王花产于印度尼西亚的苏门答腊热带雨林地区，1878年，被植物学家发现。巨魔芋大王花的花朵直径可达1.5米，高近3米，是举世无双的最大花朵。巨魔芋大王花的颜色非常漂亮，花刚开时，还有点儿香味，一两天后，花如腐肉，散发的气味臭不可闻，因此，人们很远就能发觉它。这种恶心的臭味也有好处，就是它能招来苍蝇、甲虫为它传播花粉，以便繁衍后代。\n巨魔芋大王花花朵虽然大得出奇，结出的种子却非常微小，它们常常粘在大象的脚上，被带到各地去，之后在新的地方安家落户。",qs:[{n:11,q:"关于巨魔芋大王花，可以知道什么？",o:["花期非常短","下雨就开花","是热带植物","高可达1.5米"],a:2,why:"“产于……热带雨林地区”. D: đường kính 1,5 m, cao gần 3 m."},{n:12,q:"为什么巨魔芋大王花老远就能被人们发觉？",o:["花很漂亮","颜色鲜艳","花朵巨大","花味很臭"],a:3,why:"“气味臭不可闻，因此，人们很远就能发觉它”. Có <span class='zh'>恶心</span>."},{n:13,q:"大象为巨魔芋大王花帮了什么忙？",o:["传播花粉","阻止甲虫的侵袭","把微小的花籽收起来","把花籽转移到其他地方"],a:3,why:"“粘在大象的脚上，被带到各地去”. Có <span class='zh'>转移</span>."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"如今，很多父母认为，家庭教育就是开发孩子的智力，让孩子两三岁开始背诗歌，四五岁学外语，上学后要上辅导班，成绩一定要名列前茅，将来一定要上名牌大学。似乎只有这样，父母的教育才算成功，孩子才能成才。实践证明，这是对家庭教育极大的误解。家庭教育最重要的应该是人格教育。\n试想，如果一个孩子遇到点儿挫折就产生轻生的念头，不懂得生命的意义；自己将来想做什么都不知道，没有任何梦想；心里只有自己，无法与别人共享，那么，即使这个孩子门门功课都考第一，又能怎样？\n家庭教育中，最重要的角色是父母。父母首先应懂得：正确的家庭教育是让孩子有很好的人格修养，懂得做人，懂得成功的真正含义。只有父母的教育观念发生了转变，孩子才能终生受益。",qs:[{n:14,q:"如今，很多父母是怎样培养孩子的？",o:["倡导孩子学作诗","带领孩子学英语","亲自辅导孩子学习","只重视孩子智力的开发"],a:3,why:"“家庭教育就是开发孩子的智力”."},{n:15,q:"家庭教育最重要的任务是什么？",o:["使孩子具有健全的人格","把孩子送进有名的学校","让孩子能应付各类考试","让孩子具有健康的体魄"],a:0,why:"“家庭教育最重要的应该是人格教育”. Có <span class='zh'>健全</span>."},{n:16,q:"成功的父母教育的孩子具有什么特点？",o:["每门功课都考第一","正确认识生命的意义","从小就选择好了职业","能和所有的人做朋友"],a:1,why:"Ngược với “不懂得生命的意义”."},{n:17,q:"关于家庭教育，下列哪项正确？",o:["父母的教育背景很重要","父母会不会演戏很重要","父母的教育观念很重要","父母是不是成功很重要"],a:2,why:"“只有父母的教育观念发生了转变，孩子才能终生受益”. Bẫy: <span class='zh'>扮演 · 角色</span>."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他不但跑得快，球也打得不怎么好。","他因重感冒，导致头痛、喉咙不舒服。","轮船驶向碧波万顷的大海，看着一群群洁白的海鸥，姑娘慢慢停止了哭泣。","古代的裙子与今天不同。古代的裙子宽松、庞大、厚实，起不到透气的作用。"],a:0,why:"<b>Quan hệ liên từ sai</b>: <span class='zh'>不但……</span> là tăng tiến, không đi với ý trái ngược → <span class='zh'>他虽然跑得快，但球打得不怎么好</span>."},{n:19,o:["中国的武功重视内功的修炼，最忌讳花拳绣腿。","我今天坐打的来的，太堵了，平常20块钱就到，今天翻了一番。","他明白了一切后，感到很痛苦，因为他压根儿不会想到我会背叛他。","流鼻涕、咳嗽、吐痰、打喷嚏都是呼吸道自我清洁和自我保护的一种表现。"],a:1,why:"<b>Thừa từ</b>: <span class='zh'>打的</span> đã là động từ “đi taxi” → <span class='zh'>我今天打的来的</span> / <span class='zh'>坐出租车来的</span>."},{n:20,o:["大学里有许多年龄相仿的同伴，他们出色的表现也会影响她，对她起到潜移默化的作用。","大鲵是世界上现存最大的，也是最珍贵的两栖动物。它的叫声像婴儿的哭声，因此人们又叫它“娃娃鱼”。","司徒雷登一手创办起来的燕大有钱，可他本人却没钱，他很少买衣服，袜子和内衣上都是补丁，何况当驻华大使期间。","大家都沉默了，用征询的目光看着他，意思是说，你否决了我们的建议，那就说说你的锦囊妙计吧。的确，大家对他的才能一点儿也不怀疑。"],a:2,why:"<b>Dùng liên từ sai</b>: <span class='zh'>何况</span> (huống hồ) không hợp → <span class='zh'>即使在当驻华大使期间也是如此</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"在社会生活中，青年一代在任何___，甚至无时无刻都不可能___与成人一代之间的联系，也不可能不在教育方面受到其哪怕是___的影响。",o:["处境　分离　狭隘","阶段　脱离　无意","之际　离开　偏见","进程　阻挠　榜样"],a:1,why:"<span class='zh'>任何阶段</span>; <span class='zh'>脱离联系</span>; <span class='zh'>无意的影响</span>. Có <span class='zh'>哪怕</span>!"},{n:22,text:"处理问题必须___，不仅要看到眼前的，还要看到___的；不仅要看到局部的，还要看到全局的；不仅要了解本国___，还要了解世界___；不仅要看到世界发展对本国的影响，还要看到本国发展对世界的影响。",o:["左顾右盼　大众　文化　时势","高瞻远瞩　外界　要求　大局","一往直前　后来　情形　所需","瞻前顾后　长远　国情　局势"],a:3,why:"<span class='zh'>瞻前顾后</span>; <span class='zh'>长远</span>; <span class='zh'>国情</span>; <span class='zh'>世界局势</span>. Đây chính là câu 排比 của PZ!"},{n:23,text:"教育工作者对教育目的___越深刻，对教育所要培养的人才的要求理解得越清楚、明确，就会在教育___中选择和采取更为___的措施，我们的教育工作就能取得更好的效果。否则，教育工作就会___方向，遭受挫折，甚至失败。",o:["看法　改革　理智　丧失","认识　实践　恰当　迷失","了解　流程　体面　弄错","剖析　实验　健全　失去"],a:1,why:"<span class='zh'>认识深刻</span>; <span class='zh'>教育实践</span>; <span class='zh'>恰当的措施</span>; <span class='zh'>迷失方向</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"幽默能给人带来欢乐，有助于消除敌意，缓解摩擦，(24)，还有人认为幽默还能激励士气，提高生产效率。\n有研究人员通过测验证明，沉闷乏味的人和具有幽默感的人在以下几个方面存在差异，(25)。\n一、多次心理测验证实，幽默感测试成绩较高的人，往往智商测验成绩也较高，(26)，有的甚至明显缺乏应变能力。\n二、人际关系方面，具有幽默感的人日常生活中都有比较好的人缘，他可在短期内缩短人际交往的距离，赢得对方的好感和信赖。而缺乏幽默感的人则相反。\n三、在工作中善于运用幽默技巧的人，总能保持良好的心态。那些在工作中取得成就的人，(27)，而是善于理解他人并具有幽默感的人。\n四、幽默能使人在困难面前表现得更为乐观、豁达。所以，(28)，利用幽默消除工作上带来的紧张和焦虑；而缺乏幽默感的人，只能默默承受痛苦，甚至难以解脱，这无疑增加了自己的心理负担。",opts:["并非都是最勤奋的人","拥有幽默感的人即使面对困难也会轻松自如","而缺少幽默感的人大多测试成绩平平","而这些差异正是幽默感的心理调节功能和作用所在","防止矛盾升级"],ans:{24:4,25:3,26:2,27:0,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"在生活越来越紧张、竞争越来越激烈的今天，我们经常会感到无奈。消沉下去吗？不必。要学会在竞争中激发你的热情，每个人都有创造奇迹的机会。\n热情是一种精神特质，代表一种积极的精神力量。热情可以弥补一个人20%的能力缺陷；缺乏热情的人，只能发挥出自身能力的50%。\n虽然每个人表达热情的方式和程度有所不同，但热情是人人具有的，善加利用，就可以将其转化为巨大的能量。我们不妨在心里建个“热情加油站”，不断地自我激励、自我修复，这样就能使生活充满阳光。\n建立“热情加油站”需要我们做到以下三点。首先，凡事早准备，不要总是跟在别人后面，处于追赶别人的状态。俗话说得好：“早起的鸟儿有虫吃”，早些出发，才能看到更纯粹的风景，让内心愉悦。\n其次，告诉自己，对现在的生活挺满意。只要自己认为生活是值得热爱的，就会主动珍惜。如果觉得找不到热情的理由，那么就强迫自己采取一些行动，比如置身于美景之中、享受美食，你会随处发现美好。\n再次，不断调整自己，通过学习，提升适应环境的能力。培养自己的兴趣和爱好，丰富自己的生活。保持阳光的心态，会令你更加有朝气。",qs:[{n:29,q:"面对今天紧张的生活，应该采取的做法是：",o:["无须消沉","全力竞争","珍惜机会","逃避现实"],a:0,why:"“消沉下去吗？不必。” — đây là 设问 (bài 29)."},{n:30,q:"关于热情，下列哪项正确？",o:["热情来自于个人的能力","有上进心的人才有热情","缺乏热情可用能力弥补","热情会影响能力的发挥"],a:3,why:"“缺乏热情的人，只能发挥出自身能力的50%”."},{n:31,q:"为什么要建立“热情加油站”？",o:["为了修复情感","为了积蓄能量","为了生活得更好","为了学会表达热情"],a:2,why:"“这样就能使生活充满阳光”."},{n:32,q:"建立“热情加油站”，需要做到：",o:["凡事都不争抢","保持良好心态","时常变换环境","学习各种技能"],a:1,why:"“保持阳光的心态，会令你更加有朝气”."}]},{ins:"第33–36题：请选出正确答案。",text:"“性格决定命运”是著名心理学家和分析心理学创始人荣格的一句名言，于是后人开始研究性格，发现它确实会影响我们的兴趣爱好、职业选择、交友类型，甚至还会决定人的健康状况，进而影响寿命。\n有人可能会说，如果说性格影响兴趣爱好、职业选择等，尚可理解，要是说性格影响寿命，是不是有些言过其实？当然不是，须知，事物都有两面性，性格也是如此。以乐观为例，一方面乐观者是乐天派，情绪积极，凡事看得开，但另一方面，乐观的人往往会忽视身心存在的问题，因此会错误判断自己的身体状况，对疾病治疗不及时。因此有研究者认为，英年早逝的人中天性乐观的人比较多，也就不足为奇了。\n再比如，敏感的人相对长寿，也是研究成果之一。众所周知，女性一般比男性敏感，女性一般比男性长寿，实际上，这二者之间是有联系的。因为女性善于表达自己的情绪，遇到问题会主动寻求帮助。如果男人具备一些女人的特质，有了问题就不会咬牙硬扛，身体不舒服时也会向医生求助，他们身体出问题的概率就会大大降低，他们的生活压力也会减小。\n由此可见，性格不仅会影响我们的行为、命运，甚至还能决定健康，并非耸人听闻之说，在诸多长寿因素中，性格好是不可或缺的因素之一。也许我们无法改变性格，但我们可以了解自己，然后尽量规避性格的弱点。",qs:[{n:33,q:"第2段画线词语“言过其实”的意思是：",o:["话语诚恳，可信度高","思想过时，语言保守","表达含糊，意思不明","说话夸大，不合实际"],a:3,why:"<span class='zh'>言过其实</span> = nói quá sự thật. Có <span class='zh'>须知</span>."},{n:34,q:"乐观的人：",o:["什么事都会放在心里","对未来总是心存幻想","易忽略健康中的问题","患病后立即积极治疗"],a:2,why:"“乐观的人往往会忽视身心存在的问题”."},{n:35,q:"关于女性和男性，可以知道：",o:["女性因长寿而敏感","男性有事喜欢硬撑","女性善于自己解决问题","男性更珍惜自己的尊严"],a:1,why:"“有了问题就不会咬牙硬扛” → đàn ông hay gồng gánh."},{n:36,q:"根据上文，下列哪项正确？",o:["人长寿的原因都是相同的","英年早逝的人性格都不好","人应该克服性格中的弱点","改掉坏性格，人就能健康"],a:2,why:"“尽量规避性格的弱点”. Có <span class='zh'>弱点</span> (bài 31)."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"“男儿有泪不轻弹”是一种传统观念，教育男人无论多么悲伤都不要轻易哭泣，可其实这并不科学，男人的压力和情绪也需要宣泄，“哭”是情绪释放的一种方式，哭有益于健康，男人不妨一哭。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Mở","Chuẩn mực đàn ông + <span class='zh'>男儿有泪不轻弹</span>."],["Lập luận 1","Đó là <span class='zh'>束缚</span>; <span class='zh'>反之</span>, giải tỏa mới bình tâm."],["Lập luận 2","<span class='zh'>痛苦激素 · 忧伤肺 · 修复</span>."],["Lưu ý","<span class='zh'>忌讳哭泣时间过长 · 15分钟 · 胃肠</span>."],["Kết","Điều chỉnh suy nghĩ + <span class='zh'>痛苦沉淀出智慧</span>."]],outline:[["一","社会对男人的标准；男儿有泪不轻弹"],["二","这是一种束缚"],["三","眼泪的作用；忧伤肺"],["四","哭泣不宜过长"],["五","调整想法，好好面对悲伤"]],model:"男人不妨一哭\n在我们的社会里，好男人的标准一直没有改变：男人要有责任心，要上进，要坚强，是家庭的靠山、社会的支柱。男人们从小受到的教育就是“男儿有泪不轻弹”，因为男人流泪就意味着软弱、没出息。为了不被鄙视、讥笑，男人们哪怕受尽委屈，也一定要坚强。\n其实，这是社会文化赋予男人的一种束缚。男人不是神仙，也是有血有肉的人，也需要关怀和安慰。长期压抑对健康只有坏处，反之，以适当的方式释放情绪，人的心情才会平和。\n眼泪就是情绪释放的一种形式。人在抑郁时会分泌一种痛苦激素，眼泪可以把它排出体外。人们哭泣后，情绪强度会降低40%。中医也认为，忧伤肺，伤心难过的时候，不妨痛哭一场，哭完了，一切都会得到修复。所以，男人也有流泪的权利。\n不过，哭泣的时间不宜过长，一般不要超过15分钟，否则会影响胃肠功能，对身体反而有害。\n除了哭泣，还应该调整想法：扔掉对男人流泪的偏见，不必理睬别人说三道四。偶尔有负面情绪并不是坏事，真正的成长往往来自痛苦。既然悲伤无可避免，就应该好好面对它，因为它能沉淀出智慧。",check:["Có tiêu đề","Có đủ các ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 4: 束缚 · 哪怕 · 反之 · 宣泄 · 忌讳 · 偏见 · 修复 · 鄙视","Khoảng 400 chữ"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"有个男孩脾气很坏。父亲给了他一袋钉子，告诉他，当他想发脾气的时候，就钉一根钉子在后院的围墙上。第一天，男孩钉下了40根钉子；一段时间以后，男孩每天钉下的钉子减少了，他觉得控制脾气和钉下那些钉子相比，还是应该选择努力控制情绪；不久，他完全可以控制自己，不乱发脾气了。终于，父亲告诉他，从今天开始，每当他能控制自己情绪的时候，就拔出一根钉子。日子一天天过去，最后男孩告诉父亲，他把所有的钉子都拔出来了。父亲牵着他的手来到后院，对他说：“孩子，看看围墙上那些坑坑洞洞，围墙永远不可能恢复到从前的样子了。你生气时所说的话就像这些钉子一样，留下了无法弥补的疤痕！”男孩终于懂得了管理情绪的重要性。\n我们的情绪常常变化，有时欢乐，有时烦恼，有时气愤，有时担心，有时失望，有时心静如水。也许你根本没注意自己的情绪：你看到灿烂的阳光便心生愉悦；看到天气阴沉、细雨绵绵便情绪低落；谈恋爱的你会心花怒放，失恋的你可能垂头丧气。\n我们拥有各种各样的情绪。情绪使我们的生活富于变化与色彩。然而，有情绪到底好不好呢？人应不应该流露情绪呢？你会不会怕被人说太情绪化，而宁愿不要有情绪？其实真正的问题并不在有没有情绪，有没有情绪也不是我们能够全部掌控的，真正的问题在情绪的表达方式，如果能以适当的方式、在适当的情境中表达适度的情绪，就是健康的情绪管理之道。\n也许是为了面子或在某种场合，我们会不自觉地在他人面前隐藏真实的情绪，或者我们会将强烈的情绪转换为较为温和的表现方式，这是值得鼓励的，也是符合社会规范、十足社会化的行为表现。学会控制自己，做出于人、于己都恰当的决定与行为反应，这是理智的情绪管理。如果我们能够明白自己的行为都是自己选择的结果，进而明白每个人都要为自己的情绪负责任，不必要的情绪问题便可以减少。\n人的自控能力跟人生成功与否有着密切的联系，人与人之间的智商并没有明显的差别。有人成功，有人失败，与各自的自控能力有着密切的关系。从某种意义上讲，人们常常能够通过控制自己情绪来提高生活品质，因此情绪管理是人生不可小视的问题。",model:"学会管理情绪\n有个男孩脾气很坏。父亲给了他一袋钉子，让他每次发脾气的时候，就在后院的围墙上钉一根钉子。第一天，他钉了40根。后来，他钉的钉子越来越少，最后终于能控制自己了。父亲又让他每控制住一次情绪，就拔出一根钉子。等钉子全部拔完以后，父亲指着围墙上的洞对他说：“围墙再也不能恢复原样了。你生气时说的话就像钉子一样，会留下无法弥补的伤痕。”男孩终于明白了管理情绪的重要性。\n我们的情绪常常变化，有时快乐，有时烦恼，有时失望。情绪让我们的生活变得丰富多彩。其实，问题不在于有没有情绪，而在于怎样表达情绪。以适当的方式、在适当的情境中表达适度的情绪，就是健康的情绪管理。\n有时候，为了面子，我们会隐藏真实的情绪，或者把强烈的情绪变得温和一些，这是值得鼓励的。学会控制自己，做出恰当的决定，就是理智的情绪管理。每个人都要为自己的情绪负责。\n人与人之间的智商差别不大，有人成功，有人失败，往往和自控能力有关。因此，情绪管理是人生中不可小视的问题。"}},SUM:{words:["背叛","上进","抱负","魄力","开阔","处境","打击","脆弱","榜样","光彩","理智","哭泣","否决","出息","娃娃","潜移默化","鞭策","赋予","扮演","鄙视","讥笑","恶心","体面","含糊","束缚","魔鬼","神仙","健全","塌","反之","转移","喉咙","鼻涕","之际","修复","宣泄","许可","倡导","情理","忌讳","外界","狭隘","偏见","阻挠","尊严","理睬","淹没","须知","抹杀","岁月","沉淀"],patterns:[["哪怕……，也 / 都……","哪怕遭受打击、面对失败、受尽委屈，也一定要坚强。"],["……，反之，……","长期的压抑……只有坏处，反之，以适当的方式将情绪释放一下……"],["A 归 A，……","宣泄归宣泄，宣泄时忌讳哭泣时间过长。"],["……之际，不妨……","伤心难过之际，不妨痛哭。"],["修辞：排比","男人要……；男人要……；男人要……"]],diff:["许可: không mang tân ngữ, bổ nghĩa danh từ (得到许可 · 许可证) — 允许: mang tân ngữ, không bổ nghĩa danh từ (允许我拍照)","鄙视 / 讥笑 · 恶心 ěxin · 体面 · 含糊 hánhu · 出息 chūxi"],sentences:["“男儿有泪不轻弹”是社会文化赋予男人的一种束缚。","伤心难过之际，不妨痛哭。哭完了，一切都得到了修复。","真正的个人成长往往来自于痛苦、磨难，而非快乐。"],hw:["Học thuộc 52 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Luyện đề 缩写: chuyện cậu bé và những chiếc đinh — 10 phút đọc, 35 phút viết.","Làm Sách bài tập bài 32.","Đọc trước bài 33 (Đơn vị 9 · 古今博览)."]}});
