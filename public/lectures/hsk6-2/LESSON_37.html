<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 37 · 警察的故事 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-37",num:37,book:"HSK 标准教程 6（下）",unit:{n:10,zh:"热点追踪",vn:"Theo dấu các chủ đề nóng hổi"},title:"警察的故事",vn:"Chuyện của cảnh sát",chars:1546,source:"改编自《华西都市报》报道",goals:["Đọc hiểu ba câu chuyện (1546 chữ): <b>nữ cảnh sát Lý Chân giải mã vân tay</b>, <b>cảnh sát chống ma túy Chí Cường phá án</b> và <b>chó nghiệp vụ Huy Kiệt cùng anh lính Tiểu La</b>.","Dùng được 55 từ mới, nhất là nhóm <b>điều tra – phá án</b>: <span class='zh'>抢劫 · 痕迹 · 嫌疑 · 线索 · 歹徒 · 刑事 · 监狱 · 检验 · 查获 · 制裁 · 公安局 · 情报 · 毒品 · 部署 · 埋伏 · 逮捕 · 非法 · 贩卖</span> và nhóm <b>tính cách – cảm xúc</b>: <span class='zh'>恐惧 · 慎重 · 麻痹 · 沉着 · 胆怯 · 信赖 · 忠诚 · 光辉 · 思念</span>.","Nắm <span class='zh'>为……起见 · 暂且</span>.","Phân biệt <span class='zh'>恐惧 — 恐怖</span>; làm quen <b>篇章 (8): 照应 — hô ứng</b>.","Viết bài “警察故事” ≥400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Chuyện (一)(二) · 为……起见 · 暂且"],["Buổi 2","Nhóm 3 · Chuyện (三) · 恐惧—恐怖 · 照应 · Bài tập · Luyện đề · Viết văn"]],outline:[{tag:"一",name:"Nữ cảnh sát giỏi",paras:"Đoạn 1–4",zh:"李真 · 指纹破译专家",vn:"Từ một dấu vân tay khuyết, Lý Chân tìm ra hung thủ; ghép hai vân tay biến dạng để khoanh vùng nghi phạm cướp."},{tag:"二",name:"Cảnh sát chống ma túy",paras:"Đoạn 5–9",zh:"志强 · 化装行动、引蛇出洞",vn:"Chí Cường giả làm người mua ma túy, kiên nhẫn chờ, bố trí lực lượng, bắt gọn đường dây."},{tag:"三",name:"“Cảnh sát” đặc biệt",paras:"Đoạn 10–14",zh:"小罗 · 缉毒犬辉杰",vn:"Tiểu La sợ chó vẫn chăm sóc Huy Kiệt; Huy Kiệt lập nhiều chiến công, bị nhiễm độc được cứu, rồi qua đời để lại nỗi nhớ."}],warm1:{q:"请对照图片熟悉下列词语。你觉得哪些图片与警察有关系？",vn:"Những thứ nào liên quan đến công việc cảnh sát? Bấm 有 (có) / 无 (không).",items:[["🖐️","指纹 zhǐwén","Dấu vân tay"],["👅","舌头 shétou","Cái lưỡi"],["🧂","粉末 fěnmò","Bột (ma túy dạng bột)"],["🐕","警犬 jǐngquǎn · 农用车 nóngyòngchē","Chó nghiệp vụ · xe nông dụng"]],talk:["你觉得哪些图片与警察有关系？为什么？","你看过什么警察题材的电影？"],link:"Từ <span class='zh'>缉毒</span> jīdú = truy bắt ma túy (缉 = truy nã)."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm c 化妆","huà zhuāng","đgt.","hóa trang","trang điểm",1,"","用脂粉等使容貌美丽。","正在化妆的女士","她每天早上都要化妆。","Sáng nào cô ấy cũng trang điểm.",[],"Phân biệt: <span class='zh'>化装</span> = cải trang (đoạn 5)."],[2,"屑","xiè","dt.","tiết","mảnh nhỏ, mảnh vụn",1,"","碎末。","没有纸屑","地上都是纸屑。","Đất toàn giấy vụn.",["纸屑"],"SBT câu 33–36: <span class='zh'>组织碎屑</span>."],[3,"抢劫","qiǎngjié","đgt.","thương kiếp","cướp giật, ăn cướp",1,"","用暴力把别人的东西夺过来，据为己有。","抢劫等犯罪痕迹","他因抢劫被捕。","Hắn bị bắt vì cướp giật.",[],"SBT nghe câu 5."],[4,"痕迹","hénjì","dt.","ngân tích","vết tích, dấu vết",1,"","物体留下的印儿；残存的迹象。","犯罪痕迹","现场没有留下任何痕迹。","Hiện trường không để lại dấu vết gì.",[],"Bài tập 3②. SBT câu 35."],[5,"停顿","tíngdùn","đgt.","đình đốn","tạm dừng, ngừng lại",1,"","（事情）中止或暂停；说话时语音上的间歇。","侦破工作一时陷入停顿","他说到这里停顿了一下。","Nói đến đây anh ngừng một chút.",[],"Bài tập 2①; 3②."],[6,"嫌疑","xiányí","dt.","hiềm nghi","sự tình nghi, sự nghi ngờ",1,"","被怀疑有某种行为的可能性。","有嫌疑","他有作案嫌疑。","Hắn có hiềm nghi gây án.",["嫌疑人"],"Bài tập 1 (ví dụ): <span class='zh'>可疑 · 怀疑 · 疑问 · 疑惑</span>; 3②."],[7,"线索","xiànsuǒ","dt.","tuyến tác","đầu mối, manh mối",1,"","比喻事物发展的脉络或探求问题的途径。","唯一的线索","警方正在寻找线索。","Cảnh sát đang tìm manh mối.",[],"Bài tập 3②."],[8,"歹徒","dǎitú","dt.","đãi đồ","tên vô lại, tên côn đồ",1,"","坏人。","抓住了歹徒","歹徒被当场抓获。","Tên côn đồ bị bắt tại chỗ.",[],"Bài tập 3②. SBT câu 21."],[9,"恐惧","kǒngjù","tt.","khủng cụ","sợ hãi, hoảng sợ",1,"","惊慌害怕。","居民恐惧感大增","他心里充满了恐惧。","Lòng anh đầy sợ hãi.",[],"Xem <b>辨析 恐惧—恐怖</b>."],[10,"铜","tóng","dt.","đồng","đồng (ký hiệu Cu)",1,"","金属元素，符号Cu。","铜制的框架","这是一尊铜像。","Đây là một bức tượng đồng.",[],""],[11,"框架","kuàngjià","dt.","khuông giá","khung (ảnh, cửa, xe...), sườn (tàu, nhà...)",1,"","建筑工程中由梁、柱等联结而成的结构；比喻事物的组织、结构。","铜制的框架","文章的框架。","Khung sườn bài văn.",[],""],[12,"残留","cánliú","đgt.","tàn lưu","còn sót lại, còn lại",1,"","部分地遗留下来。","指纹只残留有指尖部位","农药残留。","Dư lượng thuốc trừ sâu.",[],"Bài tập 1: <span class='zh'>停留 · 滞留 · 留下 · 挽留</span>."],[13,"刑事","xíngshì","tt.","hình sự","hình sự",1,"","有关刑法的。","因刑 ,"giao xoa","đan chéo, đan xen, chồng chéo",1,"","几个方向不同的线条或线路互相穿过。","在缉毒战场上交叉","两条路在这里交叉。","Hai con đường giao nhau ở đây.",[],""],[39,"包袱","bāofu","dt.","bao phục","gánh nặng, vật nặng",1,"","用布包起来的包儿；比喻某种负担。","心里包袱很重","放下思想包袱。","Gạt bỏ gánh nặng tư tưởng.",[],"SBT nghe 14–17: <span class='zh'>从包袱里掏出</span>."],[40,"胆怯","dǎnqiè","tt.","đảm khiếp","nhút nhát, sợ sệt",1,"","胆小；畏缩。","提起狗就胆怯","第一次上台，她有点儿胆怯。","Lần đầu lên sân khấu, cô hơi rụt rè.",[],""],[41,"哄","hǒng","đgt.","hống","dỗ dành, dỗ ngọt, vỗ về, đánh lừa",1,"","用言语或行动引人高兴（特指看小孩儿）；用假话骗人。","可任你怎么哄","妈妈哄孩子睡觉。","Mẹ dỗ con ngủ.",[],"SBT câu 17D."],[42,"信赖","xìnlài","đgt.","tín lại","tin cậy",1,"","信任并依靠。","对小罗非常的信赖","他是值得信赖的朋友。","Anh ấy là người bạn đáng tin cậy.",[],""],[43,"忠诚","zhōngchéng","tt.","trung thành","trung thành",1,"","（对国家、人民、事业、领导、朋友等）尽心尽力。","非常的信赖和忠诚","狗对主人很忠诚。","Chó rất trung thành với chủ.",[],"Bài 36: <span class='zh'>为人忠诚</span>."],[44,"舌头","shétou","dt.","thiệt đầu","cái lưỡi",1,"","辨别滋味、帮助咀嚼和发音的器官。","伸出舌头舔一舔","他伸出舌头做了个鬼脸。","Nó thè lưỡi làm mặt hề.",[],"SBT nghe 11–13."],[45,"舔","tiǎn","đgt.","thiểm","liếm",1,"","用舌头接触东西或取东西。","伸出舌头舔一舔","小猫舔着爪子。","Con mèo liếm móng.",[],"SBT nghe 11–13."],[46,"空隙","kòngxì","dt.","không khích","khe hở, khoảng trống",1,"","中间空着的地方。","车厢尾部空隙内","利用工作空隙学习。","Tranh thủ thời gian rảnh học.",[],"SBT câu 29–32."],[47,"扒","bā","đgt.","bái","cào bới, moi, đẩy sang một bên",1,"","抓着（可依附的东西）；刨开；拨动。","扒开车厢底板上铺着的塑料垫","小狗扒开了土。","Con chó bới đất.",[],""],[48,"垫","diàn","dt.","điếm","đệm, tấm lót",1,"","垫子。","塑料垫","鞋垫。","Lót giày.",[],""],[49,"叼","diāo","đgt.","điêu","ngậm, tha",1,"","用嘴夹住（物体的一部分）。","叼出一个塑料袋","小狗叼着球跑过来。","Con chó ngậm quả bóng chạy tới.",[],"SBT câu 29–32."],[50,"粉末","fěnmò","dt.","phấn mạt","bột, phấn",1,"","极细的颗粒。","粉末状毒品","把药研成粉末。","Nghiền thuốc thành bột.",[],""],[51,"口腔","kǒuqiāng","dt.","khẩu xoang","khoang miệng",1,"","口内的空腔。","渗入了辉杰的口腔","口腔卫生。","Vệ sinh răng miệng.",[],""],[52,"岗位","gǎngwèi","dt.","cương vị","cương vị, vị trí công tác, chức vụ",1,"","原指军警守卫的处所，泛指职位。","又出现在缉毒岗位上","坚守岗位。","Giữ vững vị trí.",[],""],[53,"战役","zhànyì","dt.","chiến dịch","chiến dịch",1,"","为实现一定的战略目的，在一定方向上和一定时间内进行的一系列战斗的总和。","大大小小“战役”","这是一场重要的战役。","Đây là một chiến dịch quan trọng.",[],"SBT nghe 6–10 (bẫy)."],[54,"光辉","guānghuī","tt.","quang huy","huy hoàng, vẻ vang, vinh quang",1,"","光明；灿烂。","光辉的一生","光辉的形象。","Hình tượng rực rỡ.",[],"SBT nghe 6–10."],[55,"思念","sīniàn","đgt.","tư niệm","tưởng niệm, nhớ",1,"","想念。","无尽的思念","我很思念家乡。","Tôi rất nhớ quê.",[],""]],extra:[["指纹破译","zhǐwén pòyì","giải mã vân tay"],["侦破","zhēnpò","điều tra phá án"],["现场勘查","xiànchǎng kānchá","khám nghiệm hiện trường"],["作案","zuò'àn","gây án"],["缉毒","jīdú","truy bắt ma túy"],["毒贩","dúfàn","kẻ buôn ma túy"],["化装","huàzhuāng","cải trang"],["引蛇出洞","yǐn shé chū dòng","dụ rắn ra hang"],["万无一失","wànwú-yìshī","vạn vô nhất thất"],["累立战功","lěi lì zhàngōng","lập nhiều chiến công"],["每况愈下","měikuàng-yùxià","ngày càng sa sút"]],T:[{zh:"女警官李真是公认的“指纹破译专家”。",vn:"Nữ cảnh sát Lý Chân là “chuyên gia giải mã vân tay” được công nhận.",idea:"（一）优秀女警官",q:["李真是什么人？"],note:[]},{zh:"一次，某酒店一位正在化妆的女士被残忍地杀害在室内，现场没有烟头，没有纸屑，也没有抢劫等犯罪痕迹，侦破工作一时陷入停顿，一位曾在楼道内徘徊的男子有嫌疑，却苦于找不到证据。经过反复多次的现场勘查，窗台上一枚残缺的指纹成了唯一的线索，李真经过几个昼夜反复细致的比对，最终得出结论，抓住了歹徒。",vn:"Một lần, một phụ nữ đang trang điểm trong khách sạn bị sát hại dã man trong phòng; hiện trường không có đầu thuốc lá, không có giấy vụn, cũng không có dấu vết cướp bóc; việc phá án nhất thời đình trệ. Một người đàn ông từng lảng vảng ở hành lang bị nghi ngờ, nhưng khổ nỗi không tìm được chứng cứ. Qua nhiều lần khám nghiệm hiện trường, một dấu vân tay khuyết trên bậu cửa sổ trở thành manh mối duy nhất; Lý Chân sau mấy ngày đêm đối chiếu tỉ mỉ, cuối cùng đưa ra kết luận, bắt được hung thủ.",idea:"Vụ án khách sạn.",q:["李真是怎样破获女士被杀案的？"],note:[["没有……，没有……，也没有……","Liệt kê phủ định."],["苦于……","Khổ nỗi…"]]},{zh:"另一次，某地发生多起入室抢劫案，附近居民恐惧感大增。其中两起案件提取到了犯罪嫌疑人的指纹，一枚是在玻璃上，而且指纹严重变形；另一枚是在铜制的框架上，指纹只残留有指尖部位。李真天天盯着指纹看，开始怎么也理不出头绪，两枚指纹都是残缺变形的，可以把两枚指纹结合起来分析吗？经过努力，李真发现因刑事犯罪被关押，一年前刑满放出监狱的王某的指纹与现场指纹具有共同特点，王某作案嫌疑很大。为了慎重起见，她又将其他现场遗留的指尖部位指纹与王某的指纹反复比较，最终认定该系列抢劫案为王某所为。",vn:"Lần khác, ở một nơi xảy ra nhiều vụ cướp đột nhập nhà, cư dân xung quanh sợ hãi tăng mạnh. Hai vụ trong số đó lấy được vân tay nghi phạm: một cái trên kính, lại biến dạng nghiêm trọng; một cái trên khung đồng, chỉ còn phần đầu ngón tay. Ngày nào Lý Chân cũng nhìn chằm chằm vào vân tay, lúc đầu thế nào cũng không tìm ra manh mối; hai dấu vân tay đều khuyết và biến dạng — có thể kết hợp hai cái lại để phân tích không? Sau nhiều nỗ lực, cô phát hiện vân tay của Vương — người từng bị giam vì phạm tội hình sự, mãn hạn ra tù một năm trước — có đặc điểm chung với vân tay hiện trường, Vương có hiềm nghi rất lớn. Để thận trọng, cô lại đem các vân tay đầu ngón còn sót ở hiện trường khác so sánh nhiều lần với vân tay của Vương, cuối cùng xác định loạt vụ cướp là do Vương gây ra.",idea:"Loạt vụ cướp.",q:["李真是怎样破获入室抢劫案的？"],note:[["一枚……；另一枚……","Một cái… cái kia…"],["为了慎重起见","Xem Ngữ pháp 1."],["为……所为","Do… gây ra (văn viết)."]]},{zh:"李真说，指纹认定工作繁重、枯燥，不能有半点麻痹和失误，是一项考验耐心的工作。十余年间，李真全身心投入到痕迹检验和指纹管理工作中，查获了不少犯罪分子，使罪犯得到了应得的制裁。",vn:"Lý Chân nói, công việc nhận định vân tay nặng nề, khô khan, không được có chút lơ là hay sơ suất nào, là công việc thử thách lòng kiên nhẫn. Hơn mười năm, cô dồn toàn tâm vào kiểm nghiệm dấu vết và quản lý vân tay, tra bắt không ít tội phạm, khiến chúng bị trừng trị thích đáng.",idea:"Công việc kiên nhẫn.",q:[],note:[["不能有半点……","Không được có chút…"]]},{zh:"公安局接到情报，有人要在某地进行毒品交易，志强立刻带领手下实地走访调查，很快了解到：几天前，的确有一伙人运来大批毒品。因各处防守严密，毒贩把东西藏在了桃花乡附近的大山里，准备参与交易的人也住在附近。志强感到毒贩十分狡猾，为了做到万无一失，他确定了“化装行动、引蛇出洞、主动出击”的破案思路。",vn:"Sở công an nhận được tin tình báo: có người sắp giao dịch ma túy ở một nơi. Chí Cường lập tức dẫn cấp dưới đi thực địa điều tra, nhanh chóng biết được: mấy hôm trước quả có một nhóm người chở đến một lượng lớn ma túy. Vì các nơi canh phòng nghiêm ngặt, bọn buôn giấu hàng trong núi gần xã Đào Hoa, người định tham gia giao dịch cũng ở gần đó. Chí Cường thấy bọn buôn rất xảo quyệt; để chắc chắn không sơ hở, anh xác định hướng phá án “cải trang hành động, dụ rắn ra hang, chủ động tấn công”.",idea:"（二）缉毒警察的故事",q:["志强确定了什么破案思路？"],note:[["为了做到万无一失","Để chắc chắn không sơ suất."]]},{zh:"志强假扮成购买毒品的毒贩，与对方接上了头。对方提出在山里进行交易，志强认为山里地形复杂，提出在山下交易。信息传过去，对方却保持了沉默。时间一天天过去，志强心中十分焦急，但他清楚，必须沉着冷静，他决定暂且拖一拖这帮毒贩。他放出风说，自己在外地还有事，没货就算了。听到这话，对方急了，提出要不就在镇子附近交易。",vn:"Chí Cường giả làm kẻ buôn đến mua ma túy, bắt được liên lạc với đối phương. Đối phương đề nghị giao dịch trong núi; Chí Cường cho rằng địa hình núi phức tạp, đề nghị giao dịch dưới chân núi. Tin truyền đi, đối phương lại im lặng. Ngày qua ngày, Chí Cường rất sốt ruột, nhưng anh biết phải bình tĩnh điềm tĩnh; anh quyết định tạm thời kéo dài với bọn này. Anh tung tin rằng mình còn có việc ở nơi khác, không có hàng thì thôi. Nghe vậy, đối phương cuống lên, đề nghị hay là giao dịch gần thị trấn.",idea:"Kiên nhẫn chờ.",q:["志强是怎样等待时机的？"],note:[["暂且拖一拖","Xem Ngữ pháp 2: <span class='zh'>暂且</span>."],["要不就……","Hay là cứ…"]]},{zh:"大清早，志强和全队民警出发了。到了交货地点，志强开始部署兵力。他让一个同事在车里隐蔽好，一个随他下车，其他同事埋伏在附近。",vn:"Sáng sớm, Chí Cường cùng cả đội xuất phát. Đến điểm giao hàng, anh bắt đầu bố trí lực lượng: một đồng nghiệp ẩn nấp trong xe, một người xuống xe theo anh, những người khác mai phục gần đó.",idea:"Bố trí lực lượng.",q:[],note:[["一个……，一个……，其他……","Phân công."]]},{zh:"刚刚布置妥当，一辆农用车和一辆摩托车朝自己缓缓驶来。面对毒贩，志强提出先验货后交钱，并告诉毒贩钱就放在车里。毒贩拿出毒品，奔向车门去取钱，车内民警扑上去，毒贩来不及反抗就被逮捕了。",vn:"Vừa bố trí xong, một chiếc xe nông dụng và một chiếc xe máy chầm chậm chạy tới. Đối mặt với bọn buôn, Chí Cường đề nghị kiểm hàng trước rồi trả tiền, và bảo tiền để trong xe. Tên buôn lấy ma túy ra, chạy đến cửa xe lấy tiền; cảnh sát trong xe nhào ra, hắn chưa kịp chống cự đã bị bắt.",idea:"Bắt gọn.",q:["毒贩是怎样被抓获的？"],note:[["先……后……","Trước… sau…"]]},{zh:"这次，缉毒大队成功破获了当地有史以来最大的一起非法运输贩卖毒品案。",vn:"Lần này, đội chống ma túy đã phá thành công vụ vận chuyển, buôn bán ma túy trái phép lớn nhất từ trước đến nay ở địa phương.",idea:"Kết quả.",q:[],note:[["有史以来","Từ trước đến nay."]]},{zh:"小罗是个兵，辉杰是只犬，这原本是一个平面上两条平行而非并列的线，却在缉毒战场上交叉，创造出感人的故事。",vn:"Tiểu La là một người lính, Huy Kiệt là một con chó — vốn là hai đường song song chứ không ngang hàng trên một mặt phẳng, lại giao nhau trên chiến trường chống ma túy, tạo nên câu chuyện cảm động.",idea:"（三）特殊的“缉毒警察”",q:[],note:[["平行而非并列……却……交叉","Xem 篇章: 照应 — mở đầu hô ứng với kết thúc."]]},{zh:"接手缉毒犬辉杰，小罗心里包袱很重。小罗怕狗，小时候被狗狂追的经历让他提起狗就胆怯。和辉杰初次见面，小罗努力和它搞好关系，可任你怎么哄，辉杰就是不理，弄得小罗很着急。没几天，辉杰生病了，小罗悉心照顾它。辉杰很快就好了，自此它对小罗非常的信赖和忠诚，每次见到小罗就会亲热地伸出舌头舔一舔。训练中，辉杰表现突出，无论毒品藏得多隐秘，辉杰一出手，不出一分钟，肯定能查出来。",vn:"Nhận chó nghiệp vụ Huy Kiệt, Tiểu La mang gánh nặng trong lòng. Anh sợ chó — hồi nhỏ bị chó đuổi khiến anh hễ nhắc đến chó là rụt rè. Lần đầu gặp, anh cố gắng làm thân, nhưng dỗ thế nào Huy Kiệt cũng không để ý, khiến anh rất sốt ruột. Ít hôm sau, Huy Kiệt ốm, Tiểu La tận tình chăm sóc. Nó nhanh khỏi, từ đó rất tin cậy và trung thành với anh, mỗi lần gặp đều thân thiết thè lưỡi liếm. Trong huấn luyện, Huy Kiệt xuất sắc: ma túy giấu kín đến đâu, nó ra tay không quá một phút chắc chắn tìm ra.",idea:"Xây dựng tình cảm.",q:["小罗是怎样和辉杰建立感情的？"],note:[["任你怎么哄，……就是不理","Dỗ thế nào cũng không…"],["无论……，……一……，肯定……","Dù… hễ… là chắc chắn…"]]},{zh:"小罗和辉杰可以正式执行任务了。这天辉杰按小罗的指令对一辆车实施搜嗅，很快就从车厢尾部空隙内查出了毒品。此后，辉杰累立战功。",vn:"Tiểu La và Huy Kiệt có thể chính thức làm nhiệm vụ. Hôm ấy Huy Kiệt theo lệnh anh đánh hơi một chiếc xe, nhanh chóng tìm ra ma túy trong khe hở ở đuôi thùng xe. Từ đó, Huy Kiệt liên tiếp lập công.",idea:"Lập công.",q:[],note:[]},{zh:"那是9月的一天，辉杰在一辆车上发现了毒品，它扒开车厢底板上铺着的塑料垫，直接从下面叼出一个装有粉末状毒品的塑料袋，薄薄的塑料袋一咬即破，毒品直接渗入了辉杰的口腔。辉杰中毒了，它呼吸急促，无法站立，得赶快上医院。路上，辉杰眼看就不行了，小罗来不及多想便给辉杰做起了人工呼吸。14公里路程，小罗一次次把辉杰从死亡线上拉回来。经过抢救，辉杰脱离了生命危险，半个月后它又出现在缉毒岗位上。",vn:"Đó là một ngày tháng 9, Huy Kiệt phát hiện ma túy trên một xe; nó bới tấm đệm nhựa trải trên sàn thùng xe, ngậm thẳng ra một túi nhựa chứa ma túy dạng bột; túi mỏng cắn là rách, ma túy ngấm thẳng vào khoang miệng nó. Huy Kiệt bị nhiễm độc, thở gấp, không đứng được, phải đi viện gấp. Trên đường, nó sắp không qua khỏi, Tiểu La không kịp nghĩ nhiều liền hô hấp nhân tạo cho nó. 14 km đường, anh hết lần này đến lần khác kéo nó về từ ranh giới sự sống và cái chết. Qua cấp cứu, Huy Kiệt thoát nguy hiểm, nửa tháng sau lại có mặt ở vị trí chống ma túy.",idea:"Nhiễm độc & cấp cứu.",q:["辉杰是怎么中毒的？小罗怎么救它？"],note:[["一咬即破","Cắn là rách."],["眼看就不行了","Sắp không qua khỏi."]]},{zh:"中毒事件让辉杰的身体每况愈下，几年后，辉杰离世。参加过无数次大大小小“战役”的辉杰走完了它光辉的一生，也给小罗的心中留下了无尽的思念。",vn:"Vụ nhiễm độc khiến sức khỏe Huy Kiệt ngày càng sa sút, mấy năm sau nó qua đời. Huy Kiệt — đã tham gia vô số “chiến dịch” lớn nhỏ — đi hết cuộc đời vẻ vang của mình, để lại trong lòng Tiểu La nỗi nhớ khôn nguôi.",idea:"Chia tay.",q:[],note:[["“战役”","Ngoặc kép — dùng từ lớn (bài 31: 大词小用)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章 & từ vựng",G:[{id:"g1",grp:0,word:"慎重",zh:"为……起见",py:"wèi……qǐjiàn",tag:"Chú thích 1",mean:"Biểu thị <b>để đạt được một mục đích nào đó</b>. Cấu trúc: <span class='zh'>为（了）+ động từ / tính từ + 起见</span>, đặt <b>trước chủ ngữ</b>.",forms:["为（了）+ 安全 / 慎重 / 方便 / 保险 + 起见，S + V"],ex:[["为了慎重起见，她又将其他现场遗留的指尖部位指纹与王某的指纹反复比较……","",1],["为安全起见，家庭购买餐具后，可将餐具放在稀释后的食用醋中煮一煮，然后再使用。","Để an toàn, mua bát đĩa về có thể đun qua giấm pha loãng rồi mới dùng."],["在说明问题时，为了周到或强调起见，往往也从正反两方面阐述表达。","Khi giải thích vấn đề, để chu đáo hoặc nhấn mạnh, thường trình bày cả hai mặt."]],tips:["Bài tập 2②."],practice:{q:"选择合适的语句填空：为了叙述方便起见　为了慎重起见　为了安全起见",type:"complete",items:[["______，我们把世界造型艺术分为三大块——西方艺术、东方艺术以及中南美洲、非洲、大洋洲艺术。","为了叙述方便起见"],["加拿大人……在冬季驾车也有着丰富的经验。但______，他们在大风雪的时候还是尽量不出门或少出门……","为了安全起见"],["……这么多书，卖得出去吗？______，我们主动向这家书店介绍了情况，提请他们全面考虑。","为了慎重起见"]]}},{id:"g2",grp:1,word:"暂且",zh:"暂且",py:"zànqiě",tag:"Chú thích 2 · phó từ",mean:"Phó từ, nghĩa là <b>tạm thời cứ như vậy trước</b>.",forms:["暂且 + V / 不 + V"],ex:[["干了几天，小王就不想干了。大家没办法，只得暂且由他去。","Làm mấy hôm Tiểu Vương không muốn làm nữa; mọi người đành tạm để cậu ấy vậy."],["时间一天天过去，志强心中十分焦急，但他清楚，必须沉着冷静，他决定暂且拖一拖这帮毒贩。","",1],["我们暂且不说染烫发对身体的伤害，对头发巨大的影响就足以引起我们的重视了。","Tạm chưa nói tác hại của nhuộm uốn tóc với cơ thể, chỉ riêng ảnh hưởng đến tóc đã đủ đáng lưu tâm."]],tips:["Bài 36 SBT câu 18C: <span class='zh'>这里暂且不谈</span>.","Bài tập 2⑤."],practice:{q:"给“暂且”选择适当的位置",type:"pos",items:[["在A这个名叫《金姑娘》的童话中，B她没有姓名。我们C称她D是穿蓝裙的小姑娘吧。","C","我们暂且称她是……"],["……这其中的原因B不论，但C没有观众的决赛，总D给人一种怅然若失的感觉。","B","这其中的原因暂且不论……"],["A大家没办法，只得B由他去，等C他心情恢复正常后，再D劝他回来。","B","只得暂且由他去……"]]}},{id:"g3",grp:1,word:"沉着",zh:"Thành ngữ & cụm từ",py:"",tag:"Từ vựng",mean:"<span class='zh'>万无一失</span> = chắc chắn không sơ hở. <span class='zh'>引蛇出洞</span> = dụ rắn ra hang. <span class='zh'>有史以来</span> = từ trước đến nay. <span class='zh'>累立战功</span> = lập nhiều công. <span class='zh'>每况愈下</span> = ngày càng sa sút. <span class='zh'>沉着冷静</span> = điềm tĩnh.",forms:["为了做到万无一失","有史以来最大的……","身体每况愈下"],ex:[["为了做到万无一失，他确定了“化装行动、引蛇出洞、主动出击”的破案思路。","",1],["中毒事件让辉杰的身体每况愈下。","",1]],tips:["SBT nghe 6–10: <span class='zh'>冷静沉着</span>."]},{id:"g4",grp:0,word:"恐惧",zh:"恐惧 / 恐怖",py:"kǒngjù / kǒngbù",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “sợ hãi, đáng sợ”, nhưng thường không thay nhau được. <span class='zh'>恐惧</span>: nhấn <b>tâm lý con người</b> hoảng sợ → chủ ngữ là <b>người</b>. <span class='zh'>恐怖</span>: nhấn <b>sự việc, cảnh tượng, thủ đoạn</b> khiến người ta sợ → không bổ nghĩa từ chỉ người.",forms:["S（人）+ 感到恐惧 / 内心的恐惧","（场面 / 电影 / 手段）+ 很恐怖"],ex:[["附近居民恐惧感大增。","",1]],tips:["<span class='zh'>×我很恐怖</span> → <span class='zh'>我很恐惧 / 我很害怕</span>."]}],BX:{grp:0,word:"恐惧",cols:["√","×"],pair:"恐惧 — 恐怖",same:["Đều có nghĩa “<b>sợ hãi, đáng sợ</b>”, nhưng thường không thay thế nhau.","昨天的经历让我感到恐惧。昨天的经历太恐怖了。"],diff:[["Nhấn mạnh <b>tâm lý</b> con người hoảng sợ, nên chủ ngữ là từ chỉ <b>người</b>.","遇到这样的事情，他恐惧极了。（√）　这件事情太恐惧了。（×）","Nhấn mạnh <b>sự kiện, cảnh tượng, thủ đoạn</b> khiến người sợ, thường không bổ nghĩa cho từ chỉ người.<div class='zh' style='margin-top:4px'>那血腥的场面太恐怖了。（√）　他恐怖极了。（×）</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["使用这么多恐惧残忍的手段太不应该了。",1,"Thủ đoạn → phải là <span class='zh'>恐怖</span>."],["他无法克服内心的恐惧，于是拼命呼救。",0,"Tâm lý người → 恐惧 đúng."],["这个电影太恐怖了，害得我一晚都没敢睡觉。",0,"Phim → 恐怖 đúng."],["看到他反常怪异的样子，我很恐怖。",1,"Chủ ngữ “我” → <span class='zh'>恐惧 / 害怕</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["嫌<u>疑</u>","可疑 · 怀疑 · 疑问 · 疑惑"],items:[["残<u>留</u>","留","停留 · 滞留 · 留下 · 挽留"],["失<u>误</u>","误","错误 · 口误 · 误会 · 延误"],["查<u>获</u>","获","获得 · 收获 · 缴获 · 获奖"],["<u>非</u>法","非","是非 · 非常 · 非凡 · 啼笑皆非"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["他稍微停了一下，又继续发表演讲。","停顿","他稍微停顿了一下，又继续发表演讲。"],["为了更保险，你还是把钱存在银行里吧。","为……起见","为了保险起见，你还是把钱存在银行里吧。"],["如此重大的群体性事件，一定要谨慎处理。","慎重","如此重大的群体性事件，一定要慎重处理。"],["导游带着游客一边游览名胜古迹，一边体验当地民俗。","带领","导游带领游客一边游览名胜古迹，一边体验当地民俗。"],["我们先把这个问题放一放，等时机成熟了再讨论吧。","暂且","我们先暂且把这个问题放一放，等时机成熟了再讨论吧。"],["快住手，你这么做是违反法律规定的。","非法","快住手，你这么做是非法的。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["沉着","埋伏","麻痹","情报","考验"],text:"作为警察，在工作中不能有半点{麻痹}和失误，接到{情报}后，必须冷静{沉着}，仔细考虑，部署兵力。有时在一个地方可能要{埋伏}好几天才能抓到罪犯，所以这也是一项{考验}耐力的工作。"},{bank:["痕迹","嫌疑","线索","歹徒","停顿"],text:"近期，小区内连续发生了几起入室盗窃案件。犯罪分子非常狡猾，地上没有脚印，家具上也没有留下{痕迹}，虽然发现几个年轻人有{嫌疑}，但找不到证据，侦破工作陷入{停顿}状态，好在最终有一个目击者提供了重要{线索}，才成功抓获了{歹徒}。"}]},EX4:{q:"请指出下列语段中是如何使用“照应”的",items:[{src:"访美之前，接到一位同窗的航空信，要我为他带几颗生枣核，而且是再三托付，这是为什么呢？我感到很蹊跷。\n我一下车，他就殷切地问：“枣核带来了吗？”我交给他后，他小心翼翼地托在掌心，显得很贵重的样子。我好奇地问他：“你要枣核有什么用？”他却很神秘地说，“等会儿你就明白啦。”\n到了他家后，他向我介绍他的住房，介绍他的家庭，介绍他的花园栽种和布局，指指点点，就是不提“枣核”。让我的好奇心越来越浓厚。临别时，他感慨地说：“近来，我老是想总布胡同院里那棵枣树。所以托你带几颗种子，试种一下。”",task:"“照应”体现在哪里？",model:"“枣核”在全文反复出现，前后照应：开头“托我带枣核……为什么呢？”埋下悬念 → 中间“枣核带来了吗？”“等会儿你就明白啦”“就是不提枣核” → 结尾揭示原因（想念故乡的枣树）。前文铺垫，后文呼应，突出了思乡的主题。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["优秀女警察李真的故事：女士被杀案","现场，嫌疑人，苦于，唯一线索，经过比对，得出结论","一位女士在酒店被杀，现场没有犯罪痕迹，一名男子有嫌疑却找不到证据。窗台上一枚残缺的指纹成了唯一线索，李真经过反复比对，最终抓住了歹徒。"],["优秀女警察李真的故事：入室抢劫案","提取到指纹，一枚……，另一枚……；把指纹结合起来；发现嫌疑人","两起抢劫案提取到的指纹，一枚在玻璃上严重变形，另一枚在铜框架上只留有指尖。李真把两枚指纹结合起来分析，发现刑满释放的王某嫌疑很大，最终认定是王某所为。"],["缉毒警察志强的故事","接到情报→实地走访→确定破案思路→假扮毒贩接头→等待时机→部署兵力→抓获毒贩","志强接到情报后实地走访，确定了“化装行动、引蛇出洞”的思路。他假扮毒贩与对方接头，沉着等待时机，最后部署兵力，在毒贩取钱时将其逮捕。"],["特殊“缉毒警察”辉杰的故事","① 建立感情：怕狗，哄狗，悉心照顾，建立信任和忠诚 ② 执行任务：累立战功，发现毒品，中毒，抢救 ③ 分别：辉杰离世，留下思念","小罗怕狗，但他悉心照顾生病的辉杰，从此辉杰对他非常信赖和忠诚。辉杰累立战功，一次叼出毒品时中毒，小罗给它做人工呼吸救回了它。几年后辉杰离世，给小罗留下了无尽的思念。"]]},PZ:{title:"篇章（8）照应",vn:"Hô ứng",intro:"<b>照应</b> là sự quan hệ, hô ứng giữa phần trước và phần sau của bài: người, việc, vật ở phần trước <b>tái hiện</b> ở phần sau; tình tiết phần sau đã được <b>chuẩn bị</b> ở phần trước. Hô ứng chu đáo giúp kết cấu chặt chẽ hơn, ý chính rõ hơn, gợi người đọc suy ngẫm.",ex:[["我这永久的悔就是：不该离开故乡，离开母亲。","Đoạn đầu tản văn 《永久的悔》 — mở bài bám sát chủ đề, đề mục và nội dung hô ứng chặt."],["开头：小罗是个兵，辉杰是只犬……创造出感人的故事。／结尾：……辉杰走完了它光辉的一生，也给小罗的心中留下了无尽的思念。","Mở đầu – kết thúc hô ứng: vừa trọn vẹn kết cấu, vừa khái quát toàn bài."],["我与父亲不相见已二年余了，我最不能忘记的是他的背影。……又看见那肥胖的，青布棉袍，黑布马褂的背影。","《背影》 (Chu Tự Thanh): cố ý lặp “背影” để nhấn mạnh, làm rõ mạch văn."]],q:"下面这段文章中是否采用了照应的方法",pvn:"自从我家养了猫以后，我就觉得猫活得比人好，要是能做一只猫该有多好啊！……对于猫来说，每天都是假期……不过仔细想一想，做猫也有缺点。首先……其次……想想看，我现在还是当人好了。",practice:[["Có dùng 照应 không?","Có — mở bài “要是能做一只猫该有多好啊” hô ứng với kết bài “我现在还是当人好了” (đầu cuối hô ứng, ý ngược lại để nêu kết luận)."]]},DP:[{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ.",items:[["事迹","shìjì","sự tích, việc làm","事：事情，事务 · 迹：留下的印子","英雄事迹。"],["团体","tuántǐ","đoàn thể","团：有组织的集体 · 体：事物的本身或全部","社会团体。"],["通讯","tōngxùn","thông tin liên lạc","通：连接，相来往 · 讯：消息，信息","通讯设备。"],["消防","xiāofáng","phòng cháy chữa cháy","消：消灭，除去 · 防：防备","消防队员。"],["物资","wùzī","vật tư","物：东西 · 资：钱财，财务","救灾物资。"],["追悼","zhuīdào","truy điệu","追：回顾过去 · 悼：悲痛地怀念","追悼会。"],["迹象","jìxiàng","dấu hiệu","迹：事物留下的印象 · 象：形状，样子","没有任何迹象。"],["事项","shìxiàng","hạng mục","事：事情，事物 · 项：事物的种类或条目","注意事项。"],["事态","shìtài","tình hình sự việc","事：事情，事物 · 态：事物的情况、样子","事态严重。"],["事务","shìwù","sự vụ","事：事情 · 务：事情","日常事务。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"“通讯诈骗”就是之前常说的“电信诈骗”，指犯罪分子利用电话、短信、QQ、微信、互联网等信息手段骗取他人财物的犯罪行为。由于近年来此类案件越来越多，犯罪手段更新升级，公安机关不断提醒民众，要提高自己的防范意识。",o:["“通讯诈骗”亦称“电信诈骗”","犯罪分子不喜欢利用互联网作案","公安机关对通讯诈骗分子从不手软","百姓应提高对通讯诈骗分子的警惕性"],a:3,why:"Đáp án sách: D — “要提高自己的防范意识”. A gần đúng nhưng đề nói 之前常说, đáp án sách chọn D."},{n:2,say:"新总统上任以来，政府一直致力于打击国内的毒品犯罪活动。在多数人看来，这短短几个月的时间里，警方的反毒品效率之高，成效之显著，远不是过去几年能比的。",o:["多数人对打击毒品犯罪表示肯定","过去几年犯罪分子没有现在猖狂","上届政府无法与新一届政府相比","百姓们对毒品犯罪活动深恶痛绝"],a:0,why:"“在多数人看来……成效之显著”. Có <span class='zh'>毒品</span>."},{n:3,say:"日前，一伙犯罪分子在一所监狱越狱，造成至少28名在押人员逃脱，据当地警察说，由于监狱守卫力量薄弱，看守人员麻痹大意，以致犯罪分子趁机越狱。目前政府已部署了大量警力进行追捕，军方也在协助解决这一事件。",o:["28名服刑人员生病了","犯罪分子从监狱逃跑了","监狱看守与罪犯有勾结","军队是抓捕罪犯的主力"],a:1,why:"“在一所监狱越狱”. Có <span class='zh'>监狱 · 麻痹 · 部署</span>."},{n:4,say:"《未来警察》是中国电影集团出品的一部科幻警匪片。影片讲述的是一个和保护能源有关的故事：生活在2080年的警察周志豪为了执行政府的任务，保护能源专家马博士，和自己的女儿一起穿越时空，回到2020年与邪恶势力进行对抗。",o:["影片的主角是环保警察","《未来警察》是进口大片","影片中的马博士有个女儿","影片畅想未来警察如何办案"],a:3,why:"Phim khoa học viễn tưởng về cảnh sát tương lai. C sai: con gái là của 周志豪."},{n:5,say:"女车主进入驾驶室，一名男子看到周边没人，迅速拉开后车门，掏出刀抵住女车主的脖子，用胶带将其绑住，继而进行抢劫。目前，涉嫌抢劫的谢某已被警方依法刑事拘留。民警提醒广大车主尤其是女性车主，将车子停放在地下停车场、偏僻地方，准备上车时，要注意一下周边有没有陌生的可疑人员，不要埋头看手机或者打电话。",o:["女车主在车内遭到了抢劫","女车主驾驶车辆时发生了事故","开车的时候不要看手机或打电话","地下车库很考验女车主的驾驶技术"],a:0,why:"“女车主进入驾驶室……继而进行抢劫”. Có <span class='zh'>抢劫 · 嫌疑 · 刑事</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：观众朋友们，大家好！今天我们请来了王警官，跟大家谈谈张庆同志生前的事迹。您好！您能不能跟我们谈谈张庆同志是怎么突发疾病去世的？\n男：他工作太拼命了，中秋节假期他一直在值班，我们开会时发现他没到，就去办公室找他，发现他因心脏病发作已然去世了。\n女：张庆警官在公安局主要分管哪方面工作呢？\n男：他从中国人民警官大学毕业以后，分配到我们刑警大队，开始时在第一线工作。后来发现他文字水平很高，就调到秘书科，主要是写各种材料。去世前，他已经是我们分局指挥室主任了。\n女：您跟他一起共事，有什么印象特别深刻的事例吗？\n男：他虽然没有什么特别光辉的事迹，但他工作严谨认真。记得1998年，我们接到报警，有一家公司的负责人被骗了，骗子非常狡猾，没留下多少线索，为了尽快破案，一接到情报，老张就带领我们几个人赶到山东，我们埋伏在嫌疑人的居住地附近，一蹲就是10几个小时。正是他的冷静沉着，为后来案件的侦破立下了汗马功劳。\n女：他平时工作怎么样？\n男：他经常加班，很少准点下班。有一次他持续高烧，还坚持带病工作，后来在同事的劝说下，才利用午休的时间去了医院。\n女：他一工作就顾不得休息和病痛了？\n男：是的，他担任指挥室主任时，工作特别忙，他的办公室有一个小沙发，他加班累了，就在沙发上躺一躺。我们领导常常说：“交给张庆的事，我从来不用说第二遍，他肯定完成得又快又好。”我们也常劝他注意休息，他总是说：“没事，指挥室年轻同事多，我得多分担些。”\n女：他的离去对他的家庭打击很大吧？\n男：那是当然的，但是他的家属很坚强。他的家庭经济情况比较困难，但他在单位从来不说家里的事。",qs:[{n:6,q:"张庆警官是怎么去世的？",o:["突发疾病去世的","在战役中牺牲的","为救同事牺牲的","遭遇车祸去世的"],a:0,why:"“因心脏病发作已然去世了”. Có <span class='zh'>战役</span> làm bẫy."},{n:7,q:"张庆刚毕业时在什么部门工作？",o:["第一线","秘书科","指挥室","人事科"],a:0,why:"“开始时在第一线工作”."},{n:8,q:"同事对张庆印象最深刻的一件事情是什么？",o:["张庆骗了狡猾的骗子","1998年随张庆破诈骗案","张庆将嫌疑人一直追到山东","98年破案，张庆落下了病根"],a:1,why:"“记得1998年……老张就带领我们几个人赶到山东”."},{n:9,q:"张庆的领导对他的工作有什么评价？",o:["他对年轻人百般呵护","他一工作就想不起来休息","他热爱工作甚于自己的身体","工作交给张庆就一百个放心吧"],a:3,why:"“交给张庆的事，我从来不用说第二遍”."},{n:10,q:"张庆的家庭情况怎么样？",o:["家庭成员众多","亲属关系复杂","家事对外都保密","家庭经济条件不好"],a:3,why:"“他的家庭经济情况比较困难”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"好好说话听起来是件简单的事情，实际却不一定，这是一种能力、一种智慧、一种修养。好好说话不是指爱说话、风趣幽默，能讲出很深刻、很有独到见解和哲理的话，而是说不要信口开河、胡言乱语；在激动的时候控制自己的情绪，照顾别人的感受；说话要分清场合对象，注意说话的方法方式。\n作为一名警察，好好说话尤其重要。\n有一回，我调解两个人的矛盾，其中一人不满，大怒起来：“你们这些警察是白吃饭的吗？我一年交那么多税养你们是白养了，一点用也没有。”听了这话，我愤怒、厌恶，又不知道该跟他说什么。这时，有个平时话不多的老民警听不下去了，站到他面前一字一句、不卑不亢地说：“如果没有警察日夜防范小偷、强盗，没有警察对犯罪分子进行严厉打击，你的企业、你的家能够平平安安、好好发展吗？”那个人用舌头舔了舔嘴唇，服气地低下了头。\n这个老民警就是个会说话的人，他听了那些话情绪一定也很激动，可是他没有暴跳如雷，也不是无言以对，而是将自己工作的崇高价值真真切切地告诉对方，让对方冷静下来。",qs:[{n:11,q:"根据本文，“好好说话”指的是什么？",o:["说风趣幽默的话","说富有哲理的话","想说什么就说什么","说话讲究方式方法"],a:3,why:"“注意说话的方法方式”."},{n:12,q:"文章中的“养你们是白养了”是什么意思？",o:["养你们很辛苦","你们要信赖我","养你们也没有用","把你们养得很白"],a:2,why:"<span class='zh'>白</span> = uổng công: “一点用也没有”."},{n:13,q:"为什么说那位“老警察”是会说话的人？",o:["他见解独到","他不感情用事","他能为对方着想","他的话以理服人"],a:3,why:"“将自己工作的崇高价值真真切切地告诉对方” — lấy lý thuyết phục."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"这是一个有关母亲的故事，发生在犯人与母亲之间。探望关在监狱的儿子的日子到了，一位来自大山深处的老母亲，先后乘坐马车、汽车和火车，来探望服刑的儿子。老母亲从包袱里给儿子掏出用白布包着的瓜子。瓜子已经炒熟，老母亲全嗑好了，没有皮，白花花、密密麻麻的。\n儿子接过瓜子仁，手开始颤抖，他知道，山里穷，路途又远，母亲一定是卖掉了鸡蛋，还要节省许多开支才能攒够路费来看自己；来之前的那段日子，母亲肯定是白天在田里忙碌，晚上在灯下嗑瓜子，嗑好的瓜子放在一起，一点点增多，自己一粒也舍不得吃，这堆瓜子不知道母亲嗑亮了多少个夜晚。母亲没有说话，只是用衣袖擦着眼泪。\n儿子低着头满心愧疚。作为身强力壮的小伙子，正是奉养母亲的时候，他却不能。在所有探监人当中，母亲衣着最为破烂。那一颗颗瓜子，包含着千言万语。儿子“扑通”一声给母亲跪下，他忏悔了。\n一次，一位新婚不久的朋友向我抱怨自己的母亲，说她没文化、思想不开通；说她什么也干不了，还爱唠叨。于是，我把这个故事讲给他听。听完，他泪眼朦胧，很久没有说话。",qs:[{n:14,q:"这个犯人的母亲是怎么来到监狱的？",o:["自己走路来的","跟朋友坐船来的","一个人坐飞机来的","坐马车、汽车、火车来的"],a:3,why:"“先后乘坐马车、汽车和火车”."},{n:15,q:"母亲给儿子带来了什么？",o:["嗑好的瓜子","白色的包袱","好吃的点心","崭新的衣服"],a:0,why:"“老母亲全嗑好了”. Có <span class='zh'>包袱</span> làm bẫy."},{n:16,q:"这个犯人的母亲是个什么样的人？",o:["非常小气的人","很有文化的人","身强力壮的人","爱自己儿子的人"],a:3,why:"Cắn hạt dưa suốt đêm cho con."},{n:17,q:"我为什么要给朋友讲这个故事？",o:["这个故事很有趣","朋友的母亲很保守","朋友抱怨自己的母亲","为了让朋友哄母亲高兴"],a:2,why:"“一位……朋友向我抱怨自己的母亲……于是，我把这个故事讲给他听”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["你不认真学习，那怎么可能有好成绩是可想而知的。","这种正规组织类型的单一化，正是深入改革的主要障碍。","关于这一点，我将在下一节里加以说明，这里暂且不谈。","这篇文章既是生活实际的反映，又是作者真挚感情的流露。"],a:0,why:"<b>Pha trộn kết cấu</b>: câu hỏi “怎么可能……” lẫn với “……是可想而知的” → bỏ một trong hai. C dùng <span class='zh'>暂且</span> (đúng)."},{n:19,o:["在教学程序上，首先要建立起适应新的学科结构的思维框架。","社会学的首要任务，就是要研究社会结构的谐调和正常运行。","展望未来的计算机技术，预计将会出现以下几种崭新的计算机。","今天，我来到扬州瘦西湖的地方，游览了白塔、钓鱼台和五亭桥等风景点。"],a:3,why:"<b>Thừa từ</b>: <span class='zh'>来到扬州瘦西湖的地方</span> → bỏ “的地方”. A dùng <span class='zh'>框架</span> (đúng)."},{n:20,o:["任何时代都终究要建设新的文明，但新的文明的创造性建设都只有在原有传统的基础上才能进行。","她无奈地说：“我们还是分手吧，因为咱们俩是不同类型的人，你是现实主义者，反而我是超现实主义者。”","这幅画中既有远古彩陶图案的影响，又有20世纪抽象画风的韵味，其平面分割、变形处理和色彩的装饰，又不乏现代意味。","单纯的经济和文化水平的差别，还不能构成不平等，只有当这种差别妨碍一些民族享受法律所规定的平等权利时，它才成为事实上的不平等。"],a:1,why:"<b>Dùng từ sai</b>: <span class='zh'>反而</span> không hợp → <span class='zh'>而我是……</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"禁毒大队获知，___宾馆有毒贩入住。民警在对房间进行检查时，一个房内的人拒不开门。为防止犯罪嫌疑人逃跑、跳窗和毁灭证据，民警强行进入房间，躲在卫生间的歹徒突然跳出，手持大刀对民警进行追砍，在___犯罪嫌疑人砍刀的过程中，民警小何身体多处受伤，他强忍伤痛，在其他民警的___下，将犯罪嫌疑人成功制服，并查获大量毒品。",o:["此　争夺　搭配","其　取得　结合","某　夺取　配合","该　获取　合作"],a:2,why:"<span class='zh'>某宾馆</span>; <span class='zh'>夺取砍刀</span>; <span class='zh'>在……的配合下</span>. Có <span class='zh'>歹徒 · 查获 · 毒品</span>!"},{n:22,text:"邻里守望制度是一种居民主动___、与执法者积极合作的犯罪预防___。它将邻近的居民组织起来成为警察的“耳目”。这些特殊“耳目”在发现可疑行为后即刻报警，成员间还可相互交流，学习家庭防范___。“邻里守望”___增强社区居民对社区问题的关注度，从而在根本上提高社区的宜居指数。",o:["参加　办法　技术　擅长于","参与　措施　技巧　有助于","参考　设施　技艺　平行于","参照　手段　技能　并列于"],a:1,why:"<span class='zh'>主动参与</span>; <span class='zh'>预防措施</span>; <span class='zh'>防范技巧</span>; <span class='zh'>有助于</span>. Bẫy: <span class='zh'>平行 · 并列</span> (từ mới)."},{n:23,text:"一个患抑郁症的女孩与母亲发生争吵后独自出走，家人四处寻找___，只好___警察。在___查看了周边的监控以后，民警发现女孩最后在一所医院附近消失。之后，民警与女孩的家人一起来医院附近，当看到仍在街头徘徊的女儿时，女孩的家人不禁___。",o:["结果　帮助　逐渐　悲喜交加","果然　协助　专一　喜笑颜开","因果　互助　统一　欢天喜地","未果　求助　逐一　喜极而泣"],a:3,why:"<span class='zh'>寻找未果</span>; <span class='zh'>求助警察</span>; <span class='zh'>逐一查看</span>; <span class='zh'>喜极而泣</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"公元前4世纪，意大利有个叫皮斯阿司的年轻人触犯了法律，将被处死。刑期临近，他希望能回家乡见母亲最后一面。\n(24)，但条件是：他必须找一个人来替他去监狱。这是一个看似简单其实似乎不可能实现的要求。假如皮斯阿司一去不返怎么办？(25)？\n这个消息传出后，有一个人表示愿意来替换皮斯阿司——他就是皮斯阿司的好友达蒙。达蒙进了监狱后，皮斯阿司就返回家乡看望母亲。时间一天天过去，(26)，都说达蒙上了皮斯阿司的当。\n一直到行刑的那一天，皮斯阿司还没有回来，只好由达蒙替死。当达蒙被带到刑场时，(27)，有的非常同情他。刀已经举起，达蒙眼看就要被杀头了。就在这时，皮斯阿司飞奔而来，高声喊着：“我回来了！我回来了！”很多人都以为自己是在梦中，(28)，他们紧紧地拥抱在一起。\n国王知道这件事后，不仅免除了皮斯阿司的死刑，而且重重地奖赏了他的朋友达蒙。",opts:["皮斯阿司音信全无，人们议论纷纷","他的这个要求被国王准许了","围观的人有的笑话他是个傻瓜","这时皮斯阿司已经冲到达蒙的身边","谁愿意冒着被杀头的危险干这件傻事呢"],ans:{24:1,25:4,26:0,27:2,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"王志是全国知名警犬驯导员，今年，他新带了一只警犬“小胖”，让我们听听1岁的小胖如何讲述它心目中的“爸爸”。\n大家好，我是小胖，前几天刚满1岁。不过爸爸说，我差不多有5岁孩子那么高的智商呢！3个月前，我已经是一条光荣的公安警犬了。听说我爸爸是警犬基地资格最老的驯导员了，我和他一定超有缘分，不然为什么当初他一眼就相中了我呢。\n33年前，爸爸开始驯导警犬，他总跟人家说：“我比较笨，跟动物打交道省事儿。”其实，一个人喜不喜欢狗，我们一闻就知道，爸爸就是一个打心眼里喜欢我们的人。他为了照顾我们，把家都搬到了离市区很远的山野基地附近。每天一大早，他就来到我们的宿舍，先给我搞好卫生，然后给我梳毛，把我照顾舒服了，就开始一天的训练。爸爸说，虽然我是警犬，但我有一年玩儿的时间。我在绿油油的草坪上撒欢奔跑，把丢出去的球叼回来，我可以轻巧地钻过树丛的空隙，我还能翻过高高的障碍墙。\n我有个姐姐叫佳鹿，爸爸经常带着她执行安检任务，姐姐特别棒，每次都能很出色地完成任务。一天的工作完成后，爸爸累得腰都快直不起来了，有一次他连续工作了30多个小时，累得饭都没吃就睡着了。",qs:[{n:29,q:"关于“王志”，我们知道什么？",o:["他今年33岁了","他已经离婚了","他是一名驯犬员","他这个人比较笨"],a:2,why:"“王志是全国知名警犬驯导员”."},{n:30,q:"王志为什么把家搬到了基地附近？",o:["为了远离城市","为了方便照顾警犬","为了看到更美的风景","为了更好地跟“小胖”玩儿"],a:1,why:"“他为了照顾我们，把家都搬到了……基地附近”."},{n:31,q:"“小胖”现在的主要任务是：",o:["习惯警犬的生活","向姐姐佳鹿学习","在玩儿中长本领","和驯导员搞好关系"],a:2,why:"“我有一年玩儿的时间……叼回来……钻过……翻过……”. Có <span class='zh'>叼 · 空隙</span>!"},{n:32,q:"这篇文章的主要内容是：",o:["警犬的日常生活","警犬“小胖”在成长","驯导员和警犬之间的故事","警犬“小胖”和“佳鹿”的故事"],a:2,why:"Chủ đề: “小胖” kể về “bố” — người huấn luyện."}]},{ins:"第33–36题：请选出正确答案。",text:"方宇丽是一名女法医。参加工作以来，她参与了各类案件的现场勘查及法医鉴定工作，为刑事案件的准确定性提供了依据，为命案侦破提供了方向。\n面对高度腐败、奇臭无比的尸体；面对条件恶劣、遭到破坏、也许一无所获的现场，她毫不犹豫地只说三个字“让我去”！\n那年，发生了一起交通事故，车主把人撞死后，开车逃跑了。交通警察几经努力，终于查获了嫌疑车辆，但车主却坚持说他与事故无关。没有目击证人、没有直接证据，怎么办？方宇丽说：“必须找到证据！”\n深夜的办公室，她反复分析、琢磨，仔细推演案发过程；还和同事一起开车赶到案发地，分析可能遗漏了哪些痕迹；她想到了事故车辆，虽经过了处理，但也说不定会有些许线索？她再次来到事故车辆面前，开始仔仔细细检查起来，在此之前，这辆车已被她检查过六次。跪在车前，钻入车下，她一点点地检验车体，分析车上残留的每一点痕迹，不放过一丝一毫可疑之处。\n她的放大镜最终在该车左前轮上停了下来！按捺住心头的激动，她小心翼翼地用镊子夹起那一小块可疑物，放进证据袋。很快，检验比对得出了结论：方宇丽在该车左前轮提取到的是一小块人体组织碎屑，经DNA检验鉴定，确认为受害人的人体组织！\n此案的侦破终于得到了直接证据。狡猾的犯罪嫌疑人终于得到了应有的制裁。",qs:[{n:33,q:"根据上文，方宇丽从事的工作是：",o:["解剖尸体","法医鉴定","处理交通事故","还原案发过程"],a:1,why:"“参与了……现场勘查及法医鉴定工作”."},{n:34,q:"与第2段画线词语“一无所获”意思最相近的词语是：",o:["满载而归","两手空空","一无所得","荡然无存"],a:2,why:"<span class='zh'>一无所获 = 一无所得</span> — không thu được gì."},{n:35,q:"在交通事故案件中，方宇丽最后找到的证据是：",o:["人体组织存留物","车上残留的划痕","车轮的碰撞痕迹","现场的目击证人"],a:0,why:"“一小块人体组织碎屑”. Có <span class='zh'>屑 · 残留 · 痕迹 · 检验 · 制裁</span>!"},{n:36,q:"根据上文，最适合形容方宇丽的词汇是：",o:["胆大心细","廉洁自律","善良聪明","爱岗敬业"],a:3,why:"Đáp án sách: D — yêu nghề, tận tụy (“让我去” · kiểm tra xe 7 lần)."}]}]},W:{zh:"写作",vn:"Viết văn: 警察故事",t:"35 phút",min:!0,task:"本课给我们讲了三个警察的故事。通过这些故事，不仅让我们看到了警察们工作的辛苦、认真，还让我们认识了一类特殊警察——缉毒犬。在你的印象中，有没有特别感动你的警察故事？请以“警察故事”为题写一写你所知道的警察故事，字数不少于400字。",target:400,steps:[["Mở bài","Ấn tượng của bạn về cảnh sát; dẫn vào câu chuyện."],["Sự việc","Thời gian, địa điểm, chuyện gì xảy ra: <span class='zh'>报警 · 嫌疑 · 线索 · 痕迹</span>."],["Hành động","Cảnh sát xử lý thế nào: <span class='zh'>沉着 · 部署 · 埋伏 · 为了……起见 · 暂且</span>."],["Kết quả","<span class='zh'>查获 · 逮捕 · 制裁</span>."],["Cảm nhận","Dùng <b>照应</b> — kết bài hô ứng mở bài."]],outline:[["一 · 开头","我对警察的印象"],["二 · 经过","发生了什么事"],["三 · 处理","警察怎么做"],["四 · 结果","事情怎样解决"],["五 · 结尾","感受（与开头照应）"]],model:"警察故事\n小时候，我觉得警察很严肃，甚至有点儿怕他们。直到那年夏天发生的一件事，才让我真正认识了警察。\n那年暑假，我和妈妈去市场买菜。人特别多，妈妈一个不留神，钱包就被人偷走了。钱包里不但有钱，还有身份证和银行卡，妈妈急得都快哭了。我们赶紧去附近的派出所报警。接待我们的是一位姓陈的年轻警察，他让妈妈先别着急，沉着地询问了丢钱包的时间、地点和经过，然后认真地记录下来。\n为了慎重起见，陈警官马上带着我们回到市场，调看了附近商店的监控录像。录像里，一个戴帽子的男子在妈妈身后停留了很久，十分可疑。可是人太多，看不清他的脸，线索一下子断了。陈警官没有放弃，他说先暂且回去等消息，他们会继续调查。\n第二天晚上，我们接到了陈警官的电话：小偷抓到了！原来，他们发现那名男子还在别的市场作案，就埋伏了整整一个下午，终于把他当场抓获。妈妈的钱包、证件一样也没少。\n后来我才知道，为了这个案子，陈警官两天几乎没睡觉。妈妈要送他一面锦旗，他笑着说：“这是我们应该做的。”\n从那以后，我再也不怕警察了。我知道，他们虽然看起来严肃，心里却装着每一个普通的老百姓。",check:["Có tiêu đề “警察故事”","Có thời gian, địa điểm, sự việc","Có hành động của cảnh sát","Có kết quả và cảm nhận","Có hô ứng đầu – cuối (照应)","Dùng ít nhất 4: 线索 · 嫌疑 · 沉着 · 为了……起见 · 暂且 · 埋伏 · 查获 · 逮捕","Không ít hơn 400 chữ"]},SUM:{words:["化妆","屑","抢劫","痕迹","停顿","嫌疑","线索","歹徒","恐惧","铜","框架","残留","刑事","监狱","慎重","麻痹","失误","考验","检验","查获","制裁","公安局","情报","毒品","带领","沉着","暂且","部署","埋伏","布置","反抗","逮捕","非法","贩卖","平面","平行","并列","交叉","包袱","胆怯","哄","信赖","忠诚","舌头","舔","空隙","扒","垫","叼","粉末","口腔","岗位","战役","光辉","思念"],patterns:[["为（了）+ Adj / V + 起见","为了慎重起见，她又将……反复比较。"],["暂且 + V","他决定暂且拖一拖这帮毒贩。"],["任你怎么……，……就是不……","可任你怎么哄，辉杰就是不理。"],["无论……，……一……，肯定……","无论毒品藏得多隐秘，辉杰一出手，不出一分钟，肯定能查出来。"],["篇章：照应","开头：……创造出感人的故事。结尾：……留下了无尽的思念。"]],diff:["恐惧: tâm lý người, chủ ngữ là người (他很恐惧 · 内心的恐惧) — 恐怖: sự việc, cảnh tượng, thủ đoạn đáng sợ (恐怖的电影 · 场面很恐怖)","化妆 (trang điểm) / 化装 (cải trang) · 布置 / 部署 · 埋伏 máifú · 逮捕 dàibǔ"],sentences:["指纹认定工作繁重、枯燥，不能有半点麻痹和失误，是一项考验耐心的工作。","志强感到毒贩十分狡猾，为了做到万无一失，他确定了“化装行动、引蛇出洞、主动出击”的破案思路。","参加过无数次大大小小“战役”的辉杰走完了它光辉的一生，也给小罗的心中留下了无尽的思念。"],hw:["Học thuộc 55 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “警察故事” ≥400 chữ (mục 7).","Đặt 3 câu với 为……起见 và 3 câu với 暂且.","Làm Sách bài tập bài 37.","Đọc trước bài 38."]}});
