<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 23 · 大数据时代 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-23",num:23,book:"HSK 标准教程 6（下）",unit:{n:6,zh:"趣味世界",vn:"Thế giới thú vị"},title:"大数据时代",vn:"Thời đại dữ liệu lớn",chars:1061,source:"",goals:["Đọc hiểu bài thuyết minh 1061 chữ: <b>dữ liệu lớn là gì, dùng để làm gì</b> (Baidu dự đoán World Cup) và <b>kết nối tương lai</b> qua ví dụ y tế – sức khỏe.","Dùng được 51 từ mới, nhất là nhóm <b>dữ liệu – y học</b>: <span class='zh'>预测 · 模型 · 验证 · 防治 · 萌芽 · 基因 · 遗传 · 隐患 · 预兆 · 案例 · 血压 · 器材 · 临床 · 生理</span> và nhóm <b>văn viết</b>: <span class='zh'>通俗 · 卓越 · 派遣 · 共计 · 公认 · 扭转 · 荒谬 · 交代 · 追究 · 不言而喻 · 实事求是 · 展望</span>.","Nắm <span class='zh'>加以 · 大大 / 远远</span>.","Phân biệt <span class='zh'>万分 — 十分</span>; làm quen <b>修辞 (1): 仿词 — tạo từ phỏng theo</b>.","Tóm tắt (缩写) bài khóa thành ~350 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (加以 · 万分—十分) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (大大 / 远远) · Đoạn 4–7 · 仿词 · Bài tập · Luyện đề · Viết tóm tắt"]],outline:[{tag:"起",name:"Là gì?",paras:"Đoạn 1",zh:"通俗的例子：选择航线",vn:"Mỗi người tự chọn tuyến bay → lượng dữ liệu khổng lồ được ghi lại → từ đó sắp xếp ra phương án tối ưu."},{tag:"承",name:"Dùng làm gì?",paras:"Đoạn 2",zh:"百度预测德国夺冠",vn:"Baidu thu thập dữ liệu 987 đội, 3,7 vạn trận; kiểm chứng đạt ~75%."},{tag:"转",name:"Kết nối tương lai",paras:"Đoạn 3–6",zh:"大数据与健康",vn:"Y tế + sức khỏe hòa làm một: phòng bệnh từ trong trứng nước, theo dõi tim mạch, huyết áp; bác sĩ hiệu quả hơn, y tế từ xa."},{tag:"合",name:"Ý nghĩa",paras:"Đoạn 7",zh:"知识意味着预测未来",vn:"“Sở hữu tri thức từng là nắm quá khứ, nay còn là dự đoán tương lai.”"}],warm1:{q:"现在我们已经进入了一个大数据时代，日常生活中，处处都有数据记录，比如：吃饭、运动、心跳、血压、购物等，除了上述几方面，请想一想，还有哪些数据与我们的生活关系密切？",vn:"Những dữ liệu nào của bạn đang được ghi lại hằng ngày? Bấm 有 / 无.",items:[["🏃","运动步数 · 心跳","Số bước chân · Nhịp tim"],["🛍️","购物记录","Lịch sử mua sắm"],["🗺️","出行路线","Lộ trình di chuyển"],["📺","看视频 · 听音乐的习惯","Thói quen xem video, nghe nhạc"]],talk:["你觉得大数据给生活带来了哪些方便？","大数据会不会带来隐私问题？"],link:"Bài khóa nhắc Baidu dự đoán đúng Đức vô địch World Cup 2014 — một ví dụ nổi tiếng về sức mạnh dữ liệu lớn."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"盲",rule:"盲 = <b>mù; không biết gì về…</b>.",w:[["科盲","kēmáng","người mù khoa học (có trong bài)"],["文盲","wénmáng","mù chữ"],["色盲","sèmáng","mù màu"],["法盲","fǎmáng","mù luật"],["股盲","gǔmáng","mù chứng khoán"],["电脑盲","diànnǎománg","mù máy tính"],["扫盲","sǎománg","xóa mù chữ"]]},{k:"航",rule:"航 = <b>đi tàu, bay</b>.",w:[["航线","hángxiàn","tuyến bay (có trong bài)"],["航程","hángchéng","hành trình bay"],["航空","hángkōng","hàng không"],["航天","hángtiān","hàng không vũ trụ"],["航海","hánghǎi","hàng hải"],["航道","hángdào","luồng tàu"],["航班","hángbān","chuyến bay"],["航向","hángxiàng","hướng bay"],["出航","chūháng","xuất phát"],["导航","dǎoháng","dẫn đường"],["领航","lǐngháng","hoa tiêu"],["夜航","yèháng","bay đêm"]]},{k:"票",rule:"票 = <b>vé, phiếu</b>.",w:[["彩票","cǎipiào","vé số (có trong bài)"],["门票","ménpiào","vé vào cửa"],["车票","chēpiào","vé xe"],["邮票","yóupiào","tem"],["船票","chuánpiào","vé tàu"],["电影票","diànyǐngpiào","vé phim"],["戏票","xìpiào","vé kịch"],["月票","yuèpiào","vé tháng"],["免票","miǎnpiào","miễn vé"],["售票","shòupiào","bán vé"],["开票","kāipiào","xuất hóa đơn"],["退票","tuìpiào","trả vé"]]},{k:"量",rule:"量 = <b>lượng</b>.",w:[["海量","hǎiliàng","lượng khổng lồ (có trong bài)"],["大量","dàliàng","lượng lớn"],["少量","shǎoliàng","lượng nhỏ"],["数量","shùliàng","số lượng"],["重量","zhòngliàng","trọng lượng"],["产量","chǎnliàng","sản lượng"],["含量","hánliàng","hàm lượng"],["能量","néngliàng","năng lượng"],["热量","rèliàng","nhiệt lượng"],["音量","yīnliàng","âm lượng"],["雨量","yǔliàng","lượng mưa"],["定量","dìngliàng","định lượng"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Là gì & dùng làm gì",from:1,to:18},{name:"Nhóm 2 · Đoạn 3–5",sub:"Dữ liệu & sức khỏe",from:19,to:40},{name:"Nhóm 3 · Đoạn 6–7",sub:"Y tế tương lai",from:41,to:51}],V:[[1,"通俗","tōngsú","tt.","thông tục","thông thường, phổ thông",1,"","浅显易懂，适合一般人的水平和需要。","以通俗的例子这样告诉我们","这本书写得很通俗。","Cuốn sách viết rất dễ hiểu.",["通俗易懂"],""],[2,"堆积","duījī","đgt.","đôi tích","chồng chất, chất đống",1,"","（事物）成堆地聚集。","堆积如山的记录","仓库里堆积着很多货物。","Trong kho chất đống nhiều hàng.",["堆积如山"],"SBT câu 19."],[3,"卓越","zhuóyuè","tt.","trác việt","nổi bật, lớn lao, xuất sắc",1,"","非常优秀，超出一般。","将是最卓越的","他为国家做出了卓越的贡献。","Ông có cống hiến xuất sắc cho đất nước.",[],"Bài tập 1: <span class='zh'>飞越 · 越过 · 越发 · 越级</span>; 3②."],[4,"预测","yùcè","đgt.","dự trắc","dự đoán, dự báo",0,"","预先推测或测定。","准确预测德国夺冠","专家预测明年经济会好转。","Chuyên gia dự đoán năm sau kinh tế khởi sắc.",[],"Từ có dấu *."],[5,"功劳","gōngláo","dt.","công lao","công lao, sự đóng góp",1,"","对事业等的贡献。","就是大数据的功劳","这次成功有大家的功劳。","Thành công lần này có công của mọi người.",[],"SBT câu 24–28: “功劳” (mỉa mai)."],[6,"派遣","pàiqiǎn","đgt.","phái khiển","gửi đi, phái đi",1,"","（政府、机关、团体等）命人到某处做某项工作。","派遣数据专家全面搜索……","公司派遣他到国外工作。","Công ty cử anh ra nước ngoài làm việc.",[],"Bài tập 2①."],[7,"战略","zhànlüè","dt.","chiến lược","chiến lược",1,"","决定全局的策略。","建立战略合作伙伴关系","这是公司的发展战略。","Đây là chiến lược phát triển của công ty.",["战略合作"],"Bài tập 3②."],[8,"模型","móxíng","dt.","mô hình","mô hình",1,"","依照实物的形状和结构按比例制成的物品；数学模型。","将各类数据融入预测模型中","他做了一个飞机模型。","Anh làm một mô hình máy bay.",["预测模型"],"SBT câu 19C."],[9,"共计","gòngjì","đgt.","cộng kế","tổng cộng, tính gộp",1,"","合起来计算。","这一海量数据库共计涉及……","这次活动共计花费三万元。","Hoạt động lần này tổng cộng tốn ba vạn tệ.",[],"Bài tập 2②."],[10,"验证","yànzhèng","đgt.","nghiệm chứng","nghiệm chứng, kiểm chứng",1,"","通过试验使得到证实。","进行了结果验证","这个结论还需要验证。","Kết luận này còn cần kiểm chứng.",[],""],[11,"万分","wànfēn","phó.","vạn phân","hết sức, vô cùng",1,"","非常；极其。","令大数据研究者万分振奋","听到这个消息，我万分激动。","Nghe tin này tôi vô cùng xúc động.",[],"Xem <b>辨析 万分—十分</b>. SBT nghe câu 5."],[12,"振奋","zhènfèn","tt.","chấn phấn","phấn chấn, phấn khởi",1,"","（精神）振作奋发。","万分振奋","这个好消息令人振奋。","Tin vui này khiến người ta phấn chấn.",["令人振奋"],"Bài tập 3①."],[13,"公认","gōngrèn","đgt.","công nhận","công nhận",1,"","大家一致认为。","人们公认……","他是公认的足球天才。","Anh ấy là thiên tài bóng đá được mọi người công nhận.",[],"Bài tập 2③. SBT nghe câu 8."],[14,"扭转","niǔzhuǎn","đgt.","nữu chuyển","xoay chuyển, thay đổi",1,"","纠正或改变事物的发展方向或现状。","彻底扭转先前陈旧而被动的有病治病方式","我们终于扭转了不利局面。","Cuối cùng chúng tôi đã xoay chuyển được thế bất lợi.",["扭转局面"],"Bài tập 3②."],[15,"先前","xiānqián","dt.","tiên tiền","trước kia, trước",1,"","以前。","先前陈旧而被动的……方式","他比先前胖多了。","Anh ấy béo hơn trước nhiều.",[],"Bài tập 2④. SBT nghe câu 4."],[16,"陈旧","chénjiù","tt.","trần cựu","lỗi thời, cũ kỹ",1,"","旧的；过时的。","陈旧而被动的有病治病方式","这些设备已经很陈旧了。","Những thiết bị này đã rất cũ kỹ.",["观念陈旧"],"SBT câu 9."],[17,"被动","bèidòng","tt.","bị động","bị động, thụ động",1,"","待外力推动而行动的。","陈旧而被动的有病治病方式","我们要变被动为主动。","Phải biến bị động thành chủ động.",[],"Bài tập 3①."],[18,"防治","fángzhì","đgt.","phòng trị","phòng chống, phòng và chữa trị",1,"","预防和治疗。","改为积极防治","防治疾病。","Phòng chữa bệnh.",[],""],[19,"消灭","xiāomiè","đgt.","tiêu diệt","tiêu diệt, loại trừ",1,"","除掉（敌对的或有害的人或事物）。","把疾病消灭在萌芽状态中","消灭蚊子。","Diệt muỗi.",[],"Bài tập 1: <span class='zh'>消化 · 消失 · 消息 · 消耗</span>."],[20,"萌芽","méngyá","đgt.","manh nha","mới nảy sinh, manh nha",1,"","植物生芽；比喻事物刚发生。","把疾病消灭在萌芽状态中","把问题解决在萌芽状态。","Giải quyết vấn đề ngay từ trong trứng nước.",["萌芽状态"],"Bài tập 3①. SBT nghe câu 1."],[21,"荒谬","huāngmiù","tt.","hoang mậu","hoang đường, phi lý",1,"","极端错误；非常不合情理。","……的想法也不显得荒谬了","这种说法太荒谬了。","Cách nói này quá phi lý.",[],"SBT nghe 6–10."],[22,"前提","qiántí","dt.","tiền đề","điều kiện tiên quyết, tiền đề",1,"","事物发生或发展的先决条件。","有一个前提必须交代清楚","健康是幸福的前提。","Sức khỏe là tiền đề của hạnh phúc.",[],"SBT câu 33–36."],[23,"交代","jiāodài","đgt.","giao đại","nói rõ, giải thích rõ",1,"","嘱咐；把事情或意见向有关的人说明。","有一个前提必须交代清楚","他向我交代了几句就走了。","Anh ấy dặn tôi vài câu rồi đi.",[],"SBT nghe câu 3."],[24,"追究","zhuījiū","đgt.","truy cứu","điều tra, nghiên cứu, xem xét kỹ",1,"","追问（根由）；追查（责任等）。","追究原因","要追究事故的责任。","Phải truy cứu trách nhiệm vụ tai nạn.",["追究责任"],"SBT câu 24–28."],[25,"基因","jīyīn","dt.","cơ nhân","gien",1,"","遗传的基本单位。","无非是基因、遗传、环境……","这种病与基因有关。","Bệnh này liên quan đến gen.",[],""],[26,"遗传","yíchuán","đgt.","di truyền","di truyền",1,"","生物体的构造和生理机能由上一代传给下一代。","基因、遗传、环境","他的高个子是遗传他爸爸的。","Dáng cao của cậu ấy di truyền từ bố.",[],"SBT câu 20B."],[27,"预料","yùliào","đgt.","dự liệu","dự đoán, tính trước",1,"","事先推测。","虽非偶然，却无法预料","结果完全出乎预料。","Kết quả hoàn toàn ngoài dự đoán.",["出乎预料"],""],[28,"消除","xiāochú","đgt.","tiêu trừ","loại trừ, loại bỏ",1,"","使不存在；除去（不利的事物）。","消除隐患就成为了可能","消除误会。","Xóa bỏ hiểu lầm.",["消除隐患"],""],[29,"隐患","yǐnhuàn","dt.","ẩn hoạn","tai họa ngầm",1,"","潜藏着的祸患。","消除隐患","这座旧楼有安全隐患。","Tòa nhà cũ này có nguy cơ mất an toàn.",["安全隐患"],"Bài tập 3①. SBT nghe 6–10."],[30,"预兆","yùzhào","dt.","dự triệu","điềm báo trước, điềm",1,"","事前显露出来的迹象。","病人发病常常是有预兆的","地震前会有一些预兆。","Trước động đất sẽ có một số điềm báo.",[],""],[31,"案例","ànlì","dt.","án lệ","trường hợp, ca",1,"","某种案件的例子。","对于心脏病突发致死的案例","老师给我们讲了几个案例。","Thầy kể cho chúng tôi vài ca điển hình.",[],"SBT câu 30."],[32,"零星","língxīng","tt.","linh tinh","vụn vặt, nhỏ nhặt, lẻ tẻ",1,"","零碎的；少量的；零散的。","监测到零星先兆","天上下着零星小雨。","Trời mưa lâm râm.",[],"SBT câu 18."],[33,"挽救","wǎnjiù","đgt.","vãn cứu","cứu vãn, cứu vớt",1,"","从危险中救回来。","挽救患者的生命","医生挽救了他的生命。","Bác sĩ đã cứu sống anh ấy.",[],"Bài tập 3①."],[34,"细致","xìzhì","tt.","tế trí","tỉ mỉ, kỹ lưỡng",1,"","精细周密。","对一个病种进行细致的监测","她做事非常细致。","Cô ấy làm việc rất tỉ mỉ.",[],""],[35,"不言而喻","bùyán'éryù","thành ngữ","bất ngôn nhi dụ","không nói cũng hiểu",1,"成","不用说就可以明白。","意义是不言而喻的","健康的重要性不言而喻。","Tầm quan trọng của sức khỏe thì không cần nói.",[],"Bài tập 2⑤. SBT câu 21."],[36,"血压","xuèyā","dt.","huyết áp","huyết áp (BP)",1,"","血管中的血液对血管壁的压力。","中国血压有问题的人","他的血压有点儿高。","Huyết áp của ông ấy hơi cao.",["高血压"],"Bài tập 1 (ví dụ): <span class='zh'>气压 · 电压 · 高压 · 低压</span>."],[37,"先进","xiānjìn","tt.","tiên tiến","tiên tiến",1,"","进步比较快，水平比较高，可以作为学习的榜样的。","什么先进器材","这家医院有很多先进设备。","Bệnh viện này có nhiều thiết bị tiên tiến.",[],""],[38,"器材","qìcái","dt.","khí tài","dụng cụ",1,"","器具和材料。","先进器材","体育器材。","Dụng cụ thể thao.",[],"SBT câu 20D."],[39,"人为","rénwéi","tt.","nhân vi","nhân tạo, do con người làm ra",1,"","人造成的（多用于不如意的事）。","对他们的健康进行人为管理","这次事故是人为造成的。","Tai nạn lần này do con người gây ra.",[],""],[40,"前景","qiánjǐng","dt.","tiền cảnh","triển vọng, tiền đồ",1,"","将要出现的景象。","非常有前景的尝试","这个行业发展前景很好。","Ngành này có triển vọng phát triển tốt.",[],"Bài tập 1: <span class='zh'>景色 · 景点 · 景物 · 景观</span>."],[41,"临床","línchuáng","đgt.","lâm sàng","chẩn đoán và chữa trị trực tiếp",1,"","医学上指直接对病人进行诊断和治疗。","临床会尽量减少对人的依赖","他有多年的临床经验。","Ông có nhiều năm kinh nghiệm lâm sàng.",[],"SBT câu 19D."],[42,"依赖","yīlài","đgt.","ỷ lại","nương tựa, dựa vào, ỷ lại",1,"","依靠别的人或事物而不能自立或自给。","减少对人的依赖","孩子不能总依赖父母。","Con cái không thể mãi dựa vào bố mẹ.",[],"Bài tập 2⑥. SBT nghe 6–10."],[43,"切切实实","qièqie shíshí","tt.","thiết thiết thực thực","thực sự (切实: thiết thực)",1,"","切实，实实在在。","医生是切切实实的稀缺资源","这些措施切实可行。","Các biện pháp này thiết thực khả thi.",["切实可行"],"Bài tập 3②."],[44,"优越","yōuyuè","tt.","ưu việt","ưu việt, hơn hẳn",1,"","优胜，超过一般的。","大数据的优越之处","这里的地理位置很优越。","Vị trí địa lý nơi đây rất ưu việt.",[],"SBT câu 22."],[45,"维护","wéihù","đgt.","duy hộ","giữ gìn, duy trì",1,"","使免于遭受破坏；维持保护。","大数据的健康维护","维护世界和平。","Giữ gìn hòa bình thế giới.",[],"Bài tập 1: <span class='zh'>保护 · 修护 · 爱护 · 守护</span>."],[46,"协助","xiézhù","đgt.","hiệp trợ","giúp đỡ, trợ giúp",1,"","从旁帮助；辅助。","在一些特殊设备的协助下","请协助我们完成这项工作。","Xin hỗ trợ chúng tôi hoàn thành việc này.",[],"Bài tập 3②."],[47,"生理","shēnglǐ","dt.","sinh lý","sinh lý học",1,"","机体的生命活动和体内各器官的机能。","把人所有的生理数据攒起来","生理需求。","Nhu cầu sinh lý.",[],"SBT câu 33–36."],[48,"攒","zǎn","đgt.","toàn","tích lũy, gom lại",1,"","积聚；储蓄。","把……生理数据攒起来","他攒了很多钱。","Anh ấy tích được nhiều tiền.",[],"⚠️ Đọc <b>zǎn</b> (khác <span class='zh'>攒 cuán</span> = tụ tập)."],[49,"可行","kěxíng","tt.","khả hành","khả thi, có thể thực hiện được",1,"","可以实行。","远程医疗服务将会变得可行而且优质","这个计划切实可行。","Kế hoạch này thiết thực khả thi.",[],""],[50,"实事求是","shíshì-qiúshì","thành ngữ","thực sự cầu thị","thiết thực, tìm bản chất từ sự thật",1,"成","从实际情况出发，不夸大，不缩小。","实事求是地讲","我们要实事求是地看问题。","Ta phải nhìn vấn đề một cách thực sự cầu thị.",[],"SBT câu 22."],[51,"展望","zhǎnwàng","đgt.","triển vọng","nhìn về tương lai, nhìn ra xa, dự báo",1,"","往远处看；对事物的发展前途进行观察和预测。","展望未来","展望新的一年。","Nhìn về năm mới.",["展望未来"],"SBT câu 23 (<span class='zh'>展望“地球村”的明天</span>)."]],extra:[["科盲","kēmáng","người mù khoa học"],["摸不着头脑","mō bu zháo tóunǎo","chẳng hiểu đầu đuôi"],["航线 / 航程","hángxiàn / hángchéng","tuyến bay / hành trình"],["梳理","shūlǐ","sắp xếp, hệ thống"],["夺冠","duó guàn","đoạt chức vô địch"],["海量","hǎiliàng","lượng khổng lồ"],["淘汰赛","táotàisài","vòng loại trực tiếp"],["相通相融","xiāngtōng xiāngróng","thông nhau, hòa nhau"],["稀缺","xīquē","khan hiếm"],["远程医疗","yuǎnchéng yīliáo","y tế từ xa"],["定位","dìngwèi","định vị"]],T:[{zh:"什么是大数据？枯燥的名词解释会让“科盲”们更加摸不着头脑，有学者以通俗的例子这样告诉我们，“每个人乘飞机时，都是自己选择航线，这是人的智慧，当人们的选择结果反映到具体的航程中来，就会有大量的数据被记录下来。我们根据这些原始的、堆积如山的记录梳理出的航程设计方案，将是最卓越的。这就是大数据的方法。”",vn:"Dữ liệu lớn là gì? Giải thích thuật ngữ khô khan chỉ khiến những người “mù khoa học” càng chẳng hiểu đầu đuôi. Có học giả lấy ví dụ dễ hiểu thế này: “Mỗi người khi đi máy bay đều tự chọn tuyến bay — đó là trí tuệ của con người. Khi kết quả lựa chọn phản ánh vào hành trình cụ thể, sẽ có một lượng lớn dữ liệu được ghi lại. Phương án thiết kế hành trình mà ta sắp xếp ra từ những ghi chép nguyên thủy chất cao như núi ấy sẽ là ưu việt nhất. Đó chính là phương pháp dữ liệu lớn.”",idea:"Dữ liệu lớn là gì.",q:["学者用什么例子解释大数据？"],note:[["“科盲”","Xem 修辞: 仿词 (phỏng theo 文盲)."],["堆积如山","Chất cao như núi."]]},{zh:"大数据有什么用？举例来说，百度在2014年世界杯期间准确预测德国夺冠，就是大数据的功劳。百度的做法是：派遣数据专家全面搜索5年来全世界987支球队3.7万场比赛的数据，并与彩票中心等占有大量数据的相关机构建立战略合作伙伴关系，将各类数据融入预测模型中。这一海量数据库共计涉及19972名球员和1.12亿条相关数据。之后，百度对2006年和2010年世界杯的淘汰赛进行了结果验证，准确率接近75%，这一结果令大数据研究者万分振奋。",vn:"Dữ liệu lớn dùng để làm gì? Ví dụ, trong World Cup 2014, Baidu dự đoán chính xác Đức vô địch — đó là công của dữ liệu lớn. Cách làm của Baidu: cử chuyên gia dữ liệu tìm kiếm toàn diện dữ liệu 3,7 vạn trận đấu của 987 đội bóng trên thế giới trong 5 năm, đồng thời thiết lập quan hệ đối tác chiến lược với các cơ quan nắm nhiều dữ liệu như trung tâm xổ số, đưa mọi loại dữ liệu vào mô hình dự đoán. Kho dữ liệu khổng lồ này tổng cộng liên quan 19.972 cầu thủ và 112 triệu dữ liệu. Sau đó Baidu kiểm chứng kết quả vòng loại trực tiếp World Cup 2006 và 2010, độ chính xác gần 75% — kết quả khiến các nhà nghiên cứu dữ liệu lớn vô cùng phấn khởi.",idea:"Baidu dự đoán World Cup.",q:["百度是怎样预测世界杯冠军的？"],note:[["万分振奋","Xem 辨析 万分—十分."]]},{zh:"那么，大数据如何连接未来？我们不妨以大数据与健康为例加以说明。人们公认“医疗”和“健康”分属两个完全不同的领域，有了大数据，它们不仅相通相融，还有可能彻底扭转先前陈旧而被动的有病治病方式，改为积极防治，甚至把疾病消灭在萌芽状态中的想法也不显得荒谬了。",vn:"Vậy dữ liệu lớn kết nối tương lai thế nào? Ta thử lấy dữ liệu lớn và sức khỏe làm ví dụ để giải thích. Người ta công nhận “y tế” và “sức khỏe” thuộc hai lĩnh vực hoàn toàn khác nhau; có dữ liệu lớn, chúng không chỉ thông nhau hòa nhau, mà còn có thể xoay chuyển triệt để lối “có bệnh mới chữa” cũ kỹ, bị động trước đây, chuyển sang phòng chữa tích cực; thậm chí ý tưởng diệt bệnh từ trong trứng nước cũng không còn có vẻ hoang đường nữa.",idea:"Y tế + sức khỏe.",q:["大数据怎样改变治病方式？"],note:[["以……为例加以说明","Xem Ngữ pháp 1: <span class='zh'>加以</span>."]]},{zh:"做进一步讨论之前，有一个前提必须交代清楚：每一次疾病的发生都不是偶然的，追究原因，无非是基因、遗传、环境、生活习惯等。虽非偶然，却无法预料，因此，传统医疗只能帮你治病。如果能找出病因呢？消除隐患就成为了可能，“健康大数据”就是要做这件事。比如心脏病，病人发病常常是有预兆的，如果对患者的心跳数据有足够长时间的持续积累，就可能预测病人发病的时机；对于心脏病突发致死的案例，如果能提前24小时监测到零星先兆，甚至可以挽救患者的生命。",vn:"Trước khi bàn sâu hơn, có một tiền đề phải nói rõ: mỗi lần bệnh phát sinh đều không phải ngẫu nhiên; truy nguyên nhân thì chẳng qua là gen, di truyền, môi trường, thói quen sinh hoạt… Tuy không ngẫu nhiên nhưng không thể đoán trước, vì vậy y học truyền thống chỉ có thể giúp bạn chữa bệnh. Nếu tìm ra được nguyên nhân thì sao? Loại bỏ tai họa ngầm sẽ thành có thể — “dữ liệu lớn sức khỏe” chính là để làm việc này. Ví dụ bệnh tim, người bệnh phát bệnh thường có điềm báo; nếu tích lũy dữ liệu nhịp tim đủ lâu thì có thể dự đoán thời điểm phát bệnh; với những ca đột tử do tim, nếu theo dõi được những dấu hiệu lẻ tẻ trước 24 giờ thì thậm chí có thể cứu sống bệnh nhân.",idea:"Tiền đề: bệnh không ngẫu nhiên.",q:["“健康大数据”要做什么事？"],note:[["无非是……","Chẳng qua là…"],["虽非偶然，却无法预料","Văn viết: 虽 + 非 = 虽然不是."]]},{zh:"利用大数据对一个病种进行细致的监测，意义是不言而喻的。中国血压有问题的人不在少数，其中高血压患者有1亿人，潜在患者还有1亿人，如果这2亿人都能通过“高血压手表”或者什么先进器材进行监测，对他们的健康进行人为管理，将会是非常有前景的尝试。",vn:"Dùng dữ liệu lớn để theo dõi tỉ mỉ một loại bệnh — ý nghĩa thì không cần nói. Ở Trung Quốc người có vấn đề huyết áp không ít, trong đó 100 triệu người cao huyết áp, 100 triệu người có nguy cơ tiềm ẩn; nếu 200 triệu người này đều được theo dõi bằng “đồng hồ huyết áp” hay thiết bị tiên tiến nào đó, quản lý sức khỏe một cách chủ động, đó sẽ là thử nghiệm rất có triển vọng.",idea:"Theo dõi huyết áp.",q:["为什么说监测病种很有前景？"],note:[["不在少数","Không ít."]]},{zh:"在未来医疗模式中，临床会尽量减少对人的依赖，因为医生是切切实实的稀缺资源，大数据的优越之处就在于，能够大大提高医生的工作效率，将医生的能量发挥到最大。因为大数据的健康维护不是得了病之后再采集数据，而是平时就在一些特殊设备的协助下，把人所有的生理数据攒起来，对其进行分析处理后，发给医生，远程医疗服务将会变得可行而且优质。实事求是地讲，即便仅仅做到这一点，大数据为人类做出的贡献也远远超出了我们的期盼。",vn:"Trong mô hình y tế tương lai, lâm sàng sẽ cố giảm phụ thuộc vào con người, vì bác sĩ thực sự là nguồn lực khan hiếm; ưu thế của dữ liệu lớn chính là có thể nâng cao đáng kể hiệu suất làm việc của bác sĩ, phát huy tối đa năng lực của họ. Bởi vì chăm sóc sức khỏe bằng dữ liệu lớn không phải đợi mắc bệnh rồi mới thu thập dữ liệu, mà bình thường đã nhờ thiết bị đặc biệt tích lũy mọi dữ liệu sinh lý của con người, phân tích xử lý rồi gửi cho bác sĩ — dịch vụ y tế từ xa sẽ trở nên khả thi và chất lượng. Nói thực sự cầu thị, dù chỉ làm được điều này, cống hiến của dữ liệu lớn cho nhân loại cũng đã vượt xa mong đợi của chúng ta.",idea:"Y tế tương lai.",q:["大数据的优越之处是什么？"],note:[["大大提高 · 远远超出","Xem Ngữ pháp 2."],["不是……，而是……","Không phải… mà là…"]]},{zh:"展望未来，大数据将会走进我们生活的各个领域，有人这样定位大数据时代的意义：“拥有知识曾意味着掌握过去，现在它更意味着预测未来。”",vn:"Nhìn về tương lai, dữ liệu lớn sẽ đi vào mọi lĩnh vực đời sống. Có người định vị ý nghĩa của thời đại dữ liệu lớn thế này: “Sở hữu tri thức từng có nghĩa là nắm được quá khứ, nay nó còn có nghĩa là dự đoán tương lai.”",idea:"Ý nghĩa thời đại.",q:["大数据时代有何意义？"],note:[["曾意味着……，现在更意味着……","Đối chiếu quá khứ – hiện tại."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"加以 + V (2 âm tiết)",py:"jiāyǐ",tag:"Chú thích 1 · động từ",mean:"Động từ, biểu thị <b>thái độ, cách xử lý</b> đối với sự vật đã nói ở trước. Sau <span class='zh'>加以</span> <b>bắt buộc là động từ hai âm tiết</b> làm tân ngữ; <span class='zh'>加以</span> chỉ là “động từ hình thức”, hành động thật nằm ở động từ phía sau.",forms:["（对 / 把 + đối tượng）+ 加以 + V₂（研究 / 说明 / 利用 / 改正……）"],ex:[["对于你的意见和建议，我们会认真加以研究。","Ý kiến và đề xuất của anh, chúng tôi sẽ nghiêm túc nghiên cứu."],["大数据如何连接未来？我们不妨以大数据与健康为例加以说明。","",1],["学校为我们提供了这么好的图书馆和自习室，我们应该好好加以利用。","Trường cho ta thư viện và phòng tự học tốt thế, ta nên tận dụng triệt để."]],tips:["⚠️ Không nói <s>加以看</s>, <s>加以改</s> — phải là <span class='zh'>加以改正 · 加以分析</span>.","SBT câu 20A: <span class='zh'>可以从两方面加以考察</span>."],practice:{q:"用“加以”完成句子",type:"complete",items:[["下面这些句子都有问题，请________。","下面这些句子都有问题，请加以改正。"],["为什么男生没有学习健美操的兴趣？应采取什么措施________。","……应采取什么措施加以培养。"],["现在人们的读书生活更加多元化，大家都根据自身不同的需求________，使读书进入真正的理性时代。","……大家都根据自身不同的需求加以选择，……"]]}},{id:"g2",grp:2,word:"",zh:"大大 / 远远",py:"dàdà / yuǎnyuǎn",tag:"Chú thích 2 · phó từ",mean:"Đều là phó từ, là dạng lặp của tính từ đơn âm <span class='zh'>大 · 远</span>. <span class='zh'>大大</span> biểu thị <b>mức độ rất sâu / số lượng rất lớn</b>, thường bổ nghĩa cho động từ hai âm tiết, cụm động từ, văn viết. <span class='zh'>远远</span> nghĩa cơ bản không đổi (xa, hơn hẳn). Sau cả hai đều có thể thêm <span class='zh'>地</span>.",forms:["大大（地）+ 提高 / 增加 / 减少 / 降低……","远远（地）+ 超出 / 超过 / 不能 / 不如……"],ex:[["大数据的优越之处就在于，能够大大（地）提高医生的工作效率……","",1],["实事求是地讲，即便仅仅做到这一点，大数据为人类做出的贡献也远远（地）超出了我们的期盼。","",1],["你现在的任务就是认真读书，因为你现在的知识、能力都远远不能胜任你理想中的工作。","Nhiệm vụ của em lúc này là học cho tốt, vì kiến thức và năng lực hiện tại còn kém xa công việc mơ ước."]],tips:["SBT câu 14–17: <span class='zh'>致病菌的毒性要远远高于普通细菌</span>."],practice:{q:"用“大大”或者“远远”完成句子",type:"complete",items:[["散步时，身体挺直，胳膊自由摆动，能使肺的换气量________。","……能使肺的换气量大大增加。"],["我们之间的共同点________分歧，我相信我们这次合作一定能够成功。","我们之间的共同点远远多于分歧……（Sách: 大大避免了分歧）"],["随着经济的发展，来往物资的运输量________，这条道路原有的运输能力已________满足需求。","……运输量大大增加，……已远远不能满足需求。"]]}},{id:"g3",grp:0,word:"派遣",zh:"派遣 / 共计 / 公认 / 先前",py:"pàiqiǎn / gòngjì / gōngrèn / xiānqián",tag:"Từ văn viết · Bài tập 2",mean:"Nhóm từ <b>văn viết</b> hay gặp trong đề HSK6: <span class='zh'>派遣</span> = cử đi; <span class='zh'>共计</span> = tổng cộng; <span class='zh'>公认</span> = mọi người công nhận; <span class='zh'>先前</span> = trước đây; <span class='zh'>不言而喻</span> = không nói cũng rõ; <span class='zh'>依赖</span> = dựa dẫm.",forms:["派遣 + người + 去 / 到……","共计 + số lượng","大家公认的…… / 公认……是……"],ex:[["百度的做法是：派遣数据专家全面搜索……","",1],["这一海量数据库共计涉及19972名球员和1.12亿条相关数据。","",1],["人们公认“医疗”和“健康”分属两个完全不同的领域……","",1]],tips:["Bài tập 2①–⑥."]},{id:"g4",grp:0,word:"万分",zh:"万分 / 十分",py:"wànfēn / shífēn",tag:"Xem 辨析 bên dưới",mean:"Đều biểu thị <b>mức độ sâu</b> (“rất”). <span class='zh'>万分</span> chỉ bổ nghĩa cho tính từ / động từ chỉ <b>trạng thái tâm lý</b> và mức độ <b>sâu hơn</b> <span class='zh'>十分</span>.",forms:["万分 + 激动 / 感激 / 振奋 / 紧张 / 悲痛……","十分 + mọi tính từ / động từ tâm lý"],ex:[["这一结果令大数据研究者万分振奋。","",1]],tips:["SBT nghe câu 5: <span class='zh'>以万分艳羡的目光</span>."]}],BX:{grp:0,word:"万分",cols:["√ Đúng","× Sai"],pair:"万分 — 十分",same:["Đều biểu thị <b>mức độ sâu</b>, nghĩa “非常”.","听到这个消息，大家感到万分 / 十分惊讶。"],diff:[["<span class='zh'>万分</span> <b>chỉ bổ nghĩa</b> cho tính từ hoặc động từ chỉ <b>trạng thái tâm lý</b>.","心情万分悲痛。（√）　天气万分寒冷。（×）","<span class='zh'>十分</span> <b>không có</b> hạn chế này.<div class='zh' style='margin-top:4px'>心情十分悲痛。（√）　天气十分寒冷。（√）</div>"],["Mức độ của <span class='zh'>万分</span> <b>sâu hơn</b> <span class='zh'>十分</span>.","对你的帮助我万分感激。（mạnh hơn）","<div class='zh'>对你的帮助我十分感激。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["把你这么珍贵的结婚纪念物弄丢了，我十分过意不去。",0,"十分 không hạn chế → đúng."],["听到老板点到自己的名字，他万分紧张地看了我一眼。",0,"紧张 là trạng thái tâm lý → 万分 đúng."],["这里的风景万分优美，令人流连忘返。",1,"优美 không phải tâm lý → phải dùng 十分."],["远古时代，人与自然的关系万分和谐。",1,"和谐 không phải tâm lý → phải dùng 十分."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["血<u>压</u>","气压 · 电压 · 高压 · 低压"],items:[["卓<u>越</u>","越","飞越 · 越过 · 越发 · 越级"],["<u>消</u>灭","消","消化 · 消失 · 消息 · 消耗"],["前<u>景</u>","景","景色 · 景点 · 景物 · 景观"],["维<u>护</u>","护","保护 · 修护 · 爱护 · 守护"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["近期，我国政府将派代表团出访欧洲。→ ________","派遣","近期，我国政府将派遣代表团出访欧洲。"],["几项支出合起来一共是三千万元。→ ________","共计","几项支出共计是三千万元。"],["在我们这家跨国公司里，大家一致认为他非常敬业。→ ________","公认","在我们这家跨国公司里，他的敬业是大家公认的。"],["以前我和他在一个单位共事，后来他跳槽走了。→ ________","先前","先前我和他在一个单位共事，后来他跳槽走了。"],["他为学校做出的贡献不用说，大家心里都清楚。→ ________","不言而喻","他为学校做出的贡献不言而喻，大家心里都清楚。"],["成年以后要独立生活，不能再依靠父母了。→ ________","依赖","成年以后要独立生活，不能再依赖父母了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["萌芽","挽救","被动","振奋","隐患"],text:"今天我在报纸上看到一则令人{振奋}的消息。有关科学家经研究发现，对病人进行持续跟踪监测，可以预测病人发病的时机，消除疾病{隐患}，{挽救}患者生命。这就可以变{被动}为主动，把疾病消灭在{萌芽}状态。"},{bank:["切实","卓越","扭转","协助","战略"],text:"该公司之所以取得如此{卓越}的成就，最重要的是与相关机构建立了{战略}合作伙伴关系，{扭转}了过去单打独斗的局面，在各方面人才的{协助}下，制定{切实}可行的方案。"}]},EX4:{q:"找出下列语段中的仿词",items:[{src:"",task:"有些天天喊大众化的人，连三句老百姓的话都讲不来，可见他就没有下过决心跟老百姓学，其实他的意思仍是小众化。",model:"仿词：小众化（仿“大众化”）"},{src:"",task:"自从有了酒吧以后，各种“吧”都冒出来了，什么水吧、氧吧、网吧、陶吧等。",model:"仿词：水吧、氧吧、网吧、陶吧（仿“酒吧”）"},{src:"",task:"这种产品一个月也没卖出去一件，别的产品都在热销，我看这是在冷销。",model:"仿词：冷销（仿“热销”）"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["什么是大数据？","以通俗的例子……","每个人乘飞机时自己选择航线，选择结果会产生大量数据，根据这些数据梳理出的航程设计方案是最卓越的，这就是大数据的方法。"],["大数据有什么用？","百度预测世界杯冠军的做法","百度派遣专家搜索987支球队3.7万场比赛的数据，与相关机构合作建立预测模型，准确预测了德国夺冠。"],["大数据如何连接未来？","① 让“医疗”和“健康”相通相融 ② 消除疾病隐患 ③ 对病种进行细致的监测 ④ 临床减少对人的依赖","大数据让医疗和健康相通相融，变被动治病为积极防治；通过数据积累预测发病时机，消除隐患；对高血压等病种进行细致监测；提高医生效率，实现远程医疗。"],["大数据时代有何意义？","预测未来","拥有知识曾意味着掌握过去，现在更意味着预测未来。"]]},PZ:{title:"修辞（1）仿词",vn:"Tạo từ phỏng theo",intro:"<b>仿词</b> là một biện pháp tu từ: tùy nhu cầu biểu đạt, <b>thay một phần của từ có sẵn</b> để tạm thời tạo ra một từ mới. Cách này làm câu văn sinh động, hóm hỉnh, gây ấn tượng.",ex:[["枯燥的名词解释会让“<b>科盲</b>”们更加摸不着头脑。","“科盲” phỏng theo “文盲” (mù chữ → mù khoa học)."],["十一月，广州还是秋高气爽，北国名城哈尔滨早已“<b>草木皆冰</b>”了。","Phỏng theo thành ngữ “草木皆兵”."],["李安失业在家六年，天天扮演“<b>家庭妇男</b>”的角色，但他的心仍然属于导演……","Phỏng theo “家庭妇女”."]],q:"指出下列哪句没有使用仿词修辞手法",pvn:"(1) 如果你想过幸福的生活，就必须有安排好生活的智慧。　(2) 我不知道上了多少级台阶，一级又一级，是乐趣也是苦趣，好像我出生以来就在登山似的……　(3) 正如“水感”特好的人有可能成为世界级游泳运动员一样，让有“球感”的人去打球踢球，有“生意感”的人去担任厂长经理，有“新闻感”的人去当记者，“群众感”特强的人当干部……",practice:[["Câu nào KHÔNG dùng 仿词？","(1) — không có từ phỏng tạo. (2) 苦趣 phỏng theo 乐趣; (3) 球感 · 生意感 · 新闻感 · 群众感 phỏng theo 水感."]]},DP:{title:"词汇：熟悉下列近义词",vn:"16 cặp gần nghĩa.",items:[["货币","huòbì","tiền tệ","↔ 钱","人民币是中国的货币。"],["注射","zhùshè","tiêm","↔ 打针","护士给病人注射了药物。"],["倔强","juéjiàng","bướng bỉnh","↔ 顽固","这孩子性格很倔强。"],["仁慈","réncí","nhân từ","↔ 善良","老人有一颗仁慈的心。"],["愚昧","yúmèi","ngu muội","↔ 愚笨","教育能使人摆脱愚昧。"],["补偿","bǔcháng","bồi thường","↔ 偿还","公司给了他一笔补偿。"],["光荣","guāngróng","vẻ vang","↔ 荣幸","劳动是光荣的。"],["殴打","ōudǎ","đánh đập","↔ 揍","殴打他人是违法的。"],["巴结","bājie","nịnh bợ","↔ 讨好","他总是巴结领导。"],["复兴","fùxīng","phục hưng","↔ 兴盛","民族复兴。"],["机动","jīdòng","linh động","↔ 灵活","留一点儿机动时间。"],["检讨","jiǎntǎo","kiểm điểm","↔ 检查","他写了一份检讨。"],["间谍","jiàndié","gián điệp","↔ 特工","这部电影讲的是一个间谍的故事。"],["本人","běnrén","bản thân","↔ 自己","必须本人签字。"],["变质","biànzhì","biến chất","↔ 腐烂","牛奶已经变质了。"],["哆嗦","duōsuo","run rẩy","↔ 发抖","他冷得直哆嗦。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"对于劳资纠纷，最好的解决方案是在劳资之间建立和谐的关系，最大程度上避免或减少劳资纠纷的发生，或者至少把劳资之间的矛盾化解在萌芽状态，使其不致发展成为“纠纷”，这才是企业管理的上策。",o:["企业应主动给工人涨工资","企业与员工之间总会有矛盾","高明的企业会避免与员工冲突","员工应该为企业发展献计献策"],a:2,why:"“避免或减少劳资纠纷……这才是企业管理的上策”. Có <span class='zh'>萌芽状态</span>!"},{n:2,say:"普通牙膏中含有冰片、丁香油、薄荷脑等，具有防治口腔疾病的功效。而有些药物牙膏有较强的刺激性，对口腔粘膜有损害；有的药物牙膏含有活性较强的染色素，用久了会污染牙面，因此使用药物牙膏要慎重。",o:["应禁止生产药物牙膏","不要随意使用药物牙膏","药物牙膏对人有害而无益","药物牙膏的生产缺乏科学性"],a:1,why:"“使用药物牙膏要慎重”."},{n:3,say:"导演40多岁，黑黑的脸，像所有的导演一样，下巴留着胡子，脸上很少有笑容。他匆匆向我交代了几句就说：“开始吧！”顿时，房屋里的灯光全都打开，我被照得有点儿晕，接着看到这么多人看着自己，我顿时紧张了起来。",o:["导演对我非常严厉","围观的观众不太多","我担心导演拍不好","导演是个严肃的人"],a:3,why:"“脸上很少有笑容” → nghiêm túc."},{n:4,say:"先前发生的事件与后来发生的事件之间往往有着千丝万缕的联系，甚至是后来发生事件的根源或条件。但是由于历史记录不全、事件之间的关系错综复杂，往往使得因果分析变得困难而复杂。",o:["任何事件的发生都有其必然性","前后事件之间常常是有联系的","要重视对历史事件的记录工作","因果分析再难也必须努力去做"],a:1,why:"“往往有着千丝万缕的联系”. Có <span class='zh'>先前</span>."},{n:5,say:"她两眼茫然地盯着前方，为自己如此草率的远行而担忧，不知道刘大明会不会来接她。忽然，她的眼前一亮，她被一大捧鲜艳的红玫瑰吸引住了，她以万分艳羡的目光盯着那些红玫瑰，她没想到，红玫瑰的后面竟然是刘大明的一张微笑的脸！",o:["她心中忐忑不安","刘大明是卖花的","刘大明对她非常失望","她和刘大明都喜欢花"],a:0,why:"“为自己如此草率的远行而担忧” = <span class='zh'>忐忑不安</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：“社交离线日，出来分享才开心”主题活动至今已经举办多次了，作为心理专家，您对这个活动有什么看法？\n女：飞速发展的社交网络，简化了人们的沟通，却解决不了人与人之间内心的情感需要。今年的活动进一步号召人们行动起来，希望更多的人能够暂别网络，关注面对面交流，分享真实沟通带来的幸福体验，绝对是一件好事。\n男：其实线上交流也是交流，难道二者有什么差别吗？\n女：社交网络打破了时间和空间的壁垒，但也为社会带来了不小的影响。这样的社交模式，催生了“新型社交人类”。例如，亲朋聚会，“新型社交人类”手机不离手，一道美食上桌，他们先要拍照并通过社交媒体分享，然后期盼着别人点赞和评论，反倒冷落和忽视了身边的人。这一情景折射出的是“新型社交人类”过于在乎创造未来的幸福感，而缺乏聚焦当下、感受当下幸福感的能力。\n男：嗯，过分依赖线上交流，可能导致这类人群无法应对现实生活中的人际问题。\n女：不仅如此，大家公认的是，面对面交流是复杂、高层次的，更能考验一个人的人际交往能力。面对面的交流要求人身心投入地对待彼此，线上交流的隐患就是不需要这种对人内心情感的体察与维护。\n男：嗯，有道理。\n女：适度离线，不要过度依赖网络，在真实的世界里进行互动分享、情感经营，是克制网络迷恋的切实可行的理性选择，也是长远幸福的重要源泉。\n男：您说的是“情感经营”？难道情感还要“经营”？\n女：是啊，人与人之间的情感是需要经营的，这种说法并不荒谬。这在面对面交往中体现尤为真切。比如，与人交往要真诚，要用心，要懂得彼此珍重。但人与人之间总会有磕磕碰碰，这就需要磨合。相处久了，彼此熟悉了，也就有了相处之道。在这个过程中，人要不断自省，要提高自己的修养和涵养，如果一个人能使对方因为拥有你而感到自豪，就是你人生最大的成功。",qs:[{n:6,q:"女的对这项主题活动的看法，下列哪项正确？",o:["认为真实沟通绝对是一件好事","鼓励人们通过活动彻底告别网络","网络走进生活是社会发展的必然","网络应重视人的沟通与情感交流"],a:0,why:"“分享真实沟通带来的幸福体验，绝对是一件好事”. B sai: chỉ <span class='zh'>暂别</span>."},{n:7,q:"线上交流和面对面交流的差别是什么？",o:["二者对时空要求不一样","二者适应的人群不一样","线上交流更能满足虚荣心","面对面交流让人更有幸福感"],a:0,why:"“社交网络打破了时间和空间的壁垒”."},{n:8,q:"过分依赖线上交流，可能导致什么问题？",o:["身在福中不知福","做事不能集中精力","对生活期望值过高","高层次交往能力退化"],a:3,why:"“无法应对现实生活中的人际问题”; mặt đối mặt là “高层次的”."},{n:9,q:"关于“经营情感”，下列哪项正确？",o:["是一种陈旧的理论","人为色彩过于浓重","“经营”二字内含丰富","通俗易懂，但可行性差"],a:2,why:"Chân thành, dụng tâm, mài giũa, tự xét — <span class='zh'>经营</span> hàm nghĩa phong phú."},{n:10,q:"这次主题活动希望人们做什么？",o:["增强对未来幸福的感知力","暂别网络，关注面对面交流","完善自己，让朋友为自己而自豪","有自省精神，提高自己的修养和涵养"],a:1,why:"“希望更多的人能够暂别网络，关注面对面交流”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"时至今日，《大数据时代：生活、工作与思维的大变革》仍是全世界最好的一本大数据专著。其作者之一是维克托•迈尔——舍恩伯格，大数据时代的预言家，《科学》《自然》等著名学术期刊最推崇的互联网研究者之一，有在哈佛大学、牛津大学、耶鲁大学和新加坡国立大学等多个互联网研究重镇任教的经历。\n《大数据时代：生活、工作与思维的大变革》一书的两位译者中，有一位是我国最年轻有为的大数据专家，年仅27岁的周涛教授，数年来他一直带领我国学术界在大数据研究上向国际一流水平看齐。",qs:[{n:11,q:"《大数据时代：生活、工作与思维的大变革》是一本什么样的书？",o:["生活用书","学术著作","刚出版的书","倡导改革的书"],a:1,why:"“最好的一本大数据专著” = <span class='zh'>学术著作</span>."},{n:12,q:"关于周涛，下列哪项正确？",o:["原本是学外语的","不但年轻而且学术水平高","是我国研究大数据的第一人","是《大数据时代》一书的作者"],a:1,why:"“最年轻有为的大数据专家”. D: là <b>dịch giả</b>."},{n:13,q:"这段话主要谈什么？",o:["维克托·迈尔—舍恩伯格常为《自然》写稿","《大数据时代》是一本好书","杂志对《大数据时代》评价很高","哈佛、牛津、耶鲁和新加坡国立大学都是好学校"],a:1,why:"Giới thiệu tác giả, dịch giả → cuốn sách hay."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"判断一个东西是不是脏，不仅要看其表面上的细菌数量，还要看上面的致病菌数量，因为致病菌的毒性要远远高于普通细菌。\n电脑键盘和没有清洗的鞋子，哪个更容易滋生细菌呢？为了找到答案，有人对一双穿了半年左右的运动鞋和一个用了半年多的电脑键盘上面的细菌数量进行检测对比，结果发现，两件样本都有大量的细菌存在，而键盘上的菌落数量是运动鞋的65倍，需要注意的是，键盘上还发现了真菌。为验证键盘和运动鞋中是否存在致病性极高的金黄色葡萄球菌，实验员用试纸进行了测试，幸运的是，测试结果均为阴性，运动鞋和键盘上并没有发现这种细菌。\n实验结果显示，运动鞋前脚掌处的细菌数量远不如键盘上的细菌数量多。电脑键盘因为数字键不常使用，其菌落数远远低于字母键盘。\n专家建议，电脑键盘每两周用酒精擦拭一次，可有效消灭细菌；清洗运动鞋时一定要注意鞋子内部的清洁，清洗之后，可在阳光下进行暴晒消毒。",qs:[{n:14,q:"根据这段话，下列东西哪个最脏？",o:["有细菌的东西","沾上泥土的东西","布满灰尘的东西","致病菌多的东西"],a:3,why:"“还要看上面的致病菌数量”."},{n:15,q:"关于运动鞋和电脑键盘细菌检测的对比结果，下列哪项正确？",o:["运动鞋更容易滋生真菌","电脑键盘更容易滋生细菌","键盘上发现了金黄色葡萄球菌","键盘上的菌落数量比运动鞋高65倍"],a:1,why:"Bàn phím gấp 65 lần. D: “<b>là</b> 65 lần”, không phải “cao hơn 65 lần”."},{n:16,q:"实验结果显示，最脏的是什么部位？",o:["运动鞋表面","运动鞋前脚掌处","电脑键盘的字母键盘","电脑键盘的数字键盘"],a:2,why:"Phím số ít dùng nên ít vi khuẩn hơn phím chữ."},{n:17,q:"关于专家建议，下列哪项正确？",o:["键盘最好用酒精擦洗","电脑内部更要常清理","鞋在阳光下暴晒即可","电脑每次用后应消毒"],a:0,why:"“每两周用酒精擦拭一次”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["人们对自己生活的最早零星回忆，一般是四五岁时。","11月，南方还是秋高气爽，北国早已“草木皆冰”了。","我们的父辈只知道辛辛苦苦积攒财富，不懂得享受人生。","火车出发以后，一直走在辽阔无边的戈壁滩上，满眼荒凉。"],a:3,why:"<b>Chủ ngữ đổi ngầm</b>: <span class='zh'>火车……满眼荒凉</span> — tàu không “nhìn”; cần thêm chủ ngữ người: <span class='zh'>……，我满眼荒凉</span>. B là 仿词 (đúng!)."},{n:19,o:["他相信，经过协商协商，大家还是可能达成共识的。","那时，体制、技术等问题堆积如山，纺织业陷入困境。","很多学者支持这种模型，认为该模型可以取代有效市场假说。","由于本研究取自非临床样本，所以尚不能作为临床诊断的依据。"],a:0,why:"<b>Lặp động từ sai</b>: sau <span class='zh'>经过</span> không dùng dạng lặp → <span class='zh'>经过协商</span>."},{n:20,o:["文字的发展可以从两方面加以考察：造字方法、文字记录语言的完备程度。","据研究，影响人身心发展的主要因素有遗传、环境和教育，其中教育是主导因素。","车站上有很多等车的人，但公共汽车毕竟不顾他们，人们只好眼巴巴地看着公共汽车开过去。","以前，偏远山区的教学条件不好，近年来，教学仪器、图书资料、文体器材、校舍等，均与一般城市相差无几。"],a:2,why:"<b>Dùng từ sai</b>: <span class='zh'>毕竟</span> (rốt cuộc) không hợp → <span class='zh'>竟然 / 根本</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"英国、日本、菲律宾等岛国，受气候___的影响不言而喻，因而___气候变化的态度最积极；韩国虽然不是岛国，却三面环海，气候变化对韩国的影响也不能___。",o:["条件　对付　忽略","变化　应对　小视","环境　解决　忘记","预报　面对　被动"],a:1,why:"<span class='zh'>气候变化</span>; <span class='zh'>应对……变化</span>; <span class='zh'>不能小视</span>. Có <span class='zh'>不言而喻</span>!"},{n:22,text:"骄傲和自卑从两个___背离实事求是的精神。骄傲使人盲目___，以致脱离群众，远离进步与成功的道路。自卑是不切实际地过低估计自己，觉得自己___不如别人，对___、对一切灰心丧气，这往往导致无所作为。",o:["极端　自满　处处　事业","方面　优越　大大　事情","方向　透顶　远远　前景","领域　振奋　哪哪　世界"],a:0,why:"<span class='zh'>两个极端</span>; <span class='zh'>盲目自满</span>; <span class='zh'>处处不如别人</span>; <span class='zh'>对事业灰心</span>. Có <span class='zh'>实事求是</span>!"},{n:23,text:"新年伊始，几位“大牌”记者___撰文，从不同角度回眸历史，___“地球村”的明天。乐观者有之，悲观者也___其人。大家见仁见智，热门话题不少，只是没有人谈及，在经济全球化进程不断___的今天，媒体该如何表现。",o:["依次　期待　时有　促进","先后　预料　增加　前进","纷纷　聊聊　确有　迈进","分别　展望　不乏　加快"],a:3,why:"<span class='zh'>分别撰文</span>; <span class='zh'>展望明天</span> (từ mới!); <span class='zh'>不乏其人</span>; <span class='zh'>进程加快</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"你身边一定有人的手机被偷过，且多数是女性。为什么？细细追究起来，我认为女人丢手机应该是服装设计师的“功劳”。\n(24)，就是少了功能性。如今出门必带手机，可在女人的衣服上，完全没有合适的地方搁，不是拿在手里就是随便放在很浅的口袋里。那些口袋基本属于为了美观而设置的，放手机完全不靠谱，(25)，别说“老偷”了。\n其实小偷偷东西不按性别来，只按难易程度。那些穿户外衣服的人很少被偷，当然是因为衣服口袋多，多到共计多少个口袋都数不过来，(26)，小偷到哪儿去找？更重要的是户外服装的口袋有把门的，不是拉链就是魔术贴，(27)。可惜这种功能性很强的衣服，女性通常不喜欢，她们认为这种服装会模糊性别概念。\n我想说的是，当代设计师也须扭转观念与时俱进，为女人们想得周到一点儿，(28)，也要功能性、美观性同时具备。我敢说，这样的设计肯定大受欢迎。",opts:["小偷也就知难而退了","女人的衣服大多好看时尚","即使是女人的服装","受过初级培训的小偷就能轻易得手","自己都找不着东西了"],ans:{24:1,25:3,26:4,27:0,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"“黑天鹅事件”是当下流行的词语。其实“黑天鹅事件”并不是什么新词。据说，17世纪，欧洲人认为所有的天鹅都是白色的，因为他们从来没见过其他颜色的天鹅。18世纪初，欧洲人漂洋过海来到澳洲，一上岸就惊呆了，天鹅居然有黑色的！他们奔走相告，把这消息传回家乡，史称“黑天鹅事件”。\n“黑天鹅”的出现告诉人们，世界上永远存在不可预测的事情，尽管人类总是相信自己的经验，希望自己的判断、决定和计划准确无误，无论是第二次世界大战，还是互联网浪潮，发生之前不是没有预兆，但它们的发生还是使人们措手不及，惊愕不已。\n普通人日常生活中的选择，也存在黑天鹅现象。我有两个朋友，一个工作兢兢业业，对公司不离不弃，十几年后他成长为技术副总裁，但一个突如其来的财务丑闻使公司倒闭了；另一个总是在选择中跳槽，在跳槽中选择，最后在一家公司工作了两年后，公司上市了，这家伙还去纳斯达克敲了钟！\n如果说，以上案例说明，在自然界的物种领域，当今的科技以及信息传播的进步，已经使当年“黑天鹅事件”的出现成为了不可能，但并不能就此说明“黑天鹅事件”全部可以预测，因为第二次世界大战的发生、互联网浪潮的出现以及我朋友的故事都说明，预计未来不是件容易的事情，这，你是否同意？",qs:[{n:29,q:"关于“黑天鹅事件”，下列哪项正确？",o:["已经成为历史","今天仍有可能发生","是科技水平低造成的","日常生活中比比皆是"],a:1,why:"“并不能就此说明‘黑天鹅事件’全部可以预测”."},{n:30,q:"“我”的两个朋友的故事说明：",o:["人无法预计生活中的全部","社会对丑闻的容忍度很低","只钻研技术不能挽救公司","不断跳槽有利于人生发展"],a:0,why:"“预计未来不是件容易的事情”."},{n:31,q:"文中第3段画线词语“上市”的意思是：",o:["被卖掉了","实行了股份制","产品得到市场认可","在证券交易所挂牌交易"],a:3,why:"Gõ chuông Nasdaq → niêm yết trên sàn."},{n:32,q:"根据上文，下列哪项正确？",o:["人类还不能准确预测未来","各个时期的流行词语不一样","互联网浪潮的出现没有任何先兆","世界上也许还有其他颜色的天鹅"],a:0,why:"Ý chính cả bài. C sai: “不是没有预兆”."}]},{ins:"第33–36题：请选出正确答案。",text:"在低头族盛行的现代社会。很多人已将智能手机视为必不可少的“伴侣”，不少上班族甚至将不眨眼地看手机作为消除疲劳的休闲活动。殊不知，智能手机屏幕发出的“蓝光”在晚间会对人造成多种危害。\n蓝光为什么会对人体造成危害呢？弄明白这一点的前提是先了解人的生理特点以及作息规律。人脑部的“松果体”生产褪黑素，调整人体的昼夜节律。夜幕降临后，光刺激减弱，褪黑素开始产生，人们有了睡意。日出后，眼睛视网膜的感测器感受到蓝光的存在，抑制褪黑素的产生，新的一天开始。由此可以理解，夜间过多接触蓝光，容易干扰人体昼夜节律，带来种种危害。\n危害之一就是发胖。夜间面对发出蓝光的手机和电脑超过3小时，人体就会饥饿，部分原因是视网膜接受的蓝光信号传到大脑，大脑认为白天已开始，人体需补充消耗掉的能量。即便当晚吃过晚餐，饥饿感还是会令人产生进食的欲望，当然，过量进食的结果就是导致发胖。其二，研究发现，经常使用电脑的女性夜间工作者患乳癌的几率比其他女性高17%，护士患癌的风险也可能增加。青少年受光线的影响比成年人要大，有研究显示，46%的成年人在夜间接触蓝光后褪黑素减少，但儿童的数字是88%。人们如果在睡前4小时处于强光环境下，患2型糖尿病的几率增加50%，并且灯光越强患病概率越大。研究人员推测，人体生物钟可能在控制人体血糖方面发挥某种作用。一位研究员曾让一组成年男子在睡前接触2小时蓝光，另一组不接触光线，两组人睡眠时间相同。结果显示，第一组第二天多人表现困倦，这显示蓝光对生物钟造成影响，导致启动新一天活动的能力降低。",qs:[{n:33,q:"什么可以产生褪黑素？",o:["蓝光","松果体","视网膜","生物钟"],a:1,why:"“人脑部的‘松果体’生产褪黑素”."},{n:34,q:"蓝光通过什么对人体造成危害？",o:["让人不眨眼睛","控制人体血压","干扰人体昼夜节律","刺激松果体产生褪黑素"],a:2,why:"“容易干扰人体昼夜节律，带来种种危害”."},{n:35,q:"蓝光为什么会导致人发胖？",o:["蓝光能促进食欲","蓝光会让人感觉麻木","蓝光会消耗人体能量","蓝光会让人产生饥饿感"],a:3,why:"“人体就会饥饿……导致发胖”."},{n:36,q:"根据上文，下列哪项正确？",o:["蓝光会减少患癌几率","蓝光会让人饭量变大","蓝光对孩子的影响更大","视网膜无法感受到蓝光的存在"],a:2,why:"Trẻ em 88% so với người lớn 46%."}]}]},W:{task:"这篇课文以具体的例子给我们介绍了大数据时代。什么是大数据？大数据有什么用？大数据如何连接未来？大数据时代有何意义？本文都给出了答案。请参考练习5，把课文缩写成350字左右的短文。",target:350,steps:[["Là gì","Ví dụ chọn tuyến bay — 1–2 câu."],["Dùng làm gì","Baidu dự đoán World Cup: <span class='zh'>派遣 · 共计 · 验证 · 万分振奋</span>."],["Kết nối tương lai","Y tế + sức khỏe; <span class='zh'>消除隐患 · 预测发病时机 · 细致的监测</span>."],["Y tế tương lai","<span class='zh'>大大提高医生的工作效率 · 远程医疗 · 远远超出</span>."],["Ý nghĩa","Trích câu kết: <span class='zh'>拥有知识……预测未来</span>."]],model:"大数据时代\n什么是大数据？有学者用一个通俗的例子来解释：人们乘飞机时都会自己选择航线，这些选择会留下大量数据，根据这些数据设计出的航程方案是最卓越的，这就是大数据的方法。\n大数据有什么用？2014年世界杯期间，百度派遣专家搜索了5年来987支球队3.7万场比赛的数据，并与彩票中心等机构合作，建立了预测模型，准确预测了德国夺冠。\n大数据还能连接未来，比如在医疗健康方面。有了大数据，医疗和健康可以相通相融，人们可以积极防治疾病，甚至把疾病消灭在萌芽状态。疾病的发生不是偶然的，如果长期积累病人的心跳数据，就可能预测心脏病发病的时机，挽救病人的生命。对高血压等病种进行细致的监测，也是很有前景的尝试。在未来，大数据能大大提高医生的工作效率，让远程医疗变得可行而且优质。\n有人说：“拥有知识曾意味着掌握过去，现在它更意味着预测未来。”这就是大数据时代的意义。",check:["Có tiêu đề","Trả lời đủ 4 câu hỏi: là gì · dùng làm gì · kết nối tương lai · ý nghĩa","Có ví dụ Baidu","Có ví dụ y tế (tim mạch / huyết áp)","Dùng ít nhất 3: 加以 · 大大 · 远远 · 派遣 · 消除隐患 · 前景","Khoảng 350 chữ"]},SUM:{words:["通俗","堆积","卓越","预测","功劳","派遣","战略","模型","共计","验证","万分","振奋","公认","扭转","先前","陈旧","被动","防治","消灭","萌芽","荒谬","前提","交代","追究","遗传","预料","消除","隐患","预兆","案例","挽救","细致","不言而喻","前景","临床","依赖","优越","维护","协助","攒","可行","实事求是","展望"],patterns:[["加以 + V（2 âm tiết）","我们不妨以大数据与健康为例加以说明。"],["大大 + V","能够大大提高医生的工作效率。"],["远远 + 超出 / 不能……","贡献也远远超出了我们的期盼。"],["不是……，而是……","不是得了病之后再采集数据，而是平时就……"],["修辞：仿词","“科盲” ← 文盲；“家庭妇男” ← 家庭妇女"]],diff:["万分: chỉ + tâm lý (激动 · 感激 · 紧张 · 振奋), mức độ sâu hơn — 十分: không hạn chế (十分寒冷 · 十分优美)","攒 zǎn · 切切实实 qièqie shíshí · 交代 = nói rõ / dặn dò · 萌芽状态 = trứng nước"],sentences:["我们不妨以大数据与健康为例加以说明。","实事求是地讲，即便仅仅做到这一点，大数据为人类做出的贡献也远远超出了我们的期盼。","拥有知识曾意味着掌握过去，现在它更意味着预测未来。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết tóm tắt bài khóa ~350 chữ (mục 7).","Tự tạo 3 仿词 (VD: 网盲, 低头族 → 抬头族…).","Làm Sách bài tập bài 23.","Đọc trước bài 24."]}});
