<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 30 · 你睡好了吗？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-30",num:30,book:"HSK 标准教程 6（下）",unit:{n:8,zh:"人体探秘",vn:"Khám phá cơ thể người"},title:"你睡好了吗？",vn:"Bạn ngủ ngon không?",chars:949,source:"改编自北京卫视《北京你早》节目“2014年中国睡眠指数发布”",goals:["Đọc hiểu bài khoa học phổ thông 949 chữ về <b>chỉ số giấc ngủ, nguyên nhân mất ngủ, biểu hiện rối loạn giấc ngủ và tác hại của thiếu ngủ</b>.","Dùng được 52 từ mới, nhất là nhóm <b>sức khỏe – cơ thể</b>: <span class='zh'>分泌 · 职能 · 衰老 · 细胞 · 肿瘤 · 癌症 · 气色 · 记性 · 慢性 · 恶化</span> và nhóm <b>trạng thái – thái độ</b>: <span class='zh'>顽固 · 扰乱 · 摧残 · 折腾 · 容忍 · 茫然 · 丢三落四 · 发呆 · 无动于衷 · 竭尽全力</span>.","Nắm <span class='zh'>不时 · 多多少少</span>.","Phân biệt <span class='zh'>容忍 — 忍受</span>; làm quen <b>篇章 (4): 连接 — thành phần liên kết</b>.","Viết 缩写 bài khóa ≈400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Đoạn 1–6 · 不时 · 容忍—忍受"],["Buổi 2","Nhóm 3 · Đoạn 7–9 · 多多少少 · 连接 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"起",name:"Chỉ số giấc ngủ",paras:"Đoạn 1–2",zh:"睡眠指数 · 一线城市最低",vn:"Ngủ là xa xỉ với người mất ngủ; chỉ số giấc ngủ giảm khi cấp độ thành phố tăng."},{tag:"承",name:"Nguyên nhân",paras:"Đoạn 3–4",zh:"该睡时不睡 · 光污染 · 褪黑素",vn:"Lên mạng trước khi ngủ, ô nhiễm ánh sáng làm rối loạn melatonin, lệch đồng hồ sinh học → bệnh tật, kể cả ung thư."},{tag:"转",name:"Biểu hiện & tác hại",paras:"Đoạn 5–8",zh:"睡不着 · 睡不好 · 疲劳驾驶 · 慢性疾病",vn:"Khó ngủ, ác mộng; thiếu ngủ → sắc mặt xấu, tai nạn, hay quên, tư duy rối loạn, bệnh mạn tính."},{tag:"合",name:"Cách đối phó",paras:"Đoạn 9",zh:"纠正不好的生活习惯",vn:"Gốc rễ nằm ở lối sống — hãy sửa thói quen xấu, đừng tự hại mình."}],warm1:{q:"你每天睡得好吗？请分析一下影响你睡眠的因素以及失眠对你的影响。",vn:"Yếu tố nào ảnh hưởng giấc ngủ của bạn? Bấm 有 (có) / 无 (không).",items:[["💼","工作压力","Áp lực công việc"],["📱","网络","Mạng internet, điện thoại"],["☕","饮食","Ăn uống (cà phê, trà…)"],["😩","失眠后脸色不好、注意力下降","Mất ngủ → sắc mặt xấu, kém tập trung"]],talk:["影响你睡眠的因素有哪些？","失眠对你有什么影响？脸色、疲劳、记忆力……"],link:"<span class='zh'>褪黑素 tuìhēisù</span> = melatonin — “hoóc-môn giấc ngủ”."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"城",rule:"城 = <b>thành, thành phố</b>.",w:[["城镇","chéngzhèn","thị trấn (có trong bài)"],["城市","chéngshì","thành phố"],["城里","chénglǐ","trong thành"],["城内","chéngnèi","nội thành"],["城区","chéngqū","khu đô thị"],["京城","jīngchéng","kinh thành"],["都城","dūchéng","kinh đô"],["名城","míngchéng","thành phố nổi tiếng"],["省城","shěngchéng","tỉnh lỵ"],["县城","xiànchéng","huyện lỵ"]]},{k:"素",rule:"素 = <b>yếu tố, chất cơ bản</b>.",w:[["褪黑素","tuìhēisù","melatonin (có trong bài)"],["词素","císù","từ tố"],["语素","yǔsù","ngữ tố"],["毒素","dúsù","độc tố"],["激素","jīsù","hoóc-môn"],["色素","sèsù","sắc tố"],["要素","yàosù","yếu tố"],["因素","yīnsù","nhân tố"],["元素","yuánsù","nguyên tố"],["抗生素","kàngshēngsù","kháng sinh"],["维生素","wéishēngsù","vitamin"],["胡萝卜素","húluóbosù","carotene"]]},{k:"抗",rule:"抗 = <b>chống lại</b>.",w:[["抗衰老","kàng shuāilǎo","chống lão hóa (có trong bài)"],["抗癌","kàng'ái","chống ung thư"],["抗敌","kàngdí","chống giặc"],["抗旱","kànghàn","chống hạn"],["抗击","kàngjī","chống trả"],["抗灾","kàngzāi","chống thiên tai"],["抗战","kàngzhàn","kháng chiến"],["抗震","kàngzhèn","chống động đất"],["抗争","kàngzhēng","đấu tranh"],["抵抗","dǐkàng","chống cự"],["对抗","duìkàng","đối kháng"],["反抗","fǎnkàng","phản kháng"]]},{k:"发",rule:"发 = <b>phát ra, nảy sinh</b>.",w:[["诱发","yòufā","gây ra (có trong bài)"],["引发","yǐnfā","dẫn đến (có trong bài)"],["爆发","bàofā","bùng nổ"],["复发","fùfā","tái phát"],["自发","zìfā","tự phát"],["发生","fāshēng","xảy ra"],["发病","fābìng","phát bệnh"],["发出","fāchū","phát ra"],["发电","fādiàn","phát điện"],["发疯","fāfēng","phát điên"],["发烧","fāshāo","sốt"],["发作","fāzuò","phát tác"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–4",sub:"Chỉ số & nguyên nhân",from:1,to:18},{name:"Nhóm 2 · Đoạn 5–7",sub:"Biểu hiện rối loạn giấc ngủ",from:19,to:32},{name:"Nhóm 3 · Đoạn 8–9",sub:"Tác hại & cách đối phó",from:33,to:52}],V:[[1,"惯例","guànlì","dt.","quán lệ","thói thường, công việc thường làm hằng ngày",1,"","一向的做法；常规。","睡觉只是惯例","按照惯例，会议九点开始。","Theo lệ, cuộc họp bắt đầu lúc 9 giờ.",[],"Bài tập 1: <span class='zh'>习惯 · 惯于 · 娇惯 · 司空见惯</span>. SBT nghe 11–13."],[2,"顽固","wángù","tt.","ngoan cố","bướng bỉnh, ngoan cố",1,"","思想保守，不愿接受新事物；（病）不易治好。","顽固失眠症","他是个顽固的老头儿。","Ông ấy là ông lão cố chấp.",["顽固性"],"Bài tập 3①. SBT nghe câu 4."],[3,"奢侈","shēchǐ","tt.","xa xỉ","xa xỉ",1,"","花费大量钱财追求过分享受。","难得的奢侈","他生活很奢侈。","Anh ấy sống rất xa hoa.",["奢侈品"],""],[4,"指数","zhǐshù","dt.","chỉ số","chỉ số",1,"","表示变动程度的数字。","睡眠指数","股票指数上涨了。","Chỉ số chứng khoán tăng.",[],""],[5,"居民","jūmín","dt.","cư dân","cư dân, người dân",1,"","固定住在某一地方的人。","36.2%的居民","小区居民。","Cư dân khu chung cư.",[],"SBT câu 19D: <span class='zh'>常住人口</span>."],[6,"当前","dāngqián","dt.","đương tiền","hiện nay, trước mắt",1,"","目前；现阶段。","当前失眠症正扰乱着……","当前的主要任务。","Nhiệm vụ chính trước mắt.",[],"Bài tập 1 (ví dụ): <span class='zh'>当场 · 当地 · 当时 · 当年</span>."],[7,"扰乱","rǎoluàn","đgt.","nhiễu loạn","quấy nhiễu, quấy rối",1,"","搅扰；使混乱或不安。","扰乱着人们的情绪","扰乱社会秩序。","Gây rối trật tự xã hội.",[],"Bài tập 1: <span class='zh'>紊乱 · 乱套 · 凌乱 · 乱世</span>; 2①."],[8,"摧残","cuīcán","đgt.","tồi tàn","tàn phá, hủy hoại",1,"","使（政治、经济、文化、身体、精神等）蒙受严重损失。","摧残着城市人群的健康","吸烟摧残身体。","Hút thuốc tàn phá cơ thể.",[],"Bài tập 3②. SBT nghe 6–10."],[9,"普及","pǔjí","đgt.","phổ cập","phổ cập, phổ biến",1,"","普遍地推广，使大众化。","手机和平板电脑的普及","普及科学知识。","Phổ cập kiến thức khoa học.",[],"Bài tập 2②. SBT nghe câu 2."],[10,"盛行","shèngxíng","đgt.","thịnh hành","thịnh hành, phổ biến khắp",1,"","广泛流行。","睡前上网的习惯日渐盛行","这种风气在年轻人中很盛行。","Phong trào này rất thịnh hành ở giới trẻ.",[],"SBT nghe 11–13."],[11,"过瘾","guò yǐn","tt.","quá ẩn","đã ghiền, thỏa nguyện",1,"","满足某种特别深的癖好；泛指满足爱好。","再过过网瘾","这场球赛看得真过瘾！","Trận bóng xem đã thật!",["过网瘾"],"Tách được: <span class='zh'>过过网瘾</span>. SBT câu 22D."],[12,"分泌","fēnmì","đgt.","phân tiết","tiết ra, bài tiết",1,"","从生物体某些细胞、组织或器官里产生出某种物质。","褪黑素的正常分泌","分泌唾液。","Tiết nước bọt.",[],""],[13,"职能","zhínéng","dt.","chức năng","chức năng",1,"","人、事物、机构应有的作用。","它的职能包括……","政府的职能。","Chức năng của chính phủ.",[],""],[14,"衰老","shuāilǎo","tt.","suy lão","già yếu",1,"","年老而精力、体力衰弱。","抗衰老","他看起来很衰老。","Ông ấy trông rất già yếu.",[],"Khởi động 2: <span class='zh'>抗衰老</span>. SBT câu 9A."],[15,"调剂","tiáojì","đgt.","điều tễ","điều chỉnh, điều hòa",1,"","把多和少、忙和闲等加以适当的调整。","调剂睡眠","听音乐可以调剂生活。","Nghe nhạc có thể điều hòa cuộc sống.",[],"SBT câu 32B."],[16,"细胞","xìbāo","dt.","tế bào","tế bào",1,"","生物体的基本结构和功能单位。","人体细胞组织和器官","癌细胞。","Tế bào ung thư.",[],"Bài tập 3②. SBT câu 20B."],[17,"肿瘤","zhǒngliú","dt.","thũng lựu","u, bướu, khối u",1,"","机体某一部分组织细胞长期不正常增生形成的新生物。","恶性肿瘤","良性肿瘤。","Khối u lành tính.",[],""],[18,"癌症","áizhèng","dt.","nham chứng","(bệnh) ung thư",1,"","恶性肿瘤的通称。","也就是我们常说的癌症","癌症可以预防。","Ung thư có thể phòng ngừa.",[],"Bài tập 3②. SBT câu 19B."],[19,"供不应求","gōngbúyìngqiú","thành ngữ","cung bất ứng cầu","cung không đủ cầu",1,"成","供给不能满足需求。","医生总是供不应求","这种产品供不应求。","Sản phẩm này cung không đủ cầu.",[],"Bài tập 2③."],[20,"枕头","zhěntou","dt.","chẩm đầu","cái gối",1,"","躺着的时候垫在头下的东西。","头在枕头上","这个枕头太高了。","Cái gối này cao quá.",[],"SBT câu 18C."],[21,"折腾","zhēteng","đgt.","chiết đằng","lăn qua lăn lại, trở mình trằn trọc; giày vò",1,"","翻过来倒过去；反复做；折磨。","翻来覆去瞎折腾","病把他折腾得很瘦。","Bệnh hành ông gầy rộc.",[],"Bài tập 3①."],[22,"容忍","róngrěn","đgt.","dung nhẫn","tha thứ, chịu đựng",1,"","宽容忍耐。","心烦意乱得无法容忍","我不能容忍他的错误行为。","Tôi không thể dung thứ hành vi sai của anh ta.",[],"Xem <b>辨析 容忍—忍受</b>. Bài tập 1: <span class='zh'>忍受 · 忍耐 · 忍俊不禁 · 忍辱负重</span>. SBT nghe câu 1."],[23,"蹬","dēng","đgt.","đặng","đạp, giẫm",1,"","腿和脚向脚底的方向用力。","一会儿蹬腿","蹬自行车。","Đạp xe đạp.",[],"SBT câu 18A: <span class='zh'>四蹄蹬开</span>."],[24,"拳头","quántou","dt.","quyền đầu","quả đấm, nắm đấm",1,"","手指向内弯曲合拢的手。","一会儿挥拳头","他握紧了拳头。","Anh ta nắm chặt tay.",[],"SBT nghe 11–13."],[25,"不时","bùshí","phó.","bất thời","thỉnh thoảng, đôi lúc",1,"","时时；不断地；随时。","不时大声叫喊","他不时看看手表。","Anh ấy chốc chốc lại xem đồng hồ.",[],"Xem <b>Ngữ pháp: 不时</b>. Bài tập 2④. SBT câu 18D, 22."],[26,"气色","qìsè","dt.","khí sắc","khí sắc, thần sắc",1,"","人的精神和面色。","使人气色不好","你今天气色不错。","Hôm nay trông bạn rất có thần sắc.",[],"Bài tập 3①."],[27,"轨道","guǐdào","dt.","quỹ đạo","quỹ đạo, nề nếp, khuôn khổ",1,"","铺轨的路线；行动所遵循的规则。","偏离正常轨道","工作走上了轨道。","Công việc đã vào nề nếp.",[],"SBT câu 33D."],[28,"酒精","jiǔjīng","dt.","tửu tinh","cồn",1,"","乙醇的通称。","血液中酒精浓度为0.05%","用酒精消毒。","Sát trùng bằng cồn.",[],"SBT câu 19A."],[29,"不相上下","bùxiāng-shàngxià","thành ngữ","bất tương thượng hạ","ngang nhau, không phân cao thấp",1,"成","分不出高低，形容程度相等。","与……的人不相上下","两人的成绩不相上下。","Thành tích hai người ngang nhau.",[],"Bài tập 2⑤."],[30,"适宜","shìyí","tt.","thích nghi","thích hợp, vừa phải",1,"","合适；相宜。","在不适宜的场合","这里的气候适宜种茶。","Khí hậu ở đây thích hợp trồng chè.",[],"SBT câu 21B."],[31,"场合","chǎnghé","dt.","trường hợp","trường hợp, hoàn cảnh, dịp",1,"","一定的时间、地点、情况。","在不适宜的场合引发事故","在公共场合不要大声喧哗。","Nơi công cộng đừng ồn ào.",["公共场合"],"SBT câu 22A."],[32,"逆行","nìxíng","đgt.","nghịch hành","đi ngược chiều",1,"","（车辆）逆着规定方向行驶。","把车开上了逆行道","禁止逆行。","Cấm đi ngược chiều.",[],"Bài tập 1: <span class='zh'>行为 · 实行 · 举行 · 通行</span>. SBT câu 18D."],[33,"茫然","mángrán","tt.","mang nhiên","ngây dại, đờ đẫn, lơ đãng",1,"","完全不知道的样子；失意的样子。","表情茫然","他茫然地看着我。","Anh ta ngơ ngác nhìn tôi.",[],""],[34,"丢三落四","diūsān-làsì","thành ngữ","đâu tam lạc tứ","hay quên, quên trước quên sau",1,"成","形容马虎或记忆力不好而顾此失彼。","丢三落四","他总是丢三落四的。","Cậu ấy lúc nào cũng quên trước quên sau.",[],"⚠️ <span class='zh'>落 là</span>. Bài tập 3①. SBT 33–36."],[35,"起伏","qǐfú","đgt.","khởi phục","nhấp nhô, lên xuống",1,"","一起一落；比喻情绪、关系等的变化。","情绪起伏不定","连绵起伏的群山。","Dãy núi trập trùng.",[],"SBT 33–36."],[36,"发呆","fā dāi","đgt.","phát ngai","ngây người, ngẩn người",1,"","因着急、害怕或心思有所专注，而对外界事物完全不注意。","动不动就发呆","他坐在那儿发呆。","Anh ấy ngồi đó ngẩn ngơ.",[],"SBT 33–36."],[37,"记性","jìxing","dt.","ký tính","trí nhớ",1,"","记忆力。","记性越来越差","我记性不好。","Trí nhớ tôi kém.",[],"Bài tập 3①. SBT nghe 6–10."],[38,"地步","dìbù","dt.","địa bộ","tình trạng, mức",1,"","处境；（达到的）程度。","到了更严重的地步","事情怎么会发展到这个地步？","Sao chuyện lại đến nông nỗi này?",[],""],[39,"混乱","hùnluàn","tt.","hỗn loạn","hỗn loạn, lộn xộn",1,"","没条理；没秩序。","思维混乱","交通秩序很混乱。","Trật tự giao thông rất hỗn loạn.",[],""],[40,"恶化","èhuà","đgt.","ác hóa","chuyển biến xấu, trở nên tệ hơn",1,"","向坏的方面变。","健康状况逐步恶化","病情恶化了。","Bệnh tình xấu đi.",[],"SBT nghe 6–10."],[41,"慢性","mànxìng","tt.","mạn tính","mãn tính",1,"","发作得缓慢的；时间拖得很长的。","诱发慢性疾病","慢性病需要长期治疗。","Bệnh mạn tính cần điều trị lâu dài.",["慢性病"],""],[42,"总而言之","zǒng'éryánzhī","thành ngữ","tổng nhi ngôn chi","tóm lại, nói chung",1,"成","总起来说。","总而言之，睡眠好坏……","总而言之，这次活动很成功。","Tóm lại, hoạt động lần này rất thành công.",[],"Xem 篇章: 连接 (tổng kết). SBT câu 20C."],[43,"举足轻重","jǔzú-qīngzhòng","thành ngữ","cử túc khinh trọng","có ảnh hưởng lớn",1,"成","处于重要地位，一举一动都关系全局。","对人体健康举足轻重","他在公司里举足轻重。","Ông ấy có vai trò then chốt trong công ty.",[],"SBT câu 22D."],[44,"呼吁","hūyù","đgt.","hô dụ","hô hào, kêu gọi",1,"","向个人或社会申述，请求援助或主持公道。","医生呼吁","呼吁大家保护环境。","Kêu gọi mọi người bảo vệ môi trường.",[],"Bài tập 3②. SBT nghe câu 3."],[45,"无动于衷","wúdòngyúzhōng","thành ngữ","vô động vu trung","thản nhiên, thờ ơ, dửng dưng",1,"成","心里一点儿也不受感动；一点儿也不动心。","不要对失眠症状无动于衷","大家都哭了，他却无动于衷。","Mọi người đều khóc, anh ta lại dửng dưng.",[],"Bài tập 3②. SBT câu 20D."],[46,"竭尽全力","jiéjìn quánlì","thành ngữ","kiệt tận toàn lực","dốc hết sức, gắng sức",1,"成","用尽全部的力量。","竭尽全力进行治疗","我们会竭尽全力帮助你。","Chúng tôi sẽ dốc toàn lực giúp bạn.",[],"SBT câu 19C."],[47,"根源","gēnyuán","dt.","căn nguyên","nguồn gốc, nguyên nhân",1,"","使事物产生的根本原因。","导致问题的根源","找到问题的根源。","Tìm ra căn nguyên vấn đề.",[],"Bài tập 3①."],[48,"对付","duìfu","đgt.","đối phó","ứng phó, đối phó",1,"","应付；采取方法处理。","对付失眠症的方法","这个人不好对付。","Người này khó đối phó.",[],"Còn = tạm được: <span class='zh'>凑合</span>."],[49,"纠正","jiūzhèng","đgt.","củ chính","uốn nắn, sửa chữa",1,"","改正（缺点、错误）。","纠正不好的生活习惯","纠正发音。","Sửa phát âm.",[],""],[50,"糟蹋","zāotà","đgt.","tao đạp","lãng phí, làm hại, làm hư",1,"","浪费或损坏；侮辱，蹂躏。","不要糟蹋自己的身体","别糟蹋粮食。","Đừng lãng phí lương thực.",[],"SBT nghe câu 5: <span class='zh'>糟蹋好多纸</span>."],[51,"迫害","pòhài","đgt.","bách hại","hãm hại",1,"","压迫使受害。","不要自己迫害自己","他遭受过迫害。","Ông ấy từng bị bức hại.",[],""],[52,"毁灭","huǐmiè","đgt.","hủy diệt","phá hủy, tàn phá, làm suy nhược",1,"","摧毁消灭。","不要让坏习惯毁灭我们的健康","战争毁灭了这座城市。","Chiến tranh đã hủy diệt thành phố này.",[],""]],extra:[["失眠症","shīmiánzhèng","chứng mất ngủ"],["一线城市","yīxiàn chéngshì","thành phố hạng nhất (Bắc Kinh, Thượng Hải…)"],["褪黑素","tuìhēisù","melatonin"],["生物钟","shēngwùzhōng","đồng hồ sinh học"],["光污染","guāng wūrǎn","ô nhiễm ánh sáng"],["免疫力","miǎnyìlì","sức miễn dịch"],["睡眠障碍","shuìmián zhàng'ài","rối loạn giấc ngủ"],["翻来覆去","fānlái-fùqù","trằn trọc"],["噩梦连连","èmèng liánlián","ác mộng liên miên"],["疲劳驾驶","píláo jiàshǐ","lái xe khi mệt mỏi"],["诱发","yòufā","gây ra, dẫn đến"]],T:[{zh:"对普通人来说，睡觉只是惯例，可是对于患有顽固失眠症的人来说，睡觉却成了难得的奢侈。",vn:"Với người bình thường, ngủ chỉ là việc thường ngày; nhưng với người mắc chứng mất ngủ dai dẳng, ngủ lại trở thành một thứ xa xỉ hiếm hoi.",idea:"Mở bài: ngủ là xa xỉ.",q:["对患有顽固失眠症的人来说，睡觉意味着什么？"],note:[["对……来说，……；对于……来说，……却……","Đối lập hai nhóm người."]]},{zh:"近日，中国发布的睡眠指数总得分66.5分，超过36.2%的居民得分低于及格线60分。统计数字显示，睡眠指数的得分随着城市层级的升高而下降，一线城市的平均睡眠指数为60.3分，三线城市为61.4分，而农村和小城镇得分均在70分以上。可见，当前失眠症正扰乱着人们的情绪，摧残着城市人群的健康。",vn:"Gần đây, chỉ số giấc ngủ Trung Quốc công bố đạt tổng 66,5 điểm, hơn 36,2% cư dân dưới mức đạt 60 điểm. Số liệu cho thấy điểm chỉ số giảm khi cấp độ thành phố tăng: thành phố hạng nhất trung bình 60,3 điểm, hạng ba 61,4 điểm, còn nông thôn và thị trấn nhỏ đều trên 70. Có thể thấy, hiện nay chứng mất ngủ đang quấy rối cảm xúc, tàn phá sức khỏe người thành phố.",idea:"Số liệu chỉ số giấc ngủ.",q:["中国发布的睡眠指数情况怎么样？"],note:[["随着……而……","Theo… mà…"],["可见","Có thể thấy (tổng kết)."],["正扰乱着……，摧残着……","<span class='zh'>正……着</span> = đang."]]},{zh:"调查发现，该睡时不睡，是影响成人健康睡眠的重要因素。手机和平板电脑的普及，使睡前上网的习惯日渐盛行，不少人临睡前再过过网瘾成了常态。而电子产品严重的光污染不仅影响了人体褪黑素的正常分泌，还会使人体生物钟后移，结果就是晚上睡不着，早上睡不醒。",vn:"Điều tra phát hiện: đến giờ ngủ mà không ngủ là nhân tố quan trọng ảnh hưởng giấc ngủ lành mạnh của người lớn. Sự phổ cập điện thoại và máy tính bảng khiến thói quen lên mạng trước khi ngủ ngày càng thịnh hành, nhiều người trước lúc ngủ “lướt mạng cho đã” đã thành chuyện thường. Ô nhiễm ánh sáng nghiêm trọng từ thiết bị điện tử không chỉ ảnh hưởng sự tiết melatonin bình thường, mà còn làm đồng hồ sinh học lùi lại — kết quả là tối không ngủ được, sáng không dậy nổi.",idea:"Nguyên nhân: điện tử, ánh sáng.",q:["影响成人健康睡眠的因素是什么？"],note:[["过过网瘾","Động từ ly hợp lặp lại: <span class='zh'>过过瘾</span>."],["不仅……，还……","Không chỉ… mà còn…"]]},{zh:"褪黑素是什么？据研究，褪黑素是保证人体健康的重要物质之一，它的职能包括增强人体免疫力、抗衰老、调剂睡眠等。当人体内褪黑素分泌不正常时，人体细胞组织和器官的作用和活动能力都会受到影响，各种疾病，包括恶性肿瘤，也就是我们常说的癌症，就会随之而来。",vn:"Melatonin là gì? Theo nghiên cứu, melatonin là một trong những chất quan trọng bảo đảm sức khỏe con người, chức năng gồm tăng cường miễn dịch, chống lão hóa, điều hòa giấc ngủ… Khi melatonin tiết không bình thường, tác dụng và năng lực hoạt động của tế bào, mô và cơ quan đều bị ảnh hưởng; đủ loại bệnh tật, kể cả khối u ác tính — tức là bệnh ung thư — sẽ theo đó mà đến.",idea:"Melatonin.",q:["褪黑素有什么职能？分泌不正常时会怎样？"],note:[["褪黑素是什么？据研究，……","Thiết vấn (bài 29: 设问)."],["随之而来","Theo đó mà đến."]]},{zh:"除了睡不着，还有人睡不好。中国有睡眠障碍的人约为38.2%，因此，在中国专治睡眠障碍的医生总是供不应求。",vn:"Ngoài không ngủ được, còn có người ngủ không ngon. Người có rối loạn giấc ngủ ở Trung Quốc chiếm khoảng 38,2%, vì vậy bác sĩ chuyên trị rối loạn giấc ngủ luôn cung không đủ cầu.",idea:"Chuyển: ngủ không ngon.",q:[],note:[["除了……，还……","Câu chuyển đoạn (连接)."]]},{zh:"睡眠障碍表现为入睡困难，头在枕头上，就是睡不着，翻来覆去瞎折腾，心烦意乱得无法容忍，白天又老是犯困。此外，入睡后噩梦连连，一会儿蹬腿，一会儿挥拳头，不时大声叫喊，也是睡眠障碍的典型症状。",vn:"Rối loạn giấc ngủ biểu hiện là khó vào giấc: đầu đặt lên gối mà vẫn không ngủ được, trằn trọc lăn qua lăn lại, bứt rứt đến không chịu nổi, ban ngày lại cứ buồn ngủ. Ngoài ra, ngủ rồi thì ác mộng liên miên, lúc đạp chân, lúc vung nắm đấm, chốc chốc lại la hét — cũng là triệu chứng điển hình.",idea:"Biểu hiện rối loạn giấc ngủ.",q:["睡眠障碍有哪些表现？"],note:[["此外","Xem 篇章: 连接 (mở rộng)."],["一会儿……，一会儿……","Lúc thì… lúc thì…"],["不时大声叫喊","Xem Ngữ pháp 1: <span class='zh'>不时</span>."]]},{zh:"睡眠不足会使人气色不好，行为能力偏离正常轨道，据悉，一个17～19个小时没睡觉的人，其行为能力与一个血液中酒精浓度为0.05%的人不相上下。即便一周内每天少睡两个小时，疲劳也会累积在一起，并在不适宜的场合引发事故，我们曾见过这样一个不可思议的案例，一位技术熟练的老司机把车开上了逆行道，而这就是疲劳驾驶造成的。",vn:"Thiếu ngủ làm sắc mặt kém, năng lực hành vi lệch khỏi quỹ đạo bình thường. Được biết, người 17–19 tiếng không ngủ có năng lực hành vi ngang ngửa người có nồng độ cồn trong máu 0,05%. Dù chỉ mỗi ngày ngủ ít đi hai tiếng trong một tuần, mệt mỏi cũng tích tụ lại và gây tai nạn ở những lúc không thích hợp. Chúng tôi từng thấy một ca khó tin: một tài xế lão luyện lái xe vào làn ngược chiều — đó chính là do lái xe khi mệt mỏi.",idea:"Tác hại 1: tai nạn.",q:["睡眠不足会造成什么后果？"],note:[["与……不相上下","Ngang ngửa với…"],["即便……也……","Dù cho… cũng…"]]},{zh:"此外，长期睡眠不足还会使人注意力下降、表情茫然、丢三落四、情绪起伏不定，动不动就发呆，继而记性越来越差，到了更严重的地步，会思维混乱，健康状况逐步恶化，进而诱发慢性疾病。总而言之，睡眠好坏对人体健康举足轻重，因此，医生呼吁，不要对失眠症状无动于衷，要弄清病因，并根据不同情况竭尽全力进行治疗。",vn:"Ngoài ra, thiếu ngủ lâu ngày còn khiến người ta giảm tập trung, nét mặt đờ đẫn, quên trước quên sau, cảm xúc thất thường, hơi tí là ngẩn người; tiếp đó trí nhớ ngày càng kém; đến mức nặng hơn thì tư duy rối loạn, sức khỏe dần xấu đi, rồi dẫn đến bệnh mạn tính. Tóm lại, ngủ tốt hay xấu có ảnh hưởng hệ trọng đến sức khỏe; vì vậy bác sĩ kêu gọi: đừng thờ ơ với triệu chứng mất ngủ, phải tìm rõ nguyên nhân và dốc toàn lực điều trị tùy tình hình.",idea:"Tác hại 2: sức khỏe dần xấu.",q:["长期睡眠不足对人体有什么影响？"],note:[["……，继而……，到了更严重的地步，……，进而……","Xem 篇章: 连接 — trình tự diễn biến."],["总而言之","Liên kết tổng kết."],["动不动就……","Hơi một tí là…"]]},{zh:"不可否认的是，很多人原本睡眠是没有问题的，导致问题的根源多多少少与不健康的生活方式有关，因此，对付失眠症的方法就是纠正不好的生活习惯，不要糟蹋自己的身体，不要自己迫害自己，不要让坏习惯毁灭我们的健康。",vn:"Không thể phủ nhận, nhiều người vốn dĩ ngủ không có vấn đề gì; căn nguyên gây ra vấn đề ít nhiều liên quan đến lối sống không lành mạnh. Vì vậy, cách đối phó chứng mất ngủ là sửa thói quen sinh hoạt xấu, đừng hành hạ cơ thể mình, đừng tự hại mình, đừng để thói quen xấu hủy hoại sức khỏe của chúng ta.",idea:"Kết: sửa thói quen.",q:["对付失眠症的方法是什么？"],note:[["多多少少","Xem Ngữ pháp 2."],["不要……，不要……，不要……","Điệp “不要” (排比)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章 & từ vựng",G:[{id:"g1",grp:1,word:"不时",zh:"不时",py:"bùshí",tag:"Chú thích 1 · phó từ",mean:"Phó từ, biểu thị động tác, hành vi <b>lặp lại hoặc thường xảy ra trong thời gian tương đối ngắn</b> — “chốc chốc, thỉnh thoảng”. Có thể thêm <span class='zh'>地</span>. Dùng trong văn viết.",forms:["不时（地）+ V"],ex:[["入睡后噩梦连连，一会儿蹬腿，一会儿挥拳头，不时（地）大声叫喊，也是睡眠障碍的典型症状。","",1],["……走在街上，阵阵桂花香不时扑面而来。","…đi trên phố, từng làn hương hoa quế chốc chốc lại phả vào mặt."],["天刚蒙蒙亮，世界还没有睡醒，只有不时传来的几声鸟叫提醒我们，新的一天又开始了。","Trời vừa tờ mờ sáng, chỉ có vài tiếng chim chốc chốc vọng lại nhắc rằng một ngày mới bắt đầu."]],tips:["Gần <span class='zh'>时不时 · 时常</span>.","Bài tập 2④."],practice:{q:"用“不时”完成句子",type:"complete",items:[["房门大开着，说笑声________。","房门大开着，说笑声不时传出。"],["会场上________各种各样的问题，他便耐心地一一回答。","会场上不时有人提出各种各样的问题……"],["窗台上，妈妈放下的一碗小米________觅食的鸟儿。","……一碗小米不时吸引着觅食的鸟儿。"]]}},{id:"g2",grp:2,word:"",zh:"多多少少",py:"duōduōshǎoshǎo",tag:"Chú thích 2",mean:"Dạng lặp của phó từ <span class='zh'>多少</span>, nghĩa là <b>ít nhiều, hoặc nhiều hoặc ít</b>.",forms:["多多少少 + V / 与……有关","多多少少 + 还 / 也……"],ex:[["不可否认的是，很多人原本睡眠是没有问题的，导致问题的根源多多少少与不健康的生活方式有关。","",1],["春天遭了雹灾，别人家的桃子都没有收成，我家的果园在山后，多多少少还收了一些。","Mùa xuân bị mưa đá, nhà khác mất mùa đào, vườn nhà tôi sau núi nên ít nhiều vẫn thu được chút."],["在火车开动的一刹那，我才发现，尽管自己很想去外面闯荡，可离开父母多多少少还是让自己有些感伤。","Lúc tàu chuyển bánh tôi mới nhận ra, dù rất muốn ra ngoài lăn lộn, rời bố mẹ ít nhiều vẫn thấy buồn."]],tips:["Bài tập 2⑥. SBT câu 23D."],practice:{q:"用“多多少少”完成句子",type:"complete",items:[["这本书真实地反映了老百姓关心的社会问题，________想说的话。","……多多少少说出了老百姓想说的话。"],["别人有困难，我们理应帮助，这点儿钱数量不多，________。","……多多少少是个意思。"],["……但也不能说对于说话一窍不通，大多数人都________。","……大多数人都多多少少会讲究说话的方式方法。"]]}},{id:"g3",grp:2,word:"总而言之",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>供不应求</span> = cung không đủ cầu. <span class='zh'>不相上下</span> = ngang nhau. <span class='zh'>丢三落四</span> = hay quên. <span class='zh'>举足轻重</span> = hệ trọng. <span class='zh'>无动于衷</span> = thờ ơ. <span class='zh'>竭尽全力</span> = dốc toàn lực. <span class='zh'>总而言之</span> = tóm lại.",forms:["A 与 B 不相上下","对……举足轻重","对……无动于衷"],ex:[["专治睡眠障碍的医生总是供不应求。","",1],["睡眠好坏对人体健康举足轻重。","",1],["不要对失眠症状无动于衷。","",1]],tips:["Bài tập 2③⑤."]},{id:"g4",grp:1,word:"容忍",zh:"容忍 / 忍受",py:"róngrěn / rěnshòu",tag:"Xem 辨析 bên dưới",mean:"Đều là “nhẫn nhịn, chịu đựng”. <span class='zh'>容忍</span>: thiên về <b>khoan dung</b>, thường với <b>hành vi của người khác</b>. <span class='zh'>忍受</span>: gắng <b>chịu đựng</b> đau khổ, khó khăn, bất hạnh — phạm vi rộng hơn.",forms:["不能容忍 + 行为 / 态度","忍受 + 痛苦 / 炎热 / 噪音"],ex:[["心烦意乱得无法容忍。","",1]],tips:["<span class='zh'>×容忍天气</span> → <span class='zh'>忍受天气</span>."]}],BX:{grp:1,word:"容忍",cols:["√","×"],pair:"容忍 — 忍受",same:["Đều có nghĩa <b>nhẫn nại, chịu đựng</b>.","他的傲慢态度让人实在不能容忍 / 忍受。"],diff:[["Thiên về <b>khoan dung, nhẫn nại</b>, thường chỉ thái độ đối với <b>hành vi của người khác</b>.","我不能容忍他的错误行为。（√）　我不能容忍这里炎热的天气。（×）","Thiên về <b>gắng chịu</b> đau khổ, khó khăn, cảnh ngộ bất hạnh; phạm vi dùng <b>rộng hơn</b> 容忍.<div class='zh' style='margin-top:4px'>这里炎热的天气让人无法忍受。（√）</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["如果你的男朋友有抽烟的习惯，你能容忍吗？",0,"Thói quen (hành vi) của người khác → <span class='zh'>容忍</span> đúng."],["他睡觉时呼噜打得太厉害了，我实在忍受不了。",0,"<span class='zh'>忍受</span> phạm vi rộng — đúng."],["失去爱人的痛苦让人不能容忍，她夜夜失眠。",1,"Nỗi đau → phải dùng <span class='zh'>忍受</span>."],["那么多苦难都忍受过来了，这点儿困难算什么？",0,"Khổ nạn → <span class='zh'>忍受</span> đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>当</u>前","当场 · 当地 · 当时 · 当年"],items:[["<u>惯</u>例","惯","习惯 · 惯于 · 娇惯 · 司空见惯"],["扰<u>乱</u>","乱","紊乱 · 乱套 · 凌乱 · 乱世"],["容<u>忍</u>","忍","忍受 · 忍耐 · 忍俊不禁 · 忍辱负重"],["逆<u>行</u>","行","行为 · 实行 · 举行 · 通行"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["不法商贩的行为________。","扰乱","不法商贩的行为扰乱了社会的正常秩序。"],["________改变了人们的生活方式。","普及","网络的普及改变了人们的生活方式。"],["市场上________。","供不应求","市场上的应季水果供不应求。"],["他一边走，一边________。","不时","他一边走，一边不时向身后张望。"],["我跟他的________。","不相上下","我跟他的成绩不相上下。"],["虽然没什么胃口，但________。","多多少少","虽然没什么胃口，但我多多少少还是吃了一点儿。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["根源","气色","记性","丢三落四","折腾"],text:"最近几个月来，顽固的头疼把他{折腾}得吃不下饭、睡不好觉，{气色}也很不好。而睡眠不足又使他的{记性}越来越差，总是{丢三落四}的。可导致头疼的{根源}却一直没找到。"},{bank:["摧残","无动于衷","癌症","细胞","呼吁"],text:"一些不良的生活习惯，如抽烟、喝酒、暴饮暴食、晚睡等正{摧残}着人们的健康，这些坏习惯会影响人体{细胞}的活动，进而导致各种疾病，甚至{癌症}的发生。所以医生{呼吁}，不要对不良生活习惯{无动于衷}，要对它们说“不！”"}]},EX4:{q:"根据上下文的连接关系给下列小句排序，组成连贯的语段",type:"order",vn:"Chú ý các thành phần liên kết: <span class='zh'>有几回 · 便 · 仍然 · 于是</span>.",sets:[{ans:"BECAD",ph:"ABCDE",items:[["A","孔乙己着了慌，伸开五指将碟子罩住，弯腰下去说道，“不多了，我已经不多了。”"],["B","有几回，邻舍孩子听得笑声，也赶热闹，围住了孔乙己。"],["C","孩子吃完豆，仍然不散，眼睛都望着碟子。"],["D","于是，这一群孩子都在笑声里走散了。"],["E","他便给他们茴香豆吃，一人一颗。"]],full:"有几回，邻舍孩子听得笑声，也赶热闹，围住了孔乙己。他便给他们茴香豆吃，一人一颗。孩子吃完豆，仍然不散，眼睛都望着碟子。孔乙己着了慌，伸开五指将碟子罩住，弯腰下去说道，“不多了，我已经不多了。”于是，这一群孩子都在笑声里走散了。<div class='small muted'>Đáp án in trong sách là “E C B A D” (có vẻ in nhầm); theo mạch văn và nguyên tác Lỗ Tấn《孔乙己》, thứ tự đúng là B → E → C → A → D.</div>"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["中国发布的睡眠指数情况","① 睡眠指数得分 ② 一线城市，三线城市，农村和小城镇 ③ 可见……","中国睡眠指数总得分66.5分，一线城市60.3分，三线城市61.4分，农村和小城镇都在70分以上。可见，失眠症正摧残着城市人群的健康。"],["影响成人健康睡眠的因素","① 电子产品普及 ② 光污染导致褪黑素……，生物钟……","手机和平板电脑普及，睡前上网盛行；电子产品的光污染影响褪黑素分泌，使生物钟后移。"],["褪黑素","① 褪黑素的职能 ② 当褪黑素分泌不正常时……","褪黑素能增强免疫力、抗衰老、调剂睡眠；分泌不正常时，各种疾病甚至癌症会随之而来。"],["睡眠障碍的表现","① 入睡困难 ② 入睡后……","入睡困难，翻来覆去睡不着，白天老犯困；入睡后噩梦连连，蹬腿、挥拳头、大声叫喊。"],["睡眠不足对人体的影响","气色、行为能力、注意力、表情、情绪、记性、思维、健康状况、慢性疾病","睡眠不足会使人气色不好，行为能力偏离正常，容易引发事故；长期睡眠不足还会使人注意力下降、记性变差、思维混乱，诱发慢性疾病。"],["对付失眠症的方法","纠正不好的生活习惯","对付失眠症的方法就是纠正不好的生活习惯。"]]},PZ:{title:"篇章（4）连接",vn:"Thành phần liên kết",intro:"Thành phần liên kết trong văn bản là những từ ngữ <b>có nghĩa rõ ràng</b>; nhờ chúng ta hiểu được <b>quan hệ ngữ nghĩa giữa các câu</b>: trình tự (<span class='zh'>首先 · 然后 · 继而 · 进而</span>), mở rộng (<span class='zh'>此外 · 再者 · 而且</span>), nhân quả (<span class='zh'>因为 · 所以 · 于是</span>), tổng kết (<span class='zh'>总而言之 · 可见</span>)…",ex:[["长期睡眠不足还会使人注意力下降……，继而记性越来越差，到了更严重的地步，会思维混乱……，进而诱发慢性疾病。","Từ “注意力下降” → “继而” → “到了更严重的地步” → “进而”: phản ánh thứ tự diễn biến triệu chứng."],["总而言之，睡眠好坏对人体健康举足轻重……","“总而言之” — liên kết quan hệ tổng kết."],["……白天又老是犯困。此外，入睡后噩梦连连……","“此外” — liên kết mở rộng diễn đạt."]],q:"请把下列5个小句组合成2个连贯的语段",pvn:"A. 再者，老年人和年轻人的生活习惯不一样。所以这几年我一直一个人生活。　B. 他首先展示了手上的证据，然后说明了证据的来源和意义。　C. 因为孩子家的住房都不宽裕，住在一起不方便。　D. 他说话不紧不慢，却句句义正辞严，他的话说完了，法庭上一片寂静。　E. 如今孩子们都已长大成人，有了小家，有了自己的孩子。虽然他们都劝我和他们一起生活，可我谁家也不愿意去。",practice:[["语段（1）","E → C → A（如今…… → 因为…… → 再者……所以……）"],["语段（2）","B → D（首先……然后…… → 他说话……）"]]},DP:[{title:"词汇：看图片，熟悉下列名词",vn:"Danh từ thường gặp.",items:[["端午节","Duānwǔ Jié","Tết Đoan Ngọ","吃粽子 · 划龙舟","端午节人们要吃粽子，划龙舟。"],["棉花","miánhua","bông (cây bông)","雪白的棉花","雪白的棉花像天上的白云。"],["化石","huàshí","hóa thạch","动物化石","科学家们在这儿发现了一些动物化石。"],["花蕾","huālěi","nụ hoa","含苞待放","花蕾含苞待放。"],["卡通","kǎtōng","phim / nhân vật hoạt hình","卡通人物","我特别喜欢迪士尼的卡通人物。"],["雷达","léidá","ra-đa","雷达探测","雷达探测到了一些陌生的信号。"],["直径","zhíjìng","đường kính","半径 · 直径","他画的这个圆半径3厘米，直径6厘米。"],["标本","biāoběn","tiêu bản","蝴蝶标本","我制作了一些蝴蝶标本。"],["舞蹈","wǔdǎo","vũ đạo, múa","舞蹈演员","舞蹈总是带给人美的享受。"],["立方","lìfāng","lập phương","立方体","那儿有三个立方体。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"十七八年前，他最后一次会见他的母校康奈尔大学的史学大师布尔先生。布尔先生有一句话他至今没有忘记。先生说，年纪越大，越感觉到容忍比自由更重要。",o:["他毕业于康奈尔大学","布尔先生认为自由最重要","十几年前他就想见布尔先生","布尔先生只和他说了一句话"],a:0,why:"“他的母校康奈尔大学” — <span class='zh'>母校</span> = trường cũ. Có <span class='zh'>容忍</span>."},{n:2,say:"随着科学技术的普及，人们将更愿意接受电脑采访。有调查显示，与纸张问卷的调查形式相比，越来越多的人更愿意接受借助于电脑的采访，特别是那些对技术感兴趣或熟悉电脑的人，明显持肯定态度。",o:["纸张问卷调查更受欢迎","多数人都渴望学习新技术","电脑采访将被更多的人肯定","电脑采访只适合熟悉电脑的人"],a:2,why:"“人们将更愿意接受电脑采访”. Có <span class='zh'>普及</span>."},{n:3,say:"他想借贵报一角呼吁：读书应该成为人们的追求和良好的风尚。因为读书是将人类浓缩几千年的科技、文化快速习得的最佳方式，读书能够让你在极短的时间内，掌握大量的科学文化知识，摆脱愚昧和迷信。",o:["读书可摆脱愚昧","不读书就会迷信","他借了一张报纸看","书也传授学习方法"],a:0,why:"“摆脱愚昧和迷信”. Có <span class='zh'>呼吁</span>."},{n:4,say:"他是一名出色的军官，总是能精确地完成任务。他有个14岁的儿子，正值叛逆期，而且像他的父亲一样顽固。不过他很骄傲，孩子有自己的主见，不会人云亦云，他对自己的孩子有着许多期待。",o:["儿子不喜欢坏天气","儿子从小做事认真","儿子将来也想当军官","儿子是个有主意的人"],a:3,why:"“孩子有自己的主见”. Có <span class='zh'>顽固</span>."},{n:5,say:"一次，我问他：“忙些什么？”他说：“练画儿，每天糟蹋好多纸！”他的画儿很像他的文章，是些小画儿，雅气，很有品位，是典型的文人画儿。他的画儿和他的文章颇有共同之处，观其画儿能咂摸出他写文章的特点。",o:["其画儿如其文","他学画儿非常用心","他只写些短小的文章","他给自己的文章画插图"],a:0,why:"“他的画儿很像他的文章”. Có <span class='zh'>糟蹋</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：孙老师是搞生命科学的，今天打算跟大家谈谈我们非常熟悉的睡眠。\n男：对于睡眠的机制和功效，前沿的探索尽管还很粗浅，但科学家基本上得出了一些结论。\n女：我们进入休息状态的时候，大脑是否在休息？\n男：不会。我们从能耗的角度来考虑。我们思考、工作时，大脑对血氧的消耗可达全身的40%以上，而在睡眠状态下，大脑能耗仍达20%～30%。这和人的肌体大不相同，静卧时肌体的能耗可降低到运动时的十分之一。可见，人在睡眠时大脑仍在紧张地工作。\n女：我们能不能随意调整睡眠时间、长度或时段？\n男：也不能，至少是极为困难的。成年人每天需要7至9小时睡眠，平均7个半小时。睡眠效果最佳的时段，是午夜之前到第二天早上六点，所以越洋飞行后倒时差是挺痛苦的事，调整过来后，你还得按当地的这个时段来睡眠。这也说明，人们几乎不能适应“大夜班”，可能的话，应该尽量避免。偶尔为之，或许还凑合，长期如此，就是对身体的摧残。\n女：人越老需要的睡眠时间越少，有道理吗？\n男：不是。上了年岁，不容易长睡，但白天会打盹儿。好办法是分数次睡眠，就是人们常说的“猫打盹儿”，对老龄人蛮实用的。《马年睡个好觉》这本书提到年近七旬的丘吉尔，在第二次世界大战中，是如何挺过公务繁忙的那五个年头的，他靠的就是每天数次的“猫睡”。每次少至20分钟，长不超出一小时，一次不够，两次足矣，这样老人精力不济、记性变差的疲态就可以改善了。\n女：睡不着时闭眼静卧能代替睡眠吗？\n男：不能。也许这能保持一些精力，减低一点儿能耗，但大脑休整的充分实现，要靠真正的睡眠来完成。睡眠恶化固然有压力、紧张、心理问题的因素，但还有其他原因，往往要靠诊治，不然不会轻易消失。同时，坚持运动也会有很大帮助。",qs:[{n:6,q:"对于睡眠的研究，现在处于什么阶段？",o:["有了定论","十分浅显","深入探索阶段","已达最高水平"],a:1,why:"“前沿的探索尽管还很粗浅” — <span class='zh'>粗浅 ≈ 浅显</span>."},{n:7,q:"为什么说人在睡眠状态中，大脑没有休息？",o:["大脑能耗减少有限","大脑仍在紧张思考","肌体能耗大幅减少","肌体仍需紧张工作"],a:0,why:"Lúc ngủ não vẫn tiêu hao 20–30% (so với 40%) — giảm không nhiều."},{n:8,q:"关于睡眠时间、睡眠长度和时段，下列哪项正确？",o:["睡眠长度可长可短","睡眠时间应在午夜之后","上夜班后必须要补充睡眠","人体不堪忍受睡眠时段混乱"],a:3,why:"“长期如此，就是对身体的摧残”. Có <span class='zh'>忍受</span>."},{n:9,q:"关于猫睡，下列哪项正确？",o:["猫睡是衰老的表现","猫睡是丘吉尔发明的","应大大普及猫睡方式","精力不足可用猫睡缓解"],a:3,why:"“老人精力不济……的疲态就可以改善了”."},{n:10,q:"闭眼静卧的作用是什么？",o:["减少消耗","改善睡眠","缓解紧张的心情","使大脑得到休整"],a:0,why:"“减低一点儿能耗”; D sai: phải nhờ giấc ngủ thật."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"早睡早起，有益身心健康，但它并不适合每一个人，尤其是IT族、文字工作者。在一些拥有伟大头脑和卓越功勋的人中，盛行夜猫子习惯。\n几个月前，王鹏曾尝试早起。他比以往提前1～1.5个小时起床，但他无法适应早早地躺在床上。不管白天多么疲惫，晚上10:00以后他的头脑都变得活跃兴奋，直到12:00以后。早早地在床上躺着，他会心烦意乱、辗转反侧，恨不得用拳头捶打自己，就是一点儿也不困。不得已，他又重拾惯例。\n当然晚睡晚起也不是完全有利。如果不加控制和计划，将会导致过度睡眠，进而浪费掉一整天的大好时光。因此，晚起不等于不起，晚睡不等于不睡，最好设置合理的作息时间，制订适合自己生物钟的时间表，充分利用自由的夜晚时间，这就是我给夜猫子的一些建议，希望对提高我们的工作效率有所帮助。",qs:[{n:11,q:"什么人有熬夜的习惯？",o:["年轻人","喜欢读书的人","身体健康的人","一些很有成就的人"],a:3,why:"“拥有伟大头脑和卓越功勋的人中，盛行夜猫子习惯”."},{n:12,q:"王鹏尝试早起后发生了什么事？",o:["早上困得起不来","该做的事做不完","心情变得非常坏","不能习惯晚上早睡"],a:3,why:"“他无法适应早早地躺在床上”."},{n:13,q:"晚睡晚起应该注意什么？",o:["熬夜要适当","要懂得珍惜时间","不能变晚起为不起","要提早订好工作计划"],a:2,why:"“晚起不等于不起”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"自然界的花儿不仅形态各异，颜色更是五彩缤纷，那么，花儿为什么会有各种颜色呢？原来，花瓣中含有各种色素，正是这些色素，形成了花儿的五颜六色。\n造就花儿色泽最主要的色素叫作“花青素”，它分布在细胞的液泡内，控制花儿的颜色变化。花青素很调皮，在不同的环境下，会形成不同的颜色。在酸性溶液中，它呈现红色，酸性越强，颜色越红；在碱性溶液中，它呈现蓝色。碱性较强时，会成为蓝黑色，当它处于中性环境的时候，则是紫色。\n花青素虽然神通广大，但花的颜色并不全由它来控制，广泛存在于花瓣中的另一类色素，是类胡萝卜素，这种色素“色如其名”。目前已发现的类胡萝卜素有600种以上，不同种类的类胡萝卜素能使花显出黄色、橙黄色、橙红色等。\n此外，影响花朵颜色的色素还有类黄酮、甜菜色素等。至于白花，是因为细胞液里不含色素，而绿色花，则是含有叶绿素的缘故。",qs:[{n:14,q:"自然界的花儿有什么特点？",o:["青红皂白","青出于蓝","绚丽多彩","花红柳绿"],a:2,why:"“颜色更是五彩缤纷” ≈ <span class='zh'>绚丽多彩</span>."},{n:15,q:"关于花青素，可以知道什么？",o:["它总是不断地变化","它最怕与酸碱融合","适应环境的能力很强","蓝色红色都与它有关"],a:3,why:"Môi trường axit → đỏ, kiềm → xanh."},{n:16,q:"关于类胡萝卜素，下列哪项正确？",o:["存在于胡萝卜之中","颜色与胡萝卜类似","有近600种颜色变化","是很多人喜爱的颜色"],a:1,why:"“色如其名” — màu như tên (cà rốt)."},{n:17,q:"根据这段话，可以知道什么？",o:["花儿的颜色与色素有关","白花中有一种透明色素","叶绿素影响了叶子的颜色","花青素决定着花儿的颜色"],a:0,why:"“正是这些色素，形成了花儿的五颜六色”. D sai: “并不全由它来控制”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["只见他双腿夹了一下马肚，那马四蹄蹬开，绝尘而去。","因为我在外面漂泊比较多年了，思念也变得更浓更深。","用布包裹橙皮制成香包，放在枕头旁，不仅有催眠的功效，还能驱蚊。","交通规则中，闯红灯、逆行虽然都是禁止的，但这样的违规行为还是时有发生。"],a:1,why:"<b>Dùng từ sai</b>: <span class='zh'>比较多年</span> không hợp → <span class='zh'>好多年</span> / <span class='zh'>多年</span>."},{n:19,o:["有些人对酒精是过敏的，所以饮酒一定要量力而为。","有研究显示，高盐饮食与某些癌症的发生也有一定关系。","既然市民推选我当市长，我就别无选择，只有竭尽全力把工作做好。","至去年年末，中国的第一大城市上海市常住人口大约为2400万多人。"],a:3,why:"<b>Mâu thuẫn</b>: <span class='zh'>大约</span> và <span class='zh'>多</span> không dùng cùng lúc."},{n:20,o:["我们的成功和有很好的团队、有合理的公司股份结构有很大关系，否则，没有深圳那么好的发展环境，我们同样不会成功。","初中生大脑神经细胞的机能结构尽管有了相当的发展，可以承担比小学生更为繁重的智力活动任务，但它们仍然比较娇嫩脆弱，很容易疲劳。","睡前按摩头皮能够帮助我们入睡，提高我们的睡眠质量，而且还能辅助治疗头痛、失眠、感冒、神经衰弱等。总而言之，按摩头皮有百利而无一害。","女儿总是劝父母吃得好一些，穿得好一些，不要太苦了自己。然而无论你怎么劝，老人一概无动于衷，或是淡淡地答道“一辈子都是这样过来的，习惯了。”"],a:0,why:"<b>Logic liên kết sai</b>: <span class='zh'>否则</span> không hợp; phải là <span class='zh'>当然，……</span> / <span class='zh'>同时，如果没有……</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"在儿童的游戏，特别是创造性游戏中，要求儿童有___而有目的的想象力，例如，“骑马”“开火车”等。___，故事、艺术活动也都能___想象力的发展。",o:["凭空　其余　推动","广阔　其他　适宜","丰富　此外　促进","奇异　别的　助力"],a:2,why:"<span class='zh'>丰富的想象力</span>; <span class='zh'>此外</span> (liên kết mở rộng!); <span class='zh'>促进发展</span>."},{n:22,text:"天桥乐茶园——一个___的剧场，几百位观众，惯常的座无虚席，___，并不时爆发出___般的笑声与掌声，这便是相声表演社团“德云社”演出时最常见的___，用一个字儿来形容：“火”。",o:["像样　心神不定　风雨　场合","传统　聚精会神　潮水　景象","演出　供不应求　迅雷　形势","过瘾　举足轻重　海啸　现象"],a:1,why:"<span class='zh'>传统的剧场</span>; <span class='zh'>聚精会神</span>; <span class='zh'>潮水般的掌声</span>; <span class='zh'>景象</span>. Có <span class='zh'>不时</span>!"},{n:23,text:"好不容易来趟台湾，___全岛观光一___，但时间有限，只能走马观花。况且，我的兴趣不在台北的风景名胜、街市风情，我希望___能接触到一些台北的市民，了解这座名城的内在___。",o:["恨不得　趟　反反复复　品质","迫不得　次　三三两两　生态","等不得　轮　堂堂正正　根源","巴不得　番　多多少少　韵味"],a:3,why:"<span class='zh'>巴不得</span>; <span class='zh'>观光一番</span>; <span class='zh'>多多少少</span> (ngữ pháp bài này!); <span class='zh'>内在韵味</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"睡眠医学作为一门新兴学科有其独特之处，但是之前并未受到足够的重视，以前在医学院校中没有与睡眠医学相关的课程，(24)，这是世界性的问题。\n美国经过20多年的发展，(25)，与睡眠相关的课程已成为医学院校学生的必修课。他们几年前还建立了独立认证体系，通过了睡眠医师及睡眠技师资格考试制度。2003年底2004年初通过认证的睡眠专业医师已有2500人。睡眠专业学会制定了睡眠障碍诊治指南，(26)。\n(27)，健康睡眠和睡眠障碍的巨大潜在市场吸引了众多国内外企业投入到睡眠产业中，如睡眠相关的药物、器械、保健食品、家居、纺织品等。它是生命科技产业的重要组成部分，(28)，有的也确实能够帮助解除或减轻睡眠障碍病人的痛苦。",opts:["医院中也没有睡眠专科","同时能够给人们提供良好的睡眠条件","规范的诊疗体系已然形成","一个新学科的产生必然伴随着相应产业的兴起","睡眠医学已逐渐成为独立的专业学科"],ans:{24:0,25:4,26:2,27:3,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"美国《科学》周刊刊登了科罗拉多大学教授劳伦斯·威廉斯和耶鲁大学教授约翰·巴奇的研究成果，认为身体的热量，如手捧一杯咖啡时产生的热量，能够对人际关系和社会行为产生积极影响。\n科学家进行的首次实验是给41名妇女每人一杯咖啡，有的咖啡是热的，有的是冷的，然后向她们询问个人信息，之后让她们对某个人进行简短描述。结果表明，手捧热咖啡的人对描述对象的看法比手捧冷咖啡的人要积极很多。研究报告指出，是身体产生的热量使这些妇女对描述对象产生了亲切感。\n第二次实验同样表明了体温对社会行为会产生影响。在实验过程中，参与者需要为自己或朋友选择一份小礼物，手捧热咖啡的人大多会为朋友挑选礼物，而手捧冷咖啡的人更愿意为自己选礼物。\n这项研究成果有助于理解，为什么人类和动物在幼年时期要依靠身体接触和温暖的感觉来刺激情感发育和发展健康的社会关系。",qs:[{n:29,q:"关于第一次实验，下列哪项正确？",o:["41名妇女喝的是热咖啡","参与者会被问及个人信息","捧热咖啡的人对生活更乐观","参与者要介绍自己的一位朋友"],a:1,why:"“然后向她们询问个人信息”."},{n:30,q:"关于第二次实验，下列哪项正确？",o:["参与者要互相赠送礼物","手捧热咖啡的人不够大方","手捧冷咖啡的人相当慷慨","参与者可为自己或朋友选礼物"],a:3,why:"“为自己或朋友选择一份小礼物”."},{n:31,q:"根据这段话，可以知道什么？",o:["咖啡会对人产生影响","健康的社会关系有助于人的成长","幼年，温暖的感觉可刺激情感的发育","《科学》杂志的工作人员参与了此项研究"],a:2,why:"Câu cuối: “依靠……温暖的感觉来刺激情感发育”."},{n:32,q:"最适合做上文标题的是：",o:["多喝热咖啡的好处","热咖啡可以调剂情绪","人体热量影响人际关系","能够扰乱人类行为的冷咖啡"],a:2,why:"Chủ đề: “身体的热量……对人际关系……产生积极影响”."}]},{ins:"第33–36题：请选出正确答案。",text:"一些患有失眠症的人常说自己丢三落四，记忆力减退，气色不好，有时发呆、情绪起伏不定。为了弄清失眠症患者与睡眠正常者的脑部差异，有研究者专门做了实验。\n这项研究的参与者包括25名失眠症患者和25名睡眠正常的人。\n研究显示，失眠症患者在完成涉及短时记忆的工作时能和没有睡眠障碍的人做得一样好。\n在睡眠测试环节，失眠症参与者每晚的平均睡眠时间是6小时，而睡眠正常的人则是7小时。所有参与者都需要完成一项涉及工作记忆的任务，在此期间，研究人员会使用功能性磁共振成像技术扫描他们的大脑。工作记忆是一种利用在大脑中处理并储存的短时信息完成手头任务的能力。这项记忆任务是依次看一组字母并找出其中重复出现过的。\n在这项任务中，与没有睡眠问题的人相比，失眠症患者大脑中涉及工作记忆的区域活跃度较低。随着任务难度的加大，睡眠正常者大脑中另一处涉及工作记忆的区域——背外侧前额叶皮层也开始活跃起来，但失眠症患者大脑中的这一区域未显示出变化。随着任务难度的再次加大，睡眠正常者会将大脑中涉及“缺省模式”的区域关闭。这些区域在人走神时处于活跃状态。但失眠症患者没有关闭这些区域。\n根据以上结果，失眠症患者感觉自己要比睡眠正常的人工作更辛苦并不令人感到惊讶。这些数据帮助我们认识到，失眠症患者不仅在晚上会失眠，他们的大脑在白天也无法有效运转。",qs:[{n:33,q:"失眠症患者的主观感受是：",o:["感到不安","常有失意感","面部表情僵硬","情绪脱离正常轨道"],a:3,why:"“情绪起伏不定” ≈ cảm xúc lệch khỏi quỹ đạo bình thường. Có <span class='zh'>轨道</span>."},{n:34,q:"关于研究项目的设计，下列哪项正确？",o:["项目不涉及短时记忆","参与者要牢记自己的任务","参与者要听到指令后再动手","研究者会观察参与者大脑的变化"],a:3,why:"“使用功能性磁共振成像技术扫描他们的大脑”."},{n:35,q:"根据研究及研究结论可以知道，失眠症患者：",o:["大脑处于麻木状态","大脑不能有效工作","可以承担难度大的工作","即使完成简单任务也很吃力"],a:1,why:"“他们的大脑在白天也无法有效运转”."},{n:36,q:"倒数第2段画线词语“走神”的意思最可能是：",o:["神思敏捷","意识模糊","注意力分散","心中七上八下"],a:2,why:"<span class='zh'>走神</span> = lơ đãng, mất tập trung."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"睡眠障碍是很多现代人面临的问题，课文从中国发布的睡眠指数引入，谈了影响成人健康睡眠的因素、睡眠障碍的表现、睡眠不足对人体的影响以及对付失眠症的方法。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Mở","Chỉ số giấc ngủ: <span class='zh'>66.5分 · 一线城市最低 · 可见……</span>."],["Nguyên nhân","<span class='zh'>该睡时不睡 · 电子产品普及 · 光污染 · 褪黑素 · 生物钟后移</span>."],["Melatonin","<span class='zh'>职能 · 分泌不正常 → 疾病、癌症</span>."],["Biểu hiện & tác hại","<span class='zh'>入睡困难 · 噩梦 · 气色 · 事故 · 记性 · 慢性疾病</span>; dùng liên kết <span class='zh'>此外 · 继而 · 进而</span>."],["Kết","<span class='zh'>总而言之</span> + cách đối phó: <span class='zh'>纠正不好的生活习惯</span>."]],outline:[["一","睡眠指数情况"],["二","影响睡眠的因素 · 褪黑素"],["三","睡眠障碍的表现"],["四","睡眠不足的影响"],["五","对付失眠症的方法"]],model:"你睡好了吗？\n对患有失眠症的人来说，睡觉是难得的奢侈。中国发布的睡眠指数总得分66.5分，一线城市平均只有60.3分，三线城市61.4分，而农村和小城镇都在70分以上。可见，失眠症正摧残着城市人群的健康。\n调查发现，该睡时不睡是影响睡眠的重要因素。手机和平板电脑普及以后，睡前上网的习惯越来越盛行。电子产品的光污染会影响褪黑素的正常分泌，使人体生物钟后移，结果就是晚上睡不着，早上睡不醒。褪黑素能增强免疫力、抗衰老、调剂睡眠，如果分泌不正常，各种疾病甚至癌症就会随之而来。\n除了睡不着，还有人睡不好。睡眠障碍表现为入睡困难，翻来覆去睡不着，白天老是犯困；此外，入睡后噩梦连连，还会蹬腿、挥拳头、大声叫喊。\n睡眠不足会使人气色不好，行为能力下降，容易在不适宜的场合引发事故。长期睡眠不足还会使人注意力下降、丢三落四、情绪起伏不定，继而记性越来越差，严重时思维混乱，进而诱发慢性疾病。\n总而言之，睡眠对健康举足轻重。很多人的失眠多多少少与不健康的生活方式有关，因此，对付失眠症的方法就是纠正不好的生活习惯，不要糟蹋自己的身体。",check:["Có tiêu đề","Có đủ 5 ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 2 từ liên kết: 此外 · 继而 · 进而 · 总而言之 · 可见","Dùng ít nhất 4 từ mới: 普及 · 盛行 · 分泌 · 气色 · 丢三落四 · 举足轻重 · 纠正","Khoảng 400 chữ"]},SUM:{words:["惯例","顽固","奢侈","指数","居民","当前","扰乱","摧残","普及","盛行","过瘾","分泌","职能","衰老","调剂","细胞","肿瘤","癌症","供不应求","枕头","折腾","容忍","蹬","拳头","不时","气色","轨道","酒精","不相上下","适宜","场合","逆行","茫然","丢三落四","起伏","发呆","记性","地步","混乱","恶化","慢性","总而言之","举足轻重","呼吁","无动于衷","竭尽全力","根源","对付","纠正","糟蹋","迫害","毁灭"],patterns:[["不时（地）+ V","不时大声叫喊"],["多多少少 + V","导致问题的根源多多少少与不健康的生活方式有关。"],["随着……而……","睡眠指数的得分随着城市层级的升高而下降。"],["与……不相上下","其行为能力与……的人不相上下。"],["篇章：连接","……，继而……，到了更严重的地步，……，进而……。总而言之，……"]],diff:["容忍: khoan dung với hành vi người khác (不能容忍他的错误行为) — 忍受: gắng chịu đau khổ, khó khăn, phạm vi rộng hơn (无法忍受炎热的天气)","丢三落四 (là, không phải luò) · 折腾 zhēteng · 记性 jìxing · 对付 duìfu"],sentences:["当前失眠症正扰乱着人们的情绪，摧残着城市人群的健康。","睡眠好坏对人体健康举足轻重，因此，医生呼吁，不要对失眠症状无动于衷。","对付失眠症的方法就是纠正不好的生活习惯，不要糟蹋自己的身体。"],hw:["Học thuộc 52 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Đặt 3 câu với 不时 và 3 câu với 多多少少.","Làm Sách bài tập bài 30.","Đọc trước bài 31."]}});
