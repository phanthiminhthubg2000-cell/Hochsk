<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 38 · 慧眼捕捉商机 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-38",num:38,book:"HSK 标准教程 6（下）",unit:{n:10,zh:"热点追踪",vn:"Theo dấu các chủ đề nóng hổi"},title:"慧眼捕捉商机",vn:"“Tuệ nhãn” nắm bắt thời cơ",chars:1519,source:"改编自《经商就这几道》，编著：王咏星",goals:["Đọc hiểu bài 1519 chữ về <b>bí quyết khởi nghiệp</b>: dựa vào quy luật thị trường; ba ví dụ — máy sửa pin điện thoại, kẹo cao su của công ty Giang Kỳ, xe in ảnh lưu động của anh em họ Chu.","Dùng được 53 từ mới, nhất là nhóm <b>kinh doanh – tài chính</b>: <span class='zh'>数额 · 博览会 · 扣 · 季度 · 本钱 · 通货膨胀 · 垄断 · 扩充 · 布局 · 拟定 · 策略 · 财务 · 资本 · 淡季 · 递增 · 周期</span> và nhóm <b>tính chất – thái độ</b>: <span class='zh'>屡次 · 永恒 · 遵循 · 孕育 · 耐用 · 平庸 · 兴旺 · 可口 · 物美价廉 · 踊跃 · 齐心协力 · 空想</span>.","Nắm <span class='zh'>屡次 · 依据</span> (danh từ / động từ / giới từ).","Phân biệt <span class='zh'>就近 — 附近</span>; làm quen <b>修辞 (10): 反复 — điệp</b>.","Viết 缩写 bài khóa ≈400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Phần mở + “独具慧眼” · 屡次 · 依据"],["Buổi 2","Nhóm 3 · Hai phần còn lại · 就近—附近 · 反复 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"起",name:"Bí quyết",paras:"Đoạn 1",zh:"依据市场规则捕捉商业机会",vn:"Khởi nghiệp không được mù quáng; dao cạo, mì ăn liền, cháo bát bảo đều thành công nhờ nhu cầu thị trường."},{tag:"承",name:"Tuệ nhãn tìm cơ hội",paras:"Đoạn 2–3",zh:"电池分析修复仪",vn:"Ông Vương mua máy sửa pin 40.000 tệ, không đến hai quý đã thu hồi vốn — cơ hội nằm ở chỗ người khác bỏ qua."},{tag:"转",name:"Từ khiếm khuyết đối thủ",paras:"Đoạn 4–6",zh:"劳特四个不足 → 江崎四种泡泡糖",vn:"Giang Kỳ tìm ra 4 điểm yếu của Lotte, tung 4 loại kẹo cao su chức năng cho người lớn."},{tag:"合",name:"Từ nhu cầu tiềm ẩn",paras:"Đoạn 7–10",zh:"流动彩印车 · 不能靠空想",vn:"Anh em họ Chu làm xe in ảnh lưu động ở điểm du lịch; khởi nghiệp không phải cờ bạc, phải dự báo nhu cầu tiềm ẩn."}],warm1:{q:"你认为创业有窍门吗？请参考下表说一说你的看法。",vn:"Theo bạn, tìm thời cơ kinh doanh bằng cách nào? Bấm 有 (đồng ý) / 无 (không).",items:[["📊","根据市场需求寻找商机","Dựa vào nhu cầu thị trường"],["🔍","研究竞争对手寻找商机","Nghiên cứu đối thủ cạnh tranh"],["💡","从市场潜在需求寻找 e 6–10."],[39,"肖像","xiàoxiàng","dt.","tiếu tượng","chân dung, ảnh",1,"","以某一个人为主体的画像或相片。","把喜欢的图案、肖像印在纪念品上","他画了一幅肖像。","Anh vẽ một bức chân dung.",[],"SBT câu 11A."],[40,"纺织","fǎngzhī","đgt.","phưởng chức","dệt",1,"","把棉、麻、丝、毛等纤维纺成纱或线，织成布匹、绸缎等。","纺织品","纺织工业。","Công nghiệp dệt.",[],""],[41,"留念","liúniàn","đgt.","lưu niệm","giữ làm lưu niệm",1,"","留作纪念（多用于临别馈赠）。","独一无二的旅游留念","合影留念。","Chụp ảnh lưu niệm.",[],""],[42,"对照","duìzhào","đgt.","đối chiếu","so sánh, đối chiếu",1,"","互相对比参照。","对照观光客的需求","形成了鲜明的对照。","Tạo nên sự tương phản rõ rệt.",[],"SBT câu 19A."],[43,"齐心协力","qíxīn-xiélì","thành ngữ","tề tâm hiệp lực","đồng tâm hiệp lực, đồng lòng góp sức",1,"成","思想认识一致，共同努力。","兄弟俩齐心协力","大家齐心协力完成了任务。","Mọi người đồng lòng hoàn thành nhiệm vụ.",[],"Bài tập 2⑤. SBT nghe câu 1."],[44,"专长","zhuāncháng","dt.","chuyên trường","sở trường",1,"","专门的学问技能；特长。","发挥各自的专长","他的专长是设计。","Sở trường của anh ấy là thiết kế.",[],"Bài tập 3②."],[45,"资本","zīběn","dt.","tư bản","tư bản, vốn",1,"","经营工商业的本钱。","以50万台币做资本","他没有创业的资本。","Anh ấy không có vốn khởi nghiệp.",[],"Bài tập 3①."],[46,"以往","yǐwǎng","dt.","dĩ vãng","ngày xưa, trước kia",1,"","从前；以前。","不像以往，要等上好几天","跟以往不同。","Khác với trước đây.",[],"Bài tập 2⑥. Bài 36: <span class='zh'>以往</span>."],[47,"淡季","dànjì","dt.","đạm quý","mùa ế hàng, mùa ít khách, trái mùa",1,"","营业不旺盛的季节。","旅游淡季","现在是旅游淡季。","Bây giờ là mùa thấp điểm du lịch.",[],"Bài tập 3②. SBT nghe 6–10."],[48,"制服","zhìfú","dt.","chế phục","đồ đồng phục",1,"","军人、机关工作人员、学生等穿的有规定式样的服装。","学生的制服","学生们穿着制服。","Học sinh mặc đồng phục.",[],"SBT câu 19D."],[49,"规格","guīgé","dt.","quy cách","quy cách, tiêu chuẩn",1,"","产品质量的标准；泛指规定的要求或条件。","不同规格的运动服","这批产品不合规格。","Lô hàng này không đạt quy cách.",[],""],[50,"递增","dìzēng","đgt.","đệ tăng","tăng dần",1,"","一次比一次增加。","收益也呈递增趋势","产量逐年递增。","Sản lượng tăng dần theo năm.",[],"SBT câu 29–32: <span class='zh'>逐日递增</span>."],[51,"周期","zhōuqī","dt.","chu kỳ","chu kỳ",1,"","事物在运动、变化过程中，某些特征多次重复出现，其连续两次出现所经过的时间。","很短的周期就收回了成本","经济周期。","Chu kỳ kinh tế.",[],""],[52,"赌博","dǔbó","đgt.","đổ bác","đánh bạc, cờ bạc",1,"","用斗牌、掷色子等形式，拿财物作注比输赢。","创业不是赌博","赌博是违法的。","Đánh bạc là phạm pháp.",[],""],[53,"空想","kōngxiǎng","đgt.","không tưởng","nghĩ vẩn vơ, suy nghĩ viển vông",1,"","凭空设想；不切实际的想法。","创业不能靠空想","不要空想，要行动。","Đừng mơ mộng, hãy hành động.",[],"Bài tập 3①."]],extra:[["慧眼","huìyǎn","tuệ nhãn, con mắt tinh tường"],["商机","shāngjī","cơ hội kinh doanh"],["剃须刀 · 刮胡刀","tìxūdāo · guāhúdāo","dao cạo râu"],["方便面","fāngbiànmiàn","mì ăn liền"],["八宝粥","bābǎozhōu","cháo bát bảo"],["绝缘层","juéyuáncéng","lớp cách điện"],["泡泡糖","pàopaotáng","kẹo cao su thổi bóng"],["冲印","chōngyìn","rửa in ảnh"],["摄影发烧友","shèyǐng fāshāoyǒu","người mê nhiếp ảnh"],["支柱产业","zhīzhù chǎnyè","ngành trụ cột"],["超前意识","chāoqián yìshi","tư duy đi trước"]],T:[{zh:"屡次创业，却屡次惨遭失败的人总想知道，创业有窍门吗？当然有，窍门就是创业不可盲目，要依据市场规则捕捉商业机会。1903年吉列先生发明的可替换刮胡刀、1958年安藤百福发明的方便面、1992年戚石川兄弟发明的罐装八宝粥，都受到了市场热捧，并给创业者带来了数额可观的财富，成功的案例告诉我们：创业必须依据市场需求，这是一条永恒的真理，只要遵循这条规则，就没有不成功的道理。",vn:"Những người nhiều lần khởi nghiệp mà lần nào cũng thất bại thảm hại luôn muốn biết: khởi nghiệp có mẹo không? Đương nhiên có — mẹo là khởi nghiệp không được mù quáng, phải dựa vào quy luật thị trường để nắm bắt cơ hội kinh doanh. Dao cạo thay lưỡi do ông Gillette phát minh năm 1903, mì ăn liền do Momofuku Ando phát minh năm 1958, cháo bát bảo đóng lon do anh em họ Thích phát minh năm 1992 đều được thị trường săn đón, đem lại cho người khởi nghiệp khối tài sản đáng kể. Các ví dụ thành công cho ta biết: khởi nghiệp phải dựa vào nhu cầu thị trường — đó là chân lý vĩnh hằng; chỉ cần tuân theo quy luật này, không có lý gì không thành công.",idea:"Bí quyết khởi nghiệp.",q:["创业有什么窍门？请举例说明。"],note:[["屡次……，却屡次……","Xem Ngữ pháp 1."],["创业有窍门吗？当然有……","设问 (bài 29)."],["只要……，就没有不……的道理","Phủ định kép."]]},{zh:"市场需求无处不在，却往往易被忽视，别人没发现，或是不屑做的生意，往往孕育着机会。譬如，在新产品博览会上，王先生看到了一台叫作“电池分析修复仪”的小机器，它是用来修复手机电池的。手机电池的正常寿命是5至6年，事实上大家的电池却没有那么耐用，往往用一年就坏了，换新电池又很贵。而所谓坏了，只是化学物质沉淀到了绝缘层，美国人发现在一定条件下，能够将其还原成初始状态，于是发明了这种机器。王先生花4万元买下了这台能够像变魔术一样修好电池的机器。之后，在商场租了柜台，修一块电池收费50～70元，扣掉场地租金和税金，月收入上万，不到两个季度就轻松收回了本钱。类似这样的生意，即使碰上通货膨胀，也不会对他产生丝毫影响。可是，如果你没有眼光，就看不到商机；如果你思维平庸，就发现不了商机；只要你勤劳，市场就捏在你的手里。",vn:"Nhu cầu thị trường có ở khắp nơi nhưng thường dễ bị bỏ qua; những việc làm ăn người khác chưa phát hiện hoặc chẳng thèm làm thường ẩn chứa cơ hội. Ví dụ, tại hội chợ sản phẩm mới, ông Vương thấy một chiếc máy nhỏ gọi là “máy phân tích, phục hồi pin”, dùng để sửa pin điện thoại. Tuổi thọ bình thường của pin là 5–6 năm, nhưng thực tế pin của mọi người không bền như vậy, thường dùng một năm là hỏng, thay pin mới lại đắt. Mà cái gọi là hỏng chỉ là chất hóa học lắng đọng lên lớp cách điện; người Mỹ phát hiện trong điều kiện nhất định có thể khôi phục nó về trạng thái ban đầu, bèn phát minh ra loại máy này. Ông Vương bỏ 40.000 tệ mua chiếc máy sửa pin như làm ảo thuật. Sau đó thuê quầy trong trung tâm thương mại, sửa một cục pin thu 50–70 tệ, trừ tiền thuê mặt bằng và thuế, thu nhập hơn chục nghìn mỗi tháng, chưa đến hai quý đã dễ dàng thu hồi vốn. Việc làm ăn kiểu này, dù gặp lạm phát cũng chẳng ảnh hưởng gì. Thế nhưng, nếu bạn không có con mắt, sẽ không thấy được cơ hội; nếu tư duy tầm thường, sẽ không phát hiện được cơ hội; chỉ cần bạn chăm chỉ, thị trường sẽ nằm trong tay bạn.",idea:"独具慧眼，寻找机遇 — Máy sửa pin.",q:["王先生是怎样独具慧眼，寻找商机的？"],note:[["譬如","Ví dụ (văn viết)."],["而所谓……，只是……","Cái gọi là… chỉ là…"],["如果……，就……；如果……，就……；只要……，就……","排比 kết đoạn."]]},{zh:"研究竞争对手，从中找出其产品的弱点及营销的薄弱环节，是捕捉商机的有效方法之一。",vn:"Nghiên cứu đối thủ cạnh tranh, từ đó tìm ra điểm yếu của sản phẩm và khâu yếu trong tiếp thị của họ là một trong những cách hiệu quả để nắm bắt cơ hội.",idea:"从竞争对手的产品缺陷中捕捉商机",q:[],note:[["……之一","Một trong những…"]]},{zh:"当年，日渐兴旺的日本泡泡糖市场大部分被劳特垄断，江崎公司想扩充这方面的业务，于是专门成立了团队，研究劳特的产品，以寻找市场缝隙。研究结果发现劳特产品有四个不足：一，成年人的泡泡糖市场正在扩大，劳特的眼光仍停留在儿童身上；二，劳特的产品口味单一，而消费者的需求正在日益多样化；三，劳特泡泡糖外观老旧，缺乏新式样；四，劳特产品售价110日元，买时得掏10日元硬币，不方便购买者。于是江崎公司大胆布局，以成年人的消费需求为依据设计产品，又拟定了相应的市场营销策略，不久，推出四种功能型泡泡糖：",vn:"Năm ấy, thị trường kẹo cao su Nhật Bản ngày càng phát đạt phần lớn bị Lotte độc quyền. Công ty Giang Kỳ muốn mở rộng mảng kinh doanh này, bèn lập đội chuyên nghiên cứu sản phẩm của Lotte để tìm khe hở thị trường. Kết quả phát hiện sản phẩm Lotte có bốn điểm yếu: một, thị trường kẹo cao su cho người lớn đang mở rộng, Lotte vẫn chỉ nhắm vào trẻ em; hai, sản phẩm Lotte vị đơn điệu, trong khi nhu cầu người tiêu dùng ngày càng đa dạng; ba, kẹo Lotte bề ngoài cũ kỹ, thiếu mẫu mới; bốn, giá 110 yên, lúc mua phải móc đồng xu 10 yên, bất tiện cho người mua. Thế là Giang Kỳ mạnh dạn bố cục, lấy nhu cầu người lớn làm căn cứ thiết kế sản phẩm, lại vạch chiến lược tiếp thị tương ứng; chẳng bao lâu tung ra bốn loại kẹo cao su chức năng:",idea:"Bốn điểm yếu của Lotte.",q:["劳特产品有哪些不足？"],note:[["一，……；二，……；三，……；四，……","Liệt kê."],["以……为依据","Xem Ngữ pháp 2: <span class='zh'>依据</span> (danh từ)."]]},{zh:"1.司机用泡泡糖，以强烈的刺激消除司机的困倦。\n2.交际用泡泡糖，咀嚼后，可清洁口腔，消除口腔异味。\n3.体育用泡泡糖，内含多种维生素，有利于消除疲劳。\n4.轻松型泡泡糖，通过添加叶绿素，改变人的不良情绪。",vn:"1. Kẹo cho tài xế: dùng kích thích mạnh xua cơn buồn ngủ.\n2. Kẹo giao tiếp: nhai xong làm sạch khoang miệng, khử mùi.\n3. Kẹo thể thao: chứa nhiều vitamin, giúp hết mệt mỏi.\n4. Kẹo thư giãn: thêm diệp lục, cải thiện tâm trạng xấu.",idea:"Bốn loại kẹo chức năng.",q:[],note:[]},{zh:"在产品可口的同时，精心设计包装和造型，定价分50和100日元两种。江崎的产品物美价廉，风味独特。不靠广告吹捧，品尝后，消费者购买踊跃，市场需求呈井喷式爆发，财务收入也呈井喷式增长。这就是市场，只要你细心研究市场，细心研究消费者的需求，细心研究市场产品的优劣，对产品的不足做些局部改进，就有可能得到消费者的认可；你愈是为消费者考虑得周全，消费者愈是会慷慨地关照你。",vn:"Sản phẩm ngon miệng, đồng thời thiết kế bao bì và hình dáng công phu, định giá hai mức 50 và 100 yên. Sản phẩm Giang Kỳ ngon bổ rẻ, hương vị độc đáo. Không cần quảng cáo tâng bốc, người tiêu dùng nếm thử là đua nhau mua, nhu cầu thị trường bùng nổ như phun giếng dầu, doanh thu cũng tăng vọt. Đó chính là thị trường: chỉ cần bạn chăm chút nghiên cứu thị trường, nghiên cứu nhu cầu người tiêu dùng, nghiên cứu ưu nhược của sản phẩm trên thị trường, cải tiến từng phần chỗ chưa tốt, là có thể được người tiêu dùng chấp nhận; bạn càng nghĩ chu đáo cho khách hàng, khách hàng càng hào phóng ủng hộ bạn.",idea:"Thành công của Giang Kỳ.",q:["江崎公司怎样从竞争对手的产品缺陷中捕捉商机？"],note:[["细心研究……，细心研究……，细心研究……","Xem 修辞: 反复."],["愈是……，愈是……","Bài 35: càng… càng…"]]},{zh:"在台湾某游览观光区，一台流动彩印车吸引了大家的目光，游客可以在这儿就近冲印照片，可以把喜欢的图案、肖像印在纪念品和纺织品上，作为独一无二的旅游留念。",vn:"Ở một khu du lịch tham quan tại Đài Loan, một chiếc xe in màu lưu động thu hút ánh mắt mọi người: du khách có thể rửa ảnh ngay tại chỗ, có thể in hình ảnh, chân dung yêu thích lên đồ lưu niệm và hàng dệt, làm kỷ niệm du lịch độc nhất vô nhị.",idea:"从市场的潜在需求中寻找商机",q:[],note:[["就近","Xem 辨析 就近—附近."]]},{zh:"流动彩印车的发明者是周家两兄弟，哥哥是汽车维修工，弟弟是摄影发烧友。台湾经济转型，旅游业成了台湾经济的支柱产业。兄弟俩发现，对照观光客的需求，传统彩色冲印做法太过陈旧，哪个游客能为冲洗照片等好几天？于是兄弟俩齐心协力，发挥各自的专长，以50万台币做资本，发明了这辆相当于一个小型专业冲印部的流动彩印车。",vn:"Người phát minh xe in màu lưu động là hai anh em họ Chu: anh là thợ sửa ô tô, em là người mê nhiếp ảnh. Kinh tế Đài Loan chuyển đổi, du lịch thành ngành trụ cột. Hai anh em nhận thấy, đối chiếu với nhu cầu du khách, cách rửa ảnh màu truyền thống quá lỗi thời — du khách nào chịu đợi mấy ngày để rửa ảnh? Thế là hai anh em đồng lòng, phát huy sở trường mỗi người, lấy 500.000 Đài tệ làm vốn, phát minh chiếc xe in màu lưu động tương đương một tiệm rửa ảnh chuyên nghiệp nhỏ.",idea:"Anh em họ Chu.",q:["流动彩印车是怎么发明的？"],note:[["哪个游客能……？","Câu phản vấn."],["以……做资本","Lấy… làm vốn."]]},{zh:"流动彩印车一出现就大受欢迎，每逢周末、节假日以及人多的场合简直就忙不过来，它最大的优势就是方便快捷，不像以往，要等上好几天。旅游淡季，彩印车还可以为学生的制服、不同规格的运动服印制高品质的图案。彩印车很快就有了知名度，收益也呈递增趋势，很短的周期就收回了成本。",vn:"Xe in màu lưu động vừa xuất hiện đã rất được hoan nghênh; mỗi dịp cuối tuần, ngày lễ và nơi đông người thì bận không xuể; ưu thế lớn nhất là tiện lợi nhanh chóng, không như trước kia phải đợi mấy ngày. Mùa thấp điểm du lịch, xe còn in hình chất lượng cao lên đồng phục học sinh, quần áo thể thao các quy cách. Chiếc xe nhanh chóng có tiếng, doanh thu tăng dần, thu hồi vốn trong chu kỳ rất ngắn.",idea:"Thành công của xe in ảnh.",q:["流动彩印车为什么大受欢迎？"],note:[["一……就……","Vừa… đã…"],["不像以往","Không như trước."]]},{zh:"可见，创业不是赌博，创业不能靠空想，能够准确预测市场的潜在需求，具有超前意识，是经营者必备的素质。",vn:"Có thể thấy, khởi nghiệp không phải đánh bạc, không thể dựa vào ảo tưởng; có thể dự báo chính xác nhu cầu tiềm ẩn của thị trường, có tư duy đi trước — đó là tố chất người kinh doanh phải có.",idea:"Kết luận.",q:[],note:[["可见","Có thể thấy (tổng kết)."],["创业不是……，创业不能……","Lặp “创业” (反复)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"屡次",zh:"屡次",py:"lǚcì",tag:"Chú thích 1 · phó từ",mean:"Phó từ, biểu thị động tác, hành vi <b>lặp lại nhiều lần</b> — “nhiều lần, hết lần này đến lần khác”.",forms:["屡次 + V","屡次……，却屡次……"],ex:[["屡次创业，却屡次惨遭失败的人总想知道，创业有窍门吗？","",1],["这些年，这里的水果种植业发展很快，无论是产量，还是品质都屡次在全国评比中名列前茅。","Mấy năm nay ngành trồng cây ăn quả ở đây phát triển nhanh, cả sản lượng lẫn chất lượng nhiều lần đứng đầu cả nước."],["有关部门屡次推出这样那样的制度或法规，目的是杜绝虚假广告的出现。","Các ngành liên quan nhiều lần ban hành chế độ, quy định để ngăn chặn quảng cáo sai sự thật."]],tips:["Gần <span class='zh'>多次 · 一再 · 再三</span>.","Bài tập 2①."],practice:{q:"用“屡次”完成句子",type:"complete",items:[["关于亲情的主题，在他的日记中________。","……在他的日记中屡次出现。"],["从开始这个课题至今，他________，却一点儿也没有灰心。","……他屡次失败，却一点儿也没有灰心。"],["妈妈________我，改掉马虎的毛病，可我就是改不了。","妈妈屡次提醒我，……"]]}},{id:"g2",grp:1,word:"依据",zh:"依据",py:"yījù",tag:"Chú thích 2 · danh / động / giới",mean:"<span class='zh'>依据</span> có thể là <b>danh từ, động từ và giới từ</b>.<br>① <b>Danh từ</b>: sự vật làm tiền đề kết luận hoặc cơ sở lời nói, việc làm — “căn cứ”.<br>② <b>Động từ</b>: dựa vào một sự vật nào đó.<br>③ <b>Giới từ</b>: lấy một sự vật làm tiền đề / cơ sở — “căn cứ vào”.",forms:["有……依据；以……为依据","S + 依据 + O","依据 + N，S + V"],ex:[["你们这样做有法律依据吗？","Các anh làm thế có căn cứ pháp luật không?"],["江崎公司大胆布局，以成年人的消费需求为依据设计产品……","",1],["创业必须依据市场需求，这是一条永恒的真理。","",1],["窍门就是创业不可盲目，要依据市场规则捕捉商业机会。","",1],["依据专家的鉴定，这的确是汉代陶器真品。","Căn cứ vào giám định chuyên gia, đây đúng là gốm đời Hán thật."]],tips:["Bài tập 2②."],practice:{q:"给“依据”选择适当的位置",type:"pos",items:[["我们要A不同的B场合，C不同的交际对象，变换我们D的交际方式。","A","我们要依据不同的场合，……"],["……为B后来的水利工程建设，提供了确切可靠的科学C，其D科学价值和应用价值不可估量。","C","……提供了确切可靠的科学依据 (danh từ)。"],["……而且有些B汉字的字义也可以C字形推知一二，词义也可以从其所组成的字的意义D来推断。","C","……可以依据字形推知一二 (giới từ)。"]]}},{id:"g3",grp:1,word:"物美价廉",zh:"Thành ngữ & cụm từ",py:"",tag:"Từ vựng",mean:"<span class='zh'>物美价廉</span> = ngon bổ rẻ. <span class='zh'>齐心协力</span> = đồng lòng hiệp sức. <span class='zh'>独具慧眼</span> = có con mắt tinh tường. <span class='zh'>独一无二</span> = độc nhất vô nhị. <span class='zh'>井喷式</span> = bùng nổ. <span class='zh'>通货膨胀</span> = lạm phát.",forms:["……物美价廉","……齐心协力，发挥各自的专长","呈井喷式 + 爆发 / 增长"],ex:[["江崎的产品物美价廉，风味独特。","",1],["于是兄弟俩齐心协力，发挥各自的专长……","",1],["市场需求呈井喷式爆发，财务收入也呈井喷式增长。","",1]],tips:["Bài tập 2④⑤."]},{id:"g4",grp:2,word:"就近",zh:"就近 / 附近",py:"jiùjìn / fùjìn",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>gần một nơi nào đó</b>”. <span class='zh'>就近</span>: <b>phó từ</b>, đứng trước động từ, “ở gần, không đi xa”; không làm chủ ngữ, tân ngữ của giới từ, không bổ nghĩa danh từ. <span class='zh'>附近</span>: <b>danh từ</b> (làm chủ ngữ, tân ngữ) và <b>tính từ</b> (bổ nghĩa danh từ).",forms:["就近 + V（买 / 找 / 冲印）","在附近；附近 + 有……；附近的 + N"],ex:[["游客可以在这儿就近冲印照片。","",1]],tips:["<span class='zh'>×就近的居民</span> → <span class='zh'>附近的居民</span>."]}],BX:{grp:2,word:"就近",cols:["就近","附近"],pair:"就近 — 附近",same:["Đều có nghĩa “<b>gần một nơi nào đó</b>”.","蔬菜、肉类等副食品就近 / 附近都能买到。"],diff:[["<b>Phó từ</b>, ở gần, không đi xa. Đứng trước cụm động từ, miêu tả động tác, hành vi. Không làm chủ ngữ hay tân ngữ của giới từ.","我这车快没油了，咱们就近找个加油站加油吧。","<b>Danh từ</b>, nơi ở gần. Làm chủ ngữ hoặc tân ngữ giới từ, miêu tả tình trạng.<div class='zh' style='margin-top:4px'>他家就在附近，几分钟就到了。附近有很多家超市。</div>"],["Không bổ nghĩa danh từ.","—","<b>Tính từ</b>, gần nơi nào đó; bổ nghĩa danh từ.<div class='zh' style='margin-top:4px'>有饭馆在路边乱倒垃圾，附近的居民对此表示不满。</div>"]],task:{q:"选择“就近”或“附近”填空",cols:["就近","附近"],sample:!1,items:[["车在半路突然出现故障，幸好修理厂就在____，及时排除了故障。",1,"Tân ngữ của 在 → 附近."],["天气寒冷，大超市离得又远，她____在路边买了点儿菜回来。",0,"Trước động từ → 就近."],["我习惯了每天去小区____的公园散步，一天不去就浑身不舒服。",1,"Bổ nghĩa danh từ → 附近的."],["为了方便接送，他们____给孩子找了一所私立学校。",0,"Trước động từ → 就近."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["依<u>据</u>","根据 · 据说 · 论据 · 证据"],items:[["<u>数</u>额","数","数学 · 数目 · 数量 · 数日"],["<u>遵</u>循","遵","遵守 · 遵命 · 遵照 · 遵行"],["孕<u>育</u>","育","养育 · 培育 · 体育 · 抚育"],["<u>扩</u>充","扩","扩大 · 扩展 · 扩建 · 扩散"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["虽然每次尝试都失败了，他却从来没想过放弃。","屡次","虽然屡次尝试失败，他却从来没想过放弃。"],["这些问题各不相同，我们要按照不同情况分别处理。","依据","这些问题各不相同，我们要依据不同情况分别处理。"],["公司规模越来越大，发展前景值得期待。","扩充","公司规模扩充，发展前景值得期待。"],["由于商品质量好、价格低，这家店吸引了很多顾客。","物美价廉","由于商品物美价廉，这家店吸引了很多顾客。"],["希望大家共同努力，圆满完成这项艰巨的任务。","齐心协力","希望大家齐心协力，圆满完成这项艰巨的任务。"],["跟以前不同的是，这学期我们修改了课程内容。","以往","跟以往不同的是，这学期我们修改了课程内容。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["数额","空想","永恒","资本","依据"],text:"对创业者来说，创业不能靠{空想}，要{依据}市场需求。不管你最初有多少{资本}，只要勤奋努力，善于发现商机，不但能快速收回本钱，还能获得{数额}可观的财富。这是一条{永恒}的真理。"},{bank:["专长","财务","通货膨胀","季度","策略"],text:"上个{季度}，一方面由于进入销售淡季，一方面受{通货膨胀}的影响，公司{财务}收入出现大幅度下滑。我们及时调整营销{策略}，发挥公司的{专长}，终于赢得了客户的认可，这个月销售业绩开始回升。"}]},EX4:{q:"请划出下列语段中使用反复修辞方法的句子或短语",items:[{src:"",task:"雪降落下来了，像柳絮一般的雪，像芦花一般的雪，像蒲公英的带绒毛的种子在风中飞，雪降落下来了。",model:"“雪降落下来了”（首尾反复）；“像……一般的雪”。"},{src:"",task:"沉默啊！沉默啊！不在沉默中爆发，就在沉默中灭亡。",model:"“沉默啊！沉默啊！”（连续反复）"},{src:"",task:"南国的红豆啊，红得活泼，像泉水的叮咚，让人清爽。南国的红豆啊，红得艳丽，像朝阳的初生，让人神往。",model:"“南国的红豆啊”（间隔反复）"},{src:"",task:"风雪一天比一天大，人们的干劲一天比一天猛，砍下的毛竹一天比一天堆得高，架在两座高山之间的毛竹，也一天比一天往上长。",model:"“一天比一天”（间隔反复）"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["创业有什么窍门？请举例说明。","① 不可盲目，依据市场规则 ② 刮胡子刀，方便面，罐装八宝粥","创业的窍门是不可盲目，要依据市场规则捕捉商机。可替换刮胡刀、方便面、罐装八宝粥都受到了市场热捧。"],["王先生是怎样独具慧眼，寻找商机的？","① 手机电池正常寿命……，往往用一年……，换新电池……，美国人发明了…… ② 王先生买下……，租柜台……，月收入……，轻松收回…… ③ 如果你没有眼光，……，如果你思维平庸，……","手机电池往往用一年就坏了，换新的又很贵，美国人发明了电池修复仪。王先生花4万元买下这台机器，租柜台修电池，月收入上万，不到两个季度就收回了本钱。"],["江崎公司怎样从竞争对手的产品缺陷中捕捉商机？","① 劳特产品的不足：眼光仍停留在儿童身上，口味单一，外观老旧，售价不方便购买者 ② 江崎公司：推出四种功能型泡泡糖，精心设计包装和造型，定价方便购买者，消费者购买……，财务收入…… ③ 只要你细心研究……，就会得到……","江崎公司发现劳特产品只面向儿童、口味单一、外观老旧、售价不方便。于是推出四种功能型泡泡糖，精心设计包装，定价50和100日元，消费者购买踊跃，财务收入大增。"],["周家兄弟怎样从市场的潜在需求中寻找商机的？","① 功能：冲印照片，把……印在纺织品上 ② 由来：哥哥是……，弟弟是……；他们发现……；发挥各自专长，发明…… ③ 大受欢迎：方便快捷；旅游淡季，还可以……；有了知名度，收益……","周家兄弟发现游客不愿等好几天冲洗照片，于是发挥各自专长，发明了流动彩印车，游客可以就近冲印照片，把图案印在纺织品上。彩印车方便快捷，淡季还能印制服，很快就收回了成本。"]]},PZ:{title:"修辞（10）反复",vn:"Điệp",intro:"Để <b>làm nổi bật một ý, nhấn mạnh một tình cảm</b>, cố ý lặp lại một từ ngữ hoặc câu nào đó — gọi là <b>反复</b>. Có <b>lặp liên tiếp</b> (沉默啊！沉默啊！) và <b>lặp cách quãng</b> (她含着笑……她含着笑……).",ex:[["这就是市场，只要你细心研究市场，细心研究消费者的需求，细心研究市场产品的优劣……","Lặp “细心研究” ba lần."],["大山原来是这样的！月亮原来是这样的！核桃树原来是这样的！","Lặp “原来是这样的”."],["……她含着笑，洗着我们的衣服，她含着笑，提着菜篮……她含着笑，切着冰屑悉索的萝卜……","《大堰河——我的保姆》 (Ngải Thanh): lặp “她含着笑”."]],q:"下列哪句没有使用反复修辞手法",pvn:"(1) 如果我拥有一片绿洲，我就用我的汗水去开垦它；如果我拥有一片绿洲，我就用我的诚心去改造它；如果我拥有一片绿洲，我就用我的智慧去播种它。　(2) 终于自由啦！终于自由啦！感谢全能的上帝，我们终于自由啦！　(3) 车到山前必有路，有路必有丰田车。",practice:[["Câu nào KHÔNG dùng 反复？","(3) — đây là 顶真 (chữ cuối vế trước làm chữ đầu vế sau: “路”), không phải 反复."]]},DP:[{title:"词汇（1）：医学方面的词语",vn:"Từ ngữ y học — điền từ.",items:[["化验","huàyàn","xét nghiệm","化验大便","经过化验大便，医生终于找到了他腹泻的原因。"],["按摩","ànmó","xoa bóp, mát-xa","大夫给他按摩","最近他常常腰疼，大夫给他按摩以后，他感觉舒服多了。"],["隔离","gélí","cách ly","把病人隔离开来","由于这种疾病传染性很强，所以需要把病人隔离开来。"],["残疾","cánjí","tàn tật","残疾人","全社会都要关爱残疾人，在各方面多给他们提供方便。"],["解剖","jiěpōu","giải phẫu","进行解剖","那头大象死后，工作人员对它进行了解剖，发现它的胃里有很多塑料制品。"],["脉搏","màibó","mạch","脉搏很快","你刚刚剧烈运动过，脉搏很快，所以休息一会再来测量吧。"],["麻醉","mázuì","gây mê","手术前麻醉","在大的手术前都需要麻醉，这不但可以减轻病人的痛苦，也方便大夫手术。"],["瘫痪","tānhuàn","bại liệt","瘫痪在床","在车祸中，他腰部受到重伤，两腿失去知觉，从此瘫痪在床了。"]]},{title:"词汇（2）：金融方面的词语",vn:"Đọc đoạn: 在投资<b>债券</b>、<b>基金</b>等金融产品时，要注意<b>统筹兼顾</b>，分散风险。有的投资者追求高利润，总想在利润最高点卖出，这容易导致错过最佳<b>成交</b>时机，增加损失。有的投资者只关注年终<b>分红</b>……",items:[["债券","zhàiquàn","trái phiếu","投资债券","在投资债券、基金等金融产品时，要注意分散风险。"],["基金","jījīn","quỹ đầu tư","购买基金","他每个月都买一点儿基金。"],["统筹兼顾","tǒngchóu-jiāngù","tính toán toàn diện","要统筹兼顾","投资时要注意统筹兼顾。"],["成交","chéngjiāo","giao dịch thành công","成交时机","这容易导致错过最佳成交时机。"],["分红","fēnhóng","chia cổ tức","年终分红","有的投资者只关注年终分红。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"企业虽是老板一手创立的，但并不意味着老板就永远正确。很多老板在企业做到一定规模后，自信心膨胀，独断专行，功劳都归自己，失败都是下属的。久而久之，缺少了员工们的齐心协力，企业就会逐渐衰败。",o:["老板的创业历程很艰辛","要有自信企业才能成功","老板应该掌握企业的一切","成功后也要听取不同声音"],a:3,why:"Phê phán “独断专行” → nên lắng nghe ý kiến khác. Có <span class='zh'>齐心协力</span>."},{n:2,say:"一般的主管是这样训练员工的：先告诉他们一些“成功之道”，再告诉他们，按照“成功之道”一一实践后，自然就可以成功了！这个主管和别人不一样，他先让员工相信自己可以成功。当这个信念已经深深烙在员工心里之后，他们就会开始认真讨论：现在该怎么成功？",o:["这个主管教育员工空想没有用","这个主管先告诉员工“成功之道”","这个主管先让员工相信自己能成功","这个主管认为怎样成功不是大问题"],a:2,why:"“他先让员工相信自己可以成功”."},{n:3,say:"很多企业老板热衷“短平快”，看到什么赚钱就干什么，一哄而上，缺乏企业长远战略布局。很少有人真正致力于企业创新，无论是研发、管理还是商业模式。这对企业的长期可持续发展是极为不利的。",o:["企业发展并没有什么规律","“短平快”有利于企业发展","缺乏长远布局对企业发展不利","很多老板热衷于商业模式创新"],a:2,why:"“缺乏企业长远战略布局……极为不利”. Có <span class='zh'>布局</span>."},{n:4,say:"其实，一般员工对管理者的要求并不高，你只要做到了公平公正地对待每一位员工，准确、客观地评价员工的工作表现，他就很愿意服从你的管理。“一碗水端平”是老百姓常念叨的一句俗话，而这也正是管理者应该常念的管理要诀。",o:["管理者要尽量满足员工的要求","管理者要公平地对待每位员工","管理者要让员工绝对服从自己","管理者要让员工提出自己的看法"],a:1,why:"“一碗水端平” = đối xử công bằng."},{n:5,say:"网购时我的省钱妙招是保持理性，在网上选中商品后不直接掏钱购买，先在购物车里放一两周，也许过了新鲜劲儿就不会花钱买了。对于已经签单的快递，如果不合适或者用不着，就算花运费也要退掉，这样能够管理自己的过度消费行为，久而久之就养成了理性消费的习惯。",o:["网购时要注意物品是否新鲜","网购时要选择物美价廉的商品","网购时要养成理性消费的习惯","网购时每次消费金额都不要太大"],a:2,why:"“养成了理性消费的习惯”. Có <span class='zh'>掏 · 物美价廉</span> làm bẫy."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：经营食堂应该是最简单的小生意，假设你是食堂的小老板，怎样才能有效防范食堂采购环节的贪污问题？这可是一道考验管理者的综合题。今天我们请来一位食堂的管理者跟大家谈谈怎么处理食堂采购的管理难题。\n男：大家好，食堂采购管理确实是个难题，因为任何商品的标准都不如粮食青菜油盐酱醋复杂，不信你试试看，你能管好一个食堂吗?\n女：如果老板自己或让老板的亲信去买是不是能可靠一些呢？\n男：这样一来你不就成了个体户了吗？你的食堂还能做大吗？如果再有第二个、第三个食堂你怎么管？\n女：那我就派两个人去买，一个买，一个监督。\n男：管过企业的都知道，在现金交易，无发票，并且质量和价钱每天随着淡季、旺季变化的菜市场中，采购者抵御诱惑的能力很差，靠人监督人是不可靠的，两个人很快就能结成同盟。\n女：那我就采取轮班制，每次去买的两个人都不同。\n男：一看你就不懂食堂生意。千万别小看油盐酱醋青菜土豆这些人人都知道的东西，它们的采购可是很专业的活儿，不信你问你妈妈。一个不懂菜市行情的人往往会被小贩欺骗。\n女：那就采购的人固定，监督的人轮换。\n男：可是一个不懂行的人怎么可能有效监督一个天天采购的人？\n女：看似简单的食堂生意，管理竟然如此复杂！那到底怎么办好呢？\n男：我是这样做的，依据所购物品来拟定购买方案。需要每天买的青菜副食由大师傅负责，不需要天天买的粮油酱味招标采购，清洁用品等杂项由食堂经理买，炉灶器具锅碗瓢盆等固定资产由我亲自负责。\n女：那不怕大师傅贪污吗？\n男：不怕。这个食堂每人每天只有7元钱的伙食定额，扣掉主食和其他费用，每人每天副食只有4元钱。大师傅要用4元钱，买回能做出可口饭菜的材料已很不容易了，哪里还有贪污的余地？另外，我自己偶尔也就近逛菜市场，对市价比较清楚。",qs:[{n:6,q:"本文主要讲了食堂管理哪个环节的问题？",o:["采购","监督","财务","烹饪"],a:0,why:"“食堂采购环节的贪污问题”. Có <span class='zh'>环节 · 财务</span>."},{n:7,q:"老板或亲信负责采购会出现什么问题？",o:["会出现缺乏经营本钱的问题","会出现采购不够专业的问题","会出现食堂不能做大的问题","会出现难以防范的贪污问题"],a:2,why:"“你的食堂还能做大吗？”"},{n:8,q:"为什么采购者抵御诱惑的能力很差？",o:["食堂采购员缺乏专业训练","食堂采购员不是老板亲信","粮食青菜油盐醋的采购标准十分复杂","菜市场现金交易、无发票、价格变化大"],a:3,why:"“在现金交易，无发票，并且……价钱每天……变化的菜市场中”."},{n:9,q:"采取轮班制采购会有什么后果？",o:["大家不能互相关照","人和人会结成同盟","不专业的采购者会被小贩欺骗","不懂行的人不能有效监督采购者"],a:2,why:"“一个不懂菜市行情的人往往会被小贩欺骗”."},{n:10,q:"文中老板采取了什么采购策略？",o:["不同的人轮流采购","一人采购，一人监督","对所有东西都招标采购","不同物品由不同的人采购"],a:3,why:"“依据所购物品来拟定购买方案”. Có <span class='zh'>依据 · 拟定 · 策略</span>!"}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"金色拱门是麦当劳的标志，也是公司品牌的重要组成部分，巧的是，那拱门的形状与标在店门上的名称多少有些相似。在众多商家中，这样的例子少之又少。随着分店数量的增加，这个标志被传播到世界各地。\n你是否以为形成金色拱门的巨大“M”来自“McDonald’s”？如果真的是这样想，你就错了。金色拱门实际上来自麦当劳最初店面的外形，这座建筑的与众不同之处就是金色拱门。\n设计拱门的想法来源于建筑师斯坦利·梅斯顿，他提出这样可以引导雨水，为排队的顾客和司机提供便利。在高速公路上，巨大的金色拱门非常显眼。上世纪60年代餐厅更新品牌，决定把在高速公路上引人注目的拱门作为整个品牌的象征。",qs:[{n:11,q:"根据本文，什么是麦当劳公司品牌的重要部分？",o:["麦当劳大叔的肖像","标志性的金色拱门","麦当劳独特的风味","麦当劳的汉堡配方"],a:1,why:"“金色拱门……是公司品牌的重要组成部分”. Có <span class='zh'>肖像 · 风味</span> làm bẫy."},{n:12,q:"标志性的金色拱门来自什么？",o:["词语“McDonald’s”","一个孩子的设计","最初店面的外形","高速公路的标志"],a:2,why:"“来自麦当劳最初店面的外形”."},{n:13,q:"最初设计拱门的用途是什么？",o:["引导雨水","美观大方","耐用结实","突出显眼"],a:0,why:"“这样可以引导雨水”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"很多人会告诉你怎么创立企业、怎么解决问题，而我关注的却是“为什么创立”？这是问题的本质，下面，我想告诉你们三个故事。\n第一个故事是关于“人”。2004年，我们创立了Facebook，因为我觉得在网上，你能找到所有东西，却找不到生活中最重要的人。我创立了Facebook，就是想把人联系在一起。\n第二个故事是关于“用心”。如果你有了使命，你不需要有完整的计划，往前走吧！你只需要更多地用心。\n我们推出Facebook以后，非常高兴，因为我们的产品把学生连接起来了。当时我想，总有一天，会有人创造连接世界的产品。有趣的是，这个产品也是我们建立的，我们只是学生，没有计划、没有资源。我们是怎么创造出这个拥有十五亿人以上、世界上最大的互联网社区的？我们只是更“用心”。\n第三个故事是关于“向前看”。马云说过一句话：“和15年前比，我们很大；但和15年后比，我们还是个婴儿。”当初，我们的目标是连接十亿人，当时我觉得这个目标很大。可是当我们达到了这个目标后，才明白十亿只是一个小数字，我们真正的目标是连接世界上的每一个人。",qs:[{n:14,q:"这篇文章主要讲什么？",o:["怎么创立公司","怎么解决问题","为什么创立公司","怎么制定创业计划"],a:2,why:"“我关注的却是‘为什么创立’”."},{n:15,q:"“我”为什么要创立Facebook？",o:["供人搜索信息","增加娱乐方式","帮人解答问题","把人联系起来"],a:3,why:"“就是想把人联系在一起”."},{n:16,q:"“我们”凭借什么创造出了世界上最大的互联网社区？",o:["计划","资源","用心","专长"],a:2,why:"“我们只是更‘用心’”."},{n:17,q:"“我们”的真正目标是什么？",o:["连接10亿人","连接15亿人","连接世界上每个人","并没有具体的目标"],a:2,why:"“我们真正的目标是连接世界上的每一个人”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他意识到宇宙的永恒，因此为人生的短促而叹息。","我举手鼓掌，这时才发现那个小盒子还捏在我手里呢！","这个时期电视剧的又一个特点是强调描写平凡的普通人。","新出版的这本书，作者是旅居加拿大20年之久的华裔作家之手。"],a:3,why:"<b>Pha trộn kết cấu</b>: “作者是……作家” và “出自……之手” trộn lẫn → <span class='zh'>作者是……华裔作家</span> / <span class='zh'>出自……华裔作家之手</span>."},{n:19,o:["五彩缤纷的花朵与蓝莹莹的警灯形成了鲜明的对照。","从那以后我再也没见过她，不想到今天站在我面前的就是她。","夏季是一年中紫外线强度最高的季节，大家要做好防护准备。","她们长得花容月貌，再配上各种漂亮的制服和头饰，真是一个比一个娇美。"],a:1,why:"<b>Dùng từ sai</b>: <span class='zh'>不想到</span> → <span class='zh'>没想到 / 不想</span>."},{n:20,o:["刷牙实际上也起了一种局部的按摩作用，促进了牙龈的血液循环，加快了新陈代谢。","当知识分子得到了应有的尊重的时候，一个国家、一个民族便摆脱了愚昧，开始兴旺、强盛了！","不管我长得很好看，不管我性格很好，姑娘们一听说我干的是挖煤的工作，就都不愿意跟我谈恋爱了。","如今，巴黎圣母院已成为与卢浮宫、埃菲尔铁塔齐名的巴黎三大游览观光点，每年接纳游客达1100万人次。"],a:2,why:"<b>Liên từ sai</b>: <span class='zh'>不管</span> không đi với “很好看” (khẳng định) → <span class='zh'>不管我长得多好看，……</span> / <span class='zh'>尽管……</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"商机的创造、识别和___是抓住商机的核心。这要求创业者有___冒险的精神，既有个人风险，也有资本风险，但所有风险都必须是经过计算的，要不断___风险和潜在的回报，这样才能让你有更多的胜算。",o:["抓住　宁愿　平均","采摘　情愿　公平","抓捕　心愿　平稳","捕捉　甘愿　平衡"],a:3,why:"<span class='zh'>捕捉商机</span> (tên bài!); <span class='zh'>甘愿冒险</span>; <span class='zh'>平衡风险</span>."},{n:22,text:"成功的创业者和投资家都知道，一个好的思路未必是一个好的商机。实际上，以商业计划或商业建议等形式___给投资者的每100个思路中，通常仅有4个最后成为投资对象。准创业者可能要花___的时间寻找创业思路，而这些创业思路到头来可能毫无价值。所以，对创业者来说，学会快速地估计是否存在真正的商业___，以及决定该在上面花费多少时间和精力是一项重要的___。",o:["报告　数以千计　潜在　技术","上报　千千万万　能力　能量","呈报　难以计数　潜力　技能","呈送　成千上万　力量　技巧"],a:2,why:"<span class='zh'>呈报</span>; <span class='zh'>难以计数的时间</span>; <span class='zh'>商业潜力</span>; <span class='zh'>重要的技能</span>."},{n:23,text:"世界酒店大王希尔顿，早年___掘金热潮到丹麦挖金子，他没有别人幸运，屡次失败，没有挖出一块金子，可他却得到了上天的另一种眷顾。当他失望地准备回家时，发现了一个比黄金还要___的商机，也迅速把握住了它。这就是当别人都忙于掘金之时他却忙于建旅店，他___成为了有钱人，也为他日后在酒店业的成功___了基础。",o:["追随　珍贵　顿时　奠定","跟随　珍藏　霎时　确定","随着　珍宝　即时　决定","追求　贵重　一时　稳定"],a:0,why:"<span class='zh'>追随热潮</span>; <span class='zh'>珍贵的商机</span>; <span class='zh'>顿时</span>; <span class='zh'>奠定基础</span>. Có <span class='zh'>屡次</span>!"}]},read3:{ins:"第24–28题：选句填空。",text:"英国王子准备耗资数亿英镑，在伦敦举行轰动全世界的婚礼。\n婚礼中孕育着巨大的商机，消息传开后，(24)，想趁此机会发一笔大财。举行盛典时，从白金汉宫到圣保罗教堂，沿途挤满了近百万群众，(25)，准备亲眼目睹王子和王妃的风采。参加这次商业竞争的几家糖果厂，将王子和王妃的照片印在糖果盒上；工艺品厂为此设计了纪念章；食品厂在现场出售大蛋糕、冰激凌，欢迎人们品尝……(26)。\n最令人叫绝的是一家经营望远镜的商家。在这近百万观众中，固然需要购买一枚漂亮的纪念章，吃上一块蛋糕或一盒冰激凌。可是围观的群众里三层外三层，后排的人们在这关键的一刹那，如果看不清王子和王妃的面容，(27)。\n这时，突然从人们背后传来一阵叫卖声：“请用望远镜观看盛典。一英镑一个！”“有了望远镜，王子和王妃就像站在你的面前一样。一英镑一个！”长长的街道两旁，在同一时刻，由卖望远镜的老板雇佣的手里拿着简易望远镜的数十名儿童跑了过来，顿时，人们蜂拥而上，(28)。\n那位精明的老板就此发了一笔大财。",opts:["岂不是最大的憾事","一大批望远镜很快被抢购一空","伦敦和英国各地的许多厂商都绞尽脑汁","人们从四面八方乃至世界各地赶来","他们都使出浑身解数要趁机赚钱"],ans:{24:2,25:3,26:4,27:0,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"1992年，第25届奥运会在西班牙巴塞罗那举行。该市一家电器商店老板赛前向巴塞罗那市民宣称：“如果西班牙运动员在本届奥运会上得到的金牌总数超过10枚，那么6月3日到7月24日，凡在本店购买的电器，都可以得到全额退款。”\n这个消息轰动了巴塞罗那。人们争先恐后地到那里购买电器，商店的销售量逐日递增。尤其是才到7月4日，西班牙运动员就获得了10金1银。于是，人们比以前更加卖力地抢购电器。\n随着西班牙金牌数量的增加，据估计，电器商店的退款将达到100万美元，看来老板是非破产不可了！可老板却从容不迫地说：“从下个季度开始兑现退款的承诺。”\n“这是为什么？他能退得起吗？”人们的心里难免有疑问。\n原来老板早做好了安排。在发布广告之前，他先去保险公司投了专项保险。保险公司认为金牌数不可能超过10枚，就接受了这个保险。\n对于老板来说，这是一个旱涝保收、只赚不赔的保险。如果西班牙运动员得到的金牌总数不超过10枚，那么电器商店显然发了一大笔财，保险公司也无须赔偿。反之，金牌总数超过了10枚，那么电器商店要退的货款将全部由保险公司赔偿，与电器商店无关。\n最能干的人是善于攫取机会，运用机会，征服机会，驾驭机会的人，而机遇就在你我的身边。",qs:[{n:29,q:"如果西班牙的奥运金牌超过10枚，顾客有什么优惠？",o:["购买电器将可免费维修","购买电器将得到很大折扣","购买电器将得到精美礼物","购买的电器将得到全额退款"],a:3,why:"“都可以得到全额退款”."},{n:30,q:"第25届奥运会，西班牙运动员得到的金牌总数是：",o:["10枚","11枚","超过10枚","10枚左右"],a:2,why:"Đến 4/7 đã 10 vàng, “随着……金牌数量的增加” → hơn 10."},{n:31,q:"关于事情最后的结局，下列哪项正确？",o:["电器商店老板破产了","电器商店老板能兑现承诺","购买电器的顾客得到了保险","购买电器的顾客没得到赔偿"],a:1,why:"Tiền hoàn trả do công ty bảo hiểm chi."},{n:32,q:"上文主要想告诉我们什么？",o:["做好广告很重要","要善于抓住机会","保险公司也会破产","薄利多销才是经营之道"],a:1,why:"“最能干的人是善于攫取机会……”. Có <span class='zh'>季度 · 逐日递增 · 反之</span>!"}]},{ins:"第33–36题：请选出正确答案。",text:"我们都知道，在谈判，尤其是大型商业谈判中，还没有进入到会谈的阶段之前，谈判双方在心中就已经有了一个大致的目标和方案。这个目标和方案就构成了谈判的“焦点”，因此，谈判中最重要的，就是能把握好这个焦点，控制好谈判的进程，使之朝着有利于自己的方向发展。\n当在关键问题上谈不下去时，也可以采取迂回战术。春秋战国时期，苏代就用这种灵活的方式说服西周国，顺利解决了一次东周国、西周国之间的水利纠纷，并且拿到了双份奖金。\n当时，东周国为了发展农业，提高农作物的产量，准备改种水稻。西周国在高处掌握着水资源，知道了东周国改种水稻的消息后，坚持不给东周国放水。东周国非常着急，于是发出话来，谁能去说服西周国放水，国家会给予重奖。这时，苏代就自告奋勇去说服西周国。\n苏代到了西周国之后对西周国人说：“我听说你们不给东周国放水，这个决定可不高明啊。”西周国人问：“怎么不高明呢？”苏代说：“你们不给东周国放水，他们就没有办法种水稻，只能改种小麦，这样，他们就不用再求你们了。长此以往，你们和东周国打交道也就没有主动权了。”\n西周国人问：“苏先生，以你的意见怎么办好呢？”苏代说：“要听我的意见，你们就给东周国放水，让他们顺利地种水稻，种水稻就需要常年用水，这样，东周国的经济命脉就掌握在你们手里了。你们一断水他们就完了，他们时刻都得依靠你们，巴结你们。”西周国人听了觉得有道理，不但同意给东周国放水，还重重奖励了苏代。",qs:[{n:33,q:"根据本文，谈判中最重要的是：",o:["要采取迂回战术","要解决关键问题","要有充足的自信心","要把握目标和方案"],a:3,why:"“谈判中最重要的，就是能把握好这个焦点（目标和方案）”."},{n:34,q:"关于东周国和西周国的纠纷，下列哪项正确？",o:["西周国不给东周国放水","东周国不让西周国种水稻","西周国不让东周国提高农作物产量","西周国不让东周国学习小麦种植技术"],a:0,why:"“坚持不给东周国放水”."},{n:35,q:"为什么苏代说西周国的决定不高明？",o:["会引发战争","会损失经济命脉","会丢掉外交主动权","会失去一个友好国家"],a:2,why:"“你们和东周国打交道也就没有主动权了”."},{n:36,q:"苏代的故事告诉我们什么？",o:["谈判时要真诚，不能说假话","谈判时要采取一些灵活的方法","谈判时要表示清楚各方面的态度","谈判时要有幽默感和良好的心态"],a:1,why:"“用这种灵活的方式说服西周国”."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"本课通过几个典型案例告诉我们在创业时如何依据市场规则捕捉商机。市场需求无处不在，别人没发现，或是不屑做的生意，往往孕育着机会。研究竞争对手，从中找出其产品的弱点及营销的薄弱环节，也是捕捉商机的有效方法之一。能够准确预测市场的潜在需求，具有超前意识，也是经营者必备的素质。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Mở","Bí quyết: <span class='zh'>不可盲目 · 依据市场规则</span> + 3 ví dụ."],["Ví dụ 1","<span class='zh'>电池修复仪 · 4万元 · 两个季度收回本钱</span>."],["Ví dụ 2","<span class='zh'>劳特四个不足 → 江崎四种泡泡糖 · 物美价廉 · 购买踊跃</span>."],["Ví dụ 3","<span class='zh'>周家兄弟 · 流动彩印车 · 就近冲印 · 方便快捷</span>."],["Kết","<span class='zh'>创业不是赌博，不能靠空想 · 超前意识</span>."]],outline:[["一","创业的窍门"],["二","王先生：发现别人忽视的需求"],["三","江崎公司：从对手缺陷中捕捉商机"],["四","周家兄弟：从潜在需求中寻找商机"],["五","结论"]],model:"慧眼捕捉商机\n创业有窍门吗？当然有。窍门就是创业不能盲目，要依据市场规则捕捉商机。可替换刮胡刀、方便面、罐装八宝粥都受到了市场热捧，给创业者带来了可观的财富。\n市场需求往往容易被忽视，别人没发现的生意常常孕育着机会。手机电池往往用一年就坏了，换新的又很贵。王先生在博览会上看到了一台能修复电池的机器，花4万元买了下来，在商场租柜台修电池，月收入上万，不到两个季度就收回了本钱。\n研究竞争对手也是捕捉商机的好方法。日本泡泡糖市场大部分被劳特垄断，江崎公司研究后发现劳特产品有四个不足：只面向儿童、口味单一、外观老旧、售价不方便购买。于是江崎以成年人的需求为依据，推出了四种功能型泡泡糖，价格方便，物美价廉，消费者购买踊跃，财务收入大大增长。\n此外，还可以从市场的潜在需求中寻找商机。台湾的周家兄弟发现游客不愿意为冲洗照片等好几天，于是齐心协力，发明了流动彩印车，游客可以就近冲印照片。彩印车方便快捷，很快就收回了成本。\n可见，创业不是赌博，不能靠空想，能准确预测市场的潜在需求，是经营者必备的素质。",check:["Có tiêu đề","Có đủ các ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 4: 屡次 · 依据 · 孕育 · 季度 · 本钱 · 垄断 · 物美价廉 · 踊跃 · 齐心协力 · 空想","Khoảng 400 chữ"]},SUM:{words:["屡次","依据","罐","数额","永恒","遵循","不屑","孕育","博览会","耐用","魔术","扣","季度","本钱","通货膨胀","平庸","捏","环节","兴旺","垄断","扩充","掏","布局","拟定","策略","咀嚼","可口","物美价廉","风味","吹捧","品尝","踊跃","井","财务","局部","关照","观光","就近","肖像","纺织","留念","对照","齐心协力","专长","资本","以往","淡季","制服","规格","递增","周期","赌博","空想"],patterns:[["屡次……，却屡次……","屡次创业，却屡次惨遭失败的人总想知道，创业有窍门吗？"],["依据（名 / 动 / 介）","以成年人的消费需求为依据 · 创业必须依据市场需求 · 要依据市场规则捕捉商业机会"],["如果……，就……；只要……，就……","如果你没有眼光，就看不到商机；……只要你勤劳，市场就捏在你的手里。"],["呈……式 / 趋势","市场需求呈井喷式爆发 · 收益也呈递增趋势"],["修辞：反复","只要你细心研究市场，细心研究消费者的需求，细心研究市场产品的优劣……"]],diff:["就近: phó từ, trước động từ (就近买 · 就近冲印) — 附近: danh từ / tính từ (在附近 · 附近有…… · 附近的居民)","屡次 lǚcì · 垄断 lǒngduàn · 咀嚼 jǔjué · 踊跃 yǒngyuè · 肖像 xiàoxiàng"],sentences:["创业必须依据市场需求，这是一条永恒的真理，只要遵循这条规则，就没有不成功的道理。","别人没发现，或是不屑做的生意，往往孕育着机会。","创业不是赌博，创业不能靠空想，能够准确预测市场的潜在需求，具有超前意识，是经营者必备的素质。"],hw:["Học thuộc 53 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Đặt câu với 依据 ở 3 từ loại: danh từ, động từ, giới từ.","Làm Sách bài tập bài 38.","Đọc trước bài 39."]}});
