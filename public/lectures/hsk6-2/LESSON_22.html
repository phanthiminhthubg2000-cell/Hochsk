<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 22 · 2050年的汽车什么样？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}

<script>window.LESSON={id:"hsk6-2-22",num:22,book:"HSK 标准教程 6（下）",unit:{n:6,zh:"趣味世界",vn:"Thế giới thú vị"},title:"2050年的汽车什么样？",vn:"Xe hơi năm 2050 sẽ như thế nào?",chars:986,source:"改编自《参考消息》同名文章",goals:["Đọc hiểu bài báo dự báo 986 chữ: xe hơi năm 2050 với 4 đặc điểm <b>甲 sạch & an toàn · 乙 tự lái · 丙 hòa nhập đời sống số · 丁 đường dài vẫn dùng xăng</b>.","Dùng được 52 từ mới, nhất là nhóm <b>giao thông – năng lượng</b>: <span class='zh'>堵塞 · 滞留 · 石油 · 事故 · 平坦 · 奔驰 · 引导 · 抵达 · 停泊 · 引擎 · 柴油 · 排放</span> và nhóm <b>lập luận</b>: <span class='zh'>担保 · 大体 · 指责 · 鉴于 · 明智 · 出路 · 谋求 · 试图 · 力求 · 遏制 · 排除 · 确保 · 代价</span>.","Nắm <span class='zh'>动不动 · 甲乙丙丁……</span>.","Phân biệt <span class='zh'>担保 — 保证</span>; làm quen <b>篇章 (2): 词汇衔接 — liên kết từ vựng</b>.","Tóm tắt (缩写) bài khóa thành ~350 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (动不动 · 担保—保证) · Bài khóa mở đầu + 甲"],["Buổi 2","Nhóm 2–3 (甲乙丙丁) · 乙 丙 丁 + kết · 词汇衔接 · Bài tập · Luyện đề · Viết tóm tắt"]],outline:[{tag:"起",name:"Câu hỏi",paras:"Đoạn 1",zh:"汽车要是也有双翼……",vn:"Kẹt xe khiến người ta mơ xe biết bay — năm 2050 xe sẽ ra sao? Bốn điểm phác họa “hình dáng” xe 2050."},{tag:"承",name:"甲 · 乙",paras:"Đoạn 2–3",zh:"清洁安全 · 自动行驶",vn:"Xe bị chỉ trích (băng tan, ô nhiễm, tai nạn) nhưng không nên loại bỏ — phải sạch, an toàn; xe tự lái, chạy thành “chuỗi ngọc”, tự đỗ."},{tag:"转",name:"丙 · 丁",paras:"Đoạn 4–5",zh:"数字生活 · 汽油柴油",vn:"Hãng tìm kiếm nhập cuộc, trợ lý ảo; xe điện tăng nhưng đường dài vẫn có thể dùng xăng/dầu → phải tăng hiệu suất, giảm khí thải."},{tag:"合",name:"Kết",paras:"Đoạn 6",zh:"清洁、安全、可持续发展",vn:"Nếu xe vẫn là “bạn đồng hành”, là ngành trụ cột, thì nó phải sạch, an toàn, phát triển bền vững."}],warm1:{q:"关于未来的汽车，你认为会具有什么样的功能？请在下面选择。",vn:"Bạn nghĩ xe tương lai sẽ có chức năng nào? Bấm 有 / 无.",items:[["🤖","能够自动驾驶","Tự lái"],["🌱","节能环保","Tiết kiệm năng lượng, thân thiện môi trường"],["🚁","水上、陆地、空中都能行驶","Chạy được trên nước, đất liền và trên không"],["📲","具有更多数字生活功能","Nhiều chức năng của đời sống số"]],talk:["你最希望未来的汽车有什么功能？","你所在的城市交通堵塞严重吗？"],link:"Bài báo viết khoảng 2010 — nay xe tự lái và trợ lý ảo trên ô tô đã xuất hiện. Hãy so sánh dự đoán với thực tế!"},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"油",rule:"油 = <b>dầu, mỡ</b>.",w:[["石油","shíyóu","dầu mỏ (từ mới)"],["汽油","qìyóu","xăng"],["柴油","cháiyóu","dầu diesel (từ mới)"],["花生油","huāshēngyóu","dầu lạc"],["豆油","dòuyóu","dầu đậu nành"],["橄榄油","gǎnlǎnyóu","dầu ô-liu"],["奶油","nǎiyóu","kem sữa"],["黄油","huángyóu","bơ"],["鱼油","yúyóu","dầu cá"],["菜籽油","càizǐyóu","dầu cải"],["鞋油","xiéyóu","xi đánh giày"],["加油","jiāyóu","đổ xăng; cố lên"],["油炸","yóuzhá","chiên"],["油田","yóutián","mỏ dầu"]]},{k:"缺",rule:"缺 = <b>thiếu</b>.",w:[["紧缺","jǐnquē","khan hiếm (có trong bài)"],["缺少","quēshǎo","thiếu"],["缺乏","quēfá","thiếu thốn"],["缺口","quēkǒu","chỗ khuyết"],["缺课","quēkè","nghỉ học"],["缺水","quēshuǐ","thiếu nước"],["缺觉","quējiào","thiếu ngủ"],["缺勤","quēqín","vắng mặt"]]},{k:"迹",rule:"迹 = <b>dấu vết, việc làm</b>.",w:[["劣迹","lièjì","việc làm xấu (có trong bài)"],["事迹","shìjì","sự tích"],["奇迹","qíjì","kỳ tích"],["名胜古迹","míngshèng-gǔjì","danh lam cổ tích"],["足迹","zújì","dấu chân"],["笔迹","bǐjì","nét chữ"],["痕迹","hénjì","vết tích"],["污迹","wūjì","vết bẩn"],["血迹","xuèjì","vết máu"],["迹象","jìxiàng","dấu hiệu"]]},{k:"导",rule:"导 = <b>dẫn</b>.",w:[["引导","yǐndǎo","dẫn dắt (từ mới)"],["指导","zhǐdǎo","chỉ đạo"],["领导","lǐngdǎo","lãnh đạo"],["向导","xiàngdǎo","người dẫn đường"],["主导","zhǔdǎo","chủ đạo"],["倡导","chàngdǎo","khởi xướng"],["先导","xiāndǎo","tiên phong"],["导游","dǎoyóu","hướng dẫn viên"],["导演","dǎoyǎn","đạo diễn"],["导师","dǎoshī","người hướng dẫn"],["导航","dǎoháng","dẫn đường (GPS)"]]}]},vgroups:[{name:"Nhóm 1 · Mở đầu + 甲",sub:"Kẹt xe & xe sạch, an toàn",from:1,to:19},{name:"Nhóm 2 · 乙",sub:"Xe tự lái",from:20,to:32},{name:"Nhóm 3 · 丙 丁 + kết",sub:"Đời sống số & nhiên liệu",from:33,to:52}],V:[[1,"堵塞","dǔsè","đgt.","đổ tắc","tắc nghẽn, ngăn chặn",1,"","阻塞（洞穴、通道等）使不通。","每次遇到交通堵塞","下班时间道路经常堵塞。","Giờ tan tầm đường hay bị tắc.",["交通堵塞"],"Bài tập 3①."],[2,"滞留","zhìliú","đgt.","trệ lưu","ngưng lại, dừng lại",1,"","停留不动。","那些滞留在路上……的人们","大雪使上千名旅客滞留机场。","Tuyết lớn khiến hàng nghìn hành khách mắc kẹt ở sân bay.",[],"Bài tập 2①."],[3,"折磨","zhémó","đgt.","chiết ma","giày vò, hành hạ",1,"","使在肉体上、精神上受痛苦。","被堵车折磨得心烦意乱","这场病把他折磨得很瘦。","Trận ốm hành anh ấy gầy rộc.",[],"Bài tập 3①. SBT câu 29."],[4,"翼","yì","dt.","dực","cánh, cánh chim",1,"书","翅膀；飞机等两侧伸出的部分。","汽车要是也有双翼","飞机的机翼。","Cánh máy bay.",["双翼"],""],[5,"担保","dānbǎo","đgt.","đảm bảo","bảo đảm, cam đoan",1,"","表示负责，保证不出问题或一定办到。","别的不敢担保","我敢担保他会来。","Tôi dám đảm bảo anh ấy sẽ đến.",[],"Xem <b>辨析 担保—保证</b>. SBT câu 33–36."],[6,"大体","dàtǐ","phó.","đại thể","đại thể, đại khái, trên cơ bản",1,"","就多数情形或主要方面说。","以下四点大体为我们勾画出了……","两人的看法大体相同。","Quan điểm hai người về cơ bản giống nhau.",[],"Bài tập 2②."],[7,"勾画","gōuhuà","đgt.","câu họa","phác họa, vạch ra, phác thảo",0,"","勾勒描绘；用简短的文字描写。","勾画出了2050年汽车的轮廓","他用几笔就勾画出一幅山水。","Anh ấy vài nét đã phác ra bức sơn thủy.",[],"Từ có dấu *. SBT câu 18: <span class='zh'>勾勒出……的轮廓</span>."],[8,"轮廓","lúnkuò","dt.","luân khuếch","hình dáng, đường nét, nét khái quát",1,"","构成图形或物体的外缘的线条；事情的概况。","2050年汽车的轮廓","远处山的轮廓渐渐清楚了。","Đường nét ngọn núi xa dần rõ ra.",[],"SBT câu 18, 27."],[9,"指责","zhǐzé","đgt.","chỉ trách","chỉ trích, trách móc",1,"","指摘；责备。","我们常常听到这样的指责","不要随便指责别人。","Đừng tùy tiện chỉ trích người khác.",[],"Bài tập 1: <span class='zh'>责怪 · 责任 · 苛责 · 负责</span>; Bài tập 3①."],[10,"融化","rónghuà","đgt.","dung hóa","tan ra, chảy ra",1,"","（冰、雪等）变成水。","北极冰川在融化","太阳出来了，雪慢慢融化了。","Mặt trời lên, tuyết dần tan.",[],""],[11,"石油","shíyóu","dt.","thạch du","dầu mỏ, dầu thô",1,"","一种可燃的黏稠液体，是重要的能源。","石油资源日益紧缺","石油是不可再生资源。","Dầu mỏ là tài nguyên không tái tạo.",[],"Bài tập 3②."],[12,"事故","shìgù","dt.","sự cố","tai nạn, sự rủi ro",1,"","意外的损失或灾祸。","死于交通事故","他在一次交通事故中受了伤。","Anh bị thương trong một vụ tai nạn giao thông.",["交通事故"],"Bài tập 3②."],[13,"割","gē","đgt.","cát","cắt, bỏ",1,"","用刀截断。","人类会不会忍痛割爱？","农民 ","dt.","trân châu","hạt trân châu, ngọc trai",1,"","某些贝类动物体内产生的圆形颗粒，可做装饰品。","一条线上的珍珠","她戴着一条珍珠项链。","Cô ấy đeo một chuỗi ngọc trai.",[],"So sánh: xe chạy nối đuôi như chuỗi ngọc."],[27,"效益","xiàoyì","dt.","hiệu ích","hiệu quả",1,"","效果和利益。","职业司机的工作效益","公司的经济效益很好。","Hiệu quả kinh tế của công ty rất tốt.",["经济效益"],""],[28,"抵达","dǐdá","đgt.","để đạt","đến, tới",1,"书","到达。","汽车抵达终点后","飞机将于下午三点抵达北京。","Máy bay sẽ đến Bắc Kinh lúc 3 giờ chiều.",[],"Bài tập 1: <span class='zh'>达到 · 到达 · 送达 · 通达</span>; Bài tập 2④."],[29,"终点","zhōngdiǎn","dt.","chung điểm","điểm cuối cùng, nơi đến",1,"","一段路程结束的地方。","汽车抵达终点后","他第一个跑到终点。","Anh ấy về đích đầu tiên.",[],""],[30,"配备","pèibèi","đgt.","phối bị","trang bị",1,"","根据需要分配（人力或物力）。","车上配备的高科技系统","教室里配备了电脑。","Phòng học được trang bị máy tính.",[],"Bài tập 2⑤."],[31,"停泊","tíngbó","đgt.","đình bạc","đỗ, cập bến",1,"","（船只）停靠；停留。","使车辆自动停泊入位","港口停泊着很多船。","Cảng có nhiều tàu neo đậu.",[],"Bài tập 1: <span class='zh'>停车 · 停顿 · 暂停 · 停止</span>. SBT câu 19."],[32,"力求","lìqiú","đgt.","lực cầu","cố gắng đạt tới",1,"","极力追求；尽力谋求。","人类力求实现的汽车自动行驶","我们力求把工作做得更好。","Chúng tôi cố gắng làm việc tốt hơn.",[],"Bài tập 2⑥."],[33,"丙","bǐng","dt.","bính","thứ ba / Bính",1,"","天干的第三位，用作顺序的第三。","丙 融合数字生活方式","甲、乙、丙三个队。","Ba đội A, B, C.",[],"Xem <b>Ngữ pháp: 甲乙丙丁</b>."],[34,"融合","rónghé","đgt.","dung hợp","hợp nhất, hòa nhập",0,"","几种不同的事物合成一体。","融合数字生活方式","两种文化相互融合。","Hai nền văn hóa hòa quyện vào nhau.",[],"Từ có dấu *."],[35,"引擎","yǐnqíng","dt.","dẫn kình","máy, động cơ",1,"","发动机。","某家著名的搜索引擎公司","汽车引擎坏了。","Động cơ xe hỏng rồi.",["搜索引擎"],""],[36,"行列","hángliè","dt.","hàng liệt","hàng ngũ, đội ngũ",1,"","人或物排成的直行和横行的总称。","加入到汽车研发的行列","他加入了志愿者的行列。","Anh ấy gia nhập hàng ngũ tình nguyện viên.",[],"⚠️ 行 đọc <b>háng</b>."],[37,"潮流","cháoliú","dt.","triều lưu","trào lưu, xu hướng",1,"","比喻社会变动或发展的趋势。","无法阻挡的潮流","跟上时代的潮流。","Theo kịp trào lưu thời đại.",[],""],[38,"助理","zhùlǐ","dt.","trợ lý","trợ lý",1,"","协助主要负责人办事的人。","创造虚拟个人助理","她是总经理的助理。","Cô ấy là trợ lý tổng giám đốc.",[],""],[39,"锦上添花","jǐnshàng-tiānhuā","thành ngữ","cẩm thượng thiêm hoa","thêu hoa trên gấm, đã hay lại càng hay",1,"成","在锦上再绣花。比喻好上加好。","而非锦上添花","这首音乐给电影锦上添花。","Bản nhạc này làm bộ phim càng thêm hay.",[],"Đối lập: <span class='zh'>雪中送炭</span> (SBT nghe câu 1). SBT câu 22."],[40,"保障","bǎozhàng","đgt.","bảo chướng","bảo đảm",1,"","保护（生命、财产、权利等）使不受侵犯和破坏。","为汽车的方便、安全使用提供保障","保障公民的合法权益。","Bảo đảm quyền lợi hợp pháp của công dân.",[],"Còn là danh từ: <span class='zh'>提供保障</span>. Bài tập 3①."],[41,"丁","dīng","dt.","đinh","người thứ tư, vật thứ tư",1,"","天干的第四位，用作顺序的第四。","丁 长途行车仍靠汽油","甲乙丙丁四个人。","Bốn người A, B, C, D.",[],""],[42,"柴油","cháiyóu","dt.","sài du","dầu diesel",1,"","从石油中分馏出来的燃料。","还是依然用汽油和柴油？","这辆卡车烧柴油。","Chiếc xe tải này chạy dầu diesel.",[],""],[43,"遏制","èzhì","đgt.","át chế","ngăn chặn, kiềm chế",1,"","制止；控制。","遏制汽油、柴油的使用","要遏制房价过快上涨。","Phải kiềm chế giá nhà tăng quá nhanh.",[],"SBT câu 24–28."],[44,"比重","bǐzhòng","dt.","tỷ trọng","tỷ lệ, tỷ trọng",1,"","一种事物在整体中所占的分量。","电动汽车的比重一定会提高","服务业在经济中的比重越来越大。","Tỷ trọng ngành dịch vụ trong nền kinh tế ngày càng lớn.",[],""],[45,"昂贵","ángguì","tt.","ngang quý","đắt đỏ",1,"","价格很高。","造价可能很昂贵","这块手表价格昂贵。","Chiếc đồng hồ này giá rất đắt.",[],""],[46,"阻碍","zǔ'ài","đgt.","trở ngại","ngăn cản, cản trở",1,"","使不能顺利通过或发展。","阻碍人们选择电动汽车的理由","落后的观念阻碍了经济发展。","Quan niệm lạc hậu cản trở phát triển kinh tế.",[],"SBT nghe 14–17."],[47,"排除","páichú","đgt.","bài trừ","loại trừ, loại bỏ",1,"","除掉；消除。","不排除长距离行车还用汽油或柴油","不排除这种可能。","Không loại trừ khả năng này.",["不排除"],""],[48,"确保","quèbǎo","đgt.","xác bảo","bảo đảm",1,"","切实保持或保证。","为了确保减少污染","确保安全第一。","Đảm bảo an toàn là trên hết.",[],"Bài tập 1 (ví dụ)."],[49,"排放","páifàng","đgt.","bài phóng","đổ ra, thải ra",1,"","排出（废气、废水等）。","废气的排放必须减少","工厂不能随便排放污水。","Nhà máy không được tùy tiện xả nước thải.",[],""],[50,"代价","dàijià","dt.","đại giá","giá phải trả, chi phí",1,"","为达到某种目的所耗费的物质或精力。","人类也为此付出了巨大的代价","他为成功付出了巨大的代价。","Anh ấy đã trả giá rất đắt cho thành công.",["付出代价"],"Bài tập 3②. SBT câu 24–28."],[51,"伴侣","bànlǚ","dt.","bạn lữ","bạn đồng hành, đối tác",1,"","同在一起生活、工作或旅行的人。","我们生活中不可缺少的伴侣","动物是人类的伴侣。","Động vật là bạn đồng hành của con người.",[],"SBT nghe câu 4."],[52,"支柱","zhīzhù","dt.","chi trụ","chỗ dựa chính, trụ cột",1,"","起支撑作用的柱子；比喻中坚力量。","支柱产业","他是家里的经济支柱。","Anh ấy là trụ cột kinh tế của gia đình.",["支柱产业"],""]],extra:[["心烦意乱","xīnfán-yìluàn","bực bội rối trí"],["期盼","qīpàn","mong đợi"],["冰川","bīngchuān","sông băng"],["紧缺","jǐnquē","khan hiếm"],["惹祸","rě huò","gây họa"],["鉴于","jiànyú","xét thấy"],["劣迹","lièjì","việc làm xấu"],["忍痛割爱","rěntòng-gē'ài","đành lòng từ bỏ"],["淘汰","táotài","đào thải"],["蕴藏","yùncáng","tiềm tàng"],["商机","shāngjī","cơ hội kinh doanh"],["可持续发展","kě chíxù fāzhǎn","phát triển bền vững"]],T:[{zh:"每次遇到交通堵塞，那些滞留在路上，被堵车折磨得心烦意乱的人们就会想：汽车要是也有双翼，能飞起来就好了。人们的期盼，有可能变为现实吗？2050年，汽车会是什么样？别的不敢担保，以下四点大体为我们勾画出了2050年汽车的轮廓。",vn:"Mỗi lần gặp tắc đường, những người kẹt lại trên đường, bị kẹt xe hành cho bực bội rối trí đều nghĩ: giá mà xe hơi cũng có đôi cánh, bay lên được thì hay biết mấy. Mong ước ấy có thể thành hiện thực không? Năm 2050, xe hơi sẽ như thế nào? Những điều khác không dám chắc, nhưng bốn điểm dưới đây về cơ bản phác họa cho ta hình dáng chiếc xe năm 2050.",idea:"Mở đầu: mơ xe biết bay.",q:["课文从什么问题开始谈起？"],note:[["被堵车折磨得心烦意乱","Bị động + bổ ngữ trạng thái."],["别的不敢担保","Xem 辨析 担保—保证."]]},{zh:"【甲 更加清洁、安全】我们首先要问的是，2050年汽车还会存在吗？我们常常听到这样的指责：北极冰川在融化；空气质量在下降；石油资源日益紧缺；每年全球一百多万人死于交通事故，都是汽车惹的祸。鉴于以上劣迹，人类会不会忍痛割爱？根据优胜劣汰的原则，汽车会不会被取代？一切皆有可能，但作为一种将人解放出来的灵活的交通工具，动不动就要将其淘汰，似乎不是明智之举，根本出路还是要在清洁环保、规范驾车出行上下功夫。谋求这一交通工具的清洁、安全，是2050年对汽车最起码的要求。",vn:"【A · Sạch hơn, an toàn hơn】 Trước tiên phải hỏi: năm 2050 xe hơi còn tồn tại không? Ta thường nghe những lời chỉ trích: băng ở Bắc Cực đang tan; chất lượng không khí đang giảm; dầu mỏ ngày càng khan hiếm; mỗi năm hơn một triệu người trên thế giới chết vì tai nạn giao thông — đều là họa do xe hơi gây ra. Xét những “tội trạng” trên, loài người có đành lòng từ bỏ nó? Theo quy luật mạnh thắng yếu thua, xe hơi có bị thay thế? Mọi thứ đều có thể, nhưng là một phương tiện linh hoạt đã giải phóng con người, hơi một tí lại đòi loại bỏ nó dường như không phải là việc làm sáng suốt; lối thoát căn bản vẫn là dồn công sức vào việc sạch, thân thiện môi trường và lái xe đúng quy tắc. Mưu cầu sự sạch sẽ, an toàn cho phương tiện này là yêu cầu tối thiểu với xe hơi năm 2050.",idea:"甲: sạch & an toàn.",q:["人们对汽车有哪些指责？根本出路是什么？"],note:[["动不动就要将其淘汰","Xem Ngữ pháp 1."],["鉴于……","Giới từ văn viết = xét thấy."],["在……上下功夫","Dồn công sức vào…"]]},{zh:"【乙 能自动行驶】2050年，无人干预，能够自动在平坦的高速路上奔驰的车辆将会走进家庭。欧洲正试图实现由一名职业司机驾车引导一长串汽车前行，它们像是一条线上的珍珠，在路上移动。被引导车辆上的驾驶者可以工作，也可以休息，职业司机的工作效益也将大大提高。汽车抵达终点后，车上配备的高科技系统能使车辆自动停泊入位。这就是人类力求实现的汽车自动行驶。",vn:"【B · Tự lái】 Năm 2050, những chiếc xe không cần người can thiệp, tự chạy băng băng trên cao tốc bằng phẳng sẽ đi vào các gia đình. Châu Âu đang thử để một tài xế chuyên nghiệp lái xe dẫn đầu cả một đoàn xe dài, chúng như chuỗi ngọc trên một sợi chỉ di chuyển trên đường. Người ngồi trên các xe được dẫn có thể làm việc hoặc nghỉ ngơi, hiệu quả công việc của tài xế chuyên nghiệp cũng tăng lên nhiều. Khi xe tới đích, hệ thống công nghệ cao trang bị trên xe giúp xe tự đỗ vào chỗ. Đó chính là xe tự lái mà loài người đang ra sức hiện thực hóa.",idea:"乙: tự lái.",q:["什么是“汽车自动行驶”？"],note:[["像是一条线上的珍珠","So sánh hình ảnh."],["可以工作，也可以休息","Xem 篇章: 词汇衔接 (cặp trái nghĩa)."]]},{zh:"【丙 融合数字生活方式】某家著名的搜索引擎公司意识到，为个人驾驶提供服务蕴藏着巨大的商机，于是，他们迫不及待地加入到汽车研发的行列，车企与电脑公司合作几乎成了无法阻挡的潮流。创造虚拟个人助理，为汽车用户提供路线、交通信息和日程安排等方面的帮助，在2050年将会是必然的服务，而非锦上添花。数字生活方式将完全与汽车融为一体，为汽车的方便、安全使用提供保障。",vn:"【C · Hòa nhập đời sống số】 Một công ty công cụ tìm kiếm nổi tiếng nhận ra phục vụ việc lái xe cá nhân tiềm ẩn cơ hội kinh doanh khổng lồ, nên họ nóng lòng gia nhập hàng ngũ nghiên cứu phát triển ô tô; hãng xe hợp tác với công ty máy tính gần như thành trào lưu không thể cản. Tạo trợ lý cá nhân ảo, giúp người dùng về lộ trình, thông tin giao thông, lịch trình… vào năm 2050 sẽ là dịch vụ tất yếu chứ không phải “thêu hoa trên gấm”. Lối sống số sẽ hoàn toàn hòa làm một với xe hơi, bảo đảm cho việc dùng xe tiện lợi, an toàn.",idea:"丙: hòa nhập đời sống số.",q:["数字生活方式怎样与汽车融为一体？"],note:[["是必然的服务，而非锦上添花","<span class='zh'>是A，而非B</span> = là A chứ không phải B."]]},{zh:"【丁 长途行车仍靠汽油】2050年的汽车动力是什么？电力？风力？还是依然用汽油和柴油？有人会说，清洁能源的开发就是要遏制汽油、柴油的使用。没错，作为日常交通工具，电动汽车的比重一定会提高，可是跑长途呢？电动汽车也许能承受超远距离行驶，但电池可能很重，造价可能很昂贵，充电的时间可能很长，这些都可能成为阻碍人们选择电动汽车的理由，所以，不排除长距离行车还用汽油或柴油，因此为了确保减少污染，燃料的使用效率必须提高，废气的排放必须减少。",vn:"【D · Đường dài vẫn dựa vào xăng】 Động lực của xe năm 2050 là gì? Điện? Sức gió? Hay vẫn là xăng và dầu diesel? Có người sẽ nói phát triển năng lượng sạch chính là để kiềm chế việc dùng xăng, dầu. Đúng vậy, là phương tiện hằng ngày thì tỷ trọng xe điện chắc chắn tăng, nhưng chạy đường dài thì sao? Xe điện có thể chịu được quãng đường rất xa, nhưng pin có thể rất nặng, giá thành có thể rất đắt, thời gian sạc có thể rất lâu — những điều này đều có thể cản trở người ta chọn xe điện. Vì vậy không loại trừ chạy đường dài vẫn dùng xăng hoặc dầu; do đó để đảm bảo giảm ô nhiễm, hiệu suất sử dụng nhiên liệu phải nâng lên, khí thải phải giảm xuống.",idea:"丁: nhiên liệu.",q:["电动汽车有什么优缺点？"],note:[["电池可能很重，造价可能很昂贵，充电的时间可能很长","Ví dụ mẫu của 篇章 (2) 词汇衔接."],["不排除……","Không loại trừ…"]]},{zh:"长久以来，汽车作为人类重要的交通工具与我们相伴相随，人类也为此付出了巨大的代价。2050年，如果汽车还是我们生活中不可缺少的伴侣，它在我们的经济生活中还扮演支柱产业的角色，它必须是清洁的、安全的，它必须符合可持续发展的原则。",vn:"Từ lâu, xe hơi là phương tiện quan trọng luôn đồng hành cùng con người, và loài người cũng đã trả giá đắt vì điều đó. Năm 2050, nếu xe hơi vẫn là người bạn không thể thiếu trong cuộc sống, vẫn đóng vai ngành công nghiệp trụ cột trong đời sống kinh tế, thì nó phải sạch, phải an toàn, phải phù hợp với nguyên tắc phát triển bền vững.",idea:"Kết: sạch, an toàn, bền vững.",q:["2050年汽车必须符合什么原则？"],note:[["它必须是……，它必须符合……","Điệp “它必须” nhấn mạnh kết luận."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"动不动（就）",py:"dòngbudòng",tag:"Chú thích 1",mean:"Biểu thị <b>rất dễ phản ứng / hành động</b> theo một cách nào đó — “hơi một tí là…, động một chút là…”. Phần lớn dùng cho <b>điều không mong muốn</b>. Thường đi với <span class='zh'>就</span>.",forms:["S + 动不动就 + V（điều không mong muốn）"],ex:[["他最近工作忙、压力大，动不动就着急、发脾气。","Dạo này anh ấy bận, áp lực lớn, hơi tí là cuống, nổi nóng."],["作为一种将人解放出来的灵活的交通工具，动不动就要将其淘汰，似乎不是明智之举……","",1],["父母要多与孩子交流，不要动不动就呵斥压服，以“住嘴”来强行制止孩子发表意见。","Bố mẹ nên trò chuyện với con, đừng hơi tí là quát nạt, dùng “im mồm” để cấm con bày tỏ ý kiến."]],tips:["SBT câu 19B: <span class='zh'>常常动不动就发火</span>."],practice:{q:"用“动不动”完成句子",type:"complete",items:[["他身体很弱，________。","他身体很弱，动不动就生病。"],["你的电脑该换了，________，多耽误事啊。","你的电脑该换了，动不动就死机，多耽误事啊。"],["对孩子要耐心，________。","对孩子要耐心，不要动不动就训斥。"]]}},{id:"g2",grp:2,word:"丙",zh:"甲乙丙丁……",py:"jiǎ yǐ bǐng dīng",tag:"Chú thích 2",mean:"① Dùng để <b>đánh số thứ tự</b> sự vật (như A, B, C, D).<br>② <span class='zh'>甲、乙、丙、丁、戊、己、庚、辛、壬、癸</span> là <b>Thiên can</b>; <span class='zh'>子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥</span> là <b>Địa chi</b> — gọi tắt <b>Can Chi</b>. Ghép theo thứ tự được 60 tổ hợp, tuần hoàn, dùng ghi ngày, năm; âm lịch Trung Quốc vẫn dùng.",forms:["甲 / 乙 / 丙 / 丁 + mục","Can + Chi → năm: 甲午 · 乙未 · 甲申"],ex:[["甲 更加清洁、安全　乙 能自动行驶　丙 融合数字生活方式","",1],["2015年，农历乙未。","Năm 2015, âm lịch Ất Mùi."],["甲午战争发生在1894年。","Chiến tranh Giáp Ngọ xảy ra năm 1894."],["甲申年来临之际，祝您健康幸福，心想事成。","Nhân dịp năm Giáp Thân, chúc ông bà mạnh khỏe hạnh phúc, vạn sự như ý."]],tips:["Đố vui sách: 甲 nói “xe 乙 không trắng”, 乙 nói “xe 丙 đỏ”, 丙 nói “xe 丁 không xanh”, 丁 nói “trong 甲乙丙 có một người xe đỏ và chỉ người đó nói thật”. Nếu 丁 nói thật → <b>C. 丙 trắng, 丁 xanh</b> (甲 đỏ & nói thật, 乙 bạc).","Tiếng Việt cũng dùng Can Chi: Giáp, Ất, Bính, Đinh…"],practice:{q:"下列哪句中的“甲乙丙丁……”和上面讲的意思不同？",type:"pos",items:[["A 她姓甲，叫甲吉。　B 他叫李甲申，肯定是1944年出生的，那一年是甲申年。　C 这篇文章分为甲、乙、丙三部分，我最喜欢的是第三部分。","A","A — ở đây <span class='zh'>甲</span> là <b>họ người</b>, không phải số thứ tự hay Can Chi."]]}},{id:"g3",grp:0,word:"大体",zh:"大体 / 试图 / 力求",py:"dàtǐ / shìtú / lìqiú",tag:"Từ trong Bài tập 2",mean:"<span class='zh'>大体</span> = <b>về cơ bản, đại thể</b>. <span class='zh'>试图</span> = <b>định, thử (làm)</b> + V. <span class='zh'>力求</span> = <b>cố hết sức để đạt</b> + V/mục tiêu.",forms:["大体 + V / Adj","试图 + V","力求 + V / 达到……"],ex:[["以下四点大体为我们勾画出了2050年汽车的轮廓。","",1],["欧洲正试图实现由一名职业司机驾车引导一长串汽车前行……","",1],["这就是人类力求实现的汽车自动行驶。","",1]],tips:["Bài tập 2②③⑥."]},{id:"g4",grp:0,word:"担保",zh:"担保 / 保证",py:"dānbǎo / bǎozhèng",tag:"Xem 辨析 bên dưới",mean:"Đều là <b>chịu trách nhiệm, chắc chắn không có vấn đề / nhất định làm được</b>. <span class='zh'>担保</span> chỉ + động từ / phân câu, không có tính danh từ; <span class='zh'>保证</span> + được danh từ và còn là danh từ.",forms:["担保 + V / 小句","保证 + N / V / 小句；N 是……的保证"],ex:[["别的不敢担保，以下四点大体为我们勾画出了2050年汽车的轮廓。","",1]],tips:["SBT câu 33–36: <span class='zh'>谁都不能担保我们人类在竞争中处于优势</span>."]}],BX:{grp:0,word:"担保",cols:["√ Đúng","× Sai"],pair:"担保 — 保证",same:["Biểu thị <b>chịu trách nhiệm, chắc chắn không có vấn đề hoặc nhất định làm được</b>.","出不了事，我敢担保 / 保证。"],diff:[["Phía sau <b>không đi với danh từ</b>, chỉ đi với động từ hoặc phân câu.","我们要担保产品质量。（×）　我敢担保，产品质量没有问题。（√）","Phía sau <b>đi được với danh từ</b>, biểu thị bảo đảm yêu cầu, tiêu chuẩn đã định, không giảm bớt.<div class='zh' style='margin-top:4px'>我们要保证产品质量。</div>"],["<b>Không có</b> tính danh từ.","—","Còn là <b>danh từ</b> = vật / điều bảo đảm.<div class='zh' style='margin-top:4px'>安定团结是我们取得胜利的保证。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["他的能力很强，这件棘手的事情交给他办，保证错不了。",0,"保证 + phân câu → đúng."],["由于任务异常繁重，请给他们担保科研时间。",1,"担保 không + danh từ (科研时间) → phải dùng 保证."],["反复练习和精益求精是取得成功的担保。",1,"担保 không có tính danh từ → 成功的保证."],["他语气坚定地对将军说：“保证圆满完成任务！”",0,"保证 + động từ → đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["担<u>保</u>","保证 · 保险 · 确保 · 准保"],items:[["指<u>责</u>","责","责怪 · 责任 · 苛责 · 负责"],["<u>平</u>坦","平","平静 · 平缓 · 平淡 · 和平"],["抵<u>达</u>","达","达到 · 到达 · 送达 · 通达"],["<u>停</u>泊","停","停车 · 停顿 · 暂停 · 停止"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["因为恶劣的天气，机场________。","滞留","因为恶劣的天气，机场滞留了大量旅客。"],["对于这个高精尖的专业，我________。","大体","对于这个高精尖的专业，我只大体了解了一下。"],["看到她伤心欲绝的样子，我________。","试图","看到她伤心欲绝的样子，我试图安慰她。"],["经过十几个小时的漫长飞行，________。","抵达","经过十几个小时的漫长飞行，我们终于抵达了目的地。"],["为了提高工作效率，公司________。","配备","为了提高工作效率，公司为员工配备了最新的办公设备。"],["演出前我们认真排练，________。","力求","演出前我们认真排练，力求达到最好的演出效果。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["保障","折磨","规范","堵塞","指责"],text:"谁出行时没遇到过交通{堵塞}呢？经常被堵车{折磨}的你，是否也{指责}过日益糟糕的交通状况？其实，{保障}出行顺利通畅，除了加快道路建设以外，每位司机{规范}操作也是非常重要的。"},{bank:["石油","奔驰","事故","谋求","代价"],text:"汽车的出现，大大改变了我们的生活，一方面，高速{奔驰}的汽车拉近了我们的距离，提高了工作效率。可另一方面，人类也付出了巨大的{代价}，空气质量下降，{石油}资源日益减少，越来越多的人死于交通{事故}……因此，人类已开始{谋求}更清洁、环保的能源。"}]},EX4:{q:"根据词汇语义上的联系，给下列句子排列顺序",type:"order",vn:"Nhập thứ tự chữ cái rồi bấm Kiểm tra. Mẹo: tìm các từ liên kết về nghĩa (从小—长大; 小灰雀—海鸥; 迅速—笨拙).",sets:[{ans:"CAEDB",items:[["A","是爸爸一手把我抚养大的"],["B","我很不忍心"],["C","我从小就没有了妈妈"],["D","又要离开他"],["E","好不容易等我长大了"]],full:"我从小就没有了妈妈，是爸爸一手把我抚养大的，好不容易等我长大了，又要离开他，我很不忍心。"},{ans:"AFGBEDC",items:[["A","你看那些在海边争食的鸟儿"],["B","而海鸥总显得非常笨拙"],["C","然而，真正能飞越大海的还是它们"],["D","当海浪打来的时候"],["E","它们从沙滩飞入天空总要很长时间"],["F","小灰雀总能迅速起飞"],["G","它们拍打两三下翅膀就升入了天空"]],full:"你看那些在海边争食的鸟儿，小灰雀总能迅速起飞，它们拍打两三下翅膀就升入了天空；而海鸥总显得非常笨拙，它们从沙滩飞入天空总要很长时间。然而，当海浪打来的时候，真正能飞越大海的还是它们。（Sách đáp án in “CAFEBDG”, có lẽ in nhầm — thứ tự hợp lý theo liên kết nghĩa là A F G B E D C.）"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["2050年的汽车 · 清洁、安全","① 当前汽车的劣迹 ② 根本出路","汽车造成冰川融化、空气质量下降、石油紧缺、交通事故多；但不能动不动就淘汰汽车，根本出路是清洁环保、规范驾车。"],["2050年的汽车 · 自动行驶","① 职业司机引导 ② 自动停泊入位","无人干预的车辆将走进家庭；一名职业司机引导一长串汽车前行，抵达终点后车辆能自动停泊入位。"],["2050年的汽车 · 融合数字生活方式","① 车企与搜索引擎公司合作 ② 创造虚拟个人助理","搜索引擎公司加入汽车研发，车企与电脑公司合作成为潮流；虚拟个人助理为用户提供路线、交通信息和日程安排。"],["2050年的汽车 · 燃料的使用","① 电动汽车的优缺点 ② 汽油、柴油车的使用","电动汽车比重会提高，但电池重、造价贵、充电时间长；长途行车可能还用汽油或柴油，所以要提高燃料效率，减少废气排放。"]]},PZ:{title:"篇章（2）词汇衔接",vn:"Liên kết từ vựng",intro:"Khi thuyết minh, miêu tả một sự vật hay một cảnh, một số từ <b>có liên hệ với nhau về nghĩa</b> (cùng miêu tả một đối tượng, trái nghĩa, cùng một trường nghĩa…). <b>Liên kết từ vựng</b> là mối liên hệ ngữ nghĩa giữa các từ trong văn bản — nó giữ cho đoạn văn <b>mạch lạc</b>. Đây cũng là chìa khóa cho dạng <b>sắp xếp câu</b> và <b>chọn câu điền đoạn</b> trong HSK6.",ex:[["电动汽车也许能承受超远距离行驶，但电池可能很<b>重</b>，造价可能很<b>昂贵</b>，充电的时间可能很<b>长</b>。","“重、昂贵、长” cùng miêu tả pin vượt mức “vừa phải”."],["被引导车辆上的驾驶者可以<b>工作</b>，也可以<b>休息</b>，职业司机的工作效益也将大大提高。","Cặp trái nghĩa “工作—休息” tạo liên hệ ngữ nghĩa."],["我的房间靠近大海，宽敞明亮，有室内<b>卫生间</b>和<b>淋浴设备</b>，还有一个<b>小阳台</b>可以观赏窗外的大海。","“卫生间 · 淋浴设备 · 小阳台” cùng là tiện nghi trong phòng."]],q:"根据词汇语义上的联系，把下列6个小句组合成3个连贯的语段",pvn:"A. 下了火车，我做的第一件事就是买一份当地的报纸，迫不及待地在路边翻看起来　B. 我们结婚十年了，大女儿七岁，小女儿四岁　C. 我一向对做家事十分痛恨，但对做菜却是十分有兴趣　D. 几只洋葱，几片肉，一把粉丝，一会儿就变出一个菜来，我很欣赏这种艺术　E. 翻着翻着，竟然发现满满一版的招聘启事，我高兴得眉飞色舞　F. 十年来我的一个突出感觉就是我的妻子从来不认错",practice:[["语段（1）：哪两句？","A + E（翻看 — 翻着翻着；报纸 — 一版）"],["语段（2）：哪两句？","B + F（结婚十年 — 十年来；女儿 — 妻子）"],["语段（3）：哪两句？","C + D（做菜 — 洋葱、肉、粉丝、变出一个菜）"]]},DP:[{title:"词汇（1）：熟悉下列反义词",vn:"8 cặp trái nghĩa.",items:[["苏醒 ↔ 昏迷","sūxǐng ↔ hūnmí","tỉnh lại ↔ hôn mê","","病人昏迷了三天，今天终于苏醒了。"],["粗鲁 ↔ 文雅","cūlǔ ↔ wényǎ","thô lỗ ↔ nho nhã","","他说话很文雅，一点儿也不粗鲁。"],["野蛮 ↔ 文明","yěmán ↔ wénmíng","dã man ↔ văn minh","","要文明待人，不能野蛮行事。"],["丰满 ↔ 枯瘦","fēngmǎn ↔ kūshòu","đầy đặn ↔ gầy guộc","","她以前很丰满，生病后变得很枯瘦。"],["歧视 ↔ 尊敬","qíshì ↔ zūnjìng","kỳ thị ↔ tôn trọng","","我们应该尊敬每一个人，不能歧视别人。"],["机智 ↔ 愚笨","jīzhì ↔ yúbèn","nhanh trí ↔ ngu dốt","","他机智地回答了问题，一点儿也不愚笨。"],["啰唆 ↔ 简洁","luōsuo ↔ jiǎnjié","dài dòng ↔ ngắn gọn","","文章要简洁，不要啰唆。"],["固执 ↔ 随和","gùzhí ↔ suíhe","cố chấp ↔ dễ tính","","他很随和，从来不固执己见。"]]},{title:"词汇（2）：熟悉下列词语搭配",vn:"8 từ & cách kết hợp.",items:[["剥削","bōxuē","bóc lột","剥削阶级","剥削阶级利用他们占有的生产资料剥削其他阶级的劳动。"],["格局","géjú","cục diện, bố cục","打破格局","经济迅速发展，不断打破旧格局，形成新格局。"],["掠夺","lüèduó","cướp đoạt","掠夺资源","他们在该地区大肆掠夺资源，造成当地人民生活困苦。"],["提拔","tíbá","đề bạt","提拔干部","提拔干部之前一定要经过严格的考察。"],["调解","tiáojiě","hòa giải","调解矛盾","这是一家专门帮人调解矛盾和纠纷的机构。"],["侮辱","wǔrǔ","sỉ nhục","侮辱人格","这种侮辱他人人格的做法是极不道德的。"],["谣言","yáoyán","tin đồn nhảm","传播谣言","请不要到处传播这种没有事实根据的谣言。"],["征收","zhēngshōu","trưng thu","征收税款","国家对公民征收个人所得税，公民应该依法纳税。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"改变农村落后面貌，建设小康村是一项系统工程，各级干部必须全身心地投入，全方位地服务，不仅要为条件好的村“锦上添花”，更要为基础差的村“雪中送炭”。",o:["贫穷地区需要更多扶助","要系统地帮助农村脱贫","必须关心农村工程建设","农村要建设得更有特色"],a:0,why:"<span class='zh'>更要为基础差的村“雪中送炭”</span> → vùng nghèo cần giúp nhiều hơn. Có <span class='zh'>锦上添花</span> (từ mới!)."},{n:2,say:"2010年，北京某出版社为了策划“四书五经精选”系列图书，设计了一个采访题目：“中国人你知道四书五经具体是哪些书吗？”采访一天以后，他们发现被采访的人中十之六七不能全部说出来。",o:["四书五经是一本书","2010年没人再看四书五经了","不少人不能把四书五经名字说全","北京很多出版社都想出版四书五经"],a:2,why:"“十之六七不能全部说出来”."},{n:3,say:"青少年都有自己的兴趣爱好，这些兴趣和爱好若能及早得到培养，就能形成特长。老师根据学生的爱好，有意识地加以引导，学生就可能在自己爱好的领域施展才华、发展特长。",o:["人的“特长”不是培养出来的","每个人都盼望做自己喜欢的工作","每个学生至少能在一方面施展才华","老师要因材施教，对学生加以引导"],a:3,why:"“老师根据学生的爱好，有意识地加以引导” = <span class='zh'>因材施教</span>."},{n:4,say:"从人类诞生的那一刻起，动物就成为人类密不可分的伴侣。在人类寂寞而漫长的进化行程中，动物像忠实的朋友一样始终陪伴左右，然而，作为和人一样有生命有感觉的存在，它们却一直被排除在人类的伦理视野之外。",o:["人类离开动物不能生活","动物是人类的精神支柱","动物和人具有平等的权利","人类没有平等地对待动物"],a:3,why:"“一直被排除在人类的伦理视野之外”. Có <span class='zh'>伴侣 · 排除</span>."},{n:5,say:"燃煤会产生二氧化碳和二氧化硫，二氧化碳积聚在地面，会像玻璃罩一样，阻断地面热量向空中散发，使地球表面温度升高，形成“温室效应”。“温室效应”会使全球气候异常，引发干旱或洪涝，还会使冰山融化，海平面升高，海拔较低的国家或岛屿就会被淹没。",o:["气候异常必然导致温室效应","二氧化碳凝聚后变成玻璃罩","温室效应的产生与燃煤有关","气候变化的趋势是温室效应"],a:2,why:"Đốt than → CO₂ → hiệu ứng nhà kính. A đảo ngược nhân quả."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：各位网友大家好。今天来到现场的是我们的同龄人丁然，他将跟我们聊聊他的职场经历。他在一家公司工作，到这家公司之前，他跳槽5次，换过6家公司。他从来没见过一家公司像现在这家这么穷，也没见过一家公司有这么多笑声。当初他毅然落脚在这家公司，就是对那么多同事为什么能悠然自得地待在这家有欠薪记录的公司里十分纳闷，没想到的是，现在他也成了他们中的一员。丁然，能不能给我们介绍一下你们公司？\n男：这家公司算上老总和他的助理共24个人。没有司机，没有清洁工，没有自己的保安。偶尔会开不出支，但最迟三两个月就能补上，绝不少发。就是这么一家亏损的小企业，员工却十分稳定，三年来只有两个人离职。\n女：哦，企业日子过得也很节省吧?\n男：是啊。为了省钱，办公用纸要双面使用，之后会收集起来卖废品；圆珠笔没水了，就去办公室更换笔芯。\n女：好多公司都有集体活动，什么卡拉OK、自助餐，甚至出国旅行，你们有吗？\n男：只有一次，老总决定带大家去植物园踏青，说是健康又环保，关键是省钱，植物园门票便宜。就这，老总还千叮咛万嘱咐，别买他的票，他自己有公园年票。\n女：你们公司除了穷，还有什么特殊之处啊？\n男：公司虽然穷，但业务应酬不少，时不时就能收到客户送来的各式礼物：水果、月饼、洗发水、饮料之类的。无论收到什么，通常的做法就是充公。于是我们每个人的桌子上就会有几个水果、两瓶饮料，要是有了月饼，嘿嘿，那就得看谁眼疾手快了。\n女：嗯，单位气氛好，老总还真没架子哈。\n男：记得有一次我生病，副总和同事一个月来了三次，买的补品和水果价钱不高，却全都对症适用。他们都是细心温暖的人。\n女：这样的工作环境，确实会让人心情愉快。\n男：其实心情是小事，关键是我认准了，一个内心积极温暖的人，一定会有光明美好的前途，所以我看好我们的公司。",qs:[{n:6,q:"关于男的的职场经历，下列哪项正确？",o:["他讨厌工作不严肃","他炒过公司的鱿鱼","公司效益不好他就走","收入没有保障他不干"],a:1,why:"“跳槽5次” = <span class='zh'>炒公司的鱿鱼</span> (tự nghỉ việc)."},{n:7,q:"最初男的为什么选择了现在这家公司？",o:["他很受重用","领导很明智","好奇心驱使","职位非常好"],a:2,why:"“十分纳闷” vì sao đồng nghiệp ở lại → tò mò."},{n:8,q:"关于这家公司，下列哪项正确？",o:["偶尔会迟发工资","做废品回收业务","社会责任感很强","常组织集体活动"],a:0,why:"“偶尔会开不出支，但最迟三两个月就能补上”."},{n:9,q:"生病的经历让他有了怎样的感触？",o:["同事很会买水果","领导同事很体贴","公司确实手头紧","谁都渴望被关心"],a:1,why:"“他们都是细心温暖的人”."},{n:10,q:"男的看好这家公司的理由是什么？",o:["同事之间的友情","讨人喜欢的领导","轻松友好的氛围","光明美好的前途"],a:3,why:"“一个内心积极温暖的人，一定会有光明美好的前途”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"自世界上第一辆自行车问世至今已有200多年的历史了。\n18世纪末，法国人发明了最早的自行车。它是木制的，结构比较简单，不能转向，骑车人用双脚用力蹬地前行，改变方向时也只能下车搬动车子。即使这样，当发明人骑着这辆自行车出现在公众面前时，在场的人仍十分惊异。\n世界上第一批真正实用的自行车出现于19世纪初。1817年，德国人在法国巴黎发明了带车把的木制两轮自行车，它最大的进步是可以改变方向了，它一问世便引起了人们极大的兴趣，之后不仅有成百上千辆自行车涌上了街头，法国政府还为邮差配备了自行车作为交通工具。\n随后，自行车的技术、性能不断得到改进。1839年，英国人发明了蹬踏式脚蹬驱动自行车，骑车时两脚不用蹬地，并提高了行驶速度。1869年诞生的雷诺型自行车，车架改由钢管制作，车轮也改为钢圈和辐条，采用实心轮胎，自行车更加轻便了。1887年，英国人劳森完成了链条驱动自行车的设计。同年，英国人研制出了充气轮胎。从此，自行车技术开始走向商业化，实现批量生产并投入市场。",qs:[{n:11,q:"世界上最早的自行车出现在街头时，人们是什么态度？",o:["赞叹","吃惊","无所谓","感兴趣"],a:1,why:"“在场的人仍十分惊异”. D là phản ứng với xe 1817."},{n:12,q:"哪国人发明了自行车？",o:["法国人","德国人","英国人","中国人"],a:0,why:"“18世纪末，法国人发明了最早的自行车”."},{n:13,q:"英国人在哪方面对自行车的发展做出了贡献？",o:["材料","用途","营销方式","市场开发"],a:0,why:"Bàn đạp, xích, lốp hơi — key: A (vật liệu, cấu tạo)."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"你想知道我设计的未来汽车什么样吗？让我来告诉你吧！\n这款汽车是水、陆、空三用车。它不用汽油，而是以太阳能做燃料，当然它也不排放有害气体。形容它的速度，“奔驰”“驰骋”这样的词汇都用不上了，它的速度和光的速度差不多。这种汽车没有方向盘，只有一块超薄屏幕，显示着你所在的方位、本地区的交通要道和世界各地的地图。当然GPS导航系统是必不可少的，只要你说出自己想去的地方，汽车就会把你送到目的地。\n这款车在行驶过程中能自动调节车速以及车内温度和光线，前方出现阻碍，它会自动避开，因此在陆地上行驶它安全可靠。下雪天，汽车会伸出两根滑板，这样在雪地里它也是来去自如。\n在空中飞行时，它平稳无噪声，就像坐在自家的沙发上一样，对了，它还能够像直升飞机一样升降。\n在水面上行驶时，车的轮胎会自动变大，浮力也随之变大，速度可达每小时5000海里。想拥有一辆这样的车吗？这并不难，我发明的这款车物美价廉，人人都买得起。",qs:[{n:14,q:"这款未来汽车的燃料是什么？",o:["汽油","空气","太阳能","有害气体"],a:2,why:"“以太阳能做燃料”."},{n:15,q:"这款未来汽车的速度怎样？",o:["跟鸟飞得一样快","和光的速度不相上下","跟“奔驰”汽车的速度一样","和声音在空中传播的速度相当"],a:1,why:"“它的速度和光的速度差不多”."},{n:16,q:"这款未来汽车还有什么优点？",o:["不再需要GPS导航系统","汽车座椅是宽大的沙发","能够在平坦的冰面上滑行","在水面上行驶速度也很快"],a:3,why:"“速度可达每小时5000海里”."},{n:17,q:"根据这段话，可以知道什么？",o:["这款车价格昂贵","这款车已经大量生产","这款车是说话人心中的理想","这款车可以在陆地、空中、水下使用"],a:2,why:"“我设计的未来汽车” — chỉ là tưởng tượng. D: trên <b>mặt</b> nước, không phải dưới nước."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["那不是失败，而且是成功的开始。","毫无疑问，甲、乙、丙三人都应对丁的重伤承担责任。","《中国科技发展报告》基本勾勒出了“中国制造”的轮廓。","那姑娘一听，眼泪便如断线的珍珠一样流了下来，她用手帕擦着眼泪，一句话也说不出来。"],a:0,why:"<b>Quan hệ từ sai</b>: <span class='zh'>不是……而是……</span>, không phải <span class='zh'>而且</span>."},{n:19,o:["在世界上人口密度最高的地方是哪儿？","他的脾气变得更加暴躁，甚至喜怒无常，常常动不动就发火。","你有时间就来串门儿吧，我们家平时就我爱人，你们又谈得来。","终端交通控制站的主要任务是调度、指挥飞机的停泊、着陆和起飞。"],a:0,why:"<b>Giới từ làm mất chủ ngữ</b>: bỏ <span class='zh'>在</span> → <span class='zh'>世界上人口密度最高的地方是哪儿？</span>"},{n:20,o:["飞机都有两个机翼，像小鸟的翅膀一样，它们能产生升力，把飞机托起来。","沼气是一种廉价的能源，可以点灯、做饭，还能代替汽油、柴油，是一种理想的气体燃料。","近年，石油植物引起了人们的兴趣，菲律宾种植的1万多公顷银合欢树，6年后将可收获石油13万吨就是一例。","我喜欢我们的校园，最喜欢的是老图书馆一带：灰色的资料楼、风味古老的图书馆和绿莹莹的草坪，能让人躁动的心立刻安静下来。"],a:3,why:"<b>Phối hợp / thiếu chủ ngữ</b>: vế cuối thiếu chủ ngữ (<span class='zh'>这里</span>) và <span class='zh'>风味古老</span> dùng không hợp — đáp án sách: D."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"她又被带刺的玫瑰花给___到了，她老学不会___这些以伤人为乐的花树，她手上深浅___的伤痕都是拜它们所赐。",o:["刺　逃避　各异","扎　避开　不一","割　离开　纷呈","拉　远离　配备"],a:1,why:"<span class='zh'>被刺扎到</span> (bài 20); <span class='zh'>避开</span>; <span class='zh'>深浅不一</span>."},{n:22,text:"炒作，当然不能___否定。适度的炒作，对于一部好作品，___锦上添花。不过，如果是无中生有，___捏造，即便轰动一时，恐怕___还是免不了遭到人们的唾弃。",o:["悉数　不得已　试图　终点","大体　不外乎　随便　后果","一致　相当于　力求　出路","一概　无异于　凭空　最终"],a:3,why:"<span class='zh'>一概否定</span>; <span class='zh'>无异于锦上添花</span>; <span class='zh'>凭空捏造</span>; <span class='zh'>最终</span>."},{n:23,text:"市场经济条件下的社会分工是一种以___最大化为根本原则的自由组合，过程中充满着实力___、竞争较量，最后在适者___、优胜劣汰中完成分工，双赢或多赢是经济___的基础。",o:["利益　对比　生存　发展","好处　对照　活命　效益","甜头　比较　存在　运行","益处　比赛　长存　规范"],a:0,why:"<span class='zh'>利益最大化</span>; <span class='zh'>实力对比</span>; <span class='zh'>适者生存</span>; <span class='zh'>经济发展</span>. Có <span class='zh'>优胜劣汰</span>!"}]},read3:{ins:"第24–28题：选句填空。",text:"1666年，英国伦敦发生了一场火灾，大火烧了4天，难以遏制，烧毁了1300多座房屋以及著名的圣保罗教堂。(24)，开始意识到城市消防工作的重要，并开始在消防工具上动脑筋。\n1673年，荷兰人发明了用皮革做的软输水管用于灭火。之后，(25)。再之后，消防汽车问世了。令人啼笑皆非的是，当年英国的消防汽车首次执行任务，司机没等消防队员全部上车就把车开了出来，没上去车的消防队员靠着两条腿，不仅追上，还跳上了汽车。当这台消防汽车抵达现场时，后续的消防马车也赶到了，(26)。\n大多数国家的消防车都是红色的，因为红色最为醒目，(27)。据调查，红色消防车每出车10万车次，肇事32次，如果消防车涂为黄色，每出动10万车次，肇事可降低到14.5次。因为淡色会使汽车的轮廓显得大些，有距自己更近的感觉，对交通安全有利。然而消防部门却坚持采用红色而非黄色，他们认为黄色会使人情绪安定，(28)，而红色则能激发人的斗志。",opts:["可见那辆消防车的表现多么差劲","从很远的地方就能看到","无益于救火效率","人类付出了惨重的代价以后","英国人发明了比软输水管效率更高的有车轮的灭火机"],ans:{24:3,25:4,26:0,27:1,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"我最怕遭受交通堵塞的折磨，每到这时候，我真恨不得驾着车腾空而起，从天上飞过去！这在今天还是幻想，或许不久的将来，无人空中交通方式SkyTran就会是一个不错的解决方案。\n简单来说，SkyTran就是在城市上空建造一个空中汽车轨道，然后利用磁悬浮技术，打造一个小型化、个人化的交通运输系统。不同于传统轻轨或者地铁运行方式的是，SkyTran没有固定站点和运行时刻表，它会打造一系列临时出站口，乘客可以通过手机提前预订车厢，定制私人行程，不需每个站点都停车。这样，在舒适度大大提高的同时，还能确保交通时间大大缩短。\n与传统公共交通方式相比，SkyTran是一套更为高速、安全、绿色、安静的全新通勤方式。这套系统使用磁悬浮技术驱动汽车，电磁铁产生的升力推动汽车前进，因此极其节能，这将令那些电力供应不足的国家受益良多。\nSkyTran公司总裁表示：“被拥堵在车流中是现代社会生活中最让人崩溃、无奈的情形了，我们希望能够让人们的生活变得更加简单、高效，而高速交通系统则是解决这一问题的最好途径。”",qs:[{n:29,q:"每次碰到堵车时，我就会：",o:["想坐飞机","希望飞过去","盼着警察出现","痛恨汽车太多"],a:1,why:"“恨不得驾着车腾空而起，从天上飞过去”."},{n:30,q:"SkyTran与传统轻轨或者地铁不同的是：",o:["旅客不用排队等车","每个站点都要停车","乘客必须提前预订车票","没有固定的运行时刻表"],a:3,why:"“没有固定站点和运行时刻表”. C: <span class='zh'>可以</span> đặt trước, không phải <span class='zh'>必须</span>."},{n:31,q:"SkyTran的优势是：",o:["能节约能源","能避免交通事故","能减少人们的精神压力","能改变人们的生活节奏"],a:0,why:"“因此极其节能”."},{n:32,q:"最适合做上文标题的是：",o:["欢迎你：SkyTran！","理想总会成为现实","SkyTran：未来的空中的士","生活中本来就充满幻想"],a:2,why:"Toàn bài giới thiệu SkyTran — “taxi trên không” tương lai."}]},{ins:"第33–36题：请选出正确答案。",text:"到2040年，出租车将由机器人驾驶，商店将成为网店的展览室，呼叫中心将聘用智能机器人。这是最近一份研究报告描绘的景象，报告称，机器人将在不到30年内彻底改变我们的生活和工作。那时，机器人将成为人类强大的竞争对手，我们也许不得不去找外科大夫“为我们的大脑补充处理能力”，我们也许还会要求植入仿生手使我们能像机器一样快地完成各种任务。到了那一天，按优胜劣汰的原则，谁都不能担保我们人类在竞争中处于优势。\n未来学家说，机器人走进生活，劳动者的就业安全感会降低，人们的工作时间也许会增加，由当前的每周工作37.4小时延长到50.5小时。这份令人丧气的研究报告预言，机器人将逼迫我们在卧室里分不同时段兼做几份“散工作”，于是，乘车上下班、工作之余和同事喝一杯、在办公室举办圣诞派对、找借口说“亲爱的，我要加个班”等都将不复存在。\n今天的家长，如果想让你的孩子25年后找到工作，就应当用前瞻性眼光为其选好专业。网络安全、软件、机器人技术都将是主要领域；老年人护理也将是一个有增长潜力的工种；建筑工人也不会失业，因为不断增加的人口需要住房。\n未来学家认为，那时，我们当中许多人将成为“多面手”。一名劳动者也许会为纽约的雇主进行客户服务，帮新加坡的老板追账，为新德里的一个品牌提供营销策略……",qs:[{n:33,q:"2040年，我们的生活中：",o:["出租车将不复存在","商店里不再有物品","机器人将大量存在","网络购物将成为过去"],a:2,why:"Taxi, tổng đài… đều dùng robot."},{n:34,q:"按未来学家的说法，机器人时代会怎样？",o:["经济全球化进一步加剧","人类的劳动强度会降低","擅长多种技能的人会更多","老年人成为机器人的最爱"],a:2,why:"“许多人将成为‘多面手’”. B sai: giờ làm tăng."},{n:35,q:"机器人将来成为人类强大的竞争对手后，人类可能：",o:["利用业余时间补课","请大夫帮忙提高智力","向机器学习劳动技巧","与机器人比永远是强者"],a:1,why:"“找外科大夫‘为我们的大脑补充处理能力’”."},{n:36,q:"与文中第3段中画线词语“前瞻性眼光”意思最接近的是：",o:["瞻仰的眼光","敏锐的眼光","预见性眼光","实事求是的眼光"],a:2,why:"<span class='zh'>前瞻</span> = nhìn về phía trước → <span class='zh'>预见性</span>."}]}]},W:{task:"这篇课文给我们描述了2050年的汽车是什么样子的。2050年的汽车将会更加清洁、安全；实现自动行驶；融合数字生活方式，为汽车用户提供全方位服务；电动汽车的数量将会增加，汽油、柴油等燃料仍会继续使用，但使用效率将会提高。请参考练习5，把课文缩写成350字左右的短文。",target:350,steps:[["Mở bài","Kẹt xe → mơ xe biết bay; năm 2050 xe ra sao — 4 điểm."],["甲 Sạch, an toàn","Các <span class='zh'>指责</span>; không nên <span class='zh'>动不动就淘汰</span>; <span class='zh'>根本出路</span>."],["乙 Tự lái","<span class='zh'>无人干预 · 引导一长串汽车 · 自动停泊入位</span>."],["丙 Đời sống số · 丁 Nhiên liệu","Hãng tìm kiếm + trợ lý ảo; xe điện tăng nhưng có nhược điểm → xăng/dầu vẫn dùng, phải giảm khí thải."],["Kết","<span class='zh'>清洁、安全、可持续发展</span>. Dùng liên kết từ vựng cho mạch lạc."]],model:"2050年的汽车\n遇到交通堵塞时，人们常常希望汽车能飞起来。那么2050年的汽车会是什么样呢？以下四点大体勾画出了它的轮廓。\n第一，更加清洁、安全。现在人们指责汽车让冰川融化、空气质量下降、石油紧缺，还造成大量交通事故。但汽车是灵活的交通工具，动不动就淘汰它并不明智，根本出路是清洁环保、规范驾车。\n第二，能自动行驶。将来无人干预的汽车会走进家庭，一名职业司机可以引导一长串汽车前行，其他驾驶者可以工作或休息。汽车抵达终点后还能自动停泊入位。\n第三，融合数字生活方式。搜索引擎公司加入了汽车研发的行列，虚拟个人助理将为用户提供路线、交通信息和日程安排等服务。\n第四，长途行车仍靠汽油。电动汽车的比重会提高，但电池重、造价贵、充电时间长，所以长途行车可能还要用汽油或柴油，因此必须提高燃料效率，减少废气排放。\n总之，2050年的汽车必须是清洁的、安全的，必须符合可持续发展的原则。",check:["Có tiêu đề","Có câu mở đầu nêu vấn đề","Có đủ 4 điểm 甲乙丙丁 (hoặc 第一……第四)","Có câu kết về phát triển bền vững","Dùng ít nhất 3: 大体 · 动不动 · 引导 · 抵达 · 配备 · 遏制 · 确保 · 代价","Khoảng 350 chữ"]},SUM:{words:["堵塞","滞留","折磨","担保","大体","轮廓","指责","融化","石油","事故","优胜劣汰","明智","出路","规范","谋求","干预","平坦","奔驰","试图","引导","效益","抵达","配备","停泊","力求","引擎","行列","潮流","锦上添花","保障","柴油","遏制","比重","昂贵","阻碍","排除","确保","排放","代价","伴侣","支柱"],patterns:[["动不动就 + V","动不动就要将其淘汰，似乎不是明智之举。"],["甲 / 乙 / 丙 / 丁","甲 更加清洁、安全；乙 能自动行驶……"],["是A，而非B","在2050年将会是必然的服务，而非锦上添花。"],["鉴于……","鉴于以上劣迹，人类会不会忍痛割爱？"],["篇章：词汇衔接","电池可能很重，造价可能很昂贵，充电的时间可能很长。"]],diff:["担保 + V / phân câu, không có tính danh từ — 保证 + N / V / phân câu, còn là danh từ (……是成功的保证)","行列 háng · 甲乙丙丁 = A B C D / Thiên can · 锦上添花 ↔ 雪中送炭 · 炒鱿鱼 = nghỉ việc / đuổi việc"],sentences:["别的不敢担保，以下四点大体为我们勾画出了2050年汽车的轮廓。","谋求这一交通工具的清洁、安全，是2050年对汽车最起码的要求。","它必须是清洁的、安全的，它必须符合可持续发展的原则。"],hw:["Học thuộc 52 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết tóm tắt bài khóa ~350 chữ (mục 7).","Học thuộc 10 Thiên can (甲乙丙丁戊己庚辛壬癸).","Làm Sách bài tập bài 22.","Đọc trước bài 23."]}});
