<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 25 · 草船借箭 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

",[],""],[51,"叹气","tàn qì","đgt.","thán khí","thở dài",1,"","心里感到不痛快而呼出长气，发出声音。","周瑜叹着气说","他叹了一口气。","Anh ấy thở dài một tiếng.",["唉声叹气"],"Bài tập 3②."],[52,"天才","tiāncái","dt.","thiên tài","thiên tài, bậc kỳ tài",1,"","有天才的人。","他真是天才","莫扎特是音乐天才。","Mozart là thiên tài âm nhạc.",[],""],[53,"高明","gāomíng","tt.","cao minh","cao siêu, tài trí, giỏi giang",1,"","（见解、技能）高超。","确实比我高明","这个办法很高明。","Cách này rất cao tay.",[],""]],extra:[["三国","Sān Guó","Tam Quốc (220–280)"],["周瑜 · 诸葛亮","Zhōu Yú · Zhūgě Liàng","Chu Du · Gia Cát Lượng"],["曹操 · 鲁肃","Cáo Cāo · Lǔ Sù","Tào Tháo · Lỗ Túc"],["交战","jiāozhàn","giao chiến"],["设宴","shè yàn","bày tiệc"],["草把子 / 草捆儿","cǎokǔnr","bó cỏ"],["性命难保","xìngmìng nánbǎo","tính mạng khó giữ"],["绳索","shéngsuǒ","dây thừng"],["一字排开","yí zì páikāi","xếp thành hàng chữ nhất"],["擂鼓 / 敲鼓","léi gǔ / qiāo gǔ","đánh trống"],["返航","fǎnháng","quay về"],["上当","shàng dàng","mắc lừa"]],T:[{zh:"三国时期，东吴大将周瑜觉得自己很有才，却总比不过诸葛亮，心里一直不服气。一天，周瑜请来了诸葛亮，说：“我们就要跟曹操的军队打仗了。水上作战，用什么武器最好？”诸葛亮说：“弓箭。”周瑜说：“这话不假。可现在我们缺箭，当务之急是赶造十万支箭，造箭的事就由您承办吧。”诸葛亮说：“您委托的事，当然要办好。箭什么时候用？”周瑜说：“即将交战，十天怎么样？”诸葛亮说：“时间紧迫，三天也行。”周瑜说：“这是公务，可不能开玩笑。”诸葛亮说：“三天造不好箭，愿受惩罚。”周瑜很高兴，设宴款待诸葛亮。诸葛亮临走时叮嘱周瑜：“三天以后，请派人到江边来搬箭。”",vn:"Thời Tam Quốc, đại tướng Đông Ngô Chu Du tự thấy mình rất có tài, nhưng mãi không sánh được Gia Cát Lượng, trong lòng luôn không phục. Một hôm, Chu Du mời Gia Cát Lượng đến, nói: “Chúng ta sắp đánh nhau với quân Tào Tháo. Đánh trên sông, dùng vũ khí gì tốt nhất?” Gia Cát Lượng đáp: “Cung tên.” Chu Du nói: “Câu ấy không sai. Nhưng giờ ta thiếu tên, việc gấp nhất là làm gấp mười vạn mũi tên, việc làm tên xin giao cho ông đảm nhận.” Gia Cát Lượng nói: “Việc ông nhờ, đương nhiên phải làm cho tốt. Khi nào cần tên?” Chu Du nói: “Sắp giao chiến rồi, mười ngày được không?” Gia Cát Lượng nói: “Thời gian gấp rút, ba ngày cũng được.” Chu Du nói: “Đây là việc quân, không thể đùa đâu.” Gia Cát Lượng nói: “Ba ngày không làm xong tên, xin chịu phạt.” Chu Du rất mừng, bày tiệc khoản đãi Gia Cát Lượng. Lúc ra về Gia Cát Lượng dặn Chu Du: “Ba ngày sau, xin cho người ra bờ sông khiêng tên.”",idea:"Chu Du giao việc làm 10 vạn mũi tên.",q:["周瑜委托给诸葛亮什么事情？"],note:[["这话不假","Xem 篇章: 替代 — “这话” thay cho “(水上作战)(用)弓箭(最好)”."],["即将交战","Xem Ngữ pháp 1: <span class='zh'>即将</span>."],["愿受惩罚","Xin chịu phạt (quân lệnh trạng)."]]},{zh:"鲁肃对周瑜说：“十万支箭，三天怎么造得成？诸葛亮不会说话不算数吧？”周瑜说：“我又没有逼迫他，是他自己说的。我得吩咐下属，造箭用的材料，不要给他准备齐全，也不能供应充足，故意给他拖延时间。到期限造不出箭，他就活该受罚了。你去探听探听，他是怎么打算的，回来向我汇报。”",vn:"Lỗ Túc nói với Chu Du: “Mười vạn mũi tên, ba ngày làm sao xong được? Gia Cát Lượng chẳng lẽ nói không giữ lời?” Chu Du nói: “Ta có ép hắn đâu, là hắn tự nói. Ta phải dặn cấp dưới: vật liệu làm tên đừng chuẩn bị đầy đủ cho hắn, cũng không được cung cấp đủ, cố ý kéo dài thời gian của hắn. Đến hạn không làm ra tên, hắn đáng bị phạt. Ông đi dò xem hắn tính thế nào, rồi về báo cho ta.”",idea:"Chu Du cố ý gây khó.",q:["周瑜给诸葛亮制造了什么困难？"],note:[["我又没有逼迫他","<span class='zh'>又</span> nhấn mạnh phủ định (có phải ta… đâu)."],["故意给他拖延时间","<span class='zh'>故意</span> — nghĩa xấu (bài 24)."]]},{zh:"鲁肃去探望诸葛亮，见面寒暄过后，诸葛亮说：“三天，要十万支箭，你得帮帮我。”鲁肃说：“你不要为难我，我怎么帮得了你？”诸葛亮说：“你借给我二十条船，每条船上要三十名士兵。船用黑布遮挡严密，再把草捆成捆儿，共要一千个，排在船的侧面，我有用。不过这是机密，你得替我保密，不要走漏消息，否则我性命难保。”",vn:"Lỗ Túc đi thăm Gia Cát Lượng; hàn huyên xong, Gia Cát Lượng nói: “Ba ngày, cần mười vạn mũi tên, ông phải giúp tôi.” Lỗ Túc nói: “Ông đừng làm khó tôi, tôi giúp ông thế nào được?” Gia Cát Lượng nói: “Ông cho tôi mượn hai mươi chiếc thuyền, mỗi thuyền ba mươi lính. Thuyền che kín bằng vải đen, lại bó cỏ thành từng bó, cần một nghìn bó, xếp hai bên mạn thuyền, tôi có việc dùng. Nhưng đây là việc cơ mật, ông phải giữ bí mật giúp tôi, đừng để lộ tin, nếu không tính mạng tôi khó giữ.”",idea:"Mượn thuyền của Lỗ Túc.",q:["诸葛亮请鲁肃帮什么忙？"],note:[["否则我性命难保","Xem 篇章: 替代 — “否则” thay cho “(如果)走漏了消息”."]]},{zh:"鲁肃答应了，回来报告周瑜，果然没提借船的事，只说造箭的材料诸葛亮都不用。周瑜沉思良久，猜不出诸葛亮的意图，只好等着。",vn:"Lỗ Túc nhận lời, về báo Chu Du, quả nhiên không nhắc chuyện mượn thuyền, chỉ nói vật liệu làm tên Gia Cát Lượng đều không dùng. Chu Du trầm ngâm hồi lâu, không đoán ra ý đồ của Gia Cát Lượng, đành chờ xem.",idea:"Lỗ Túc giữ bí mật.",q:["鲁肃替诸葛亮保密了吗？"],note:[["果然","Quả nhiên (đúng như đã hứa)."],["沉思良久","Trầm tư hồi lâu."]]},{zh:"鲁肃私自弄来二十条快船，按诸葛亮说的安排妥当。头两天，诸葛亮那儿毫无动静，第三天过了午夜，诸葛亮把鲁肃请到船上，说：“和我一起去取箭。”之后吩咐用绳索把船连在一起，朝曹操占领的北岸开去。",vn:"Lỗ Túc tự mình kiếm được hai mươi chiếc thuyền nhanh, sắp xếp ổn thỏa theo lời Gia Cát Lượng. Hai ngày đầu, bên Gia Cát Lượng chẳng có động tĩnh gì; ngày thứ ba quá nửa đêm, Gia Cát Lượng mời Lỗ Túc lên thuyền, nói: “Cùng tôi đi lấy tên.” Rồi sai dùng dây thừng nối các thuyền lại với nhau, tiến về bờ bắc nơi Tào Tháo chiếm giữ.",idea:"Xuất phát đêm thứ ba.",q:["诸葛亮什么时候行动？"],note:[["毫无动静","Không chút động tĩnh."],["取箭","“Lấy” tên — hài hước, vì thật ra là “mượn” của địch."]]},{zh:"此时，大雾封锁了江面，不远处什么都看不清，船悄悄地靠近了曹操的驻扎地。士兵在诸葛亮指定的地点，将船头朝西，船尾朝东，一字排开。船上的士兵奋力敲鼓，齐声高喊，声音能多响亮就多响亮。鲁肃吃惊地说：“曹兵出来怎么办？”诸葛亮笑答：“雾这么大，曹操不敢派兵出来。”鲁肃跟诸葛亮来到船上，看到舱中已摆下酒菜，只得心神不定地与诸葛亮饮酒。",vn:"Lúc ấy sương mù dày đặc phong tỏa mặt sông, gần đó cũng chẳng nhìn rõ gì, thuyền lặng lẽ áp sát nơi đóng quân của Tào Tháo. Binh lính ở chỗ Gia Cát Lượng chỉ định, cho mũi thuyền hướng tây, đuôi thuyền hướng đông, xếp thành một hàng. Lính trên thuyền ra sức đánh trống, đồng thanh hò hét, tiếng càng vang càng tốt. Lỗ Túc hoảng hốt: “Quân Tào kéo ra thì sao?” Gia Cát Lượng cười đáp: “Sương mù dày thế này, Tào Tháo không dám cho quân ra.” Lỗ Túc theo Gia Cát Lượng vào thuyền, thấy trong khoang đã bày sẵn rượu thức ăn, đành lòng dạ không yên mà uống rượu cùng Gia Cát Lượng.",idea:"Áp sát trại Tào, đánh trống.",q:["诸葛亮一方是怎么做的？"],note:[["声音能多响亮就多响亮","Xem Ngữ pháp 2: <span class='zh'>能A就A</span>."],["只得心神不定地……","Đành (miễn cưỡng)… với lòng dạ không yên."]]},{zh:"曹操听到鼓声和叫喊声响成一片，嘱咐下属：“江上大雾茫茫，我们弄不清情况，不要轻易出兵。”于是，调动了上万名弓箭手一齐朝传来鼓声的方位放箭，箭像雨点一样落在船上。一会儿，诸葛亮下令把船掉过来，船头朝东，船尾朝西。士兵们情绪高涨，依旧敲鼓高喊，逼近曹军去受箭。",vn:"Tào Tháo nghe tiếng trống và tiếng hò reo vang thành một dải, dặn thuộc hạ: “Trên sông sương mù mịt mùng, ta không rõ tình hình, đừng khinh suất xuất quân.” Thế là điều hơn vạn cung thủ đồng loạt bắn về hướng có tiếng trống, tên rơi xuống thuyền như mưa. Một lúc sau, Gia Cát Lượng ra lệnh quay thuyền lại, mũi hướng đông, đuôi hướng tây. Binh lính phấn khởi, vẫn đánh trống hò reo, áp sát quân Tào để “nhận” tên.",idea:"Tào Tháo cho bắn tên.",q:["曹操一方是怎么做的？"],note:[["箭像雨点一样落在船上","So sánh."],["把船掉过来","Quay thuyền để mặt bên kia cũng nhận tên."]]},{zh:"凌晨，雾还笼罩着江面，船两边的草捆儿上插满了箭。诸葛亮命令士兵启程返航。曹操知道上当了，可诸葛亮的船已经走远了。",vn:"Rạng sáng, sương vẫn bao phủ mặt sông, những bó cỏ hai bên thuyền đã cắm đầy tên. Gia Cát Lượng ra lệnh cho binh lính lên đường quay về. Tào Tháo biết mình mắc lừa, nhưng thuyền Gia Cát Lượng đã đi xa.",idea:"Thuyền cắm đầy tên quay về.",q:["结果怎么样？"],note:[["上当","Mắc lừa."]]},{zh:"二十条船靠岸的时候，周瑜派来搬箭的人也到了。大致算了算，船上的箭共有十万多支，诸葛亮圆满完成了任务。鲁肃见了周瑜，告诉他借箭的经过。周瑜叹着气说：“唉，他真是天才，确实比我高明！”",vn:"Lúc hai mươi chiếc thuyền cập bờ, người Chu Du phái đến khiêng tên cũng tới. Đếm sơ qua, trên thuyền có hơn mười vạn mũi tên, Gia Cát Lượng đã hoàn thành nhiệm vụ một cách tốt đẹp. Lỗ Túc gặp Chu Du, kể lại chuyện mượn tên. Chu Du thở dài nói: “Haizz, hắn đúng là thiên tài, quả thật cao minh hơn ta!”",idea:"Chu Du chịu phục.",q:["周瑜的反应是什么？"],note:[["大致算了算","Xem 辨析 大致—大体."],["确实比我高明","Kết bài khép lại mở bài: từ “不服气” đến “服了”."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"即将",zh:"即将",py:"jíjiāng",tag:"Chú thích 1 · phó từ",mean:"Phó từ = <span class='zh'>将要 · 就要</span>: <b>sắp, sắp sửa</b>. Phần lớn dùng trong <b>văn viết</b>.",forms:["S + 即将 + V","即将 + V + 的 + N"],ex:[["诸葛亮说：“您委托的事，当然要办好。箭什么时候用？”周瑜说：“即将交战，十天怎么样？”","",1],["我们已经完成了学业，即将走上工作岗位，开始人生新的一页。","Chúng tôi đã hoàn thành việc học, sắp bước vào công việc, mở trang mới của đời."],["熊妈妈和她的孩子们胖起来了，他们每天都吃得饱饱的，正在为即将开始的冬眠储存脂肪。","Gấu mẹ và các con béo lên, ngày nào cũng ăn no, đang tích mỡ cho kỳ ngủ đông sắp bắt đầu."]],tips:["Bài 20: <span class='zh'>将近 · 将要</span>.","Bài tập 2②. SBT câu 22A."],practice:{q:"用“即将”完成句子",type:"complete",items:[["他________，参加在多伦多举行的国际摄影展。","他即将去加拿大，参加在多伦多举行的国际摄影展。"],["8点40分，列车________终点。","8点40分，列车即将到达终点。"],["大学毕业那一年，她扔掉了所有的旧东西……没有丝毫的留恋，只有________新生活的兴奋与希望。","……只有即将开始新生活的兴奋与希望。"]]}},{id:"g2",grp:1,word:"响亮",zh:"能A就A",py:"néng A jiù A",tag:"Chú thích 2 · khẩu ngữ",mean:"Biểu thị <b>cố gắng hết mức</b> (= <span class='zh'>尽量</span>). A có thể là động từ, tính từ hoặc cụm động từ / tính từ; <b>hai A giống nhau</b>. Dùng trong khẩu ngữ.",forms:["能 + V / Adj + 就 + V / Adj","能 + 多 / 多少 + Adj / V + 就 + 多 / 多少 + Adj / V"],ex:[["这个手机没用多久，能修就修，尽量别换新的。","Điện thoại này chưa dùng bao lâu, sửa được thì sửa, cố đừng thay mới."],["这本书设计的时候能薄就薄，方便携带。","Cuốn sách này khi thiết kế càng mỏng càng tốt, cho dễ mang."],["这是我们家树上结的苹果，挺多的，你能拿多少就拿多少吧。","Táo nhà trồng, nhiều lắm, anh lấy được bao nhiêu thì lấy."],["船上的士兵奋力敲鼓，齐声高喊，声音能多响亮就多响亮。","",1]],tips:["Bài tập 2⑤."],practice:{q:"用“能A就A”改写句子",type:"complete",items:[["这是你自己的事，你尽量自己做吧。","这是你自己的事，能自己做就自己做吧。"],["他是个追求完美的人，什么事都尽量做到最好。","他是个追求完美的人，什么事能做到最好就做到最好。"],["那时候，我就想离开家，而且希望尽量走得远一点。","那时候，我就想离开家，而且希望能走多远就走多远。"]]}},{id:"g3",grp:0,word:"叮嘱",zh:"叮嘱 / 吩咐 / 嘱咐",py:"dīngzhǔ / fēnfù / zhǔfù",tag:"Nhóm từ “dặn dò”",mean:"<span class='zh'>叮嘱</span>: dặn <b>đi dặn lại</b>, ân cần. <span class='zh'>嘱咐</span>: dặn dò điều nên / không nên. <span class='zh'>吩咐</span>: <b>sai bảo, ra lệnh bằng lời</b> (trên → dưới).",forms:["再三叮嘱 + O","嘱咐 + O + V","吩咐 + 下属 / 人 + V"],ex:[["诸葛亮临走时叮嘱周瑜：“三天以后，请派人到江边来搬箭。”","",1],["我得吩咐下属，造箭用的材料，不要给他准备齐全……","",1],["曹操……嘱咐下属：“江上大雾茫茫……不要轻易出兵。”","",1]],tips:["Bài tập 2③, 3①."]},{id:"g4",grp:2,word:"大致",zh:"大致 / 大体",py:"dàzhì / dàtǐ",tag:"Xem 辨析 bên dưới",mean:"Đều = <b>tình hình chủ yếu, đa số</b> và <b>sơ lược, không chi tiết</b>. Chỉ <span class='zh'>大致</span> mới dùng cho <b>ước lượng không chính xác</b> (số lượng, thời gian) và làm được <b>tính từ</b>.",forms:["大致 / 大体 + 相同 / 了解 / 说……","大致 + 得 / 有 + số lượng"],ex:[["大致算了算，船上的箭共有十万多支……","",1]],tips:["Bài 22: <span class='zh'>大体</span>."]}],BX:{grp:2,word:"大致",cols:["大致","大体"],pair:"大致 — 大体",same:["① Biểu thị <b>tình hình chủ yếu, đa số</b>. ② Biểu thị <b>sơ lược, không chi tiết</b>.","大家的经历大致 / 大体相同。 / 我跟他大致 / 大体说了一下。"],diff:[["Biểu thị <b>ước đoán không chính xác</b>.","我大致得在那儿待三个月。（√）","<b>Không có</b> cách dùng này.<div class='zh' style='margin-top:4px'>我大体得在那儿待三个月。（×）</div>"],["<span class='zh'>大致</span> còn làm <b>tính từ</b>.","这只是一个大致的想法。","<b>Không có</b> cách dùng này."]],task:{q:"选择“大致”或“大体”改写句子（Câu 1–2 dùng được cả hai; chọn một）",cols:["大致","大体"],sample:!1,items:[["据我了解，茶叶的种类主要可以分为三种。→ ____可以分为三种","0,1","Tình hình chủ yếu → 大致 / 大体 đều được."],["我大概了解了一下，没几个人参与这件事。→ 我____了解了一下","0,1","Sơ lược → 大致 / 大体 đều được."],["要完成这项艰巨的工作，差不多得三个月。→ ____得三个月",0,"Ước lượng thời gian → chỉ 大致."],["我粗略地算了算，一个月得花不少钱呢。→ 我____算了算",0,"Ước tính → 大致 (đáp án sách)."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["承<u>办</u>","主办 · 举办 · 办理 · 办事"],items:[["款<u>待</u>","待","对待 · 亏待 · 等待 · 待命"],["充<u>足</u>","足","知足 · 足够 · 足球 · 心满意足"],["拖<u>延</u>","延","延期 · 延长 · 延后 · 延续"],["机<u>密</u>","密","秘密 · 密室 · 缜密 · 稠密"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["在发言中，市长指出：“现在最重要的是把经济搞上去。”→ ________","当务之急","在发言中，市长指出：“当务之急是把经济搞上去。”"],["各位乘客，飞机马上就要起飞了，请大家系好安全带。→ ________","即将","各位乘客，飞机即将起飞，请大家系好安全带。"],["临行前，妈妈再三对我说：“出门一定要注意安全。”→ ________","叮嘱","临行前，妈妈再三叮嘱我：“出门一定要注意安全。”"],["我们的科研经费足够了，请大家不要为此担心。→ ________","充足","我们的科研经费充足，请大家不要为此担心。"],["做任何事情我们都不要浪费，尽量节省一些。→ ________","能A就A","做任何事情我们都不要浪费，能省一点就省一点。"],["凌晨三点，天还没亮，他们就开始出发了。→ ________","启程","凌晨三点，天还没亮，他们就启程了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["拖延","委托","紧迫","期限","叮嘱"],text:"我们厂的一个大客户{委托}我们生产一批货，{期限}一周，不能{拖延}，到期交不了货，就要受罚。时间{紧迫}，老板再三{叮嘱}我们，一定要抓紧生产，按时交货。"},{bank:["意图","款待","叹着气","为难","寒暄"],text:"一个好久没联系的亲戚昨天来拜访我，见面{寒暄}以后，我做了一桌饭菜{款待}他，闲聊中，他说明了自己来访的{意图}，是想请我帮他在我们公司找个工作。这件事可真不好办，我{叹着气}说：“最近经济不景气，公司不需要那么多人，这件事让我很{为难}，我实在帮不了你。”"}]},EX4:{q:"请说出下列语段中的画线部分替代了什么内容",items:[{src:"",task:"这里大山环绕，交通不便，连一条像样儿的路都没有，村子里的老人甚至从来没去过城里。尽管<u>如此</u>，这儿的优美风景还是吸引了不少游客的目光。",model:"如此 = 这里大山环绕，交通不便，连一条像样儿的路都没有，村子里的老人甚至从来没去过城里。"},{src:"",task:"他们的产品质优价廉，不仅耐用，还很美观，因<u>此</u>，销售到了世界一百多个国家和地区。",model:"此 = 他们的产品质优价廉，不仅耐用，还很美观。"},{src:"",task:"去年八月他们离婚了，<u>当时</u>他没要任何东西，净身出户了。",model:"当时 = 去年八月（他们离婚的时候）"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["周瑜委托给诸葛亮什么事情？","① 造箭原因 ② 造箭时间 ③ 造箭数量","就要跟曹操的军队水上作战，弓箭最好，但现在缺箭；周瑜委托诸葛亮造箭，诸葛亮说三天就能造好十万支箭。"],["周瑜给诸葛亮制造了什么困难？","① 材料准备 ② 拖延时间","周瑜吩咐下属不给诸葛亮准备齐全造箭的材料，故意拖延时间，让他到期限造不出箭而受罚。"],["诸葛亮请鲁肃帮什么忙？","船、士兵、黑布、草捆儿、保密","诸葛亮请鲁肃借给他二十条船，每条船上三十名士兵，船用黑布遮挡，船两边放一千个草捆儿，还请他保密。"],["诸葛亮的计谋是什么？","① 诸葛亮一方：大雾、敲鼓、船一字摆开 ② 曹操一方：放箭 ③ 结果：插满了箭","第三天夜里大雾，诸葛亮把船一字排开靠近曹营，士兵敲鼓高喊；曹操不敢出兵，命令弓箭手放箭；结果船两边的草捆儿上插满了箭。"],["诸葛亮完成任务了吗？周瑜的反应是什么？","① 圆满完成 ② 叹着气说","诸葛亮借到了十万多支箭，圆满完成了任务；周瑜叹着气说诸葛亮真是天才，比自己高明。"]]},PZ:{title:"篇章（3）替代",vn:"Thay thế",intro:"<b>替代</b> là dùng một hình thức thay thế (đại từ, từ chỉ thị…) để thay cho một phần nội dung trong văn bản. Thay thế giúp <b>tránh lặp</b>, câu gọn hơn, đồng thời đóng vai trò <b>liên kết</b> trên dưới không thể bỏ qua. Từ thay thế hay gặp: <span class='zh'>这 · 那 · 此 · 如此 · 这样 · 当时 · 从此 · 否则 · 前者 · 后者</span>.",ex:[["……诸葛亮说：“弓箭。”周瑜说：“<b>这话</b>不假。……”","“这话” thay cho “（水上作战，）（用）弓箭（最好）”."],["……不过这是机密，你得替我保密，不要走漏消息，<b>否则</b>我性命难保。","“否则” thay cho “（如果）走漏了消息”."],["“你喜欢《红楼梦》还是《三国演义》？”“<b>前者</b>吧，我想”，莉莉说。","“前者” thay cho “《红楼梦》”."]],q:"指出下列句子中标有下划线的替代形式替代了哪些具体内容",pvn:"(1) “大数据”全在于发现和理解信息内容及信息与信息之间的关系，然而，直到最近，我们对<u>此</u>似乎还是难以把握。　(2) 1949年8月他离开生活了45年的中国，<u>从此</u>再也没有踏上中国的土地。　(3) 东芝公司在中国曾有<u>这样</u>一句广告语：“东芝，东芝，大家的东芝。”……",practice:[["(1) 此 = ?","大数据（全在于发现和理解信息内容及信息与信息之间的关系）"],["(2) 从此 = ?","从1949年8月（他离开中国）以后"],["(3) 这样 = ?","“东芝，东芝，大家的东芝。”"]]},DP:{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ (ngữ tố) để đoán nghĩa cả từ.",items:[["授予","shòuyǔ","trao tặng","授：交给 · 予：给","他被授予“优秀教师”称号。"],["解体","jiětǐ","tan rã","解：分开 · 体：整体","那个国家在1991年解体了。"],["交涉","jiāoshè","giao thiệp, đàm phán","交：互相 · 涉：牵涉，涉及","经过多次交涉，问题终于解决了。"],["抵制","dǐzhì","tẩy chay, chống lại","抵：抗拒 · 制：限定，用强力约束","我们要抵制不良风气。"],["便条","biàntiáo","mẩu giấy nhắn","便：简单的，非正式的 · 条：一小张纸","他给我留了一张便条。"],["势力","shìlì","thế lực","势：政治、经济、军事等方面的力量 · 力：力量","这个家族在当地势力很大。"],["协议","xiéyì","hiệp nghị, thỏa thuận","协：共同 · 议：意见，言论","双方签订了合作协议。"],["坚实","jiānshí","vững chắc","坚：结实 · 实：满，不空","打下坚实的基础。"],["攻克","gōngkè","đánh chiếm, vượt qua","攻：打击 · 克：战胜","科学家们攻克了这个难题。"],["华侨","huáqiáo","Hoa kiều","华：中国或中华的简称 · 侨：寄居在国外的人","他是一位在越南生活的华侨。"],["尖锐","jiānruì","sắc bén, gay gắt","尖：物体细小锋利的顶部 · 锐：锋利","他提出了一个很尖锐的问题。"],["补救","bǔjiù","cứu vãn","补：事后补充或改正 · 救：帮助，使脱离困难或危险","现在补救还来得及。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"中医的秘方特别有趣，老百姓都有这样的概念，说秘方往往是中医家族里边最核心的机密，要保密，坚决不能告诉别人，都是在自家枕头底下藏着或者在保险柜里锁着的。",o:["秘方往往不能外传","中医家里都有秘方","老百姓有自己的秘方","保险柜不如枕头底下可靠"],a:0,why:"“要保密，坚决不能告诉别人”. Có <span class='zh'>机密 · 保密</span>!"},{n:2,say:"她准备敲舱门的手久久举着，如同蟠桃园里被孙悟空施了定身法的瑶池仙女。直到有人从船舱另一侧走来，她才醒过神来，急匆匆地返回自己的舱里，趴在铺上牙咬枕巾哭泣起来。",o:["她非常难过","她刚刚睡醒","她在船上工作","她喜欢孙悟空"],a:0,why:"“牙咬枕巾哭泣起来”. B: <span class='zh'>醒过神来</span> = định thần lại, không phải ngủ dậy."},{n:3,say:"母亲双手合十，深深地低下了头。父亲缓慢地站起身，虽然热泪盈眶，却微笑着回过身来，抬起手给了儿子一记响亮的耳光，说道：“去了这么长时间！你这个调皮鬼，还记得有家！”",o:["母亲怀有深深的自责","父亲对儿子爱恨交加","儿子早就不想理父母了","父母已经不想认儿子了"],a:1,why:"Rưng rưng nước mắt (thương) + tát (giận) → <span class='zh'>爱恨交加</span>. Có <span class='zh'>响亮</span>."},{n:4,say:"陶侃手下的一些官吏喜欢喝酒，往往因此误了公务。陶侃知道了非常生气。他吩咐人把酒器一古脑儿扔到江里去，还把那些官吏鞭打了一顿。从此以后，大家都吓得不敢再喝酒了。",o:["陶侃对部下管理很严","陶侃气急了就会打人","陶侃善于动脑筋思考","陶侃的手下都很自觉"],a:0,why:"Vứt hết đồ đựng rượu, đánh roi quan lại → quản lý nghiêm. Có <span class='zh'>公务 · 吩咐</span>."},{n:5,say:"沃尔特的得力助手尤布很欣赏这只叫米奇的老鼠，他认为它的表情有点儿像沃尔特本人。沃尔特和尤布抓紧时间进行米老鼠的设计。他们避开其他画家们，躲到沃尔特家后面的一个车库里工作，为的是不走漏一点儿风声。",o:["追随沃尔特的画家很多","画家都喜欢在车库工作","尤布是个很能干的助手","天气不好沃尔特也工作"],a:2,why:"<span class='zh'>得力助手</span> = trợ thủ đắc lực. Có <span class='zh'>走漏风声</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：有报告显示，当前中国移动阅读用户规模已经达到2.42亿，移动阅读、电子阅读正成为当下国人阅读的新常态。张老师，您对此怎么看？\n男：我想，我们应该想清楚一个问题：读书对人生究竟意味着什么？\n女：您是怎样阅读的？\n男：我阅读也有一个变化过程的。我40岁之前，看的都是书本，是一个标准的书本族；2000年以后，我开始渐渐习惯在电脑上阅读，尤其是开通了微博以后，我花在电脑上的时间越来越多；接着又有了微信，一开始也是觉得好玩儿，渐渐发现自己离不开手机了，不知不觉中变成了一个手机族。\n女：您还是挺顺应时代潮流的呀！\n男：这样的生活让我产生了一种恐惧，我发现自己没有了读书的时间。而且，这些微博、微信上的内容大多都是“信息快餐”，90%的内容看完就忘记了，为了记住10%的东西，而浪费了90%的时间，于是我逼迫自己回归书本。\n女：您的做法是？\n男：我给自己立了个规矩，每天只在“垃圾时间”里看手机，剩下的时间还是读书，而且要说话算数。\n女：为什么这样呢？怎么阅读不是阅读啊？\n男：不一样。人们通过微信、微博阅读到的大多是资讯，而不是知识。手机阅读很轻松，但仅仅是表层阅读。表层阅读愉快，不怎么需要你思考，激起某种情感就过去了。\n女：那么，书本阅读应该称为深层阅读了？\n男：可以这么说。我们读书大多读的是知识，知识是完整的，它有一个体系，以一套系统来解释世界，它不是以碎片的方式存在的，我们阅读的时候是要静下心来细细思考、理解、消化、沉思的。",qs:[{n:6,q:"对于当下国人阅读的新常态，张老师怎么看？",o:["应先弄明白读书的意义","应先搞清楚人生的意义","人都不可能逆潮流而动","应认真考虑阅读的新趋势"],a:0,why:"“读书对人生究竟意味着什么？”"},{n:7,q:"关于张老师，下列哪项正确？",o:["勇于尝试新事物","只喜欢做书本族","从年轻时就是手机族","感觉电脑阅读优于读书"],a:0,why:"Từ sách → máy tính → Weibo → WeChat: dám thử cái mới."},{n:8,q:"张老师因为什么恐惧过？",o:["记忆力越来越差","浪费了90%的人生","垃圾信息数量惊人","自己没有时间读书了"],a:3,why:"“我发现自己没有了读书的时间”."},{n:9,q:"关于表层阅读和深层阅读，下列哪项正确？",o:["表层阅读需调整情绪","表层阅读是休闲阅读","深层阅读讲究连续性","胃口不好的人无法深层阅读"],a:1,why:"“手机阅读很轻松……表层阅读愉快，不怎么需要你思考”."},{n:10,q:"根据上文，阅读对人生究竟意味着什么？",o:["通过阅读了解知识的完整性","通过阅读、思考，了解世界","占有更多资讯，提高自身修养","轻松阅读，调动生活的积极性"],a:1,why:"“以一套系统来解释世界……细细思考、理解”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"“哎呀！哎呀！哎呀！疼，疼，疼。你轻点儿，医生。”医生有些不耐烦，态度有点儿冷淡：“怎么了？还男人呢，有什么好叫的，这点儿疼都受不了，干脆回去得了！”\n医生走了，护士进来了，准备给烂脚的病人清洁包扎、消炎打针。\n“护士你轻点儿，刚才的医生手太重。”病人向护士告状。护士说：“那医生是我们医院最好的，那样的医生你都受不了，我是新手，你更得疼了。你就忍着点儿，不疼就不会来医院了。”\n年轻的女护士纤细的手轻轻地触摸一下伤口的周边，开始擦洗血迹。病人似乎显得没那么痛苦了。\n护士明白病人的心理：男人在男人面前会说真话，在女人面前却会装英雄。医生进来观察着病人，心里暗暗发笑：“同性相斥，异性相吸，果真如此！”\n护士把伤口弄妥当了，病人似乎还沉浸在享受当中。他想：“我怎么啦！医生清理伤口时，我觉得那么疼，护士清理伤口时，我怎么有种幸福感啊！”",qs:[{n:11,q:"关于男医生，可以知道什么？",o:["他今天心情不好","他经验不够丰富","他一边治疗一边鼓励病人","他相信女护士处理更合适"],a:3,why:"Bác sĩ ra để y tá vào, rồi cười thầm “果真如此” — đáp án sách: D."},{n:12,q:"关于女护士，可以知道什么？",o:["很懂病人的心思","技术比医生更好","喜欢英雄式的人物","喜欢说真话的男人"],a:0,why:"“护士明白病人的心理”."},{n:13,q:"根据这段话可以知道什么？",o:["总有刁难医生的病人","护士比医生会安慰人","医生讨厌娇气的病人","心理学对医生很重要"],a:3,why:"Cùng một vết thương, tâm lý khác nhau → cảm giác đau khác nhau."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"罗伯斯决定离家出走。他烦死了，妻子整天唠叨。他想起了初恋女友约梦，便信步来到了约梦的家门口。\n约梦三十多岁时死了丈夫，至今单身一人。罗伯斯老觉得对不起她，转眼就是20年。梦一样的约梦依然年轻、漂亮，一点儿也不像50开外的人。罗伯斯凝望着她，心里尽是疑惑：约梦没有伤感，没有唉声叹气，话里话外都是生活的美好。\n谈话快要结束时，罗伯斯忍不住问她：“你过得好吗？”“当然”，约梦没有半点儿迟疑。“你不怨恨吗？”“过去的事都是我的财富。生活给了我不想要的，也给了我想要的。杰克也有毛病，他脾气暴躁，从不让着我，还曾经有个相好的，我跟他吵过，为难过他，可细想起来，他优点也不少，有一次我拉肚子，他半夜陪我去医院。后来我才知道，他那个“相好的”生活特别艰难，杰克是在帮她。”\n在罗伯斯快要离开时，约梦拿了本书送给他，封面上是约梦和杰克的照片，书名很别致：《一只眼睛看爱人》。\n“谢谢你的款待！”罗伯斯像做梦一样离开了约梦的家，毫不犹豫地朝家走去。",qs:[{n:14,q:"关于罗伯斯的妻子，下列哪项正确？",o:["话太多","回娘家了","已经过世了","离家出走了"],a:0,why:"“妻子整天唠叨”."},{n:15,q:"罗伯斯看到约梦时，为什么心里尽是疑惑？",o:["约梦和20年前一样美","约梦为什么至今不再婚","约梦心里是不是还有他","约梦为什么一点儿也不伤感"],a:3,why:"“约梦没有伤感，没有唉声叹气”."},{n:16,q:"关于约梦的丈夫，下列哪项正确？",o:["他温柔文静","他乐于助人","他非常谦虚","他是个医生"],a:1,why:"“杰克是在帮她”. A sai: “脾气暴躁”."},{n:17,q:"罗伯斯从约梦那里得到了什么启示？",o:["生活就像梦一样","应该好好读些书","要能看到别人的优点","初恋已经成为了过去"],a:2,why:"《一只眼睛看爱人》 — nhìn ưu điểm, bỏ qua khuyết điểm → về nhà."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["我们要努力把我们的立场被国际社会所了解。","小李刚骑到街口，一辆小汽车急驶而来，从侧面撞上了他的摩托。","黄昏，夕阳的余晖笼罩四野，远处教堂的钟声一声声撞入人的心里。","我将于茫茫人海中访我灵魂之伴侣。得之，我幸；不得，我命，如此而已。"],a:0,why:"<b>Trộn cấu trúc</b> (bài 17): <span class='zh'>把……</span> và <span class='zh'>被……所……</span> → <span class='zh'>努力使我们的立场被国际社会所了解</span>."},{n:19,o:["在经济高速发展的今天，整体国民素质的提高更是当务之急。","她早就做好了面对艰难的准备，所有任何困难都不能阻挡她。","与会者都很准时，例行的寒暄过后，谈判很快进入了实质性的阶段。","那时候，项羽的兵马四十万，驻扎在鸿门；刘邦的兵马十万，驻扎在灞上。"],a:1,why:"<b>Thừa thành phần</b>: <span class='zh'>所有</span> và <span class='zh'>任何</span> trùng nghĩa → bỏ một."},{n:20,o:["于成龙的官越做越大，生活却更加简朴，每天粗茶淡饭，佐以青菜，终年不知肉味。","婚姻是一部书，封面是《圣经》，内容却是账簿。如果不翻一翻便买了，买错了，就是活该！","这种策略的优点是能满足不同消费者的不同要求，有利于扩大销售、占领市场、提高企业声誉。","因为我没有钱了，所以我的朋友也没有钱了，于是，大毛请我们吃饭，而且是很丰盛的一顿晚饭。"],a:3,why:"<b>Lôgic nhân quả sai</b>: tôi hết tiền không phải nguyên nhân bạn tôi hết tiền."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"地球上昼夜___最大的地区在中纬度荒漠区，那里夏季晴天气温高达40～50℃，岩石表面温度在70℃___。夜晚至___气温可降到0℃以下。",o:["差距　上下　天亮","温度　附近　早上","差别　旁边　黎明","温差　左右　凌晨"],a:3,why:"<span class='zh'>昼夜温差</span>; <span class='zh'>70℃左右</span>; <span class='zh'>夜晚至凌晨</span> (từ mới!)."},{n:22,text:"许多动物对声音具有反应能力。声音___对动物的基本生活过程不会有任何___的影响，但它却___着对动物有重要影响的刺激物，如食物、配偶、敌害等___来临。",o:["本身　直接　预示　即将","自己　过分　预告　必须","形成　间接　表示　终将","大致　充足　意味　到底"],a:0,why:"<span class='zh'>声音本身</span>; <span class='zh'>直接的影响</span>; <span class='zh'>预示</span>; <span class='zh'>即将来临</span> (từ mới!)."},{n:23,text:"几乎每个人都有___的习惯，只要还没到最后的___，能拖就拖。细细想想，这种想法很要不得，拖到最后，也逃不过去，事情还是得做。___，就不如趁早抓紧，时间还不至于那么___。",o:["耗着　时候　这样想来　紧急","拖拉　时间　这样说来　迫切","拖延　期限　这样看来　紧迫","迟缓　时日　这样算来　危机"],a:2,why:"<span class='zh'>拖延 · 期限 · 紧迫</span> — đều là từ mới! Có cả <span class='zh'>能拖就拖</span> (能A就A)."}]},read3:{ins:"第24–28题：选句填空。",text:"年幼的李白和所有的孩子一样，贪玩儿、好动，他眼中有趣的事物，在大人看来毫无意义，而大人认为有趣的背书，在李白看来非常无聊。(24)，李白还是得天天坐在窗前，永无休止地背诵他觉得一点儿也不好玩儿的古文。\n放学了，李白自由了。他边走边玩儿，看看空中的鸟，不禁叮嘱一句：“小心远处的鹰啊！”看看河里的鱼，不禁悄声嘱咐道：“慢点儿游，孩子跟不上了！”忽然，(25)，正在磨一根很粗的铁棒。李白觉得很奇怪：老奶奶干什么呢？做武器吗？他凑到老奶奶身旁，问道：“您磨这根大铁棒要干什么呀？”老奶奶说：“我要把它磨成一根针。”(26)，说：“不可能吧？”老奶奶看了李白一眼，对李白说：“只要功夫深，铁杵也能磨成针！”李白觉得自己突然明白了一个道理，(27)。\n这件事给李白留下了深刻的印象，后来他读书碰到困难的时候，就自然而然地想起老奶奶的话，“只要功夫深，铁杵磨成针”。(28)，李白成了中国古代文学史上最有名的诗人之一。",opts:["使劲儿地点了点头","李白以为老奶奶在开玩笑","他发现河边有一位白发苍苍的老奶奶","在这种精神的鼓舞下","无聊归无聊"],ans:{24:4,25:2,26:1,27:0,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"官渡大战，袁绍打了败仗，刘备只得投靠刘表。这时，刘备听说诸葛亮学识渊博，才能出众，就和关羽、张飞带着礼物到卧龙岗去请诸葛亮出来帮助自己做事。恰巧诸葛亮出去了，刘备失望而返。不久，刘备又和关羽、张飞冒着大风雪去请诸葛亮出山，不料，又碰上诸葛亮外出闲游。刘备只得留下一封信，表达自己对诸葛亮的敬佩和请他出来帮助自己建功立业的意思。\n过了一些时候，刘备准备再去请诸葛亮。关羽说，诸葛亮也许是徒有虚名，未必有真才实学，算了吧。张飞主张他一个人去请，如果请不来诸葛亮，就用绳子把人捆来。刘备把张飞责备了一顿，和关羽、张飞第三次出发去拜访诸葛亮。\n这次，正赶上诸葛亮在家中睡觉。刘备就一直站在院子里，等待诸葛亮醒来。诸葛亮被刘备的诚意打动，日后全力帮助刘备建立了蜀汉王朝。\n《三国演义》把刘备三次亲请诸葛亮这件事情叫作“三顾茅庐”。诸葛亮在他著名的文章《出师表》中表示“先帝不嫌我身份低微，见识浅陋，不惜降低身份，委屈自己，三次到草庐来探望我，向我询问天下大事，我因此非常感激，就答应为先帝奔走效劳。”在这里，诸葛亮很谦虚，他本来是中国历史上杰出的政治家、军事家、散文家、书法家、发明家，也是人人敬仰的忠臣与智者，但字里行间却也告诉我们，他对刘备的礼贤下士、求才若渴十分感恩。",qs:[{n:29,q:"刘备“一顾茅庐”前发生了什么事？",o:["战争就要爆发了","刘备官做不成了","刘备邀请了刘表","刘备靠别人生存"],a:3,why:"“刘备只得投靠刘表” = nương nhờ người khác."},{n:30,q:"根据上文可以知道，张飞：",o:["过于粗鲁","智商很高","武功不错","不尊重下属"],a:0,why:"Muốn trói Gia Cát Lượng mang về → thô lỗ."},{n:31,q:"根据上文可以知道，刘备：",o:["做事追求圆满","对诸葛亮很忠诚","敬重有才德的人","能虚心帮助他人"],a:2,why:"<span class='zh'>礼贤下士、求才若渴</span>."},{n:32,q:"诸葛亮在《出师表》中说，自己最受感动的是：",o:["刘备情愿为他奔走","刘备对他敬重有加","刘备关心国家大事","刘备从不让他受委屈"],a:1,why:"“不惜降低身份，委屈自己，三次到草庐来探望我” → kính trọng."}]},{ins:"第33–36题：请选出正确答案。",text:"事情发生在500多年前，20出头的小伙子吴东胜上街买菜，突然，看见前方人群拥挤的地方搭着一个台子。他紧走几步来到台前，看见台上一位相貌出众的女子正与一个膀大腰圆的汉子比赛解死结。两个人手中各拿了一串复杂的用麻绳捆的结，粗看上去没什么奇怪，细一看可不得了：大结套小结，大大小小的结至少有90多个。原来这位女子在比巧招亲，谁能比女子先解开这些结就能迎娶她。\n吴东胜到场时比赛刚刚开始，没过5分钟，女子就把所有的结解开了。而那位大汉却只解开了三分之一。女子对大汉说：“对不起，您失败了。”大汉垂头丧气地走出了赛场。接着女子对大家说：“现在只剩两串绳结了，如果没有人上场，今天的比赛就结束了！”\n这位女子心灵手巧，吴东胜心中好生仰慕，战胜那双天才的巧手，吴东胜自知不可能，但他心中盘算那绳结除了一个一个解开，就没高明点儿的办法了吗？突然他想到一个好办法，于是，飞身上台。\n看到有人上场，围观的人顿时情绪高涨，报以热烈的掌声。吴东胜深行一礼，开口道：“敢问小姐，这比赛的规则是什么？”“谁先弄开谁就赢！”少女回答。听到回答后，吴东胜掏出匕首，一刀就把结给砍断了，赢得了比赛。台下掌声喝彩声响成一片。他知道，人们是在为他与众不同的思路叫好呢。\n从此以后汉语中就多了一个俗语——快刀斩乱麻，用来比喻做事果断，能采取坚决有效的措施，很快解决复杂的问题。",qs:[{n:33,q:"根据第1段画线词语“膀大腰圆”，可以知道那汉子：",o:["是个粗鲁人","做事很精细","身体又瘦又高","身体高大粗壮"],a:3,why:"<span class='zh'>膀大腰圆</span> = vai to lưng tròn → to khỏe."},{n:34,q:"根据上文可以知道，吴东胜：",o:["说话很有礼貌","正在军队任职","对少女不服气","不喜欢凑热闹"],a:0,why:"“深行一礼，开口道：‘敢问小姐……’”"},{n:35,q:"关于这场比赛，下列哪项正确？",o:["女子的意图是想借机显示才智","比赛制定的规则思路极其严密","吴东胜是被掌声鼓舞而取胜的","吴东胜取胜的原因是思路新颖"],a:3,why:"“人们是在为他与众不同的思路叫好”."},{n:36,q:"上文主要讲的是：",o:["女子的智慧不比男子差","吴东胜在中国历史上很有名","人走投无路时能想出好办法","俗语“快刀斩乱麻”的由来"],a:3,why:"Câu cuối: “从此以后汉语中就多了一个俗语”."}]}]},W:{zh:"写作",vn:"Viết văn: 智慧的……",t:"35 phút",min:!0,task:"《草船借箭》是在中国广为流传的一个故事，三国时期魏、蜀、吴三个政权有战争有联合，周瑜嫉妒诸葛亮的才华，故意刁难诸葛亮，最后诸葛亮以自己的聪明才智胜出。在你们国家一定也有许多这样的智慧小故事，请以“智慧的……”为题写一个你们国家的民间故事，字数不少于400字。",target:400,steps:[["Chọn truyện","Một nhân vật dân gian nổi tiếng về trí tuệ — VD: Trạng Quỳnh, Lương Thế Vinh, Mạc Đĩnh Chi…"],["Bối cảnh","Thời gian, nhân vật; ai làm khó ai: <span class='zh'>不服气 · 故意为难 · 委托 · 期限</span>."],["Thử thách","Một bài toán khó; người khác <span class='zh'>沉思良久 · 猜不出……的意图</span>."],["Cách giải","Kể từng bước; dùng <span class='zh'>即将 · 能A就A · 吩咐 · 叮嘱 · 妥当</span>."],["Kết","Kết quả <span class='zh'>圆满</span>; đối phương <span class='zh'>叹着气说……高明</span>; dùng 替代 để tránh lặp."]],outline:[["一 · 人物","谁、什么时候"],["二 · 难题","谁出了什么难题"],["三 · 办法","怎么解决"],["四 · 结果","大家的反应"],["五 · 启发","智慧在哪里"]],model:"智慧的梁世荣\n越南古代有一位很有名的数学家，名叫梁世荣，人们都说他是天才。下面这个“称大象”的故事，在越南广为流传。\n传说有一年，中国派来了一位使臣。这位使臣听说越南人很聪明，心里一直不服气，就想故意为难越南人。他对国王说：“我听说你们这儿有很多人才，那就请你们告诉我，这头大象有多重？期限是三天。”那个时候还没有那么大的秤，大臣们沉思良久，谁也想不出办法来，只好向国王汇报。国王很着急，就委托梁世荣承办这件事。\n梁世荣说：“请放心，用不了三天。”他吩咐下属把大象牵到江边，让它走上一条船，然后在船身被水淹到的地方画了一条线。接着，他叫人把大象牵下来，再往船上一筐一筐地装石头，能装多少就装多少，一直装到船下沉到那条线为止。最后，他把船上的石头一块一块地称了称，算出了总数。“这就是大象的重量。”梁世荣说。\n使臣大致算了算，结果果然一点儿也不差。他叹着气说：“越南真有高明的人才啊！”从此以后，他再也不敢小看越南人了。这件事很快传遍了全国，大家都称赞梁世荣是越南的“诸葛亮”。\n这个故事告诉我们，遇到难题时不要着急，只要多动脑筋，再难的问题也能圆满解决。",check:["Có tiêu đề “智慧的……”","Có bối cảnh, nhân vật","Có thử thách / bài toán khó","Có cách giải chi tiết","Có kết quả và bài học","Dùng ít nhất 4: 委托 · 期限 · 即将 · 能A就A · 吩咐 · 沉思 · 叹气 · 高明 · 圆满","Không ít hơn 400 chữ"]},SUM:{words:["服气","军队","武器","当务之急","承办","委托","即将","紧迫","公务","款待","叮嘱","算数","逼迫","吩咐","下属","充足","拖延","期限","活该","汇报","探望","寒暄","为难","严密","机密","保密","走漏","沉思","意图","私自","妥当","占领","封锁","驻扎","指定","响亮","嘱咐","茫茫","调动","方位","高涨","凌晨","笼罩","启程","大致","圆满","叹气","天才","高明"],patterns:[["即将 + V","即将交战，十天怎么样？"],["能A就A / 能多A就多A","声音能多响亮就多响亮。"],["否则……","你得替我保密，不要走漏消息，否则我性命难保。"],["只得……","只得心神不定地与诸葛亮饮酒。"],["篇章：替代","“这话不假。” —— 这话 = 弓箭最好"]],diff:["大致: còn dùng cho ước lượng (大致得三个月) và làm tính từ (大致的想法) — 大体: không có hai cách dùng này","调动 diào · 为难 wéinán · 叮嘱 (dặn đi dặn lại) / 嘱咐 (dặn) / 吩咐 (sai bảo) · 活该 = đáng đời"],sentences:["当务之急是赶造十万支箭，造箭的事就由您承办吧。","船上的士兵奋力敲鼓，齐声高喊，声音能多响亮就多响亮。","唉，他真是天才，确实比我高明！"],hw:["Học thuộc 53 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “智慧的……” ≥400 chữ (mục 7).","Kể lại truyện 草船借箭 bằng tiếng Trung trong 3 phút.","Làm Sách bài tập bài 25.","Đọc trước bài 26."]}});
