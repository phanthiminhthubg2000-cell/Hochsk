<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 28 · 高山流水遇知音 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-28",num:28,book:"HSK 标准教程 6（下）",unit:{n:7,zh:"经典阅读",vn:"Đọc tác phẩm kinh điển"},title:"高山流水遇知音",vn:"Cao sơn lưu thủy gặp tri âm",chars:1072,source:"",goals:["Đọc hiểu điển tích 1072 chữ về <b>Du Bá Nha và Chung Tử Kỳ</b>: tiếng đàn “núi cao nước chảy”, tình tri âm, và Bá Nha đập đàn khi bạn mất.","Dùng được 51 từ mới, nhất là nhóm <b>âm nhạc – cảm thụ</b>: <span class='zh'>领会 · 内涵 · 弦 · 美妙 · 乐谱 · 演奏 · 旋律 · 节奏 · 曲折 · 豪迈 · 雄伟 · 壮观 · 气势 · 气魄 · 气概 · 含义 · 领悟</span> và nhóm <b>tình bạn – cảm xúc</b>: <span class='zh'>钦佩 · 投机 · 侃侃而谈 · 告辞 · 沮丧 · 凄凉 · 深情厚谊 · 真挚 · 纯洁</span>.","Nắm <span class='zh'>các mẫu với “个” · 向来</span>.","Phân biệt <span class='zh'>气势 — 气魄</span>; làm quen <b>修辞 (5): 婉曲 — nói giảm, nói tránh</b>.","Viết bài “我的知音” ≥400 chữ; luyện đề 缩写 HSK6."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (一个 + N/V) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (V了个Adj · 向来 · 气势—气魄) · Đoạn 4–8 · 婉曲 · Bài tập · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Tìm tri âm",paras:"Đoạn 1",zh:"琴声如高山流水，却无人领会",vn:"Bá Nha đàn hay như núi cao nước chảy nhưng chẳng ai hiểu nội hàm tiếng đàn — anh khao khát tìm tri âm."},{tag:"承",name:"Gặp gỡ",paras:"Đoạn 2–3",zh:"中秋江边，琴弦断，打柴人",vn:"Đêm Trung thu bên sông, đàn đứt dây — một người đốn củi nghe ra tiếng đàn và cả bản nhạc."},{tag:"转",name:"Tri âm",paras:"Đoạn 4–5",zh:"高山 · 波涛 · 流水；约定来年",vn:"Tử Kỳ nghe ra núi cao, sóng dữ, nước chảy; hai người trò chuyện thâu đêm, hẹn Trung thu năm sau."},{tag:"合",name:"Đập đàn",paras:"Đoạn 6–8",zh:"钟子期逝世；摔琴；知音",vn:"Năm sau Tử Kỳ đã mất; Bá Nha đàn bài 《高山流水》 bên mộ rồi đập vỡ đàn. “Tri âm” thành biểu tượng của tình bạn chân thành."}],warm1:{q:"下图中的物品叫“瑶琴”，可以弹奏出美妙的音乐，汉语中有一个词语叫“知音”，请谈谈你理解的“知音”的意思，你有知音吗？",vn:"Theo bạn, “tri âm” là người như thế nào? Bấm 有 (đúng) / 无 (không).",items:[["🎼","能听懂你的音乐的人","Người nghe hiểu âm nhạc của bạn"],["💬","最了解你的朋友","Người bạn hiểu bạn nhất"],["🤝","认识时间最长的朋友","Người bạn quen lâu nhất"],["❤️","心灵相通的人","Người tâm hồn tương thông"]],talk:["你有知音吗？你们是怎么认识的？","你觉得“知音难觅”吗？"],link:"<span class='zh'>瑶琴 yáoqín</span> = đàn cổ cầm. Tiếng Việt cũng dùng “tri âm tri kỷ” — chính từ điển tích này."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"动",rule:"动 = <b>làm xúc động; động</b>.",w:[["动听","dòngtīng","êm tai (có trong bài)"],["动人","dòngrén","cảm động"],["动火","dònghuǒ","nổi giận"],["动气","dòngqì","nổi nóng"],["动怒","dòngnù","nổi giận"],["动情","dòngqíng","động lòng"],["动容","dòngróng","biến sắc vì xúc động"],["动心","dòngxīn","động lòng"],["感动","gǎndòng","cảm động"],["打动","dǎdòng","làm xúc động"],["激动","jīdòng","xúc động"],["触动","chùdòng","chạm đến"],["生动","shēngdòng","sinh động"]]},{k:"辨",rule:"辨 = <b>phân biệt</b>.",w:[["辨识","biànshí","nhận biết (có trong bài)"],["辨别","biànbié","phân biệt"],["辨认","biànrèn","nhận ra"],["辨析","biànxī","phân tích"],["辨明","biànmíng","làm rõ"],["分辨","fēnbiàn","phân biện"],["明辨是非","míngbiàn-shìfēi","phân rõ phải trái"]]},{k:"雄",rule:"雄 = <b>hùng mạnh, to lớn</b>.",w:[["雄壮","xióngzhuàng","hùng tráng (có trong bài)"],["雄伟","xióngwěi","hùng vĩ (từ mới)"],["雄厚","xiónghòu","hùng hậu"],["雄大","xióngdà","hùng vĩ to lớn"],["雄劲","xióngjìng","hùng mạnh"],["雄浑","xiónghún","hùng hồn"],["雄兵","xióngbīng","hùng binh"],["雄心","xióngxīn","hùng tâm"],["雄威","xióngwēi","hùng uy"],["雄姿","xióngzī","dáng hùng dũng"],["雄关","xióngguān","cửa ải hiểm yếu"]]},{k:"清",rule:"清 = <b>trong, sạch, thanh</b>.",w:[["清澈","qīngchè","trong vắt (từ mới)"],["清新","qīngxīn","tươi mới (có trong bài)"],["清爽","qīngshuǎng","sảng khoái"],["清淡","qīngdàn","thanh đạm"],["清风","qīngfēng","gió mát"],["清高","qīnggāo","thanh cao"],["清净","qīngjìng","thanh tịnh"],["清凉","qīngliáng","mát lành"],["清香","qīngxiāng","hương thơm nhẹ"],["清秀","qīngxiù","thanh tú"],["清白","qīngbái","trong sạch"],["清汤","qīngtāng","canh trong"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Tìm tri âm, gặp người đốn củi",from:1,to:15},{name:"Nhóm 2 · Đoạn 4–5",sub:"Tiếng đàn & tri âm",from:16,to:38},{name:"Nhóm 3 · Đoạn 6–8",sub:"Hẹn ước & đập đàn",from:39,to:51}],V:[[1,"领会","lǐnghuì","đgt.","lĩnh hội","hiểu thấu, lĩnh hội",1,"","领略事物而有所体会。","真正领会他琴声的内涵","我领会了老师的意思。","Tôi đã hiểu ý thầy.",[],"Bài tập 2①. SBT câu 33–36."],[2,"内涵","nèihán","dt.","nội hàm","ý nghĩa",1,"","内在的涵养；概念的内容。","琴声的内涵","这首诗内涵很丰富。","Bài thơ này hàm ý rất phong phú.",[],"Bài tập 1: <span class='zh'>内容 · 内外 · 内行 · 内敛</span>. SBT nghe câu 1."],[3,"港湾","gǎngwān","dt.","cảng loan","cảng, bến cảng",1,"","便于船只停泊的海湾。","类似港湾的地方","家是心灵的港湾。","Nhà là bến đỗ của tâm hồn.",[],"SBT câu 29–32: <span class='zh'>心灵港湾</span>."],[4,"晴朗","qínglǎng","tt.","tình lãng","nắng ráo, trời quang",1,"","没有云雾，日光充足。","天气晴朗","今天天气晴朗。","Hôm nay trời quang đãng.",[],"Bài tập 1: <span class='zh'>晴天 · 晴空 · 晴雨表 · 放晴</span>. SBT nghe 14–17."],[5,"清澈","qīngchè","tt.","thanh triệt","trong suốt, trong veo",1,"","清而透明。","江水清澈","湖水清澈见底。","Nước hồ trong vắt nhìn thấy đáy.",["清澈见底"],""],[6,"出神","chū shén","đgt.","xuất thần","say sưa, say mê",1,"","因精神过度集中而发呆。","似乎听得出了神","他望着窗外出神。","Anh nhìn ra cửa sổ thẫn thờ.",[],"Bài tập 2②. SBT câu 18C."],[7,"弦","xián","dt.","huyền","dây đàn",1,"","乐器上用来发声的线。","琴弦拔断了一根","吉他有六根弦。","Đàn guitar có sáu dây.",["琴弦"],""],[8,"美妙","měimiào","tt.","mỹ diệu","tuyệt vời, tươi đẹp",1,"","美好，奇妙。","觉得琴声美妙","美妙的音乐。","Âm nhạc tuyệt vời.",[],"Bài tập 1: <span class='zh'>奇妙 · 曼妙 · 巧妙 · 妙不可言</span>; 3①."],[9,"砍伐","kǎnfá","đgt.","khảm phạt","chặt, đốn",1,"","用锯、斧等把树木的枝干弄下来或把树木弄倒。","刚刚砍伐来的木柴","禁止乱砍伐森林。","Cấm chặt phá rừng bừa bãi.",[],"SBT nghe câu 2."],[10,"平凡","píngfán","tt.","bình phàm","bình thường, tầm thường",1,"","平常；不稀奇。","这么不平凡的人","他在平凡的岗位上做出了不平凡的成绩。","Anh làm nên thành tích phi thường ở vị trí bình thường.",[],"Bài tập 2③."],[11,"乐谱","yuèpǔ","dt.","nhạc phổ","bản nhạc, nhạc phổ",1,"","用符号记录下来的音乐。","先生刚才弹的乐谱","他看不懂乐谱。","Anh ấy không đọc được bản nhạc.",[],""],[12,"赞叹","zàntàn","đgt.","tán thán","ca ngợi, ca tụng",1,"","称赞。","孔子为赞叹他的弟子而创作的","大家都赞叹不已。","Mọi người khen không ngớt.",[],"Bài tập 1 (ví dụ): <span class='zh'>赞扬 · 赞美 · 称赞 · 夸赞</span>."],[13,"创作","chuàngzuò","đgt.","sáng tác","sáng tác, viết, soạn",1,"","创造文艺作品。","为赞叹他的弟子而创作的","这首歌是他创作的。","Bài hát này do anh sáng tác.",[],"Bài tập 3①."],[14,"民间","mínjiān","dt.","dân gian","dân gian",1,"","人民中间。","民间真有精通音乐之人","民间故事。","Truyện dân gian.",["民间艺术"],"SBT câu 21."],[15,"精通","jīngtōng","đgt.","tinh thông","tinh thông, thông thạo",1,"","对学问、技术或业务有透彻的理解并熟练地掌握。","精通音乐之人","他精通三门外语。","Anh ấy thông thạo ba ngoại ngữ.",[],"Bài tập 3①."],[16,"难能可贵","nánnéng-kěguì","thành ngữ","nan năng khả quý","đáng quý, quý hóa",1,"成","不容易做到的事居然能做到，值得宝贵。","难能可贵！","他这么小就这么懂事，真是难能可贵。","Còn nhỏ mà hiểu chuyện thế, thật đáng quý.",[],"Bài tập 3①."],[17,"应邀","yìngyāo","đgt.","ứng yêu","nhận lời mời",1,"","接受邀请。","打柴人应邀上了船","他应邀参加了这次会议。","Ông nhận lời mời dự hội nghị này.",[],"Bài tập 2④. SBT nghe 6–10."],[18,"钦佩","qīnpèi","đgt.","khâm bội","kính trọng và khâm phục",1,"","敬重佩服。","不禁心生钦佩","我很钦佩他的勇气。","Tôi rất khâm phục lòng dũng cảm của anh.",[],""],[19,"演奏","yǎnzòu","đgt.","diễn tấu","diễn tấu",1,"","用乐器表演。","为打柴人演奏了几曲","他演奏了一首钢琴曲。","Anh trình diễn một bản piano.",[],"Bài tập 3①. SBT câu 22."],[20,"豪迈","háomài","tt.","hào mại","hào hùng, dũng cảm và hào phóng",1,"","气魄大；勇往直前。","琴声雄壮豪迈","他说话很豪迈。","Anh nói chuyện rất hào sảng.",[],"Bài tập 1: <span class='zh'>豪爽 · 豪杰 · 自豪 · 文豪</span>."],[21,"旋律","xuánlǜ","dt.","toàn luật","giai điệu",1,"","音乐中按一定节奏组织起来的一系列乐音。","这旋律表达了……","这首歌的旋律很优美。","Giai điệu bài hát này rất đẹp.",[],""],[22,"雄伟","xióngwěi","tt.","hùng vĩ","hùng vĩ",1,"","雄壮而伟大。","高山的雄伟壮观","雄伟的长城。","Vạn Lý Trường Thành hùng vĩ.",[],""],[23,"壮观","zhuàngguān","tt.","tráng quan","hùng tráng, nguy nga",1,"","景象雄伟。","雄伟壮观","瀑布十分壮观。","Thác nước vô cùng hùng vĩ.",[],"SBT câu 21A."],[24,"气势","qìshì","dt.","khí thế","khí thế",1,"","人或事物表现出的某种力量和形势。","有气势","这座山气势雄伟。","Ngọn núi này khí thế hùng vĩ.",[],"Xem <b>辨析 气势—气魄</b>."],[25,"气魄","qìpò","dt.","khí phách","khí phách",1,"","处理事情所具有的胆识和作风。","有气魄","他做事很有气魄。","Anh ấy làm việc rất có khí phách.",[],"Xem <b>辨析 气势—气魄</b>."],[26,"曲折","qūzhé","tt.","khúc chiết","uốn khúc, quanh co",1,"","弯曲；（情节）复杂，变化多。","曲折激越","这条小路很曲折。","Con đường nhỏ này quanh co.",["情节曲折"],"SBT nghe câu 3."],[27,"节奏","jiézòu","dt.","tiết tấu","nhịp điệu",1,"","音乐中交替出现的有规律的强弱、长短现象。","节奏短促","这首歌节奏很快。","Bài hát này nhịp rất nhanh.",["生活节奏"],""],[28,"短促","duǎncù","tt.","đoản xúc","ngắn ngủi, ngắn",1,"","（时间）极短；急促。","节奏短促","他的呼吸很短促。","Hơi thở anh ngắn và gấp.",[],""],[29,"波涛","bōtāo","dt.","ba đào","sóng cả, sóng lớn",1,"","大波浪。","波涛汹涌","波涛汹涌的大海。","Biển cả sóng dữ dội.",["波涛汹涌"],"SBT câu 18C."],[30,"溅","jiàn","đgt.","tiễn","tóe ra, bắn tóe",1,"","液体受冲击向四外射出。","浪花飞溅","雨水溅了我一身。","Nước mưa bắn đầy người tôi.",[],"SBT nghe câu 5."],[31,"气概","qìgài","dt.","khí khái","dũng khí, khí phách",1,"","在对待重大问题上表现出来的态度、举动或气势。","气概非凡","英雄气概。","Khí phách anh hùng.",[],"SBT câu 23C."],[32,"含义","hányì","dt.","hàm nghĩa","hàm ý, ý nghĩa",1,"","（词句等）所包含的意义。","他琴声的含义","这句话的含义很深。","Câu này hàm ý rất sâu.",[],"SBT câu 33–36."],[33,"荒凉","huāngliáng","tt.","hoang lương","hoang vắng, hoang vu",1,"","人烟稀少；冷清。","在这荒凉之地","这里很荒凉，没有人住。","Nơi này hoang vắng, không người ở.",[],""],[34,"领悟","lǐngwù","đgt.","lĩnh ngộ","hiểu rõ, nhận thức rõ",1,"","领会；理解。","还能领悟其神","我终于领悟了其中的道理。","Cuối cùng tôi đã ngộ ra đạo lý trong đó.",[],""],[35,"侃侃而谈","kǎnkǎn ér tán","thành ngữ","khản khản nhi đàm","nói năng đĩnh đạc",1,"成","理直气壮、从容不迫地说话。","两人在月下侃侃而谈","他在会上侃侃而谈。","Anh ấy phát biểu đĩnh đạc trong cuộc họp.",[],"SBT câu 23."],[36,"投机","tóujī","tt.","đầu cơ","ăn ý, hợp ý",1,"","见解相同；意气相合。","越谈越投机","我们聊得很投机。","Chúng tôi nói chuyện rất hợp.",[],"⚠️ Còn là động từ = đầu cơ (nghĩa xấu). Bài tập 2⑤."],[37,"黎明","límíng","dt.","lê minh","bình minh, rạng sáng",1,"","天快要亮或刚亮的时候。","黎明将至","黎明时分，鸡叫了。","Lúc bình minh, gà gáy.",[],"Bài tập 3②. SBT câu 19D."],[38,"告辞","gàocí","đgt.","cáo từ","cáo biệt, cáo từ",1,"","辞别（主人）。","钟子期告辞","时间不早了，我告辞了。","Muộn rồi, tôi xin phép về.",[],""],[39,"黄昏","huánghūn","dt.","hoàng hôn","hoàng hôn, lúc chạng vạng",1,"","日落以后星出以前的时候。","从黄昏等到夜幕降临","黄昏时分，夕阳西下。","Lúc hoàng hôn, mặt trời lặn.",[],"Bài tập 3②."],[40,"降临","jiànglín","đgt.","giáng lâm","đến, tới, buông xuống",1,"","来到。","夜幕降临","夜幕降临，城市亮起了灯。","Màn đêm buông, thành phố lên đèn.",[],""],[41,"沮丧","jǔsàng","tt.","trở tang","chán nản, thất vọng",1,"","灰心失望。","他有些沮丧","考试没考好，他很沮丧。","Thi không tốt, cậu ấy rất chán nản.",[],"SBT câu 24–28."],[42,"变故","biàngù","dt.","biến cố","biến cố, rủi ro, tai nạn",1,"","意外发生的事情；灾难。","该不是有了什么变故吧？","家里发生了变故。","Gia đình xảy ra biến cố.",[],""],[43,"逝世","shìshì","đgt.","thệ thế","từ trần, tạ thế",1,"","去世。","逝世已有段时间了","他的祖父去年逝世了。","Ông nội anh mất năm ngoái.",[],"Bài tập 3②. Kính ngữ của <span class='zh'>死</span> (婉曲)."],[44,"坟墓","fénmù","dt.","phần mộ","mồ mả",1,"","埋葬死人的地方。","把坟墓修在江边","他每年都去父亲的坟墓前看看。","Năm nào anh cũng ra mộ cha.",[],"Bài tập 3②."],[45,"不止","bùzhǐ","đgt.","bất chỉ","không dứt, không ngừng",1,"","继续不停。","泪流不止","大笑不止。","Cười không ngớt.",[],"Bài tập 3②. Còn = vượt quá: <span class='zh'>不止一次</span>. SBT câu 21A."],[46,"粉碎","fěnsuì","tt.","phấn toái","nát, tan tành",1,"","像粉末一样碎。","把心爱的琴摔了个粉碎","杯子摔得粉碎。","Cái cốc vỡ tan tành.",[],"SBT câu 19D: <span class='zh'>粉碎性解体</span>."],[47,"向来","xiànglái","phó.","hướng lai","từ trước đến nay, luôn luôn",1,"","从来；一向。","琴向来是要弹给知音听的","他向来很守时。","Anh ấy xưa nay luôn đúng giờ.",[],"Xem <b>Ngữ pháp: 向来</b>. SBT câu 21D."],[48,"凄凉","qīliáng","tt.","thê lương","thê lương",1,"","寂寞冷落；凄惨。","故事有些凄凉","他晚年过得很凄凉。","Tuổi già ông sống rất thê lương.",[],"SBT câu 20B."],[49,"深情厚谊","shēnqíng hòuyì","thành ngữ","thâm tình hậu nghị","tình cảm sâu đậm",1,"成","深厚的感情和友谊。","两位知音的深情厚谊","我永远不会忘记你们的深情厚谊。","Tôi mãi không quên tình cảm sâu nặng của các bạn.",[],""],[50,"真挚","zhēnzhì","tt.","chân chí","chân thành tha thiết",1,"","真诚恳切。","真挚而纯洁的情谊","真挚的友情。","Tình bạn chân thành.",[],"Bài tập 3②. SBT câu 23B."],[51,"纯洁","chúnjié","tt.","thuần khiết","thuần khiết, trong sáng",1,"","纯粹清白，没有污点。","真挚而纯洁的情谊","孩子的心灵很纯洁。","Tâm hồn trẻ em rất trong sáng.",[],""]],extra:[["俞伯牙 · 钟子期","Yú Bóyá · Zhōng Zǐqī","Du Bá Nha · Chung Tử Kỳ"],["知音","zhīyīn","tri âm"],["瑶琴","yáoqín","đàn cổ cầm"],["中秋","Zhōngqiū","Trung thu (15/8 âm lịch)"],["雕塑","diāosù","tượng điêu khắc"],["打柴","dǎ chái","đốn củi"],["偏僻","piānpì","hẻo lánh"],["激越","jīyuè","mạnh mẽ, vang dội"],["汹涌","xiōngyǒng","cuồn cuộn"],["久寻不遇","jiǔ xún bú yù","tìm mãi không gặp"],["遗言","yíyán","lời trăng trối"]],T:[{zh:"俞伯牙从小酷爱音乐，他的琴声优美动听，犹如高山流水一般。虽然大家都赞美他琴弹得好，却从没有人能真正领会他琴声的内涵，他多想找到自己的知音啊！",vn:"Du Bá Nha từ nhỏ đã rất mê âm nhạc, tiếng đàn của ông du dương êm tai như núi cao nước chảy. Tuy ai cũng khen ông đàn hay, nhưng chưa từng có ai thật sự hiểu được nội hàm tiếng đàn ấy — ông khao khát biết bao tìm được tri âm của mình!",idea:"Khao khát tri âm.",q:["俞伯牙为什么想找到自己的知音？"],note:[["犹如高山流水一般","So sánh (bài 26: 比喻)."]]},{zh:"一个中秋之夜，他乘船来到江边，偶遇风浪，船停在了一个类似港湾的地方。晚上，风浪渐渐平息，天气晴朗，江水清澈，景色十分迷人。望着空中的明月，俞伯牙来了兴致，拿出琴弹了起来，一会儿他就沉醉在了音乐之中。忽然他看到一个人雕塑一样站在岸边，似乎听得出了神。俞伯牙一个不留神，“啪”的一声，琴弦拔断了一根。这时，听琴的人大声说：“先生不必在意，我是个打柴的，回家晚了，走到这里听到您在弹琴，觉得琴声美妙，不由得站在这里听了起来。”",vn:"Một đêm Trung thu, ông đi thuyền đến bờ sông, tình cờ gặp sóng gió, thuyền dừng ở một chỗ giống như bến cảng. Đến tối, sóng gió dần lặng, trời quang đãng, nước sông trong vắt, cảnh sắc vô cùng mê hồn. Ngắm vầng trăng sáng, Bá Nha nổi hứng, lấy đàn ra gảy, chẳng mấy chốc đã đắm chìm trong âm nhạc. Bỗng ông thấy một người đứng như tượng bên bờ, dường như nghe đến xuất thần. Bá Nha sơ ý một cái, “tưng” một tiếng, một sợi dây đàn đứt. Lúc ấy người nghe đàn nói to: “Tiên sinh không cần bận tâm, tôi là người đốn củi, về nhà muộn, đi tới đây nghe ngài đàn, thấy tiếng đàn tuyệt diệu, bất giác đứng lại nghe.”",idea:"Gặp người đốn củi.",q:["俞伯牙和钟子期是怎么相遇的？"],note:[["一个不留神","Xem Ngữ pháp 1: <span class='zh'>一个 + V</span> = đột nhiên, nhanh."],["雕塑一样站在岸边","So sánh."],["不由得","Bất giác."]]},{zh:"俞伯牙借着月光仔细打量，见那人身旁放着刚刚砍伐来的木柴，果然是个打柴的。俞伯牙心想：一个打柴的怎么能听懂我的琴呢？偏僻的山野还有这么不平凡的人？于是他问：“你既然懂琴，那就请说说，我弹的是什么曲子？”打柴人说：“先生刚才弹的乐谱是孔子为赞叹他的弟子而创作的，只可惜，您弹到第四句的时候琴弦断了。”俞伯牙不禁感叹，民间真有精通音乐之人，难能可贵！他迫不及待地想和打柴人好好聊聊。",vn:"Bá Nha nhờ ánh trăng nhìn kỹ, thấy bên cạnh người ấy có bó củi vừa đốn, quả đúng là người đốn củi. Bá Nha nghĩ thầm: một người đốn củi sao có thể nghe hiểu đàn của ta? Núi rừng hẻo lánh lại có người phi phàm như vậy? Bèn hỏi: “Ngươi đã hiểu đàn, vậy xin nói xem ta đàn bản gì?” Người đốn củi nói: “Bản tiên sinh vừa đàn là khúc Khổng Tử sáng tác để ca ngợi học trò của mình, chỉ tiếc đàn tới câu thứ tư thì đứt dây.” Bá Nha không khỏi cảm thán: trong dân gian quả có người tinh thông âm nhạc, thật đáng quý! Ông nóng lòng muốn trò chuyện cùng người đốn củi.",idea:"Người đốn củi hiểu nhạc.",q:["打柴人怎样证明自己懂琴？"],note:[["你既然……，那就……","Đã… thì…"]]},{zh:"打柴人应邀上了船，看到俞伯牙的琴，赞道：“真是好琴。”接着又说起瑶琴的来历，俞伯牙不禁心生钦佩。接着俞伯牙又为打柴人演奏了几曲，请他辨识其中之意。当他的琴声雄壮豪迈的时候，打柴人说：“这旋律表达了高山的雄伟壮观。有气势，有气魄！”当琴声曲折激越、节奏短促时，打柴人说：“这旋律表达的是波涛汹涌，浪花飞溅，气概非凡！”当琴声变得清新流畅时，打柴人说：“这旋律表达的是无尽的流水。”俞伯牙惊喜万分，过去没人能听懂他琴声的含义，没想到在这荒凉之地，竟觅到自己久寻不遇的知音，不仅能领会其意，还能领悟其神。",vn:"Người đốn củi nhận lời lên thuyền, thấy cây đàn của Bá Nha, khen: “Đàn tốt thật.” Rồi kể lai lịch cây dao cầm, Bá Nha không khỏi kính phục. Tiếp đó Bá Nha đàn cho người đốn củi mấy khúc, mời ông nhận ra ý trong đó. Khi tiếng đàn hùng tráng hào sảng, người đốn củi nói: “Giai điệu này diễn tả sự hùng vĩ tráng lệ của núi cao. Có khí thế, có khí phách!” Khi tiếng đàn quanh co dồn dập, nhịp ngắn gấp, ông nói: “Giai điệu này diễn tả sóng cả cuồn cuộn, bọt sóng tung tóe, khí khái phi phàm!” Khi tiếng đàn trở nên trong trẻo trôi chảy, ông nói: “Giai điệu này diễn tả dòng nước chảy không ngừng.” Bá Nha mừng rỡ vô cùng: trước đây không ai nghe hiểu hàm ý tiếng đàn của ông, không ngờ ở nơi hoang vắng này lại tìm được tri âm bấy lâu tìm mà không gặp — không những hiểu ý, mà còn ngộ được thần.",idea:"Nghe ra núi cao, sóng, nước.",q:["俞伯牙和钟子期谈话的内容是什么？"],note:[["当……的时候，……；当……时，……；当……时，……","Điệp cấu trúc 3 lần."],["有气势，有气魄","Xem 辨析 气势—气魄."],["不仅能领会其意，还能领悟其神","<span class='zh'>其</span> = của nó (văn viết)."]]},{zh:"打柴人叫钟子期，两人在月下侃侃而谈，越谈越投机。黎明将至，钟子期告辞，并与俞伯牙约定，来年中秋还在这里相见。",vn:"Người đốn củi tên là Chung Tử Kỳ, hai người trò chuyện đĩnh đạc dưới trăng, càng nói càng hợp. Gần sáng, Tử Kỳ cáo từ, hẹn với Bá Nha Trung thu năm sau lại gặp ở đây.",idea:"Hẹn ước.",q:["两人约定了什么？"],note:[["越谈越投机","<span class='zh'>越……越……</span>."]]},{zh:"第二年中秋这天，俞伯牙如约来到了老地方，从黄昏等到夜幕降临，一直不见钟子期到来，他有些沮丧，开始用琴声呼唤钟子期，可还是见不到钟子期的影子。该不是有了什么变故吧？俞伯牙焦急万分。",vn:"Trung thu năm sau, Bá Nha đúng hẹn đến chốn cũ, đợi từ hoàng hôn đến khi màn đêm buông xuống vẫn không thấy Tử Kỳ đến; ông hơi chán nản, bắt đầu dùng tiếng đàn gọi Tử Kỳ, nhưng vẫn chẳng thấy bóng dáng. Chẳng lẽ có biến cố gì? Bá Nha lo lắng vô cùng.",idea:"Chờ mãi không thấy.",q:["第二年中秋发生了什么？"],note:[["该不是……吧？","Lẽ nào… chăng? (đoán điều xấu)."]]},{zh:"第二天，俞伯牙向一位老人打听他的好友，老人告诉他，钟子期染病，逝世已有段时间了。临走前，他留下遗言，把坟墓修在江边，到八月十五，好听俞伯牙弹琴。老人的话使俞伯牙泪流不止，他来到钟子期坟前，弹了一曲《高山流水》，曲终，他把心爱的琴摔了个粉碎，悲伤地说：“琴向来是要弹给知音听的，如今我唯一的知音已不在人世，这琴还弹给谁听呢？”",vn:"Hôm sau, Bá Nha hỏi thăm người bạn với một ông lão; ông lão cho biết Chung Tử Kỳ mắc bệnh, đã qua đời được một thời gian. Trước lúc ra đi, ông để lại lời dặn: xây mộ bên bờ sông, để đến rằm tháng Tám được nghe Bá Nha đàn. Lời ông lão khiến Bá Nha rơi lệ không ngừng; ông đến trước mộ Tử Kỳ, đàn một khúc 《Cao sơn lưu thủy》, đàn xong đập vỡ tan cây đàn yêu quý, đau buồn nói: “Đàn xưa nay là để gảy cho tri âm nghe, nay tri âm duy nhất của ta đã không còn trên đời, đàn này còn gảy cho ai nghe nữa?”",idea:"Đập đàn tạ tri âm.",q:["俞伯牙为什么把琴摔了？"],note:[["临走前","Xem 修辞: 婉曲 — “走” thay cho “死”."],["摔了个粉碎","Xem Ngữ pháp 1: <span class='zh'>V + 了个 + Adj</span>."],["琴向来是……","Xem Ngữ pháp 2: <span class='zh'>向来</span>."],["已不在人世","婉曲: không nói “死”."]]},{zh:"故事有些凄凉，但两位知音的深情厚谊感动了后人，至今人们还用“知音”来形容朋友之间真挚而纯洁的情谊。",vn:"Câu chuyện có phần thê lương, nhưng tình cảm sâu nặng của hai người tri âm đã làm cảm động hậu thế; đến nay người ta vẫn dùng chữ “tri âm” để chỉ tình bạn chân thành và trong sáng.",idea:"Ý nghĩa “tri âm”.",q:["说一说知音的含义。"],note:[["用……来形容……","Dùng… để hình dung…"]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"Các mẫu với “个”",py:"gè",tag:"Chú thích 1",mean:"① <span class='zh'>一个 + danh từ / cụm động từ</span>, đứng <b>trước động từ vị ngữ</b>, biểu thị <b>nhanh hoặc đột ngột</b>.<br>② <span class='zh'>V + (了) + 个 + Adj / V</span>: <span class='zh'>个</span> có tác dụng giống <span class='zh'>得</span> dẫn ra bổ ngữ (mức độ, kết quả).",forms:["一个 + 不留神 / 不小心 / 跟头 / 失手 + V","V + 了个 + 粉碎 / 不停 / 落花流水 / 乱七八糟"],ex:[["他手没抓住栏杆，一个跟头栽了下来。","Tay không bám được lan can, anh lộn nhào ngã xuống."],["俞伯牙一个不留神，“啪”的一声，琴弦拔断了一根。","",1],["他把心爱的琴摔了个粉碎。","",1],["我们都爱听张总讲话，开会的时候张总一张嘴，大家就会笑个不停。","Ai cũng thích nghe sếp Trương nói, họp mà sếp mở miệng là mọi người cười không ngớt."]],tips:["Bài 22: <span class='zh'>打了个落花流水</span> = đánh tơi bời."],practice:{q:"把下列6个小句组合成3个连贯的语段：A. 他一个失手，碗掉在地上　B. 不一会儿就把屋子弄了个乱七八糟　C. 天阴沉沉的，瓢泼大雨下个不停　D. 摔了个粉碎　E. 儿子放学，和小伙伴在家里玩儿起了捉迷藏　F. 大家的心里都很着急",type:"complete",items:[["语段（1）：? + ?","A + D：他一个失手，碗掉在地上，摔了个粉碎。"],["语段（2）：? + ?","E + B：儿子放学，和小伙伴在家里玩儿起了捉迷藏，不一会儿就把屋子弄了个乱七八糟。"],["语段（3）：? + ?","C + F：天阴沉沉的，瓢泼大雨下个不停，大家的心里都很着急。"]]}},{id:"g2",grp:2,word:"向来",zh:"向来",py:"xiànglái",tag:"Chú thích 2 · phó từ",mean:"Phó từ, biểu thị <b>từ trước đến nay đều như vậy</b> — “xưa nay, vốn luôn”. Gần nghĩa <span class='zh'>一向 · 从来 · 历来</span>.",forms:["S + 向来 + V / Adj","向来 + 不 / 没……"],ex:[["他们向来忠厚、老实，为人诚恳。","Họ xưa nay trung hậu, thật thà, đối xử thành khẩn."],["他教汉语向来重视识字，这样可以使留学生熟悉语素，进而掌握大量的词汇。","Ông dạy tiếng Hán xưa nay coi trọng nhận mặt chữ…"],["琴向来是要弹给知音听的，如今我唯一的知音已不在人世，这琴还弹给谁听呢？","",1]],tips:["Bài 19: <span class='zh'>历来 — 从来</span>.","Bài tập 2⑥."],practice:{q:"选择合适的句子填空：A. 向来为别人考虑得少　B. 向来他说了不算　C. 这地方向来热闹",type:"pos",items:[["（　），买东西的、逛街的、看热闹的，人山人海。","C","这地方向来热闹，……"],["他的缺点就是太自私，（　），为自己想得多。","A","……向来为别人考虑得少，为自己想得多。"],["他们家的事（　），得问他爱人。","B","他们家的事向来他说了不算，得问他爱人。"]]}},{id:"g3",grp:0,word:"领会",zh:"领会 / 领悟 / 出神 / 投机",py:"lǐnghuì / lǐngwù / chūshén / tóujī",tag:"Từ trong Bài tập 2",mean:"<span class='zh'>领会</span> = hiểu được (ý, tinh thần); <span class='zh'>领悟</span> = ngộ ra (sâu hơn). <span class='zh'>出神</span> = thẫn thờ, xuất thần. <span class='zh'>投机</span> = hợp ý (nói chuyện ăn ý).",forms:["领会 + 意思 / 精神","听 / 看得出了神","聊 / 谈得很投机"],ex:[["……不仅能领会其意，还能领悟其神。","",1],["……似乎听得出了神。","",1],["两人在月下侃侃而谈，越谈越投机。","",1]],tips:["Bài tập 2①②⑤."]},{id:"g4",grp:1,word:"气势",zh:"气势 / 气魄",py:"qìshì / qìpò",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa người / sự vật <b>thể hiện sức mạnh và khí khái</b>. <span class='zh'>气势</span>: thiên về <b>thái độ, thanh thế</b>. <span class='zh'>气魄</span>: thiên về <b>gan dạ, quyết đoán</b> của người khi xử lý việc.",forms:["气势 + 宏大 / 汹汹；从气势上压倒","有（大）气魄"],ex:[["这旋律表达了高山的雄伟壮观。有气势，有气魄！","",1]],tips:["SBT câu 23: <span class='zh'>豪迈 · 气魄 · 气概 · 气质</span>."]}],BX:{grp:1,word:"气势",cols:["气势","气魄"],pair:"气势 — 气魄",same:["Đều có nghĩa “<b>người hoặc sự vật thể hiện một sức mạnh và khí khái nào đó</b>”.","天安门城楼的气势 / 气魄非常雄伟。"],diff:[["Thiên về <b>thái độ, thanh thế</b>.","他气势汹汹地冲过来。","Thiên về <b>sự gan dạ, quyết đoán</b> của người khi xử lý công việc.<div class='zh' style='margin-top:4px'>他办事很有气魄。</div>"]],task:{q:"选择“气势”或“气魄”填空",cols:["气势","气魄"],sample:!1,items:[["处理大事就应该像他这样果断，有大____。",1,"Quyết đoán khi xử lý việc → 气魄."],["整场演出____宏大，精彩异常，深深吸引了广大观众。",0,"Thanh thế của buổi diễn → 气势."],["这样一个有大____的人，如果不当领导实在太可惜了。",1,"Phẩm chất của người → 气魄."],["在比赛中，不管实力如何，我们首先要从____上压倒对方。",0,"Thanh thế, khí thế → 气势."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>赞</u>叹","赞扬 · 赞美 · 称赞 · 夸赞"],items:[["<u>内</u>涵","内","内容 · 内外 · 内行 · 内敛"],["<u>晴</u>朗","晴","晴天 · 晴空 · 晴雨表 · 放晴"],["美<u>妙</u>","妙","奇妙 · 曼妙 · 巧妙 · 妙不可言"],["<u>豪</u>迈","豪","豪爽 · 豪杰 · 自豪 · 文豪"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["听了他的一席话，我________。","领会","听了他的一席话，我领会了许多道理。"],["________，不知道在想什么。","出神","他出神地望着窗外，不知道在想什么。"],["我们这些老百姓________。","平凡","我们这些老百姓生活得十分平凡。"],["昨天我们________。","应邀","昨天我们应邀参加了老友的婚礼。"],["________，很快就成了无话不谈的好朋友。","投机","我们聊得很投机，很快就成了无话不谈的好朋友。"],["他这个人________。","向来","他这个人向来做事认真。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["美妙","创作","精通","演奏","难能可贵"],text:"小王酷爱音乐，{美妙}的琴声总能给他带来无尽的享受。有时他会自己{演奏}几曲，有时也自己{创作}乐曲。虽然他并不是{精通}音乐之人，可{难能可贵}的是他一直保有对音乐的热爱。"},{bank:["黎明","真挚","不止","逝世","坟墓"],text:"爷爷{逝世}已经有段时间了，可每当提到他，奶奶还是泪流{不止}。从黄昏到{黎明}，奶奶整夜思念爷爷，实在忍不住了，她就到爷爷的{坟墓}前，跟他说说话。爷爷奶奶{真挚}的爱情真令人感动。"}]},EX4:{q:"请指出下列语段中是如何运用婉曲这一表达方式的",items:[{src:"",task:"有的人从出生到告别人世，从来没离开过自己生活的村庄。",model:"不直说“死”，以“告别人世”代替。"},{src:"",task:"聂耳以二十三岁的青春年华，过早地写下了他生命的休止符。",model:"不直说“死”，以“写下生命的休止符”代替。"},{src:"",task:"因为喝水太多，他没过多久就要去方便一下，让坐在他旁边的乘客很不耐烦。",model:"不直说“上厕所”，以“方便”代替。"},{src:"",task:"我们家那位啊，真是懒得不成样子。",model:"不直说“丈夫”或“妻子”，以“那位”代替。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["俞伯牙和钟子期相遇的经过","① 俞：酷爱音乐、无人领会、江边弹奏 ② 钟：打柴人、听得出了神、精通音乐","俞伯牙酷爱音乐，却没人能领会他琴声的内涵。一个中秋之夜，他在江边弹琴，一个打柴人听得出了神，原来他精通音乐。"],["俞伯牙和钟子期谈话的内容","① 雄壮豪迈——高山雄伟壮观 ② 曲折激越——波涛汹涌 ③ 清新流畅——无尽的流水","琴声雄壮豪迈时，钟子期说表达了高山的雄伟壮观；琴声曲折激越时，他说表达的是波涛汹涌；琴声清新流畅时，他说表达的是无尽的流水。"],["两人的约定，约定是否实现","① 来年中秋再见 ② 第二年，俞等待钟→钟未到→听说钟逝世、遗言→俞摔琴","两人约定来年中秋再见。第二年俞伯牙如约而来，却等不到钟子期，后来听说钟子期已经逝世，留下遗言要听他弹琴。俞伯牙在坟前弹了一曲，然后把琴摔了个粉碎。"],["说一说知音的含义","朋友……的情谊","人们用“知音”来形容朋友之间真挚而纯洁的情谊。"]]},PZ:{title:"修辞（5）婉曲",vn:"Nói giảm, nói tránh",intro:"<b>Cố ý không nói thẳng</b> sự việc, mà mượn câu chữ cùng nghĩa để diễn đạt một cách <b>uyển chuyển, quanh co</b> — đó là <b>婉曲</b>. Hay dùng khi nói về cái chết, bệnh tật, nhu cầu sinh lý, tuổi tác… để giữ lịch sự.",ex:[["临走前，他留下遗言，把坟墓修在江边，到八月十五，好听俞伯牙弹琴。","Không nói thẳng “死”, dùng “走” thay thế."],["各位先聊，我去方便一下。","Không nói thẳng “上厕所”, dùng “方便”."],["您刚40岁，长得好像有点儿着急。","Không nói thẳng “老”, dùng “长得着急”."]],q:"指出下列哪句使用了婉曲修辞手法",pvn:"(1) 在那家商店，我看到了一架旧手风琴，轻巧可爱。　(2) 妈妈，我的个人问题自己解决好不好，您就别操心了！　(3) 为了创造一个优美的生活环境，让我们大家共同努力吧！",practice:[["Câu nào dùng 婉曲？","(2) — không nói thẳng “婚姻问题”, dùng “个人问题” thay thế."]]},DP:[{title:"词汇（1）：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ để đoán nghĩa cả từ.",items:[["附件","fùjiàn","tệp đính kèm","附：附带 · 件：文件","请查收邮件的附件。"],["联盟","liánméng","liên minh","联：联合 · 盟：团体","几个国家组成了联盟。"],["师范","shīfàn","sư phạm","师：老师 · 范：榜样","他毕业于师范大学。"],["监督","jiāndū","giám sát","监：察看 · 督：督促","请大家监督我的工作。"],["撤销","chèxiāo","hủy bỏ","撤：除去 · 销：取消","这个决定已经被撤销了。"],["溶解","róngjiě","hòa tan","溶：溶化 · 解：分解","盐很容易在水中溶解。"],["无辜","wúgū","vô tội","无：没有 · 辜：罪","战争伤害了许多无辜的百姓。"],["批发","pīfā","bán buôn","批：成批 · 发：出售","这家商店只批发，不零售。"],["正负","zhèngfù","dương âm; tốt xấu","正：好的 / 大于零 / 失去电子 · 负：坏的 / 小于零 / 得到电子","这件事有正负两方面的影响。"]]},{title:"词汇（2）：熟悉下列动物生活方面的词语",vn:"Đọc đoạn văn: 最近，母猫<b>生育</b>了几只小猫，小猫们<b>发育</b>良好……它们与主人一起生活在一所大<b>别墅</b>里……难道它们也需要植物<b>纤维</b>？有时候，猫咪们会在沙发旁<b>摩擦</b>自己的皮毛……",items:[["生育","shēngyù","sinh đẻ","生育后代","母猫生育了几只小猫。"],["发育","fāyù","phát triển (cơ thể)","发育良好","小猫们发育良好。"],["别墅","biéshù","biệt thự","大别墅","他们住在一所大别墅里。"],["纤维","xiānwéi","chất xơ","植物纤维","蔬菜里含有大量纤维。"],["摩擦","mócā","cọ xát; va chạm","摩擦皮毛","猫咪在沙发旁摩擦自己的皮毛。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"女性杂志很受欢迎，实际上这类杂志并没有什么内涵和底蕴，读者不会从杂志中真正获得多少信息，得到的只是休息和放松。也就是说，“没什么实质性内容”反而成了女性杂志吸引人的地方。",o:["女性杂志的格调普遍不高","女性读者对杂志内容要求很高","女性读者希望杂志提供丰富信息","女性杂志因读起来轻松而受欢迎"],a:3,why:"“得到的只是休息和放松……反而成了……吸引人的地方”. Có <span class='zh'>内涵</span>!"},{n:2,say:"远古的地球，除了海水就是绿色。森林不但是原始人类的栖息之地，也是他们生产和生活资料的来源。然而，随着经济的发展与人口的增长，人类正在以摧毁地球为代价，肆无忌惮地砍伐着森林。",o:["没有森林就没有人类","远古人类靠海洋生存","远古人类生活在森林中","人类必须增强资源意识"],a:2,why:"“森林……是原始人类的栖息之地”. Có <span class='zh'>砍伐</span>."},{n:3,say:"他表演的相声在嬉笑怒骂间，用他自己的语言与判断陈述了相声界的现状及他本人曲折的经历。令他意外的是，这个段子赢得的竟然是台下相声爱好者的眼泪，然后是如雷般的掌声。",o:["他表演相声时经常又哭又笑","他做相声演员本身是个意外","他的相声反映了相声的发展历程","他的相声收到了意外的表演效果"],a:3,why:"“令他意外的是……赢得的竟然是……眼泪”."},{n:4,say:"樱花是日本民族的骄傲，它同雄伟的富士山一样，是勤劳、勇敢、智慧的象征。每年的3月15日，是日本的樱花节。这一天，日本的男女老少都会到公园或野外赏樱花，东京的上野公园在这天还有花宴、花会、花舞等种种活动。",o:["日本人很喜欢山","日本是个爱美的国家","日本把樱花视为骄傲","3月15日是日本的国庆节"],a:2,why:"“樱花是日本民族的骄傲”. Có <span class='zh'>雄伟</span>."},{n:5,say:"地毯怕湿，若不保持干燥，就会发霉，被虫蛀，缩短使用寿命。地毯每年最好在阳光下晾晒两三次。晒时要用木棍敲打，把地毯里的灰尘弹出。地毯如溅上酱油、菜汤和其他油脂，应立即用干净的干抹布轻轻擦去，切忌用湿抹布擦。",o:["地毯使用寿命很短","地毯不能经常暴晒","地毯不可用湿布擦","地毯上不可撒汤类等东西"],a:2,why:"“切忌用湿抹布擦”. Có <span class='zh'>溅</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：感谢您应邀接受我们的采访。您对健康、农业、移动银行等领域做出了预测，我们就聊聊这些领域吧。\n男：先说说埃博拉吧。希望我们可以消灭埃博拉，我们已经取得了很大进步，中国在其中付出了许多努力，投入了很多资源。事实证明应对这样的传染病爆发，需要广泛的国际合作。至于为什么健康会成为基金会的第一要务，是因为没有健康，贫困国家不仅会有很多孩子死亡，还会有很多孩子因为疾病或营养不良而丧失发展的机会，所以健康是最基本的保障。\n女：在农业方面，您刚才提到，中国是稻米生产的行家，还有哪些方面中国可以贡献更多的力量呢？\n男：首先中国在农业生产力方面实现了大幅度提升，而有的国家农业生产力大概是世界平均水平的五分之一，无论是政策扶持或是科技创新，中国都有很多经验。我们正在和中国合作，确保合适的技术被应用到非洲有需求的国家，并为当地带来实实在在的好处。\n女：那么移动银行呢？您觉得什么技术是移动银行革新的关键？\n男：如果我们在贫困地区推广传统银行，那么传统银行的收费结构对于贫困地区的居民来说成本过高，所以贫困地区的人会倾向于使用现金，同时传统银行的借贷利率也很高，所以它们不适用于这些地区。我们必须在这些地区推行新的银行，必须价格低廉而且高效，所以我们要推广电子银行。即便你只借一块或两块钱，服务成本也是非常低的。我们同时会对农民进行教育，教会他们如何借贷，如何更好地管理储蓄等。传统银行不能为穷人提供服务，但是这些新兴银行可以，我们需要做的是确保相关监管到位，推动普及教育，提高大家的信任度，并激励更多的创新者为电子银行开发新的产品和应用。",qs:[{n:6,q:"关于健康，男的首先谈到了什么？",o:["如何控制埃博拉疫情","钦佩、赞叹中国的医疗水平","许多国家为防治疾病投入了资金","对付某些传染病暴发需要国际合作"],a:3,why:"“应对这样的传染病爆发，需要广泛的国际合作”."},{n:7,q:"没有健康会怎样？",o:["会重新陷入贫困","会丧失发展机会","会导致人口危机","会减少投资收益"],a:1,why:"“很多孩子……丧失发展的机会”."},{n:8,q:"在农业方面，中国可以做出什么贡献？",o:["成为稻米生产的行家","研究如何提高生产力水平","介绍中国政策扶持的好经验","根据当地的需求推广合适的技术"],a:3,why:"“确保合适的技术被应用到非洲有需求的国家”."},{n:9,q:"对于贫困地区，传统银行有什么问题？",o:["现金不足","成本过高","利率不透明","服务不到位"],a:1,why:"“传统银行的收费结构……成本过高”."},{n:10,q:"关于移动银行，下列哪项正确？",o:["借一块钱不收费","价格低廉效率高","可替农民管理储蓄","监管到位信任度高"],a:1,why:"“必须价格低廉而且高效”. A: phí thấp, không phải miễn phí."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"托尔斯泰年轻时和屠格涅夫是好朋友。遗憾的是，有一天他们发生了争执，从此断交，一断就是17年。这期间，托尔斯泰一直在忙碌，恋爱、结婚、办学校、写作等。他分别用6年和3年的时间创作了《战争与和平》与《安娜·卡列尼娜》，这两部鸿篇巨著的先后问世，把他推到了文学的巅峰。\n步入50岁时，托尔斯泰开始对人生哲理进行新的探索。忆及屠格涅夫时，他惊奇地发觉，心中对屠格涅夫充满怀念，两人在一起喝酒、聊天、骑马、散步和讨论手稿的情景历历在目，屠格涅夫对他的鼓励、赞扬犹在耳边，他情不自禁地给屠格涅夫写了一封信。\n屠格涅夫收到信，立刻从国外赶回来，直奔托尔斯泰的庄园。俩人见面紧紧相拥。屠格涅夫含着热泪说：“我是流着泪读完您那封信的，惭愧的是，首先写那封信的为什么不是我呢！”\n世间再伟大的友谊也有受伤的时候，友谊需要包容，更需要真诚，唯有真诚能治愈受伤的心，唯有真诚能唤回友人远去的脚步。",qs:[{n:11,q:"关于托尔斯泰，下列哪项正确？",o:["他谈恋爱用了17年","他17年写了两部小说","他主动跟屠格涅夫和解","他的兴趣是喝酒、聊天"],a:2,why:"“他情不自禁地给屠格涅夫写了一封信”."},{n:12,q:"关于屠格涅夫，下列哪项正确？",o:["他很珍惜友情","他一直在养病","他缺少自省精神","他主动写信认错"],a:0,why:"Nhận thư lập tức từ nước ngoài về, ôm chặt, rơi lệ."},{n:13,q:"这段话主要想告诉我们什么？",o:["友谊需要真诚对待","多好的朋友都会吵架","世界上没有牢固的友谊","放下架子也没什么大不了"],a:0,why:"“友谊需要包容，更需要真诚”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"那是一个晴朗的早晨。公园里，一个得了绝症的男孩在轻声歌唱，他在歌唱生命，他认为没有一样东西是永远不变的，生命也一样。不远处，一个女孩在跳舞，舞姿如蝴蝶。\n男孩看到了正在跳舞的女孩，坐在旁边，静静地看她把舞跳完，说了句“你跳得真好。”“谢谢！”女孩回答。男孩看着女孩清秀的面孔，惊异地发现，那是两只无神的眼睛——她是个盲女。男孩的心抽动了一下。\n他们认识了。一有空，就会在公园相见，男孩唱歌，女孩伴舞。一天又一天，一种强烈的欲望渐渐从男孩心中升起……\n这天，女孩兴奋地告诉男孩，有人愿意捐出眼角膜，那真是最宝贵的礼物，不久自己就能见到光明了。男孩笑了笑，对女孩说：“我曾经不相信世界上有永远不变的事物，但我现在明白世上存在永恒，那就是友情。我要走了，永远都不回来了，我将永远珍藏我们的友谊。”\n女孩没想到，男孩的告辞竟是永别，而且给自己留下最宝贵礼物的就是他。\n女孩的手术成功了，她看到了这个美丽的世界，虽然她一直没有机会亲眼看到男孩，但男孩在她的心里永远是清晰的。",qs:[{n:14,q:"关于那个晴朗的早晨，下列哪项正确？",o:["男孩在公园里歌唱","男孩想给女孩惊喜","女孩在给男孩跳舞","公园里有很多蝴蝶"],a:0,why:"“公园里，一个得了绝症的男孩在轻声歌唱”."},{n:15,q:"关于女孩，下列哪项正确？",o:["她是个舞蹈演员","她的眼睛失明了","她早就认识男孩","她想帮男孩治病"],a:1,why:"“她是个盲女”."},{n:16,q:"关于男孩，下列哪项正确？",o:["他很欣赏会跳舞的女孩","他告别女孩远走他乡了","他生病后变得非常悲观","他逝世后捐出了眼角膜"],a:3,why:"“给自己留下最宝贵礼物的就是他” — <span class='zh'>我要走了</span> là 婉曲!"},{n:17,q:"根据这段话，可以知道什么？",o:["男孩善良而宽容","男孩死于心脏病","女孩重见了光明","医生的医术高明"],a:2,why:"“她看到了这个美丽的世界”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["学习成绩的提高，主要取决于是否学生努力。","老头儿一个巴掌打去，吴三差点儿被打趴下，嘴角顿时流出血来。","南海波涛汹涌，夜间行船更是危险，即将远行的李云望着海面出神。","和“十七年”电影相比，20世纪90年代以后的电影主旋律发生了明显的变化。"],a:0,why:"<b>Trật tự / một mặt – hai mặt</b>: “提高” (một mặt) đi với “是否” (hai mặt) không khớp; và phải là <span class='zh'>学生是否努力</span>."},{n:19,o:["中国古代诗歌很讲究节奏和押韵，音乐感很强。","他把自己构想中的车体形状画在一张乐谱的背面拿给我看。","随着秦兵马俑在沉寂24年后的再次发掘，引起了国内外媒体的关注。","黎明之前，客机在空中突然粉碎性解体，141名机组人员和乘客全部遇难。"],a:2,why:"<b>Giới từ làm mất chủ ngữ</b>: <span class='zh'>随着……，引起了……</span> → bỏ <span class='zh'>随着</span>, hoặc thêm chủ ngữ. B dùng <span class='zh'>一个巴掌</span> kiểu “一个 + N” (đúng)."},{n:20,o:["睡前在脸上涂抹鸡蛋清，早上起来用清水洗，可使脸部肌肤润滑，保持青春的美丽。","萤火虫原本出没在野草丛生的荒凉的地方，如今竟在宫院中飞来飞去，说明宫女生活的凄凉。","在他的遗体前，我们悲痛万分。他一直关心和照顾着我们一家，可我们还没来得及感谢他，他就走了。","经济泡沫与泡沫经济是两个不同的概念，前者反映的是“局部”的经济现象；后者反映的是“全局”的经济形象。"],a:0,why:"<b>Phối hợp không hợp</b>: <span class='zh'>保持青春的美丽</span> dư / không hợp → <span class='zh'>保持青春</span> — đáp án sách: A. C dùng 婉曲 “走” (đúng)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"“民间艺术”，是艺术领域中的一___分类，冠以“民间”字样，___是要与所谓的“宫廷艺术”与“贵族艺术”等有所区分，而且“民间艺术”的领域也更___。",o:["份　不止　壮观","项　显然　宽广","类　明确　美妙","门　向来　平凡"],a:1,why:"<span class='zh'>一项分类</span>; <span class='zh'>显然</span>; <span class='zh'>领域宽广</span>. Có <span class='zh'>民间</span>!"},{n:22,text:"纽约是个艺术的大都会，___那里的很多街头艺人___，完全可以上卡耐基音乐厅进行___。但为什么他们会在街头或地铁站里表演呢？说___了这其实是一种生活方式。",o:["据说　技艺超群　演奏　白","传说　难能可贵　表演　穿","话说　出类拔萃　演出　明","虽说　超群出众　上演　破"],a:0,why:"<span class='zh'>据说</span>; <span class='zh'>技艺超群</span>; <span class='zh'>演奏</span> (từ mới!); <span class='zh'>说白了</span> = nói trắng ra."},{n:23,text:"坐在他对面，听他侃侃而谈，我有时会产生这样的___：这个人怎么这么奇怪？中国传统文化中___熏陶出博学儒雅的文士、忍辱负重的忠良、___悲歌的英雄，但极少会有他那份泼辣、尖刻、诙谐的___。",o:["怀疑　不时　豪迈　气魄","疑问　不免　豪壮　真挚","困扰　时而　正气　气概","疑惑　间或　慷慨　气质"],a:3,why:"<span class='zh'>产生疑惑</span>; <span class='zh'>间或</span> = thỉnh thoảng; <span class='zh'>慷慨悲歌</span>; <span class='zh'>气质</span>. Có <span class='zh'>侃侃而谈 · 熏陶</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"家里穷得揭不开锅了，庄子只好硬着头皮到监河侯家去借粮。监河侯爽快地答应下来，说：“行，等我收到租税后，(24)。”庄子听罢满脸沮丧，对监河侯说：“我昨天赶路，半路听到呼救声。环顾四周不见人影，再观察周围，(25)，呼吸急促，气息奄奄。”庄子叹了口气说：“唉，它见到我，像遇见救星般向我求救。据说，这条鱼原住东海，不幸沦落车辙，眼看就快要干死了，请求路人给点儿水，救救性命。”(26)，问他是否救助了那条鱼。庄子冷冷地说：“我说可以，等我到南方，请人帮忙把清澈的江水引到你这儿来，你就可以游回东海老家去了！”\n(27)，说：“那怎么行呢？”“是啊，鱼也说眼下断了水，没有安身之处，只需几桶水就能解困，你那叫远水不解近渴呀，不等把水引来，我就成了干鱼啦！”\n“远水解不了近渴”，(28)，用以讽刺说大话、讲空话、不解决实际问题的做法。我们提倡少说空话，多办实事。",opts:["原来干涸的车辙里躺着一条鱼","马上借你300两银子","监河侯认为庄子的救助方法十分荒唐","这是人们的常识","监河侯听了庄子的话"],ans:{24:1,25:0,26:4,27:2,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"生活中并不是所有的人都能成为朋友。每个人都有自己的人生态度、性格特点、处世方法和情趣爱好，选择朋友也各自都有标准。有的人的标准是能玩儿到一块儿，有的人的标准是能聊到一块儿，有的人希望朋友是自己的心灵港湾，有的人希望朋友能替自己解决难题。我交朋友的原则是追求心灵的沟通。\n我常想，人生在世，离不开友情，离不开互助，离不开关心，离不开支持。在朋友遇到困难、遭受挫折时，能够伸出援手，帮助朋友渡过难关，要比赠送名贵礼物有用得多。因为真正的朋友，应该相互排忧解难，欢乐与共。唯此，友谊才能持久常存。\n朋友之间的伤害往往是无心的，帮助却是真心的，生活中，就算最要好的朋友也会有摩擦，忘记那些无心的伤害，铭记那些真心的帮助，你会发现这世上你有很多真心的朋友。夜深人静时，当你望向星空，脑海中就会浮现跟朋友在一起时的美好时光，这就是朋友的重要！\n我想永远拥有许多真心的朋友，但我深知这是不可能的，人生本来就是聚少离多。人生贵在相知，互相的惦念、互相的牵挂、互相的爱护便是人世间最难得的情感抚慰。好友之间所以能长期共存，正是因为有了这种心灵间的相互依存与默契，唯此，孤独的人生才变得丰富而深刻。",qs:[{n:29,q:"什么样的人能够成为“我”的朋友？",o:["与“我”爱好一致","与“我”有话可说","能帮“我”解决困难","与“我”有共同语言"],a:3,why:"“我交朋友的原则是追求心灵的沟通”."},{n:30,q:"真正的朋友，就应该：",o:["经常联系","雪中送炭","常送礼物","相见恨晚"],a:1,why:"“在朋友遇到困难……能够伸出援手”."},{n:31,q:"第3段画线词语“无心”的意思最可能是：",o:["很快就忘了","没往心里去","不是成心的","用心设计的"],a:2,why:"<span class='zh'>无心</span> = vô tình, không cố ý (≈ 不是成心的, bài 24)."},{n:32,q:"作者认为人生最珍贵的是：",o:["有丰富经历","有家人陪伴","有爱人支持","有朋友相依"],a:3,why:"“人生贵在相知……心灵间的相互依存与默契”."}]},{ins:"第33–36题：请选出正确答案。",text:"邹忌高高的个子，英俊秀美，又不失男子汉气质。每次面对镜子，都感觉自己足够帅。徐公是齐国出了名的美男子，每每提起徐公的美貌，邹忌都会有些不自信。这天，他穿上礼服又站在了镜子前面，恰好妻子走过来，他试探着问妻子：“我跟城北徐公谁美？”妻子说：“您美，徐公哪里比得上您！”邹忌看了看镜子，不太相信。转而问他的侍妾：“我跟徐公谁美？”侍妾说：“当然是您美了！”第二天，来了位客人，言语之中，邹忌又问客人：“我跟徐公谁美？”客人说：“徐公不如您美。”\n过了一天，徐公来访。邹忌仔细端详后，觉得徐公的美貌绝对超过自己。可是妻妾和客人为什么都不以实话相告呢？\n黑夜降临，邹忌躺在床上，心里还在琢磨这事，想来想去终于明白了：妻子说自己美，是偏爱自己；侍妾说自己美，是惧怕自己；客人说自己美，是有求于自己。\n第二天，邹忌见到了齐王，把这件事讲给了齐王听，并感慨道：“现在齐国也堪称大国了，您的妻妾、亲信，没有一个不偏爱您的；满朝大臣，没一个不惧怕您的；有求于您的人就更多了。您要是不能明辨真相，后果就严重了！”齐王领会了邹忌话中的含义，立刻下了道命令，无论以什么方式给朝廷提意见，都会得到奖励，哪怕在公共场所指责齐王。\n一时间，臣子们上朝进言的队伍从宫门排到了殿堂，好不热闹；几个月后，提意见的积极性还是很高，但意见少多了；一年以后，即使想提意见，也没什么可说的了。齐国也因此变得更强大了。",qs:[{n:33,q:"关于邹忌，下列说法正确的是：",o:["不像个男子汉","对徐公有些嫉妒","很会给齐王讲故事","能够透过现象看本质"],a:3,why:"Hiểu ra vì sao vợ, thiếp, khách đều khen — nhìn thấu bản chất."},{n:34,q:"妻、妾、客人的共同点是：",o:["审美观不同","都说了假话","习惯了实话实说","都认为邹忌最美"],a:1,why:"“为什么都不以实话相告呢？”"},{n:35,q:"关于齐王，下列说法正确的是：",o:["做了很多错事","以前大家都怕他","是个犹豫不决的君主","思想开通，不顽固保守"],a:3,why:"Lập tức ra lệnh khuyến khích góp ý, kể cả chỉ trích vua nơi công cộng. Có <span class='zh'>领会 · 含义</span>!"},{n:36,q:"最后一段画线词语“一时间”的意思是：",o:["短时间内","偶然","一个时期","三天两头"],a:2,why:"Đáp án sách: C — <span class='zh'>一时间</span> = trong một thời kỳ (lúc ấy)."}]}]},W:{zh:"写作",vn:"Viết văn: 我的知音",t:"35 phút",min:!0,task:"“高山流水遇知音”在中国广为流传，通过俞伯牙和钟子期的故事，人们懂得了知音难觅，知音是多么的宝贵。想一想，你有没有知音？你们的故事是什么样的？请以“我的知音”为题写一下你们相遇、相知的故事，字数不少于400字。",target:400,steps:[["Mở bài","Dẫn điển tích Bá Nha – Tử Kỳ (引用): <span class='zh'>知音难觅</span>."],["Gặp gỡ","Ở đâu, khi nào, ấn tượng đầu tiên: <span class='zh'>一个不留神 · 偶遇 · 出神</span>."],["Hiểu nhau","Chi tiết cho thấy hai người hiểu nhau: <span class='zh'>领会 · 领悟 · 越谈越投机 · 侃侃而谈</span>."],["Một kỷ niệm","Khó khăn được bạn giúp, hoặc xa cách vẫn nhớ nhau: <span class='zh'>向来 · 真挚 · 深情厚谊</span>."],["Kết","Ý nghĩa tri âm với bạn; có thể dùng 婉曲 / 比喻."]],outline:[["一 · 引子","高山流水的故事"],["二 · 相遇","时间、地点、经过"],["三 · 相知","我们怎样了解彼此"],["四 · 难忘的事","一个具体的故事"],["五 · 感受","知音对我的意义"]],model:"我的知音\n俞伯牙和钟子期“高山流水遇知音”的故事让我懂得，人生得一知音是多么难能可贵。我很幸运，因为我也有一位知音，她就是我的大学同学小林。\n我们是在大学的图书馆认识的。那天我想借一本越南作家写的小说，可书架上只剩下最后一本，我们俩同时伸出了手。我一个不留神，把书碰到了地上。我们相视一笑，就坐下来聊了起来。没想到，我们喜欢的作家、读过的书几乎一模一样，越谈越投机，一直聊到图书馆关门。\n从那以后，我们常常一起看书、一起散步、一起讨论问题。她向来话不多，可每次我心情不好，不用开口，她就能领会我的心思。有一次我考试没考好，一个人坐在宿舍里发呆，她什么也没问，只是默默地给我泡了一杯热茶，然后陪我坐了一个晚上。那一刻，我觉得自己是世界上最幸福的人。\n毕业以后，她回了家乡，我留在了城市工作，我们一年也见不了几次面。可是无论离得多远，我们的情谊一点儿也没变。遇到高兴的事，我第一个想告诉的是她；遇到难过的事，我第一个想找的也是她。\n俞伯牙失去了知音，摔碎了自己的琴。而我想对我的知音说：谢谢你，我会永远珍惜我们之间这份真挚而纯洁的友谊。",check:["Có tiêu đề “我的知音”","Có dẫn điển tích / mở bài","Có hoàn cảnh gặp gỡ","Có chi tiết hiểu nhau","Có một kỷ niệm cụ thể","Dùng ít nhất 4: 领会 · 投机 · 向来 · 一个不留神 · 真挚 · 纯洁 · 难能可贵","Không ít hơn 400 chữ"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"4年前，记者偶然得知，一位清华大学退休老教授生前倾毕生积蓄捐助西部贫困学子。他想做一次采访，但几次与校方沟通，均因尊重老教授“不要张扬”的遗愿而被婉拒了。\n随着时间的推移，细节在口口相传中愈加清晰：他退休后在美国做客座教授，薪酬不菲，却日日省吃俭用；他回国后在某著名企业担任顾问，还自带铺盖、炊具，租住普通民房；他捐出所有，却在癌症晚期舍不得用进口药……\n4年后的一个黄昏，一直想采访的记者终于如愿以偿。他走进赵家和十几年未曾变样的住所，赵家和满头白发的妻子坐在老旧的转椅里，安详而沉静地回忆着丈夫的一切：“他最爱教书”、“最高兴的事就是讲一个问题，别人听懂了”、“他离不开学生”……\n1998年，赵家和退休了。他去了美国做客座教授，大家以为赵老师颐养天年的好日子开始了。三年后，他却放弃了待遇丰厚的工作回国了，把从美国带回的20多万美元交给了他的学生刘迅打理，自己继续在外讲学、给商业机构做顾问。\n2005年，账户里的资金超过了500万。这一次，72岁的赵家和要做一件在他心中酝酿已久的大事了——捐资助学。\n先搞实地调研：为了解贫寒学子的生活状况，赵家和搭乘公共汽车，一趟趟考察。再搞模型论证：赵家和认为，小学、初中有义务教育，大学有助学贷款，钱要花在穷孩子“最要劲”的高中上。有句话他常挂在嘴边：“我们也没有多大本事，就做一点儿雪中送炭的事吧，锦上添花的事情就不做了。”\n2006年，第一笔助学款从北京寄出，江西、湖北、吉林、甘肃……中国的版图上，多少在困境中拼搏的贫寒学子在赵老师的助推中重燃希望；2009年，赵家和改变捐助方式，把捐助范围从全国多地向西部聚拢；2011年，他筹建了助学基金会；无数优秀寒门学子成为资助对象。\n在美国讲学、在欧洲开会，吃最便宜的鸡腿，啃法棍面包，是他的生活常态。一辈子过着精打细算的日子，可就是这样的赵老师有1000多万，而且全都捐了。\n就在助学走上正轨的时候，赵家和病倒了。惊闻此事的刘迅不知所措，然而他又有些庆幸——幸亏赵老师的账户上有一千多万，可以保证最好的治疗。可赵家和又做出了惊人的决定：保守治疗，钱全部用于助学。\n“什么才是最好的投资？赵老师的人生追求是什么？”记者问赵老师的妻子。这个与赵家和携手走过一生的温婉老人微微一笑，说：“就是做事吧。”",model:"倾囊助学的赵家和\n赵家和是清华大学的退休教授，他生前把一生的积蓄都捐给了西部的贫困学生。因为他不愿张扬，记者一直没能采访到他。直到四年后，记者才见到了他的妻子。妻子说，他最爱教书，离不开学生。\n1998年退休后，赵家和去美国做客座教授，收入很高，却每天省吃俭用。三年后，他放弃了待遇丰厚的工作回国，把带回的二十多万美元交给学生刘迅打理，自己继续讲学、做顾问。\n2005年，账户里的钱超过了500万，72岁的赵家和决定捐资助学。他坐公共汽车一趟趟地调查贫困学生的情况，认为小学、初中有义务教育，大学有助学贷款，钱应该花在高中上。他常说：“就做一点儿雪中送炭的事吧。”\n2006年，第一笔助学款寄出，许多贫寒学子重新燃起了希望。后来，他把捐助重点放在西部，还成立了助学基金会。\n他一辈子精打细算，吃最便宜的东西，却把一千多万全都捐了出去。后来他得了癌症，本来可以用这些钱得到最好的治疗，可他决定保守治疗，钱全部用于助学。\n记者问他的妻子，赵老师的人生追求是什么，老人微笑着说：“就是做事吧。”"}},SUM:{words:["领会","内涵","港湾","晴朗","清澈","出神","弦","美妙","砍伐","平凡","乐谱","赞叹","创作","民间","精通","难能可贵","应邀","钦佩","演奏","豪迈","旋律","雄伟","壮观","气势","气魄","曲折","节奏","波涛","气概","含义","荒凉","领悟","侃侃而谈","投机","黎明","告辞","黄昏","降临","沮丧","变故","逝世","坟墓","不止","粉碎","向来","凄凉","深情厚谊","真挚","纯洁"],patterns:[["一个 + 不留神 / 不小心 + V","俞伯牙一个不留神，“啪”的一声，琴弦拔断了一根。"],["V + 了个 + Adj / V","他把心爱的琴摔了个粉碎。"],["向来 + V / Adj","琴向来是要弹给知音听的。"],["当……时，……","当琴声变得清新流畅时，打柴人说……"],["修辞：婉曲","临走前，他留下遗言……（走 = 死）"]],diff:["气势: thiên về thái độ, thanh thế (气势汹汹 · 气势宏大 · 从气势上压倒) — 气魄: thiên về gan dạ quyết đoán khi xử lý việc (办事有气魄 · 有大气魄)","投机 = hợp ý (tt.) / đầu cơ (đgt.) · 逝世 · 走 · 不在人世 · 告别人世 = 婉曲 của 死 · 侃侃而谈 kǎnkǎn"],sentences:["虽然大家都赞美他琴弹得好，却从没有人能真正领会他琴声的内涵。","没想到在这荒凉之地，竟觅到自己久寻不遇的知音，不仅能领会其意，还能领悟其神。","琴向来是要弹给知音听的，如今我唯一的知音已不在人世，这琴还弹给谁听呢？"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “我的知音” ≥400 chữ (mục 7).","Luyện đề 缩写: chuyện thầy 赵家和 10 phút đọc, 35 phút viết.","Làm Sách bài tập bài 28.","Đọc trước bài 29 (Đơn vị 8 · 人体探秘)."]}});
