<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 21 · 未来商店 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-21",num:21,book:"HSK 标准教程 6（下）",unit:{n:6,zh:"趣味世界",vn:"Thế giới thú vị"},title:"未来商店",vn:"Cửa hàng tương lai",chars:897,source:"改编自《北京晚报》文章《未来商店什么样》",goals:["Đọc hiểu bài báo 897 chữ miêu tả <b>mô hình mua sắm của cửa hàng tương lai</b>: tự động hóa, trợ lý mua sắm, thanh toán thông minh, khách tham gia thiết kế.","Dùng được 54 từ mới, nhất là nhóm <b>thương mại – công nghệ</b>: <span class='zh'>登录 · 指令 · 仓库 · 储备 · 结算 · 模式 · 屏幕 · 性能 · 运算 · 反馈 · 款式 · 需求</span> và thành ngữ <span class='zh'>川流不息 · 根深蒂固 · 欣欣向荣 · 无微不至</span>.","Nắm <span class='zh'>以免 · 嫌</span>.","Phân biệt <span class='zh'>不免 — 未免</span>; làm quen <b>篇章修辞 (1): 省略 — lược bỏ chủ ngữ</b>.","Tóm tắt (缩写) bài khóa thành ~350 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (以免 · 嫌 · 不免—未免) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 · Đoạn 4–8 · 省略 · Bài tập · Luyện đề · Viết tóm tắt"]],outline:[{tag:"起",name:"Câu hỏi",paras:"Đoạn 1",zh:"网购急剧增加，实体店还会存在吗？",vn:"Mua sắm online tăng vọt — cửa hàng truyền thống còn tồn tại? Phải “cách mạng” chứ không chỉ “cải tiến”."},{tag:"承",name:"Đặc điểm",paras:"Đoạn 2",zh:"电子化；几乎没有工作人员",vn:"Kho, bán hàng, quản lý khách hàng đều điện tử hóa; khách tự hoàn thành việc mua."},{tag:"转",name:"Mô hình mua sắm",paras:"Đoạn 3–6",zh:"购物助手 · 结账 · 参与设计 · 互动",vn:"Trợ lý mua sắm chỉ đường, đặt làm sạch cá, tư vấn chọn điện thoại; cân & tính tiền tự động; khách bỏ phiếu thiết kế; gửi ảnh để tìm hàng."},{tag:"合",name:"Tôn chỉ",paras:"Đoạn 7–8",zh:"以消费者为主导；轻松、快捷、便利",vn:"Lấy người tiêu dùng làm chủ đạo — cửa hàng như vậy sao có thể không phát đạt!"}],warm1:{q:"你喜欢网络购物吗？你觉得未来商店会是什么样子的？实体商店还会存在吗？请谈一谈你的设想。",vn:"Bạn đã từng dùng những hình thức mua sắm sau chưa? Bấm 有 / 无.",items:[["🛒","网络购物 wǎngluò gòuwù","Mua sắm trực tuyến"],["🏬","实体商店 shítǐ shāngdiàn","Cửa hàng truyền thống (có mặt bằng)"],["📱","自助结账 zìzhù jiézhàng","Tự thanh toán (không cần thu ngân)"]],talk:["你一般在网上买什么？在商店买什么？","你心目中的未来商店是什么样子的？"],link:"Bài viết ra đời khoảng 2010 — nhiều “dự đoán” trong bài (tự thanh toán, quét ảnh tìm hàng…) nay đã thành hiện thực. Hãy so sánh khi đọc!"},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"体",rule:"体 = <b>thể, khối, tập thể</b>.",w:[["实体","shítǐ","thực thể (có trong bài)"],["本体","běntǐ","bản thể"],["客体","kètǐ","khách thể"],["个体","gètǐ","cá thể"],["集体","jítǐ","tập thể"],["全体","quántǐ","toàn thể"],["球体","qiútǐ","khối cầu"],["群体","qúntǐ","quần thể"],["团体","tuántǐ","đoàn thể"],["物体","wùtǐ","vật thể"],["整体","zhěngtǐ","chỉnh thể"],["主体","zhǔtǐ","chủ thể"],["总体","zǒngtǐ","tổng thể"],["具体","jùtǐ","cụ thể"]]},{k:"奔",rule:"奔 = <b>chạy, bôn ba</b>.",w:[["奔走","bēnzǒu","chạy vạy (có trong bài)"],["奔跑","bēnpǎo","chạy"],["奔驰","bēnchí","phi nhanh"],["奔忙","bēnmáng","bận rộn ngược xuôi"],["奔波","bēnbō","bôn ba"],["奔腾","bēnténg","cuồn cuộn"],["飞奔","fēibēn","chạy như bay"],["狂奔","kuángbēn","chạy điên cuồng"],["疲于奔命","píyú-bēnmìng","chạy đôn chạy đáo kiệt sức"]]},{k:"屏",rule:"屏 = <b>màn hình</b>.",w:[["触摸屏","chùmōpíng","màn hình cảm ứng (có trong bài)"],["荧屏","yíngpíng","màn ảnh nhỏ"],["显示屏","xiǎnshìpíng","màn hình hiển thị"],["宽屏","kuānpíng","màn hình rộng"],["窄屏","zhǎipíng","màn hình hẹp"],["屏幕","píngmù","màn hình (từ mới)"]]},{k:"能",rule:"能 = <b>năng lực, công năng</b>.",w:[["性能","xìngnéng","tính năng (từ mới)"],["功能","gōngnéng","chức năng"],["智能","zhìnéng","thông minh"],["职能","zhínéng","chức năng (cơ quan)"],["本能","běnnéng","bản năng"],["才能","cáinéng","tài năng"],["机能","jīnéng","cơ năng"],["技能","jìnéng","kỹ năng"],["效能","xiàonéng","hiệu năng"],["全能","quánnéng","toàn năng"],["万能","wànnéng","vạn năng"],["无能","wúnéng","bất tài"],["低能","dīnéng","kém năng lực"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3a",sub:"Mua sắm thay đổi",from:1,to:23},{name:"Nhóm 2 · Đoạn 3b–5",sub:"Trợ lý, thanh toán, thiết kế",from:24,to:36},{name:"Nhóm 3 · Đoạn 6–8",sub:"Tương tác & tôn chỉ",from:37,to:54}],V:[[1,"急剧","jíjù","tt.","cấp kịch","nhanh, nhanh chóng (đột ngột)",1,"","急速；迅速而剧烈。","喜欢网络购物的人急剧增加","气温急剧下降。","Nhiệt độ giảm đột ngột.",["急剧增加","急剧变化"],"Bài tập 2①."],[2,"川流不息","chuānliú-bùxī","thành ngữ","xuyên lưu bất tức","qua lại nườm nượp",1,"成","（行人、车马等）像水流一样连续不断。","川流不息的人群","街上的车辆川流不息。","Xe cộ trên phố nườm nượp không ngớt.",[],"Bài tập 3②. SBT câu 27."],[3,"登录","dēnglù","đgt.","đăng lục","đăng nhập",1,"","进入网站、系统等。","仅需登录网站","请先登录你的账号。","Hãy đăng nhập tài khoản trước.",["登录网站"],""],[4,"指令","zhǐlìng","dt.","chỉ lệnh","mệnh lệnh, lệnh",1,"","上级给下级的命令；计算机的操作命令。","下几道指令","电脑按照指令运行。","Máy tính chạy theo lệnh.",["下指令"],"Bài tập 3②."],[5,"根深蒂固","gēnshēn-dìgù","thành ngữ","căn thâm đế cố","thâm căn cố đế, ăn sâu bén rễ",1,"成","比喻基础稳固，不容易动摇。","根深蒂固的购物习惯","这种观念在人们心中根深蒂固。","Quan niệm này đã ăn sâu trong lòng người.",[],"SBT câu 22."],[6,"不免","bùmiǎn","phó.","bất miễn","không tránh được",1,"","免不了。","我们不免要问","第一次上台，不免有些紧张。","Lần đầu lên sân khấu, khó tránh khỏi hồi hộp.",[],"Xem <b>辨析 不免—未免</b>. SBT câu 23."],[7,"预言","yùyán","đgt.","dự ngôn","tiên đoán, dự đoán",1,"","预先说出（将来要发生的事情）。","有人这样预言","专家预言房价还会上涨。","Chuyên gia dự đoán giá nhà còn tăng.",[],"Bài tập 1 (ví dụ): <span class='zh'>预测 · 预防 · 预报 · 预计</span>. SBT nghe câu 1."],[8,"革命","gémìng","đgt.","cách mạng","cải cách triệt để",1,"","根本改革。","必须进行根本性的革命","互联网带来了一场信息革命。","Internet mang đến một cuộc cách mạng thông tin.",[],""],[9,"改良","gǎiliáng","đgt.","cải lương","sửa đổi, cải tiến",1,"","去掉事物的某些缺点，使更适合要求。","而不是改良","这个品种是改良过的。","Giống này đã được cải tiến.",["改良品种"],"Bài tập 1: <span class='zh'>改正 · 更改 · 改错 · 整改</span>."],[10,"欣欣向荣","xīnxīn-xiàngróng","thành ngữ","hân hân hướng vinh","thịnh vượng, phồn vinh",1,"成","形容草木茂盛；比喻事业蓬勃发展。","昔日的欣欣向荣","到处是一片欣欣向荣的景象。","Khắp nơi là cảnh phồn vinh.",[],"SBT nghe câu 17."],[11,"仓库","cāngkù","dt.","thương khố","kho, nhà kho",1,"","储存粮食或其他物资的建筑物。","仓库货物储备管理","货物都放在仓库里。","Hàng hóa đều để trong kho.",[],""],[12,"储备","chǔbèi","đgt.","trữ bị","dự trữ, trữ",1,"","储存起来以备需要时使用。","仓库货物储备管理","国家储备了大量粮食。","Nhà nước dự trữ lượng lớn lương thực.",["人才储备"],"Bài tập 1: <span class='zh'>完备 · 准备 · 备份 · 设备</span>."],[13,"结算","jiésuàn","đgt.","kết toán","kết toán, thanh toán",1,"","把一个时期的账目结清。","销售结算","可以网上结算。","Có thể thanh toán trên mạng.",[],"Bài tập 1: <span class='zh'>计算 · 算数 · 算式 · 清算</span>. SBT nghe câu 7."],[14,"模式","móshì","dt.","mô thức","mô hình, kiểu, mẫu",1,"","某种事物的标准形式。","一种全新的商业模式","这是一种新的管理模式。","Đây là một mô hình quản lý mới.",["商业模式"],"Bài tập 3①. SBT câu 23, 24–28."],[15,"把手","bǎshou","dt.","bả thủ","tay cầm, quai xách",1,"","器物上便于用手拿的部分。","购物车把手上","门把手坏了。","Tay nắm cửa hỏng rồi.",["门把手"],"SBT câu 19."],[16,"装卸","zhuāngxiè","đgt.","trang tá","lắp ráp, tháo lắp; bốc dỡ",1,"","装到运输工具上和从运输工具上卸下；把机械等装配和拆卸。","一个可随意装卸的无线电脑工具","工人们在码头装卸货物。","Công nhân bốc dỡ hàng ở bến cảng.",[],"Bài tập 1: <span class='zh'>装饰 · 服装 · 装修 · 装模作样</span>. SBT câu 24–28."],[17,"屏幕","píngmù","dt.","bình mạc","màn hình",1,"","显示图像的平面。","小屏幕上就会显示……","手机屏幕摔碎了。","Màn hình điện thoại bị vỡ.",[],"Bài tập 3①."],[18,"相应","xiāngyìng","đgt.","tương ứng","tương ứng, đúng với",1,"","相适应；相呼应。","走到相应货架时","收入增加了，消费也相应提高。","Thu nhập tăng, tiêu dùng cũng tăng tương ứng.",[],"Bài tập 3②."],[19,"仪器","yíqì","dt.","nghi khí","máy móc, thiết bị",1,"","科学技术上用于实验、计量、观测等的器具或装置。","仪器会发出提示音","实验室里有很多精密仪器。","Phòng thí nghiệm có nhiều thiết bị tinh vi.",[],"SBT câu 19."],[20,"以免","yǐmiǎn","liên.","dĩ miễn","để tránh",1,"书","用在下半句开头，表示使下文所说的情况不至于发生。","以免消费者错过商品","出门带把伞，以免淋雨。","Ra ngoài mang ô để khỏi dầm mưa.",[],"Xem <b>Ngữ pháp: 以免</b>. SBT câu 21."],[21,"嫌","xián","đgt.","hiềm","ghét, chê, không thích",1,"","厌恶；不满意。","又嫌腥","他嫌这件衣服太贵。","Anh ấy chê chiếc áo này đắt quá.",[],"Xem <b>Ngữ pháp: 嫌</b>."],[22,"腥","xīng","tt.","tinh","tanh",1,"","有鱼虾等的难闻气味。","又嫌腥","这鱼有点儿腥。","Con cá này hơi tanh.",[],""],[23,"清理","qīnglǐ","đgt.","thanh lý","giải quyết, dọn dẹp",1,"","彻底整理或处理。","等店员把鱼清理好后","周末我要清理一下房间。","Cuối tuần tôi phải dọn dẹp phòng.",[],""],[24,"等候","děnghòu","đgt.","đẳng hậu","đợi, chờ",1,"","等待（多用于具体的对象）。","不必排队等候","请在门口等候。","Xin chờ ở cửa.",[],"Bài tập 3②."],[25,"性能","xìngnéng","dt.","tính năng","tính năng, chức năng gữ","vô vi bất chí","tỉ mỉ chu đáo, từng li từng tí",1,"成","没有一处细微的地方不照顾到。形容关怀、照顾得非常细心周到。","关怀可谓无微不至","妈妈对我的照顾无微不至。","Mẹ chăm sóc tôi từng li từng tí.",[],"Bài tập 2⑥. SBT nghe câu 14–17."],[52,"需求","xūqiú","dt.","nhu cầu","nhu cầu",1,"","由需要而产生的要求。","把握消费者的需求","满足顾客的需求。","Đáp ứng nhu cầu khách hàng.",["市场需求"],"Bài tập 3①. SBT câu 29–32."],[53,"主导","zhǔdǎo","dt.","chủ đạo","người giữ vai trò chủ đạo",1,"","起主导作用的事物。","以消费者为主导的店铺","以市场为主导。","Lấy thị trường làm chủ đạo.",[],"Còn là tính từ: <span class='zh'>主导地位</span>."],[54,"兴隆","xīnglóng","tt.","hưng long","phát đạt, hưng thịnh",1,"","兴盛。","生意兴隆","祝你生意兴隆！","Chúc anh buôn bán phát đạt!",["生意兴隆"],"SBT câu 24–28."]],extra:[["网络购物","wǎngluò gòuwù","mua sắm trực tuyến"],["实体商店","shítǐ shāngdiàn","cửa hàng thực (có mặt bằng)"],["昔日","xīrì","ngày trước"],["一去不复还","yí qù bú fù huán","một đi không trở lại"],["电子化","diànzǐhuà","điện tử hóa"],["货架","huòjià","kệ hàng"],["触摸屏","chùmōpíng","màn hình cảm ứng"],["摄像头","shèxiàngtóu","camera"],["刷卡","shuā kǎ","quẹt thẻ"],["譬如","pìrú","ví như"],["宗旨","zōngzhǐ","tôn chỉ"]],T:[{zh:"如今喜欢网络购物的人急剧增加，买东西不用在川流不息的人群中奔走，仅需登录网站，动几下手指，下几道指令就可以把东西买回家，人类根深蒂固的购物习惯正在改变。我们不免要问：网上购物如此方便，未来实体商店还会存在吗？有人这样预言：实体商店若想存在，必须进行根本性的革命，而不是改良，否则实体店昔日的欣欣向荣终将一去不复还。",vn:"Ngày nay số người thích mua sắm trực tuyến tăng vọt; mua đồ không cần chạy giữa dòng người nườm nượp, chỉ cần đăng nhập trang web, động vài ngón tay, ra vài lệnh là đã mua được đồ về nhà — thói quen mua sắm ăn sâu bén rễ của loài người đang thay đổi. Chúng ta không khỏi hỏi: mua trên mạng tiện như vậy, cửa hàng thực trong tương lai còn tồn tại không? Có người dự đoán: cửa hàng thực muốn tồn tại thì phải tiến hành một cuộc cách mạng tận gốc chứ không phải cải tiến, nếu không cảnh phồn thịnh ngày xưa sẽ một đi không trở lại.",idea:"Mua sắm online bùng nổ — cửa hàng thực phải cách mạng.",q:["传统购物方式与网络购物方式有什么区别？"],note:[["不用……，仅需……","Đối lập cách mua cũ và mới."],["不免要问","Xem 辨析 不免—未免."],["若……，必须……，否则……","Câu điều kiện văn viết."]]},{zh:"有人这样描述未来商店：那里的仓库货物储备管理、销售结算、客户关系管理等，全部实现电子化。在那儿几乎见不到工作人员，顾客可以自己动手完成整个购物过程。未来商店实行的将是一种全新的商业模式。",vn:"Có người miêu tả cửa hàng tương lai thế này: việc quản lý dự trữ hàng trong kho, thanh toán bán hàng, quản lý quan hệ khách hàng… đều được điện tử hóa toàn bộ. Ở đó hầu như không thấy nhân viên, khách tự mình hoàn thành cả quá trình mua sắm. Cửa hàng tương lai sẽ thực hiện một mô hình kinh doanh hoàn toàn mới.",idea:"Đặc điểm: điện tử hóa, không nhân viên.",q:["未来商店有什么特点？"],note:[["实现电子化","<span class='zh'>实现 + ……化</span>: 现代化 · 自动化."]]},{zh:"未来商店的购物车把手上装有购物助手——一个可随意装卸的无线电脑工具。消费者想买哪种商品，小屏幕上就会显示商品所在的位置，当消费者走到相应货架时，仪器会发出提示音，以免消费者错过商品。如果你想吃鲜鱼，又嫌腥，不愿自己加工，可以在触摸屏上留言，等店员把鱼清理好后，再去领取，不必排队等候。如果想买手机，又不了解哪一款性能更适合自己，也无须烦恼，电子便利站会为你把关，在那儿一系列选择题会为你提供决策支持和购买建议。",vn:"Tay cầm xe đẩy của cửa hàng tương lai gắn “trợ lý mua sắm” — một thiết bị máy tính không dây có thể tháo lắp tùy ý. Người mua muốn mua món gì, màn hình nhỏ sẽ hiện vị trí món đó; khi người mua đi tới kệ hàng tương ứng, thiết bị phát tiếng nhắc để khỏi bỏ lỡ. Nếu bạn muốn ăn cá tươi mà ngại tanh, không muốn tự làm, có thể để lại lời nhắn trên màn hình cảm ứng, đợi nhân viên làm sạch cá xong rồi đến nhận, không phải xếp hàng chờ. Nếu muốn mua điện thoại mà không biết mẫu nào tính năng hợp với mình, cũng chẳng cần phiền não: trạm tiện ích điện tử sẽ “gác cửa” giúp bạn, ở đó một loạt câu hỏi lựa chọn sẽ hỗ trợ quyết định và đưa gợi ý mua hàng.",idea:"Trợ lý mua sắm.",q:["购物助手能为消费者做什么？"],note:[["以免消费者错过商品","Xem Ngữ pháp 1."],["又嫌腥","Xem Ngữ pháp 2."],["如果你想……，（你）又嫌腥，（你）不愿……","Xem 篇章: 省略 chủ ngữ."]]},{zh:"购物完毕，该结账了，未来商店无须人工过秤，带有摄像头的结账系统可以识别商品的重量和体积，迅速运算，之后给出消费钱数的总和，自动收款机则可接受现金和刷卡支付。",vn:"Mua xong, đến lúc thanh toán: cửa hàng tương lai không cần người cân hàng, hệ thống thanh toán có camera nhận diện trọng lượng và thể tích hàng, tính nhanh rồi đưa ra tổng số tiền; máy thu tiền tự động nhận cả tiền mặt lẫn quẹt thẻ.",idea:"Thanh toán tự động.",q:["未来商店怎么结账？"],note:[["该结账了","<span class='zh'>该 + V + 了</span> = đến lúc phải…"]]},{zh:"消费者加入设计队伍，是未来商店着重推荐的服务，譬如，你想买衣服，可是你觉得市场上的几款都不太满意，那就参与设计吧。你登录到虚拟设计室，进入设计过程，对颜色、外观等设计内容进行投票，这样设计出来的衣服保管你满意。",vn:"Người tiêu dùng tham gia đội ngũ thiết kế là dịch vụ mà cửa hàng tương lai đặc biệt giới thiệu. Ví dụ, bạn muốn mua quần áo nhưng thấy mấy mẫu trên thị trường đều không vừa ý, vậy thì tham gia thiết kế đi. Bạn đăng nhập phòng thiết kế ảo, vào quá trình thiết kế, bỏ phiếu cho màu sắc, kiểu dáng…, quần áo thiết kế ra như vậy đảm bảo bạn hài lòng.",idea:"Khách tham gia thiết kế.",q:["消费者怎样参与设计？"],note:[["着重推荐","<span class='zh'>着 zhuó</span> = nhấn mạnh — Bài tập 2④."],["保管你满意","Khẩu ngữ = chắc chắn — Bài tập 2⑤."]]},{zh:"在未来商店，商家和消费者的互动非常活跃。不管你是想买样式新颖的羽绒服、旗袍，还是想买你中意的音响、收音机、水龙头或者只是几枚纽扣儿、一个插座，再或者是勘探矿产的工具，你只要把照片发送到专门的网站，就能得到反馈：“您查询的商品在某某店有售，那里有多种款式供您选购。”这样的互动方便了顾客，也为商家带来了生意。",vn:"Ở cửa hàng tương lai, tương tác giữa người bán và người mua rất sôi động. Dù bạn muốn mua áo lông vũ, sườn xám kiểu mới, hay muốn mua dàn loa, radio, vòi nước vừa ý, hoặc chỉ vài cái cúc áo, một cái ổ cắm, hay thậm chí dụng cụ thăm dò khoáng sản, bạn chỉ cần gửi ảnh lên trang web chuyên dụng là nhận được phản hồi: “Mặt hàng quý khách tìm có bán ở cửa hàng X, ở đó có nhiều mẫu để quý khách chọn mua.” Sự tương tác này vừa tiện cho khách, vừa mang lại mối làm ăn cho người bán.",idea:"Tương tác qua ảnh.",q:["商家和消费者怎样互动？"],note:[["不管……还是……或者……再或者……，只要……就……","Liệt kê dài + điều kiện."]]},{zh:"未来商店对消费者的关怀可谓无微不至，他们根据消费者的个人生活习惯，把握消费者的需求，将商店变为以消费者为主导的店铺。努力使整个购物过程轻松、快捷、便利，是未来商店每一项设计的宗旨。",vn:"Sự quan tâm của cửa hàng tương lai với người tiêu dùng có thể nói là từng li từng tí: dựa vào thói quen sinh hoạt cá nhân, nắm bắt nhu cầu của khách, biến cửa hàng thành nơi lấy người tiêu dùng làm chủ đạo. Cố gắng làm cho cả quá trình mua sắm nhẹ nhàng, nhanh chóng, tiện lợi là tôn chỉ của mọi thiết kế trong cửa hàng tương lai.",idea:"Tôn chỉ: lấy khách làm chủ đạo.",q:["未来商店的设计主旨是什么？"],note:[["可谓无微不至","<span class='zh'>可谓</span> = có thể nói là."],["以……为主导","Lấy… làm chủ đạo."]]},{zh:"试想，这样的商店怎么能不生意兴隆呢！",vn:"Thử nghĩ xem, cửa hàng như vậy sao có thể không làm ăn phát đạt!",idea:"Kết: câu phản vấn.",q:["最后一句用了什么句式？表达了什么意思？"],note:[["怎么能不……呢！","Phản vấn = chắc chắn sẽ…"]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"以免",zh:"以免",py:"yǐmiǎn",tag:"Chú thích 1 · liên từ",mean:"Liên từ, biểu thị <b>tránh xảy ra một tình huống không mong muốn</b> — “để tránh, để khỏi”. Thường đứng <b>đầu phân câu sau</b>. Văn viết.",forms:["（làm việc A），以免 + kết quả xấu B"],ex:[["重要的是，要学会从失败中吸取教训，以免今后再发生类似的问题。","Quan trọng là phải học rút kinh nghiệm từ thất bại, để sau này khỏi xảy ra vấn đề tương tự."],["感冒时应尽量少去公共场所，必须去的话，最好戴上口罩，以免传染别人。","Khi cảm nên hạn chế đến nơi công cộng; nếu phải đi thì nên đeo khẩu trang để khỏi lây cho người khác."],["……当消费者走到相应货架时，仪器会发出提示音，以免消费者错过商品。","",1]],tips:["Gần nghĩa: <span class='zh'>免得 · 省得</span> (khẩu ngữ hơn).","Bài tập 2②. SBT câu 21."],practice:{q:"用“以免”完成句子",type:"complete",items:[["机动车和非机动车应该各行其道，以免________。","……以免发生交通事故。"],["使用电脑工作时，不要忘了经常保存你的文件，以免________。","……以免文件丢失。"],["我们必须不断地看书、学习、充实自己，以免________。","……以免被社会淘汰。"]]}},{id:"g2",grp:0,word:"嫌",zh:"嫌 + N / Adj / 小句",py:"xián",tag:"Chú thích 2 · động từ",mean:"Động từ, biểu thị <b>không thích, không hài lòng</b> — “chê, ngại”. Thường dùng <span class='zh'>嫌 + danh từ / tính từ / phân câu</span>.",forms:["S + 嫌 + N / Adj / (S₂ + V/Adj)"],ex:[["我从来没嫌你，也没嫌过孩子哭。","Tôi chưa bao giờ chê anh, cũng chưa từng ngại con khóc."],["如果你想吃鲜鱼，又嫌腥，不愿自己加工……","",1],["大家都嫌这个旅行计划不够合理，几个最值得去的地方都不在计划之内。","Mọi người đều chê kế hoạch du lịch này chưa hợp lý, mấy chỗ đáng đi nhất đều không có trong kế hoạch."]],tips:["<span class='zh'>不嫌麻烦</span> = không ngại phiền; <span class='zh'>嫌贵 · 嫌远 · 嫌吵</span>.","Bài tập 2③. SBT nghe câu 14–17: <span class='zh'>你要是嫌三四元的档次低</span>."],practice:{q:"完成句子",type:"complete",items:[["她喜欢为大家做事，从不嫌________。","她喜欢为大家做事，从不嫌麻烦。"],["他嫌________，衣服送来以后就放在那儿，一次都没穿过。","他嫌衣服款式过时，……"],["她嫌________，决定搬出学校，和朋友一块儿在外面合租房子。","她嫌宿舍条件太差，……"]]}},{id:"g3",grp:1,word:"着重",zh:"着重 / 保管 / 无须",py:"zhuózhòng / bǎoguǎn / wúxū",tag:"Từ trong bài tập 2",mean:"<span class='zh'>着重</span> = <b>nhấn mạnh, chú trọng</b> (= <span class='zh'>重点</span> + V). <span class='zh'>保管</span> (khẩu ngữ) = <b>đảm bảo, chắc chắn</b>. <span class='zh'>无须</span> = <b>không cần</b> (văn viết của <span class='zh'>不用</span>).",forms:["着重 + 强调 / 介绍 / 推荐……","保管 + (S) + V/Adj","无须 + V"],ex:[["消费者加入设计队伍，是未来商店着重推荐的服务。","",1],["这样设计出来的衣服保管你满意。","",1],["未来商店无须人工过秤……","",1]],tips:["Bài tập 2④⑤."]},{id:"g4",grp:0,word:"不免",zh:"不免 / 未免",py:"bùmiǎn / wèimiǎn",tag:"Xem 辨析 bên dưới",mean:"Đều là phó từ, đều có nghĩa <b>không tránh khỏi</b>. <span class='zh'>不免</span>: kết quả <b>khách quan tự nhiên</b> nảy sinh (phía trước nêu nguyên nhân), chỉ + khẳng định. <span class='zh'>未免</span>: <b>đánh giá, không tán thành</b> (“không thể không nói là… quá”), + khẳng định lẫn phủ định.",forms:["（nguyên nhân），不免 + V/Adj（khẳng định）","未免 + (太) + Adj / 不 + Adj"],ex:[["我们不免要问：网上购物如此方便，未来实体商店还会存在吗？","",1]],tips:["SBT câu 23: <span class='zh'>当然也不免流露出……</span>"]}],BX:{grp:0,word:"不免",cols:["√ Đúng","× Sai"],pair:"不免 — 未免",same:["Đều là <b>phó từ</b>, đều có nghĩa <b>không thể tránh khỏi</b>.","这样教学，不免 / 未免误人子弟。"],diff:[["Biểu thị <b>khách quan khó tránh</b>, trong tình huống nào đó tự nhiên sinh ra kết quả; phía trước <b>phải nêu nguyên nhân</b>.","他刚参加工作，不免会犯错误。（√）　他不免会犯错误。（×）","Biểu thị <b>không tán thành</b>, thiên về <b>đánh giá</b>, mang ý “không thể không nói là…”; phía trước có thể không nêu nguyên nhân.<div class='zh' style='margin-top:4px'>你这么做，未免太过分。（√）</div>"],["Phía sau <b>chỉ đi với dạng khẳng định</b>, không đi với dạng phủ định.","他这样说，人家不免会生气。（√）　人家不免不高兴。（×）","Phía sau đi được với <b>cả khẳng định và phủ định</b>.<div class='zh' style='margin-top:4px'>你现在才来，未免太晚了。（√）　他这样对待客人，未免不礼貌。（√）</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["旧地重游，感慨万千，让人不免想起往事。",0,"Có nguyên nhân (旧地重游) → kết quả tự nhiên → 不免 đúng."],["真是的，他未免太不会关心人了，干脆分手算了。",0,"Đánh giá không tán thành, + phủ định → 未免 đúng."],["星期天，我不免有些闷闷不乐。",0,"Đáp án sách: √ (ngày Chủ nhật → tâm trạng tự nhiên nảy sinh)."],["听到老师表扬他，他未免高兴起来，手舞足蹈的。",1,"Kết quả tự nhiên, không phải đánh giá → phải dùng 不免."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>预</u>言","预测 · 预防 · 预报 · 预计"],items:[["<u>改</u>良","改","改正 · 更改 · 改错 · 整改"],["储<u>备</u>","备","完备 · 准备 · 备份 · 设备"],["结<u>算</u>","算","计算 · 算数 · 算式 · 清算"],["<u>装</u>卸","装","装饰 · 服装 · 装修 · 装模作样"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["最近几十年，世界人口快速增加，给地球造成了巨大压力。→ ________","急剧","最近几十年，世界人口急剧增加，给地球造成了巨大压力。"],["为了不耽误第二天的考试，他前一天晚上定好了闹钟。→ ________","以免","他前一天晚上定好了闹钟，以免耽误第二天的考试。"],["我觉得食堂的饭菜太油腻，所以自己动手做饭。→ ________","嫌","我嫌食堂的饭菜太油腻，所以自己动手做饭。"],["今天的会议上，总经理重点强调了以下几个问题。→ ________","着重","今天的会议上，总经理着重强调了以下几个问题。"],["这是一家百年老店了，饭菜一定让你满意。→ ________","保管","这是一家百年老店了，饭菜保管让你满意。"],["他们细心周到的服务让顾客有回家的感觉。→ ________","无微不至","他们无微不至的服务让顾客有回家的感觉。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["模式","性能","运算","屏幕","需求"],text:"最近我买了一台{性能}很好的电脑。{屏幕}很大，{运算}速度超级快，还有多种开机{模式}可供选择，满足了我多方面的{需求}，我对它爱不释手。"},{bank:["川流不息","相应","反馈","等候","指令"],text:"以前，每到选举的日子，投票站里参加选举的人总是{川流不息}，需要很多人手来维持秩序。现在改为网络选举了，选民们只需登录{相应}的网站，根据{指令}投票即可，无须排队{等候}，整个过程是否公正合理，最后还能在电脑上看到{反馈}意见。"}]},EX4:{q:"朗读下面几段话，请补充出省略的主语",items:[{src:"",task:"从前有一个男孩，和我们年纪一样大，当然也和我们一样有很多想法，比如想上一所理想的大学，想周游世界，想做一些令人瞩目的事。按道理，只要努力，这些想法中至少有一些能实现。",model:"主语：他（男孩）—— 从前有一个男孩，（他）和我们年纪一样大，（他）当然也和我们一样有很多想法，比如（他）想上……"},{src:"",task:"他到了就业的年龄，没有找工作，一天到晚四处闲逛，结果，因为一次合伙抢劫，被判了五年。",model:"主语：他 —— 他到了就业的年龄，（他）没有找工作，（他）一天到晚四处闲逛，结果，（他）因为一次合伙抢劫，（他）被判了五年。"},{src:"",task:"作为演员，我非常渴望观众的掌声，把它看作是对我演艺事业最高的奖赏。但是，掌声是不能强求的，只有尊重观众的情感，让他们真正感到快乐，才能得到他们发自内心的真正的掌声。",model:"主语：我 —— ……（我）把它看作是……；……只有（我）尊重观众的情感，（我）让他们真正感到快乐，（我）才能得到……"},{src:"",task:"后来，我在大学里获得了足球奖学金，由此获得了接受教育的机会；在全美国的后卫球员中，两次被公众认可，并且在美国国家足球联盟队员的挑选赛中，排在第七位。",model:"主语：我 —— ……（我）由此获得了……；在全美国的后卫球员中，（我）两次被公众认可，并且……（我）排在第七位。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["传统购物方式与网络购物方式的区别","① 传统购物方式 ② 网络购物方式","传统购物要在川流不息的人群中奔走；网络购物只需登录网站，下几道指令就可以把东西买回家。"],["未来商店的特点","① 电子化 ② 工作人员","仓库管理、销售结算、客户关系管理全部实现电子化；几乎见不到工作人员，顾客自己完成购物过程。"],["购物模式 · 购物助手","① 显示商品位置 ② 触摸屏留言 ③ 便利站把关","购物车上的购物助手能显示商品位置；想买鲜鱼可以在触摸屏上留言；买手机时电子便利站会为你把关。"],["购物模式 · 结账","① 结账系统识别 ② 自动收款机","带摄像头的结账系统识别商品重量和体积，算出总和；自动收款机可接受现金和刷卡。"],["购物模式 · 参与设计 / 互动","登录、进入设计过程、投票 / 发送照片、得到反馈","顾客可以登录虚拟设计室，对设计内容投票；把照片发到专门网站，就能得到反馈。"],["未来商店的设计主旨","轻松、快捷、便利","以消费者为主导，努力使整个购物过程轻松、快捷、便利。"]]},PZ:{title:"篇章（1）省略",vn:"Lược bỏ chủ ngữ",intro:"Khi các phân câu trước và sau có <b>cùng chủ ngữ</b>, vì phân câu đầu đã có chủ ngữ nên các phân câu sau <b>thường lược bỏ</b> chủ ngữ. Lặp lại chủ ngữ khiến đoạn văn rườm rà — đây là lỗi hay gặp của người học (và là gợi ý cho Đọc hiểu phần 1 HSK6).",ex:[["如果你想吃鲜鱼，（你）又嫌腥，（你）不愿自己加工，（你）可以在触摸屏上留言，（你）等店员把鱼清理好后，（你）再去领取，（你）不必排队等候。","Chủ ngữ 你 chỉ xuất hiện một lần."],["你登录到虚拟设计室，（你）进入设计过程，（你）对颜色、外观等设计内容进行投票，这样设计出来的衣服保管你满意。",""],["他们先从学校去了车站，然后（他们）坐了6个小时的火车到了林县，（他们）又从林县坐了2个小时的大巴才终于到了红旗渠。",""]],q:"指出下列句子的问题并改正",pvn:"Cả ba câu đều mắc lỗi <b>lặp chủ ngữ</b> — hãy viết lại.",practice:[["新年的临近给全家带来了节日的气氛，全家人又打扫卫生，全家人又擦玻璃，还买来了花瓶，插上了鲜花。","主语重复 → 新年的临近给全家带来了节日的气氛，全家人又打扫卫生，又擦玻璃，还买来了花瓶，插上了鲜花。"],["他八岁起就喜欢上了足球，他天天在球场上一直泡到天黑，后来他终于进了国家队。","主语重复 → 他八岁起就喜欢上了足球，天天在球场上一直泡到天黑，后来终于进了国家队。"],["那是一只黄色的小猫，它只比我的手掌大一点儿，我给它起了个名字叫宝宝。我在前面走，它在后面跟着，它两只大眼睛看着我，它眼中充满无知、天真、信任和快乐。","主语重复 → 那是一只黄色的小猫，只比我的手掌大一点儿，我给它起了个名字叫宝宝。我在前面走，它在后面跟着，两只大眼睛看着我，眼中充满无知、天真、信任和快乐。"]]},DP:{title:"词汇：看图片，熟悉下列名词",vn:"8 danh từ thường gặp.",items:[["堤坝","dībà","đê đập","修堤坝","湖边修起了一条长长的堤坝。"],["（涮）火锅","(shuàn) huǒguō","lẩu (nhúng)","涮火锅","（涮）火锅是寒冷的冬天里深受人们喜爱的一道美味。"],["园林","yuánlín","vườn cảnh","中式园林","中式园林很讲究左右对称。"],["棍棒","gùnbàng","gậy gộc","使用棍棒","他正在使用棍棒表演武术。"],["商标","shāngbiāo","nhãn hiệu","注册商标","商品上都有注册商标。"],["喇叭","lǎba","kèn; loa","吹喇叭","那儿有两个吹喇叭的老人。"],["城堡","chéngbǎo","lâu đài","童话般的城堡","孩子们都喜欢童话般的城堡。"],["炉灶","lúzào","bếp lò","炉灶上炖着","炉灶上炖着一大锅香气扑鼻的鸡汤。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"1997年，不安分的李长风突发奇想，宣布要造汽车。从这一年起，中国家用轿车的拥有量连年翻番。众多专家纷纷预言，中国的家用轿车时代已经到来。",o:["李长风常常感到不安","97年李长风有了汽车","97年起，中国轿车数量猛增","专家都觉得中国轿车发展太快了"],a:2,why:"“从这一年起……连年翻番” = tăng gấp đôi mỗi năm. A: <span class='zh'>不安分</span> = không chịu yên phận, khác “bất an”."},{n:2,say:"在我们的现实生活中，“用脚投票”原理极其简单：你搞不好、不公平，我就走人。例如，当股东们发现经理没有把企业经营好，企业的资产有可能贬值时，他们就会抛售股票，从而与该企业脱离关系。",o:["生活中，常有企业出现问题","企业的股东们不会轻易抬脚走人","世界这么大，什么事都可能发生","“用脚投票”的情况生活中时有发生"],a:3,why:"“在我们的现实生活中，‘用脚投票’……”."},{n:3,say:"在着手进行休闲、观光方面的具体投资时，他发现：孤立的某一个娱乐项目难以吸引很多人，只有当一个地方风景优美、交通便利、饭店高档舒适、娱乐项目众多时，才可能吸引更多的游客。",o:["他有了空闲就去旅游","他正在进行旅游开发","风景好的地方就有人去","游客最在意吃住的质量"],a:1,why:"“着手进行休闲、观光方面的具体投资”. C sai: cần <b>nhiều</b> điều kiện cùng lúc."},{n:4,say:"在超市，如果顾客结账需要排队等候很长时间，他们就会失去耐心，一走了之，但如果开设很多收款台却少有人光顾，则又会导致成本提高。“排队模型”就试图为这个问题找到一个最好的解决方案。",o:["排队是需要耐心的","买东西排队也是难免的","排队模型可以代替人排队","收款台闲置会造成成本上升"],a:3,why:"“开设很多收款台却少有人光顾，则又会导致成本提高”."},{n:5,say:"上中学时，爱因斯坦很喜欢数学。一次，叔叔给他讲了勾股定理的来历后，问爱因斯坦能不能试着证明它。爱因斯坦决定试一试。眼看着运算的草稿纸越积越厚，找到正确的证明方案却并非易事，但他没有动摇，二十多天后，他终于拿出了正确方案。",o:["爱因斯坦的叔叔是一位数学家","叔叔给爱因斯坦出了一道难题","任何人在困难面前都难免动摇","爱因斯坦最后也没能证明定理"],a:1,why:"Chú bảo chứng minh định lý Pythagore — một bài khó (“并非易事”)."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：欢迎经济学者纪老师做客网络空间。纪老师，您好，我们常看到“分享经济”这个词，您能否详解一下分享经济的由来？\n男：最早提出分享经济的是美国经济学家威茨曼撰写的《分享经济》一书。作者针对的是20世纪70年代出现的“经济滞胀”。作者认为产生经济滞胀的原因是工资结构不合理，提出以分享制度代替工资制度。在实践中，分享经济形成了两种不同的模式。一种是欧美的通过股权制度让工人参与企业收入分配的模式，另一种是日本的通过企业文化和管理制度让员工参与企业管理的模式。\n女：在我们的生活中，分享经济有哪些呈现方式？\n男：最典型的是有偿分享模式、对等分享模式、劳务分享模式、众筹分享模式。有偿分享是指把自己剩余或暂时不用的物品分享给别人使用，收取租金。\n女：比如说我去旅游，不想住酒店，我就上网查找住宿信息，一旦和房主达成一致，就可以实地入住、网上结算了？\n男：对，就是这样。\n女：对等分享模式呢？\n男：顾名思义，就是双方互相交换使用财产，不向对方支付报酬。\n女：我们的“城乡儿童互换生活环境体验成长快乐”活动算不算？\n男：当然算，最近几年这种活动已经成为许多学校教育的重要内容，它分享的不仅仅是双方对等交换的环境，还有双方情感和文化价值的体验。\n女：劳务分享模式就是对大量没有充分利用的劳务资源的分享吧？\n男：是啊，现代分享经济中，人们不仅可以出售自己多余的物品，还可以出售多余的时间。美国有一家创业公司，凭一小时送货上门服务取得了成功，它就是通过互联网，把分散在社区居民中的剩余时间利用起来，实现一小时送达的承诺。\n女：众筹分享模式就是指大众筹资或群众筹资了吧？\n男：对，当然现代众筹是指用互联网平台进行资金筹集。而且，现代众筹筹资目标也包含了分享投资对象，不纯粹是为了筹集资金。",qs:[{n:6,q:"“分享经济”是在什么背景下产生的？",o:["《分享经济》一书问世以后","工人提出改良工资制度之后","欧美和日本经济模式创新的背景下","20世纪70年代出现经济滞胀以后"],a:3,why:"“作者针对的是20世纪70年代出现的‘经济滞胀’”."},{n:7,q:"“有偿分享模式”的主要特点是什么？",o:["使用者需要付费","变卖掉不用的东西","用不了的东西就送人","能够租赁就不要购买"],a:0,why:"<span class='zh'>有偿</span> = có trả phí; “收取租金”."},{n:8,q:"“对等分享模式”的主要特点是什么？",o:["城乡儿童可互通有无","无偿为使用者提供服务","着重于情感的交流体验","双方交换使用分享内容"],a:3,why:"“双方互相交换使用财产”."},{n:9,q:"“劳务分享模式”的主要特点是什么？",o:["以最快速度送货上门","合理利用零星的人工","对快递行业进行革命","答应的事情就要兑现"],a:1,why:"“把分散在社区居民中的剩余时间利用起来”."},{n:10,q:"“众筹分享模式”的主要特点是什么？",o:["目的就是筹集资金","及时反馈投资情况","包括分享投资对象","注重互联网平台建设"],a:2,why:"“也包含了分享投资对象，不纯粹是为了筹集资金”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"在相当长的一段时间内，人们总爱用“大鱼吃小鱼”来形容市场竞争的残酷性，并似乎形成了约定俗成的共识。眼下，这种说法却悄然发生了改变。因为，当今已步入知识经济年代，市场瞬息万变，信息日新月异，思维迟钝、行动缓慢的大鱼未必吃得了头脑睿智、动作迅速的小鱼，所以出现了“快鱼吃慢鱼”的现象。其寓意是在强调随时调整思路适应市场变化的重要性，同时给做事一成不变、疏于创新的人敲响了警钟。事实上，不变意味着落后，落后就要挨打，照此下去，终究会被市场所淘汰。",qs:[{n:11,q:"“大鱼吃小鱼”用来说明什么？",o:["一种市场行为","一条普遍真理","大鱼比小鱼受欢迎","市场竞争是残酷的"],a:3,why:"“用‘大鱼吃小鱼’来形容市场竞争的残酷性”."},{n:12,q:"如今的市场竞争出现了怎样的新现象？",o:["快鱼吃慢鱼","市场变化快","信息随时更新","知识胜过一切"],a:0,why:"“出现了‘快鱼吃慢鱼’的现象”."},{n:13,q:"说话人认为市场竞争中的强者是什么样的？",o:["财力雄厚","警惕性高","勇于创新","知识渊博"],a:2,why:"Cảnh báo người “一成不变、疏于创新” → kẻ mạnh là người dám đổi mới."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"随着天气转暖，冰品、饮品市场又火了起来。冰柜里五颜六色的冰激凌款式繁多，有几年前风行起来的怀旧雪糕，也有好玩儿的新面孔，新款冰激凌包装纸上的猴子、兔子、小松鼠等动物形象保管能唤起你的无限童心，粽子雪糕外面再裹上一层巧克力的中外混搭口味，肯定能让男女老少个个胃口大开，商家对消费者的体贴从观感到口味，可谓无微不至。冰激凌产品正从原来较为单纯的降温、好吃，向健康和完美口感的市场需求转变。\n论价格，也是高低档次都有，你要是嫌三四元的档次低，有15元的脆筒冰激凌，48元的水果冰激凌，环保人士还可选择60元的环保盒装冰激凌。\n中国已经成为全球最大的冰激凌市场。2015年中国冰激凌销售总额为393亿元，同比微增0.66%，利润为20.1亿元，同比下跌超过9%，这说明冷饮经营也绝非易事，虽然全年营收略有上升，但整个行业利润却有一定下滑。我们不禁会想到，在欣欣向荣背后，行业竞争正在加剧。",qs:[{n:14,q:"前几年市场上流行什么样的雪糕？",o:["怀旧雪糕","动物雪糕","粽子雪糕","巧克力雪糕"],a:0,why:"“几年前风行起来的怀旧雪糕”."},{n:15,q:"如今消费者对冰激凌的需求是什么？",o:["好吃","降温","便宜","健康"],a:3,why:"“向健康和完美口感的市场需求转变”."},{n:16,q:"小学生最可能会选择哪种冰激凌？",o:["脆筒冰激凌","水果冰激凌","有动物形象的冰激凌","环保盒装冰激凌"],a:2,why:"Hình con vật “唤起你的无限童心”."},{n:17,q:"根据这段话，可以知道什么？",o:["中国人不喜欢吃冰激凌","冰激凌行业利润在下滑","冰激凌价格越来越合理","冰激凌吃多了容易上火"],a:1,why:"“利润……同比下跌超过9%”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["看见漏水的水龙头一定要赶快关上它。","我的汽车不仅很旧，但仍然跑得很好。","刘大爷喜欢坐在门口闭着眼睛听收音机里传出的咿咿呀呀的京剧唱段。","随着服装出口量的增加，他们厂生产的纽扣也漂洋出海，走向了世界。"],a:1,why:"<b>Quan hệ từ sai</b>: <span class='zh'>不仅……但……</span> → <span class='zh'>虽然很旧，但仍然跑得很好</span>."},{n:19,o:["老百姓心里有杆秤，只要我们说实话，他们就会相信我们。","他非常希望能够获得一次和来自不同地方的人面对面交流。","那是为个子高的人特别设计的公寓——高大的家具，很高的门把手。","使用这些仪器可以把不太直观的声波变成可见的图像，之后进行分析。"],a:1,why:"<b>Thiếu tân ngữ</b>: <span class='zh'>获得……交流</span> → <span class='zh'>获得一次……交流的机会</span>."},{n:20,o:["阵阵鞭炮声使我的心兴奋起来，我跑到窗前，看美丽的烟花已铺满了天空。","从80年代中后期开始，羽绒服逐步取代棉毛制品，成为中国北方冬季主打户外服装。","夕阳下，一个穿旗袍的女孩从安静的街巷穿过。我觉得旗袍很好看，应该给女儿做一件。","在海洋动物中，鲨鱼的嗅觉极其灵敏，可以在几千米外闻到血腥味并立即赶往有血的地方。"],a:0,why:"<b>Phối hợp / lôgic</b>: <span class='zh'>烟花……铺满了天空</span> không hợp (pháo hoa “trải kín” trời) — đáp án sách: A."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"今后，凡属投稿和业务信函，均请___上面地址投寄，___发生因错投耽误时间的事情；___寄至原址的邮件，将由专人转送过来，请寄件人放心。",o:["照　省得　或者","依　切勿　一经","遵　防止　依然","按　以免　已经"],a:3,why:"<span class='zh'>按……地址</span>; <span class='zh'>以免</span> (từ mới!); <span class='zh'>已经寄至</span>."},{n:22,text:"如果母亲___良好的教育，她的习惯自然也就良好，她的孩子___就会受到良好的教育；___，孩子就会受到不良影响。有道是“先入为主”“根深蒂固”，母亲教育与儿童教育的关系___。",o:["受过　无形中　反之　可想而知","进行　预料中　反面　显而易见","经历　无意间　相应　不言自明","坚持　意味着　相反　不得而知"],a:0,why:"<span class='zh'>受过教育</span>; <span class='zh'>无形中</span>; <span class='zh'>反之</span> = ngược lại; <span class='zh'>可想而知</span>."},{n:23,text:"雅各布斯的这本书思绪___，当然也___流露出一些理想主义的浪漫。总体来说，世界上没有一个大城市是___理性模式建立起来的，各种利益、各种欲望在城市中交错角力，形成了城市的现实___。",o:["起伏　通常　遵照　主义","混乱　大多　服从　样子","流畅　不免　按照　形态","万千　未免　根据　形状"],a:2,why:"<span class='zh'>不免流露</span> (kết quả tự nhiên — xem 辨析!); <span class='zh'>按照……模式</span>; <span class='zh'>现实形态</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"一战期间，(24)：奔赴战场的士兵甚至要带上剃须刀、磨刀的皮条以及磨刀石。可更换刀片式剃须刀的发明者金·坎普·吉列敏锐地觉察到这其中隐藏着的巨大商机，于是他以极低的折扣同政府签订了合同，(25)，然后将这种装卸方便的剃须刀发放给士兵。不久，士兵们就成了吉列剃须刀的忠实客户。这些士兵带着吉列剃须刀到欧洲作战时，(26)。战争结束后，一些士兵把吉列剃须刀带回了家，他们就像人体广告，使吉列剃须刀很快便名扬四海。自此(27)，购买者川流不息。\n吉列创造了一种全新的商业模式，它靠卖刀片而不是刀架赚钱，(28)。汽车4S店也不是靠卖汽车挣钱而是通过售后服务的延伸赚取更多的利润。",opts:["政府低价购买了350万副刀架和3600万枚刀片","如同惠普打印机的利润来自墨盒而非打印机本身","欧洲人也喜欢上了这种安全、方便的剃须刀","胡子在生活中给男士带来了巨大的烦恼","吉列剃须刀生意兴隆"],ans:{24:3,25:0,26:2,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"在电子商务风行的今天，实体店还能多大程度地影响品牌在零售市场的地位？就在零售商都为实体店的未来捏把汗的时候，有人做了一项调查，令人惊讶的是，未来计划更多通过实体店购物的消费者比例从一年前的18%攀升至26%；表示实体店“方便购物”的客户达到93%，远高于网络和移动设备。\n这似乎与许多零售商的认识相去甚远。过去一年多里，传统零售商纷纷扎堆规划电子商务，由店商向电商转型。根据调查，63%的传统零售商已开展多渠道零售，但近三成零售商表示，其多渠道战略实施并不成功。\n究其根本，是因为许多零售企业并未深入了解消费者的需求变化，其转型初衷只是为了数字化而数字化，认为仅仅通过技术的部署就能带来绩效的提升。事实上，在数字时代，虽然技术的变革重新定义了零售商与消费者的连接方式，但却并没有改变消费者需求的本质——价格合理、产品种类丰富以及多年积累的信任感。因此，掌控零售商未来命运的，不是涌现的新兴技术，更不是“凶猛”的互联网电商，而是瞬息万变的消费者需求。",qs:[{n:29,q:"第1段中，画线词语“捏把汗”的意思最可能是：",o:["担心","着急","天气太热","心情不好"],a:0,why:"<span class='zh'>捏把汗</span> = toát mồ hôi vì lo → lo lắng."},{n:30,q:"根据第1段，调查结果令人惊讶是因为：",o:["电商的地盘急剧扩大","追求品牌的人越来越多","喜欢实体店的人在增加","准备网购的人数超出预期"],a:2,why:"18% → 26%."},{n:31,q:"过去一年里，很多传统零售商：",o:["反省自己的经营理念","努力开展多渠道经营","纷纷向电子商务取经","转型过程中被迫降价"],a:1,why:"“63%的传统零售商已开展多渠道零售”."},{n:32,q:"根据最后一段，可以知道：",o:["数字化未必就是潮流","新技术能够带来效益","消费者的需求是根本","传统零售商成本较高"],a:2,why:"“掌控零售商未来命运的……是瞬息万变的消费者需求”."}]},{ins:"第33–36题：请选出正确答案。",text:"《后汉书》记载：东汉时有个人叫费长房。一天他在酒楼喝酒解闷，偶见街上有个卖药的老人，悬挂着一个药葫芦兜售丸散膏丹。卖了一阵，街上行人渐渐散去，老人就悄悄钻入了葫芦之中。据说这是中国最早最原始的广告行为。此后，在门口挂个壶或葫芦推销药品流行起来，而且成为古代药店、诊所的标志，行医也因此被叫作“悬壶济世”。为什么药店门前挂壶或葫芦，而非其他物品？因为在古代，壶是装中药的，葫芦是装丹散、丸药的，葫芦就相当于今天的药瓶。门前挂壶或葫芦很直观地说明这里是卖药的。\n作为一种古老的广告形式，酒旗在中国也有着悠久的历史。据说，唐代以后，酒旗作为酒店的招牌，应用已经十分普遍。人们在酒旗上标以“酒”字或署上店名，或悬于店铺之上，或挂在屋顶房前，或另立一根长杆挂上酒旗，任其随风招展，非常醒目，过往行人在很远处便能见到。除此之外，酒旗还有一个重要作用，即酒旗的升降是店家有酒或无酒、营业或不营业的标志。早晨起来，开始营业，有酒可卖，便高悬酒旗；若无酒可售，就收下酒旗。\n随着社会的发展，古代的酒旗已消失，大屏幕主导着广告市场，偶有仿古酒旗悬挂在林立的高楼之间，新颖别致，仍会给人带来惊喜。路人除了知道这里有酒，还会体味到一种无以言传的韵味。",qs:[{n:33,q:"关于中国最早最原始的广告，下列说法正确的是：",o:["是卖药的广告","见于西汉时期","出现在酒楼门口","写着“悬壶济世”"],a:0,why:"Ông lão bán thuốc treo hồ lô. B: thời <b>Đông</b> Hán."},{n:34,q:"关于酒旗，下列说法正确的是：",o:["上面都写着酒的名字","酒旗都悬挂在旗杆上","酒店没酒就不挂酒旗了","现在酒店仍普遍挂酒旗"],a:2,why:"“若无酒可售，就收下酒旗”."},{n:35,q:"文中提到的广告的共性是：",o:["有魅力","很直观","说服力强","能打动人"],a:1,why:"Hồ lô “很直观地说明这里是卖药的”; cờ rượu “非常醒目”."},{n:36,q:"最适合做上文标题的是：",o:["广告的起源","中国广告的发展","中国古代的广告","广告的功能及其艺术性"],a:2,why:"Hai ví dụ: hồ lô thuốc và cờ rượu — đều là quảng cáo cổ."}]}]},W:{task:"这篇课文给我们描述了未来商店的运行模式，与传统购物方式相比，未来商店在购物过程、与顾客的互动、满足顾客需求等方面都有更多的优越性。请参考练习5，把课文缩写成350字左右的短文。",target:350,steps:[["Mở bài","Mua sắm online tăng <span class='zh'>急剧</span>; câu hỏi: cửa hàng thực còn tồn tại? — phải <span class='zh'>革命</span>."],["Đặc điểm","<span class='zh'>电子化</span>, hầu như không có nhân viên."],["Mô hình mua sắm","Trợ lý mua sắm (<span class='zh'>以免</span>, <span class='zh'>嫌腥</span>), thanh toán tự động, tham gia thiết kế, tương tác qua ảnh — mỗi ý 1–2 câu."],["Tôn chỉ","<span class='zh'>以消费者为主导；轻松、快捷、便利</span>."],["Kết","<span class='zh'>这样的商店怎么能不生意兴隆呢！</span> · Nhớ <b>lược bỏ chủ ngữ</b> lặp lại."]],model:"未来商店\n如今网络购物的人急剧增加，人们不用在川流不息的人群中奔走，只需登录网站就能把东西买回家。有人预言，实体商店若想存在，必须进行根本性的革命。\n未来商店的管理全部实现电子化，几乎见不到工作人员，顾客可以自己完成整个购物过程。\n购物车上装有购物助手，屏幕会显示商品的位置，走到相应货架时还会发出提示音，以免顾客错过商品。想吃鲜鱼又嫌腥，可以在触摸屏上留言，等鱼清理好后再去领取。买手机不知道选哪款，电子便利站会为你把关。结账时，结账系统能识别商品的重量和体积，迅速算出总和，自动收款机可接受现金和刷卡。顾客还可以登录虚拟设计室，对设计内容投票，设计出自己满意的衣服。想买什么东西，只要把照片发送到专门的网站，就能得到反馈。\n未来商店以消费者为主导，对顾客的关怀无微不至，每一项设计都是为了使购物轻松、快捷、便利。这样的商店怎么能不生意兴隆呢！",check:["Có tiêu đề","Có bối cảnh: mua sắm online & dự đoán","Có đặc điểm điện tử hóa","Có đủ 4 mô hình: trợ lý · thanh toán · thiết kế · tương tác","Có tôn chỉ và câu kết","Lược bỏ chủ ngữ lặp lại","Khoảng 350 chữ"]},SUM:{words:["急剧","川流不息","登录","指令","根深蒂固","不免","预言","革命","改良","欣欣向荣","仓库","储备","结算","模式","装卸","屏幕","相应","仪器","以免","嫌","清理","等候","性能","便利","把关","运算","总和","着重","投票","保管","新颖","反馈","款式","关怀","无微不至","需求","主导","兴隆"],patterns:[["……，以免 + kết quả xấu","……仪器会发出提示音，以免消费者错过商品。"],["嫌 + N / Adj / 小句","如果你想吃鲜鱼，又嫌腥……"],["不免 / 未免","我们不免要问……"],["着重 · 保管 · 无须","这样设计出来的衣服保管你满意。"],["篇章：省略主语","你登录到虚拟设计室，（你）进入设计过程，（你）……投票。"]],diff:["不免: kết quả khách quan tự nhiên (phải có nguyên nhân phía trước), chỉ + khẳng định — 未免: đánh giá không tán thành, + khẳng định / phủ định (未免太…… / 未免不……)","着重 zhuó · 中意 zhòng · 保管 = đảm bảo (khẩu ngữ) · 把关 = kiểm soát · 用脚投票 = “bỏ phiếu bằng chân” (bỏ đi)"],sentences:["人类根深蒂固的购物习惯正在改变。","实体商店若想存在，必须进行根本性的革命，而不是改良。","努力使整个购物过程轻松、快捷、便利，是未来商店每一项设计的宗旨。"],hw:["Học thuộc 54 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết tóm tắt bài khóa ~350 chữ (mục 7), chú ý lược bỏ chủ ngữ.","Sửa 3 câu lặp chủ ngữ ở phần Mở rộng.","Làm Sách bài tập bài 21.","Đọc trước bài 22."]}});
