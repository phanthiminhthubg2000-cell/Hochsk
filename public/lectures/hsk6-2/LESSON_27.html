<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 27 · 完璧归赵 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-27",num:27,book:"HSK 标准教程 6（下）",unit:{n:7,zh:"经典阅读",vn:"Đọc tác phẩm kinh điển"},title:"完璧归赵",vn:"Trả ngọc nguyên vẹn cho nước Triệu",chars:1114,source:"改编自《学圣人 悟做人》文章《完璧归赵》，编著：欧阳敏",goals:["Đọc hiểu điển tích 1114 chữ thời Chiến Quốc: <b>Lạn Tương Như</b> dùng trí và dũng mang ngọc Hòa Thị đi sứ Tần rồi đưa ngọc về Triệu nguyên vẹn.","Dùng được 50 từ mới, nhất là nhóm <b>ngoại giao – lập luận</b>: <span class='zh'>答复 · 得罪 · 对策 · 提议 · 请教 · 实力 · 慷慨 · 亏待 · 磋商 · 转达 · 兑现 · 履行 · 歪曲 · 压迫 · 理直气壮 · 隔阂 · 争端</span> và nhóm <b>lễ nghi</b>: <span class='zh'>隆重 · 仪式 · 沐浴 · 荤 · 庄严 · 镇静 · 从容</span>.","Nắm <span class='zh'>左……右…… · 不成</span>.","Phân biệt <span class='zh'>一贯 — 一直</span>; làm quen <b>修辞 (4): 引用</b>.","Viết bài “善于外交的……” ≥400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (左……右……) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (不成 · 一贯—一直) · Đoạn 4–8 · 引用 · Bài tập · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Thế khó",paras:"Đoạn 1–2",zh:"秦以十五城换璧；赵王左右为难",vn:"Tần mạnh, đòi đổi 15 thành lấy ngọc Hòa Thị. Triệu Vương khó xử; Lạn Tương Như phân tích và nhận đi sứ: “không giao thành thì trả ngọc về Triệu nguyên vẹn”."},{tag:"承",name:"Đoạt lại ngọc",paras:"Đoạn 3",zh:"借口指毛病，以死相逼",vn:"Tần Vương mê ngọc, không nhắc đổi thành. Tương Như mượn cớ chỉ vết, cầm ngọc thề đập đầu cùng ngọc vào cột; đòi Tần Vương làm lễ như Triệu."},{tag:"转",name:"Gửi ngọc về",paras:"Đoạn 4",zh:"派人偷偷送璧回赵",vn:"Tương Như sai người cải trang thương nhân lén mang ngọc về Triệu."},{tag:"合",name:"Đối đáp",paras:"Đoạn 5–8",zh:"理直气壮；秦王只得作罢",vn:"Năm ngày sau, ông bình tĩnh vạch tội bội tín của Tần; Tần Vương đành giả bộ rộng lượng — từ đó không nhắc chuyện đổi thành lấy ngọc nữa."}],warm1:{q:"在国家外交中，你认为弱国应该采取何种方式应对强国？请根据下列提示说说自己的看法。",vn:"Bạn đồng ý với cách nào? Bấm 有 (đồng ý) / 无 (không).",items:[["🙇","完全服从强国","Hoàn toàn phục tùng nước mạnh"],["⚔️","跟强国对抗","Đối đầu nước mạnh"],["🤝","请求别国的帮助","Nhờ nước khác giúp"],["⚖️","在保全自己的基础上适当妥协","Thỏa hiệp vừa phải trên cơ sở bảo toà gọc, ngọc thạch",1,"","矿物，质地细而有光泽，可用来制装饰品或做雕刻的材料。","以城换玉","这只手镯是玉做的。","Chiếc vòng tay này làm bằng ngọc.",[],""],[2,"答复","dáfù","đgt.","đáp phục","trả lời",1,"","对问题或要求给以回答。","不知如何答复秦王","请尽快给我们答复。","Xin trả lời chúng tôi sớm.",[],"Bài tập 1: <span class='zh'>回复 · 复习 · 往复 · 复杂</span>; 3①."],[3,"得罪","dézuì","đgt.","đắc tội","xúc phạm, làm mích lòng",1,"","使人不快或怀恨。","又怕得罪秦国","我不想得罪任何人。","Tôi không muốn mích lòng ai.",[],"SBT câu 23A."],[4,"大臣","dàchén","dt.","đại thần","đại thần",1,"","君主国家的高级官员。","召集大臣商议对策","国王召见了大臣们。","Nhà vua triệu kiến các đại thần.",[],"SBT câu 33–36."],[5,"对策","duìcè","dt.","đối sách","đối sách, biện pháp đối phó",1,"","对付的策略或办法。","商议对策","我们要想出对策来。","Chúng ta phải nghĩ ra đối sách.",[],""],[6,"提议","tíyì","đgt.","đề nghị","đề nghị, đề xuất",1,"","商讨问题时提出主张来请大家讨论。","有人提议","我提议大家休息一下。","Tôi đề nghị mọi người nghỉ một lát.",[],"Bài tập 2②. SBT câu 33–36."],[7,"请教","qǐngjiào","đgt.","thỉnh giáo","xin chỉ bảo, hỏi ý kiến",1,"","请求指教。","亲自向他请教","有个问题想请教您。","Có vấn đề muốn hỏi ý kiến ông.",[],""],[8,"实力","shílì","dt.","thực lực","thực lực, sức mạnh",1,"","实在的力量（多指军事或经济方面）。","凭实力，我们不答应不行","这家公司实力雄厚。","Công ty này thực lực hùng hậu.",[],"Bài tập 3①."],[9,"慷慨","kāngkǎi","tt.","khảng khái","rộng rãi, hào phóng",1,"","不吝惜；大方。","也算慷慨","他对朋友很慷慨。","Anh ấy rất hào phóng với bạn bè.",[],"Bài tập 3①."],[10,"亏待","kuīdài","đgt.","khuy đãi","xử tệ, đối đãi kém",1,"","待人不公平或不尽心。","并未亏待赵国","公司不会亏待你的。","Công ty sẽ không bạc đãi anh đâu.",[],"Bài tập 3①. SBT nghe 14–17."],[11,"动身","dòng shēn","đgt.","động thân","khởi hành, lên đường",1,"","启程；出发。","即刻动身前去磋商","我们明天一早动身。","Sáng sớm mai chúng tôi lên đường.",[],""],[12,"磋商","cuōshāng","đgt.","tha thương","bàn bạc, trao đổi",1,"","反复商量；仔细讨论。","前去磋商","双方正在磋商合作的事。","Hai bên đang bàn chuyện hợp tác.",[],"Khởi động 2: nhóm <span class='zh'>商</span>."],[13,"荣幸","róngxìng","tt.","vinh hạnh","vinh dự",1,"","光荣而幸运。","是我的荣幸","能认识您，我很荣幸。","Được quen ông, tôi rất vinh hạnh.",[],"Bài tập 1: <span class='zh'>幸亏 · 幸运 · 幸好 · 幸免</span>. SBT câu 33–36."],[14,"转达","zhuǎndá","đgt.","chuyển đạt","truyền đạt, chuyển",1,"","把一方的话转告给另一方。","转达了赵王的问候","请转达我对你父母的问候。","Xin chuyển lời hỏi thăm của tôi tới bố mẹ anh.",[],"Bài tập 2③, 3①."],[15,"爱不释手","àibúshìshǒu","thành ngữ","ái bất thích thủ","thích quá nên cầm mãi không chịu buông",1,"成","喜爱得舍不得放手。","左看右看，爱不释手","这本书让我爱不释手。","Cuốn sách này khiến tôi cầm mãi không rời.",[],""],[16,"圈套","quāntào","dt.","khuyên sáo","(cái) bẫy",1,"","使人上当受骗的计策。","心想果然是个圈套","小心别上了他的圈套。","Cẩn thận kẻo mắc bẫy hắn.",[],"SBT câu 35A."],[17,"归还","guīhuán","đgt.","quy hoàn","trả lại, trả về",1,"","把借来的钱或物还给原主。","请大王把璧归还于我","借的书要按时归还。","Sách mượn phải trả đúng hạn.",[],""],[18,"从容","cóngróng","tt.","thung dung","ung dung, điềm tĩnh",1,"","不慌不忙；镇静。","从容地站在殿中央","他从容地回答了问题。","Anh ung dung trả lời câu hỏi.",[],"SBT câu 33–36."],[19,"中央","zhōngyāng","dt.","trung ương","giữa, trung tâm",1,"","中心的地方。","站在殿中央","广场中央有一座雕像。","Giữa quảng trường có một bức tượng.",[],""],[20,"兑现","duìxiàn","đgt.","đoái hiện","thực hiện, hoàn thành",1,"","比喻诺言的实现。","并没有兑现的诚意","他终于兑现了承诺。","Cuối cùng anh đã thực hiện lời hứa.",[],"Bài tập 2④. SBT nghe câu 2."],[21,"妄想","wàngxiǎng","dt.","vọng tưởng","ảo tưởng, mơ ước vẩn vơ",1,"","不能实现的打算。","那是妄想","这简直是妄想！","Thật là vọng tưởng!",[],"Bài tập 1 (ví dụ): <span class='zh'>梦想 · 理想 · 空想 · 想法</span>."],[22,"发誓","fā shì","đgt.","phát thệ","xin thề, thề",1,"","庄严地说出表示决心的话。","蔺相如发誓","他发誓再也不喝酒了。","Anh thề không bao giờ uống rượu nữa.",[],"SBT nghe câu 3."],[23,"尸体","shītǐ","dt.","thi thể","thi thể, xác chết",1,"","人或动物死后的身体。","秦王看到的将是他的尸体","警察发现了一具尸体。","Cảnh sát phát hiện một thi thể.",[],""],[24,"撒谎","sā huǎng","đgt.","tát hoang","nói dối, bịa đặt",1,"","说谎。","我怎么会撒谎呢？","小孩子不应该撒谎。","Trẻ con không nên nói dối.",[],"Bài tập 1: <span class='zh'>谎言 · 谎话 · 谎称 · 弥天大谎</span>. SBT câu 23D."],[25,"隆重","lóngzhòng","tt.","long trọng","long trọng, linh đình",1,"","盛大庄重。","举行了隆重的仪式","学校举行了隆重的毕业典礼。","Trường tổ chức lễ tốt nghiệp long trọng.",[],"SBT câu 18C."],[26,"仪式","yíshì","dt.","nghi thức","nghi thức, nghi lễ",1,"","举行典礼的程序、形式。","隆重的仪式","结婚仪式。","Nghi thức cưới.",[],""],[27,"沐浴","mùyù","đgt.","mộc dục","tắm gội",1,"","洗澡。","沐浴更衣","他沐浴在阳光里。","Anh tắm mình trong nắng.",[],"SBT câu 19C."],[28,"荤","hūn","dt.","huân","món mặn (thịt hoặc cá)",1,"","指鸡鸭鱼肉等食物。","戒掉荤腥","他不吃荤，只吃素。","Anh không ăn mặn, chỉ ăn chay.",["荤菜"],"Đối lập: <span class='zh'>素</span> (chay)."],[29,"庄严","zhuāngyán","tt.","trang nghiêm","trang nghiêm",1,"","庄重而严肃。","以示庄严","会场气氛庄严。","Không khí hội trường trang nghiêm.",[],"SBT câu 20D."],[30,"无理取闹","wúlǐ-qǔnào","thành ngữ","vô lý thủ náo","cố tình gây sự, kiếm chuyện vô cớ",1,"成","毫无理由地跟人吵闹。","我并非无理取闹","你别无理取闹了。","Anh đừng vô cớ gây sự nữa.",[],"Bài tập 3②. SBT câu 18D."],[31,"冒犯","màofàn","đgt.","mạo phạm","xúc phạm",1,"","言语或行动没有礼貌，冲撞了对方。","也不是冒犯大王","如有冒犯，请多原谅。","Nếu có gì mạo phạm, xin thứ lỗi.",[],"Bài tập 3②. SBT nghe câu 5."],[32,"亦","yì","phó.","diệc","cũng",1,"书","也。","亦请举行同样的仪式","反之亦然。","Ngược lại cũng vậy.",[],"Bài tập 2⑤."],[33,"边境","biānjìng","dt.","biên cảnh","biên giới",1,"","靠近边界的地方。","偷偷越过边境","他们住在边境地区。","Họ sống ở vùng biên giới.",[],"Bài tập 1: <span class='zh'>旁边 · 身边 · 边关 · 边缘</span>."],[34,"泄露","xièlòu","đgt.","tiết lộ","tiết lộ, để lộ",1,"","不应该让人知道的事情让人知道了。","不可泄露秘密","不要泄露公司的秘密。","Đừng tiết lộ bí mật công ty.",[],"Bài 25: <span class='zh'>走漏</span>."],[35,"率领","shuàilǐng","đgt.","suất lĩnh","dẫn đầu",1,"","带领（队伍或集体）。","秦王率领众臣","他率领球队获得了冠军。","Anh dẫn dắt đội bóng giành chức vô địch.",[],"⚠️ 率 đọc <b>shuài</b>."],[36,"镇静","zhènjìng","tt.","trấn tĩnh","bình tĩnh, điềm tĩnh",1,"","情绪稳定或平静。","蔺相如镇静地对秦王说","遇到危险要保持镇静。","Gặp nguy phải giữ bình tĩnh.",[],""],[37,"雄厚","xiónghòu","tt.","hùng hậu","hùng hậu",1,"","（人力、物资等）充足。","仗着国力雄厚","资金雄厚。","Vốn hùng hậu.",[],"Bài tập 3②."],[38,"一贯","yíguàn","tt.","nhất quán","trước sau như một, xưa nay",1,"","（思想、作风等）一向如此，从未改变。","一贯霸道","这是他一贯的作风。","Đây là tác phong trước sau như một của anh.",[],"Xem <b>辨析 一贯—一直</b>."],[39,"霸道","bàdào","tt.","bá đạo","độc đoán, chuyên chế",1,"","蛮横不讲理。","一贯霸道","他为人很霸道。","Hắn làm người rất ngang ngược.",[],"Bài tập 3②. SBT câu 22C."],[40,"声誉","shēngyù","dt.","thanh dự","danh tiếng, tiếng tăm",1,"","声望名誉。","声誉不好","这家公司在业内声誉很好。","Công ty này có danh tiếng tốt trong ngành.",[],""],[41,"列举","lièjǔ","đgt.","liệt cử","liệt kê, nêu ra",1,"","一个一个地举出来。","就不一一列举了","请列举几个例子。","Hãy nêu vài ví dụ.",[],"Bài tập 3②. SBT câu 29–32."],[42,"履行","lǚxíng","đgt.","lý hành","thực hiện, thực thi",1,"","实践（自己答应做的或应该做的事）。","不履行承诺","双方都要履行合同。","Hai bên đều phải thực hiện hợp đồng.",["履行承诺","履行义务"],""],[43,"歪曲","wāiqū","đgt.","oai khúc","xuyên tạc, bóp méo",1,"","故意改变（事实或内容）。","歪曲我的意思","不要歪曲事实。","Đừng bóp méo sự thật.",[],""],[44,"理直气壮","lǐzhí-qìzhuàng","thành ngữ","lý trực khí tráng","dõng dạc (nói)",1,"成","理由充分，说话有气势。","蔺相如理直气壮地说","他理直气壮地反驳了对方。","Anh dõng dạc phản bác đối phương.",[],"SBT câu 19A."],[45,"压迫","yāpò","đgt.","áp bách","áp bức, đàn áp",1,"","用权力或势力强制别人服从自己。","弱国压迫强国","反抗压迫。","Chống áp bức.",[],""],[46,"口头","kǒutóu","tt.","khẩu đầu","bằng lời nói, ngoài miệng",1,"","用说话方式来表达的。","不要光口头说","口头协议。","Thỏa thuận miệng.",[],"Mở rộng: <span class='zh'>书面 ↔ 口头</span>."],[47,"副","fù","lượng.","phó","gương, bộ (mặt), bộ, đôi",1,"","用于面部表情；用于成套的东西。","装出一副高姿态","一副笑脸 / 一副手套。","Một bộ mặt tươi cười / một đôi găng tay.",[],"SBT nghe câu 3: <span class='zh'>一副失败者的姿态</span>."],[48,"姿态","zītài","dt.","tư thái","dáng dấp, thái độ, dáng vẻ",1,"","态度；气度。","高姿态","他以胜利者的姿态出现。","Anh xuất hiện với tư thế người chiến thắng.",["高姿态"],""],[49,"隔阂","géhé","dt.","cách ngại","sự ly gián, sự ngăn cách, sự bất hòa",1,"","彼此情意不通，思想有距离。","闹出隔阂","两人之间产生了隔阂。","Giữa hai người nảy sinh khoảng cách.",[],"SBT câu 18B."],[50,"争端","zhēngduān","dt.","tranh đoan","sự xung đột, sự tranh chấp",1,"","引起争执的事由。","再起争端","和平解决国际争端。","Giải quyết hòa bình các tranh chấp quốc tế.",[],""]],extra:[["战国","Zhànguó","Chiến Quốc"],["秦 · 赵","Qín · Zhào","nước Tần · nước Triệu"],["和氏璧","Héshì bì","ngọc Hòa Thị"],["蔺相如","Lìn Xiàngrú","Lạn Tương Như"],["左右为难","zuǒyòu-wéinán","tiến thoái lưỡng nan"],["见多识广","jiànduō-shíguǎng","từng trải hiểu rộng"],["有勇有谋","yǒu yǒng yǒu móu","có dũng có mưu"],["戒掉荤腥","jièdiào hūnxīng","kiêng đồ mặn"],["素食","sùshí","đồ chay"],["割让","gēràng","cắt nhượng"],["堂堂","tángtáng","đường đường"]],T:[{zh:"战国后期，秦国最强。秦王得知赵王得到一块叫“和氏璧”的宝玉，传话给赵王，说愿用十五座城换和氏璧。赵王左右为难，不知如何答复秦王：答应吧，怕上当受骗——给了和氏璧，拿不到城；不答应吧，又怕得罪秦国。于是，赶忙召集大臣商议对策。",vn:"Cuối thời Chiến Quốc, nước Tần mạnh nhất. Tần Vương biết Triệu Vương có được một viên ngọc quý gọi là “ngọc Hòa Thị”, bèn truyền lời cho Triệu Vương, nói muốn đổi mười lăm tòa thành lấy ngọc Hòa Thị. Triệu Vương tiến thoái lưỡng nan, không biết trả lời Tần Vương thế nào: nhận lời thì sợ bị lừa — đưa ngọc mà không lấy được thành; không nhận thì lại sợ đắc tội với Tần. Thế là vội triệu tập đại thần bàn đối sách.",idea:"Tần đòi đổi thành lấy ngọc.",q:["赵王因为什么事情发愁？"],note:[["左右为难","Xem 修辞: 引用 thành ngữ."],["答应吧，……；不答应吧，……","Mẫu “A吧…，不A吧…” diễn tả khó xử."]]},{zh:"大臣们也没有好办法。有人提议，蔺相如见多识广，有勇有谋，可以听听他怎么说。赵王请来了蔺相如，并亲自向他请教。蔺相如说：“秦强赵弱，凭实力，我们不答应不行；秦以十五座城换一块玉，也算慷慨，并未亏待赵国，若不答应，过错在赵；若将和氏璧送去，秦不交出城来，那么错就在秦了，因此我们只有送和氏璧。”赵王说：“那就请先生即刻动身前去磋商。”蔺相如说：“大王派我去，是我的荣幸。此去秦国，秦若是交了城，我便把璧留下；不交城，我一定完璧归赵。”",vn:"Các đại thần cũng không có cách hay. Có người đề nghị: Lạn Tương Như từng trải hiểu rộng, có dũng có mưu, có thể nghe xem ông nói sao. Triệu Vương mời Lạn Tương Như đến, đích thân hỏi ý. Lạn Tương Như nói: “Tần mạnh Triệu yếu, xét thực lực, ta không nhận lời không được; Tần lấy mười lăm thành đổi một viên ngọc, cũng coi là hào phóng, chẳng bạc đãi Triệu; nếu không nhận, lỗi ở Triệu; nếu đưa ngọc sang mà Tần không giao thành, thì lỗi ở Tần — vì vậy ta chỉ có thể mang ngọc đi.” Triệu Vương nói: “Vậy xin tiên sinh lập tức lên đường đi bàn bạc.” Lạn Tương Như nói: “Đại vương cử tôi đi là vinh hạnh của tôi. Chuyến đi Tần này, nếu Tần giao thành, tôi sẽ để ngọc lại; không giao thành, tôi nhất định mang ngọc nguyên vẹn về Triệu.”",idea:"Lạn Tương Như phân tích, nhận đi sứ.",q:["赵王派谁去秦国磋商？为什么？"],note:[["若……，……；若……，那么……","Phân tích hai khả năng — lập luận chặt."],["完璧归赵","Nguồn gốc thành ngữ."]]},{zh:"蔺相如带着和氏璧到了秦国，转达了赵王的问候，把玉献给了秦王。秦王对着和氏璧左看右看，爱不释手。蔺相如等了半天不见秦王提换城之事，心想果然是个圈套，可璧在秦王手里，怎么把璧拿回来呢？左思右想之后，他对秦王说：“这璧有点儿小毛病，请大王把璧归还于我，我指给大王看。”秦王把璧递给蔺相如。蔺相如从容地站在殿中央，手抱和氏璧说：“大王派人到赵国，说用十五座城换赵国的璧。赵王派我将璧送来。可大王您好像并没有兑现的诚意。如今璧在我手里，想不交城拿走璧，那是妄想。”蔺相如发誓，如若逼他，就将自己的头和璧一起撞碎在柱子上，秦王看到的将是他的尸体和破碎的玉。秦王连忙说：“别误会，我怎么会撒谎呢？”忙命大臣拿出地图，把十五座城指给蔺相如看。蔺相如还是不敢相信秦王，说：“赵王送璧之前，举行了隆重的仪式：沐浴更衣，戒掉荤腥，只吃素食，以示庄严。我并非无理取闹，也不是冒犯大王。大王如真心换璧，亦请举行同样的仪式，我才敢把璧献给您。”",vn:"Lạn Tương Như mang ngọc Hòa Thị đến nước Tần, chuyển lời hỏi thăm của Triệu Vương, dâng ngọc cho Tần Vương. Tần Vương cầm ngọc ngắm trái ngắm phải, mê không rời tay. Lạn Tương Như đợi hồi lâu chẳng thấy Tần Vương nhắc chuyện đổi thành, nghĩ bụng quả nhiên là cái bẫy; nhưng ngọc trong tay Tần Vương, làm sao lấy lại? Nghĩ tới nghĩ lui, ông nói với Tần Vương: “Viên ngọc này có chút tì vết, xin đại vương trả ngọc cho tôi, tôi chỉ cho đại vương xem.” Tần Vương đưa ngọc cho Lạn Tương Như. Ông ung dung đứng giữa điện, ôm ngọc nói: “Đại vương sai người sang Triệu, nói đổi mười lăm thành lấy ngọc của Triệu. Triệu Vương sai tôi mang ngọc tới. Nhưng đại vương dường như không có thành ý thực hiện. Nay ngọc trong tay tôi, muốn không giao thành mà lấy ngọc thì là vọng tưởng.” Lạn Tương Như thề, nếu ép ông, ông sẽ đập đầu mình cùng viên ngọc vào cột, Tần Vương sẽ chỉ thấy xác ông và ngọc vỡ. Tần Vương vội nói: “Đừng hiểu lầm, sao ta lại nói dối được?” Vội sai đại thần mang bản đồ ra, chỉ mười lăm tòa thành cho Lạn Tương Như xem. Lạn Tương Như vẫn không dám tin Tần Vương, nói: “Trước khi gửi ngọc, Triệu Vương đã cử hành nghi lễ long trọng: tắm gội thay áo, kiêng đồ mặn, chỉ ăn chay, để tỏ trang nghiêm. Tôi không phải vô cớ gây sự, cũng không phải mạo phạm đại vương. Nếu đại vương thật lòng đổi ngọc, cũng xin cử hành nghi lễ như vậy, tôi mới dám dâng ngọc cho ngài.”",idea:"Đoạt lại ngọc bằng trí và dũng.",q:["蔺相如是怎样把玉拿回来的？"],note:[["左看右看 · 左思右想","Xem Ngữ pháp 1: <span class='zh'>左……右……</span>."],["如若 · 亦 · 并非","Từ văn viết."],["以示庄严","<span class='zh'>以示</span> = để tỏ ra."]]},{zh:"秦王想，璧都到了我这儿，我还怕他跑了不成？就说：“好，就依你。”蔺相如回到住处，立刻派人打扮成商人的模样，偷偷越过边境，把璧送回了赵国，并嘱咐身边的人，不可泄露秘密。",vn:"Tần Vương nghĩ, ngọc đã tới chỗ ta rồi, lẽ nào ta còn sợ hắn chạy mất? Bèn nói: “Được, theo ý ngươi.” Lạn Tương Như về chỗ ở, lập tức sai người cải trang thành thương nhân, lén vượt biên giới, đưa ngọc về nước Triệu, đồng thời dặn người bên cạnh không được tiết lộ bí mật.",idea:"Lén đưa ngọc về Triệu.",q:["蔺相如怎样把璧送回赵国？"],note:[["我还怕他跑了不成？","Xem Ngữ pháp 2: <span class='zh'>不成</span>."]]},{zh:"五天后，秦王率领众臣，准备接收和氏璧。蔺相如镇静地对秦王说：“秦国仗着国力雄厚，一贯霸道，不讲信用，声誉不好，事情我就不一一列举了，今天，我怕大王您不履行承诺，已经把璧送回了赵国。”秦王听后大怒，说：“我堂堂秦王，还会骗你不成？你这不是歪曲我的意思吗？”",vn:"Năm ngày sau, Tần Vương dẫn các quần thần chuẩn bị nhận ngọc Hòa Thị. Lạn Tương Như bình tĩnh nói với Tần Vương: “Nước Tần cậy quốc lực hùng hậu, xưa nay ngang ngược, không giữ chữ tín, tiếng tăm không tốt, những việc ấy tôi xin không kể ra từng việc; hôm nay, tôi sợ đại vương không thực hiện lời hứa, nên đã gửi ngọc về Triệu rồi.” Tần Vương nghe xong nổi giận: “Ta đường đường là Tần Vương, lẽ nào lại lừa ngươi? Ngươi chẳng phải đang xuyên tạc ý ta sao?”",idea:"Thẳng thắn vạch tội.",q:["秦王听说璧已送回，有什么反应？"],note:[["一贯霸道","Xem 辨析 一贯—一直."],["还会骗你不成？","<span class='zh'>不成</span> trong câu phản vấn."]]},{zh:"蔺相如理直气壮地说：“众所周知，秦强赵弱。天下只可能强国欺负弱国，不可能弱国压迫强国。大王真要那块璧的话，不要光口头说，请先把十五座城割让给赵国，赵得到十五座城，绝不敢不把璧交出来。”",vn:"Lạn Tương Như dõng dạc nói: “Ai cũng biết Tần mạnh Triệu yếu. Thiên hạ chỉ có nước mạnh ức hiếp nước yếu, không thể có nước yếu áp bức nước mạnh. Đại vương nếu thật muốn viên ngọc ấy, đừng chỉ nói miệng; xin trước hãy cắt mười lăm tòa thành nhường cho Triệu, Triệu được mười lăm thành, quyết không dám không giao ngọc.”",idea:"Dõng dạc lập luận.",q:["蔺相如是怎样跟秦王辩论的？"],note:[["绝不敢不……","Phủ định kép = chắc chắn sẽ."]]},{zh:"秦王听蔺相如说得在理，只得装出一副高姿态说：“不就是一块玉嘛，秦赵两国总不能为这点儿小事闹出隔阂，再起争端。”",vn:"Tần Vương thấy Lạn Tương Như nói có lý, đành làm bộ rộng lượng nói: “Chẳng qua chỉ là một viên ngọc thôi, hai nước Tần Triệu cũng không thể vì chuyện nhỏ này mà sinh hiềm khích, lại gây xung đột.”",idea:"Tần Vương đành thôi.",q:["秦王最后怎么说？"],note:[["装出一副高姿态","Làm ra vẻ rộng lượng (để giữ thể diện)."]]},{zh:"蔺相如归赵以后，秦国再也没有提过以城换玉的事情。",vn:"Sau khi Lạn Tương Như về Triệu, nước Tần không bao giờ nhắc lại chuyện đổi thành lấy ngọc nữa.",idea:"Kết.",q:["故事的结果是什么？"],note:[["以城换玉","<span class='zh'>以A换B</span> = lấy A đổi B."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:1,word:"",zh:"左……右……",py:"zuǒ…yòu…",tag:"Chú thích 1",mean:"Nhấn mạnh <b>cùng một loại hành vi lặp đi lặp lại nhiều lần</b>.<br>① <span class='zh'>左 + V₁ + 右 + V₂</span>: V₁, V₂ giống nhau hoặc gần nghĩa.<br>② <span class='zh'>左 + 一 + lượng từ (+ N) + 右 + 一 + lượng từ (+ N)</span>.",forms:["左看右看 · 左思右想 · 左顾右盼","左一遍右一遍 · 左一张右一张 · 左一个电话右一个电话"],ex:[["秦王对着和氏璧左看右看，爱不释手。","",1],["……左思右想之后，他对秦王说：“这璧有点儿小毛病……”","",1],["那个电影，他左一遍右一遍地看，看了七八遍也看不够。","Bộ phim ấy, anh xem đi xem lại bảy tám lần vẫn chưa chán."],["妈妈左一个电话右一个电话地催他回家。","Mẹ gọi hết cú này đến cú khác giục anh về nhà."]],tips:["Khác <span class='zh'>左右为难</span> (thành ngữ: khó xử hai đường).","Bài tập 2①. SBT câu 20B: <span class='zh'>左思右想</span>."],practice:{q:"用“左……右……”完成句子",type:"complete",items:[["我________地去了你家五六趟了，你怎么老不在家呀！","我左一趟右一趟地去了你家五六趟了……"],["大家________，总算把她说通了。","大家左一句右一句，总算把她说通了。"],["妈妈拿着女儿买的礼物，________，越看越喜欢。","……左看看右看看，越看越喜欢。"]]}},{id:"g2",grp:1,word:"",zh:"（难道 / 莫非）……不成？",py:"bùchéng",tag:"Chú thích 2 · trợ từ",mean:"Trợ từ đứng <b>cuối câu</b>, biểu thị ngữ khí <b>suy đoán</b> hoặc <b>phản vấn</b>; phía trước thường có <span class='zh'>难道 · 莫非</span> hô ứng — “lẽ nào… sao?”.",forms:["难道 + ……+ 不成？","莫非 + ……+ 不成？"],ex:[["璧都到了我这儿，我还怕他跑了不成？","",1],["我堂堂秦王，（难道）还会骗你不成？","",1],["他大吃一惊，头脑中一片空白——莫非受了骗不成？","Anh giật mình, đầu óc trống rỗng — lẽ nào bị lừa rồi?"]],tips:["Bài tập 2⑥. SBT câu 21: <span class='zh'>难道是做好吃的怕人家讨要不成？</span>"],practice:{q:"将疑问句改成带“不成”的反问句",type:"complete",items:[["到现在你都不说出实情，难道是想一直这样骗下去吗？","……难道是想一直这样骗下去不成？"],["你们大家都不说话，事情就这么算了吗？","……难道事情就这么算了不成？"],["咱们多少年的朋友了，难道我会害你吗？","咱们多少年的朋友了，我会害你不成？"]]}},{id:"g3",grp:0,word:"答复",zh:"答复 / 提议 / 转达 / 兑现",py:"dáfù / tíyì / zhuǎndá / duìxiàn",tag:"Từ ngoại giao · Bài tập 2",mean:"<span class='zh'>答复</span> = trả lời (chính thức); <span class='zh'>提议</span> = đề xuất; <span class='zh'>转达</span> = chuyển lời; <span class='zh'>兑现</span> = thực hiện (lời hứa); <span class='zh'>履行</span> = thực thi (nghĩa vụ, hợp đồng).",forms:["答复 + 某人 / 问题","转达 + 问候 / 意见","兑现 / 履行 + 承诺"],ex:[["赵王左右为难，不知如何答复秦王……","",1],["蔺相如……转达了赵王的问候……","",1],["可大王您好像并没有兑现的诚意。","",1]],tips:["Bài tập 2②③④."]},{id:"g4",grp:2,word:"一贯",zh:"一贯 / 一直",py:"yíguàn / yìzhí",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>xưa nay vẫn vậy, chưa từng thay đổi</b>”. <span class='zh'>一贯</span>: thiên về tư tưởng, tác phong, thái độ; chỉ quá khứ → hiện tại; là <b>tính từ</b> (bổ nghĩa danh từ). <span class='zh'>一直</span>: cả hành động liên tục; dùng được cho tương lai; là <b>phó từ</b>.",forms:["一贯 + 的 + 作风 / 态度","一直 + V / 下去"],ex:[["秦国仗着国力雄厚，一贯霸道，不讲信用……","",1]],tips:["SBT câu 33–36."]}],BX:{grp:2,word:"一贯",cols:["一贯","一直"],pair:"一贯 — 一直",same:["Đều có nghĩa “<b>一向如此，从未改变</b>”.","他干活儿一贯 / 一直很卖力。"],diff:[["Thiên về <b>tư tưởng, tác phong, thái độ</b> xưa nay như vậy; thường <b>không</b> chỉ hành động liên tục.","谦虚、朴素是他一贯的作风。（√）　雨一贯下了三天。（×）","Chỉ được <b>hành động liên tục</b> không ngắt, cũng chỉ được <b>trạng thái</b> không đổi.<div class='zh' style='margin-top:4px'>雨一直下了三天。（√）　他一直是这个样子。（√）</div>"],["Chỉ hành vi <b>từ quá khứ đến hiện tại</b>, không dùng cho tương lai.","要把这种作风一贯坚持下去。（×）","Dùng được cho <b>tương lai</b>.<div class='zh' style='margin-top:4px'>要把这种作风一直坚持下去。（√）</div>"],["Là <b>tính từ</b>, bổ nghĩa được cho danh từ.","这是他一贯的态度。（√）","Là <b>phó từ</b>, không bổ nghĩa cho danh từ.<div class='zh' style='margin-top:4px'>这是他一直的态度。（×）</div>"]],task:{q:"选择“一贯”或“一直”填空",cols:["一贯","一直"],sample:!1,items:[["自从昨天晚上听到这个不幸的消息，她就____在哭。",1,"Hành động liên tục → 一直."],["说实话，欺上瞒下是他____的手段。",0,"Bổ nghĩa danh từ (的手段) → 一贯."],["爷爷____为人谦虚热情，是个公认的好人。",0,"Tác phong, tính cách xưa nay → 一贯."],["凝视着男友英俊的面庞，小文暗想：“多希望能____陪他走下去啊！”",1,"Tương lai → 一直."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["妄<u>想</u>","梦想 · 理想 · 空想 · 想法"],items:[["答<u>复</u>","复","回复 · 复习 · 往复 · 复杂"],["荣<u>幸</u>","幸","幸亏 · 幸运 · 幸好 · 幸免"],["撒<u>谎</u>","谎","谎言 · 谎话 · 谎称 · 弥天大谎"],["<u>边</u>境","边","旁边 · 身边 · 边关 · 边缘"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["我的手机铃声不断响起，让我有点儿烦。→ ________","左一……右一……","我的手机铃声不断响起，左一遍右一遍，让我有点儿烦。"],["为提高工作效率，小王建议把两个部门合并起来。→ ________","提议","为提高工作效率，小王提议把两个部门合并起来。"],["你对他诚挚的问候，我一定当面转告。→ ________","转达","你对他诚挚的问候，我一定转达给他。"],["我终于做到了若干年前对你的承诺。→ ________","兑现","我终于兑现了若干年前对你的承诺。"],["民族素质指国内各民族全体成员个体和群体的素质，也称国民素质。→ ________","亦","……，亦称国民素质。"],["你刚答应我的事，转眼就改变主意了，难道你想反悔吗？→ ________","不成","你刚答应我的事，转眼就改变主意，你想反悔不成？"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["慷慨","答复","转达","实力","亏待"],text:"一家公司想聘请我去工作，于是派人来说服我。来人先{转达}了总经理的问候，然后又开始劝说：“凭你的{实力}，几年之内，一定能升到副总的职位。而且我们老板很{慷慨}，一定不会{亏待}你，……”我没有立即{答复}他们，决定慎重地考虑考虑再说。"},{bank:["列举","冒犯","雄厚","霸道","无理取闹"],text:"班里有个很{霸道}的学生，大家都讨厌他。他仗着家里资金{雄厚}，常常{无理取闹}。不但欺负同学，还{冒犯}老师、撒谎、不讲信用……劣迹太多，无法一一{列举}了。"}]},EX4:{q:"请找出下列语段中引用的成分",items:[{src:"",task:"俗话说：“不到长城非好汉！”今天我终于登上了长城。",model:"引用：不到长城非好汉（毛泽东词句，已成俗语）"},{src:"",task:"“只要功夫深，铁杵磨成针。”无论做什么事情，只要能坚持，有恒心，一定会成功的。",model:"引用：只要功夫深，铁杵磨成针（俗语）"},{src:"",task:"我看他是醉翁之意不在酒啊，你千万小心，别上了他的当。",model:"引用：醉翁之意不在酒（欧阳修《醉翁亭记》）"},{src:"",task:"刚开学时，老师记不住大家的名字，常常张冠李戴。",model:"引用：张冠李戴（成语）"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["赵王因为什么事情发愁？","和氏璧：答应…… / 不答应……","秦王要用十五座城换和氏璧。答应吧，怕给了璧拿不到城；不答应吧，又怕得罪秦国。"],["赵王派谁去秦国磋商？为什么？","① 见多识广，足智多谋 ② 蔺相如的分析：秦国……赵国……","派蔺相如去，因为他见多识广、有勇有谋。他分析说：不答应，过错在赵；送去了秦不交城，错就在秦。"],["蔺相如出使秦国的经过","① 献玉 ② 拿回玉 ③ 发誓 ④ 请秦王举行仪式 ⑤ 把玉偷偷送回赵国 ⑥ 跟秦王辩论","蔺相如献玉后，见秦王不提换城，就借口指毛病拿回了玉，发誓宁可撞碎玉也不让秦王白拿；又请秦王举行隆重的仪式，暗中派人把玉送回赵国；最后理直气壮地跟秦王辩论，秦王只得作罢。"]]},PZ:{title:"修辞（4）引用",vn:"Trích dẫn",intro:"Khi viết, <b>cố ý trích dẫn</b> thành ngữ, câu thơ, châm ngôn, điển cố… để biểu đạt tư tưởng tình cảm, nói lên kiến giải của mình về vấn đề mới, đạo lý mới — đó là <b>引用</b>. Trích dẫn giúp lời văn súc tích, có sức thuyết phục.",ex:[["赵王左右为难，不知如何答复秦王：答应吧，怕上当受骗……；不答应吧，又怕得罪秦国。","Thành ngữ “左右为难” = làm thế này cũng không ổn, thế kia cũng không ổn."],["一个村民，怎么会有如此高超的修复古代文物的技艺？这还得从几年前一批珍贵文物被盗，之后完璧归赵的故事说起。","Thành ngữ “完璧归赵”."],["以前中国人深信的是“酒香不怕巷子深”，我的酒好，不用自己宣传……","Tục ngữ “rượu ngon chẳng sợ ngõ sâu”."]],q:"把下列6个小句组合成3个连贯的语段",pvn:"A. 以前咱们讲究的是什么？童叟无欺；言而有信；君子一言，驷马难追；酒香不怕巷子深　B. 近年来，失眠症发病率居高不下，美国的失眠发生率高达32%~50%，英国在10%~14%之间，中国也在30%以上　C. 从小我就常听妈妈说，“一寸光阴一寸金，寸金难买寸光阴”　D. 现在可好，做假广告的，卖假冒伪劣产品的，考试作弊的，什么都有　E. 世界卫生组织对14个国家的调查显示　F. “少壮不努力，老大徒伤悲”，所以，人应该珍惜时间，从小努力",practice:[["语段（1）","A + D（以前……现在可好……）"],["语段（2）","E + B（调查显示……数据）"],["语段（3）","C + F（引用两句关于珍惜时间的名言）"]]},DP:[{title:"词汇（1）：熟悉下列反义词",vn:"7 cặp trái nghĩa.",items:[["保卫 ↔ 侵略","bǎowèi ↔ qīnlüè","bảo vệ ↔ xâm lược","","保卫祖国，反对侵略。"],["撤退 ↔ 进攻","chètuì ↔ jìngōng","rút lui ↔ tấn công","","敌人撤退了，我军开始进攻。"],["被告 ↔ 原告","bèigào ↔ yuángào","bị cáo ↔ nguyên cáo","","原告和被告都来到了法庭。"],["暴力 ↔ 和平","bàolì ↔ hépíng","bạo lực ↔ hòa bình","","用和平方式而不是暴力解决问题。"],["招标 ↔ 投标","zhāobiāo ↔ tóubiāo","mời thầu ↔ dự thầu","","政府招标，很多公司来投标。"],["独裁 ↔ 民主","dúcái ↔ mínzhǔ","độc tài ↔ dân chủ","","人民反对独裁，要求民主。"],["书面 ↔ 口头","shūmiàn ↔ kǒutóu","văn bản ↔ bằng lời","","口头答应不算，要有书面合同。"]]},{title:"词汇（2）：熟悉下列学业方面的词语",vn:"Đọc đoạn văn: 大学毕业生想拿到<b>文凭</b>，首先得通过各<b>科目</b>的考试，考试时当然不能<b>作弊</b>，平时也不能总是<b>旷课</b>……论文<b>格式</b>要规范，<b>标题</b>、<b>摘要</b>、<b>注释</b>等部分都要按照规定的格式书写……论文应该<b>要点</b>突出……很有可能<b>刊登</b>在专业<b>刊物</b>上……进行论文<b>答辩</b>……参加毕业<b>典礼</b>了。",items:[["文凭","wénpíng","văn bằng","拿到文凭","他终于拿到了大学文凭。"],["科目","kēmù","môn học","考试科目","这学期有五个考试科目。"],["作弊","zuòbì","gian lận","考试作弊","考试作弊是不允许的。"],["旷课","kuàngkè","trốn học","经常旷课","他因为经常旷课被批评了。"],["格式","géshì","định dạng","论文格式","论文格式要规范。"],["标题","biāotí","tiêu đề","文章标题","这篇文章的标题很吸引人。"],["摘要","zhāiyào","tóm tắt","论文摘要","请先写一个三百字的摘要。"],["注释","zhùshì","chú thích","加注释","古文要加注释才看得懂。"],["要点","yàodiǎn","điểm chính","要点突出","请把会议的要点记下来。"],["刊登","kāndēng","đăng (báo)","刊登文章","他的文章刊登在了报纸上。"],["刊物","kānwù","tạp chí","专业刊物","这是一份专业刊物。"],["答辩","dábiàn","bảo vệ (luận văn)","论文答辩","下周我要参加论文答辩。"],["典礼","diǎnlǐ","điển lễ","毕业典礼","毕业典礼在礼堂举行。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"那次聚会我至今记忆犹新。一群富家子弟，山珍海味都已吃过，就是不曾见过西点西餐，在校长家里他们才算真正“大开洋荤”，吃的是西式糕点，喝的是咖啡、可乐。",o:["有钱就能整天山珍海味","餐桌上多数是大鱼大肉","大家喜欢在校长家里聚餐","在校长家吃的是西式餐点"],a:3,why:"“吃的是西式糕点，喝的是咖啡、可乐”. Có <span class='zh'>荤</span> trong <span class='zh'>大开洋荤</span>!"},{n:2,say:"捕杀野生动物、破坏生态平衡的行为之所以屡禁不止，皆因“利”之驱动。如果捕杀了野生动物卖不出去，且有严格的法律法规，犯法就兑现，捕杀就会被重判，干这个行当的人就会越来越少。",o:["野生动物保护应继续加强","捕杀野生动物都会被严惩","有人竟然驱车捕杀野生动物","捕杀野生动物的现象已很少"],a:0,why:"Còn <span class='zh'>屡禁不止</span> → cần tăng cường. D sai."},{n:3,say:"我碰了无数次壁，也没推出自己的歌，我绝望了，想重返地铁口，从此安心做我的地铁歌手，并发誓永远不再去那个所谓的歌坛折腾。这时候，一位真正有才有德的艺人出现了，是他彻底改变了我的命运！",o:["说话人得到了别人的帮助","说话人的命运在别人手里","说话人坚持履行自己的诺言","说话人是一副失败者的姿态"],a:0,why:"“一位……艺人出现了，是他彻底改变了我的命运”."},{n:4,say:"在访谈中，我的一些说法可能有失偏颇，请大家原谅。在一些文章中，我的观点不够成熟，请大家包涵。总之，在传媒行业，我有许多东西需要学习，真诚地希望通过本书结识更多的媒体同行，向大家请教学习。",o:["说话人经常得罪人","说话人出版了一本书","说话人文章写得很漂亮","说话人是个刚入门的记者"],a:1,why:"“希望通过本书结识更多的媒体同行”."},{n:5,say:"当代中学生“青春期”发育普遍提前，尤其是女中学生，由于身心发展普遍比男生快，加上独生女在家庭中的地位得到强化，她们往往敢于做一些引人注目、与众不同的事，爱说一些令人吃惊的话，比男生更敢于顶撞和冒犯父母。",o:["当代独生女都很能干","独生子女都被宠坏了","青春期女孩更具叛逆性","现在的中国学生很不听话"],a:2,why:"“比男生更敢于顶撞和冒犯父母”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：不少人认为《西游记》是儿童读物，请问您是怎样看待《西游记》的特点以及它在中国文学史上的地位的？\n男：《西游记》是中国古代小说中最容易为儿童接受的作品，这本身就是极为可贵的。要知道，中国古代除了民间故事和童谣，儿童可读的作品几乎没有。不过，这并不意味着《西游记》是肤浅的。一方面，对童心童趣的向往，可能是人难以泯灭的本性。而《西游记》神奇瑰丽、自由天真的想象，或许有助于我们暂时回归这一本性。另一方面，《西游记》又不只是单纯的童话，其中蕴含了丰富的中国文化。\n女：您能具体谈一谈吗？\n男：具体来说，孙悟空的机智勇敢、诙谐幽默代表了英雄主义和乐观主义；唐僧的坚定虔诚、软弱无能反映出旧时代知识分子面对瞬息万变的现实时缺乏应对能力；猪八戒的贪图安逸、目光短浅体现了传统农民的保守心理；至于沙和尚的勤恳依顺，也折射着我国民众朴实善良的品性。\n女：有道理。\n男：能够以一部作品如此鲜活地概括民族性格的几个重要类型，在古代小说中是不多见的。\n女：这么说，即使在今天，《西游记》也还是很有现实意义的。\n男：对呀。我们常常可以在以上这些人物身上看到自己或者我们相识的人的影子。也许，你渴望摆脱一切束缚，那么，孙悟空一定是你心仪的榜样；也许，你有时不免为物色诱惑，做出些荒唐可笑的事，那么，不妨以猪八戒为自嘲的镜子；万一你不幸如唐僧处处逢灾，又无能为力，也不必自怨自艾，只要虔诚坚定，西天还是可以到达的；假如你普普通通，默默奉献如沙和尚，最终也会赢得人们的赞赏和尊敬。",qs:[{n:6,q:"关于《西游记》的可贵之处，下列哪项正确？",o:["容易为儿童接受","书中有民间故事","书中有许多童谣","是为儿童创作的"],a:0,why:"“最容易为儿童接受的作品，这本身就是极为可贵的”."},{n:7,q:"为什么说《西游记》并不肤浅？",o:["它是一部优秀的童话","它能启发人的想象力","它能帮助成年人回忆童年","它有丰富的中国文化内涵"],a:3,why:"“其中蕴含了丰富的中国文化”."},{n:8,q:"关于《西游记》反映的民族性格，可以知道什么？",o:["孙悟空反映出中国人很重视集体观念","唐僧反映出古代知识分子对现实的不满","猪八戒反映出中国传统农民的乐观心理","沙和尚反映出中国人朴实而善良的品格"],a:3,why:"“沙和尚的勤恳依顺，也折射着我国民众朴实善良的品性”."},{n:9,q:"关于《西游记》的现实意义，下列哪项正确？",o:["孙悟空仍是我们学习的榜样","性格懦弱也不是要命的缺点","从中可以看到现代人的影子","默默奉献的精神才会受尊敬"],a:2,why:"“我们常常可以在以上这些人物身上看到自己……的影子”."},{n:10,q:"这段话主要谈的是什么？",o:["《西游记》的故事情节","《西游记》与儿童文学","《西游记》中的人物性格","《西游记》的特点和历史地位"],a:3,why:"Câu hỏi mở đầu: “特点以及……地位”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"塞万提斯出生在一个医生家庭，有过军旅生活的经历，并屡立战功，得到嘉奖，曾经被俘身负重伤。当他拿着元帅的保荐书，兴致勃勃归国时，途中再次被俘，做了5年苦工后才得以回国。没想到，回来后，他连工作都找不到，历尽艰辛，才勉强找了份工作，后又被诬陷入狱。出狱后，他干上了税收。一次他把税款交给一家银行保管，偏偏银行倒闭，他第二次入狱。\n出狱后，他陷入贫困，妹妹、妻子、儿女，一大家子人都等着他抚养。他住的地方环境极其恶劣，楼下就是酒馆。一天，有人酒后斗殴，眼看就要发生命案，他不顾一切，把那人背到家里，谁知人没救活，他涉嫌谋杀再次入狱。\n虽然恶运缠身，他却没有被打倒，相反思想却变得异常丰富。他凭着对生活的反思和斗牛士的精神，写出了震惊世界的巨著——《堂•吉诃德》。",qs:[{n:11,q:"塞万提斯靠什么出的名？",o:["医术","军功","经历","作品"],a:3,why:"“写出了震惊世界的巨著——《堂•吉诃德》”."},{n:12,q:"关于塞万提斯的经历，下列哪项正确？",o:["他做过军医","他做过斗牛士","他曾三次入狱","他做过三次俘虏"],a:2,why:"Bị vu oan, ngân hàng phá sản, bị nghi giết người → 3 lần vào tù. D: 2 lần bị bắt làm tù binh."},{n:13,q:"根据这段话，可以知道什么？",o:["他的运气特别不好","他喜欢银行的工作","他天生是个思想家","他一直在为写作做准备"],a:0,why:"“恶运缠身”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"“我的手还能活动；我的大脑还能思维；我有终生追求的理想；我有爱我和我爱着的亲人与朋友；对了，我还有一颗感恩的心……”。谁能想到这段豁达而美妙的文字，竟出自一位在轮椅上生活了三十余年的高位截瘫的残疾人——世界科学巨匠霍金。\n在常人看来，命运真是亏待了霍金，可他仍感到自己很富有：一根能活动的手指，一个能思维的大脑……这些都让他感到满足，并对生活充满了感恩之心。因而，他的人生是充实而快乐的。\n对生活、对世界、对身边熟悉和陌生的人、对我们的朋友和对手，怎么能不真诚感谢呢？是它们使我们的人生变得如此精彩。我们更要真诚地感恩生活中的逆境，它让我们得到锤炼；它是一个课堂，让我们学会了刻苦、忍耐、淡泊和宽容；它是一笔财富，经历了它，会让我们精神富有，终生享用不尽。",qs:[{n:14,q:"根据这段话，世界科学巨匠霍金很珍惜什么？",o:["工作的权利","灵活的大脑","崇高的理想","方便的轮椅"],a:1,why:"“一个能思维的大脑……让他感到满足”."},{n:15,q:"关于常人眼中的霍金，下列哪项正确？",o:["非常容易满足","有雄厚的经济实力","命运对他极其苛刻","对物质生活要求不多"],a:2,why:"“在常人看来，命运真是亏待了霍金”. Có <span class='zh'>亏待</span>!"},{n:16,q:"关于生活中的逆境，下列哪项正确？",o:["它让我们的身体得到锻炼","它让我们得到更多的知识","它让我们赢得了大量钱财","它让我们学会了如何感恩"],a:3,why:"Đáp án sách: D (cảm ơn nghịch cảnh → biết ơn)."},{n:17,q:"根据这段话，可以知道什么？",o:["有对手的生活才有味道","转变逆境需要好的对策","学生的生活也会有坎坷","挫折可以帮助我们成长"],a:3,why:"“它让我们得到锤炼……让我们精神富有”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他拍拍胸脯，很把握地说：“剩下的事情我来去办。”","共同语是社会打破地域隔阂、走向统一时出现的语言形式。","记得，我们是学校的第一批毕业生，我们的毕业典礼隆重极了。","细加分析，大多数情况下，他打架还是出于义愤，而非无理取闹。"],a:0,why:"<b>Dùng từ sai</b>: <span class='zh'>把握</span> là danh từ → <span class='zh'>很有把握地说</span>; <span class='zh'>我来去办</span> thừa — <span class='zh'>我来办 / 我去办</span>."},{n:19,o:["他自以为动机正确，做事就可以理直气壮。","期末成绩好，因为不是运气好，而是平时努力学习的结果。","他幻想着自己躺在海滩上，沐浴在阳光里，耳边海浪拍岸之声不断。","民族素质指我国境内各民族全体成员个体和群体的素质，亦称国民素质。"],a:1,why:"<b>Quan hệ từ thừa</b>: bỏ <span class='zh'>因为</span> → <span class='zh'>期末成绩好，不是运气好，而是……</span>."},{n:20,o:["作业发下来了，他看到自己的作文里错字那么多，而且错得五花八门，到处都是。","夜深了，他还在左思右想，绞尽脑汁地合计新型的配药处方，剂量的多少，以及服用的方法等。","这些年，在礼尚往来中，有些礼品已变了味，不再是友情的象征，而成为贿赂的手段与工具。","词在运用的范围方面，有些多用于书面表达，有些多用于口头语言；有些多用于庄严的场合，有些只用于日常的场合。"],a:0,why:"<b>Lặp ý</b>: <span class='zh'>五花八门</span> và <span class='zh'>到处都是</span> chồng chéo; <span class='zh'>那么多……而且……</span> dư — đáp án sách: A."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"大院的邻里相处得___融洽是久有___的。但是这个大院的怪现象却令人费解——许多户居民做饭时把门窗关得很___，即使三伏天也不例外。难道是做好吃的怕人家讨要不成？",o:["和睦　耳闻　严","和平　传闻　紧","友善　所知　实","亲善　闻名　快"],a:0,why:"<span class='zh'>和睦融洽</span>; <span class='zh'>久有耳闻</span>; <span class='zh'>关得很严</span>. Có <span class='zh'>不成</span>!"},{n:22,text:"女儿为了从我这里获得___的自由，不知道和我打了多少次架，吵过多少次嘴。事实上，在___孩子的过程中，我是很___的，而女儿也是很___的，真可谓是棋逢对手。",o:["生长　管理　野蛮　坚定","成才　辅导　粗暴　死板","成长　教育　霸道　固执","发展　培育　无理　刚强"],a:2,why:"<span class='zh'>成长的自由</span>; <span class='zh'>教育孩子</span>; <span class='zh'>霸道</span> (từ mới!) — <span class='zh'>固执</span>."},{n:23,text:"有时候你只是在某些事情上不愿___对方，一个小小的谎言便脱口而出，即使不是恶意的，但这也可能造成大大的___。因此，下一次当你想要___时，还是再三思考一下，是否说出___更好？",o:["得罪　害处　扯谎　真相","奉告　损害　造谣　事实","报告　圈套　骗人　实话","告知　伤害　撒谎　实情"],a:3,why:"<span class='zh'>告知对方</span>; <span class='zh'>造成伤害</span>; <span class='zh'>撒谎</span> (từ mới!); <span class='zh'>说出实情</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"人之所以会心累，就是常常徘徊在坚持和放弃之间。坚持与放弃，是每个人面对人生问题的一种态度。如果我们懂得取舍，该坚持的坚持，该放弃的放弃，(24)。\n人之所以会痛苦，就是追求太多。人生在世，不可能事事顺心。不要总觉得自己不幸，其实世界上比我们痛苦的人多的是。明知道有些理想永远无法实现，有些问题永远没有答案，有些故事永远没有结局，(25)，无谓地等待和幻想。\n人之所以不快乐，就是计较太多。(26)，而是我们计较得太多。不要总是只看到别人的幸福，自己总是心存失落和压抑。其实你只看到了表面现象，或许他过得还不如你。(27)，人人都想得到自己想要的东西，人人都在为了自己的目标整天忙碌着，奋斗着。得到了，开心一时；得不到，痛苦一世。\n世界上没有完美无缺的东西，(28)，只有在不断争取、不断承受失败与挫折时，才能发现快乐。",opts:["就免去了举棋不定的烦恼","不是我们拥有得太少","人的欲望是无止境的","可还是要苦苦地追求","不完美其实才是一种美"],ans:{24:0,25:3,26:1,27:2,28:4}},read4:[{ins:"第29–32题：请选出正确答案。",text:"心理学家对孤独是有不同认识的，尽管更多的人认为，亲密的人际关系是人类幸福和快乐最主要的源泉，但是《孤独》一书却认为：亲密关系是人生有价值的重要部分，但并非幸福的唯一源泉，而且孤独对于某些人是必需的。《孤独》一书列举了很多艺术家、哲学家、科学家在孤独中做出创造性贡献的例子，即使普通人，很多特别具有创造性的工作一样需要不和他人发生关系而独立完成。\n《孤独》的作者说：人类一生被两种相反的驱动力操纵着，一种是对陪伴、爱以及其他所有能让我们亲近同类的关系的渴望，另一种则是对独立、孤单和自主的向往。大部分作家、音乐家、画家注定一辈子大多数时间都是孤独的。\n需要孤独的人在揭示一些东西的过程中必须专注，因此，你想培养孩子的想象力，就要让他们拥有一些享受孤独的时间和机会，并在其中自得其乐。大家都知道《彼得兔》的故事。《彼得兔》的作者波特小姐从来没有上过学，和父母关系也很淡薄，很少有机会和其他孩子一起玩耍，大部分时间和宠物在一起，她把想象力和强烈的情感都投射在动物身上，创作出了不朽的儿童作品。",qs:[{n:29,q:"《孤独》一书的观点是：",o:["是人就会渴望亲近同类","孤独对某些人是不可或缺的","有亲密的人际关系才可能幸福","心理学界争端的实质是何为幸福"],a:1,why:"“孤独对于某些人是必需的”."},{n:30,q:"《孤独》一书举了很多例子，其中人物的共同特点是：",o:["他们都成名成家了","他们不会与人合作","他们做的事有创造性","他们都非常喜欢孤独"],a:2,why:"“在孤独中做出创造性贡献的例子”. Có <span class='zh'>列举</span>!"},{n:31,q:"如果想培养孩子的想象力，就要：",o:["让他们树立远大志向","让他们天天自得其乐","从小训练他们全神贯注","让他们有些独处的时间"],a:3,why:"“让他们拥有一些享受孤独的时间和机会”."},{n:32,q:"关于《彼得兔》的作者，下列哪项正确？",o:["父母对她疏于管理","宠物的事搞得她很忙","她的作品发行量一般","对宠物在情感上很慷慨"],a:3,why:"“把想象力和强烈的情感都投射在动物身上”. Có <span class='zh'>慷慨</span>!"}]},{ins:"第33–36题：请选出正确答案。",text:"晏子出使楚国，楚国人想嘲笑他身材矮小，特意在城门旁开了一个小门，请晏子从小门进去。晏子说：“出使狗国的人才从狗洞进去。今天我出使的是楚国，应该不从此门进吧！”楚国人只好请晏子进了大门。\n晏子拜见楚王。楚王说：“齐国恐怕是没人了吧？怎么派你来呢。”晏子答复说：“齐国都城人口众多，人们一起张开袖子，天就暗下来；一起挥洒汗水，就会汇成大雨。怎么能说齐国没人呢？”楚王说：“那为什么派你这样一个人来做使臣呢？”晏子回答：“齐国派遣使臣，要看对象，贤能的人被派遣出使到贤能的国王那里去，无能的人被派遣出使到无能的国王那里去，我晏婴是齐国最没有才能的人了，荣幸地出使到楚国。”\n晏子来楚之前，楚王对身边的大臣说：“晏婴特别能说，我怎么羞辱他一下呢？”大臣提议：“他来的时候，我们绑一个人来。大王就问：‘他是什么人？’我们就说：‘齐国人。’大王再问：‘犯了什么罪？’我们就说：‘他是小偷。’”如此这般，君臣谋划完毕。\n晏子到了楚国，楚王请晏子喝酒。喝得正高兴的时候，两个官吏绑着一个人来到楚王面前。楚王问：“绑的是什么人？”小吏回答：“是齐国人，犯了偷窃罪。”\n楚王对晏子说：“齐国人都善于偷东西吗？”晏子从容答道：“我听说橘树生长在淮河以南就是橘树，生长在淮河以北就变为枳子，树叶形状相似，果实的味道却全变了，皆因水土不同。这个人在齐国不偷东西，到了楚国就偷起东西来，莫非是楚国的水土使然？”楚王听后苦笑着说：“真是不能和有实力的人开玩笑，我反而自取其辱了。”",qs:[{n:33,q:"面对楚国为自己开的小门，晏子：",o:["很气愤","很兴奋","很机智","很无奈"],a:2,why:"“出使狗国的人才从狗洞进去” — đối đáp thông minh."},{n:34,q:"按晏子的意思，他被派遣出使楚国是因为：",o:["齐国人个子都矮","齐国人多，不好选","楚国是个无赖国家","楚王是最无能的国君"],a:3,why:"“无能的人被派遣出使到无能的国王那里去” — ngầm chê vua Sở."},{n:35,q:"晏子来楚之前，楚王和大臣共同：",o:["设计圈套","审理案件","妄想害人","磋商国事"],a:0,why:"Bàn kế trói người giả làm trộm → <span class='zh'>圈套</span> (từ mới!)."},{n:36,q:"晏子讲橘树的故事，是要说明：",o:["楚国的声誉并不好","楚国的小偷比齐国多","楚国使好人变为了坏人","楚王的阴谋已经得逞了"],a:2,why:"“在齐国不偷东西，到了楚国就偷起东西来，莫非是楚国的水土使然？”"}]}]},W:{zh:"写作",vn:"Viết văn: 善于外交的……",t:"35 phút",min:!0,task:"本课讲述了中国古代外交史上一个经典的案例，蔺相如利用自己的智谋和勇气，出色完成了出使秦国的任务，既保全了赵国，又在道义上让秦国无话可说。在你们国家的历史上一定也有这样的外交故事，请以“善于外交的……”为题写一个你们国家出色外交家的故事，字数不少于400字。",target:400,steps:[["Chọn nhân vật","Một nhà ngoại giao nổi tiếng nước bạn — VD: Mạc Đĩnh Chi, Phùng Khắc Khoan, Giang Văn Minh…"],["Bối cảnh","Nước mạnh làm khó: <span class='zh'>仗着实力雄厚 · 一贯霸道 · 想羞辱……</span>"],["Thử thách","Câu hỏi khó / tình huống hiểm; <span class='zh'>左右为难 · 左思右想</span>."],["Đối đáp","<span class='zh'>从容 · 镇静 · 理直气壮地说</span>; dùng câu phản vấn <span class='zh'>……不成？</span>"],["Kết quả","Giữ thể diện quốc gia; đối phương <span class='zh'>无话可说 · 只得……</span>. Có thể trích dẫn (引用) một câu đối nổi tiếng."]],outline:[["一 · 人物","谁、什么朝代"],["二 · 出使","去哪国、什么任务"],["三 · 难题","对方怎样刁难"],["四 · 应对","怎样机智回答"],["五 · 结果","维护了国家尊严"]],model:"善于外交的江文明\n江文明是越南后黎朝时期的一位大臣，以善于外交而闻名。\n那时候，越南常常要派使臣出使中国。明朝的皇帝一贯看不起越南的使臣，常常故意为难他们。原来，几百年前，越南的一位将军曾打败过入侵的军队，并把对方的将军杀死了，因此明朝人一直记着这件事。\n有一次，江文明出使明朝。明朝皇帝想羞辱他，就出了一句上联：“铜柱至今苔已绿”，意思是说：汉朝时候在边境立的铜柱上已经长满了绿苔，暗示越南永远应该记住被打败的历史。大臣们都等着看越南使臣的笑话。\n江文明左思右想之后，从容地站出来，对出了下联：“藤江自古血犹红。”意思是说：越南的白藤江上，自古以来打败入侵者时流的血到现在还是红的。他的话既有礼貌，又理直气壮，在场的人都听懂了其中的意思——越南人不是好欺负的。\n明朝皇帝听后大怒：“你一个小国的使臣，还敢跟我作对不成？”江文明镇静地回答：“皇上出了上联，臣只是对了下联，并非冒犯皇上。”皇帝无话可说，只好放他走。但不久以后，他还是被害死了。\n江文明用自己的智慧和勇气，维护了国家的尊严。越南人至今还记得他，称他是“使不辱君命”的英雄。",check:["Có tiêu đề “善于外交的……”","Có bối cảnh lịch sử","Có tình huống bị làm khó","Có cách đối đáp thông minh","Có kết quả & ý nghĩa","Dùng ít nhất 4: 一贯 · 从容 · 镇静 · 理直气壮 · 不成 · 左思右想 · 冒犯 · 答复","Không ít hơn 400 chữ"]},SUM:{words:["答复","得罪","大臣","对策","提议","请教","实力","慷慨","亏待","动身","磋商","荣幸","转达","爱不释手","圈套","归还","从容","兑现","妄想","发誓","撒谎","隆重","仪式","庄严","无理取闹","冒犯","亦","边境","泄露","率领","镇静","雄厚","一贯","霸道","声誉","列举","履行","歪曲","理直气壮","压迫","口头","姿态","隔阂","争端"],patterns:[["左 V 右 V / 左一 + lượng 右一 + lượng","秦王对着和氏璧左看右看，爱不释手。"],["……不成？","璧都到了我这儿，我还怕他跑了不成？"],["以 A 换 B","秦以十五座城换一块玉，也算慷慨。"],["若……，……；若……，那么……","若不答应，过错在赵；若将和氏璧送去，秦不交出城来，那么错就在秦了。"],["修辞：引用","赵王左右为难……"]],diff:["一贯: tính từ, thiên về tư tưởng / tác phong, chỉ quá khứ → hiện tại (一贯的作风) — 一直: phó từ, cả hành động liên tục, dùng được cho tương lai (一直下了三天 · 一直坚持下去)","率领 shuài · 荤 hūn (đồ mặn) ↔ 素 · 亦 = 也 (văn viết) · 左右为难 (thành ngữ) ≠ 左……右…… (mẫu lặp)"],sentences:["此去秦国，秦若是交了城，我便把璧留下；不交城，我一定完璧归赵。","如今璧在我手里，想不交城拿走璧，那是妄想。","天下只可能强国欺负弱国，不可能弱国压迫强国。"],hw:["Học thuộc 50 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “善于外交的……” ≥400 chữ (mục 7).","Kể lại truyện 完璧归赵 trong 3 phút.","Làm Sách bài tập bài 27.","Đọc trước bài 28."]}});
