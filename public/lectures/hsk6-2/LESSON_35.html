<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 35 · 走近木版年画 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

Vấn đề này chiếm hết sức lực của anh ấy.",[],"SBT câu 33–36."],[48,"确立","quèlì","đgt.","xác lập","xác lập, thiết lập",1,"","稳固地建立或树立。","他已确立了自己的目标","确立人生目标。","Xác lập mục tiêu đời mình.",[],"Bài tập 3②. SBT câu 22D."],[49,"信念","xìnniàn","dt.","tín niệm","niềm tin, lòng tin",1,"","自己认为可以确信的看法。","他的信念就是拓展年画的内容","坚定的信念。","Niềm tin vững chắc.",[],"Bài tập 3②. SBT câu 22D."],[50,"任重道远","rènzhòng-dàoyuǎn","thành ngữ","nhậm trọng đạo viễn","gánh vác nhiệm vụ nặng nề trên con đường dài",1,"成","负担沉重，路程遥远，比喻责任重大。","虽然任重道远","保护环境任重道远。","Bảo vệ môi trường là việc lâu dài, gian nan.",[],"SBT câu 19B."],[51,"一帆风顺","yìfān-fēngshùn","thành ngữ","nhất phàm phong thuận","thuận buồm xuôi gió",1,"成","比喻非常顺利，没有任何阻碍。","也不会一帆风顺","祝你一路顺风，一帆风顺！","Chúc bạn thượng lộ bình an, thuận buồm xuôi gió!",[],"Bài tập 3②."]],extra:[["年画","niánhuà","tranh Tết"],["门神画","ménshén huà","tranh thần giữ cửa"],["唐宋 · 清朝","Táng Sòng · Qīngcháo","Đường – Tống · nhà Thanh"],["雕版印刷","diāobǎn yìnshuā","in khắc gỗ"],["彩色套印","cǎisè tàoyìn","in màu chồng bản"],["春联","chūnlián","câu đối Tết"],["庙会","miàohuì","hội chùa"],["布老虎","bù lǎohǔ","hổ vải"],["讨价还价","tǎojià-huánjià","mặc cả"],["文化底蕴","wénhuà dǐyùn","chiều sâu văn hóa"],["雅俗共赏","yǎsú-gòngshǎng","người thanh kẻ tục đều thưởng thức"]],T:[{zh:"年画是中国画的一种，始于古代的门神画。",vn:"Tranh Tết là một loại tranh Trung Quốc, bắt nguồn từ tranh môn thần thời cổ.",idea:"（一）年画的起源",q:["年画始于什么？"],note:[["始于","Bắt đầu từ."]]},{zh:"有文献记载：传说很久以前，有一对兄弟，专门监督百鬼，发现凶恶的鬼就捆绑起来，无须揭露恶行，直接去喂老虎。于是有人在门上画上他们兄弟二人的像，用以防鬼，这就是最早的门神画。",vn:"Có tư liệu ghi lại: tương truyền rất lâu trước kia có hai anh em chuyên giám sát trăm quỷ, gặp quỷ hung ác là trói lại, khỏi cần vạch tội, đem thẳng cho hổ ăn. Thế là có người vẽ hình hai anh em lên cửa để phòng quỷ — đó là tranh môn thần sớm nhất.",idea:"Tranh môn thần.",q:["最早的门神画是怎么来的？"],note:[["用以……","Dùng để…"]]},{zh:"随着唐宋两朝经济的发展，文化的昌盛以及民间绘画水平的提高，门神画的内容得以拓展，反映世俗生活题材的作品进入了这一领域。之后，有清朝学者在论述这类画作时正式使用了“年画”一词，自此，以驱逐祸凶、祝福新年吉祥喜庆为内容的画儿就叫年画了。",vn:"Cùng với sự phát triển kinh tế, văn hóa hưng thịnh và trình độ hội họa dân gian nâng cao dưới hai triều Đường – Tống, nội dung tranh môn thần được mở rộng, tác phẩm đề tài đời sống thế tục bước vào lĩnh vực này. Sau đó, học giả nhà Thanh khi bàn về loại tranh này đã chính thức dùng từ “年画”; từ đó, tranh có nội dung xua đuổi tai họa, chúc năm mới cát tường vui vẻ được gọi là tranh Tết.",idea:"Tên gọi “年画”.",q:["“年画”一词是什么时候开始使用的？"],note:[["随着……","Cùng với…"],["得以","Được (có thể)."],["以……为内容","Lấy… làm nội dung."]]},{zh:"造纸技术的发明是人类文化发展史上一个重要的里程碑。",vn:"Phát minh kỹ thuật làm giấy là một cột mốc quan trọng trong lịch sử phát triển văn hóa nhân loại.",idea:"（二）木版年画",q:[],note:[]},{zh:"有了纸，书写就需要墨水儿，于是有人发明了墨；字画、书信上需要盖章，于是印章开始流行；碑刻、拓印技术被广泛运用，于是有人联想到：这些技术结合起来，不就能印出书来吗！人们尝试把印章扩大成一张纸那么大，叫作“版”，然后把书的内容刻在版上，在版上涂抹上墨，把纸铺到上面，用刷子均匀地刷印，最后将纸揭起，印品就出来了，这就是最早的雕版印刷。虽然雕版印刷中雕刻版面需要大量的人工和材料，但雕版完成后一经开印，就显示出空前的高效率和印刷量大的优越性。",vn:"Có giấy thì viết cần mực, thế là có người phát minh ra mực; tranh chữ, thư từ cần đóng dấu, thế là con dấu bắt đầu thịnh hành; kỹ thuật khắc bia, in rập được dùng rộng rãi, thế là có người liên tưởng: kết hợp những kỹ thuật này chẳng phải in được sách sao! Người ta thử phóng con dấu to bằng một tờ giấy, gọi là “bản”, rồi khắc nội dung sách lên bản, quét mực lên, trải giấy lên trên, dùng chổi quét in đều, cuối cùng bóc giấy ra là có bản in — đó là in khắc gỗ sớm nhất. Tuy khắc bản cần nhiều nhân công và vật liệu, nhưng khắc xong một khi bắt đầu in thì thể hiện ưu thế hiệu suất cao chưa từng có và số lượng in lớn.",idea:"In khắc gỗ ra đời.",q:["雕版印刷是怎么发明的？"],note:[["……，于是……；……，于是……；……，于是……","Xem 篇章: lặp từ khóa “于是”."],["不就能……吗！","Câu phản vấn = chẳng phải… sao!"],["一经……，就……","Một khi… là…"]]},{zh:"单色印品终究不能满足人们的审美需求，之后就有了彩色套印技术。人们把这种技术运用到年画制作上，木版彩色套印年画就此诞生。",vn:"Bản in một màu suy cho cùng không thỏa mãn được nhu cầu thẩm mỹ, sau đó có kỹ thuật in màu chồng bản. Người ta áp dụng kỹ thuật này vào làm tranh Tết, tranh Tết mộc bản in màu từ đó ra đời.",idea:"In màu chồng bản.",q:[],note:[["终究","Xem Ngữ pháp 1."],["就此","Từ đó."]]},{zh:"宋明两代，木版年画从问世走向成熟，之后走进了百姓生活，以至过年贴年画成为了一种风尚，仿佛没有年画，没有烟花爆竹，没有春联就不叫过年，而寄托着百姓美好愿望的年画，也为春节增添了浓浓的年味。当时的另一盛况是，家族式的年画印制场所遍及全国各地。这期间，年画的内容也从威武的门神，扩展到期盼丰收、恭喜发财、连年有余的吉庆画，再到历史故事、戏曲人物、民间笑话、寓言和神话，内容无所不包。年画成了文化交流、道德教育、信仰传承的载体与工具，是老百姓喜闻乐见的文化艺术形式。",vn:"Hai đời Tống – Minh, tranh Tết mộc bản từ khi ra đời đi tới trưởng thành, rồi bước vào đời sống bách tính, đến mức Tết dán tranh trở thành phong tục — dường như không có tranh Tết, không có pháo, không có câu đối thì không gọi là ăn Tết; tranh Tết gửi gắm ước nguyện tốt đẹp của dân cũng làm Tết thêm đậm không khí. Một cảnh thịnh khác thời ấy là xưởng in tranh kiểu gia tộc có khắp cả nước. Thời kỳ này, nội dung tranh Tết cũng mở rộng từ môn thần oai vũ sang tranh chúc mừng được mùa, cung hỷ phát tài, niên niên hữu dư, rồi đến chuyện lịch sử, nhân vật hí khúc, truyện cười dân gian, ngụ ngôn và thần thoại — không gì không có. Tranh Tết thành phương tiện và công cụ giao lưu văn hóa, giáo dục đạo đức, truyền thừa tín ngưỡng, là hình thức nghệ thuật văn hóa bách tính ưa chuộng.",idea:"Tranh Tết vào đời sống.",q:["年画走进百姓生活后有什么变化？"],note:[["以至……","Đến mức…"],["没有……，没有……，没有……就不叫过年","Lặp “没有” (排比)."],["从……，扩展到……，再到……","Từ… mở rộng đến… rồi đến…"],["连年有余","Xem 辨析 连年—连续."]]},{zh:"第一次见到张光宁的木版年画，是在春节庙会上。在众多摊位中，他的两只木版彩色套印技术做成的布老虎神气极了。那虎翘着尾巴，神态逼真，身上装饰着彩绘花纹和盛开的花朵，全身散发着喜气。我问多少钱，他耸耸肩，对我说：“这是魏州虎。”言外之意是在告诉我这个外行，这虎可是系出名门。我心想：“魏州是哪儿？我不知道别人也未必知道，这算什么推销术？”这是他给我留下的第一印象。",vn:"Lần đầu tôi thấy tranh Tết mộc bản của Trương Quang Ninh là ở hội chùa ngày Tết. Giữa bao gian hàng, hai con hổ vải làm bằng kỹ thuật in màu mộc bản của ông oai vệ vô cùng: hổ vểnh đuôi, thần thái sống động, trên mình trang trí hoa văn vẽ màu và hoa nở rộ, toàn thân tỏa ra vẻ vui tươi. Tôi hỏi bao nhiêu tiền, ông nhún vai bảo: “Đây là hổ Ngụy Châu.” Ý ngoài lời là muốn nói với kẻ ngoài nghề như tôi rằng con hổ này xuất thân danh gia. Tôi nghĩ: “Ngụy Châu là đâu? Mình không biết thì người khác chưa chắc biết, thế này là chào hàng kiểu gì?” Đó là ấn tượng đầu tiên ông để lại cho tôi.",idea:"（三）年画传人张光宁 — Ấn tượng đầu.",q:["“我”第一次见到张光宁时有什么印象？"],note:[["言外之意","Ý ngoài lời."],["系出名门","Xuất thân danh gia."]]},{zh:"“这个卖年画的不像个商人”，这是他给我留下的第二印象。当你和他讨价还价的时候，他立刻就变得不好意思起来，说话吞吞吐吐。什么“这是纯手工的”“残次品不可避免”这些现成的“谢绝”还价的理由他一条也说不出来，相反却唠唠叨叨地总想和你讨论木版年画中深厚的文化底蕴。",vn:"“Người bán tranh Tết này chẳng giống người buôn bán” — đó là ấn tượng thứ hai. Khi bạn mặc cả, ông lập tức ngượng ngùng, nói năng ấp úng. Những lý do có sẵn để “khéo từ chối” trả giá như “đây là làm tay hoàn toàn”, “hàng lỗi là không tránh được” ông chẳng nói được câu nào, ngược lại cứ lải nhải muốn bàn với bạn về chiều sâu văn hóa của tranh Tết mộc bản.",idea:"Ấn tượng thứ hai.",q:["为什么说他不像个商人？"],note:[["什么……这些……","<span class='zh'>什么</span> liệt kê, hàm ý coi nhẹ."],["相反","Ngược lại."]]},{zh:"相识久了才知道，他在年画的故乡出生、长大，从小就画年画，基本功扎实，后来又对年画的构图创作、人物塑造、雕版手法、颜料加工等进行了广泛的研究。当他的作品逐步被市场认可后，他又不满足了，中国年画虽不分派别，但不同地区的年画各有所长，都值得学习借鉴。于是，他再接再厉，数年间走遍了全国各大年画产地，与同行进行广泛的交流。不仅如此，参加民俗文化巡展，走进大学和师生就相关主题进行研讨，交流艺术心得，他从不缺席。",vn:"Quen lâu mới biết, ông sinh ra và lớn lên ở quê hương tranh Tết, từ nhỏ đã vẽ tranh Tết, nền tảng vững chắc; sau lại nghiên cứu rộng về bố cục sáng tác, xây dựng nhân vật, thủ pháp khắc bản, gia công màu… Khi tác phẩm dần được thị trường công nhận, ông lại không thỏa mãn: tranh Tết Trung Quốc tuy không chia trường phái, nhưng tranh các vùng mỗi nơi có sở trường riêng, đều đáng học hỏi tham khảo. Thế là ông tiếp tục nỗ lực, mấy năm đi khắp các vùng sản xuất tranh Tết lớn, giao lưu rộng rãi với đồng nghiệp. Không chỉ vậy, tham gia triển lãm lưu động văn hóa dân gian, vào đại học thảo luận chuyên đề với thầy trò, giao lưu tâm đắc nghệ thuật — ông chưa bao giờ vắng mặt.",idea:"Học hỏi không ngừng.",q:["相识久了，“我”对他有了哪些了解？"],note:[["虽……，但……","Tuy… nhưng…"],["不仅如此","Không chỉ thế."],["就……进行研讨","Thảo luận về…"]]},{zh:"张光宁一年到头真够忙的，可他总是干劲十足。他曾真诚地说：“年画占据了我生命的全部，我喜欢它，热爱它，靠它生活，也在努力探索它、发展它。”是啊，愈是经营年画久了，他对年画就愈是热爱。他已确立了自己的目标——传播他喜爱的这一民俗文化。他的信念就是拓展年画的内容，使其雅俗共赏，为更多民众所喜爱，虽然任重道远，也不会一帆风顺，但他一定会坚持下去。",vn:"Trương Quang Ninh quanh năm bận rộn, nhưng lúc nào cũng hăng hái. Ông từng chân thành nói: “Tranh Tết chiếm trọn cuộc đời tôi, tôi thích nó, yêu nó, sống nhờ nó, và cũng đang cố gắng tìm tòi, phát triển nó.” Phải rồi, càng làm tranh Tết lâu, ông càng yêu nó. Ông đã xác lập mục tiêu — truyền bá nét văn hóa dân gian mình yêu thích. Niềm tin của ông là mở rộng nội dung tranh Tết, để người thanh kẻ tục đều thưởng thức, được nhiều người yêu thích hơn; dù đường dài gánh nặng, cũng không thuận buồm xuôi gió, nhưng ông nhất định kiên trì.",idea:"Mục tiêu và niềm tin.",q:["张光宁的目标和信念是什么？"],note:[["我喜欢它，热爱它，靠它生活……探索它、发展它","Lặp từ khóa “它”."],["愈……愈……","Xem Ngữ pháp 2."],["为……所……","Bị động văn viết: được… (yêu thích)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章 & từ vựng",G:[{id:"g1",grp:0,word:"终究",zh:"终究",py:"zhōngjiū",tag:"Chú thích 1 · phó từ",mean:"Phó từ.<br>① Nhấn mạnh <b>bản chất sự vật không thay đổi, sự thật không thể phủ nhận</b> — “suy cho cùng, dù sao”. Tăng ngữ khí, hay dùng trong câu trần thuật mang tính đánh giá.<br>② Thường đứng trước <b>động từ năng nguyện</b>, biểu thị kết quả dự đoán / mong đợi <b>nhất định sẽ xảy ra</b> — “rốt cuộc, cuối cùng rồi cũng”.",forms:["S + 终究 + 是 / 不能……","终究 + 会 / 要 + V"],ex:[["单色印品终究不能满足人们的审美需求，之后就有了彩色套印技术。","",1],["猫终究是动物，动物急了咬人也是正常的。","Mèo suy cho cùng là động vật, nổi khùng cắn người cũng bình thường."],["胜利总是在真理一边，正义的事业终究会取得胜利。","Thắng lợi luôn đứng về phía chân lý, sự nghiệp chính nghĩa rồi sẽ thắng lợi."],["有再好的管理和技术，产品终究要靠这些普通工人去生产。","Quản lý, kỹ thuật tốt đến đâu, sản phẩm rốt cuộc vẫn phải nhờ công nhân bình thường làm ra."]],tips:["Gần nghĩa <span class='zh'>毕竟 · 到底</span>.","Bài tập 2③. SBT câu 23A."],practice:{q:"用“终究”改写句子",type:"complete",items:[["如果一个人一直不愿意变老，那他就永远不会幸福，因为他最后是一定会变老的。","……因为他终究会变老的。"],["借住在朋友这儿当然不是长久之计，还是应该尽快租个房子。","借住在朋友这儿终究不是长久之计，……"],["失败毕竟不是好事，但只要从失败中吸取经验教训，坏事也可以变成好事。","失败终究不是好事，……"]]}},{id:"g2",grp:2,word:"",zh:"愈……愈……",py:"yù……yù……",tag:"Chú thích 2",mean:"Giống <span class='zh'>越……越……</span> — “càng… càng…”. Dùng trong <b>văn viết</b>.",forms:["愈 + A，愈 + B","S 愈是……，S 就愈是……"],ex:[["愈是经营年画久了，他对年画就愈是热爱。","",1],["机遇的特点之一是转瞬即逝，市场竞争愈激烈愈是如此。","Một đặc điểm của cơ hội là thoáng qua; cạnh tranh càng gay gắt càng như vậy."],["一个民族，教育愈普及，教育的质量愈高，文化发展的速度就愈快，文化水准也就愈高。","Một dân tộc, giáo dục càng phổ cập, chất lượng càng cao thì văn hóa càng phát triển nhanh, trình độ càng cao."]],tips:["Bài tập 2⑥."],practice:{q:"请把下列6个小句组合成3个连贯的语段：A. 一个家庭，愈重视教育，教育的投入愈多　B. 市场经济是法制经济，愈是发达的市场经济　C. 经营活动愈是会受到完备的法规约束，从而，在法制的框架内展开充分的公平竞争　D. 他生就一副挑战式性格，愈是面对成功　E. 家庭成员的文化水平就愈高，综合素质也就愈高　F. 愈要为自己设定更高的目标",type:"complete",items:[["语段（1）：? + ?","A + E"],["语段（2）：? + ?","B + C"],["语段（3）：? + ?","D + F"]]}},{id:"g3",grp:2,word:"再接再厉",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>喜闻乐见</span> = được ưa chuộng. <span class='zh'>吞吞吐吐</span> = ấp úng. <span class='zh'>再接再厉</span> = tiếp tục cố gắng. <span class='zh'>任重道远</span> = gánh nặng đường xa. <span class='zh'>一帆风顺</span> = thuận buồm xuôi gió. <span class='zh'>雅俗共赏</span> = thanh tục đều thưởng thức.",forms:["……喜闻乐见的……","说话吞吞吐吐","虽然任重道远，也不会一帆风顺"],ex:[["年画……是老百姓喜闻乐见的文化艺术形式。","",1],["于是，他再接再厉，数年间走遍了全国各大年画产地。","",1],["虽然任重道远，也不会一帆风顺，但他一定会坚持下去。","",1]],tips:["Bài tập 3②."]},{id:"g4",grp:1,word:"连年",zh:"连年 / 连续",py:"liánnián / liánxù",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>liên tiếp không ngừng</b>”. <span class='zh'>连年</span>: chỉ <b>nhiều năm liền</b>, sau không mang số lượng. <span class='zh'>连续</span>: cái này nối cái kia, dùng cho <b>mọi khoảng thời gian</b>, sau mang được số lượng.",forms:["连年 + 丰收 / 亏损 / 战乱","连续 + 数量 + V / 连续 + V + 数量"],ex:[["期盼丰收、恭喜发财、连年有余的吉庆画","",1]],tips:["<span class='zh'>×连年三年 · 连续三年</span>."]}],BX:{grp:1,word:"连年",cols:["连年","连续"],pair:"连年 — 连续",same:["Đều có nghĩa “<b>nối tiếp không ngừng</b>”.","他们连年 / 连续创造了高产纪录。"],diff:[["Liên tiếp <b>nhiều năm</b>, chỉ dùng cho thời gian tính bằng “năm”.","连年大丰收","Cái này nối tiếp cái kia, dùng cho <b>bất kỳ khoảng thời gian nào</b>.<div class='zh' style='margin-top:4px'>连续下了三天雨。他们连续工作了15个小时。</div>"],["Sau <b>không</b> mang từ chỉ số lượng.","—","Sau <b>mang được</b> từ chỉ số lượng.<div class='zh' style='margin-top:4px'>他已经连续三天没吃东西了。</div>"]],task:{q:"选择“连年”或“连续”填空",cols:["连年","连续"],sample:!1,items:[["用同样的方法____念下去，直到不看卡片，念十遍不出错为止。",1,"Không phải theo “năm” → 连续."],["人民生活在社会动荡和____战乱中，苦不堪言。",0,"Chiến loạn nhiều năm liền → 连年."],["屏幕上会____出现几个数字，你要迅速记住它们。",1,"Liên tiếp trong khoảnh khắc → 连续."],["最近几年来，由于管理混乱、经营不善，导致____亏损。",0,"Thua lỗ nhiều năm → 连年."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>文</u>献","文章 · 文学 · 文人 · 作文"],items:[["<u>增</u>添","增","增加 · 增多 · 增减 · 增益"],["发<u>财</u>","财","财富 · 财产 · 财务 · 财经"],["外<u>行</u>","行","行业 · 行情 · 行规 · 行道"],["故<u>乡</u>","乡","家乡 · 乡愁 · 乡里 · 乡土"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["孩子们很想了解生命是怎么开始的。","起源","孩子们很想了解生命的起源。"],["看到此情此景，我的脑海里浮现出许多往事。","联想","看到此情此景，我的脑海里联想起许多往事。"],["一个人的力量毕竟是有限的，还是团结力量大。","终究","一个人的力量终究是有限的，还是团结力量大。"],["随着孩子的陆续出生，家里增加了不少人口。","增添","随着孩子的陆续出生，家里增添了不少口人。"],["由于此地涉及国家机密，所以是不允许参观的。","谢绝","由于此地涉及国家机密，所以谢绝参观。"],["老师曾教导我们：“情况越紧急，越需要沉着冷静。”","愈……愈……","老师曾教导我们：“情况愈紧急，愈需要沉着冷静。”"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["神态","手法","涂抹","心得","盛开"],text:"儿子从小就爱画画儿，从开始的随便{涂抹}，到现在能画出{神态}逼真的动物，{盛开}的花朵……绘画{手法}越来越娴熟。一路走来，经历了许多艰辛，也收获了许多幸福，他愿意与大家一起分享画画儿的{心得}。"},{bank:["确立","一帆风顺","借鉴","信念","扎实"],text:"想要成就一番事业，无论选择哪条路，都不会{一帆风顺}的。首先要{确立}自己的目标，给自己打下{扎实}的基础，多{借鉴}别人成功的经验，抱着必胜的{信念}坚持下去，最后的胜利一定属于你。"}]},EX4:{q:"请找出下列语段中重复的关键词",items:[{src:"",task:"这泪水，是激动的泪水，兴奋的泪水，喜悦的泪水，收获的泪水。",model:"泪水"},{src:"",task:"他是代表全民族的大多数，最正确、最勇敢、最坚决、最忠实、最热忱的空前的民族英雄。",model:"民族"},{src:"",task:"一根火柴，它自己熄灭了，却把别人点燃起来，点起了比自己大十倍、百倍、千倍以至数万倍的熊熊大火。",model:"点（燃）"},{src:"",task:"他用心观察着，眼前飞过的一只雁，一只麻雀，一只蝴蝶，一只蜻蜓，他都不放过。",model:"一只"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["年画的起源","门神画；兄弟二人；唐宋，门神画内容拓展；清朝，使用“年画”一词","年画始于古代的门神画。传说有兄弟二人专门捉鬼，人们把他们的像画在门上防鬼。唐宋时门神画内容得以拓展，清朝学者正式使用了“年画”一词。"],["木版年画：雕版的发明","墨→印章→碑刻、拓印→扩大印章→在版上刷印","有了纸就有了墨、印章，碑刻和拓印也被广泛运用；人们把印章扩大成版，在版上刻字、涂墨、刷印，就有了雕版印刷。"],["彩色套印","","单色印品终究不能满足人们的审美需求，于是有了彩色套印技术，木版彩色套印年画就此诞生。"],["年画走进百姓生活","过年贴年画，年画印制场所，年画内容，年画成了……的载体与工具","宋明时期，过年贴年画成了风尚，年画印制场所遍及全国，内容无所不包，年画成了文化交流、道德教育、信仰传承的载体与工具。"],["年画传人张光宁","春节庙会，布老虎，推销；不像商人，讨论……；出生，长大，从小……，后来……，再接再厉……；传播……，拓展……","“我”在春节庙会上第一次见到张光宁，他的布老虎神气极了；他不像商人，总想讨论年画的文化底蕴。他从小画年画，基本功扎实，还走遍全国学习交流。他的目标是传播年画文化，拓展年画的内容。"]]},PZ:{title:"篇章（6）重复关键词，推进主题",vn:"Lặp từ khóa để đẩy chủ đề",intro:"Lặp từ khóa có vai trò rất quan trọng trong văn bản: về giao tiếp, giúp <b>làm nổi bật thông tin</b>; về kết cấu, lặp lại từ quan trọng nhất giúp <b>chủ đề không ngừng tiến lên</b> — là một trong những cách làm văn bản liền mạch, câu chữ trôi chảy.",ex:[["有了纸，书写就需要墨水儿，于是有人发明了墨；字画、书信上需要盖章，于是印章开始流行；碑刻、拓印技术被广泛运用，于是有人联想到……","Lặp “于是” — nối tiếp chuỗi phát minh."],["我开始每天至少写两千字。没有为“一定要换成稿费”而写，没有读者也写……把写作当成生活的一部分。……那就写一些无聊的消息稿……只求有字可写。","Lặp “写”."],["佩珊！佩珊！我心里难过极了！想到一个人会死，而且会突然地就死，我真是难过极了！我不肯死！我一定不能死！可是我们总有一天要死。","Lặp “死 · 难过极了”."]],q:"根据文意，填上合适的词语",pvn:"小张的花店跟别人不一样的地方是免费送花，只要是有这种需求的，路近的送，路远的____；大花篮、大花束送，一支两支____；晴天送，雨天____；即使人手不够，小李亲自骑自行车____。",practice:[["Điền từ","Tất cả đều điền “送” — lặp từ khóa nhấn mạnh “miễn phí giao hoa”."]]},DP:[{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ để đoán nghĩa cả từ.",items:[["回收","huíshōu","thu hồi, tái chế","回：还，返 · 收：收回（利用）","废品回收。"],["开采","kāicǎi","khai thác","开：开发 · 采：挖掘（矿物）","开采石油。"],["开除","kāichú","đuổi, khai trừ","开：使分离 · 除：去掉","他被公司开除了。"],["划分","huàfēn","phân chia","划：把整体分成几部分 · 分：分开","划分区域。"],["请示","qǐngshì","xin chỉ thị","请：请求 · 示：指示","这件事要向领导请示。"],["施加","shījiā","gây (áp lực…)","施：给予（压力、影响等） · 加：增添","对他施加压力。"],["玩弄","wánnòng","đùa giỡn, giở trò","玩：耍弄，使用（不正当的手段方法） · 弄：戏要","玩弄手段。"],["应酬","yìngchou","tiếp đãi, xã giao","应：应付 · 酬：交际往来","他每天应酬很多。"],["瞻仰","zhānyǎng","chiêm ngưỡng","瞻：往前或往上看 · 仰：尊敬仰慕","瞻仰烈士纪念碑。"],["铸造","zhùzào","đúc","铸：把金属熔化后倒在模子里制成器物 · 造：制作","铸造铜像。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"从外表看，螳螂并不可怕。身躯修长，前胸纤长；长颈上，顶着一个扁三角形的小脑袋；它的颈部是柔软的，能使头向任何方向窥视。它的神态温柔，被人称作“会祈祷的螳螂”。",o:["螳螂的身体细长","螳螂的头脑灵活","螳螂喜欢东张西望","螳螂骨子里很温柔"],a:0,why:"“身躯修长，前胸纤长”. Có <span class='zh'>神态</span>."},{n:2,say:"先生文章的妙处实在难以尽述，就如那文章里涉及的当时的许多人和事，如今读来，又都成了饶有趣味的历史小掌故。先生的文章，针砭时弊，泼辣犀利，绝无时文的吞吞吐吐，读来令人神旺气盛。",o:["先生最为擅长编写历史故事","先生的文章有许多绝妙之处","先生文章中的人物都很神奇","先生读起文章来总是神情感人"],a:1,why:"“先生文章的妙处实在难以尽述”. Có <span class='zh'>吞吞吐吐</span>."},{n:3,say:"东汉末年，中华大地气候又表现出向寒冷转变的迹象，东海、东莱等郡出现水井冰冻厚尺余的现象，渤海湾也有冰封记载。公元七、八世纪，黄河流域气候一度转暖，长安地区的梅花花期又有变长的迹象。",o:["长安在黄河流域","再冷井水也不会结冰","黄河流域气候一直较温暖","公元七、八世纪天气冷到极点"],a:0,why:"“黄河流域气候一度转暖，长安地区……” → Trường An thuộc lưu vực Hoàng Hà."},{n:4,say:"记得看过的一部电影，女主角将柠檬从中间切开，然后拿起半只直接涂抹颈部，这种利用水果的美容法应该算是精油疗法的雏形了。在提炼精油的高科技还未出现时，女人已经知道如何呵护自己的皮肤了，这让我当时为之一震。",o:["女人个个都懂得爱护皮肤","女人从电影中学习美容方法","精油都是从水果中提炼出来的","精油出现前人们会用水果美容"],a:3,why:"“在提炼精油的高科技还未出现时，女人已经知道……”. Có <span class='zh'>涂抹</span>."},{n:5,say:"语言中词汇的变化很灵敏，但其基础非常稳固。这表现在两方面：第一，词汇中的基本词汇部分反映交际中最常用的基本概念，它是很不容易变化的。第二，构造新词的材料几乎都是语言中古已有之的，构成新词的格式也是语言中现成的。",o:["语言中，基本词汇部分十分稳定","语言中的词汇只能反映基本概念","语言中构造新词的材料十分有限","语言中不断出现构成新词的格式"],a:0,why:"“基本词汇……是很不容易变化的”. Có <span class='zh'>现成</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：请问，为什么要编写《口述“非遗”》这么一本书呢？\n男：大家都知道，每一个苏州人都为自己的城市骄傲。我们骄傲的基础有三点：第一是水，苏州因水而昌盛，水是苏州人的骄傲；第二是人，苏州出人才，古的不说了，当今院士就有130多位；第三就是艺，历史上，苏州有各种各样的工艺。去年联合国给予我们“手工艺与民间艺术之都”的称号，这是实至名归。而工艺，大部分属于非物质文化遗产，但是一些“非遗”项目的现状不容乐观，所以我们组织专家、学者，对非物质文化遗产的传承人、见证人进行采访，目的是留下历史的记录，同时希望有更多的人了解、关注、保护“非遗”。\n女：为什么要采用口述的方式呢？\n男：因为非物质文化遗产的传承人年龄都很大了，80岁以上的有15位，年龄最大的101岁。有两位老人在接受采访不久、成书之前就去世了。应该说，这份历史文献是对“非遗”抢救式的保护，我们心里充满了紧迫感。\n女：苏州“非遗”项目保护的具体办法是什么？\n男：我们采取了区别性的保护办法。对于生存状态好的，进行生产性保护，比如核雕、刺绣；不好的，那些渐行渐远的、濒危的项目，需要去关怀；还有的年代太过久远，由于历史原因已经抢救不活的，进行记忆性保护。\n女：为什么会造成“非遗”今天的困境，大家有过思考吗？\n男：所谓“遗”，就是前人留下来的，不是我们这个时代的东西。所谓“非遗”，是文化的东西，是古人曾经的生活方式。“非遗”建立的基础是农耕文化，可我们今天生活已经发生了巨大的变化。从中国发展的历程来看，我们几乎没有经历一个现代的工业时代，直接进入了信息时代。在社会跳跃式发展的过程中，必然会抛弃一些东西。抛弃什么呢？很显然，就是那些曾经的生活方式，这就形成了中国“非遗”今天所面对的困境。",qs:[{n:6,q:"苏州人最可能会为什么而骄傲？",o:["为苏州的水而骄傲","为苏州艺人多而骄傲","为苏州是人间天堂而骄傲","为苏州曾做过都城而骄傲"],a:0,why:"“水是苏州人的骄傲”. B sai: “出人才” (nhân tài), không phải nghệ nhân."},{n:7,q:"关于非物质文化遗产，下列哪项正确？",o:["非物质文化遗产的文字记录丰富","非物质文化遗产的研究已很深入","越来越多的人在关注非物质文化遗产","中国非物质文化遗产保护的现状堪忧"],a:3,why:"“一些‘非遗’项目的现状不容乐观”."},{n:8,q:"对苏州“非遗”的保护措施是什么？",o:["优先记忆性保护","首先保护年代久远的","尽力救活每一个项目","根据具体情况区别对待"],a:3,why:"“我们采取了区别性的保护办法”."},{n:9,q:"“非遗”今天困境产生的原因是什么？",o:["它看不见摸不着","当下农民都在城里","我们的生活方式改变了","信息时代的吸引力太大"],a:2,why:"“我们今天生活已经发生了巨大的变化……抛弃……那些曾经的生活方式”."},{n:10,q:"这段话主要谈的是什么？",o:["苏州的历史很悠久","苏州自古至今人才济济","“口述”的方式在今天很时髦","苏州非物质文化遗产保护迫在眉睫"],a:3,why:"“抢救式的保护，我们心里充满了紧迫感”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"变脸，这是川剧表演艺术的特殊技巧之一，看过的观众，无不惊叹其神。它是揭示剧中人物内心思想感情的一种浪漫主义手法，把不可见、不可感的抽象的东西变得可见、可感。\n剧作家柳倩认为，“变脸”是感情的象征，许多脸谱已经有它显著的典型特质，说明人物的忠奸邪正，而且有助于强调人物个性，表现感情变化的发展过程，这是四川戏的优点。加之演员能于观众不注意间改变他的脸像，也是一种惊人的技术。\n如今，“变脸”的特技已被其他剧种所采用，而且，已经传到了国外。值得注意的是，为卖弄技艺、讨好观众而滥用变脸的现象也时有发生。",qs:[{n:11,q:"川剧中“变脸”的目的是什么？",o:["让外行大吃一惊","将魔术与戏曲相结合","更生动地塑造人物形象","给演员一个炫耀的机会"],a:2,why:"“揭示剧中人物内心思想感情的一种……手法”. Có <span class='zh'>塑造 · 外行 · 揭示</span>."},{n:12,q:"剧作家柳倩怎样评价“变脸”？",o:["看起来眼花缭乱","演员艺高人胆大","借鉴了京剧脸谱之长","有助于人物个性的表现"],a:3,why:"“有助于强调人物个性”. Có <span class='zh'>借鉴</span> làm bẫy."},{n:13,q:"关于“变脸”的表演现状，下列哪项正确？",o:["有使用太泛的倾向","只有川剧掌握了变脸技艺","变脸技艺在海外并不受欢迎","有在世界范围内普及的态势"],a:0,why:"“滥用变脸的现象也时有发生”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"对于苹果的商标最初是怎样来的，有很多谣言。其中最盛行的说法是，那被咬掉一口的彩色苹果，是已故伟人阿兰·图灵的杰作。图灵因同性恋遭到排斥后自杀了，可能是食用了带有氰化物的苹果。相信这一说法的人认为苹果公司选择苹果商标是为了纪念“计算机科学之父”。\n其实，这仅仅是一个听起来意义深远的故事，事实上，全是瞎扯。对公司而言，取名叫“苹果”，仅仅是因为斯蒂夫·乔布斯认为这个词听起来不错。乔布斯想出这个名字时，没有任何象征或者暗示牛顿或图灵的意思，如果要问为什么在浩如烟海的词汇中，他偏偏选中了“苹果”，那是因为当时他正处于水果减肥计划当中，觉得这个词听起来“有趣”。而就商标本身而言，商标的设计者罗伯·吉道夫已经多次澄清不是许多人以为的那样，不是为了向图灵或者牛顿或者“水果学问”致敬而设计的。它只是一个苹果。至于为什么被咬了一口，只是为了不让人们把它当成樱桃而已。",qs:[{n:14,q:"关于苹果商标最盛行的说法，下列哪项正确？",o:["苹果象征恋爱","苹果象征有毒的东西","表示对图灵遭遇的同情","为了纪念“计算机科学之父”"],a:3,why:"“为了纪念‘计算机科学之父’”."},{n:15,q:"事实上，商标确定的理由是什么？",o:["乔布斯喜欢","吃苹果可减肥","觉得画面有意思","暗示牛顿的发现"],a:0,why:"“仅仅是因为……乔布斯认为这个词听起来不错”."},{n:16,q:"关于商标本身，设计者的说法是什么？",o:["它仅仅是一个苹果","它还像一颗大樱桃","它包含很深的学问","各种说法都有道理"],a:0,why:"“它只是一个苹果”."},{n:17,q:"根据这段话，可以知道什么？",o:["图灵彩色苹果画得不错","世人对科学家都心存敬意","人们看见苹果就会想到减肥","苹果商标最盛行的说法无事实根据"],a:3,why:"“事实上，全是瞎扯”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他们是故意捣乱，因为对教师的讲课不感兴趣。","《引力理论与引力坍缩》被认为是宇宙论研究中里程碑式的著作。","只要你来，只要你不耍脾气，只要你什么都听我的，其他的咱们都好商量。","会计以红字表示负数，因此，除上述情况外，不得用红色墨水儿登记账簿。"],a:0,why:"<b>Mâu thuẫn logic</b>: “故意捣乱” mà nguyên nhân lại là “不感兴趣” → <span class='zh'>他们不是故意捣乱，而是对……不感兴趣</span> (bài 33 nghe câu 1)."},{n:19,o:["让咱们团结起来，再接再厉，去争取更大的胜利吧！","回顾过去，我们豪情满怀；展望未来，我们任重道远。","人们对居住的追求，不仅是室内的舒适度，而是更关注室外的环境。","有人向他进言——为保持酒店的档次，应该谢绝那些衣着随便的人入内。"],a:2,why:"<b>Liên từ không khớp</b>: <span class='zh'>不仅……，而是……</span> sai → <span class='zh'>不仅……，而且……</span> / <span class='zh'>不是……，而是……</span>."},{n:20,o:["70岁后，他便在自家的屋前摆了个小摊，卖些酒饼和日常生活用品等，生活清心寡欲、无忧无虑。","反观专制官僚统治形态，那些专制君主与官僚们的社会性格或其阶级关系，仿佛愈研究就愈不可捉摸。","那个昏睡了一个年的植物人，在妈妈和爸爸的悉心照料下，在医生和护士的精心治疗下，竟然奇迹般地醒过来了。","森林素有“绿色金子”之称，它可以把二氧化碳转换成氧气；它可以像抽水机一样把地下的水分散发到天空中；因此我们应该多多种树，保护环境。"],a:2,why:"<b>Dùng lượng từ sai</b>: <span class='zh'>一个年</span> → <span class='zh'>一年</span>. B dùng <span class='zh'>愈……愈……</span> (đúng)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"克雷洛夫的寓言___地反映了俄国18世纪末和19世纪初的民主主义进步思想。它不仅描写了当时的现实生活，而且对俄国统治阶级的蛮横专制、官吏的腐败无能、人民的___以及俄罗斯人民最大的灾害——农奴制度，都给以___地讽刺。",o:["恰当　苦恼　莫大","直观　痛楚　浓厚","深刻　疾苦　辛辣","科学　烦恼　严酷"],a:2,why:"<span class='zh'>深刻地反映</span>; <span class='zh'>人民的疾苦</span>; <span class='zh'>辛辣地讽刺</span>. Có <span class='zh'>寓言</span>!"},{n:22,text:"调查报告要以大量的调查材料为基础，通过客观事物的真实___来表达作者的主要___，以引起比较广泛的社会___。实事求是的客观性，较为鲜明的思想性，___问题的普遍性，是调查报告的主要特色。",o:["确切　任务　支持　把握","面目　倾向　影响　揭示","记录　寄托　震荡　联想","题材　心得　信念　确立"],a:1,why:"<span class='zh'>真实面目</span>; <span class='zh'>主要倾向</span>; <span class='zh'>社会影响</span>; <span class='zh'>揭示问题</span>. Bẫy: D toàn từ mới."},{n:23,text:"泡沫经济指经济运行___像泡沫一样，繁荣的表面___难逃破灭的___。泡沫经济往往伴随着商品价格的大起大落，但泡沫经济不是一般意义上的商品价格涨落，而是专指由过度投机而导致的商品价格___偏离商品价值、先暴涨后骤跌的现象。",o:["状态　终究　结局　严重","过程　未必　恶果　逐步","周期　迟早　后果　明显","态势　反正　下场　连年"],a:0,why:"<span class='zh'>运行状态</span>; <span class='zh'>终究难逃</span> (ngữ pháp bài này!); <span class='zh'>破灭的结局</span>; <span class='zh'>严重偏离</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"(24)：“非物质文化遗产”指被各社区、群体，有时是个人，视为其文化遗产组成部分的各种社会实践、观念表述、表现形式、知识、技能以及相关的工具、实物、手工艺品和文化场所。这种非物质文化遗产世代相传，在各社区和群体适用周围环境以及与自然和历史的互动中，被不断地再创造，(25)，从而增强对文化多样性和人类创造力的尊重。\n(26)：“非物质文化遗产”是指各族人民世代相传并视为其文化遗产组成部分的各种传统文化表现形式，(27)。包括：（一）传统口头文学以及作为其载体的语言；（二）传统美术、书法、音乐、舞蹈、戏剧、曲艺和杂技；（三）传统技艺、医药和历法；（四）传统礼仪、节庆等民俗；（五）传统体育和游艺；（六）其他非物质文化遗产。属于非物质文化遗产组成部分的实物和场所，(28)，适用《中华人民共和国文物保护法》的有关规定。",opts:["根据联合国《保护非物质文化遗产公约》","根据《中华人民共和国非物质文化遗产法》规定","凡属文物的","为这些社区和群体提供认同感和持续感","以及与传统文化表现形式相关的实物和场所"],ans:{24:0,25:3,26:1,27:4,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"宋瓷追求器型简洁，色彩纯净，不张扬、做作，于纯净之中传递美感。“汝、官、哥、定、钧”五大名窑名扬天下，千百年来受文人士大夫的喜爱，为后世推崇。\n汝瓷传世只区区几十件，见一面都很难；官窑器在市场上偶尔还得一见；哥窑器也是如此；钧窑器虽然常见，但现在学术界对钧窑的烧制年代存有争议；所以目前尚能从容细挑的，唯有定窑器。\n我一直想收藏定窑瓷器，喜欢它定素洁莹润，白中泛着象牙黄的自然之美，另外还有一点，我个人喜欢素饰的光素器，对花哨的东西不感兴趣，偏偏定窑还以刻工精美闻名。我只能挑挑拣拣，等待机会。\n直到等得我都觉得无望了，机会终于来了，一对日本夫妇要拍卖他们的私人收藏。二人均为医生，年轻之时，勤于医事。二十多年前，开始收藏，持之至今。拍品中的“北宋定窑双鱼纹碗”，细工精刻，起刀流畅，自然灵动，简洁而不失妩媚。釉色偏白略泛牙黄，内外壁光洁。对这样的拍品，我能错过吗！",qs:[{n:29,q:"宋代瓷器：",o:["全部出自五大名窑","向来为医生所喜爱","器型简单粗陋，不自然","体现了文人的审美情趣"],a:3,why:"“千百年来受文人士大夫的喜爱”."},{n:30,q:"“汝、官、哥、定、钧”五大名窑中：",o:["汝瓷流传受地区限制","钧窑器都是新近烧制的","官窑器、哥窑器数量很少","定窑器次品多，需认真挑选"],a:2,why:"“官窑器在市场上偶尔还得一见；哥窑器也是如此”."},{n:31,q:"“我”想收藏的定窑瓷器，应该是：",o:["釉色洁白","花哨一些","没有雕刻","简洁自然"],a:3,why:"“喜欢素饰的光素器，对花哨的东西不感兴趣”."},{n:32,q:"根据最后一段，可以知道：",o:["医生又舍不得卖了","拍品上雕刻有鱼纹","藏家希望买家是医生","“我”最终与此次拍品无缘"],a:1,why:"“北宋定窑双鱼纹碗”."}]},{ins:"第33–36题：请选出正确答案。",text:"唐卡是一种以宗教内容为主的卷轴画，既是赏心悦目的艺术品，又是修行者膜拜的对象，悬挂于家庭佛堂和寺院、庙宇的墙壁或柱梁上，它是匠人的劳动成果，也是艺术家的心灵表达，更是宗教信徒们的修行依托。\n格桑次旦12岁便参加了大昭寺修复工作。瘦小的格桑很勤快，师傅们口渴了，就支使他去买甜茶，累了，就让他来捶捶背。格桑学得很认真，他先跟着老师傅学配色。会配色了，就开始学画画。老师傅给他选了个吉祥的日子，他拿着支毛笔，在一面壁画墙上勾了条线，仪式就完了，这意味着，格桑从那天起就可以画画了。别人午休，格桑从来不休息，干起活来更是干劲十足。大昭寺修复工程完工，格桑配色、装饰画都可以了，虽然没有专门去学画唐卡，但跟着看了三年多，对于制作唐卡的程序也了解得差不多了。\n没有了修复寺庙的活，格桑进了建筑队，先当油漆工，又学木工，20岁时他已经打得一手好家具。藏式家具装饰画非常重要，格桑又能做木工，又会画画，一下子变得很吃香。\n可是格桑还是希望能画唐卡，倒不是想发财，而是因为“画唐卡”在他心目中占据的位置是不可替代的。终于，他有幸做了藏族绘画大师丹巴绕旦的徒弟，并成了画唐卡的高手。再后来，他跟着丹巴老师进了西藏大学艺术系，登上了大学的讲台。如今，格桑有一个自己的工作室，很多人来订制唐卡，一年到头画不完。但格桑最上心的还是教书，他常说“我学画唐卡从来没觉得难，可教的时候觉得很难，我给学生上课非常累，因为有的孩子不用心，总是没有进步，有的时候看着他们的画我就会生气。”",qs:[{n:33,q:"唐卡是：",o:["宗教画","山水画","人物画","静物画"],a:0,why:"“以宗教内容为主的卷轴画”."},{n:34,q:"格桑在大昭寺修复工作中：",o:["懂得了做事要勤快","帮别人选吉祥日子","边工作边跟老师学习","学会了配色、画装饰画"],a:3,why:"“格桑配色、装饰画都可以了”."},{n:35,q:"大昭寺修复工程完工以后，格桑：",o:["进了装修队","学会了木工","开了个家具店","吃什么都不香"],a:1,why:"“又学木工，20岁时他已经打得一手好家具”."},{n:36,q:"在格桑心中，觉得最难的是：",o:["教学工作","跟老师学艺","工作室的活儿","如期完成唐卡订单"],a:0,why:"“可教的时候觉得很难”. Có <span class='zh'>吉祥 · 干劲十足 · 发财 · 占据</span>!"}]}]},W:{zh:"写作",vn:"Viết văn: 我们的……艺术",t:"35 phút",min:!0,task:"本课介绍了中国的木版年画以及年画传人张光宁。从年画的起源讲到了年画的发展历程，同时给我们描述了一个热爱年画艺术，为年画艺术追求不止，有着远大理想和信念的年画传人。在你们的国家，一定也有具有自己民族特色的绘画艺术和具有代表性的画家，请以“我们的……艺术”为题写一种绘画艺术形式及画家的故事，字数不少于400字。",target:400,steps:[["Giới thiệu","Tên loại hình, vùng miền: <span class='zh'>起源 · 始于 · 文献记载</span>."],["Đặc điểm","Chất liệu, kỹ thuật, đề tài: <span class='zh'>题材 · 手法 · 寄托 · 吉祥 · 喜闻乐见</span>."],["Nghệ nhân","Ấn tượng đầu, quá trình học, đóng góp: <span class='zh'>扎实 · 再接再厉 · 干劲十足</span>."],["Khó khăn","Bảo tồn trong thời hiện đại: <span class='zh'>终究 · 任重道远 · 一帆风顺</span>."],["Kết","Tình cảm của bạn: <span class='zh'>愈……愈…… · 信念</span>."]],outline:[["一 · 开头","介绍艺术形式"],["二 · 起源与特点","历史、材料、题材"],["三 · 画家的故事","一位传人"],["四 · 现状","面临的困难与希望"],["五 · 结尾","我的感受"]],model:"我们的东湖画艺术\n在越南，有一种家喻户晓的民间绘画艺术，那就是东湖画。它和中国的木版年画很像，也是用木版印制，过去每到春节，家家户户都要买几张贴在墙上，寄托对新年的美好愿望。\n东湖画起源于北宁省的东湖村，据说已有几百年的历史。它的纸很特别，是用一种树皮做的，上面涂抹上一层用贝壳磨成的粉，在阳光下闪闪发光。颜料也全部来自大自然：红色来自泥土，黑色来自烧过的竹叶，黄色来自槐花。东湖画的题材十分丰富，有吉祥的猪、鸡，也有民间故事和老百姓的日常生活，如《老鼠娶亲》《摔跤》等，是越南人喜闻乐见的艺术形式。\n我曾经去东湖村参观过，认识了一位姓阮的老艺人。他从小跟着父亲学刻版、印画，基本功非常扎实。他告诉我，现在买画的人愈来愈少，很多年轻人都去城里打工了，愿意学这门手艺的人更少了。可是他并没有放弃，一年到头干劲十足，不但自己刻新版，还免费教村里的孩子，甚至走进学校给学生们上课。\n他说：“东湖画终究是我们祖先留下来的宝贝，不能在我们手里失传。”虽然保护东湖画任重道远，也不会一帆风顺，但我相信，有这样的艺人在，我们的东湖画艺术一定会一代一代地传下去。",check:["Có tiêu đề “我们的……艺术”","Có giới thiệu nguồn gốc, đặc điểm","Có câu chuyện về một nghệ nhân / họa sĩ","Có cảm nhận của bạn","Dùng ít nhất 4: 起源 · 寄托 · 题材 · 喜闻乐见 · 扎实 · 终究 · 愈……愈…… · 任重道远","Không ít hơn 400 chữ"]},SUM:{words:["起源","文献","凶恶","揭露","昌盛","题材","驱逐","吉祥","里程碑","墨水儿","盖章","联想","涂抹","终究","烟花爆竹","寄托","增添","丰收","发财","连年","寓言","信仰","喜闻乐见","神气","翘","神态","盛开","散发","耸","外行","推销","吞吞吐吐","残次品","现成","谢绝","故乡","扎实","塑造","手法","派别","借鉴","再接再厉","心得","缺席","干劲","占据","确立","信念","任重道远","一帆风顺"],patterns:[["终究 + V / 是……","单色印品终究不能满足人们的审美需求。"],["愈……愈……","愈是经营年画久了，他对年画就愈是热爱。"],["……，于是……；……，于是……","有了纸……于是有人发明了墨；……于是印章开始流行……"],["为……所……","使其雅俗共赏，为更多民众所喜爱。"],["篇章：重复关键词","我喜欢它，热爱它，靠它生活，也在努力探索它、发展它。"]],diff:["连年: liên tiếp nhiều năm, không + số lượng (连年丰收 · 连年亏损) — 连续: liên tiếp, mọi khoảng thời gian, + số lượng (连续三天 · 连续工作15个小时)","外行 wàiháng · 扎实 zhāshi · 现成 · 谢绝 = từ chối lịch sự"],sentences:["造纸技术的发明是人类文化发展史上一个重要的里程碑。","年画成了文化交流、道德教育、信仰传承的载体与工具，是老百姓喜闻乐见的文化艺术形式。","虽然任重道远，也不会一帆风顺，但他一定会坚持下去。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “我们的……艺术” ≥400 chữ (mục 7).","Đặt 3 câu với 终究 và 3 câu với 愈……愈…….","Làm Sách bài tập bài 35.","Đọc trước bài 36."]}});
