<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 39 · 互联网时代的生活 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-39",num:39,book:"HSK 标准教程 6（下）",unit:{n:10,zh:"热点追踪",vn:"Theo dấu các chủ đề nóng hổi"},title:"互联网时代的生活",vn:"Cuộc sống trong thời đại Internet",chars:1441,source:"",goals:["Đọc hiểu bài 1441 chữ về <b>đời sống thời Internet</b>: những thay đổi Internet mang lại, mô hình <b>gọi vốn cộng đồng (众筹)</b> mua nhà, sự phát triển của crowdfunding ở Trung Quốc, và mặt trái — lừa đảo, hacker.","Dùng được 48 từ mới, nhất là nhóm <b>tài chính – Internet</b>: <span class='zh'>交易 · 设立 · 合伙 · 筹备 · 成员 · 渠道 · 审查 · 缴纳 · 股份 · 股东 · 钞票 · 政策 · 阶层</span> và nhóm <b>tâm trạng – mặt trái</b>: <span class='zh'>沉闷 · 充实 · 乐趣 · 虚荣 · 上瘾 · 尴尬 · 急功近利 · 牢骚 · 罪犯 · 盗窃 · 冒充 · 诈骗 · 拘留 · 败坏 · 曝光</span>.","Nắm <span class='zh'>任意 · 尚未</span>.","Phân biệt <span class='zh'>乐趣 — 兴趣</span>; làm quen <b>修辞 (11): 夸张 — phóng đại</b>.","Viết báo cáo khảo sát “互联网与我们” ≥400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Đoạn 1–4 · 任意 · 乐趣—兴趣"],["Buổi 2","Nhóm 3 · Đoạn 5–9 · 尚未 · 夸张 · Bài tập · Luyện đề · Viết báo cáo"]],outline:[{tag:"起",name:"Đổi thay",paras:"Đoạn 1",zh:"日新月异的变化",vn:"Gọi video, mua sắm xuyên quốc gia, học, tìm việc, lập web cá nhân, hùn vốn mua nhà qua mạng."},{tag:"承",name:"Gọi vốn mua nhà",paras:"Đoạn 2–3",zh:"众筹买房 · 微信群 · 凝聚人心",vn:"Rẻ hơn ít nhất 30%; WeChat là kênh chính; người tham gia cùng tầng lớp, cùng bàn việc lớn."},{tag:"转",name:"Crowdfunding",paras:"Đoạn 4–7",zh:"Kickstarter · 点名时间 · 朱江",vn:"Khái niệm 众筹; Kickstarter, 点名时间; 朱江 “người gọi vốn số một”; người dùng TQ nóng vội, hay phàn nàn."},{tag:"合",name:"Nỗi lo",paras:"Đoạn 8–9",zh:"盗窃账户 · 假网站 · 黑客",vn:"Trộm 18 triệu tài khoản, công ty ma giả web nhà nước, hacker — yêu Internet mà cũng lo."}],warm1:{q:"互联网已经影响到我们生活的方方面面，下边这些情况你遇到过哪些？请联系实际谈一谈互联网给我们带来的利与弊。",vn:"Bạn đã gặp những tình huống nào? Bấm 有 (có) / 无 (không).",items:[["🛒","利：上网购物、查资料","Lợi: mua sắm, tra cứu"],["🎬","利：网上交朋友、看电影、听音乐","Lợi: kết bạn, xem phim, nghe nhạc"],["🎣","弊：上网购物受骗了、遇到了假网站","Hại: bị lừa khi mua, gặp web giả"],["🔓","弊：电子邮箱密码被偷了、网上交友遇到坏人","Hại: mất mật khẩu, gặp người xấu"]],talk:["互联网给你带来了哪些方便？","你遇到过网络诈骗吗？"],link:"<span class='zh'>众筹</span> zhòngchóu = crowdfunding, gọi vốn cộng đồng."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"集",rule:"集 = <b>tập hợp, gom lại</b>.",w:[["集资","jízī","góp vốn (có trong bài)"],["集中","jízhōng","tập trung"],["集合","jíhé","tập hợp"],["集聚","jíjù","tụ tập"],["集会","jíhuì","mít-tinh"],["集体","jítǐ","tập thể"],["集装箱","jízhuāngxiāng","container"],["集团","jítuán","tập đoàn"],["集结","jíjié","tập kết"],["汇集","huìjí","hội tụ"],["交集","jiāojí","giao thoa"],["筹集","chóují","huy động"],["聚集","jùjí","tụ tập (có trong bài)"],["募集","mùjí","quyên góp"]]},{k:"资",rule:"资 = <b>tiền của, vốn</b>.",w:[["资金","zījīn","vốn (có trong bài)"],["资产","zīchǎn","tài sản"],["资本","zīběn","tư bản"],["资源","zīyuán","tài nguyên"],["资助","zīzhù","tài trợ"],["资费","zīfèi","cước phí"],["工资","gōngzī","lương"],["投资","tóuzī","đầu tư"],["合资","hézī","liên doanh"],["物资","wùzī","vật tư"],["外资","wàizī","vốn nước ngoài"],["薪资","xīnzī","lương bổng"],["邮资","yóuzī","bưu phí"]]},{k:"筹",rule:"筹 = <b>trù tính, lo liệu, gom</b>.",w:[["筹备","chóubèi","trù bị (từ mới)"],["众筹","zhòngchóu","gọi vốn cộng đồng (có trong bài)"],["筹办","chóubàn","lo liệu"],["筹划","chóuhuà","trù hoạch"],["筹建","chóujiàn","trù bị xây dựng"],["筹谋","chóumóu","mưu tính"],["运筹","yùnchóu","trù hoạch"],["自筹","zìchóu","tự lo"],["统筹","tǒngchóu","điều phối"],["一筹莫展","yìchóu-mòzhǎn","bó tay"],["运筹帷幄","yùnchóu-wéiwò","bày mưu trong trướng"]]},{k:"备",rule:"备 = <b>chuẩn bị, sẵn</b>.",w:[["备查","bèichá","để tra cứu"],["备课","bèikè","soạn bài"],["备考","bèikǎo","ôn thi"],["备料","bèiliào","chuẩn bị vật liệu"],["备用","bèiyòng","dự phòng"],["备注","bèizhù","ghi chú"],["备忘","bèiwàng","ghi nhớ"],["常备","chángbèi","thường trực"],["准备","zhǔnbèi","chuẩn bị"],["防备","fángbèi","phòng bị"],["储备","chǔbèi","dự trữ"],["自备","zìbèi","tự chuẩn bị"],["预备","yùbèi","dự bị"],["战备","zhànbèi","sẵn sàng chiến đấu"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Đổi thay & gọi vốn mua nhà",from:1,to:17},{name:"Nhóm 2 · Đoạn 3–6",sub:"Người tham gia & crowdfunding",from:18,to:31},{name:"Nhóm 3 · Đoạn 7–9",sub:"Khó khăn & nỗi lo",from:32,to:48}],V:[[1,"日新月异","rìxīn-yuèyì","thành ngữ","nhật tân nguyệt dị","thay đổi từng ngày",1,"成","每天每月都有新的变化，形容发展、进步很快。","日新月异的变化","科技发展日新月异。","Khoa học kỹ thuật thay đổi từng ngày.",[],""],[2,"沉闷","chénmèn","tt.","trầm muộn","chán ngắt, nặng nề, ngột ngạt",1,"","（气氛、环境）使人感到沉重而烦闷；（心情）不舒畅。","不再单调沉闷","会议气氛很沉闷。","Không khí cuộc họp rất nặng nề.",[],"Bài tập 1 (ví dụ): <span class='zh'>烦闷 · 苦闷 · 郁闷 · 闷闷不乐</span>; 2①; 3①."],[3,"充实","chōngshí","tt.","sung thực","dồi dào, phong phú, đầy đủ",1,"","丰富，充足（多指内容或人员、物力的配备）。","浪漫、丰富和充实","他的生活很充实。","Cuộc sống của anh ấy rất phong phú.",[],"Bài tập 2②; 3①. SBT nghe câu 1."],[4,"交易","jiāoyì","đgt.","giao dịch","mua bán, giao dịch",1,"","买卖商品。","异地购物、交易","网上交易。","Giao dịch trực tuyến.",[],"Bài tập 3②."],[5,"任意","rènyì","phó.","nhậm ý","tùy ý, tha hồ, tùy tiện",1,"","没有拘束，不加限制，爱怎么样就怎么样。","任意挑选欧洲、美洲的商品","合同一旦生效，任何一方都不能任意反悔了。","Hợp đồng có hiệu lực thì không bên nào được tùy ý đổi ý.",[],"Xem <b>Ngữ pháp: 任意</b>. Bài tập 2③."],[6,"乐趣","lèqù","dt.","lạc thú","niềm vui, điều thích thú, điều thú vị",1,"","使人感到快乐的意味。","自由而不失乐趣","读书是一种乐趣。","Đọc sách là một niềm vui.",[],"Xem <b>辨析 乐趣—兴趣</b>. Bài tập 3①."],[7,"设立","shèlì","đgt.","thiết lập","thành lập, thiết lập, mở ra",1,"","成立；建立（组织、机构等）。","设立个人网站","设立奖学金。","Lập học bổng.",[],""],[8,"虚荣","xūróng","dt.","hư vinh","hư vinh",1,"","表面上的光彩。","小小的虚荣心","她的虚荣心很强。","Cô ấy rất hám hư vinh.",["虚荣心"],""],[9,"珍贵","zhēnguì","tt.","trân quý","quý báu, quý giá",1,"","价值大；意义深刻；宝贵。","珍贵礼物","珍贵的回忆。","Kỷ niệm quý giá.",[],"SBT nghe 6–10."],[10,"合伙","héhuǒ","đgt.","hợp hỏa","hùn vốn, kết bè kết phái",1,"","合成一伙（做某事）。","和朋友合伙筹备资金买房","他们合伙开了一家店。","Họ hùn vốn mở một cửa hàng.",["合伙人"],"SBT nghe câu 5."],[11,"筹备","chóubèi","đgt.","trù bị","trù bị, chuẩn bị",1,"","为进行工作、举办事业或成立机构等事先筹划准备。","筹备资金买房","筹备婚礼。","Chuẩn bị đám cưới.",[],"Khởi động 2: nhóm chữ <span class='zh'>筹</span>. Bài tập 2④."],[12,"成员","chéngyuán","dt.","thành viên","thành viên, hội viên",1,"","集体或家庭的组成人员。","互联网金融下的新成员","家庭成员。","Thành viên gia đình.",[],"SBT nghe câu 5."],[13,"初步","chūbù","tt.","sơ bộ","ban đầu, lúc đầu, sơ bộ",1,"","开始阶段的；不是最后的或完备的。","初步打算召集200人","初步计划。","Kế hoạch sơ bộ.",[],"SBT câu 31."],[14,"合算","hésuàn","tt.","hợp toán","có lợi, đáng giá",1,"","所费人力物力较少而收效较大。","都很合算","这样买比较合算。","Mua thế này lợi hơn.",[],"SBT nghe câu 5."],[15,"渠道","qúdào","dt.","cừ đạo","con đường, cửa ngõ",1,"","在河湖或水库等周围开挖的水道；比喻途径、门路。","微信是主要渠道","销售渠道。","Kênh phân phối.",[],"Bài tập 3②. SBT câu 34."],[16,"审查","shěnchá","đgt.","thẩm tra","xem xét, xét duyệt",1,"","检查核对是否正确、妥当。","通过审查后","资格审查。","Thẩm tra tư cách.",[],"Bài tập 1: <span class='zh'>审核 · 审阅 · 审美 · 审判</span>. SBT nghe 14–17."],[17,"缴纳","jiǎonà","đgt.","giảo nạp","giao, nộp",1,"","交纳（多指履行义务或被强制的）。","缴纳100元订金","按时缴纳房租。","Nộp tiền nhà đúng hạn.",[],"Bài tập 1: <span class='zh'>缴费 · 收缴 · 缴获 · 缴税</span>; 3②."],[18,"摸索","mōsuǒ","đgt.","mô tác","mò mẫm, dò dẫm, tìm kiếm",1,"","试探着（行进）；寻找（方向、方法、经验等）。","还处于摸索阶段","在实践中摸索经验。","Mò mẫm rút kinh nghiệm trong thực tiễn.",[],""],[19,"层次","céngcì","dt.","tằng thứ","cấp độ, cấp",1,"","（说话、作文）内容的次序；相属的各级机构；同一事物由于大小、高低等不同而形成的区别。","他们层次较高","文化层次。","Trình độ văn hóa.",[],""],[20,"阶层","jiēcéng","dt.","giai tầng","tầng lớp/giai cấp trong xã hội",1,"","指在同一阶级中因社会经济地位不同而分成的层次；泛指由不同阶级出身，因某种相同的特征而形成的社会集团。","基本属于同一阶层","中产阶层。","Tầng lớp trung lưu.",[],""],[21,"政策","zhèngcè","dt.","chính sách","chính sách",1,"","国家或政党为实现一定历史时期的路线而制定的行动准则。","对国家的政策怎么理解","国家出台了新政策。","Nhà nước ban hành chính sách mới.",[],""],[22,"欢乐","huānlè","tt.","hoan lạc","vui vẻ, vui sướng",1,"","快乐（多指集体的）。","忙碌而欢乐","节日里到处是欢乐的笑声。","Ngày lễ khắp nơi tiếng cười vui vẻ.",[],""],[23,"上瘾","shàng yǐn","đgt.","thượng ẩn","mê, nghiện",1,"","爱好某种事物而成为癖好。","这种共商大事的感觉也很让人上瘾","玩游戏容易上瘾。","Chơi game dễ nghiện.",[],"Bài tập 3①. SBT nghe câu 2."],[24,"慈善","císhàn","tt.","từ thiện","từ thiện",1,"","对人关怀，富有同情心。","从慈善到图书出版","慈善活动。","Hoạt động từ thiện.",[],""],[25,"股份","gǔfèn","dt.","cổ phần","cổ phần",1,"","股份公司或其他合伙经营的企业的资本单位。","持有美微股份的股东","他持有公司30%的股份。","Ông ấy nắm 30% cổ phần công ty.",[],"Bài tập 1: <span class='zh'>股东 · 股票 · 股民 · 勾股定理</span>. SBT câu 20D."],[26,"股东","gǔdōng","dt.","cổ đông","cổ đông, người góp vốn",1,"","股份公司的股票持有人。","成为……的股东","股东大会。","Đại hội cổ đông.",[],"SBT câu 20D."],[27,"钞票","chāopiào","dt.","sao phiếu","tiền giấy, giấy bạc",1,"","纸币。","钞票源源不断流进来","一沓钞票。","Một xấp tiền.",[],""],[28,"苦尽甘来","kǔjìn-gānlái","thành ngữ","khổ tận cam lai","khổ tận cam lai, hết khổ đến sướng",1,"成","比喻艰苦的日子过去，美好的日子到来了。","有种苦尽甘来的味道","熬过这几年就苦尽甘来了。","Qua mấy năm này là hết khổ.",[],""],[29,"尴尬","gāngà","tt.","giam giới","lúng túng, khó xử, rắc rối",1,"","处境困难，不好处理；（神色、态度）不自然。","处境尴尬","场面很尴尬。","Tình huống rất ngượng.",[],"SBT nghe câu 5C."],[30,"抛弃","pāoqì","đgt.","phao khí","vứt bỏ, từ bỏ",1,"","扔掉不要。","三年以后却抛弃了“众筹”","不能抛弃传统。","Không thể vứt bỏ truyền thống.",[],"Bài 36 SBT câu 19B."],[31,"坦白","tǎnbái","tt.","thản bạch","thẳng thắn, ngay thẳng, bộc trực",1,"","心地纯洁，语言直率。","坦白地讲","坦白地说，我不同意。","Nói thẳng, tôi không đồng ý.",[],"Bài tập 3②. SBT câu 29–32."],[32,"急功近利","jígōng-jìnlì","thành ngữ","cấp công cận lợi","chỉ lo lợi ích trước mắt",1,"成","急于求成，贪图眼前的利益。","甚至有些急功近利","做事不能急功近利。","Làm việc không thể chạy theo lợi ích trước mắt.",[],"SBT nghe câu 3C."],[33,"进展","jìnzhǎn","đgt.","tiến triển","tiến triển, phát triển",1,"","（事情）向前发展。","项目进展比计划的慢","工作进展顺利。","Công việc tiến triển thuận lợi.",[],"Bài 36: <span class='zh'>开展</span>."],[34,"牢骚","láosāo","dt.","lao tao","sự càu nhàu, sự phàn nàn",1,"","烦闷不满的情绪。","就会发牢骚，有怨气","他总是发牢骚。","Anh ta lúc nào cũng càu nhàu.",["发牢骚"],"SBT câu 20C."],[35,"迄今为止","qìjīn wéizhǐ","","hất kim vi chỉ","cho đến bây giờ, cho đến nay",1,"","到现在为止。","迄今为止众筹在国内还是……","迄今为止，已有一百多人报名。","Đến nay đã có hơn trăm người đăng ký.",[],"Bài tập 3②."],[36,"吃力","chīlì","tt.","ngật lực","vất vả, khó nhọc",1,"","费力。","做起来吃力的事情","他走路有点儿吃力。","Ông ấy đi lại hơi khó nhọc.",[],""],[37,"家喻户晓","jiāyù-hùxiǎo","thành ngữ","gia dụ hộ hiểu","mọi người đều biết",1,"成","家家户户都知道。","在互联网变得家喻户晓","这个故事家喻户晓。","Câu chuyện này nhà nhà đều biết.",[],"Bài 37 SBT câu 20A."],[38,"无穷无尽","wúqióng-wújìn","thành ngữ","vô cùng vô tận","vô tận, vô hạn, không bao giờ hết",1,"成","没有穷尽，没有止境。","无穷无尽的烦恼","无穷无尽的力量。","Sức mạnh vô tận.",[],"Bài tập 3①."],[39,"罪犯","zuìfàn","dt.","tội phạm","tội phạm",1,"","有犯罪行为的人。","尚未查明身份的罪犯","罪犯已被抓获。","Tội phạm đã bị bắt.",[],"Bài 37: <span class='zh'>犯罪分子</span>."],[40,"盗窃","dàoqiè","đgt.","đạo thiết","trộm cắp, đánh cắp",1,"","用不合法的手段秘密地取得（财物）。","盗窃了1800万个电子邮件账户","盗窃案。","Vụ trộm cắp.",[],""],[41,"公然","gōngrán","phó.","công nhiên","ngang nhiên, công khai",1,"","公开地；毫无顾忌地（多含贬义）。","公然冒充国家部门","他公然违反规定。","Hắn ngang nhiên vi phạm quy định.",[],"SBT câu 19D."],[42,"冒充","màochōng","đgt.","mạo sung","giả mạo, đội lốt",1,"","假的充当真的。","冒充国家部门","冒充警察骗钱。","Giả danh cảnh sát lừa tiền.",[],"SBT câu 19C."],[43,"大肆","dàsì","phó.","đại tứ","trắng trợn, không kiêng nể",1,"","无顾忌地（多指做坏事）。","大肆进行诈骗","大肆宣扬。","Rêu rao trắng trợn.",[],"Bài tập 2⑥."],[44,"诈骗","zhàpiàn","đgt.","trá phiến","lừa dối, lừa gạt",1,"","讹诈骗取。","大肆进行诈骗","网络诈骗。","Lừa đảo qua mạng.",[],"Bài tập 1: <span class='zh'>欺骗 · 蒙骗 · 骗术 · 骗局</span>. Bài 37 SBT nghe câu 1."],[45,"拘留","jūliú","đgt.","câu lưu","giam cầm, tạm giam",1,"","公安机关依法把犯罪嫌疑人暂时关押。","被警方依法刑事拘留","他被拘留了十五天。","Hắn bị tạm giam 15 ngày.",[],"Bài 37 SBT nghe câu 5: <span class='zh'>刑事拘留</span>."],[46,"败坏","bàihuài","đgt.","bại hoại","làm tổn hại, gây thiệt hại, làm mất",1,"","损害；破坏（名誉、风气等）。","败坏互联网名誉的事件","败坏社会风气。","Làm bại hoại phong khí xã hội.",[],""],[47,"名誉","míngyù","dt.","danh dự","danh dự, danh tiếng",1,"","个人或集团的名声。","败坏互联网名誉","名誉受损。","Danh dự bị tổn hại.",[],""],[48,"曝光","bào guāng","đgt.","bộc quang","bóc trần, vạch trần, phơi bày ra",1,"","比喻隐秘的事（多指不光彩的）显露出来，被众人知道。","一经曝光","丑闻被曝光了。","Vụ bê bối bị phơi bày.",[],"Bài 36: <span class='zh'>一经</span>."]],extra:[["众筹","zhòngchóu","gọi vốn cộng đồng"],["天涯海角","tiānyá-hǎijiǎo","chân trời góc biển"],["足不出户","zúbùchūhù","không ra khỏi nhà"],["微信群","Wēixìn qún","nhóm WeChat"],["户型","hùxíng","kiểu căn hộ"],["凝聚人心","níngjù rénxīn","gắn kết lòng người"],["淘宝网","Táobǎo wǎng","Taobao"],["原始股票","yuánshǐ gǔpiào","cổ phiếu gốc"],["皮包公司","píbāo gōngsī","công ty ma"],["黑客","hēikè","hacker"],["触目惊心","chùmù-jīngxīn","nhìn mà kinh hãi"],["爱不释手","àibúshìshǒu","yêu không rời tay"]],T:[{zh:"互联网走进我们的生活没有多久，却让我们实实在在地感受到生活正发生着日新月异的变化：它能让我们自如地通话、视频、传递消息，哪怕你在天涯海角；它使我们的生活不再单调沉闷，每一天都变得浪漫、丰富和充实；它将异地购物、交易变为了可能——我们足不出户就能任意挑选欧洲、美洲的商品；我们可以在网上学习，自由而不失乐趣；我们可以在网上找工作，简单又高效；我们能设立个人网站，既能扩大你的朋友圈，又能让你小小的虚荣心得到满足，如果愿意，还可以设立你亲友的网站，作为赠送给他们的珍贵礼物。最近又有人通过网络，和朋友、朋友的朋友合伙筹备资金买房，人们视这一创举为互联网金融下的新成员。",vn:"Internet bước vào cuộc sống chưa lâu, nhưng đã khiến chúng ta thực sự cảm nhận cuộc sống đang thay đổi từng ngày: nó giúp ta gọi điện, gọi video, gửi tin nhắn tự do, dù bạn ở chân trời góc biển; nó khiến cuộc sống không còn đơn điệu tẻ nhạt, mỗi ngày đều lãng mạn, phong phú và đầy đặn; nó biến việc mua sắm, giao dịch ở nơi khác thành có thể — chẳng cần ra khỏi nhà vẫn tha hồ chọn hàng châu Âu, châu Mỹ; ta có thể học trên mạng, tự do mà không mất vui; có thể tìm việc trên mạng, đơn giản lại hiệu quả; có thể lập trang web cá nhân, vừa mở rộng vòng bạn bè, vừa thỏa mãn chút hư vinh nho nhỏ; nếu muốn, còn có thể lập trang web cho người thân bạn bè làm món quà quý tặng họ. Gần đây lại có người qua mạng cùng bạn bè và bạn của bạn hùn vốn mua nhà; người ta coi sáng kiến này là thành viên mới của tài chính Internet.",idea:"Những đổi thay Internet mang lại.",q:["互联网走进我们的生活以后，生活发生了哪些变化？"],note:[["它能……；它使……；它将……","排比 (bài 32)."],["哪怕你在天涯海角","Xem 修辞: 夸张."],["任意挑选","Xem Ngữ pháp 1: <span class='zh'>任意</span>."],["视……为……","Coi… là…"]]},{zh:"据集资买房项目发起人介绍，此次众筹买房，初步打算召集200人，筹备建立众筹家园小区。众筹购房的好处在于价格上拥有明显优势，比市场价至少便宜30%，无论是投资还是自住，都很合算。项目沟通中，微信是主要渠道，申请人递交申请表、通过审查后，缴纳100元订金就可以进入购房微信群，项目的设计、户型、价格等，全部由大家商议决定。",vn:"Theo người khởi xướng dự án góp vốn mua nhà, đợt gọi vốn lần này dự kiến sơ bộ tập hợp 200 người, chuẩn bị xây dựng khu dân cư “gia viên gọi vốn”. Ưu điểm của gọi vốn mua nhà là có lợi thế rõ rệt về giá, rẻ hơn giá thị trường ít nhất 30%, dù đầu tư hay để ở đều rất có lợi. Trong trao đổi dự án, WeChat là kênh chính; người đăng ký nộp đơn, qua xét duyệt, nộp 100 tệ tiền đặt cọc là vào được nhóm WeChat mua nhà; thiết kế, kiểu căn hộ, giá cả… đều do mọi người bàn bạc quyết định.",idea:"Gọi vốn mua nhà.",q:["人们如何利用网络平台筹备买房？"],note:[["……的好处在于……","Lợi ích nằm ở…"],["无论是……还是……，都……","Dù… hay… đều…"]]},{zh:"大家深知买房对每个家庭都不是小事，众筹买房也还处于摸索阶段，因此必须慎重。众筹的参与者，都是发起人的朋友，或者朋友的朋友。他们层次较高，都有一定的经济基础，对新生事物有强烈好奇心，基本属于同一阶层。用发起人的话说，众筹不是在筹房子，而是在凝聚人心。房子怎么设计、对国家的政策怎么理解、失败了怎么办？大家每天在微信群你来我往，忙碌而欢乐，除了严肃的房价，这种共商大事的感觉也很让人上瘾。",vn:"Mọi người đều hiểu mua nhà với gia đình nào cũng không phải chuyện nhỏ, gọi vốn mua nhà còn đang ở giai đoạn mò mẫm, nên phải thận trọng. Người tham gia đều là bạn của người khởi xướng hoặc bạn của bạn. Họ có trình độ khá cao, có nền tảng kinh tế nhất định, rất tò mò với cái mới, về cơ bản cùng một tầng lớp. Theo lời người khởi xướng, gọi vốn không phải gom nhà mà là gắn kết lòng người. Nhà thiết kế thế nào, hiểu chính sách nhà nước ra sao, thất bại thì làm sao? Mọi người ngày ngày qua lại trong nhóm WeChat, bận rộn mà vui vẻ; ngoài chuyện giá nhà nghiêm túc, cảm giác cùng bàn việc lớn cũng khiến người ta “nghiện”.",idea:"Người tham gia.",q:["众筹的参与者是什么样的人？"],note:[["不是……，而是……","Không phải… mà là…"],["你来我往","Qua qua lại lại."]]},{zh:"什么是“众筹”？说白了，就是大家筹钱干一件事，上文所说的“众筹”更像是“集资建房”，广义的“众筹”则是互联网金融的产物，指创业者通过网络，向众多素不相识的人争取资金支持。",vn:"“Gọi vốn cộng đồng” là gì? Nói trắng ra là mọi người góp tiền làm một việc. “Gọi vốn” ở trên giống “góp vốn xây nhà” hơn; còn “gọi vốn cộng đồng” theo nghĩa rộng là sản phẩm của tài chính Internet, chỉ việc người khởi nghiệp qua mạng tranh thủ hỗ trợ vốn từ đông đảo người không quen biết.",idea:"Khái niệm 众筹.",q:["什么是众筹？"],note:[["什么是……？说白了，就是……","设问 + 插入语 (bài 31)."]]},{zh:"世界上第一个让初创公司梦想成真的众筹网站是美国的Kickstarter。2011年5月，中国国内首家众筹网站——点名时间，将Kickstarter的模式搬进了中国，之后众筹平台越来越多。如今，从慈善到图书出版，从电影制作到创业项目，众筹几乎跨越了所有的领域。",vn:"Trang gọi vốn đầu tiên trên thế giới giúp công ty khởi nghiệp biến giấc mơ thành hiện thực là Kickstarter của Mỹ. Tháng 5/2011, trang gọi vốn đầu tiên của Trung Quốc — 点名时间 — đưa mô hình Kickstarter vào Trung Quốc, sau đó nền tảng gọi vốn ngày càng nhiều. Ngày nay, từ từ thiện đến xuất bản sách, từ làm phim đến dự án khởi nghiệp, gọi vốn cộng đồng gần như vươn tới mọi lĩnh vực.",idea:"Kickstarter & 点名时间.",q:[],note:[["从……到……，从……到……","Liệt kê phạm vi."]]},{zh:"美微传媒CEO朱江做梦也没想到，他成了传说中的“中国众筹第一人”。那年，朱江开始在淘宝网出售美微会员卡，购买会员卡就是购买公司的原始股票，每股1.2元，最低认购100股，也就是说，花120元就可以成为持有美微股份的股东。朱江回忆起当时钞票源源不断流进来的感觉，真的有种苦尽甘来的味道。",vn:"CEO truyền thông Mỹ Vi — Chu Giang — nằm mơ cũng không ngờ mình thành “người gọi vốn số một Trung Quốc” trong truyền thuyết. Năm ấy, anh bắt đầu bán thẻ hội viên Mỹ Vi trên Taobao; mua thẻ hội viên chính là mua cổ phiếu gốc của công ty, mỗi cổ phiếu 1,2 tệ, tối thiểu 100 cổ phiếu — tức là bỏ 120 tệ đã thành cổ đông nắm cổ phần Mỹ Vi. Nhớ lại cảm giác tiền chảy vào không ngớt lúc đó, Chu Giang thấy thật có vị khổ tận cam lai.",idea:"Chu Giang.",q:["朱江是怎样众筹的？"],note:[["做梦也没想到","Nằm mơ cũng không ngờ."],["也就是说","Tức là."]]},{zh:"时至今日，众筹项目有成功的，也有处境尴尬的，而国内第一家众筹网站“点名时间”三年以后却抛弃了“众筹”，改营其他。坦白地讲，国内用户与国外有很大区别，比如，Kickstarter上聚集着一群理想主义者，他们心中充满向往，购买时感性因素超越了理性。国内用户则希望尽快得到回报，甚至有些急功近利，而用户的心态很大程度上决定了项目成功的可能性。再比如，国内用户对收获时间和产品质量要求较高，如果认为产品不符合预期，或是项目进展比计划的慢，就会发牢骚，有怨气。另外，大部分投资者对众筹还是持观望态度。因此，迄今为止众筹在国内还是一个看起来很美、做起来吃力的事情。",vn:"Đến nay, dự án gọi vốn có cái thành công, cũng có cái lâm cảnh khó xử; còn trang gọi vốn đầu tiên trong nước 点名时间 ba năm sau đã từ bỏ “gọi vốn”, chuyển sang kinh doanh khác. Nói thẳng, người dùng trong nước khác nước ngoài rất nhiều: ví dụ trên Kickstarter tập trung những người lý tưởng, lòng đầy khát vọng, khi mua thì cảm tính vượt lý tính. Người dùng trong nước lại mong sớm được đền đáp, thậm chí hơi chạy theo lợi trước mắt, mà tâm lý người dùng phần lớn quyết định khả năng thành công. Lại ví dụ, người dùng trong nước đòi hỏi cao về thời gian nhận hàng và chất lượng; nếu thấy sản phẩm không như kỳ vọng, hoặc dự án tiến triển chậm hơn kế hoạch thì sẽ càu nhàu, oán trách. Ngoài ra, phần lớn nhà đầu tư vẫn giữ thái độ đứng xem. Vì thế, đến nay gọi vốn cộng đồng trong nước vẫn là việc nhìn thì đẹp, làm thì vất vả.",idea:"Khó khăn ở Trung Quốc.",q:["众筹在中国的发展怎么样？"],note:[["坦白地讲","Nói thẳng ra."],["比如……；再比如……；另外……","Luận cứ (bài 36)."],["看起来很美、做起来吃力","Đối lập."]]},{zh:"是啊，在互联网变得家喻户晓，给我们的生活带来许许多多的方便和乐趣的同时，也给我们增添了无穷无尽的烦恼，众筹平台上有，其他领域也有。据官方报道，尚未查明身份的罪犯盗窃了1800万个电子邮件账户及其密码；仅有两三个人的皮包公司公然冒充国家部门开设了一家假网站，大肆进行诈骗，如今已被警方依法刑事拘留；还有时时活跃着的网络黑客。每次类似这些败坏互联网名誉的事件一经曝光，就会使我们有触目惊心之感。",vn:"Đúng vậy, khi Internet trở nên nhà nhà đều biết, mang lại cho cuộc sống biết bao tiện lợi và niềm vui, thì cũng thêm cho ta vô vàn phiền não — trên nền tảng gọi vốn có, lĩnh vực khác cũng có. Theo tin chính thức, tội phạm chưa rõ danh tính đã đánh cắp 18 triệu tài khoản email và mật khẩu; một công ty ma chỉ có hai ba người ngang nhiên giả danh cơ quan nhà nước lập web giả, lừa đảo trắng trợn, nay đã bị cảnh sát tạm giam hình sự theo luật; còn có những hacker lúc nào cũng hoạt động. Mỗi lần những vụ làm hoen ố danh tiếng Internet như vậy bị phơi bày, ta đều thấy kinh hãi.",idea:"Mặt trái.",q:["人们为什么对互联网也会心存担忧？"],note:[["尚未查明身份的罪犯","Xem Ngữ pháp 2: <span class='zh'>尚未</span>."],["……；……；还有……","Liệt kê."],["一经曝光，就……","Bài 36: <span class='zh'>一经</span>."]]},{zh:"这就是互联网时代，在我们对它爱不释手的同时，也不免对它心存担忧。",vn:"Đó chính là thời đại Internet: trong khi ta yêu không rời tay, cũng không khỏi lo lắng về nó.",idea:"Kết luận.",q:[],note:[["在……的同时，也……","Đồng thời… cũng…"]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"任意",zh:"任意",py:"rènyì",tag:"Chú thích 1 · phó từ",mean:"Phó từ, nghĩa là <b>muốn làm thế nào thì làm thế ấy, không bị ràng buộc, không bị hạn chế</b> — “tùy ý, tha hồ”.",forms:["任意 + V（挑选 / 放大 / 选用 / 改造）"],ex:[["合同一旦生效，任何一方都不能任意反悔了。","Hợp đồng một khi có hiệu lực, không bên nào được tùy ý đổi ý."],["它将异地购物、交易变为了可能——我们足不出户就能任意挑选欧洲、美洲的商品……","",1],["科学家很早以前就发现蝙蝠能在黑暗中任意飞行……","Các nhà khoa học từ lâu đã phát hiện dơi có thể bay tự do trong bóng tối…"]],tips:["Bài tập 2③."],practice:{q:"参考提示词，用“任意”完成句子",type:"complete",items:[["利用GPS和电子地图可以实时显示出车辆的实际位置，并可________，还可以还原、换图。（放大）","……并可任意放大，……"],["……六种语言同等有效，联大代表们发言时可以________。（选用）","……可以任意选用。"],["把人视为自然界的主人，对自然________，这种价值观念是绝对错误的。（改造）","……对自然任意改造，……"]]}},{id:"g2",grp:2,word:"",zh:"尚未",py:"shàngwèi",tag:"Chú thích 2",mean:"Nghĩa là “<b>còn chưa</b>”, dùng trong <b>văn viết</b>. Bài 34: <span class='zh'>尚且</span> = còn….",forms:["尚未 + V（查明 / 完成 / 出现 / 普及）"],ex:[["据官方报道，尚未查明身份的罪犯盗窃了1800万个电子邮件账户及其密码……","",1],["所谓潜在的市场，就是客观上已经存在或即将形成，但尚未被人们认识的市场。","Thị trường tiềm năng là thị trường đã tồn tại hoặc sắp hình thành nhưng chưa được nhận biết."],["……就像一个久病初愈的人刚刚走下病床，身心的疲倦尚未消退，便一脚踏入了飞驰向前的竞争轨道。","…mệt mỏi còn chưa tan, đã bước ngay vào đường đua cạnh tranh."]],tips:["Bài tập 2⑤."],practice:{q:"请把下列6个小句组合成3个连贯的语段：A. 生活的全部意义在于无穷地探索尚未知道的东西　B. 战后，人们生活已有所好转，由于电视尚未出现，电影便成了当时最热门的娱乐　C. 再差劲的电影都不必担心没有观众，这使制片公司和电影院老板笑逐颜开　D. 由于大学阶段学业尚未完成，事业尚未确立，经济上也尚未独立　E. 在于不断地增加更多的知识　F. 大学生即使谈恋爱成功率也不高",type:"complete",items:[["语段（1）：? + ?","A + E"],["语段（2）：? + ?","B + C"],["语段（3）：? + ?","D + F"]]}},{id:"g3",grp:2,word:"急功近利",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>日新月异</span> = thay đổi từng ngày. <span class='zh'>苦尽甘来</span> = khổ tận cam lai. <span class='zh'>急功近利</span> = chạy theo lợi trước mắt. <span class='zh'>家喻户晓</span> = nhà nhà đều biết. <span class='zh'>无穷无尽</span> = vô tận. <span class='zh'>迄今为止</span> = đến nay. <span class='zh'>爱不释手</span> = yêu không rời tay. <span class='zh'>触目惊心</span> = nhìn mà kinh.",forms:["……日新月异","迄今为止，……","对……爱不释手"],ex:[["国内用户则希望尽快得到回报，甚至有些急功近利。","",1],["迄今为止众筹在国内还是一个看起来很美、做起来吃力的事情。","",1]],tips:["Bài tập 3."]},{id:"g4",grp:0,word:"乐趣",zh:"乐趣 / 兴趣",py:"lèqù / xìngqù",tag:"Xem 辨析 bên dưới",mean:"Đều là danh từ chỉ cảm xúc vui vẻ với sự vật, nhưng thường không thay nhau. <span class='zh'>乐趣</span>: <b>niềm vui</b> khi tham gia / sau khi tham gia; đi với <span class='zh'>感（觉）到 · 找到 · 成为 · 享受</span>. <span class='zh'>兴趣</span>: <b>sự yêu thích</b>, thái độ với sự vật, dùng được cả khi chưa tiếp xúc; đi với <span class='zh'>感 · 引起 · 怀着 · 培养</span>.",forms:["找到 / 享受 / 感到 + 乐趣","感兴趣 / 引起……的兴趣 / 培养兴趣"],ex:[["我们可以在网上学习，自由而不失乐趣。","",1]],tips:["<span class='zh'>×对篮球不感乐趣</span>."]}],BX:{grp:0,word:"乐趣",cols:["乐趣","兴趣"],pair:"乐趣 — 兴趣",same:["Đều là danh từ, có thể biểu thị <b>cảm xúc vui vẻ với sự vật</b>, nhưng thường không thay nhau.","他在音乐中找到了乐趣。他对音乐很感兴趣。"],diff:[["Biểu thị <b>niềm vui</b> khiến người ta thấy vui.","工作中的乐趣是无穷的。","Biểu thị <b>cảm xúc yêu thích</b>.<div class='zh' style='margin-top:4px'>这件事引起了我极大的兴趣。</div>"],["Dùng cho cảm nhận <b>khi tham gia</b> hoặc <b>sau khi tham gia</b> hoạt động.","他能在绘画中找到乐趣。","Thái độ với sự vật, hoạt động; dùng được cả khi <b>chưa tiếp xúc</b>, chưa tham gia.<div class='zh' style='margin-top:4px'>我还没看那部电影，但它已经引起了我的兴趣。</div>"],["Hay đi với “感（觉）到、找到、成为、享受”.","玩游戏已经成为了他生活中的乐趣。","Hay đi với “感、引起、怀着、培养”.<div class='zh' style='margin-top:4px'>我对篮球不感兴趣。</div>"]],task:{q:"选择“乐趣”或“兴趣”填空",cols:["乐趣","兴趣"],sample:!1,items:[["他那么喜欢下围棋，可我却感觉不到其中的____。",0,"感觉到 + 乐趣."],["____是可以培养的，多接触接触就喜欢了。",1,"培养 + 兴趣."],["只有乐观的人才能随时享受生活中的____。",0,"享受 + 乐趣."],["听说这本书极受年轻人的推崇，这引起了我的____。",1,"引起 + 兴趣 (chưa đọc)."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["沉<u>闷</u>","烦闷 · 苦闷 · 郁闷 · 闷闷不乐"],items:[["<u>审</u>查","审","审核 · 审阅 · 审美 · 审判"],["<u>缴</u>纳","缴","缴费 · 收缴 · 缴获 · 缴税"],["<u>股</u>份","股","股东 · 股票 · 股民 · 勾股定理"],["诈<u>骗</u>","骗","欺骗 · 蒙骗 · 骗术 · 骗局"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["屋子里坐满了人，谁也不发表意见，________。","沉闷","屋子里坐满了人，谁也不发表意见，气氛十分沉闷。"],["她每天忙个不停，________。","充实","她每天忙个不停，生活得很充实。"],["那个魔术师太神奇了，你________，他都能猜出来。","任意","……你任意抽一张纸牌，他都能猜出来。"],["我跟合伙人一起________。","筹备","我跟合伙人一起筹备这个重大项目。"],["在一些贫穷落后的偏远山区，________。","尚未","在一些贫穷落后的偏远山区，网络尚未普及。"],["他们这伙人________，引起了公愤。","大肆","他们这伙人大肆捕杀野生动物，引起了公愤。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["充实","无穷无尽","上瘾","乐趣","沉闷"],text:"旅游一改我们以往{沉闷}的生活，使它变得浪漫而{充实}；旅游不但可以让我们增长知识，旅行中的各种见闻还可以带给我们{无穷无尽}的快乐；因为旅行带给我们的{乐趣}多多，所以它是一件让人{上瘾}的事情。"},{bank:["渠道","迄今为止","交易","缴纳","坦白"],text:"有数据显示，{迄今为止}，中国手机用户大约为12.4亿户，约占全国总人口的92%。手机在人们的生活中已经必不可少，如今打电话只是手机的多种功能之一，上网、看书、网上{缴纳}各种费用、用手机随时随地进行股票{交易}……，手机大大地方便了人们的生活。特别是有了微信以后，手机为人们交友、聊天开辟了新的{渠道}，提供了新的方式。{坦白}地说，我们已经离不开手机了。"}]},EX4:{q:"请说一说下列语段中是怎样使用夸张的修辞方法的",items:[{src:"",task:"我住的房间，只有巴掌这么大。",model:"把房间的面积小夸张为巴掌的面积。（缩小夸张）"},{src:"",task:"他饿得可以把一头大象吃下去。",model:"把他的饥饿程度夸张为大象的体积。（扩大夸张）"},{src:"",task:"整个礼堂静得连掉根针都能听见。",model:"把礼堂安静的程度夸张为绣花针掉在地上的微小声音。"},{src:"",task:"天热得像下火一样，柏油路都烤化了。",model:"把天气炎热夸张为下火。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["互联网走进我们的生活以后，生活发生了哪些变化？","① 自如地…… ② 生活不再单调…… ③ 将……变成了可能 ④ 网上学习、找工作、设立个人网站 ⑤ 合伙集资买房","互联网让我们能自如地通话、视频，生活不再单调沉闷；它使异地购物、交易变为可能；我们可以在网上学习、找工作、设立个人网站，还可以合伙集资买房。"],["简述人们如何利用网络平台筹备买房？","① 众筹购房的好处…… ② 微信是众筹的主要渠道…… ③ 众筹的参与者…… ④ 大家在交流平台上谈……","众筹买房比市场价至少便宜30%；微信是主要渠道，通过审查、缴纳订金后就能进群，大家共同商议设计、户型和价格。参与者都是朋友或朋友的朋友，基本属于同一阶层。"],["众筹和众筹网站","① 什么是众筹？ ② 众筹在中国的发展怎么样？","众筹就是大家筹钱干一件事，广义的众筹指创业者通过网络向众人争取资金支持。中国首家众筹网站是“点名时间”，但国内用户急功近利，众筹看起来很美、做起来吃力。"],["人们为什么对互联网也会心存担忧？","① 假网站 ② 网络黑客","有罪犯盗窃电子邮件账户和密码，有皮包公司冒充国家部门开设假网站进行诈骗，还有网络黑客，这些事件让人触目惊心。"]]},PZ:{title:"修辞（11）夸张",vn:"Phóng đại (thậm xưng)",intro:"Cố ý miêu tả sự vật khách quan <b>to lên hoặc nhỏ đi</b> — gọi là <b>夸张</b>. Giúp làm nổi bật bản chất, đặc trưng của sự vật, khơi gợi trí tưởng tượng phong phú.",ex:[["它能让我们自如地通话、视频、传递消息，哪怕你在天涯海角。","“天涯海角” — phóng đại khoảng cách xa."],["他种的瓜不光甜，几十里外就能闻到瓜香。","Phóng đại mùi thơm."],["看见这鲜绿的麦苗，就闻出白面包子的香味来了。","Phóng đại theo kiểu “vượt trước” — nhìn mạ đã ngửi thấy bánh bao."]],q:"下列哪句没有使用夸张修辞手法",pvn:"(1) 我们年轻的时候攒点儿钱多难呐，真是恨不得一分钱掰成两半花。　(2) 密密麻麻的雨点从天空噼里啪啦落了下来。　(3) 阿姨说张大夫医术高明，看见他，病就好了一半。",practice:[["Câu nào KHÔNG dùng 夸张？","(2) — miêu tả thực. (1) “一分钱掰成两半花”, (3) “看见他，病就好了一半” đều phóng đại."]]},DP:[{title:"词汇（1）：法律方面的词语",vn:"Từ ngữ pháp luật — điền từ.",items:[["公证","gōngzhèng","công chứng","公证财产","现在很多年轻人在结婚前都要公证一下自己的婚前财产。"],["辩护","biànhù","bào chữa","请律师辩护","虽然他犯罪了，但他有权请律师为自己辩护。"],["诽谤","fěibàng","phỉ báng","对我的诽谤","你说的这些事完全是无中生有，这是对我的诽谤。"],["宪法","xiànfǎ","hiến pháp","最高法","宪法是国家的最高法，具有最高的法律效力。"],["走私","zǒusī","buôn lậu","走私香烟","他试图逃避海关检查，打算走私大批香烟入境。"],["判决","pànjué","phán quyết","法官判决","案件审理结束，法官判决如下：甲方赔偿乙方的所有损失。"],["当事人","dāngshìrén","đương sự","走访当事人","为了调查案情，警察走访了许多当事人。"],["治安","zhì'ān","trị an","社会治安","这个区域的社会治安良好，从未发生过恶性案件。"]]},{title:"词汇（2）：政治方面的词语",vn:"Đọc đoạn: 在新一届总统选举中，两大政<b>党</b>各有一名<b>候选</b>人，A党的候选人是刚刚<b>晋升</b>为党主席的X先生……X先生<b>当选</b>为新一届总统，作为国家的最高<b>行政</b>长官，他<b>任命</b>了最高法院的院长。",items:[["政党","zhèngdǎng","chính đảng","两大政党","两大政党各有一名候选人。"],["候选人","hòuxuǎnrén","ứng cử viên","总统候选人","他是总统候选人。"],["晋升","jìnshēng","thăng chức","晋升为主席","他刚刚晋升为党主席。"],["当选","dāngxuǎn","đắc cử","当选为总统","X先生当选为新一届总统。"],["行政","xíngzhèng","hành chính","最高行政长官","总统是国家的最高行政长官。"],["任命","rènmìng","bổ nhiệm","任命院长","他任命了最高法院的院长。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"不知不觉中，互联网已经进入了我们的生活。我们可以通过互联网得到海量信息，从天文到地理，从深水到太空，从远古到现代，从国内到国外；我们可以通过互联网学习，浏览新闻杂志，获知发生在世界各地的时事要闻。互联网给我们的生活带来了乐趣，使我们的生活变得更加充实。",o:["网络的信息资源很有限","互联网充实了我们的生活","我们可以通过互联网环游世界","互联网让我们进入别人的生活"],a:1,why:"“使我们的生活变得更加充实”. Có <span class='zh'>乐趣 · 充实</span>."},{n:2,say:"我们班一大半同学都有手机，虽然每次上课老师都要求我们关掉手机，但关不关就看自己了，很多人都把手机调到振动状态，在桌子下面偷偷玩。很多同学都对发短信上瘾，有同学喜欢自己编写各种短信，下课的时候还比较谁的短信新鲜好玩。",o:["很多同学玩儿游戏上瘾","下课后大家会比较谁的手机好","老师对手机的管理不那么严格","老师脾气好，学生不听话就算了"],a:2,why:"“关不关就看自己了” → không quản chặt. A sai: nghiện nhắn tin."},{n:3,say:"作为年轻人，我们上网更多的是消遣和娱乐，有许多同龄人认为，网络这个完全虚拟的世界是我们放松自己的最佳场所。也许正因为这一点，我们的家长和老师才会对学生上网表现出不同程度的抵制，因为他们认为网上的娱乐分散了我们过多的精力，会对学业造成影响；更为重要的是，他们害怕网络上的不良信息对我们的身心不利。",o:["家长和老师担心互联网诈骗","家长和老师担心互联网让人变懒","家长和老师担心互联网让人急功近利","家长和老师担心互联网会分散学生的精力"],a:3,why:"“网上的娱乐分散了我们过多的精力”."},{n:4,say:"钱包不带没关系，手机千万不能忘，人们越来越深刻地感受到：在手机支付已成为重要的支付方式的今天，出门已不必非要手机、钱包、钥匙一样都不能少。互联网之所以能够进入金融业，不是因为互联网天生能做金融，而是因为传统的金融业忽略了网络支付功能。",o:["互联网天生适合做金融","出门丢什么都不能丢手机","如今手机支付已十分普遍","手机、钱包、钥匙必须随身带"],a:2,why:"“手机支付已成为重要的支付方式”."},{n:5,say:"与传统的房地产开发模式相比，众筹建房的确大大缓解了房地产企业的销售压力。以往，在开发商的总成本中，融资成本和销售成本分别占比7%和3%左右，如今通过互联网设立的融资平台，房企绕过银行获得了新的融资渠道，从而将融资成本大大降低。另一方面，合伙众筹的成员也有机会从中受益，不但房价更合算，并且可以按照自己的需求定制房产，满足个性化需求。",o:["众筹建房会增加融资成本","众筹建房的成员可以定制房产","房地产企业在众筹建房中很尴尬","传统房地产开发模式销售压力更小"],a:1,why:"“可以按照自己的需求定制房产”. Có <span class='zh'>设立 · 渠道 · 合伙 · 成员 · 合算</span>!"}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您好！您能不能重点跟我们谈谈，社交网站给传统交往方式带来了哪些影响？\n男：最近几年，社交网络非常流行。用户可以在网站创建一个公开或半公开的个人账号，展示和自己有联系的其他用户，查看和搜索与自己有联系的用户以及与朋友有联系的用户，还能交到新朋友，和更多的人建立起联系。\n女：这是人们使用网站的主要目的吗？\n男：还不是。\n女：那人们使用社交网站的主要目的是什么呢？\n男：应该说，社交网站主要体现的还是现实世界中的人际关系。社交网站使我们能够和平时不常见的人保持联系，但是要注意，介绍陌生人给你并不是社交网站的意图。\n女：那现实中的友谊和互联网中的友谊有什么区别呢？\n男：现实中的友谊和互联网上的友谊并不相同。在线联系并不意味着你们交换过电话号码，对于一些联系人，也许你觉得线上交流比线下交流舒服。网上的友谊一般是慢慢积累起来的，人们一般会在网上增加联系，而不会切断联系。而且，我们和朋友在网上的交流方式也不一样，比如在网上我们的交流更加简洁，而不是专注的、较长时间的对话。\n女：在线上社交网络中，我们不仅维护着和所有朋友的珍贵友情，还能看到他们和其他人的交往和互动。这一点比在现实生活中要容易得多。\n男：确实，有时候，你的线上好友传上一组照片，你会发现他们刚和你去了同一个国家……突然之间，你和好友的距离一下子就拉近了，对好友的日常生活一下就有了了解。也许你还会发现和你线上好友互动的人中，也有你的朋友，而你之前并不知道他们认识，这对于你，也许是一份惊喜。",qs:[{n:6,q:"人们在社交网站上可以做什么？",o:["炫耀和自己有联系的朋友","查看其他网络用户的账号","通过朋友交到更多的朋友","建立自己公开或半公开的账号"],a:3,why:"“用户可以在网站创建一个公开或半公开的个人账号”."},{n:7,q:"人们使用线上社交网站的主要目的是什么？",o:["迅速扩大朋友的范围","和更多的陌生人成为朋友","和不易见面的朋友保持联系","与已失联的朋友重新建立联系"],a:2,why:"“能够和平时不常见的人保持联系”."},{n:8,q:"与网上交流方式相比，线下交流的特点是什么？",o:["交流更加简洁","联系更加频繁","对话更加专注","对话时间更短"],a:2,why:"Trên mạng ngắn gọn, “而不是专注的、较长时间的对话” → ngoài đời chuyên chú hơn."},{n:9,q:"互联网中的友谊有什么特点？",o:["交流起来更加任性","不想联系了就自然断交","都不要对方的电话号码","建立友谊尤其靠日积月累"],a:3,why:"“网上的友谊一般是慢慢积累起来的”."},{n:10,q:"根据对话，什么情况下，我们会有惊喜？",o:["看到朋友传上的照片","和朋友一块儿去旅游","发现和朋友住得很近","发现和朋友有共同的朋友"],a:3,why:"“和你线上好友互动的人中，也有你的朋友……这……是一份惊喜”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"电脑和人脑尽管在传送信息方式上表现不同，但两者在诸多功能上非常类似。比如，电脑和人脑都可以存储记忆；电脑和人脑都可以通过修正，执行新的任务；电脑和人脑都有探知所处周围环境的能力，并据此做出反应，进行调整并适应所在的环境。\n电脑与人脑的最大区别在于意识。尽管我们很难描述意识，但却知道它的存在。电脑没有意识，尽管它具有惊人的运算速度，但却无法体验情绪、梦想和思维，而情绪、梦想和思维却是我们之所以成为人类的必备元素。\n是否会有“像人一样思考和行动”的机器出现呢？目前没有肯定的答案。不过，科学家对人脑和电脑的研究正在缩小它们之间的差距。",qs:[{n:11,q:"电脑与人脑的相似之处是什么？",o:["适应所处的环境","追忆往事的能力","探知未知的潜能","改变环境的愿望"],a:0,why:"“适应所在的环境”."},{n:12,q:"电脑与人脑的最大区别是什么？",o:["意识的有无","记忆存储的多少","计算速度的快慢","适应环境的快慢"],a:0,why:"“最大区别在于意识”."},{n:13,q:"是否会有“像人一样思考和行动”的机器出现呢？",o:["肯定会有","肯定不会有","目前没有肯定的答案","现在已经发明出来了"],a:2,why:"“目前没有肯定的答案”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"有人出门旅行或者到一个新城市工作抑或生活，都会选择通过网络寻找住房。通过网络寻找住房，不仅快捷方便，还有很多意想不到的惊喜。某租房平台最近就投入500万，启动了一项用户补贴行动。租房平台将以发放优惠券的形式，给租客报销未来12个月的房租，租客最高享受补贴可达2400元。同时还对房东承诺24小时闪电出租，并有大额房屋财产保险赠送。\n租房平台创始人小王说：互联网租房行业并不需要纯信息服务的中介，事实上有超过一半的租房交易都是房东和房客直接接触完成的。对于租客，租房平台承诺提供全程随时联络，百分百个人房源。对于房东，租房平台提供的租客身份审查，按时缴纳房租都是最受欢迎的服务。\n最快的租赁速度，最低的交易成本，最高的交易效率，更好的租房体验，更具品质的租住生活，快速与安全，这才是核心目标。而这一切的实现，都将得益于网络的发展。",qs:[{n:14,q:"根据本文，网络租房最大的好处是什么？",o:["价格适中","快捷方便","有优惠券","有意外惊喜"],a:1,why:"“不仅快捷方便，还有……惊喜”."},{n:15,q:"根据本文，房东在某租房平台能得到什么惊喜？",o:["房屋平台有保险相送","有机会中500万大奖","平台多给一年的房租","可享受国家给的补贴"],a:0,why:"“有大额房屋财产保险赠送”."},{n:16,q:"对于房东，租房平台最受欢迎的服务是什么？",o:["提供海量租房信息","保证百分百个人房源","为租住双方节省时间","确保租客身份的真实性"],a:3,why:"“租客身份审查，按时缴纳房租”. Có <span class='zh'>审查 · 缴纳 · 交易</span>!"},{n:17,q:"关于网络租房的核心目标，下列哪项正确？",o:["网上支付房租","筛选出优质房源","为租赁双方保密","做到既快速又安全"],a:3,why:"“快速与安全，这才是核心目标”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["每个人都把这些樱花树看是中日友好的象征。","与会代表还听取了第四届乒乓球赛筹备情况的报告。","我们要以最大的努力去落实政策，一直到问题解决为止。","他有时无意中买到一本喜欢的书，回家后简直爱不释手。"],a:0,why:"<b>Kết cấu sai</b>: <span class='zh'>把……看是……</span> → <span class='zh'>把……看作……</span>."},{n:19,o:["他很不懂浪漫，对妻子连一句也没说体贴的话。","借口情况变化而全盘否定历史、抛弃传统，是错误的。","深夜，两名不法分子冒充公安人员将刘兵寄存的包骗走了。","一个年轻人饮酒后，仗着酒劲，竟公然在马路上持刀追逐行人。"],a:0,why:"<b>Trật tự từ</b>: <span class='zh'>连一句也没说体贴的话</span> → <span class='zh'>连一句体贴的话也没说</span>."},{n:20,o:["布尔顿当时在新奥尔良的乐师中有“国王”之称，由他组建的乐队很快就家喻户晓了。","那个人对记者说：“公主病了，因此今天不能开招待会了，等公主治好病才安排吧。”","这次的谈话，先生兴奋极了，虽然大部分是牢骚话，但他说得都极其风趣，使我们笑得合不拢嘴。","公司实行股份制后，原来的企业职工多数将成为股东，对形成职工与企业命运共同体极为有利，同时便于企业吸收社会资金用于生产。"],a:1,why:"<b>Dùng từ sai</b>: <span class='zh'>公主治好病</span> (公主 không phải người chữa) → <span class='zh'>等公主病好了</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"在网页游戏发展史中，不得不提“偷菜游戏”。偷菜游戏具有明显的游戏特点，___互动互助，好友越多越有趣。每天用户只需要上线给自己或者帮好友的作物浇浇水、杀杀虫、除除草、收收果实___，如果有损友来玩家农场里使坏或者盗取果实，农场的狗也可以抓住他。该游戏不仅可以___用户上线的积极性，还可以促使用户发起与站内好友的互动。",o:["追求　即时　发动","希望　即便　变动","注意　就可　调节","讲究　即可　调动"],a:3,why:"<span class='zh'>讲究互动</span>; <span class='zh'>……即可</span>; <span class='zh'>调动积极性</span>."},{n:22,text:"人们在大规模数据的基础上可以做到的事情，在小规模数据的基础上是无法完成的。全球新产生数据年增40%，即信息总量每两年就可以翻番，而且这一趋势还在___。___能够更有效地组织和使用大数据，人类将得到更多的机会___数据对社会发展的巨大推动作用。研究证明，通过大数据和幂律分布分析，人类行为93%是可以___的，成为“已经发生的未来”。",o:["加速　倘若　发挥　预测","加大　若干　产生　预报","加深　假若　发展　测算","加多　若非　发生　估计"],a:0,why:"<span class='zh'>趋势在加速</span>; <span class='zh'>倘若</span>; <span class='zh'>发挥作用</span>; <span class='zh'>预测</span>."},{n:23,text:"近些年，全球兴起金融___，在中国，移动金融、投资和贷款似乎成了主流。在手机客户端的帮助下，在这个有着13亿人口和7.8万亿美元的市场里，___科技公司正在向银行等传统机构发起___。迄今为止，在中国注册手机银行业务的有3.9亿人，这超过了美国总人口，___全球手机银行客户的40%。",o:["创先　广大　攻击　位","创新　众多　挑战　占","创造　多数　战斗　居","开创　当众　斗争　有"],a:1,why:"<span class='zh'>金融创新</span>; <span class='zh'>众多</span>; <span class='zh'>发起挑战</span>; <span class='zh'>占……40%</span>. Có <span class='zh'>迄今为止</span>!"}]},read3:{ins:"第24–28题：选句填空。",text:"“忽如一夜春风来，千树万树梨花开”，似乎在一夜之间，(24)。在《环球科学》杂志2013年评选出的2012年最值得铭记、对人类社会产生影响最为深远的十大新闻中，“3D打印”位列第九，(25)。\n与此同时，3D打印技术在全球的推广也正在以惊人的速度增长。房子、足球鞋、手枪、骨骼……(26)，将原本难以实现的设想一一转化成现实。全球3D打印机制造巨头之一的美国3DSystems公司负责全球市场营销的副总裁凯西·刘易斯曾自信满满地说：“有了3D打印，一切不再复杂，3D打印机几乎可以创造任何东西。”\n在企业、科研机构和媒体的互动下，3D打印的未来似乎一片光明，甚至频频被提到或将带来“第三次工业革命”的高度。(27)？\n其实，3D打印背后的技术并不新鲜，早在一二十年前，(28)。为何在出现多年后才突然燃起3D打印的关注热潮？3D打印正在改变什么，未来还能改变什么？仅仅是一次概念热潮，还是真的将带来一场生产方式变革？我们拭目以待。",opts:["3D打印成了每个科技媒体乃至大众、时尚媒体争相报道的热门话题","它就开始以“快速成型技术”这一名称应用于汽车、航空航天模型设计中","3D打印已经被运用到各个行业中","理由是“3D打印将在制造业和科研领域引发一场革命”","3D打印真的会给制造业带来革命性的变化吗"],ans:{24:0,25:3,26:2,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"你是不是一直梦想着有另一个自己——双胞胎机器人，在赖床的时候，可以派它去上学？日本的机器人技术专家石黑浩一直在做这方面的研究。他制造了很多机器人，其中就有一个“他自己”。\n这位与石黑浩有着相同面孔的中年“男士”，坦白地说是由橡胶、气压装置、电子元件构成的，不过这位“男士”有一个身体组成成分和石黑浩相同，就是头发，这是从他本人头皮上取得的。机器人因为是固定的，所以还不能走出实验室去买东西，不过，它已经能够初步完成一些任务，就是模仿一个人。\n石黑浩坐在计算机前，远程控制他的机器人，一个麦克风用来捕捉他的声音，一台摄像机跟踪他的脸部和头部运动。当石黑浩说话时，机器人也跟着他做一样的动作。它也会眨眼、抽动，表现得像是在呼吸。不过，人类的一些行为也被刻意地抑制了。当石黑浩点起一根香烟时，机器人就不会继续模仿。石黑浩认为机器双胞胎是他的好助手。“我研究的问题是了解什么是人，我使用非常像人类的机器人来测试我的假设，比如人性、智能和行为。”他的研究领域是人机互动。",qs:[{n:29,q:"石黑浩是什么方面的专家？",o:["双胞胎医学专家","机器人技术专家","远程控制技术专家","机器人模仿行为专家"],a:1,why:"“日本的机器人技术专家石黑浩”."},{n:30,q:"“机器人石黑浩”哪一部分跟石黑浩本人相同？",o:["皮肤","头发","衣着","思想"],a:1,why:"“就是头发”."},{n:31,q:"机器人会模仿石黑浩的什么动作？",o:["出去买东西","走路、说话","眨眼、抽动","点起一根烟"],a:2,why:"“它也会眨眼、抽动”. Có <span class='zh'>坦白 · 初步</span>!"},{n:32,q:"石黑浩希望利用机器人：",o:["捕捉外界的声音","分析人体的运动","测试自己的假设","代替自己做研究"],a:2,why:"“使用非常像人类的机器人来测试我的假设”."}]},{ins:"第33–36题：请选出正确答案。",text:"近年来，在广阔的网络文化里，一批新兴网媒迅速崛起，成为新媒体的亮点。不仅如此，在网络社交发展的基础上，新型专业社交网站不断涌现，去年社交网站用户和访问量激增，吸引了诸多商业巨头纷纷进军社交网站。\n有专家指出：“随着互联网的社交功能日益发展，诸多网络应用已经成为人们进行交往的主要渠道，网络社交用户经过多年积累已成相当规模，这是社交网络热的必然条件。”\n社会学家则认为：“通过社交网站，商业公司不但可以收集手机号、用户账号等普通信息，还可以通过分析网民发布的博客、帖子、同学群体等，推测出用户的消费倾向（节俭还是奢侈）、个人婚姻情况（单身还是离婚）、工作情况（是否有跳槽的意向）等十分隐私的信息。社交网站的诸多争议吸引了大众的眼球，其新奇的社交功能吸引着用户，其病毒式的营销手段以及恶意竞争令人惊诧，甚至让人心生恐惧。”\n新媒体是把“双刃剑”，它在促进国家经济社会等方面发展的同时，也给经济、政治、文化、社会发展和国家安全、军事安全等诸方面带来严重甚至严峻的挑战。从一定意义上讲，谁掌握新媒体，谁就将掌控世界。面对这些严峻挑战，我们不能等闲视之。",qs:[{n:33,q:"关于近年的网络发展，下列哪项正确？",o:["网络自媒体如雨后春笋","社交网站用户大量增加","网上购物已经蔚然成风","独特的网络文化已然形成"],a:1,why:"“去年社交网站用户和访问量激增”."},{n:34,q:"对于网络发展，专家的观点是：",o:["“社交网络热”不会持久","互联网的社交功能仍有待发展","网络是现今人们进行交往的主要途径","网络已无法承载日益增加的网络社交用户"],a:2,why:"“已经成为人们进行交往的主要渠道”. Có <span class='zh'>渠道</span>!"},{n:35,q:"对于网络发展现状，社会学家认为：",o:["手机号成了收藏品","个人隐私易被泄露","网络病毒为害不浅","人们对网络爱恨交加"],a:1,why:"“推测出……十分隐私的信息”."},{n:36,q:"最后一段中“新媒体是把‘双刃剑’”是指新媒体：",o:["有利有弊","祸不单行","在快速发展","在挑战传统"],a:0,why:"<span class='zh'>双刃剑</span> = con dao hai lưỡi = vừa lợi vừa hại."}]}]},W:{zh:"写作",vn:"Viết văn: 互联网与我们（调查报告）",t:"35 phút",min:!0,task:"本课介绍了互联网时代的生活，有利也有弊。互联网在带给人们便捷的生活的同时，也给我们带来一些新的问题。互联网对你和你身边的人有什么影响呢。请寻找5个不同年龄、不同性别、不同职业的对象进行调查，将调查内容填入表中（性别、年龄、职业、每天上网多长时间、上网干什么、对互联网的主要看法），将调查内容以“互联网与我们”为题写一篇不少于400字的调查报告。",target:400,steps:[["Mở","Mục đích, đối tượng khảo sát (5 người, khác tuổi, giới, nghề)."],["Thời gian online","So sánh số giờ: <span class='zh'>最多……，最少……</span>."],["Làm gì","<span class='zh'>交易 · 缴纳 · 学习 · 看新闻 · 聊天</span>."],["Quan điểm","Lợi và hại: <span class='zh'>充实 · 乐趣 · 上瘾 · 诈骗 · 盗窃</span>."],["Kết luận","<span class='zh'>迄今为止 · 双刃剑 · 爱不释手的同时……</span>."]],outline:[["一 · 调查说明","目的、对象、方法"],["二 · 上网时间","不同人群的差别"],["三 · 上网内容","主要用途"],["四 · 看法","利与弊"],["五 · 结论","我的总结"]],model:"互联网与我们\n为了了解互联网对人们生活的影响，我调查了身边五个不同年龄、不同职业的人：61岁的退休教师王阿姨、45岁的出租车司机李师傅、35岁的公司职员陈女士、22岁的大学生小刘和15岁的中学生小张。\n调查发现，每个人每天上网的时间差别很大。大学生小刘上网时间最长，每天差不多6个小时；公司职员陈女士因为工作需要，每天上网4个小时左右；中学生小张平时要上学，只有周末才能多玩一会儿；王阿姨和李师傅上网时间最少，每天只有1个小时左右。\n大家上网做的事情也不一样。王阿姨主要看新闻、收发邮件；李师傅用手机接单、导航；陈女士在网上处理工作，还常常网购、缴纳各种费用；小刘在网上学习、看电影、和朋友聊天；小张最喜欢玩游戏。\n对于互联网，大家都认为它让生活变得更方便、更充实了，足不出户就能任意挑选商品，还能和远方的亲人视频。不过，大家也有担忧。王阿姨说上网很方便，但千万不要上瘾；陈女士曾经在网上购物时受过骗；李师傅担心个人信息被泄露；小张的妈妈则担心孩子玩游戏影响学习。\n通过这次调查，我发现互联网就像一把“双刃剑”。迄今为止，它已经成为我们生活中不可缺少的一部分，在我们对它爱不释手的同时，也应该学会合理地使用它，保护好自己。",check:["Có tiêu đề “互联网与我们”","Có giới thiệu đối tượng khảo sát (5 người)","Có so sánh thời gian online, nội dung, quan điểm","Có kết luận","Dùng ít nhất 4: 充实 · 任意 · 上瘾 · 缴纳 · 诈骗 · 迄今为止 · 爱不释手 · 坦白","Không ít hơn 400 chữ"]},SUM:{words:["日新月异","沉闷","充实","交易","任意","乐趣","设立","虚荣","珍贵","合伙","筹备","成员","初步","合算","渠道","审查","缴纳","摸索","层次","阶层","政策","欢乐","上瘾","慈善","股份","股东","钞票","苦尽甘来","尴尬","抛弃","坦白","急功近利","进展","牢骚","迄今为止","吃力","家喻户晓","无穷无尽","罪犯","盗窃","公然","冒充","大肆","诈骗","拘留","败坏","名誉","曝光"],patterns:[["任意 + V","我们足不出户就能任意挑选欧洲、美洲的商品。"],["尚未 + V","尚未查明身份的罪犯盗窃了1800万个电子邮件账户及其密码。"],["视……为……","人们视这一创举为互联网金融下的新成员。"],["在……的同时，也……","在我们对它爱不释手的同时，也不免对它心存担忧。"],["修辞：夸张","哪怕你在天涯海角"]],diff:["乐趣: niềm vui khi / sau khi tham gia (找到 · 享受 · 感到 + 乐趣) — 兴趣: sự yêu thích, cả khi chưa tiếp xúc (感兴趣 · 引起兴趣 · 培养兴趣)","尚未 (còn chưa) ≠ 尚且 (còn…, bài 34) · 缴纳 jiǎonà · 尴尬 gāngà · 迄今 qìjīn"],sentences:["它使我们的生活不再单调沉闷，每一天都变得浪漫、丰富和充实。","用发起人的话说，众筹不是在筹房子，而是在凝聚人心。","这就是互联网时代，在我们对它爱不释手的同时，也不免对它心存担忧。"],hw:["Học thuộc 48 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Khảo sát 5 người và viết báo cáo “互联网与我们” ≥400 chữ (mục 7).","Đặt 3 câu với 任意 và 3 câu với 尚未.","Làm Sách bài tập bài 39.","Đọc trước bài 40 — bài cuối!"]}});
