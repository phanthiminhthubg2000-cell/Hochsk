<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 24 · 体育明星们的离奇遭遇 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}

<script>window.LESSON={id:"hsk6-2-24",num:24,book:"HSK 标准教程 6（下）",unit:{n:6,zh:"趣味世界",vn:"Thế giới thú vị"},title:"体育明星们的离奇遭遇",vn:"Cảnh ngộ ly kỳ của các ngôi sao thể thao",chars:1043,source:"改编自《北京晚报》文章《体育明星们的“离奇伤害”》",goals:["Đọc hiểu bài báo 1043 chữ kể những <b>chấn thương ly kỳ, khó tin</b> của ngôi sao thể thao: do động vật, do bất ngờ, do sơ ý, do “vui quá hóa buồn”…","Dùng được 54 từ mới, nhất là nhóm <b>thể thao</b>: <span class='zh'>崇拜 · 冲击 · 拼搏 · 防守 · 进攻 · 裁判 · 胜负 · 赛事 · 主办</span> và nhóm <b>sự cố – tranh cãi</b>: <span class='zh'>阴谋 · 当场 · 中断 · 争议 · 打官司 · 谴责 · 凶手 · 冤枉 · 辩解 · 成心 · 疏忽 · 大意 · 遭受</span>.","Nắm <span class='zh'>紧缩句 · 特意</span>.","Phân biệt <span class='zh'>特意 — 故意</span>; làm quen <b>修辞 (2): 比拟 — nhân hóa / vật hóa</b>.","Viết bài “运动中的意外受伤” ≥400 chữ; luyện đề 缩写 HSK6."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (紧缩句) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (特意 · 特意—故意) · Đoạn 4–8 · 比拟 · Bài tập · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Dẫn",paras:"Đoạn 1",zh:"伤疤 ≠ 都是拼搏的标记",vn:"Ta tin mỗi vết sẹo là dấu ấn của nỗ lực — nhưng có khi chấn thương lại vô lý đến khó tin."},{tag:"承",name:"Do động vật",paras:"Đoạn 2–3",zh:"狗冲向门将；猫头鹰事件",vn:"Con chó lao vào thủ môn khiến anh giải nghệ; cầu thủ sút trúng con cú → tranh cãi đạo đức, suýt kiện tụng."},{tag:"转",name:"Bất ngờ & sơ ý",paras:"Đoạn 4–6",zh:"登机牌 · 警示牌 · 熨衣板 · 高尔夫球具 · 戒指",vn:"Thẻ lên máy bay đâm vào mắt; giẫm biển cảnh báo; gập bàn ủi; va môi; nhẫn cưới mắc rào → còn bị thẻ vàng."},{tag:"合",name:"Hoang đường nhất & kết",paras:"Đoạn 7–8",zh:"电钻处置血泡；只要你疏忽、大意",vn:"Tự dùng máy khoan điện chữa bọng máu; tai nạn ly kỳ theo sát mỗi người — chỉ cần lơ là, sơ ý."}],warm1:{q:"请对照图片熟悉下列名称，并想一想哪些可能给人类带来意外伤害。",vn:"Thứ nào có thể gây chấn thương bất ngờ? Bấm 有 (có thể) / 无.",items:[["🦉","猫头鹰 māotóuyīng","Con cú"],["⛳","高尔夫 gāo'ěrfū","Golf"],["⚠️","警示牌 jǐngshì pái","Biển cảnh báo"],["👕","熨衣板 yùn yī bǎn","Bàn ủi quần áo"],["🟨","黄牌 huángpái","Thẻ vàng"],["🔩","电钻 diàn zuàn","Máy khoan điện"]],talk:["你在运动中受过伤吗？是怎么受伤的？","你听说过哪些体育明星的趣事？"],link:"Tất cả 6 vật trong tranh đều xuất hiện trong bài khóa — đoán thử chúng gây chấn thương thế nào trước khi đọc!"},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"牌",rule:"牌 = <b>tấm biển, thẻ, huy chương</b>.",w:[["奖牌","jiǎngpái","huy chương (có trong bài)"],["金牌","jīnpái","HC vàng"],["银牌","yínpái","HC bạc"],["铜牌","tóngpái","HC đồng"],["车牌","chēpái","biển số xe"],["门牌","ménpái","biển số nhà"],["号牌","hàopái","bảng số"],["路牌","lùpái","biển chỉ đường"],["警示牌","jǐngshìpái","biển cảnh báo"],["黄牌","huángpái","thẻ vàng"],["登机牌","dēngjīpái","thẻ lên máy bay"],["牌子","páizi","biển; nhãn hiệu"]]},{k:"奋",rule:"奋 = <b>hăng hái, gắng sức</b>.",w:[["奋力","fènlì","dốc sức (có trong bài)"],["奋斗","fèndòu","phấn đấu"],["奋发","fènfā","phấn chấn"],["奋进","fènjìn","hăng hái tiến lên"],["奋起","fènqǐ","vùng lên"],["奋勇","fènyǒng","hăng hái dũng cảm"],["奋战","fènzhàn","chiến đấu hăng say"],["发奋","fāfèn","quyết chí"],["兴奋","xīngfèn","hưng phấn"],["勤奋","qínfèn","cần cù"],["奋不顾身","fènbúgùshēn","xả thân"]]},{k:"门",rule:"门 = <b>khung thành (bóng đá)</b>; cửa.",w:[["门将","ménjiàng","thủ môn (có trong bài)"],["门卫","ménwèi","bảo vệ cổng"],["球门","qiúmén","khung thành"],["柜门","guìmén","cửa tủ"],["射门","shèmén","sút bóng"],["守门","shǒumén","giữ khung thành"],["油门","yóumén","chân ga"]]},{k:"头",rule:"头 = <b>đầu, đứng đầu, đầu tiên</b>.",w:[["头条","tóutiáo","tin trang nhất (có trong bài)"],["头版","tóubǎn","trang nhất"],["头等","tóuděng","hạng nhất"],["头号","tóuhào","số một"],["头名","tóumíng","đứng đầu"],["头天","tóutiān","hôm trước"],["头一个","tóu yí gè","người đầu tiên"],["从头","cóngtóu","từ đầu"],["起头","qǐtóu","khởi đầu"],["排头","páitóu","người đứng đầu hàng"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Thủ môn & con chó",from:1,to:11},{name:"Nhóm 2 · Đoạn 3",sub:"Sự kiện con cú",from:12,to:31},{name:"Nhóm 3 · Đoạn 4–8",sub:"Bất ngờ, sơ ý, hoang đường",from:32,to:54}],V:[[1,"离奇","líqí","tt.","ly kỳ","ly kỳ, lạ lùng",0,"","（情节）不平常；出人意料。","体育明星们的离奇遭遇","这个故事情节很离奇。","Tình tiết câu chuyện này rất ly kỳ.",[],"Từ có dấu *."],[2,"崇拜","chóngbài","đgt.","sùng bái","sùng bái, tôn sùng, kính trọng",1,"","尊敬钦佩。","我们崇拜的体育明星","很多年轻人崇拜这位歌手。","Nhiều người trẻ hâm mộ ca sĩ này.",[],"Bài tập 3①. SBT nghe 6–10."],[3,"冲击","chōngjī","đgt.","xung kích","tấn công, đột kích",1,"","猛烈地攻击；（比赛中）力争夺取。","在赛场上冲击奖牌","他正在冲击世界纪录。","Anh ấy đang chinh phục kỷ lục thế giới.",["冲击奖牌","冲击纪录"],"Bài tập 3①."],[4,"拼搏","pīnbó","đgt.","bính bác","đọ sức, chiến đấu, đấu tranh",1,"","使出全部力量搏斗或争取。","奋力拼搏的标记","运动员们在赛场上顽强拼搏。","Các vận động viên chiến đấu kiên cường trên sân.",[],"Bài tập 3①."],[5,"聚精会神","jùjīng-huìshén","thành ngữ","tụ tinh hội thần","tập trung tinh thần, chăm chú",1,"成","集中精神，集中注意力。","在比赛中聚精会神地防守","学生们聚精会神地听课。","Học sinh chăm chú nghe giảng.",[],"Bài tập 2①. SBT câu 23."],[6,"防守","fángshǒu","đgt.","phòng thủ","phòng ngự, phòng thủ",1,"","警戒守卫；（比赛中）防备对方进攻。","聚精会神地防守","这支球队防守很严密。","Đội bóng này phòng ngự rất chặt chẽ.",[],""],[7,"火箭","huǒjiàn","dt.","hỏa tiễn","tên lửa, hỏa tiễn",1,"","利用反冲力推进的飞行器。","以火箭般的速度冲了进来","火箭发射成功了。","Tên lửa phóng thành công.",[],""],[8,"横","héng","tt.","hoành","ngang, từ một bên, sang một bên",1,"","跟地面平行的；从左到右或从右到左的。","横着冲向他的膝盖","他横着躺在床上。","Anh ấy nằm ngang trên giường.",[],"⚠️ Đọc <b>héng</b>; <span class='zh'>横 hèng</span> = ngang ngược."],[9,"进攻","jìngōng","đgt.","tiến công","tấn công, công kích",1,"","接近敌人并主动攻击；（比赛中）发动攻势。","向他发起进攻","我们队开始进攻了。","Đội ta bắt đầu tấn công.",[],"Bài tập 1 (ví dụ): <span class='zh'>攻击 · 攻克 · 攻打 · 攻占</span>."],[10,"阴谋","yīnmóu","dt.","âm mưu","âm mưu, mưu đồ",1,"","暗中策划的坏主意。","这是阴谋，还是离奇的巧合？","他们的阴谋被揭穿了。","Âm mưu của chúng đã bị vạch trần.",[],""],[11,"当场","dāngchǎng","phó.","đương trường","ngay tại chỗ, lập tức",1,"","就在那个地方和那个时候。","门将当场倒地","他当场就答应了。","Anh ấy đồng ý ngay tại chỗ.",[],"Bài tập 2②."],[12,"事件","shìjiàn","dt.","sự kiện","sự kiện",1,"","历史上或社会上发生的不平常的大事情。","猫头鹰事件","这一事件引起了广泛关注。","Sự kiện này gây chú ý rộng rãi.",[],""],[13,"遮挡","zhēdǎng","đgt.","già đáng","che, ngăn che",1,"","遮蔽拦挡。","遮挡住了球员的视线","树叶遮挡了阳光。","Lá cây che mất ánh nắng.",[],"Bài tập 1: <span class='zh'>抵挡 · 阻挡 · 挡箭牌 · 拦挡</span>."],[14,"裁判","cáipàn","dt.","tài phán","trọng tài",1,"","在体育比赛中执行评判工作的人。","主裁判出于保护动物的目的","裁判吹响了哨子。","Trọng tài thổi còi.",["主裁判"],""],[15,"中断","zhōngduàn","đgt.","trung đoạn","gián đoạn, ngắt ngang",1,"","中途停止或断绝。","决定中断比赛","因为下雨，比赛中断了。","Vì mưa, trận đấu bị gián đoạn.",[],"Bài tập 1: <span class='zh'>断裂 · 判断 · 断肠 · 断交</span>. SBT câu 24–28."],[16,"刹车","shā chē","đgt.","sát xa","phanh lại, thắng lại",1,"","用闸使车停止行进。","球员已经刹不住车","司机赶紧刹车。","Tài xế vội phanh xe.",["刹不住车"],"Nghĩa bóng: dừng lại."],[17,"防御","fángyù","đgt.","phòng ngự","phòng ngự",1,"","抗击敌人的进攻。","毫无防御的猫头鹰","人体有自我防御的能力。","Cơ thể con người có khả năng tự vệ.",[],"SBT nghe câu 1."],[18,"心态","xīntài","dt.","tâm thái","trạng thái tâm lý",1,"","心理状态。","这种只想赢球的心态","要保持良好的心态。","Phải giữ tâm lý tốt.",["心态好"],"Bài tập 3①."],[19,"南辕北辙","nányuán-běizhé","thành ngữ","nam viên bắc triệt","hoàn toàn trái ngược",1,"成","比喻行动和目的正好相反。","……的心态和比赛精神南辕北辙","你这么做和目标南辕北辙。","Làm thế này là đi ngược hẳn mục tiêu.",[],"SBT câu 22."],[20,"注重","zhùzhòng","đgt.","chú trọng","chú trọng, coi trọng",1,"","重视。","只注重胜负","这所学校很注重素质教育。","Trường này rất chú trọng giáo dục toàn diện.",[],"Bài tập 1: <span class='zh'>看重 · 着重 · 器重 · 重心</span>; 2③. SBT nghe 11–13."],[21,"胜负","shèngfù","dt.","thắng phụ","sự thắng bại",1,"","胜利或失败。","只注重胜负","比赛的胜负并不重要。","Thắng thua không quan trọng.",[],"Bài tập 3①."],[22,"残酷","cánkù","tt.","tàn khốc","tàn khốc, hung ác",1,"","凶狠冷酷。","残酷“射杀”致死的行为","竞争非常残酷。","Cạnh tranh vô cùng khốc liệt.",[],""],[23,"争议","zhēngyì","đgt.","tranh nghị","bàn cãi, tranh luận",1,"","争论。","引起了广泛的争议","这个问题还有争议。","Vấn đề này còn tranh cãi.",[],""],[24,"打仗","dǎ zhàng","đgt.","đả trượng","đánh trận, giao chiến",1,"","进行战争；进行战斗。","打了一场嘴仗","打仗要讲战术。","Đánh trận phải có chiến thuật.",["打嘴仗"],"<span class='zh'>嘴仗</span> = khẩu chiến. SBT câu 29."],[25,"打官司","dǎ guānsi","đgt.","đả quan ti","kiện, thưa kiện",1,"口","进行诉讼。","要和球员打官司","他们为这件事打了三年官司。","Họ kiện nhau ba năm vì chuyện này.",[],"Bài tập 3②. SBT nghe câu 5."],[26,"守护","shǒuhù","đgt.","thủ hộ","canh giữ, bảo vệ",1,"","看守保护。","猫头鹰是球场的守护神","他一直守护在母亲身边。","Anh luôn túc trực bên mẹ.",["守护神"],""],[27,"谴责","qiǎnzé","đgt.","khiển trách","khiển trách, lên án",1,"","严正申斥。","谴责球员就是凶手","全世界都谴责这种暴力行为。","Cả thế giới lên án hành vi bạo lực này.",[],"Bài tập 2④, 3②."],[28,"凶手","xiōngshǒu","dt.","hung thủ","hung thủ, kẻ giết người",1,"","行凶的人。","球员就是凶手","警察终于抓到了凶手。","Cảnh sát cuối cùng đã bắt được hung thủ.",[],"Bài tập 3②."],[29,"冤枉","yuānwang","đgt.","oan uổng","đổ oan, xử oan",1,"","没有事实根据，给人加上恶名。","在心中大呼冤枉","你冤枉我了，我没拿你的钱。","Anh đổ oan cho tôi, tôi không lấy tiền anh.",[],"Còn là tính từ = oan, uổng: <span class='zh'>冤枉钱</span> (SBT nghe câu 3)."],[30,"辩解","biànjiě","đgt.","biện giải","bào chữa, thanh minh",1,"","对受人指责的某种见解或行为加以解释。","为自己辩解","事实清楚，你不用再辩解了。","Sự thật rõ rồi, anh khỏi thanh minh.",[],"Bài tập 1: <span class='zh'>解释 · 解决 · 和解 · 解除</span>."],[31,"成心","chéngxīn","phó.","thành tâm","cố ý, cố tình",1,"","故意。","他不是成心的","你这是成心跟我作对吧？","Anh cố tình chống đối tôi phải không?",[],"⚠️ ≠ “thành tâm” tiếng Việt (chân thành) — <span class='zh'>成心</span> = cố ý! Bài tập 3②. SBT nghe câu 4."],[32,"意料","yìliào","đgt.","ý liệu","dự đoán",1,"","事先估计。","明星们遭受的伤害有时出人意料","结果出乎大家的意料。","Kết quả nằm ngoài dự đoán của mọi người.",["出人意料"],"SBT nghe 14–17."],[33,"频繁","pínfán","tt.","tần phồn","nhiều lần, thường xuyên",1,"","（次数）多。","因赛事频繁","两国交往频繁。","Hai nước giao lưu thường xuyên.",[],""],[34,"航空","hángkōng","dt.","hàng không","hàng không",1,"","指飞机在空中飞行。","航空旅行成了运动员的家常便饭","航空公司。","Hãng hàng không.",[],""],[35,"大意","dàyi","tt.","đại ý","không chú ý, sơ suất, cẩu thả",1,"","疏忽；不注意。","粗心大意","这次考试我太大意了。","Lần thi này tôi quá sơ ý.",["粗心大意"],"⚠️ <span class='zh'>大意 dàyi</span> (sơ ý) ≠ <span class='zh'>大意 dàyì</span> (ý chính). Bài tập 2⑤."],[36,"悲哀","bēi'āi","tt.","bi ai","xót xa, buồn đau",1,"","伤心。","令人悲哀的是","这是一件令人悲哀的事。","Đây là chuyện đáng buồn.",[],""],[3 "chỉ giáp","móng tay",1,"","指尖上面的角质硬壳。","脚指甲旁边长了个血泡","指甲长了，该剪了。","Móng tay dài rồi, nên cắt.",[],"SBT câu 18C."],[51,"处置","chǔzhì","đgt.","xử trí","xử lý, giải quyết",1,"","处理；安排。","他决定自己处置","这件事你看着处置吧。","Việc này anh xem mà xử lý.",[],"SBT câu 19B."],[52,"电钻","diàn zuàn","dt.","điện toản","máy khoan điện",0,"","用电做动力的钻孔工具。","选中的竟然是电钻","他用电钻在墙上打了个洞。","Anh ấy dùng máy khoan khoan một lỗ trên tường.",[],"Từ có dấu *."],[53,"遭受","zāoshòu","đgt.","tao thụ","bị, chịu",1,"","受到（不幸或损害）。","遭受了难以想象的痛苦","这个地区遭受了严重的水灾。","Vùng này hứng chịu lũ lụt nghiêm trọng.",[],""],[54,"微不足道","wēibùzúdào","thành ngữ","vi bất túc đạo","nhỏ nhặt không đáng kể",1,"成","非常渺小，不值得一提。","只是个微不足道的小手术","这点儿小事微不足道。","Chút chuyện nhỏ này không đáng kể.",[],"SBT câu 22."]],extra:[["奖牌","jiǎngpái","huy chương"],["伤疤","shāngbā","vết sẹo"],["奋力","fènlì","dốc sức"],["门将","ménjiàng","thủ môn"],["猫头鹰","māotóuyīng","con cú"],["迫降","pòjiàng","hạ cánh khẩn cấp"],["置……于不顾","zhì……yú búgù","bất chấp…"],["嘴仗","zuǐzhàng","khẩu chiến"],["家常便饭","jiācháng-biànfàn","chuyện cơm bữa"],["登机牌","dēngjīpái","thẻ lên máy bay"],["围栏","wéilán","rào chắn"],["血泡","xuèpào","bọng máu"]],T:[{zh:"每次看到我们崇拜的体育明星在赛场上冲击奖牌，大家都深信，他们身上的每一处伤疤都是奋力拼搏的标记。可是你知道吗，明星们受伤，有时竟也荒谬得不可思议。",vn:"Mỗi lần thấy ngôi sao thể thao mình hâm mộ chinh phục huy chương trên sân đấu, ai cũng tin chắc rằng mỗi vết sẹo trên người họ đều là dấu ấn của sự dốc sức chiến đấu. Nhưng bạn có biết, ngôi sao bị thương đôi khi lại phi lý đến mức không thể tin nổi.",idea:"Dẫn đề.",q:["课文从什么说起？"],note:[["荒谬得不可思议","Tính từ + 得 + bổ ngữ mức độ."]]},{zh:"曾经有一名足球门将正在比赛中聚精会神地防守，突然，一只狗以火箭般的速度冲了进来，横着冲向他的膝盖，然后向他发起进攻。人们惊呆了，这是阴谋，还是离奇的巧合？门将当场倒地，身受重伤，经久不愈，最后竟因此告别了他心爱的职业。",vn:"Từng có một thủ môn đang chăm chú phòng ngự trong trận đấu, bỗng một con chó lao vào với tốc độ như tên lửa, đâm ngang vào đầu gối anh rồi tấn công anh. Mọi người sững sờ — đó là âm mưu hay một sự trùng hợp ly kỳ? Thủ môn ngã ngay tại chỗ, bị thương nặng, lâu ngày không khỏi, cuối cùng vì thế mà phải chia tay nghề nghiệp anh yêu quý.",idea:"Con chó tấn công thủ môn.",q:["狗造成了什么伤害？"],note:[["以火箭般的速度","<span class='zh'>以……般的速度</span> = với tốc độ như…"],["经久不愈","Lâu ngày không khỏi."]]},{zh:"南美足球赛场上的猫头鹰事件，赛后成了头条新闻。事情是这样的，球赛进行得正激烈时，一只很可能是因受伤而“迫降”球场的猫头鹰遮挡住了球员的视线，主裁判出于保护动物的目的，决定中断比赛，可是一名球员已经刹不住车，一只大脚踢向了毫无防御的猫头鹰。可怜的猫头鹰，抢救两天后不治身亡。没想到一场道德讨论就此开始：有人认为想赢球也不能置猫头鹰的生命于不顾，这种只想赢球的心态和比赛精神南辕北辙。一时间，只注重胜负，却将猫头鹰残酷“射杀”致死的行为是否应该被原谅，引起了广泛的争议。人们结结实实地打了一场嘴仗，动物保护组织甚至要和球员打官司；一些球迷认为猫头鹰是球场的守护神，甚至谴责球员就是凶手；被称为“凶手”的球员一定在心中大呼冤枉，但他还是为自己的行为诚恳道歉，道歉之余却也没忘了为自己辩解——他不是成心的。",vn:"Sự kiện con cú trên sân bóng Nam Mỹ sau trận đấu đã thành tin trang nhất. Chuyện là thế này: khi trận đấu đang gay cấn, một con cú rất có thể do bị thương mà “hạ cánh khẩn cấp” xuống sân, che khuất tầm nhìn cầu thủ; trọng tài chính vì muốn bảo vệ động vật đã quyết định dừng trận, nhưng một cầu thủ đã không kịp “phanh”, tung một cú sút vào con cú không chút phòng vệ. Con cú đáng thương, cấp cứu hai ngày rồi chết. Không ngờ một cuộc tranh luận đạo đức bắt đầu từ đó: có người cho rằng muốn thắng cũng không thể bất chấp mạng sống con cú, tâm lý chỉ muốn thắng ấy đi ngược hẳn tinh thần thi đấu. Trong một thời gian, hành vi chỉ chú trọng thắng thua mà “sút chết” con cú một cách tàn nhẫn có nên được tha thứ hay không đã gây tranh cãi rộng rãi. Người ta khẩu chiến một trận ra trò, tổ chức bảo vệ động vật thậm chí muốn kiện cầu thủ; một số cổ động viên cho rằng con cú là thần hộ mệnh của sân bóng, thậm chí lên án cầu thủ chính là hung thủ; cầu thủ bị gọi là “hung thủ” chắc hẳn trong lòng kêu oan, nhưng anh vẫn thành khẩn xin lỗi về hành vi của mình, và xin lỗi xong cũng không quên thanh minh — anh không cố ý.",idea:"Sự kiện con cú.",q:["猫头鹰事件为什么引起了广泛的争议？"],note:[["“迫降”","Xem 修辞: 比拟 — dùng từ của máy bay cho con cú."],["想赢球也不能……","Xem Ngữ pháp 1: 紧缩句 (= 即使想赢球，也不能……)."],["置……于不顾","Bất chấp…"],["“射杀”","Ngoặc kép: dùng từ mạnh có chủ ý."]]},{zh:"明星们遭受的伤害有时出人意料。因赛事频繁，航空旅行成了运动员的家常便饭。你相信吗？登机牌也可能成为凶器。曾有运动员在机场被登机牌击中眼睛，并因此错过部分比赛。",vn:"Những tổn thương các ngôi sao gặp phải đôi khi nằm ngoài dự đoán. Vì lịch thi đấu dày đặc, đi máy bay đã thành chuyện cơm bữa với vận động viên. Bạn tin không? Thẻ lên máy bay cũng có thể thành hung khí. Từng có vận động viên ở sân bay bị thẻ lên máy bay đâm vào mắt, vì thế bỏ lỡ một phần giải đấu.",idea:"Thẻ lên máy bay.",q:["什么是出人意料的伤害？"],note:[["家常便饭","Chuyện cơm bữa."]]},{zh:"我们每个人都有过粗心大意的时候，令人悲哀的是，这也可能成为被伤害的原因。一次赛前热身，主办方特意做了警示牌，警告运动员不要在球门里训练，有位运动员一时疏忽正好踩在了警示牌上，由于重心不稳，以致扭伤了脚；还有位同样疏忽的运动员，在折叠熨衣板时肩膀受伤；某国国脚有一次不仅磕破了嘴唇，还磕掉了门牙，当时他仅仅是想从汽车里拽出高尔夫球具。",vn:"Ai cũng có lúc sơ ý, điều đáng buồn là đó cũng có thể thành nguyên nhân bị thương. Một lần khởi động trước trận, ban tổ chức đặc biệt làm biển cảnh báo, nhắc vận động viên không tập trong khung thành; một vận động viên nhất thời lơ đễnh giẫm đúng lên biển cảnh báo, mất thăng bằng nên trẹo chân; một vận động viên cũng lơ đễnh như vậy bị thương vai khi gập bàn ủi; một tuyển thủ quốc gia nọ có lần không chỉ va rách môi mà còn gãy cả răng cửa, lúc đó anh chỉ định lôi bộ đồ chơi golf ra khỏi ô tô.",idea:"Do sơ ý.",q:["粗心大意造成了哪些伤害？"],note:[["主办方特意做了警示牌","Xem Ngữ pháp 2: <span class='zh'>特意</span>."],["以致……","Đến nỗi (kết quả xấu)."]]},{zh:"汉语有个词叫乐极生悲，说的就应该是下面这位球员：在打进一球后，他冲入观众席和球迷一起庆祝，结果结婚戒指连同他的手指一起挂在了围栏上，手指受重伤。更让他恼火的是，不了解情况的主裁判还给了他一张黄牌，真可谓雪上加霜！",vn:"Tiếng Hán có từ “vui quá hóa buồn”, chắc là nói về cầu thủ sau đây: ghi bàn xong, anh lao vào khán đài ăn mừng cùng cổ động viên, kết quả nhẫn cưới cùng ngón tay mắc vào rào chắn, ngón tay bị thương nặng. Điều khiến anh bực hơn là trọng tài chính không nắm tình hình còn rút cho anh một thẻ vàng — đúng là họa vô đơn chí!",idea:"Vui quá hóa buồn.",q:["这位球员为什么“乐极生悲”？"],note:[["连同……一起","Bài 18."],["真可谓……","Thật có thể nói là…"]]},{zh:"最荒唐的受伤当属某国国脚。他的脚指甲旁边长了个血泡，他决定自己处置。各种工具他都看不上，最后选中的竟然是电钻，由于用力过猛，把脚弄破了，以致感染，遭受了难以想象的痛苦。看来医生也不是谁想当就能当的，虽然在真正的医生眼里这只是个微不足道的小手术。",vn:"Chấn thương hoang đường nhất phải kể đến một tuyển thủ quốc gia nọ. Cạnh móng chân anh mọc một bọng máu, anh quyết định tự xử lý. Dụng cụ nào anh cũng chê, cuối cùng chọn lại là máy khoan điện; vì dùng lực quá mạnh làm rách chân, đến nỗi nhiễm trùng, chịu đau đớn khó tưởng tượng. Xem ra bác sĩ không phải ai muốn làm cũng được, dù trong mắt bác sĩ thật đây chỉ là một tiểu phẫu không đáng kể.",idea:"Hoang đường nhất.",q:["最荒唐的受伤是什么？"],note:[["当属……","Phải kể đến… (văn viết)."],["谁想当就能当","紧缩句 = 无论谁想当，都能当."]]},{zh:"其实离奇伤害不仅存在于运动员当中，它也紧紧跟随着我们每一个人，只要你疏忽、大意。",vn:"Thật ra những tổn thương ly kỳ không chỉ tồn tại trong giới vận động viên, nó cũng theo sát mỗi chúng ta — chỉ cần bạn lơ là, sơ ý.",idea:"Kết: cảnh tỉnh.",q:["作者想告诉我们什么？"],note:[["它也紧紧跟随着我们","比拟: “tổn thương” được viết như người bám theo."],["……，只要你……","Đảo điều kiện ra sau để nhấn mạnh."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:1,word:"",zh:"紧缩句",py:"jǐnsuōjù",tag:"Chú thích 1 · câu rút gọn",mean:"<b>Câu rút gọn</b>: dùng hình thức câu đơn để diễn đạt nội dung <b>câu phức</b>. Trông như câu đơn nhưng thực ra là câu phức, chỉ là đã bỏ <b>chỗ ngắt giọng, từ quan hệ</b>, thậm chí một số thành phần. Rất hay gặp trong khẩu ngữ.",forms:["（即使）A 也 B → A 也 B","（只要）A 就 B → A 就 B","（要是）不 A（我）就 B → 不 A 就 B"],ex:[["想赢球也不能置猫头鹰的生命于不顾。","(= 即使想赢球，也不能……)",1],["她一回来我就告诉你。","(= 只要她一回来，我就告诉你。)"],["站住！不站住就开枪了。","(= 站住！你要是不站住，我就开枪了。)"]],tips:["Mẫu hay gặp: <span class='zh'>越A越B · 非A不可 · 不A不B · 一A就B · 再A也B</span>.","Bài khóa: <span class='zh'>医生也不是谁想当就能当的</span>."],practice:{q:"将下列复句改为紧缩句",type:"complete",items:[["即使得罪她，咱也不怕。","得罪她咱也不怕。"],["就算你不说，我也能知道。","你不说我也能知道。"],["如果你不喜欢，咱们就不买。","（你）不喜欢就不买。"]]}},{id:"g2",grp:2,word:"特意",zh:"特意",py:"tèyì",tag:"Chú thích 2 · phó từ",mean:"Phó từ, biểu thị <b>chuyên vì một việc nào đó</b> — “đặc biệt, riêng để, cất công”.",forms:["S + 特意 + V（vì một mục đích riêng）"],ex:[["一次赛前热身，主办方特意做了警示牌，警告运动员不要在球门里训练。","",1],["那一年我出差去天津，特意绕道北京，去了趟圆明园。","Năm ấy tôi đi công tác Thiên Tân, cất công vòng qua Bắc Kinh thăm Viên Minh Viên."],["城市生活的忙乱、嘈杂使人们渴望安静，因此地处边城的我的故乡就成了人们特意要来的旅游胜地了。","Cuộc sống đô thị ồn ã khiến người ta khát yên tĩnh, nên quê tôi nơi biên thành thành chốn du lịch người ta cất công tìm đến."]],tips:["Bài tập 2⑥."],practice:{q:"根据提示用“特意”完成句子",type:"complete",items:[["为了完成这次采访，________。（查阅）","为了完成这次采访，我特意查阅了被采访者的资料。"],["在动笔写这本书之前，________。（调查）","在动笔写这本书之前，我特意调查了相关数据。"],["这是________，知道你换了地方睡不好觉。（准备）","这是我特意为你准备的房间，……"]]}},{id:"g3",grp:1,word:"成心",zh:"成心 / 当场 / 大意",py:"chéngxīn / dāngchǎng / dàyi",tag:"Từ dễ nhầm",mean:"<span class='zh'>成心</span> = <b>cố ý</b> (khẩu ngữ, = 故意) — ⚠️ khác hẳn “thành tâm” tiếng Việt. <span class='zh'>当场</span> = <b>ngay tại chỗ</b>. <span class='zh'>大意 dàyi</span> = <b>sơ ý</b> (≠ <span class='zh'>大意 dàyì</span> ý chính).",forms:["不是成心的","当场 + V","粗心大意 · 千万别大意"],ex:[["道歉之余却也没忘了为自己辩解——他不是成心的。","",1],["门将当场倒地，身受重伤……","",1],["我们每个人都有过粗心大意的时候……","",1]],tips:["SBT nghe câu 4: <span class='zh'>那是成心不让人读</span>."]},{id:"g4",grp:2,word:"故意",zh:"特意 / 故意",py:"tèyì / gùyì",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>có chủ ý làm…</b>”, đều là phó từ đứng trước động từ. <span class='zh'>特意</span>: dụng tâm làm tốt việc gì, thường <b>tích cực</b>. <span class='zh'>故意</span>: biết không nên mà vẫn làm, thường <b>nghĩa xấu</b>; còn là danh từ (pháp luật).",forms:["特意 + V（tích cực）","故意 + V（tiêu cực）；存在……的故意"],ex:[["主办方特意做了警示牌……","",1]],tips:["Bài tập 2⑥."]}],BX:{grp:2,word:"故意",cols:["√ Đúng","× Sai"],pair:"特意 — 故意",same:["Đều có nghĩa “<b>có chủ ý làm…</b>”, đều làm <b>phó từ</b>, đứng trước động từ hoặc cụm động từ.","他特意 / 故意把礼物放在一个明显的位置，以便我一眼就能看见。"],diff:[["Thường là <b>dụng tâm cố gắng làm tốt</b> việc gì, hay có ảnh hưởng <b>tích cực</b> tới người / việc.","他特意从上海来到北京参加这次会议。 / 为了写好论文，他特意拜访了那位有名的学者。","<b>Biết rõ không nên / không cần</b> làm vậy mà vẫn làm, thường mang <b>nghĩa xấu</b>.<div class='zh' style='margin-top:4px'>小明故意把椅子撞倒了。 / 他故意借钱不还。</div>"],["<b>Không có</b> cách dùng bên phải.","—","Ngoài phó từ còn làm <b>danh từ</b> (thường trong pháp luật).<div class='zh' style='margin-top:4px'>他存在伤害对方的故意。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["对不起，我不是故意弄坏你的手表的。",0,"Việc xấu → 故意 đúng."],["你看见红灯亮了还不停，是特意的吧！",1,"Biết sai vẫn làm → phải dùng 故意."],["虽然造成了死伤5人的后果，但他并没有主观上的特意。",1,"Danh từ pháp luật → chỉ 故意 có cách dùng này."],["他故意为大家准备了丰盛的午餐，我们非常感动。",1,"Việc tốt, tích cực → phải dùng 特意."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["进<u>攻</u>","攻击 · 攻克 · 攻打 · 攻占"],items:[["遮<u>挡</u>","挡","抵挡 · 阻挡 · 挡箭牌 · 拦挡"],["中<u>断</u>","断","断裂 · 判断 · 断肠 · 断交"],["注<u>重</u>","重","看重 · 着重 · 器重 · 重心"],["辩<u>解</u>","解","解释 · 解决 · 和解 · 解除"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["在这位知名教授的课堂上，大家________。","聚精会神","在这位知名教授的课堂上，大家聚精会神地听讲。"],["昨天那儿发生了一起严重的交通事故，________。","当场","昨天那儿发生了一起严重的交通事故，司机当场死亡。"],["这所远近闻名的学校非常________。","注重","这所远近闻名的学校非常注重学生素质教育的培养。"],["听说那个孩子常被养父母虐待，大家都纷纷________。","谴责","听说那个孩子常被养父母虐待，大家都纷纷谴责他们。"],["在这个以精细著称的行业中，________。","大意","在这个以精细著称的行业中，大意是最不能出现的错误。"],["听说我马上要回国，妈妈________。","特意","听说我马上要回国，妈妈特意准备了我爱吃的家乡菜。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["胜负","心态","崇拜","拼搏","冲击"],text:"我们之所以{崇拜}体育明星，是因为他们是奋力{拼搏}的象征。比赛并不只注重{胜负}，我们更看重的是运动员们在{冲击}奖牌时表现出来的永不放弃的精神和良好的{心态}。"},{bank:["谴责","凶手","成心","官司","疏忽"],text:"顾客在商场购物意外身亡，{凶手}竟然是我们常见的自动扶梯！这一事件引起了广泛的关注。大家一致{谴责}电梯生产厂家粗制滥造，而商场也难逃责任，虽然不是{成心}的，但因为工作人员的{疏忽}而造成一人死亡的后果，他们肯定要面临一场{官司}。"}]},EX4:{q:"请说出下列句子是如何运用比拟的",items:[{src:"",task:"这时，春风送来扑鼻的花香，满天的星星都在眨眼欢笑。",model:"把星星比作眨眼欢笑的人。"},{src:"",task:"不负责任、马虎大意的工作作风必须休息。",model:"把工作作风比作需要休息的人。"},{src:"",task:"我到了自家的房外，我的母亲已经迎着出来了，接着便飞出了八岁的小女儿。",model:"把小女儿比作会飞的鸟儿。"},{src:"",task:"花儿羞答答地垂下头来。",model:"把花儿比作害羞低头的人。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["动物造成的伤害","① 狗造成的伤害 ② 猫头鹰事件","一只狗冲向正在防守的门将，门将身受重伤，告别了职业；一名球员踢死了迫降球场的猫头鹰，引起了广泛的争议。"],["出人意料的伤害","登机牌造成的伤害","有运动员在机场被登机牌击中眼睛，错过了部分比赛。"],["粗心大意造成的伤害","① 警示牌 ② 熨衣板 ③ 高尔夫球具","有人踩在警示牌上扭伤了脚；有人折叠熨衣板时肩膀受伤；有人拽高尔夫球具时磕破嘴唇、磕掉门牙。"],["乐极生悲造成的伤害","戒指挂在围栏上","一名球员进球后冲入观众席庆祝，戒指连同手指挂在了围栏上，还得了一张黄牌。"],["最荒唐的意外伤害","用电钻处置血泡","一名国脚用电钻处置脚上的血泡，结果感染，遭受了难以想象的痛苦。"]]},PZ:{title:"修辞（2）比拟",vn:"Nhân hóa / vật hóa",intro:"<b>比拟</b> là biện pháp tu từ dựa vào tưởng tượng: <b>viết vật như người</b> (拟人 — nhân hóa), <b>viết người như vật</b> (拟物), hoặc <b>viết vật A như vật B</b>.",ex:[["雨停了，天晴了，太阳露出了笑脸。","“Mặt trời” được nhân hóa, có tình cảm, động tác như người."],["这帮人就是欺软怕硬，你老实，他们就欺负你；你厉害，他们就夹着尾巴跑。","Viết người như con vật (cụp đuôi chạy)."],["球赛进行得正激烈时，一只很可能是因受伤而“迫降”球场的猫头鹰遮挡住了球员的视线。","Viết con cú như máy bay (hạ cánh khẩn cấp)."]],q:"指出下列哪句没有使用比拟修辞手法",pvn:"(1) 他故事讲得生动，孩子们竖起耳朵听得认真。　(2) 啄木鸟在给树治病。　(3) 太阳照进了窗子，亮得有些晃眼。",practice:[["Câu nào KHÔNG dùng 比拟？","(3) — chỉ miêu tả nắng chiếu. (1) 竖起耳朵 viết người như con vật; (2) chim gõ kiến “chữa bệnh” cho cây như bác sĩ."]]},DP:{title:"词汇：熟悉下列词语搭配",vn:"Các từ thuộc lĩnh vực chính trị – pháp luật – kinh tế.",items:[["发射 · 导弹","fāshè · dǎodàn","phóng · tên lửa","发射导弹","为了震慑敌人，他们发射了一枚导弹。"],["伪造 · 条款","wěizào · tiáokuǎn","giả mạo · điều khoản","伪造条款","由于伪造合同条款，他被判入狱十年。"],["纠纷","jiūfēn","tranh chấp","解决纠纷","这个机构是为解决邻里之间的纠纷而设立的。"],["申报","shēnbào","báo cáo, đăng ký","申报课题","针对这项研究，他申报了国家课题。"],["专利","zhuānlì","bằng sáng chế","申请专利","他的这项发明已申请专利。"],["转让","zhuǎnràng","chuyển nhượng","转让商铺 / 饭馆","由于经营不善，他被迫转让了自己的饭馆。"],["领土","lǐngtǔ","lãnh thổ","保卫领土","军人的使命就是保卫国家领土，寸土不让。"],["宣誓","xuānshì","tuyên thệ","宣誓就职","新当选的总统今天宣誓就职了。"],["冻结","dòngjié","phong tỏa","冻结财产","最近这家公司正在接受调查，因此公司财产都被冻结了。"],["司法 · 诉讼","sīfǎ · sùsòng","tư pháp · tố tụng","司法诉讼","这个案件已进入司法诉讼阶段。"],["人道 · 主义","réndào · zhǔyì","nhân đạo · chủ nghĩa","人道主义","这次国际救援体现了人类最崇高的人道主义精神。"],["种族","zhǒngzú","chủng tộc","种族主义","虽然现代文明的光芒已经照遍全球，但我们仍要警惕种族主义的抬头。"],["财政 · 赤字","cáizhèng · chìzì","tài chính · thâm hụt","财政赤字","管理不善导致地方政府出现了财政赤字。"],["周转","zhōuzhuǎn","quay vòng (vốn)","资金周转","大量商品滞销使该公司资金周转不灵。"],["流通","liútōng","lưu thông","商品流通","一旦商品进入流通领域，就主要看消费者的消费意愿了。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"在原始社会，生产力水平低下，人们为了获取食物、防御自然界的危险和侵袭，必须集体行动、共同协作才能生存下去。对集体的依赖性强化了人们的群体意识以及与集体同生共死的观念。",o:["自然界的危险时刻会危害人类","共同协作能够培养人的群体意识","原始社会，人要生存就离不开集体","生产力水平取决于人们的思想观念"],a:2,why:"“必须集体行动、共同协作才能生存下去”. B: chính xác là <b>sự phụ thuộc vào tập thể</b> củng cố ý thức nhóm."},{n:2,say:"老话说得好，当一个人变为两个人，两个人守护着一个共同的家，就必须各尽其责，关心对方、体贴对方、照顾对方、理解对方。美满的婚姻应该是两颗心的相守相依，两个人情感的互相给予。",o:["结婚后要改变过去的生活方式","老人的话都是宝贵的生活经验","美满婚姻有赖于两个人的经营","给予了才能得到，家庭也如此"],a:2,why:"“必须各尽其责……两个人情感的互相给予”. Có <span class='zh'>守护</span>."},{n:3,say:"暴发户文化最大的特征就是附庸风雅。暴发户的文化水平没有到，可是经济水平超过了，因此他会花很多冤枉钱，做很多冤大头的事情。比如说到哪儿都摆阔，房间里弄得金玉满堂，十分俗气。",o:["暴发户都没有文化","有钱不会花，就是暴发户","暴发户会花很多不该花的钱","说话人对房间俗气的摆设很恼火"],a:2,why:"<span class='zh'>冤枉钱</span> = tiền tiêu phí hoài (từ mới 冤枉!)."},{n:4,say:"那些学贯古今的大学者，何不编写一册通俗的传统文化读本。不要长篇巨制，那是成心不让人读；不要东拼西凑，那样不值得读。只要以成熟的态度，把古人的生存方式、智慧、经验、得失告诉我们，就像一册新时代的《三字经》，岂不是好事。",o:["说话人讨厌拼凑而成的书","说话人特别喜欢长篇小说","《通俗文化读本》是一本好书","真正有学问的人都能谈古论今"],a:0,why:"“不要东拼西凑，那样不值得读”. C: cuốn sách đó <b>chưa có</b>, chỉ là đề nghị."},{n:5,say:"她能说善辩，适合当律师。在课堂上，她们做过模拟律师辩护项目，她的表现极其出色。可她读过许多美国名律师写的小说，她知道律师们要想赚大钱就要为有钱有势的人打官司，她不想被钱、权、势所左右，所以她不想当律师。",o:["她有当律师的天分","她一直被钱所困扰","她不愿看律师写的小说","她认为为钱打官司很容易"],a:0,why:"“能说善辩，适合当律师……表现极其出色”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您今天能不能就马拉松这个话题和我们聊聊。\n男：马拉松运动起源于一个古老的故事。公元前490年，波斯军队入侵希腊，在雅典城东北的马拉松平原登陆，准备攻打雅典。当时雅典将军手下只有一万多人，面对的是10万装备精良的敌人。雅典士兵拼死奋战，结果他们赢了。雅典统帅大声喊道：“我们应该立刻把消息传送给雅典人民，从这儿到雅典有很长的一段路，谁能去？”刚从战场上回来的菲迪皮德思说：“我能，我跑得比谁都快！”接着他就奔赴雅典城。当到达雅典的时候，菲迪皮德思已经筋疲力尽，他高喊出“高兴吧，我们胜利了”，就永远地倒下了。\n女：很感人的一个故事，那这个故事怎么就变成了一项运动呢？\n男：1896年，第一届奥运会于雅典召开前，法国人米歇尔·布雷尔向现代奥林匹克运动的奠基人顾拜旦建议，增设一项以马拉松命名的长跑赛，以纪念马拉松战役和菲迪皮德思。希腊奥组委接受了这一建议，马拉松这个名词第一次出现在国际体坛。\n女：那马拉松长跑跑的是什么路线呢？\n男：就是昔日菲迪皮德思跑过的从马拉松到雅典的路线。\n女：那之后呢？\n男：之后几届奥运会的起点和终点都是组织者根据当地情况决定，长度也各不相同。直到1908年英国主办奥运会时，马拉松长跑总长度定为42.195公里，以后马拉松比赛的正式距离就以此为准了。\n女：这项比耐力、比速度、比技能、比拼搏精神的运动一定有很多有趣的故事吧？\n男：是啊。我最喜欢的是首届奥运会马拉松冠军的故事。比赛那天酷热难耐，路上灰尘满天，比赛的艰苦无法形容。希腊人路易斯第一个冲入运动场，全场欢声雷动，此时冠军已无悬念，担任总裁判的希腊王储情不自禁地陪着路易斯冲击终点。一束束鲜花，一件件礼物，投向人们崇拜的英雄，甚至有人高呼：让他当部长。\n女：后来呢？\n男：后来，他获得了希腊民族英雄的称号，仍然回到了偏僻的家乡，继续当他的乡村邮递员，和妻儿一起过着清贫的生活。",qs:[{n:6,q:"马拉松作为一项体育运动，是哪一年开始的？",o:["490年","1896年","1908年","2000多年前"],a:1,why:"Olympic đầu tiên 1896. A là năm trận chiến (TCN)."},{n:7,q:"关于马拉松运动的起源，下列哪项正确？",o:["那只是一个传闻","马拉松人都很能跑","这项运动与马拉松战役有关","为了表彰喜爱运动的希腊人"],a:2,why:"“以纪念马拉松战役和菲迪皮德思”."},{n:8,q:"在奥运会上设立马拉松长跑项目是谁提出的？",o:["顾拜旦","菲迪皮德思","希腊奥组委","米歇尔·布雷尔"],a:3,why:"“法国人米歇尔·布雷尔向……顾拜旦建议”."},{n:9,q:"关于今天奥运会马拉松长跑总长度，下列哪项正确？",o:["各国奥组委可自行决定","以马拉松到雅典的距离为准","奥组委根据当地情况临时决定","以1908年英国奥运会距离为准"],a:3,why:"“以后马拉松比赛的正式距离就以此为准了”."},{n:10,q:"根据这段采访可以知道什么？",o:["路易斯原本是个乡村邮递员","全世界都视马拉松冠军为英雄","长跑是希腊全民热爱的体育运动","路易斯拿到马拉松冠军后当了部长"],a:0,why:"“继续当他的乡村邮递员”. D sai: chỉ có người hô."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"趣味体育是近年新兴的体育活动，其运动方式没有传统运动那么正式，它以趣味为主，注重娱乐性与大众性；没有传统运动那么严格，它以体验为主；更不需要那么严格的选拔，它属于有兴趣参加的每一个人。它可以在乡间，也可以在高楼之间，甚至在小区的小院里都能举办，比赛的内容也不需要你具备什么天分，更不必提前多少年去接受专门训练。\n趣味体育同样可以强身健体，使大家形成终身体育的意识；趣味体育可以娱乐大众，使没有体育专长的人也能体验到体育带来的快乐；由于趣味体育以集体项目居多，可以锻炼参赛者的团结协作意识和竞争拼搏精神。",qs:[{n:11,q:"趣味体育比赛项目的设计有什么特点？",o:["刺激","正规","传统","好玩儿"],a:3,why:"“以趣味为主，注重娱乐性”."},{n:12,q:"趣味体育的作用是什么？",o:["产生更多冠军","增强团队观念","普及体育常识","给观众带来竞争"],a:1,why:"“锻炼参赛者的团结协作意识”."},{n:13,q:"根据这段话，可以知道什么？",o:["近年趣味体育逐渐衰落","没有人不喜欢趣味体育","趣味体育对场所要求不高","趣味体育的参与者都没有天分"],a:2,why:"“乡间、高楼之间、小区的小院里都能举办”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"世界杯刚一落幕，老球迷就在微博上怀念起旧时足球解说员。\n1978年之前，中国还是收音机时代，那时候不是“看足球”，而是“听足球”。因为足球比赛信息量大且有规定时间，加上比赛情况瞬息万变，所以当时解说的语速都很快，像足球在场上的速度那么快。\n电视时代到来后，足球解说也悄然变化。第一代解说以宋世雄、韩乔生为代表，语言上已相对活泼一些了，而且开始引入解说嘉宾这一概念，并尝试在解说中提供更多背景信息。\n黄健翔是第二代解说的代表。他把重心放在掌握更多资讯上，同时注重给观众一种现场感，由于是现场解说，解说员自然也会更有激情。\n近年被称为文艺青年解说员的贺炜给人们留下了深刻的印象。他语言充满艺术性，被球迷称为“诗人”。解说时这位新生代解说员声情并茂，遣词用句常在观众意料之外，有人评价他的解说专业客观，又使人得到一种艺术的享受。",qs:[{n:14,q:"1978年之前，中国足球解说有什么特点？",o:["信息量大","解说速度快","解说员都是球员","没人看电视转播"],a:1,why:"“当时解说的语速都很快”."},{n:15,q:"第一代电视足球解说有什么特点？",o:["风格变化很突然","解说员都很活泼","有时嘉宾代替解说","解说中增加了背景信息"],a:3,why:"“尝试在解说中提供更多背景信息”."},{n:16,q:"第二代电视足球解说有什么特点？",o:["他们选出了自己的代表","现场解说的比例增加了","解说员解说时更有激情","解说员对任何资讯都不疏忽"],a:2,why:"“解说员自然也会更有激情”."},{n:17,q:"贺炜为什么被称为文艺青年解说员？",o:["他会写诗","他是业余诗人","他对艺术情有独钟","他的语言充满艺术性"],a:3,why:"“他语言充满艺术性”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["事件的经过我都告诉你了，你爱信不信。","阳春三月，沉睡了一冬天的桃树被蒙蒙细雨唤醒了。","人的手指甲缝里经常有细菌生存，因此要勤剪指甲，这是常识。","1981年至今，法国已有157个古镇被进入法国文化遗产保护范围。"],a:3,why:"<b>Bị động dùng sai</b>: <span class='zh'>进入</span> là nội động từ → <span class='zh'>被列入</span>. A là 紧缩句 (đúng); B là 比拟 (đúng)."},{n:19,o:["游行队伍出发了，市民们举着标语，高叫反对战争的口号。","广义上的遗嘱指死者生前对死后一切事务所做的处置和安排。","火车的惯性很大，一般列车从刹车到停下，要往前冲出800米左右。","她咬着嘴唇，眼泪都要流出来了，看得出那问题让她很为难，她不愿回答。"],a:0,why:"<b>Phối hợp động – tân không hợp</b>: “口号” đi với <span class='zh'>高呼</span> (hô khẩu hiệu), <span class='zh'>高叫</span> mang sắc thái la hét — đáp án sách: A."},{n:20,o:["我们开设了抚养小鸡的课程，让每个孩子认领一枚鸡蛋，标好标记，一点点地观察小鸡破壳而出。","女儿第一次对我的教导表示出不屑，加重语气告诉我她现在的职位，似乎在提示我她现在的成功。","陈可辛高调宣布他要拍网剧了，但他自称这并不是为了讨好“90后”“00后”，而是他意识到：“这是一个更自由的天地”。","无论是在中国或者在外国，古代思想家、教育家的教育思想，只是他们的哲学思想或政治思想的组成部分，没有形成一门独立的学科。"],a:3,why:"<b>Quan hệ từ sai</b>: <span class='zh'>无论是……还是……</span>, không dùng <span class='zh'>或者</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"作为父母，当孩子取得成绩时，一定要给予他们表扬和___，让孩子体验到成功的喜悦。在孩子遇到困难和___时，要注意给孩子支持和安慰，不要雪上加霜地___孩子，这样孩子才会有信心。",o:["促进　悲哀　谴责","鼓励　失败　数落","奖励　麻烦　抱歉","鼓舞　障碍　嘲笑"],a:1,why:"<span class='zh'>表扬和鼓励</span>; <span class='zh'>困难和失败</span>; <span class='zh'>数落孩子</span> = trách mắng. Có <span class='zh'>雪上加霜</span>!"},{n:22,text:"做任何事情，都要讲究方法。方法对了，一切都___，方法不对，___意味着南辕北辙。对教育来说，方法也至关重要，无怪乎人们总是想___一种万能的教育方法以实现人们对教育___的无限厚望。",o:["顺理成章　则　寻找　寄予","微不足道　只　发明　给以","头头是道　或　创造　赠送","有条不紊　既　探索　予以"],a:0,why:"<span class='zh'>顺理成章</span>; <span class='zh'>则</span> (đối lập); <span class='zh'>寻找方法</span>; <span class='zh'>寄予厚望</span>."},{n:23,text:"结婚5年，妻子任何汤类都放香菜，那味道让我精神___，吃饭都聚精会神。小时候我不吃香菜，听妻子说那玩意挺有益的，我就喜欢上它啦。如今我正___去买些香菜种子___在花盆里，长出来当花儿养，它比芹菜可有___多了。",o:["集中　思索　搁　气势","享受　推敲　栽　情趣","充实　思量　放　品味","大振　考虑　种　魅力"],a:3,why:"<span class='zh'>精神大振</span>; <span class='zh'>考虑去买</span>; <span class='zh'>种在花盆里</span>; <span class='zh'>有魅力</span>. Có <span class='zh'>聚精会神</span>!"}]},read3:{ins:"第24–28题：选句填空。",text:"叶问（1893年—1972年），本名叶继问，祖籍广东省南海县，出生于富足之家。他从小受的是儒家教育，(24)。上学读书之后，他爱上了传统武术，从7岁起便拜“咏春拳王”梁赞的高足陈华顺为师学习咏春拳。\n陈华顺收叶问为徒后，便不再接受任何人拜门学技，(25)。叶问的各位师兄，如吴仲素、陈汝棉、雷汝齐等，对师弟更是照顾有加。陈华顺逝世后，为了不中断学习，叶问随师兄吴仲素钻研拳技，(26)。\n叶问十六岁那年，远离佛山，赴港求学，就读于圣士提反学院。1950年，叶问再度赴港，在港九饭店职工总会内传授咏春拳术，(27)。其徒弟除总会及分会的会员、港九各地的中国工人外，(28)。其弟子中最出名的是让中国武术闻名世界的武打巨星李小龙。",opts:["有着深厚的传统文化素养","后随梁赞之子梁壁学武","还有在港的外国留学生","从而一举成名","叶问就成了陈华顺的封门弟子"],ans:{24:0,25:4,26:1,27:3,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"“蹴鞠”是中国古代的一项球类运动，早在《史记》中就有记载。“蹴”的意思是用脚踢，“鞠”指外面包着皮革、里面装着米糠的球。“蹴鞠”大意即用脚踢球。\n蹴鞠起源于齐国都城临淄（今天的山东省淄博一带），齐宣王在位时（公元前319年—公元前310年）已经十分盛行。汉代，蹴鞠更被视为“治国习武”之道。出身平民百姓的汉高祖刘邦不但自己爱踢球，还专门在宫苑中建造“鞠域”，也就是足球场。汉武帝还把蹴鞠列为军事训练科目，以提高将帅的身体素质和反应能力，并以其作为考察兵将体质的手段。汉代还出现了研究蹴鞠运动的专著《蹴鞠二十五篇》，这也是中国和世界上最早的一部体育专著。\n到了唐代，“鞠”的制作艺术和“蹴”的运动技术都有了很大的改进。球变得更圆、更轻；运动规则也由原来的直接对抗转为间接对抗，中间隔着球门，双方各在一侧，以射门数多者为胜，而且还出现了女子蹴鞠。女子蹴鞠不射门，是以踢球的技法取胜。唐玄宗李隆基、唐中宗李显等都曾是当时的球星。\n宋代，蹴鞠变得更加兴盛，而且在球的制作方面又有了进一步的发展，不仅针脚细密，而且不露线头，制成的球也十分地圆。\n到了清代，骑马射箭盛行，“蹴鞠”渐被冷落。",qs:[{n:29,q:"根据第2段，汉武帝把蹴鞠列为军事训练科目是因为：",o:["将帅喜欢蹴鞠","能踢球就能打仗","蹴鞠能强身健体","反应快的人也能踢球"],a:2,why:"“以提高将帅的身体素质和反应能力”."},{n:30,q:"根据上文，下列说法正确的是：",o:["女子踢球技术强于男子","唐代蹴鞠转而注重观赏性","“鞠”的制作越来越精良","古代有球星，也有追星族"],a:2,why:"Đường: tròn hơn, nhẹ hơn; Tống: đường may mịn, rất tròn."},{n:31,q:"关于“蹴鞠”，下列哪项正确？",o:["《史记》是与之相关的专著","起源于今天山东省淄博一带","是老百姓最喜欢的一项运动","清朝，天冷的季节才有人蹴鞠"],a:1,why:"“起源于齐国都城临淄（今天的山东省淄博一带）”. A: chuyên khảo là 《蹴鞠二十五篇》."},{n:32,q:"最适合做上文标题的是：",o:["蹴鞠","足球小史","足球的演变","球类运动在中国"],a:0,why:"Cả bài nói về 蹴鞠."}]},{ins:"第33–36题：请选出正确答案。",text:"童年的邓亚萍梦想成为一名运动员，但身高仅有1.55米、手脚粗短的她，被认为没有发展前途。是啊，身材太矮，这几乎是致命的缺点，可是邓亚萍没有选择“认输”。身材不行，她就以脚步灵活来弥补；体校不要她，她就跟父亲学。为了练好基本功，她在腿上绑上沙袋。小小的她，每闪、展、腾、挪一步，都可以用举步维艰来形容。腿肿了，手掌磨破了，她从不叫苦。付出总有回报，10岁的她便在全国少年乒乓球比赛中获得团体和单打两项冠军。\n进入国家队后，教练最常嘱咐邓亚萍的就是“要注意休息，别练过了”。实际上，每天正常训练完以后，邓亚萍都要加练，她的训练量要超过正常运动员很多。她每天练球都要带两双鞋，一双被汗水湿透就再换一双；一筐200多个训练用球，邓亚萍一天要打掉十几筐，邓亚萍的一堂训练课相当于跑一次一万米，这还没算上数千次的挥拍动作，她还经常因为训练错过吃饭的时间。\n邓亚萍先后14次获得世界冠军，乒乓世界排名曾经连续8年保持第一，是排名世界第一时间最长的女运动员，也是唯一一蝉联奥运会女子乒乓单打和双打双料冠军的运动员。邓亚萍的出色成就，改变了世界乒坛只在高个子中选拔运动员的传统观念。无数人为邓亚萍的球风和球艺所倾倒。",qs:[{n:33,q:"童年的邓亚萍：",o:["天天做美梦","身材不苗条","坚决不服输","常遭受打击"],a:2,why:"“没有选择‘认输’”."},{n:34,q:"为了练好基本功，邓亚萍：",o:["把沙袋捆绑在腿上","每天坚持练习长跑","刻苦学习武术步法","不计较生活苦不苦"],a:0,why:"“她在腿上绑上沙袋”."},{n:35,q:"下列哪个词语用来形容邓亚萍进入国家队后的训练生活更合适？",o:["日夜兼程","不畏艰辛","省吃俭用","顺其自然"],a:1,why:"Tập thêm, hai đôi giày ướt đẫm, quên cả ăn → không ngại gian khổ."},{n:36,q:"根据上文，下列说法正确的是：",o:["8年中，她一直活跃在乒坛","她是运动生涯最长的女运动员","她是拿奥运会金牌最多的运动员","她用事实说明矮个子同样能打好乒乓球"],a:3,why:"“改变了世界乒坛只在高个子中选拔运动员的传统观念”."}]}]},W:{zh:"写作",vn:"Viết văn: 运动中的意外受伤",t:"35 phút",min:!0,task:"这篇课文给我们讲述了体育明星们遇到的各种离奇遭遇，他们的意外受伤有动物造成的、有粗心大意造成的、有乐极生悲造成的……你在运动中是否也遇到过意外受伤呢？比如：摔伤、扭伤、踢伤、拉伤、撞伤等，或者你听说过像课文中所说的那些离奇的意外受伤吗？请以“运动中的意外受伤”为题写一篇文章，字数不少于400字。",target:400,steps:[["Mở bài","Vận động có lợi nhưng cũng có rủi ro; giới thiệu sự việc của bạn."],["Bối cảnh","Thời gian, địa điểm, môn thể thao, với ai."],["Diễn biến","Bị thương thế nào: <span class='zh'>一时疏忽 · 重心不稳 · 以致扭伤 · 当场</span>; có thể dùng 紧缩句, 比拟."],["Hậu quả","Đau đớn, điều trị, bỏ lỡ gì: <span class='zh'>遭受 · 雪上加霜 · 乐极生悲</span>."],["Bài học","<span class='zh'>只要你疏忽、大意……</span>; khởi động kỹ, chú ý an toàn."]],outline:[["一 · 开头","运动有益也有风险"],["二 · 背景","时间、地点、项目"],["三 · 经过","怎么受的伤"],["四 · 结果","治疗、感受"],["五 · 教训","运动安全要注意什么"]],model:"运动中的意外受伤\n运动能让人身体健康，可是如果粗心大意，运动也可能给我们带来意想不到的伤害。去年夏天，我就遇到了这样一次意外。\n那是一个周末的下午，我和几个同学在学校操场踢足球。那天天气很热，大家都想快点儿开始比赛，所以谁也没有认真做热身运动。比赛进行得正激烈时，我带球冲向对方的球门，眼看就要射门了，对方的一名后卫横着冲了过来。我一时疏忽，重心不稳，左脚踩在了他的脚上，当场摔倒在地，脚踝一下子就肿了起来，疼得我站都站不起来。\n同学们赶紧把我扶起来，送到了附近的医院。医生说我的脚踝严重扭伤，至少要休息一个月。更让我恼火的是，一个星期以后就是学校的足球比赛，我是队里的主力，这下只能坐在场边看了，真可谓雪上加霜！\n那一个月里，我每天拄着拐杖上下课，连去食堂吃饭都要同学帮忙，这才体会到受伤的痛苦。看着同学们在球场上奔跑，我心里别提多难受了。\n这次受伤让我明白了一个道理：运动前一定要认真热身，运动中要时刻注意安全，千万不能大意。其实离奇伤害并不只发生在体育明星身上，它也紧紧跟随着我们每一个人，只要你疏忽、大意。",check:["Có tiêu đề “运动中的意外受伤”","Có bối cảnh rõ ràng","Có diễn biến bị thương cụ thể","Có hậu quả / cảm xúc","Có bài học","Dùng ít nhất 4: 当场 · 疏忽 · 大意 · 特意 · 遭受 · 雪上加霜 · 乐极生悲 · 恼火","Không ít hơn 400 chữ"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"我们以前只知道“科学育儿”，却没有听说过“极限育儿”。“极限育儿”，顾名思义，就是让孩子从小冒险，体验生命的极限。\n澳大利亚的詹姆斯和米娅是一对典型的“极限家长”，夫妻俩喜欢挑战各种极限运动。他们的儿子杰克4个月大时，詹姆斯就把儿子吊在胸前，背着一大包旅行用品，一家三口在山上露营地的帐篷里过了一夜。杰克4岁就成了探险老手。他与父亲连在同一条绳上攀岩，跟随父亲从100米高的悬崖上进行快速滑降，一起从高空跳水。他从来不知道什么是害怕，简直没有他不能到达的高度和深度。\n如今世界各地涌现出的“极限家长”不在少数。怀塔克莱一家的全部家当都装在汽车里，晚上就搭起帐篷，睡在折叠床上。除了必要的生活用品外，他们几乎一无所有。夫妻俩教孩子如何观察周围的环境，在野外辨认方向和读懂地图。孩子们在不断变换“驻地”的日子里，学会了用最快的速度适应新环境，学会了收集燃料，节约饮水，用可以到手的原始物品制作用具，甚至给自己做玩具，从来不会为每天不安定的生活而痛苦。\n近日，一段视频被人放到了网上。视频中，父亲在与一个4岁的男孩沟通并经过30分钟的热身慢跑后，这个4岁的男孩脱掉了自己的内外衣裤，仅穿一条嫩黄色的小短裤和运动鞋，快速跑入风雪之中，而当天清晨的室外最低气温是-13℃，大街上几乎看不到一个人，只有他在厚厚的雪地里晨跑。开始小家伙可能有点儿冷，一边跑，一边带着哭腔跟爸爸要“抱抱”，不想再跑了，很快孩子的头上挂满了雪花，可最后还是在父亲的鼓励下，小家伙儿坚持跑了大约5分钟。\n对此，网民们议论纷纷。有人认为“极限教育”是一种爱心教育，是一种超越溺爱的大爱，尤其值得溺爱孩子的父母学习。有人认为探险活动可以培养儿童长时间集中注意力，在探险活动中，他们需要观察周围事物，收集各种信息来帮助自己做出决定，有时还要制定多种方案。探险对增强体质和意志力能起到很大的作用，这不是什么坏事。持不同意见者则认为，对于儿童探险存在的风险，不是每个人都能清楚地认识到的，让那么小的孩子身处险境，可能遇上各种不测，奉劝家长放过幼小的孩子，对脆弱的他们还是不要大意。",model:"极限育儿\n“极限育儿”就是让孩子从小冒险，体验生命的极限。\n澳大利亚的詹姆斯和米娅是一对典型的“极限家长”，他们喜欢挑战极限运动。儿子杰克4个月大时，就跟着父母在山上的帐篷里过了一夜。4岁时，杰克已经成了探险老手，他跟父亲一起攀岩，从100米高的悬崖上滑降，还一起从高空跳水，他从来不知道什么是害怕。\n现在世界各地的“极限家长”不在少数。怀塔克莱一家把全部家当都装在汽车里，晚上就搭帐篷睡觉。父母教孩子观察环境、辨认方向、读地图。孩子们学会了很快适应新环境，学会了收集燃料、节约用水、自己做用具和玩具，从不为不安定的生活而痛苦。\n最近网上有一段视频：一个4岁的男孩只穿一条小短裤和运动鞋，在零下13度的雪地里晨跑。开始他冷得想哭，不想跑了，但在父亲的鼓励下，他坚持跑了大约5分钟。\n对此，网民们议论纷纷。有人认为极限教育是一种超越溺爱的大爱，能培养孩子的注意力，增强体质和意志力。也有人认为让那么小的孩子身处险境风险太大，劝家长不要大意。"}},SUM:{words:["崇拜","冲击","拼搏","聚精会神","防守","进攻","阴谋","当场","事件","遮挡","裁判","中断","刹车","防御","心态","南辕北辙","注重","胜负","残酷","争议","打官司","守护","谴责","凶手","冤枉","辩解","成心","意料","频繁","大意","悲哀","主办","特意","警告","疏忽","重心","恼火","雪上加霜","荒唐","处置","遭受","微不足道"],patterns:[["紧缩句：A 也 B / 一 A 就 B / 不 A 就 B","想赢球也不能置猫头鹰的生命于不顾。"],["特意 + V","主办方特意做了警示牌。"],["置……于不顾","想赢球也不能置猫头鹰的生命于不顾。"],["以致 + kết quả xấu","由于重心不稳，以致扭伤了脚。"],["修辞：比拟","一只……“迫降”球场的猫头鹰……"]],diff:["特意: dụng tâm làm việc tốt (tích cực) — 故意: biết sai vẫn làm (tiêu cực), còn là danh từ pháp luật","成心 = cố ý (≠ thành tâm) · 大意 dàyi = sơ ý / dàyì = ý chính · 横 héng · 冤枉钱 = tiền tiêu phí"],sentences:["他们身上的每一处伤疤都是奋力拼搏的标记。","更让他恼火的是，不了解情况的主裁判还给了他一张黄牌，真可谓雪上加霜！","其实离奇伤害不仅存在于运动员当中，它也紧紧跟随着我们每一个人，只要你疏忽、大意。"],hw:["Học thuộc 54 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “运动中的意外受伤” ≥400 chữ (mục 7).","Luyện đề 缩写: “极限育儿” 10 phút đọc, 35 phút viết.","Làm Sách bài tập bài 24.","Đọc trước bài 25 (Đơn vị 7 · 经典阅读)."]}});
