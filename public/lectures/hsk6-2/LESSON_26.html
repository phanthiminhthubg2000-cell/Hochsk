<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 26 · 奇异的灯光 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-26",num:26,book:"HSK 标准教程 6（下）",unit:{n:7,zh:"经典阅读",vn:"Đọc tác phẩm kinh điển"},title:"奇异的灯光",vn:"Ánh sáng kỳ lạ",chars:994,source:"改编自《学圣人 悟做人》文章《囊萤照读》，编著：欧阳敏",goals:["Đọc hiểu truyện 994 chữ phỏng theo điển tích <b>囊萤照读</b> (bắt đom đóm làm đèn đọc sách): nghèo mà ham học, rồi thành học giả.","Dùng được 51 từ mới, nhất là nhóm <b>miêu tả cảm giác – động tác</b>: <span class='zh'>捧 · 揉 · 挪 · 眯 · 捞 · 摊 · 麻木 · 知觉 · 熄灭 · 凝固 · 蔓延 · 耀眼 · 光芒 · 迸发</span> và nhóm <b>học vấn – tinh thần</b>: <span class='zh'>天文 · 儒家 · 传记 · 散文 · 历代 · 着迷 · 熏陶 · 胸怀 · 天赋 · 财富 · 源泉</span>.","Nắm <span class='zh'>别说 · 来来回回 (AABB)</span>.","Phân biệt <span class='zh'>挨 — 受</span>; làm quen <b>修辞 (3): 比喻</b>.","Tóm tắt (缩写) bài khóa thành ~400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (别说 · 挨—受) · Bài khóa đoạn 1–2"],["Buổi 2","Nhóm 2–3 (AABB) · Đoạn 3–8 · 比喻 · Bài tập · Luyện đề · Viết tóm tắt"]],outline:[{tag:"起",name:"Ham sách",paras:"Đoạn 1–2",zh:"爱书如命；家境贫乏，灯油都要节省",vn:"Một người đọc sách mê sách như mạng, không sợ rét, nóng, muỗi — chỉ buồn vì nhà nghèo, dầu đèn cũng phải tiết kiệm."},{tag:"承",name:"Đèn tắt",paras:"Đoạn 3–4",zh:"油灯熄灭 → 绝望 → 走入夜色",vn:"Đêm hè oi bức, đèn dầu tắt vì hết dầu; anh tuyệt vọng, cố đọc thầm thơ nhưng không được, bèn ra ngoài."},{tag:"转",name:"Đom đóm",paras:"Đoạn 5–6",zh:"萤火虫 → 布兜“灯笼”",vn:"Thấy đàn đom đóm bay lượn, anh nảy ý bắt bỏ túi vải làm “đèn lồng” — từ đó đom đóm đêm đêm bầu bạn."},{tag:"合",name:"Thành tài & bài học",paras:"Đoạn 7–8",zh:"成为知名学者；贫困可以成为财富",vn:"Không có thiên phú hơn người, nhưng ngày ngày nỗ lực → thành học giả. Nghèo vật chất không đáng sợ; đáng sợ là nghèo tư tưởng, tinh thần."}],warm1:{q:"请对照图片熟悉下列动物和物品的名称，并想想哪一种可以发光？",vn:"Con vật / đồ vật nào có thể phát sáng? Bấm 有 (có) / 无 (không).",items:[["🐜","蚂蚁 mǎyǐ","Con kiến"],["🦟","蚊子 wénzi","Con muỗi"],["✨","萤火虫 yínghuǒchóng","Đom đóm"],["🪔","油灯 yóudēng","Đèn dầu"],["🕯️","蜡烛 làzhú","Cây nến"]],talk:["你听说过“囊萤照读”或“凿壁偷光”的故事吗？","你觉得什么样的贫困最可怕？"],link:"Thành ngữ <span class='zh'>囊萤映雪</span> (túi đom đóm, ánh tuyết) chỉ tinh thần khổ học — người Việt cũng có câu “đèn sách”, “dùi mài kinh sử”."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"境",rule:"境 = <b>cảnh ngộ, tình trạng</b>.",w:[["家境","jiājìng","hoàn cảnh gia đình (có trong bài)"],["处境","chǔjìng","hoàn cảnh"],["困境","kùnjìng","khốn cảnh"],["梦境","mèngjìng","cảnh trong mơ"],["心境","xīnjìng","tâm trạng"],["情境","qíngjìng","tình huống"],["意境","yìjìng","ý cảnh"],["境况","jìngkuàng","tình cảnh"],["境地","jìngdì","tình thế"],["境界","jìngjiè","cảnh giới"],["境遇","jìngyù","cảnh ngộ"]]},{k:"珠",rule:"珠 = <b>hạt tròn</b>.",w:[["汗珠","hànzhū","giọt mồ hôi (có trong bài)"],["水珠","shuǐzhū","giọt nước"],["泪珠","lèizhū","giọt lệ"],["露珠","lùzhū","giọt sương"],["钢珠","gāngzhū","bi thép"],["串珠","chuànzhū","chuỗi hạt"],["圆珠笔","yuánzhūbǐ","bút bi"],["珠子","zhūzi","hạt châu"],["珠帘","zhūlián","rèm hạt"]]},{k:"凉",rule:"凉 = <b>mát, lạnh</b>.",w:[["凉风","liángfēng","gió mát (có trong bài)"],["凉快","liángkuai","mát mẻ"],["凉爽","liángshuǎng","mát mẻ"],["凉水","liángshuǐ","nước lạnh"],["凉茶","liángchá","trà mát"],["凉菜","liángcài","món nguội"],["凉鞋","liángxié","dép quai hậu"],["凉气","liángqì","hơi lạnh"],["凉拌","liángbàn","trộn nguội"],["冰凉","bīngliáng","lạnh buốt"],["清凉","qīngliáng","mát lành"],["阴凉","yīnliáng","bóng mát"],["受凉","shòuliáng","bị lạnh"]]},{k:"手",rule:"手 = <b>tay</b>.",w:[["手心","shǒuxīn","lòng bàn tay (có trong bài)"],["手掌","shǒuzhǎng","bàn tay"],["手背","shǒubèi","mu bàn tay"],["手指","shǒuzhǐ","ngón tay"],["手表","shǒubiǎo","đồng hồ đeo tay"],["手链","shǒuliàn","vòng tay"],["手工","shǒugōng","thủ công"],["手脚","shǒujiǎo","tay chân"],["手语","shǒuyǔ","ngôn ngữ ký hiệu"],["双手","shuāngshǒu","hai tay"],["招手","zhāoshǒu","vẫy tay"],["举手","jǔshǒu","giơ tay"],["顺手","shùnshǒu","tiện tay"],["出手","chūshǒu","ra tay"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Người ham sách",from:1,to:24},{name:"Nhóm 2 · Đoạn 3–5",sub:"Đèn tắt, ra đồng",from:25,to:39},{name:"Nhóm 3 · Đoạn 6–8",sub:"Đèn đom đóm & bài học",from:40,to:51}],V:[[1,"捧","pěng","đgt.","phủng","nâng, bê, cầm bằng hai tay",1,"","用双手托。","每当他捧起书本","她捧着一束鲜花。","Cô ấy ôm một bó hoa.",[],"Bài tập 3①."],[2,"天文","tiānwén","dt.","thiên văn","thiên văn học",1,"","日月星辰等天体在宇宙间分布、运行等现象。","天文地理","他对天文很感兴趣。","Anh ấy rất hứng thú với thiên văn.",["天文地理"],""],[3,"儒家","Rújiā","dt.","Nho gia","nhà Nho, Nho gia",1,"","先秦时期以孔子为代表的一个思想流派。","儒家经典","儒家思想影响深远。","Tư tưởng Nho gia ảnh hưởng sâu xa.",[],""],[4,"传记","zhuànjì","dt.","truyện ký","truyện ký, tiểu sử",1,"","记录某人生平事迹的文字。","传记散文","我爱读名人传记。","Tôi thích đọc tiểu sử danh nhân.",[],"⚠️ 传 đọc <b>zhuàn</b>. Bài tập 3①."],[5,"散文","sǎnwén","dt.","tản văn","tản văn, văn xuôi",1,"","不讲究韵律的文章；指除诗歌、戏剧、小说外的文学作品。","传记散文","朱自清的散文很有名。","Tản văn của Chu Tự Thanh rất nổi tiếng.",[],"⚠️ 散 đọc <b>sǎn</b>."],[6,"历代","lìdài","dt.","lịch đại","các triều đại, các đời (phong kiến)",1,"","过去的各个朝代。","历代诗词","历代名人。","Danh nhân các đời.",[],"Bài tập 3①."],[7,"着迷","zháo mí","đgt.","trước mê","say mê, mê mẩn",1,"","对人或事物产生难以舍弃的爱好。","都会使他着迷","孩子们看动画片看得着了迷。","Bọn trẻ xem hoạt hình say mê.",[],"⚠️ 着 đọc <b>zháo</b>."],[8,"熏陶","xūntáo","đgt.","huân đào","hun đúc, soi sáng, khai trí",1,"","长期接触的人对生活习惯、思想行为、品行学问等逐渐产生某种影响。","历史文化的长期熏陶","在艺术的熏陶下长大。","Lớn lên trong sự hun đúc của nghệ thuật.",[],"SBT nghe câu 3."],[9,"胸怀","xiōnghuái","dt.","hung hoài","trái tim, tấm lòng, lòng",1,"","心胸，胸襟。","胸怀宽广","他有宽广的胸怀。","Anh ấy có tấm lòng rộng mở.",[],"SBT câu 21A."],[10,"不堪","bùkān","đgt.","bất kham","không chịu nổi, không chịu thấu",1,"书","不能忍受；承受不了。","使人不堪忍受的严寒","他不堪重负，病倒了。","Anh không chịu nổi gánh nặng, ngã bệnh.",["不堪忍受","不堪设想"],"Bài tập 2①."],[11,"炎热","yánrè","tt.","viêm nhiệt","rất nóng, nóng cháy da",1,"","（天气）很热。","炎热夏天","炎热的夏天，人们都喜欢游泳。","Mùa hè nóng nực, ai cũng thích bơi.",[],"Bài tập 1: <span class='zh'>热闹 · 热情 · 热心 · 热爱</span>. SBT câu 33–36."],[12,"骚扰","sāorǎo","đgt.","tao nhiễu","quấy rối, làm phiền",1,"","使不安宁；扰乱。","蚊子的骚扰","他常被推销电话骚扰。","Anh ấy hay bị điện thoại chào hàng làm phiền.",[],""],[13,"贫乏","pínfá","tt.","bần phạp","bần cùng, nghèo túng",1,"","贫穷；缺少，不丰富。","家境贫乏","他的知识很贫乏。","Kiến thức anh ta rất nghèo nàn.",[],"Bài tập 1: <span class='zh'>乏味 · 乏累 · 疲乏 · 不乏其人</span>. SBT nghe câu 5."],[14,"艰难","jiānnán","tt.","gian nan","gian nan, gian khổ",1,"","困难。","日子过得艰难","他艰难地站了起来。","Anh ấy khó nhọc đứng dậy.",[],"Bài tập 1: <span class='zh'>困难 · 难题 · 难关 · 难能可贵</span>; 2②."],[15,"蜡烛","làzhú","dt.","lạp chúc","cây nến, đèn cầy",1,"","用蜡或其他油脂制成的照明物。","别说蜡烛了","停电了，点根蜡烛吧。","Cúp điện rồi, thắp cây nến đi.",[],"SBT câu 19B."],[16,"蚂蚁","mǎyǐ","dt.","mã nghĩ","(con) kiến",1,"","一种昆虫。","像有蚂蚁在爬","蚂蚁搬家要下雨。","Kiến dọn tổ là trời sắp mưa.",[],"SBT câu 19D."],[17,"颈椎","jǐngzhuī","dt.","cảnh chùy","(các) đốt sống cổ",1,"","脖子部位的脊椎骨。","他的颈椎有些麻木","长时间看手机对颈椎不好。","Xem điện thoại lâu không tốt cho cột sống cổ.",[],""],[18,"揉","róu","đgt.","nhu","dụi, vò, xoa bóp",1,"","用手来回擦或搓。","用手揉了揉麻木的脖子","他揉了揉眼睛。","Anh ấy dụi mắt.",[],"SBT câu 33–36."],[19,"挪","nuó","đgt.","na","xê dịch, dịch chuyển",1,"","移动；转移。","挪了挪屁股","把桌子往左边挪一挪。","Dịch cái bàn sang trái một chút.",[],""],[20,"屁股","pìgu","dt.","thí cổ","mông",1,"","臀部。","屁股酸痛","坐久了屁股疼。","Ngồi lâu đau mông.",[],""],[21,"知觉","zhījué","dt.","tri giác","cảm giác",1,"","感觉。","麻木的部位恢复了知觉","他摔倒后失去了知觉。","Anh ấy ngã rồi bất tỉnh.",["失去知觉"],"Bài tập 3②."],[22,"挨","ái","đgt.","ai","chịu đựng, bị",1,"","遭受；忍受。","挨饿受冻他都不怕","他挨了一顿批评。","Anh ấy bị một trận phê bình.",["挨饿","挨打","挨骂"],"⚠️ Đọc <b>ái</b> (khác <span class='zh'>挨 āi</span> = sát cạnh). Xem <b>辨析 挨—受</b>."],[23,"美满","měimǎn","tt.","mỹ mãn","mỹ mãn, đầy đủ",1,"","美好圆满。","他就感觉幸福、美满","祝你们婚姻美满。","Chúc hai bạn hôn nhân mỹ mãn.",[],"SBT nghe 14–17."],[24,"天堂","tiāntáng","dt.","thiên đường","thiên đường",1,"","某些宗教指人死后灵魂居住的美好地方；比喻幸福美好的生活环境。","像是生活在天堂","这里简直是孩子们的天堂。","Đây đúng là thiên đường của trẻ em.",[],"SBT câu 24–28."],[25,"熄灭","xīmiè","đgt.","tức diệt","tắt, dập tắt",1,"","停止燃烧。","无声地熄灭了","灯光一盏一盏地熄灭了。","Đèn tắt dần từng ngọn.",[],"Bài tập 3②."],[26,"泄气","xiè qì","đgt.","tiết khí","nhụt chí, nản lòng",1,"","丧失勇气、信心。","他有些泄气","失败了也别泄气。","Thất bại cũng đừng nản.",[],"Bài tập 2④. SBT câu 31."],[27,"眯","mī","đgt.","mị","nheo (mắt), hé nhìn",1,"","眼皮微微合上。","黑暗中他眯起双眼","他眯着眼睛笑。","Anh ấy nheo mắt cười.",[],"SBT câu 33–36."],[28,"绝望","juéwàng","đgt.","tuyệt vọng","hết hy vọng, tuyệt vọng",1,"","希望断绝；毫无希望。","绝望地凝视着","不要绝望，总会有办法的。","Đừng tuyệt vọng, kiểu gì cũng có cách.",[],"Bài tập 3①."],[29,"凝固","nínggù","đgt.","ngưng cố","cứng lại, đông đặc",1,"","由液体变成固体；比喻固定不变或停滞。","闷热的空气像是凝固了","我感到血液凝固了。","Tôi cảm thấy máu như đông lại.",[],"SBT câu 20B."],[30,"蔓延","mànyán","đgt.","mạn diên","lan tràn, lan ra",1,"","像蔓草一样不断向周围扩展。","烦躁在他身体中蔓延开来","大火迅速蔓延。","Đám cháy lan nhanh.",[],"Bài tập 3②."],[31,"克制","kèzhì","đgt.","khắc chế","kiềm chế, nén",1,"","抑制（多指感情）。","他努力克制着自己的情绪","他克制不住内心的激动。","Anh ấy không kìm được xúc động.",[],"Bài tập 1 (ví dụ): <span class='zh'>控制 · 强制 · 限制 · 节制</span>; 2⑤."],[32,"默默","mòmò","phó.","mặc mặc","thầm, lặng lẽ",1,"","不说话；不出声。","默默地背诵着","他默默地为大家付出。","Anh lặng lẽ cống hiến vì mọi người.",[],"Bài tập 2⑥. SBT câu 18B."],[33,"背诵","bèisòng","đgt.","bội tụng","đọc thuộc lòng",1,"","凭记忆念出读过的文字。","默默地背诵着刚刚读过的古诗","请背诵这首诗。","Hãy đọc thuộc bài thơ này.",[],""],[34,"编织","biānzhī","đgt.","biên chức","đan, kết lại",1,"","把细长的东西交叉组织起来；比喻构想、组织。","在头脑中编织着……画面","她在编织一件毛衣。","Cô ấy đang đan một chiếc áo len.",[],"SBT nghe câu 4."],[35,"强制","qiángzhì","đgt.","cưỡng chế","cưỡng chế, ép buộc",1,"","用政治或经济力量强迫。","这种强制的办法没有效果","强制执行。","Cưỡng chế thi hành.",[],"SBT câu 33–36."],[36,"田野","tiányě","dt.","điền dã","đồng ruộng",1,"","田地和原野。","他漫步在田野中","田野里一片金黄。","Đồng ruộng một màu vàng óng.",[],"Bài tập 3②."],[37,"情形","qíngxing","dt.","tình hình","tình hình, hoàn cảnh, tình huống",1,"","事物呈现出来的样子。","他被眼前的情形吸引住了","当时的情形十分危急。","Tình hình lúc ấy vô cùng nguy cấp.",[],""],[38,"耀眼","yàoyǎn","tt.","diệu nhãn","chói mắt, lóa mắt",1,"","光线强烈，使人眼花。","黑暗中唯一耀眼的光芒","阳光很耀眼。","Nắng rất chói mắt.",[],"SBT câu 19A."],[39,"光芒","guāngmáng","dt.","quang mang","hào quang, ánh sáng",1,"","向四面放射的强烈光线。","耀眼的光芒","太阳的光芒照耀大地。","Ánh mặt trời chiếu rọi mặt đất.",[],"Bài tập 3②. SBT câu 33–36."],[40,"捞","lāo","đgt.","lao","moi, mò, vớt",1,"","从水或其他液体里取东西。","他伸手一捞","从水里捞出一条鱼。","Vớt một con cá từ dưới nước lên.",[],""],[41,"摊","tān","đgt.","than","trải ra, mở ra",1,"","摆开；铺平。","摊开手掌","他把地图摊在桌子上。","Anh trải bản đồ lên bàn.",[],"SBT câu 33–36: <span class='zh'>摊开报纸</span>."],[42,"哇","wa","trợ.","oa","ôi chao, chà",1,"","“啊”受前一字韵母u或ao的影响而发生的变音。","哇，萤火虫还……","好哇！","Hay quá!",[],"Còn đọc <b>wā</b> (thán từ)."],[43,"毫米","háomǐ","lượng.","hào mễ","mi-li-mét",1,"","长度单位。","那亮光只能用毫米计算","这条线长五毫米。","Đường này dài 5 mm.",[],"SBT câu 20C."],[44,"迸发","bèngfā","đgt.","bính phát","tóe ra, bung ra, nảy ra",1,"","由内而外突然发出。","他头脑中迸发出一个想法","人群中迸发出热烈的掌声。","Đám đông bùng lên tràng vỗ tay.",[],"SBT câu 20D."],[45,"兜","dōu","dt.","đâu","túi",1,"","口袋一类的东西。","薄布做的布兜","他把钥匙放在裤兜里。","Anh để chìa khóa trong túi quần.",["布兜","裤兜"],""],[46,"灯笼","dēnglong","dt.","đăng lung","đèn lồng",1,"","用竹篾或铁丝做骨架，糊上纸或纱的灯具。","一个“灯笼”就做成啦","春节家家挂灯笼。","Tết nhà nhà treo đèn lồng.",[],"SBT câu 24–28: <span class='zh'>打着灯笼都难找</span>."],[47,"啦","la","trợ.","lạp","đấy, nhé, kìa",1,"","“了”和“啊”的合音。","一个“灯笼”就做成啦","下雨啦！","Mưa rồi kìa!",[],""],[48,"天赋","tiānfù","dt.","thiên phú","tài năng, năng khiếu",1,"","生来就具备的资质。","没有过人的天赋","她很有音乐天赋。","Cô ấy rất có năng khiếu âm nhạc.",[],""],[49,"贫困","pínkùn","tt.","bần khốn","nghèo túng, bần cùng",1,"","生活困难；贫穷。","生活贫困并不可怕","帮助贫困地区的孩子。","Giúp đỡ trẻ em vùng nghèo.",[],"Bài tập 1: <span class='zh'>贫寒 · 清贫 · 贫瘠 · 贫民</span>."],[50,"财富","cáifù","dt.","tài phú","của cải",1,"","具有价值的东西。","可以成为财富","知识是最宝贵的财富。","Tri thức là của cải quý nhất.",["精神财富"],"Bài tập 3①. SBT nghe 14–17."],[51,"源泉","yuánquán","dt.","nguyên tuyền","nguồn, cội nguồn",1,"","水源；比喻力量、知识、感情等的来源。","奋斗拼搏的动力和源泉","生活是创作的源泉。","Cuộc sống là nguồn sáng tác.",[],""]],extra:[["爱书如命","ài shū rú mìng","mê sách như mạng"],["思维敏捷","sīwéi mǐnjié","tư duy nhanh nhạy"],["热浪","rèlàng","đợt nóng"],["麻木","mámù","tê cứng"],["酸痛","suāntòng","đau mỏi"],["沉浸","chénjìn","đắm chìm"],["凝视","níngshì","nhìn chằm chằm"],["漫漫长夜","mànmàn chángyè","đêm dài dằng dặc"],["萤火虫","yínghuǒchóng","đom đóm"],["盘旋","pánxuán","bay lượn vòng"],["勉强","miǎnqiǎng","tạm được"],["日复一日","rì fù yí rì","ngày qua ngày"]],T:[{zh:"传说古代有个爱书如命的读书人，每当他捧起书本就像是走进了知识的海洋，天文地理、儒家经典、传记散文、历代诗词，都会使他着迷。历史文化的长期熏陶，使他思维敏捷，胸怀宽广。冬季使人不堪忍受的严寒以及炎热夏天蚊子的骚扰都没有影响他读书的热情，唯独让他发愁的是家境贫乏，日子过得艰难，晚上看书别说蜡烛了，就是灯油也要节省着用。",vn:"Tương truyền thời xưa có một người đọc sách mê sách như mạng; mỗi khi nâng cuốn sách lên là như bước vào biển tri thức — thiên văn địa lý, kinh điển Nho gia, truyện ký tản văn, thơ từ các đời đều khiến anh say mê. Sự hun đúc lâu dài của lịch sử văn hóa khiến anh tư duy nhanh nhạy, lòng dạ rộng mở. Cái rét không chịu nổi của mùa đông và sự quấy nhiễu của muỗi mùa hè nóng nực đều không ảnh hưởng lòng ham đọc của anh; điều duy nhất khiến anh lo là nhà nghèo, sống khó khăn, tối đọc sách đừng nói nến, đến dầu đèn cũng phải dùng dè sẻn.",idea:"Người mê sách, nhà nghèo.",q:["让读书人幸福的事情和发愁的事情各是什么？"],note:[["就像是走进了知识的海洋","Xem 修辞: 比喻."],["别说蜡烛了，就是灯油也……","Xem Ngữ pháp 1: <span class='zh'>别说</span>."],["唯独","Duy chỉ có."]]},{zh:"又是一个闷热的夏夜，窗外阵阵热浪袭来，汗珠顺着脸往下流，脸上痒痒的，像有蚂蚁在爬，他用手擦了擦汗，依然沉醉在书本里。由于坐得太久，他的颈椎有些麻木，屁股酸痛，他晃了晃头，用手揉了揉麻木的脖子，挪了挪屁股，换个姿势，顿时麻木的部位恢复了知觉，他依旧沉浸在读书的快乐中。是啊，只要有书读，挨饿受冻他都不怕；只要有书陪伴，他就感觉幸福、美满，像是生活在天堂。",vn:"Lại một đêm hè oi bức, ngoài cửa sổ từng đợt hơi nóng ập tới, mồ hôi chảy dọc mặt, mặt ngứa ngứa như có kiến bò; anh lấy tay lau mồ hôi, vẫn đắm say trong sách. Vì ngồi quá lâu, cổ anh hơi tê, mông đau mỏi; anh lắc lắc đầu, lấy tay xoa cái cổ tê cứng, xê dịch mông, đổi tư thế, lập tức chỗ tê lấy lại cảm giác, anh lại chìm đắm trong niềm vui đọc sách. Phải rồi, chỉ cần có sách đọc, chịu đói chịu rét anh cũng chẳng sợ; chỉ cần có sách làm bạn, anh thấy hạnh phúc, mỹ mãn như sống trên thiên đường.",idea:"Niềm vui đọc sách.",q:["只要有书，他就感觉怎么样？"],note:[["V了V","<span class='zh'>擦了擦 · 晃了晃 · 揉了揉 · 挪了挪</span>: động tác nhẹ, nhanh."],["挨饿受冻","Xem 辨析 挨—受."],["只要……，就……；只要……，就……","Điệp cấu trúc."]]},{zh:"忽然，油灯无力地跳了两下，无声地熄灭了，眼前顿时陷入了黑暗。糟了，一定是灯油没有了，他有些泄气。黑暗中他眯起双眼，极力使自己尽快适应眼前的黑暗。他拿起油灯在耳边摇了摇，灯油瓶空了。他放下灯，绝望地凝视着眼前的茫茫黑暗，不知道怎样打发这个漫漫长夜。",vn:"Bỗng đèn dầu yếu ớt nhảy lên hai cái rồi lặng lẽ tắt, trước mắt lập tức chìm vào bóng tối. Hỏng rồi, chắc là hết dầu, anh hơi nản. Trong bóng tối anh nheo mắt, cố làm cho mình mau quen với bóng tối trước mặt. Anh cầm đèn lên lắc lắc bên tai — bình dầu đã cạn. Anh đặt đèn xuống, tuyệt vọng nhìn chằm chằm vào bóng tối mịt mùng, không biết làm sao qua được đêm dài dằng dặc này.",idea:"Đèn tắt.",q:["油灯熄灭后，他是什么心情？"],note:[["无力地跳了两下","Nhân hóa ngọn đèn (bài 24: 比拟)."],["泄气 → 绝望","Cảm xúc tăng dần."]]},{zh:"屋子里闷热的空气像是凝固了，烦躁在他身体中蔓延开来，他努力克制着自己的情绪，默默地背诵着刚刚读过的古诗，在头脑中编织着诗中描绘的动人画面，可这种强制的办法没有效果，于是，他打开房门走入了沉沉夜色。",vn:"Không khí oi bức trong phòng như đông cứng lại, sự bực bội lan khắp người anh; anh cố kìm nén cảm xúc, lặng lẽ đọc thầm những bài thơ cổ vừa đọc, dệt trong đầu những bức tranh xúc động mà thơ miêu tả, nhưng cách ép buộc ấy chẳng có hiệu quả, thế là anh mở cửa bước vào màn đêm thăm thẳm.",idea:"Cố kìm nén, ra ngoài.",q:["他用什么办法克服烦躁？"],note:[["空气像是凝固了","So sánh."],["烦躁……蔓延开来","Cảm xúc được viết như vật lan tỏa."]]},{zh:"夏日的夜十分美丽，一闪一闪的星星镶嵌在夜空中，偶尔还会吹来一阵凉风。他漫步在田野中，欣赏着美丽的夜景，忽然他被眼前的情形吸引住了，只见一大群萤火虫在低空盘旋飞舞，来来回回地飞。萤火虫的尾巴都有亮光在闪烁，成为黑暗中唯一耀眼的光芒。",vn:"Đêm hè rất đẹp, những vì sao lấp lánh được khảm vào bầu trời đêm, thỉnh thoảng một cơn gió mát thổi qua. Anh dạo bước trên đồng, ngắm cảnh đêm đẹp, bỗng bị cảnh tượng trước mắt hút hồn: một đàn đom đóm lớn đang bay lượn sát mặt đất, bay qua bay lại. Đuôi đom đóm đều lập lòe ánh sáng, thành thứ ánh sáng chói lóa duy nhất trong bóng tối.",idea:"Gặp đom đóm.",q:["他在田野中看到了什么？"],note:[["来来回回地飞","Xem Ngữ pháp 2: AABB."],["星星镶嵌在夜空中","镶嵌 — bài 20."]]},{zh:"他跟在萤火虫后面。忽然一只萤火虫飞到了眼前，他伸手一捞，把它握在了手心，摊开手掌，哇，萤火虫还老老实实地待在那里，尾部依旧闪着亮光，也许那亮光只能用毫米计算，可却还算明亮。瞬间，他头脑中迸发出一个想法：“如果将许多萤火虫集中在一起，不就成灯了吗？”他决定试一试。他找了个薄布做的布兜，抓了一些萤火虫放在里面，然后将袋口扎住，把口袋吊起来，一个“灯笼”就做成啦，虽然没有油灯亮，看书还是勉强可以的，从此，萤火虫做成的“灯”就夜夜陪伴着他。",vn:"Anh đi theo đàn đom đóm. Bỗng một con bay tới trước mặt, anh với tay vớt một cái, nắm nó trong lòng bàn tay; xòe tay ra — chà, đom đóm vẫn ngoan ngoãn nằm đó, đuôi vẫn lập lòe sáng, có lẽ ánh sáng ấy chỉ tính bằng mi-li-mét, nhưng vẫn coi là sáng. Trong khoảnh khắc, trong đầu anh bật ra một ý: “Nếu gom nhiều đom đóm lại với nhau, chẳng phải thành đèn sao?” Anh quyết định thử. Anh tìm một cái túi vải mỏng, bắt một ít đom đóm bỏ vào, rồi buộc miệng túi lại, treo túi lên — một chiếc “đèn lồng” đã xong; tuy không sáng bằng đèn dầu nhưng đọc sách thì tạm được. Từ đó, “đèn” đom đóm đêm đêm bầu bạn cùng anh.",idea:"Làm đèn đom đóm.",q:["他是怎样做“灯笼”的？"],note:[["伸手一捞","<span class='zh'>一 + V</span>: hành động nhanh, dứt khoát."],["不就成灯了吗？","Câu phản vấn = chắc chắn thành đèn."],["从此","Xem 篇章 (bài 25): 替代."]]},{zh:"他虽然不是天才，没有过人的天赋，但是日复一日的努力，使他的学识与日俱增，最后终于成为知名学者。",vn:"Anh tuy không phải thiên tài, không có thiên phú hơn người, nhưng nỗ lực ngày qua ngày khiến học thức anh tăng lên từng ngày, cuối cùng trở thành học giả nổi tiếng.",idea:"Thành học giả.",q:["读书人最后的成就是什么？"],note:[["与日俱增","Bài 18."]]},{zh:"生活贫困并不可怕，可怕的是思想贫困、精神贫困、智慧贫困。贫困的经历在有些人那儿可以成为财富，成为奋斗拼搏的动力和源泉。",vn:"Đời sống nghèo khó không đáng sợ; đáng sợ là nghèo tư tưởng, nghèo tinh thần, nghèo trí tuệ. Trải nghiệm nghèo khó ở một số người có thể trở thành của cải, thành động lực và cội nguồn để phấn đấu.",idea:"Bài học.",q:["这个故事给我们什么启示？"],note:[["……并不可怕，可怕的是……","Mẫu câu đối lập nêu quan điểm."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"别说……（连 / 就是 / 即使）……也……",py:"biéshuō",tag:"Chú thích 1 · liên từ",mean:"Liên từ dùng trong câu phức <b>nhượng bộ</b>: bằng cách <b>hạ thấp tầm quan trọng</b> của một người / việc, để <b>nhấn mạnh</b> người / việc khác — “đừng nói…, ngay cả… cũng…”. Hay đi với <span class='zh'>连…… · 就是 / 即使……</span>. Dùng nhiều trong khẩu ngữ.",forms:["别说 A（了），连 / 就是 B 也 / 都……","连 B 都……，别说 A 了"],ex:[["晚上看书别说蜡烛了，就是灯油也要节省着用。","",1],["我认识的那点儿字，别说写小说了，看小说都看不下来。","Chừng ấy chữ tôi biết, đừng nói viết tiểu thuyết, đọc tiểu thuyết còn không nổi."],["工厂管理很严，别说外人，即使本厂的人也不能在各个车间乱跑。","Nhà máy quản lý chặt, đừng nói người ngoài, ngay cả người trong nhà máy cũng không được chạy lung tung giữa các phân xưởng."]],tips:["Bài tập 2③. SBT câu 22: <span class='zh'>……，别说生活半年，连半年的房租都不够</span>."],practice:{q:"用“别说”完成句子",type:"complete",items:[["那个动画片那么好看，连大人都爱看，________。","……连大人都爱看，别说小孩子了。"],["那么破的自行车，________，白给也未必有人要。","那么破的自行车，别说卖出去，白给也未必有人要。"],["________，就是在，他也不会见你。","别说他不在，就是在，他也不会见你。"]]}},{id:"g2",grp:1,word:"",zh:"来来回回 (AABB)",py:"láilái-huíhuí",tag:"Chú thích 2 · lặp động từ",mean:"Một số động từ có thể lặp theo kiểu <b>AABB</b> (<span class='zh'>打打闹闹 · 进进出出 · 来来往往 · 拉拉扯扯 · 比比划划</span>); đôi khi hai từ <b>có nghĩa liên quan</b> cũng lặp như vậy (<span class='zh'>嘻嘻哈哈 · 磕磕碰碰 · 拖拖拉拉</span>). Khi đó động từ dùng <b>giống tính từ</b>: làm vị ngữ thường có <span class='zh'>的</span> phía sau, làm trạng ngữ thường có <span class='zh'>地</span>.",forms:["AABB + 的（vị ngữ）","AABB + 地 + V（trạng ngữ）"],ex:[["小孩子就喜欢打打闹闹，磕磕碰碰是难免的，过几天就好了，别担心。","Trẻ con thích đùa nghịch, va vấp là khó tránh, vài hôm là khỏi, đừng lo."],["虽说她已经是大人了，可整天还是蹦蹦跳跳，说说笑笑的。","Tuy đã là người lớn, cô ấy suốt ngày vẫn nhảy nhót, cười nói."],["只见一大群萤火虫在低空盘旋飞舞，来来回回地飞。","",1]],tips:["SBT câu 23: <span class='zh'>一波三折磕磕碰碰地走出低谷</span>."],practice:{q:"选择合适的词语填空：说说笑笑 · 拖拖拉拉 · 吵吵嚷嚷 · 打打闹闹",type:"complete",items:[["他这个人办事就是________的，让人着急。","拖拖拉拉"],["在饭馆，吃完饭________争着付钱的准是中国人。","吵吵嚷嚷"],["那时我们住一个宿舍，大伙天天________、________地，快活极了。","说说笑笑、打打闹闹"]]}},{id:"g3",grp:0,word:"不堪",zh:"不堪 / 默默 / 泄气",py:"bùkān / mòmò / xièqì",tag:"Từ trong Bài tập 2",mean:"<span class='zh'>不堪</span> (văn viết) = <b>không chịu nổi</b>; đứng sau tính từ xấu = <b>đến cực độ</b> (<span class='zh'>忙乱不堪 · 疲惫不堪</span>). <span class='zh'>默默</span> = <b>lặng lẽ</b>. <span class='zh'>泄气</span> = <b>nản lòng</b>.",forms:["不堪 + 忍受 / 重负 / 困扰","Adj + 不堪","默默（地）+ V"],ex:[["冬季使人不堪忍受的严寒……","",1],["……他努力克制着自己的情绪，默默地背诵着……","",1],["糟了，一定是灯油没有了，他有些泄气。","",1]],tips:["SBT câu 18C: <span class='zh'>忙乱不堪</span>."]},{id:"g4",grp:1,word:"挨",zh:"挨 / 受",py:"ái / shòu",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa <b>gặp phải, chịu đựng</b>. <span class='zh'>挨</span> + công cụ / hành động cụ thể gây tổn hại (挨打 · 挨骂 · 挨一脚). <span class='zh'>受</span> + tai họa, tổn thất; + động từ trạng thái / khen chê; + một số tính từ (受累 · 受惊).",forms:["挨 + 一脚 / 打 / 骂 / 饿 / 冻","受 + 灾 / 损失 / 表扬 / 累 / 惊"],ex:[["只要有书读，挨饿受冻他都不怕。","",1]],tips:["SBT câu 23: <span class='zh'>经受了……的冲击 · 受到……的挑战</span>."]}],BX:{grp:1,word:"挨",cols:["挨","受"],pair:"挨 — 受",same:["Đều có nghĩa <b>gặp phải, chịu đựng</b>.","他脸上显出挨 / 受了批评的样子。"],diff:[["Danh từ phía sau thường chỉ <b>công cụ</b> người khác dùng gây tổn hại.","身上挨了一脚 / 挨了一顿棍子 / 挨了一个耳光","Danh từ phía sau thường chỉ <b>tai họa, xui xẻo, tổn thất</b>.<div class='zh' style='margin-top:4px'>受灾、受罪、受损失、受气</div>"],["Động từ phía sau thường chỉ <b>hành động cụ thể</b> làm tổn hại thân tâm.","挨打、挨骂、挨批、挨咬","Phía sau có thể là động từ chỉ <b>trạng thái</b> hoặc mang nghĩa <b>khen</b>.<div class='zh' style='margin-top:4px'>受压迫、受剥削、受骗、受埋怨、受表扬、受嘉奖</div>"],["Ngoài vài tính từ, phía sau <b>rất ít</b> mang tính từ.","挨饿、挨冻","Phía sau mang được <b>một số tính từ</b>.<div class='zh' style='margin-top:4px'>受苦、受累、受冻、受惊</div>"]],task:{q:"选择“挨”或“受”填空",cols:["挨","受"],sample:!1,items:[["这次地震中，人民的生命财产____到很大损失。",1,"Tổn thất → 受."],["记得儿时去野外玩儿常常____蚊子咬。",0,"Hành động cụ thể gây hại (咬) → 挨."],["因为撒谎，他____了父亲一顿打。",0,"Hành động cụ thể (打) → 挨."],["您____累，帮我照顾一下孩子好吗？",1,"Tính từ 累 → 受累 (cách nói lịch sự: phiền anh)."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["克<u>制</u>","控制 · 强制 · 限制 · 节制"],items:[["炎<u>热</u>","热","热闹 · 热情 · 热心 · 热爱"],["贫<u>乏</u>","乏","乏味 · 乏累 · 疲乏 · 不乏其人"],["艰<u>难</u>","难","困难 · 难题 · 难关 · 难能可贵"],["<u>贫</u>困","贫","贫寒 · 清贫 · 贫瘠 · 贫民"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["________，搬到别的城市居住了。","不堪","他们不堪北京房价过高的困扰，搬到别的城市居住了。"],["________，才能体会到现在的幸福。","艰难","体验过以前艰难的日子，才能体会到现在的幸福。"],["他连蛇都不怕，________。","别说","他连蛇都不怕，别说这种小虫子了。"],["失败了没关系，________。","泄气","失败了没关系，不要泄气。"],["为了不影响工作，他努力________。","克制","为了不影响工作，他努力克制自己的情绪。"],["他总是________，让我很感动。","默默","他总是默默为我付出，让我很感动。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["历代","捧","绝望","传记","财富"],text:"我爱读书，尤其是名人{传记}，每当我{捧}起书，就仿佛走进了{历代}人的生活。他们的人生经历告诉我在{绝望}中也不要放弃，这成为我生命中一笔宝贵的精神{财富}。"},{bank:["田野","蔓延","光芒","熄灭","知觉"],text:"夏夜，漫步在{田野}中，远处村子的灯光都{熄灭}了，只剩下星星那微弱的{光芒}。此刻，调动全身的{知觉}去感受吧，凉风吹来，丝丝凉意在身体中{蔓延}开来，还有阵阵花香袭来，多么美好的夏夜啊！"}]},EX4:{q:"请说一说下列句子中比喻的用法（用……比喻……）",items:[{src:"",task:"这是一种像小钟儿似的紫色的花，密密麻麻生长着。",model:"用小钟比喻花。"},{src:"",task:"树叶枯黄了，纷纷落下，犹如一只只蝴蝶在翩翩起舞。",model:"用蝴蝶比喻落下的树叶。"},{src:"",task:"童年是一幅画，色彩绚丽，烂漫天真。",model:"用画比喻童年。"},{src:"",task:"老师，您是茂盛的枝叶，您用强有力的身躯呵护着我们这些花骨朵。",model:"用枝叶比喻老师（用花骨朵比喻学生）。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["让读书人幸福的事情","① ……使他着迷 ② 只要有……陪伴，就……","天文地理、儒家经典、传记散文、历代诗词都使他着迷；只要有书陪伴，他就感觉幸福、美满。"],["让读书人发愁的事情","家境贫困，灯油","家境贫乏，晚上看书别说蜡烛了，就是灯油也要节省着用。"],["读书人为了克服困难采取的办法","① 克制、背诵、编织 ② 漫步田野，发现萤火虫 ③ 制成萤火虫“灯笼”","油灯熄灭后，他克制情绪，默默背诵古诗；后来走到田野里，发现了萤火虫，就把萤火虫装进布兜，做成了“灯笼”。"],["读书人最后的成就","知名学者","日复一日的努力使他的学识与日俱增，最后成为知名学者。"],["这个故事给我们的启示","……并不可怕，可怕的是……","生活贫困并不可怕，可怕的是思想贫困、精神贫困、智慧贫困。"]]},PZ:{title:"修辞（3）比喻",vn:"So sánh, ẩn dụ",intro:"Không nói thẳng sự vật thế nào, mà dựa vào <b>đặc điểm giống nhau</b> giữa các sự vật, dùng <b>hình ảnh cụ thể</b> để ví von — đó là <b>比喻</b>. Từ so sánh hay gặp: <span class='zh'>像 · 好像 · 仿佛 · 犹如 · 似的 · 一样 · 是 · 成了</span>.",ex:[["传说古代有个爱书如命的读书人，每当他捧起书本就像是走进了知识的海洋。","Dùng sự rộng lớn của “biển cả” để ví tri thức mênh mông vô tận."],["别人批评你的缺点，就像医生治病一样，是为你好，绝不是和你过不去。",""],["远远的街灯明了，好像闪着无数的明星。天上的明星现了，好像点着无数的街灯。","(Quách Mạt Nhược)"]],q:"下列哪句没有使用比喻修辞手法",pvn:"(1) 母亲是大地，我就是小草；母亲是绿叶，我就是鲜花。　(2) 春天春天暖洋洋，果树开花满山岗，东坡桃花西坡李，杏花谢了梨花香。　(3) 我有一位不开口说话的老师，她就是字典。",practice:[["Câu nào KHÔNG dùng 比喻？","(2) — chỉ miêu tả cảnh xuân. (1) ví mẹ như đất / lá xanh; (3) ví từ điển như người thầy."]]},DP:[{title:"词汇（1）：看图片，熟悉下列名词",vn:"8 danh từ đời sống.",items:[["容器","róngqì","vật chứa","","不管使用什么样的容器，只要能盛水就行。"],["橙","chéng","cam; màu cam","","我喜欢吃橙子，也喜欢橙色。"],["首饰","shǒushi","đồ trang sức","","各式各样的首饰吸引了我们的目光。"],["传单","chuándān","tờ rơi","","墙上贴满了各种海报，也有人在路上发传单。"],["生肖","shēngxiào","con giáp","","在中国，生肖是用来记录人们出生年份的十二种动物。"],["棕色","zōngsè","màu nâu","","草地上有一只棕色的小狗。"],["粉色","fěnsè","màu hồng","","粉色的花儿开遍田野。"],["磁带","cídài","băng cát-xét","","现在已经很少有人再用老式录音机和磁带了。"]]},{title:"词汇（2）：熟悉下列文学方面的词语",vn:"Đọc đoạn văn: 他是一名<b>文艺</b>爱好者，尝试过各种不同<b>体裁</b>的写作：小说、诗歌、散文、<b>剧本</b>等。最近他写了一部<b>武侠</b>小说，<b>情节</b>曲折，引人入胜。",items:[["文艺","wényì","văn nghệ","文艺爱好者","他是一名文艺爱好者。"],["体裁","tǐcái","thể loại","不同体裁","小说、诗歌、散文都是文学体裁。"],["剧本","jùběn","kịch bản","写剧本","这部电影的剧本写得很好。"],["武侠","wǔxiá","võ hiệp","武侠小说","金庸的武侠小说很受欢迎。"],["情节","qíngjié","tình tiết","情节曲折","这部小说情节曲折，引人入胜。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"也许有人问，全国方言这么复杂，几万字的一本小书，够用吗？我们认为，在茫茫大海中，鱼网再大，也会有漏网之鱼。我们的网打算只捞与普通话不同的鱼。",o:["说话人是个作家","说话人是打鱼的","说话人喜欢看小说","说话人是语言研究者"],a:3,why:"Nói về sách phương ngữ; “鱼网” chỉ là 比喻. Có <span class='zh'>捞</span>!"},{n:2,say:"许大夫治病往往是一服药见效，三服药病就好，这种高手给人看病，我们觉得花多少钱都值。当碰上瘟疫来临的时候，许大夫就会拿上药挨家挨户去敲门，有患者马上免费治疗。",o:["许大夫医术十分高明","请许大夫看病要多花钱","许大夫一家一家去找病人","许大夫是个走街串巷的大夫"],a:0,why:"“一服药见效，三服药病就好”. C chỉ đúng khi có dịch."},{n:3,say:"儿童情感起源于父母的抚爱和家庭温馨气氛的熏陶。如果在家庭中父母能互敬互爱，和睦相处，善于处理好自己的情绪，孩子就能够获得爱和尊重，快乐健康地成长。",o:["家庭的影响是无形的","母亲是孩子快乐的源泉","应避免孩子负面情绪的蔓延","贫困与否不对孩子造成影响"],a:0,why:"<span class='zh'>熏陶</span> = ảnh hưởng thầm lặng (vô hình)."},{n:4,say:"《城南旧事》是中国新时期电影中少有的“言志”作品。这部弥漫着“淡淡的哀愁、沉沉的相思”的电影，用非常物质的东西编织出诗意的世界，又不失现实的真。",o:["《城市旧事》表现了乡愁","中国电影很讲究“言志”","《城南旧事》充满了诗意","诗意的世界都是不现实的"],a:2,why:"“编织出诗意的世界”. A: tên phim sai (城<b>市</b>). B: “少有的”."},{n:5,say:"中国是一个人均占有自然资源比较贫乏的国家，水资源、能源的危机随时都在冲击和影响一些企业的经济生产，同时森林资源人均占有率也不高。保护环境，充分利用有限的资源条件创造更多的社会经济效益，是每个企业应负的社会责任。",o:["中国的企业很有责任感","效率高的企业才能生存","中国资源人均占有率较低","资源贫乏是当今普遍现象"],a:2,why:"“人均占有自然资源比较贫乏”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：深圳显然是腾讯诞生的福地。如果当年的创业地址不是在深圳，挪个地方，您觉得今天又会是什么情形？\n男：腾讯离不开深圳。对比中国的其他城市，我觉得深圳总体的创业环境还是更适合自主科技创新型的中小民营企业发展并取得成功，这一点毋庸置疑。那时候深圳的口号是“时间就是金钱，效率就是生命”。第一次听到这话，我真的很震惊：金钱居然可以拿来当口号提！但它的确会让人们对时间、效率的迫切感前所未有地提升。\n女：您如何看待今天长大成人的腾讯？\n男：我觉得机遇很重要，至少占了五成吧。我们也不觉得自己特别聪明，我们做的东西都很简单，大家都能做。但是好的团队、公司的股份结构和投资者的合理搭配，这是很重要的，否则也不会成功。当然，时代的因素也是非常重要的，很多机遇是外界给予的，我们觉得很幸运。\n女：深圳汇聚了很多和您一样的知名企业家。在这个城市，您有什么感触？\n男：深圳跟其他城市还不一样，那些地方要么有政策，要么有别的条件，在客观环境下能做起来，在深圳企业完全是靠自己做起来的。这里是创业的热土，相信创业者的这种感觉会强烈得多。这里需要有创业的心态，需要有闯劲儿，需要珍惜时间。\n女：在闲暇时，您也会在这座城市的某个角落欣赏它的景致，或者享受某个美食城的招牌菜，或者看一场电影，过一下普通市民的生活吗？\n男：我本来就是普通市民。平时我就是上网、看看杂志、看看书。QQ和互联网对我来说已经不是工作了，更多的是一种爱好，是我生活的一部分。",qs:[{n:6,q:"关于深圳这座城市，下列哪项正确？",o:["这里政策好条件好","这里是创业的热土","没有人怀疑它的成功","城市对发展有迫切感"],a:1,why:"“这里是创业的热土”. A sai: đó là các nơi khác."},{n:7,q:"对于“时间就是金钱，效率就是生命”，男的持什么态度？",o:["怀疑","蔑视","反对","赞成"],a:3,why:"Ban đầu sốc, nhưng “的确会让人们对时间、效率的迫切感……提升”."},{n:8,q:"关于腾讯成长的有利因素，下列哪项正确？",o:["公司资金充裕","公司聪明人多","赶上了好时代","产品具有唯一性"],a:2,why:"“时代的因素也是非常重要的……我们觉得很幸运”."},{n:9,q:"男的在闲暇时会干些什么？",o:["外出旅行","学做美食","拍摄电影","上网、看书"],a:3,why:"“平时我就是上网、看看杂志、看看书”."},{n:10,q:"关于男的，下列哪项正确？",o:["他是知名的企业家","他闯过了无数难关","深圳是他的出生地","上下班都着迷于工作"],a:0,why:"“深圳汇聚了很多和您一样的知名企业家”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"落花在田野中孤独地飘零，寻找着能陪伴她一生的伴侣。流水静静地流淌，等待着能伴随他一世的朋友。\n他们就这样寻找着。终于有一天，落花与流水相遇了。落花仰慕流水的英俊潇洒，胸怀博大。流水欣赏落花的美丽多姿，温柔体贴。他们彼此吸引，相互依恋，成为世间的一段佳话。\n无奈，流水整日漂流不定。落花厌倦这种漂泊的生活，只盼能与爱人幸福相守。于是，他们开始争吵。\n落花说：“你就不能为我停留一刻吗？”\n流水说：“这是我的天性，你就不能随我一起游遍大江南北吗？”\n落花说：“我想要的是安定的生活啊。”\n流水低头不语，沉思良久，说：“以前的你是多么善解人意，温柔懂事，从不强迫我做任何事。你不是说过，我到哪儿，你就会随我到哪儿吗？”\n落花愕然，抬头看着流水，流下了怨恨的泪水：“以前的你是多么无微不至，关爱有加，就算我想要天上的星星，你也会摘给我。”\n吵了半天也没吵出个所以然，最终他们选择了分手。",qs:[{n:11,q:"关于落花，可以知道什么？",o:["文雅多情","自私任性","不愿漂泊","风雅幽默"],a:2,why:"“落花厌倦这种漂泊的生活”."},{n:12,q:"关于流水，可以知道什么？",o:["身体强壮","居无定所","会摘星星","天性好静"],a:1,why:"“流水整日漂流不定”."},{n:13,q:"关于落花、流水，下列哪项正确？",o:["他们相依相恋，相守终生","他们都希望有安定的生活","他们不堪忍受生活的平淡","他们吵不出结果，分手了"],a:3,why:"“吵了半天也没吵出个所以然，最终他们选择了分手”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"如今，说一个人干净，是个极高的评价。\n说一个男人干净，是说他对家人、对朋友、对同事胸怀坦荡，该负什么责任绝不躲躲闪闪，没有算计，没有欺瞒，不两面三刀，不见人说人话、见鬼说鬼话。在家里，他是好丈夫、好父亲；在单位，他是好部下、好同事、好上司；对朋友，他是可以交心的挚友。他不一定是社会名流，也不一定有巨额财富，他可能只是公交车上的一位普通男士，是风里来雨里去的为人父者，走入人群，他会立刻消失。但无数个这样的男人组合起来的家及社会，真实而平静。\n说一个女人干净，并非指外在衣着，而是指内在品德，安守本分，不招惹是非。干净的女人心中也有向往，就是不委屈自己行违心之事。走到哪儿，她们都可以直视任何人的眼光，笑起来，也是透着从心底升起的自信。她们的日子平静如水，她们把家庭打理得美满幸福。\n干干净净做人，规规矩矩做事，理应是条底线。有了这条底线，才能托起为人的更多的本真，才能远离更多的虚浮。\n守住这样的底线，说难也难，说不难也不难。",qs:[{n:14,q:"关于干净男人，下列哪项正确？",o:["为人真诚","胸怀天下","会做家务","很会哄人"],a:0,why:"“没有算计，没有欺瞒，不两面三刀”."},{n:15,q:"关于干净女人，下列哪项正确？",o:["衣着干净","光明磊落","会过日子","屈己待人"],a:1,why:"“可以直视任何人的眼光” = quang minh lỗi lạc. A sai: “并非指外在衣着”."},{n:16,q:"“干净”的含义是什么？",o:["美丽、善良","做事有底线","能克制私欲","讲究生活质量"],a:1,why:"“干干净净做人，规规矩矩做事，理应是条底线”."},{n:17,q:"根据这段话，可以知道什么？",o:["男人衣着一定要“干净”","“干净”人越来越少了","“干净”是个很高的标准","“干净”指从外到内讲卫生"],a:2,why:"“说一个人干净，是个极高的评价”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["林晓本名林朝阳，出身于广东佛山的大族富家子弟。","多谢我的家人，在我走上演艺道路后，始终默默地支持我。","部门经理需要提前制定人力计划，以免用人的时候忙乱不堪。","《纽约客》一直以高品质闻名，只刊发最好的小说、诗歌和散文。"],a:0,why:"<b>Trộn cấu trúc</b>: <span class='zh'>出身于……家庭</span> / <span class='zh'>是……子弟</span> — không nói <s>出身于……子弟</s>."},{n:19,o:["当他穿过耀眼的阳光向我走来的时候，我突然感到有些惊慌。","除了过生日，蜡烛已经成为现代城市生活中一种情趣的象征。","在我们已经无法离开的电脑键盘，每天不知有多少细菌在滋长。","一个老农看见蚂蚁搬家了，会忙着去田里开沟，他熟悉蚂蚁搬家的意义。"],a:2,why:"<b>Thiếu từ</b>: <span class='zh'>在……键盘<b>上</b></span>."},{n:20,o:["马拉松运动所表示的拼搏、进取是奥林匹克圣殿的支柱，许多人受其影响积极参与到这个项目中来。","听到这事，我半天说不出话，一种无法形容的痛楚紧紧地抓住了我，我感到血液凝固了，连呼吸都困难。","世界上最小的蟹要算豆蟹了。它的甲壳一般只有几毫米长，大的也不过1厘米多，最小的只有米粒般大小。","地震过后，山顶升起了一团浓烟，直上几千米的高空，像棵枝丫怒张的巨松。接着火光迸发，出现了比黑夜还黑的漆黑世界。"],a:0,why:"<b>Dùng từ không hợp</b>: <span class='zh'>所表示的</span> → <span class='zh'>所体现的</span>; “tinh thần” mới là trụ cột (đáp án sách: A)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"她小时候被狼叼走___。当她被人发现时，已经不能直立行走，而是像狼一样四肢落地___养成了狼的生活习性，没有人的语言和思维，没有人的___和兴趣。",o:["抚育　和　胸怀","赡养　也　天赋","养育　并　情感","饲养　却　知觉"],a:2,why:"<span class='zh'>被狼……养育</span>; <span class='zh'>并</span> nối hai vị ngữ; <span class='zh'>情感和兴趣</span>."},{n:22,text:"来城市前，我已做好了___的准备，省吃俭用，___下了足足半年的工资，___这些钱在北京起码够生活半年，现在看来，___生活半年，连半年的房租都不够。",o:["充实　留　原打算　就算","充分　存　原以为　别说","一定　挣　原预谋　别看","大量　剩　原安排　就是"],a:1,why:"<span class='zh'>充分的准备</span>; <span class='zh'>存工资</span>; <span class='zh'>原以为</span>; <span class='zh'>别说……连……都……</span> (Ngữ pháp 1!)."},{n:23,text:"谁也没有料到，正当中国的文化市场在___了改革浪潮的冲击，一波三折___地走出低谷走向新生之际，一___平地而起的盗版旋风迅速席卷了文化市场的各个角落，使我国的版权保护受到了极为___的挑战。",o:["经受　磕磕碰碰　股　严峻","忍受　来来回回　阵　严厉","应付　推推搡搡　场　重大","遭遇　拉拉扯扯　团　艰难"],a:0,why:"<span class='zh'>经受冲击</span>; <span class='zh'>磕磕碰碰</span> (AABB!); <span class='zh'>一股旋风</span>; <span class='zh'>严峻的挑战</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"朋友来看我，坐在我家历史悠久的沙发上，目光在屋中扫视了一圈后，扔下一句话：“(24)！”\n也是啊！屋子小得可怜；电视是结婚时买的；电脑是6年前的，只是凑合着用；手机就更别提了，用儿子的话说，(25)。\n朋友走了，我审视着熟悉的小屋，是有点儿寒酸。墙上没有结婚照，只有做了一辈子教书匠的祖父送我的一幅墨宝：(26)。屋里最多的就是书，天文、历史、散文、传记、历代诗选、儒家经典。我的书、儿子的书，随手都能抓到，那些书会让我的心平和安静。\n(27)。他待人宽厚，善良真诚，他了解我，我和他在一块儿就觉得心安。我也清楚他的喜好，他爱喝我熬的小米粥，爱吃我做的手擀面，不管多晚回来，(28)。每次吃完，他总会摸着肚子满足地说，舒服啊！还有我们的儿子，开朗健康、努力向上。难道我不是生活在天堂，不是最幸福的人吗？",opts:["老公是个打着灯笼都难找的好人","都什么年代了，这也太不像个家了","书山有路勤为径","我都会为他端上一碗","扔大街上都没人捡"],ans:{24:1,25:4,26:2,27:0,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"有人问我，作为总裁，最喜欢什么样的员工。我给出的回答是：情绪稳定。她诧异地问我为什么不是吃苦耐劳、聪明这样的要求？我说，这些根本算不上要求。\n为什么很多企业在雇佣人员的时候更倾向选择男性？为什么很多时候，并不是外在条件看来最优秀的人赢了？这其中有一个很大的差异，就是你是否能维持自己的情绪稳定，而这其实才是情商最最重要的组成部分。\n很多人以为情商就是会说话、会沟通、八面玲珑、长袖善舞，这些都不是情商的本意。所谓的情商，其实主要是指人在情绪、意志、耐受挫折等方面的品质。情商是由五种特征构成的：自我意识、控制情绪、自我激励、认知他人情绪和处理相互关系。当你认清情商的真正含义，你就会知道，很多人理解的情商其实都是错误的。而很多人所说的性格不好，其实就是情商不够。\n比如，性格内向，很多人评价为情商低，其实不然。我认识很多健谈的人，都不是天生外向型，包括我自己。内向的人依然可以成为演说家，比如前美国总统林肯，他其实是一个非常害羞和内向的人。所谓的内向和外向，只是他们喜欢的交流方式不同，他们对环境的适应能力不同，这些并不能决定谁的情商更高。",qs:[{n:29,q:"“我”喜欢的员工应具备哪项特质？",o:["聪明能干","责任心强","任劳任怨","情绪平稳"],a:3,why:"“我给出的回答是：情绪稳定”."},{n:30,q:"很多企业在雇佣人员时会非常看重：",o:["性别","学历","个人能力","外在条件"],a:0,why:"“更倾向选择男性”."},{n:31,q:"根据上文，下列说法正确的是：",o:["情商高的都是男人","情商高的人会表演","情商高的人都有小脾气","情商高的人不易泄气绝望"],a:3,why:"Tình thương = phẩm chất về cảm xúc, ý chí, <b>chịu đựng thất bại</b>. Có <span class='zh'>泄气 · 绝望</span>!"},{n:32,q:"关于性格内向，下列说法正确的是：",o:["内向的人都害羞","内向的人更会演说","内向不一定情商低","内向的人不与人交流"],a:2,why:"“性格内向，很多人评价为情商低，其实不然”."}]},{ins:"第33–36题：请选出正确答案。",text:"炎热的夏日，一条长椅上坐着一对母子。儿子正捧着报纸看，垂暮之年的母亲静静地坐在旁边。\n一只鸟飞落到草丛里，母亲似乎没看清，揉了揉眼睛，问了句：“那是什么？”儿子抬起头，答道：“一只鸟。”说完摊开报纸，接着看。\n母亲若有所思，眯着眼睛看了会儿，又问了声：“那是什么？”儿子皱起眉头：“我刚才说过了，是只鸟。”说完一抖手中的报纸，继续看下去。\n鸟儿飞起来，兜了个圈子落在草地上，母亲的视线也随之起落，又问了句：“那是什么？”儿子不耐烦了，强制自己咽下愤怒，大声说：“一只鸟，妈妈，一只鸟！”说完转过身，生气地盯着母亲。\n老人没看儿子，仍旧转向鸟儿，试探着又问了句：“那是什么？”儿子被彻底激怒了，大声地嚷道：“您到底要干什么？我已经说这么多遍啦！那是一只鸟！一只鸟！”\n母亲站起身，儿子不解地问：“您要去哪儿？”母亲示意他不用跟来，独自走回屋。\n一会儿母亲回来了，手中拿着个小本子。她坐下来翻到某页，递给儿子，指着其中一段，说：“念！”\n儿子念起来：“今天，我和刚满3岁的儿子坐在公园里，一只小鸟落到面前，儿子问了我21遍‘那是什么？’，我回答了21遍‘那是一只小鸟’。他问一遍，我就拥抱他一次，一遍又一遍，一点儿也不觉得烦，只是深深地感到他天真可爱。”\n老人的眼角露出幸福的光芒，仿佛又看到了往昔的一幕。\n儿子羞愧地合上本子，强忍泪水张开手臂搂紧母亲。他终于明白，母亲不是无理取闹，更不是患有阿尔兹海默症，只是看到了小鸟，回忆起往昔母子间的亲密。",qs:[{n:33,q:"根据上文，母亲：",o:["眼睛不太好","找儿子的麻烦","得了阿尔兹海默症","在寻找美好的回忆"],a:3,why:"“回忆起往昔母子间的亲密”."},{n:34,q:"关于儿子，下列哪项正确？",o:["认为母亲很唠叨","一张嘴就没好气","本质上是个孝顺的孩子","动作中流露出他讨厌母亲"],a:2,why:"Cuối cùng “羞愧……强忍泪水……搂紧母亲”."},{n:35,q:"文中最后一段画线词语“无理取闹”的意思是：",o:["莫名其妙","胡说八道","故意捣乱","强词夺理"],a:2,why:"<span class='zh'>无理取闹</span> = vô cớ gây chuyện → cố ý quấy rối."},{n:36,q:"下列哪项最适合做上文的标题：",o:["代沟","21和4","孤独的母亲","儿子的烦恼"],a:1,why:"Con hỏi mẹ 21 lần, mẹ hỏi con 4 lần — đối chiếu tình thương."}]}]},W:{task:"这篇课文给我们讲述了一个克服困难、勤奋学习的故事，故事的主人公因家境贫寒，没钱买灯油，可又酷爱读书，因此想出了借用萤火虫的光芒来读书的办法，终于成为知名学者。故事告诉我们生活的贫困并不可怕，可怕的是思想贫困、精神贫困。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Nhân vật","<span class='zh'>爱书如命</span>; sách khiến anh <span class='zh'>着迷</span>; không sợ rét nóng."],["Khó khăn","<span class='zh'>家境贫乏 · 别说蜡烛了，就是灯油也……</span>"],["Đèn tắt","<span class='zh'>熄灭 · 泄气 · 绝望 · 克制 · 默默背诵</span>."],["Đom đóm","<span class='zh'>田野 · 萤火虫来来回回地飞 · 布兜 · 灯笼</span>."],["Kết & bài học","<span class='zh'>日复一日 · 知名学者 · 贫困并不可怕，可怕的是……</span>"]],model:"萤火虫的灯光\n古代有一个爱书如命的读书人，天文地理、儒家经典、传记散文、历代诗词，都让他着迷。严寒、炎热和蚊子的骚扰都没有影响他读书的热情，只要有书陪伴，他就感觉幸福、美满。唯独让他发愁的是家境贫乏，晚上看书别说蜡烛了，就是灯油也要节省着用。\n一个闷热的夏夜，他正在读书，油灯忽然熄灭了，原来是灯油没有了。他有些泄气，绝望地看着眼前的黑暗，不知道怎样度过这个长夜。他努力克制着自己的情绪，默默地背诵刚读过的古诗，可是没有效果，于是他走出了房门。\n他漫步在田野中，忽然看见一大群萤火虫在低空来来回回地飞，尾巴上闪着亮光，成为黑暗中唯一耀眼的光芒。他抓住一只萤火虫，发现它的光虽然很小，但还算明亮。他想：如果把许多萤火虫集中在一起，不就成灯了吗？于是他找了个薄布兜，抓了一些萤火虫放在里面，把口袋扎住吊起来，一个“灯笼”就做成了。虽然没有油灯亮，看书还是可以的。从此，萤火虫做成的“灯”就夜夜陪伴着他。\n他虽然没有过人的天赋，但是日复一日的努力，使他的学识与日俱增，最后终于成为知名学者。\n生活贫困并不可怕，可怕的是思想贫困、精神贫困。贫困的经历也可以成为奋斗的动力和源泉。",check:["Có tiêu đề","Có nhân vật & khó khăn","Có tình huống đèn tắt","Có cách làm đèn đom đóm","Có kết quả & bài học","Dùng ít nhất 3: 别说 · 来来回回 · 挨 · 熄灭 · 泄气 · 克制 · 默默","Khoảng 400 chữ"]},SUM:{words:["捧","天文","儒家","传记","散文","历代","着迷","熏陶","胸怀","不堪","炎热","骚扰","贫乏","艰难","蜡烛","揉","挪","知觉","挨","美满","天堂","熄灭","泄气","眯","绝望","凝固","蔓延","克制","默默","背诵","编织","强制","田野","情形","耀眼","光芒","捞","摊","迸发","灯笼","天赋","贫困","财富","源泉"],patterns:[["别说 A，就是 / 连 B 也……","晚上看书别说蜡烛了，就是灯油也要节省着用。"],["AABB 地 / 的","只见一大群萤火虫在低空盘旋飞舞，来来回回地飞。"],["只要……，就……","只要有书读，挨饿受冻他都不怕。"],["……并不可怕，可怕的是……","生活贫困并不可怕，可怕的是思想贫困……"],["修辞：比喻","每当他捧起书本就像是走进了知识的海洋。"]],diff:["挨: + công cụ / hành động gây hại cụ thể (挨打 · 挨骂 · 挨一脚 · 挨饿) — 受: + tai họa / tổn thất / trạng thái / khen (受灾 · 受骗 · 受表扬 · 受累)","挨 ái (bị) / āi (sát cạnh) · 着迷 zháo · 传记 zhuàn · 散文 sǎn · 不堪 = không chịu nổi / Adj + 不堪 = cực kỳ"],sentences:["每当他捧起书本就像是走进了知识的海洋。","只要有书读，挨饿受冻他都不怕；只要有书陪伴，他就感觉幸福、美满，像是生活在天堂。","贫困的经历在有些人那儿可以成为财富，成为奋斗拼搏的动力和源泉。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết tóm tắt bài khóa ~400 chữ (mục 7).","Đặt 3 câu có 比喻 về việc học.","Làm Sách bài tập bài 26.","Đọc trước bài 27."]}});
