<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 29 · “笑”的备忘录 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-2-29",num:29,book:"HSK 标准教程 6（下）",unit:{n:8,zh:"人体探秘",vn:"Khám phá cơ thể người"},title:"“笑”的备忘录",vn:"Bản ghi nhớ về tiếng cười",chars:1154,source:"分别改编自《参考消息》同名文章",goals:["Đọc hiểu hai bài ngắn khoa học (1154 chữ): <b>(一) Não người “nghe” ra cười thật – cười giả</b> và <b>(二) Cười chưa chắc là thuốc tốt nhất</b>.","Dùng được 52 từ mới, nhất là nhóm <b>giao tiếp – thái độ</b>: <span class='zh'>庸俗 · 档次 · 难堪 · 虚伪 · 违背 · 回避 · 机灵 · 周密 · 诚挚 · 一丝不苟 · 分寸 · 恰当 · 斟酌</span> và nhóm <b>cơ thể – khoa học</b>: <span class='zh'>直觉 · 探测 · 智商 · 循环 · 收缩 · 氧气 · 脂肪 · 动脉 · 试验 · 实质</span>.","Nắm <span class='zh'>预先 · ……也好，……也罢</span>.","Phân biệt <span class='zh'>诸 — 各</span>; làm quen <b>修辞 (6): 设问 — tự hỏi tự đáp</b>.","Viết 缩写: tóm tắt mỗi bài khóa khoảng 200 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Bài khóa (一) · 预先 · 诸—各"],["Buổi 2","Nhóm 3 · Bài khóa (二) · 也好也罢 · 设问 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"一",name:"Đừng cười giả",paras:"Đoạn 1",zh:"假笑骗不了人",vn:"Có thể né tránh, lảng chuyện, nhưng đừng cười trái lòng — người khác đều nhận ra."},{tag:"一",name:"Não nhận ra",paras:"Đoạn 2–3",zh:"激活不同区域 · 实验 · 直觉",vn:"Cười giả và cười thật kích hoạt vùng não khác nhau; tình nguyện viên chỉ bằng trực giác đã phân biệt được."},{tag:"二",name:"Lợi ích",paras:"Đoạn 4–6",zh:"笑一笑十年少 · 实质性证据",vn:"Cười điều hòa cảm xúc, tuần hoàn máu, đốt calo, giảm xơ cứng động mạch, giảm căng thẳng."},{tag:"二",name:"Tác hại & chừng mực",paras:"Đoạn 7",zh:"副作用 · 分寸恰到好处",vn:"Cười quá có thể gây ngất, sóc hông; nên cười có chừng mực — dù đa số vẫn tin cười chẳng hại gì."}],warm1:{q:"你爱笑吗？你能听出别人是真笑还是假笑吗？怎么分辨出来的？对健康来说，笑是有益的还是有害的？有哪些益处或害处。",vn:"Bạn dựa vào gì để phân biệt cười thật / cười giả? Bấm 有 (đúng) / 无 (không).",items:[["😊","表情：眼角有没有皱纹","Nét mặt: khóe mắt có nếp nhăn không"],["🔊","声音：笑声自然不自然","Âm thanh: tiếng cười tự nhiên không"],["💪","笑能促进血液循环","Cười thúc đẩy tuần hoàn máu"],["⚠️","大笑也可能对身体不好","Cười lớn quá cũng có thể hại"]],talk:["你根据什么分辨真笑、假笑？","笑是否有益于健康？有什么害处？"],link:"Tiếng Việt: “Một nụ cười bằng mười thang thuốc bổ” ≈ <span class='zh'>笑一笑十年少</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"表",rule:"表 = <b>bày tỏ, thể hiện ra ngoài</b>.",w:[["表态","biǎotài","bày tỏ thái độ (có trong bài)"],["表示","biǎoshì","biểu thị"],["表达","biǎodá","diễn đạt"],["表决","biǎojué","biểu quyết"],["表白","biǎobái","bày tỏ, tỏ tình"],["表明","biǎomíng","chứng tỏ"],["表情","biǎoqíng","nét mặt"],["表现","biǎoxiàn","biểu hiện"],["表演","biǎoyǎn","biểu diễn"],["表露","biǎolù","bộc lộ"]]},{k:"违",rule:"违 = <b>làm trái, đi ngược</b>.",w:[["违心","wéixīn","trái lòng (có trong bài)"],["违背","wéibèi","làm trái (từ mới)"],["违反","wéifǎn","vi phạm"],["违法","wéifǎ","phạm pháp"],["违抗","wéikàng","chống lệnh"],["违禁","wéijìn","phạm cấm"],["违例","wéilì","phạm quy"],["违约","wéiyuē","vi phạm hợp đồng"],["违章","wéizhāng","vi phạm quy định"],["违法乱纪","wéifǎ-luànjì","làm trái pháp luật kỷ cương"],["事与愿违","shìyǔyuànwéi","sự việc trái ý muốn"]]},{k:"活",rule:"活 = <b>sống, linh hoạt, chuyển động</b>.",w:[["激活","jīhuó","kích hoạt (có trong bài)"],["灵活","línghuó","linh hoạt"],["活动","huódòng","hoạt động"],["活络","huóluò","linh động"],["活水","huóshuǐ","nước chảy"],["活血","huóxuè","hoạt huyết"],["活扣","huókòu","nút thòng lọng"],["活期","huóqī","không kỳ hạn"],["活性","huóxìng","hoạt tính"]]},{k:"隐",rule:"隐 = <b>ẩn, giấu</b>.",w:[["隐含","yǐnhán","ẩn chứa (có trong bài)"],["隐瞒","yǐnmán","giấu giếm (có trong bài)"],["隐藏","yǐncáng","che giấu"],["隐蔽","yǐnbì","ẩn nấp"],["隐居","yǐnjū","ở ẩn"],["隐秘","yǐnmì","bí mật"],["隐情","yǐnqíng","nỗi niềm khó nói"],["隐忍","yǐnrěn","nhẫn nhịn"],["隐士","yǐnshì","ẩn sĩ"],["隐私","yǐnsī","đời tư"],["隐退","yǐntuì","lui về"],["隐姓埋名","yǐnxìng-máimíng","mai danh ẩn tích"]]}]},vgroups:[{name:"Nhóm 1 · Bài (一) đoạn 1",sub:"Đừng cười giả",from:1,to:15},{name:"Nhóm 2 · Bài (一) đoạn 2–3",sub:"Não nhận ra cười thật – giả",from:16,to:29},{name:"Nhóm 3 · Bài (二)",sub:"Cười chưa chắc là thuốc tốt nhất",from:30,to:52}],V:[[1,"备忘录","bèiwànglù","dt.","bị vong lục","bản ghi nhớ",1,"","备忘的记录；外交文书的一种。","“笑”的备忘录","我把要做的事写在备忘录上。","Tôi ghi việc cần làm vào sổ ghi nhớ.",[],"SBT câu 18B."],[2,"岂有此理","qǐyǒucǐlǐ","thành ngữ","khởi hữu thử lý","há có lý ấy, sao lại có chuyện như thế được",1,"成","哪有这样的道理（对不合理的事表示气愤）。","真是岂有此理","他竟然不认账，真是岂有此理！","Hắn lại chối bay, thật vô lý hết sức!",[],"Bài tập 2①. SBT câu 19A."],[3,"庸俗","yōngsú","tt.","dung tục","tầm thường, thông tục",1,"","平庸鄙俗；不高尚。","庸俗、不上档次的笑话","这部电影内容很庸俗。","Bộ phim này nội dung rất tầm thường.",[],"SBT câu 22C."],[4,"档次","dàngcì","dt.","đáng thứ","đẳng cấp, cấp bậc",1,"","按一定标准分成的不同等级。","不上档次的笑话","这家酒店档次很高。","Khách sạn này đẳng cấp cao.",["上档次"],"Bài tập 1: <span class='zh'>存档 · 档案 · 高档 · 低档</span>."],[5,"诸位","zhūwèi","đt.","chư vị","các vị",1,"","总称所指的若干人（敬辞）。","诸位，如果你不想难堪……","诸位有什么意见，请提出来。","Các vị có ý kiến gì xin nêu ra.",[],"Xem <b>辨析 诸—各</b>. SBT câu 31."],[6,"难堪","nánkān","tt.","nan kham","khó xử, lúng túng, bối rối",1,"","难为情；令人难以忍受。","如果你不想难堪","他当众批评我，让我很难堪。","Anh ấy phê bình tôi trước mặt mọi người, khiến tôi rất ngượng.",[],"SBT câu 22D."],[7,"虚伪","xūwěi","tt.","hư ngụy","giả dối",1,"","不真实；不实在；做假。","虚伪、违背心意的笑声","我讨厌虚伪的人。","Tôi ghét kẻ giả dối.",[],"SBT câu 33B: <span class='zh'>憎恶虚伪</span>."],[8,"违背","wéibèi","đgt.","vi bội","làm trái, đi ngược lại",1,"","违反；不遵守。","违背心意的笑声","不能违背自己的良心。","Không thể làm trái lương tâm.",[],"Khởi động 2: nhóm chữ <span class='zh'>违</span>."],[9,"回避","huíbì","đgt.","hồi tị","né tránh, lẩn tránh",1,"","让开；躲开。","你可以回避","他总是回避这个问题。","Anh ấy luôn né tránh vấn đề này.",[],"Bài tập 1: <span class='zh'>躲避 · 避雨 · 避免 · 避重就轻</span>. SBT nghe 14–17: <span class='zh'>不可回避</span>."],[10,"岔","chà","đgt.","xóa","rẽ, lái theo hướng khác",1,"","转移话题等。","可以把话题岔开","他故意把话岔开了。","Anh ta cố ý lảng sang chuyện khác.",["岔开","岔气"],"Đoạn 7: <span class='zh'>岔气</span> = sóc hông."],[11,"装聋装哑","zhuānglóng zhuāngyǎ","thành ngữ","trang lung trang á","giả câm giả điếc, giả vờ không biết",1,"成","故意装作听不见、不说话。","可以装聋装哑","问他什么他都装聋装哑。","Hỏi gì anh ta cũng giả câm giả điếc.",["聋哑 lóngyǎ"],"<span class='zh'>聋哑</span> (tt.) = câm điếc. SBT câu 36."],[12,"画蛇添足","huàshé-tiānzú","thành ngữ","họa xà thiêm túc","vẽ rắn thêm chân, làm chuyện dư thừa",1,"成","比喻做了多余的事，反而不恰当。","不要画蛇添足，违心地笑","这句话是画蛇添足，删掉吧。","Câu này là thừa, xóa đi.",[],"SBT câu 20B."],[13,"机灵","jīling","tt.","cơ linh","thông minh, lanh lợi",1,"","聪明伶俐；机智。","不管你多机灵","这孩子真机灵。","Đứa bé này thật lanh lợi.",[],"SBT câu 22C."],[14,"周密","zhōumì","tt.","chu mật","chu đáo cẩn thận",1,"","周到而细密。","掩饰得多么周密","计划做得很周密。","Kế hoạch làm rất chu đáo.",[],"Bài tập 1: <span class='zh'>周围 · 周全 · 周岁 · 周末</span>; 3②."],[15,"途径","tújìng","dt.","đồ kính","con đường, cách, phương pháp",1,"","路径（多用于比喻）。","通过什么途径识别","解决问题的途径有很多。","Có nhiều cách giải quyết vấn đề.",[],""],[16,"虚假","xūjiǎ","tt.","hư giả","giả tạo, giả dối",1,"","跟实际不符合。","虚假的笑声","这是虚假广告。","Đây là quảng cáo sai sự thật.",[],""],[17,"特定","tèdìng","tt.","đặc định","riêng biệt, nhất định",1,"","特别指定的；某一个。","特定区域","在特定的条件下……","Trong điều kiện nhất định…",[],""],[18,"缘故","yuángù","dt.","duyên cố","nguyên do, nguyên nhân",1,"","原因。","分析假笑的缘故","不知什么缘故，他没来。","Không biết vì lý do gì anh ấy không đến.",[],""],[19,"意向","yìxiàng","dt.","ý hướng","ý đồ, mục đích",1,"","意图；目的。","假笑者的意向","双方签订了合作意向书。","Hai bên ký thư ý định hợp tác.",["购买意向"],"Bài tập 3②. SBT nghe câu 3D."],[20,"诚挚","chéngzhì","tt.","thành chí","chân thành, chân thật",1,"","诚恳真挚。","诚挚的笑声","表示诚挚的感谢。","Bày tỏ lời cảm ơn chân thành.",[],"Bài 28: <span class='zh'>真挚</span>."],[21,"一丝不苟","yìsī-bùgǒu","thành ngữ","nhất ti bất cẩu","cẩn thận tỉ mỉ",1,"成","形容办事认真，连最细微的地方也不马虎。","一丝不苟的研究者","他工作一丝不苟。","Anh ấy làm việc cẩn thận tỉ mỉ.",[],"Bài tập 3②. SBT câu 20A."],[22,"倾听","qīngtīng","đgt.","khuynh thính","lắng nghe, chú ý nghe",1,"","细心地听取。","让志愿者倾听网站视频中的笑声","学会倾听别人的意见。","Học cách lắng nghe ý kiến người khác.",[],"SBT câu 33A."],[23,"视频","shìpín","dt.","thị tần","video, clip",1,"","视频信号；网上的影像内容。","网站视频","我在网上看了一个视频。","Tôi xem một video trên mạng.",[],""],[24,"一目了然","yímù-liǎorán","thành ngữ","nhất mục liễu nhiên","vừa nhìn đã hiểu",1,"成","一眼就看得很清楚。","测试结果一目了然","表格做得一目了然。","Bảng làm rõ ràng, nhìn là hiểu.",[],"SBT câu 19D."],[25,"预先","yùxiān","phó.","dự tiên","trước, sẵn, sớm",1,"","在事情发生或进行之前。","在预先未被告知测试目的的情况下","要预先订好旅馆。","Phải đặt khách sạn trước.",[],"Xem <b>Ngữ pháp: 预先</b>. SBT câu 21A."],[26,"直觉","zhíjué","dt.","trực giác","trực giác",1,"","未经分析推理的直接感觉。","仅凭直觉","我的直觉告诉我他在说谎。","Trực giác bảo tôi anh ta nói dối.",[],""],[27,"探测","tàncè","đgt.","thám trắc","thăm dò, phát hiện ra",1,"","用仪器考察、测量。","探测他人喜悦之情真伪","探测海底资源。","Thăm dò tài nguyên đáy biển.",[],"SBT câu 36D."],[28,"智商","zhìshāng","dt.","trí thương","chỉ số thông minh, IQ",1,"","智力商数。","这不完全是智商问题","他智商很高。","IQ của cậu ấy rất cao.",[],""],[29,"提炼","tíliàn","đgt.","đề luyện","lọc, tinh chế, rút ra",1,"","用化学或物理方法从化合物中提取；比喻提取精华。","提炼出真假笑声背后的信息","从生活中提炼语言。","Chắt lọc ngôn ngữ từ cuộc sống.",[],"Bài tập 1: <span class='zh'>提前 · 前提 · 提取 · 提心吊胆</span>. SBT nghe câu 5."],[30,"相声","xiàngsheng","dt.","tướng thanh","tấu hài",1,"","一种曲艺形式，用说笑话、问答等引起观众发笑。","中国人喜欢听相声","他是有名的相声演员。","Ông ấy là diễn viên tấu hài nổi tiếng.",[],"SBT câu 20D."],[31,"座右铭","zuòyòumíng","dt.","tọa hữu minh","lời răn, lời cách ngôn",1,"","写出来放在座位旁边的格言。","被一些人当作生活的座右铭","“活到老，学到老”是我的座右铭。","“Học đến già” là châm ngôn của tôi.",[],"SBT câu 18C."],[32,"通用","tōngyòng","đgt.","thông dụng","thông dụng, dùng phổ biến",1,"","普遍使用。","生活中最通用","英语是国际通用语言。","Tiếng Anh là ngôn ngữ quốc tế thông dụng.",[],"Bài tập 2④."],[33,"调节","tiáojié","đgt.","điều tiết","điều chỉnh, điều hòa",1,"","从数量上或程度上调整。","笑可以调节情绪","空调可以调节温度。","Điều hòa có thể điều chỉnh nhiệt độ.",[],"SBT câu 32."],[34,"循环","xúnhuán","đgt.","tuần hoàn","tuần hoàn",1,"","事物周而复始地运动或变化。","促进血液循环","血液在体内不断循环。","Máu tuần hoàn liên tục trong cơ thể.",["恶性循环"],"Bài tập 3①."],[35,"收缩","shōusuō","đgt.","thu súc","co lại, rút lại",1,"","由大变小或由长变短。","腹肌收缩","心脏有规律地收缩和舒张。","Tim co và giãn có quy luật.",[],"Bài tập 3①."],[36,"氧气","yǎngqì","dt.","dưỡng khí","oxy",1,"","氧的通称。","所吸收的氧气","植物能产生氧气。","Thực vật tạo ra oxy.",[],""],[37,"桨","jiǎng","dt.","tưởng","mái chèo",1,"","划船用具。","用桨划船10分钟","他用力划着桨。","Anh ra sức chèo.",[],""],[38,"试验","shìyàn","đgt.","thí nghiệm","thử nghiệm",1,"","为了察看某事的结果或某物的性能而从事某种活动。","有人做过这样的试验","这种新药还在试验中。","Thuốc mới này còn đang thử nghiệm.",[],"SBT nghe 11–13: <span class='zh'>临床试验</span>."],[39,"脂肪","zhīfáng","dt.","chi phương","mỡ, chất béo",1,"","有机化合物，存在于人体和动物的皮下组织及植物体中。","帮助消耗脂肪","少吃脂肪含量高的食物。","Ăn ít đồ nhiều chất béo.",[],"Bài tập 3①."],[40,"动脉","dòngmài","dt.","động mạch","động mạch",1,"","把心脏中压出来的血液输送到全身各部分的血管。","缓解动脉硬化","动脉硬化是一种常见病。","Xơ cứng động mạch là bệnh thường gặp.",["动脉硬化"],"Bài tập 3①."],[41,"实质","shízhì","dt.","thực chất","bản chất, thực chất",1,"","本质。","实质性的证据","问题的实质在于……","Thực chất vấn đề nằm ở…",["实质性"],"Bài tập 1 (ví dụ): <span class='zh'>本质 · 性质 · 品质 · 素质</span>; 2⑤."],[42,"肆无忌惮","sìwú-jìdàn","thành ngữ","tứ vô kỵ đạn","không kiêng nể gì cả",1,"成","非常放肆，一点儿没有顾忌。","在肆无忌惮地笑过后","他肆无忌惮地破坏环境。","Hắn phá hoại môi trường không chút kiêng dè.",[],"SBT câu 19C."],[43,"损坏","sǔnhuài","đgt.","tổn hoại","làm hư hại, gây tổn hại",1,"","使失去原来的使用效能。","损坏人体健康","损坏公物要赔偿。","Làm hỏng đồ công phải bồi thường.",[],"Bài tập 3①."],[44,"倾向","qīngxiàng","đgt.","khuynh hướng","thiên về, nghiêng về",1,"","偏于赞成（对立事物中的一方）。","更倾向于笑不是坏事","我倾向于第二个方案。","Tôi nghiêng về phương án thứ hai.",[],"Còn là dt.: <span class='zh'>不良倾向</span>. SBT câu 35D."],[45,"分寸","fēncun","dt.","phân thốn","chừng mực, giới hạn thích hợp",1,"","说话或做事的适当限度。","分寸要掌握得恰到好处","说话要有分寸。","Nói năng phải có chừng mực.",[],"SBT nghe 6–10: <span class='zh'>分寸把握不好</span>."],[46,"恰到好处","qiàdào-hǎochù","thành ngữ","kháp đáo hảo xứ","vừa đúng, vừa phải",1,"成","说话、办事正好达到最适当的地步。","掌握得恰到好处","盐放得恰到好处。","Muối nêm vừa vặn.",[],"SBT câu 8D."],[47,"是非","shìfēi","dt.","thị phi","điều phải trái, cái đúng sai",1,"","正确的和错误的；口舌。","笑的是非无须探讨","明辨是非。","Phân rõ phải trái.",[],"Bài 28: <span class='zh'>明辨是非</span>."],[48,"探讨","tàntǎo","đgt.","thám thảo","nghiên cứu thảo luận",1,"","研究讨论。","无须探讨","我们一起探讨这个问题。","Chúng ta cùng bàn về vấn đề này.",[],"SBT câu 15B."],[49,"收益","shōuyì","dt.","thu ích","lợi ích",1,"","生产上或商业上的收入。","其收益则是显而易见的","这项投资收益很高。","Khoản đầu tư này lợi nhuận cao.",[],"Bài tập 3②. SBT nghe câu 4."],[50,"起哄","qǐ hòng","đgt.","khởi hống","làm ầm ĩ cả lên",1,"","（许多人）胡闹；搅扰。","高兴了，起起哄","大家都在起哄。","Mọi người đang làm ồn ào.",[],"SBT nghe câu 2."],[51,"斟酌","zhēnzhuó","đgt.","châm chước","cân nhắc, đắn đo",1,"","考虑事情、文字等是否可行或适当。","斟酌分寸掌握得恰当不恰当","这件事你再斟酌斟酌。","Việc này anh cân nhắc thêm.",[],"Bài tập 2⑥."],[52,"恰当","qiàdàng","tt.","kháp đáng","thích hợp, thỏa đáng",1,"","合适；妥当。","掌握得恰当不恰当","用词不恰当。","Dùng từ không thỏa đáng.",[],"Bài tập 3②."]],extra:[["敷衍","fūyǎn","qua loa, chiếu lệ"],["表态","biǎotài","bày tỏ thái độ"],["违心","wéixīn","trái lòng"],["掩饰","yǎnshì","che đậy"],["装模作样","zhuāngmú-zuòyàng","làm bộ làm tịch"],["激活 · 破译","jīhuó · pòyì","kích hoạt · giải mã"],["隐瞒","yǐnmán","giấu giếm"],["卡路里","kǎlùlǐ","calo (calorie)"],["捧腹大笑","pěngfù dàxiào","ôm bụng cười"],["岔气","chàqì","sóc hông"],["有百益而无一害","yǒu bǎi yì ér wú yí hài","trăm lợi không một hại"]],T:[{zh:"真是岂有此理，难道我们听到庸俗、不上档次的笑话假笑两声、敷衍一下也不可以吗？可是，好像确实不行。诸位，如果你不想难堪，不想让别人发现你发出的是虚伪、违背心意的笑声，你可以回避，可以不表态，可以把话题岔开，可以装聋装哑，但不要画蛇添足，违心地笑。因为只要你笑，不管你多机灵，不管你掩饰得多么周密，别人都能看出你的笑是真心实意，还是虚情假意、装模作样。有人不禁要问，人是通过什么途径识别“笑”背后的真实情感呢？研究者发现，我们在听到发自内心的笑声和虚假的笑声时，大脑会呈现出完全不同的反应。",vn:"Thật vô lý hết sức — lẽ nào nghe một câu chuyện cười tầm thường, kém đẳng cấp, ta cười giả hai tiếng cho qua cũng không được sao? Thế nhưng, hình như đúng là không được. Thưa các vị, nếu bạn không muốn khó xử, không muốn người khác phát hiện tiếng cười của bạn là giả dối, trái lòng, bạn có thể né tránh, có thể không bày tỏ thái độ, có thể lảng sang chuyện khác, có thể giả câm giả điếc, nhưng đừng vẽ rắn thêm chân mà cười trái lòng. Bởi chỉ cần bạn cười, dù bạn lanh lợi đến đâu, che đậy chu đáo thế nào, người khác đều nhận ra nụ cười của bạn là thật lòng hay giả bộ, làm bộ làm tịch. Có người không khỏi hỏi: con người dựa vào con đường nào để nhận ra cảm xúc thật đằng sau “nụ cười”? Các nhà nghiên cứu phát hiện, khi nghe tiếng cười từ đáy lòng và tiếng cười giả tạo, não bộ phản ứng hoàn toàn khác nhau.",idea:"（一）大脑能“听”出笑声的真假 — Đừng cười giả.",q:["为什么说不要用假笑敷衍别人？"],note:[["真是岂有此理，难道……吗？可是，好像确实不行。","Xem 修辞: 设问 — tự hỏi tự đáp."],["你可以……，可以……，可以……，可以……，但不要……","Điệp “可以” 4 lần (排比)."],["不管……，不管……，别人都……","Dù… dù… thì vẫn…"]]},{zh:"假笑声会激活大脑中用于破译情感信息的特定区域，同时大脑会自动分析假笑的缘故，假笑者想隐瞒什么，以及假笑者的意向；诚挚的笑声则会激活大脑中与快乐和积极情绪相关的区域。为了证实这一理论，一丝不苟的研究者让志愿者倾听网站视频中的笑声，同时记录他们大脑的反应，并将志愿者听到真笑与假笑时大脑的反应做对比。测试结果一目了然，志愿者在预先未被告知测试目的的情况下，仅凭直觉就能准确地分辨出假笑声。天呀，人的大脑中竟然深藏着一双能够探测他人喜悦之情真伪的眼睛！",vn:"Tiếng cười giả kích hoạt vùng đặc thù trong não dùng để giải mã thông tin cảm xúc, đồng thời não tự động phân tích nguyên do của nụ cười giả, người cười giả muốn giấu điều gì và ý đồ của họ; còn tiếng cười chân thành thì kích hoạt vùng não liên quan đến niềm vui và cảm xúc tích cực. Để chứng thực lý thuyết này, các nhà nghiên cứu tỉ mỉ cho tình nguyện viên nghe tiếng cười trong video trên mạng, đồng thời ghi lại phản ứng não của họ, rồi so sánh phản ứng khi nghe cười thật và cười giả. Kết quả nhìn là rõ: dù không được báo trước mục đích thí nghiệm, tình nguyện viên chỉ bằng trực giác đã phân biệt chính xác tiếng cười giả. Trời ơi, trong não người lại ẩn sâu một đôi mắt có thể dò ra niềm vui của người khác là thật hay giả!",idea:"Thí nghiệm: não phân biệt được.",q:["人们通过什么途径识别假笑的？"],note:[["……；……则……","<span class='zh'>则</span> nối hai vế đối lập."],["在预先未被告知……的情况下","Xem Ngữ pháp 1: <span class='zh'>预先</span>."],["一双能够探测……的眼睛","Ẩn dụ (bài 26: 比喻)."]]},{zh:"研究者指出：“人类大脑对于笑声中所隐含的社会和情感信息非常敏感，这不完全是智商问题。当志愿者听到笑声时，会开启大脑中与心智相关的区域，从而获知他人的情感或精神状态，有些志愿者还动用了大脑中控制运动和感知的部分，进而更精准地提炼出真假笑声背后的信息。”",vn:"Các nhà nghiên cứu chỉ ra: “Não người rất nhạy cảm với thông tin xã hội và cảm xúc ẩn chứa trong tiếng cười, đây không hoàn toàn là vấn đề chỉ số thông minh. Khi nghe tiếng cười, tình nguyện viên mở vùng não liên quan đến tâm trí, từ đó biết được trạng thái cảm xúc, tinh thần của người khác; một số người còn huy động cả phần não điều khiển vận động và cảm giác, nhờ đó rút ra chính xác hơn thông tin đằng sau tiếng cười thật – giả.”",idea:"Kết quả nghiên cứu.",q:["研究结果是什么？"],note:[["从而……，进而……","Từ đó… tiến thêm một bước…"]]},{zh:"中国人喜欢听相声，因为它逗笑。",vn:"Người Trung Quốc thích nghe tấu hài, vì nó gây cười.",idea:"（二）笑未必是最佳良药 — Dẫn đề.",q:[],note:[["未必","Chưa chắc."]]},{zh:"“笑有益于健康”几乎得到了全世界的认可，“笑一笑十年少”“一笑解千愁”不仅被大家认可，甚至被一些人当作生活的座右铭。中国人深信开怀大笑也好，哈哈傻笑也罢，哪怕是私下里偷偷地笑，都会是生活中最通用，而且管用的治病良方。",vn:"“Cười có lợi cho sức khỏe” gần như được cả thế giới công nhận; “cười một cái trẻ ra mười tuổi”, “một nụ cười giải nghìn nỗi sầu” không chỉ được mọi người thừa nhận, thậm chí còn được một số người coi là châm ngôn sống. Người Trung Quốc tin chắc rằng cười sảng khoái cũng được, cười ngây ngô cũng được, kể cả lén cười một mình, đều là phương thuốc chữa bệnh thông dụng nhất mà lại hiệu nghiệm nhất trong cuộc sống.",idea:"Niềm tin: cười là thuốc.",q:["中国人对笑有什么看法？"],note:[["开怀大笑也好，哈哈傻笑也罢，……都……","Xem Ngữ pháp 2: <span class='zh'>……也好，……也罢</span>."],["哪怕……","Cho dù…"]]},{zh:"有研究证实，笑可以调节情绪，可以促进血液循环和腹肌收缩，100次捧腹大笑所吸收的氧气相当于用桨划船10分钟的吸氧量。有人做过这样的试验，开怀大笑一整天，可以燃烧掉2000卡路里，从而帮助消耗脂肪，减轻体重，同时，笑有助于缓解动脉硬化，有助于消除紧张感，这就是笑有利于健康的实质性的证据。",vn:"Có nghiên cứu chứng thực: cười có thể điều hòa cảm xúc, thúc đẩy tuần hoàn máu và co cơ bụng; 100 lần ôm bụng cười lượng oxy hấp thụ tương đương chèo thuyền 10 phút. Có người từng thử nghiệm: cười sảng khoái cả ngày có thể đốt 2000 calo, nhờ đó giúp tiêu hao mỡ, giảm cân; đồng thời, cười giúp làm dịu xơ cứng động mạch, giúp xóa cảm giác căng thẳng — đó là bằng chứng thực chất cho thấy cười có lợi cho sức khỏe.",idea:"Bằng chứng lợi ích.",q:["为什么说笑是治病良方？"],note:[["相当于","Tương đương với."],["有助于……，有助于……","Giúp ích cho…"]]},{zh:"然而，笑，真的是人生旅途中的最佳良药吗？答案似乎不是那么肯定。有研究人员表示，笑也不是有百益而无一害的，有时它还会产生副作用。有医生就碰到过这样的案例：有人在肆无忌惮地笑过后因心跳加速而昏迷，而大笑到“几乎笑破肚皮”可能会导致岔气，心脏不舒服，甚至损坏人体健康。新的研究结果对笑“有百益而无一害”的观点提出了挑战，似乎更倾向于笑不是坏事，但分寸要掌握得恰到好处。可是多数人还是深信，笑的是非无须探讨，任何形式的幽默，伤害风险都不高，其收益则是显而易见的，况且，真是好朋友在一起，高兴了，起起哄，或是遇到了开心事，哪里还顾得上斟酌分寸掌握得恰当不恰当呢？",vn:"Thế nhưng, cười có thật là liều thuốc tốt nhất trên hành trình đời người? Câu trả lời dường như không chắc chắn như vậy. Có nhà nghiên cứu cho biết, cười cũng chẳng phải trăm lợi không một hại, đôi khi còn có tác dụng phụ. Có bác sĩ từng gặp ca bệnh: một người sau khi cười không kiêng dè đã hôn mê vì tim đập quá nhanh; còn cười đến mức “suýt vỡ bụng” có thể gây sóc hông, khó chịu ở tim, thậm chí tổn hại sức khỏe. Kết quả nghiên cứu mới đã thách thức quan điểm “trăm lợi không một hại”, dường như nghiêng về: cười không phải điều xấu, nhưng phải giữ chừng mực vừa phải. Thế nhưng đa số vẫn tin chắc: chuyện phải trái của tiếng cười chẳng cần bàn, mọi kiểu hài hước đều ít rủi ro, còn lợi ích thì ai cũng thấy; huống hồ bạn thân ở bên nhau, vui lên thì làm ồn một chút, hoặc gặp chuyện vui, đâu còn để ý cân nhắc chừng mực có thỏa đáng hay không?",idea:"Tác hại & chừng mực.",q:["笑有什么坏处？怎么笑才健康？"],note:[["笑，真的是……吗？答案似乎不是那么肯定。","Xem 修辞: 设问."],["因……而……","Vì… mà…"],["况且","Huống hồ, hơn nữa."],["哪里还顾得上……呢？","Câu hỏi tu từ = chẳng để ý được."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:1,word:"预先",zh:"预先",py:"yùxiān",tag:"Chú thích 1 · phó từ",mean:"Phó từ, nghĩa là <b>trước khi sự việc xảy ra hoặc hành động tiến hành</b> thì đã làm một việc nào đó — “trước, sẵn”.",forms:["预先 + V（订好 / 准备 / 通知）","预先 + 没（有）/ 未 + V"],ex:[["那里一年四季都是旅游旺季，到那里去旅行，一定要预先订好旅馆。","Nơi đó bốn mùa đều đông khách, đi du lịch nhất định phải đặt khách sạn trước."],["大家预先都没有想到，本届绘画展览竟然这么受欢迎。","Mọi người đều không ngờ trước được triển lãm tranh lần này lại được hoan nghênh đến vậy."],["志愿者在预先未被告知测试目的的情况下，仅凭直觉就能准确地分辨出假笑声。","",1]],tips:["Gần nghĩa <span class='zh'>事先 · 提前</span>.","Bài tập 2②."],practice:{q:"用“预先”完成句子",type:"complete",items:[["这事她________，我最近都忙糊涂了，忘了告诉你了。","这事她预先通知过我，我最近都忙糊涂了，忘了告诉你了。"],["他________的是，居然有那么多朋友，在他最困难的时候向他伸出了援手。","他预先没有想到的是，居然有那么多朋友……"],["……送公文的到了，吃饱喝足，稍稍休息一下，换一匹________，继续赶路。","……换一匹预先准备好的马，继续赶路。"]]}},{id:"g2",grp:2,word:"",zh:"……也好，……也罢",py:"yěhǎo, yěbà",tag:"Chú thích 2",mean:"Dùng để <b>liệt kê</b>, biểu thị <b>trong bất kỳ trường hợp nào cũng đều như vậy</b>. Cũng có thể nói <span class='zh'>……也好，……也好</span> / <span class='zh'>……也罢，……也罢</span>. Vế sau thường đi với <span class='zh'>都 · 也</span>.",forms:["A 也好，B 也罢，S 都 / 也……"],ex:[["中国人深信开怀大笑也好，哈哈傻笑也罢，哪怕是私下里偷偷地笑，都会是生活中最通用，而且管用的治病良方。","",1],["退休以后别人都养养花，喂喂鸟，可是花也好，鸟也好，都引不起他的兴趣。","Nghỉ hưu người ta trồng hoa nuôi chim, nhưng hoa cũng vậy, chim cũng vậy, đều không khiến ông hứng thú."],["开汽车也罢，骑自行车也罢，行进中打电话都会影响注意力与反应能力。","Lái ô tô hay đi xe đạp, vừa đi vừa gọi điện đều ảnh hưởng sự chú ý và phản xạ."]],tips:["Gần <span class='zh'>无论 / 不管……都……</span>.","Bài tập 2③."],practice:{q:"用“……也好 / 也罢，……也好 / 也罢”改写句子",type:"complete",items:[["是上学还是工作，只要你自己愿意就行。","上学也好，工作也罢，只要你自己愿意就行。"],["考试已经完了，考得好不好，再想也没用了。","考试已经完了，考得好也好，不好也罢，再想也没用了。"],["不管明天是什么天气，刮风或者下雨，都不能影响我们六点准时出发。","不管明天是什么天气，刮风也好，下雨也罢，都不能影响我们六点准时出发。"]]}},{id:"g3",grp:0,word:"画蛇添足",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>岂有此理</span> = thật vô lý (bực tức). <span class='zh'>画蛇添足</span> = vẽ rắn thêm chân. <span class='zh'>一丝不苟</span> = tỉ mỉ. <span class='zh'>一目了然</span> = nhìn là rõ. <span class='zh'>肆无忌惮</span> = không kiêng dè. <span class='zh'>恰到好处</span> = vừa vặn.",forms:["真是岂有此理！","S + 一丝不苟（地）+ V","掌握得恰到好处"],ex:[["但不要画蛇添足，违心地笑。","",1],["测试结果一目了然。","",1],["分寸要掌握得恰到好处。","",1]],tips:["Bài tập 2①."]},{id:"g4",grp:0,word:"诸位",zh:"诸 / 各",py:"zhū / gè",tag:"Xem 辨析 bên dưới",mean:"<span class='zh'>诸</span>: văn viết, “nhiều, các” — chỉ người, cấu trúc cố định (<span class='zh'>诸位 · 诸君 · 诸侯 · 诸子百家</span>). <span class='zh'>各</span>: mọi cá thể trong phạm vi, cả người lẫn vật; còn làm phó từ trước động từ.",forms:["诸位 / 诸君","各位 / 各国 / 各界","各 + V（各买了 / 各有）"],ex:[["诸位，如果你不想难堪……","",1]],tips:["<span class='zh'>诸位 = 各位</span>, nhưng <span class='zh'>×诸方 · ×诸国首脑</span>."]}],BX:{grp:0,word:"诸位",cols:["√","×"],pair:"诸 — 各",same:["Trong đại từ nhân xưng <span class='zh'>诸位 / 各位</span>, nghĩa và cách dùng giống nhau.","诸位 / 各位有何意见，请尽量发表。"],diff:[["Văn viết, nghĩa “nhiều, các”; danh từ / lượng từ sau thường chỉ người; thường là <b>cấu trúc cố định</b>.","诸位 / 诸君 / 诸侯 / 诸子百家","Chỉ <b>mọi cá thể</b> trong một phạm vi, không chỉ người mà cả sự vật.<div class='zh' style='margin-top:4px'>各位 / 各方 / 各界 / 各国</div>"],["Không có cách dùng này.","—","Biểu thị nhiều người cùng làm / nhiều vật cùng có một thuộc tính.<div class='zh' style='margin-top:4px'>双方各执一词。院子前后各有一门。</div>"],["Không đứng trước động từ.","—","Làm <b>phó từ</b> trước động từ = “riêng từng, mỗi”.<div class='zh' style='margin-top:4px'>几种水果他各买了一斤。他们各想了一个办法。</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["亚洲各国首脑都参加了此次会议。",0,"<span class='zh'>各国</span> — đúng."],["经过诸方的共同努力，事情终于圆满解决了。",1,"Phải là <span class='zh'>各方</span>; <span class='zh'>诸</span> chỉ dùng trong cấu trúc cố định."],["三种办法各有优点和缺点，实在难以抉择。",0,"<span class='zh'>各</span> làm phó từ trước động từ — đúng."],["他喜欢读古代诸子百家的著作。",0,"<span class='zh'>诸子百家</span> là cấu trúc cố định — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["实<u>质</u>","本质 · 性质 · 品质 · 素质"],items:[["<u>档</u>次","档","存档 · 档案 · 高档 · 低档"],["回<u>避</u>","避","躲避 · 避雨 · 避免 · 避重就轻"],["<u>周</u>密","周","周围 · 周全 · 周岁 · 周末"],["<u>提</u>炼","提","提前 · 前提 · 提取 · 提心吊胆"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["付出艰苦努力的人什么都没得到，哪有这样的道理啊？","岂有此理","付出艰苦努力的人什么都没得到，岂有此理！"],["我已经提前做好了计划，所以实施起来很顺利。","预先","我已经预先做好了计划，所以实施起来很顺利。"],["无论富贵还是贫穷，我对他的爱不会改变。","……也好，……也罢","富贵也好，贫穷也罢，我对他的爱不会改变。"],["“米”是国际上普遍使用的基本长度单位。","通用","“米”是国际上通用的基本长度单位。"],["问题的本质在于某些人缺乏责任心。","实质","问题的实质在于某些人缺乏责任心。"],["明天的会议很重要，发言稿你好好考虑考虑。","斟酌","明天的会议很重要，发言稿你好好斟酌斟酌。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["损坏","循环","脂肪","收缩","动脉"],text:"心脏每时每刻都在跳动，有规律地{收缩}和舒张，这可以使血液在体内不断{循环}，因此心脏的重要性不言而喻。而肥胖会导致{动脉}硬化，{损坏}心脏机能。所以减轻体重，减少{脂肪}含量是保护心脏重要的一步。"},{bank:["恰当","周密","意向","收益","一丝不苟"],text:"新产品面世以前，一般要先调查消费者的购买{意向}，然后经过{周密}的设计，{一丝不苟}的生产过程，再找一个{恰当}的时机投放到市场，才能获得可观的{收益}。"}]},EX4:{q:"请给下面的问句选择对应的答句",type:"pos",vn:"A. 它是人类所创造的财富的总和，特指精神财富，如文学、艺术、教育、科学，文明涵盖了人与人、人与社会、人与自然之间的关系。　B. 唯有青青松树枝。　C. 不是，他是来观察物候，做科学研究的。　D. 不是。有的植物不但能够运动，而且还会跳舞呢。",items:[["竺可桢走进北海公园，单是为了观赏景物吗？","C","不是，他是来观察物候，做科学研究的。",""],["如何定义“文明”？","A","它是人类所创造的财富的总和……",""],["你也许以为植物都是不能运动的吧？","D","不是。有的植物不但能够运动，而且还会跳舞呢。",""],["雪中何以赠君别？","B","唯有青青松树枝。",""]]},EX5:{q:"根据提示，简述课文主要内容",rows:[["课文（一）为什么说不要用假笑敷衍别人？","① 如果不想……，可以……，可以……，但不要…… ② 因为只要……，不管……，不管……，别人都能……","如果你不想难堪，可以回避，可以不表态，可以把话题岔开，但不要违心地笑。因为只要你笑，不管你多机灵，掩饰得多么周密，别人都能看出你的笑是真是假。"],["人们通过什么途径识别假笑的？","① ……激活……特定区域 ② ……自动分析……缘故 ③ 诚挚的笑声会…… ④ 志愿者的反映","假笑声会激活大脑中破译情感信息的特定区域，大脑会自动分析假笑的缘故和意向；诚挚的笑声则会激活与快乐相关的区域。志愿者仅凭直觉就能分辨出假笑声。"],["研究结果是什么？","① ……对……非常敏感 ② 开启……区域，获知……，动用……部分，提炼出……信息","人类大脑对笑声中隐含的社会和情感信息非常敏感。听到笑声时，大脑会开启与心智相关的区域，获知他人的情感状态，有的人还动用控制运动和感知的部分，提炼出真假笑声背后的信息。"],["课文（二）为什么说笑是治病良方？","调节情绪，促进……循环和……收缩，吸氧量，燃烧卡路里，消耗脂肪，减轻体重，缓解动脉硬化，消除紧张感","笑可以调节情绪，促进血液循环和腹肌收缩，增加吸氧量；还能燃烧卡路里，消耗脂肪，减轻体重，缓解动脉硬化，消除紧张感。"],["笑有什么坏处？","因心跳加速而昏迷，岔气，心脏不舒服","有人大笑后因心跳加速而昏迷，大笑还可能导致岔气、心脏不舒服。"],["怎么笑才健康？","把握分寸","笑的分寸要掌握得恰到好处。"]]},PZ:{title:"修辞（6）设问",vn:"Tự hỏi tự đáp",intro:"<b>Không có gì nghi ngờ mà vẫn hỏi, tự hỏi rồi tự trả lời</b> — đó là <b>设问</b>. Tác dụng: ① gây chú ý, gợi người đọc suy nghĩ; ② giúp tổ chức bài viết, chuyển ý tự nhiên và gọn (như ví dụ 2).",ex:[["难道我们听到庸俗、不上档次的笑话假笑两声、敷衍一下也不可以吗？可是，好像确实不行。","Đặt câu hỏi phản vấn rồi tự trả lời."],["笑，真的是人生旅途中的最佳良药吗？答案似乎不是那么肯定。","Dùng câu hỏi để chuyển ý từ “lợi ích” sang “tác hại”."],["离开了手机，难道会死吗？何不尝试一下一周关机一天？说干就干，索性这礼拜就开始。","Tự hỏi — tự đáp bằng hành động."]],q:"将下列句子改写为设问句",pvn:"(1) 有钱不一定幸福，有朋友，有健康，有自己的事业才会幸福。　(2) 气候真的变暖了，没错，我们的地球每一天都在变化。　(3) 奋斗的人生是最美好的，因为奋斗之中快乐无穷。",practice:[["(1) 有钱不一定幸福……","有钱一定幸福吗？不一定，有朋友，有健康，有自己的事业才会幸福。"],["(2) 气候真的变暖了……","气候真的变暖了吗？没错，我们的地球每一天都在变化。"],["(3) 奋斗的人生是最美好的……","奋斗的人生是最美好的吗？是的，因为奋斗之中快乐无穷。"]]},DP:[{title:"词汇（1）：熟悉下列近义词",vn:"Các cặp từ gần nghĩa.",items:[["腐朽 — 腐败","fǔxiǔ — fǔbài","mục nát — hủ bại","腐朽的木头 · 政治腐败","这种腐朽的思想早该抛弃了。"],["焦点 — 中心","jiāodiǎn — zhōngxīn","tiêu điểm — trung tâm","问题的焦点","这件事成了大家关注的焦点。"],["埋葬 — 安葬","máizàng — ānzàng","chôn cất — an táng","安葬在家乡","他被安葬在故乡。"],["践踏 — 摧残","jiàntà — cuīcán","giày xéo — tàn phá","践踏草坪 · 摧残身体","请勿践踏草坪。"],["烘 — 烤","hōng — kǎo","sấy — nướng","烘干衣服 · 烤面包","把湿衣服放在炉子边烘一烘。"],["内幕 — 内情","nèimù — nèiqíng","nội tình — tình hình bên trong","揭开内幕","记者揭开了事件的内幕。"],["衔接 — 连接","xiánjiē — liánjiē","nối tiếp — kết nối","上下文衔接","两段话衔接得很自然。"],["陷阱 — 圈套","xiànjǐng — quāntào","cạm bẫy — tròng","掉进陷阱","小心别落入骗子的圈套。"],["示意 — 暗示","shìyì — ànshì","ra hiệu — ám chỉ","点头示意","他用眼神示意我别说话。"],["妥善 — 稳妥","tuǒshàn — wěntuǒ","thỏa đáng — chắc chắn","妥善处理","这件事要妥善处理。"],["旋转 — 转动","xuánzhuǎn — zhuǎndòng","xoay tròn — chuyển động","地球旋转","地球绕着太阳旋转。"],["呕吐 — 吐","ǒutù — tù","nôn mửa — nôn","恶心呕吐","他晕车，一路上呕吐不止。"],["相等 — 相当","xiāngděng — xiāngdāng","bằng nhau — tương đương","数量相等","两人实力相当。"],["贼 — 小偷","zéi — xiǎotōu","kẻ trộm","抓贼","警察抓住了小偷。"],["住宅 — 住所","zhùzhái — zhùsuǒ","nhà ở — chỗ ở","住宅区","这里是新建的住宅区。"],["正当 — 合法","zhèngdàng — héfǎ","chính đáng — hợp pháp","正当权益","要保护消费者的正当权益。"]]},{title:"词汇（2）：政治方面的词语",vn:"Nối từ chính trị với nghĩa tương ứng.",items:[["共和国","gònghéguó","nước cộng hòa","实施共和政体的国家","中华人民共和国。"],["领事馆","lǐngshìguǎn","lãnh sự quán","一国政府派驻外国某一城市或地区的外交官员代表机关","我去领事馆办签证。"],["统治","tǒngzhì","thống trị","凭借政权来控制、管理国家或地区","封建统治延续了两千多年。"],["时事","shíshì","thời sự","最近一段时间的国内外大事","他每天都关心时事新闻。"],["条约","tiáoyuē","hiệp ước","国家和国家签订的有关政治、军事、经济或文化等方面的权利和义务的文书","两国签订了和平条约。"],["纲领","gānglǐng","cương lĩnh","政府、政党、社团根据自己在一定时期内的任务而规定的奋斗目标和行动步骤","这个政党公布了行动纲领。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"《康熙字典》是清代康熙年间出版的图书，作者是张玉书、陈廷敬等，它是在明朝《字汇》《正字通》两书的基础上加以增订的。该书的编撰工作始于康熙四十九年，成书于康熙五十五年，历时六年，因此书名叫《康熙字典》。",o:["《康熙字典》是康熙编的","《康熙字典》的编纂者共有2人","《康熙字典》的名字是康熙起的","编写《康熙字典》共用了六年时间"],a:3,why:"“始于康熙四十九年，成书于康熙五十五年，历时六年”."},{n:2,say:"有些人很爱凑热闹，不管街头发生什么事情，他们都要驻足引颈，看个究竟。有的还免不了要放开喉咙，起哄喝倒彩，从中寻找乐趣，寻求刺激，这其实反映出一种病态心理。",o:["爱起哄的心态不健康","有好奇心是人的本性","在街上唱歌是一种快乐","喜欢凑热闹的人不在少数"],a:0,why:"“起哄喝倒彩……反映出一种病态心理”. Có <span class='zh'>起哄</span>."},{n:3,say:"婴儿在1周岁左右，开始学会独立行走，能更自由地接近和探索周围事物。当他看到桌子上放着一个他喜爱的玩具而无法拿到手时，会推大人的手去拿，表现出初步的有意向的行动。",o:["婴儿喜欢拥有自己的玩具","大人总会帮婴儿实现目标","大人应该想办法了解婴儿的理想","1岁的婴儿会表现出自己的意向"],a:3,why:"“表现出初步的有意向的行动”. Có <span class='zh'>意向</span>."},{n:4,say:"读者获取信息也是有成本与收益的。他们花钱买报，花时间看报就是成本，从报纸中得到对自己有用的信息就是收益。报纸扩版后，读者的成本增加了，尤其是要花更多宝贵的时间去读，忙碌的现代人承受不起这么高的成本。",o:["读者的时间也是成本","报纸的成本越来越高","扩版后报纸信息变少","现在的人不愿意读报"],a:0,why:"“花时间看报就是成本”. Có <span class='zh'>收益</span>."},{n:5,say:"这个剧本的可读性很强，尤其是剧本的语言，让人看后久久难忘。它的语言虽然都是生活中的口语，但经过了作者的提炼熔铸后，显得既鲜活又不失文雅，而且富有情趣。可以想象，这样朗朗上口的语言，一定很适合舞台演出。",o:["这个剧本只适合阅读","这个剧本演出效果很好","这个剧本写得极其成功","生活中的口语是最文雅的"],a:2,why:"Khen hết lời: “可读性很强……久久难忘”. B chỉ là “可以想象”. Có <span class='zh'>提炼</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：能不能告诉我们，您最初怎么选中了厨师这个行业？\n男：我最初选择学厨师，想法很简单，人走到哪里都得吃饭，干这一行肯定饿不着。\n女：后来怎么就做到了五星级酒店的京菜主厨呢？\n男：进了饭店从做小工、刷盘子开始，我越干越觉得，厨师这一行实在是个让人痴迷又魅力无穷的行业。\n女：我们都知道掂大勺、刀功，都是厨师的看家本领，您学艺过程中，最头疼的是什么呢？\n男：记得刚学会做菜那会儿，我是吃到哪儿挑到哪儿，每吃一道菜，都要评头论足，“油放少了”“盐放多了”。后来，我想明白了，同样的调料，不同的人会炒出不同的味儿，就是中餐的精髓。我学做饭那时候，最伤脑筋的就是菜谱上“少许”这俩字，老是分寸把握不好。把这两个字琢磨透了，就可以出师了。\n女：自从您学厨师之后，过年过节，您家的聚餐就成了您露一手的机会了吧？\n男：说到这儿，我就会想起奶油菜花，这道菜给我的教训太深了。\n女：能讲给我们听听吗？\n男：2003年春节，我在学校练了一年的基本功，急于给大伙儿露一手，自告奋勇要给大家来个奶油菜花。这道菜我没做过，听老师在课堂上提过，觉得没什么难的。结果我进了厨房，一看那一堆菜花和黄油就傻眼了，最后愣是做出一锅大乱炖。菜端上桌，我觉得太丢人了，简直无地自容。亲戚朋友倒是非常捧场，把那道菜吃了个精光。\n女：大伙儿肯定能原谅您，那时候您还是个刚入学一年的学生嘛。\n男：8年以后，我把家里的亲戚朋友召集到一块儿，来了场“雪耻之战”。我当时放下豪言，让大家随便点，想吃什么点什么，他们能想得出的，我都能做。几个小时倒腾出来的十几道菜，当然也得到了大伙儿的一致称赞。\n女：您心里特别美吧？\n男：那就不用说了。",qs:[{n:6,q:"男的为什么选择做厨师？",o:["厨师省脑子","厨师挣钱多","厨师不会失业","厨师不会挨饿"],a:2,why:"Đáp án sách: C — “人走到哪里都得吃饭” → nghề luôn cần người, không lo mất việc (“饿不着” = không lo đói = có việc làm)."},{n:7,q:"为什么男的能做到五星级酒店的京菜主厨？",o:["因为做小工、刷盘子太累","因为他从小喜欢吃北京菜","因为他迷恋上了厨师这个行业","因为他的师傅是个很有魅力的人"],a:2,why:"“让人痴迷又魅力无穷的行业”."},{n:8,q:"关于中餐，下列哪项正确？",o:["要多放油","做菜讲究标准化","各种调料要按顺序放","各种调料的量要恰到好处"],a:3,why:"“少许”……分寸把握不好. Có <span class='zh'>分寸 · 恰到好处</span>."},{n:9,q:"关于奶油菜花，下列哪项正确？",o:["是男的学会的第一道菜","最后男的根本没做出来","是大家强烈要求男的做的菜","是大家公认最好吃的一道菜"],a:1,why:"“愣是做出一锅大乱炖” — không ra món 奶油菜花."},{n:10,q:"8年以后，男的做了件什么事？",o:["请大家吃了顿最贵的饭","一顿饭吃了好几个小时","做的都是大家没吃过的菜","为8年前的事找回了面子"],a:3,why:"“雪耻之战” = trận rửa nhục."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"音乐是一种有效的止痛剂。有研究报告称，手术前、手术后甚至手术过程中播放音乐，都有助于缓解疼痛。\n本项研究共涉及近7000名患者的70多次临床试验的数据，试验证明，音乐确实是一剂有效的止痛药。实验者把术后疼痛分为0－10级，0代表丝毫不疼，10代表疼到极点，听音乐能够使疼痛等级下降2级。\n研究人员发现，音乐的镇痛作用与音乐类别无关，具体曲目由医生还是由患者选择也无所谓。研究涉及多种手术，但不含大脑或中枢神经系统手术。令人意外的是，患者即使接受全身麻醉，听音乐也有助于缓解术后疼痛，但效果不如接受手术时意识清醒的患者。\n虽然目前尚未将播放音乐作为帮助患者术后康复的常规项目，但这项研究毫无疑问在帮助人们进一步了解音乐的积极影响方面做了有益的探索。",qs:[{n:11,q:"关于试验，下列哪项正确？",o:["“0”表示最轻度的疼痛","“10”表示最严重的疼痛","研究者做了70多次手术","研究对象涉及7000多人"],a:1,why:"“10代表疼到极点”. A: 0 = 丝毫不疼; D: 近7000 (gần, chưa tới)."},{n:12,q:"关于试验结果，下列哪项正确？",o:["音乐减痛更适用于术后康复","音乐减痛不适用于脑部手术","音乐减痛对全身麻醉者无效","任何类型的音乐都可减轻疼痛"],a:3,why:"“与音乐类别无关”. B: chỉ là không nghiên cứu, không phải không hợp."},{n:13,q:"这项研究的意义是什么？",o:["改善医院的氛围","增加临床的应用","减少麻醉药的使用","认识音乐的积极作用"],a:3,why:"“帮助人们进一步了解音乐的积极影响”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"据世界卫生组织统计，全球一半患者不会正确用药。在中国，用药安全同样是个不可回避的问题，一项涉及45万份的网络调查显示，九成人存在用药误区。\n比如止痛药，不少人觉得，不管哪里疼痛，吃点儿止痛药，病就好了，这是再简单不过的事了。殊不知，乱用止痛药也会有严重后果，如损伤内脏、延误病情、产生心理依赖，甚至可能致死。再比如创可贴，人人都觉得自己会用，完全不存在专业的问题，可是有多少人知道，它的基本作用只是止血，并不能完全做到抗菌消毒。创可贴吸水性和透气性较差，使用不当可能造成伤口感染。出血较多的伤口、小而深的伤口、动物咬伤、污染较重的伤口、烧伤或者烫伤的创面，都不宜使用创可贴，它只适用于皮肤表面、出血不多而又不需要缝合的小伤口。",qs:[{n:14,q:"关于用药误区，下列哪项正确？",o:["全球一半人不能正确用药","九成患者安全用药知识匮乏","45万中国人缺乏正确的用药知识","大部分被调查者有用药不当的问题"],a:3,why:"“九成人存在用药误区” (người được khảo sát). A: một nửa <b>bệnh nhân</b>, không phải một nửa người."},{n:15,q:"关于止痛药，下列哪项正确？",o:["止痛药很难标本兼治","止痛药的作用不用探讨","止痛药管用只是虚假现象","止痛药用法简单无副作用"],a:0,why:"Uống giảm đau không chữa được bệnh, còn “延误病情” → khó trị cả gốc lẫn ngọn."},{n:16,q:"关于创可贴，下列哪项正确？",o:["抗菌消毒作用很强","用后伤口不能沾水","应在医生指导下使用","使用不当会造成感染"],a:3,why:"“使用不当可能造成伤口感染”."},{n:17,q:"创可贴适用哪种情况？",o:["烧伤患者","烫伤患者","出血少的伤口","小而深的伤口"],a:2,why:"“只适用于……出血不多……的小伤口”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["那所学校的校舍，不是正规的学校。","他厌恶公文，也不喜欢动笔，当然也没有备忘录。","他对武术的见解成为了年轻人的座右铭，成为了励志的经典话语。","它时时提醒我们，不要为歪门邪道所惑，走到无法回头的岔路上去。"],a:0,why:"<b>Chủ – vị không tương hợp</b>: <span class='zh'>校舍</span> (nhà trường) ≠ <span class='zh'>学校</span> → <span class='zh'>那所学校的校舍不是正规的校舍</span> / <span class='zh'>那所学校不是正规的学校</span>."},{n:19,o:["你们说一套做一套，言行不一，表里相违，真是岂有此理。","父亲很生气，说我们跟他说话没有礼貌，一点儿都把他不放在眼里。","大灾之年，洪水泛滥，它的肆无忌惮给人们带来了无穷的灾害和忧患。","脸谱以红色代表忠勇，黑色代表粗直，白色代表奸邪，使人物性格一目了然。"],a:1,why:"<b>Trật tự từ</b>: <span class='zh'>一点儿都不把他放在眼里</span> — phủ định đứng trước <span class='zh'>把</span>."},{n:20,o:["最好多做工作，他每天清晨5点多钟就起床，深夜才就寝。他对工作一丝不苟，非常讨厌懒散拖拉的作风。","现在有些音乐电视越来越吸引不了观众。有的音乐作品还是不错的，可一配上电视就显得画蛇添足、不伦不类了。","搜索引擎能够帮助我们更快更容易地找到信息，你只需输入一个或几个关键词，搜索引擎就会找到所有符合要求的网页。","几乎每台文艺晚会都少不了相声节目，演员们幽默的语言、诙谐的表情，逗得观众捧腹大笑。相声已成为流传最广、最为群众喜闻乐见的曲艺形式。"],a:0,why:"<b>Dùng từ sai</b>: <span class='zh'>最好多做工作</span> không hợp → <span class='zh'>为了多做工作</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"在生活世界中，人不是一个___完成的概念，而是一个可选择的概念。人存在___生活，人选择生活就是选择存在方式。选择存在方式就是___自身。",o:["预先　即　创作","父母　和　完善","事先　将　改变","社会　亦　激励"],a:0,why:"<span class='zh'>预先完成</span> (từ mới!); <span class='zh'>即</span> = tức là; <span class='zh'>创作自身</span>."},{n:22,text:"幸福是什么？幸福就是看着粮食心里___，不再有饿肚子的恐惧。我知道在农村的很多地方，农民家里都___着很多粮食，看到满仓的粮食，农民的心里就踏实多了。这是很___的想法，但___不是被我们抛弃的真理。",o:["平静　储蓄　庸俗　毕竟","踏实　储存　朴实　未必","平稳　积聚　机灵　历来","沉着　常备　难堪　明明"],a:1,why:"<span class='zh'>心里踏实</span>; <span class='zh'>储存粮食</span>; <span class='zh'>朴实的想法</span>; <span class='zh'>未必</span>. Bẫy: <span class='zh'>庸俗 · 机灵 · 难堪</span> đều là từ mới."},{n:23,text:"用本族语也好，用外族语也好，一个人在思维的时候总得运用一种语言。学习外语要养成用外语___的习惯。如果没有这种习惯，用外语说话时就得先用本族语把意思想好，___再译成外语说出来。___，说出来的外语就不会流畅、___。",o:["思想　接着　如此　正宗","翻译　后来　当然　专业","表达　以后　那样　周密","思维　然后　这样　纯正"],a:3,why:"<span class='zh'>用外语思维</span>; <span class='zh'>先……然后……</span>; <span class='zh'>这样</span>; <span class='zh'>流畅、纯正</span>. Câu đầu dùng <span class='zh'>也好，也好</span>!"}]},read3:{ins:"第24–28题：选句填空。",text:"一户人家要盖房，各种材料堆放在空地上。一根杨木、一根松木并排放在一个角落里，粗大、光滑，仔细看，杨木仿佛更加粗壮一些。\n夜深人静，杨木对松木说起话来。“真高兴，(24)！看我这粗大的体型一定是主梁！你呢，虽然瘦小一些，也可以做根柱子！”松木说：“付出总有回报，(25)！”\n第二天，工匠来选木料，师傅敲敲松木说：“这根做主梁！”又看看那根粗大的杨木说：“这根做个拴马桩子吧！”\n夜深人静，杨木又开始说话了：“(26)，就你那体格，要去做主梁？而我，去做拴马桩子？这世道，还有说理的地方吗！”\n松木说：“孩子！你是比我粗大，(27)，你却只生长了十几年。我生活的地方风大、缺水，环境恶劣，我们每年只能生长那么一点点，但木质紧密、结实。你生活在水源充足、营养丰富的河湾里，十几年就长得比我粗大了。但是孩子，你的身体是虚的啊！承担不起主梁的责任。”\n听了松木的话，(28)，下决心要做好一根拴马桩子！",opts:["努力和汗水都不会白费","我们终于成材了","杨木惭愧得无话可说","那个匠人真是老糊涂了","可我已经有上百年的树龄了"],ans:{24:1,25:0,26:3,27:4,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"在床上吃比萨饼和冰激凌不行，边看电视边吃东西也不行，专家提醒人们：尽管很多人喜欢上述就餐习惯，但它对人体健康一点儿好处也没有。就餐的地点和方式与食物一样重要，因为有些环境会诱惑人多吃，有些就餐方式不利于消化。\n有人对办公室、学校、餐馆、路边摊等地方做过比较，结果是餐馆、黑暗的环境以及狼吞虎咽为最差就餐地点和习惯。其理由是餐馆的美味佳肴意味着更多的卡路里，因为餐馆中许多菜品的烹饪手段是过油之后再炒，而且在餐馆进餐往往比在家里吃得更多。\n至于黑暗的环境，主要是在昏暗的光线下，人们更容易无所顾忌地吃，吃得更加没有节制。\n狼吞虎咽就更不可取了，细嚼慢咽有助于消化，可以防止噎着、打嗝和心脏病发作。食物的块头越大越难消化，把食物咀嚼成近似液体状才是标准的进餐方式，因此诸位不管多把时间当回事，也千万不要节省吃饭的那点儿时间。\n专家特别提示，良好的就餐环境可以调动神经、内分泌和新陈代谢等多个系统，会让人感觉到满足从而停止吃东西。",qs:[{n:29,q:"下列哪个是最差就餐地点？",o:["学校","餐馆","办公室","路边摊"],a:1,why:"“结果是餐馆……为最差就餐地点”."},{n:30,q:"狼吞虎咽的结果可能是：",o:["饭量与日俱增","食物消化得更快","体味不出食物之美","严重时可引发心脏病"],a:3,why:"“细嚼慢咽……可以防止……心脏病发作”."},{n:31,q:"画线词语“把时间当回事”的意思最可能是：",o:["在意时间","浪费时间","算计时间","消磨时间"],a:0,why:"<span class='zh'>把……当回事</span> = coi trọng. Có <span class='zh'>诸位</span>!"},{n:32,q:"关于就餐，专家特别提示：",o:["食品质量是最重要的","应高度重视就餐环境","吃饭时应该专心致志","吃饭不要吃撑再停止"],a:1,why:"“良好的就餐环境可以调动……多个系统”."}]},{ins:"第33–36题：请选出正确答案。",text:"初见刘岩，舞者的气质自然流淌，纵使多年前的那次意外让她不能再用灵巧的足尖走近你，你却仍然第一眼就会认定这是一位顶尖的舞者。笑容妩媚却豁达，声音温柔而坚定，哪怕是坐在轮椅上，你也要赞叹她长歌善舞的风采。\n刘岩表示，《手之舞之》是一本学术著作，英文版的推出更是意义非凡，可以让全世界更加了解中国舞蹈文化。在世界范围内，中国的手舞研究学术性强，传承多样，在丰厚的古典文化滋润中，手舞作为微身体语言舞蹈，可以通过整体与局部来实现情感的沟通与表达。\n刘岩既是一名舞者，也是一名教育者，还是一名理论研究者，而她最在意的是教师身份，坚持一线教学，培养青年人才，是她的快乐所在。\n2010年，她以自己的名字命名成立了“刘岩文艺专项基金”，一直投身社会公益，关注贫困、孤残儿童的艺术教育。她告诉我们：“专项基金成立以后，每周末都会资助老师走到儿童福利机构去给那些孤儿或聋哑孩子上课，虽然困难很多，但当你去帮助了那些需要帮助的人时，快乐和温暖会充满每个人的内心，最重要的是孩子们从中收获了欢乐。”",qs:[{n:33,q:"根据上文，刘岩：",o:["善于倾听","憎恶虚伪","豁达乐观","为人严肃"],a:2,why:"“笑容妩媚却豁达” — ngồi xe lăn vẫn rạng rỡ."},{n:34,q:"《手之舞之》英文版的意义在于：",o:["是第一本英文舞蹈学术专著","着眼于中国古典文化的传播","创造了中国微身体语言舞蹈","帮助世界了解中国舞蹈文化"],a:3,why:"“可以让全世界更加了解中国舞蹈文化”."},{n:35,q:"根据上文，可以知道：",o:["刘岩在福利机构工作","刘岩很重视培养年轻人","刘岩每天生活在快乐之中","刘岩的基金更倾向于资助老师"],a:1,why:"“坚持一线教学，培养青年人才，是她的快乐所在”."},{n:36,q:"最适合做上文标题的是：",o:["舞者刘岩","著名作家刘岩","孤残儿童的好老师","她在探测生命的意义"],a:0,why:"Cả bài xoay quanh người múa 刘岩."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写两篇课文",t:"35 phút",task:"这篇课文用两篇小短文给我们讲述了跟笑有关的科学知识。人们对假笑很敏感，假笑是怎么被识别出来的？对健康来说，笑有什么益处，有什么坏处，怎么笑才健康？请参考练习5，把两篇课文各缩写成200字左右的短文。",target:400,steps:[["Bài (一) – mở","Vì sao đừng cười giả: <span class='zh'>可以回避……但不要违心地笑</span>."],["Bài (一) – thân","Não phân biệt thế nào: <span class='zh'>激活特定区域 · 分析缘故 · 仅凭直觉</span>."],["Bài (一) – kết","Kết quả: <span class='zh'>对……非常敏感 · 提炼出……信息</span>."],["Bài (二) – lợi","<span class='zh'>调节情绪 · 血液循环 · 消耗脂肪 · 缓解动脉硬化</span>."],["Bài (二) – hại & kết","<span class='zh'>心跳加速而昏迷 · 岔气</span> → <span class='zh'>分寸要恰到好处</span>."]],outline:[["（一）","不要假笑 → 大脑如何识别 → 研究结论"],["（二）","笑的益处 → 笑的坏处 → 掌握分寸"]],model:"（一）大脑能听出笑声的真假\n如果你不想难堪，不想让别人发现你的笑是虚伪的，你可以回避，可以把话题岔开，但不要违心地笑。因为不管你多机灵，掩饰得多周密，别人都能看出你的笑是真是假。研究者发现，人们听到真笑和假笑时，大脑的反应完全不同：假笑会激活大脑中破译情感信息的特定区域，大脑会自动分析假笑的缘故和意向；诚挚的笑声则会激活与快乐相关的区域。实验中，志愿者预先并不知道测试目的，却仅凭直觉就分辨出了假笑声。研究者认为，人类大脑对笑声中隐含的情感信息非常敏感，能够提炼出真假笑声背后的信息。\n（二）笑未必是最佳良药\n很多人认为笑有益于健康。研究证实，笑可以调节情绪，促进血液循环和腹肌收缩，增加吸氧量；还能燃烧卡路里，消耗脂肪，减轻体重，缓解动脉硬化，消除紧张感。然而，笑也不是有百益而无一害的。有人大笑后因心跳加速而昏迷，大笑还可能导致岔气、心脏不舒服。所以，笑不是坏事，但分寸要掌握得恰到好处。不过，多数人还是认为，和好朋友在一起开心地笑，根本顾不上斟酌分寸。",check:["Có hai phần (一)(二)","Mỗi phần ≈200 chữ","Không thêm ý kiến cá nhân","Phần (一): có lý do + cách nhận ra + kết luận","Phần (二): có lợi ích + tác hại + chừng mực","Dùng ít nhất 4: 回避 · 周密 · 缘故 · 意向 · 预先 · 直觉 · 循环 · 分寸 · 恰到好处"]},SUM:{words:["备忘录","岂有此理","庸俗","档次","诸位","难堪","虚伪","违背","回避","岔","装聋装哑","画蛇添足","机灵","周密","途径","虚假","特定","缘故","意向","诚挚","一丝不苟","倾听","视频","一目了然","预先","直觉","探测","智商","提炼","相声","座右铭","通用","调节","循环","收缩","氧气","试验","脂肪","动脉","实质","肆无忌惮","损坏","倾向","分寸","恰到好处","是非","探讨","收益","起哄","斟酌","恰当"],patterns:[["预先 + V","要预先订好旅馆。"],["A 也好，B 也罢，都……","开怀大笑也好，哈哈傻笑也罢，……都会是……治病良方。"],["不管……，不管……，都……","不管你多机灵，不管你掩饰得多么周密，别人都能看出……"],["因……而……","因心跳加速而昏迷"],["修辞：设问","笑，真的是……最佳良药吗？答案似乎不是那么肯定。"]],diff:["诸: văn viết, chỉ người, cấu trúc cố định (诸位 · 诸君 · 诸侯 · 诸子百家) — 各: mọi cá thể, cả người lẫn vật (各国 · 各方), làm phó từ trước động từ (各买了一斤)","虚伪 (giả dối – phẩm chất) · 虚假 (giả tạo – không đúng sự thật) · 诚挚 / 真挚 · 恰当 / 恰到好处"],sentences:["只要你笑，不管你多机灵，不管你掩饰得多么周密，别人都能看出你的笑是真心实意，还是虚情假意。","志愿者在预先未被告知测试目的的情况下，仅凭直觉就能准确地分辨出假笑声。","笑不是坏事，但分寸要掌握得恰到好处。"],hw:["Học thuộc 52 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 hai bài khóa, mỗi bài ≈200 chữ (mục 7).","Đặt 3 câu với 预先 và 3 câu với ……也好，……也罢.","Làm Sách bài tập bài 29.","Đọc trước bài 30."]}});
