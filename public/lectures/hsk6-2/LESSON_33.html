<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 33 · 怀念慢生活 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

会一样","现场直播。","Truyền hình trực tiếp.",[],"Xem <b>辨析 现场—当场</b>. Bài tập 3①. SBT nghe câu 2."],[51,"联欢","liánhuān","đgt.","liên hoan","ăn liên hoan, tụ họp",1,"","（集体）在一起欢聚。","联欢会","春节联欢晚会。","Gala mừng xuân.",[],"SBT câu 23D: <span class='zh'>撒欢</span>."],[52,"漫画","mànhuà","dt.","mạn họa","truyện tranh",1,"","用简单而夸张的手法来描绘生活或时事的图画。","漫画家","孩子们喜欢看漫画。","Trẻ con thích đọc truyện tranh.",[],"SBT câu 29–32."],[53,"仓促","cāngcù","tt.","thương xúc","vội vàng, gấp gáp",1,"","匆忙。","仓促间投入目的地的怀抱","时间仓促，准备不足。","Thời gian gấp, chuẩn bị chưa đủ.",[],"Bài tập 2⑥. SBT câu 23D."],[54,"无拘无束","wújū-wúshù","thành ngữ","vô câu vô thúc","không gò bó, thoải mái, tự nhiên",1,"成","形容自由自在，没有约束。","无拘无束的交流","孩子们无拘无束地玩儿。","Bọn trẻ chơi đùa thoải mái.",["拘束 jūshù"],"<span class='zh'>拘束</span> (đgt.) = hạn chế, gò bó. SBT câu 22B, 23D."],[55,"束","shù","lượng.","thúc","bó, chùm",1,"","用于捆在一起的东西。","那一束月光","一束鲜花。","Một bó hoa tươi.",[],"SBT nghe 14–17: <span class='zh'>一束鲜花</span>."],[56,"舟","zhōu","dt.","chu","thuyền",1,"","船。","一叶小舟","泛舟湖上。","Bơi thuyền trên hồ.",[],"SBT câu 29–32: <span class='zh'>泛舟湖泊</span>."]],extra:[["高铁","gāotiě","tàu cao tốc"],["特快 · 硬座","tèkuài · yìngzuò","tàu nhanh · ghế cứng"],["西北","Xīběi","vùng Tây Bắc Trung Quốc"],["网迷","wǎngmí","người nghiện mạng"],["兴冲冲","xìngchōngchōng","hớn hở"],["不温不火","bùwēn-bùhuǒ","từ từ, không nóng không lạnh"],["嘈杂","cáozá","ồn ào"],["诸葛亮","Zhūgě Liàng","Gia Cát Lượng"],["料事如神","liàoshì-rúshén","đoán việc như thần"],["改革开放","gǎigé kāifàng","cải cách mở cửa"],["喜糖","xǐtáng","kẹo cưới"]],T:[{zh:"为期三天的假期，我和儿时的好友结伴去西安旅行。",vn:"Kỳ nghỉ ba ngày, tôi cùng người bạn thân từ thuở nhỏ rủ nhau đi du lịch Tây An.",idea:"Mở đầu.",q:[],note:[["为期三天","Kéo dài ba ngày."]]},{zh:"去时乘高铁，车程6小时。列车缓缓离开了车站，很快就以征服一切的气势甩开窗外的景致，以300公里的时速跨过了桥梁，穿越了平原。车窗外，模糊的景象夹杂着西北的风沙呼啸而过。坐在宽敞座椅中的人们，享受着齐全的软硬件设施，看电影的看电影，打电话的打电话，更多的则是把自己封闭在小小的手机屏幕中，不是用语言，而是用符号传递着各自的情感。寄情于虚拟世界的网迷们对喧哗的现实流露出的是不屑一顾的冷淡。伴随着“终点站到了”的广播，我和朋友像千千万万旅途中的人们一样，没等车停稳，就兴冲冲地守候在车门口，迫不及待地投入到西安滚滚的人流中。",vn:"Lúc đi chúng tôi đi tàu cao tốc, hành trình 6 tiếng. Đoàn tàu chầm chậm rời ga, rồi nhanh chóng bỏ lại cảnh vật ngoài cửa sổ với khí thế chinh phục tất cả, vượt qua những cây cầu, băng qua đồng bằng với tốc độ 300 km/giờ. Ngoài cửa sổ, cảnh vật mờ ảo lẫn với gió cát Tây Bắc vút qua. Những người ngồi trên ghế rộng rãi tận hưởng tiện nghi đầy đủ, người xem phim thì xem phim, người gọi điện thì gọi điện, nhiều hơn cả là khép mình trong màn hình điện thoại nhỏ bé, không dùng lời nói mà dùng ký hiệu để truyền tải cảm xúc. Những “con nghiện mạng” gửi tình cảm vào thế giới ảo bộc lộ sự lạnh nhạt chẳng thèm để mắt đến hiện thực ồn ào. Theo tiếng loa “Đã đến ga cuối”, tôi và bạn cũng như hàng nghìn hàng vạn người trên đường, chưa đợi tàu dừng hẳn đã hớn hở đứng chờ ở cửa, nóng lòng hòa vào dòng người cuồn cuộn của Tây An.",idea:"Chuyến đi bằng tàu cao tốc.",q:["去时乘坐高铁的情形怎么样？"],note:[["看电影的看电影，打电话的打电话","Xem Ngữ pháp 1: <span class='zh'>A的A，B的B</span>."],["不是……，而是……","Không phải… mà là…"],["以……的气势 / 以……的时速","<span class='zh'>以</span> = với, bằng."]]},{zh:"三天的旅行很快就结束了，我们回程坐特快，将近13个小时的硬座。列车没有了高铁的威风，不紧不慢地开出了车站，不温不火地匀速前行，仿佛知道一路上将会演绎出许许多多的故事。不久我就发现硬座车厢信号很差无法上网；灯光昏暗无法看书；没有电源，耗尽了电量的手机无法充电；人多嘈杂混乱得睡不着觉，闭塞的车厢里，我们像是回到了50年前。朋友忽然说：“其实有时候吧，我还挺喜欢这种感觉的，只有这时候，人和人之间才有种久违的亲近感，也许是因为我们手头都没有事情，愿意彼此分享和倾听。”之后发生的一切，都像是在证明朋友的话是对的。",vn:"Ba ngày du lịch nhanh chóng kết thúc, chuyến về chúng tôi đi tàu nhanh, gần 13 tiếng ghế cứng. Đoàn tàu không còn cái oai của tàu cao tốc, thong thả rời ga, đều đều tiến bước, như thể biết dọc đường sẽ diễn ra biết bao câu chuyện. Chẳng mấy chốc tôi nhận ra toa ghế cứng sóng yếu không lên mạng được; đèn mờ không đọc sách được; không có nguồn điện, điện thoại cạn pin không sạc được; người đông ồn ào lộn xộn không ngủ được — trong toa tàu bí bách, chúng tôi như quay về 50 năm trước. Bạn tôi bỗng nói: “Thật ra có lúc tớ lại khá thích cảm giác này, chỉ những lúc như thế, giữa người với người mới có sự gần gũi lâu lắm rồi không có; có lẽ vì trong tay chẳng có việc gì, nên sẵn lòng chia sẻ và lắng nghe nhau.” Mọi chuyện xảy ra sau đó như đều chứng minh lời bạn tôi là đúng.",idea:"Chuyến về bằng tàu chậm.",q:["回程与去时有何不同？"],note:[["……无法上网；……无法看书；……无法充电；……睡不着觉","Liệt kê song song (排比)."],["只有……才……","Chỉ có… mới…"]]},{zh:"昏暗的灯光下，我和朋友开始聊天儿。她讲起小学的时候，班里颇具正义感的女生李芳芳如何见义勇为，在洪水中英勇救人；我感叹初中时，班里那个贵族气十足的男生，他叫……唉，一时竟忘了他叫什么名字。他16岁到了农村，从播种开始学习，后来长成了个精壮的汉子，改革开放后第一批承包了土地，就此发家致富，他简直就是一代人中的奇迹。我们想起小学的地理老师，讲课的时候总会带出些方言，班里调皮的男生千方百计跟她捣乱，弄得老师狼狈不堪，那会儿的我们真是幼稚得可笑。还有，中学我们班那个料事如神的诸葛亮……火车上，我们边回忆边开心地笑着，好像很久很久都没有这么纯粹地开心过了。",vn:"Dưới ánh đèn mờ, tôi và bạn bắt đầu trò chuyện. Cô ấy kể hồi tiểu học, bạn nữ Lý Phương Phương giàu tinh thần chính nghĩa đã dũng cảm cứu người trong lũ ra sao; tôi thì cảm thán về cậu bạn cấp hai đầy vẻ quý tộc, cậu ấy tên là… ôi, nhất thời lại quên mất tên. Cậu 16 tuổi về nông thôn, học từ việc gieo hạt, sau thành một người đàn ông vạm vỡ, sau cải cách mở cửa là lứa đầu tiên nhận khoán đất, từ đó làm giàu — quả là kỳ tích của cả một thế hệ. Chúng tôi nhớ cô giáo địa lý hồi tiểu học, giảng bài hay lẫn giọng địa phương, đám con trai nghịch ngợm trong lớp tìm đủ cách phá cô, làm cô lúng túng vô cùng — hồi ấy chúng tôi thật ngây ngô đến buồn cười. Còn có “Gia Cát Lượng” đoán việc như thần của lớp cấp hai… Trên tàu, chúng tôi vừa nhớ lại vừa cười vui vẻ, như thể đã lâu lắm rồi chưa vui một cách thuần khiết như thế.",idea:"Ôn chuyện bạn học.",q:["我跟朋友在车上聊了些什么？"],note:[["一时竟忘了","Xem Ngữ pháp 2: <span class='zh'>一时</span>."],["那个料事如神的诸葛亮","Xem 修辞: 借代."],["边……边……","Vừa… vừa…"]]},{zh:"说笑累了，朋友看着窗外，我则观察着周围的人们。坐我对面的像是一对双胞胎姐弟，他们正在聊家常。姐姐轻声细语，回顾着陈年往事：改革开放后的第一年，弟弟考上了大学，瞬间，这消息成了方圆百里的爆炸性新闻。那一年过春节弟弟在学校没回家，家里节过得别提多冷清了，对联都懒得贴。虽然弟弟写信来拜年，可全家都觉得没了天伦之乐。那一年除夕、元宵节，不，是整个正月都过得没了生气，爸妈大年初一连寺庙都懒得去，天天感叹孩子翅膀硬了就要飞了，眼神中流露着失落。",vn:"Cười nói mệt rồi, bạn tôi nhìn ra cửa sổ, còn tôi quan sát những người xung quanh. Ngồi đối diện tôi hình như là hai chị em sinh đôi, họ đang chuyện trò việc nhà. Người chị nói nhỏ nhẹ, nhớ lại chuyện cũ: năm đầu tiên sau cải cách mở cửa, cậu em đỗ đại học, lập tức tin này thành tin “chấn động” trong vòng trăm dặm. Tết năm ấy em ở trường không về, nhà ăn Tết buồn tẻ khỏi nói, câu đối cũng chẳng buồn dán. Dù em viết thư về chúc Tết, cả nhà vẫn thấy thiếu niềm vui sum vầy. Năm đó giao thừa, Nguyên tiêu — không, cả tháng giêng — đều trôi qua thiếu sức sống; mùng một bố mẹ chẳng buồn đi chùa, ngày ngày than con cứng cánh rồi sẽ bay đi, trong ánh mắt lộ vẻ hụt hẫng.",idea:"Chị em sinh đôi kể chuyện cũ.",q:["双胞胎姐弟在聊什么？"],note:[["别提多冷清了","<span class='zh'>别提多……了</span> = … khỏi nói."],["除夕、元宵节，不，是整个正月","Tự sửa lời để nhấn mạnh."],["翅膀硬了","Ẩn dụ: con cái trưởng thành."]]},{zh:"隔着过道坐着一对新婚的夫妇，新郎新娘一边给大家分发喜糖，一边说他们是旅行结婚的，顿时，整节车厢都热闹起来了，有人提议新郎新娘唱支歌，大家立刻鼓掌响应，那新郎一看就是个老实人，脸憋得通红，说他是社区物业干维修的，就会干活儿，不会唱歌，不过他媳妇不光贤惠，歌也唱得好，就让媳妇代表了，果然新娘张嘴就惊动了整节车厢，掌声、赞美声响成一片，现场简直就像联欢会一样，而我们对面角落里坐着的漫画家，早就用画笔记录下了眼前的一切。\n……",vn:"Bên kia lối đi là một cặp vợ chồng mới cưới, cô dâu chú rể vừa phát kẹo cưới cho mọi người vừa nói họ cưới bằng một chuyến du lịch; lập tức cả toa náo nhiệt hẳn lên. Có người đề nghị cô dâu chú rể hát một bài, mọi người liền vỗ tay hưởng ứng. Chú rể nhìn là biết người thật thà, mặt đỏ bừng, nói mình làm bảo trì ở ban quản lý khu phố, chỉ biết làm việc, không biết hát, nhưng vợ anh không chỉ hiền thục mà hát cũng hay, để vợ đại diện. Quả nhiên cô dâu vừa cất giọng đã làm cả toa sửng sốt, tiếng vỗ tay, tiếng khen vang lên rộn rã, khung cảnh chẳng khác gì một buổi liên hoan; còn họa sĩ truyện tranh ngồi ở góc đối diện thì đã sớm dùng bút ghi lại tất cả.\n……",idea:"Đám cưới trên tàu.",q:["新婚夫妇在车厢里做了什么？"],note:[["一边……，一边……","Vừa… vừa…"],["不光……，……也……","Không chỉ… mà còn…"],["现场简直就像联欢会一样","Xem 辨析 现场—当场."]]},{zh:"我和朋友不由得感叹，现代交通的确高效，人们随意打发着路上的时间，仓促间投入目的地的怀抱，早就忘了其实沿途的风景也是旅途的一部分，人和人之间无拘无束的交流也是人生最宝贵的财富。若不如此，我们又怎么会读到古人在那一束月光，一叶小舟，或者在那青山绿水间所寄托的情感呢！",vn:"Tôi và bạn không khỏi cảm thán: giao thông hiện đại quả thật hiệu quả, người ta tùy tiện giết thời gian trên đường, vội vàng lao vào vòng tay của điểm đến, đã sớm quên rằng cảnh vật dọc đường cũng là một phần của chuyến đi, và sự giao lưu thoải mái giữa người với người cũng là tài sản quý giá nhất của đời người. Nếu không như vậy, sao chúng ta có thể đọc được những tình cảm người xưa gửi gắm trong một vệt ánh trăng, một chiếc thuyền con, hay giữa non xanh nước biếc!",idea:"Cảm nhận.",q:["我们的感受是什么？"],note:[["若不如此，……又怎么会……呢！","Câu hỏi tu từ (phản vấn)."],["一束月光，一叶小舟","Lượng từ văn chương: <span class='zh'>束 · 叶</span>."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"",zh:"A的A，B的B",py:"",tag:"Chú thích 1",mean:"Cấu trúc <span class='zh'>A的A，B的B</span> dùng để <b>liệt kê mấy tình huống</b> của một sự việc — “người thì…, người thì…”. Dùng trong khẩu ngữ.",forms:["V的V，V的V","Adj的Adj，Adj的Adj"],ex:[["进了果园，大家看到一树的桃，红的红，绿的绿，漂亮极了。","Vào vườn, thấy cả cây đào, quả đỏ quả xanh, đẹp vô cùng."],["坐在宽敞座椅中的人们，享受着齐全的软硬件设施，看电影的看电影，打电话的打电话……","",1],["信号灯变绿了，前面的汽车还是不走，后面一长串汽车的司机按喇叭的按喇叭，探头的探头。","Đèn xanh rồi mà xe trước không đi, tài xế hàng xe phía sau người bấm còi, người thò đầu ra."]],tips:["Bài tập 2②."],practice:{q:"请把下列6个小句组合成3个连贯的语段：A. 那一年，爸爸病了，爷爷奶奶年岁已高，我们姐弟年龄还小　B. 玩儿了一天，大家饿的饿，渴的渴　C. 迫不及待地想吃顿可口的饭菜　D. 晚会上，大家唱的唱，跳的跳　E. 一家子老的老，小的小，病的病，妈妈愁得不得了　F. 高兴得不得了",type:"complete",items:[["语段（1）：? + ?","A + E"],["语段（2）：? + ?","B + C"],["语段（3）：? + ?","D + F"]]}},{id:"g2",grp:1,word:"",zh:"一时",py:"yìshí",tag:"Chú thích 2 · phó từ",mean:"Khi làm phó từ, có hai nghĩa chính:<br>① Hành vi xảy ra <b>tạm thời, ngẫu nhiên hoặc đột ngột</b> — “nhất thời”.<br>② Dùng lặp lại <span class='zh'>一时……，一时……</span>, biểu thị các hành vi <b>xen kẽ nhau</b> — giống <span class='zh'>时而</span> “lúc thì… lúc thì…”.",forms:["一时 + V（忘了 / 心急 / 想不起来）","一时……，一时……"],ex:[["我感叹初中时，班里那个贵族气十足的男生，他叫……唉，一时竟忘了他叫什么名字。","",1],["接到丈夫病危的电话，她一时心急，连门都没有锁，就冲出家门，直奔医院而去。","Nhận tin chồng nguy kịch, chị nhất thời cuống quá, cửa cũng chẳng khóa, lao thẳng đến bệnh viện."],["他吃了药，好些了，身上一时冷，一时热的情况没有了。","Uống thuốc xong đỡ rồi, không còn lúc nóng lúc lạnh nữa."],["高原上天气变化大，一时太阳当空，一时阴雨绵绵是常有的事。","Trên cao nguyên thời tiết thay đổi nhiều, lúc nắng chang chang lúc mưa dầm là chuyện thường."]],tips:["SBT câu 21D: <span class='zh'>一时风光</span>.","Bài tập 2③."],practice:{q:"给“一时”选择适当的位置",type:"pos",items:[["见了面A觉得似曾相识，B可C又记不起来D在哪儿见过。","C","……可一时又记不起来在哪儿见过。"],["A他一不留神，B从台阶上重重地C摔了下来，D动弹不得。","D","……摔了下来，一时动弹不得。"],["买房子是A大事，B要考虑清楚，可C不能凭D冲动。","D","……可不能凭一时冲动。"]]}},{id:"g3",grp:1,word:"天伦之乐",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>不屑一顾</span> = chẳng thèm nhìn. <span class='zh'>见义勇为</span> = thấy việc nghĩa thì làm. <span class='zh'>天伦之乐</span> = niềm vui sum vầy. <span class='zh'>无拘无束</span> = thoải mái tự nhiên. <span class='zh'>狼狈不堪</span> = thảm hại vô cùng. <span class='zh'>料事如神</span> = đoán việc như thần.",forms:["对……不屑一顾","享受 / 共享天伦之乐","无拘无束地 + V"],ex:[["寄情于虚拟世界的网迷们对喧哗的现实流露出的是不屑一顾的冷淡。","",1],["虽然弟弟写信来拜年，可全家都觉得没了天伦之乐。","",1],["人和人之间无拘无束的交流也是人生最宝贵的财富。","",1]],tips:["Bài tập 3②."]},{id:"g4",grp:2,word:"现场",zh:"现场 / 当场",py:"xiànchǎng / dāngchǎng",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>nơi và lúc sự việc xảy ra</b>”. <span class='zh'>现场</span>: danh từ, nhấn <b>địa điểm</b>, sau có thể mang danh từ; còn chỉ hiện trường vụ án, tai nạn. <span class='zh'>当场</span>: phó từ, nhấn <b>thời điểm</b>, sau chỉ đi với động từ.",forms:["现场 + 直播 / 演出 / 会议；保护现场","当场 + 出丑 / 抓获 / 死亡"],ex:[["现场简直就像联欢会一样。","",1]],tips:["<span class='zh'>×当场一片狼藉 · ×当场直播</span>."]}],BX:{grp:2,word:"现场",cols:["现场","当场"],pair:"现场 — 当场",same:["Đều có nghĩa “<b>nơi và lúc xảy ra sự việc</b>”.","他现场 / 当场把这种新的技术演示了一次。"],diff:[["<b>Danh từ</b>, nơi trực tiếp sản xuất, biểu diễn, thi đấu, thí nghiệm…, nhấn mạnh <b>địa điểm</b>; sau có thể mang danh từ.","现场参观 / 现场演出 / 现场直播 / 现场会议","<b>Phó từ</b>, ngay tại chỗ và ngay lúc đó, nhấn mạnh <b>thời điểm</b>; sau chỉ đi với động từ.<div class='zh' style='margin-top:4px'>当场出丑 / 当场抓获 / 当场死亡</div>"],["Nơi xảy ra vụ án, tai nạn, thiên tai và tình trạng lúc đó.","地震过后，现场一片狼藉。","Không có cách dùng này."]],task:{q:"选择“现场”或“当场”填空",cols:["现场","当场"],sample:!1,items:[["昨天公司被偷了，警察要求保护____，以便取证。",0,"Hiện trường vụ trộm → 现场."],["昨天那里发生了严重的交通事故，司机____死亡了。",1,"Trước động từ, ngay lúc đó → 当场."],["终于看到了我喜爱的明星的____演唱会。",0,"Bổ nghĩa danh từ → 现场演唱会."],["大家都吓坏了，小王甚至____哭出了声。",1,"Trước động từ → 当场."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["方<u>言</u>","语言 · 言论 · 传言 · 谎言"],items:[["<u>宽</u>敞","宽","宽松 · 宽裕 · 宽窄 · 宽限"],["齐<u>全</u>","全","周全 · 全身 · 全然 · 全心全意"],["封<u>闭</u>","闭","关闭 · 闭幕 · 闭塞 · 闭月羞花"],["<u>演</u>绎","演","演员 · 演出 · 演讲 · 表演"]]},EX2:{q:"用所给词语或结构完成句子",type:"complete",vn:"Hoàn thành câu với từ / cấu trúc trong ngoặc.",items:[["公司打算________。","为期","公司打算开展为期一周的艺术周活动。"],["运动场上，大家________。","A的A，B的B","运动场上，大家跑的跑，跳的跳。"],["路途遥远，________。","一时","路途遥远，我们一时没法估计到达的时间。"],["________，他感慨万分。","回顾","回顾过去的四十年，他感慨万分。"],["为了________，大家积极行动起来。","响应","为了响应政府号召，大家积极行动起来。"],["不好意思，________。","仓促","不好意思，时间有限，准备得太仓促了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["贤惠","新郎","新娘","现场","回顾"],text:"昨天我参加了一对年轻人的婚礼，{新郎}帅气能干，{新娘}不但漂亮，而且{贤惠}。两人{回顾}了恋爱时的点点滴滴。大家的掌声、笑声响成一片，婚礼{现场}成了欢乐的海洋。"},{bank:["正月","对联","天伦之乐","家常","拜年"],text:"春节是中国最重要的传统节日，家家户户都贴{对联}，包饺子，放鞭炮。在外地工作的儿女们，无论有多远，都要赶回家，陪父母聊聊{家常}，帮父母做做家务，共享{天伦之乐}。{正月}初一，亲朋好友们互相{拜年}，共同祝愿新的一年一切顺利。"}]},EX4:{q:"请指出下列语段中借代的用法",items:[{src:"",task:"“老李，你有些不舒服吗？你生病了吗？”一个花白胡子问道。",model:"“花白胡子”借代“有花白胡子的人”。"},{src:"",task:"几千双眼睛都盯着你呢，你肩上的责任很重啊。",model:"“几千双眼睛”借代“几千个人”。"},{src:"",task:"要爱护这里的一草一木，不能拿群众的一针一线。",model:"“一草一木”“一针一线”借代“老百姓的所有事物”。"},{src:"",task:"远远的，一个可爱的小红帽一蹦一跳地走过来。",model:"“小红帽”借代“戴小红帽的人”。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["去时乘坐高铁的情形","车程，时速，车窗外，车里的人们（A的A，B的B，更多的……，寄情于……），终点站……","去时乘高铁，车程6小时，时速300公里。车里的人们看电影的看电影，打电话的打电话，更多的人把自己封闭在手机屏幕中。到了终点站，大家迫不及待地下了车。"],["回程与去时有何不同？","车程，速度，网络信号，灯光，电源，环境","回程坐特快硬座，将近13个小时，车速不快；车厢里信号差无法上网，灯光昏暗无法看书，没有电源，人多嘈杂。"],["我跟朋友在车上聊了些什么？","① 朋友：见义勇为的李芳芳 ② 我：贵族气十足的男生 ③ 我们：小学地理老师，我们班的诸葛亮","朋友讲了见义勇为的李芳芳，我讲了贵族气十足的男生，我们还想起了小学地理老师和班里的“诸葛亮”。"],["我周围的人在做什么？","① 双胞胎姐弟：弟弟考上大学，春节没有回家，家里…… ② 新婚小两口：分发喜糖，新郎……，新娘……，唱歌……","一对双胞胎姐弟在聊家常，回顾弟弟考上大学后春节没回家、家里冷冷清清的往事；一对新婚夫妇给大家分发喜糖，新娘唱歌，车厢像联欢会一样热闹。"],["我们的感受","现代交通……，人们早已忘了……，……是人生最宝贵的财富","现代交通的确高效，但人们早已忘了沿途的风景也是旅途的一部分，人和人之间无拘无束的交流是人生最宝贵的财富。"]]},PZ:{title:"修辞（9）借代",vn:"Hoán dụ",intro:"<b>Không nói thẳng tên sự vật</b>, mà mượn một cách gọi khác (đặc điểm, dấu hiệu, bộ phận…) để biểu thị — gọi là <b>借代</b>. Ví dụ (1) gọi “bạn học đoán việc như thần” thẳng là “Gia Cát Lượng”.",ex:[["还有，中学我们班那个料事如神的诸葛亮……","“诸葛亮” — nhân vật Tam Quốc nổi tiếng mưu trí, ở đây thay cho “料事如神的同学”."],["这个小眼镜就是我的儿子。","Dùng “小眼镜” thay cho “người đeo kính nhỏ”."],["汽车停下来，等待放了学的小黄帽们过马路。","Dùng “小黄帽” thay cho “học sinh tiểu học đội mũ vàng”."]],q:"下面句子中，每句带下划线的词中都有一个不属于借代，请指出",pvn:"(1) <u>大胡子</u>边说话边<u>乐呵呵</u>地朝我走来。　(2) 为了全家的<u>面包</u>，我也要好好<u>工作</u>呀。　(3) 他的<u>狡猾</u>是出了名的，我们都很了解这只<u>老狐狸</u>。",practice:[["(1)","乐呵呵 — không phải 借代 (“大胡子” = người râu rậm)."],["(2)","工作 — không phải 借代 (“面包” = cái ăn, sinh kế)."],["(3)","狡猾 — không phải 借代 (“老狐狸” = kẻ xảo quyệt)."]]},DP:[{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ để đoán nghĩa cả từ.",items:[["验收","yànshōu","nghiệm thu","验：察看，查考 · 收：接受","工程已经通过验收。"],["武装","wǔzhuāng","vũ trang","武：关于军事的 · 装：配置","武装力量。"],["团结","tuánjié","đoàn kết","团：会合在一起 · 结：组织，结合","大家要团结一致。"],["整顿","zhěngdùn","chỉnh đốn","整：整理 · 顿：处理，安置","整顿市场秩序。"],["界限","jièxiàn","ranh giới","界：不同事物的分界 · 限：指定的范围","要分清是非的界限。"],["充当","chōngdāng","đảm nhiệm, đóng vai","充：担任 · 当：担任","他在会上充当翻译。"],["签署","qiānshǔ","ký kết","签：亲自写姓名或画记号 · 署：签名","两国签署了合作协议。"],["包庇","bāobì","bao che","包：隐藏，掩盖 · 庇：遮蔽，掩护","不能包庇犯罪分子。"],["共鸣","gòngmíng","cộng hưởng, đồng cảm","共：在一起，一齐 · 鸣：发出声音","这本书引起了读者的共鸣。"],["发动","fādòng","phát động; khởi động","发：开始行动，引起行动 · 动：改变原来的位置或状态","发动群众 · 发动汽车。"],["测量","cèliáng","đo lường","测：用仪器确定数据 · 量：用尺子等确定大小、多少","测量体温。"],["指示","zhǐshì","chỉ thị","指：指点，引导 · 示：表明，使人知道","按照上级的指示办事。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"教师必须把教学活动组织得生动、有趣，除了教师讲授外，要多给学生参与的机会。小学生中出现的课堂纪律问题，往往不是学生故意捣乱，而是学生对教师的课不感兴趣，因而不能坚持听课。",o:["小学生的注意力不能持久","没有经验的老师上不好课","课有吸引力学生就会认真听","学生违反纪律是应该原谅的"],a:2,why:"Học sinh mất trật tự vì bài không hấp dẫn → bài hay thì sẽ nghe. Có <span class='zh'>捣乱</span>."},{n:2,say:"考古发掘中，能够直接参加考古工作的人终究是少数，且一旦发掘工作完毕，现场往往很难原样不动地保存下来，要想让更多的人了解某一地下发掘的现场、情景以及出土文物，只有依靠考古报告。",o:["考古工作者的数量一直不足","考古工作完毕，现场就破坏了","考古工作者都应该学习考古报告","考古报告能反映当时的考古发掘情况"],a:3,why:"“要想让更多的人了解……只有依靠考古报告”. Có <span class='zh'>现场</span>."},{n:3,say:"传统的化学工业给环境带来的污染已十分严重，并威胁着人类的生存。化学工业能否生产出对环境无害的化学品？甚至开发出不产生废物的工艺？有识之士提出了绿色化学的号召，并立即得到了全世界的积极响应。",o:["化学工业正在进行一场革命","人们怀疑无害化学品的真实性","传统化学工业的生存受到了挑战","降低化学污染的号召得到了响应"],a:3,why:"“绿色化学的号召，并立即得到了全世界的积极响应”. Có <span class='zh'>响应</span>."},{n:4,say:"农历正月初一是古时的新年，又称“新正”，今天我们称之为“春节”。它作为古代官方法定岁首，乃汉武帝时编定的太初历所规定。千百年来，这个法定岁首逐步汇聚了许多其他节日的习俗，成为一个送旧迎新的节日。",o:["春节是一年的最后一天","“春节”古时称为“新正”","汉武帝规定春节为法定节日","从一开始春节就有很多习俗"],a:1,why:"“又称‘新正’”. C sai: Thái Sơ lịch quy định. Có <span class='zh'>正月</span>."},{n:5,say:"小篆，是秦始皇统一六国之后，秦代通用的标准字体。相传是秦国丞相李斯所创。与大篆相比，小篆书写起来更加简便，字体长方，每个字大小一样，排列方正，横竖成行，给人一种整齐之美，这样也就形成了方圆兼备的小篆体。",o:["小篆曾经风行六国","相传李斯创造了小篆","小篆可以写成方的或圆的","就书写简便而言，大篆更优"],a:1,why:"“相传是秦国丞相李斯所创”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：离开美国后，你决定写这部非虚构题材的小说，有什么原因和契机吗？\n女：这本书是我自己的一段人生历程，其中也包含了大量人们需要的信息。之前我只写形象更为复杂、主题相对悲观的虚构作品。说到非虚构题材的写作，原因和契机其实很偶然。去年，我和一位出版社编辑聊起我在美国陪孩子读书时的一些见闻，提到这样一个场景：一对华人夫妇星期天去购物，那是个冬天，下着鹅毛大雪，他们开车经过市中心，看到有个女孩儿高举标语牌，孤零零地站在教堂门口，标语牌上写着：“抗议反对人工流产”“抗议歧视同性恋”，华人夫妇议论道，这么冷的天，一个女孩子站在雪地里，也不知道她父母知道不知道，车到近前才骇然发现，这女孩儿竟是他们还在读高中的独生女儿。编辑朋友激动地打断我，提议我写下来。她认为，我这几年陪读生活中遇到的点点滴滴都值得记录下来，现在这么多中国家庭把孩子送出去留学，家长非常需要了解我经历过的这些事，中国教育是有问题，但异国生涯无论对小留学生还是对家长都未必不是挑战。\n男：你是一个擅长写虚构小说和戏剧的作家，是什么让你决定从虚构的掩体中跃出，开始非虚构的写作？\n女：关于非虚构写作，虽然我是第一次尝试，不过我很早就关注了。那是2000年我在美国期间，逛书店的时候，我发现书店每周张贴出的畅销书前十名排行榜都分为两大类：虚构和非虚构，我吃惊地意识到，在美国，非虚构作品的数量和质量竟然可以和虚构作品不分伯仲。而那时，中国的文学刊物还没有“非虚构”栏目，虽然有报告文学，但报告文学只是非虚构里的一种形式。写这本书，我的初衷是希望和其他家长分享我所了解的美国高中校园，希望读者能够通过我和孩子的一些经历获得他们需要的信息，也希望通过我的视角让读者了解这个媒体上谈论最多的国家，因此比较有说服力的应该是非虚构这个写作形式。",qs:[{n:6,q:"女的这本非虚构题材小说的写作契机是什么？",o:["自己留学的经历","编辑朋友的建议","外国朋友的问题","女儿学校的要求"],a:1,why:"“编辑朋友激动地打断我，提议我写下来”."},{n:7,q:"关于编辑朋友，下列哪项正确？",o:["被华人夫妇的女儿征服了","认为小留学生也面临挑战","认为中国家长有时很幼稚","庆幸自己认识一位好作者"],a:1,why:"“异国生涯无论对小留学生还是对家长都未必不是挑战”. Bẫy: <span class='zh'>征服 · 幼稚</span>."},{n:8,q:"是什么原因促使女的愿意尝试非虚构写作？",o:["非虚构文学在中国是空白","2000年非虚构文学才出现","在美国非虚构作品很畅销","她接受了非虚构刊物的约稿"],a:2,why:"Bảng xếp hạng sách bán chạy chia hai loại, phi hư cấu ngang ngửa hư cấu."},{n:9,q:"关于女的的非虚构小说，下列哪项正确？",o:["读者喜欢什么她就写什么","进入本周畅销书排行前十","写的是美国高中校园生活","媒体评价其内容很有说服力"],a:2,why:"“分享我所了解的美国高中校园”."},{n:10,q:"关于女的，下列哪项正确？",o:["她的书都写自己的亲身经历","她的非虚构小说信息量很大","她的作品内容丰富体裁齐全","她是一位正义感极强的作家"],a:1,why:"“其中也包含了大量人们需要的信息”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"“年”是中国人最重要、最综合的一个节日。年，对我们究竟意味着什么？华服？美食？休闲？放松？不尽然，应该说贴对联、穿新衣，只是一种仪式，是对辞旧迎新的尊重，对美好生活的憧憬；拜年、聚餐、拉家常，则是对亲情的眷恋。\n很多人感慨现在的“年味”越来越淡了。其实所谓“浓”或“淡”，恐怕只是成年人的感受，年复一年，循环往复，再加上现在生活水平提高了，平时吃、穿水平就不低，过年也变不出什么新花样，新鲜感自然就少了！但是孩子过年总是欢乐的，仿佛天天都被浓浓的年味包裹着，光是过年的气氛，就足以让他们欢快了，和儿时的我们一样。",qs:[{n:11,q:"根据这段话，中国人过年要做什么？",o:["努力工作","全家团聚","举行仪式","外出旅行"],a:1,why:"“拜年、聚餐、拉家常，则是对亲情的眷恋”. Có <span class='zh'>对联 · 拜年 · 家常</span>."},{n:12,q:"过年为什么要穿新衣服？",o:["为了漂亮","以示重视","因为有钱","因为高兴"],a:1,why:"“只是一种仪式，是对辞旧迎新的尊重”."},{n:13,q:"为什么很多人觉得现在年味不浓？",o:["以前的喧哗不见了","新鲜的东西都没有了","现在天天都穿新衣服","平时生活水平提高了"],a:3,why:"“现在生活水平提高了，平时吃、穿水平就不低”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"我理解“慢生活”就是一种生活态度，把工作、吃饭、休息、劳动都看成一种享受。老实说，生活中的每件小事都能给我们带来快乐，比如，拿起剪刀慢慢做点儿小手工；亲手织一件色泽淡雅、款式绝无仅有的毛衣穿在身上；在花瓶中插上一束沁人心脾的鲜花；每顿都用心做一碗健康美味的汤品。而做这些事的过程并非都是痛苦的劳动，其本身就充满了乐趣。\n于是，我开始改变自己。原本我不写日记，现在开始徜徉在文字之间，寻觅那一份“慢”的惬意；每天开车上班，我改变了按点出门的习惯，这样就不会为堵车而心急火燎，而是慢慢开，把驾驶当成一种乐趣；出去买菜或办事需要走路时，我的脚步慢了下来，看看身边的城市、身边的人，发现竟然会有不一样的心情！\n慢下来其实很简单，只要去除那些外力强加给你的价值观，只需听从自己内心的声音，找到自己喜欢的事情，按照自己的节奏，慢慢地享受那份美好，你的心中就会少些抱怨，感觉生活其实很精彩！",qs:[{n:14,q:"说话人认为应该怎样理解“慢生活”？",o:["“慢生活”讲究事必躬亲","“慢生活”讲究行为优雅","“慢生活”讲究品味和质量","“慢生活”讲究体味做事的过程"],a:3,why:"“做这些事的过程……其本身就充满了乐趣”."},{n:15,q:"说话人有哪些改变？",o:["开始读书写作","开始调整自己","学着买菜做饭","在街上东张西望"],a:1,why:"“于是，我开始改变自己”."},{n:16,q:"说话人对“慢生活”的切身感受是什么？",o:["不要去管别人想什么","不要惧怕外界的压力","按自己的想法享受美好","慢与不慢都能活得精彩"],a:2,why:"“按照自己的节奏，慢慢地享受那份美好”."},{n:17,q:"说话人告诉我们什么？",o:["慢生活是大势所趋","慢点开车才能欣赏到风景","想提高工作效率要先慢下来","慢下来可以感受到不一样的生活"],a:3,why:"“发现竟然会有不一样的心情！”"}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["由于这些电动机都以电池作为电源，所以未能广泛普及。","我承认，你年轻，身体比我棒极了，可你也不能这么不注意呀！","团结友爱、助人为乐、无私奉献，这些都是中华民族的传统美德。","人们散落在沙滩上，吃的吃，玩儿的玩儿，晒太阳的晒太阳，悠闲极了。"],a:1,why:"<b>Câu so sánh sai</b>: <span class='zh'>比</span> không đi với <span class='zh'>极了</span> → <span class='zh'>身体比我棒多了</span>. D dùng <span class='zh'>A的A</span> (đúng)."},{n:19,o:["成都平原是我国西南地区最大的平原。","每逢佳节，这里常举行游园联欢，人们载歌载舞，喜气洋洋。","随着现代文明的发展和进步，人们对于生活节奏是更加没有规律了。","民间传说及古代作者常将元宵节的起源上溯至汉代，这不是没有道理的。"],a:2,why:"<b>Kết cấu lộn xộn</b>: <span class='zh'>人们对于生活节奏是更加没有规律了</span> → <span class='zh'>人们的生活节奏更加没有规律了</span>."},{n:20,o:["老人有一个儿子、两个女儿。每逢年节和老人的生日，几代人便欢聚一堂，尽享天伦之乐。","他规定所有员工统一着装。因为统一的服装可以使员工表现为非同一般的庄重和一丝不苟的修养，给客户留下好印象。","春天，他们种植松树；夏天，他们播种和照料野花；秋天，他们观察冬眠前各种动物的奇异骚动；冬天，他们给鸟喂食。","科学史是自然科学与人文科学之间的桥梁，它能够帮助人们获得自然科学的整体形象、人性的形象，从而全面地理解科学、理解科学与人文的关系。"],a:1,why:"<b>Phối hợp động – tân không hợp</b>: <span class='zh'>表现为……修养</span> không hợp → <span class='zh'>表现出……的修养</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"贾府不计成本办秦可卿葬礼和元妃省亲，只求___辉煌。结果事情是办得___了，但资源浪费了，贾府的___也就此开始了。",o:["偶尔　顺利　没落","一度　漂亮　凋零","暂时　得意　堕落","一时　风光　衰落"],a:3,why:"<span class='zh'>一时辉煌</span> (ngữ pháp bài này!); <span class='zh'>办得风光</span>; <span class='zh'>衰落</span>."},{n:22,text:"很多女人，特别是知性女人，常常认为女人的美是内在美和外在美的___。其实，在她们潜意识中更___的是内在美，往往___外在美，甚至对外在美有些___。",o:["结合　在意　忽略　不屑一顾","总和　留心　疏忽　无拘无束","夹杂　挂念　漠视　无动于衷","统一　相信　马虎　不以为然"],a:0,why:"<span class='zh'>……的结合</span>; <span class='zh'>在意</span>; <span class='zh'>忽略</span>; <span class='zh'>不屑一顾</span> (từ mới!)."},{n:23,text:"第一天开上四个轮子上路，小李手忙脚乱，___至极，他能感觉到，路上的高手们嫌他车开得慢，___一般地超过他的车，有的还回过头来看上两眼，___中净是烦躁和埋怨，车子也是憋足了劲儿___而过。",o:["威风　发狂　表情　擦肩","狼狈　示威　眼神　呼啸","惊恐　抗议　回顾　轰鸣","拘束　撒欢　仓促　一闪"],a:1,why:"<span class='zh'>狼狈至极</span>; <span class='zh'>示威一般</span>; <span class='zh'>眼神中</span>; <span class='zh'>呼啸而过</span> — toàn từ mới bài này!"}]},read3:{ins:"第24–28题：选句填空。",text:"一个人的成长，没有不经历坎坷的。只有历经挫折、苦涩与喜悦，才称得上是健康的成长。我一直在努力，希望自己做得更好，不辜负父母对我的期望，(24)，唯有父母为子女的付出是无私且不求回报的。\n不记得有多少回，父母发现我走了歪路，好心来管教，(25)，觉得父母多余，不喜欢他们管我，直到吃了苦头才后悔不已。那会儿的我，和很多孩子一样，(26)，把父母的扶助当作天经地义，相反，对父母的教诲却是满肚子的不愿意，甚至充满敌意。\n其实父母把我们带到这个世界上，(27)，让我们健康、快乐地成长，让我们掌握了知识，他们就尽到了责任。人生道路的选择是我们自己的事情，父母没有保证我们一辈子活得无忧无虑的义务。\n告诫各位朋友，懂事之后，不要随意伤害父母，多考虑一下他们的感受和意见，他们是为我们好，怕我们在成长之路上陷入误区，怕我们陷入不必要的痛苦。在我们成人之后，(28)，做个有良心的人。",opts:["我却习惯性地反抗","因为普天之下","把我们拉扯大","要感念他们的养育之恩","把父母的付出当作理所当然"],ans:{24:1,25:0,26:4,27:2,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"富兰克林的名言“时间就是生命，时间就是金钱”，作为大工业时代的座右铭，曾影响了整个世界，激励了无数人化身为社会机器的一个齿轮，越来越多的人沦为时间的奴隶。“慢的乐趣怎么失传了呢？”作家米兰·昆德拉在《慢》一书中发出这样的感慨。\n如今，一场新的提倡“慢”的革命正在悄然兴起。这场革命是由无数厌倦了忙碌日子的人们发起的，他们希望可以用更多的时间来欣赏生活的乐趣。\n对于“慢生活”，记者对10位不同行业的白领做了一次小型调查，无一例外，大家都渴望拥有慢生活的生活状态，但八成人认为“慢生活”只是美好的向往。“国情不允许”是白领们最为集中的观点。他们觉得中国用20年经历了欧美200年发生的事情，现在西欧的生活不快，因为他们的社会发展正处在较为稳定的阶段，而我国尚没有这样的经济基础和条件，还需要我们艰苦奋斗。另一方面，生活压力大也是白领们认为慢生活仅是向往的原因之一。\n媒体工作者薇薇是快工作、慢生活的有效实践者。虽然做媒体工作仿佛每天都在与时间赛跑，可她依然是贤惠的好媳妇、双胞胎的好母亲、公婆的好儿媳，她依然能超然地活得轻松而自在。上班时，她认真、高效地完成本职工作，下班后和孩子看漫画，和老人聊天，业余读读钟爱的古诗词，练练书法，周末全家人一起去爬山、会朋友、泛舟湖泊、纵情于山水之间。不管别人多忙碌，她依然可以保有内心的平静、淡定和从容。她做不了贵族，但她一定要做生活的主人。",qs:[{n:29,q:"失去慢的乐趣，源于：",o:["社会的飞速发展","富兰克林的影响","人类深感时间宝贵","《慢》这本书的影响"],a:0,why:"Thời đại đại công nghiệp — xã hội phát triển nhanh biến con người thành nô lệ thời gian."},{n:30,q:"如今的状况是：",o:["记者的调查惊动了社会","欣赏生活是一个世界潮流","多数白领希望生活重回慢节奏","多数人认为慢生活没什么好的"],a:2,why:"“无一例外，大家都渴望拥有慢生活的生活状态”."},{n:31,q:"八成人认为慢生活难以实现的理由是：",o:["中国国情决定的","这些人还不够富有","中国经济发展不够稳定","中国赶上欧美需要200年"],a:0,why:"“‘国情不允许’是白领们最为集中的观点”."},{n:32,q:"关于薇薇，下列哪项正确：",o:["她业余爱好跑步","她喜欢游山玩水","她还是个书法家","她向往贵族生活"],a:1,why:"“爬山……泛舟湖泊、纵情于山水之间”. Có <span class='zh'>贤惠 · 双胞胎 · 漫画 · 贵族 · 舟</span>!"}]},{ins:"第33–36题：请选出正确答案。",text:"三十年以后，乡村将是未来中国人的奢侈品。那时的乡村正如今天的城市让人们向往，那时的乡村将是鸟语花香的好地方。\n中国有句老话：三十年河东，三十年河西。1949年新中国成立，前半部历史是城市化，后半部历史将是乡村化。\n如今中国的乡村很多已经变成空心村，年轻人外出上学、务工，人人憧憬着城市生活，这就是今天的城市化。往后，再成为乡村土地主人的不再是曾经走出去的农民，而是从城市奔向农村的大学生和工人。“农民”这个名词将逐步被人们淡忘。城市化在不到20年时间内，会促成乡村更多的耕地转化，空心村将会转移，因为都市人住进了乡村，城市核心区将会成为“空心城”。那时，种田是一种最好的生活方式。三五万人的小城镇将是人们最向往的地方。那时的市长很牛，村长更牛。那时，村依然在，可能已改为庄园或农场，农业机械化程度达到90%。\n以自然为本，与自然相融将会成为未来人的集体追求。“食”在田园乡村会成为人们的首选，新鲜的空气、自然的田园、刚刚从树上摘下来的水果、刚刚从菜园采回来的蔬菜，这一切都会成为享受。若干年后，人们开始从内心关注土壤，开始把土壤、树木视为自己的孩子，看成有生命的物质。那时的“住”，追求的不仅是宽敞和室内的舒适度，还关注室内外的环境，环境将成为居住的重要条件。",qs:[{n:33,q:"今天中国乡村的状况是：",o:["年轻人都很忙","人口流向城市","老房子都坏了","环境污染严重"],a:1,why:"“空心村，年轻人外出上学、务工”."},{n:34,q:"第2段画线词语“三十年河东，三十年河西”的意思最可能是：",o:["指人事变化无常","指不必被往事所困","指人的习俗好恶变迁","指每三十年中定会发洪水"],a:0,why:"Thành ngữ: thời thế xoay vần, thịnh suy thay đổi."},{n:35,q:"根据上文，往后乡村会是什么样子？",o:["那时的村长兼职养牛","都市人都会住进乡村社区","走出去的农民争相重回土地","村子可能已改为庄园或农场"],a:3,why:"“村依然在，可能已改为庄园或农场”."},{n:36,q:"“以自然为本，与自然相融”指的是：",o:["大自然应进入学生的书本","人们的居住环境不再闭塞","大家追求人与自然环境的融合","人们像爱护孩子一样爱护树木"],a:2,why:"Nghĩa đen của cụm từ. Có <span class='zh'>宽敞 · 闭塞</span>."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"这篇课文通过一次旅行去程和回程的对比，告诉我们在现代人的生活中，快速的生活节奏让我们忘掉了很多美好的东西，其实我们需要在紧张的生活中慢下来，尽情享受一下慢的乐趣。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Đi","<span class='zh'>高铁 · 6小时 · 看电影的看电影 · 封闭在手机屏幕中</span>."],["Về","<span class='zh'>特快硬座 · 13个小时 · 无法上网 · 久违的亲近感</span>."],["Ôn chuyện","<span class='zh'>李芳芳 · 贵族气的男生 · 地理老师 · 诸葛亮</span>."],["Người xung quanh","<span class='zh'>双胞胎姐弟 · 新婚夫妇 · 像联欢会一样</span>."],["Cảm nhận","<span class='zh'>沿途的风景 · 无拘无束的交流 · 最宝贵的财富</span>."]],outline:[["一","去程：高铁，快而冷淡"],["二","回程：特快，慢而亲近"],["三","我和朋友回忆往事"],["四","周围的人：姐弟、新婚夫妇"],["五","感受"]],model:"怀念慢生活\n放假三天，我和儿时的好友一起去西安旅行。\n去的时候我们坐高铁，只用了6个小时。列车以300公里的时速飞驰，窗外的景色一闪而过。车上座位宽敞，设施齐全，人们看电影的看电影，打电话的打电话，更多的人把自己封闭在手机屏幕里，对周围的一切不屑一顾。一到终点站，大家就迫不及待地下了车。\n回来时我们坐的是特快硬座，坐了将近13个小时。车开得不紧不慢，车厢里信号很差，不能上网，灯光昏暗，不能看书，也没有电源给手机充电。朋友却说，她很喜欢这种感觉，因为这时人和人之间才有一种久违的亲近感。\n于是，我们开始聊天儿，回忆小学和中学的同学、老师，边说边笑，很久没有这么开心过了。坐在我们对面的一对双胞胎姐弟在聊家常，回顾着过去的往事；一对新婚夫妇给大家分发喜糖，在大家的要求下，新娘唱了一首歌，整节车厢就像联欢会一样热闹。\n我和朋友不由得感叹：现代交通的确很快，可是人们匆匆忙忙地赶路，却忘了沿途的风景也是旅途的一部分，人和人之间无拘无束的交流才是人生最宝贵的财富。",check:["Có tiêu đề","Có đủ các ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 4: A的A，B的B · 一时 · 宽敞 · 齐全 · 封闭 · 不屑一顾 · 回顾 · 无拘无束","Khoảng 400 chữ"]},SUM:{words:["为期","征服","桥梁","平原","夹杂","呼啸","宽敞","齐全","封闭","符号","喧哗","不屑一顾","威风","演绎","电源","闭塞","久违","正义","见义勇为","洪水","英勇","贵族","播种","承包","方言","捣乱","狼狈","幼稚","双胞胎","家常","回顾","往事","方圆","爆炸","对联","拜年","天伦之乐","元宵节","正月","寺庙","眼神","新郎","新娘","响应","社区","物业","媳妇","贤惠","惊动","现场","联欢","漫画","仓促","无拘无束","束","舟"],patterns:[["A的A，B的B","看电影的看电影，打电话的打电话。"],["一时 + V","一时竟忘了他叫什么名字。"],["不是……，而是……","不是用语言，而是用符号传递着各自的情感。"],["别提多……了","家里节过得别提多冷清了。"],["修辞：借代","中学我们班那个料事如神的诸葛亮……"]],diff:["现场: danh từ, nhấn địa điểm, + danh từ (现场直播 · 保护现场) — 当场: phó từ, nhấn thời điểm, + động từ (当场死亡 · 当场抓获)","正月 zhēngyuè · 宽敞 kuānchang · 媳妇 xífu · 方圆 = phạm vi xung quanh"],sentences:["坐在宽敞座椅中的人们，享受着齐全的软硬件设施，看电影的看电影，打电话的打电话。","只有这时候，人和人之间才有种久违的亲近感。","沿途的风景也是旅途的一部分，人和人之间无拘无束的交流也是人生最宝贵的财富。"],hw:["Học thuộc 56 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Đặt 3 câu với A的A，B的B và 3 câu với 一时.","Làm Sách bài tập bài 33.","Đọc trước bài 34."]}});
