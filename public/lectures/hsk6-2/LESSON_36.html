<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 36 · 中国古代书院 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-36",num:36,book:"HSK 标准教程 6（下）",unit:{n:9,zh:"古今博览",vn:"Xưa và nay"},title:"中国古代书院",vn:"Trường học Trung Quốc thời xưa",chars:1202,source:"改编自《北京青年报》文章《中华文化五千年 私家藏书两千年》",goals:["Đọc hiểu bài thuyết minh 1202 chữ về <b>thư viện (书院) Trung Quốc cổ đại</b>: lịch sử hình thành, đào tạo nhân tài “đức nghiệp song trọng”, tinh thần học tập và phương pháp tổ chức dạy học tự do.","Dùng được 50 từ mới, nhất là nhóm <b>giáo dục – học thuật</b>: <span class='zh'>规章 · 完备 · 立足 · 灵魂 · 颁布 · 品德 · 窍门 · 发扬 · 招收 · 开明 · 倡议 · 激发 · 多元化 · 论坛 · 激励 · 示范 · 偶像</span> và nhóm <b>đạo đức – thái độ</b>: <span class='zh'>过失 · 无耻 · 容纳 · 树立 · 正气 · 唾弃 · 卑鄙 · 堕落 · 腐败 · 崇高 · 境界 · 杜绝 · 干涉 · 衷心 · 爱戴 · 崇敬</span>.","Nắm <span class='zh'>一经 · 本着 + 名词</span>.","Phân biệt <span class='zh'>截止 — 终止</span>; làm quen <b>篇章 (7): luận điểm + dẫn chứng</b>.","Viết 缩写 bài khóa ≈400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Đoạn 1–4 · 一经 · 截止—终止"],["Buổi 2","Nhóm 3 · Đoạn 5–8 · 本着 · Luận điểm + dẫn chứng · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"起",name:"Hình thành",paras:"Đoạn 1–2",zh:"藏书 → 教育机构 · 东佳书院",vn:"Từ nơi tàng thư thời Đường, thư viện dần thành cơ sở giáo dục kết hợp tàng thư, dạy học, nghiên cứu; 东佳书院 là hình ảnh thu nhỏ."},{tag:"承",name:"Đức nghiệp song trọng",paras:"Đoạn 3–4",zh:"学规 · 树立正气",vn:"Thư viện coi trọng nhân cách ngang học vấn; 《学规》 không dung kẻ vô liêm sỉ."},{tag:"转",name:"Tinh thần & phương pháp",paras:"Đoạn 5–6",zh:"读书没有窍门 · 平民入学 · 自修 · 切磋 · 质疑 · 论坛",vn:"Học không có mẹo; nhận con em bình dân, khuyến khích tự học, trao đổi, chất vấn, tranh luận."},{tag:"合",name:"Thầy trò & ảnh hưởng",paras:"Đoạn 7–8",zh:"师生融洽 · 重要影响",vn:"Trọng lễ nghĩa mà không câu nệ; thầy là thần tượng; thư viện ảnh hưởng lớn đến giáo dục phong kiến."}],warm1:{q:"你认为一个好的教育体系应该包含哪些方面？下列教育理念你同意吗？",vn:"Bạn có đồng ý với các quan niệm giáo dục sau? Bấm 有 (đồng ý) / 无 (không).",items:[["📚","要有刻苦、严谨的治学精神；学习没有捷径","Học phải chăm chỉ, nghiêm cẩn; không có đường tắt"],["⚖️","学问比道德培养更重要","Học vấn quan trọng hơn bồi dưỡng đạo đức"],["🔁","不断地复习很重要；独立思考很重要","Ôn tập liên tục; tư duy độc lập"],["🗣️","形成讨论，质疑，不同观点互相辩论的风气","Bầu không khí thảo luận, chất vấn, tranh luận"]],talk:["你同意“学问比道德培养更重要”吗？","你们国家古代有什么样的学校？"],link:"Việt Nam có <b>Văn Miếu – Quốc Tử Giám</b> (1070, 1076) — trường đại học đầu tiên, cũng theo tinh thần Nho giáo như 书院."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"私",rule:"私 = <b>riêng, cá nhân</b>.",w:[["私人","sīrén","tư nhân (có trong bài)"],["私办","sībàn","tư lập (có trong bài)"],["私事","sīshì","việc riêng"],["私下","sīxià","riêng tư, lén"],["私信","sīxìn","thư riêng"],["私有","sīyǒu","tư hữu"],["私营","sīyíng","tư doanh"],["私立","sīlì","tư thục"],["私宅","sīzhái","nhà riêng"],["私生活","sīshēnghuó","đời tư"],["私房钱","sīfangqián","tiền riêng"],["公私分明","gōngsī-fēnmíng","công tư phân minh"]]},{k:"流",rule:"流 = <b>chảy, di chuyển</b>.",w:[["流转","liúzhuǎn","xoay vần (có trong bài)"],["流动","liúdòng","lưu động"],["流浪","liúlàng","lang thang"],["流放","liúfàng","lưu đày"],["流年","liúnián","năm tháng trôi"],["流失","liúshī","thất thoát"],["流通","liútōng","lưu thông"],["流星","liúxīng","sao băng"],["流离","liúlí","lưu ly"],["流落","liúluò","lưu lạc"],["轮流","lúnliú","luân phiên"],["漂流","piāoliú","trôi dạt"]]},{k:"缩",rule:"缩 = <b>thu nhỏ, rút ngắn</b>.",w:[["缩影","suōyǐng","hình ảnh thu nhỏ (có trong bài)"],["缩小","suōxiǎo","thu nhỏ"],["缩短","suōduǎn","rút ngắn"],["缩回","suōhuí","rụt lại"],["缩减","suōjiǎn","cắt giảm"],["缩水","suōshuǐ","co lại"],["缩写","suōxiě","viết tóm tắt"],["缩印","suōyìn","in thu nhỏ"],["紧缩","jǐnsuō","thắt chặt"],["简缩","jiǎnsuō","rút gọn"],["浓缩","nóngsuō","cô đặc"],["压缩","yāsuō","nén"],["节衣缩食","jiéyī-suōshí","thắt lưng buộc bụng"]]},{k:"长",rule:"长 = <b>người lớn tuổi, bề trên</b> (zhǎng).",w:[["长幼","zhǎngyòu","già trẻ (có trong bài)"],["长辈","zhǎngbèi","bề trên (có trong bài)"],["兄长","xiōngzhǎng","anh (có trong bài)"],["长亲","zhǎngqīn","họ hàng bề trên"],["长者","zhǎngzhě","người lớn tuổi"],["年长","niánzhǎng","lớn tuổi"],["师长","shīzhǎng","thầy giáo"],["学长","xuézhǎng","đàn anh"],["尊长","zūnzhǎng","bề trên"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Hình thành & đào tạo nhân tài",from:1,to:13},{name:"Nhóm 2 · Đoạn 4–6",sub:"Học quy, tinh thần học tập, phương pháp",from:14,to:35},{name:"Nhóm 3 · Đoạn 6–8",sub:"Tranh luận, thầy trò, ảnh hưởng",from:36,to:50}],V:[[1,"官方","guānfāng","dt.","quan phương","nhà nước, chính phủ",1,"","政府方面。","有官方藏书","官方消息。","Tin chính thức.",[],"Bài tập 1 (ví dụ): <span class='zh'>敌方 · 多方 · 我方 · 双方</span>."],[2,"层出不穷","céngchū-bùqióng","thành ngữ","tằng xuất bất cùng","liên tiếp xuất hiện, xảy ra liên tục",1,"成","接连不断地出现，没有穷尽。","各种书院层出不穷","新产品层出不穷。","Sản phẩm mới liên tục ra đời.",[],"SBT câu 23D."],[3,"命名","mìng míng","đgt.","mệnh danh","đặt tên",1,"","给予名称。","把自己的书屋也命名为书院","这颗星以他的名字命名。","Ngôi sao này được đặt theo tên ông.",[],"Bài tập 2①."],[4,"规章","guīzhāng","dt.","quy chương","điều lệ, quy tắc",1,"","规则章程。","订有规章制度","遵守规章制度。","Tuân thủ nội quy.",[],"Bài tập 1: <span class='zh'>规则 · 规定 · 规范 · 法规</span>."],[5,"截止","jiézhǐ","đgt.","tiệt chỉ","cho đến, đến",1,"","（到一定期限）停止。","截止到清朝末年","报名截止日期是10月15号。","Hạn chót đăng ký là ngày 15/10.",[],"Xem <b>辨析 截止—终止</b>. SBT nghe 14–17."],[6,"终止","zhōngzhǐ","đgt.","chung chỉ","kết thúc, đình chỉ",1,"","结束；停止。","书院制度终止","比赛终止了。","Trận đấu đã dừng.",[],"Bài tập 1: <span class='zh'>停止 · 截止 · 止血 · 禁止</span>."],[7,"完备","wánbèi","tt.","hoàn bị","đầy đủ, trọn vẹn, hoàn thành",1,"","应该有的全都有了。","萌芽于唐，完备于宋","设施完备。","Cơ sở vật chất đầy đủ.",[],""],[8,"立足","lìzú","đgt.","lập túc","dựa trên cơ sở",1,"","站得住脚；处于某种立场。","书院立足于人才培养","立足本职，放眼世界。","Đứng vững chỗ mình, nhìn ra thế giới.",[],"SBT câu 22A."],[9,"灵魂","línghún","dt.","linh hồn","linh hồn, tâm hồn",1,"","心灵；思想；比喻起主导和决定作用的因素。","把灵魂塑造看得和学问同等重要","教师是人类灵魂的工程师。","Giáo viên là kỹ sư tâm hồn.",[],""],[10,"颁布","bānbù","đgt.","ban bố","công bố, ban hành",1,"","公布。","各时代书院颁布的《学规》","政府颁布了新法律。","Chính phủ ban hành luật mới.",[],"SBT nghe 14–17: <span class='zh'>颁布圣旨</span>."],[11,"品德","pǐndé","dt.","phẩm đức","đức tính, đức hạnh",1,"","品质道德。","重视品德修养","他品德高尚。","Ông ấy phẩm đức cao thượng.",[],""],[12,"过失","guòshī","dt.","quá thất","lỗi lầm, sự sai lầm",1,"","因疏忽而犯的错误。","掩饰过失","这是我的过失。","Đây là lỗi của tôi.",[],"SBT nghe câu 3: <span class='zh'>过失犯罪</span>."],[13,"无耻","wúchǐ","tt.","vô sỉ","không biết xấu hổ, vô liêm sỉ, trơ tráo",1,"","不知羞耻。","无耻之徒","这种行为太无耻了。","Hành vi này quá vô liêm sỉ.",[],"Bài tập 1: <span class='zh'>耻辱 · 羞耻 · 耻笑 · 奇耻大辱</span>. SBT câu 20A."],[14,"容纳","róngnà","đgt.","dung nạp","chứa, tiếp nhận",1,"","在固定的空间或范围内接受（人或事物）。","本书院定不容纳","这个礼堂能容纳一千人。","Hội trường chứa được 1000 người.",[],""],[15,"透露","tòulù","đgt.","thấu lộ","tiết lộ, để lộ",1,"","泄露或显露（消息、意思等）。","透露出这样的信息","他没有透露任何消息。","Anh ấy không tiết lộ tin gì.",[],""],[16,"治理","zhìlǐ","đgt.","trị lý","cai quản, quản lý",1,"","统治；管理；处理，整修。","人文环境的治理","治理污染。","Xử lý ô nhiễm.",[],"Bài tập 3①."],[17,"树立","shùlì","đgt.","thụ lập","dựng nên, nêu",1,"","建立（多用于抽象的好的事情）。","树立正气","树立榜样。","Nêu gương.",[],"Bài tập 1: <span class='zh'>立正 · 立足 · 建立 · 独立</span>."],[18,"正气","zhèngqì","dt.","chính khí","tác phong quang minh chính đại, khí tiết chính trực",1,"","光明正大的作风或风气。","树立正气","一身正气。","Đầy chính khí.",[],"Bài tập 3①. SBT nghe câu 1: 《正气歌》."],[19,"唾弃","tuòqì","đgt.","thóa khí","phỉ nhổ, khinh bỉ",1,"","鄙弃。","唾弃卑鄙、堕落的腐败行为","这种行为令人唾弃。","Hành vi này đáng bị phỉ nhổ.",[],"Bài tập 3①. SBT câu 18A."],[20,"卑鄙","bēibǐ","tt.","ti bỉ","đê tiện, hèn hạ, bỉ ổi",1,"","（语言、行为）恶劣；不道德。","卑鄙、堕落的腐败行为","卑鄙小人。","Kẻ tiểu nhân hèn hạ.",[],"SBT câu 18C."],[21,"堕落","duòluò","đgt.","đọa lạc","trụy lạc, sa đọa",1,"","（思想、行为）往坏里变。","堕落的腐败行为","自甘堕落。","Tự cam sa đọa.",[],"SBT câu 19B."],[22,"腐败","fǔbài","tt.","hủ bại","đồi bại, thối nát",1,"","（思想）陈腐，（行为）堕落；（制度、组织等）混乱、黑暗。","腐败行为","反对腐败。","Chống tham nhũng.",[],"Bài tập 2⑤; 3①."],[23,"崇高","chónggāo","tt.","sùng cao","cao thượng, cao quý, cao siêu",1,"","最高的；最高尚的。","有崇高的境界","崇高的理想。","Lý tưởng cao cả.",[],"Bài tập 2③."],[24,"境界","jìngjiè","dt.","cảnh giới","mức độ, trình độ, ranh giới",1,"","事物所达到的程度或表现的情况。","崇高的境界","思想境界。","Cảnh giới tư tưởng.",[],"Bài tập 3①. SBT câu 19D."],[25,"攀登","pāndēng","đgt.","phan đăng","leo, trèo",1,"","抓住东西往上爬；比喻刻苦钻研，力求达到高峰。","立志终生攀登的道德高峰","攀登科学高峰。","Leo lên đỉnh cao khoa học.",[],"SBT câu 20B."],[26,"窍门","qiàomén","dt.","khiếu môn","bí quyết, mẹo",1,"","能解决困难问题的好方法。","读书没有窍门","学汉语有什么窍门？","Học tiếng Hán có mẹo gì?",[],""],[27,"发扬","fāyáng","đgt.","phát dương","phát huy, nêu cao, đề cao",1,"","发展和提倡（优良作风、传统等）。","发扬勤奋好学的精神","发扬优良传统。","Phát huy truyền thống tốt đẹp.",[],"SBT câu 22D."],[28,"敞开","chǎngkāi","đgt.","sưởng khai","mở rộng",1,"","大开；打开。","敞开大门","敞开心扉。","Mở lòng.",[],"Bài tập 3②."],[29,"招收","zhāoshōu","đgt.","chiêu thu","tuyển nhận, thu nhận",1,"","用考试或其他方式接收（学员、工作人员等）。","招收平民子弟入学","学校今年招收了两千名新生。","Năm nay trường tuyển 2000 tân sinh viên.",[],""],[30,"开明","kāimíng","tt.","khai minh","văn minh, tiến bộ, cởi mở",1,"","原指从野蛮进化到文明，后指人的思想开通，不顽固保守。","令人震撼的开明之举","他的父母很开明。","Bố mẹ anh ấy rất cởi mở.",[],"Bài tập 3②."],[31,"倡议","chàngyì","đgt.","xướng nghị","đề nghị, đề xuất",1,"","首先建议；发起。","倡议自行思考","他倡议大家节约用水。","Anh ấy kêu gọi mọi người tiết kiệm nước.",[],"SBT câu 22B."],[32,"杜绝","dùjué","đgt.","đỗ tuyệt","ngăn chặn triệt để, bài trừ hoàn toàn",1,"","制止；消灭（坏事）。","杜绝外来因素的干涉","杜绝浪费。","Chấm dứt lãng phí.",[],"Bài tập 2⑤."],[33,"干涉","gānshè","đgt.","can thiệp","can thiệp, quấy rối",1,"","过问或制止，多指不应该管硬管。","外来因素的干涉","不要干涉别国内政。","Không can thiệp nội bộ nước khác.",[],"Bài tập 3②. SBT câu 19A."],[34,"过问","guòwèn","đgt.","quá vấn","để ý, xen vào, quan tâm",1,"","参与其事；表示关心。","也不会过多过问","这件事你别过问。","Việc này anh đừng xen vào.",[],""],[35,"激发","jīfā","đgt.","kích phát","kích thích, khơi dậy",1,"","刺激使奋发。","激发学生的主动性和创造性","激发学习兴趣。","Khơi dậy hứng thú học tập.",[],"SBT câu 9C."],[36,"多元化","duōyuánhuà","tt.","đa nguyên hóa","đa dạng hóa, nhiều mặt",1,"","由单一向多方面发展。","重视观点的多元化","文化多元化。","Đa dạng hóa văn hóa.",[],""],[37,"开展","kāizhǎn","đgt.","khai triển","triển khai, mở rộng, tiến hành",1,"","使从小向大发展；使展开。","开展不同观点的论辩","开展活动。","Triển khai hoạt động.",[],"Bài 35 khởi động: nhóm <span class='zh'>展</span>."],[38,"对立","duìlì","đgt.","đối lập","đối lập, chống đối",1,"","两种事物或一种事物中的两个方面之间的相互排斥、相互矛盾。","观点对立","两派意见对立。","Ý kiến hai phái đối lập.",[],"Bài tập 3②. SBT nghe 11–13: <span class='zh'>二元对立</span>."],[39,"分歧","fēnqí","dt.","phân kỳ","sự bất đồng, sự chia rẽ",1,"","（思想、意见、记载等）不一致；有差别。","有分歧不要紧","双方存在分歧。","Hai bên có bất đồng.",[],"Bài tập 3②."],[40,"保守","bǎoshǒu","tt.","bảo thủ","bảo thủ, thủ cựu",1,"","维持原状，不求改进。","开放、保守也无关紧要","他的思想很保守。","Tư tưởng ông ấy rất bảo thủ.",[],"SBT câu 14D."],[41,"较量","jiàoliàng","đgt.","giảo lượng","đọ sức",1,"","用竞赛或斗争的方式比本领、实力的高低。","争辩与较量","两队进行了一场激烈的较量。","Hai đội có trận đọ sức gay gắt.",[],"SBT câu 18D."],[42,"论坛","lùntán","dt.","luận đàn","diễn đàn",1,"","对公众发表议论的地方，指报刊、座谈会等。","类似今天的“论坛”","经济论坛。","Diễn đàn kinh tế.",[],"SBT nghe câu 2."],[43,"激励","jīlì","đgt.","kích lệ","khích lệ, khuyến khích",1,"","激发鼓励。","相互激励","老师的话激励着我。","Lời thầy khích lệ tôi.",[],""],[44,"礼节","lǐjié","dt.","lễ tiết","cử chỉ lịch sự, phép xã giao, nghi thức",1,"","表示尊敬、祝颂、哀悼之类的各种惯用形式。","注重礼节","中国人很讲究礼节。","Người TQ rất coi trọng lễ tiết.",[],""],[45,"衷心","zhōngxīn","tt.","trung tâm","chân thành, trung thành",1,"","发自内心的。","学生衷心爱戴名师","衷心感谢您的帮助。","Chân thành cảm ơn sự giúp đỡ của ngài.",[],"Bài tập 2⑥. SBT nghe 6–10."],[46,"爱戴","àidài","đgt.","ái đái","kính yêu, yêu quý",1,"","敬爱并且拥护。","衷心爱戴名师","他深受人民的爱戴。","Ông ấy được nhân dân kính yêu.",[],""],[47,"示范","shìfàn","đgt.","thị phạm","làm mẫu, làm gương",1,"","做出某种可供大家学习的典范。","给学生做出了最好的示范","老师给我们示范了一遍。","Thầy làm mẫu cho chúng tôi một lần.",[],"SBT câu 31."],[48,"崇敬","chóngjìng","đgt.","sùng kính","sùng kính, tôn thờ, tôn kính",1,"","推崇尊敬。","学生崇敬的偶像","我们怀着崇敬的心情。","Chúng tôi mang tâm trạng sùng kính.",[],"SBT câu 20B."],[49,"偶像","ǒuxiàng","dt.","ngẫu tượng","thần tượng",1,"","比喻盲目崇拜的对象。","学生崇敬的偶像","他是年轻人的偶像。","Anh ấy là thần tượng của giới trẻ.",[],"SBT nghe câu 4."],[50,"封建","fēngjiàn","dt.","phong kiến","phong kiến, chế độ phong kiến",1,"","封建主义社会形态；（tt.）带有封建社会色彩的。","中国封建社会","封建思想。","Tư tưởng phong kiến.",[],"SBT câu 24."]],extra:[["书院","shūyuàn","thư viện (trường học cổ)"],["东佳书院 · 丽泽书院","Dōngjiā · Lìzé shūyuàn","Đông Giai · Lệ Trạch thư viện"],["学田","xuétián","ruộng học"],["学规","xuéguī","quy chế học"],["萌芽","méngyá","nảy mầm"],["德业并重","déyè bìngzhòng","đức nghiệp song trọng"],["孝顺 · 敬爱","xiàoshùn · jìng'ài","hiếu thảo · kính yêu"],["书读百遍，其义自见","shū dú bǎi biàn, qí yì zì xiàn","đọc trăm lần, ý tự hiện"],["温故知新","wēngù-zhīxīn","ôn cũ biết mới"],["切磋 · 质疑","qiēcuō · zhìyí","trao đổi · chất vấn"],["取长补短","qǔcháng-bǔduǎn","lấy dài bù ngắn"]],T:[{zh:"中国藏书的历史很长，有2000多年了，有官方藏书，也有私人藏书。唐代有人把藏书的地方称作书院，之后各种书院层出不穷，甚至有人把自己的书屋也命名为书院。",vn:"Lịch sử tàng thư của Trung Quốc rất dài, đã hơn 2000 năm, có tàng thư của nhà nước, cũng có tàng thư tư nhân. Thời Đường có người gọi nơi cất sách là “thư viện”, sau đó đủ loại thư viện liên tiếp xuất hiện, thậm chí có người đặt tên cho phòng sách nhà mình là thư viện.",idea:"Tàng thư và tên gọi “书院”.",q:["书院一词是怎么来的？"],note:[["层出不穷","Liên tục xuất hiện."]]},{zh:"时光流转，书院渐渐发展成了藏书、教学和研究相结合的教育机构。比如，东佳书院就是中国书院史上最早拥有学田、订有规章制度、收有学生的私办书院。它前后存在了千余年，名字更换了三四次，截止到清朝末年，书院制度终止，东佳书院改成了学校。可以这样说，萌芽于唐，完备于宋，废止于清的东佳书院是中国书院制度的一个缩影。",vn:"Thời gian xoay vần, thư viện dần phát triển thành cơ sở giáo dục kết hợp tàng thư, dạy học và nghiên cứu. Ví dụ, Đông Giai thư viện là thư viện tư thục sớm nhất trong lịch sử thư viện Trung Quốc có ruộng học, có quy chế, có nhận học trò. Nó tồn tại hơn nghìn năm, đổi tên ba bốn lần; đến cuối đời Thanh, chế độ thư viện chấm dứt, Đông Giai thư viện đổi thành trường học. Có thể nói, Đông Giai thư viện — nảy mầm thời Đường, hoàn bị thời Tống, bãi bỏ thời Thanh — là hình ảnh thu nhỏ của chế độ thư viện Trung Quốc.",idea:"Đông Giai thư viện.",q:["为什么说书院渐渐发展成了藏书、教学和研究的教育机构？"],note:[["比如……","Xem 篇章: luận điểm + dẫn chứng."],["截止到……，……终止","Xem 辨析 截止—终止."],["萌芽于唐，完备于宋，废止于清","<span class='zh'>V + 于</span> = … vào thời…"]]},{zh:"历史上的书院立足于人才培养。它把灵魂塑造看得和学问同等重要；提倡刻苦、严谨的治学精神；努力实践自由活泼的办学宗旨。书院的历史是中国古代教育史上的一份珍贵遗产。",vn:"Thư viện trong lịch sử lấy đào tạo nhân tài làm gốc. Nó coi việc đắp nặn tâm hồn quan trọng ngang học vấn; đề cao tinh thần học tập khổ luyện, nghiêm cẩn; ra sức thực hành tôn chỉ dạy học tự do, sinh động. Lịch sử thư viện là một di sản quý trong lịch sử giáo dục cổ đại Trung Quốc.",idea:"Ba đặc điểm (luận điểm chung).",q:["书院怎样立足于人才培养？"],note:[["……；……；……","Ba ý — dàn ý cho các đoạn sau."]]},{zh:"德业并重是书院自始至终的追求目标。翻开各时代书院颁布的《学规》就能发现，书院重视学问，更重视品德修养。比如，丽泽书院《学规》第一条大意是：凡是本书院的学子，都要孝顺长辈，敬爱兄长，为人忠诚，守信用。不顺从长辈，和兄弟不友善，与人不和睦，对朋友不忠诚，言行不一，擅以虚伪的言辞掩饰过失的无耻之徒，一经发现，本书院定不容纳。短短一段文字透露出这样的信息：书院在人文环境的治理上是有标准的，那就是树立正气，唾弃卑鄙、堕落的腐败行为。因此，有学问、有道德、有崇高的境界，就成为了古代知识分子立志终生攀登的道德高峰。",vn:"Đức nghiệp song trọng là mục tiêu thư viện theo đuổi từ đầu đến cuối. Mở các 《Học quy》 thư viện ban hành qua các thời sẽ thấy: thư viện coi trọng học vấn, càng coi trọng tu dưỡng đạo đức. Ví dụ, điều thứ nhất trong 《Học quy》 của Lệ Trạch thư viện đại ý: phàm là học trò của thư viện, đều phải hiếu thuận bề trên, kính yêu anh, sống trung thực, giữ chữ tín. Kẻ vô liêm sỉ không nghe lời bề trên, bất hòa với anh em, không hòa thuận với người, không trung thành với bạn, nói một đằng làm một nẻo, giỏi dùng lời giả dối che giấu lỗi lầm — một khi phát hiện, thư viện quyết không dung nạp. Đoạn văn ngắn tiết lộ thông tin: thư viện có tiêu chuẩn trong quản lý môi trường nhân văn, đó là dựng chính khí, phỉ nhổ hành vi hèn hạ, sa đọa, đồi bại. Vì thế, có học vấn, có đạo đức, có cảnh giới cao cả đã trở thành đỉnh cao đạo đức mà trí thức cổ đại lập chí trọn đời leo tới.",idea:"Đức nghiệp song trọng.",q:["书院怎样重视品德修养？"],note:[["一经发现，本书院定不容纳","Xem Ngữ pháp 1: <span class='zh'>一经</span>."],["比如，……","Dẫn chứng cho luận điểm “德业并重”."],["有……、有……、有……","排比."]]},{zh:"提倡刻苦、严谨的治学精神是古代书院的共同特点。古代书院学术思想各有不同，但治学态度却极为相似，认为读书没有窍门，没有捷径，唯有发扬勤奋好学的精神，扎扎实实，一步一个脚印，才能做好学问。在学习方法上，提倡读书成诵，因为“书读百遍，其义自见”；提倡温故知新；提倡博学求精；提倡读书须有疑。",vn:"Đề cao tinh thần học tập khổ luyện, nghiêm cẩn là đặc điểm chung của thư viện cổ đại. Tư tưởng học thuật các thư viện khác nhau, nhưng thái độ học tập rất giống: cho rằng đọc sách không có mẹo, không có đường tắt, chỉ có phát huy tinh thần chăm chỉ hiếu học, chắc chắn từng bước một mới làm tốt được học vấn. Về phương pháp, đề cao đọc thuộc lòng, vì “đọc trăm lần, ý tự hiện”; đề cao ôn cũ biết mới; đề cao học rộng cầu tinh; đề cao đọc sách phải có nghi vấn.",idea:"Tinh thần học tập.",q:["古代书院提倡什么样的学习方法？"],note:[["唯有……，才能……","Chỉ có… mới…"],["提倡……；提倡……；提倡……","Lặp từ khóa “提倡”."]]},{zh:"书院在办学方法上，努力实践自由活泼的办学思想。首先，书院本着贫富平等的原则，敞开大门，招收平民子弟入学，这在当时确实是令人震撼的开明之举。其二，书院重视自修和研究，在读书的过程中倡议自行思考，杜绝外来因素的干涉，也不会过多过问，以便开发学生的自主学习能力，激发学生的主动性和创造性。其三，鉴于一个人的知识是有限的，大家的知识是无限的，个人解决不了的问题，在众人的智慧面前就不是问题，书院倡导互相切磋、互相学习。其四，鼓励师生之间相互质疑，形成探讨争辩、求真求实的学习风气。另外，重视观点的多元化，开展不同观点的论辩、交流，也是书院提倡的。观点对立、有分歧不要紧，开放、保守也无关紧要，书院主张不同学派、不同主张之间的争辩与较量，为此书院设立了讲演辩论制度，类似今天的“论坛”。这种学术活动很受欢迎，学子们学习热情高涨，相互激励，取长补短，共同进步。",vn:"Về phương pháp tổ chức dạy học, thư viện ra sức thực hành tư tưởng tự do, sinh động. Thứ nhất, thư viện theo nguyên tắc giàu nghèo bình đẳng, mở rộng cửa, nhận con em bình dân vào học — thời đó quả là việc làm cởi mở gây chấn động. Thứ hai, thư viện coi trọng tự học và nghiên cứu, trong quá trình đọc sách khuyến khích tự suy nghĩ, ngăn chặn can thiệp từ bên ngoài, cũng không hỏi han quá nhiều, để phát triển năng lực tự học, khơi dậy tính chủ động và sáng tạo. Thứ ba, xét thấy kiến thức một người có hạn, kiến thức mọi người là vô hạn, vấn đề một người không giải được thì trước trí tuệ số đông chẳng còn là vấn đề, thư viện đề xướng trao đổi lẫn nhau, học hỏi lẫn nhau. Thứ tư, khuyến khích thầy trò chất vấn nhau, tạo phong khí học tập tìm tòi tranh luận, cầu chân cầu thực. Ngoài ra, coi trọng tính đa nguyên của quan điểm, triển khai tranh luận, giao lưu các quan điểm khác nhau cũng là điều thư viện đề xướng. Quan điểm đối lập, có bất đồng không sao, cởi mở hay bảo thủ cũng chẳng hề gì; thư viện chủ trương tranh biện, đọ sức giữa các học phái, chủ trương khác nhau, vì thế lập chế độ diễn thuyết biện luận, giống “diễn đàn” ngày nay. Hoạt động học thuật này rất được hoan nghênh, học trò hăng say học tập, khích lệ nhau, lấy dài bù ngắn, cùng tiến bộ.",idea:"Phương pháp dạy học.",q:["书院的办学方法是什么？"],note:[["本着……的原则","Xem Ngữ pháp 2: <span class='zh'>本着</span>."],["首先……其二……其三……其四……另外……","Liệt kê luận cứ."],["鉴于……","Xét thấy…"],["以便……","Để tiện…"]]},{zh:"书院讲究长幼，注重礼节，但不拘泥；主张刻苦自励，自主学习，却又鼓励相互质疑、辩论。书院内师生关系融洽，感情深厚，学生衷心爱戴名师，因为他们学识广博，品德过人，给学生做出了最好的示范，是学生崇敬的偶像。",vn:"Thư viện coi trọng trên dưới, chú trọng lễ tiết nhưng không câu nệ; chủ trương khổ luyện tự khích lệ, tự học, nhưng lại khuyến khích chất vấn, tranh luận. Quan hệ thầy trò trong thư viện hòa thuận, tình cảm sâu đậm; học trò thật lòng kính yêu các danh sư, vì họ học rộng, đức độ hơn người, làm tấm gương tốt nhất cho học trò, là thần tượng học trò tôn kính.",idea:"Quan hệ thầy trò.",q:["书院的师生关系怎么样？"],note:[["……，但……；……，却又……","Đối lập hai vế."]]},{zh:"书院对中国封建社会教育、学术的发展，产生过重要影响。",vn:"Thư viện từng có ảnh hưởng quan trọng đến sự phát triển giáo dục, học thuật của xã hội phong kiến Trung Quốc.",idea:"Kết luận.",q:[],note:[]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章 & từ vựng",G:[{id:"g1",grp:1,word:"",zh:"一经",py:"yìjīng",tag:"Chú thích 1 · phó từ",mean:"Phó từ, dùng ở <b>vế trước</b>, biểu thị chỉ cần thực hiện một hành vi, bước nào đó thì sẽ <b>tương ứng sinh ra kết quả</b> — “một khi… là…”. Vế sau thường có <span class='zh'>就 · 便 · 必须</span>.",forms:["一经 + V，（S）+ 就 / 便 / 必须……"],ex:[["……擅以虚伪的言辞掩饰过失的无耻之徒，一经发现，本书院定不容纳。","",1],["语言一经产生，又对人类的心理发展起了巨大的推动作用，使人类的心理产生质的飞跃。","Ngôn ngữ một khi ra đời đã thúc đẩy mạnh mẽ sự phát triển tâm lý con người."],["……由领导集团全体成员讨论，做出决策和决定，一经决定，必须共同遵守。","…một khi đã quyết định thì phải cùng tuân thủ."]],tips:["Bài 35: <span class='zh'>雕版完成后一经开印……</span>","Bài tập 2②."],practice:{q:"选择合适的短语填空：一经腐败菌和病菌光顾　一经推出　一经发布",type:"complete",items:[["那一年的8月18日，他的第一张个人专辑______就突破了20万张的销售成绩。","一经推出"],["据报道，这是国内民间最大的一起知识产权交易，消息______，当即引起轰动。","一经发布"],["许多味美可口的菜肴和食物，______，不消几天甚至几小时，就会变酸变质……","一经腐败菌和病菌光顾"]]}},{id:"g2",grp:1,word:"",zh:"本着 + 名词",py:"běnzhe",tag:"Chú thích 2 · giới từ",mean:"Giới từ, biểu thị <b>tuân theo một chuẩn tắc nào đó</b> — “dựa theo, căn cứ vào”. Trung tâm của cụm danh từ thường là <span class='zh'>原则 · 精神 · 宗旨 · 态度 · 方针 · 观点</span>.",forms:["本着 + ……的原则 / 精神 / 宗旨 / 态度 + V"],ex:[["书院本着贫富平等的原则，敞开大门，招收平民子弟入学，这在当时确实是令人震撼的开明之举。","",1],["两国谈判代表本着互谅互让、平等协商的精神，解决了拖延多年的问题。","Đại diện hai nước theo tinh thần thông cảm nhân nhượng, bình đẳng thương lượng đã giải quyết vấn đề kéo dài nhiều năm."],["该公司本着“一切为用户着想，一切为用户服务”的宗旨，积极主动地征求用户意见……","Công ty theo tôn chỉ “tất cả vì khách hàng”…"]],tips:["Bài tập 2④: <span class='zh'>按照 → 本着</span>."],practice:{q:"请把下列6个小句组合成3个连贯的语段：A. 成人教育本着学用结合的原则　B. 把岗位培训和继续教育作为重点，重视搞好从业人员的知识更新　C. 作为一名医生，他一直是本着对患者高度负责的精神　D. 地震过后，全国人民本着“一方有难，八方支持”的精神　E. 对危重病人从不推脱，而是勇于承担风险，积极治病救人　F. 为灾区捐钱、捐物、捐食品",type:"complete",items:[["语段（1）：? + ?","A + B"],["语段（2）：? + ?","C + E"],["语段（3）：? + ?","D + F"]]}},{id:"g3",grp:0,word:"层出不穷",zh:"Thành ngữ & cụm từ",py:"",tag:"Từ vựng",mean:"<span class='zh'>层出不穷</span> = liên tục xuất hiện. <span class='zh'>德业并重</span> = coi trọng cả đức lẫn nghiệp. <span class='zh'>温故知新</span> = ôn cũ biết mới. <span class='zh'>取长补短</span> = lấy dài bù ngắn. <span class='zh'>无关紧要</span> = chẳng hề gì. <span class='zh'>自始至终</span> = từ đầu đến cuối.",forms:["……层出不穷","……无关紧要","相互激励，取长补短，共同进步"],ex:[["之后各种书院层出不穷。","",1],["德业并重是书院自始至终的追求目标。","",1],["学子们学习热情高涨，相互激励，取长补短，共同进步。","",1]],tips:["SBT câu 23D."]},{id:"g4",grp:0,word:"截止",zh:"截止 / 终止",py:"jiézhǐ / zhōngzhǐ",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “<b>dừng lại</b>”. <span class='zh'>截止</span>: dừng khi <b>đến một thời hạn</b>, chỉ đi với từ chỉ thời gian. <span class='zh'>终止</span>: nhấn <b>kết thúc</b>, đi được với nhiều từ khác (比赛 · 活动 · 战争 · 合同…).",forms:["截止（到）+ thời gian；截止日期","终止 + 比赛 / 活动 / 战争 / 关系"],ex:[["截止到清朝末年，书院制度终止。","",1]],tips:["<span class='zh'>×截止比赛</span>."]}],BX:{grp:0,word:"截止",cols:["√","×"],pair:"截止 — 终止",same:["Đều có nghĩa “<b>dừng lại</b>”.","这项活动上个月已经截止 / 终止了。"],diff:[["Nhấn mạnh dừng khi <b>đến một thời hạn</b>, chỉ kết hợp với từ chỉ <b>thời gian</b>.","报名的截止日期是10月15号。（√）　截止比赛 / 活动 / 战争（×）","Nhấn mạnh <b>kết thúc</b>, có thể kết hợp với các từ khác.<div class='zh' style='margin-top:4px'>终止比赛 / 活动 / 战争（√）</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["截止到1998年，公司在15年里已经带来了2056%的回报率。",0,"Đi với mốc thời gian → 截止 đúng."],["要采取必要的措施，以截止那些错误的、过时的、无效的政策。",1,"Chấm dứt chính sách → phải là <span class='zh'>终止</span>."],["当设定好起始日时，系统会自动推算出终止日期。",0,"终止日期 — đúng."],["婚姻关系终止时，夫妻按照约定分割共有财产。",0,"终止 + quan hệ — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["官<u>方</u>","敌方 · 多方 · 我方 · 双方"],items:[["<u>规</u>章","规","规则 · 规定 · 规范 · 法规"],["终<u>止</u>","止","停止 · 截止 · 止血 · 禁止"],["无<u>耻</u>","耻","耻辱 · 羞耻 · 耻笑 · 奇耻大辱"],["树<u>立</u>","立","立正 · 立足 · 建立 · 独立"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["那颗小行星的名字用的是发现者的名字。","命名","那颗小行星的名字是以发现者的名字命名的。"],["违反纪律的行为一旦被发现，学校会毫不留情地处理。","一经","违反纪律的行为一经发现，学校会毫不留情地处理。"],["这就是一种高尚的人道主义精神。","崇高","这就是一种崇高的人道主义精神。"],["我们按照互惠互利的原则进行协商。","本着","我们本着互惠互利的原则进行协商。"],["我们坚持不允许这种腐败行为的发生。","杜绝","我们坚持杜绝这种腐败行为的发生。"],["真心祝愿你事事顺利、马到成功。","衷心","衷心祝愿你事事顺利、马到成功。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["治理","境界","腐败","唾弃","正气"],text:"目前，政府部门中存在个别{腐败}分子，他们的一些行为令人{唾弃}。对这样的行为应该严加{治理}，要树立{正气}，提高政府工作人员的思想{境界}。"},{bank:["敞开","对立","开明","分歧","干涉"],text:"如果父母过多{干涉}孩子的自由，就会使孩子与父母的情绪{对立}日益严重。当家长与孩子的意见出现{分歧}时，家长应该采取{开明}的态度，鼓励孩子{敞开}心扉，勇敢对父母说出自己的想法。"}]},EX4:{q:"请分析下列语段中的论点和例证分别是什么",items:[{src:"图书室在很多小学已经名存实亡了。首先，在不少学校，上级下拨的经费中并没有专门的图书经费，而学校自己又实在拿不出钱来购置新书，从而造成藏书少，更新缓慢，许多图书内容陈旧过时，不适合今天的学生阅读这样一种情况。其次，某些学校的经济条件较好，图书室也不错，但这样的学校一般都组织大量的课外活动，同学们把大部分课外时间都用在了参加音乐、舞蹈、美术、电脑培训等活动上，挤不出时间去图书室。另外，大多数小学图书室的工作都是教师兼任，因而开放时间短，图书利用率低。",task:"论点是什么？例证有哪些？",model:"论点：图书室在很多小学已经名存实亡了。<br>例证：① 没有专门的图书经费，藏书少、更新慢、内容陈旧；② 条件好的学校课外活动多，学生没时间去图书室；③ 图书室由教师兼任，开放时间短，利用率低。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["为什么说书院渐渐发展成了藏书、教学和研究的教育机构？","① 藏书历史 ② 东佳书院：学田、规章制度、学生，唐、宋、清","中国藏书有2000多年历史，唐代有人把藏书的地方称作书院。后来书院发展成了藏书、教学和研究相结合的教育机构。东佳书院最早拥有学田、订有规章制度、收有学生，萌芽于唐，完备于宋，废止于清，是中国书院制度的一个缩影。"],["书院怎样立足于人才培养？","① 提倡刻苦、严谨的治学精神 ② 德业并重：重视学问，重视品德修养","书院德业并重，重视学问，更重视品德修养，不道德的学生一经发现，书院定不容纳。书院提倡刻苦、严谨的治学精神，认为读书没有窍门，提倡温故知新、博学求精、读书须有疑。"],["书院的办学方法是什么？","① 首先，招收平民子弟入学 ② 其二，重视自修和研究 ③ 其三，倡导互相切磋 ④ 其四，鼓励相互质疑 ⑤ 另外，重视观点的多元化","首先，书院本着贫富平等的原则招收平民子弟；其二，重视自修和研究；其三，倡导互相切磋；其四，鼓励师生相互质疑；另外，重视观点的多元化，设立了类似“论坛”的讲演辩论制度。"]]},PZ:{title:"篇章（7）论点 + 例证",vn:"Luận điểm + dẫn chứng",intro:"“论点 + 例证” là cách thành văn thường dùng trong văn <b>nghị luận</b>: <b>trước nêu luận điểm</b>, sau dùng <b>ví dụ cụ thể</b> để chứng minh luận điểm.",ex:[["我们的地球正在不断变暖，这是毋庸置疑的。政府间气候变化专门委员会（IPCC）第四次评估报告指出，最近100年全球平均地表温度上升了0.74℃……","Luận điểm: trái đất ấm lên. Dẫn chứng: số liệu IPCC."],["面对气候变暖，我们可以从身边的一点一滴做起。比如，尽量多乘坐公共交通工具；调小中央暖气……","Luận điểm: làm từ việc nhỏ. Dẫn chứng: “比如……”."],["时光流转，书院渐渐发展成了藏书、教学和研究相结合的教育机构。比如，东佳书院就是……","Đoạn 2 bài khóa."]],q:"找一找课文中哪些地方也采用了“论点 + 例证”的论证方法",pvn:"Gợi ý: đoạn 4 (德业并重 → 丽泽书院《学规》), đoạn 5 (治学精神 → 读书成诵、温故知新……), đoạn 6 (自由活泼的办学思想 → 首先……其二……).",practice:[["Đoạn 4","Luận điểm: 德业并重是书院自始至终的追求目标。Dẫn chứng: 比如，丽泽书院《学规》第一条……"],["Đoạn 6","Luận điểm: 书院在办学方法上，努力实践自由活泼的办学思想。Dẫn chứng: 首先……其二……其三……其四……另外……"]]},DP:[{title:"词汇（1）：熟悉下列词语搭配",vn:"Kết hợp từ thường gặp.",items:[["过渡","guòdù","quá độ, chuyển tiếp","过渡时期 / 过渡地带","进入少年期，人的心理发展处于半幼稚、半成熟的过渡状态。"],["周折","zhōuzhé","trắc trở, phiền phức","大费周折","为了进行这次采访，记者颇费了一番周折。"],["酗酒","xùjiǔ","nghiện rượu","酗酒滋事","年轻人可以少量饮用低度酒，但不要酗酒。"],["利害","lìhài","lợi hại","不计利害 / 利害得失","他们之间一直就有利害冲突。"],["呻吟","shēnyín","rên rỉ","无病呻吟","他躺在床上，满头都是汗，呻吟不止。"],["人质","rénzhì","con tin","扣押人质 / 解救人质","大家正在想办法，要赎回人质。"],["声势","shēngshì","thanh thế","声势浩大","他们的婚礼搞得颇有声势。"],["野心","yěxīn","dã tâm","有野心 / 野心家","他从小就野心勃勃，想干一番大事业。"]]},{title:"词汇（2）：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ.",items:[["悬念","xuánniàn","sự hồi hộp chờ đợi","悬：没有着落，没有结果 · 念：念头","这部电影充满悬念。"],["福利","fúlì","phúc lợi","福：幸福，福气 · 利：利益","这家公司福利很好。"],["剪彩","jiǎncǎi","cắt băng khánh thành","剪：用剪刀剪 · 彩：彩色丝绸","市长为新大楼剪彩。"],["声明","shēngmíng","tuyên bố","声：宣称，表示 · 明：清楚，明白","公司发表了一份声明。"],["条理","tiáolǐ","mạch lạc","条：思想、言语、文字的层次 · 理：物质、组织的条纹","他说话很有条理。"],["污蔑","wūmiè","vu khống","污：无中生有地硬说别人做了坏事 · 蔑：捏造实事，使别人受伤害","你不能这样污蔑别人。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"宋末政治家、文学家、爱国诗人文天祥被关在牢房里，恶劣的环境只能折磨他的身体，却不能摧毁他的意志。就是在这间牢房中，文天祥写下了千古传诵的《正气歌》。",o:["文天祥身体不好","文天祥崇拜英雄","《正气歌》流传久远","文天祥生活的地方气候恶劣"],a:2,why:"“千古传诵的《正气歌》”. Có <span class='zh'>正气</span>."},{n:2,say:"博客从某个方面来说，已经不是一个私人圈子，而更像是一个言论堂，一个发表观点的地方。一般来说，博客谈论的是社会热门话题。其实，是先有论坛，后来因为用户想有自己的小天地，所以才产生了博客。",o:["博客和论坛没有区别","博客只给小圈子的人看","博客是用户自己的小天地","博客之后，论坛也随之兴起"],a:2,why:"“用户想有自己的小天地，所以才产生了博客”. Có <span class='zh'>论坛</span>."},{n:3,say:"汽车司机在封闭的高速公路上驾驶汽车时，基于合理信赖相信行人不会横穿公路，如果行人违反交通规则横穿公路而被正常行驶的汽车撞死，该汽车司机不承担过失犯罪的刑事责任。",o:["行人横穿公路被撞，司机没有责任","司机在封闭的高速公路上驾车是受保护的","司机撞人至死都要承担过失犯罪的刑事责任","司机相信行人不会横穿封闭高速公路的想法合理"],a:3,why:"“基于合理信赖” — niềm tin hợp lý. A sai: chỉ không chịu trách nhiệm hình sự. Có <span class='zh'>过失</span>."},{n:4,say:"谈起李敖，无论是他的敌人还是朋友都不得不承认他是一位奇人，他几十年来口诛笔伐、特立独行，坐过六年牢，打过几十场官司，一共有九十六本书被禁，创下了历史记录，但同时他又是千万人心中的偶像。",o:["李敖是一位律师","李敖的心中也有偶像","李敖是一位公认的奇人","李敖一生都在努力创纪录"],a:2,why:"“无论是他的敌人还是朋友都不得不承认他是一位奇人”. Có <span class='zh'>偶像</span>."},{n:5,say:"在超市打工期间，她边打工，边读书，穿梭于校园和工作单位之间。她逐渐学会了如何最大限度地利用一天24小时的有限时间，如何面对工作考核和学校考试的双重压力，如何从容完成一个接一个的作业和论文。",o:["她平常不在学校就在超市","她打工也并没有耽误学业","她在超市也会抽时间看书","她感到一天24小时不够用"],a:1,why:"“从容完成一个接一个的作业和论文”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您的网上书店开业以来，销量和好评率一直很稳定，您还开有实体书店。我们想知道，您是怎么与书结缘的？\n男：与书结缘，是从少年时代开始的。那时家境贫寒，新书买不起，就打旧书的主意。80年代初，小镇上有租连环画的摊子，一分钱，两分钱，就可以租看一本，我整天坐在小板凳上，慢慢品味，这种美妙的享受让我对书十分有感情。上学以后，我周末去的最多的地方就是书店。\n女：那您最开始开书店和这份书缘有关？\n男：是啊，那也算是我人生一个小小的转折点。那时我在南方打工，一个老乡知道我喜欢看书，告诉我去废品收购站可以买到非常便宜的旧书。我由此得到启发，决心开二手书摊。\n女：您后来开了实体书店，卖的也是二手书吗？\n男：对，我的书店不卖新书，只卖各种门类的二手书，这样一来，在售价上就比较有优势。当然，也不仅仅是价格优势，许多早年出版的书，在图书城是很难买到的，而在旧书店却有可能淘到。\n女：您对深圳的状况很熟悉，能不能给我们说说那里古旧书的情况？\n男：大家都知道，深圳是一座年轻的城市，是中国改革开放建立的第一个经济特区。深圳的古旧书市场并不是很理想，这大概与这座城市的年龄有关。但深圳二手书货源却相当充足，这也给我开设实体书店提供了帮助。如果我们把古旧书仅仅定义为多少年多少年以前的老书，那深圳的“货源”的确是个大问题，但如果把二手书都当作旧书来经营，深圳的货源充足到一听到有人打电话让我去收书，我就头痛，因为收回来没地方放，店租实在涨得太快，这也是我经营中最大的难题。\n女：感谢您给我们讲了这么多有趣的事情，衷心祝愿您的书店越办越好！",qs:[{n:6,q:"男的是怎样与书结缘的？",o:["从小对书就有感情","家里开了连环画摊","小时候买书很便宜","上学时在书店打工"],a:0,why:"“这种美妙的享受让我对书十分有感情”."},{n:7,q:"男的在南方打工时发生了什么事情？",o:["遇到了开书摊的老乡","在老乡的启发下开了书摊","老乡给他介绍了书店的工作","收废品时发现旧书可以敞开收"],a:1,why:"“我由此得到启发，决心开二手书摊”."},{n:8,q:"男的开的实体书店有什么特色？",o:["书的进价很贵","书店制度完备","销售人员态度好","全部经营二手书"],a:3,why:"“我的书店不卖新书，只卖……二手书”. Có <span class='zh'>完备</span> làm bẫy."},{n:9,q:"深圳是个什么样的城市？",o:["深圳是个厚重的城市","深圳的历史不够久远","深圳能激发读书的激情","深圳的二手书货源不多"],a:1,why:"“深圳是一座年轻的城市”. Có <span class='zh'>激发</span> làm bẫy."},{n:10,q:"关于男的，下列哪项正确？",o:["男的很受读者的爱戴","男的打工时收过废品","男的卖的书价格便宜","男的专卖古旧连环画"],a:2,why:"“在售价上就比较有优势”. Có <span class='zh'>爱戴 · 衷心</span>."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"未来学校在时空上肯定会发生变化，无时不可学，无处不可学；未来学校的办学理念会进一步更新，学校对儿童会有全新的认识，儿童和成年是否依然二元对立就很值得怀疑，儿童是积极的社会行动者，童年是一种文化的、社会的、历史的建构，更是自然、文化、技术等异质因素的复杂产物；未来学校的技术变革将是几何级数的，“互联网+课堂”“互联网+教学”“互联网+德育”等，已经不可回避。未来学校的结构也将发生很大的变化，这也是毫无异议的，所以，学校必须选择结构变革。",qs:[{n:11,q:"未来学校在时空上会发生怎样的变革？",o:["学校不再有围墙","学校可容纳更多学生","学校可以随时招收学生","学生想学习随时就能学习"],a:3,why:"“无时不可学，无处不可学”. Có <span class='zh'>容纳 · 招收</span> làm bẫy."},{n:12,q:"未来学校在办学方面将会发生怎样的变化？",o:["教学方法将更加规范化","教学目的是重建学生的童年","儿童和成年人可以一起学习","现在对儿童的认识或许会被颠覆"],a:3,why:"“学校对儿童会有全新的认识”."},{n:13,q:"关于未来学校的技术革命，下列哪项正确？",o:["计算机课会更受重视","彻底抛弃实体课堂教学","完全利用互联网治理学校","技术方面的变化会是最大的"],a:3,why:"“技术变革将是几何级数的”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"如今，一年365天中随便哪个日子，你在吃、穿、住、用，不管哪个方面，都能随心所欲地挑选自己喜欢的颜色。在古人看来，这是不可想象的。\n周朝典籍中有“衣正色，裳闲色”的记载，古时“衣”指上衣，“裳”指下裙；所谓“正色”，指青、赤、黄、白、黑五色，“闲色”与“正色”相对，指绿、红、碧、紫、褐黄五色。由此可知，周朝，人们对上衣、下衣颜色的选定是有要求的。\n之后，秦始皇成了黑色服饰、建筑等的代言人，汉武帝是选定了黄色的第一人。秦始皇、汉武帝虽然喜欢黑色、黄色，却并没有独霸，到了唐朝，情况有了改变。《新唐书》记载：唐朝开国皇帝李渊多穿用黄色的袍衫，并逐渐禁止臣民穿用。到了公元668年，唐高宗颁布圣旨：官民一律不许穿黄衣服、住黄房子。截止到清朝灭亡的1000多年里，黄色一直是帝王家专用之色。",qs:[{n:14,q:"关于今人选用颜色，下列哪项正确？",o:["没有任何限制","不需要任何标准","人的想象力较差","不像古人那么保守"],a:0,why:"“随心所欲地挑选自己喜欢的颜色”."},{n:15,q:"关于周朝，下列哪项正确？",o:["休闲装有休闲装的颜色","“衣”与“裳”是同义的","“衣”“裳”颜色有讲究","人们不太遵守当时的礼节"],a:2,why:"“对上衣、下衣颜色的选定是有要求的”."},{n:16,q:"关于秦始皇，下列哪项正确？",o:["给黑色做广告","喜欢黑色建筑","是第一个选定黄色的皇帝","禁止百姓使用黑色、黄色"],a:1,why:"“秦始皇成了黑色服饰、建筑等的代言人”."},{n:17,q:"关于唐朝，可以知道什么？",o:["唐朝第一位皇帝是李渊","唐朝百姓的房子黄色居多","唐朝允许官员穿黄色衣服","唐朝一开始就只有皇帝能用黄色"],a:0,why:"“唐朝开国皇帝李渊”. Có <span class='zh'>颁布 · 截止</span>!"}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他的行为遭到众人的唾弃。","无论我题没做完，但是我做完的全对，我还是全班第一名。","卑鄙小人总是忘恩负义的，忘恩负义原本就是卑鄙的一部分。","原以为这仅仅是一段异国就职经历，不料却陷入了一场海外生存的较量之中。"],a:1,why:"<b>Liên từ không khớp</b>: <span class='zh'>无论……但是……</span> sai → <span class='zh'>虽然我题没做完，但是……</span>."},{n:19,o:["如今，家长不能再以门当户对为由粗暴地干涉儿女的婚姻自由。","受过高等教育的他，常混迹于不三不四的人之中，真是自甘堕落！","这些彩绘玉器既有商周图案，汉唐纹饰，体现了华夏民族的艺术风格。","那位同学演奏小提琴所达到的完美境界，是很多艺术家都不能达到的。"],a:2,why:"<b>Thiếu vế</b>: <span class='zh'>既有……</span> phải có <span class='zh'>又有 / 也有……</span> → <span class='zh'>既有商周图案，又有汉唐纹饰</span>."},{n:20,o:["谁能知道，隐藏在战火纷飞的前线和厚颜无耻的面具后面的敌人，究竟脆弱到什么程度？","每次开始攀登珠峰之前，都要举行一项仪式，在仪式中夏尔巴人会表达他们对山神的崇敬之情。","时间如风，轻柔地驶过不留一丝痕迹；时间如光，明媚地照下，却无处追寻；时间如水，永无终止地流淌，不分昼夜。","NHS去年发表在官网上的忠告称，“越来越多的证据”把久坐与肥胖、2型糖尿病、某些种类的癌症以及早逝关联起来。"],a:3,why:"Đáp án sách: D — <b>phối hợp không hợp</b>: “证据把……关联起来” chủ ngữ không phù hợp; nên là <span class='zh'>“越来越多的证据”显示，……均与久坐有关</span> (bài 31)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"她___出现，便叫人难以忘怀。她似乎比一般女人更懂得理性思维，而且更聪明___，遇事不张扬，___刚柔相济，有着知性的魅力。",o:["刚刚　可爱　且","突然　崇高　还","按时　完美　并","当众　美丽　故"],a:0,why:"<span class='zh'>刚刚出现</span>; <span class='zh'>聪明可爱</span>; <span class='zh'>且</span> = và. Bẫy: <span class='zh'>崇高</span>."},{n:22,text:"墨家的创始人墨子，在春秋战国时期处于显学的___。墨子___强烈的救世匡时的___，从实用主义的立场出发，考虑社会问题，提出一系列政治和伦理___。",o:["位置　立足　心愿　主意","身份　倡议　理想　观点","地位　本着　愿望　主张","职位　发扬　志向　看法"],a:2,why:"<span class='zh'>处于……的地位</span>; <span class='zh'>本着……的愿望</span> (ngữ pháp bài này!); <span class='zh'>提出主张</span>."},{n:23,text:"随着全球科技、经济的___发展，在物质财富极大提高的同时，人们的生活质量与精神追求却___落后，负面心理___，而传统心理学许多理论___只把人当作动物或机器，而忽略了人内在的潜力和主动性。",o:["火速　往往　司空见惯　大概","健康　显然　不足为奇　恐怕","全面　分外　比比皆是　一概","迅速　相对　层出不穷　似乎"],a:3,why:"<span class='zh'>迅速发展</span>; <span class='zh'>相对落后</span>; <span class='zh'>层出不穷</span> (từ mới!); <span class='zh'>似乎</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"西方学校的第一次变革始于17世纪。这时，欧洲正处于从封建制度向资本主义过渡时期。随着手工业生产的发展和生产技术的革新，(24)，近代自然科学体系开始形成，各种新的思想和方法不断涌现。17世纪40年代，英国爆发了资产阶级革命，(25)，宣告了欧洲新社会政治制度的诞生。与此同时，关心生产力提高的新兴资产阶级也需要科学的帮助，促进自然科学的发展。因此，17世纪欧洲的时代精神、社会生产力的发展以及平民群众对文化教育的普及需求，(26)。\n但是，无论在学校管理制度上，(27)，当时欧洲的学校都无法满足时代和社会的需要。学校不是为整个社会设立的，而是为富人设立的；学校的教学不是有序的，而是混乱的。本来应当清晰的和条理分明的讲授却被混乱的和复杂的讲授所取代，(28)，而且体罚、殴打学生的现象也十分普遍，所有这些，都成为教育变革的催化剂。",opts:["近代自然科学知识得到了更为迅速的发展","使学生好像是走入了知识迷宫","都使得已具有几千年历史的西方学校面临着变革","揭开了欧洲资产阶级革命的序幕","还是在学校课程内容和教学方法上"],ans:{24:0,25:3,26:2,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"家庭教育一般指家庭中父母及其他成年人对未成年孩子进行教育的过程。其教育目标是：在孩子进入社会接受集体教育之前保证孩子身心健康地发展，为理解幼儿园、学校的教育打好基础。家庭教育具有以下两大特点：\n第一是家庭教育的早期性。家庭是人出生后接受教育的第一个场所；家长是儿童的第一任教师，因此家长对儿童进行的教育具有早期性。一般来说，孩子1～3岁为幼儿时期，3～6岁为学龄前期，也就是人们常说的早期教育阶段，这是人身心发展的重要时期，人的许多基本潜质是这个年龄阶段构成的，如语言表达、性格形成等。有心理学家认为，一个人的智力发展，如果把17岁到达的水平算作100%，那么4岁时就到达了50%，4～8岁又增加了30%，8～17岁又获得了20%。可见幼儿在5岁之前是智力发展最迅速的时期，家长能否在这个时期给孩子良好的家庭教育，将是孩子早期智力发展的关键。\n第二是家庭教育的连续性。孩子从小到大，几乎2/3的时间生活在家庭之中，朝朝暮暮，都在理解着家长的教育。这种教育是在有意和无意、计划和无计划、自觉和不自觉之中进行的。家长的生活习惯、道德品行、谈吐举止等在不停地给孩子以影响和示范，其潜移默化的作用相当大。这种教育往往反映为一个家庭的家风，家风的好坏往往要延续几代人，甚至十几代人、几十代人。\n基于以上两点，使家庭教育成为教育人的起点与基点，具有其他教育所不及的优势。",qs:[{n:29,q:"家庭教育指：",o:["成年人教育未成年人","父母等教育未成年子女","孩子上学之前的教育","对幼儿开展的集体教育"],a:1,why:"“家庭中父母及其他成年人对未成年孩子进行教育”."},{n:30,q:"关于“家庭教育的早期性”，下列哪项正确？",o:["人的智力发展越来越快","3～6岁的孩子最有潜力","家长越早给孩子请老师越好","5岁前最适合孩子的智力开发"],a:3,why:"“幼儿在5岁之前是智力发展最迅速的时期”."},{n:31,q:"关于“家庭教育的连续性”，下列哪项正确？",o:["家庭教育的2/3是连续完成的","家庭教育是自然的，无需计划","家长的所作所为很容易影响子女","家风的形成需要好几代人的努力"],a:2,why:"“家长的生活习惯……在不停地给孩子以影响和示范”. Có <span class='zh'>示范</span>."},{n:32,q:"最后一段画线词语“不及”的意思是：",o:["来不及","不合格","比不上","不及时"],a:2,why:"<span class='zh'>其他教育所不及</span> = giáo dục khác không bằng."}]},{ins:"第33–36题：请选出正确答案。",text:"司马迁的家乡在黄河边上，那里山峦起伏，河流奔腾，风景十分壮美，这条中华民族的母亲河滋养了幼年的司马迁。司马迁从小就帮家里干活，种田、放牧牛羊，十分勤劳。在父亲的严格管教下，司马迁10岁就能阅读古代史书，他边读边做摘记，不懂的地方就请教父亲。小小年纪的他，读遍了有影响的史籍，并立志要做一名史学家。\n父亲虽然忙，对司马迁读书却是有要求的。一天，父亲把司马迁叫到跟前，指着一本书说：“这几个月，我公务缠身，抽不出空来教你。你自己读这本书吧。”司马迁看了看那本书，说：“这本书我读过了。”说着就把书从头至尾一字不差地背了一遍。父亲很奇怪，难道世界上真有神童！第二天，父亲偷偷跟在出门放羊的司马迁后面。翻过小山，过了河，来到一片水草丰美的洼地，司马迁把羊群赶到草地中央，羊开始吃草后，他从怀中掏出一本书认真读起来，父亲恍然大悟。\n20岁起，司马迁开始到各地游历，考察历史和风土人情，这为他日后编写史书提供了充足的史料。做太史令后，他常跟随皇帝到处巡游，又搜集了大量的历史资料，还了解到统治集团的许多内幕。为官期间，他如饥似渴地阅读宫廷收藏的大量书籍，收集了不少珍贵史料。\n就在他撰写《史记》的时候，因为替李陵说情，触怒了皇帝，被关入监狱，判处了重刑。司马迁出狱后继续写作，经过前后10年的艰苦努力，终于写成了《史记》。这部巨著，对后世史学与文学都产生了极为深远的影响。",qs:[{n:33,q:"根据第1段可以知道，司马迁：",o:["在劳动中锻炼了坚强的意志","从小深受黄河文化的影响","家里穷得只能跟父亲学习","从小就熟悉历史热爱历史"],a:3,why:"“10岁就能阅读古代史书……立志要做一名史学家”."},{n:34,q:"关于司马迁读书，下列哪项正确？",o:["父亲对司马迁要求很高","司马迁读书只限于背诵","父亲忙得没时间过问司马迁","司马迁的读书方法与父亲有分歧"],a:0,why:"“父亲虽然忙，对司马迁读书却是有要求的”. Có <span class='zh'>过问 · 分歧</span> làm bẫy."},{n:35,q:"司马迁20岁以后：",o:["边旅游边撰写史书","在皇帝身边做官了","了解了为官的不易","得到了官方的资助"],a:1,why:"“做太史令后，他常跟随皇帝到处巡游”. Có <span class='zh'>官方</span> làm bẫy."},{n:36,q:"根据第4段可以知道：",o:["李陵也是太史令","《史记》的内容让皇帝非常生气","司马迁在皇帝面前替李陵说话","司马迁出狱后又写了10年《史记》"],a:2,why:"“因为替李陵说情，触怒了皇帝”. D sai: “前后10年”."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"书院对中国封建社会教育、学术的发展，产生过重要影响。本课介绍了中国古代书院的发展历史，重点介绍了书院的办学方法以及在人才培养方面的情况。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Lịch sử","<span class='zh'>藏书 2000多年 · 唐代称书院 · 层出不穷</span>."],["Đông Giai thư viện","<span class='zh'>学田 · 规章制度 · 萌芽于唐，完备于宋，废止于清 · 缩影</span>."],["Đức nghiệp song trọng","<span class='zh'>《学规》· 一经发现，定不容纳 · 树立正气</span>."],["Tinh thần học tập","<span class='zh'>没有窍门 · 温故知新 · 读书须有疑</span>."],["Phương pháp","<span class='zh'>本着……原则 · 自修 · 切磋 · 质疑 · 论坛</span>."]],outline:[["一","书院的形成与发展"],["二","书院立足于人才培养：德业并重"],["三","刻苦、严谨的治学精神"],["四","自由活泼的办学方法"],["五","书院的影响"]],model:"中国古代书院\n中国藏书的历史有2000多年，唐代有人把藏书的地方叫作书院，之后各种书院层出不穷。后来，书院渐渐发展成了藏书、教学和研究相结合的教育机构。东佳书院是中国最早拥有学田、订有规章制度、收有学生的私办书院，它萌芽于唐，完备于宋，废止于清，是中国书院制度的一个缩影。\n书院立足于人才培养，德业并重。书院重视学问，更重视品德修养。比如，丽泽书院的《学规》规定，学生要孝顺长辈，为人忠诚，守信用，那些言行不一、用虚伪的话掩饰过失的人，一经发现，书院决不容纳。\n书院提倡刻苦、严谨的治学精神，认为读书没有窍门，没有捷径，只有勤奋好学，才能做好学问。在学习方法上，书院提倡读书成诵、温故知新、博学求精、读书须有疑。\n在办学方法上，书院努力实践自由活泼的办学思想：首先，书院本着贫富平等的原则，招收平民子弟入学；其二，重视自修和研究；其三，倡导互相切磋、互相学习；其四，鼓励师生相互质疑；另外，重视观点的多元化，设立了类似今天“论坛”的讲演辩论制度。\n书院内师生关系融洽，学生衷心爱戴老师。书院对中国封建社会教育、学术的发展产生过重要影响。",check:["Có tiêu đề","Có đủ các ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 4: 层出不穷 · 规章 · 完备 · 一经 · 本着 · 窍门 · 激发 · 多元化 · 爱戴","Khoảng 400 chữ"]},SUM:{words:["官方","层出不穷","命名","规章","截止","终止","完备","立足","灵魂","颁布","品德","过失","无耻","容纳","透露","治理","树立","正气","唾弃","卑鄙","堕落","腐败","崇高","境界","攀登","窍门","发扬","敞开","招收","开明","倡议","杜绝","干涉","过问","激发","多元化","开展","对立","分歧","保守","较量","论坛","激励","礼节","衷心","爱戴","示范","崇敬","偶像","封建"],patterns:[["一经 + V，就 / 定……","一经发现，本书院定不容纳。"],["本着……的原则 / 精神","书院本着贫富平等的原则，敞开大门，招收平民子弟入学。"],["V + 于 + 时代","萌芽于唐，完备于宋，废止于清"],["唯有……，才能……","唯有发扬勤奋好学的精神……才能做好学问。"],["篇章：论点 + 例证","德业并重是书院自始至终的追求目标。……比如，丽泽书院《学规》……"]],diff:["截止: dừng khi đến hạn, chỉ đi với thời gian (截止日期 · 截止到清朝末年) — 终止: kết thúc, đi với nhiều từ (终止比赛 · 终止合同 · 制度终止)","卑鄙 bēibǐ · 唾弃 tuòqì · 干涉 gānshè · 衷心 zhōngxīn (≠ 忠心)"],sentences:["萌芽于唐，完备于宋，废止于清的东佳书院是中国书院制度的一个缩影。","读书没有窍门，没有捷径，唯有发扬勤奋好学的精神，扎扎实实，一步一个脚印，才能做好学问。","学生衷心爱戴名师，因为他们学识广博，品德过人，给学生做出了最好的示范。"],hw:["Học thuộc 50 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Đặt 3 câu với 一经 và 3 câu với 本着.","Làm Sách bài tập bài 36.","Đọc trước bài 37 (Đơn vị 10 · 热点追踪)."]}});
