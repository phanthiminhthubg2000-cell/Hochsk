<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 40 · 人类超能力会改变世界纪录吗？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */

相成","xiāngfǔ-xiāngchéng","thành ngữ","tương phụ tương thành","kết hợp và hỗ trợ lẫn nhau",1,"成","互相补充，互相配合。","优秀的选手和科学训练相辅相成","理论和实践相辅相成。","Lý thuyết và thực tiễn bổ trợ cho nhau.",[],"SBT nghe 6–10."],[47,"依托","yītuō","đgt.","y thác","dựa vào, nương tựa",1,"","依靠；凭借。","教练员依托电脑……来指导训练","依托当地资源发展旅游。","Dựa vào tài nguyên địa phương phát triển du lịch.",[],"SBT câu 33–36."],[48,"装备","zhuāngbèi","đgt.","trang bị","trang bị",1,"","配备（武器、器材、技术力量等）；也指配备的武器、器材等。","先进装备","登山装备。","Trang bị leo núi.",[],"SBT câu 24–28."],[49,"战术","zhànshù","dt.","chiến thuật","chiến thuật",1,"","进行战斗的原则和方法；比喻解决局部问题的方法。","用新颖的战术思想指导比赛","教练调整了战术。","Huấn luyện viên điều chỉnh chiến thuật.",[],"SBT nghe câu 8."],[50,"悬崖峭壁","xuányá qiàobì","","huyền nhai tiễu bích","vách núi cao dựng đứng",1,"","高而陡的山崖。","越过人体极限这道“悬崖峭壁”","山路两边都是悬崖峭壁。","Hai bên đường núi toàn vách đá dựng đứng.",[],"Ẩn dụ: giới hạn cơ thể như vách đá."],[51,"涌现","yǒngxiàn","đgt.","dũng hiện","xuất hiện nhiều, nổi lên",1,"","（人或事物）大量出现。","无数竞争者中涌现出来的明星","涌现出一批优秀青年。","Xuất hiện một lớp thanh niên ưu tú.",[],"SBT câu 29–32."]],extra:[["国际田联","Guójì Tiánlián","Liên đoàn điền kinh quốc tế (IAAF)"],["纽约","Niǔyuē","New York"],["牙买加","Yámǎijiā","Jamaica"],["博尔特","Bó'ěrtè","Usain Bolt"],["鲍威尔","Bàowēi'ěr","Asafa Powell"],["股四头肌","gǔsìtóujī","cơ tứ đầu đùi"],["心率","xīnlǜ","nhịp tim"],["舆论哗然","yúlùn huárán","dư luận xôn xao"],["与生俱来","yǔshēng-jùlái","bẩm sinh"],["突破口","tūpòkǒu","điểm đột phá"]],T:[{zh:"我们一直以为世界纪录就是要不断被打破，但国际田联公布的各项比赛成绩却告诉我们，多数世界纪录都是在20世纪90年代创造的。此外，更有人引用《每日电讯报》的说法称：截至2060年，人类可能不会再创造体坛新纪录。",vn:"Chúng ta vẫn tưởng kỷ lục thế giới là để liên tục bị phá, nhưng thành tích các môn do Liên đoàn Điền kinh Quốc tế công bố lại cho biết phần lớn kỷ lục thế giới được lập vào thập niên 90 thế kỷ 20. Ngoài ra, còn có người dẫn lời tờ Daily Telegraph nói rằng: tính đến năm 2060, con người có thể sẽ không lập thêm kỷ lục thể thao mới nào nữa.",idea:"Kỷ lục còn bị phá nữa không?",q:["多数世界纪录是什么时候创造的？"],note:[["截至2060年","<span class='zh'>截至</span> + mốc thời gian = tính đến."],["引用……的说法称","Dẫn lời… nói rằng."]]},{zh:"一个人的体能究竟有多大？人们在力争打破世界纪录的同时，不禁会对自己的身体产生疑问。比如说，100米短跑最快需要几秒？这不是一个简单的谁拿冠军、谁拿亚军、谁拿季军的问题，这是对人类体能极限的追问。",vn:"Thể năng một người rốt cuộc lớn đến đâu? Khi cố gắng phá kỷ lục thế giới, người ta không khỏi đặt câu hỏi về chính cơ thể mình. Chẳng hạn, chạy 100 mét nhanh nhất mất mấy giây? Đây không phải chuyện đơn giản ai vô địch, ai á quân, ai hạng ba, mà là sự truy vấn về giới hạn thể năng của loài người.",idea:"Câu hỏi về giới hạn.",q:["“100米短跑最快需要几秒”是一个什么样的问题？"],note:[["在……的同时","Đồng thời với…"],["这不是……，这是……","Không phải… mà là…"]]},{zh:"有专家认为，人类跑100米速度的极限应该是10.42秒，再考虑一般跑到80米才能达到全速，人类可能达到的最快速度大约为11.96秒。",vn:"Có chuyên gia cho rằng giới hạn tốc độ chạy 100 mét của con người là 10,42 giây; lại tính đến việc thường phải chạy tới 80 mét mới đạt tốc độ tối đa, thì tốc độ nhanh nhất con người có thể đạt được khoảng 11,96 giây.",idea:"Ý kiến chuyên gia.",q:["专家认为人类跑100米的极限是多少？"],note:[]},{zh:"然而，在那条狭窄的跑道上，任性的牙买加田径比赛选手博尔特简直就不把世界纪录放在眼里！2008年6月1日，在美国纽约锐步大奖赛上，他以9.72秒的成绩获得100米短跑冠军，打破了同胞鲍威尔保持的9.74秒的世界纪录；2008年8月16日北京奥运会百米决赛电视直播中，摇动的旗帜汇成了沸腾的海洋，他以9.69秒的成绩再次刷新世界纪录，领先亚军0.2秒。振奋之余人们不禁再次追问——人体运动到底有没有极限？",vn:"Thế nhưng, trên đường chạy chật hẹp ấy, vận động viên điền kinh Jamaica “cứng đầu” Bolt gần như chẳng coi kỷ lục thế giới ra gì! Ngày 1/6/2008, tại giải Grand Prix Reebok ở New York, anh vô địch 100 mét với thành tích 9,72 giây, phá kỷ lục 9,74 giây của người đồng hương Powell; ngày 16/8/2008, trong buổi truyền hình trực tiếp chung kết 100 mét Olympic Bắc Kinh, những lá cờ phấp phới hợp thành biển người sôi sục, anh lại phá kỷ lục với 9,69 giây, bỏ xa á quân 0,2 giây. Phấn khởi xong, người ta không khỏi hỏi lại: vận động của cơ thể người rốt cuộc có giới hạn không?",idea:"Bolt phá kỷ lục.",q:["博尔特是怎样打破世界纪录的？"],note:[["不把世界纪录放在眼里","Xem Ngữ pháp 1: <span class='zh'>（把）……放在眼里</span>."],["以……的成绩","Với thành tích…"],["……之余","Sau khi… (bài 26)."]]},{zh:"有研究者分解了博尔特取得9.72秒成绩的那次比赛动作，并利用公式做了精密计算，结论是：他是从静止状态开跑的，9.72秒还包括了加速的时间，如果他跑200米，那么，第二个100米会比第一个100米快，因为没有起跑的过程。",vn:"Có nhà nghiên cứu đã phân tích động tác trong lần Bolt đạt 9,72 giây, dùng công thức tính toán chính xác và kết luận: anh xuất phát từ trạng thái đứng yên, 9,72 giây còn gồm cả thời gian tăng tốc; nếu anh chạy 200 mét thì 100 mét thứ hai sẽ nhanh hơn 100 mét đầu, vì không có giai đoạn xuất phát.",idea:"Phân tích của nhà nghiên cứu.",q:["研究者的结论是什么？"],note:[["结论是：……","Kết luận là…"]]},{zh:"数据相差如此悬殊，我们到底信谁？飞人博尔特创造的奇迹怎么解释？我们还能迷信专家吗？一时舆论哗然，质疑不断，专家、学者、网民纷纷自发掀起人体极限的讨论。",vn:"Số liệu chênh lệch xa như vậy, rốt cuộc ta tin ai? Kỳ tích của “người bay” Bolt giải thích thế nào? Ta còn có thể mù quáng tin chuyên gia không? Nhất thời dư luận xôn xao, hoài nghi không ngớt; chuyên gia, học giả, cư dân mạng lần lượt tự phát dấy lên cuộc tranh luận về giới hạn cơ thể người.",idea:"Dư luận dấy lên tranh luận.",q:[],note:[["……？……？……？","Chuỗi câu hỏi — 排比 + 设问."]]},{zh:"有人说，空洞的结论没有说服力，我们还是看看人体结构吧。运动员向前跑的动力大部分由股四头肌提供，股四头肌腱与膝盖连接，运动员才可以加速，这一结构也成为了运动员加速的制约因素，原理就是，超越极限的速度需要的力量足以造成股四头肌腱和膝盖间的连接点撕裂。人体结构是确定的，人体活动当然也有一定的范围，科学就是这么冷酷。",vn:"Có người nói, kết luận suông không có sức thuyết phục, ta hãy xem cấu tạo cơ thể. Động lực chạy về phía trước của vận động viên phần lớn do cơ tứ đầu đùi cung cấp; gân cơ tứ đầu nối với đầu gối thì vận động viên mới tăng tốc được — cấu trúc này cũng thành yếu tố kìm hãm tăng tốc. Nguyên lý là: lực cần cho tốc độ vượt giới hạn đủ làm rách điểm nối giữa gân cơ tứ đầu và đầu gối. Cấu tạo cơ thể là cố định, hoạt động cơ thể đương nhiên có phạm vi nhất định — khoa học nghiệt ngã như thế.",idea:"Góc độ cấu tạo cơ thể.",q:["从人体结构来看，为什么人类运动有极限？"],note:[["由……提供","Do… cung cấp."],["足以……","Đủ để…"]]},{zh:"也有人从运动医学和心理学角度出发，其观点也不无道理。跑步看起来是用腿，其实要动员全身的力量，牵扯到各个器官。拿胸膛里的心脏来说，它管辖着全身，如果它出了故障，腿再快也不管用。人进入运动状态后，心率加快，运动时最高心率＝（220－年龄）次/分。运动时的心率应在一定范围内，低限一般是最高心率的60%，高限一般是最高心率的85%。如一名40岁的人，运动时的心率应保持在每分钟108－150次左右，严禁超过心率的极限值，否则会因供血不足发生猝死。",vn:"Cũng có người xuất phát từ y học thể thao và tâm lý học, quan điểm của họ cũng không phải không có lý. Chạy bộ nhìn như dùng chân, thật ra phải huy động sức toàn thân, liên quan đến mọi cơ quan. Lấy trái tim trong lồng ngực mà nói, nó “cai quản” toàn thân; nếu nó trục trặc thì chân nhanh đến mấy cũng vô dụng. Khi vận động, nhịp tim tăng; nhịp tim tối đa = (220 − tuổi) lần/phút. Nhịp tim khi vận động nên ở trong phạm vi nhất định: mức dưới thường là 60%, mức trên thường là 85% nhịp tối đa. Ví dụ người 40 tuổi, khi vận động nên giữ nhịp tim khoảng 108–150 lần/phút, nghiêm cấm vượt giá trị giới hạn, nếu không sẽ đột tử do thiếu máu.",idea:"Góc độ y học thể thao.",q:["从运动医学的角度看，运动时心率应该怎样？"],note:[["其观点也不无道理","Xem Ngữ pháp 2: <span class='zh'>不无</span>."],["拿……来说","Lấy… mà nói."],["跑步……牵扯到各个器官。（总说）拿……心脏来说……（分说）","Xem 篇章: 先总说，再分说."]]},{zh:"每个人的运动极限都不同，长期正规科学的训练，多次接近实战性的“演习”，可以让自己越来越接近极限。人的心理因素弹性很大，积极的精神状态可以激发身体潜能，从而让运动员在竞赛中超水平发挥。",vn:"Giới hạn vận động của mỗi người đều khác nhau; tập luyện khoa học chính quy lâu dài, nhiều lần “diễn tập” sát thực chiến có thể giúp ta ngày càng tiến gần giới hạn. Yếu tố tâm lý của con người rất co giãn; trạng thái tinh thần tích cực có thể khơi dậy tiềm năng cơ thể, giúp vận động viên phát huy vượt mức trong thi đấu.",idea:"Huấn luyện & tâm lý.",q:["心理因素对运动员有什么影响？"],note:[["从而……","Từ đó…"]]},{zh:"体能只有60%是与生俱来的，其余40%要通过训练等外界影响去发掘。故而，体能、心理素质好的运动员，会成为优先选拔的对象。年轻运动员身体资产丰厚，得天独厚的优势就是他们的年龄；老运动员作风过硬，顽强，有志气，不屈服，这些使不少教练员对打破世界纪录依然充满信心。体育界有种说法：“运动员选对了，就成功了一半；通过训练让运动员的超能力发挥出来，那就是百分之百的成功。”",vn:"Thể năng chỉ 60% là bẩm sinh, 40% còn lại phải khai thác qua tập luyện và các tác động bên ngoài. Vì thế, vận động viên có thể năng và tố chất tâm lý tốt sẽ là đối tượng được ưu tiên tuyển chọn. Vận động viên trẻ có “tài sản” cơ thể dồi dào, lợi thế trời cho chính là tuổi tác; vận động viên lớn tuổi thì tác phong vững vàng, ngoan cường, có chí khí, không khuất phục — những điều này khiến không ít huấn luyện viên vẫn đầy tin tưởng vào việc phá kỷ lục. Giới thể thao có câu: “Chọn đúng vận động viên là thành công một nửa; qua huấn luyện giúp siêu năng lực của họ phát huy, đó là thành công trăm phần trăm.”",idea:"Tuyển chọn vận động viên.",q:["什么样的运动员会成为优先选拔的对象？"],note:[["故而","Vì thế (văn viết)."],["年轻运动员……；老运动员……","Đối chiếu."]]},{zh:"优秀的选手和科学训练相辅相成，是通往成功的有效手段。如今，教练员依托电脑、超高速摄影机等先进装备以及技术分析等手段来指导训练，用新颖的战术思想指导比赛。谁能顽强地越过人体极限这道“悬崖峭壁”，找到体能的“突破口”，谁就能成为无数竞争者中涌现出来的明星，这也是一个公认的事实。",vn:"Tuyển thủ giỏi và huấn luyện khoa học bổ trợ cho nhau, là con đường hiệu quả dẫn tới thành công. Ngày nay, huấn luyện viên dựa vào máy tính, máy quay siêu tốc và các trang bị tiên tiến cùng phân tích kỹ thuật để chỉ đạo tập luyện, dùng tư duy chiến thuật mới mẻ để chỉ đạo thi đấu. Ai ngoan cường vượt qua “vách đá dựng đứng” của giới hạn cơ thể, tìm được “điểm đột phá” của thể năng, người đó sẽ trở thành ngôi sao nổi bật giữa vô số người cạnh tranh — đó cũng là sự thật được công nhận.",idea:"Kết luận.",q:["怎样才能突破人体极限？"],note:[["谁……，谁就……","Ai… thì người đó…"],["“悬崖峭壁”","Ẩn dụ."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"领先",zh:"（把）……放在眼里",py:"(bǎ)……fàng zài yǎn li",tag:"Chú thích 1 · cụm cố định",mean:"Nghĩa là <b>coi trọng, xem ra gì</b>. Hay dùng ở dạng phủ định <span class='zh'>不把……放在眼里</span> = “không coi… ra gì”. Thường dùng trong <b>khẩu ngữ</b>.",forms:["不把 + N + 放在眼里","N + 都不放在眼里","谁都不放在眼里"],ex:[["在那条狭窄的跑道上，任性的牙买加田径比赛选手博尔特简直就不把世界纪录放在眼里！","",1],["一时间，大家都想挣钱，而且是想短时间挣大钱，以致一些商家根本不把10%的利润率放在眼里。","Nhất thời ai cũng muốn kiếm tiền nhanh, đến nỗi có thương nhân chẳng coi tỷ suất lợi nhuận 10% ra gì."],["烈日暴晒、大雨浇头、蚊虫叮咬，这些别人吃不了的苦他都不放在眼里，他心里只有一个念头：这次只能成功，不能失败。","Nắng gắt, mưa xối, muỗi đốt — những khổ ấy anh chẳng coi ra gì; trong lòng chỉ một ý nghĩ: lần này chỉ được thành công."]],tips:["Bài tập 2③."],practice:{q:"选择合适的短语填空：把这个毛头小子放在眼里 / 谁都不放在眼里 / 把任何危险都不放在眼里",type:"complete",items:[["他仗着自己业务好，________，经理来了也一样。","谁都不放在眼里"],["他知道，现在忠诚、勇敢、智慧的全部内容就是：保持头脑清醒；沉着，________。","把任何危险都不放在眼里"],["他这位世界冠军怎么会________，可是几个回合下来就发现，这毛头小子还真是轻视不得。","把这个毛头小子放在眼里"]]}},{id:"g2",grp:1,word:"牵扯",zh:"不无",py:"bùwú",tag:"Chú thích 2 · động từ",mean:"Động từ, nghĩa là “<b>không phải không có, ít nhiều có</b>” — cách nói giảm nhẹ, khẳng định một cách dè dặt.",forms:["不无 + 道理 / 关系 / 好处 / 效果 / 得意"],ex:[["也有人从运动医学和心理学角度出发，其观点也不无道理。","",1],["他写的剧本里有很多关于股市及金融的内容，大概和他曾经从商不无关系。","Kịch bản có nhiều nội dung về chứng khoán, có lẽ ít nhiều liên quan đến việc anh từng kinh doanh."],["会上，经理不无得意地宣布，我们的产品被评为“消费者信得过产品”。","Trong cuộc họp, giám đốc có phần đắc ý tuyên bố sản phẩm được bình chọn “đáng tin cậy”."]],tips:["Bài tập 2⑤."],practice:{q:"选择合适的词语填空：不无道理 / 不无效果 / 不无好处",type:"complete",items:[["……因此，羊奶产业的发展，对于人类的可持续发展是________的。","不无好处"],["有研究成果证实，自然香料具有抑制霉菌生长和防止黄曲霉毒素生成的作用，对预防癌症的发生________。","不无效果"],["男人爱车，女人爱房，这话________。女人对房子的渴望远高于男性……","不无道理"]]}},{id:"g3",grp:2,word:"得天独厚",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>得天独厚</span> = được trời ưu đãi. <span class='zh'>相辅相成</span> = bổ trợ cho nhau. <span class='zh'>悬崖峭壁</span> = vách đá dựng đứng. <span class='zh'>与生俱来</span> = bẩm sinh. <span class='zh'>力争上游</span> = gắng vươn lên hàng đầu.",forms:["A和B相辅相成","得天独厚的优势 / 条件"],ex:[["年轻运动员身体资产丰厚，得天独厚的优势就是他们的年龄。","",1],["优秀的选手和科学训练相辅相成，是通往成功的有效手段。","",1]],tips:["SBT câu 31: <span class='zh'>得天独厚的天赋</span>."]},{id:"g4",grp:2,word:"顽强",zh:"顽强 / 坚强",py:"wánqiáng / jiānqiáng",tag:"Xem 辨析 bên dưới",mean:"Đều là tính từ chỉ <b>kiên cố, mạnh mẽ, không lay chuyển</b>. <span class='zh'>顽强</span>: dùng được với <b>nghĩa xấu</b> (<span class='zh'>顽强抵抗</span>), tả cả ý chí lẫn <b>hành động</b> (<span class='zh'>顽强拼搏</span>). <span class='zh'>坚强</span>: không dùng nghĩa xấu, chỉ tả <b>ý chí</b>; còn là <b>động từ</b> “làm cho kiên cường” (<span class='zh'>坚强信心</span>).",forms:["顽强 + 拼搏 / 奋战 / 抵抗","坚强的意志 · 坚强 + 信心（động từ）"],ex:[["老运动员作风过硬，顽强，有志气，不屈服。","",1]],tips:["<span class='zh'>×他们坚强拼搏</span>."]}],BX:{grp:2,word:"顽强",cols:["顽强","坚强"],pair:"顽强 — 坚强",same:["Đều là tính từ, có nghĩa <b>kiên cố mạnh mẽ, không thể lay chuyển và phá hủy</b>.","他很顽强/坚强，没有向困难低过头。"],diff:[["Dùng được với <b>nghĩa xấu</b>.","改革受到旧势力的顽强抵抗。","<b>Không</b> dùng với nghĩa xấu."],["Tả được cả <b>ý chí tinh thần</b> lẫn <b>hành động</b>, mang ý “không bỏ cuộc”.","他们顽强拼搏，终于赢得了第一名。","Thường chỉ tả <b>ý chí tinh thần</b>, nhấn mạnh ý chí “mạnh mẽ”, không tả hành động.<div class='zh' style='margin-top:4px'>他们坚强拼搏。（×）</div>"],["Không có cách dùng bên phải.","我是越老越顽强，越老越快乐。","Là <b>động từ</b>: làm cho kiên cường.<div class='zh' style='margin-top:4px'>丰富自己的知识，坚强自己的信心。</div>"]],task:{q:"选择“顽强”或“坚强”填空",cols:["顽强","坚强"],sample:!1,items:[["她在腿部受伤的情况下____奋战，终于获得冠军。",0,"Tả hành động <span class='zh'>奋战</span> → 顽强."],["你一定要____自己的意志，做生活的强者。",1,"Động từ “làm cho kiên cường” → 坚强."],["不管敌人怎样____抗拒，最终注定要失败。",0,"Nghĩa xấu → 顽强."],["丰富自己的知识，____自己的信心。",1,"Động từ + tân ngữ <span class='zh'>信心</span> → 坚强."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["领<u>先</u>","争先 · 首先 · 先后 · 先进"],items:[["<u>狭</u>窄","窄","窄小 · 窄陋 · 心窄 · 冤家路窄"],["<u>空</u>洞","空","天空 · 空间 · 空气 · 空泛"],["<u>冷</u>酷","冷","寒冷 · 冷藏 · 冷落 · 冷静"],["竞<u>赛</u>","赛","比赛 · 赛马 · 赛场 · 赛跑"]]},EX2:{q:"用所给词语或结构完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["________，这项工作已进行了一大半。","截至","截至今年上半年，这项工作已进行了一大半。"],["在比赛中，我们________。","力争","在比赛中，我们力争第一名。"],["他________，让老板恼羞成怒。","把……放在眼里","他不把工作放在眼里，让老板恼羞成怒。"],["听说他的家庭遭遇了变故，热心的邻居们________。","自发","……热心的邻居们自发前去帮忙。"],["老友的这些话________，我会谨记心间。","不无","老友的这些话不无道理，我会谨记心间。"],["这都是木结构建筑，________。","严禁","这都是木结构建筑，严禁在附近使用明火。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["直播","极限","田径","领先","冠军"],text:"昨天的世界{田径}锦标赛很精彩。男子100米决赛中，{冠军}和亚军的争夺引人注目。在电视{直播}中，大家可以看到，冠军选手{领先}亚军0.2秒，刷新了世界纪录，再次向人类运动{极限}发起挑战。"},{bank:["竞赛","正规","顽强","选手","力争"],text:"运动员通过科学{正规}的训练，再加上良好的心理素质和{力争}上游的精神，是可以在{竞赛}中超水平发挥的。也就是说，一个优秀的{选手}，除了要具有良好的身体条件以外，{顽强}的意志也是必不可少的。"}]},EX4:{q:"请分析下列语段中总说和分说的论点分别是什么",items:[{src:"",task:"郭春英是个俊俏能干的女人。她每天要到25公里外的郊区去上班，不论早、中、晚班，9年来没迟到过，再苦再累也要把工作干好。回到家，她又是好妻子，买菜、做饭、洗衣服、收拾屋子，里里外外一把好手。",model:"总说：郭春英是个俊俏能干的女人。\n分说：她的工作能力很强；她是持家的一把好手。"},{src:"",task:"我从小喜爱唱歌，上学时一直是文艺活动的积极分子，中学毕业以后一心想当一名文艺工作者。22岁时真的成了一个歌舞团的演员，可惜没唱几年歌舞团解散我也改了行。1986年，我的文艺生活又重新开始，我参加了老年合唱团……",model:"总说：我从小喜爱唱歌。\n分说：22岁成为歌舞团演员；1986年参加老年合唱团。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["对世界纪录的看法","① 引用《每日电讯报》的说法 ② 一个人体能究竟有多大 ③ 专家认为百米最快速度是多少","多数世界纪录是在20世纪90年代创造的，有人引用《每日电讯报》的说法称，截至2060年人类可能不会再创造新纪录。人们不禁追问人类体能的极限，有专家认为百米极限是10.42秒。"],["以博尔特为例说说打破世界纪录的过程","① 博尔特：2008.6.1，纽约……；2008.8.16，北京…… ② 分解博尔特的动作，精密计算，结论","博尔特2008年6月1日在纽约以9.72秒打破世界纪录，8月16日在北京奥运会上又以9.69秒再次刷新。研究者分解他的动作，精密计算后认为他跑200米时第二个100米会更快。"],["通过对人体的分析来看人类运动极限","① 从身体结构看：动力来源，超越极限速度会…… ② 从运动医学和心理学角度分析：心脏、心率 ③ 从体能和心理素质方面分析 ④ 优秀选手和科学训练相辅相成","从人体结构看，超越极限的速度会造成肌腱和膝盖间的连接点撕裂；从运动医学看，运动时心率不能超过极限值；但心理因素弹性很大，体能有40%要靠训练发掘。优秀选手和科学训练相辅相成，才能突破极限。"]]},PZ:{title:"篇章（9）先总说，再分说",vn:"Nói khái quát trước, nói cụ thể sau",intro:"Đây là một kết cấu đoạn văn thường gặp: <b>câu đầu là câu khái quát (总说)</b>, các câu sau dùng <b>luận điểm cụ thể (分说)</b> để làm rõ nội dung câu đầu.",ex:[["我的家乡三面环海，一年四季气候都不错。（总说）春天，到处都是绿色，夏天只是中午有点儿热，秋天到处都是黄的和红的树叶，漂亮极了，冬天有时会下雪，但天气不会太冷。（分说）","Tổng: khí hậu tốt → Phân: xuân, hạ, thu, đông."],["猫的性格实在有些古怪。（总说）说它老实吧，它有时候的确很乖……说它贪玩吧，的确是呀……可是，它听到老鼠的一点儿响动，又是多么尽职……（分说）","Tổng: tính khí kỳ quặc → Phân: ngoan, ham chơi, tận chức."],["跑步看起来是用腿，其实要动员全身的力量，牵扯到各个器官。（总说）拿胸膛里的心脏来说，它管辖着全身……（分说）","Câu trong bài: tổng → phân tích tim, nhịp tim."]],q:"根据上述表达方式完成语段",pvn:"(1) 我们班的李明最有才华是公认的。高中三年，他的学习成绩一直名列前茅，他文章写得漂亮，还擅长画画儿，对了，________。　(2) 我们很快就成了好朋友。每天早上我们一起去学校，________。",practice:[["(1) 我们班的李明最有才华是公认的。……对了，________。","（参考）……对了，他还弹得一手好钢琴，学校每次举办晚会都少不了他的节目。"],["(2) 我们很快就成了好朋友。每天早上我们一起去学校，________。","（参考）……放学后一起做作业，周末一起去打球、看电影，有了烦恼也总是第一个告诉对方。"]]},DP:[{title:"词汇（1）：军事方面的词语",vn:"Từ ngữ quân sự — điền từ.",items:[["冲突","chōngtū","xung đột","发生冲突","由于边界划分不清，两国士兵常常发生冲突。"],["牺牲","xīshēng","hy sinh","为国牺牲","他为国牺牲时年仅16岁，人们永远怀念这个英勇的少年。"],["掩护","yǎnhù","yểm hộ","做掩护","他们利用树木山丘做掩护，与敌人进行周旋。"],["阵地","zhèndì","trận địa","阵地就在","战士们说：“只要我们在，阵地就在，我们要用生命来保卫。”"],["戒备","jièbèi","canh phòng","戒备森严","军事重地，戒备森严，连只苍蝇都飞不进来。"],["巡逻","xúnluó","tuần tra","来回巡逻","边防战士们每天都要沿着国境线来回巡逻。"],["国防","guófáng","quốc phòng","国防建设","只有加强国防建设，才能保证国家的安全。"],["投降","tóuxiáng","đầu hàng","举手投降","战斗进行得非常艰苦，有一些士兵放弃对抗，举手投降了。"],["后勤","hòuqín","hậu cần","后勤补给","在战争中，后勤补给非常重要，是军队的生命线。"]]},{title:"词汇（2）：政治方面的词语",vn:"Từ ngữ chính trị — nối từ với nghĩa.",items:[["殖民地","zhímíndì","thuộc địa","被剥夺独立权利","被别的国家剥夺了政治、经济的独立权利，并受它管辖的地区或国家。"],["主权","zhǔquán","chủ quyền","最高权力","一个国家在其领域内拥有的最高权力。"],["政权","zhèngquán","chính quyền","统治权力","政治上的统治权力。"],["祖国","zǔguó","tổ quốc","自己的国家","自己的国家。"],["国务院","guówùyuàn","Quốc vụ viện","最高行政机关","中国最高国家权力机关的执行机关，即最高国家行政机关。"],["中立","zhōnglì","trung lập","不倾向任何一方","处于对立的双方之间，不倾向于任何一方。"],["立场","lìchǎng","lập trường","地位和态度","认识和处理问题时所处的地位和所抱的态度，有时特指政治方面。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"游泳是非常有益于健康的体育运动，因为它可以使人体肌肉都得到锻炼。一旦学会了游泳，你将终生不会忘记。它不仅能够在危急的时候挽救你的生命，还是完成许多其他水上运动的前提。",o:["游泳可以帮助你减肥","学会游泳后很容易忘","游泳在危急时能救命","游泳前应做其他运动"],a:2,why:"“在危急的时候挽救你的生命”. Có <span class='zh'>肌肉</span>."},{n:2,say:"你在某种运动项目上有着特别的天赋吗？检验一下你最喜欢什么吧。你是喜欢和别人一起运动，还是更愿意独自运动呢？其实哪种方式都没错，你只要记住，胆小鬼可以通过运动变得勇敢，而好动的孩子则可以通过运动发泄精力。",o:["每人在运动上都有特别的天赋","和别人一起运动比独自运动好","胆子小的人通过运动会变得勇敢","爱动的孩子通过运动能获得精力"],a:2,why:"“胆小鬼可以通过运动变得勇敢”. D sai: <span class='zh'>发泄</span> chứ không phải <span class='zh'>获得</span>."},{n:3,say:"田径运动包括下列人类最原始的运动：走、跑、跳、投和推。十项全能运动员是田径运动员中的“王者”，他们要按顺序参加十个指定田径项目的比赛。在两天的竞技中，他们要分别在赛跑、跳跃和投掷项目中赛出自己的最佳成绩。",o:["田径运动是人类发展最快的运动","十项全能比赛的项目主要是赛跑","十项全能运动员自选十个项目比赛","十项全能运动员要参加两天的比赛"],a:3,why:"“在两天的竞技中”. C sai: <span class='zh'>指定</span> chứ không tự chọn."},{n:4,say:"所有的运动员，无论是大人还是小孩，在运动中有了诸如进球或者跑了第一名这样的精彩表现后，都会非常兴奋。但是他们如果没能实现自己的目标，就会感到失望。那么，运动带给人们的究竟是愉悦还是痛苦呢？可能只有身在其中的人才会有发言权吧。",o:["运动员有了精彩表现后会很兴奋","运动员一般都是为了娱乐而运动","每个人都应选择自己喜欢的运动","运动的目的是在竞争中赢得比赛"],a:0,why:"“有了……精彩表现后，都会非常兴奋”."},{n:5,say:"体操运动员特别敏捷，他们所完成的动作需要巨大的力量。有时他们在蹦床上练习，蹦床的弹性特别强，运动员会被弹到空中非常高的地方。顶级的体操运动员在学习复杂的动作时，都会训练几千遍。只有这样，他们才能在难度极高的动作中保持最完美的姿态。",o:["体操运动员的身体弹性特别强","体操运动员需要很大力量完成动作","体操运动员比赛时常被弹到非常高的地方","体操运动员的动作在比赛中要保持很长时间"],a:1,why:"“动作需要巨大的力量”. A sai: <span class='zh'>弹性</span> là của 蹦床."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：观众朋友，今天来到现场的是著名跨栏王子——刘翔，他在雅典奥运会上顽强拼搏，最后夺得了110米栏冠军。今天请刘翔跟我们聊聊他在运动场之外的生活。\n男：大家好，很高兴跟大家分享我生活中的点点滴滴。\n女：刘翔，大家都知道你的成功来之不易，在你成功的背后，在塑胶跑道之外，你的业余生活怎么样？\n男：我爱好上网，每次结束上午的训练课，回到宿舍，随便把跑鞋一扔，直接冲到电脑前，有时甚至门钥匙都忘了拔。\n女：那你上网主要干什么呢？\n男：主要看体育新闻，因为必须掌握更多对手的战术等信息才能百战不殆。除了体育，我也关心一些国内、国际上新发生的大事，我喜欢接触各种事物。\n女：除了上网，你还有别的爱好吗？\n男：我喜欢唱歌，而且唱的还不错，什么陶喆、阿杜，我都会模仿，大家都说模仿的还挺像。\n女：那晚上你一般做什么？\n男：晚上7点以后，我一般会到医务室按摩。大家都知道，好成绩与科学正规的训练和恢复是相辅相成的。\n女：听说只有你有优先按摩权，只要你去了，别的队友必须马上让开，因为大赛在即，必须保证你的身体不出意外，是这样吗？\n男：这可是舆论冤枉我了，事实不是这样的，竞赛是残酷的，可大家的友谊却是温暖的。大家练得都很苦，我从来没享受过这种特权。不能因为我有点成绩就骄傲，我会选择在赛场上去征服每一个对手和观众。",qs:[{n:6,q:"刘翔是什么项目的冠军？",o:["400米接力比赛","100米短跑比赛","110米跨栏比赛","10000米长跑比赛"],a:2,why:"“夺得了110米栏冠军”. Có <span class='zh'>顽强</span>!"},{n:7,q:"刘翔为什么有时候门钥匙都不拔？",o:["刘翔的宿舍很安全","刘翔生活中很马虎","刘翔特别喜欢上网","刘翔非常喜欢听歌"],a:2,why:"“直接冲到电脑前，有时甚至门钥匙都忘了拔”."},{n:8,q:"刘翔为什么喜欢看体育新闻？",o:["掌握对手信息","了解社会新闻","了解经济情况","关注国内外大事"],a:0,why:"“必须掌握更多对手的战术等信息”. Có <span class='zh'>战术</span>!"},{n:9,q:"主持人说刘翔享有的特权是什么？",o:["队友必须为他服务","他能优先接受按摩","他能优先使用训练场","他能任意挑选按摩师"],a:1,why:"“只有你有优先按摩权”. Có <span class='zh'>优先 · 舆论 · 竞赛</span>!"},{n:10,q:"根据本文，刘翔和队友的关系怎么样？",o:["有矛盾","挺友善","很冷淡","比较一般"],a:1,why:"“大家的友谊却是温暖的”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"跑步、跳跃和投掷是人类最古老的运动。我们如今刻苦训练的这些技能，其实都是原始人生存的必备能力。原始人只有利用他们的技巧、力量、速度和耐力，才能找到食物或抵御危险，才能在冷酷的环境中生存下去。\n你能站在一艘狭窄又摇晃的小船里，用弓箭射鱼吗？如今，在非洲和南美洲的原始森林中，还有一些人保留着几千年前的生活方式。他们从小就在不知不觉中学会了以“运动的方式”应对周围环境的变化。\n可是现在的我们，大多数时间几乎都静坐不动：在学校里、在电视机前、在电脑前、在汽车里或是工作中……长此以往，我们不生病才怪呢！因此，为了保证健康，我们必须注重体育锻炼。\n你知道吗？当你感觉无聊，或是又困又乏，对什么都没兴趣的时候，出去大玩儿一场或者近似疯狂地运动一通，就可以摆脱这种状态。当然，最重要的是你要接触新鲜空气：不管是和朋友在一起，还是在社团或者在学校里。",qs:[{n:11,q:"我们现在刻苦训练的运动技能，对原始人来说是什么？",o:["保持健康的方式","结交朋友的途径","生存的基本能力","自娱自乐的方式"],a:2,why:"“都是原始人生存的必备能力”. Có <span class='zh'>冷酷 · 狭窄</span>!"},{n:12,q:"关于非洲和南美洲的原始森林，下列哪项正确？",o:["那里的人驾船的本领很高","那里的人喜欢用弓箭捕鱼","那里的人个个都是运动高手","那里还存在着古老的生活方式"],a:3,why:"“还有一些人保留着几千年前的生活方式”."},{n:13,q:"根据本文，要摆脱无聊状态，最重要的是什么？",o:["出门去旅行","疯狂地工作","坚持体育锻炼","去呼吸新鲜空气"],a:3,why:"“最重要的是你要接触新鲜空气”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"每隔四年，来自全世界的运动员都会在奥运赛场上相会，而各个国家的体育迷们都会守在电视机前关注直播的赛事，为自己的同胞们加油，奥运会的胜利者也将成为顶级明星。古代奥运会的冠军会得到橄榄枝花环，而如今获得比赛冠军、亚军、季军的选手则会分别得到金、银、铜牌。\n奥运五环代表了五大洲之间的友谊。比赛期间，奥运圣火将一直在奥运主赛场上熊熊燃烧。\n古希腊的选手们很早之前就已经在为夺取胜利而竞争了。在奥林匹亚，赛跑和摔跤成为最古老的比赛项目。那个时候，古希腊城邦之间经常会爆发战争，但在奥运会期间，战争必须停止。\n这项盛大的赛事是古希腊最受欢迎的活动，每次比赛都会引来无数观众观看。",qs:[{n:14,q:"奥运会期间，体育迷们会做什么？",o:["参加比赛","关注赛事","出门旅行","成为明星"],a:1,why:"“守在电视机前关注直播的赛事”. Có <span class='zh'>直播 · 同胞</span>!"},{n:15,q:"现代奥运会的季军会收获什么？",o:["花环","金牌","银牌","铜牌"],a:3,why:"“冠军、亚军、季军……分别得到金、银、铜牌”."},{n:16,q:"奥运五环代表了什么？",o:["五个古老的项目","五位奥运会冠军","熊熊燃烧的圣火","五大洲之间的友谊"],a:3,why:"“五环代表了五大洲之间的友谊”."},{n:17,q:"在古希腊，奥运会期间，城邦之间会怎么样？",o:["爆发战争","停止战争","轮流举办奥运会","举行盛大的欢迎活动"],a:1,why:"“在奥运会期间，战争必须停止”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["后来她不知不觉睡着了，不知多长时间睡觉。","她聪明而任性，常常为一点点小事和同学争执、赌气。","经济学家往往迷信数字，什么利润率多少、GDP多少等。","学生的心理发展还远没有达到极限，还可能有更大的发展。"],a:0,why:"<b>Trật tự / kết cấu sai</b>: <span class='zh'>不知多长时间睡觉</span> → <span class='zh'>不知睡了多长时间</span>."},{n:19,o:["作文比赛的报名时间下周末下午截至。","我们应该把整个任务分解成若干小项目。","《史记》最后一篇中引用了司马谈的文章。","这项社会工程需要动员各方面的力量参与。"],a:0,why:"<b>Dùng từ sai</b>: <span class='zh'>截至</span> phải có tân ngữ thời gian phía sau; đứng cuối câu phải dùng <span class='zh'>截止</span>."},{n:20,o:["这篇文章论点鲜明，论述详尽，从人口的角度给出了地方政府的最优管辖范围。","我们不能把引入竞争机制当作一句空话，领导干部的公开选拔也是引入竞争机制的做法。","上个星期跟朋友慕名参观了郊外的一处景点，那儿小巧精致，范围不大，我三个小时才看完。","我们应尽量避免因电脑出现故障而丢失未能保存的内容，所以在用电脑工作时应及时保存文件。"],a:2,why:"<b>Mâu thuẫn logic</b>: <span class='zh'>范围不大</span> mà <span class='zh'>三个小时才看完</span> → nên là <span class='zh'>半个小时就看完了</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"___你没有梦想过成为足球明星或职业网球选手，体育运动对你来说也仍然十分重要。如果能有___地活动你的运动器官——骨骼、肌肉、韧带、肌腱和所有大大小小的关节的话，你就会变得灵巧而敏捷。体育运动可以强健你的心脏和血液循环系统，还可以___大脑的氧气供应。",o:["不管　规定　改变","即使　规律　改善","因为　规则　改革","一旦　规范　改掉"],a:1,why:"<span class='zh'>即使……也……</span>; <span class='zh'>有规律地</span>; <span class='zh'>改善供应</span>."},{n:22,text:"在网球、乒乓球和羽毛球比赛中，选手要___通过技巧将球打过网，打在对方的界内，并使对方___不到球或在回击时出现失误。哪一方将球打到网上或是打到界外，就___对方得分。网球选手发球时，球的速度能达到赛车的速度！而对方选手必须快速地___脚步，做出如闪电般迅速的回应。",o:["尽管　抓　为　转移","随意　拿　认　转换","尽量　接　算　移动","尽快　扔　给　运动"],a:2,why:"<span class='zh'>尽量</span>; <span class='zh'>接不到球</span>; <span class='zh'>算对方得分</span>; <span class='zh'>移动脚步</span>."},{n:23,text:"F1赛车手一般都是体魄___的运动员，因为F1赛车的驾驶___和车手所必须经受的强大离心力，跟驾驶一般车辆相差悬殊。赛车手不仅体能状态要___常人，更要有沉着、冷静的___。而且身体的耐热性对F1车手也是很重要的。",o:["强健　方式　优于　头脑","强大　方法　高于　脑力","坚强　办法　长于　精力","顽强　形式　大于　脑袋"],a:0,why:"<span class='zh'>体魄强健</span>; <span class='zh'>驾驶方式</span>; <span class='zh'>优于常人</span>; <span class='zh'>冷静的头脑</span>. Có <span class='zh'>悬殊</span>; C/D có <span class='zh'>坚强 · 顽强</span> — không đi với <span class='zh'>体魄</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"来到新西兰后，学校希望每一个学生都能够在课余按照自己的喜好选择一两项运动。这不属于必修的课程，完全属于课后的休闲娱乐，许多同学都放弃了选择的机会，我倒是觉得既然能有多达17种运动项目供我选择，(24)？于是我选择了击剑。\n周二下午，老师通知我到体育馆参加首次训练，不需要任何装备，也不需要任何准备。教练是一位和蔼可亲的女士，叫戴安。(25)，并说当年中国选手获得过奥运会冠军，相信我也可以获得好成绩。与国内直接进行技术和体能训练的教育不同，她首先让我了解击剑的发展史。熟悉了基本规则之后，(26)。让我吃惊的是，刚刚参加了两次训练，戴安就安排我参加了一次演习赛，(27)。大概是初生牛犊不怕虎吧，我只用了15分钟就以5:1拿下了比赛。(28)，也指出了我进攻时暴露的问题。首次比赛的成功对我以后的练习是个很大的动力。",opts:["赛后戴安对我大大夸奖了一番","她首先对我表示欢迎","对手是一个已经学习击剑两年但年龄比我小3岁的男孩儿","何不尝试一下呢","我便开始在她的指导下循序渐进地进行步伐、动作训练"],ans:{24:3,25:1,26:4,27:2,28:0}},read4:[{ins:"第29–32题：请选出正确答案。",text:"在多年前的一场NBA决赛中，新秀皮蓬独得33分，超过乔丹3分，成为公牛队中比赛得分首次超过乔丹的球员。比赛结束后，乔丹与皮蓬紧紧拥抱，两人泪光闪闪。\n这里有一个乔丹和皮蓬之间鲜为人知的故事。当年公牛队涌现出的众多新秀中，皮蓬是最有希望超越队友乔丹的，他时常流露出一种对乔丹不屑一顾的神情，还经常说乔丹某方面不如自己，自己一定会把乔丹推倒之类的话。但乔丹并没有把皮蓬当作潜在的威胁而排挤他，反而对他处处加以鼓励。\n有一次，乔丹对皮蓬说：“我俩的三分球谁投得好？”皮蓬有点儿心不在焉地回答：“你明知故问，当然是你。”因为那时乔丹的三分球命中率是28.6%，而皮蓬是26.4%。但乔丹微笑着纠正：“不，是你！你投三分球的动作很规范、自然，有得天独厚的天赋，以后一定会投得更好，而我还有很多弱点。”他说：“我扣篮多用右手，习惯用左手帮一下，而你，左右都行。”这一细节连皮蓬都不知道，他深深地为乔丹所感动。\n这件事成了两人关系的转折点，从那以后，皮蓬和乔丹成了最好的朋友，皮蓬也成了公牛队17场比赛得分首次超过乔丹的球员。而乔丹的这种品质则为公牛队注入了难以击破的凝聚力，从而使公牛队创造了一个又一个神话。乔丹不仅以球艺，更以他那坦荡无私的广阔胸襟赢得了所有人的拥护和尊重，包括他的对手。",qs:[{n:29,q:"关于多年前的那场NBA决赛，下列哪项正确？",o:["当时皮蓬还是个新手","乔丹一个人得了36分","之前乔丹一直得分最高","这场比赛对公牛队很重要"],a:2,why:"Đáp án sách: C —皮蓬 “首次超过乔丹” → trước đó 乔丹 luôn ghi điểm cao nhất. B sai: 乔丹 được 30 điểm."},{n:30,q:"第3段画线词语“明知故问”的意思是什么？",o:["有不明白的，就要问人","明明知道，还故意问人","因为不明白，所以要问","问了，就什么都明白了"],a:1,why:"<span class='zh'>明知故问</span> = biết rõ mà cố tình hỏi."},{n:31,q:"乔丹认为皮蓬三分球比自己投得好的理由是什么？",o:["皮蓬在气势上占优势","皮蓬技术好，还很谦虚","自己命中率高纯属偶然","皮蓬有得天独厚的天赋"],a:3,why:"“有得天独厚的天赋”. Có <span class='zh'>规范 · 涌现</span>!"},{n:32,q:"根据上文，下列哪个词形容乔丹最适合？",o:["胸怀坦荡","目光如炬","化敌为友","心直口快"],a:0,why:"“坦荡无私的广阔胸襟”."}]},{ins:"第33–36题：请选出正确答案。",text:"训练场上有人哭着骂他是“魔鬼”；生活中，大家说他像父亲般慈爱。他就是女子曲棍球队的“金牌教练”——金教练。\n刚指导这支球队时，金教练很快就准确地抓住了制约球队进步的主要问题——体能。为此，他制定了一套严格的训练计划。他在训练中十分严厉。每天训练结束后，女队员们的两条腿都累得迈不上楼梯。这种超极限的“魔鬼式”训练，强度起码超出以往3倍，于是有的队员哭过、骂过，但姑娘们都是好样的，她们依托良好的身体素质，很快就适应了，同时还锻炼了自己不向困难屈服的意志品质和力争上游的拼搏精神。姑娘们发现，要求队员做到的，金教练自己一定先做到。每次训练，他都提前10分钟到达场地，他也严禁其他教练和工作人员迟到。金教练的腰有旧伤，一犯起来就会全身疼得起不了床，但当腰疼时他硬是让人把他扶到训练场坚持训练。\n空洞的说教是打动不了队员的，金教练用自己的行动赢得了姑娘们的信任。即使是哭着骂过金教练是“魔鬼”的姑娘，也觉得训练场外的教练慈祥如父。队员有伤、有病，教练背起来就往医院送。比赛奖励给教练的奖金，他都拿出来给队员买营养品。他把每个队员的生日都抄下来贴在宿舍的墙上，到时就亲自为队员过生日。\n在一次重大赛事中，球队取得了盼望已久的胜利。姑娘们欢呼着奔向金教练，自发地把手中的鲜花举到教练胸前。金教练沉默了许久，望着这一个个熟悉的身影，他的双眼模糊了。",qs:[{n:33,q:"有人骂金教练是“魔鬼”，是因为：",o:["他的品质有问题","他的要求太严格","他的长相太可怕","他的态度太凶恶"],a:1,why:"“他在训练中十分严厉……‘魔鬼式’训练”."},{n:34,q:"制约那支球队进步的主要问题是什么？",o:["体能","意志","精神","战术"],a:0,why:"“制约球队进步的主要问题——体能”. Có <span class='zh'>制约 · 极限 · 依托 · 屈服 · 力争 · 严禁 · 空洞 · 自发</span>!"},{n:35,q:"训练场外的金教练是个什么样的人？",o:["很认真","很慈祥","十分严厉","也像魔鬼"],a:1,why:"“训练场外的教练慈祥如父”."},{n:36,q:"文中“……这一个个熟悉的身影”指的是：",o:["其他教练","工作人员","球队队员","教练的家人"],a:2,why:"Chỉ các cô gái — <span class='zh'>姑娘们欢呼着奔向金教练</span>."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文（约400字）",t:"35 phút",min:!0,task:"世界纪录能不断被打破吗？人类的运动极限到底在哪儿？本课通过短跑世界冠军博尔特的例子告诉人们，人类运动极限可以不断被打破。但专家们却从人体自身结构和运动医学等角度分析，认为人类运动是有极限的，但另一方面科学的训练又能不断提高运动员的运动成绩。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Đặt vấn đề","Kỷ lục lập từ thập niên 90; 2060; giới hạn 10,42 giây — dùng <span class='zh'>截至 · 极限</span>."],["Bolt","Hai mốc 2008; <span class='zh'>不把……放在眼里 · 领先 · 分解 · 精密</span>."],["Tranh luận","<span class='zh'>悬殊 · 舆论 · 自发掀起</span>."],["Phân tích","Cấu tạo cơ thể → y học → tâm lý → tuyển chọn; dùng <span class='zh'>不无道理 · 制约 · 严禁</span>."],["Kết luận","<span class='zh'>相辅相成 · 顽强 · 涌现</span>."]],outline:[["一 · 疑问","世界纪录还能被打破吗"],["二 · 博尔特","两次打破纪录"],["三 · 讨论","舆论哗然"],["四 · 分析","人体结构、运动医学、心理、训练"],["五 · 结论","选手和训练相辅相成"]],model:"人类运动有没有极限？\n我们一直以为世界纪录会不断被打破，但国际田联公布的成绩显示，多数世界纪录都是在20世纪90年代创造的。更有人引用《每日电讯报》的说法称，截至2060年，人类可能不会再创造新纪录。一个人的体能究竟有多大？有专家认为，人类跑100米的极限应该是10.42秒。\n然而，牙买加选手博尔特却不把世界纪录放在眼里。2008年6月1日，他在纽约以9.72秒打破了世界纪录；同年8月16日，他在北京奥运会上又以9.69秒再次刷新世界纪录，领先亚军0.2秒。有研究者分解了他的比赛动作并做了精密计算，认为如果他跑200米，第二个100米会更快。数据相差如此悬殊，一时舆论哗然，人们纷纷掀起了关于人体极限的讨论。\n有人从人体结构来看：运动员跑步的动力主要来自股四头肌，超越极限的速度会造成肌腱和膝盖间的连接点撕裂，所以人体活动有一定的范围。也有人从运动医学和心理学角度分析：跑步要动员全身的力量，特别是心脏，运动时的心率严禁超过极限值，否则可能会猝死。不过，人的心理因素弹性很大，积极的精神状态可以让运动员超水平发挥。另外，体能只有60%是与生俱来的，其余40%要通过训练去发掘。\n总之，优秀的选手和科学训练相辅相成，是通往成功的有效手段。谁能顽强地越过人体极限，谁就能成为涌现出来的明星。",check:["Có tiêu đề tự đặt","Giữ đủ 3 phần: kỷ lục — Bolt — phân tích giới hạn","Không thêm ý kiến riêng","Có kết luận “相辅相成”","Dùng ít nhất 4: 截至 · 极限 · 领先 · 悬殊 · 不无 · 严禁 · 顽强 · 相辅相成","Khoảng 400 chữ"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"有一个叫菲尔德的商人，一次偶然的机会，在农夫巴勒斯家里吃到了一种番茄酱，那鲜美的味道，令他赞美不已。出于商人的本能，菲尔德决定向巴勒斯讨要制作番茄酱的秘方。巴勒斯几乎未加任何考虑，便将番茄酱的制作方法告诉了他。临走时，菲尔德给了巴勒斯100美元，作为购买番茄酱秘方的费用。巴勒斯一再拒绝，可菲尔德还是将钱塞给了巴勒斯。\n就这样，菲尔德开始了番茄酱的生产。不出所料，番茄酱的销量果然很好，菲尔德很快便成了百万富翁。就在菲尔德准备扩大生产的时候，突然在街头看到了一张小广告。菲尔德大吃了一惊，原来那是农夫巴勒斯寻找自己的广告，广告上说，如果菲尔德看到了这张广告，希望立即跟自己联系。\n菲尔德想，巴勒斯肯定是来要钱的！当初自己用100美元购买的番茄酱秘方，转眼让自己变成了百万富翁，巴勒斯一定是后悔了。那么，他究竟想要多少钱？弄不好，巴勒斯还会要求自己停止生产，或者跟自己打官司。\n为了躲避巴勒斯，菲尔德忍痛将番茄酱厂一再搬迁，销售范围也一缩再缩。可是，巴勒斯寻找他的小广告，仍然随时出现，菲尔德终于经不住折腾而破产了。\n气急败坏的菲尔德决定去找巴勒斯算账，他想知道，巴勒斯究竟想要干什么！当菲尔德出现在巴勒斯面前的时候，巴勒斯就像遇到了久违的亲人一样，高兴地说：“我终于找到您了！”菲尔德气急败坏地说：“你找到我了，可我没有钱给你。”巴勒斯愣了一下，赶紧从口袋里掏出当年菲尔德给他的那张100美元的钞票，对他说：“我找您，就是要把钱还给您。”菲尔德不解地问：“这不是我购买番茄酱的秘方的费用吗？”巴勒斯说：“是的，但我不收您的钱，如果我因为这么点儿小事就收您的钱，邻居们会耻笑我的！”\n菲尔德苦笑着问：“如果我一直不出现呢？”巴勒斯坚定地说：“那我就继续找下去，直到将钱还给您为止，这可是我们乡下人做人的原则！”",model:"一百美元\n商人菲尔德在农夫巴勒斯家里吃到了一种非常鲜美的番茄酱，就向巴勒斯讨要制作秘方。巴勒斯几乎没有考虑，就把方法告诉了他。临走时，菲尔德给了巴勒斯100美元，巴勒斯一再拒绝，可菲尔德还是把钱塞给了他。\n菲尔德开始生产番茄酱，销量果然很好，他很快就成了百万富翁。就在他准备扩大生产的时候，突然在街头看到了一张巴勒斯寻找他的小广告，希望他立即跟自己联系。\n菲尔德想，巴勒斯一定是后悔了，是来要钱的，弄不好还会要求他停止生产，或者跟他打官司。为了躲避巴勒斯，菲尔德一次又一次地把工厂搬走，销售范围也越来越小。可是巴勒斯的小广告仍然随时出现，菲尔德终于经不住折腾，破产了。\n气急败坏的菲尔德决定去找巴勒斯算账。巴勒斯见到他，像见到了久违的亲人一样，高兴地说：“我终于找到您了！”菲尔德说：“可我没有钱给你。”巴勒斯赶紧从口袋里掏出当年那张100美元的钞票，说：“我找您，就是要把钱还给您。如果我因为这么点儿小事就收您的钱，邻居们会耻笑我的！”\n菲尔德苦笑着问：“如果我一直不出现呢？”巴勒斯坚定地说：“那我就继续找下去，直到把钱还给您为止，这是我们乡下人做人的原则！”"}},SUM:{words:["引用","截至","力争","亚军","季军","极限","狭窄","任性","田径","选手","同胞","直播","旗帜","领先","分解","公式","精密","悬殊","迷信","舆论","自发","掀起","空洞","制约","原理","冷酷","动员","牵扯","胸膛","管辖","故障","严禁","猝死","正规","演习","弹性","竞赛","优先","选拔","资产","得天独厚","作风","顽强","志气","屈服","相辅相成","依托","装备","战术","悬崖峭壁","涌现"],patterns:[["不把……放在眼里","博尔特简直就不把世界纪录放在眼里！"],["不无 + 道理 / 关系 / 好处","其观点也不无道理。"],["截至 + thời điểm","截至2060年，人类可能不会再创造体坛新纪录。"],["谁……，谁就……","谁能顽强地越过人体极限……，谁就能成为……明星。"],["篇章：先总说，再分说","跑步……牵扯到各个器官。（总说）拿胸膛里的心脏来说……（分说）"]],diff:["顽强: dùng được nghĩa xấu, tả cả hành động (顽强拼搏 / 顽强抵抗) — 坚强: không nghĩa xấu, chỉ tả ý chí; còn là động từ (坚强信心)","截至 + thời gian (截至2060年) ≠ 截止 đứng cuối (报名下周五截止) · 悬殊 xuánshū · 猝死 cùsǐ · 弹性 tánxìng"],sentences:["这不是一个简单的谁拿冠军、谁拿亚军、谁拿季军的问题，这是对人类体能极限的追问。","人体结构是确定的，人体活动当然也有一定的范围，科学就是这么冷酷。","优秀的选手和科学训练相辅相成，是通往成功的有效手段。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Tóm tắt bài khóa khoảng 400 chữ (mục 7) và làm đề 缩写 “番茄酱”.","Đặt 3 câu với 不把……放在眼里 và 3 câu với 不无.","Làm Sách bài tập bài 40.","🎉 Hoàn thành giáo trình HSK6! Ôn tổng hợp 40 bài và luyện đề thi thử HSK6."]}});
</script>
