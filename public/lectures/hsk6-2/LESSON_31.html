<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 31 · 运动的学问 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

h đoan chính.",[],""],[38,"紫外线","zǐwàixiàn","dt.","tử ngoại tuyến","tia tử ngoại, tia cực tím",1,"","波长比可见光短的电磁波。","冬天阳光中的紫外线","夏天要注意防紫外线。","Mùa hè phải chú ý chống tia cực tím.",[],""],[39,"消毒","xiāo dú","đgt.","tiêu độc","trừ độc, khử trùng",1,"","用物理或化学方法杀死病原微生物。","对人体有消毒作用","餐具要定期消毒。","Bát đĩa phải khử trùng định kỳ.",[],""],[40,"钙","gài","dt.","cái","canxi (calcium)",1,"","金属元素，符号Ca。","促进对钙的吸收","老人要多补钙。","Người già cần bổ sung canxi.",[],"Bài tập 3②. SBT câu 20A: <span class='zh'>钙化</span>."],[41,"二氧化碳","èryǎnghuàtàn","dt.","nhị dưỡng hóa thán","carbon dioxide (CO₂)",1,"","无色无臭的气体。","二氧化碳浓度比夏天低","植物吸收二氧化碳。","Thực vật hấp thụ CO₂.",[],"SBT câu 20D."],[42,"舒畅","shūchàng","tt.","thư sướng","khoan khoái, dễ chịu",1,"","开朗愉快；舒服痛快。","使人心情舒畅","听了这话，我心里很舒畅。","Nghe câu ấy tôi thấy nhẹ nhõm.",[],"SBT nghe câu 3."],[43,"宣扬","xuānyáng","đgt.","tuyên dương","quảng cáo, phổ biến rộng rãi",1,"","广泛宣传，使大家知道。","保健食品都宣扬能够促进健康","这件事不要到处宣扬。","Chuyện này đừng loan đi khắp nơi.",[],""],[44,"孔","kǒng","dt.","khổng","lỗ, khe hở",1,"","小洞；窟窿。","毛孔内的垃圾","墙上有个小孔。","Trên tường có một lỗ nhỏ.",["毛孔"],"SBT câu 20B: <span class='zh'>方孔 · 圆孔</span>."],[45,"循序渐进","xúnxù-jiànjìn","thành ngữ","tuần tự tiệm tiến","tiến dần từng bước",1,"成","按照一定的步骤逐渐深入或提高。","运动健身要循序渐进","学习要循序渐进。","Học phải đi từng bước.",[],"SBT câu 13B."],[46,"急于求成","jíyú qiú chéng","thành ngữ","cấp vu cầu thành","nóng lòng muốn thành công",1,"成","急着要取得成功。","不要急于求成","做事不能急于求成。","Làm việc không thể nóng vội.",[],"Bài tập 3②."],[47,"剧烈","jùliè","tt.","kịch liệt","dữ dội, mạnh",1,"","猛烈。","剧烈运动","饭后不要做剧烈运动。","Sau bữa ăn đừng vận động mạnh.",[],""],[48,"幅度","fúdù","dt.","phúc độ","mức độ, phạm vi",1,"","物体振动或摇摆所展开的宽度；事物变动的大小。","大幅度动作","价格大幅度上涨。","Giá tăng mạnh.",[],"SBT câu 11B."],[49,"蛋白质","dànbáizhì","dt.","đản bạch chất","protein",1,"","生物体内一种复杂的有机物。","足够的蛋白质","鸡蛋含有丰富的蛋白质。","Trứng gà giàu protein.",[],"Bài tập 3②. SBT câu 18C, D."],[50,"维生素","wéishēngsù","dt.","duy sinh tố","vitamin",1,"","人和动物营养、生长所必需的某些少量有机化合物。","水和维生素","水果含有多种维生素。","Hoa quả chứa nhiều vitamin.",[],"Bài 30 khởi động: nhóm <span class='zh'>素</span>."],[51,"不愧","búkuì","phó.","bất quý","xứng đáng",1,"","当之无愧，常跟“为”或“是”连用。","您真不愧是这方面的专家","他不愧是冠军。","Anh ấy xứng đáng là nhà vô địch.",[],"Bài tập 2⑥. SBT câu 19D, 36B."],[52,"定期","dìngqī","tt.","định kỳ","định kỳ, theo kỳ hạn",1,"","有一定期限的；有一定期限地。","能定期和您做些交流","定期体检。","Khám sức khỏe định kỳ.",[],"Bài tập 3②."],[53,"联络","liánluò","đgt.","liên lạc","liên lạc, liên hệ",1,"","彼此交接；接上关系。","以后我们可以多联络","毕业后我们一直保持联络。","Sau khi tốt nghiệp chúng tôi vẫn giữ liên lạc.",[],""],[54,"保重","bǎozhòng","đgt.","bảo trọng","chú ý giữ gìn sức khỏe",1,"","（希望别人）注意身体健康。","多多保重","您多保重！","Ngài giữ gìn sức khỏe nhé!",[],""]],extra:[["太极剑","tàijíjiàn","thái cực kiếm"],["体质","tǐzhì","thể chất"],["抽象思维 · 形象思维","chōuxiàng · xíngxiàng sīwéi","tư duy trừu tượng · tư duy hình tượng"],["钱学森","Qián Xuésēn","Tiền Học Sâm (nhà khoa học)"],["条件反射","tiáojiàn fǎnshè","phản xạ có điều kiện"],["懒惰 · 惰性","lǎnduò · duòxìng","lười biếng · tính ỳ"],["咬牙","yǎoyá","nghiến răng (cố gắng)"],["御寒","yùhán","chống rét"],["排汗","pái hàn","toát mồ hôi"],["勉强","miǎnqiǎng","miễn cưỡng, gắng gượng"]],T:[{zh:"记者：王老师，欢迎您到我们节目来做客。今天来的都是您的忠实观众，大家特别愿意和您这样的大专家进行交流。\n王老师：“专家”不敢当，有这样的机会，我也很高兴。",vn:"Phóng viên: Thầy Vương, chào mừng thầy đến làm khách chương trình. Hôm nay đến đây đều là khán giả trung thành của thầy, mọi người rất muốn giao lưu với chuyên gia lớn như thầy.\nThầy Vương: “Chuyên gia” thì không dám nhận, có dịp thế này tôi cũng rất vui.",idea:"Chào hỏi.",q:["王老师怎么回应“大专家”的称呼？"],note:[["“专家”不敢当","Khiêm tốn từ chối lời khen."]]},{zh:"记者：那天采访您，在公园走廊那儿，您和您徒弟是练气功还是练太极剑呢？\n王老师：哦，不是徒弟，是气功协会的气功爱好者。\n记者：你们的气功不是那种力量一爆发，能瞬间把好几块砖就给劈开的啊？\n王老师：那只是气功的一种。气功还是中国独特的健身方法之一，可以增强体质，促进慢性病康复，还可以辅助治疗某些疾病。",vn:"Phóng viên: Hôm phỏng vấn thầy ở hành lang công viên, thầy và đồ đệ đang tập khí công hay thái cực kiếm vậy?\nThầy Vương: À, không phải đồ đệ, là những người yêu khí công trong hội khí công.\nPhóng viên: Khí công của các thầy không phải loại sức mạnh bùng lên một cái là chẻ đôi được mấy viên gạch ngay à?\nThầy Vương: Đó chỉ là một loại khí công. Khí công còn là một trong những phương pháp rèn luyện độc đáo của Trung Quốc, có thể tăng cường thể chất, giúp bệnh mạn tính hồi phục, còn hỗ trợ điều trị một số bệnh.",idea:"Khí công.",q:["气功的作用有哪些？"],note:[["把好几块砖就给劈开","<span class='zh'>把……给 + V</span> (khẩu ngữ)."],["……之一","Một trong những…"]]},{zh:"记者：看来我是误解气功了。最近有个调查，广大群众的健身意识在逐年提升。对于健康，您能对我们说点儿什么吗？\n王老师：健康的新概念不仅是不生病，还包括心理健康和社会交往方面的能力，甚至有人提出健康五要素，包括身体、情绪、智力、精神和社交，这五个方面共同构成健康的完美状态。有句名言：生命在于运动，其实健康也在于运动。当然要达到预期效果，怎样运动很重要。",vn:"Phóng viên: Xem ra tôi đã hiểu sai khí công. Gần đây có một cuộc điều tra, ý thức rèn luyện sức khỏe của đông đảo quần chúng tăng lên từng năm. Về sức khỏe, thầy có thể nói đôi điều không?\nThầy Vương: Khái niệm sức khỏe mới không chỉ là không ốm, mà còn gồm sức khỏe tâm lý và năng lực giao tiếp xã hội; thậm chí có người đưa ra năm yếu tố sức khỏe: thể chất, cảm xúc, trí lực, tinh thần và giao tiếp — năm mặt này cùng tạo nên trạng thái sức khỏe hoàn hảo. Có câu danh ngôn: sống là phải vận động, thực ra sức khỏe cũng nằm ở vận động. Đương nhiên, muốn đạt hiệu quả mong đợi thì vận động thế nào rất quan trọng.",idea:"Khái niệm sức khỏe.",q:["健康包括哪些方面？"],note:[["在逐年提升","Xem Ngữ pháp 1: <span class='zh'>逐</span>."],["不仅……，还……，甚至……","Tăng tiến."]]},{zh:"记者：那您就着重跟我们谈谈运动的学问吧。\n王老师：要健康，首要问题是勤于运用大脑，人的大脑不用也会生锈。大家知道，人脑左半球主管抽象思维，右半球主管形象思维，二者有分工有联系。左右脑交替使用，思维常可以放射出新的火花。著名科学家钱学森的夫人是音乐家，钱学森的很多重要科学理论不是端端正正地坐在桌子前面想出来的，而是听过音乐之后冒出来的。科学运用左右脑，工作的高效和防止脑衰就成为了可能。大脑潜力巨大，它是人体衰退最慢的器官。一些养生著作中指出，人用脑越勤，大脑各神经细胞之间的联系越多，形成的条件反射也越多。",vn:"Phóng viên: Vậy thầy hãy tập trung nói với chúng tôi về học vấn vận động nhé.\nThầy Vương: Muốn khỏe, vấn đề hàng đầu là chăm dùng não; não người không dùng cũng sẽ “gỉ”. Ai cũng biết bán cầu não trái phụ trách tư duy trừu tượng, bán cầu phải phụ trách tư duy hình tượng, hai bên vừa phân công vừa liên hệ. Dùng luân phiên não trái – phải, tư duy thường bắn ra tia lửa mới. Phu nhân của nhà khoa học nổi tiếng Tiền Học Sâm là nhà âm nhạc; nhiều lý thuyết khoa học quan trọng của ông không phải ngồi ngay ngắn trước bàn mà nghĩ ra, mà nảy ra sau khi nghe nhạc. Dùng não trái – phải một cách khoa học thì làm việc hiệu quả và chống lão hóa não đều có thể. Tiềm năng của não rất lớn, nó là cơ quan suy thoái chậm nhất. Một số sách dưỡng sinh chỉ ra: người càng dùng não chăm, liên hệ giữa các tế bào thần kinh càng nhiều, phản xạ có điều kiện hình thành cũng càng nhiều.",idea:"① Chăm dùng não.",q:["为什么说要勤于运用大脑？"],note:[["首要问题是……","Thứ nhất (liệt kê)."],["不是……，而是……","Không phải… mà là…"],["越……，越……，也越……","Càng… càng…"]]},{zh:"记者：大脑就像我们身体的指挥中心，大脑不健康，人就谈不上健康。\n王老师：对。其次呢，运动贵在坚持。懒惰是人天生的弱点，所以不要迁就自己，要以坚定的意志，坚韧的精神克服惰性，下狠心咬牙坚持，绝不能半途而废。\n记者：王老师，您怎么好像在说我呢？我就不想虐待自己，所以很难坚持。\n王老师：怎么会是虐待呢？你以后联系我，我带你锻炼。咱们有计划，有落实。运动健身归根到底是自己的事，胡乱对付其实是在骗自己，坚持运动也是培养人的意志力、完善人格的过程。",vn:"Phóng viên: Não giống như trung tâm chỉ huy của cơ thể, não không khỏe thì người không thể nói là khỏe.\nThầy Vương: Đúng. Thứ hai, vận động quý ở kiên trì. Lười biếng là điểm yếu bẩm sinh của con người, nên đừng chiều bản thân, phải dùng ý chí kiên định, tinh thần bền bỉ để khắc phục tính ỳ, quyết tâm nghiến răng kiên trì, tuyệt đối không bỏ dở nửa chừng.\nPhóng viên: Thầy Vương, sao nghe như thầy đang nói tôi vậy? Tôi chỉ không muốn “ngược đãi” bản thân nên khó kiên trì.\nThầy Vương: Sao lại là ngược đãi? Sau này anh liên hệ tôi, tôi dẫn anh tập. Chúng ta có kế hoạch, có thực hiện. Rèn luyện suy cho cùng là việc của mình, làm qua quýt thực ra là tự lừa mình; kiên trì vận động cũng là quá trình bồi dưỡng ý chí, hoàn thiện nhân cách.",idea:"② Kiên trì.",q:["为什么说运动贵在坚持？"],note:[["我就不想虐待自己","Xem 修辞: 大词小用 — “虐待” dùng cho việc nhỏ."],["归根到底","Xem Ngữ pháp 2."],["胡乱对付","Xem 辨析 胡乱—随便."]]},{zh:"记者：看来运动真不是小事，还间接体现着我们的品行呢。\n王老师：另外，冬季健身好处很多，可以提高人的御寒能力；冬天阳光中的紫外线对人体有消毒作用，还能促进对钙的吸收；冬天空气中二氧化碳浓度比夏天低，所以冬天运动对身体更为有利；运动还可以使人心情舒畅。许多保健食品都宣扬能够促进健康，其实运动才是维护健康最好的方法。",vn:"Phóng viên: Xem ra vận động đúng là không phải chuyện nhỏ, còn gián tiếp thể hiện phẩm hạnh của chúng ta.\nThầy Vương: Ngoài ra, rèn luyện mùa đông rất nhiều lợi ích: nâng cao khả năng chống rét; tia tử ngoại trong nắng mùa đông có tác dụng khử trùng cơ thể, còn giúp hấp thu canxi; nồng độ CO₂ trong không khí mùa đông thấp hơn mùa hè nên tập mùa đông có lợi hơn; vận động còn khiến tâm trạng thoải mái. Nhiều thực phẩm chức năng quảng cáo giúp tăng cường sức khỏe, thật ra vận động mới là cách giữ gìn sức khỏe tốt nhất.",idea:"③ Tập mùa đông.",q:["冬季健身有哪些好处？"],note:[["……；……；……","Liệt kê bằng dấu chấm phẩy."],["其实……才是……","Thật ra… mới là…"]]},{zh:"记者：运动对皮肤是不是也有好处？\n王老师：运动能令全身排汗，毛孔内的垃圾及多余油脂会被排走，皮肤自然会更好。\n记者：运动是不是也要讲究科学？\n王老师：当然。运动健身要循序渐进，不要急于求成；不适合自己身体状况的剧烈运动或大幅度动作尽量别勉强。\n记者：运动之后，我们常常觉得又渴又饿，运动和饮食之间有什么讲究吗？\n王老师：锻炼后是肌肉细胞的“进食时间”，它们渴望得到足够的蛋白质、水和维生素。运动后的两小时，是补充营养的最佳时机。",vn:"Phóng viên: Vận động có lợi cho da không?\nThầy Vương: Vận động khiến toàn thân ra mồ hôi, chất bẩn và dầu thừa trong lỗ chân lông bị đẩy ra, da tự nhiên đẹp hơn.\nPhóng viên: Vận động có cần chú ý khoa học không?\nThầy Vương: Đương nhiên. Rèn luyện phải từ từ từng bước, đừng nóng vội; vận động mạnh hay động tác biên độ lớn không hợp thể trạng thì cố gắng đừng gượng ép.\nPhóng viên: Sau khi tập, chúng tôi thường vừa khát vừa đói, giữa vận động và ăn uống có điều gì cần chú ý?\nThầy Vương: Sau khi tập là “giờ ăn” của tế bào cơ, chúng khao khát đủ protein, nước và vitamin. Hai giờ sau vận động là thời điểm tốt nhất để bổ sung dinh dưỡng.",idea:"④ Tập khoa học.",q:["运动要怎样讲究科学？运动后应该怎么补充营养？"],note:[["是不是也要……？","Hỏi xác nhận."],["尽量别勉强","Cố gắng đừng gượng."]]},{zh:"记者：王老师，您真不愧是这方面的专家，以后要是能定期和您做些交流就好了。\n王老师：这是我的联系方式，以后我们可以多联络。希望大家回去以后坚持锻炼，多多保重。",vn:"Phóng viên: Thầy Vương, thầy thật xứng danh chuyên gia lĩnh vực này, sau này mà được định kỳ giao lưu với thầy thì tốt quá.\nThầy Vương: Đây là thông tin liên hệ của tôi, sau này chúng ta liên lạc nhiều nhé. Mong mọi người về nhà kiên trì tập luyện, giữ gìn sức khỏe.",idea:"Kết thúc.",q:[],note:[["不愧是……","Xứng đáng là…"],["要是……就好了","Giá mà… thì tốt."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章修辞 & từ vựng",G:[{id:"g1",grp:0,word:"逐年",zh:"逐",py:"zhú",tag:"Chú thích 1 · giới từ",mean:"Giới từ, nghĩa là <b>lần lượt theo thứ tự</b> — “từng…, dần từng…”. Hay gặp: <span class='zh'>逐年 · 逐月 · 逐日 · 逐个 · 逐步 · 逐字逐句</span>.",forms:["逐 + 年 / 月 / 日 / 个 / 步 + V","逐字逐句（地）+ V"],ex:[["最近有个调查，广大群众的健身意识在逐年提升。","",1],["雨季快到了，对大大小小的水库，要逐个检查，以排除安全隐患。","Mùa mưa sắp đến, các hồ chứa lớn nhỏ phải kiểm tra từng cái để loại bỏ nguy cơ."],["他花了一年多时间，逐字逐句地反复推敲，再三修改，终于完成了整套书的翻译工作。","Ông mất hơn một năm, cân nhắc từng chữ từng câu, sửa đi sửa lại, cuối cùng dịch xong cả bộ sách."]],tips:["Bài tập 2②. SBT câu 22A."],practice:{q:"请把下列6个小句组合成3个连贯的语段：A. 人类要生存和发展，社会要延续和进步，就必须将社会实践中积累起来的经验逐步完善起来　B. 他们的小店开门了，由于经营有道　C. 并把更成熟、完善的经验传给下一代　D. 想当年他们的企业也是国内名牌，短短几个月就开发了十来个新品投放市场　E. 同时符合市场需求，营业额逐日增加　F. 产品产量逐月提高，资金迅速回笼",type:"complete",items:[["语段（1）：? + ?","A + C"],["语段（2）：? + ?","B + E"],["语段（3）：? + ?","D + F"]]}},{id:"g2",grp:1,word:"归根到底",zh:"归根到底",py:"guīgēn-dàodǐ",tag:"Chú thích 2 · 插入语",mean:"<b>Thành phần chêm (插入语)</b>, nghĩa là <b>xét từ gốc rễ</b> — “suy cho cùng”. Cũng nói <span class='zh'>归根结底</span>. Cách nói gần nghĩa: <span class='zh'>说到底 · 从根本上说 · 一句话 · 说白了 · 说穿了</span>.",forms:["S + 归根到底 + 是……","归根结底 / 说到底 / 说白了，……"],ex:[["运动健身归根到底是自己的事，胡乱对付其实是在骗自己。","",1],["世界是你们的，也是我们的，但归根结底是你们的。","Thế giới là của các bạn, cũng là của chúng tôi, nhưng suy cho cùng là của các bạn."],["地区差别、城乡差别、贫富差别等问题，从根本上说，都是经济社会发展不平衡的问题。","Chênh lệch vùng miền, thành thị – nông thôn, giàu nghèo… về căn bản đều là vấn đề phát triển không cân bằng."],["……但为什么他们会在街头或地铁站里表演呢？说白了就是一种生活方式。","…Nói trắng ra đó là một lối sống. (SBT bài 28 câu 22)"]],tips:["Bài 28: <span class='zh'>说白了</span>.","SBT câu 23B."],practice:{q:"为括号中的插入语选择合适的位置",type:"pos",items:[["A他爸爸上周B刚给他寄来了生活费，C他却告诉我没钱，D就是不想借。（说穿了）","D","……他却告诉我没钱，说穿了就是不想借。"],["从今天起，A她的电话、短信、邮件，B我一概不理，C凡是与她有关的消息我也不听，D我和她彻底绝交了。（一句话，）","C/D","Đáp án sách: C — đặt trước câu tổng kết."],["所谓史学，A就是B研究和阐述人类社会历史C发展过程D及其规律的一门学科和科学。（说到底）","A","所谓史学，说到底就是……"]]}},{id:"g3",grp:1,word:"半途而废",zh:"Thành ngữ trong bài",py:"",tag:"Từ vựng",mean:"<span class='zh'>半途而废</span> = bỏ dở nửa chừng. <span class='zh'>循序渐进</span> = từng bước. <span class='zh'>急于求成</span> = nóng vội. <span class='zh'>不敢当</span> = không dám nhận (khiêm tốn). <span class='zh'>不愧</span> = xứng đáng.",forms:["绝不能半途而废","要循序渐进，不要急于求成","不愧是 / 不愧为……"],ex:[["要以坚定的意志，坚韧的精神克服惰性，下狠心咬牙坚持，绝不能半途而废。","",1],["运动健身要循序渐进，不要急于求成。","",1],["您真不愧是这方面的专家。","",1]],tips:["Bài tập 2①⑤⑥."]},{id:"g4",grp:1,word:"胡乱",zh:"胡乱 / 随便",py:"húluàn / suíbiàn",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa <b>qua loa, không nghiêm túc</b>. <span class='zh'>胡乱</span>: chỉ là phó từ, đứng trước động từ, không có dạng AABB. <span class='zh'>随便</span>: là tính từ (làm vị ngữ, định ngữ), có dạng <span class='zh'>随随便便</span>, còn làm liên từ = “bất kể”.",forms:["胡乱 + V","随便（的人）/ 随随便便 / 随便 + 疑问词，都……"],ex:[["胡乱对付其实是在骗自己。","",1]],tips:["<span class='zh'>×说话很胡乱 · ×胡胡乱乱</span>."]}],BX:{grp:1,word:"胡乱",cols:["√","×"],pair:"胡乱 — 随便",same:["Đều có thể biểu thị “<b>qua loa, không nghiêm túc</b>”.","他胡乱 / 随便吃了两口就走了。"],diff:[["<b>Phó từ</b>, chỉ đứng trước động từ, không làm vị ngữ, không bổ nghĩa cho danh từ.","他在纸上胡乱画了几笔。（√）　他这个人说话很胡乱。（×）","<b>Tính từ</b>, làm được vị ngữ, bổ nghĩa cho danh từ.<div class='zh' style='margin-top:4px'>A：中午吃什么呢？B：随便。（√）　他不是个随便的人。（√）</div>"],["Không có dạng lặp AABB.","胡胡乱乱（×）","Có dạng lặp AABB.<div class='zh' style='margin-top:4px'>我对他这种随随便便的工作态度很不满。（√）</div>"],["Không có cách dùng này.","—","Làm <b>liên từ</b>, nghĩa “bất kể”.<div class='zh' style='margin-top:4px'>随便我怎么说，他就是不听。</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["我当时只是随便答应的，没想到他认真了。",0,"<span class='zh'>随便</span> trước động từ — đúng."],["A：假期想去哪儿玩儿？B：胡乱。",1,"<span class='zh'>胡乱</span> không đứng độc lập làm vị ngữ → <span class='zh'>随便</span>."],["话剧也好，京剧也好，胡乱什么戏，他都爱看。",1,"Nghĩa “bất kể” (liên từ) → <span class='zh'>随便什么戏</span>."],["无数事实告诉我们，没有人可以随随便便成功。",0,"<span class='zh'>随随便便</span> (AABB) — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>坚</u>定","坚韧 · 坚持 · 坚强 · 坚决"],items:[["走<u>廊</u>","廊","廊子 · 长廊 · 画廊 · 游廊"],["误<u>解</u>","解","解释 · 解除 · 解锁 · 解开"],["预<u>期</u>","期","期盼 · 期望 · 期间 · 期限"],["<u>衰</u>退","衰","衰老 · 衰败 · 衰弱 · 衰微"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["A：你对中国了解得如此深入，真是个中国通。B：________。","不敢当","不敢当。"],["产品的销量________。","逐年","产品的销量逐年增加。"],["面对市场竞争，________。","首要","面对市场竞争，首要任务是保证产品质量。"],["对孩子的坏习惯________。","迁就","对孩子的坏习惯不能一味迁就。"],["无论做什么事情________。","半途而废","无论做什么事情都不能半途而废。"],["他在这个专业成就非凡，________。","不愧","他在这个专业成就非凡，不愧是行业楷模。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["气功","徒弟","群众","协会","剑"],text:"我是武术{协会}的成员，每天我们都在公园里练习，有时练习{气功}，有时练习太极{剑}。现在广大{群众}的健身意识都增强了，我还收了好几个{徒弟}呢。"},{bank:["预期","定期","钙","蛋白质","急于求成"],text:"最近的一次体检结果显示，我有点儿缺{钙}。大夫让我多晒晒太阳，多补充{蛋白质}，然后{定期}到医院检查。但是补钙也不能{急于求成}，只要每天坚持，就能达到{预期}的效果。"}]},EX4:{q:"请指出下列语段中大词小用的例子",items:[{src:"",task:"平静的教室里爆发了第三次世界大战。",model:"“第三次世界大战” — chỉ một trận cãi nhau / ồn ào trong lớp."},{src:"",task:"我从小就喜欢读书。开始，我读的是带拼音的童话书，年龄稍长，我的野心膨胀，开始了移民扩张：获奖的作文和古典名著都成了我涉猎的对象。",model:"“移民扩张” — chỉ việc mở rộng phạm vi đọc sách."},{src:"",task:"初学自行车的我，竟想对一个小土坡发起进攻。我先后退几步，然后上车猛骑过去，“砰！轰！”沙土飞溅，灰尘飞扬，我连人带车摔了个四脚朝天。",model:"“发起进攻” — chỉ việc đạp xe lên dốc nhỏ."},{src:"",task:"爸爸、妈妈和我，在家里谁也不服谁，形成了三国鼎立之势。",model:"“三国鼎立” — chỉ ba người trong nhà không ai chịu ai."}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["气功的作用有哪些？","健身、增强……、促进……、辅助治疗……","气功是中国独特的健身方法之一，可以增强体质，促进慢性病康复，还可以辅助治疗某些疾病。"],["健康包括哪些方面？","① 不生病、心理、社会交往 ② 健康五要素","健康不仅是不生病，还包括心理健康和社会交往能力；健康五要素包括身体、情绪、智力、精神和社交。"],["运动的学问①","勤于运用大脑：左脑……，右脑……","首要的是勤于运用大脑。左脑主管抽象思维，右脑主管形象思维，左右脑交替使用，可以提高效率，防止脑衰。"],["运动的学问②","贵在坚持：不要迁就、不能半途而废、有计划、有落实","运动贵在坚持，不要迁就自己，不能半途而废，要有计划、有落实。"],["运动的学问③","冬季健身好处多：紫外线、二氧化碳、心情、皮肤","冬季健身能提高御寒能力；紫外线能消毒、促进钙的吸收；冬天二氧化碳浓度低；运动还能使人心情舒畅，皮肤更好。"],["运动的学问④","讲究科学：循序渐进、锻炼后进食","运动要循序渐进，不要急于求成；运动后两小时是补充蛋白质、水和维生素的最佳时机。"]]},PZ:{title:"修辞（7）大词小用",vn:"Dùng từ lớn cho việc nhỏ",intro:"Đem một từ có <b>phạm vi, khái niệm lớn</b> dùng cho sự vật có phạm vi, khái niệm <b>nhỏ</b>, để tô đậm, làm nổi bật, tạo ấn tượng mạnh (thường mang sắc thái hài hước) — gọi là <b>大词小用</b>.",ex:[["记者：王老师，您怎么好像在说我呢？我就不想虐待自己，所以很难坚持。","“虐待” vốn chỉ “đối xử bằng thủ đoạn tàn bạo”; ở đây phóng viên chỉ là không kiên trì tập được."],["和朋友冷战了两周后，我们终于在老师的斡旋下恢复了邦交正常化。","“冷战 · 斡旋 · 邦交正常化” là từ ngoại giao, dùng cho chuyện hai bạn giận nhau."],["忽听一声门响，原来是妈妈大人光临了。","“大人 · 光临” trang trọng, dùng cho mẹ về nhà."]],q:"下列哪句没有使用大词小用的修辞手法",pvn:"(1) 昨天我们俩还一块儿逛街，今天他就不理我了，我一定得找他问个明白。　(2) 经过几次谈判，我终于和父母签订了每周打游戏的条约。　(3) 小儒放学回家，要看电视。可是又着急上厕所，担心爸爸占用电视，连忙冲妈妈喊：“妈妈，您赶紧来帮我捍卫电视，免得被爸爸占领了！”",practice:[["Câu nào KHÔNG dùng 大词小用？","(1). Câu (2) dùng “谈判 · 签订 · 条约”; câu (3) dùng “捍卫 · 占领”."]]},DP:[{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ để đoán nghĩa cả từ.",items:[["偏差","piānchā","sai lệch","偏：不正，倾斜 · 差：差错","工作中出现了一些偏差。"],["名额","míng'é","chỉ tiêu (số người)","名：名字 · 额：规定的数目","今年的招生名额增加了。"],["致辞","zhìcí","phát biểu (chúc mừng)","致：向人表达 · 辞：言辞","校长在毕业典礼上致辞。"],["屏障","píngzhàng","bức chắn, lá chắn","屏：遮挡 · 障：用来遮挡或防卫的东西","森林是城市的绿色屏障。"],["倾斜","qīngxié","nghiêng","倾：不正，歪 · 斜：不正","这座塔有点儿倾斜。"],["清除","qīngchú","loại bỏ sạch","清：一点儿不留 · 除：去掉","清除路上的积雪。"],["手势","shǒushì","cử chỉ tay","手：人体上肢腕以下的部分 · 势：姿势","他做了个“OK”的手势。"],["挽回","wǎnhuí","cứu vãn","挽：扭转，拉 · 回：还，返回","挽回损失。"],["威力","wēilì","uy lực","威：使人敬畏的声势 · 力：力量，能力","这种武器威力很大。"],["挑衅","tiǎoxìn","khiêu khích","挑：搬弄是非，引起纠纷 · 衅：争端","不要理会他的挑衅。"],["压榨","yāzhà","ép; bóc lột","压：对物体施加压力 · 榨：用力压出","压榨甘蔗汁。"],["压制","yāzhì","áp chế","压：用强力制服 · 制：限定，用强力约束","不能压制不同意见。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"《梦溪笔谈》是中国北宋大科学家沈括的传世著作。沈括在晚年用笔记文学体裁写成《梦溪笔谈》，内容涉及天文、数学、物理、化学、地学、生物以及冶金、机械、造纸技术等各个方面，是中国科学史上的重要著作。",o:["沈括是第一位笔记文学作者","沈括是《梦溪笔谈》的出版商","《梦溪笔谈》的学术价值非常高","北宋是中国科学技术发展的黄金时期"],a:2,why:"“是中国科学史上的重要著作”. Có <span class='zh'>著作</span>."},{n:2,say:"“家庭暴力”有广义、狭义之分。有人认为，广义的家庭暴力是指对家庭成员进行肉体上以及精神上的折磨、伤害和虐待的行为；狭义的家庭暴力指丈夫对妻子进行肉体上的摧残、虐待和伤害。",o:["“广义”“狭义”基本没区别","广义的家庭暴力包括精神伤害","家庭中丈夫虐待妻子现象广泛存在","家庭暴力只发生在丈夫与妻子之间"],a:1,why:"“肉体上以及精神上的折磨”. Có <span class='zh'>虐待 · 摧残</span>."},{n:3,say:"朋友认为自己病了，而且病得很重。医生说没什么大碍，家人也说心情舒畅就会好的。可他不信，认为医生和家人联合起来骗他。他的疑心越来越重，面容越来越憔悴，直到有一天真的生了一场大病。",o:["医生给病人胡乱诊断了一通","狠心的家人不承认朋友病了","朋友心思太重，终于病倒了","医生骗病人，也是出于好意"],a:2,why:"“疑心越来越重……真的生了一场大病”. Có <span class='zh'>舒畅</span>."},{n:4,say:"张衡断定地球是圆的，月亮是借太阳的照射才反射出光来。他还认为天好像鸡蛋壳，包在地的外面，地好像鸡蛋黄，在天的中间。这种学说虽然不完全精确，但在1800多年前，能有这种见解，也够令人钦佩的了。",o:["张衡认为月亮是发光的","在张衡眼中地球像鸡蛋","张衡的天文学说很精确","张衡是1800多年前的人"],a:3,why:"“在1800多年前，能有这种见解”. A sai: phản chiếu ánh mặt trời. Có <span class='zh'>反射</span>."},{n:5,say:"“饥饿营销”始终贯穿着“品牌”这个因素。其运作必须依靠产品强势的品牌号召力，也正由于有“品牌”这个因素，饥饿营销是一把双刃剑。用好了，可以使原来就强势的品牌产生更大的附加值；用不好，则会对其品牌造成伤害。",o:["“饥饿营销”有弊有利","“饥饿营销”不可急于求成","“饥饿营销”促使老产品更新换代","为新产品树立品牌应使用“饥饿营销”"],a:0,why:"“双刃剑” — con dao hai lưỡi."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您认为作为裁判，最重要的是什么？\n男：对一切都要公平公正。要公平地看待每一个运动员，一切都要以比赛成绩为准，这是体育赛事成功举办的基石。只有在公平的基础上竞争才有意义。\n女：您认为体育比赛中最激动人心的时刻是什么时候？\n男：对运动员来说，冲过终点线的那一刻，跳过横杆的那一刻，发现自己长久以来的努力得到回报，都是最激动人心的时刻；对观众来说，看到运动员奋力拼搏，感受到了运动之美和生命的活力，就是最激动人心的时刻；对裁判员来说，认真负责地做好本职工作，确保赛事有秩序地进行，让每个运动员能得到应有的肯定，直到运动会完美结束，就是他们最激动的时刻。\n女：您认为一个优秀的运动员应该具有哪些品质？\n男：首要的是敢于拼搏，要不断挑战自我，突破自我，向“更高，更快，更强”努力。第二要懂得尊重，要尊重每一位运动员、每一位工作人员、每一位观众，这样才能通过体育活动促进人与人、国与国的互信互爱。第三要吃苦耐劳，百折不挠。一个缺少坚韧品格的人是不可能取得好成绩的，在体育上是这样，其他领域也是这样。第四要乐于奉献，懂得感恩，体育从来不是一个人的世界，对于他人的帮助要心存感激，还要学会无私地为他人奉献，这才是真正的体育精神。\n女：哦，有道理。还有一个问题，您认为每年举行运动会，意义何在？\n男：运动会的举办是为了给热爱运动的同学们一个展示自我的机会，更是为了带动全校师生强身健体，通过参与赛事使体育成为生活中的一环，养成终身健身的好习惯。",qs:[{n:6,q:"男的认为作为裁判，最重要的是什么？",o:["要有丰富的体育知识","要努力宣传公平竞争","要平等地对待每一个人","要公允地对待赛场纠纷"],a:2,why:"“要公平地看待每一个运动员”."},{n:7,q:"关于最激动人心的时刻，下列哪项正确？",o:["运动员开始比赛的时刻","漂亮运动员出场的时刻","裁判受到大家肯定的时刻","观众看到精彩赛事的时刻"],a:3,why:"“对观众来说，看到运动员奋力拼搏……”."},{n:8,q:"关于优秀运动员应有的品格，下列哪项正确？",o:["要舍得拼命","要克服自身弱点","要不断地超越自己","要端正对他人的态度"],a:2,why:"“不断挑战自我，突破自我”. Có <span class='zh'>首要 · 坚韧</span>."},{n:9,q:"关于每年举行运动会，男的有什么看法？",o:["运动会可以进入大家的生活","希望带动师生重视日常锻炼","可以强化师生保重身体的意识","给身体好的人一个炫耀的机会"],a:1,why:"“带动全校师生强身健体……养成终身健身的好习惯”."},{n:10,q:"根据对话，可以知道什么？",o:["女的采访的是学校的运动会","运动会每次都邀请专业运动员","男的在运动会中取得了好成绩","运动会让女的养成终身健身的习惯"],a:0,why:"“带动全校师生” → đây là đại hội thể thao của trường."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"游泳运动总是在一届又一届的赛事中超越以前的纪录，而田径运动中许多项目的纪录却长时间停滞。过去20年来，在16届游泳赛事中各项纪录共被打破275次，而在24届田径赛事中各项纪录仅被打破166次，其中38次是撑杆跳创造的新纪录。在游泳运动中，任何一项创造于2008年以前的世界纪录都没能保持到现在，而在田径运动中，还有许多纪录是20世纪90年代之前创下的。\n导致这种不同的原因之一，是游泳作为运动的历史更短，在生物力学和技术等方面，还有许多需要研究和改进之处。其次，与游泳相比，跑、跳和投掷是人类遗传密码里带有的动作，这导致田径运动领先了游泳很多年。",qs:[{n:11,q:"游泳运动发展情况怎样？",o:["赛事最为频繁","成绩提高幅度有限","过去的20年举行了16次比赛","2008年以前的世界纪录都被打破了"],a:3,why:"“任何一项创造于2008年以前的世界纪录都没能保持到现在”."},{n:12,q:"田径运动发展情况怎样？",o:["和游泳比，赛事少得多","刷新纪录是件很困难的事","运动员水平基本没有提高","撑竿跳连续38年创造了新纪录"],a:1,why:"“纪录却长时间停滞”."},{n:13,q:"根据这段话，可以知道什么？",o:["游泳比田径运动更加成熟","田径的发展是循序渐进的","田径运动中很多动作有遗传因素","游泳纪录的诞生是科学家的功劳"],a:2,why:"“跑、跳和投掷是人类遗传密码里带有的动作”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"英国国民保健制度(NHS)发表在官网上的忠告称，“久坐对健康有害，不管你进行多少运动都无济于事。”“越来越多的证据”显示，肥胖、2型糖尿病、某些种类的癌症以及早逝均与久坐有关。NHS建议每坐30分钟就起来活动一下。它援引健康专家的话说：“必须打断坐着的状态。”“做些需要站起来完成的事，比如冲咖啡和聊天，甚至是写封信——海明威就是站着写小说的。”\n然而，英国一项新的研究结果证实：只要定期活动，坐着并不比站着对健康的危害更大。\n研究人员对5000多人开展了为期16年的跟踪调查，他们的发现发表在英国《国际流行病学杂志》季刊上。研究结果称：不管是坐着还是站着，任何静止不动、能量消耗低的姿势或许对健康都是有害的。研究发现，在办公、休闲或看电视期间采取坐姿的调查对象并未出现死亡风险增加的情况。\n这一研究结果使人对坐站两用工作台的益处产生了怀疑。目前用人单位越来越多地向员工提供这种工作台，以营造更健康的办公环境。",qs:[{n:14,q:"关于久坐与健康的关系，英国NHS官网上的观点是怎样的？",o:["久坐不利于健康","癌症多少都与久坐有关","久坐是英年早逝的重要原因","大剂量运动可降低久坐的危害"],a:0,why:"“久坐对健康有害”."},{n:15,q:"英国NHS的建议是什么？",o:["每天要坚持运动","每次活动30分钟","隔半小时活动一下","站着写小说、写信"],a:2,why:"“每坐30分钟就起来活动一下”."},{n:16,q:"英国一项新的研究结果是怎样的？",o:["坐着工作比站着工作健康","久坐看电视，死亡风险会增加","久坐不伤害健康，但对姿势有要求","定期活动的话，坐着站着没什么区别"],a:3,why:"“只要定期活动，坐着并不比站着对健康的危害更大”. Có <span class='zh'>定期</span>."},{n:17,q:"根据这段话，可以知道什么？",o:["很多英国人选择站着办公","英国有5000多名研究人员","用人单位越来越怕员工生病","《国际流行病学杂志》是季刊"],a:3,why:"“发表在英国《国际流行病学杂志》季刊上”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["如果指甲劈裂，可在指甲和指甲沟涂些甘油。","我和父亲并排跑着，猛一抬头，竟然发现父亲有了一丝白发。","构成人体的物质有：水、蛋白质、脂肪、糖类、无机盐以及维生素等。","蛋白质对于构成地球上这个绚丽多彩的生物世界有着举足轻重的作用。"],a:1,why:"<b>Dùng lượng từ / từ không hợp</b>: tóc bạc dùng <span class='zh'>几根 / 一缕</span>, “一丝白发” không tự nhiên; câu B là câu sai theo đáp án."},{n:19,o:["她多才多艺，能歌善舞，有一副“永不生锈的嗓子”。","两支球队在赛场上那种认真，那种投入，像极了一个战场。","祁连山位于河西走廊之南，由七条平行走向的山脉和谷地共同组成。","他觉得自己是做出了一些成绩，但是比起对他的评价，着实有些愧不敢当。"],a:1,why:"<b>So sánh không tương xứng</b>: “球队……像战场” → <span class='zh'>赛场像极了战场</span>."},{n:20,o:["初中生骨骼还处在生长阶段，骨骼的钙化程度没有成年人高，骨骼容易变形、弯曲和损伤。","春秋后期我国出现了铸币，有布币、刀币，还有圆钱。圆钱或呈圆廓方孔，或呈圆廓圆孔，主要流通于秦，六国也有铸造，主要流通于北方。","经过这些年，我发现渐渐地变了，真的变了，感觉自己在生活上、学习上、对待朋友上、对待家人上，特别是最要好的朋友，我真的懂得珍惜了。","森林有“绿色金子”之称，它可以把二氧化碳转换成氧气，可以用树木巨大的根系使土壤和水分得到保持，从而有效地控制洪涝灾害和荒漠化的发生。"],a:2,why:"<b>Thiếu tân ngữ / lộn xộn</b>: “我发现渐渐地变了” thiếu “自己”; “特别是最要好的朋友” chen lạc chỗ."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"英国留学归来，他有了很大变化，不仅英国式英语讲得纯正，而且用词___、慎重，即使是和朋友___，也不忘___一下“最后通牒”的形式。",o:["典型　告吹　显摆","规范　断交　玩弄","文明　反目　宣扬","精准　决裂　迁就"],a:1,why:"<span class='zh'>用词规范</span>; <span class='zh'>断交</span>; <span class='zh'>玩弄……形式</span>. Bẫy: <span class='zh'>宣扬 · 迁就</span> là từ mới."},{n:22,text:"随着生活水平的提高，中国人对休闲食品的需求量___上升，加上食品___部门对食品卫生把关越来越严，也使得消费者能够放心地___休闲食品，这就使得休闲食品行业发展的未来更被人们___。",o:["逐年　相关　食用　看好","略微　关联　选用　青睐","坚定　协会　尝试　看中","剧烈　联络　采用　赏识"],a:0,why:"<span class='zh'>逐年上升</span> (ngữ pháp bài này!); <span class='zh'>相关部门</span>; <span class='zh'>食用</span>; <span class='zh'>被人们看好</span>."},{n:23,text:"___教育对经济发展的巨大作用，世界各国的有识之士已逐渐形成一种___：国家间的经济竞争、军事竞争、___国力竞争，在很大程度上是科学技术的竞争、民族素质的竞争，而___是教育的竞争。",o:["出于　共鸣　提高　追本溯源","鉴于　共识　综合　归根到底","落实　认可　增强　百川归海","关于　意识　现有　追根究底"],a:1,why:"<span class='zh'>鉴于</span>; <span class='zh'>形成共识</span>; <span class='zh'>综合国力</span>; <span class='zh'>归根到底</span> (ngữ pháp bài này!)."}]},read3:{ins:"第24–28题：选句填空。",text:"“低温烫伤”，顾名思义，是由于长时间接触高于体温的低热物体所引起的烫伤。在医学上，(24)，人体持续接触44℃的温水6个小时，皮肤就会受到损害。这说明，烫伤的程度不仅取决于烫伤的温度，还要看持续的时间。\n(25)，对于低温烫伤，人体的皮肤在短时间内无法快速反应，特别是体感较弱的老年人可能根本没有感觉。如果低温热源持续作用，就会逐渐发展为真皮深层及皮下各层组织烫伤。人体没有特别的疼痛，皮肤表面看起来烫伤面积也不是很大，(26)，但创面往往比较深。\n医生特别提醒，糖尿病、皮肤敏感性低者以及老年人，都不适合长时间使用发热产品，因为他们往往神经末梢比较迟钝，(27)，也不容易察觉疼痛。同时医生建议，冬季使用能够持续发热的产品时，最好间断使用，比如用半个小时后，隔离一下或拿下来让皮肤透透气，(28)，然后再继续用。",opts:["烫伤皮肤表面也不一定有伤口","也能让局部残留的热量挥发一下","不同于由开水或者明火造成的烫伤或烧伤","曾有一个很经典的实验","皮肤对温度不敏感"],ans:{24:3,25:2,26:0,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"俗话说：“饭后百步走，能活九十九”，在现实生活中，这句话的忠实信奉者不在少数。其实，饭后百步走，怎么个走法，是有讲究的，如果生搬硬套，放下饭碗就立即“百步走”，可能会健身不成，反而伤身。\n从消化生理功能来说，刚吃完饭，胃部正处于充盈状态，这时必须保证胃肠有充足的血液供应，以帮助消化。如果饭后马上散步，血液就会转而流向双腿为其“供能”，这对于年轻人来说影响不大，但对于老年人来说，就会产生一定的负面影响。因为，老年人随着年龄的增长，供血器官心脏和血管会逐步衰退，供血功能也会逐渐降低。当胃肠及下肢都需要大量的血液供应时，势必会加重心脏负担，给健康带来不利影响。\n同时，人胃中的消化液来自进食后的条件反射，胃部饱满，胃液才能分泌旺盛，形成一个良性的消化过程。如果刚进完餐就散步，会延缓胃液的分泌，破坏胃的正常消化，容易诱发消化不良。因此，饭后最好休息片刻，以保证人的肠胃得到更多的血液供应。",qs:[{n:29,q:"关于“饭后百步走，能活九十九”：",o:["如何走，方法要得当","不少人实践后受益了","医生不相信它的真实性","俗语而已，缺少科学性"],a:0,why:"“怎么个走法，是有讲究的”. Có <span class='zh'>忠实 · 衰退 · 反射</span>."},{n:30,q:"从消化生理功能的角度说：",o:["老年人需要血液来消化","刚吃完饭胃处于饱胀状态","血液有时流向胃有时流向腿","饭后马上走血液会更多流向心脏"],a:1,why:"“刚吃完饭，胃部正处于充盈状态”."},{n:31,q:"什么行为可能引发消化不良？",o:["吃得过饱","吃完饭就走路","吃饭速度过快","边吃饭边休息"],a:1,why:"“如果刚进完餐就散步……容易诱发消化不良”."},{n:32,q:"最适合做上文标题的是：",o:["如何让我们更健康","消化不良是怎么回事","饭后百步走，能活九十九","饭后百步走，也要讲时候"],a:3,why:"Ý chính: đi bộ sau ăn phải đúng lúc."}]},{ins:"第33–36题：请选出正确答案。",text:"一项研究显示，聪明的人更喜欢静坐的生活方式，他们很少感到无聊，并且会花更多时间沉静在思绪中。研究人员发现，那些整天进行体育活动的人常常是不爱思考的人，他们活动是为了刺激大脑以逃避思考。《健康心理学杂志》上的一篇研究论文说：“有着较高认知需求的人似乎更满足于精神上的‘自我娱乐’，而认知需求较低的人很容易感到无聊，并且会从更加负面的角度去感受。”\n研究人员首先就“认知需求”对一群学生进行了测试。让他们对一些说法的认同或者不认同程度做出回答，比如“我喜欢那种需要新的解决方法的任务”以及“我只进行最必要的思考”等。为了进一步了解懒惰是否是聪明的表现，研究人员从中挑选了60名大学生进行测试，其中一半被认为是“爱思考的人”，另一半则被认为是“不爱思考的人”，所谓“爱思考”与“不爱思考”都是经过认知需求测试后对他们进行的分类。\n之后，研究人员让他们在7天内一直佩戴一个“体动记录仪”，这个仪器可以记录他们的活动和运动水平，以便研究人员对数据进行分析。结果发现，与“不爱思考的人”相比，“爱思考的人”的活动要少很多。不过在周末的时候，两组的结果差不多。",qs:[{n:33,q:"聪明人喜欢的行为方式是：",o:["沉思","静养","三思而行","左思右想"],a:0,why:"“花更多时间沉静在思绪中”."},{n:34,q:"《健康心理学杂志》上某篇论文的观点是：",o:["人的认知是有差别的","认知需求有高低之分","认知需求低的人比较无聊","认知需求高的人活跃在精神世界"],a:3,why:"“较高认知需求的人……满足于精神上的‘自我娱乐’”."},{n:35,q:"研究人员的测试：",o:["共分为两步走","总共进行了7天","没多少学生感兴趣","解释了懒惰与聪明的关系"],a:0,why:"“首先……测试……之后……佩戴体动记录仪” — hai bước."},{n:36,q:"最适合做上文题目的是：",o:["勤于思考的人可能不爱动","爱动的人不愧是聪明人","静坐也是一种生活方式","运动可排解无聊是一种误解"],a:0,why:"Kết quả: người thích suy nghĩ vận động ít hơn. Có <span class='zh'>勤于 · 不愧</span>."}]}]},W:{zh:"写作",vn:"Viết văn: 运动健身好处多",t:"35 phút",min:!0,task:"这篇课文告诉我们健康包括哪些方面，要想身体健康，应该怎样运动。运动的学问很大，不但包括身体的运动，还包括大脑的运动。你喜欢运动吗？你运动健身的方式是什么？请以“运动健身好处多”为题写一写你是怎样通过运动保持身体健康的，字数不少于400字。",target:400,steps:[["Mở bài","Dẫn câu <span class='zh'>生命在于运动</span>; nói bạn có thích vận động không."],["Cách tập","Bạn tập gì, tập thế nào: <span class='zh'>循序渐进 · 定期 · 有计划，有落实</span>."],["Khó khăn","Lúc muốn bỏ cuộc: <span class='zh'>懒惰是弱点 · 不迁就自己 · 半途而废</span>."],["Lợi ích","Cơ thể, tinh thần, trí óc: <span class='zh'>增强体质 · 心情舒畅 · 精神饱满</span>."],["Kết","<span class='zh'>归根到底</span> + lời khuyên."]],outline:[["一 · 开头","生命在于运动"],["二 · 我的运动","方式、时间、计划"],["三 · 坚持","困难与克服"],["四 · 好处","身体、心情、学习"],["五 · 结尾","归根到底……"]],model:"运动健身好处多\n有句名言说：“生命在于运动。”以前我不太相信，直到自己开始坚持锻炼，才真正体会到运动健身的好处。\n上大学以前，我几乎不运动，每天不是坐在教室里，就是坐在电脑前，常常感冒，学习的时候也容易累。大一那年，我参加了学校的跑步协会，从那以后，我每天早上六点起床，在操场上跑步。刚开始，我只能跑一千米，跑完就喘不过气来。教练告诉我，运动健身要循序渐进，不能急于求成。于是我给自己定了计划：每周增加一点儿距离，有计划，有落实。半年以后，我已经能轻松地跑完五千米了。\n当然，坚持并不容易。冬天早上特别冷，被窝里那么暖和，我好几次都想放弃。可是我知道，懒惰是人天生的弱点，如果迁就自己，就会半途而废。所以我下狠心咬牙坚持，一天也没有停过。\n现在，我很少感冒，体质比以前好多了；每次跑完步，心情都特别舒畅，学习的时候精神也更集中了。更重要的是，坚持运动让我变得更有毅力，做其他事情时也不轻易放弃。我还交到了好几个一起跑步的好朋友，大家互相鼓励，一起进步。\n归根到底，健康是自己的事。我希望大家都能找到适合自己的运动方式，坚持下去，你一定也会发现：运动健身好处多！",check:["Có tiêu đề “运动健身好处多”","Có cách tập cụ thể","Có khó khăn và cách vượt qua","Có lợi ích (thân thể, tinh thần…)","Dùng ít nhất 4: 循序渐进 · 急于求成 · 迁就 · 半途而废 · 归根到底 · 舒畅 · 逐","Không ít hơn 400 chữ"]},SUM:{words:["忠实","不敢当","走廊","徒弟","气功","剑","协会","爆发","劈","误解","群众","逐年","要素","智力","预期","首要","生锈","放射","夫人","端端正正","潜力","衰退","著作","反射","弱点","迁就","坚定","坚韧","狠心","半途而废","虐待","落实","归根到底","胡乱","间接","品行","紫外线","消毒","钙","二氧化碳","舒畅","宣扬","孔","循序渐进","急于求成","剧烈","幅度","蛋白质","维生素","不愧","定期","联络","保重"],patterns:[["逐 + 年 / 个 / 步 + V","广大群众的健身意识在逐年提升。"],["归根到底（插入语）","运动健身归根到底是自己的事。"],["首要……，其次……，另外……","要健康，首要问题是勤于运用大脑……其次呢，运动贵在坚持……另外，冬季健身好处很多……"],["不是……，而是……","不是端端正正地坐在桌子前面想出来的，而是听过音乐之后冒出来的。"],["修辞：大词小用","我就不想虐待自己，所以很难坚持。"]],diff:["胡乱: phó từ, chỉ trước động từ, không AABB (胡乱画了几笔) — 随便: tính từ, làm vị ngữ/định ngữ, có 随随便便, làm liên từ “bất kể” (随便我怎么说)","不敢当 (khiêm tốn) · 不愧 (xứng đáng) · 坚定 (ý chí) / 坚韧 (tinh thần bền bỉ)"],sentences:["健康的新概念不仅是不生病，还包括心理健康和社会交往方面的能力。","懒惰是人天生的弱点，所以不要迁就自己，要以坚定的意志，坚韧的精神克服惰性。","运动健身要循序渐进，不要急于求成。"],hw:["Học thuộc 54 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “运动健身好处多” ≥400 chữ (mục 7).","Đặt 3 câu với 逐… và 3 câu với 归根到底 / 说白了.","Làm Sách bài tập bài 31.","Đọc trước bài 32."]}});
