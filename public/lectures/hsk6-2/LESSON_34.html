<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 34 · 为文物而生的人 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em;white-space:pre-line}
.pvn{white-space:pre-line}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

<script>window.LESSON={id:"hsk6-2-34",num:34,book:"HSK 标准教程 6（下）",unit:{n:9,zh:"古今博览",vn:"Xưa và nay"},title:"为文物而生的人",vn:"Một người dành cả cuộc đời cho các di vật văn hóa",chars:1299,source:"改编自《北京青年报》文章《孙瀛洲曾捐上千文物给故宫 后人称是明智之举》",goals:["Đọc hiểu bài ký sự 1299 chữ về <b>Tôn Doanh Châu</b> — nhà sưu tầm, giám định gốm sứ cổ, năm 1956 hiến tặng hơn 3000 cổ vật cho Cố Cung, cả đời giản dị và tận tụy với văn vật.","Dùng được 51 từ mới, nhất là nhóm <b>văn vật – sưu tầm</b>: <span class='zh'>陶瓷 · 收藏 · 鉴定 · 文物 · 图案 · 皇帝 · 手艺 · 结晶 · 朝代 · 泛滥 · 威信 · 泰斗</span> và nhóm <b>phẩm chất – thái độ</b>: <span class='zh'>朴素 · 温和 · 无偿 · 吝啬 · 不惜 · 神圣 · 拥护 · 争气 · 沾光 · 品质 · 乐意 · 精益求精</span>.","Nắm <span class='zh'>尚且 · 当（介词）</span>.","Phân biệt <span class='zh'>温和 — 温柔</span>; làm quen <b>篇章 (5): 过渡 — chuyển tiếp</b>.","Viết 缩写 bài khóa ≈400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 · Đoạn 1–5 · 尚且 · 当"],["Buổi 2","Nhóm 3 · Đoạn 6–11 · 温和—温柔 · 过渡 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"起",name:"Ông lão giản dị",paras:"Đoạn 1",zh:"衣着朴素 · 性情温和 · 坐公交上班",vn:"Ông lão ăn mặc giản dị, đi xe buýt đến Cố Cung làm việc — nhà sưu tầm, giám định Tôn Doanh Châu."},{tag:"承",name:"Năm 1956",paras:"Đoạn 2–4",zh:"无偿捐赠3000余件 · 斗彩三秋杯",vn:"Hiến tặng không công hơn 3000 cổ vật, trong đó có đôi chén 斗彩三秋 độc nhất vô nhị."},{tag:"转",name:"Lai lịch & con người",paras:"Đoạn 5–8",zh:"学徒 → 古玩店 · 吝啬却不惜重金 · 神圣的使命",vn:"Học việc từ 13 tuổi, tự mở tiệm; sống cực tiết kiệm nhưng sẵn sàng bỏ nhiều tiền mua cổ vật; con cháu ủng hộ, không dựa hơi cha."},{tag:"合",name:"Bậc thầy",paras:"Đoạn 9–11",zh:"精益求精 · 国家级“大家” · 培养人才",vn:"Sờ tay là biết triều đại; được công nhận là “大家” cấp quốc gia; truyền nghề không giữ lại."}],warm1:{q:"请对照图片熟悉下列物品的名称，并说一说你在哪儿见过这些东西。",vn:"Bạn từng thấy những thứ này chưa? Bấm 有 (có) / 无 (chưa).",items:[["🏺","斗彩 dòucǎi","Gốm “đấu thái” (men màu phối)"],["🍡","糖葫芦 tánghúlu","Kẹo hồ lô (sơn tra bọc đường)"],["🍶","陶瓷 táocí","Đồ gốm sứ"],["🕰️","古玩 gǔwán","Đồ cổ"]],talk:["你在哪儿见过这些东西？博物馆？古玩市场？","你家里有没有什么老物件？"],link:"<span class='zh'>故宫博物院</span> = Bảo tàng Cố Cung (Tử Cấm Thành, Bắc Kinh)."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"衣",rule:"衣 = <b>quần áo</b>.",w:[["衣着","yīzhuó","ăn mặc (có trong bài)"],["衣服","yīfu","quần áo"],["衣柜","yīguì","tủ áo"],["衣架","yījià","móc áo"],["衣领","yīlǐng","cổ áo"],["衣物","yīwù","quần áo đồ dùng"],["大衣","dàyī","áo khoác"],["衬衣","chènyī","áo sơ mi"],["风衣","fēngyī","áo gió"],["毛衣","máoyī","áo len"],["睡衣","shuìyī","đồ ngủ"],["外衣","wàiyī","áo ngoài"]]},{k:"家",rule:"家 = <b>người có chuyên môn (nhà…)</b>.",w:[["收藏家","shōucángjiā","nhà sưu tầm (có trong bài)"],["鉴定家","jiàndìngjiā","nhà giám định (có trong bài)"],["科学家","kēxuéjiā","nhà khoa học"],["艺术家","yìshùjiā","nghệ sĩ"],["画家","huàjiā","họa sĩ"],["作家","zuòjiā","nhà văn"],["政治家","zhèngzhìjiā","chính trị gia"],["音乐家","yīnyuèjiā","nhạc sĩ"],["名家","míngjiā","danh gia"],["专家","zhuānjiā","chuyên gia"],["大家","dàjiā","bậc thầy"]]},{k:"册",rule:"册 = <b>sổ, tập, quyển</b>.",w:[["造册","zàocè","lập sổ (có trong bài)"],["注册","zhùcè","đăng ký"],["表册","biǎocè","sổ biểu"],["分册","fēncè","tập con"],["画册","huàcè","tập tranh"],["名册","míngcè","danh sách"],["史册","shǐcè","sử sách"],["手册","shǒucè","sổ tay"],["账册","zhàngcè","sổ sách kế toán"],["纪念册","jìniàncè","sổ lưu niệm"],["册子","cèzi","quyển sổ"]]},{k:"丰",rule:"丰 = <b>dồi dào, phong phú</b>.",w:[["丰厚","fēnghòu","phong phú, dồi dào (có trong bài)"],["丰产","fēngchǎn","được mùa"],["丰富","fēngfù","phong phú"],["丰满","fēngmǎn","đầy đặn"],["丰茂","fēngmào","tươi tốt"],["丰年","fēngnián","năm được mùa"],["丰盛","fēngshèng","thịnh soạn"],["丰收","fēngshōu","bội thu"],["丰硕","fēngshuò","to lớn (thành quả)"],["丰足","fēngzú","sung túc"],["丰裕","fēngyù","dư dả"],["五谷丰登","wǔgǔ-fēngdēng","ngũ cốc bội thu"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Ông lão & năm 1956",from:1,to:16},{name:"Nhóm 2 · Đoạn 4–7",sub:"Đôi chén, lai lịch & lối sống",from:17,to:32},{name:"Nhóm 3 · Đoạn 8–11",sub:"Con cháu & bậc thầy",from:33,to:51}],V:[[1,"霞","xiá","dt.","hà","ráng",1,"","日出、日落时天空及云层上因日光斜射而出现的彩色光象或彩色的云。","朝霞还没铺满天空","晚霞映红了天空。","Ráng chiều nhuộm đỏ bầu trời.",["朝霞","晚霞"],"SBT câu 20D."],[2,"朴素","pǔsù","tt.","phác tố","mộc mạc, giản dị",1,"","（颜色、式样等）不浓艳，不华丽；（生活）节约，不奢侈。","衣着朴素","她穿得很朴素。","Cô ấy ăn mặc giản dị.",[],"Bài tập 3①. SBT câu 19A."],[3,"温和","wēnhé","tt.","ôn hòa","hòa nhã, ôn hòa, điềm đạm",1,"","（气候）不冷不热；（性情、态度、言语等）不严厉，使人感到亲切。","性情温和的老人","昆明气候温和。","Khí hậu Côn Minh ôn hòa.",[],"Xem <b>辨析 温和—温柔</b>. Bài tập 1 (ví dụ): <span class='zh'>温柔 · 温顺 · 温厚 · 温情</span>."],[4,"颠簸","diānbǒ","đgt.","điên bá","tròng trành, lắc lư, nghiêng ngả",1,"","上下震荡。","坐着一路颠簸的公共汽车","山路很颠簸。","Đường núi xóc nảy.",[],"Bài tập 3①. SBT câu 33–36."],[5,"巷","xiàng","dt.","hạng","ngõ hẻm",1,"","较窄的街道。","大街小巷","他住在一条小巷里。","Anh ấy sống trong một con hẻm nhỏ.",["大街小巷"],"SBT câu 18D: <span class='zh'>街谈巷议</span>."],[6,"陶瓷","táocí","dt.","đào từ","gốm sứ",1,"","陶器和瓷器的总称。","古陶瓷收藏家","景德镇的陶瓷很有名。","Gốm sứ Cảnh Đức Trấn rất nổi tiếng.",[],""],[7,"收藏","shōucáng","đgt.","thu tàng","thu thập, sưu tầm",1,"","收集保藏。","古陶瓷收藏家","他喜欢收藏邮票。","Anh ấy thích sưu tầm tem.",["收藏家"],"Khởi động 2: nhóm chữ <span class='zh'>家</span>."],[8,"鉴定","jiàndìng","đgt.","giám định","xác nhận, giám định",1,"","鉴别和评定（人的优缺点）；辨别并确定事物的真伪优劣等。","鉴定家","请专家鉴定这件文物的真假。","Mời chuyên gia giám định thật giả của cổ vật này.",["鉴定家"],"SBT câu 32."],[9,"无偿","wúcháng","tt.","vô thường","không phải trả tiền, không phải tốn kém gì cả",1,"","不要代价的；没有报酬的。","无偿赠送给了故宫博物院","无偿献血。","Hiến máu tình nguyện.",[],"Bài tập 2①; 3①. SBT nghe câu 3."],[10,"赠送","zèngsòng","đgt.","tặng tống","biếu, tặng",1,"","无代价地把东西送给别人。","无偿赠送给了故宫","他赠送给我一本书。","Anh ấy tặng tôi một cuốn sách.",[],"Bài tập 1: <span class='zh'>赠与 · 赠言 · 回赠 · 捐赠</span>."],[11,"络绎不绝","luòyì bù jué","thành ngữ","lạc dịch bất tuyệt","đông như trẩy hội, nườm nượp không ngớt",1,"成","（人、车、马、船等）前后相接，连续不断。","家里人来人往，络绎不绝","参观的人络绎不绝。","Khách tham quan nườm nượp.",[],"Bài tập 2②. SBT câu 19B."],[12,"文物","wénwù","dt.","văn vật","di vật văn hóa, văn vật",1,"","遗存在社会上或埋藏在地下的历史文化遗物。","3000余件文物","保护文物，人人有责。","Bảo vệ văn vật là trách nhiệm của mọi người.",[],""],[13,"同志","tóngzhì","dt.","đồng chí","đồng chí",1,"","为共同的理想、事业而奋斗的人；旧时的通称。","故宫的同志","财务室的同志告诉我……","Đồng chí phòng tài vụ bảo tôi…",[],"SBT câu 19D."],[14,"打包","dǎ bāo","đgt.","đả bao","đóng gói, đóng kiện",1,"","用纸、布、袋子等包装物品；把吃剩的饭菜装好带走。","就该来打包装箱了","吃不完可以打包。","Ăn không hết có thể gói mang về.",[],"SBT nghe câu 5."],[15,"搭配","dāpèi","đgt.","đáp phối","phối hợp, kèm theo",1,"","按一定要求安排分配。","搭配的图案是两只……蝴蝶","这件衣服搭配什么颜色的裤子好？","Áo này phối với quần màu gì thì đẹp?",[],"SBT nghe câu 4."],[16,"图案","tú'àn","dt.","đồ án","hoa văn, hình vẽ",1,"","有装饰意味的花纹或图形。","搭配的图案","这块布上的图案很漂亮。","Hoa văn trên tấm vải này rất đẹp.",[],""],[17,"皇帝","huángdì","dt.","hoàng đế","hoàng đế, vua",1,"","中国古代国家最高统治者的称号。","皇帝专门下旨烧制的","秦始皇是中国第一个皇帝。","Tần Thủy Hoàng là hoàng đế đầu tiên của TQ.",[],"Bài tập 1: <span class='zh'>皇后 · 皇宫 · 皇权 · 冠冕堂皇</span>. SBT 21, 24–28."],[18,"皇后","huánghòu","dt.","hoàng hậu","hoàng hậu, vợ vua",1,"","皇帝的正妻。","不是烧给皇后","皇后是皇帝的正妻。","Hoàng hậu là vợ cả của vua.",[],"SBT câu 18B: <span class='zh'>皇后吕雉</span>."],[19,"销毁","xiāohuǐ","đgt.","tiêu hủy","tiêu hủy",1,"","熔化毁掉；烧掉毁掉。","其余4对全部销毁","销毁假货。","Tiêu hủy hàng giả.",[],""],[20,"手艺","shǒuyì","dt.","thủ nghệ","tay nghề, sự lành nghề",1,"","手工业工人的技术。","烧制杯子的手艺人","他做菜的手艺不错。","Tay nghề nấu ăn của anh ấy khá.",["手艺人"],"Bài tập 3②."],[21,"凝聚","níngjù","đgt.","ngưng tụ","tích tụ lại, ngưng tụ",1,"","（气体）由稀变浓或变成液体；聚集；积聚。","凝聚着先人智慧结晶","这部作品凝聚了他毕生的心血。","Tác phẩm này kết tinh tâm huyết cả đời ông.",[],""],[22,"结晶","jiéjīng","dt.","kết tinh","sự kết tinh, thành quả, kết quả",1,"","比喻珍贵的成果。","先人智慧结晶","这是劳动人民智慧的结晶。","Đây là kết tinh trí tuệ của nhân dân lao động.",[],""],[23,"籍贯","jíguàn","dt.","tịch quán","quê quán",1,"","祖居或个人出生的地方。","孙瀛洲的籍贯是河北","你的籍贯是哪里？","Quê quán bạn ở đâu?",[],"SBT nghe 11–13."],[24,"采购","cǎigòu","dt.","thải cấu","nhân viên vật tư, nhân viên mua hàng",1,"","担任采购工作的人；（đgt.）选择购买。","做过采购、副经理","他在公司做采购。" 西不受限制地流行。","在历来假货泛滥的文物界","洪水泛滥。","Lũ lụt tràn lan.",[],"Bài tập 2⑥. SBT câu 32B."],[48,"威信","wēixìn","dt.","uy tín","uy tín",1,"","威望和信誉。","一张最有威信的名片","他在同事中很有威信。","Anh ấy rất có uy tín với đồng nghiệp.",[],"Bài 33 khởi động: nhóm <span class='zh'>威</span>."],[49,"当代","dāngdài","dt.","đương đại","đương đại, ngày nay",1,"","当前这个时代。","当代社会","当代文学。","Văn học đương đại.",[],"Xem <b>Ngữ pháp: 当</b>. SBT câu 22."],[50,"级别","jíbié","dt.","cấp biệt","cấp bậc, cấp",1,"","等级的区别；等级。","国家级别的“大家”","他的级别比我高。","Cấp bậc của anh ấy cao hơn tôi.",[],"SBT câu 33–36: <span class='zh'>上了级别的藏品</span>."],[51,"泰斗","tàidǒu","dt.","Thái Sơn Bắc Đẩu","Thái Sơn Bắc Đẩu, ngôi sao sáng, người được mọi người tôn kính",1,"","泰山北斗的简称，比喻德高望重或有卓越成就而为众人所敬仰的人。","当今古陶瓷鉴定的泰斗","他是中国医学界的泰斗。","Ông là bậc thầy y học Trung Quốc.",[],"SBT câu 20C: <span class='zh'>学术泰斗</span>."]],extra:[["孙瀛洲","Sūn Yíngzhōu","Tôn Doanh Châu (1893–1966)"],["故宫博物院","Gùgōng Bówùyuàn","Bảo tàng Cố Cung"],["斗彩三秋杯","dòucǎi sānqiū bēi","chén “tam thu” men đấu thái"],["爱妃","àifēi","ái phi"],["存世孤品","cúnshì gūpǐn","món độc nhất còn lại"],["古玩店 · 古董","gǔwándiàn · gǔdǒng","tiệm đồ cổ · đồ cổ"],["学徒 · 伙计","xuétú · huǒji","người học việc · người làm công"],["糖葫芦","tánghúlu","kẹo hồ lô"],["义举","yìjǔ","việc nghĩa"],["心服口服","xīnfú-kǒufú","tâm phục khẩu phục"]],T:[{zh:"几十年前，北京街头远不及今天繁华。清晨，朝霞还没铺满天空，一位衣着朴素、性情温和的老人，坐着一路颠簸的公共汽车去上班。到站了，他慢慢地从车上走下来，走过他熟悉的大街小巷，步行到故宫博物院。他就是著名的古陶瓷收藏家、鉴定家孙瀛洲。",vn:"Mấy chục năm trước, đường phố Bắc Kinh còn kém xa sự phồn hoa ngày nay. Sáng sớm, ráng mai chưa phủ kín bầu trời, một ông lão ăn mặc giản dị, tính tình ôn hòa ngồi chuyến xe buýt xóc nảy suốt dọc đường đi làm. Đến bến, ông chậm rãi bước xuống, đi qua những phố lớn ngõ nhỏ quen thuộc, đi bộ tới Bảo tàng Cố Cung. Ông chính là nhà sưu tầm, giám định gốm sứ cổ nổi tiếng Tôn Doanh Châu.",idea:"Ông lão giản dị.",q:["描述一下孙瀛洲。"],note:[["远不及","Kém xa."],["衣着朴素、性情温和","Xem 辨析 温和—温柔."]]},{zh:"对于孙瀛洲和他的家人来说，1956年是个值得记忆的年头，那一年孙瀛洲将自己精心收藏的3000余件文物无偿赠送给了故宫博物院，其中的斗彩三秋杯更是格外引人注目。",vn:"Với Tôn Doanh Châu và gia đình, năm 1956 là năm đáng nhớ: năm ấy ông đem hơn 3000 văn vật mình dày công sưu tầm hiến tặng không công cho Bảo tàng Cố Cung, trong đó đôi chén 斗彩三秋 đặc biệt thu hút sự chú ý.",idea:"Hiến tặng năm 1956.",q:["为什么说1956年是个值得记忆的年头？"],note:[["将……无偿赠送给……","Câu chữ <span class='zh'>将</span> (= 把)."]]},{zh:"孙瀛洲的女儿孙女士至今仍记得当年的情景。那些日子，家里人来人往，络绎不绝，人们忙着对捐献的文物登记造册，之后，故宫的同志就该来打包装箱了。那晚，父亲把全家叫到一起，从准备捐出的几百盒珍贵文物中找出一个精致的小盒子，取出两个小瓷杯给全家看。他说这是咱家最值钱的东西，故宫里也没有，明天就捐给故宫了，今天让你们看看。父亲说话时脸上充满了自豪。",vn:"Con gái ông, bà Tôn, đến nay vẫn nhớ cảnh năm ấy. Những ngày đó, nhà người ra người vào nườm nượp, mọi người tất bật đăng ký vào sổ các văn vật hiến tặng; sau đó, các đồng chí Cố Cung sẽ đến đóng gói vào thùng. Tối hôm ấy, cha gọi cả nhà lại, từ mấy trăm hộp văn vật quý định hiến tặng tìm ra một chiếc hộp nhỏ tinh xảo, lấy ra hai chiếc chén sứ nhỏ cho cả nhà xem. Ông nói đây là thứ đáng giá nhất nhà ta, trong Cố Cung cũng không có, mai đem tặng Cố Cung rồi, hôm nay cho các con xem. Khi nói, mặt ông tràn đầy tự hào.",idea:"Đêm trước khi hiến tặng.",q:["那晚，父亲给全家看了什么？"],note:[["当年","Xem Ngữ pháp 2: <span class='zh'>当</span>."],["人来人往，络绎不绝","Nườm nượp."]]},{zh:"大家专注地看着父亲手里那对造型秀巧，杯体轻灵、洁白的斗彩瓷杯：杯体色调柔和宁静，搭配的图案是两只在山石花草间飞舞的蝴蝶，淡雅清爽，赏心悦目。相传这对杯子是当年皇帝专门下旨烧制的，不是烧给皇后，而是烧给一位爱妃。当时共烧成5对，选出这一对后，其余4对全部销毁，并将烧制杯子的手艺人处死，烧制工艺就此失传，而这对凝聚着先人智慧结晶的杯子也就成了存世孤品。",vn:"Mọi người chăm chú nhìn đôi chén sứ đấu thái trong tay cha: dáng thanh xảo, thân chén nhẹ nhàng, trắng tinh; màu sắc dịu dàng tĩnh lặng, hoa văn là hai con bướm bay lượn giữa đá núi hoa cỏ, thanh nhã tươi mát, đẹp mắt vui lòng. Tương truyền đôi chén này năm xưa hoàng đế đặc biệt hạ chỉ nung, không phải nung cho hoàng hậu mà cho một ái phi. Khi ấy nung được 5 đôi, chọn ra đôi này, 4 đôi còn lại đều bị tiêu hủy, người thợ nung chén cũng bị xử tử, kỹ thuật từ đó thất truyền, và đôi chén kết tinh trí tuệ tiền nhân trở thành món độc nhất còn trên đời.",idea:"Đôi chén độc nhất.",q:["为什么斗彩三秋杯有这么高的价值？"],note:[["相传","Tương truyền."],["不是……，而是……","Không phải… mà là…"],["就此失传","Từ đó thất truyền."]]},{zh:"也许有人要问，这孙瀛洲到底什么来历？家藏竟然如此丰厚？",vn:"Có lẽ có người sẽ hỏi: ông Tôn Doanh Châu này rốt cuộc lai lịch thế nào? Đồ gia truyền sao lại phong phú đến thế?",idea:"Đoạn chuyển tiếp.",q:[],note:[["也许有人要问……？","Xem 篇章: 过渡 — đoạn chuyển tiếp."]]},{zh:"孙瀛洲的籍贯是河北，他13岁到北京，在古玩店做学徒、伙计，之后做过采购、副经理。1923年他自己创业，开办了古玩店。由于经营有方，又收藏有大量珍贵文物，孙瀛洲在当时的古董经营者中很有威望。",vn:"Tôn Doanh Châu quê Hà Bắc, 13 tuổi lên Bắc Kinh làm học việc, người làm ở tiệm đồ cổ, sau làm nhân viên thu mua, phó giám đốc. Năm 1923 ông tự lập nghiệp, mở tiệm đồ cổ. Nhờ kinh doanh giỏi, lại sưu tầm nhiều văn vật quý, ông rất có uy tín trong giới buôn đồ cổ thời bấy giờ.",idea:"Lai lịch.",q:["说说孙瀛洲的经历。"],note:[["当时","<span class='zh'>当</span> = lúc ấy."],["由于……，又……","Vì… lại…"]]},{zh:"孙女士感慨道，尽管当年家中私藏丰厚，但他们生活却非常简朴，甚至有些吝啬，举个例子吧，过年时孩子们吃的糖葫芦都是孙瀛洲自制的。他对孩子尚且如此，对自己的那份节俭也就不难想象了。可是，为了收购绝世珍品斗彩三秋杯，他却是不惜重金。正是这种对陶瓷执着的热爱，使孙瀛洲收藏了数量可观的陶瓷精品。",vn:"Bà Tôn cảm khái: dù năm ấy đồ cất giữ trong nhà rất nhiều, nhưng họ sống rất giản dị, thậm chí hơi keo kiệt; lấy ví dụ, Tết kẹo hồ lô bọn trẻ ăn đều do ông tự làm. Với con cái còn như vậy, thì sự tiết kiệm với chính mình cũng dễ hình dung. Thế nhưng để mua đôi chén tuyệt phẩm 斗彩三秋, ông lại không tiếc bỏ ra số tiền lớn. Chính tình yêu bền bỉ với gốm sứ khiến ông sưu tầm được số lượng đáng kể tinh phẩm gốm sứ.",idea:"Tiết kiệm nhưng không tiếc tiền cho cổ vật.",q:["孙瀛洲生活怎么样？"],note:[["尚且如此，……也就不难想象了","Xem Ngữ pháp 1: <span class='zh'>尚且</span>."],["可是","Xem 篇章: 过渡 — từ chuyển tiếp."],["正是……，使……","Chính… khiến…"]]},{zh:"孙瀛洲的子女们说，父亲来到这个世界好像只有一个神圣的使命——保护文物。他全身心投入到文物当中，生活在文物当中。有人问他们怎样看待当年父亲捐赠的义举？要是在今天，你们这些做家属的会支持父亲吗？他们回答：“今天我们也会拥护父亲的选择，就像父亲捐出这些文物不是为了表彰，不是为了荣誉，不是为了奖励，也没想得到什么称号一样，这些东西本就属于国家，属于全人类。”孙家后人很争气，他们不想沾父亲的光，父亲留给他们最大的财富就是高洁的品质。",vn:"Các con ông nói, cha đến với thế gian này dường như chỉ có một sứ mệnh thiêng liêng — bảo vệ văn vật. Ông dồn toàn tâm toàn ý vào văn vật, sống giữa văn vật. Có người hỏi họ nhìn nhận việc nghĩa hiến tặng của cha năm ấy thế nào? Nếu là hôm nay, những người nhà như các anh chị có ủng hộ cha không? Họ trả lời: “Hôm nay chúng tôi vẫn ủng hộ lựa chọn của cha; cũng như cha hiến những văn vật ấy không vì được tuyên dương, không vì vinh dự, không vì phần thưởng, cũng chẳng mong danh hiệu gì — những thứ đó vốn thuộc về đất nước, thuộc về nhân loại.” Con cháu nhà họ Tôn rất có chí, không muốn dựa hơi cha; tài sản lớn nhất cha để lại cho họ là phẩm chất cao khiết.",idea:"Con cháu ủng hộ.",q:["孩子们怎么看待父亲和父亲的义举？"],note:[["不是为了……，不是为了……，不是为了……","Điệp cấu trúc (排比)."],["沾父亲的光","Dựa hơi cha."]]},{zh:"1956年，孙瀛洲受聘于故宫博物院从事古陶瓷研究、鉴定工作。他很乐意接受这份工作，工作中更是精益求精。孙瀛洲的弟子讲过这样一件事：一次，孙瀛洲让人们把不同时期的瓷器放在一起，其中当然有真品，也有仿品。他背过身，人们打乱摆放次序，他闭着眼睛，转过身来，只用手摸，就准确地一一说出了各件文物的朝代、名称。",vn:"Năm 1956, Tôn Doanh Châu được Bảo tàng Cố Cung mời làm công tác nghiên cứu, giám định gốm sứ cổ. Ông rất vui lòng nhận việc, làm việc càng tinh càng muốn tinh hơn. Học trò ông kể một chuyện: một lần, ông bảo mọi người để đồ sứ các thời kỳ khác nhau lẫn với nhau, trong đó dĩ nhiên có đồ thật, cũng có đồ giả. Ông quay lưng đi, mọi người xáo trộn thứ tự; ông nhắm mắt, quay lại, chỉ dùng tay sờ đã nói chính xác lần lượt triều đại, tên gọi của từng món.",idea:"Tài giám định.",q:["孙瀛洲在工作中的贡献有哪些？"],note:[["受聘于……","Được mời làm việc ở…"],["一一","Lần lượt từng cái."]]},{zh:"在历来假货泛滥的文物界，鉴定家孙瀛洲就是一张最有威信的名片。当代社会，被称为“专家”容易，称为“著名专家”也不难，但称得上“大家”的不多，孙瀛洲就是人人心服口服的国家级别的“大家”。",vn:"Trong giới văn vật xưa nay hàng giả tràn lan, nhà giám định Tôn Doanh Châu là tấm danh thiếp có uy tín nhất. Xã hội đương đại, được gọi là “chuyên gia” thì dễ, gọi là “chuyên gia nổi tiếng” cũng không khó, nhưng xứng danh “bậc thầy” thì không nhiều — Tôn Doanh Châu chính là “bậc thầy” cấp quốc gia khiến ai cũng tâm phục khẩu phục.",idea:"“大家” cấp quốc gia.",q:["为什么说孙瀛洲是“大家”？"],note:[["当代","<span class='zh'>当</span> = hiện tại."],["……容易，……也不难，但……不多","Tầng tiến rồi chuyển."]]},{zh:"孙瀛洲在故宫博物院工作期间将一生所学毫无保留地传授给学生，培养出一批文物鉴定人才，有的已成为当今古陶瓷鉴定的泰斗。",vn:"Thời gian làm việc ở Cố Cung, ông truyền dạy hết những gì học được cả đời cho học trò không giữ lại chút nào, đào tạo được một lứa nhân tài giám định văn vật, có người nay đã thành bậc thầy giám định gốm sứ cổ.",idea:"Truyền nghề.",q:[],note:[["毫无保留地","Không giữ lại chút nào."],["当今","Ngày nay."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: 篇章 & từ vựng",G:[{id:"g1",grp:1,word:"尚且",zh:"尚且",py:"shàngqiě",tag:"Chú thích 1 · liên từ",mean:"Liên từ, dùng ở <b>vế trước</b> của câu phức, nêu ra một ví dụ rõ ràng để so sánh; vế sau rút ra kết luận đương nhiên cho sự việc cùng loại nhưng khác về mức độ — “còn…, huống hồ…”. Vế sau thường có <span class='zh'>何况 · 更 · 当然 · 也就</span>.",forms:["A 尚且……，（何况）B 呢？","A 尚且如此，B 更 / 就……"],ex:[["他对孩子尚且如此，对自己的那份节俭也就不难想象了。","",1],["经济增长强劲时，这个企业尚且如此，经济衰退时，企业肯定会出现生存问题。","Kinh tế tăng mạnh mà doanh nghiệp này còn như vậy, kinh tế suy thoái chắc chắn gặp vấn đề sống còn."],["“人”和“入”这么简单的两个字他尚且分不清楚，何况其他呢？","Hai chữ đơn giản “人” và “入” cậu ta còn không phân biệt được, huống hồ chữ khác?"]],tips:["Bài tập 2③. SBT nghe câu 1."],practice:{q:"给“尚且”选择适当的位置",type:"pos",items:[["A小学生B明白C这些D道理，何况大学生呢？","B","小学生尚且明白这些道理，何况大学生呢？"],["钱钟书先生A如此B，对于一般人来C说，读书D做笔记就更有必要了。","A","钱钟书先生尚且如此，……"],["A这个字B你作为中国人C不认识，D我这个留学生就更不认识了。","C","……你作为中国人尚且不认识，……"]]}},{id:"g2",grp:2,word:"当代",zh:"当（介词）",py:"dāng",tag:"Chú thích 2 · giới từ",mean:"Giới từ, nghĩa là <b>đang ở (lúc ấy, nơi ấy)</b>. Kết hợp thành nhiều từ: <span class='zh'>当年 · 当时 · 当代 · 当今 · 当地 · 当场 · 当面</span>.",forms:["当 + 年 / 时 / 代 / 今 / 地 / 场 / 面"],ex:[["孙瀛洲的女儿孙女士至今仍记得当年的情景。","",1],["由于经营有方，又收藏有大量珍贵文物，孙瀛洲在当时的古董经营者中很有威望。","",1],["当代社会，被称为“专家”容易，称为“著名专家”也不难，但称得上“大家”的不多。","",1]],tips:["Bài 33: <span class='zh'>现场 — 当场</span>."],practice:{q:"选择合适的词语填空：当今　当场　当地",type:"complete",items:[["洪水淹没了村庄，给______人民的生活造成了很大的损失。","当地"],["所有这些，与______社会提倡的“可持续发展”“以人为本”的价值观显然是背道而驰的。","当今"],["他刚把手伸到别人的书包里，钱包还没拿出来，就被警察______抓获。","当场"]]}},{id:"g3",grp:0,word:"络绎不绝",zh:"Thành ngữ & cụm từ",py:"",tag:"Từ vựng",mean:"<span class='zh'>络绎不绝</span> = nườm nượp không ngớt. <span class='zh'>精益求精</span> = đã giỏi muốn giỏi hơn. <span class='zh'>不惜重金</span> = không tiếc tiền lớn. <span class='zh'>沾……的光</span> = nhờ ai mà được lợi. <span class='zh'>心服口服</span> = tâm phục khẩu phục. <span class='zh'>毫无保留</span> = không giữ lại chút nào.",forms:["……络绎不绝","对……精益求精","沾 + 人 + 的光"],ex:[["家里人来人往，络绎不绝。","",1],["工作中更是精益求精。","",1],["他们不想沾父亲的光。","",1]],tips:["Bài tập 2②."]},{id:"g4",grp:0,word:"温和",zh:"温和 / 温柔",py:"wēnhé / wēnróu",tag:"Xem 辨析 bên dưới",mean:"Đều là tính từ: (tính tình, thái độ, lời nói) không nghiêm khắc, khiến người thấy gần gũi. <span class='zh'>温和</span>: thiên về <b>thái độ, lời nói hòa nhã, lễ độ</b>; còn chỉ <b>khí hậu</b> không nóng không lạnh. <span class='zh'>温柔</span>: tính hiền, biết chiều theo ý người khác, <b>thường dùng cho nữ</b>.",forms:["态度 / 气候 + 温和","（女孩子）很温柔"],ex:[["一位衣着朴素、性情温和的老人……","",1]],tips:["<span class='zh'>×气候温柔</span>."]}],BX:{grp:0,word:"温和",cols:["√","×"],pair:"温和 — 温柔",same:["Tính từ, đều có nghĩa (tính tình, thái độ, lời nói…) <b>không nghiêm khắc, khiến người thấy thân thiết</b>.","她性格温和 / 温柔。"],diff:[["Thiên về <b>thái độ và lời nói hòa nhã, lễ độ</b>.","经理温和的态度打消了我的顾虑。","Hàm ý <b>tính tình hiền, khi có ý kiến khác vẫn chiều theo người khác</b>, thường dùng cho <b>nữ</b>.<div class='zh' style='margin-top:4px'>这个女孩子很温柔。</div>"],["Có thể chỉ <b>khí hậu</b> không nóng không lạnh.","昆明气候温和，四季如春。","Không có cách dùng này."]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["一个态度温和的办事员接待了我，仔细询问了我的情况。",0,"Thái độ → 温和 đúng."],["苏州地处太湖之滨，气候温柔，土地肥沃。",1,"Khí hậu → phải dùng <span class='zh'>温和</span>."],["她温柔地开导我，使我受伤的心灵得到一丝抚慰。",0,"Nữ, dịu dàng → 温柔 đúng."],["他温和的目光给了我莫大的力量，我鼓起勇气登台演出。",0,"Ánh mắt, thái độ → 温和 đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>温</u>和","温柔 · 温顺 · 温厚 · 温情"],items:[["<u>赠</u>送","赠","赠与 · 赠言 · 回赠 · 捐赠"],["<u>皇</u>帝","皇","皇后 · 皇宫 · 皇权 · 冠冕堂皇"],["<u>创</u>业","创","创造 · 开创 · 创立 · 创伤"],["<u>荣</u>誉","荣","荣光 · 光荣 · 荣耀 · 荣幸"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc.",items:[["他常常________。","无偿","他常常无偿上门服务。"],["他们店的生意很好，________。","络绎不绝","他们店的生意很好，顾客络绎不绝。"],["大人________，更别说孩子了。","尚且","大人尚且撑不住，更别说孩子了。"],["为了自己的事业，________。","不惜","为了自己的事业，他不惜牺牲家庭。"],["由于采用了新技术，________。","可观","由于采用了新技术，收益可观。"],["人们对环境的破坏________。","泛滥","人们对环境的破坏导致洪水泛滥。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["颠簸","无偿","朴素","可观","吝啬"],text:"我经常看到一位衣着{朴素}的老人，坐着{颠簸}的公共汽车去上班。后来才知道，这位老人自己生活很简朴，甚至可以说{吝啬}，但他{无偿}资助了许多贫困地区的孩子读书。几十年的捐款加起来，数额相当{可观}。"},{bank:["荣誉","威望","手艺","乐意","沾光"],text:"父亲是个{手艺}人，经过几十年的努力，他在行业内越来越有{威望}，也得到了不少{荣誉}。虽然父亲很{乐意}把这项传统技艺传授给我们，但我们这些子女并不想借父亲的名气{沾光}（原句：不想沾父亲的光），我们更希望通过自己的奋斗获得成功。"}]},EX4:{q:"请找出下列语段中的过渡词、过渡句",items:[{src:"",task:"我们班的同学学习都非常努力，拿小丽来说，她上课从来不迟到，每天不是在图书馆就是在宿舍学习。",model:"过渡语：“拿小丽来说” — từ khái quát chuyển sang ví dụ cụ thể."},{src:"",task:"如果我们在实践中选择和采取恰当的措施，目标一致地协调行动，我们的教育工作就会取得良好效果。反之，教育工作就会迷失方向，遭受挫折，甚至失败。",model:"过渡词：“反之” — chuyển sang mặt ngược lại."},{src:"",task:"农业的市场主要在城市，资金主要来自城市，技术和掌握高科技的人才也来自城市，总而言之，脱离了城市，农业和农村经济就无法得到发展。",model:"过渡词：“总而言之” — chuyển sang tổng kết."},{src:"",task:"“三高”食品本身无罪，因为热量、脂肪、糖分也是人体必需的，但俗话说“过犹不及”，一个人每天摄入过量的油脂和糖分对身体危害是极大的。",model:"过渡语：“但俗话说” — chuyển ý ngược lại, dẫn câu tục ngữ."}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["描述一下孙瀛洲","衣着，性情，坐着……到……上班，是……家、……家","孙瀛洲衣着朴素、性情温和，每天坐公共汽车到故宫博物院上班，他是著名的古陶瓷收藏家、鉴定家。"],["为什么说1956年是个值得记忆的年头？","把……无偿赠送给……，对……登记造册，打包装箱，父亲取出……给全家看","1956年，孙瀛洲把3000余件文物无偿赠送给故宫博物院。捐献前一晚，他取出最珍贵的斗彩三秋杯给全家看。"],["为什么斗彩三秋杯有这么高的价值？","造型……，色调……，图案……，相传……","这对杯子造型秀巧，色调柔和，图案是两只蝴蝶；相传是皇帝下旨烧制的，其余全部销毁，工艺失传，成了存世孤品。"],["说说孙瀛洲的经历","籍贯……，13岁……，在古玩店做……，1923年……，在……很有威望","孙瀛洲籍贯河北，13岁到北京，在古玩店做学徒，1923年自己创业开古玩店，在古董经营者中很有威望。"],["孩子们怎么看待父亲和父亲的义举？","生活简朴，不惜重金……，支持父亲，不想沾父亲的光，父亲留下的最大财富……","孙瀛洲生活简朴，却为文物不惜重金。孩子们支持父亲的选择，不想沾父亲的光，认为父亲留下的最大财富是高洁的品质。"],["孙瀛洲在工作中的贡献有哪些？","从事……工作，精益求精，弟子讲过的一件事，人人“心服口服”的“大家”，将……传授给……","他在故宫从事古陶瓷研究、鉴定工作，精益求精，只用手摸就能说出文物的朝代；他是人人心服口服的“大家”，还把一生所学传授给学生。"]]},PZ:{title:"篇章（5）过渡",vn:"Chuyển tiếp",intro:"Khi bài văn chuyển từ tầng ý này sang tầng ý khác, hoặc từ đoạn này sang đoạn khác, dùng một số <b>từ, câu hoặc đoạn</b> để hai phần nối tiếp tự nhiên — gọi là <b>过渡</b>. Tác dụng: làm ý trên dưới liền mạch, thành một chỉnh thể. Có <b>từ chuyển tiếp</b>, <b>câu chuyển tiếp</b>, <b>đoạn chuyển tiếp</b>.",ex:[["……他对孩子尚且如此，对自己的那份节俭也就不难想象了。可是，为了收购绝世珍品斗彩三秋杯，他却是不惜重金。","“可是” — từ chuyển tiếp."],["……四个人围着桌子坐在它的嘴里看书，还显得很宽敞。鲸的身子这么大，它们吃什么呢？须鲸主要吃虾和小鱼……","“鲸的身子这么大，它们吃什么呢？” — câu chuyển tiếp (từ “to lớn” sang “thức ăn”)."],["也许有人要问，这孙瀛洲到底什么来历？家藏竟然如此丰厚？","Đoạn chuyển tiếp — từ chuyện đôi chén sang lai lịch nhân vật."]],q:"为过渡句“这座桥不但坚固，而且美观。”选择合适的位置",pvn:"河北省赵县的洨河上，有一座世界闻名的石拱桥，叫安济桥，又叫赵州桥。A 它是隋朝的石匠李春设计和参加建造的……　赵州桥非常雄伟。B 桥长五十多米……这种设计……既减轻了流水对桥身的冲击力……又减轻了桥身的重量，节省了石料。　C 桥面两侧有石栏，栏板上雕刻着精美的图案……　D 赵州桥表现了劳动人民的智慧和才干……",practice:[["Đặt câu chuyển tiếp ở đâu?","C — đoạn trước nói về sự kiên cố (thiết kế), đoạn sau nói về vẻ đẹp (hoa văn lan can) → “不但坚固，而且美观” nối hai ý."]]},DP:[{title:"词汇：熟悉下列表示人物身份的词语",vn:"Từ chỉ thân phận, chức danh.",items:[["董事长","dǒngshìzhǎng","chủ tịch hội đồng quản trị","由董事会选举产生的公司法定代表人","他是这家公司的董事长。"],["法人","fǎrén","pháp nhân","有一定的组织机构和独立的财产，参加民事活动的社会组织","公司是法人。"],["顾问","gùwèn","cố vấn","有某方面的专门知识，供咨询的人","他是我们公司的法律顾问。"],["保姆","bǎomǔ","bảo mẫu, người giúp việc","受雇为人照料儿童、老人、病人或从事家务劳动的妇女","家里请了个保姆。"],["乞丐","qǐgài","người ăn xin","靠向人要饭要钱生活的人","路边坐着一个乞丐。"],["渔民","yúmín","ngư dân","以捕鱼为业的人","渔民们一大早就出海了。"],["委员","wěiyuán","ủy viên","政党、团体、机关、学校中的集体领导组织的成员","他是委员会的委员。"],["书记","shūjì","bí thư","党、团等各级组织中的主要负责人","他是村里的党支部书记。"],["元首","yuánshǒu","nguyên thủ","国家的最高领导人","两国元首举行了会谈。"],["俘虏","fúlǔ","tù binh","打仗时捉住的敌人","他们抓了很多俘虏。"],["将军","jiāngjūn","tướng quân","“将”一级的军官，也泛指高级军官","他是一位老将军。"],["司令","sīlìng","tư lệnh","某些国家军队中主管军事的人","他是海军司令。"],["公民","gōngmín","công dân","具有某国国籍，并享有权利和承担义务的人","每个公民都应遵守法律。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"我们的旅游一向是靠老祖宗留下的宫殿庙宇和老天爷造化的奇山秀水吃饭，许多“原装”景点尚且门庭冷落，经过微缩之后的“小玩意”到底有多少吸引力，前景实难预料。",o:["旅游是中国的支柱产业","中国有很多人造风景区","不漂亮的地方鲜有人去","说话人不看好微缩景观"],a:3,why:"“原装”景点尚且门庭冷落…前景实难预料. Có <span class='zh'>尚且</span>!"},{n:2,say:"戏开拍前，他不惜血本，花费了数千万人民币搭建了一座影视城。为了再现当年明军与清军鏖战的场面，他不惜重金累计动用了数万人来担任群众演员，场面之宏大令人叹为观止。",o:["很多人在拍戏前受了重伤","他舍不得花钱搭建影视城","戏中的战争场面极其宏大","影片中的群众演员很出色"],a:2,why:"“场面之宏大令人叹为观止”. Có <span class='zh'>不惜重金</span>."},{n:3,say:"转让无形资产，是指转让无形资产的所有权或使用权的行为；销售不动产，是指有偿转让不动产的所有权，转让不动产的有限产权或永久使用权。单位将不动产无偿赠送给他人等视同销售不动产的行为。",o:["所谓销售就是有偿转让","转让无形资产是有条件的","单位不动产不可随意赠送","无偿赠予和销售无本质区别"],a:0,why:"“销售不动产，是指有偿转让……”. Có <span class='zh'>无偿赠送</span>."},{n:4,say:"企业在选拔班组成员时，应注意各种气质类型人员的适当搭配。这样，在工作中各种气质可以得到适当的互补。把不同气质的人搭配在一起，就可以发挥各种气质的积极因素，弥补其中消极的成分。",o:["不同气质的人可以互相影响","各种气质的人混搭方便互相学习","企业用人时应考虑不同气质的混搭","不同气质的人混搭的消极影响极大"],a:2,why:"“应注意各种气质类型人员的适当搭配”. Có <span class='zh'>搭配</span>."},{n:5,say:"与其对社会公益事业的慷慨资助相比，他对自己的要求显得过于苛刻了，他生活十分俭朴，从不乱花一分钱，每天作画裁下的纸条儿都舍不得丢掉；到外边吃饭要打包，甚至连家里每月的开销也要精打细算，力求节俭。",o:["他常在外面吃饭","他是个画画儿的","他历来花钱要算计","做公益不如画画儿"],a:1,why:"“每天作画裁下的纸条儿” → họa sĩ."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您和中国的一线作家都有交情，海岩的第一件收藏品还是您帮他挑选的。您写过爱情小说，之后就去写文物了。\n男：我和这些作家关系都非常好，50岁以上、60岁以下的都认识，他们这些人本身都文学素养很高。他们年轻的时候，工作都是分配的，不能辞职。后来，慢慢地，很多人退出了文学圈。我曾经还是有些文学理想的，但后来觉得文学界不争气，就从那里面走出来了。后来，我写的关于艺术品的小说比他们的文学小说还畅销。\n女：您怎么评价文学界和文物界？\n男：我觉得文物比文学好的一点在于：它比较深，而文学比较浅。好比，你原来是个吸烟者，那是文学；而搞文物的就是雪茄。等你吸了雪茄，你会发现香烟比较淡。文学的评价标准也是个问题，写诗可以有好坏，反正都能写，谁好谁坏也没有一个终极标准。但文物是一个很窄的领域，而且文物是有终极判断的。我发现，文物界很多人说起话来前言不搭后语，文物界的人都特别死板，眼界特窄，而我眼界比较宽。\n女：您介入公共事务极为频繁，前不久还在博客上写关于贪官什么的文章，这样做是要保持影响力，还是纯粹出于表达的欲望？\n男：博客我一年要写137篇，最近四年都是这个速度。对我而言，收藏只是生活中的一个调剂，我因为在《百家讲坛》说收藏而“红”了。但我觉得，这反而是我最不看重的事儿。如果说我是“收藏家”的话，那可能是因为我著书立说了。\n女：商人、作家、学者、收藏家，在这几种身份之间，您如何评价自己？\n男：我是一个学者，不是一个商人。我曾经和我儿子说“我能够做一个学者，是这个时代的不幸，是我自己的大幸。”我们不能和王国维、陈寅恪相比，我实际上没读过什么书，我们算什么？我们这个时代缺少文化，所以稍微读了一点儿书的人就显得有文化。",qs:[{n:6,q:"关于对话中所说的一线作家，下列哪项正确？",o:["和说话人关系都很好","其文学素养有高有低","并不真心愿意搞写作","很多人改行搞收藏了"],a:0,why:"“我和这些作家关系都非常好”."},{n:7,q:"男的怎样评价文物界？",o:["搞文物的人喜欢雪茄","文物界的人眼界不宽","和文学的评价标准一致","文物涉及的领域比较广"],a:1,why:"“文物界的人都特别死板，眼界特窄”."},{n:8,q:"关于男的，下列哪项正确？",o:["他是个做事死板的人","他著有关于收藏的著作","他很喜欢《百家讲坛》","他一直在寻找表达机会"],a:1,why:"“因为我著书立说了”."},{n:9,q:"男的怎样看自己和自己所生活的时代？",o:["他认为自己是个幸运儿","他是个具有公益心的人","他喜欢学者，不喜欢商人","他认为这个时代学者众多"],a:0,why:"“是我自己的大幸”."},{n:10,q:"根据对话，下列哪项正确？",o:["收藏能够让人眼界开阔","王国维、陈寅恪很有威望","男的的主要收入来源是写作","男的认可的身份是学者和商人"],a:1,why:"“我们不能和王国维、陈寅恪相比” → hai ông rất có uy tín. Có <span class='zh'>威望</span>."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"齐白石1864年出生，籍贯湖南，是近现代中国绘画大师，世界文化名人。他早年曾做过木工，后以卖画为生，五十七岁后定居北京。齐白石书法、篆刻、诗文、绘画样样精通，并著有《白石诗草》及《白石老人自述》等。\n居住在北京的齐白石，内心装着的却是家乡的山水、家乡的草木。无奈他不可能将家乡草木带到北京，于是这种情思便化作艺术信息传达出来。他刻了许多寄托着怀乡之情的印章，写了许多怀乡诗，那些诗句无一不是齐白石“夜不安眠”时的肺腑之言。\n齐白石的作品《我最知鱼》，画的是小鱼追逐钓钩和鱼饵的情景，而那正是齐白石少年时常做的事情，他怎会不“知鱼”？齐白石画中的黑蜻蜓、红甲虫，家乡人叫作“黑婆子”“红娘子”，这正是农民的审美情趣；齐白石画鲇鱼题“年年有余”，画石榴象征多子，画桃子象征多寿，也都是民间艺术的喻意象征。这些作品，无一不是齐白石的恋乡情结和童真情趣的自然流露。",qs:[{n:11,q:"关于齐白石，下列哪项正确？",o:["他的家乡是湖南","他是个成功的商人","他是自学成才的木工","他从事美术教育工作"],a:0,why:"“籍贯湖南”. Có <span class='zh'>籍贯</span>."},{n:12,q:"齐白石定居在北京后，有什么变化？",o:["夜里总是睡不好觉","院里种了许多花草","心中充满思乡之情","学会了写诗、刻印章"],a:2,why:"“内心装着的却是家乡的山水”."},{n:13,q:"齐白石的作品有什么特点？",o:["专门为孩子创作","充满了童真童趣","内容深受城市人的喜爱","借鉴了民间艺术的手法"],a:1,why:"“恋乡情结和童真情趣的自然流露”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"一走进汪先生的家，我就看到他收藏的“宝贝”，有明代的漆器，清代的银碗和各种古典家具，不过数量最多的还是玉器。\n汪先生家原本有些祖传物件，如今均已失传，只剩下一个玉笔筒。听着汪先生的介绍，我注意到他家书桌上那个插着几支笔的青玉笔筒，虽貌不惊人，却别有情趣。\n汪先生说，这个玉笔筒是他父亲年轻时买的，当时花了一块大洋。那时一块大洋可值不少钱，所以笔筒价格不算便宜。他的父亲是一名中医，他买这笔筒是为了自己用，并不为收藏。\n汪先生从小看着这个笔筒长大，慢慢对老物件有了兴趣。后来，他随父母迁移到新疆伊犁，有机会接触到和田美玉。那时候和田玉的价格不像现在这么疯狂。当地居民都能接触到和田玉，少数民族居民身上都佩戴有玉器。汪先生觉得它们很漂亮，他喜欢玉的内在美感，从此汪先生成了玉器收藏者。",qs:[{n:14,q:"关于玉笔筒，下列哪项正确？",o:["是祖父收购来的","看起来平平常常","买时价格很便宜","如今已经是孤品"],a:1,why:"“虽貌不惊人” = trông bình thường."},{n:15,q:"关于汪先生的父亲，下列哪项正确？",o:["他是一名中医","玉器是他的最爱","小时候就居住在新疆","把祖传玉器都处理了"],a:0,why:"“他的父亲是一名中医”."},{n:16,q:"关于和田玉，下列哪项正确？",o:["当地居民大多收藏玉器","和田玉的价格历来很贵","当地居民都能接触玉器","当地居民对玉都很在行"],a:2,why:"“当地居民都能接触到和田玉”."},{n:17,q:"汪先生对玉的爱好是怎样形成的？",o:["祖上就有收藏的传统","感受到收藏能赚大钱","天天看笔筒就喜欢上玉了","他领略到了玉的内在之美"],a:3,why:"“他喜欢玉的内在美感，从此……成了玉器收藏者”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["一个人的成长，是需要经过无数坎坷的道路。","刘邦死后，皇后吕雉成了汉朝事实上的女皇帝。","我老家的天气是温和的，严冬时，水面也只结一层薄冰。","经过新闻媒体的跟踪报道，这一事件立刻成为街谈巷议的热门话题。"],a:0,why:"<b>Chủ – tân không hợp</b>: “成长……是……道路” → <span class='zh'>一个人的成长，需要经过无数坎坷</span>."},{n:19,o:["他做了大官，家里的生活照样十分朴素，跟普通百姓一样。","一时间，去新兴镇参观取经看热闹瞧新鲜的人滔滔似水，络绎不绝。","中国农村正在变成空心村，外出上学、务工，年轻人都流向了城市。","我到财务室交了钱，拿了取书单，财务室的同志告诉我要到书库去取书。"],a:2,why:"<b>Trật tự / thiếu chủ ngữ</b>: “外出上学、务工” thiếu chủ ngữ → <span class='zh'>年轻人外出上学、务工，都流向了城市</span>."},{n:20,o:["段文杰临摹功力如此深厚，来源于他献身敦煌艺术的诚心和对后人负责的决心以及艺术上精益求精的恒心。","尽管应试教育弊端多多，但它目前相对来说确实是最为公正的选拔办法，到目前为止，人们无法找出比应试教育更好的选拔人才的方式。","语言对于社会全体成员来说是统一的，共同的，不论王公贵族、学术泰斗，还是贩夫走卒、农妇渔夫，都得遵守社会的语言习惯，谁都不能垄断。","火一样的太阳先是烧红了西部的整片天空，然后又放射出金色光芒，而蓝天和白云也没有忘记前来取暖，这样就逐渐形成了五彩缤纷、变化多端的晚霞。"],a:1,why:"<b>Lặp ý</b>: <span class='zh'>目前……到目前为止</span> dư thừa; và “应试教育……选拔人才的方式” lặp."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"晏殊14岁时被作为神童___给皇帝。皇帝要考考他，让他和一千多名最有学问的人一同参加考试。结果晏殊发现考题是自己练习过的，就___告诉了皇帝，并请求___题目。皇帝因此十分感动。",o:["推荐　如实　更改","介绍　公然　改变","推选　趁早　变化","保举　当众　改正"],a:0,why:"<span class='zh'>推荐给皇帝</span>; <span class='zh'>如实告诉</span>; <span class='zh'>更改题目</span>."},{n:22,text:"___人们只把这种以口述历史为基本特征的研究，作为一般记者的采访来___，很少谈及它的学术价值和方法意义。近年，在中国现当代文学研究中，最有新意的就是___口述方法的___。",o:["往年　接纳　选择　著述","平素　接受　选取　创作","平昔　看待　动用　大作","以往　对待　采用　作品"],a:3,why:"<span class='zh'>以往</span>; <span class='zh'>作为……来对待</span>; <span class='zh'>采用</span>; <span class='zh'>作品</span>. Có <span class='zh'>当代</span>!"},{n:23,text:"说起垃圾分类回收，___一个家庭并没有从中获得___的收益，但其社会效益却是___的，一是使有限的地球资源重复使用，以___子孙后代的生存需要，二是减少垃圾量，减轻对环境的污染。",o:["或者　多少　庞大　解决","或许　可观　巨大　满足","分明　分毫　宏伟　适应","绝对　半点　重大　配合"],a:1,why:"<span class='zh'>或许</span>; <span class='zh'>可观的收益</span> (từ mới!); <span class='zh'>巨大</span>; <span class='zh'>满足需要</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"从前有个人叫淳于棼，他家院中有一棵大槐树，盛夏时节人们都喜欢在树下乘凉。\n淳于棼生日那天，亲友都来祝寿，(24)，之后就在槐树下沉沉睡去。\n梦中，他到了大槐安国，正赶上京城会试。他报名进了考场，考得很争气，居然得了第一名。皇帝看他学问好，相貌也好，就把公主嫁给了他。\n婚后，夫妻生活十分美满。淳于棼被皇帝任命为太守，(25)。因他管理有方，属下不敢胡作非为，百姓十分拥护他。皇帝欣赏他的政绩，表彰了他，并给了他很多奖励和荣誉。\n这一年，敌兵入侵，大槐安国的将军被敌兵打得溃不成军。皇帝急忙召集群臣商议对策。(26)，束手无策。这时，有人向皇帝推荐淳于棼。皇帝立即下令，让淳于棼率全国精锐与敌军决战。\n(27)，与敌兵刚一接触，就败下阵来。皇帝大怒，撤了淳于棼的职务。淳于棼气得大叫一声，从梦中惊醒，但见月亮挂在树梢上，自己还在大槐树下。\n此后汉语就有了成语“南柯一梦”，(28)。",opts:["一干就是20年","用来形容梦境或不可能实现的空想","大臣们你看我，我看你","可怜淳于棼对兵法一无所知","他一时高兴多喝了几杯"],ans:{24:4,25:0,26:2,27:3,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"古人发明文字之后，最早用来做书写材料的是甲骨，后来竹片、木片以及缣帛也被用来书写。但竹片的笨重可想而知，缣帛的昂贵不言而喻，于是便有了纸的发明。\n中国西汉（前206年～公元25年）时期已开始了纸的制作，东汉（25年～220年）时期，造纸技术得以完善，魏晋南北朝（220年～589年）时期，造纸原料多样化，藤皮、稻草、麦秆纤维，甚至烂鱼网、破布在匠人的手下都能变成质地优良的好纸。需求也促进了造纸技术的提高，隋唐时期，著名的宣纸诞生。为了延长纸的寿命，晋时又发明了染纸技术，即从植物黄蘖中熬取汁液，浸染纸张，染过的纸叫黄纸，又叫黄麻纸，有灭虫防蛀的功能。唐代人在染黄纸的基础上创造出了较为名贵的艺术加工纸——硬黄纸。五代制造的澄心堂纸，直到北宋，一直被公认为是最好的纸张。到了明清，又有了新的创意，作为文书用纸的笺纸被加工得精美绝伦。\n中国出土最早的纸张是1933年在新疆发掘出的西汉古纸，年代不晚于公元前49年。1957年在陕西出土的古纸经过分析鉴定，为西汉麻纸，年代不晚于公元前118年。1986年在甘肃出土的西汉初年（约前179年～前141年）的纸质地图残片，表明了当时的纸已可供写绘之用。",qs:[{n:29,q:"古人发明纸的原因是：",o:["骨头数量有限","竹片工艺烦琐","丝织品要做衣服","之前的材料都有缺憾"],a:3,why:"“竹片的笨重……缣帛的昂贵……于是便有了纸的发明”."},{n:30,q:"关于古代造纸技术，下列哪项正确？",o:["东汉水平最高","讲究化腐朽为神奇","努力适应市场需求","专门在细节上下功夫"],a:2,why:"Đáp án sách: C — “需求也促进了造纸技术的提高”."},{n:31,q:"在漫长的历史中：",o:["虫子一直对纸形成威胁","宣纸在纸张中十分有名","明清造纸技术达到了顶峰","工匠们一直追求的就是精美"],a:1,why:"“著名的宣纸诞生”."},{n:32,q:"根据纸张的出土情况可以知道：",o:["西汉是纸张用量最大的时期","西汉时期是纸张泛滥的年代","西汉生产的纸张已可绘制地图","1933年出土的纸是最早生产的纸"],a:2,why:"“纸质地图残片，表明了当时的纸已可供写绘之用”. Có <span class='zh'>鉴定 · 泛滥</span>."}]},{ins:"第33–36题：请选出正确答案。",text:"齐家文化古玉收藏家岳先生曾是个搞技术工作的军人。几十年的军旅生涯使他的足迹遍及祖国西北大漠戈壁，江南水乡，他亦曾多次远洋航行，颠簸于大风大浪之中。艰苦的生活磨炼了他的意志，严谨精细的技术工作又养成了他追根求底的性格特质。这对于他后来鉴定齐家文化古玉，破解其中蕴含的历史信息，打下了牢固的基础。\n齐家文化的玉器距今已有四五千年的历史，其中蕴含着丰富的文化信息，而岳先生偏偏对齐家文化古玉情有独钟。他发现，齐家玉器上一些细微特征所呈现的信息是多方位的。如立式玉人，手举斧头，腰际围一圈树叶遮蔽下身，斧头的头与柄由交叉绑系的绳索固定。这使得我们通常认知的史前先人腰围树叶的衣饰，以及斧、铲等工具与手柄捆绑系接的方法进一步在齐家古玉中得到佐证。\n提起古玉收藏，岳先生常说自己幸运，沾了改革开放的光，那时普通人的经济状况没有条件收藏，民间收藏品市场真品有的是，无奈的是囊中羞涩。岳先生节俭得近乎吝啬，却在浩如烟海的旧器物中搜寻到了不少上了级别的藏品。",qs:[{n:33,q:"岳先生认为自己收藏古玉的有利条件是：",o:["他爱学习，阅历丰富","他走南闯北，有见识","他精通考古挖掘技术","他幸运地赶上了改革开放"],a:3,why:"“沾了改革开放的光”. Có <span class='zh'>沾光</span>!"},{n:34,q:"齐家玉器中的立式玉人：",o:["上衣是树叶","上面标有朝代","有被捆绑过的痕迹","证实了人们对史前先人的一些认知"],a:3,why:"“……进一步在齐家古玉中得到佐证”."},{n:35,q:"根据上文，岳先生：",o:["喜欢旅游","当过空军","钟情于齐家玉器","常为没钱而发愁"],a:2,why:"“偏偏对齐家文化古玉情有独钟”."},{n:36,q:"最后一段画线词语“真品有的是”的意思是：",o:["是真品","没有真品","有些是真品","真品特别多"],a:3,why:"<span class='zh'>有的是</span> = có rất nhiều."}]}]},W:{zh:"写作",vn:"Viết văn: 缩写课文",t:"35 phút",task:"这篇课文讲述了陶瓷收藏家、鉴定家孙瀛洲的故事，通过文章我们了解了孙瀛洲是怎样一位老人，他一生的经历，他惊人的义举以及对孩子们的影响，从而让我们看到了一个真正的“大家”有着怎样的一种风范。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Mở","Ông lão <span class='zh'>衣着朴素、性情温和</span>, là nhà sưu tầm, giám định."],["Năm 1956","<span class='zh'>无偿赠送3000余件文物 · 斗彩三秋杯 · 存世孤品</span>."],["Lai lịch","<span class='zh'>籍贯河北 · 13岁学徒 · 1923年创业 · 很有威望</span>."],["Con người","<span class='zh'>简朴吝啬 · 尚且 · 不惜重金</span>; con cháu <span class='zh'>拥护 · 不沾光</span>."],["Cống hiến","<span class='zh'>精益求精 · 用手摸 · 心服口服的“大家” · 传授</span>."]],outline:[["一","孙瀛洲是谁"],["二","1956年的义举与斗彩三秋杯"],["三","经历"],["四","生活与子女的看法"],["五","工作中的贡献"]],model:"为文物而生的孙瀛洲\n几十年前，每天早上，一位衣着朴素、性情温和的老人坐着公共汽车去故宫博物院上班，他就是著名的古陶瓷收藏家、鉴定家孙瀛洲。\n1956年，孙瀛洲把自己收藏的3000多件文物无偿赠送给了故宫，其中最珍贵的是斗彩三秋杯。捐献前一天晚上，他把这对杯子拿出来给全家人看，说这是家里最值钱的东西，连故宫也没有。这对杯子造型秀巧，图案是两只飞舞的蝴蝶。相传是皇帝专门下旨烧制的，其余的都被销毁，工艺也失传了，所以它成了存世孤品。\n孙瀛洲籍贯河北，13岁到北京，在古玩店做学徒，1923年自己开了古玩店，在当时的古董经营者中很有威望。他的生活非常简朴，甚至有些吝啬，可是为了收购珍贵的文物，他却不惜重金。他的子女们说，父亲好像只有一个使命，就是保护文物。他们拥护父亲的选择，也不想沾父亲的光，父亲留给他们最大的财富是高洁的品质。\n1956年，孙瀛洲开始在故宫从事古陶瓷研究、鉴定工作。他精益求精，闭着眼睛只用手摸，就能说出文物的朝代和名称。他是人人心服口服的“大家”，还把一生所学毫无保留地传授给了学生。",check:["Có tiêu đề","Có đủ các ý theo Bài tập 5","Không thêm ý kiến cá nhân","Dùng ít nhất 4: 朴素 · 温和 · 无偿 · 尚且 · 不惜 · 威望 · 沾光 · 精益求精","Khoảng 400 chữ"]},SUM:{words:["霞","朴素","温和","颠簸","巷","陶瓷","收藏","鉴定","无偿","赠送","络绎不绝","文物","同志","打包","搭配","图案","皇帝","皇后","销毁","手艺","凝聚","结晶","籍贯","采购","创业","威望","吝啬","尚且","不惜","可观","神圣","使命","看待","家属","拥护","表彰","荣誉","奖励","称号","争气","沾光","品质","乐意","精益求精","次序","朝代","泛滥","威信","当代","级别","泰斗"],patterns:[["A 尚且……，B 更 / 何况……","他对孩子尚且如此，对自己的那份节俭也就不难想象了。"],["当年 / 当时 / 当代 / 当今","当代社会，被称为“专家”容易……"],["不是为了……，不是为了……","不是为了表彰，不是为了荣誉，不是为了奖励……"],["沾……的光","他们不想沾父亲的光。"],["篇章：过渡","也许有人要问，这孙瀛洲到底什么来历？"]],diff:["温和: thái độ, lời nói hòa nhã; còn chỉ khí hậu (气候温和) — 温柔: hiền dịu, chiều người, thường dùng cho nữ","威望 (uy danh) · 威信 (uy tín) · 争气 (có chí) · 沾光 (dựa hơi) · 吝啬 lìnsè"],sentences:["他对孩子尚且如此，对自己的那份节俭也就不难想象了。","这些东西本就属于国家，属于全人类。","被称为“专家”容易，称为“著名专家”也不难，但称得上“大家”的不多。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết 缩写 bài khóa ≈400 chữ (mục 7).","Đặt 3 câu với 尚且 và 3 câu với 当年 / 当今 / 当地.","Làm Sách bài tập bài 34.","Đọc trước bài 35."]}});
