<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 04 · 子路背米 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

 tốt, nông dân được mùa.",["普通农民","农民工"],""],["战争","zhànzhēng","名","chiến tranh",0,"国家或集团之间用武力打仗。","由于连年的战争，家里生活非常困难。","战争给人们带来了很大的痛苦。","Chiến tranh mang lại nỗi đau lớn cho con người.",["连年的战争","发动战争","战争时期"],""],["满足","mǎnzú","动","thỏa mãn, cảm thấy hài lòng",1,"觉得已经够了，没有更多的要求；也指使要求得到实现。","只要能饱饱地吃上一顿米饭，也就满足啦！","这个方案满足不了我们的需要。","Phương án này không đáp ứng được nhu cầu của chúng tôi.",["感到满足","满足需要","满足要求","满足愿望"],"辨析：满足—满意。见“辨析”部分。"],["惭愧","cánkuì","形","hổ thẹn",0,"因为自己做得不好，心里觉得不好意思。","子路听了，心里觉得十分惭愧。","我答应帮他，却没做到，心里很惭愧。","Tôi hứa giúp anh ấy mà không làm được, trong lòng rất áy náy.",["十分惭愧","感到惭愧"],""],["决心","juéxīn","名/动","quyết tâm; sự quyết tâm",1,"一定要做某事的想法；也指下定主意。","他暗下决心：“一定要让父母吃上米饭……","他下决心每天早上跑步。","Anh ấy quyết tâm sáng nào cũng chạy bộ.",["下决心","有决心","表示决心"],""],["委屈","wěiqu","动/形","để ai chịu thiệt thòi; tủi thân",0,"受到不公平的对待，心里难过；也指让别人受这样的对待。","一定要让父母吃上米饭，不能再委屈他们了！","她被老师误会了，委屈地哭了。","Cô bé bị cô giáo hiểu lầm, tủi thân khóc.",["委屈地说","委屈地哭","受委屈"],""],["打听","dǎting","动","hỏi thăm, nghe ngóng",0,"向别人问消息、情况。","子路打听到百里之外有个有钱人……","我向老师打听了一下考试的时间。","Tôi hỏi thăm thầy giáo thời gian thi.",["打听消息","打听一下","暗中打听"],""],["主人","zhǔrén","名","người chủ",0,"东西或房子的拥有者；也指接待客人的人。","那家主人见他身体结实，就留下了他。","主人热情地招待了我们。","Chủ nhà nhiệt tình tiếp đãi chúng tôi.",["这家主人","房子的主人"],""],["结实","jiēshi","形","cường tráng, khỏe mạnh",0,"身体强壮；东西牢固，不容易坏。","那家主人见他身体结实，就留下了他。","这把椅子很结实，用了十年也没坏。","Cái ghế này rất chắc, dùng mười năm vẫn chưa hỏng.",["身体结实","很结实"],""],["勤奋","qínfèn","形","siêng năng, cần cù",0,"做事努力，不怕辛苦，不偷懒。","子路干起活来十分勤奋……","他学习很勤奋，每天都很早起床读书。","Cậu ấy học rất chăm, ngày nào cũng dậy sớm đọc sách.",["勤奋（地）学习","勤奋（地）工作","勤奋（地）干活儿"],""],["银子","yínzi","名","bạc",0,"古代用来买东西的白色金属货币。","发现主人给的银子比他应该得到的多了许多……","古代人常用银子买东西。","Người xưa thường dùng bạc để mua đồ.",["一两银子"],"课本写作“银（子）”。"],["老实","lǎoshi","形","trung thực, thật thà",1,"诚实，不说假话；也指守规矩、不乱动。","子路老老实实地告诉了主人。","他是个老实人，从来不骗人。","Anh ấy là người thật thà, chưa bao giờ lừa ai.",["老实人","老老实实","老实点儿"],"辨析：老实—诚实。见“辨析”部分。"],["镇","zhèn"," g.",["物质条件","物质生活"],""],["反而","fǎn'ér","副","trái lại, ngược lại",1,"表示和原来想的情况相反。","反而常常诚恳地说……","吃了药，他的病反而更重了。","Uống thuốc rồi mà bệnh anh ấy lại nặng thêm.",["不但不……，反而……"],"见“注释”④。"],["诚恳","chéngkěn","形","thành khẩn",0,"真心实意，不虚假。","反而常常诚恳地说……","他诚恳地向朋友道了歉。","Anh ấy thành khẩn xin lỗi bạn.",["诚恳的态度","诚恳地说"],""],["成就","chéngjiù","名","thành tựu, thành quả",0,"做事得到的很大的成绩。","我现在有了一点儿成就……","他在科学研究方面取得了很大的成就。","Ông ấy đạt được thành tựu lớn trong nghiên cứu khoa học.",["取得成就","有成就"],""],["古代","gǔdài","名","ngày xưa",0,"离现在很久的时代。","中国古代有句话叫“百善孝为先”……","古代没有手机，人们用写信来联系。","Ngày xưa không có điện thoại, người ta liên lạc bằng thư.",["古代文化","中国古代"],""],["孝顺","xiàoshùn","动/形","thể hiện lòng hiếu thảo; hiếu thảo",1,"尽心照顾父母，听从父母的话。","孝顺父母是各种美德中占第一位的。","她是个孝顺的女儿。","Cô ấy là một người con gái hiếu thảo.",["孝顺父母","很孝顺"],""],["美德","měidé","名","phẩm chất tốt",0,"美好的品德。","孝顺父母是各种美德中占第一位的。","诚实是一种美德。","Thành thật là một đức tính tốt.",["传统美德"],""],["占","zhàn","动","chiếm, giữ",0,"处在某种位置；用某种方法得到。","孝顺父母是各种美德中占第一位的。","女生占全班人数的一半。","Nữ chiếm một nửa sĩ số cả lớp.",["占一半","占多数","占座位","占便宜"],""],["食物","shíwù","名","thức ăn",0,"可以吃的东西。","子路为了让父母吃到较好的食物……","冬天要多吃热的食物。","Mùa đông nên ăn nhiều đồ ăn nóng.",["美味的食物","精美的食物"],""],["子路","Zǐlù","专名","Tử Lộ (một học trò của Khổng Tử)",0,"人名，孔子的学生。","有一个人叫子路，他是孔子最年长的学生。","子路是一个很孝顺的人。","Tử Lộ là một người rất hiếu thảo.",[],""],["春秋","Chūnqiū","专名","thời Xuân Thu (770 TCN–476 TCN)",0,"中国古代的一个时期。","大概在距今两千五百多年前的春秋时期……","孔子生活在春秋时期。","Khổng Tử sống vào thời Xuân Thu.",[],""],["孔子","Kǒngzǐ","专名","Khổng Tử",0,"中国古代有名的思想家、教育家。","他是孔子最年长的学生。","孔子有很多学生。","Khổng Tử có rất nhiều học trò.",[],""],["楚国","Chǔguó","专名","nước Sở",0,"春秋时期的一个国家。","他也南下到了楚国。","楚国在中国的南方。","Nước Sở ở phía nam Trung Quốc.",[],""]],"WARM":[{"tab":"找生词","title":"从生词表中找出跟这些说明有关的生词","type":"reveal","lead":"Sách dùng hai bức tranh cổ để tìm từ. Ở đây thay bằng lời giải thích: đọc mô tả, nói từ mới tương ứng, rồi bấm “？”. Ví dụ của sách: 古代.","items":[["离现在很久很久以前的时代","古代","ngày xưa, thời cổ đại"],[" 兴了","apply":"别说出国旅行了，只要一家人能一起吃顿饭，妈妈也就满足了。","apply_vn":"Đừng nói đi du lịch nước ngoài, chỉ cần cả nhà được ăn cùng nhau một bữa là mẹ đã mãn nguyện."},{"zh":"子路干起活来十分勤奋","vn":"Tử Lộ làm việc vô cùng chăm chỉ","why":"<b>V 起 O 来 + đánh giá<\/b>: khi làm việc gì thì thế nào. Mẫu tả người ngắn gọn, tự nhiên.","frame":"某人 + 动词 + 起 + 宾语 + 来 + 评价","apply":"她平时很安静，可是说起汉语来特别流利。","apply_vn":"Bình thường cô ấy rất ít nói, nhưng hễ nói tiếng Trung thì cực kỳ lưu loát."},{"zh":"他顶着大雪往前走，扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路","vn":"anh đội tuyết đi tiếp, hai tay vịn bao gạo cóng không chịu nổi thì dừng lại sưởi một chút rồi lại tiếp tục lên đường","why":"Chuỗi động tác cụ thể <b>顶着……往前走 → ……得不行 → 停下来…… → 再继续……<\/b> giúp hình ảnh sống động, thể hiện sự kiên trì.","frame":"顶着 + 困难 + 往前走，……得不行，就……，再继续……","apply":"他顶着大太阳去送快递，热得不行，就喝口水，再继续工作。","apply_vn":"Anh ấy đội nắng đi giao hàng, nóng không chịu nổi thì uống ngụm nước rồi lại làm tiếp."},{"zh":"但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说","vn":"nhưng ông không vì điều kiện vật chất tốt mà vui mừng, trái lại thường thành khẩn nói","why":"<b>并没有因为 A 而 B，反而 C<\/b>: phủ định một kết quả tưởng là đương nhiên, rồi nêu điều ngược lại. Rất mạnh trong bài nghị luận.","frame":"某人 + 并没有因为 + A + 而 + B，反而 + C","apply":"他并没有因为考试失败而放弃，反而学习得更努力了。","apply_vn":"Anh ấy không vì thi trượt mà bỏ cuộc, trái lại còn học chăm hơn."},{"zh":"子路为了让父母吃到较好的食物，不怕辛苦，这种做法确实值得我们学习","vn":"Tử Lộ vì để cha mẹ được ăn đồ ăn ngon hơn mà không ngại vất vả, cách làm này thật đáng để chúng ta học tập","why":"<b>为了……，不怕……，这种做法确实值得我们学习<\/b>: câu kết bài kinh điển — tóm tắt việc làm + đánh giá.","frame":"某人 + 为了 + 目的，不怕 + 困难，这种……确实值得我们学习","apply":"她为了照顾生病的妈妈，不怕辛苦，每天医院、公司两边跑，这种孝心确实值得我们学习。","apply_vn":"Cô ấy vì chăm mẹ ốm mà không ngại vất vả, ngày nào cũng chạy giữa bệnh viện và công ty — tấm lòng hiếu thảo ấy thật đáng học tập."}],"GRAMMAR":[{"word":"至今","py":"zhìjīn","pos":"副词","forms":["至今 + 还／仍然／没（有）……（用于小句句首或动词前）","流传至今／从古至今（固定结构）"],"vn":"<b>至今<\/b> = cho đến nay. Đứng ở <b>đầu phân câu<\/b> hoặc <b>trước động từ<\/b>, thường đi với 还、仍然、没. Có các cụm cố định: 流传至今 (lưu truyền đến nay), 从古至今 (từ xưa đến nay).","text":"流传至今的“百里背米”讲的就是他孝敬父母的故事。","ex":[["我在北京出生、长大，至今还没离开过呢。","Tôi sinh ra, lớn lên ở Bắc Kinh, đến nay vẫn chưa rời đi đâu."],["至今，很多国家并没有规定什么才是健康食品。","Đến nay nhiều nước vẫn chưa quy định thế nào mới là thực phẩm lành mạnh."],["这座桥建于一千多年前，至今仍然在使用。","Cây cầu này xây hơn một nghìn năm trước, đến nay vẫn đang được sử dụng."]],"err":[["❌ 他至今去过三次北京。","✅ 到现在为止，他去过三次北京。／他至今还没去过北京。","至今 thường nói tình trạng kéo dài đến nay (还／仍然／没), ít dùng để đếm số lần."],["❌ 这个故事流传今至。","✅ 这个故事流传至今。","Cụm cố định là 流传至今, không đảo thành 今至."]],"book":[["虽然我们已经认识多年，____________。（至今）","Gợi ý: vẫn chưa biết một điều gì đó.","虽然我们已经认识多年，但我至今还不知道他的生日"],["A：你到中国已经一年了，能不能给我们介绍一下长城？<br>B：____________。（至今）","Gợi ý: đến nay vẫn chưa đi.","不好意思，我至今还没去过长城呢"],["到底什么是幸福，____________。（至今）","Gợi ý: đến nay vẫn chưa nói rõ được.","到底什么是幸福，我至今也说不清楚"]],"drill":[["“至今”放在哪里？ 他<u>A<\/u>还<u>B<\/u>没回信。",["A","B"],0,"至今 đứng trước 还 + động từ: 他至今还没回信."],["Câu nào đúng?",["这首歌流传至今。","这首歌流传今至。","这首歌至今流传了三次。"],0,"Cụm cố định 流传至今."],["选择：从古____，人们都重视孝顺父母。",["至今","以前","从前"],0,"Cụm cố định 从古至今."]]},{"word":"顶","py":"dǐng","pos":"名词／动词／量词","forms":["名词：头顶、山顶（最高的部分）","动词：用头顶东西；顶着 + 风／雪／压力（迎着、抵挡）","量词：一顶 + 帽子／伞"],"vn":"<b>顶<\/b> có nhiều cách dùng: ① danh từ — <b>đỉnh, chóp<\/b> (头顶、山顶); ② động từ — <b>đội, húc bằng đầu<\/b>; ③ động từ — <b>đi ngược, chống chọi<\/b> (顶着大雪、顶着压力); ④ lượng từ cho mũ, ô (一顶帽子).","text":"他顶着大雪往前走……","ex":[["父亲的朋友画了张画儿送我，画上是一座山，山顶有一个人往下看。","Bạn của bố vẽ tặng tôi một bức tranh, trên đỉnh núi có một người nhìn xuống. (danh từ)"],["院子里有两只羊正在打架，它们头顶着头，谁也不愿让谁。","Trong sân có hai con dê đang húc nhau, đầu đối đầu, không con nào chịu nhường. (động từ)"],["您为什么要顶着压力来做这件事呢？","Vì sao ông phải chịu áp lực để làm việc này? (động từ — chống chọi)"]],"err":[["❌ 我买了一个新帽子。","✅ 我买了一顶新帽子。","Lượng từ của 帽子 là 顶."],["❌ 他顶大雪往前走。","✅ 他顶着大雪往前走。","Nghĩa “đi ngược, chống chọi” thường dùng 顶着 + gió/tuyết/áp lực."]],"book":[["A：昨天爬山你去了吗？<br>B：____________。（顶—名词）","Gợi ý: leo lên đến đỉnh núi.","去了，我们一直爬到了山顶"],["虽然昨天刮大风，____________。（顶—动词）","Gợi ý: vẫn đi ngược gió.","虽然昨天刮大风，他还是顶着大风去上班了"],["A：____________。（顶—量词）<br>B：是吗？那好吧，那我就买它了。","Gợi ý: khen một chiếc mũ.","这顶帽子特别适合你，买了吧"]],"drill":[["“顶”是什么词？ 我这顶新帽子怎么样？",["名词","动词","量词"],2,"一顶帽子 → lượng từ."],["“顶”是什么词？ 请把手举过头顶。",["名词","动词","量词"],0,"头顶 = đỉnh đầu → danh từ."],["“顶”是什么词？ 子路顶着大雪往前走。",["名词","动词","量词"],1,"顶着 + 大雪 = đi ngược tuyết → động từ."]]},{"word":"……得＋不行","py":"de bùxíng","pos":"补语","forms":["形容词／心理动词 + 得 + 不行","也可以说：……得 + 很／不得了"],"vn":"<b>……得不行<\/b> = …đến mức không chịu nổi, cực kỳ. Đặt sau tính từ hoặc động từ tâm lý để chỉ <b>mức độ rất cao<\/b>, khẩu ngữ. Tương tự: <b>……得很<\/b>, <b>……得不得了<\/b>.","text":"扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。","ex":[["这个地方这么热闹，孩子们高兴得不得了！","Nơi này náo nhiệt thế, bọn trẻ vui không tả xiết!"],["他心里烦得很，自言自语地抱怨：“怎么还有那么远啊！”","Anh ấy bực bội lắm, lẩm bẩm phàn nàn: “Sao còn xa thế!”"],["忙了一整天，我累得不行，只想早点儿睡觉。","Bận cả ngày, tôi mệt rã rời, chỉ muốn ngủ sớm."]],"err":[["❌ 我很累得不行。","✅ 我累得不行。","Đã có 得不行 chỉ mức độ thì không thêm 很 phía trước."],["❌ 他跑步得不行。","✅ 他跑得累得不行。／他累得不行。","得不行 đi sau tính từ / động từ tâm lý (累、高兴、想…), không đi sau động từ hành động có tân ngữ."]],"book":[["A：你们俩这次出去旅行了大半年，家里一直没人收拾。昨天回来，家里怎么样？<br>B：____________。（……得不行）","Gợi ý: nhà bẩn kinh khủng.","家里脏得不行，我们收拾了一整天"],["学了一年多的汉语了，____________。（……得很）","Gợi ý: cảm nhận về tiếng Trung.","学了一年多的汉语了，我觉得汉字还是难得很"],["A：听说他的父母突然去世了？<br>B：____________。（……得不得了）","Gợi ý: anh ấy đau buồn vô cùng.","是啊，他难过得不得了，好几天都吃不下饭"]],"drill":[["Câu nào đúng?",["今天热得不行。","今天很热得不行。","今天得热不行。"],0,"Tính từ + 得不行."],["选择：听到考上大学的消息，他高兴得____。",["不行","很多","非常"],0,"高兴得不行 = vui vô cùng."],["Câu nào KHÔNG cùng nghĩa với “我累得不行”?",["我累得很。","我累得不得了。","我不累。"],2,"Ba câu đầu đều chỉ mức độ cao; 我不累 nghĩa ngược lại."]]},{"word":"反而","py":"fǎn'ér","pos":"副词","forms":["……，反而……（用在后一个小句）","不但不／没……，反而……"],"vn":"<b>反而<\/b> = trái lại, ngược lại. Dùng ở <b>phân câu sau<\/b>, chỉ kết quả <b>trái với dự đoán<\/b> hoặc trái với lẽ thường. Hay đi với 不但不／没……，反而…….","text":"但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说……","ex":[["这样不但不能提高他们的阅读能力，反而有可能降低他们的阅读兴趣。","Như vậy không những không nâng cao năng lực đọc mà còn có thể làm giảm hứng thú đọc của chúng."],["大城市的生活虽然很精彩，但一辈子生活在农村的父母反而会不适应。","Cuộc sống thành phố lớn tuy hấp dẫn nhưng cha mẹ cả đời sống ở nông thôn lại có thể không quen."],["吃了药以后，他的病不但没好，反而更重了。","Uống thuốc xong bệnh anh ấy không những không đỡ mà còn nặng hơn."]],"err":[["❌ 雨停了，反而天气更冷了。","✅ 雨停了，天气反而更冷了。","反而 là phó từ, đứng sau chủ ngữ, trước vị ngữ."],["❌ 他学习很努力，反而成绩很好。","✅ 他学习很努力，所以成绩很好。","Kết quả đúng như dự đoán thì không dùng 反而."]],"book":[["他不但不孝顺父母，____________。（反而）","Gợi ý: còn làm điều ngược lại.","他不但不孝顺父母，反而常常向父母要钱"],["他是个很有本领的人，可是，____________。（反而）","Gợi ý: kết quả trái với dự đoán.","他是个很有本领的人，可是，老板反而不重用他"],["A：你跟你同屋关系不是很好吗？怎么今天吵架了？<br>B：____________。（反而）","Gợi ý: giúp mà bị trách.","我好心帮他打扫房间，他反而说我乱动他的东西"]],"drill":[["“反而”放在哪里？ 风停了，<u>A<\/u>天气<u>B<\/u>更冷了。",["A","B"],1,"Sau chủ ngữ 天气, trước 更冷了."],["选择：他没有接受那份优厚的待遇，____辞职了。",["反而","而且"],0,"Trái với dự đoán → 反而 (课本练习2)."],["Câu nào dùng đúng 反而?",["我帮了他，他反而生气了。","他很努力，反而考得很好。","反而他不来了。"],0,"Giúp mà người ta lại giận → trái dự đoán."]]}],"HSK":{"r1":[{"text":["古代有个孩子叫陆绩，六岁那年，他跟父亲去一位大官家{36}。主人拿出橘子招待他们。陆绩吃了一个，又悄悄把三个橘子放进了袖子里。告别时，橘子不小心{37}了出来。主人笑着问：“你来做客，为什么要拿走橘子？”陆绩{38}地回答：“我母亲最爱吃橘子，我想带回去给她尝尝。”主人听了，非常感动。"],"qs":[{"n":36,"o":["打工","上班","做客","看病"],"a":2,"why":"后面主人说“你来做客”，所以是去大官家“做客”。"},{"n":37,"o":["掉","扶","占","顶"],"a":0,"why":"橘子从袖子里“掉了出来”。"},{"n":38,"o":["委屈","诚恳","惭愧","勤奋"],"a":1,"why":"陆绩真心说出原因，用“诚恳地回答”。"}]},{"text":["孝是中华民族的传统美德。在古代，孝主要表现为照顾父母的生活，让他们吃饱穿暖。{39}，孝的意义也在发生变化。现在很多父母的物质条件已经不错，他们更需要的是孩子的理解和{40}。有调查显示，超过一半的老人认为，孩子常回家看看，{41}。可见，孝敬父母不一定要花很多钱，{42}。"],"qs":[{"n":39,"o":["由于古代人很少","随着社会的发展","虽然父母不需要","只要孩子有钱"],"a":1,"why":"后面说“意义在发生变化”，用“随着社会的发展”引出变化。"},{"n":40,"o":["战争","食物","银子","陪伴"],"a":3,"why":"和“物质条件”相对，父母更需要的是精神上的“陪伴”。"},{"n":41,"o":["是一件很麻烦的事","比给钱更让他们高兴","会影响孩子的工作","没有什么意义"],"a":1,"why":"后面的结论是孝敬父母不一定要花钱，所以常回家比给钱更重要。"},{"n":42,"o":["关键是要用心","所以不用回家","而且越贵越好","因此父母不需要关心"],"a":0,"why":"“不一定要……，关键是要……”，强调用心最重要。"}]}],"r2":[{"start":46,"paras":["春节前，小刘拿着挣来的钱，给妈妈买了一件厚厚的羽绒服。原来，他发现妈妈的那件旧棉衣已经穿了十几年了。","大二那年寒假，他没有回家，而是在一家饭店打工，每天从早上忙到晚上。","妈妈穿上新衣服，嘴上说“乱花钱”，眼睛却红了。","小刘是一名大学生，家在农村，父母都是农民。","同学们都不明白：放假不回家，这么辛苦是为了什么？"],"ans":["D","B","E","A","C"],"why":"介绍人物（D）→ 寒假打工（B）→ 同学不明白（E）→ 原来是给妈妈买衣服（A）→ 妈妈的反应（C）。"}],"r3":[{"text":["“子欲养而亲不待”是中国的一句古话，意思是：孩子想要孝敬父母的时候，父母却已经不在了。这句话说出了很多人心里的遗憾。","王先生年轻时一心想做出成就，工作非常勤奋，常常一年都不回一次家。他总是对自己说：“等我有了钱，就把父母接来好好享福。”","十年后，王先生终于有了自己的公司，也买了大房子。可就在这时，他接到了父亲去世的消息。<u><b>站在空空的大房子里，他第一次觉得成功没有了意义<\/b><\/u>。","王先生说，他现在最想告诉年轻人的是：孝敬父母不要等，常回家看看，多陪父母说说话，就是最好的孝顺。"],"qs":[{"n":56,"s":"“子欲养而亲不待”的意思是：","o":["父母不需要孩子照顾","孩子想孝敬父母时，父母已经不在了","孩子不想孝敬父母","父母等着孩子回家"],"a":1,"why":"第一段直接解释了这句话的意思。"},{"n":57,"s":"王先生年轻时为什么很少回家？","o":["和父母关系不好","住得太远","一心想做出成就","父母不让他回家"],"a":2,"why":"第二段：一心想做出成就，工作非常勤奋。"},{"n":58,"s":"画线句子表达了王先生怎样的心情？","o":["骄傲","兴奋","满足","后悔和难过"],"a":3,"why":"父亲去世，他再也不能孝敬父亲，所以觉得成功没有意义，十分后悔、难过。"},{"n":59,"s":"最适合做上文题目的是：","o":["孝敬父母不要等","王先生的公司","怎样买大房子","勤奋的年轻人"],"a":0,"why":"全文的中心是最后一段：孝敬父母不要等。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出发生在小明和奶奶身上的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể câu chuyện của Tiểu Minh và bà.","panels":[["👵","奶奶的腿不好，每天只能坐在窗前看外面。"],["🧒","小明放学后，常常扶着奶奶在楼下散步。"],["📖","晚上，小明给奶奶读报纸、讲学校里的事。"],["😊","邻居们都说小明是个孝顺的孩子，奶奶笑得很开心。"]],"min":100,"tips":["Kể theo 4 tranh; thêm một câu nói của Tiểu Minh hoặc của bà.","Có thể dùng: 扶、孝顺、孤单、照顾、美德."],"sample":"小明的奶奶腿不好，每天只能坐在窗前看外面的风景。小明知道奶奶很孤单，所以每天放学以后，他都会扶着奶奶到楼下散步，跟她聊聊天儿。晚上，他还给奶奶读报纸，讲学校里发生的有趣的事。奶奶听得很认真，常常笑出声来。邻居们都夸小明是个孝顺的孩子。小明说：“奶奶小时候照顾我，现在该我照顾她了。”","svn":"Bà của Tiểu Minh đau chân, ngày nào cũng chỉ ngồi bên cửa sổ… Tiểu Minh dìu bà đi dạo, đọc báo cho bà… “Hồi nhỏ bà chăm cháu, giờ đến lượt cháu chăm bà.”"},"w72":{"prompt":"有人认为，孝顺就是听父母的话；也有人认为，孝顺最重要的是理解和陪伴。你怎么看？请写一篇不少于200字的作文。","vn":"Có người cho rằng hiếu thảo là nghe lời cha mẹ; có người cho rằng quan trọng nhất là thấu hiểu và ở bên. Bạn nghĩ sao? Viết bài không ít hơn 200 chữ.","min":200,"title":"孝顺不等于听话","tips":["Dạng 谈看法: dẫn chủ đề → định nghĩa của tôi (不只是……更是……) → lý do + ví dụ → kết luận (xem mục 07 运用).","Có thể dùng khung 好句: 并没有因为……而……，反而……"],"sample":"有人认为，孝顺就是听父母的话；也有人认为，孝顺最重要的是理解和陪伴。我同意后一种看法。\n首先，孝顺不等于什么都听父母的。父母的经验很丰富，他们的意见值得尊重。但是在选择专业、工作这样的大事上，我们也可以有自己的想法。只要耐心地和父母沟通，他们一定能理解。\n其次，现在很多父母的物质条件已经不错，他们更需要的是孩子的陪伴。我的一个朋友在外地工作，每个月都给父母寄钱，却一年只回一次家。他妈妈说：“我们不缺钱，只想你常回来看看。”\n所以我认为，真正的孝顺是理解父母、陪伴父母，让他们放心、开心。","svn":"Bài 谈看法: nêu quan điểm → 首先 (hiếu ≠ vâng lời) → 其次 (cha mẹ cần sự bầu bạn) + ví dụ → kết luận."}},"PRACTICE":{"ex1":{"bank":["扶","占","从前","本领","决心","委屈"],"items":[["{}有个人叫乐广，他有个好朋友，一有空儿就到他家来聊天儿。",["从前"]],["你去教室自习的时候，帮我{}个座位，好吗？",["占"]],["请您先在这儿{}一晚，明天我们就给您换个好的房间。",["委屈"]],["邻居家有一条{}高强的小狗，能看门，能送报，还能买菜。",["本领"]],["他把那位老爷爷{}过了马路。",["扶"]],["我下{}从明天开始早睡早起，每天锻炼身体。",["决心"]]]},"ex2":[["昨天打不到车，是他____着我去的医院。",["背","后背"],0],["我跟爸爸妈妈说好了，会在10点____回家。",["从前","以前"],1],["这是在警察局，你给我____点！别乱动！",["老实","诚实"],0],["他没有接受那份优厚的待遇，____辞职了。",["而且","反而"],1]],"ex3":[["<u>A<\/u>这个美丽的<u>B<\/u>故事一直<u>C<\/u>到现在<u>D<\/u>。","流传",2,"这个美丽的故事一直流传到现在。"],["请你<u>A<\/u>暗中<u>B<\/u>一下<u>C<\/u>这件事，别让大家都<u>D<\/u>知道。","打听",1,"请你暗中打听一下这件事，别让大家都知道。"],["球<u>A<\/u>被<u>B<\/u>那个球员<u>C<\/u>了<u>D<\/u>回来。","顶",2,"球被那个球员顶了回来。"],["这几天<u>A<\/u>作业<u>B<\/u>太多了，我累<u>C<\/u>不得了<u>D<\/u>。","得",2,"这几天作业太多了，我累得不得了。"]],"ex4":[["子路从外面回来","满足、惭愧、暗下决心","子路从外面回来，听到父母说，只要能吃上一顿米饭就满足了。子路心里十分惭愧，暗下决心一定要让父母吃上米饭。"],["子路去百里之外干活儿","打听、主人、勤奋、老实","子路打听到百里之外有个有钱人缺干活儿的人。主人见他身体结实，就留下了他。子路干活十分勤奋，发现银子多了，就老老实实地告诉了主人。"],["子路回家","背、滑、顶、扶、……得不行","子路买了米、肉和鱼，背在后背上回家。雪地很滑，他差点儿摔倒。他顶着大雪往前走，扶着米袋的手冻得不行，就停下来暖暖再走。"],["子路南下到了楚国","本领、人才、物质、反而","父母去世后，子路到了楚国。国君觉得他有本领，是个人才，让他做了官。可是他并没有因为物质条件好而高兴，反而常常遗憾父母不能和他一起过好日子。"]],"ext":{"title":"扩展 · 话题：社交称谓","words":[["国王","guówáng","quốc vương"],["王子","wángzǐ","hoàng tử"],["公主","gōngzhǔ","công chúa"],["总理","zǒnglǐ","thủ tướng"],["总统","zǒngtǒng","tổng thống"],["主席","zhǔxí","chủ tịch"],["总裁","zǒngcái","tổng giám đốc"],["主任","zhǔrèn","chủ nhiệm, trưởng phòng"],["老板","lǎobǎn","ông chủ"],["领导","lǐngdǎo","lãnh đạo"]],"items":[["美国正在进行四年一次的{}大选。","总统"],["他手里有了一些钱，想自己开公司，自己做{}。","老板"],["这是我们办公室新来的领导，大家可以叫他王{}。","主任"],["有些国家既有总统也有{}，有些国家只有其中一个。","总理"]]}},"TEXT":[{"title":"家贫思亲","sub":"子路的决心","paras":["从前，大概在距今两千五百多年前的春秋时期，有一个人叫子路，他是孔子最年长的学生。流传至今的“百里背米”讲的就是他孝敬父母的故事。","子路的父母都是农民。由于连年的战争，家里生活非常困难。一天，子路从外面回来，听到父母在屋里说话：“活了大半辈子了，别说鱼肉，只要能饱饱地吃上一顿米饭，也就满足啦！”子路听了，心里觉得十分惭愧。他暗下决心：“一定要让父母吃上米饭，不能再委屈他们了！”"],"idea":"Tử Lộ là học trò lớn tuổi nhất của Khổng Tử, sống thời Xuân Thu. Nhà nghèo vì chiến tranh, cha mẹ chỉ mong được ăn một bữa cơm no. Nghe vậy, Tử Lộ <b>hổ thẹn<\/b> và quyết tâm cho cha mẹ được ăn cơm.","qs":[["子路是谁的学生？",["孟子","孔子","老子"],1],["子路家里为什么生活困难？",["父母不愿意工作","连年的战争","子路不孝顺"],1],["父母说吃上什么就满足了？",["鱼肉","一顿米饭","一顿团圆饭"],1]]},{"title":"百里做工","sub":"勤奋又老实","paras":["子路打听到百里之外有个有钱人，家里缺干活儿的人，决定去试一试。那家主人见他身体结实，就留下了他。子路干起活来十分勤奋，主人很喜欢这个小伙子。半年后，当子路要回家时，发现主人给的银子比他应该得到的多了许多，子路老老实实地告诉了主人。主人笑着说：“孩子，工钱没算错，你做事勤快，这是我给你加的奖金。”"],"idea":"Tử Lộ đi trăm dặm làm thuê cho một nhà giàu. Anh làm việc <b>chăm chỉ<\/b>, khi thấy tiền công nhiều hơn thì <b>thật thà<\/b> báo lại; chủ nhà nói đó là tiền thưởng.","qs":[["主人为什么留下了子路？",["子路很聪明","子路身体结实","子路是孔子的学生"],1],["子路发现银子多了以后怎么做？",["老老实实地告诉了主人","悄悄带回了家","又多干了半年"],0],["银子为什么多了？",["主人算错了","是给子路的奖金","子路多拿了"],1]]},{"title":"顶风背米","sub":"风雪回家路","paras":["谢过主人，子路高兴地上路了。路过镇上，他买了一袋米、一块肉、两条鱼，背在后背上。天气非常寒冷，雪地很滑，子路不小心滑了一下，背上的米袋差点儿被甩出去。他顶着大雪往前走，扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。终于到家了，见到父母，子路把给他们买的东西及剩下的工钱都交给了他们。一家人高高兴兴地生火做饭，饱饱地吃了顿团圆饭。"],"idea":"Tử Lộ vác gạo, thịt, cá về nhà giữa trời <b>tuyết lạnh<\/b>, đường trơn suýt ngã, tay cóng vẫn đi tiếp. Về đến nhà, cả nhà vui vẻ ăn một bữa <b>cơm đoàn viên<\/b>.","qs":[["子路在镇上买了什么？",["米、肉和鱼","衣服和鞋","药和酒"],0],["回家路上天气怎么样？",["很热","非常寒冷，下着大雪","下着大雨"],1],["到家以后，子路把什么交给了父母？",["只有米","买的东西和剩下的工钱","主人写的信"],1]]},{"title":"子欲养而亲不待","sub":"做官以后的遗憾","paras":["后来子路的父母去世了，他也南下到了楚国。楚国国君觉得他很有本领，是个人才，就留他做了官，并给他很优厚的待遇。但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说：“多么希望父母能和我一起过好日子！我现在有了一点儿成就，可他们已经不在了，即使再想背米百里去孝敬双亲，也不可能了。”"],"idea":"Sau khi cha mẹ qua đời, Tử Lộ làm quan ở nước Sở, đãi ngộ hậu hĩnh. Nhưng ông <b>không vui<\/b> mà còn tiếc nuối: giờ có thành tựu thì cha mẹ đã không còn — “con muốn phụng dưỡng thì cha mẹ không đợi”.","qs":[["子路后来在哪个国家做了官？",["鲁国","楚国","秦国"],1],["子路做官以后的心情怎么样？",["非常欢喜","并不欢喜，反而很遗憾","很骄傲"],1],["子路为什么觉得遗憾？",["待遇不好","父母已经不在了，不能再孝敬他们","国君不重视他"],1]]},{"title":"百善孝为先","sub":"孝是第一美德","paras":["中国古代有句话叫“百善孝为先”，意思是说，孝顺父母是各种美德中占第一位的。子路为了让父母吃到较好的食物，不怕辛苦，这种做法确实值得我们学习。"],"idea":"“Trăm điều thiện, hiếu đứng đầu”: hiếu thảo là đức tính quan trọng nhất. Việc Tử Lộ không ngại vất vả vì cha mẹ đáng để chúng ta học tập.","qs":[["“百善孝为先”是什么意思？",["孝顺父母是最重要的美德","做一百件好事","孝顺的人要走在前面"],0],["作者认为子路的做法怎么样？",["没有必要","值得我们学习","太辛苦了"],1]]}],"TEXT_EXTRA":{"compare_title":"子路的两个阶段","compare_head":["阶段","子路做了什么","他的心情"],"compare":[["家里穷的时候","打听、做工、顶着大雪背米回家","惭愧 → 高兴（吃上团圆饭）"],["做官以后","有了本领、成就和优厚的待遇","并不欢喜，反而很遗憾"]],"bg":"“孝”是中国儒家文化中一个重要的内容。孔子在《论语》中就提到“孝悌”，认为人应该孝顺父母、爱兄弟。子路是个很孝顺的人，为了让父母过上更好的生活，他不怕辛苦，不怕寒冷。你愿意像他一样孝顺父母吗？","bg_vn":"“Hiếu” là nội dung quan trọng của văn hóa Nho gia (儒家 Rújiā). Khổng Tử nhắc đến “hiếu đễ” (孝悌 xiàotì): hiếu thảo với cha mẹ, yêu thương anh em.","discuss_title":"话题讨论：什么是孝顺？","discuss":["中国人说的“孝”是什么意思？","你认为应该如何去关爱你的父母？","如果有一天，你的父母身体不好了，需要有人照顾时，你会怎么做？"],"write":"请以“从《子路背米》想到的”为题，谈一谈你对这个故事和对“孝”的看法。尽量用上本课所学的生词，字数不少于100字。（→ xem 范文 3 ở mục 07 运用）"},"APPLY":{"topic":"谈一谈你对“孝”的看法","topic_vn":"Hãy nói quan điểm của bạn về chữ “hiếu”","intro":"Dạng đề nêu quan điểm về một khái niệm (谈看法) · Giải thích “孝” theo cách hiểu của bạn, đưa ví dụ chứng minh, rồi kết luận · Bài nói 1–2 phút, bài viết 80–150 chữ.","analyse":{"title":"“谈看法”：重点是“我认为孝是什么”","lead":"Đề này khác đề “最深的爱” (kể chuyện). Ở đây giám khảo muốn nghe <b>quan điểm<\/b>: bạn hiểu “孝” là gì, nên làm thế nào, và vì sao. Câu chuyện chỉ là <b>ví dụ chứng minh<\/b>, không phải nội dung chính.","parts":[["谈一谈","Nói quan điểm, không phải kể chuyện: phải có 我认为 / 在我看来."],["你对……的看法","Nêu cách hiểu riêng: 孝 là gì? (định nghĩa bằng 不只是……更是……)"],["“孝”","Khái niệm rộng → thu hẹp: vật chất / tinh thần / tôn trọng / bầu bạn."],["（课本）从《子路背米》想到的","Đề viết của sách: nhắc câu chuyện Tử Lộ 1–2 câu rồi nêu suy nghĩ của mình — xem 范文 3."]],"traps":[["Chỉ kể chuyện","Kể cả bài về bố mẹ mà không có câu nêu quan điểm → lạc dạng đề."],["Định nghĩa vòng tròn","孝就是孝顺父母 → không có chiều sâu."],["Phán xét tuyệt đối","不听父母话的人都是不孝的人 → cực đoan, bị trừ điểm."],["Thiếu kết luận","Kết thúc lửng lơ, không quay lại “真正的孝是……”."]],"link":"<b>Liên hệ bài 4 · 子路背米:<\/b> Tử Lộ vác gạo trăm dặm (hiếu bằng hành động), nhưng khi giàu có thì cha mẹ đã mất (子欲养而亲不待). Hai chi tiết này là <b>ví dụ<\/b> rất tốt cho bước ③ và câu kết “孝敬父母不要等”."},"steps":[["①","引出话题","Dẫn vào chủ đề: “孝” là truyền thống quan trọng; có thể trích 百善孝为先.","说到“孝”，……"],["②","我的理解","Nêu định nghĩa riêng bằng mẫu <b>不只是……更是……<\/b> hoặc <b>不是……而是……<\/b>.","我认为，孝不只是……，更是……"],["③","怎么做 + 举例","<b>Trọng tâm.<\/b> 1–2 việc làm cụ thể, kèm một ví dụ ngắn (có thể lấy Tử Lộ).","比如……"],["④","总结","Khẳng định lại quan điểm, nói ý nghĩa với người trẻ hôm nay.","所以／总之，真正的孝是……"]],"formula":["话题：孝","我的定义","做法 + 例子","真正的孝是……"],"choices_title":"Chọn một góc nhìn","choices_key":"Ví dụ: ","choices":[["A · 陪伴是最好的孝","ở bên là hiếu nhất","Hiếu không chỉ là chu cấp vật chất mà là quan tâm tinh thần.","người trẻ gửi tiền nhưng ít về nhà"],["B · 孝不等于顺从","hiếu ≠ vâng lời mù quáng","Tôn trọng cha mẹ nhưng vẫn có chính kiến, quan trọng là giao tiếp. Có chiều sâu, dễ ăn điểm.","chọn ngành học khác ý bố mẹ"],["C · 从小事做起","bắt đầu từ việc nhỏ","Hiếu thể hiện qua việc nhỏ hằng ngày: gọi điện, chăm khi ốm, tự lo cho mình để bố mẹ yên tâm.","mỗi ngày nhắn tin cho mẹ"],["D · 中越文化","so sánh Việt – Trung","Cả hai nước đều coi trọng chữ hiếu; người Việt có ví dụ riêng.","lễ Vu Lan, Tết về quê"]],"notes":[["Tránh hai cực đoan","(1) chỉ kể chuyện mà không nêu quan điểm; (2) phán xét tuyệt đối."],["Bước ② quyết định","Câu định nghĩa của bạn quyết định bài có “quan điểm” hay không."],["Dùng bài khóa","Một câu về Tử Lộ là đủ — đừng kể lại cả câu chuyện."]],"rule":"<b>Nguyên tắc HSK5:<\/b> bài hay là bài có <b>định nghĩa rõ, ví dụ thật và kết luận ôn hoà<\/b>. Thành ngữ 百善孝为先、子欲养而亲不待 rất hợp để mở hoặc kết bài — dùng một cái là đủ.","patterns":[["① 引出话题","说到“孝”，很多人会想到“孝顺”这个词。","Nói đến “hiếu”, nhiều người nghĩ ngay đến từ “hiếu thuận”."],["① 引出话题","中国有句老话叫“百善孝为先”，意思是孝是所有美德中最重要的。","Trung Quốc có câu “trăm điều thiện, hiếu đứng đầu”, nghĩa là hiếu là đức tính quan trọng nhất."],["② 我的理解","我认为，孝不只是让父母吃好穿好，更是精神上的陪伴。","Tôi cho rằng hiếu không chỉ là cho cha mẹ ăn ngon mặc đẹp, mà còn là sự bầu bạn về tinh thần."],["② 我的理解","在我看来，孝不等于什么都听父母的，而是尊重和理解。","Theo tôi, hiếu không có nghĩa là việc gì cũng nghe cha mẹ, mà là tôn trọng và thấu hiểu."],["③ 做法","我们应该常回家看看，耐心地听父母说说话。","Chúng ta nên thường xuyên về nhà, kiên nhẫn nghe cha mẹ nói chuyện."],["③ 举例","比如我奶奶，每次我给她打电话，她都高兴得像个孩子。","Ví dụ bà tôi, mỗi lần tôi gọi điện, bà đều vui như một đứa trẻ."],["④ 总结","所以我觉得，父母最需要的不是钱，而是孩子的关心。","Vì vậy tôi thấy, thứ cha mẹ cần nhất không phải là tiền, mà là sự quan tâm của con cái."],["④ 总结","总之，真正的孝是用行动表达对父母的爱。","Tóm lại, hiếu thật sự là dùng hành động để bày tỏ tình yêu với cha mẹ."]],"links":[["Dẫn chủ đề",["说到……，……","有句老话叫……，意思是……","……是中国（越南）的传统美德。"]],["Định nghĩa / quan điểm",["我认为／在我看来，……","……不只是……，更是……","……不是……，而是……","……不等于……"]],["Đưa ví dụ",["比如……","拿我自己来说，……","我身边就有这样的例子：……"]],["Kết luận",["所以／因此，……","总之，真正的……是……","只有……，才是真正的……"]]],"open":[["引用式","中国有句老话叫“百善孝为先”。"],["提问式","什么是孝？是听父母的话吗？我觉得不完全是。"],["对比式","在中国和越南，孝都是非常重要的传统。"]],"close":[["总结式","总之，陪伴就是最好的孝。"],["呼吁式","趁父母还年轻，多陪陪他们吧，别等到子欲养而亲不待。"],["升华式","孝不是一句话，而是每一天的行动。"]],"from_text":[["别说 A，只要 B 也就……","别说买贵重的礼物了，只要我常回家看看，父母也就满足了。","Lấy từ 好句 ①: cha mẹ chỉ mong điều giản dị."],["V 起 O 来 + 评价","爸爸平时话不多，可是关心起我来特别细心。","Lấy từ 好句 ②: tả bố mẹ."],["顶着……，……得不行，……再继续……","妈妈顶着大雨来学校给我送伞，冷得不行，却一直笑着。","Lấy từ 好句 ③: chi tiết cảm động."],["并没有因为 A 而 B，反而 C","他并没有因为工作忙而忘记父母，反而每天都给他们打电话。","Lấy từ 好句 ④: nêu việc làm đáng khen."],["为了……，不怕……，确实值得我们学习","子路为了父母不怕辛苦，这种孝心确实值得我们学习。","Lấy từ 好句 ⑤: câu kết bài."]],"vocab":[["孝顺","xiàoshùn","hiếu thảo, hiếu thuận","孝顺父母","idea"],["传统","chuántǒng","truyền thống","传统美德","idea"],["美德","měidé","đức tính tốt","中华民族的美德","idea"],["尊敬","zūnjìng","kính trọng","尊敬老人","idea"],["尊重","zūnzhòng","tôn trọng","尊重父母的意见","idea"],["物质","wùzhì","vật chất","物质上的照顾","idea"],["精神","jīngshén","tinh thần","精神上的陪伴","idea"],["责任","zérèn","trách nhiệm","照顾父母是我们的责任","idea"],["陪伴","péibàn","ở bên, bầu bạn","陪伴是最好的孝","act"],["照顾","zhàogù","chăm sóc","照顾生病的父母","act"],["体谅","tǐliàng","thông cảm, thấu hiểu","体谅父母的辛苦","act"],["沟通","gōutōng","giao tiếp, trao đổi","和父母好好沟通","act"],["报答","bàodá","báo đáp","报答父母的养育之恩","act"],["孤单","gūdān","cô đơn","老人很孤单","act"],["珍惜","zhēnxī","trân trọng","珍惜和父母在一起的时间","act"],["耐心","nàixīn","kiên nhẫn","耐心地听他们说话","act"],["孝敬","xiàojìng","hiếu kính","孝敬父母","lesson"],["反而","fǎn'ér","trái lại","不但不……反而……","lesson"],["惭愧","cánkuì","hổ thẹn","心里很惭愧","lesson"],["满足","mǎnzú","mãn nguyện","父母很容易满足","lesson"],["百善孝为先","bǎi shàn xiào wéi xiān","trăm điều thiện, hiếu đứng đầu","中国有句老话：百善孝为先","bonus"],["尊老爱幼","zūnlǎo-àiyòu","kính già yêu trẻ","尊老爱幼是传统美德","bonus"],["常回家看看","cháng huí jiā kànkan","thường về nhà thăm","有空常回家看看","bonus"],["子欲养而亲不待","zǐ yù yǎng ér qīn bú dài","con muốn phụng dưỡng thì cha mẹ không còn","别等到子欲养而亲不待","bonus"]],"vgroups":[["idea","Khái niệm · quan điểm"],["act","Hành động"],["lesson","Từ bài 4"],["bonus","加分 · thành ngữ"]],"legend":["① Dẫn chủ đề","② Cách hiểu của tôi","③ Việc làm + ví dụ","④ Kết luận"],"samples":{"speak":[{"who":"陪伴是最好的孝","meta":"Góc A · bài nói ~1 phút 30","p":["中国有句老话叫“百善孝为先”，意思是孝是所有美德中最重要的。","我认为，孝不只是让父母吃好穿好，更重要的是精神上的陪伴。","现在很多年轻人工作很忙，常常给父母寄钱，却很少回家。其实父母最需要的不是钱，而是孩子的关心。比如我奶奶，每次我给她打电话，她都高兴得像个孩子。","所以我觉得，常回家看看，耐心地听父母说说话，就是最好的孝。"],"vi":"Trung Quốc có câu “trăm điều thiện, hiếu đứng đầu”… Tôi cho rằng hiếu không chỉ là cho cha mẹ ăn ngon mặc đẹp, quan trọng hơn là sự bầu bạn về tinh thần. Nhiều người trẻ bận, thường gửi tiền về nhưng ít khi về nhà. Thật ra cha mẹ cần nhất không phải tiền mà là sự quan tâm của con cái. Ví dụ bà tôi, mỗi lần tôi gọi điện, bà đều vui như đứa trẻ. Vì vậy, thường về nhà, kiên nhẫn nghe cha mẹ nói chuyện chính là cách báo hiếu tốt nhất."},{"who":"孝不等于顺从","meta":"Góc B · bài nói ~1 phút 30","p":["说到“孝”，很多人会想到“孝顺”，觉得听父母的话就是孝。","但是我认为，孝不等于什么都听父母的。孝的基础是尊敬和理解，我们应该尊重父母的意见，体谅他们的辛苦。","不过在重要的事情上，我们也可以有自己的想法。比如选专业的时候，我和父母的想法不一样。我没有跟他们吵架，而是耐心地跟他们沟通，最后他们支持了我的选择。","所以，真正的孝是用爱和尊重去沟通，而不是一味地顺从。"],"vi":"Nói đến “hiếu”, nhiều người nghĩ nghe lời bố mẹ là hiếu. Nhưng tôi cho rằng hiếu không có nghĩa là việc gì cũng nghe bố mẹ; nền tảng của hiếu là kính trọng và thấu hiểu… Khi chọn ngành, tôi và bố mẹ khác ý, tôi kiên nhẫn trao đổi, cuối cùng họ ủng hộ tôi. Vì vậy hiếu thật sự là dùng tình yêu và sự tôn trọng để giao tiếp, chứ không phải nhất nhất vâng lời."}],"write":[{"who":"范文 1 · 陪伴","meta":"Dạng HSK5 · khoảng 80 chữ","title":"","p":["“百善孝为先”，孝是中国人最重视的传统美德。","在我看来，孝不只是物质上照顾父母，更是精神上的陪伴。","现在很多年轻人工作忙，很少回家，其实父母最需要的是孩子的关心。","所以，常回家看看，多听听父母说话，就是最好的孝。"],"vi":"不只是……更是…… là mẫu định nghĩa ăn điểm. 重视 zhòngshì = coi trọng."},{"who":"范文 2 · 孝不等于顺从","meta":"Dạng HSK5 · khoảng 80 chữ","title":"","p":["我认为，孝不等于顺从。","孝的基础是尊敬和理解，我们要体谅父母的辛苦，尊重他们的意见。","但是在重要的事情上，我们也可以有自己的想法，只要耐心沟通，父母一定能理解。","真正的孝，是用爱和尊重去沟通，而不是一味地听话。"],"vi":"一味地 yíwèi de = nhất nhất, một mực. 只要……一定…… = chỉ cần… thì nhất định…."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"从《子路背米》想到的","p":["读了《子路背米》，我很受感动。子路为了让父母吃上米饭，到百里之外打工，顶着大雪把米背回家。","我认为，孝不只是物质上的照顾，更是用心陪伴。子路后来做了官，生活很好，却说即使再想背米孝敬双亲，也不可能了。","这让我想到自己。我在国外留学，很少回家，别说给父母做饭了，连电话也打得不多，我觉得十分惭愧。","所以我下决心，以后每周给父母打电话，放假就回家陪他们。孝顺要从现在做起，别等到子欲养而亲不待。"],"good":["别说给父母做饭了","即使再想背米孝敬双亲，也不可能了"],"vi":"Bước ① nhắc câu chuyện 1–2 câu; ② định nghĩa bằng 不只是……更是……; ③ liên hệ bản thân với khung 别说……连……也……; ④ kết luận bằng 子欲养而亲不待."}]},"w5":["孝顺","传统","美德","尊敬","尊重","物质","精神","责任","陪伴","照顾","体谅","耐心","沟通","报答","孤单","珍惜","理解","顺从","关心","孝敬","惭愧","决心","反而","满足"],"step_names":["① 引出话题","② 我的理解","③ 做法 + 例子","④ 总结"],"timer":[["① 10s",10],["② 25s",25],["③ 35s",35],["④ 20s",20]],"build_title":"选一个角度，拼出你的看法","build_lead":"Chọn góc nhìn, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 陪伴是最好的孝":[["中国有句老话叫“百善孝为先”，意思是孝是所有美德中最重要的。","说到“孝”，我首先想到的是“陪伴”。"],["我认为，孝不只是让父母吃好穿好，更是精神上的陪伴。","在我看来，父母最需要的不是钱，而是孩子的关心。"],["现在很多年轻人常常给父母寄钱，却很少回家。比如我奶奶，每次我给她打电话，她都高兴得像个孩子。","我的一个朋友工作很忙，一年只回一次家。他说，每次离开的时候，妈妈都偷偷地哭。"],["所以，常回家看看，耐心地听父母说说话，就是最好的孝。","总之，趁父母还年轻，多陪陪他们吧，别等到子欲养而亲不待。"]],"B · 孝不等于顺从":[["说到“孝”，很多人会想到“孝顺”，觉得听父母的话就是孝。","什么是孝？是什么都听父母的吗？我觉得不完全是。"],["我认为，孝不等于顺从，孝的基础是尊敬和理解。","在我看来，我们应该尊重父母的意见，但是在重要的事情上，也可以有自己的想法。"],["比如选专业的时候，我和父母的想法不一样。我没有跟他们吵架，而是耐心地沟通，最后他们支持了我的选择。","比如我想出国留学，父母一开始很担心。我把我的计划详细地告诉他们，他们慢慢地理解了我。"],["所以，真正的孝是用爱和尊重去沟通，而不是一味地顺从。","总之，让父母放心、理解父母的心情，比只是听话更重要。"]],"C · 从小事做起":[["孝是一种传统美德，但是它离我们并不远。","很多人觉得孝是一件很大的事，我却觉得孝就在生活中。"],["我认为，孝应该从小事做起。","在我看来，孝不是一句话，而是每一天的行动。"],["比如吃饭时先请父母坐，父母生病时多照顾他们，每个周末给他们打个电话。","拿我自己来说，我每天都会给妈妈发一条消息，告诉她我很好，让她放心。"],["这些事情虽然很小，但是能让父母感受到我们的爱。","总之，照顾好自己、让父母放心，也是一种孝。"]],"D · 中越文化":[["在中国和越南，孝都是非常重要的传统美德。","越南人和中国人一样，都很重视“孝”。"],["我认为，孝就是尊敬父母、照顾父母，也让他们为我们感到骄傲。","在我看来，孝是一种责任，也是一种爱。"],["比如在越南，每年农历七月有“盂兰节”，很多人会回家看望父母，表达感谢。","比如春节的时候，不管离家多远，越南人都会想办法回家和父母团聚。"],["所以，不管在哪个国家，孝都是联系家人的一条纽带。","总之，孝是我们应该一直保持下去的好传统。"]]},"quiz":[["Câu nào hợp làm câu thứ hai trong bài “谈看法”?",["我妈妈对我很好，有一次我生病了，她一夜没睡……","我认为，孝最重要的不是钱，而是陪伴。"],1,"Đề hỏi quan điểm nên câu thứ hai phải nêu cách hiểu của bạn. Ví dụ để sau, chỉ để chứng minh."],["Câu định nghĩa nào tốt hơn?",["孝就是孝，孝顺父母就是孝。","孝不只是物质上照顾父母，更是精神上的陪伴。"],1,"Câu 1 lặp lại khái niệm (vòng tròn). Câu 2 dùng 不只是……更是…… nên có chiều sâu."],["Câu nào có quan điểm hợp lý hơn?",["不听父母话的人都是不孝的人。","孝不等于什么都听父母的，重要的是尊重和沟通。"],1,"Câu 1 tuyệt đối hoá, phán xét người khác. Câu 2 ôn hoà, có lập luận."],["Câu nào đúng?",["父母最需要的不是钱，而是孩子的关心。","父母最需要的不是钱，但是孩子的关心。"],0,"不是 A，而是 B là cặp cố định."],["“百善孝为先” nghĩa là gì?",["孝是所有美德中最重要的。","走路的时候孝顺的人要走在前面。"],0,"百善 = trăm điều thiện; 为先 = đứng đầu."],["Câu kết nào tốt hơn?",["好了，我说完了。","总之，真正的孝是用行动表达对父母的爱。"],1,"Kết bài cần quay lại chủ đề và khẳng định quan điểm."]],"fix":[["我很孝顺对父母。","我很孝顺父母。／我对父母很孝顺。","孝顺 mang tân ngữ trực tiếp; nếu dùng 对 thì đặt trước 孝顺."],["孝顺是中国的传统美德之一个。","孝顺是中国的传统美德之一。","……之一 = một trong những…; không thêm 个."],["我们要尊敬父母的意见。","我们要尊重父母的意见。","尊敬 dùng cho người (尊敬老人); với ý kiến, lựa chọn dùng 尊重."],["陪伴父母是我们的义务和责任心。","陪伴父母是我们的义务和责任。","责任心 = tinh thần trách nhiệm (khác nghĩa)."],["父母越来越年纪大了。","父母的年纪越来越大了。","越来越 + tính từ; chủ ngữ là 年纪."],["他并没有因为工作忙，反而忘记父母。","他并没有因为工作忙而忘记父母。","Khung 好句: 并没有因为 A 而 B — không bỏ 而; 反而 dùng ở vế sau nêu điều ngược lại."]],"tpl":"说到“孝”，很多人会想到【……】。我认为，孝不只是【物质上……】，更是【精神上……】。比如【一个例子】。我们应该【具体做法】。总之，真正的孝是【总结】。","chk":[["topic","Bám đề: có nói về “孝” (孝 · 孝顺 · 孝敬)","孝"],["view","Có nêu quan điểm (我认为 · 在我看来 · 我觉得)","我认为|在我看来|我觉得|我的看法"],["def","Có câu định nghĩa (不只是…更是 · 不是…而是 · 不等于 · 就是)","不只是|不仅|而是|不等于|就是|意思是"],["eg","Có ví dụ (比如 · 拿我自己来说 · 例如)","比如|拿我|例如|有一次|身边|子路"],["how","Có việc nên làm (应该 · 要 · 可以 · 从小事做起)","应该|我们要|可以|做起|多陪|常回家|下决心"],["end","Có kết luận (所以 · 总之 · 因此 · 真正的孝)","所以|总之|因此|真正的孝"]],"wmin":80,"wmax":150,"traps3":"<b>Bắt buộc có:<\/b> một câu định nghĩa (不只是……更是…… / 不是……而是……), một ví dụ và một câu kết luận. Đề viết của sách: “从《子路背米》想到的”, không ít hơn 100 chữ — xem 范文 3.","var_title":"“谈看法”的题目都可以这样回答","var_lead":"Mọi đề “谈谈你对……的看法 / 你怎么看……” đều dùng được khung: <b>dẫn chủ đề → định nghĩa của tôi → việc làm + ví dụ → kết luận<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）从《子路背米》想到的","读了《子路背米》，我很受感动。我认为……"],["你怎么看“养儿防老”这句话？","“养儿防老”是一种传统的想法。在我看来，……"],["现代年轻人应该怎样孝顺父母？","我认为，现代年轻人孝顺父母，最重要的是……"],["父母老了以后，应该住养老院还是跟孩子一起住？","对这个问题，我的看法是……"],["你们国家和中国在“孝”的方面有什么相同和不同？","在越南和中国，孝都是重要的传统，不过……"],["谈谈你对“尊老爱幼”的看法。","“尊老爱幼”是中华民族的传统美德。我认为……"]],"homework":"<b>Bài về nhà:<\/b> chọn một góc nhìn (A–D) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ theo đề sách “从《子路背米》想到的” · bắt buộc có câu định nghĩa, một ví dụ, một câu kết luận và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();
/* ---------- TTS ---------- */
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};

function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
