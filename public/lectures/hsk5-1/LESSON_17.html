<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 17 · 在最美好的时刻离开 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

片"]]],["状语","中心语",[["迅速（地）","提高／产生／出现／采取措施／做出反应"],["正确／灵活／成功／科学／广泛（地）","运用"]]],["中心语","补语",[["集中","在……／到……／起来"],["体会","到……／出……／一下"]]]],"META":{"num":17,"title":"在最美好的时刻离开","vn":"Rời đi vào thời khắc tốt đẹp nhất","tagline":"峰终定律：我们只记住高峰和结尾","editor":"明书","source":"改编自《广州日报》，作者：埃卡特·冯·希施豪森，陈晓川译","theme":{"main":"#b0446a","deep":"#762c47","accent":"#d99a2b","soft":"#f8e9ef","cream":"#fefafb","line":"#ecccd8","ink":"#3a1220"},"cards":{"warm":"戏剧与开幕式 · 长辈的话","vocab":"33 个生词 · 搭配 · 辨析","text":"峰终定律 · 演出 · 婚礼 · 电影 · 节目 · 好句","grammar":"以 · 平常 · 宁可","practice":"练习 1–4 · 扩展 · 自动评分","game":"翻卡 · 配对 · 填词 · 排序","hsk":"新版HSK · 阅读 · 书写","apply":"写作专题：婚礼"}},"NOLINK":["诺贝尔奖","丹尼尔·卡内曼","峰终定律"],"V":[["事物","shìwù","名","sự vật",0,"指客观存在的一切物体和现象。","……我们对事物的记忆仅在高峰和结尾……","孩子们对新事物都很好奇。","Trẻ em đều tò mò với sự vật mới.",["新事物"],""],["高峰","gāofēng","名","đỉnh cao, cao điểm",1,"高的山峰；比喻事物发展的最高点。","……我们对事物的记忆仅在高峰和结尾……","上下班高峰的时候，地铁里人特别多。","Giờ cao điểm đi làm, tàu điện ngầm rất đông.",["高峰时间","高峰期"],""],["终点","zhōngdiǎn","名","điểm cuối cùng, điểm kết thúc",1,"一段路程结束的地方；特指竞赛的终止点。","高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","他第一个跑到了终点。","Anh ấy chạy về đích đầu tiên.",["到达终点"],""],["迅速","xùnsù","形","nhanh chóng",1,"速度高，非常快。","高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","事情发生后，领导迅速采取了措施，积极应对。","Sau khi sự việc xảy ra, lãnh đạo nhanh chóng áp dụng biện pháp, tích cực ứng phó.",["迅速（地）提高","迅速产生","迅速出现","迅速做出反应"],""],["深刻","shēnkè","形","sâu sắc",1,"达到事情或问题的本质的；内心感受程度很深的。","高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。","这次旅行给我留下了深刻的印象。","Chuyến đi này để lại cho tôi ấn tượng sâu sắc.",["深刻的印象","深刻的记忆","深刻的道理"],"辨析：深刻—深。见“辨析”部分。"],["戏剧","xìjù","名","kịch, vở tuồng",0,"通过演员表演故事来反映社会生活的艺术，如话剧、京剧。","比如说为了一场戏剧演出……","她从小就喜欢看戏剧。","Từ nhỏ cô ấy đã thích xem kịch.",["戏剧演出"],""],["投入","tóurù","动／名／形","đưa vào, bỏ vốn; kinh phí đầu tư; xuất thần",1,"投到某种环境里去；投放资金；做事情集中精力。","……我们会投入很多时间……","他工作很投入，常常忘了吃饭。","Anh ấy làm việc rất say mê, thường quên ăn.",["投入时间","投入使用","很投入"],""],["服装","fúzhuāng","名","trang phục",0,"衣服鞋帽的总称，一般专指衣服。","……准备服装、化妆、道具、舞台美术……","演员们穿着漂亮的服装。","Các diễn viên mặc trang phục đẹp.",["民族服装"],""],["化妆","huà zhuāng","动","trang điểm",0,"用脂粉等使容貌美丽。","……准备服装、化妆、道具、舞台美术……","她每天早上化妆要半个小时。","Mỗi sáng cô ấy trang điểm mất nửa tiếng.",["化妆品"],""],["道具","dàojù","名","đạo cụ",0,"演出戏剧或拍电影时所用的器物。","……准备服装、化妆、道具、舞台美术……","演出前，他们准备了很多道具。","Trước buổi diễn họ chuẩn bị rất nhiều đạo cụ.",[],""],["美术","měishù","名","nghệ thuật tạo hình",0,"造型艺术，通常指绘画、雕塑等；也特指绘画。","……准备服装、化妆、道具、舞台美术……","我的美术老师画画儿画得特别好。","Thầy dạy mỹ thuật của tôi vẽ rất đẹp.",["舞台美术","美术馆"],""],["以","yǐ","连／介","để, nhằm; dùng, lấy",1,"连词，表示目的（书面语）；介词，意思是“用、拿、凭借”。","……准备服装、化妆、道具、舞台美术，以创造良好的效果……","虽然我们已经老了，但还要坚持学习，以适应社会的发展。","Tuy đã già nhưng chúng tôi vẫn kiên trì học tập để thích ứng với sự phát triển xã hội.",["以……为……","以便"],"见“注释”：以。"],["良好","liánghǎo","形","tốt đẹp, tốt",1,"令人满意的；好。","……准备服装、化妆、道具、舞台美术，以创造良好的效果……","他从小就养成了良好的习惯。","Từ nhỏ anh ấy đã hình thành thói quen tốt.",["良好的效果","良好的习惯"],""],["争取","zhēngqǔ","动","cố gắng, tranh thủ, giành",1,"力求获得；力求实现。","……争取给观众留下一个好的印象……","机会要靠自己去争取。","Cơ hội phải tự mình giành lấy.",["争取时间","争取机会","争取胜利","争取考好"],""],["忽视","hūshì","动","xem nhẹ, không chú ý",1,"不注意；不重视。","……却常常忽视结束退场时的准备。","我们过多地看电视、玩手机，忽视了家人之间的交流。","Chúng ta xem tivi, chơi điện thoại quá nhiều, bỏ quên giao tiếp giữa người thân.",["忽视……的准备","不能忽视"],"辨析：忽视—轻视。见“辨析”部分。"],["魅力","mèilì","名","sức hấp dẫn",1,"很能吸引人的力量。","演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","这座古城很有魅力。","Cổ thành này rất có sức hút.",["很有魅力","人格魅力"],""],["糟糕","zāogāo","形","tồi tệ, hỏng bét",1,"指情况或事情很坏。","演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。","糟糕，我忘带钥匙了！","Chết rồi, tôi quên mang chìa khóa!",["糟糕的结局","太糟糕了"],""],["婚礼","hūnlǐ","名","lễ cưới",0,"结婚的仪式。","有一次，我去参加一个婚礼，前三个小时感觉都很好，只在最后一个小时感到无聊。","下个月我要去参加朋友的婚礼。","Tháng sau tôi đi dự đám cưới bạn.",["参加婚礼","举行婚礼"],""],["等于","děngyú","动","bằng",0,"某数量跟另一数量相等；差不多就是。","三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。","一加一等于二。","Một cộng một bằng hai.",["等于说"],""],["度过","dùguò","动","trải qua",1,"过（时间）。","三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。","我在外公外婆身边 à mẹ, bà thà để mình mệt một chút còn hơn để con thiệt thòi.",["宁可……也不……","宁可……也要……"],"见“注释”：宁可。"],["集中","jízhōng","动／形","tập trung; chăm chú",1,"把分散的人、事物、力量等聚集起来；不分散。","……我们宁可把更多的精力集中在闭幕式上……","你复习时要集中注意力，效果才会好。","Khi ôn bài phải tập trung chú ý, hiệu quả mới tốt.",["集中精力","集中注意力","集中起来"],""],["体会","tǐhuì","动／名","hiểu rõ, nhận thức rõ; nhận thức",1,"体验领会；体验领会到的东西。","虽然很多人并不了解“峰终定律”，但是，他们能从经验中体会这种做法的重要性。","我刚开始学滑雪的时候，最大的体会就是要放松，越紧张越容易摔倒。","Lúc mới học trượt tuyết, điều tôi thấm nhất là phải thả lỏng, càng căng thẳng càng dễ ngã.",["体会到","体会一下","最大的体会"],""],["诺贝尔奖","Nuòbèi'ěr Jiǎng","专名","Giải Nô-ben",0,"以诺贝尔名字命名的国际奖项。","因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。","他获得了诺贝尔奖。","Ông ấy đoạt giải Nobel.",[],""],["丹尼尔·卡内曼","Dānní'ěr·Kǎnèimàn","专名","Daniel Kahneman",0,"美国心理学家，2002年获诺贝尔经济学奖。","因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。","丹尼尔·卡内曼是一位心理学家。","Daniel Kahneman là một nhà tâm lý học.",[],""],["峰终定律","Fēngzhōng Dìnglǜ","专名","Quy luật cao điểm – điểm cuối cùng",1,"人们对事物的记忆主要取决于高峰和结尾时的感受。","他将这一现象命名为“峰终定律”……","主持人常常运用峰终定律。","Người dẫn chương trình thường vận dụng quy luật đỉnh – kết.",[],""]],"WARM":[{"tab":"看图找词","title":"看图片，找出本课生词中跟它们有关的词语","type":"reveal","lead":"Sách dùng ảnh một diễn viên kinh kịch và ảnh lễ khai mạc một hội nghị. Đọc mô tả, nói từ mới phù hợp, rồi bấm “？”. Ví dụ của sách: 戏剧.","items":[["🎭 京剧演员脸上画的","化妆","trang điểm"],["👘 演员穿的衣服","服装","trang phục"],["🪭 演出时用的扇子、刀等东西","道具","đạo cụ"],["🎤 会议、节目开始时的仪式","开幕式","lễ khai mạc"],["🧑‍💼 在台上介绍节目的人","主持人","người dẫn chương trình"],["🎬 京剧、话剧等","戏剧","kịch"]],"note":"Ảnh 1 (kinh kịch): <b class='zh'>戏剧、化妆、服装、道具<\/b>; ảnh 2 (hội nghị): <b class='zh'>开幕式、主持<\/b>."},{"tab":"长辈的话","title":"在你小时候，长辈们说过什么让你印象最深刻的话？","type":"discuss","q":"在你小时候，长辈们说过什么让你印象最深刻的话？请给老师和同学们讲一讲。","vn":"Hồi nhỏ, người lớn từng nói câu gì khiến bạn ấn tượng sâu sắc nhất? Hãy kể cho thầy cô và các bạn.","answer_zh":"我奶奶常说：“吃饭的时候要吃七分饱，做事的时候要留三分余地。”小时候我不明白，长大以后才体会到这句话的道理。","answer_vn":"Câu hỏi dẫn vào bài khóa: tác giả mở bài bằng câu của bà mình — “人们应该在最美好的时候离开”."},{"tab":"你记得什么","title":"一次旅行，你记得最清楚的是什么？","type":"discuss","q":"回想一次旅行或一次聚会，你记得最清楚的是哪个部分？是最开心的时候，还是最后结束的时候？","vn":"Nhớ lại một chuyến đi hay một buổi tụ tập, bạn nhớ rõ nhất phần nào? Lúc vui nhất hay lúc kết thúc?","answer_zh":"去年去海边旅行，我记得最清楚的是在海边看日出的那一刻，还有最后一天晚上大家一起唱歌。中间的事情反而记不太清了。","answer_vn":"Đây chính là “峰终定律” (quy luật đỉnh – kết): ta chỉ nhớ lúc cao trào và lúc kết thúc."}],"GAME":{"fill":[["我们对{}的记忆仅在高峰和结尾……","事物",["事物","事情","事实","食物"]],["高峰之后，终点出现得越{}……","迅速",["迅速","速度","迅猛","快速"]],["这件事留给我们的印象就越{}。","深刻",["深刻","深入","刻苦","深厚"]],["我们会{}很多时间……","投入",["投入","收入","进入","加入"]],["却常常{}结束退场时的准备。","忽视",["忽视","重视","轻松","注视"]],["演出开始时人们认为很有{}……","魅力",["魅力","能力","力气","努力"]],["我愉快地{}了两个小时。","度过",["度过","经过","通过","超过"]],["我们{}会向别人推荐它。","依然",["依然","虽然","果然","居然"]],["观众对这部电影的{}就肯定不好……","评价",["评价","价格","评论","价值"]],["我们{}把更多的精力集中在闭幕式上……","宁可",["宁可","可是","可能","愿意"]]],"order":[["我奶奶说过：|“人们应该|在最美好的时候|离开。”"],["大部分人|不理解|这一定律。"],["看电影|也是|如此。"],["我却享受了|满满|60分钟的|快乐。"],["这样可以|加强观众|对节目的|印象。"],["他们能|从经验中|体会这种做法的|重要性。"]]},"GOOD":[{"zh":"因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼","vn":"người nhờ nhận thức này mà đoạt giải Nobel không phải bà tôi, mà là nhà tâm lý học Daniel Kahneman","why":"Mở bài hài hước, gây chú ý: <b>因为……而……的，不是 A，而是 B<\/b> — cấu trúc 是……的 + 不是……而是…….","frame":"因为 + 原因 + 而 + 结果 + 的，不是 A，而是 B","apply":"因为这个发明而改变世界的，不是科学家，而是一个普通的工人。","apply_vn":"Người nhờ phát minh này mà thay đổi thế giới không phải nhà khoa học, mà là một công nhân bình thường."},{"zh":"高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻","vn":"sau điểm cao trào, điểm kết thúc xuất hiện càng nhanh thì ấn tượng sự việc để lại cho ta càng sâu sắc","why":"<b>……越……，……就越……<\/b>: mối quan hệ tăng tiến — dùng để nêu quy luật.","frame":"A + V得越……，B + 就越……","apply":"准备得越充分，考试的时候就越不紧张。","apply_vn":"Chuẩn bị càng kỹ thì khi thi càng không căng thẳng."},{"zh":"以创造良好的效果，争取给观众留下一个好的印象，却常常忽视结束退场时的准备","vn":"để tạo hiệu quả tốt, cố gắng để lại ấn tượng tốt cho khán giả, nhưng lại thường xem nhẹ việc chuẩn bị lúc kết thúc rời sân khấu","why":"<b>……，以……，却常常忽视……<\/b>: nêu mục đích (以 · 注释) rồi chỉ ra điểm bị bỏ qua — câu phê bình rất hay.","frame":"（做法），以 + 目的，却常常忽视 + ……","apply":"很多学生每天上很多补习班，以提高成绩，却常常忽视了休息和运动。","apply_vn":"Nhiều học sinh học thêm rất nhiều để nâng điểm, nhưng thường bỏ quên nghỉ ngơi và vận động."},{"zh":"与第一次相比，第二次的聚会留给我的印象更为美好","vn":"so với lần thứ nhất, buổi tụ tập thứ hai để lại cho tôi ấn tượng tốt đẹp hơn","why":"So sánh văn viết: <b>与 A 相比，B 更为……<\/b> (更为 = 更, văn viết).","frame":"与 A 相比，B + 更为 + 形容词","apply":"与城市相比，农村的生活更为安静。","apply_vn":"So với thành phố, cuộc sống nông thôn yên tĩnh hơn."},{"zh":"与开幕式相比，我们宁可把更多的精力集中在闭幕式上","vn":"so với lễ khai mạc, chúng tôi thà dồn nhiều công sức hơn cho lễ bế mạc","why":"<b>与……相比，宁可把……集中在……上<\/b>: nêu lựa chọn sau khi so sánh (宁可 · 注释).","frame":"与 A 相比，我们宁可把……集中在 B 上","apply":"与买很多便宜的衣服相比，我宁可把钱集中在一件好衣服上。","apply_vn":"So với mua nhiều quần áo rẻ, tôi thà dồn tiền vào một bộ đồ tốt."}],"GRAMMAR":[{"word":"以","py":"yǐ","pos":"介词／连词","forms":["介词：以 + 名词（= 用、拿、凭借，书面语）：以英文名进入市场、以足球为工具","连词：……，以 + 动词短语（表示目的，书面语）"],"vn":"<b>以<\/b> ① giới từ (văn viết): <b>dùng, lấy, bằng<\/b> = 用、拿、凭借 — 以英文名WeChat进入国际市场 (bài 12), 以足球为比赛工具 (bài 13). ② liên từ: <b>để, nhằm<\/b> — đứng đầu vế sau, nêu mục đích: ……，以创造良好的效果.","text":"比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果……","ex":[["同年4月，（微信）以英文名WeChat正式进入国际市场。","Tháng 4 cùng năm, WeChat chính thức vào thị trường quốc tế với tên tiếng Anh WeChat. (giới từ)"],["学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。","Học sinh chia hai đội, dùng quả bóng đá làm dụng cụ ném vào rổ, thắng thua theo số điểm. (giới từ)"],["虽然我们已经老了，但还要坚持学习，以适应社会的发展。","Tuy đã già nhưng vẫn phải kiên trì học để thích ứng với sự phát triển xã hội. (liên từ)"]],"err":[["❌ 以他用英语说。","✅ 他以英语发言。／他用英语说。","以 là văn viết, câu khẩu ngữ dùng 用."],["❌ 以提高成绩，他每天学习到很晚。","✅ 他每天学习到很晚，以提高成绩。","以 chỉ mục đích đứng đầu vế sau."]],"book":[["A：你知道济南的泉水是怎么命名的吗？<br>B：____________。（以－介词）","Gợi ý: lấy tên người, động vật, hình dạng để đặt tên.","济南的泉水有的以人名命名，有的以动物命名，有的以形状命名"],["这一个月来，我天天训练，____________。（以－连词）","Gợi ý: để giành thành tích tốt.","这一个月来，我天天训练，以争取在比赛中取得好成绩"],["虽然他不回信，但我还是坚持给他写，____________。（以－连词）","Gợi ý: để anh ấy biết tôi luôn nhớ anh ấy.","以表示我一直没有忘记他"]],"drill":[["“以”在这里是什么词？ ……以创造良好的效果。",["介词","连词"],1,"Nêu mục đích → liên từ."],["“以”在这里是什么词？ 微信以英文名WeChat进入国际市场。",["介词","连词"],0,"= 用 → giới từ."],["选择：大家要迅速地熟悉新产品，____更好地向顾客推广。",["以","用"],0,"Mục đích → 以 (课本练习2)."]]},{"word":"平常","py":"píngcháng","pos":"形容词／名词","forms":["形容词：（很）平常（= 普通，没什么特别）；平平常常","名词：平常（= 平时）：平常总是……；像平常一样"],"vn":"<b>平常<\/b> ① tính từ: <b>bình thường, không có gì đặc biệt<\/b> — 剧情平平常常, 这部电影很平常. ② danh từ: <b>ngày thường, lúc bình thường<\/b> (= 平时) — 他平常总是来得很早.","text":"一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。","ex":[["对小王来说，今天是一个不平常的日子，因为他今天第一天上班。","Với Tiểu Vương, hôm nay là một ngày không bình thường vì là ngày đầu đi làm. (tính từ)"],["他平常总是来得很早，今天却迟到了。","Bình thường anh ấy luôn đến sớm, hôm nay lại muộn. (danh từ)"],["校长又告诉老师们，对待这些孩子，要像平常一样，不要让孩子或家长知道他们是被选出来的。","Hiệu trưởng dặn các thầy cô đối xử với những em này như bình thường, đừng để các em hay phụ huynh biết các em được chọn. (danh từ)"]],"err":[["❌ 他平时很。","✅ 他很平常。／这个人很普通。","平时 chỉ là danh từ, không làm vị ngữ tính từ."],["❌ 平常的日子不平常。","✅ 今天是一个不平常的日子。","Tránh lặp từ vô nghĩa; 不平常 = đặc biệt."]],"book":[["A：你觉得这本书怎么样？<br>B：____________。（平常－形容词）","Gợi ý: nội dung bình thường, không hấp dẫn lắm.","内容很平常，不太吸引人"],["____________，考试前就不用这么紧张了。（平常－名词）","Gợi ý: ngày thường chăm học.","平常多努力一点儿，考试前就不用这么紧张了"],["A：____________。（平常－名词）<br>B：我一般都是自己做饭吃。","Gợi ý: hỏi ngày thường ăn ở đâu.","你平常都在哪儿吃饭"]],"drill":[["“平常”在这里是什么词？ 这部电影很平常。",["形容词","名词"],0,"Có 很 → tính từ."],["“平常”在这里是什么词？ 我平常七点起床。",["形容词","名词"],1,"= 平时 → danh từ."],["选择：这部电影很____，我觉得没必要去看。",["平常","平时"],0,"Tính từ → 平常 (课本练习2)."]]},{"word":"宁可","py":"nìngkě","pos":"副词","forms":["宁可 A，也不 B（比较后选 A，不选 B）","宁可 A，也要 B（为了 B，愿意付出 A）"],"vn":"<b>宁可<\/b> là phó từ: <b>thà rằng<\/b> — sau khi so sánh lợi hại thì chọn một bên. Hai cấu trúc: <b>宁可 A，也不 B<\/b> (thà A chứ không B); <b>宁可 A，也要 B<\/b> (thà chịu A cũng phải B).","text":"做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上……","ex":[["作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","Là mẹ, bà thà mình mệt một chút chứ không muốn con thiệt thòi."],["为什么大家宁可挤成一团，也不去没人的那边？","Sao mọi người thà chen chúc thành đám chứ không sang bên không có người?"],["我宁可多花点儿钱，也要买一个质量好点儿的。","Tôi thà tốn thêm chút tiền cũng phải mua cái chất lượng tốt hơn."]],"err":[["❌ 我宁可饿着，也吃这种东西。","✅ 我宁可饿着，也不吃这种东西。","宁可 A 也不 B: vế sau phủ định."],["❌ 宁可我走路，也不坐车。","✅ 我宁可走路，也不坐车。","宁可 đứng sau chủ ngữ."]],"book":[["我宁可花钱去餐厅吃，____________。","Gợi ý: cũng không muốn tự nấu.","我宁可花钱去餐厅吃，也不想自己做饭"],["为了把这篇文章写好，____________。（宁可）","Gợi ý: thà thức khuya mấy đêm.","为了把这篇文章写好，他宁可熬几个晚上"],["A：这次旅行，你觉得我们是坐飞机去好还是坐火车去好？<br>B：____________。（宁可）","Gợi ý: thà đắt một chút cũng đi máy bay, tiết kiệm thời gian.","我宁可多花点儿钱也要坐飞机，这样能节省很多时间"]],"drill":[["“宁可”放在哪里？ <u>A<\/u>我<u>B<\/u>多<u>C<\/u>花点儿钱，<u>D<\/u>也要买一个质量好点儿的。",["A","B","C"],1,"我宁可多花点儿钱 (课本练习3)."],["选择：我宁可走路，____不坐他的车。",["也","就","才"],0,"宁可……也不……"],["“宁可”的意思是：",["比较后选择一方","一定不","可以"],0,"Thà rằng."]]}],"HSK":{"r1":[{"text":["上个月，我的好朋友小林结婚了。婚礼那天，新娘穿着白色的婚纱，{36}。婚礼开始以后，小林的父亲讲了一段话，{37}，很多客人都感动得哭了。不过，婚宴时间太长了，最后一个小时大家都在看手机，{38}。"],"qs":[{"n":36,"o":["看起来非常漂亮","一直在看手机","觉得很无聊","很快就回家了"],"a":0,"why":"描写新娘穿婚纱的样子，用“看起来非常漂亮”。"},{"n":37,"o":["说得很快","说得特别感人","说得有点儿长","说得大家都笑了"],"a":1,"why":"后文“很多客人都感动得哭了”，说明他的话特别感人。"},{"n":38,"o":["气氛越来越热闹","有些客人提前走了","大家都很兴奋","新娘又换了衣服"],"a":1,"why":"大家觉得无聊，都在看手机，所以有人提前走了。"}]},{"text":["心理学家发现，人们对一段经历的记忆，{39}，而是主要由两个时刻决定：一个是最好或最坏的时刻，另一个是结束的时刻。这就是“峰终定律”。比如，去游乐园玩儿，{40}，可是如果最后坐过山车时特别开心，回家后人们依然会觉得这是愉快的一天。很多商家也运用了这个规律，{41}，以便让顾客留下美好的印象。所以，{42}，结尾一定要安排好。"],"qs":[{"n":39,"o":["和时间长短有直接关系","并不是由整个过程决定的","只和天气有关","每个人都一样"],"a":1,"why":"“……，而是……”前面应是否定说法“并不是……”。"},{"n":40,"o":["人们一进门就离开了","门票非常便宜","大部分时间都在排队","人们会一直特别开心"],"a":2,"why":"“可是”前后意思相反：排队很累，但结尾开心。"},{"n":41,"o":["在顾客离开时送一个小礼物","让顾客等很长时间","把价格提高一倍","不让顾客说话"],"a":0,"why":"送小礼物是为了让顾客“留下美好的印象”。"},{"n":42,"o":["只要开头好就行","做什么事都不用计划","想让别人记住一件事","过程比结果更重要"],"a":2,"why":"根据峰终定律，想让别人记住一件事，结尾要安排好。"}]}],"r2":[{"start":46,"paras":["可是到了最后一个小时，新郎新娘一直在敬酒，客人们觉得越来越无聊。","前三个小时，婚礼安排得非常好，大家都很开心。","回家以后，他想起这个婚礼时，记得最清楚的却是最后的无聊。","去年，李先生参加了一个朋友的婚礼。","这让他明白了：一件事结束得好不好，对人们的印象影响很大。"],"ans":["D","B","A","C","E"],"why":"参加婚礼（D）→ 前三个小时很好（B）→ 最后一个小时无聊（A）→ 记得最清楚的是无聊（C）→ 道理（E）。"}],"r3":[{"text":["宜家（IKEA）是一家有名的家居商场。很多人去宜家购物时，会遇到不少不愉快的事情：商场太大，常常找不到想要的东西；店员很少，有问题没人回答；买完东西还要自己搬回家。","可是奇怪的是，很多顾客离开时依然觉得购物很愉快。这是为什么呢？","原来，宜家很好地运用了峰终定律。它的“峰”是逛样板间时的美好体验，<u><b>而“终”则是出口处一元钱的冰淇淋<\/b><\/u>。顾客在离开前吃到便宜又好吃的冰淇淋，购物过程中的不愉快就被大大冲淡了。","宜家的例子告诉我们，一段经历不需要每个时刻都完美，只要把高峰和结尾安排好，就能给人留下深刻的好印象。"],"qs":[{"n":56,"s":"在宜家购物时，顾客可能会遇到的不愉快不包括：","o":["找不到想要的东西","有问题没人回答","要自己搬东西","价格太贵"],"a":3,"why":"第一段提到前三个问题，没有提到价格太贵。"},{"n":57,"s":"第二段中“奇怪的是”指的是：","o":["宜家的东西很便宜","很多顾客依然觉得购物很愉快","商场太大","店员很少"],"a":1,"why":"遇到不少不愉快，却依然觉得愉快，所以觉得奇怪。"},{"n":58,"s":"画线句子中的“终”指的是：","o":["样板间","收银台","出口处一元钱的冰淇淋","停车场"],"a":2,"why":"画线句：“终”则是出口处一元钱的冰淇淋。"},{"n":59,"s":"这篇文章主要想告诉我们：","o":["宜家的冰淇淋最好吃","安排好高峰和结尾就能留下好印象","购物时不要去大商场","每个时刻都必须完美"],"a":1,"why":"最后一段是全文的中心。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出王先生参加婚礼的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện anh Vương dự đám cưới.","panels":[["💌","王先生收到朋友的请柬，很高兴地去参加婚礼。"],["💍","婚礼上新郎新娘交换戒指，大家都很感动。"],["📱","婚宴时间太长，最后客人们都在看手机，觉得很无聊。"],["🤔","回家后，王先生对这个婚礼的印象并不太好。"]],"min":100,"tips":["Kể theo 4 tranh: nhận thiệp → cao trào cảm động → kết nhàm chán → ấn tượng không đẹp (峰终定律).","Có thể dùng: 婚礼、深刻、度过、无聊、依然、峰终定律."],"sample":"上个月，王先生收到了好朋友的请柬，他很高兴地去参加了朋友的婚礼。婚礼开始以后，新郎新娘在大家面前交换了戒指，新娘感动得哭了，客人们也都热烈地鼓掌，那一刻给王先生留下了深刻的印象。可是，婚宴的时间实在太长了，最后一个小时，新郎新娘一直在敬酒，客人们都低着头看手机，觉得非常无聊。回家以后，王先生想起这个婚礼时，记得最清楚的却是最后的无聊。他想，这就是课上学过的峰终定律吧。","svn":"Anh Vương nhận thiệp, vui vẻ dự cưới; lúc trao nhẫn rất cảm động, ấn tượng sâu; nhưng tiệc quá dài, giờ cuối ai cũng cúi xem điện thoại; về nhà anh nhớ nhất lại là sự nhàm chán — đúng quy luật đỉnh – kết."},"w72":{"prompt":"有人说：“结果比过程更重要。”也有人说：“过程比结果更重要。”你同意哪种看法？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói “kết quả quan trọng hơn quá trình”, có người nói “quá trình quan trọng hơn kết quả”. Bạn đồng ý với ý nào? Viết bài không ít hơn 200 chữ.","min":200,"title":"过程与结果","tips":["Nêu hai ý kiến → quan điểm của mình → lý do 1 (quá trình giúp trưởng thành) → lý do 2 (峰终定律: kết quả/kết thúc để lại ấn tượng) → kết luận cân bằng.","Dùng: 宁可……也不……；以……；与……相比，……更为……；平常."],"sample":"有人认为结果比过程更重要，也有人认为过程比结果更重要。我比较同意后一种看法。\n首先，一个人在努力的过程中能学到很多东西。比如准备考试，哪怕最后的成绩不太理想，平常认真学习时积累的知识和方法依然是自己的。与一次考试的分数相比，这些收获更为重要。\n其次，只看结果的人，常常会忽视身边美好的东西，甚至为了结果而不择手段。我宁可慢一点儿，也不愿意错过路上的风景。\n当然，结果也不能完全不管。心理学上的峰终定律告诉我们，一件事结束得好不好，会深刻地影响人们的印象。所以，我们应该认真地度过每一个过程，同时也努力争取一个好的结果。\n总之，过程和结果都重要，但我们不应该只看结果。","svn":"Nghị luận: nêu hai ý → nghiêng về quá trình → 首先 quá trình cho kiến thức → 其次 chỉ nhìn kết quả dễ bỏ qua điều đẹp → 当然 kết quả cũng cần (峰终定律) → 总之 cả hai đều quan trọng."}},"PRACTICE":{"ex1":{"bank":["度过","集中","体会","推荐","运用","争取"],"items":[["我刚开始学滑雪的时候，最大的{}就是要放松，越紧张越容易摔倒。",["体会"]],["学知识不能死记硬背，要懂得灵活地{}。",["运用"]],["你复习时要{}注意力，效果才会好。",["集中"]],["一些现代营养学专家常常向大家{}“餐餐有蔬菜，每天有水果”。",["推荐"]],["我在外公外婆身边{}了美好的童年。",["度过"]],["机会要靠自己去{}。",["争取"]]]},"ex2":[["大家要迅速地熟悉新产品，____更好地向顾客推广。",["用","以"],1],["这次旅行给我留下了____的印象。",["深","深刻"],1],["这部电影很____，我觉得没必要去看。",["平常","平时"],0],["他被____为本校今年的十大“优秀毕业生”之一。",["评价","评"],1]],"ex3":[["事情<u>A<\/u>发生后，领导<u>B<\/u>采取了<u>C<\/u>措施，<u>D<\/u>积极应对。","迅速",1,"事情发生后，领导迅速采取了措施，积极应对。"],["<u>A<\/u>三个小时快乐减一个小时无聊<u>B<\/u>两个小时<u>C<\/u>快乐<u>D<\/u>。","等于",1,"三个小时快乐减一个小时无聊等于两个小时快乐。"],["十几年<u>A<\/u>过去了，<u>B<\/u>她<u>C<\/u>那么<u>D<\/u>美丽。","依然",2,"十几年过去了，她依然那么美丽。"],["<u>A<\/u>我<u>B<\/u>多<u>C<\/u>花点儿钱，<u>D<\/u>也要买一个质量好点儿的。","宁可",1,"我宁可多花点儿钱，也要买一个质量好点儿的。"]],"ex4":[["峰终定律","事物、迅速、深刻","心理学家卡内曼提出了“峰终定律”：我们对事物的记忆只在高峰和结尾。高峰之后终点出现得越迅速，印象就越深刻。"],["准备演出","戏剧、以、争取、忽视、糟糕","为了一场戏剧演出，人们准备服装、道具，以创造良好的效果，争取给观众留下好印象，却常常忽视结尾。糟糕的结局会留下坏印象。"],["参加活动","婚礼、等于、度过、告别","作者参加婚礼，前三个小时很好，最后一个小时无聊，算起来等于愉快地度过了两个小时。可是另一次活动只待一个小时就早早告别，印象却更美好。"],["看电影","平常、依然、评价","一部电影开始很平常，最后让人感动，我们依然会推荐它；结尾普通的电影，评价就不好。"],["做节目","主持、运用、宁可、体会","作者是主持人，常常运用峰终定律，宁可把更多精力集中在闭幕式上。很多人能从经验中体会这种做法的重要性。"]],"ext":{"title":"扩展 · 话题：医务 2","words":[["诊断","zhěnduàn","chẩn đoán"],["手术","shǒushù","phẫu thuật"],["血","xiě/xuè","máu"],["肌肉","jīròu","cơ bắp"],["骨头","gǔtou","xương"],["胃","wèi","dạ dày"],["心脏","xīnzàng","tim"],["病毒","bìngdú","virus"],["传染","chuánrǎn","lây nhiễm"],["寿命","shòumìng","tuổi thọ"]],"items":[["医生还在为他{}病情，请耐心地等待。","诊断"],["我的电脑速度越来越慢了，是不是中了{}？","病毒"],["这是一种新型的{}病，可能会在人和动物之间传播。","传染"],["海龟的{}最长可达150多年，是动物中当之无愧的老寿星。","寿命"]]}},"TEXT":[{"title":"峰终定律","sub":"只记住高峰和结尾","paras":["我奶奶说过：“人们应该在最美好的时候离开。”因为这个认知而获得诺贝尔奖的，不是我奶奶，而是心理学家丹尼尔·卡内曼。他将这一现象命名为“峰终定律”：我们对事物的记忆仅在高峰和结尾，而事情的经过对记忆几乎没有影响。高峰之后，终点出现得越迅速，这件事留给我们的印象就越深刻。"],"idea":"Bà tác giả nói: “nên rời đi vào lúc tốt đẹp nhất”. Nhà tâm lý học <b>Daniel Kahneman<\/b> (giải Nobel) gọi hiện tượng này là <b>“quy luật đỉnh – kết”<\/b>: ta chỉ nhớ <b>lúc cao trào và lúc kết thúc<\/b>, quá trình gần như không ảnh hưởng. Sau đỉnh, kết thúc đến càng nhanh, ấn tượng càng sâu.","qs":[["因为“人们应该在最美好的时候离开”这个认知而获得诺贝尔奖的是谁？",["作者的奶奶","心理学家丹尼尔·卡内曼","一位主持人"],1],["根据“峰终定律”，我们对事物的记忆在哪里？",["开始和经过","高峰和结尾","只有开始"],1],["怎样才能让印象更深刻？",["高峰之后，终点出现得越迅速越好","经过越长越好","开始越早越好"],0]]},{"title":"准备演出","sub":"常常忽视结尾","paras":["大部分人不理解这一定律。比如说为了一场戏剧演出，我们会投入很多时间，准备服装、化妆、道具、舞台美术，以创造良好的效果，争取给观众留下一个好的印象，却常常忽视结束退场时的准备。演出开始时人们认为很有魅力，但是糟糕的结局会给人留下难以忘记的坏印象。"],"idea":"Phần lớn người không hiểu quy luật này. Chuẩn bị một vở kịch, ta đầu tư nhiều thời gian cho <b>trang phục, trang điểm, đạo cụ, sân khấu<\/b> để gây ấn tượng tốt, nhưng thường <b>xem nhẹ phần kết thúc<\/b>. Mở đầu hấp dẫn mà <b>kết cục tồi tệ<\/b> thì để lại ấn tượng xấu khó quên.","qs":[["准备戏剧演出时，人们常常忽视什么？",["服装和化妆","结束退场时的准备","舞台美术"],1],["准备服装、化妆、道具是为了什么？",["创造良好的效果","节省时间","让演员高兴"],0],["糟糕的结局会怎么样？",["没有任何影响","给人留下难以忘记的坏印象","让人更喜欢这场演出"],1]]},{"title":"参加活动","sub":"记忆不是这样计算的","paras":["有一次，我去参加一个婚礼，前三个小时感觉都很好，只在最后一个小时感到无聊。三个小时快乐减一个小时无聊等于两个小时快乐，也就是说，我愉快地度过了两个小时。但是，我的记忆并不是这样计算的。如果我参加另外一次活动，只在那里待一个小时，早早地告别，我却享受了满满60分钟的快乐。与第一次相比，第二次的聚会留给我的印象更为美好。"],"idea":"Dự một <b>đám cưới<\/b>: ba giờ đầu vui, giờ cuối chán. Tính toán thì vẫn còn “hai giờ vui”, nhưng <b>trí nhớ không tính như vậy<\/b>. Một buổi khác chỉ ở một giờ rồi <b>sớm chia tay<\/b>, lại có trọn 60 phút vui — buổi thứ hai để lại ấn tượng <b>đẹp hơn<\/b>.","qs":[["在那个婚礼上，作者什么时候感到无聊？",["前三个小时","最后一个小时","一直都很无聊"],1],["作者在另一次活动中待了多长时间？",["一个小时","两个小时","四个小时"],0],["哪一次聚会留给作者的印象更美好？",["婚礼","第二次的聚会","两次一样"],1]]},{"title":"看电影","sub":"好结尾，好评价","paras":["看电影也是如此。一部电影，开始虽然剧情平平常常，如果最后半个小时能使我们感动，我们依然会向别人推荐它。相反，如果在前半个小时就把剧情的创造力表现得淋漓尽致，结尾却非常普通，那么，观众对这部电影的评价就肯定不好，甚至会说这是一部“烂片”。"],"idea":"Xem phim cũng vậy: mở đầu <b>bình thường<\/b> nhưng nửa giờ cuối cảm động, ta <b>vẫn giới thiệu<\/b> cho người khác. Ngược lại, nửa giờ đầu thể hiện hết sáng tạo mà kết thúc tầm thường, khán giả sẽ <b>đánh giá không tốt<\/b>, thậm chí gọi là “phim dở”.","qs":[["什么样的电影我们依然会向别人推荐？",["开始平常，最后半个小时让人感动","开始精彩，结尾普通","很长的电影"],0],["“烂片”是什么意思？",["很好看的电影","很差的电影","很旧的电影"],1],["这段话想说明什么？",["电影的结尾非常重要","电影越长越好","开头最重要"],0]]},{"title":"做节目","sub":"宁可把精力集中在闭幕式上","paras":["作为电视节目主持人，我在工作中常常会运用“峰终定律”。例如，做节目时，与开幕式相比，我们宁可把更多的精力集中在闭幕式上，这样可以加强观众对节目的印象。虽然很多人并不了解“峰终定律”，但是，他们能从经验中体会这种做法的重要性。"],"idea":"Là người dẫn chương trình truyền hình, tác giả thường <b>vận dụng quy luật đỉnh – kết<\/b>: so với lễ khai mạc, <b>thà dồn nhiều công sức hơn cho lễ bế mạc<\/b>, để khán giả ấn tượng sâu hơn. Nhiều người không biết quy luật này nhưng tự <b>cảm nhận<\/b> được tầm quan trọng từ kinh nghiệm.","qs":[["作者是做什么工作的？",["心理学家","电视节目主持人","电影演员"],1],["做节目时，作者把更多的精力集中在哪里？",["开幕式","闭幕式","广告"],1],["很多人不了解“峰终定律”，但是他们能怎么样？",["从经验中体会这种做法的重要性","马上去学习","不同意这种做法"],0]]}],"TEXT_EXTRA":{"compare_title":"峰终定律的例子","compare_head":["例子","高峰 / 结尾","留下的印象"],"compare":[["戏剧演出","开始很有魅力，结局糟糕","难以忘记的坏印象"],["婚礼","前三小时很好，最后一小时无聊","印象不太好"],["一小时的聚会","早早地告别","印象更为美好"],["电影","最后半小时让人感动","依然会推荐"],["电视节目","把精力集中在闭幕式上","加强观众的印象"]],"bg":"汉语中的“婚礼”这个词原来是“昏礼”，“昏”是“黄昏（huánghūn）”、“傍晚”的意思。因为古人认为在傍晚举行婚礼，可以使婚姻美满（měimǎn）、家庭幸福。参加婚礼是为了给新人的爱情做见证（jiànzhèng），同时送上你对新人的祝福和希望。婚礼是一个喜庆的活动，美食和娱乐自然也少不了，有人喜欢参加，也有人有自己的看法。本课课文的作者说他参加过一个婚礼，前三个小时感觉都很好，最后一个小时感到无聊。你参加过婚礼吗？你觉得有没有意思？","bg_vn":"Chữ “婚礼” vốn là “昏礼” — 昏 là hoàng hôn, vì người xưa cho rằng cưới lúc chiều tối thì hôn nhân viên mãn, gia đình hạnh phúc. Dự đám cưới là để làm chứng cho tình yêu đôi trẻ và gửi lời chúc phúc.","discuss_title":"话题讨论：婚礼","discuss":["你了解过或参加过中国人的婚礼吗？印象深刻的地方是什么？","你们国家的婚礼和中国人的婚礼有哪些不同？","你觉得什么样的婚礼能给人留下令人难忘的美好记忆？"],"write":"请以“婚礼”为题，谈一谈你参加过的婚礼，或你们国家婚礼的特点，比较一下和中国婚礼有什么相同和不同之处。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“婚礼”为题，谈一谈你参加过的婚礼，或你们国家婚礼的特点，比较一下和中国婚礼有什么相同和不同之处","topic_vn":"Viết bài với đầu đề “Đám cưới”: kể đám cưới bạn từng dự hoặc đặc điểm đám cưới nước bạn, so sánh giống và khác với đám cưới Trung Quốc","intro":"Dạng đề giới thiệu + so sánh (介绍＋比较) · Một đám cưới cụ thể / đặc điểm đám cưới nước mình → điểm giống Trung Quốc → điểm khác → cảm nhận (có thể dùng 峰终定律) · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“婚礼”：介绍 + 比较 + 感受","lead":"Đề có hai lựa chọn: <b>kể một đám cưới bạn đã dự<\/b> hoặc <b>giới thiệu đặc điểm đám cưới nước bạn<\/b>; dù chọn cách nào cũng phải <b>so sánh với đám cưới Trung Quốc<\/b> (相同 + 不同). Điểm cộng: liên hệ bài khóa — một đám cưới thế nào thì để lại <b>ký ức đẹp<\/b> (峰终定律).","parts":[["婚礼","Đối tượng: lễ cưới — thời gian, nghi thức, trang phục, tiệc, quà mừng…"],["参加过的 / 你们国家","Chọn một: kể trải nghiệm cụ thể hoặc giới thiệu phong tục chung."],["相同和不同之处","Bắt buộc so sánh: ít nhất 1 điểm giống, 1–2 điểm khác."],["（课本）尽量用上本课所学的生词，不少于100字","Dùng: 婚礼、服装、化妆、争取、忽视、深刻、度过、告别、平常、依然、宁可… và khung 好句 của bài khóa."]],"traps":[["Chỉ kể, không so sánh","Đề yêu cầu 比较 — thiếu là lạc đề một nửa."],["Liệt kê quá nhiều nghi thức","Chọn 2–3 điểm tiêu biểu: màu sắc (红 / trắng), quà mừng (红包), lễ ăn hỏi…"],["Thông tin sai về Trung Quốc","Chỉ viết điều chắc: 中国传统婚礼喜欢红色、新娘穿红色的衣服、要给红包."],["Thiếu cảm nhận","Kết bài nên có: 什么样的婚礼能给人留下美好的记忆."]],"link":"<b>Liên hệ bài 17:<\/b> tác giả dự một đám cưới — ba giờ đầu vui, giờ cuối chán → ấn tượng không đẹp (峰终定律). Phần 背景分析: “婚礼” vốn là “昏礼” (cưới lúc hoàng hôn), dự cưới là để <b>做见证、送祝福<\/b>."},"steps":[["①","点题","Mở bài: giới thiệu đám cưới bạn kể / đám cưới nước bạn.","去年我参加了……的婚礼。"],["②","介绍特点","2–3 đặc điểm: trang phục, nghi thức, tiệc, quà.","越南的婚礼一般……"],["③","比较：相同与不同","<b>Trọng tâm.<\/b> Giống Trung Quốc ở đâu, khác ở đâu.","和中国婚礼相比，……"],["④","感受","Kết: cảm nhận; đám cưới thế nào thì đáng nhớ.","我觉得……"]],"formula":["我参加了……的婚礼","特点：……","相同……；不同……","感受：最美好的记忆"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 越南婚礼 vs 中国婚礼","so sánh phong tục","Giới thiệu lễ ăn hỏi, áo dài, mâm quả; so với 红色、红包 của Trung Quốc.","越南新娘穿红色奥黛"],["B · 我参加过的一次婚礼","trải nghiệm cụ thể","Kể một đám cưới đáng nhớ (hoặc đáng chán) và lý do.","最后一个小时很无聊"],["C · 峰终定律与婚礼","liên hệ bài khóa","Đám cưới nên chú trọng phần kết để để lại ấn tượng đẹp.","早早地告别"],["D · 现代婚礼的变化","đám cưới hiện đại","Đám cưới ngày nay: tổ chức ở khách sạn, du lịch kết hôn…","旅行结婚"]],"notes":[["So sánh rõ ràng","Dùng: 和……一样／相同的是……；不同的是……；而……则……"],["Một chi tiết đáng nhớ","Một khoảnh khắc cảm động: bố dắt cô dâu, lời phát biểu của chú rể…"],["Câu kết","Dùng 峰终定律: 一个让人难忘的婚礼，结尾一定要美好。"]],"rule":"<b>Nguyên tắc HSK5:<\/b> đề so sánh cần cấu trúc rõ <b>相同 → 不同<\/b>; dùng từ nối: 和……一样、与……相比、而……则…….","patterns":[["① 点题","去年夏天，我参加了我表姐的婚礼，给我留下了深刻的印象。","Hè năm ngoái tôi dự đám cưới chị họ, để lại ấn tượng sâu sắc."],["① 点题","越南的婚礼和中国的婚礼有很多相同的地方，也有一些不同。","Đám cưới Việt Nam và Trung Quốc có nhiều điểm giống, cũng có điểm khác."],["② 特点","婚礼前，男方家要带着礼物去女方家提亲。","Trước đám cưới, nhà trai mang lễ vật sang nhà gái dạm hỏi."],["③ 相同","和中国一样，越南人也喜欢红色，客人也要送红包。","Giống Trung Quốc, người Việt cũng thích màu đỏ, khách cũng mừng phong bì."],["③ 不同","不同的是，越南的新娘常常穿红色的奥黛，而现在很多中国新娘则穿白色的婚纱。","Khác ở chỗ cô dâu Việt thường mặc áo dài đỏ, còn nhiều cô dâu Trung Quốc nay mặc váy cưới trắng."],["④ 感受","与热闹的婚宴相比，我宁可要一个简单而温暖的婚礼。","So với tiệc cưới ồn ào, tôi thà có một đám cưới đơn giản mà ấm áp."],["④ 峰终","根据峰终定律，婚礼最后的告别一定要美好，这样才能给客人留下美好的记忆。","Theo quy luật đỉnh – kết, phần chia tay cuối đám cưới phải đẹp mới để lại ký ức đẹp."]],"links":[["Mở bài",["去年我参加了……的婚礼","说到婚礼，……","……的婚礼给我留下了深刻的印象"]],["Giới thiệu",["婚礼前，……","婚礼那天，……","最有意思的是……"]],["So sánh",["和中国一样，……","不同的是，……","与……相比，……更为……"]],["Cảm nhận",["我觉得……","根据峰终定律，……","宁可……，也不……"]]],"open":[["经历式","去年夏天，我参加了我表姐的婚礼，给我留下了深刻的印象。"],["比较式","越南的婚礼和中国的婚礼有很多相同的地方，也有一些不同。"],["知识式","汉语中的“婚礼”原来是“昏礼”，因为古人在傍晚举行婚礼。"]],"close":[["峰终式","根据峰终定律，一个让人难忘的婚礼，结尾一定要美好。"],["感受式","我觉得，不管在哪个国家，婚礼都表达了人们对幸福的希望。"],["愿望式","如果有机会，我很想参加一次中国人的婚礼。"]],"from_text":[["因为……而……的，不是 A，而是 B","让我最难忘的，不是热闹的婚宴，而是爸爸把姐姐的手交给新郎的那一刻。","Lấy từ 好句 ①: nhấn mạnh chi tiết."],["……越……，……就越……","婚礼的结尾越美好，客人留下的印象就越深刻。","Lấy từ 好句 ②: quy luật."],["……，以……，却常常忽视……","很多人花很多钱布置婚礼现场，以显得热闹，却常常忽视了客人的感受。","Lấy từ 好句 ③: phê bình."],["与 A 相比，B 更为……","与城市里的婚礼相比，农村的婚礼更为热闹。","Lấy từ 好句 ④: so sánh."],["与……相比，宁可……","与豪华的婚礼相比，我宁可要一个简单而温暖的婚礼。","Lấy từ 好句 ⑤: lựa chọn."]],"vocab":[["新郎","xīnláng","chú rể","新郎和新娘","idea"],["新娘","xīnniáng","cô dâu","新娘很漂亮","idea"],["婚纱","hūnshā","váy cưới","白色的婚纱","idea"],["婚宴","hūnyàn","tiệc cưới","参加婚宴","idea"],["红包","hóngbāo","phong bì đỏ","送红包","idea"],["祝福","zhùfú","chúc phúc","送上祝福","idea"],["举行","jǔxíng","tổ chức","举行婚礼","act"],["提亲","tí qīn","dạm hỏi","去女方家提亲","act"],["结婚","jié hūn","kết hôn","旅行结婚","act"],["布置","bùzhì","bày trí","布置婚礼现场","act"],["比较","bǐjiào","so sánh","比较一下","act"],["见证","jiànzhèng","làm chứng","见证爱情","act"],["婚礼","hūnlǐ","lễ cưới","参加婚礼","lesson"],["服装","fúzhuāng","trang phục","传统服装","lesson"],["化妆","huà zhuāng","trang điểm","新娘化妆","lesson"],["深刻","shēnkè","sâu sắc","深刻的印象","lesson"],["度过","dùguò","trải qua","度过愉快的一天","lesson"],["告别","gàobié","chia tay","和客人告别","lesson"],["宁可","nìngkě","thà","宁可简单一点儿","lesson"],["忽视","hūshì","xem nhẹ","忽视客人的感受","lesson"],["百年好合","bǎi nián hǎo hé","trăm năm hạnh phúc","祝你们百年好合","bonus"],["喜气洋洋","xǐqì yángyáng","rộn ràng niềm vui","大家都喜气洋洋的","bonus"],["终身难忘","zhōngshēn nánwàng","suốt đời khó quên","终身难忘的婚礼","bonus"],["有情人终成眷属","yǒuqíngrén zhōng chéng juànshǔ","người yêu nhau sẽ thành đôi","有情人终成眷属","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 17"],["bonus","加分 · thành ngữ"]],"legend":["① Mở bài","② Đặc điểm","③ So sánh","④ Cảm nhận"],"samples":{"speak":[{"who":"越南婚礼 vs 中国婚礼","meta":"Hướng A · bài nói ~1 phút 30","p":["越南的婚礼和中国的婚礼有很多相同的地方，也有一些不同。","在越南，婚礼前男方家要带着礼物去女方家提亲。婚礼那天，新娘穿上漂亮的奥黛，化好妆，和新郎一起感谢客人。","和中国一样，越南人也喜欢红色，客人也要送红包，表达对新人的祝福。不同的是，越南的新娘常常穿红色的奥黛，而现在很多中国新娘则穿白色的婚纱。另外，越南的婚宴常常在家门口举行，非常热闹。","我觉得，不管在哪个国家，婚礼都表达了人们对幸福生活的希望。"],"vi":"Đám cưới Việt Nam và Trung Quốc có nhiều điểm giống, cũng có điểm khác. Ở Việt Nam, trước đám cưới nhà trai mang lễ vật sang dạm hỏi; hôm cưới cô dâu mặc áo dài đẹp, trang điểm, cùng chú rể cảm ơn khách. Giống Trung Quốc, người Việt thích màu đỏ, khách mừng phong bì chúc phúc. Khác ở chỗ cô dâu Việt hay mặc áo dài đỏ, còn nhiều cô dâu Trung Quốc mặc váy cưới trắng; tiệc cưới Việt thường tổ chức ngay trước cửa nhà, rất náo nhiệt. Dù ở đâu, đám cưới đều thể hiện mong ước hạnh phúc."},{"who":"我参加过的一次婚礼","meta":"Hướng B · bài nói ~1 phút 30","p":["去年夏天，我参加了我表姐的婚礼，给我留下了深刻的印象。","婚礼前，表姐准备了很长时间，服装、化妆、婚宴，每一件事都很认真。婚礼开始以后，最让我感动的，不是热闹的婚宴，而是姑父把表姐的手交给新郎的那一刻，很多客人都哭了。","可是，婚宴的最后一个小时有点儿无聊，很多人都在看手机。根据课文里的峰终定律，如果那时候能早早地和客人告别，大家的印象会更为美好。","所以我觉得，一个让人难忘的婚礼，结尾一定要美好。"],"vi":"Hè năm ngoái tôi dự đám cưới chị họ, ấn tượng sâu sắc. Chị chuẩn bị rất lâu, từ trang phục, trang điểm đến tiệc cưới. Cảm động nhất không phải tiệc náo nhiệt mà là lúc dượng trao tay chị cho chú rể, nhiều khách đã khóc. Nhưng giờ cuối của tiệc hơi chán, ai cũng nhìn điện thoại. Theo quy luật đỉnh – kết trong bài, nếu khi đó chia tay khách sớm thì ấn tượng sẽ đẹp hơn. Vì vậy một đám cưới đáng nhớ phải có phần kết đẹp."}],"write":[{"who":"范文 1 · 比较","meta":"Dạng HSK5 · khoảng 80 chữ","title":"婚礼","p":["越南的婚礼和中国的婚礼有很多相同的地方。","和中国一样，越南人也喜欢红色，客人也要送红包。","不同的是，越南的新娘常常穿红色的奥黛，而很多中国新娘则穿白色的婚纱。","我觉得，两国的婚礼都很热闹，都表达了对新人的祝福。"],"vi":"Bố cục 4 câu: mở bài → giống → khác (而……则……) → cảm nhận."},{"who":"范文 2 · 一次婚礼","meta":"Dạng HSK5 · khoảng 80 chữ","title":"婚礼","p":["去年我参加了表姐的婚礼，给我留下了深刻的印象。","最让我感动的，不是热闹的婚宴，而是姑父把表姐的手交给新郎的那一刻。","那一刻，很多客人都哭了。","这真是一个终身难忘的婚礼。"],"vi":"Kể một khoảnh khắc đáng nhớ; dùng khung 不是……而是…… của bài khóa."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"婚礼","p":["去年夏天，我参加了表姐的婚礼。越南的婚礼和中国的婚礼有很多相同的地方，也有一些不同。","和中国一样，越南人也喜欢红色，客人也要送红包。不同的是，越南的新娘常常穿红色的奥黛，而很多中国新娘则穿白色的婚纱。与城市里的婚礼相比，农村的婚礼更为热闹，常常在家门口举行。","不过，很多人花很多钱布置婚礼现场，以显得热闹，却常常忽视了客人的感受。表姐的婚宴最后一个小时就有点儿无聊。","我觉得，婚礼的结尾越美好，客人留下的印象就越深刻。"],"good":["与城市里的婚礼相比，农村的婚礼更为热闹","以显得热闹，却常常忽视了客人的感受","婚礼的结尾越美好，客人留下的印象就越深刻"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 与 A 相比，B 更为…… · ……，以……，却常常忽视…… · ……越……，……就越……."}]},"w5":["新郎","新娘","婚纱","婚宴","红包","祝福","举行","结婚","布置","比较","婚礼","服装","化妆","深刻","度过","告别","宁可","忽视","魅力","糟糕","平常","依然","评价"],"step_names":["① 点题","② 介绍特点","③ 比较：相同与不同","④ 感受"],"timer":[["① 10s",10],["② 30s",30],["③ 35s",35],["④ 15s",15]],"build_title":"选一个方向，拼出你的“婚礼”","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 越南婚礼 vs 中国婚礼":[["越南的婚礼和中国的婚礼有很多相同的地方，也有一些不同。","说到婚礼，我首先想到的是我们越南热闹的婚宴。"],["在越南，婚礼前男方家要带着礼物去女方家提亲，婚礼那天，新娘穿上漂亮的奥黛。","越南的婚宴常常在家门口举行，亲戚朋友、左邻右舍都会来参加。"],["和中国一样，越南人也喜欢红色，客人也要送红包；不同的是，越南的新娘常常穿红色的奥黛，而很多中国新娘则穿白色的婚纱。","与中国城市里的婚礼相比，越南农村的婚礼更为热闹，常常要办好几天。"],["我觉得，不管在哪个国家，婚礼都表达了人们对幸福生活的希望。","如果有机会，我很想参加一次中国人的婚礼。"]],"B · 我参加过的一次婚礼":[["去年夏天，我参加了表姐的婚礼，给我留下了深刻的印象。","我参加过很多婚礼，其中表姐的婚礼最让我难忘。"],["婚礼前，表姐准备了很长时间，服装、化妆、婚宴，每一件事都很认真。","婚礼那天，大家都喜气洋洋的，新郎新娘一起感谢每一位客人。"],["最让我感动的，不是热闹的婚宴，而是姑父把表姐的手交给新郎的那一刻，很多客人都哭了。","可是，婚宴的最后一个小时有点儿无聊，很多人都在看手机。"],["这真是一个终身难忘的婚礼。","所以我觉得，一个让人难忘的婚礼，结尾一定要美好。"]],"C · 峰终定律与婚礼":[["课文中的作者参加过一个婚礼，前三个小时很好，最后一个小时却很无聊。","根据峰终定律，我们对一件事的记忆只在高峰和结尾。"],["很多人花很多钱布置婚礼现场，以显得热闹，却常常忽视了客人的感受。","婚礼的高峰常常是新郎新娘交换戒指的时候，大家都很感动。"],["如果婚宴时间太长，客人会觉得无聊，美好的印象也会被糟糕的结尾破坏。","婚礼的结尾越美好，客人留下的印象就越深刻。"],["所以，与豪华的婚礼相比，我宁可要一个简单而温暖的婚礼 该在最美好的时候离开……"]],"homework":"<b>Bài về nhà:<\/b> chọn một hướng (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “婚礼” · bắt buộc có điểm giống, điểm khác, một câu cảm nhận và một khung 好句 của bài khóa."}};</script>
<script>

function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
