<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 11 · 闹钟的危害 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

<script>window.LESSON={"ALIAS":{"慌张":"慌","铃声":"铃"},"BIANXI":[{"pair":"持续 — 继续","book":true,"head":["","持续","继续"],"rows":[["共同点","都是动词，都有延续不断的意思，但语义相差较大，不能替换。",null],["不同点 1","表示动作连续不断，<b>中间没有停顿<\/b>。<br><span class='zh'>这场雨<b>持续<\/b>下了两个多小时。<\/span>","动作<b>中间可以有停顿<\/b>。<br><span class='zh'>对不起！打扰了，你们<b>继续<\/b>学习吧。<\/span>"],["不同点 2","能做<b>定语<\/b>。<br><span class='zh'><b>持续<\/b>的高温让许多老人感到不适。<\/span>","不能做定语。"],["不同点 3","能带<b>时量补语<\/b>。<br><span class='zh'>小明发烧<b>持续<\/b>三天了，家里人都很着急。<\/span>","一般不能带时量补语。"]],"opts":["持续","继续","都可以"],"quiz":[["真希望刘老师能____给我们上课。",1,"中间停过，希望接着做，用“继续”（课本例题）。"],["这次的宣传活动将____到9月底。",0,"连续不断，到某个时间为止，用“持续”。"],["不管你是快乐还是难过，生活总要____下去。",1,"表示接着进行下去，用“继续”。"],["朋友是在你失败时，鼓励你____前进的人。",1,"失败（停下）以后接着前进，用“继续”。"]]},{"pair":"愿望 — 希望","book":false,"head":["","愿望","希望"],"rows":[["共同点","都可以做名词，表示想达到的目的或想法。<br><span class='zh'>我的<b>愿望/希望<\/b>终于实现了。<\/span>",null],["不同点 1","只能做<b>名词<\/b>。常说“满足愿望、实现愿望、美好的愿望”。<br><span class='zh'>当然是自然醒最符合我们的<b>愿望<\/b>。<\/span>","还可以做<b>动词<\/b>，后面可以带宾语。<br><span class='zh'>我<b>希望<\/b>你能来参加我的生日晚会。<\/span>"],["不同点 2","不能直接带宾语。","名词“希望”还可以指“希望寄托的对象”：<span class='zh'>孩子是国家的希望。<\/span>"]],"opts":["愿望","希望","都可以"],"quiz":[["作为孩子的父母，我们当然____他能成为一个有用的人才。",1,"后面带宾语（他能成为……），只能用动词“希望”（课本练习2）。"],["老人最大的____是全家人能在一起过春节。",2,"做名词，表示想达到的目的，两个都可以。"],["他终于满足了自己的____，去中国留学了。",0,"“满足愿望”是固定搭配。"],["年轻人是国家的未来和____。",1,"指希望寄托的对象，只能用“希望”。"]]},{"pair":"危害 — 伤害","book":false,"head":["","危害","伤害"],"rows":[["共同点","都是动词，都表示使受到损害。<br><span class='zh'>吸烟会<b>危害/伤害<\/b>身体健康。<\/span>",null],["不同点 1","对象多是<b>大的、抽象的<\/b>：社会、安全、健康、环境。语义较重。<br><span class='zh'>他的行为已经严重<b>危害<\/b>到了社会安全。<\/span>","对象可以是<b>身体<\/b>，也常是<b>感情、自尊心<\/b>。<br><span class='zh'>你的话<b>伤害<\/b>了她的感情。<\/span>"],["不同点 2","常说“危害性、危害很大”。","常说“受到伤害、伤害感情、伤害自尊心”。"]],"opts":["危害","伤害","都可以"],"quiz":[["他的行为已经严重____到了社会安全。",0,"对象是“社会安全”，大而抽象，用“危害”（课本练习2）。"],["对不起，我不是故意____你的。",1,"伤害感情，用“伤害”。"],["长期熬夜会____身体健康。",2,"对象是身体健康，两个都可以。"],["他这样说，深深地____了孩子的自尊心。",1,"“伤害自尊心”是固定搭配。"]]}],"COLLOC":[["动词","宾语",[["享受","自由 uss","q":"A. 闹钟的铃声　B. 家人的催促（cuīcù）　C. 鸟或狗的叫声　D. 渐亮的太阳光线。你比较喜欢哪种？最不喜欢哪种？为什么？","vn":"A. Chuông báo thức · B. Người nhà giục · C. Tiếng chim hoặc chó · D. Ánh nắng sáng dần. Bạn thích cách nào nhất, ghét cách nào nhất? Vì sao?","answer_zh":"我最喜欢被渐亮的太阳光线叫醒，因为这样醒来很舒服，一整天精神都很好。我最不喜欢闹钟的铃声，每次被它突然叫醒，我都会心慌，而且情绪很低落。","answer_vn":"Câu hỏi dẫn vào bài khóa: theo nghiên cứu, ánh sáng là “đồng hồ báo thức sinh học” tự nhiên của cơ thể."},{"tab":"睡眠词语","title":"从生词表中找出与睡眠有关的词语","type":"reveal","lead":"Đọc mô tả, nói từ mới liên quan đến giấc ngủ, rồi bấm “？”. Ví dụ của sách: 闹钟 — 如果早上有课，为了不迟到，我晚上睡觉前都会定上闹钟。","items":[["⏰ 到了时间会响，叫人起床","闹钟","đồng hồ báo thức"],["😴 睡得很沉，不容易醒","熟睡","ngủ say"],["🌤️ 睡得不沉，容易醒","浅睡","ngủ nông"],["👀 头脑清楚，不想睡了","清醒","tỉnh táo"],["🌙 晚上睡不着觉","失眠","mất ngủ"],["🪟 挂在窗户上，挡住阳光","窗帘","rèm cửa"]],"note":"Từ trong bài: <b class='zh'>睡眠、自然醒、生物钟、睡懒觉<\/b>."},{"tab":"你的习惯","title":"你每天早上是怎么起床的？","type":"discuss","q":"你每天早上几点起床？是自然醒还是被闹钟叫醒？你有没有睡懒觉的习惯？","vn":"Mỗi sáng bạn dậy lúc mấy giờ? Tự nhiên tỉnh hay bị báo thức gọi dậy? Bạn có thói quen ngủ nướng không?","answer_zh":"我每天早上七点起床。上班的时候，我必须定两个闹钟，要不然肯定会迟到。周末我不定闹钟，常常睡懒觉，睡到十点才自然醒。","answer_vn":"Từ hữu ích: 定闹钟 (đặt báo thức)、睡懒觉 (ngủ nướng)、自然醒 (tỉnh dậy tự nhiên)、起不来 (không dậy nổi)."}],"GAME":{"fill":[["自然醒是最符合人体生物钟{}的。","规律",["规律","规定","规则","纪律"]],["光线是自然醒的{}条件……","必要",["必要","需要","重要","主要"]],["人逐渐从熟睡{}到浅睡，直到醒来。","过渡",["过渡","过度","经过","通过"]],["使很多上班的人无法{}轻松舒适的睡眠……","享受",["享受","接受","感受","受到"]],["这两种方式{}产生的反应是很不相同的。","所",["所","被","把","让"]],["这些能力最多为正常状态的65%，与醉酒者{}。","相当",["相当","相同","相信","相处"]],["这种状态如果{}数天、数周、数月……","持续",["持续","继续","连续","陆续"]],["将{}高血压、失眠和一些精神问题等。","导致",["导致","引导","以致","导演"]],["应{}柔和的声音或音乐。","采用",["采用","使用","应用","利用"]],["可{}传统闹钟突然惊醒对人体健康的伤害。","避免",["避免","免费","防止","以免"]]],"order":[["光线是|自然醒的|必要|条件。"],["闹钟的用途|就显得|格外|重要了。"],["突然被闹铃惊醒的人|比自然醒的人|血压更高、|心跳更快。"],["应采用|柔和的|声音|或音乐。"],["市场上|出现了|一种新的|电子产品。"],["人逐渐|从熟睡|过渡到|浅睡。"]]},"GOOD":[{"zh":"医学研究证明，人类睡眠有其特定的机制，自然醒是最符合人体生物钟规律的","vn":"nghiên cứu y học chứng minh, giấc ngủ con người có cơ chế riêng, tỉnh dậy tự nhiên là phù hợp nhất với quy luật đồng hồ sinh học","why":"Mở bài kiểu khoa học: <b>……研究证明，……是最符合……的<\/b>. Dẫn nghiên cứu làm lập luận đáng tin.","frame":"……研究证明，A 是最符合 + ……规律／需要 + 的","apply":"营养学研究证明，按时吃早饭是最符合人体需要的。","apply_vn":"Nghiên cứu dinh dưỡng chứng minh ăn sáng đúng giờ là phù hợp nhất với nhu cầu cơ thể."},{"zh":"这就是阴雨天人们往往喜欢睡懒觉的原因","vn":"đây chính là lý do vì sao trời mưa âm u người ta thường thích ngủ nướng","why":"<b>这就是……的原因<\/b>: kết luận sau khi giải thích — đã gặp ở bài 5, rất đáng dùng lại.","frame":"（解释），这就是 + 现象 + 的原因","apply":"手机发出的蓝光会影响睡眠，这就是很多年轻人失眠的原因。","apply_vn":"Ánh sáng xanh từ điện thoại ảnh hưởng giấc ngủ, đó là lý do nhiều người trẻ mất ngủ."},{"zh":"人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的","vn":"phản ứng mà con người có được với hai cách — tự nhiên tỉnh và bị chuông báo thức gọi dậy — là rất khác nhau","why":"So sánh hai cách: <b>对 A 与 B 这两种……所产生的……是很不相同的<\/b> — có 所 (bài 11) làm câu trang trọng.","frame":"人们对 A 与 B 这两种方式所产生的反应／感受是很不相同的","apply":"人们对网上购物与去商店购物这两种方式所产生的感受是很不相同的。","apply_vn":"Cảm nhận của mọi người với hai cách mua sắm — trực tuyến và đến cửa hàng — rất khác nhau."},{"zh":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等","vn":"trạng thái này nếu kéo dài nhiều ngày, nhiều tuần, nhiều tháng sẽ dẫn đến cao huyết áp, mất ngủ và một số vấn đề tinh thần","why":"Nêu hậu quả: <b>如果持续……，将导致……<\/b> + điệp 数天、数周、数月 tạo nhịp tăng dần.","frame":"这种状态／习惯如果持续……，将导致……","apply":"这种习惯如果持续下去，将导致视力下降和睡眠不足。","apply_vn":"Thói quen này nếu tiếp tục sẽ dẫn đến giảm thị lực và thiếu ngủ."},{"zh":"希望这样能向真正的“自然醒”走近一点，再走近一点","vn":"hy vọng như vậy có thể tiến gần thêm một chút, rồi một chút nữa tới “tự nhiên tỉnh” thực sự","why":"Câu kết giàu cảm xúc: điệp <b>……一点，再……一点<\/b> — dùng cho kết bài nêu mong muốn.","frame":"希望这样能向 + 目标 + 走近一点，再走近一点","apply":"希望通过努力，我能向自己的梦想走近一点，再走近一点。","apply_vn":"Mong rằng nhờ nỗ lực, tôi có thể tiến gần ước mơ thêm chút nữa, rồi chút nữa."}],"GRAMMAR":[{"word":"过来","py":"lái / guòlai","pos":"趋向动词","forms":["醒 + 来／过来（由睡眠向清醒的过渡）","动词 + 过来（回到原来的、正常的状态）：清醒过来、活过来、改过来","动词 + 得／不 + 过来（能力够不够，多用否定）：数不过来、忙不过来"],"vn":"<b>来 / 过来<\/b> làm bổ ngữ xu hướng: ① sau 醒: <b>tỉnh dậy<\/b> (醒来、醒过来). ② <b>V + 过来<\/b>: <b>trở lại trạng thái bình thường<\/b> — 清醒过来、活过来、改过来. ③ <b>V得/不过来<\/b>: <b>làm xuể / không xuể<\/b> (đủ hay không đủ khả năng), hay dùng phủ định: 数不过来、忙不过来、照顾不过来.","text":"人逐渐从熟睡过渡到浅睡，直到醒来。","ex":[["我被一阵吵闹声突然惊醒，过了半天，脑子才清醒过来。","Tôi bị tiếng ồn đánh thức đột ngột, mãi sau đầu óc mới tỉnh táo lại. (trở lại bình thường)"],["天上的星星那么多，谁数得过来呀？","Sao trên trời nhiều thế, ai đếm xuể? (khả năng)"],["最近手头的工作太多了，我都忙不过来了。","Dạo này việc nhiều quá, tôi làm không xuể. (khả năng)"]],"err":[["❌ 我忙得不过来。","✅ 我忙不过来。","Bổ ngữ khả năng: V + 不 + 过来, không thêm 得."],["❌ 他把错字改过去了。","✅ 他把错字改过来了。","Sửa về đúng (trạng thái bình thường) dùng 改过来."]],"book":[["这棵树有上百年的树龄了，树干很粗，____________。（过来）","Gợi ý: một người ôm không xuể.","这棵树有上百年的树龄了，树干很粗，我一个人抱不过来"],["老师说我文章里的错别字比较多，____________。（过来）","Gợi ý: phải sửa lại từng chữ.","老师说我文章里的错别字比较多，我得一个一个地改过来"],["A：刘阿姨帮着照顾孙子就够累的了，下个月她女儿的孩子又要出生了。<br>B：是啊！____________。（过来）","Gợi ý: hai đứa, một mình bà sao chăm xuể.","是啊！两个孩子，她一个人哪儿照顾得过来啊"]],"drill":[["“过来”在这里表示什么？ 他昏迷了三天，今天终于醒过来了。",["回到正常状态","能力够不够"],0,"Tỉnh lại → trạng thái bình thường."],["“过来”在这里表示什么？ 这么多书，我一个人搬不过来。",["回到正常状态","能力够不够"],1,"Không làm xuể → khả năng."],["Câu nào đúng?",["客人太多了，我们忙不过来。","客人太多了，我们忙得不过来。","客人太多了，我们不忙过来。"],0,"V + 不 + 过来."]]},{"word":"所","py":"suǒ","pos":"助词／量词","forms":["（主语）+ 所 + 动词 + （的）+ 名词：我所知道的情况","有／无 + 所 + 动词：有所提高、无所不谈","为 + 名词 + 所 + 动词（被动）","量词：一所大学、一所幼儿园"],"vn":"<b>所<\/b> ① trợ từ đứng trước động từ trong cụm chủ–vị làm <b>định ngữ / chủ ngữ<\/b> (văn viết): 山水画所表现的…, 所产生的反应. ② <b>有/无 + 所 + V<\/b>: 有所提高 (có phần nâng cao), 无所不谈 (chuyện gì cũng nói). ③ <b>为……所……<\/b>: bị động. ④ lượng từ cho trường học, nhà: 一所大学.","text":"但实验研究证明，人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的。","ex":[["山水画所表现的是人与自然的关系。","Điều tranh sơn thủy thể hiện là mối quan hệ giữa con người và thiên nhiên."],["调查显示，随着年龄的增大，女性的职场幸福感有所提高。","Khảo sát cho thấy tuổi càng tăng, cảm giác hạnh phúc nơi công sở của phụ nữ có phần tăng lên."],["来自北京一所大学的学生做了关于这个问题的实验。","Sinh viên của một trường đại học ở Bắc Kinh đã làm thí nghiệm về vấn đề này. (lượng từ)"]],"err":[["❌ 这是我所知道。","✅ 这是我所知道的。","所 + V làm định ngữ/danh từ hóa cần 的."],["❌ 他的成绩所有提高。","✅ 他的成绩有所提高。","Cấu trúc đúng: 有所 + V."]],"book":[["我有一个建议要送给你，希望它能帮助你。<br>→ 我有一个建议要送给你，____________。（所）","Gợi ý: 对你有所帮助.","我有一个建议要送给你，希望它对你有所帮助"],["孔军是我们县出了名的好医生，这儿的人没有不知道的。<br>→ 孔军是位出了名的好医生，我们县的人____________。（所）","Gợi ý: 为……所熟知.","孔军是位出了名的好医生，为我们县的人所熟知"],["他在北京住了五十年，我了解的情况是他非常热爱北京。<br>→ 他在北京住了五十年，____________。（所）","Gợi ý: 据我所知.","他在北京住了五十年，据我所知，他非常热爱北京"]],"drill":[["选择：随着年龄的增大，女性的职场幸福感有____提高。",["所","些","点"],0,"有所 + V."],["“所”在这里是什么用法？ 学校附近就有一所幼儿园。",["助词","量词"],1,"一所 + trường học."],["Câu nào đúng?",["正如你所估计的那样，他改变了主意。","正如你估计所的那样，他改变了主意。","正如所你估计的那样，他改变了主意。"],0,"Chủ ngữ + 所 + V (课本练习1)."]]},{"word":"相当","py":"xiāngdāng","pos":"动词／副词","forms":["动词：A 与／和 B 相当；A 相当于 B（两方面差不多）","副词：相当 + 形容词／动词（程度较高）"],"vn":"<b>相当<\/b> ① động từ: <b>tương đương<\/b> — 与醉酒者相当; 相当于 + danh từ. ② phó từ: <b>khá, tương đối<\/b> (mức độ khá cao) — 相当满意、相当高. 相当 + 一部分人: một bộ phận khá lớn.","text":"这些能力最多为正常状态的65%，与醉酒者相当。","ex":[["这种鸟一天所食的害虫相当于自己的体重。","Lượng sâu hại loài chim này ăn một ngày tương đương trọng lượng cơ thể nó. (động từ)"],["菜的味道好极了，服务也挺周到，我相当满意。","Món ăn rất ngon, phục vụ cũng chu đáo, tôi khá hài lòng. (phó từ)"],["如果要问人们选择职业时主要考虑的是什么，有相当一部分人会以收入多少作为标准。","Nếu hỏi khi chọn nghề người ta chủ yếu cân nhắc gì, một bộ phận khá lớn sẽ lấy thu nhập làm tiêu chuẩn. (phó từ)"]],"err":[["❌ 他的水平相当我。","✅ 他的水平和我相当。／他的水平相当于我。","Động từ 相当: A 和 B 相当 hoặc A 相当于 B."],["❌ 我相当很满意。","✅ 我相当满意。","相当 đã là phó từ mức độ, không thêm 很."]],"book":[["在最后的比赛中，____________。（相当）","Gợi ý: trình độ hai đội ngang nhau.","在最后的比赛中，两个队的水平相当"],["A：平常也不见你运动锻炼，可身体还这么好。<br>B：我每天上下班都爬楼梯，____________。（相当）","Gợi ý: tương đương chạy bộ nửa tiếng.","我每天上下班都爬楼梯，相当于每天跑半个小时的步"],["A：公司让我去上班了，你觉得我该不该接受这份工作呢？<br>B：这家公司这么有名，____________，你还等什么？（相当）","Gợi ý: lương khá cao.","这家公司这么有名，工资也相当高，你还等什么"]],"drill":[["“相当”在这里是什么词？ 我对这次旅行相当满意。",["动词","副词"],1,"Đứng trước tính từ, chỉ mức độ."],["“相当”在这里是什么词？ 这两个队的水平相当。",["动词","副词"],0,"Hai bên tương đương → động từ."],["Câu nào đúng?",["一公斤相当于两斤。","一公斤相当两斤于。","一公斤于相当两斤。"],0,"A 相当于 B."]]},{"word":"数","py":"shǔ / shù","pos":"动词／数词","forms":["动词 shǔ：数一数、数数（查点数目）","动词 shǔ：数……（最）……；（最）……的（要／就）数……（比较起来最突出）","数词 shù：数 + 量词（= 几、几个，书面语）：数天、数年"],"vn":"<b>数<\/b> ① động từ <b>shǔ<\/b>: <b>đếm<\/b> — 你数数. ② <b>shǔ<\/b>: <b>(phải) kể đến<\/b> — so sánh thì nổi bật nhất: 跑得最快的就数李阳了. ③ số từ <b>shù<\/b>: <b>vài, mấy<\/b> (văn viết) — 数天、数周、数年.","text":"这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。","ex":[["先生，这是找您的钱，58块6，您数数。","Thưa ông, đây là tiền thối, 58 tệ 6, ông đếm lại. (shǔ: đếm)"],["我觉得北京最美、最有名气的公园要数颐和园了。","Tôi thấy công viên đẹp nhất, nổi tiếng nhất Bắc Kinh phải kể đến Di Hòa Viên. (shǔ: kể đến)"],["这里夏季的雷阵雨一般可持续数小时或者更久的时间。","Mưa dông mùa hè ở đây thường kéo dài vài tiếng hoặc lâu hơn. (shù: vài)"]],"err":[["❌ 我等了数个小时多。","✅ 我等了数小时。／我等了好几个小时。","数 (vài) đã là số không xác định, không thêm 多."],["❌ 最高的山数珠穆朗玛峰。（读 shù）","✅ 最高的山要数珠穆朗玛峰。（读 shǔ）","Nghĩa “kể đến” đọc shǔ, thường thêm 要/就."]],"book":[["经过几年的努力，他终于拿到了博士学位。<br>→ ____________，他终于拿到了博士学位。（数）","Gợi ý: 几年 → 数年.","经过数年的努力，他终于拿到了博士学位"],["据说，四川的峨眉山是中国雾天最多的地方。<br>→ ____________。（数）","Gợi ý: ……要数…….","据说，中国雾天最多的地方要数四川的峨眉山了"],["它的听力非常好，水下几公里外的声音它都能清楚地听到。<br>→ 它的听力非常好，____________。（数）","Gợi ý: 几公里 → 数公里.","它的听力非常好，水下数公里外的声音它都能清楚地听到"]],"drill":[["“数”在这里读什么？ 你数一数，一共有多少人？",["shǔ","shù"],0,"Đếm → shǔ."],["“数”在这里读什么？ 这种状态如果持续数天……",["shǔ","shù"],1,"Vài → shù."],["选择：我们班跑得最快的，要____小王了。",["数","算","是"],0,"最……要数…… (kể đến)."]]}],"HSK":{"r1":[{"text":["小王每天早上都起不来，于是他买了一个声音特别大的闹钟。第二天早上，闹钟一响，{36}，全楼的邻居都被吵醒了，只有小王还在睡。邻居们纷纷来敲他的门，小王这才醒过来。他揉着眼睛说：“{37}？”一位邻居生气地说：“{38}，你的闹钟叫醒了我们所有人，就是没叫醒你！”"],"qs":[{"n":36,"o":["声音小得听不见","声音大得像打雷一样","马上就坏了","放起了音乐"],"a":1,"why":"后文“全楼的邻居都被吵醒了”，说明声音非常大。"},{"n":37,"o":["你们怎么这么早就起床了","我的闹钟在哪儿","今天是星期几","你们找谁"],"a":0,"why":"小王不知道自己的闹钟吵醒了邻居，以为大家起得早，形成幽默。"},{"n":38,"o":["我们本来就起得很早","这都要感谢你","早上好","我们要搬家了"],"a":1,"why":"邻居说的是反话，“感谢你”其实是在抱怨。"}]},{"text":["很多人都有午睡的习惯。研究发现，中午睡20到30分钟，{39}，让下午的工作和学习更有效率。不过，午睡时间并不是越长越好。如果睡得太久，进入了深度睡眠，{40}，反而会感到头昏、没有精神。另外，{41}，最好不要趴在桌子上睡，否则容易导致脖子疼。专家建议，{42}，选择一个舒服的姿势，这样才能真正享受午睡的好处。"],"qs":[{"n":39,"o":["可以帮助人们恢复精神","会让人晚上睡不着","对身体没有好处","会让人变胖"],"a":0,"why":"后文“让下午的工作和学习更有效率”，说明午睡能恢复精神。"},{"n":40,"o":["醒来时就会很舒服","醒来后不但不精神","就能睡得更好","下午就不用工作了"],"a":1,"why":"“不但不精神，反而会感到头昏”，前后呼应。"},{"n":41,"o":["午睡的姿势也很重要","午睡的地方要大","午睡前要吃很多东西","午睡要定很多闹钟"],"a":0,"why":"后文讲不要趴在桌子上睡，说的是姿势。"},{"n":42,"o":["午睡时间最好不要超过半小时","午睡越久越好","大家都不要午睡","午睡前要喝咖啡"],"a":0,"why":"前文说睡太久不好，所以建议控制在半小时以内。"}]}],"r2":[{"start":46,"paras":["可是，手机屏幕发出的光会让大脑以为现在还是白天，于是人就更难入睡了。","现在，很多年轻人都有睡前躺在床上玩手机的习惯。","所以专家建议，睡前一个小时最好放下手机，看看书或者听听柔和的音乐。","他们觉得这样能放松自己，玩着玩着就睡着了。","这种情况如果持续下去，不但会导致失眠，第二天也会没有精神。"],"ans":["B","D","A","E","C"],"why":"现象（B）→ 年轻人的想法（D）→ 转折：手机的光让人更难入睡（A）→ 后果（E）→ 专家建议（C）。"}],"r3":[{"text":["很多人以为，睡眠就是一动不动地躺着，大脑也完全休息了。其实，人在睡眠时，大脑一直在工作。一般来说，一个晚上的睡眠会经过几个不同的阶段：从浅睡到深睡，再从深睡回到浅睡，这样循环好几次。","在深睡阶段，人很难被叫醒，身体会利用这段时间恢复体力；而在浅睡阶段，人比较容易醒来，也常常会做梦。科学家发现，<u><b>做梦对整理白天的记忆有一定的帮助<\/b><\/u>。","了解了这些，我们就能明白为什么有时候睡了很久还是觉得累：很可能是在深睡的时候被叫醒了。如果能在浅睡阶段自然醒来，人就会感觉轻松很多。","因此，想要提高睡眠质量，最重要的是养成有规律的作息习惯，让身体按照自己的生物钟工作，而不是靠闹钟把自己叫醒。"],"qs":[{"n":56,"s":"根据第一段，人在睡眠时：","o":["大脑完全休息","大脑一直在工作","一直在深睡","不会做梦"],"a":1,"why":"第一段：其实，人在睡眠时，大脑一直在工作。"},{"n":57,"s":"身体在哪个阶段恢复体力？","o":["浅睡阶段","深睡阶段","做梦的时候","醒来以后"],"a":1,"why":"第二段：在深睡阶段，身体会利用这段时间恢复体力。"},{"n":58,"s":"画线句子说明做梦：","o":["没有任何作用","会让人更累","对整理记忆有帮助","只在深睡时发生"],"a":2,"why":"做梦对整理白天的记忆有一定的帮助。"},{"n":59,"s":"作者认为提高睡眠质量最重要的是：","o":["多定几个闹钟","睡得越久越好","养成有规律的作息习惯","白天多睡觉"],"a":2,"why":"最后一段：最重要的是养成有规律的作息习惯。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小李的变化。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể về sự thay đổi của Tiểu Lý.","panels":[["📱","小李每天晚上躺在床上玩手机，一直玩到半夜。"],["⏰","早上闹钟响了好几次，他才起床，上课时没有精神。"],["📖","他在课本上读到了闹钟的危害和自然醒的好处。"],["🌅","他开始早睡早起，现在每天都能自然醒来，精神很好。"]],"min":100,"tips":["Kể theo 4 tranh: thức khuya → báo thức, mệt mỏi → đọc được kiến thức → thay đổi.","Có thể dùng: 导致、情绪低落、规律、逐渐、精神饱满、避免."],"sample":"小李是个大学生，他每天晚上都躺在床上玩手机，常常一直玩到半夜一两点。第二天早上，闹钟响了好几次，他才不情愿地起床。上课的时候，他总是没有精神，情绪也很低落。有一天，他在课本上读到一篇文章，才知道被闹钟突然叫醒会导致心慌、记忆力下降，长期下去还会失眠。从那以后，他决定改变自己的习惯：睡前一个小时不玩手机，每天晚上十一点前睡觉。一个月以后，他逐渐习惯了自然醒，现在每天都精神饱满。","svn":"Tiểu Lý hay nằm chơi điện thoại đến 1–2 giờ sáng, sáng báo thức kêu mấy lần mới dậy, lên lớp uể oải; đọc bài viết về tác hại của báo thức, anh quyết định thay đổi: không dùng điện thoại 1 tiếng trước khi ngủ, ngủ trước 11 giờ; một tháng sau quen tự tỉnh, ngày nào cũng tràn đầy năng lượng."},"w72":{"prompt":"现在很多年轻人习惯熬夜，有人认为晚上安静，学习和工作的效率更高；也有人认为熬夜对身体有很大的危害。请写一篇不少于200字的作文，谈谈你对“熬夜”的看法。","vn":"Nhiều người trẻ quen thức khuya; có người cho rằng ban đêm yên tĩnh, làm việc hiệu quả hơn; có người cho rằng thức khuya rất có hại. Viết bài không ít hơn 200 chữ nêu quan điểm về thức khuya.","min":200,"title":"别让熬夜偷走健康","tips":["Thừa nhận lý do người thức khuya → quan điểm: tác hại lớn hơn → lý do 1 (sức khỏe) → lý do 2 (hiệu quả ngày hôm sau) → giải pháp → kết luận.","Dùng khung 好句: ……研究证明，…… · 如果持续……，将导致…… · 这就是……的原因."],"sample":"很多年轻人习惯熬夜，他们觉得晚上安静，没有人打扰，学习和工作的效率更高。这种想法虽然有一定的道理，但是我认为，熬夜对身体的危害远远大于它的好处。\n首先，医学研究证明，按照生物钟规律睡眠是最健康的。经常熬夜会打乱生物钟，这种状态如果持续下去，将导致失眠、高血压和一些精神问题。\n其次，晚上睡得晚，早上就只能靠闹钟叫醒，结果第二天心慌、情绪低落，记忆能力也会下降，这就是很多人白天效率很低的原因。\n所以，我们应该养成有规律的作息习惯，晚上早点儿睡，把重要的事情放在早上精神最好的时候做。别让熬夜偷走我们的健康。","svn":"Bài nghị luận: thừa nhận lý do thức khuya → quan điểm: hại nhiều hơn lợi → 首先 rối loạn đồng hồ sinh học, bệnh tật → 其次 ngày hôm sau kém hiệu quả → 所以 sinh hoạt điều độ."}},"PRACTICE":{"ex1":{"bank":["所","享受","导致","过渡","必要","规律"],"items":[["在婚姻问题上，听听父母的意见还是很有{}的。",["必要"]],["由于近一个月来没有降水，{}河水水位持续下降。",["导致"]],["正如你{}估计的那样，李岩确实改变了主意。",["所"]],["擦擦办公桌，整理一下文件，这些都可以让你从放松的休息状态自然{}到工作状态。",["过渡"]],["生命在于运动，有{}的运动对于身体健康大有好处。",["规律"]],["为了{}轻松的生活，夫妻俩决定把家搬到这个安静的小镇。",["享受"]]]},"ex2":[["实验失败了没关系，打起____从头再来。",["情绪","精神"],1],["每晚抽出点儿时间来阅读、学习，坚持____年之后，成功就会向你招手。",["来","数"],1],["作为孩子的父母，我们当然____他能成为一个有用的人才。",["愿望","希望"],1],["他的行为已经严重____到了社会安全。",["危害","伤害"],0]],"ex3match":{"title":"三、画线连接可以搭配的词语","groups":[[["享受","音乐"],["导致","麻烦"],["危害","社会"],["避免","灾害"]],[["满足","愿望"],["稳定","情绪"],["集中","精神"],["重视","传统"]]]},"ex3":[],"ex4":[["自然醒的过程","光线、生物钟、必要、熟睡、浅睡、过渡、醒","自然醒最符合人体生物钟规律，光线是自然醒的必要条件。早晨光线逐渐变强，人逐渐从熟睡过渡到浅睡，直到醒来。"],["传统闹钟的危害","心慌、失眠、情绪、精神、导致、影响、相当、发病","被闹钟突然叫醒，人会心慌、情绪低落，记忆和计算能力也会受到影响，与醉酒者相当。长期这样会导致高血压、失眠和精神问题，还会使发病的可能性变大。"],["“光闹钟”对传统闹钟的改进","自然醒、电子产品、模仿、光线、避免、伤害","自然醒最符合我们的愿望。“光闹钟”是一种新的电子产品，它模仿早晨自然光线的变化，让人自然地醒来，可以避免传统闹钟对健康的伤害。"]],"ext":{"title":"扩展 · 话题：家居 1","words":[["抽屉","chōuti","ngăn kéo"],["书架","shūjià","giá sách"],["窗帘","chuānglián","rèm cửa"],["地毯","dìtǎn","thảm"],["被子","bèizi","chăn"],["玩具","wánjù","đồ chơi"],["日历","rìlì","lịch"],["日期","rìqī","ngày tháng"],["包裹","bāoguǒ","bưu kiện"]],"items":[["这块{}是去年夏天我和太太去新疆旅游时买回来的，她很喜欢。","地毯"],["李阳很喜欢作家老舍，{}上摆满了他不同时期的作品。","书架"],["我建议您给孩子买这个{}火车，这个牌子很有名。","玩具"],["我把光盘放在书桌左边的第二个{}里了。","抽屉"]]}},"TEXT":[{"title":"自然醒","sub":"光线是生物闹钟","paras":["医学研究证明，人类睡眠有其特定的机制，自然醒是最符合人体生物钟规律的。光线是自然醒的必要条件，是人体内的生物闹钟。","早晨，人体感受到逐渐变强的太阳光线，新陈代谢随之加快，人逐渐从熟睡过渡到浅睡，直到醒来。这就是阴雨天人们往往喜欢睡懒觉的原因。"],"idea":"Giấc ngủ có cơ chế riêng; <b>tự nhiên tỉnh<\/b> là phù hợp nhất với đồng hồ sinh học. <b>Ánh sáng<\/b> là điều kiện cần — là “đồng hồ báo thức sinh học”. Ánh nắng mạnh dần → trao đổi chất tăng → từ ngủ say chuyển sang ngủ nông rồi tỉnh. Vì thế trời mưa âm u người ta hay ngủ nướng.","qs":[["什么样的醒来方式最符合人体生物钟规律？",["被闹钟叫醒","自然醒","被家人叫醒"],1],["自然醒的必要条件是什么？",["光线","声音","温度"],0],["为什么阴雨天人们往往喜欢睡懒觉？",["阴雨天太冷了","阴雨天光线不强","阴雨天不用上班"],1]]},{"title":"被闹钟叫醒","sub":"两种方式，两种反应","paras":["紧张的现代生活，使很多上班的人无法享受轻松舒适的睡眠、自然地醒来，闹钟的用途就显得格外重要了。但实验研究证明，人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的。从睡眠状态过渡到清醒状态时，人的呼吸会从16次/分钟提高到24次/分钟，心跳每分钟加快10次。如果突然被闹钟叫醒，将在心理上使人产生心慌、情绪低落、感觉没睡醒等不适。如果是从深度睡眠中被突然叫醒，那么，人的短期记忆能力、计算技能都会受到影响，这些能力最多为正常状态的65%，与醉酒者相当。"],"idea":"Cuộc sống căng thẳng khiến đồng hồ báo thức trở nên quan trọng. Nhưng phản ứng của cơ thể với hai cách tỉnh dậy <b>rất khác nhau<\/b>. Bị chuông gọi dậy đột ngột gây <b>hồi hộp, tâm trạng sa sút<\/b>; nếu đang ngủ sâu mà bị đánh thức thì trí nhớ ngắn hạn và khả năng tính toán chỉ còn tối đa 65% — <b>tương đương người say rượu<\/b>.","qs":[["为什么闹钟的用途显得格外重要了？",["闹钟很便宜","现代生活紧张，人们无法自然地醒来","闹钟很好看"],1],["从睡眠状态过渡到清醒状态时，人的呼吸会怎么样？",["从24次/分钟降到16次/分钟","从16次/分钟提高到24次/分钟","没有变化"],1],["从深度睡眠中被突然叫醒，人的记忆和计算能力跟谁差不多？",["小孩子","醉酒者","运动员"],1]]},{"title":"闹钟的危害","sub":"长期被叫醒的后果","paras":["出于自我保护，被闹钟叫醒时我们的身体会提高体内的肾上腺素水平。这种状态如果持续数天、数周、数月，将导致高血压、失眠和一些精神问题等。研究发现，突然被闹铃惊醒的人比自然醒的人血压更高、心跳更快。对此，专家解释说，人在睡眠时，身体会发生一些变化，因此人们在早上醒来时更容易发病，而闹铃则会使发病的可能性变得更大。如果你必须定个闹钟，应采用柔和的声音或音乐。"],"idea":"Bị báo thức gọi dậy, cơ thể tự vệ bằng cách tăng <b>adrenalin<\/b>. Kéo dài nhiều ngày, nhiều tháng sẽ dẫn đến <b>cao huyết áp, mất ngủ<\/b> và vấn đề tinh thần. Buổi sáng vốn dễ phát bệnh, chuông báo thức càng làm khả năng đó lớn hơn. Nếu buộc phải đặt báo thức, nên chọn <b>âm thanh, nhạc êm dịu<\/b>.","qs":[["被闹钟叫醒时，身体会怎么样？",["提高肾上腺素水平","睡得更好","心跳变慢"],0],["长期被闹钟叫醒会导致什么问题？",["长高","高血压、失眠和精神问题","记忆力提高"],1],["专家建议闹钟应该采用什么声音？",["很大的铃声","柔和的声音或音乐","狗叫声"],1]]},{"title":"光闹钟","sub":"向“自然醒”走近一点","paras":["各种醒来方式中，当然是自然醒最符合我们的愿望。可谁能替你拉开窗帘让阳光照进来呢？近年来，市场上出现了一种新的电子产品，名为“光闹钟”。它能在室内模仿早晨自然光线的变化，通过光线的作用使人在设定的时间里自然地醒来，可避免传统闹钟突然惊醒对人体健康的伤害。希望这样能向真正的“自然醒”走近一点，再走近一点。"],"idea":"Tự nhiên tỉnh là mong muốn của ai cũng vậy, nhưng ai sẽ kéo rèm cho nắng chiếu vào? Thị trường xuất hiện <b>“đồng hồ báo thức ánh sáng”<\/b>: <b>mô phỏng<\/b> ánh sáng buổi sáng trong phòng, giúp người ta tỉnh dậy tự nhiên đúng giờ, <b>tránh<\/b> tác hại của chuông báo thức truyền thống.","qs":[["哪种醒来方式最符合我们的愿望？",["自然醒","被闹钟叫醒","被电话叫醒"],0],["“光闹钟”是怎么叫醒人的？",["发出很大的铃声","模仿早晨自然光线的变化","播放音乐"],1],["“光闹钟”有什么好处？",["价格便宜","可避免传统闹钟对健康的伤害","可以拉开窗帘"],1]]}],"TEXT_EXTRA":{"compare_title":"两种醒来方式","compare_head":["","自然醒","被闹钟叫醒"],"compare":[["过程","光线逐渐变强，从熟睡过渡到浅睡","铃声突然响起，从深睡被突然叫醒"],["感觉","轻松舒适","心慌、情绪低落、没睡醒"],["长期影响","符合生物钟规律","可能导致高血压、失眠、精神问题"]],"bg":"在日常生活中，我们为了让自己能够按时醒来，通常都会给自己定个闹钟，但正如课文中所介绍的那样，闹钟对身体健康有很大的不良影响。有些国家，闹钟被评为他们最讨厌的人类发明之一。这些危害也许以前我们并未了解，或者即使知道也只能无奈地接受。生活紧张对现代人的生理和心理都产生了很大的危害，因而越来越引起人们的普遍关注。睡眠健康就是人们普遍关心的一个重要方面。如何放松我们的精神，获得一个舒适的睡眠呢？","bg_vn":"Ở một số nước, đồng hồ báo thức bị bình chọn là một trong những phát minh đáng ghét nhất. Cuộc sống căng thẳng gây hại cho cả thể chất lẫn tâm lý; sức khỏe giấc ngủ ngày càng được quan tâm. Làm sao thả lỏng tinh thần để có giấc ngủ dễ chịu?","discuss_title":"话题讨论：如何提高睡眠质量","discuss":["你是从什么时候开始使用闹钟的？为什么要用闹钟？","本文的观点你认为哪些是有道理的？","你有没有关于实现（shíxiàn）“自然醒”的好的经验或做法？"],"write":"请以“你真的需要闹钟吗？”为题，谈一谈你的看法。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“你真的需要闹钟吗？”为题，谈一谈你的看法","topic_vn":"Viết bài với đầu đề “Bạn thật sự cần đồng hồ báo thức sao?”, nêu quan điểm của bạn","intro":"Dạng đề nghị luận có câu hỏi (问题型) · Trả lời rõ “cần / không cần / cần nhưng phải dùng đúng cách” → lý do (dựa vào bài khóa) → cách làm của bạn → kết luận · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“你真的需要闹钟吗？”：先回答，再说理由","lead":"Đầu đề là một <b>câu hỏi<\/b>, chữ <b>“真的”<\/b> gợi ý nghi ngờ thói quen dùng báo thức. Bài phải <b>trả lời rõ ràng ngay ở mở bài<\/b>, sau đó dùng kiến thức bài khóa (tác hại của báo thức, lợi ích của tự nhiên tỉnh) làm <b>lý do<\/b>, và đưa ra <b>cách làm<\/b> cụ thể.","parts":[["你","Nói với người đọc — có thể dùng câu hỏi tu từ, hoặc nói về chính mình."],["真的","Ngụ ý: nhiều người nghĩ mình cần, nhưng có thật vậy không?"],["需要闹钟吗","Ba hướng trả lời: 不需要 / 需要，但要换个方法 / 要看情况."],["（课本）尽量用上本课生词，不少于100字","Dùng: 危害、导致、规律、享受、避免、采用、柔和、持续、情绪、精神… và 好句 của bài khóa."]],"traps":[["Không trả lời câu hỏi","Viết cả bài về tác hại của báo thức mà không nói “我觉得……需要／不需要”."],["Chép lại bài khóa","Liệt kê số liệu 16次、24次、65%… → chỉ cần 1 số liệu là đủ."],["Thiếu cách làm","Nói “không cần báo thức” nhưng không nói làm sao để dậy đúng giờ."],["Quan điểm cực đoan","“闹钟应该被禁止” → thiếu thuyết phục; nên khách quan."]],"link":"<b>Liên hệ bài 11:<\/b> lý do lấy từ bài khóa: <b>自然醒最符合生物钟规律<\/b>; bị báo thức gọi dậy gây <b>心慌、情绪低落<\/b>, lâu dài <b>导致高血压、失眠<\/b>; giải pháp: <b>采用柔和的声音<\/b>, <b>光闹钟<\/b>. Phần 背景分析 hỏi: 如何放松精神，获得舒适的睡眠?"},"steps":[["①","回答问题","Mở bài: trả lời thẳng câu hỏi.","我觉得，很多人其实并不真的需要闹钟。"],["②","理由","Nêu 1–2 lý do (tác hại của báo thức / lợi ích tự nhiên tỉnh).","研究证明，……"],["③","我的做法","<b>Trọng tâm.<\/b> Cách làm cụ thể: ngủ sớm, điều độ, kéo rèm, nhạc êm…","我的办法是……"],["④","结论","Kết: quay lại câu hỏi, nêu lời khuyên.","所以，……"]],"formula":["我的回答","理由：闹钟的危害","我的办法","所以……"],"choices_title":"Chọn một quan điểm","choices_key":"Ví dụ: ","choices":[["A · 不需要","không cần","Sinh hoạt điều độ thì tự nhiên tỉnh, không cần báo thức.","每天十一点睡，七点自然醒"],["B · 需要，但要换个方法","cần nhưng dùng đúng cách","Công việc bận vẫn cần báo thức, nhưng chọn âm thanh êm, đồng hồ ánh sáng.","柔和的音乐、光闹钟"],["C · 我的经历","trải nghiệm của tôi","Kể bạn từng phụ thuộc báo thức → mệt mỏi → thay đổi thói quen.","以前定三个闹钟"],["D · 要看情况","tùy trường hợp","Ngày thường và cuối tuần, người trẻ và người già khác nhau.","上班日 / 周末"]],"notes":[["Câu trả lời rõ ràng","Một câu ở đầu: 我觉得……不需要／需要……"],["Một số liệu là đủ","Ví dụ: 能力最多为正常状态的65%，与醉酒者相当."],["Câu kết","Quay lại câu hỏi: “所以，你真的需要闹钟吗？也许不需要。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> đề câu hỏi phải có <b>quan điểm rõ<\/b> + <b>lý do<\/b> + <b>giải pháp<\/b>. Dùng từ nối lập luận: 首先……其次……；因此……；所以…….","patterns":[["① 回答","我觉得，很多人其实并不真的需要闹钟。","Tôi thấy nhiều người thật ra không thật sự cần đồng hồ báo thức."],["① 回答","对上班族来说，闹钟是需要的，但我们应该换一种用法。","Với dân công sở, báo thức là cần, nhưng nên đổi cách dùng."],["② 理由","研究证明，自然醒是最符合人体生物钟规律的。","Nghiên cứu chứng minh tự nhiên tỉnh phù hợp nhất với đồng hồ sinh học."],["② 理由","被闹钟突然叫醒，人会心慌、情绪低落，长期下去还会导致失眠。","Bị báo thức gọi dậy đột ngột sẽ hồi hộp, tâm trạng sa sút, lâu dài còn dẫn đến mất ngủ."],["③ 做法","我每天晚上十一点前睡觉，早上拉开窗帘，让阳光叫醒我。","Tôi ngủ trước 11 giờ, sáng mở rèm để ánh nắng đánh thức."],["③ 做法","如果必须定闹钟，最好采用柔和的音乐。","Nếu buộc phải đặt báo thức, tốt nhất dùng nhạc êm dịu."],["④ 结论","所以，与其依靠闹钟，不如养成有规律的生活习惯。","Vì vậy, thay vì dựa vào báo thức, chi bằng tập thói quen sinh hoạt điều độ."]],"links":[["Trả lời",["我觉得，……","对……来说，……","说实话，……"]],["Lý do",["研究证明，……","首先，……其次，……","这就是……的原因"]],["Giải pháp",["我的办法是……","如果必须……，最好……","只要……，就……"]],["Kết luận",["所以，……","与其……，不如……","希望……走近一点，再走近一点"]]],"open":[["回答式","我觉得，很多人其实并不真的需要闹钟。"],["提问式","每天早上被闹钟吵醒的时候，你有没有想过：我真的需要它吗？"],["经历式","以前，我每天要定三个闹钟才能起床，可是一整天都没有精神。"]],"close":[["建议式","所以，与其依靠闹钟，不如养成有规律的生活习惯。"],["呼应式","你真的需要闹钟吗？也许你需要的只是早一点睡觉。"],["希望式","希望我们都能向真正的“自然醒”走近一点，再走近一点。"]],"from_text":[["……研究证明，……是最符合……的","医学研究证明，自然醒是最符合人体生物钟规律的。","Lấy từ 好句 ①: lý do khoa học."],["这就是……的原因","晚上玩手机睡得太晚，这就是很多人早上起不来的原因。","Lấy từ 好句 ②: giải thích hiện tượng."],["人们对 A 与 B……所产生的……是很不相同的","人们对自然醒与被闹钟叫醒所产生的感受是很不相同的。","Lấy từ 好句 ③: so sánh."],["如果持续……，将导致……","这种状态如果持续数月，将导致失眠和精神问题。","Lấy từ 好句 ④: hậu quả."],["……走近一点，再走近一点","希望我们能向健康的生活走近一点，再走近一点。","Lấy từ 好句 ⑤: câu kết."]],"vocab":[["睡眠","shuìmián","giấc ngủ","睡眠质量","idea"],["自然醒","zìrán xǐng","tự nhiên tỉnh","自然醒来","idea"],["健康","jiànkāng","sức khỏe","身体健康","idea"],["习惯","xíguàn","thói quen","生活习惯","idea"],["质量","zhìliàng","chất lượng","提高睡眠质量","idea"],["上班族","shàngbānzú","dân công sở","对上班族来说","idea"],["定闹钟","dìng nàozhōng","đặt báo thức","定好闹钟","act"],["睡懒觉","shuì lǎnjiào","ngủ nướng","周末睡懒觉","act"],["养成","yǎngchéng","hình thành","养成好习惯","act"],["依靠","yīkào","dựa vào","依靠闹钟","act"],["放松","fàngsōng","thả lỏng","放松精神","act"],["调整","tiáozhěng","điều chỉnh","调整作息","act"],["危害","wēihài","gây hại","闹钟的危害","lesson"],["导致","dǎozhì","dẫn đến","导致失眠","lesson"],["规律","guīlǜ","quy luật; điều độ","有规律的生活","lesson"],["享受","xiǎngshòu","hưởng thụ","享受睡眠","lesson"],["避免","bìmiǎn","tránh","避免伤害","lesson"],["采用","cǎiyòng","áp dụng","采用柔和的音乐","lesson"],["持续","chíxù","kéo dài","持续数月","lesson"],["情绪","qíngxù","tâm trạng","情绪低落","lesson"],["作息","zuòxī","giờ giấc làm việc nghỉ ngơi","作息时间","bonus"],["早睡早起","zǎo shuì zǎo qǐ","ngủ sớm dậy sớm","养成早睡早起的习惯","bonus"],["与其……不如……","yǔqí……bùrú……","thay vì… chi bằng…","与其依靠闹钟，不如早点睡","bonus"],["精神饱满","jīngshén bǎomǎn","tinh thần sung mãn","一整天都精神饱满","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 11"],["bonus","加分 · thành ngữ"]],"legend":["① Trả lời câu hỏi","② Lý do","③ Cách làm của tôi","④ Kết luận"],"samples":{"speak":[{"who":"不需要","meta":"Hướng A · bài nói ~1 phút 30","p":["你真的需要闹钟吗？我觉得，很多人其实并不真的需要它。","首先，医学研究证明，自然醒是最符合人体生物钟规律的。其次，如果突然被闹钟叫醒，人会心慌、情绪低落，记忆能力和计算能力也会受到影响。这种状态如果持续下去，还会导致高血压、失眠等问题。","我的办法是养成有规律的生活习惯：每天晚上十一点前睡觉，睡觉前不玩手机，早上把窗帘拉开一点儿，让阳光叫醒我。现在我每天七点左右就能自然醒来，一整天都精神饱满。","所以，与其依靠闹钟，不如早点儿睡觉。"],"vi":"Bạn thật sự cần báo thức sao? Tôi thấy nhiều người không thật sự cần. Trước hết, tự nhiên tỉnh phù hợp nhất với đồng hồ sinh học. Thứ hai, bị báo thức gọi dậy đột ngột gây hồi hộp, tâm trạng sa sút, ảnh hưởng trí nhớ, tính toán; kéo dài còn dẫn đến cao huyết áp, mất ngủ. Cách của tôi: sinh hoạt điều độ — ngủ trước 11 giờ, không dùng điện thoại trước khi ngủ, mở hé rèm để nắng đánh thức. Giờ tôi tự tỉnh lúc 7 giờ, cả ngày tràn đầy năng lượng. Vì vậy, thay vì dựa vào báo thức, chi bằng ngủ sớm hơn."},{"who":"需要，但要换个方法","meta":"Hướng B · bài nói ~1 phút 30","p":["对上班族来说，闹钟是需要的，因为紧张的现代生活让我们无法每天都自然醒来。","不过，传统闹钟的危害也很大。人们对自然醒与被闹钟铃声叫醒这两种方式所产生的反应是很不相同的，突然被铃声惊醒的人血压更高、心跳更快。","所以，我们应该换个方法使用闹钟。比如，采用柔和的音乐代替刺耳的铃声，或者使用模仿自然光线的“光闹钟”。另外，周末不定闹钟，让身体好好休息。","希望这样能让我们向真正的“自然醒”走近一点，再走近一点。"],"vi":"Với dân công sở, báo thức là cần vì cuộc sống căng thẳng khiến ta không thể ngày nào cũng tự tỉnh. Nhưng tác hại của báo thức truyền thống cũng lớn: người bị chuông đánh thức đột ngột huyết áp cao hơn, tim đập nhanh hơn. Vì vậy nên đổi cách dùng: dùng nhạc êm thay chuông chói tai, hoặc “đồng hồ ánh sáng”; cuối tuần không đặt báo thức. Mong như vậy ta tiến gần hơn đến “tự nhiên tỉnh”."}],"write":[{"who":"范文 1 · 不需要","meta":"Dạng HSK5 · khoảng 80 chữ","title":"你真的需要闹钟吗？","p":["我觉得，很多人其实并不真的需要闹钟。","被闹钟突然叫醒，人会心慌、情绪低落，长期下去还会导致失眠。","只要养成有规律的生活习惯，每天早点儿睡觉，就能自然地醒来。","所以，与其依靠闹钟，不如早点儿睡。"],"vi":"Bố cục 4 câu: trả lời → lý do (导致) → cách
