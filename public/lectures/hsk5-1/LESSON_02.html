<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 02 · 留串钥匙给父母 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

,"小舅","舅妈"],""],["姑姑","gūgu","名","cô",0,"爸爸的姐姐或者妹妹。","尽管姥姥、舅舅和姑姑都在城里……","我姑姑是一名中学老师。","Cô tôi là giáo viên trung học.",["大姑","小姑","姑父"],""],["坚决","jiānjué","形","kiên quyết",1,"态度非常坚定，不会改变。","父母也坚决不在城里住。","对这个计划，他坚决反对。","Đối với kế hoạch này, anh ấy kiên quyết phản đối.",["坚决反对","坚决改正","态度坚决"],"“坚决”强调态度和行动果断（坚决反对）；“坚持”强调一直做下去，不放弃（坚持学习）。"],["打工","dǎ gōng","动","làm thuê, làm công",0,"为了挣钱给别人工作，常指去外地工作。","我们终于用打工挣的钱，在县里买了一套新房。","放暑假的时候，他在一家咖啡店打工。","Kỳ nghỉ hè, cậu ấy làm thêm ở một quán cà phê.",["去外地打工","打工挣钱","打了两个月工"],"离合词：打了两个月工。"],["挣","zhèng","动","kiếm (tiền)",1,"通过工作得到钱。","我们终于用打工挣的钱，在县里买了一套新房。","他每个月挣的钱不多，但是很够用。","Mỗi tháng anh ấy kiếm không nhiều nhưng đủ dùng.",["挣钱","挣得多","挣断"],"在“词语搭配”中还表示用力摆脱，如“挣断”。"],["县","xiàn","名","huyện",0,"一种行政单位，比市小。","在县里买了一套新房。","他是从一个小县城来北京工作的。","Anh ấy từ một thị trấn huyện nhỏ lên Bắc Kinh làm việc.",["县城","县里"],""],["套","tào","量","bộ, căn, cái",1,"用于成组的东西，比如房子、家具、衣服。","在县里买了一套新房。","他买了一套新家具。","Anh ấy mua một bộ đồ nội thất mới.",["一套房子","一套家具","一套餐具","一套邮票","一套西服"],""],["装修","zhuāngxiū","动","sửa sang, trang hoàng",0,"把房子的墙、地等重新布置，让房子更好看、更好住。","新房装修完，父母第一次走进新房时，高兴得不得了。","我们的新家装修了三个月。","Nhà mới của chúng tôi sửa sang mất ba tháng.",["装修房子","装修完","装修得很漂亮"],""],["不得了","bùdéliǎo","形","cực kỳ, vô cùng",1,"程度很深；也指情况很严重。","父母第一次走进新房时，高兴得不得了。","听说考上了大学，她高兴得不得了。","Nghe tin đỗ đại học, cô ấy vui vô cùng.",["热得不得了","累得不得了","急得不得了","兴奋得不得了","热闹得不得了"],"两种用法：形容词＋得不得了（程度很深）；不得了了！（情况很严重）。"],["醉","zuì","动","say (rượu)",0,"喝酒太多，头脑不清楚。","那天，父亲喝醉了，等他醒时，天色已晚。","他只喝了一杯就醉了。","Anh ấy mới uống một chén đã say.",["喝醉","醉了","醉酒"],""],["强烈","qiángliè","形","mãnh liệt, cố gắng hết mức",1,"程度很高，力量很大。","我和妻子强烈留父母在新房住一夜……","离开家以后，他有了强烈的想家的感觉。","Sau khi xa nhà, anh ấy có cảm giác nhớ nhà mãnh liệt.",["强烈的阳光","强烈的感情","强烈的对比","强烈要求"],""],["夜","yè","名","ban đêm",0,"天黑以后到天亮以前的时间。","我和妻子强烈留父母在新房住一夜……","他看书看到深夜。","Anh ấy đọc sách đến tận khuya.",["住一夜","半夜","深夜","夜里"],""],["锁","suǒ","名/动","cái khóa; khóa",0,"关门用的东西；也指用锁关上。","新房只能上锁空着。","出门前别忘了锁门。","Trước khi ra ngoài đừng quên khóa cửa.",["上锁","锁门","一把锁","反锁"],""],["临","lín","介/动","sắp, gần; giáp, kề",1,"快要做某事的时候；也指靠近、对着。","临走那天，父亲从老家赶来送我们。","临睡前，她总喜欢看一会儿书。","Trước khi ngủ, cô ấy luôn thích đọc sách một lúc.",["临走","临睡前","临街","临江"],"见“注释”②。"],["悄悄","qiāoqiāo","副","lặng lẽ, nhẹ nhàng",1,"声音很小，不让别人发现。","父亲悄悄把我拉到一边说……","孩子睡着了，妈妈悄悄地关上了门。","Con ngủ rồi, mẹ nhẹ nhàng đóng cửa lại.",["悄悄地走","悄悄地说","悄悄离开"],"辨析：悄悄—偷偷。“悄悄”强调声音小，“偷偷”强调不想让别人知道。见“辨析”部分。"],["晒","shài","动","phơi",0,"放在太阳下面照。","顺便给你们晒晒被子，打扫打扫卫生。","今天太阳很好，把衣服拿出去晒晒吧。","Hôm nay nắng đẹp, mang quần áo ra phơi đi.",["晒被子","晒衣服","晒太阳"],""],["被子","bèizi","名","mền, chăn",0,"睡觉时盖在身上的东西。","顺便给你们晒晒被子，打扫打扫卫生。","天冷了，妈妈给我换了一条厚被子。","Trời lạnh, mẹ thay cho tôi một cái chăn dày.",["盖被子","晒被子","铺被子"],""],["长途","chángtú","形","đường dài",0,"路程很远的。","下了长途车，儿子被冻得大哭。","坐了十几个小时的长途车，大家都累坏了。","Ngồi xe đường dài hơn mười tiếng, mọi người đều mệt rã rời.",["长途旅行","长途汽车","长途电话"],""],["冻","dòng","动","bị cóng, rét; đóng băng",0,"因为温度很低，身体觉得很冷；水变成冰。","下了长途车，儿子被冻得大哭。","外面太冷了，我的手都冻红了。","Bên ngoài lạnh quá, tay tôi cóng đỏ cả lên.",["冻得大哭","冻住了","冻坏了"],""],["想象","xiǎngxiàng","动","tưởng tượng",1,"在心里想出没有看到的样子。","我和妻子想象着打开家门满是灰尘、冷冷清清的景象……","我很难想象没有手机的生活。","Tôi khó mà tưởng tượng cuộc sống không có điện thoại.",["想象不到","无法想象","想象力"],""],["灰尘","huīchén","名","bụi bặm",0,"很小很轻的脏东西，常落在桌子、地上。","我和妻子想象着打开家门满是灰尘、冷冷清清的景象……","很久没人住，桌子上全是灰尘。","Lâu không có người ở, trên bàn toàn là bụi.",["满是灰尘","擦灰尘"],""],["亮","liàng","形/动","sáng; tỏa sáng",0,"有光；也指发出光。","却发现自家亮着灯光。","天还没亮，爸爸就出门了。","Trời chưa sáng bố đã ra khỏi nhà.",["亮着灯","天亮了","眼睛一亮"],""],["微笑","wēixiào","动/名","mỉm cười; nụ cười",0,"不出声地轻轻笑。","开门的竟是微笑着的父母……","她微笑着向我们点点头。","Cô ấy mỉm cười gật đầu với chúng tôi.",["微笑着说","一个微笑","面带微笑"],""],["温暖","wēnnuǎn","形/动","ấm áp; sưởi ấm",1,"不冷，让人舒服；也指让人心里感到关心。","温暖的气息立刻扑面而来……","朋友的一句话温暖了我的心。","Một câu nói của bạn đã sưởi ấm trái tim tôi.",["温暖的家","温暖的微笑","家的温暖","温暖人心"],"辨析：温暖—暖和。“温暖”还可以说感情，“暖和”主要说温度。见“辨析”部分。"],["立刻","lìkè","副","lập tức",1,"马上，表示一个动作紧接着另一个动作发生。","温暖的气息立刻扑面而来……","听到这个消息，他立刻给妈妈打了电话。","Nghe tin này, anh ấy lập tức gọi điện cho mẹ.",["立刻出发","立刻回来","立刻感受到"],"见“注释”③和“辨析”：立刻—马上。"],["扑","pū","动","bổ nhào; (mùi) phả vào",0,"很快地向前冲；也指气味、风等迎面而来。","温暖的气息立刻扑面而来……","孩子一看见妈妈，就扑进了她的怀里。","Đứa bé vừa thấy mẹ liền nhào vào lòng mẹ.",["扑面而来","扑进怀里","扑过去"],""],["卧室","wòshì","名","phòng ngủ",0,"睡觉的房间。","卧室床上的被子已铺好……","我的卧室不大，但是很安静。","Phòng ngủ của tôi không lớn nhưng rất yên tĩnh.",["主卧室","卧室的窗户"],""],["铺","pū","动","trải",0,"把东西平平地放开。","卧室床上的被子已铺好……","妈妈在地上铺了一块新地毯。","Mẹ trải một tấm thảm mới trên sàn.",["铺被子","铺床","铺好"],""],["飘","piāo","动","thoảng đưa, thoang thoảng",0,"在空中轻轻地移动；也指气味、声音慢慢传过来。","厨房里飘来阵阵饭菜香……","秋天到了，树叶在风中飘来飘去。","Thu đến, lá cây bay lả tả trong gió.",["飘来","飘着","飘雪"],""],["阵","zhèn","量","trận, cơn, làn",1,"用于一段时间里发生的事情或动作。","厨房里飘来阵阵饭菜香……","窗外传来一阵笑声。","Ngoài cửa sổ vọng vào một tràng cười.",["一阵风","一阵雨","一阵歌声","一阵香味","阵阵"],""],["感受","gǎnshòu","动/名","cảm nhận; sự cảm nhận",1,"心里感觉到；也指心里的感觉。","能立刻感受到家的温暖！","这次旅行让我感受到了中国人的热情。","Chuyến đi này giúp tôi cảm nhận sự nhiệt tình của người Trung Quốc.",["感受到温暖","内心的感受","说说你的感受"],""],["流泪","liú lèi","动","chảy nước mắt",0,"眼睛里流出眼泪。","我鼻子一酸，流下了热泪……","看到这个电影的结尾，很多观众都流泪了。","Xem đến cuối bộ phim, nhiều khán giả đã rơi nước mắt.",["流下了眼泪","感动得流泪","流下热泪"],"离合词：流下了热泪（课文）、流了很多泪。"]],"WARM":[{"tab":"亲属称谓","title":"关系树：亲属怎么称呼？","type":"reveal","lead":"Bạn biết cách gọi người thân trong tiếng Trung không? Đọc quan hệ, nói cách gọi, rồi bấm “？” để kiểm tra.","items":[["爸爸的爸爸","爷爷","ông nội"],["爸爸的妈妈","奶奶","bà nội"],["妈妈的爸爸","外公／姥爷","ông ngoại"],["妈妈的妈妈","外婆／姥姥","bà ngoại"],["爸爸的哥哥","伯伯","bác (anh của bố)"],["爸爸的弟弟","叔叔","chú"],["爸爸的姐姐或妹妹","姑姑","cô"],["妈妈的哥哥或弟弟","舅舅","cậu"],["妈妈的姐姐或妹妹","阿姨／姨妈","dì"],["哥哥的妻子","嫂子","chị dâu"],["叔叔、伯伯的孩子","堂哥、堂姐、堂弟、堂妹","anh chị em họ bên nội"],["姑姑、舅舅、阿姨的孩子","表哥、表姐、表弟、表妹","anh chị em họ"]],"note":"Mẹo nhớ: <b>堂<\/b> dùng cho con của anh em trai bố (cùng họ); <b>表<\/b> dùng cho các trường hợp còn lại. Từ trong bài: <b class='zh'>姥姥、舅舅、姑姑<\/b>."},{"tab":"称呼比较","title":"你们国家怎么称呼家人和亲戚？","type":"discuss","q":"在你们国家，一般怎么称呼家人和亲戚？跟中国人的称呼有什么不同？","vn":"Ở nước bạn thường xưng hô với người nhà và họ hàng thế nào? Khác cách xưng hô của người Trung Quốc ở điểm nào?","answer_zh":"越南的称呼也分父亲一方和母亲一方，比如爸爸的妹妹叫“cô”，妈妈的妹妹叫“dì”，跟汉语的“姑姑”“阿姨”很像。不同的是，越南人常常用亲属称呼来叫不认识的人，比如叫年纪大的男人“bác”或者“chú”，说话时也用这些称呼代替“你”“我”。","answer_vn":"Gợi ý: so sánh theo bảng dưới, rồi nói 1–2 điểm khác nhau (cách gọi người lạ, cách xưng hô thay cho “你/我”).","table":[["汉语","拼音","Tiếng Việt"],["爷爷 / 奶奶","yéye / nǎinai","ông nội / bà nội"],["外公 / 外婆（姥爷 / 姥姥）","wàigōng / wàipó","ông ngoại / bà ngoại"],["伯伯 / 叔叔","bóbo / shūshu","bác / chú"],["姑姑","gūgu","cô"],["舅舅","jiùjiu","cậu"],["阿姨（姨妈）","āyí","dì"]]},{"tab":"家是什么","title":"思考：家是一个地方，还是一种感情？","type":"discuss","q":"你觉得“家”是一个地方，还是一种感情？为什么？","vn":"Bạn thấy “nhà” là một nơi chốn hay là một thứ tình cảm? Vì sao?","answer_zh":"我觉得家不只是一个地方，更是一种感情。房子再大、再漂亮，如果没有家人，也会觉得冷冷清清；只要家人在一起，再小的房子也是温暖的家。","answer_vn":"Câu hỏi dẫn vào bài khóa: một căn nhà mới chỉ trở thành “nhà” khi có cha mẹ ở đó, sáng đèn và nấu cơm chờ con về."}],"_N":{"不得了":"两种用法：形容词＋得不得了（程度很深）；不得了了！（情况很严重）。","临":"见“注释”②。","以来":"见“注释”①。","坚决":"“坚决”强调态度和行动果断（坚决反对）；“坚持”强调一直做下去，不放弃（坚持学习）。","屋":"课本写作“屋（子）”，可以说“屋”，也可以说“屋子”。","悄悄":"辨析：悄悄—偷偷。“悄悄”强调声音小，“偷偷”强调不想让别人知道。见“辨析”部分。","打工":"离合词：打了两个月工。","挣":"在“词语搭配”中还表示用力摆脱，如“挣断”。","流泪":"离合词：流下了热泪（课文）、流了很多泪。","温暖":"辨析：温暖—暖和。“温暖”还可以说感情，“暖和”主要说温度。见“辨析”部分。","立刻":"见“注释”③和“辨析”：立刻—马上。"},"GAME":{"fill":[["父母一辈子住在{}老家……","农村",["农村","城市","县里","外地"]],["父母也{}不在城里住。","坚决",["坚决","坚持","坚强","强烈"]],["我们终于用打工{}的钱，在县里买了一套新房。","挣",["挣","花","借","存"]],["在县里买了一{}新房。","套",["套","串","阵","件"]],["父母第一次走进新房时，高兴得{}。","不得了",["不得了","不了","了不起","得很多"]],["父亲{}把我拉到一边说……","悄悄",["悄悄","偷偷","慢慢","常常"]],["{}走那天，父亲从老家赶来送我们。","临",["临","靠","离","从"]],["温暖的气息{}扑面而来……","立刻",["立刻","马上","刚才","已经"]],["厨房里飘来{}饭菜香……","阵阵",["阵阵","串串","套套","件件"]],["能立刻{}到家的温暖！","感受",["感受","感动","感谢","感情"]]],"order":[["父母|一辈子|住在|农村老家。"],["父母|也坚决|不在|城里住。"],["父亲|悄悄|把我|拉到|一边。"],["温暖的|气息|立刻|扑面而来。"],["厨房里|飘来|阵阵|饭菜香。"],["我|鼻子一酸，|流下了|热泪。"]]},"GOOD":[{"zh":"对老屋的感情，就像没断奶的孩子对母亲一样","vn":"tình cảm với căn nhà cũ giống như đứa trẻ chưa dứt sữa đối với mẹ vậy","why":"Phép so sánh <b>A 对 B 的感情，就像 C 对 D 一样<\/b> biến một tình cảm trừu tượng thành hình ảnh cụ thể, dễ cảm. Rất hợp để mở đoạn tả tình cảm.","frame":"A 对 B 的感情（爱），就像 C 对 D 一样","apply":"父母对我的爱，就像大树对小鸟一样，一直在保护着我。","apply_vn":"Tình yêu của cha mẹ dành cho tôi giống như cây lớn với chú chim nhỏ, luôn che chở tôi."},{"zh":"父母第一次走进新房时，高兴得不得了","vn":"lần đầu cha mẹ bước vào nhà mới, họ vui vô cùng","why":"<b>Adj + 得不得了<\/b> diễn tả mức độ rất cao, tự nhiên trong cả nói và viết. Đi kèm <b>……时<\/b> để nêu thời điểm cụ thể.","frame":"……的时候／……时，某人 + 形容词 + 得不得了","apply":"收到大学录取通知书的时候，我高兴得不得了。","apply_vn":"Lúc nhận được giấy báo trúng tuyển đại học, tôi vui vô cùng."},{"zh":"父亲说这话时，轻声细语，还红着脸，像个害羞的孩子","vn":"khi nói câu ấy, cha nói khẽ khàng, mặt còn đỏ lên, như một đứa trẻ ngượng ngùng","why":"Tả <b>giọng nói + nét mặt + so sánh<\/b> (像个……的孩子) khiến nhân vật hiện lên sống động. Mẫu tả người rất đáng học.","frame":"某人 + 说／做……时，+ 声音／表情，像个……的孩子","apply":"妈妈说起年轻时的爱情故事时，笑得眼睛都弯了，像个十八岁的姑娘。","apply_vn":"Khi mẹ kể chuyện tình thời trẻ, mẹ cười híp cả mắt, như một cô gái mười tám."},{"zh":"开门的竟是微笑着的父母，温暖的气息立刻扑面而来","vn":"người mở cửa lại là cha mẹ đang mỉm cười, hơi ấm lập tức ùa vào mặt","why":"<b>竟是<\/b> tạo bất ngờ; <b>……扑面而来<\/b> là cách nói giàu hình ảnh cho mùi, hơi ấm, không khí. Câu này là bước ngoặt “lạnh → ấm” của bài.","frame":"……竟是……，+ 气息／香味／热气 + 扑面而来","apply":"一打开家门，饭菜的香味扑面而来，原来妈妈早就做好了晚饭。","apply_vn":"Vừa mở cửa nhà, mùi thơm của cơm canh ùa tới, hóa ra mẹ đã nấu xong bữa tối từ lâu."},{"zh":"原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖","vn":"hóa ra cha mẹ bảo tôi để lại chùm chìa khóa chỉ là để khi chúng tôi về có thể ngay lập tức cảm nhận được hơi ấm gia đình","why":"<b>原来……，只是为了……<\/b> hé lộ mục đích thật sự sau một hành động — cao trào và kết bài rất mạnh. Dùng làm câu “hiểu ra” trong bài viết.","frame":"原来 + 某人 + 做……，只是为了……","apply":"原来妈妈每天晚上给我打电话，只是为了听听我的声音。","apply_vn":"Hóa ra tối nào mẹ cũng gọi điện cho tôi chỉ để được nghe giọng tôi."}],"GRAMMAR":[{"word":"以来","py":"yǐlái","pos":"名词","forms":["时间点／事件 + 以来，……","长年以来／一直以来／自……以来"],"vn":"<b>……以来<\/b> = từ một thời điểm trong quá khứ <b>cho đến nay<\/b>. Phần sau thường nói tình trạng kéo dài hoặc sự thay đổi tính đến hiện tại. <b>以来<\/b> luôn đứng <b>sau<\/b> mốc thời gian.","text":"因此长年以来，父母很少离开老屋……","ex":[["改革开放以来，中国发生了巨大的变化。","Từ khi cải cách mở cửa đến nay, Trung Quốc đã có những thay đổi to lớn."],["一直以来，他都是我最好的朋友。","Từ trước đến nay, anh ấy luôn là người bạn tốt nhất của tôi."],["搬到这个城市以来，我很少生病。","Từ khi chuyển đến thành phố này, tôi ít khi bị ốm."]],"err":[["❌ 以来来中国，我认识了很多朋友。","✅ 来中国以来，我认识了很多朋友。","以来 đứng sau mốc thời gian, không đứng đầu câu."],["❌ 到北京以来，我去了一次长城。","✅ 到北京以后，我去了一次长城。","Một việc xảy ra một lần → dùng 以后; 以来 dùng cho tình trạng kéo dài đến nay."]],"book":[["到中国以来，____________。","Gợi ý: nói một thay đổi/tình trạng từ khi đến TQ.","到中国以来，我认识了很多中国朋友，汉语也进步了不少"],["A：他们夫妻俩的关系怎么样？<br>B：____________。（以来）","Gợi ý: từ khi cưới đến nay.","结婚以来，他们从来没吵过架，关系一直很好"],["A：最近这几年空气污染比较严重。<br>B：____________。（以来）","Gợi ý: từ mùa đông năm nay…","是啊，入冬以来，雾霾天越来越多了"]],"drill":[["“以来”放在哪里？ <u>A<\/u>上大学<u>B<\/u>，他一直在打工。",["A","B"],1,"以来 đứng sau mốc thời gian: 上大学以来."],["Câu nào đúng?",["工作以来，他换过三次工作。","以来工作，他换过三次工作。","工作以来，他明天要去上海。"],0,"Tình trạng từ khi đi làm đến nay."],["选择：毕业____，我们已经五年没见面了。",["以来","以前","之前"],0,"Từ khi tốt nghiệp đến nay → 以来."]]},{"word":"临","py":"lín","pos":"动词／介词","forms":["临 + 地方（动词：靠近、对着）","临 + 动词 +（时／前）（介词：快要……的时候）"],"vn":"<b>临<\/b> có hai cách dùng: ① động từ — <b>giáp, kề, hướng ra<\/b> (临街, 临江); ② giới từ — <b>sắp, ngay trước khi<\/b> làm gì (临走, 临睡前, 临离开时). Chủ ngữ đứng <b>trước<\/b> 临.","text":"临走那天，父亲从老家赶来送我们。","ex":[["这家饭店临海，风景特别美。","Nhà hàng này hướng ra biển, phong cảnh rất đẹp. (nghĩa ①)"],["临睡前，她总喜欢看一会儿书。","Trước khi ngủ, cô ấy luôn thích đọc sách một lúc. (nghĩa ②)"],["我临出门的时候，妈妈又叮嘱了我几句。","Lúc tôi sắp ra khỏi nhà, mẹ lại dặn dò mấy câu. (nghĩa ②)"]],"err":[["❌ 临我走的时候，他来送我。","✅ 我临走的时候，他来送我。","Chủ ngữ đứng trước 临: 我临走……"],["❌ 这套房子很临街。","✅ 这套房子临街。","临 là động từ, không thêm 很."]],"book":[["A：你觉得这套房子怎么样？<br>B：____________。（临）","Gợi ý: nhà mặt phố, hơi ồn.","房子不错，就是临街，有点儿吵"],["A：你一个人来中国，你的爸爸妈妈放心吗？<br>B：____________。（临）","Gợi ý: lúc sắp đi, bố mẹ dặn dò…","他们不太放心，我临走的时候，妈妈还哭了"],["A：你卧室里的新被子真漂亮，哪儿买的？<br>B：____________。（临）","Gợi ý: mẹ mua lúc sắp đi.","这是我临来中国的时候妈妈给我买的"]],"drill":[["“临”是什么意思？ 我想买一套不临街的房子。",["giáp, hướng ra","sắp, trước khi"],0,"临街 = giáp mặt phố."],["“临”是什么意思？ 这是我临离开北京的时候买的。",["giáp, hướng ra","sắp, trước khi"],1,"临 + động từ + 的时候 = lúc sắp…"],["Câu nào đúng?",["临考试前，他紧张得睡不着。","临他考试前，他紧张得睡不着。","他很临考试。"],0,"临 + động từ + 前."]]},{"word":"立刻","py":"lìkè","pos":"副词","forms":["立刻 + 动词","一……，就立刻……"],"vn":"<b>立刻<\/b> = lập tức, ngay. Nhấn mạnh một động tác xảy ra <b>ngay sau<\/b> động tác hoặc sự việc trước. Thường đi với <b>一……就……<\/b>. Không dùng để nói “thời gian sắp tới” kiểu 春节马上就要到了.","text":"上了楼，开门的竟是微笑着的父母，温暖的气息立刻扑面而来……","ex":[["一听到孩子的哭声，妈妈立刻跑了过去。","Vừa nghe tiếng con khóc, mẹ lập tức chạy tới."],["接到电话以后，他立刻开车去了医院。","Nhận điện thoại xong, anh ấy lập tức lái xe đến bệnh viện."],["那两只羊一见到青草，就立刻去吃草了，哪还有心思打架呢？","Hai con dê vừa thấy cỏ non liền lao đi ăn, còn đâu tâm trí mà đánh nhau? (câu mẫu của sách)"]],"err":[["❌ 春节立刻就要到了。","✅ 春节马上就要到了。","Nói thời gian sắp tới dùng 马上, không dùng 立刻."],["❌ 他立刻地跑了出去。","✅ 他立刻跑了出去。","立刻 đứng thẳng trước động từ, không thêm 地."]],"book":[["一下课，____________。（立刻）","Gợi ý: tan học là làm ngay việc gì.","一下课，他就立刻跑回了宿舍"],["我快被气死了！____________。（立刻）","Gợi ý: yêu cầu ai làm gì ngay.","你立刻把电视关了，去写作业"],["A：你能帮我通知他这件事吗？<br>B：____________。（立刻）","Gợi ý: đồng ý làm ngay.","没问题，我立刻给他打电话"]],"drill":[["“立刻”放在哪里？ 听到这个消息，<u>A<\/u>她<u>B<\/u>给妈妈打了电话。",["A","B"],1,"Phó từ đứng sau chủ ngữ, trước động từ: 她立刻给……"],["选择：只有两天了，考试____就要到了。",["立刻","马上"],1,"Thời gian sắp tới → 马上."],["Câu nào đúng?",["他一进门就立刻打开了电视。","他一进门立刻就地打开电视。","立刻他一进门打开了电视。"],0,"一……就立刻 + động từ."]]}],"HSK":{"r1":[{"text":["小张在外地工作，很少回家。有一天，妈妈打来电话，说家里的老房子要{36}了，问他能不能回来帮忙。小张说工作太忙，{37}。挂了电话，他心里很不好受。周末，他还是买了车票回了家。一进门，他发现房子早就收拾好了，桌上摆满了他爱吃的菜。妈妈笑着说：“不这么说，{38}？”"],"qs":[{"n":36,"o":["打工","装修","流泪","想象"],"a":1,"why":"老房子要“装修”，所以需要人帮忙。"},{"n":37,"o":["马上就回来","已经在路上了","房子很漂亮","恐怕回不去了"],"a":3,"why":"“工作太忙”后面应该是不能回家的意思。"},{"n":38,"o":["你会回来吗","你会装修吗","我怎么做饭","谁来打扫卫生"],"a":0,"why":"房子早就收拾好了，妈妈这样说只是为了让儿子回家。"}]},{"text":["随着越来越多的年轻人到城市工作，农村出现了很多“空巢老人”。他们的子女{39}，一年只能回家一两次。很多老人嘴上说“我们很好，你们不用担心”，{40}。专家指出，对这些老人来说，物质上的帮助固然重要，但更重要的是精神上的{41}。哪怕每天只打一个电话，也能让父母{42}到孩子的关心。"],"qs":[{"n":39,"o":["都住在老人身边","长年在外地打工","从来不工作","不愿意离开家"],"a":1,"why":"后面说“一年只能回家一两次”，说明子女长年在外地。"},{"n":40,"o":["其实他们不想孩子","所以孩子不用回家","心里却非常盼望孩子回来","因为他们很忙"],"a":2,"why":"“嘴上说……，心里却……”，前后意思相反。"},{"n":41,"o":["装修","灰尘","长途","陪伴"],"a":3,"why":"“精神上的陪伴”和“物质上的帮助”相对。"},{"n":42,"o":["感受","感动","感谢","感想"],"a":0,"why":"“感受到孩子的关心”。"}]}],"r2":[{"start":46,"paras":["回家的路上，爸爸把伞一直举在我的头上，自己的半个身子都淋在雨里。","我上中学的时候，家离学校很远，每天都要坐长途汽车。","那一刻我明白了，父母的爱常常不说出来，却总是在我最需要的时候出现。","这时，我看见一个熟悉的身影向我跑来，原来是爸爸。他全身都湿透了，手里却紧紧拿着一把伞。","有一天下午，突然下起了大雨。我没带伞，只好站在学校门口等雨停。"],"ans":["B","E","D","A","C"],"why":"背景（B）→ 下大雨（E）→ 爸爸出现（D）→ 回家路上（A）→ 感悟（C）。"}],"r3":[{"text":["很多在城市工作的年轻人买了房子以后，最想做的一件事就是把父母从农村接来一起住。可是让他们没想到的是，不少父母住了没多久，就坚决要回老家。","李先生就遇到了这样的问题。他把父母接到北京以后，每天给他们买好吃的，周末还开车带他们出去玩儿。可是不到一个月，父亲就说：“城里什么都好，就是住不惯。”","后来李先生才明白，父母在农村生活了一辈子，那里有他们熟悉的邻居、朋友和土地。在城里，他们白天一个人在家，不认识人，也没有事做。<u><b>房子虽然大了，心却空了<\/b><\/u>。","于是，李先生改变了做法：他在老家装修了房子，自己每个月回去看父母一次。现在父母过得很开心，他也放心了。"],"qs":[{"n":56,"s":"父母住了没多久就要回老家，年轻人觉得：","o":["很意外","很高兴","很生气","很满意"],"a":0,"why":"第一段：“让他们没想到的是”，说明很意外。"},{"n":57,"s":"父亲说“住不惯”的主要原因是：","o":["城里的东西不好吃","李先生的房子太小","在城里没有熟悉的人，也没有事做","城里空气不好"],"a":2,"why":"第三段：白天一个人在家，不认识人，也没有事做。"},{"n":58,"s":"第三段画线句子的意思是：","o":["新房子里没有家具","生活条件好了，心里却很孤单","父母不喜欢大房子","父母的身体不好"],"a":1,"why":"“房子大了”指条件好了，“心空了”指孤单、没有依靠。"},{"n":59,"s":"李先生后来是怎么做的？","o":["把父母送进养老院","让父母在城里多住几年","辞职回了老家","装修老家的房子，常回去看父母"],"a":3,"why":"最后一段：在老家装修了房子，每个月回去一次。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出发生在小王一家身上的故事。"," \" stroke=\"#d6cfc4\"/><\/g><\/g><g transform=\"translate(204.0,168.0) scale(0.7,0.7)\"><g transform=\"translate(0.0,0.0)\"><path d=\"M-6 -16 q-4 -6 0 -12 q4 -6 0 -12 M6 -16 q-4 -6 0 -12 q4 -6 0 -12\" stroke=\"#bbb\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><ellipse cx=\"0\" cy=\"-10\" rx=\"16\" ry=\"4\" fill=\"#e9a23b\"/><path d=\"M-16 -10 q16 24 32 0z\" fill=\"#f2efe9\" stroke=\"#d6cfc4\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo thứ tự 4 tranh; thêm cảm xúc của Tiểu Vương (着急 → 惭愧 → 温暖).","Có thể dùng: 立刻、长途、原来、温暖、惭愧."],"sample":"周末，在外地工作的小王突然接到妈妈的电话，说爸爸生病了。小王听了非常着急，立刻向公司请了假，坐了五个小时的长途车赶回家。没想到一进门，就看见爸爸正坐在沙发上看电视，原来他只是有点儿感冒。妈妈不好意思地说：“我们就是想你了。”那天晚上，一家人围坐在一起吃饭，小王心里既温暖又惭愧。他决定以后每个月都回家看看父母。","svn":"Cuối tuần Tiểu Vương nhận điện thoại mẹ báo bố ốm… Hóa ra bố chỉ cảm nhẹ, mẹ nói “bố mẹ chỉ là nhớ con”… Anh quyết định mỗi tháng đều về thăm nhà."},"w72":{"prompt":"“父母在，不远游”是中国的一句老话。今天，很多年轻人为了工作和学习，离开父母去很远的地方。你怎么看这个问题？请写一篇不少于200字的作文。","vn":"“Cha mẹ còn thì không đi xa” là câu nói xưa. Ngày nay nhiều người trẻ xa nhà vì công việc, học tập. Bạn nghĩ sao? Viết bài không ít hơn 200 chữ.","min":200,"title":"父母在，不远游？","tips":["Giải thích câu tục ngữ → hoàn cảnh xưa và nay → quan điểm của bạn + ví dụ → kết luận.","Dùng khung 好句: 原来……只是为了……, Adj + 得不得了."],"sample":"“父母在，不远游”是中国的一句老话，意思是父母还在的时候，孩子不要去太远的地方。\n在古代，交通很不方便，孩子出远门，父母会非常担心，所以这句话有它的道理。但是在今天，情况已经不一样了。很多年轻人为了更好的工作和学习机会，不得不离开家乡。如果因为这句话放弃自己的理想，父母也不一定会高兴。\n我认为，离开家乡并不等于不孝顺。重要的是，不管走得多远，都要关心父母。我在国外留学，每个周末都会和爸爸妈妈视频聊天，放假就回家陪他们。\n所以，“远游”不可怕，可怕的是忘记了家里一直等着我们的父母。","svn":"Giải thích câu tục ngữ → bối cảnh xưa/nay → quan điểm: xa nhà không có nghĩa là bất hiếu → kết luận."}},"PRACTICE":{"ex1":{"bank":["断","套","锁","挣","长途","打工","强烈","想象"],"items":[["你觉得我穿这{}西服去电视台参加节目怎么样？",["套"]],["我不能{}她喝醉了会是什么样子。",["想象"]],["国际{}电话很贵，现在我们一般上网聊天儿。",["长途"]],["因为同学们{}要求，我们决定这个周末出去活动。",["强烈"]],["房门被反{}上了，他从窗户里跳出来，把腿摔{}了。",["锁","断"]],["暑假的时候我想去{}两个月，{}点儿钱。",["打工","挣"]]]},"ex2":[["他的态度很____，恐怕不会改变主意了。",["坚决","坚持"],0],["只有一个星期了，春节____就要到了。",["立刻","马上"],1],["最近气温太低，河里的水都被____住了。",["冻","冷"],0],["女服务员给了我一个____的微笑。",["暖和","温暖"],1]],"ex3":[["虽然她全身<u>A<\/u>瘫痪了，但<u>B<\/u>我会照顾<u>C<\/u>她<u>D<\/u>。","一辈子",3,"虽然她全身瘫痪了，但我会照顾她一辈子。"],["<u>A<\/u>了，他们俩<u>B<\/u>大吵<u>C<\/u>了一架<u>D<\/u>！","不得了",0,"不得了了，他们俩大吵了一架！"],["他<u>A<\/u>病了，<u>B<\/u>老师和同学们<u>C<\/u>把他<u>D<\/u>送进了医院。","立刻",2,"他病了，老师和同学们立刻把他送进了医院。"],["<u>A<\/u>花园里<u>B<\/u>飘来<u>C<\/u>花<u>D<\/u>香。","一阵",2,"花园里飘来一阵花香。"]],"ex4":[["父母的习惯","一辈子、以来、坚决","父母一辈子住在农村老家，长年以来很少离开老屋。虽然姥姥、舅舅和姑姑都在城里，他们也坚决不在城里住。"],["小夫妻的新房","打工、装修、不得了、醉、强烈","“我”和妻子用打工挣的钱在县里买了一套新房。新房装修完，父母高兴得不得了，却拒绝了钥匙。那天父亲喝醉了，我们强烈留他们住一夜，可他们还是坐最后一趟车回了老家。"],["去打工之前","锁、临、悄悄、被子","我们又要去外地打工，新房只能上锁。临走那天，父亲悄悄对我说，想要一串钥匙，有空来住几天，顺便晒晒被子、打扫卫生。"],["去打工之后","长途、想象、亮、微笑、温暖、立刻、流泪","半年后的冬夜，我们坐长途车回家，想象家里一定又冷又脏。没想到家里亮着灯，父母微笑着开门，温暖的气息立刻扑面而来。原来父母要钥匙，是为了让我们一回家就感受到温暖。我感动得流下了眼泪。"]],"ext":{"title":"扩展 · 话题：亲属称谓 · 交往","words":[["外公","wàigōng","ông ngoại"],["姥姥","lǎolao","bà ngoại"],["姑姑","gūgu","cô"],["舅舅","jiùjiu","cậu"],["老婆","lǎopo","vợ"],["太太","tàitai","bà, vợ"],["兄弟","xiōngdi","anh em trai"],["小气","xiǎoqi","keo kiệt, hẹp hòi"],["周到","zhōudào","chu đáo"],["坦率","tǎnshuài","thẳng thắn"]],"items":[["妈妈说她哥哥明天会从老家来，我还从来没见过这个{}呢。","舅舅"],["{}地说，我觉得你不应该这么做。","坦率"],["你怎么这么{}啊？好朋友借点儿钱都不愿意。","小气"],["这次来北京参加会议，你们照顾得非常{}，非常感谢！","周到"]]}},"TEXT":[{"title":"老屋里的父母","sub":"离不开的老家","paras":["父母一辈子住在农村老家，对老屋的感情，就像没断奶的孩子对母亲一样。因此长年以来，父母很少离开老屋，尽管姥姥、舅舅和姑姑都在城里，父母也坚决不在城里住。"],"idea":"Cha mẹ sống cả đời ở quê, gắn bó với căn nhà cũ như đứa trẻ chưa dứt sữa gắn bó với mẹ. Dù họ hàng đều ở thành phố, họ <b>kiên quyết không lên thành phố ở<\/b>.","qs":[["父母一辈子住在哪儿？",["城里","农村老家","县里的新房"],1],["作者用什么来比喻父母对老屋的感情？",["没断奶的孩子对母亲","朋友之间的感情","夫妻之间的感情"],0],["哪些亲戚住在城里？",["爷爷、奶奶","姥姥、舅舅和姑姑","哥哥、姐姐"],1]]},{"title":"新房与钥匙","sub":"第一次被拒绝","paras":["去年，在我和妻子的努力下，我们终于用打工挣的钱，在县里买了一套新房。新房装修完，父母第一次走进新房时，高兴得不得了。妻子提出留一串钥匙给父母，可他们拒绝了。那天，父亲喝醉了，等他醒时，天色已晚。我和妻子强烈留父母在新房住一夜，第二天再回，但他们仍坚持坐上了最后一趟回老家的车。"],"idea":"Vợ chồng “tôi” đi làm thuê, mua được căn nhà mới ở huyện. Cha mẹ vui vô cùng nhưng <b>từ chối nhận chìa khóa<\/b>, và dù đã muộn vẫn nhất quyết bắt chuyến xe cuối về quê.","qs":[["“我们”用什么钱买了新房？",["父母给的钱","打工挣的钱","向朋友借的钱"],1],["父母第一次走进新房时心情怎么样？",["很不高兴","高兴得不得了","很紧张"],1],["那天晚上父母做了什么？",["在新房住了一夜","坐最后一趟车回了老家","去姥姥家住了"],1]]},{"title":"一串钥匙","sub":"父亲的请求","paras":["一段时间后，我和妻子又准备去外地打工，新房只能上锁空着。临走那天，父亲从老家赶来送我们。父亲悄悄把我拉到一边说：“你妈说了，你还是留一串新房的钥匙给我们，要是我和你妈什么时候想来了，就来住上几天，顺便给你们晒晒被子，打扫打扫卫生。”父亲说这话时，轻声细语，还红着脸，像个害羞的孩子。"],"idea":"Trước hôm vợ chồng “tôi” lại đi làm xa, người cha lặng lẽ kéo “tôi” ra một góc, đỏ mặt xin <b>một chùm chìa khóa<\/b> — để thỉnh thoảng lên ở vài hôm, tiện phơi chăn, dọn dẹp giúp.","qs":[["新房为什么要上锁空着？",["要卖掉了","“我们”要去外地打工","父母不喜欢新房"],1],["父亲说要钥匙是为了什么？（他自己的说法）",["想来住几天，顺便晒被子、打扫卫生","想把新房租出去","想在新房请客"],0],["父亲说这话时是什么样子？",["大声地说","轻声细语，红着脸","很生气"],1]]},{"title":"灯光下的父母","sub":"从“冷”到“暖”","paras":["转眼又是半年，我们回家时是一个深冬的夜里。下了长途车，儿子被冻得大哭。我和妻子想象着打开家门满是灰尘、冷冷清清的景象，觉得心里发寒。来到楼下，抬头一看，却发现自家亮着灯光。上了楼，开门的竟是微笑着的父母，温暖的气息立刻扑面而来：室内打扫得干干净净，暖气开着，水已温热，卧室床上的被子已铺好，厨房里飘来阵阵饭菜香……"],"idea":"Nửa năm sau, đêm đông lạnh giá, cả nhà tưởng sẽ về một căn nhà đầy bụi, lạnh lẽo. Nhưng nhà <b>sáng đèn<\/b>: cha mẹ mỉm cười mở cửa, nhà sạch sẽ, lò sưởi bật, chăn trải sẵn, mùi cơm thơm — tác giả dùng đối lập <b>lạnh → ấm<\/b>.","qs":[["“我们”是什么时候回家的？",["夏天的早上","深冬的夜里","春节的中午"],1],["“我们”本来以为家里会是什么样子？",["满是灰尘、冷冷清清","很热闹","有很多客人"],0],["下面哪一项<b>不是<\/b>家里的样子？",["暖气开着","被子已铺好","满是灰尘"],2]]},{"title":"原来，这就是爱","sub":"钥匙的真正意义","paras":["父亲说：“你妈昨天接到电话，知道你们今晚回来，今天来新房忙了一天了。”原来父母要我留下串钥匙，只是为了让我们回来时，能立刻感受到家的温暖！我鼻子一酸，流下了热泪……"],"idea":"Hóa ra cha mẹ xin chìa khóa <b>chỉ để<\/b> con cái vừa về là cảm nhận ngay được hơi ấm gia đình. Tình yêu của cha mẹ không nói thành lời mà nằm trong việc làm.","qs":[["父母是怎么知道“我们”今晚回来的？",["邻居告诉他们的","母亲昨天接到了电话","他们猜的"],1],["父母要钥匙的真正原因是什么？",["想住进新房","让孩子回来时能立刻感受到家的温暖","帮孩子看房子"],1],["这篇课文主要想告诉我们什么？",["父母的爱常常是无声的，藏在小事里","年轻人应该去外地打工","新房比老屋好"],0]]}],"TEXT_EXTRA":{"compare":[["开始","拒绝钥匙","不想给孩子添麻烦"],["后来","悄悄要钥匙","想为孩子做点儿事"],["最后","灯光、被子、饭菜香","让孩子立刻感受到家的温暖"]],"compare_head":["阶段","父母的做法","背后的原因"],"compare_title":"父母的变化：拒绝 → 请求 → 原来","bg":"人们常说，父母对子女的爱是无私的、伟大的。父母对孩子的关心和照顾，不只是在孩子小的时候。即使孩子已经长大、自己已经变老，父母们也会继续为子女付出很多，只不过，爱的方式和以前不同了。","bg_vn":"Tình yêu của cha mẹ dành cho con cái là vô tư, vĩ đại. Dù con đã lớn, cha mẹ đã già, họ vẫn tiếp tục hy sinh cho con, chỉ là cách yêu thương đã khác trước.","discuss_title":"话题讨论：父母对子女的爱——最无私的爱","discuss":["你同意“父母对子女的爱是无私和伟大的”这种说法吗？","你觉得课文中的这对父母一开始拒绝接受孩子新房钥匙的原因是什么？","请说说你记得最清楚的父母关心你、爱你的一件事。"],"write":"请以“最深的爱”为题写一段话，谈谈你对课文中父母的表现有什么看法，并说说你和自己父母亲的关系。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“最深的爱”为题，说说你和父母的关系","topic_vn":"Lấy “Tình yêu sâu nặng nhất” làm đề, nói về mối quan hệ giữa bạn và cha mẹ","intro":"Đề kể chuyện kết hợp bày tỏ cảm xúc · Một dàn ý 4 bước dùng cho cả bài nói (1–2 phút) và bài viết (80–150 chữ).","analyse":{"title":"题目是“爱”，重点是“关系”","lead":"Đề có hai yêu cầu: <b>đầu đề 最深的爱<\/b> (chủ đề tình cảm) và <b>说说你和父母的关系<\/b> (nội dung chính). Nhiều thí sinh chỉ khen bố mẹ tốt mà <b>quên nói mối quan hệ<\/b> ra sao: thân thiết, từng mâu thuẫn, xa cách hay đã thay đổi theo thời gian.","parts":[["请以“最深的爱”为题","Viết đầu đề 最深的爱 ở giữa dòng đầu tiên; đầu đề không tính vào số chữ."],["说说……","Kể bằng lời của mình, có chuyện cụ thể, không viết khẩu hiệu."],["你和父母的关系","Trọng tâm: thân như bạn? nghiêm khắc? từng mâu thuẫn? thay đổi thế nào?"],["（课本）谈谈你对课文中父母的表现有什么看法","Đề viết của sách thêm 1 yêu cầu: nhận xét 1–2 câu về cha mẹ trong bài khóa."]],"traps":[["Chỉ khen chung chung","他们很爱我，对我非常非常好 → không có chi tiết, giám khảo không chấm cao."],["Quên nói “quan hệ”","Chỉ giới thiệu nghề nghiệp, ngoại hình của bố mẹ → lạc đề."],["Biến thành bài giới thiệu gia đình","我家有四口人…… → mở bài phải vào thẳng chủ đề 最深的爱."],["Chồng thành ngữ khó","恩重如山、铭感五内… → dễ sai, nghe giả. Một thành ngữ là đủ."]],"link":"<b>Liên hệ bài 2 · 留串钥匙给父母:<\/b> cả bài khóa không có câu “我爱你”. Tình yêu hiện ra qua <b>chi tiết<\/b>: chùm chìa khóa, ngọn đèn sáng, chăn đã trải, mùi cơm thơm. Bài nói/viết của bạn cũng cần <b>một chuyện cụ thể có thời gian, hành động, lời nói<\/b>."},"steps":[["①","点题","Mở bài nêu thẳng chủ đề: tình yêu sâu nặng nhất đến từ cha mẹ.","对我来说，最深的爱来自父母。"],["②","说关系","Khái quát quan hệ: thân như bạn? nghiêm khắc? từng có mâu thuẫn?","我和父母的关系很亲密……"],["③","讲一件事","<b>Trọng tâm.<\/b> Một chuyện cụ thể có thời gian, hành động, lời nói.","记得有一次……"],["④","谈感悟 · 回报","Hiểu ra điều gì + sẽ làm gì cho bố mẹ. Câu kết quay về “最深的爱”.","这让我明白了……以后我要……"]],"formula":["点题","关系是什么样的","一件具体的事","感悟 + 行动"],"choices_title":"Chọn một “góc kể” trước khi nói","choices_key":"Sự việc gợi ý: ","choices":[["A · 像朋友一样","thân như bạn","Chuyện gì cũng kể với bố mẹ; họ tôn trọng, ủng hộ mình.","mùa thi, lúc gặp áp lực"],["B · 严父慈母","cha nghiêm mẹ hiền","Bố ít nói nhưng thương thầm lặng, mẹ chăm sóc chu đáo.","một lần ốm, một lần bố đón đưa"],["C · 从矛盾到理解","từ mâu thuẫn đến thấu hiểu","Hồi nhỏ thấy mẹ cằn nhằn, hay cãi nhau; lớn lên mới hiểu. Có chuyển biến — dễ ăn điểm nhất.","đi du học, một lần cãi nhau"],["D · 远方的牵挂","nỗi nhớ khi xa nhà","Đi du học, ở xa; mỗi cuộc gọi video là sự quan tâm. Rất hợp với người học tiếng Trung.","cuộc gọi video, món quà quê"]],"notes":[["Một chuyện > mười câu khen","Nói được <b>thời gian, hành động, một câu bố/mẹ nói<\/b> là bài đã sinh động."],["Học cách của bài khóa","Đi từ “lạnh” đến “ấm”, từ hiểu lầm đến “原来……” — câu chuyện có chuyển biến sẽ cuốn hút."],["Nói khác viết","Nói: nhiều từ nối, câu tự nhiên. Viết: có đầu đề, câu ngắn, đúng dấu câu."]],"rule":"<b>Nguyên tắc HSK5:<\/b> một chuyện cụ thể có giá trị hơn mười câu “他们很爱我”. Thành ngữ như 无微不至 chỉ để cộng điểm, mỗi bài dùng một cái là đủ.","patterns":[["① 点题","有人说，父母的爱是世界上最深的爱，我非常同意。","Có người nói tình yêu của cha mẹ là tình yêu sâu nặng nhất trên đời, tôi rất đồng ý."],["① 点题","对我来说，最深的爱来自我的父母。","Với tôi, tình yêu sâu nặng nhất đến từ cha mẹ."],["② 说关系","我和父母的关系很亲密，与其说他们是父母，不如说是朋友。","Tôi và bố mẹ rất thân, nói là bố mẹ chẳng bằng nói là bạn bè."],["② 说关系","小时候我不太理解他们，常常跟他们发生矛盾。","Hồi nhỏ tôi không hiểu bố mẹ lắm, hay xảy ra mâu thuẫn với họ."],["③ 讲事例","记得有一次，我……，妈妈什么也没说，只是……","Nhớ có một lần, tôi…, mẹ không nói gì, chỉ…"],["③ 讲事例","直到……，我才发现……","Mãi đến khi…, tôi mới nhận ra…"],["④ 感悟","那一刻我才明白，父母的爱常常是默默的。","Khoảnh khắc ấy tôi mới hiểu, tình yêu của cha mẹ thường lặng lẽ."],["④ 行动","以后我要多陪伴他们，用行动报答他们的养育之恩。","Sau này tôi sẽ ở bên họ nhiều hơn, dùng hành động đền đáp công ơn nuôi dưỡng."]],"links":[["Nói về quan hệ",["与其说……，不如说……","不管……，(我)都……","我们之间无话不谈。"]],["Mở đầu câu chuyện",["记得有一次……","那年……的时候……","有一天晚上……"]],["Chuyển biến",["直到……，才……","从那以后，……","慢慢地，我开始理解……"]],["Bày tỏ cảm xúc",["那一刻，我的眼泪……","我心里既感动又内疚。","这让我明白了……"]]],"open":[["引用式","有人说，父母的爱是世界上最深的爱。"],["直接式","对我来说，最深的爱来自我的父母。"],["对比式","朋友的爱让我快乐，而父母的爱让我成长。"]],"close":[["感悟式","原来，最深的爱往往是最安静的。"],["行动式","以后，我要用行动报答他们的爱。"],["呼应式","这就是我心中最深的爱。"]],"from_text":[["A 对 B 的爱，就像 C 对 D 一样","父母对我的爱，就像大树对小鸟一样，一直在保护着我。","Lấy từ 好句 ①: so sánh để mở bài."],["形容词 + 得不得了","收到妈妈寄来的包裹时，我高兴得不得了。","Lấy từ 好句 ②: tả cảm xúc trong câu chuyện."],["……时，……，像个……的孩子","爸爸说这话时，红着脸，像个害羞的孩子。","Lấy từ 好句 ③: tả bố/mẹ sinh động."],["……扑面而来","一打开家门，饭菜的香味扑面而来。","Lấy từ 好句 ④: chi tiết “ấm áp”."],["原来……，只是为了……","原来妈妈每天给我打电话，只是为了听听我的声音。","Lấy từ 好句 ⑤: câu “hiểu ra” ở bước ④."]],"vocab":[["亲密","qīnmì","thân thiết","关系很亲密","rel"],["沟通","gōutōng","giao tiếp, trao đổi","和父母沟通","rel"],["理解","lǐjiě","thấu hiểu","互相理解","rel"],["尊重","zūnzhòng","tôn trọng","尊重我的选择","rel"],["支持","zhīchí","ủng hộ","一直支持我","rel"],["矛盾","máodùn","mâu thuẫn","发生矛盾","rel"],["严格","yángé","nghiêm khắc","对我要求很严格","rel"],["唠叨","láodao","cằn nhằn, nói nhiều","妈妈总是唠叨","rel"],["陪伴","péibàn","ở bên, bầu bạn","多陪伴父母","act"],["付出","fùchū","hy sinh, bỏ ra","为我付出很多","act"],["报答","bàodá","báo đáp","报答父母","act"],["孝顺","xiàoshùn","hiếu thảo","孝顺父母","act"],["牵挂","qiānguà","lo lắng, nhớ nhung","心里的牵挂","act"],["默默","mòmò","lặng lẽ","默默地关心我","act"],["感动","gǎndòng","cảm động","让我很感动","act"],["成长","chéngzhǎng","trưởng thành","陪我成长","act"],["温暖","wēnnuǎn","ấm áp","家的温暖","lesson"],["感受","gǎnshòu","cảm nhận","感受到父母的爱","lesson"],["悄悄","qiāoqiāo","lặng lẽ","妈妈悄悄地哭了","lesson"],["立刻","lìkè","lập tức","立刻赶来看我","lesson"],["无微不至","wúwēi-búzhì","chu đáo từng li từng tí","无微不至地照顾我","bonus"],["养育之恩","yǎngyù zhī ēn","công ơn nuôi dưỡng","报答养育之恩","bonus"],["无话不谈","wúhuà-bùtán","chuyện gì cũng kể","我们无话不谈","bonus"],["刀子嘴豆腐心","dāozi zuǐ dòufu xīn","miệng cứng lòng mềm","妈妈是刀子嘴豆腐心","bonus"]],"vgroups":[["rel","Quan hệ"],["act","Hành động · cảm xúc"],["lesson","Từ bài 2"],["bonus","加分 · thành ngữ"]],"legend":["① Nêu chủ đề","② Mối quan hệ","③ Câu chuyện cụ thể","④ Cảm nhận · hành động"],"samples":{"speak":[{"who":"像朋友一样","meta":"Góc A · bài nói ~1 phút 30","p":["有人说，父母的爱是世界上最深的爱，我非常同意。","我和父母的关系很亲密，与其说他们是我的父母，不如说是我的朋友。不管遇到什么问题，我都愿意跟他们沟通。","记得高考那年，我的压力特别大，每天晚上都睡不好。妈妈什么也没说，只是每天陪我散步，给我做我爱吃的菜。爸爸也常常鼓励我：“考得好不好没关系，健康最重要。”","正是因为有他们的支持，我才顺利地考上了大学。这让我明白了，父母的爱常常是默默的。以后我要多陪伴他们，用行动报答他们。"],"vi":"Có người nói tình yêu của cha mẹ là tình yêu sâu nặng nhất trên đời, tôi rất đồng ý. Tôi và bố mẹ rất thân, nói họ là bố mẹ chẳng bằng nói là bạn. Gặp chuyện gì tôi cũng muốn trao đổi với họ. Nhớ năm thi đại học, tôi áp lực vô cùng, đêm nào cũng ngủ không ngon. Mẹ không nói gì, chỉ ngày ngày đi dạo cùng tôi, nấu món tôi thích. Bố cũng thường động viên: “Thi tốt hay không không quan trọng, sức khoẻ là nhất.” Chính nhờ có sự ủng hộ của họ, tôi mới thuận lợi đỗ đại học. Điều đó giúp tôi hiểu: tình yêu của cha mẹ thường lặng lẽ. Sau này tôi sẽ ở bên họ nhiều hơn, dùng hành động đền đáp họ."},{"who":"从矛盾到理解","meta":"Góc C · bài nói ~1 phút 30","p":["对我来说，最深的爱来自我的父母。","可是小时候，我并不理解他们。爸爸对我要求很严格，妈妈总是唠叨，我们经常因为一些小事发生矛盾。","直到我出国留学，一个人在外面生活，才发现以前的一切都不容易。有一次我生病了，没人照顾，第一次那么想家。每次视频，妈妈总是问我吃得好不好，睡得好不好。","那一刻我才明白，她的唠叨里全是牵挂。现在我们的关系越来越好，我也学会了理解和尊重他们。"],"vi":"Với tôi, tình yêu sâu nặng nhất đến từ cha mẹ. Nhưng hồi nhỏ tôi không hề hiểu họ. Bố đòi hỏi tôi rất nghiêm, mẹ thì hay cằn nhằn, chúng tôi thường mâu thuẫn vì những chuyện nhỏ. Mãi đến khi đi du học, sống một mình bên ngoài, tôi mới nhận ra trước đây mọi thứ đều không dễ dàng. Có lần tôi ốm, không ai chăm sóc, lần đầu tiên tôi nhớ nhà đến thế. Mỗi lần gọi video, mẹ luôn hỏi tôi ăn có ngon không, ngủ có ngon không. Khoảnh khắc đó tôi mới hiểu, trong những lời cằn nhằn của mẹ toàn là nỗi lo. Bây giờ quan hệ của chúng tôi ngày càng tốt, tôi cũng học được cách thấu hiểu và tôn trọng họ."}],"write":[{"who":"范文 1 · 从矛盾到理解","meta":"Dạng HSK5 · khoảng 80 chữ","title":"最深的爱","p":["父母的爱是世界上最深的爱。","小时候，我觉得妈妈太唠叨，爸爸太严格，常常跟他们发生矛盾。","上大学以后，我离开了家，才慢慢理解了他们。每次打电话，他们总是关心我吃得好不好。","现在我们无话不谈，像朋友一样。我要好好学习，用行动报答他们。"],"vi":"Chú ý cặp 小时候……上大学以后…… tạo sự chuyển biến; ……才…… nhấn mạnh việc hiểu ra muộn."},{"who":"范文 2 · 严父慈母","meta":"Dạng HSK5 · khoảng 80 chữ","title":"最深的爱","p":["在我心中，最深的爱来自父母。","他们为我付出了很多，却从来不要求回报。","记得有一次我发高烧，妈妈一夜没睡，在床边照顾我。爸爸工作很忙，但是只要我需要，他都会出现。","父母对我的爱是默默的，也是最深的。我希望自己早点儿成长，以后多陪伴他们。"],"vi":"Mẫu 只要……都…… (chỉ cần… là…) và 却从来不…… (nhưng chưa bao giờ…) rất đáng học thuộc."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · có nhận xét bài khóa + dùng 好句","title":"最深的爱","p":["读了《留串钥匙给父母》，我很感动。课文中的父母一开始拒绝钥匙，是不想给孩子添麻烦；后来要钥匙，只是为了让孩子一回家就感受到温暖。","我和父母的关系也很亲密。小时候我觉得妈妈太唠叨，常常跟她发生矛盾，直到出国留学，我才明白她的牵挂。","记得第一次放假回家，一打开家门，饭菜的香味扑面而来，妈妈微笑着站在门口，高兴得不得了。","原来，父母的爱就藏在这些小事里。这就是我心中最深的爱。"],"good":["只是为了让孩子一回家就感受到温暖","饭菜的香味扑面而来","高兴得不得了"],"vi":"Bước ① đáp ứng yêu cầu của sách: nhận xét cha mẹ trong bài khóa. Ba chỗ gạch chân dùng lại khung 好句: 只是为了…… · ……扑面而来 · 形容词 + 得不得了."}]},"w5":["亲密","沟通","理解","尊重","支持","矛盾","严格","唠叨","陪伴","付出","报答","孝顺","牵挂","默默","感动","成长","无微不至","无话不谈","养育之恩","温暖","感受","悄悄","立刻","鼓励","照顾"],"step_names":["① 点题","② 说关系","③ 讲一件事","④ 感悟 · 行动"],"timer":[["① 10s",10],["② 15s",15],["③ 40s",40],["④ 25s",25]],"build_title":"选一个角度，拼出你的回答","build_lead":"Chọn góc kể, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây. Nhớ đổi các chi tiết thành chuyện <b>của chính bạn<\/b>!","build":{"A · 像朋友一样":[["有人说，父母的爱是世界上最深的爱，我非常同意。","对我来说，最深的爱来自我的父母。"],["我和父母的关系很亲密，与其说他们是父母，不如说是朋友。","不管遇到什么问题，我都愿意跟爸爸妈妈沟通，我们之间无话不谈。"],["记得高考那年，我的压力特别大，妈妈什么也没说，只是每天陪我散步。","有一次我考试没考好，很难过。爸爸笑着对我说：“没关系，努力了就好。”"],["这让我明白了，父母的爱常常是默默的。以后我要多陪伴他们。","正是因为有他们的支持，我才越来越自信。我要用行动报答他们。"]],"B · 严父慈母":[["在我心中，最深的爱来自父母。","父亲的爱像山，母亲的爱像水，都是我心中最深的爱。"],["爸爸对我要求很严格，话不多；妈妈对我的照顾却无微不至。","我和妈妈很亲密，和爸爸却不太会沟通。"],["记得有一次我发高烧，妈妈一夜没睡，在床边照顾我。","有一年冬天下大雪，爸爸什么也没说，每天骑车送我去学校。"],["那一刻我才明白，爸爸的爱虽然不说出来，但是一点儿也不少。","父母为我付出了很多，却从来不要求回报。我希望快点儿成长，让他们放心。"]],"C · 从矛盾到理解":[["对我来说，最深的爱来自我的父母。","以前我不明白什么是最深的爱，现在我知道了，那就是父母的爱。"],["小时候我并不理解他们，觉得妈妈太唠叨，爸爸太严格。","上中学的时候，我常常因为小事跟父母发生矛盾。"],["直到我出国留学，一个人生病没人照顾，我才第一次那么想家。","有一次我和妈妈吵架以后离开了家，回来时看到她还在门口等我。"],["那一刻我才明白，她的唠叨里全是牵挂。现在我学会了理解和尊重他们。","从那以后，我们的关系越来越好。我心里既感动又内疚。"]],"D · 远方的牵挂":[["我和父母很亲密，他们的爱是最深的爱。","离开家以后，我才真正懂得什么是最深的爱。"],["我决定来中国留学的时候，他们虽然很担心，但还是尊重并支持我的选择。","现在我们离得很远，但是心一直在一起。"],["每个周末我们都会视频聊天，妈妈总是问我吃得好不好、冷不冷。","去年春节我没能回家，爸爸妈妈专门给我寄来了家乡的特产。"],["这就是最深的爱。我会努力学习，不让他们失望。","以后我要常常回家看看，多陪伴他们，报答他们的养育之恩。"]]},"quiz":[["Câu nào bám đề hơn (đề yêu cầu nói về MỐI QUAN HỆ)?",["我爸爸是医生，妈妈是老师，他们都很忙，也很漂亮。","我和父母的关系很亲密，不管遇到什么问题，我都愿意跟他们沟通。"],1,"Câu 1 chỉ giới thiệu nghề nghiệp, ngoại hình — lạc đề. Câu 2 nói rõ quan hệ thân thiết như thế nào."],["Bước ③ nên viết thế nào?",["父母很爱我，我也很爱他们，他们对我非常非常好。","记得有一次我发高烧，妈妈一夜没睡，在床边照顾我。"],1,"Câu 2 có sự việc cụ thể (một lần sốt cao, mẹ thức trắng). Câu 1 là lời nói chung chung."],["Ở HSK5, câu nào nên dùng?",["父母之爱如山似海，恩重如山，我铭感五内，没齿难忘。","父母为我付出了很多，却从来不要求回报。"],1,"Câu 1 chồng nhiều thành ngữ khó, dễ viết sai và nghe giả. Câu 2 tự nhiên, đúng trình độ HSK5."],["Câu kết nào tốt hơn?",["这就是我的父母。","这让我明白了，父母的爱常常是默默的。以后我要多陪伴他们。"],1,"Kết bài nên có cảm nhận + hành động và quay lại chủ đề “爱”."],["Câu chuyển biến nào đúng?",["直到出国留学，我才明白父母的不容易。","直到出国留学，我就明白父母的不容易。"],0,"直到……才…… là cặp cố định: mãi đến khi… mới…. Không dùng 就."],["Câu mở bài nào phù hợp nhất?",["今天我想说一下我的家，我家有四口人……","对我来说，最深的爱来自我的父母。"],1,"Mở bài nên đi thẳng vào chủ đề 最深的爱. Câu 1 dễ biến thành bài “giới thiệu gia đình”."]],"fix":[["我和父母有很好关系。","我和父母的关系很好。","“A和B的关系 + TT”, không nói 有很好关系."],["妈妈很关心对我。","妈妈很关心我。／妈妈对我很关心。","关心 mang tân ngữ trực tiếp; nếu dùng 对 thì đặt trước 关心."],["我常常对父母发生矛盾。","我常常跟父母发生矛盾。","发生矛盾 đi với 跟 / 和, không đi với 对."],["我要孝顺对父母。","我要孝顺父母。","孝顺 là động từ, mang tân ngữ trực tiếp."],["不管天气很冷，爸爸都送我上学。","不管天气多冷，爸爸都送我上学。","Sau 不管 phải có từ nghi vấn / lựa chọn (多, 怎么, 是不是…), không dùng 很."],["父母为我付出很多，但是从来不要求回报。","父母为我付出了很多，却从来不要求回报。","Câu đúng ngữ pháp nhưng 却 tự nhiên hơn khi chủ ngữ giống nhau; thêm 了 cho việc đã xảy ra."]],"tpl":"最深的爱\n对我来说，最深的爱来自父母。我和他们的关系【很亲密 / 以前……现在……】。记得有一次，【时间 + 发生了什么】，【爸爸/妈妈做了什么、说了什么】。这让我明白了，【感悟】。以后我要【行动】。","chk":[["topic","Bám đề: có nói về tình yêu / cha mẹ (爱 · 父母 · 爸爸 · 妈妈)","爱[\\s\\S]*(父母|爸爸|妈妈|父亲|母亲)|(父母|爸爸|妈妈|父亲|母亲)[\\s\\S]*爱"],["rel","Có nói về MỐI QUAN HỆ (关系 · 亲密 · 沟通 · 矛盾 · 理解 · 像朋友)","关系|亲密|沟通|矛盾|理解|像朋友|无话不谈|严格"],["story","Có một chuyện cụ thể (记得 · 有一次 · 那年 · 那天)","记得|有一次|那年|那天|有一天|那一刻"],["feel","Có cảm nhận (明白 · 懂得 · 感动 · 让我)","明白|懂得|感动|让我|发现|原来"],["act","Có hành động / đền đáp (以后我要 · 我会 · 报答 · 陪伴 · 孝顺)","以后|我要|我会|报答|陪伴|孝顺|希望"]],"wmin":80,"wmax":150,"traps3":"Khi viết bài “以……为题”, nên viết <b>đầu đề 最深的爱<\/b> ở giữa dòng đầu tiên. Đầu đề không tính vào số chữ. Đề của sách yêu cầu <b>không ít hơn 100 chữ<\/b> và có <b>nhận xét về cha mẹ trong bài khóa<\/b> — xem 范文 3.","var_title":"同一个故事，可以回答很多题","var_lead":"Chuẩn bị sẵn <b>một câu chuyện thật<\/b> về gia đình, bạn có thể dùng lại cho rất nhiều đề. Chỉ cần đổi câu ① và câu kết. Bấm để xem câu mở đầu gợi ý.","variants":[["请以“我的家人”为题，写一段话。","我的家里有……，其中跟我关系最亲密的是……"],["说说一件让你感动的事。","最让我感动的一件事，发生在……"],["你和父母之间有“代沟”吗？","我和父母之间曾经有过“代沟”，但是……"],["你最想感谢的人是谁？为什么？","我最想感谢的人是我的妈妈，因为……"],["父母和孩子应该怎样相处？","我认为，父母和孩子之间最重要的是沟通和理解。"],["母亲节（父亲节）你会怎么做？","每年母亲节，我都会……，因为我想报答她的爱。"]],"homework":"<b>Bài về nhà:<\/b> chọn một góc kể (A–D) phù hợp với gia đình bạn · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ có đầu đề 最深的爱 (theo đề sách: có 1–2 câu nhận xét cha mẹ trong bài khóa) · dùng ít nhất 3 từ HSK5, có <b>một chuyện cụ thể<\/b>, <b>một câu bố/mẹ đã nói<\/b> và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();
/* ---------- TTS ---------- */
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.getAttribute("data-say"),b);}},true);
/* ---------- VN toggle ---------- */
var topbar=el("div",{class:"topbar"});
var vnBtn=el("button",{type:"button"},"Ẩn tiếng Việt");
vnBtn.addEventListener("click",function(){var h=document.body.classList.toggle("hide-vn");vnBtn.classList.toggle("on",h);vnBtn.textContent=h?"Hiện tiếng Việt":"Ẩn tiếng Việt";$$(".vn.peek").forEach(function(x){x.classList.remove("peek");});});
topbar.appendChild(vnBtn);document.body.appendChild(topbar);
document.addEventListener("click",function(e){if(!document.body.classList.contains("hide-vn"))return;var v=e.target.closest&&e.target.closest(".vn");if(v){v.classList.toggle("peek");e.stopPropagation();}},true);
/* ---------- generic MC ---------- */
function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
    b.addEventListener("click",function(){if(q.classList.contains("done"))return;q.classList.add("done");
      $$(".op",q).forEach(function(x,j){if(j===ans)x.classList.add("ok");else if(j===i)x.classList.add("no");});
      if(score)score.hit(i===ans);});ops.appendChild(b);});
  q.appendChild(ops);if(ex)q.appendChild(el("div",{class:"ex"},"💡 "+ex));if(score)score.add();return q;}
function scoreBar(parent,label,onReset,zh){var r=el("div",{class:"row",style:"margin:8px 0 14px"});var s=el("span",{class:"score"});r.appendChild(s);
  if(onReset){var b=el("button",{class:"btn sm",type:"button"},zh?"重做":"Làm lại");b.addEventListener("click",onReset);r.appendChild(b);}parent.appendChild(r);var S=new Score(s);S.zh=!!zh;return S;}
function reveal(label,answer,cls){var b=el("button",{class:"rv"+(cls?" "+cls:""),type:"button"},label);b.addEventListener("click",function(){if(b.classList.contains("shown")){b.innerHTML=label;b.classList.remove("shown");}else{b.innerHTML=answer;b.classList.add("shown");}});return b;}
/* ---------- modal framework ---------- */
var MODALS={};
function modal(key,no,title,tabs){
  var m=el("div",{class:"modal",id:"m-"+key,role:"dialog","aria-modal":"true"});
  var p=el("div",{class:"panel"});var hd=el("div",{class:"mhead"});
  hd.appendChild(el("div",{class:"eyebrow"},no+" · "+title));hd.appendChild(el("div",{class:"mtitle"},title));
  var x=el("button",{class:"close",type:"button","aria-label":"Đóng"},"×");x.addEventListener("click",function(){closeModal(m);});hd.appendChild(x);
  var tb=el("div",{class:"tabs"});hd.appendChild(tb);p.appendChild(hd);
  var body=el("div",{class:"mbody"});p.appendChild(body);m.appendChild(p);document.body.appendChild(m);
  m.addEventListener("click",function(e){if(e.target===m)closeModal(m);});
  var secs=[];
  tabs.forEach(function(t,i){var b=el("button",{class:"tab",type:"button"},t);b.addEventListener("click",function(){showTab(i);});tb.appendChild(b);var s=el("div",{class:"sec"});body.appendChild(s);secs.push(s);});
  function showTab(i){$$(".tab",tb).forEach(function(b,j){b.classList.toggle("on",i===j);});secs.forEach(function(s,j){s.classList.toggle("on",i===j);});body.scrollTop=0;}
  showTab(0);if(tabs.length<2)tb.style.display="none";
  MODALS[key]={m:m,secs:secs,show:showTab};return MODALS[key];}
function openModal(key){MODALS[key].m.classList.add("open");document.body.style.overflow="hidden";}
function closeModal(m){m.classList.remove("open");hidePop();if(!$$(".modal.open").length)document.body.style.overflow="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($(".pop.open")){hidePop();return;}var o=$$(".modal.open");if(o.length)closeModal(o[o.length-1]);}});

function linkVocab(text){var out="",i=0;while(i<text.length){var hit=null;for(var k=0;k<VORDER.length;k++){var w=VORDER[k].hz;if(text.substr(i,w.length)===w){hit=VORDER[k];break;}}
  if(hit){out+='<span class="vlink" data-v="'+hit.i+'">'+esc(hit.hz)+'</span>';i+=hit.hz.length;}else{out+=esc(text[i]);i++;}}return out;}
function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
  while(i<text.length){var g=null;for(var k=0;k<goods.length;k++){if(text.substr(i,goods[k].zh.length)===goods[k].zh){g=goods[k];break;}}
    if(g){out+='<span class="good" data-g="'+g.i+'">'+linkVocab(g.zh)+'</span>';i+=g.zh.length;continue;}
    var j=text.length;goods.forEach(function(gg){var p=text.indexOf(gg.zh,i);if(p>=0&&p<j)j=p;});
