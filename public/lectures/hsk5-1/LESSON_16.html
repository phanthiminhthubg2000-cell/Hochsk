<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 16 · 体重与节食 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

ưa lời khuyên: <b>不要再找……的借口，应及时采取措施……<\/b> — dùng ngay cho kết bài nghị luận.","frame":"不要再找……的借口，应及时采取措施 + ……","apply":"不要再找没时间运动的借口，应及时采取措施改变不健康的生活习惯。","apply_vn":"Đừng viện cớ không có thời gian tập thể dục nữa, hãy kịp thời thay đổi thói quen sống không lành mạnh."}],"GRAMMAR":[{"word":"即","py":"jí","pos":"动词／副词","forms":["动词：A，即 B（= 就是，书面语）","副词：即 + 动词（= 就、便）：一学即会、一拍即合"],"vn":"<b>即<\/b> ① động từ (văn viết): <b>tức là, chính là<\/b> — dùng để giải thích phần trước: 清晰的模式，即周末之后体重升高……. ② phó từ: <b>liền, ngay<\/b> (= 就、便): 一学即会 (học là biết ngay), 一拍即合 (vừa nói đã hợp).","text":"这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。","ex":[["“旦”是象形字，即太阳从地平线上升起。","“旦” là chữ tượng hình, tức là mặt trời mọc lên từ đường chân trời. (động từ)"],["不懂即问是他最大的优点，也是他成功的主要原因。","Không hiểu là hỏi ngay — đó là ưu điểm lớn nhất và cũng là nguyên nhân thành công chính của anh ấy. (phó từ)"],["在办公司这件事上，两人早都有打算，这次的机会让他俩一拍即合。","Chuyện mở công ty hai người đã có dự tính từ lâu, cơ hội lần này khiến họ vừa bàn đã hợp. (phó từ)"]],"err":[["❌ 即他是我的老师。","✅ 王先生，即我的老师，今天来了。","即 dùng để giải thích, đặt giữa hai thành phần đồng nghĩa."],["❌ 他一学就即会。","✅ 他一学即会。／他一学就会。","即 = 就, không dùng cả hai."]],"book":[["他可聪明了，什么东西一学就会。<br>→ 他可聪明了，____________。（即）","Gợi ý: 一学即会.","他可聪明了，什么东西一学即会"],["汉字“宇”代表上下四方，意思是所有的空间。<br>→ 汉字“宇”代表上下四方，____________。（即）","Gợi ý: 即所有的空间.","汉字“宇”代表上下四方，即所有的空间"],["在鸟爸爸、鸟妈妈的精心照顾下，小鸟30~35天便可独立生活。<br>→ 在鸟爸爸、鸟妈妈的精心照顾下，____________。（即）","Gợi ý: 便 → 即.","在鸟爸爸、鸟妈妈的精心照顾下，小鸟30~35天即可独立生活"]],"drill":[["“即”在这里是什么意思？ 体重变化表现出清晰的模式，即周末之后体重升高。",["就是","立刻"],0,"Giải thích → 就是."],["“即”在这里是什么意思？ 他一学即会。",["就是","就、便"],1,"Phó từ → 就."],["Câu nào đúng?",["鲁迅，即周树人，是中国著名的作家。","即鲁迅周树人是中国著名的作家。","鲁迅即是即周树人。"],0,"A，即 B."]]},{"word":"个别","py":"gèbié","pos":"形容词","forms":["个别 + 名词／动词（= 单个、各个）：个别谈话、个别训练","个别（的）+ 名词（= 极少数）：个别人、个别地区"],"vn":"<b>个别<\/b> là tính từ: ① <b>riêng từng cái, từng người<\/b> (单个、各个): 个别谈话 (nói chuyện riêng), 个别训练 (tập riêng). ② <b>cá biệt, rất ít<\/b> (极少数): 除了个别人以外 (trừ vài người), 个别地区 (một số ít khu vực).","text":"这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始……","ex":[["他经常采取个别谈话的方式了解情况和解决问题。","Anh ấy thường nói chuyện riêng với từng người để nắm tình hình và giải quyết vấn đề. (từng người)"],["教练针对他的技术特点进行了个别训练，达到了比较好的效果。","Huấn luyện viên tập riêng theo đặc điểm kỹ thuật của anh ấy, đạt hiệu quả khá tốt. (riêng)"],["天气预报说今晚有小到中雨，个别地区可能有大雨。","Dự báo nói tối nay mưa nhỏ đến vừa, một vài khu vực có thể mưa to. (số ít)"]],"err":[["❌ 很多个别人不同意。","✅ 个别人不同意。","个别 = rất ít, không đi với 很多."],["❌ 他很个别。","✅ 他的情况比较特别。","个别 là định ngữ/trạng ngữ, không làm vị ngữ chỉ tính cách."]],"book":[["旅行团里有几个小朋友，____________。（个别）","Gợi ý: vài em còn chưa đến năm tuổi.","旅行团里有几个小朋友，个别的还不到五岁"],["A：装修用的材料都准备好了吗？<br>B：____________。（个别）","Gợi ý: phần lớn xong, chỉ vài thứ chưa mua.","大部分都准备好了，只有个别材料还没买"],["A：看课文时你有没有遇到不懂的地方或不认识的汉字？<br>B：____________。（个别）","Gợi ý: có vài chữ không biết.","有个别汉字不认识，查了词典就明白了"]],"drill":[["“个别”在这里是什么意思？ 除了个别人以外，大家都来了。",["单个、各个","极少数"],1,"Rất ít người."],["“个别”在这里是什么意思？ 老师对他进行了个别辅导。",["单个、各个","极少数"],0,"Riêng một người."],["选择：这次考试大家都通过了，只有____同学没通过。",["个别","各个","每个"],0,"Số rất ít."]]},{"word":"非","py":"fēi","pos":"前缀／动词／副词","forms":["前缀：非 + 名词性成分（不属于这一范围）：非语言、非专业人员","动词：非（= 不是，书面语）：而非、并非","副词：非（要）……（不可）（偏要；必须）"],"vn":"<b>非<\/b> ① tiền tố <b>phi-, không phải<\/b>: 非语言 (phi ngôn ngữ), 非工作人员 (người không phải nhân viên). ② động từ <b>không phải<\/b> (= 不是): 而非、并非. ③ phó từ: <b>nhất định, cứ nhất quyết<\/b> — 他非要离婚; cấu trúc <b>非……不可<\/b> = bắt buộc phải.","text":"工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加……","ex":[["在非语言的交流中，眼睛起着重要的作用。","Trong giao tiếp phi ngôn ngữ, đôi mắt đóng vai trò quan trọng. (tiền tố)"],["成功有时候并非想象中那么难。","Thành công đôi khi không khó như tưởng tượng. (động từ)"],["补办学生证的事非你本人去不可。","Việc làm lại thẻ sinh viên bắt buộc phải đích thân bạn đi. (非……不可)"]],"err":[["❌ 他非要去。（意思是“他不去”）","✅ 他非要去。（意思是“他一定要去”）","非要 = nhất quyết phải, không phải phủ định."],["❌ 这件事非你不。","✅ 这件事非你不可。","Cấu trúc đầy đủ: 非……不可."]],"book":[["门口的牌子上写着：不是工作人员请勿入内。<br>→ 门口的牌子上写着：____________。（非）","Gợi ý: 非工作人员.","非工作人员请勿入内"],["世界上并不是只有人类才会骗人，动物也会。<br>→ ____________，动物也会。（非）","Gợi ý: 并非.","世界上并非只有人类才会骗人"],["听说你住院了，他一定要来看看你。<br>→ ____________。（非……不可）","Gợi ý: 非要……不可.","听说你住院了，他非要来看看你不可"]],"drill":[["“而非真正的体重增加”中“非”的意思是：",["不是","非常","一定"],0,"而非 = 而不是."],["“这件事非你去不可”的意思是：",["必须你去","你不能去","你可以不去"],0,"非……不可 = bắt buộc."],["Câu nào đúng?",["非专业人员不能进入实验室。","专业非人员不能进入实验室。","非人员专业不能进入实验室。"],0,"非 + danh từ."]]}],"HSK":{"r1":[{"text":["小丽决定减肥，她每天早上都称一下体重。星期一早上，她发现自己比上周五重了一公斤，{36}。她的室友笑着说：“别着急，研究表明，周末之后体重升高是正常现象。”小丽听了很高兴：“{37}，那我这个周末还可以去吃火锅！”室友说：“{38}，周末之后你可不能再找借口了。”"],"qs":[{"n":36,"o":["马上去吃饭","非常着急","特别高兴","觉得很正常"],"a":1,"why":"后文室友说“别着急”，说明小丽很着急。"},{"n":37,"o":["我不相信","我要放弃","太遗憾了","真的吗"],"a":3,"why":"小丽听了很高兴，用“真的吗”表示惊喜。"},{"n":38,"o":["我不知道","随便你","可以是可以","绝对不行"],"a":2,"why":"“可以是可以，……可不能……”表示同意但提出条件。"}]},{"text":["很多人认为，想减肥就要少吃饭。其实，{39}。如果每天摄入的营养太少，身体会觉得“饿”，{40}，反而更难减轻体重。专家建议，减肥最好的方法是控制饮食和坚持运动，{41}。另外，减肥是一个长期的过程，{42}，只有持之以恒，才能达到理想的效果。"],"qs":[{"n":39,"o":["运动没有用","不吃饭最有效","只要吃水果就行","节食并不是越少越好"],"a":3,"why":"“其实”后面是与一般看法相反的观点。"},{"n":40,"o":["就会长得更高","就会自动减少消耗","就会变得更聪明","就不用睡觉了"],"a":1,"why":"身体减少消耗，所以“反而更难减轻体重”。"},{"n":41,"o":["二者缺一不可","只要吃药就行","运动最好每天三小时","饮食一点儿也不重要"],"a":0,"why":"控制饮食和坚持运动，两个都需要。"},{"n":42,"o":["不可能一下子成功","不需要坚持","越快越好","一个星期就能完成"],"a":0,"why":"长期的过程，后文“持之以恒”，所以不可能一下子成功。"}]}],"r2":[{"start":46,"paras":["后来，他在医生的建议下改变了方法：少吃甜食，每天晚饭后散步一个小时。","去年夏天，小王发现自己胖了很多，就决定节食减肥。","半年以后，他的体重明显减轻了，而且再也没有反弹。","他每天只吃一顿饭，一个月瘦了五公斤，可是常常头晕，没有精神。","这件事让他明白，减肥不能只靠节食，健康才是最重要的。"],"ans":["B","D","A","C","E"],"why":"决定节食（B）→ 节食的结果（D）→ 改变方法（A）→ 新的结果（C）→ 道理（E）。"}],"r3":[{"text":["你有没有发现，每到周一早上称体重的时候，数字总是比周五高一些？很多人看到这个结果都会很着急，甚至决定这一周都不吃晚饭。","其实，这种情况非常普遍。周末的时候，人们常常和家人朋友外出就餐，吃的东西比平时多，而且运动比较少，所以体重会临时升高。这种变化并非真正的体重增加，而是身体里的水分和食物还没有消化完。","专家指出，<u><b>判断一个人是否变胖，不能只看某一天的体重<\/b><\/u>，而应该看一段时间内体重的变化趋势。比如，可以每天在同一时间称体重，然后算出一周的平均数。","当然，如果周末之后体重一直没有下降，就要注意了，应该及时调整饮食，增加运动。"],"qs":[{"n":56,"s":"很多人周一称体重时会发现：","o":["体重比周五高","体重比周五低","体重没有变化","秤坏了"],"a":0,"why":"第一段：数字总是比周五高一些。"},{"n":57,"s":"周末体重升高的原因不包括：","o":["外出就餐","吃得比平时多","运动比较少","睡觉太少"],"a":3,"why":"第二段提到前三个原因，没有提到睡觉。"},{"n":58,"s":"根据画线句子，判断是否变胖应该：","o":["只看周一的体重","看一段时间内体重的变化趋势","每天称三次体重","问医生"],"a":1,"why":"画线句后面：应该看一段时间内体重的变化趋势。"},{"n":59,"s":"作者认为什么时候要注意？","o":["周一体重比周五高的时候","周末之后体重一直没有下降的时候","周末外出就餐的时候","称体重的时候"],"a":1,"why":"最后一段：如果周末之后体重一直没有下降，就要注意了。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小美减肥的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện Tiểu Mỹ giảm cân.","panels":[["⚖️","小美称体重，发现自己胖了，决定节食。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><rect width=\"320\" height=\"240\" fill=\"#f3f6fa\"/><rect y=\"185\" width=\"320\" height=\"55\" fill=\"#d4dbe4\"/><path d=\"M0 185 H320\" stroke=\"#d2b48c\" stroke-width=\"2\"/><rect x=\"30\" y=\"26\" width=\"70\" height=\"56\" fill=\"#cfe8ff\" stroke=\"#a7825a\" stroke-width=\"5\"/><path d=\"M65.0 26 V82 M30 54.0 H100\" stroke=\"#a7825a\" stroke-width=\"3\"/><rect x=\"230\" y=\"40\" width=\"60\" height=\"120\" rx=\"6\" fill=\"#cfe2f0\" stroke=\"#a7b8c7\" stroke-width=\"4\"/><g transform=\"translate(160.0,214.0) scale(1.5,1.5)\"><rect x=\"-30\" y=\"-12\" width=\"60\" height=\"12\" rx=\"4\" fill=\"#ddd\" stroke=\"#bbb\"/><rect x=\"-12\" y=\"-11\" width=\"24\" height=\"9\" rx=\"2\" fill=\"#333\"/><text x=\"0\" y=\"-6.5\" font-size=\"8\" font-weight=\"600\" fill=\"#7fffa0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"'Noto Sans SC','PingFang SC',sans-serif\">60kg<\/text><\/g><g transform=\"translate(160.0,200.0) scale(1.05,1.05)\"><path d=\"M-7 -62 L-8 -4 M7 -62 L8 -4\" stroke=\"#5a4a6a\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M-14 -2 h10 M5 -2 h10\" stroke=\"#2d2626\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#e07a9a\"/><path d=\"M14 -106 L28 -88 L16 -78\" stroke=\"#e07a9a\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ci \"3\" fill=\"#e5534b\"/><\/g><\/g><g transform=\"translate(200.0,70.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><g transform=\"translate(110.0,70.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><polygon points=\"0.0,-10.0 2.5,-3.4 9.5,-3.1 4.0,1.3 5.9,8.1 0.0,4.2 -5.9,8.1 -4.0,1.3 -9.5,-3.1 -2.5,-3.4\" fill=\"#f5b82e\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: quyết định ăn kiêng → hậu quả → 反弹 → đổi cách, thành công.","Có thể dùng: 节食、营养、反弹、采取措施、明显、苗条."],"sample":"小美一直想变苗条。有一天早上，她称了一下体重，发现自己比上个月重了三公斤，于是决定节食减肥。从那天起，她每天只吃一个苹果，可是没过几天，她上课的时候就常常头晕，一点儿精神也没有。一个月以后，她实在受不了了，一下子吃了很多东西，结果体重马上反弹了。后来，她在医生的建议下采取了新的措施：少吃甜食，保证营养，每天跑步半小时。三个月以后，她的体重明显减轻了，身体也更健康了。","svn":"Tiểu Mỹ muốn thon thả, thấy tăng 3 cân liền ăn kiêng, mỗi ngày chỉ ăn một quả táo, lên lớp chóng mặt; một tháng sau không chịu nổi, ăn nhiều, cân tăng lại; sau đó nghe bác sĩ: ăn ít ngọt, đủ dinh dưỡng, chạy bộ mỗi ngày; ba tháng sau giảm rõ rệt, khỏe hơn."},"w72":{"prompt":"现在很多年轻人以瘦为美，有的人为了变苗条，长期节食甚至不吃饭。你怎么看待“以瘦为美”的现象？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Nhiều người trẻ coi gầy là đẹp, có người ăn kiêng lâu dài thậm chí nhịn ăn để thon thả. Bạn nghĩ sao về hiện tượng “lấy gầy làm đẹp”? Viết bài không ít hơn 200 chữ.","min":200,"title":"健康才是最美的","tips":["Mô tả hiện tượng → quan điểm (không đồng ý cực đoan) → lý do 1 (sức khỏe) → lý do 2 (cái đẹp đa dạng) → cách làm đúng → kết luận.","Dùng khung 好句: 由于……，因此…… · 应该被视为……，而非……"],"sample":"现在很多年轻人以瘦为美，有的人为了变苗条，长期节食，甚至一天只吃一顿饭。对于这种现象，我并不赞成。\n首先，过度节食会严重危害健康。由于身体长期缺乏营养，因此很多人常常头晕、没有精神，有的人甚至生了病。而且停止节食以后，体重很容易反弹。\n其次，美的标准并不只有一种。一个人健康、自信、有活力，同样是一种美。如果为了瘦而失去健康，就得不偿失了。\n当然，肥胖确实对健康不好，适当地控制体重是必要的。但减肥应该被视为一种健康的生活方式，而非一场痛苦的比赛。我们应该控制饮食、坚持运动。\n总之，健康才是最美的。","svn":"Bài nghị luận: hiện tượng → không tán thành → 首先 hại sức khỏe, dễ 反弹 → 其次 cái đẹp đa dạng → 当然 kiểm soát cân nặng là cần → 总之 khỏe mạnh là đẹp nhất."}},"PRACTICE":{"ex1":{"bank":["总共","借口","达到","采取","可靠","参与"],"items":[["教师要让学生主动{}班集体管理，锻炼他们的能力。",["参与"]],["许多人喜爱喝茶，几乎{}不可一日无茶的程度。",["达到"]],["听声音判断水瓶是否保温的方法并不{}。",["可靠"]],["您好，您{}消费了747元。您刷卡还是付现金？",["总共"]],["他{}家里有事，提前离开了会场。",["借口"]],["我们虽然还不能准确预报地震，但可以{}有效措施，最大限度地保护我们的财产。",["采取"]]]},"ex2":[["研究发现，父亲对教育子女的____程度越高，孩子就越聪明。",["参与","参加"],0],["调查结果显示，市民对电子阅读的兴趣____提高了。",["明显","清楚"],0],["我本来想完成这个计划以后再去美国，____现在那边有更重要的事，不得不提前去。",["成果","结果"],1],["关于空气质量问题，现在报纸、网络上相关的____特别多，大家讨论得也很热闹。",["报道","报名"],0]],"ex3match":{"title":"三、画线连接可以搭配的词语","groups":[[["达到","目的"],["报道","新闻"],["采取","措施"],["分析","原因"]],[["下降的","趋势"],["可靠的","报道"],["重大的","成果"],["表面的","现象"]]]},"ex3":[],"ex4":[["医学专家的新发现","营养、饮食、体重、波动","医学专家研究发现，人们一周内的营养摄入和饮食模式会影响体重，所以节食者的体重会在一周内上下波动。"],["体重减轻者的波动情况","周末、工作日、立即、下降、临时、非、趋势","体重减轻者在周末之后体重立即下降，这一下降趋势一直到周五。周末体重的临时变化是正常现象，而非真正的体重增加。"],["体重保持者的波动情况","周末、工作日、临时、非、规律、变化","体重保持者周末之后体重升高，工作日慢慢减轻，周五最低。这种临时变化有一定的规律，并非真正的体重增加。"],["体重增加者的波动情况","周末、工作日、上升、趋势、采取、措施","体重增加者周末之后体重上升，工作日的体重也没有明显减轻。所以节食者应注意这种趋势，及时采取措施。"]],"ext":{"title":"扩展 · 话题：医务 1","words":[["挂号","guà hào","lấy số khám bệnh"],["急诊","jízhěn","cấp cứu"],["救护车","jiùhùchē","xe cứu thương"],["内科","nèikē","khoa nội"],["过敏","guòmǐn","dị ứng"],["打喷嚏","dǎ pēntì","hắt hơi"],["着凉","zháo liáng","bị cảm lạnh"],["吐","tù","nôn"],["痒","yǎng","ngứa"],["消化","xiāohuà","tiêu hóa"]],"items":[["你是不是着凉了？怎么一直在{}？","打喷嚏"],["一到春天开花的时候，我的鼻子就{}。","过敏"],["我身上也不知道被什么咬了，特别{}。","痒"],["当初人们发明乒乓球是为了饭后做些运动帮助{}食物的。","消化"]]}},"TEXT":[{"title":"一项新研究","sub":"体重会上下波动","paras":["据报道，医学专家进行了一项新研究，研究发现：由于人们在一周内的营养摄入和饮食模式会影响到他们的体重变化，因此节食者的体重会在一周内上下波动。","总共有80名年龄在25－62岁之间的成年人参与了这项研究。研究人员根据他们的相对体重变化将其分为三种类型：体重减轻者、体重增加者和体重保持者。这些成年人在每天起床之后、早餐之前称一下自己的体重，为了保证可靠性，只有那些至少连续7天以上称过体重的人才会被纳入分析。对这些志愿者的跟踪调查时间最短为15天，最长为330天。"],"idea":"Một nghiên cứu y học mới: vì <b>dinh dưỡng và kiểu ăn uống<\/b> trong tuần thay đổi nên cân nặng người ăn kiêng <b>dao động<\/b> trong tuần. 80 người lớn tham gia, chia làm <b>ba loại<\/b>: giảm cân, tăng cân, giữ cân. Họ cân mỗi sáng sau khi dậy, trước bữa sáng; chỉ ai cân liên tục ≥ 7 ngày mới được đưa vào phân tích.","qs":[["节食者的体重为什么会在一周内上下波动？",["营养摄入和饮食模式会影响体重","他们每天都运动","秤不准"],0],["研究人员把参与者分为几种类型？",["两种","三种","四种"],1],["什么样的人才会被纳入分析？",["年龄最小的人","至少连续7天以上称过体重的人","体重最重的人"],1]]},{"title":"研究成果","sub":"清晰的模式","paras":["研究成果显示：这些人的体重变化表现出清晰的模式，即周末之后体重升高，在工作日体重减轻（周五达到最低点）。研究人员还意外地发现，体重减轻者和体重增加者在体重波动模式上存在着明显不同。体重减轻者会表现出较强的补偿模式，即在周末之后体重立即下降，这一下降趋势直至周五结束；而体重增加者每天的体重都会存在差异，他们在工作日的体重并无明显减轻。"],"idea":"Kết quả: cân nặng có <b>quy luật rõ ràng<\/b> — <b>tăng sau cuối tuần<\/b>, giảm trong ngày làm việc, <b>thứ Sáu thấp nhất<\/b>. Bất ngờ là người giảm cân và người tăng cân khác nhau rõ: người giảm cân có “<b>kiểu bù trừ<\/b>” — sau cuối tuần cân giảm ngay đến hết thứ Sáu; người tăng cân thì ngày thường cũng không giảm rõ.","qs":[["一周中哪一天体重最轻？",["周一","周三","周五"],2],["体重减轻者有什么特点？",["周末之后体重立即下降","每天体重都一样","工作日体重增加"],0],["体重增加者在工作日的体重怎么样？",["明显减轻","并无明显减轻","达到最低点"],1]]},{"title":"周末与节食","sub":"不要再找借口","paras":["这项联合多所医学院校所做的研究发现，除了个别人以外，多数人体重的增加会从周六开始，而体重减轻则会从周二开始，特别是对于那些体重减轻者和体重保持者来说更是如此。它表明人们的体重变化在一周内会显示出一种明显的规律，工作日和周末体重的临时变化应该被视为正常现象，而非真正的体重增加，这是由于人们在周末会有更多的时间外出就餐。周末对饮食稍微有些放纵影响不大，但为了能成功减轻体重，想要变苗条的节食者应注意到这种变化规律，周末之后不要再找任何吃美食的借口，应及时采取措施阻止这一上升趋势。"],"idea":"Trừ vài cá nhân, đa số người <b>tăng cân từ thứ Bảy<\/b>, <b>giảm từ thứ Ba<\/b>. Thay đổi tạm thời giữa ngày thường và cuối tuần là <b>hiện tượng bình thường<\/b>, không phải tăng cân thật — do cuối tuần hay <b>đi ăn ngoài<\/b>. Cuối tuần buông thả chút không sao, nhưng muốn thon thả thì <b>sau cuối tuần đừng tìm cớ<\/b>, phải kịp thời có <b>biện pháp<\/b> ngăn đà tăng.","qs":[["多数人体重的增加从哪天开始？",["周六","周二","周五"],0],["为什么周末体重会升高？",["周末睡得太多","周末有更多时间外出就餐","周末不称体重"],1],["作者给节食者什么建议？",["周末一点儿也不能吃","周末之后及时采取措施","每天只称一次体重"],1]]}],"TEXT_EXTRA":{"compare_title":"三种类型的体重变化","compare_head":["类型","周末之后","工作日"],"compare":[["体重减轻者","体重立即下降（补偿模式）","一直下降到周五"],["体重保持者","体重升高","慢慢下降，周五最低"],["体重增加者","体重升高","每天都有差异，并无明显减轻"]],"bg":"爱美之心，人人有之，年轻的女性朋友就更不必说了。在她们看来，苗条的身材（shēncái）是青春（qīngchūn）活力的象征（xiàngzhēng），可以使她们对生活充满自信。现代医学研究也证明，肥胖确实是健康的杀手。这似乎又给出了更好的理由让人们积极地投入到减肥这一行动中。无论是出于爱美还是健康，减肥的目的就是将体重减轻到你认为的理想状态。不过，有些人不支持甚至反对节食的做法。在他们看来，节食会危害健康，同时还会在停止节食后带来体重反弹等更多的烦恼。","bg_vn":"Ai cũng thích đẹp, nhất là các bạn nữ trẻ: dáng thon là biểu tượng của tuổi trẻ, giúp tự tin. Y học cũng chứng minh béo phì là “sát thủ” của sức khỏe. Nhưng có người phản đối ăn kiêng: ăn kiêng hại sức khỏe, ngừng ăn kiêng thì cân nặng lại tăng trở lại (反弹).","discuss_title":"话题讨论：你认为节食是减肥的好方法吗？为什么？","discuss":["你有过节食减肥的经历吗？结果满意吗？","对于节食减肥失败的原因，你有什么分析或经验？","如果要节食，你建议应该怎么做？"],"write":"请以“我支持（或反对）节食减肥的做法”为题写一段话。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我支持（或反对）节食减肥的做法”为题写一段话","topic_vn":"Viết đoạn văn với đầu đề “Tôi ủng hộ (hoặc phản đối) cách giảm cân bằng ăn kiêng”","intro":"Dạng đề chọn phe (立场型) · Nêu rõ ủng hộ hay phản đối → lý do 1 → lý do 2 + ví dụ → lời khuyên · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我支持（或反对）节食减肥的做法”：先表态，再说理","lead":"Đề cho bạn <b>chọn một phe<\/b>. Giám khảo không chấm phe nào đúng mà chấm <b>lập luận có rõ ràng, có căn cứ không<\/b>. Câu đầu tiên phải <b>表明立场<\/b>: 我支持…… hoặc 我反对……. Không nên viết nửa nọ nửa kia mà không kết luận.","parts":[["我支持／反对","Chọn một — câu đầu phải nói rõ. Có thể “ủng hộ ăn kiêng khoa học, phản đối nhịn ăn”."],["节食","Ăn kiêng = có kiểm soát lượng ăn, khác với 不吃饭 (nhịn ăn)."],["减肥的做法","Có thể so sánh với cách khác: vận động, ngủ đủ, sinh hoạt điều độ."],["（课本）尽量用上本课所学的生词，不少于100字","Dùng: 营养、摄入、趋势、采取措施、借口、明显、可靠、即、非……不可… và khung 好句 của bài khóa."]],"traps":[["Không nêu lập trường","Viết “节食有好处也有坏处” rồi dừng → không trả lời đề."],["Lý do không có căn cứ","“我觉得节食不好” — cần lý do: thiếu dinh dưỡng, 反弹, ảnh hưởng tinh thần…"],["Bỏ qua bài khóa","Bài khóa có kết quả nghiên cứu (cân nặng dao động theo tuần) — trích làm căn cứ rất thuyết phục."],["Nhầm 节食 với 绝食","绝食 = tuyệt thực, hoàn toàn khác."]],"link":"<b>Liên hệ bài 16:<\/b> bài khóa cho căn cứ khoa học: cân nặng <b>tăng sau cuối tuần, giảm trong tuần<\/b>; muốn giảm cân phải <b>chú ý quy luật<\/b>, sau cuối tuần đừng tìm cớ, <b>kịp thời có biện pháp<\/b>. Phần 背景分析 nêu ý phản đối: <b>节食会危害健康，停止节食后体重反弹<\/b>."},"steps":[["①","表明立场","Mở bài: tôi ủng hộ / phản đối ăn kiêng giảm cân.","我反对节食减肥的做法。"],["②","理由一","Lý do chính (sức khỏe, dinh dưỡng, hiệu quả).","首先，……"],["③","理由二 + 例子","<b>Trọng tâm.<\/b> Lý do thứ hai kèm ví dụ (của mình, bạn bè, bài khóa).","其次，……比如……"],["④","建议","Kết: lời khuyên giảm cân đúng cách.","所以，我建议……"]],"formula":["我支持／反对……","首先……","其次……比如……","所以，我建议……"],"choices_title":"Chọn lập trường","choices_key":"Ví dụ: ","choices":[["A · 反对节食","phản đối","Nhịn ăn hại sức khỏe, dễ 反弹, mất tinh thần học tập.","停止节食后体重反弹"],["B · 支持科学地节食","ủng hộ ăn kiêng khoa học","Kiểm soát lượng ăn, giảm đồ ngọt, vẫn đủ dinh dưỡng.","少吃甜食，七分饱"],["C · 我的经历","trải nghiệm của tôi","Kể lần nhịn ăn thất bại rồi chuyển sang vận động.","一个月瘦了五公斤，又胖了回来"],["D · 节食 + 运动","kết hợp","Ăn kiêng phải kèm vận động mới bền.","每天跑步半小时"]],"notes":[["Câu đầu phải表态","我支持……／我反对……／我支持科学地节食，但反对不吃饭。"],["Mỗi lý do một câu chủ đề","首先……其次……; mỗi ý có giải thích hoặc ví dụ."],["Kết bằng lời khuyên","Dùng khung 好句 ⑤: 不要再找……的借口，应及时采取措施……"]],"rule":"<b>Nguyên tắc HSK5:<\/b> đề lập trường cần <b>một quan điểm xuyên suốt<\/b>; có thể thừa nhận ý ngược lại bằng 当然…… nhưng cuối cùng phải quay về lập trường của mình.","patterns":[["① 立场","我反对节食减肥的做法，因为它对健康的危害很大。","Tôi phản đối giảm cân bằng ăn kiêng vì nó rất hại sức khỏe."],["① 立场","我支持节食减肥，但一定要科学地节食。","Tôi ủng hộ ăn kiêng giảm cân, nhưng nhất định phải ăn kiêng khoa học."],["② 理由","首先，节食会让身体缺乏营养，人常常没有精神。","Trước hết, ăn kiêng làm cơ thể thiếu dinh dưỡng, người thường uể oải."],["② 理由","由于摄入的热量减少了，因此体重会明显下降。","Do lượng calo nạp vào giảm nên cân nặng giảm rõ rệt."],["③ 例子","我有一个朋友一个月瘦了五公斤，可是停止节食后，体重马上就反弹了。","Bạn tôi một tháng giảm 5 cân, nhưng ngừng ăn kiêng thì cân lập tức tăng lại."],["③ 课文","研究表明，人们的体重在一周内会上下波动，周末之后体重会升高。","Nghiên cứu cho thấy cân nặng dao động trong tuần, tăng sau cuối tuần."],["④ 建议","想要变苗条，非得坚持运动、控制饮食不可。","Muốn thon thả thì nhất định phải kiên trì vận động, kiểm soát ăn uống."]],"links":[["Nêu lập trường",["我支持／反对……","在我看来，……","我认为……"]],["Lý do",["首先，……其次，……","由于……，因此……","研究表明，……"]],["Ví dụ",["比如……","我有一个朋友……","以我自己为例，……"]],["Lời khuyên",["所以，我建议……","非……不可","应及时采取措施……"]]],"open":[["立场式","我反对节食减肥的做法，因为它对健康的危害很大。"],["提问式","节食真的是减肥的好方法吗？我不这么认为。"],["背景式","爱美之心，人人有之。很多年轻人为了变苗条，选择了节食。"]],"close":[["建议式","所以，我建议大家科学地减肥，不要只靠节食。"],["呼应式","不要再找没时间运动的借口，应及时采取措施改变生活习惯。"],["总结式","健康比苗条更重要。"]],"from_text":[["由于……，因此……","由于节食会让人缺乏营养，因此很多人节食以后常常没有精神。","Lấy từ 好句 ①: lập luận nhân quả."],["为了……，只有……才……","为了减肥成功，只有坚持运动、控制饮食才会有效果。","Lấy từ 好句 ②: điều kiện."],["A 表现出……，即……","节食的危害表现在很多方面，即缺乏营养、没有精神、容易反弹。","Lấy từ 好句 ③: giải thích."],["应该被视为……，而非……","节食应该被视为减肥的一种辅助方法，而非唯一的方法。","Lấy từ 好句 ④: khẳng định — phủ định."],["不要再找……的借口，应及时采取措施……","不要再找没时间运动的借口，应及时采取措施改变不健康的生活习惯。","Lấy từ 好句 ⑤: lời khuyên."]],"vocab":[["减肥","jiǎn féi","giảm cân","节食减肥","idea"],["健康","jiànkāng","sức khỏe","危害健康","idea"],["反弹","fǎntán","tăng trở lại","体重反弹","idea"],["身材","shēncái","vóc dáng","苗条的身材","idea"],["热量","rèliàng","calo, nhiệt lượng","摄入热量","idea"],["肥胖","féipàng","béo phì","肥胖是健康的杀手","idea"],["控制","kòngzhì","kiểm soát","控制饮食","act"],["坚持","jiānchí","kiên trì","坚持运动","act"],["支持","zhīchí","ủng hộ","我支持","act"],["反对","fǎnduì","phản đối","我反对","act"],["危害","wēihài","gây hại","危害健康","act"],["锻炼","duànliàn","rèn luyện","锻炼身体","act"],["节食","jiéshí","ăn kiêng","节食减肥","lesson"],["营养","yíngyǎng","dinh dưỡng","缺乏营养","lesson"],["摄入","shèrù","nạp vào","减少摄入","lesson"],["趋势","qūshì","xu hướng","上升趋势","lesson"],["采取","cǎiqǔ","áp dụng","采取措施","lesson"],["措施","cuòshī","biện pháp","有效的措施","lesson"],["借口","jièkǒu","cớ","找借口","lesson"],["苗条","miáotiao","thon thả","变苗条","lesson"],["适得其反","shì dé qí fǎn","phản tác dụng","节食过度会适得其反","bonus"],["持之以恒","chí zhī yǐ héng","kiên trì bền bỉ","减肥要持之以恒","bonus"],["身心健康","shēnxīn jiànkāng","khỏe cả thân lẫn tâm","保持身心健康","bonus"],["管住嘴，迈开腿","guǎnzhù zuǐ, màikāi tuǐ","giữ miệng, chịu khó vận động","减肥就要管住嘴，迈开腿","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 16"],["bonus","加分 · thành ngữ"]],"legend":["① Lập trường","② Lý do một","③ Lý do hai + ví dụ","④ Lời khuyên"],"samples":{"speak":[{"who":"反对节食","meta":"Hướng A · bài nói ~1 phút 30","p":["我反对节食减肥的做法，因为它对健康的危害很大。","首先，节食会让身体缺乏营养。很多人为了变苗条，每天只吃一点儿水果，结果上课的时候常常没有精神，学习也受到了影响。","其次，节食的效果并不可靠。我有一个朋友一个月瘦了五公斤，可是停止节食以后，体重马上就反弹了，甚至比以前更胖。研究也表明，人的体重在一周内本来就会上下波动。","所以，我建议大家科学地减肥：管住嘴，迈开腿，不要再找没时间运动的借口。"],"vi":"Tôi phản đối ăn kiêng giảm cân vì rất hại sức khỏe. Thứ nhất, ăn kiêng làm cơ thể thiếu dinh dưỡng — nhiều người chỉ ăn chút hoa quả, lên lớp uể oải, ảnh hưởng học tập. Thứ hai, hiệu quả không chắc chắn: bạn tôi một tháng giảm 5 cân, ngừng ăn kiêng thì tăng lại, thậm chí béo hơn. Nghiên cứu cũng cho thấy cân nặng vốn dao động trong tuần. Vì vậy hãy giảm cân khoa học: giữ miệng, chịu khó vận động, đừng viện cớ không có thời gian."},{"who":"支持科学地节食","meta":"Hướng B · bài nói ~1 phút 30","p":["我支持节食减肥，但一定要科学地节食。","首先，肥胖确实是健康的杀手。由于摄入的热量减少了，因此体重会明显下降，身体也会更健康。","其次，科学的节食并不是不吃饭，而是少吃甜食和油炸食品，每顿饭只吃七分饱，同时保证营养。课文告诉我们，周末之后体重会升高，所以周末之后更要注意饮食，及时采取措施。","总之，节食应该被视为一种健康的生活方式，而非一种痛苦的任务。"],"vi":"Tôi ủng hộ ăn kiêng nhưng phải khoa học. Thứ nhất, béo phì là sát thủ của sức khỏe; giảm lượng calo thì cân giảm rõ, cơ thể khỏe hơn. Thứ hai, ăn kiêng khoa học không phải nhịn ăn mà là ăn ít đồ ngọt, đồ chiên, mỗi bữa no bảy phần, vẫn đủ dinh dưỡng. Bài khóa cho biết cân tăng sau cuối tuần nên sau cuối tuần càng phải chú ý. Tóm lại, ăn kiêng nên được coi là lối sống lành mạnh, không phải nhiệm vụ khổ sở."}],"write":[{"who":"范文 1 · 反对","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我反对节食减肥的做法","p":["我反对节食减肥的做法。","节食会让身体缺乏营养，人常常没有精神。","而且停止节食以后，体重很容易反弹。","所以，减肥最好的办法是控制饮食、坚持运动。"],"vi":"Bố cục 4 câu: lập trường → lý do 1 → lý do 2 → lời khuyên."},{"who":"范文 2 · 支持","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我支持节食减肥的做法","p":["我支持科学地节食。","由于摄入的热量减少了，因此体重会明显下降。","不过，节食不是不吃饭，而是少吃甜食，保证营养。","只有这样，减肥才会成功。"],"vi":"Lập trường ủng hộ có điều kiện; dùng 由于……因此…… và 只有……才……."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我反对节食减肥的做法","p":["爱美之心，人人有之。很多年轻人为了变苗条，选择了节食，可是我反对这种做法。","首先，由于节食会让人缺乏营养，因此很多人节食以后常常没有精神，学习和工作都受到了影响。","其次，节食的效果并不可靠。我有一个朋友一个月瘦了五公斤，可是停止节食后，体重马上就反弹了。","所以，节食应该被视为减肥的一种辅助方法，而非唯一的方法。不要再找没时间运动的借口，应及时采取措施改变不健康的生活习惯。"],"good":["由于节食会让人缺乏营养，因此","应该被视为减肥的一种辅助方法，而非唯一的方法","不要再找没时间运动的借口，应及时采取措施改变不健康的生活习惯"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 由于……，因此…… · 应该被视为……，而非…… · 不要再找……的借口，应及时采取措施……."}]},"w5":["减肥","健康","反弹","身材","热量","肥胖","控制","坚持","支持","反对","危害","节食","营养","摄入","趋势","采取","措施","借口","苗条","明显","可靠","表明","现象"],"step_names":["① 表明立场","② 理由一","③ 理由二 + 例子","④ 建议"],"timer":[["① 10s",10],["② 25s",25],["③ 40s",40],["④ 15s",15]],"build_title":"选一个立场，拼出你的观点","build_lead":"Chọn lập trường, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 反对节食":[["我反对节食减肥的做法，因为它对健康的危害很大。","节食真的是减肥的好方法吗？我不这么认为。"],["首先，节食会让身体缺乏营养，很多人上课的时候常常没有精神，学习也受到了影响。","由于节食会让人缺乏营养，因此很多人节食以后常常头晕、没有力气。"],["其次，节食的效果并不可靠，我有一个朋友一个月瘦了五公斤，可是停止节食以后，体重马上就反弹了。","研究也表明，人的体重在一周内本来就会上下波动，没必要为了一点儿变化就不吃饭。"],["所以，我建议大家科学地减肥，不要再找没时间运动的借口。","总之，健康比苗条更重要。"]],"B · 支持科学地节食":[["我支持节食减肥，但一定要科学地节食。","肥胖确实是健康的杀手，所以我支持节食减肥。"],["首先，由于摄入的热量减少了，因此体重会明显下降，身体也会更健康。","节食可以帮助我们养成好的饮食习惯，比如少吃甜食和油炸食品。"],["其次，科学的节食并不是不吃饭，而是每顿饭只吃七分饱，同时保证营养。","课文告诉我们，周末之后体重会升高，所以周末之后更要注意饮食，及时采取措施。"],["总之，节食应该被视为一种健康的生活方式，而非一种痛苦的任务。","只有这样，减肥才会成功。"]],"C · 我的经历":[["去年我也试过节食减肥，结果并不满意。","以我自己为例，节食减肥让我吃了不少苦头。"],["那时候我每天只吃一顿饭，一个月就瘦了五公斤，可是我每天都没有精神。","节食的时候，我常常觉得饿，晚上也睡不好，学习成绩也下降了。"],["后来我停止了节食，体重很快就反弹了，甚至比以前更胖。","后来我改变了方法，每天跑步半小时，少吃甜食，三个月以后体重明显减轻了。"],["这次经历让我明白了，想要变苗条，非得坚持运动、控制饮食不可。","所以我建议大家：管住嘴，迈开腿，减肥要持之以恒。"]]},"quiz":[["Câu nào hợp làm câu mở bài?",["节食有好处，也有坏处，每个人的看法不一样。","我反对节食减肥的做法，因为它对健康的危害很大。"],1,"Đề lập trường: câu đầu phải表态."],["Câu nào là lý do có căn cứ?",["我就是不喜欢节食。","节食会让身体缺乏营养，人常常没有精神。"],1,"Lý do phải giải thích được."],["Câu nào dùng 由于……因此…… đúng?",["由于摄入的热量减少了，因此体重会下降。","由于摄入的热量减少了，所以因此体重会下降。"],0,"Không dùng 所以 cùng 因此."],["Câu nào dùng 非……不可 đúng?",["想要变苗条，非坚持运动不可。","想要变苗条，非坚持运动不。"],0,"Cấu trúc đầy đủ: 非……不可."],["“反弹”trong bài nghĩa là gì?",["cân nặng tăng trở lại","nhảy cao"],0,"体重反弹 = tăng cân trở lại."],["Câu kết nào tốt hơn?",["我的作文写完了。","所以，我建议大家科学地减肥，不要只靠节食。"],1,"Câu kết là lời khuyên."]],"fix":[["我反对节食减肥的做法的。","我反对节食减肥的做法。","Bỏ 的 thừa."],["由于节食，所以因此身体不好。","由于节食，因此身体不好。","Chỉ dùng một liên từ kết quả."],["节食会让身体缺乏了营养。","节食会让身体缺乏营养。","Tình trạng chung không thêm 了."],["她为了苗条，每天只吃水果一点儿。","她为了变苗条，每天只吃一点儿水果。","一点儿 đứng trước danh từ."],["只要坚持运动，才能减肥成功。","只要坚持运动，就能减肥成功。","只要……就……"],["我建议大家采取措施减肥科学地。","我建议大家采取科学的措施减肥。","Định ngữ 科学的 đặt trước 措施."]],"tpl":"我支持（或反对）节食减肥的做法\n我【支持／反对】节食减肥的做法。首先，【理由一】。其次，【理由二】，比如【例子】。所以，我建议【……】。","chk":[["topic","Bám đề: có nói 节食 / 减肥","节食|减肥"],["stand","Có lập trường (支持 · 反对)","支持|反对"],["reason","Có lý do (首先 · 营养 · 健康 · 由于)","首先|营养|健康|由于|危害"],["example","Có ví dụ / căn cứ (比如 · 朋友 · 研究 · 我)","比如|朋友|研究|表明|我自己"],["end","Có lời khuyên / kết (所以 · 建议 · 总之)","所以|建议|总之"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> một câu nêu lập trường, hai lý do (ít nhất một có ví dụ) và một câu lời khuyên. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“我支持（或反对）……”的题目都可以这样写","var_lead":"Mọi đề chọn phe đều dùng khung: <b>lập trường → lý do 1 → lý do 2 + ví dụ → lời khuyên / kết luận<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）我支持（或反对）节食减肥的做法","我反对节食减肥的做法，因为……"],["你支持大学生打工吗？","我支持大学生打工，因为……"],["你赞成孩子上很多补习班吗？","我反对让孩子上太多补习班……"],["你认为减肥最好的方法是什么？","在我看来，减肥最好的方法是……"],["你支持在公共场所禁止吸烟吗？","我非常支持……，因为吸烟不仅……"],["谈谈你对“以瘦为美”的看法。","现在很多人以瘦为美，可是我认为……"]],"homework":"<b>Bài về nhà:<\/b> chọn một lập trường (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “我支持（或反对）节食减肥的做法” · bắt buộc có lập trường, hai lý do, một ví dụ và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();
/* ---------- TTS ---------- */
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.getAttribute("data-say"),b);}},true);

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}

Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
