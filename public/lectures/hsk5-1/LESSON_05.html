<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 05 · 济南的泉水 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

",["由分散到集中","由显露到隐蔽"],0,"Nước tụ lại → tập trung."],["选择：你把这些书都收____吧，桌子上太乱了。",["起来","下去","出来"],0,"收起来 = cất gọn lại."]]},{"word":"于","py":"yú","pos":"介词","forms":["动词 + 于 + 时间／处所／对象（书面语）","形容词 + 于 + 比较对象：高于、低于"],"vn":"<b>于<\/b> là giới từ văn viết, tương đương <b>在、从、对、向、比<\/b>. Thường đứng sau động từ/tính từ: 成立于 (thời gian), 用于 (phạm vi), 来自于 (nơi chốn), 有助于 (đối tượng), 高于 (so sánh).","text":"济南的泉水，来自于济南市以南的广大山区……","ex":[["这家公司成立于1997年。","Công ty này thành lập năm 1997. (thời gian = 在)"],["运动有助于健康。","Vận động có ích cho sức khỏe. (đối tượng = 对)"],["队员们都认为对方的水平远远高于自己。","Các cầu thủ đều cho rằng trình độ đối phương cao hơn mình nhiều. (so sánh = 比)"]],"err":[["❌ 我于昨天去超市买菜了。","✅ 我昨天去超市买菜了。","于 là văn viết, câu khẩu ngữ hằng ngày không dùng."],["❌ 他毕业北京大学。","✅ 他毕业于北京大学。","毕业 cần 于 để dẫn nơi chốn."]],"book":[["乒乓球运动是在19世纪末产生的，说起来还有一段有趣的故事呢。<br>→ 乒乓球运动____________。（于）","Gợi ý: ra đời vào…","乒乓球运动产生于19世纪末，说起来还有一段有趣的故事呢"],["工作上，对已取得的成功，他从不满足，而是给自己提出更高的要求。<br>→ ____________，而是给自己提出更高的要求。（于）","Gợi ý: không thỏa mãn với…","工作上，他从不满足于已取得的成功"]],"drill":[["“于”在这里相当于什么？ 这种药主要用于感冒的治疗。",["在","比","从"],0,"用于 = dùng vào (phạm vi)."],["选择：刘经理毕业____北京大学经济学院。",["于","从","在"],0,"毕业于 + nơi (课本练习1)."],["Câu nào đúng?",["今年的气温高于去年。","今年的气温于高去年。","于今年的气温高去年。"],0,"Tính từ + 于 + đối tượng so sánh."]]},{"word":"从而","py":"cóng'ér","pos":"连词","forms":["（原因／方法），从而 + 结果／目的"],"vn":"<b>从而<\/b> = nhờ đó, do đó. Đứng ở <b>đầu phân câu sau<\/b>; phân câu trước nêu nguyên nhân/phương pháp, phân câu sau nêu kết quả/mục đích. Văn viết, chủ ngữ hai vế thường giống nhau.","text":"自然对它充满感激之情，从而也产生了许多关于泉水的美丽传说。","ex":[["比赛前做好思想准备可以减少运动员的压力，从而取得比赛的成功。","Chuẩn bị tâm lý tốt trước trận đấu giúp giảm áp lực cho vận động viên, nhờ đó giành chiến thắng."],["在学习过程中及时复习，可以尽早发现和解决问题，从而取得更好的成绩。","Ôn tập kịp thời giúp sớm phát hiện và giải quyết vấn đề, nhờ đó đạt thành tích tốt hơn."],["他每天坚持跑步，从而让身体越来越好。","Anh ấy kiên trì chạy bộ mỗi ngày, nhờ đó sức khỏe ngày càng tốt."]],"err":[["❌ 从而他每天练习，提高了口语。","✅ 他每天练习，从而提高了口语。","从而 đứng đầu vế sau, không đứng đầu câu."],["❌ 因为下雨，从而我没去。","✅ 因为下雨，所以我没去。","Nguyên nhân khách quan, khẩu ngữ → 所以; 从而 nhấn mạnh phương pháp → kết quả."]],"book":[["玩游戏可以锻炼人的脑、眼和手，____________。（从而）","Gợi ý: nâng cao khả năng phản ứng.","玩游戏可以锻炼人的脑、眼和手，从而提高人的反应能力"],["公司通过引进新技术，加强管理，提高了产品质量，____________。（从而）","Gợi ý: tăng doanh thu.","从而增加了产品的销量"],["A：时间这么紧，你们是怎么完成任务的？<br>B：____________。（从而）","Gợi ý: chia việc hợp lý.","我们把任务分给每个人，大家一起努力，从而按时完成了任务"]],"drill":[["“从而”放在哪里？ <u>A<\/u>他改变了学习方法，<u>B<\/u>提高了成绩。",["A","B"],1,"Đầu vế sau."],["选择：换一个角度考虑，也许正好就能发现问题的关键，____找到解决问题的答案。",["从而","然而"],0,"Phương pháp → kết quả (课本练习1)."],["Câu nào dùng đúng 从而?",["她多读多写，从而提高了写作水平。","今天很冷，从而我穿了大衣。","从而我喜欢他。"],0,"Phương pháp (多读多写) → kết quả."]]},{"word":"为","py":"wéi","pos":"动词","forms":["动词 + 为（成为）：变为、成为、改为","把／以 + A + 为 + B（作为、算作）：以……为……、称……为……"],"vn":"<b>为<\/b> (wéi) là động từ: ① <b>thành, trở thành<\/b>, thường làm bổ ngữ sau động từ (变为、改为、分为); ② <b>làm, coi là<\/b> trong 以 A 为 B, 称 A 为 B. Lưu ý đọc <b>wéi<\/b>, khác 为了 (wèi).","text":"而济南市区的地下岩石变为了火成岩……","ex":[["每个人都会遇到各种压力，可是，压力也可以变为动力。","Ai cũng gặp áp lực, nhưng áp lực cũng có thể biến thành động lực."],["找工作时，很多人会以收入多少为第一标准。","Khi tìm việc, nhiều người lấy thu nhập làm tiêu chuẩn hàng đầu."],["在他看来，没有工作的生活就不能称其为生活。","Theo anh ấy, cuộc sống không có công việc thì không thể gọi là cuộc sống."]],"err":[["❌ 他为了老师。","✅ 他成为了老师。","Nghĩa “trở thành” dùng 成为／变为; 为了 (wèi) là “để, vì”."],["❌ 我们把会议时间改到为下周。","✅ 我们把会议时间改为下周。","改为 = đổi thành, không thêm 到."]],"book":[["在影视作品中，常常把鲨鱼描写成可怕的海洋杀手。<br>→ 在影视作品中，____________。（为）","Gợi ý: miêu tả … thành …","在影视作品中，常常把鲨鱼描写为可怕的海洋杀手"],["为了方便同学们报名，办公室改变了报名时间，从本月一日到十日，周六、日不休。<br>→ 为了方便同学们报名，____________。（为）","Gợi ý: đổi thời gian thành…","办公室把报名时间改为本月一日到十日，周六、日不休"]],"drill":[["“为”在这里读什么？ 压力也可以变为动力。",["wéi","wèi"],0,"变为 = biến thành → wéi."],["选择：办公室让我通知你明天下午的活动改____下周一了。",["为","成","到"],0,"改为 = đổi thành (课本练习1)."],["“以收入多少为第一标准”中“为”的意思是：",["作为","为了","因为"],0,"以 A 为 B = lấy A làm B."]]}],"HSK":{"r1":[{"text":["有个人去济南旅游，导游带他参观趵突泉。导游介绍说：“这里的泉水已经流了几千年了，很少{36}过。”游客听了，马上拿出一个大瓶子，装了满满一瓶。导游问：“您装这么多水干什么？”游客笑着说：“{37}，我想带回家，让我家的水龙头也学一学，{38}！”"],"qs":[{"n":36,"o":["抢","停","埋","救"],"a":1,"why":"泉水“流了几千年”，所以说“很少停过”。"},{"n":37,"o":["因为我很渴","虽然水很贵","这么好的泉水","如果您同意"],"a":2,"why":"游客想把“这么好的泉水”带回家，前后意思连贯。"},{"n":38,"o":["多喝点儿水","别总是停水","每天都要洗澡","不要浪费"],"a":1,"why":"笑话的关键：泉水几千年不停，游客希望家里的水龙头也“别总是停水”。"}]},{"text":["水是生命之源，可是地球上能直接使用的淡水{39}。随着人口的增加和经济的发展，很多地区都出现了缺水问题。{40}，其实节约用水并不难。比如，洗菜的水可以用来浇花，刷牙时关上水龙头，洗澡的时间{41}一些。如果每个人都能从小事做起，{42}。"],"qs":[{"n":39,"o":["越来越多","只占很少的一部分","到处都是","一点儿也不重要"],"a":1,"why":"后面说很多地区缺水，所以淡水“只占很少的一部分”。"},{"n":40,"o":["因为水很便宜","只要下雨","有人认为节水是政府的事","所以大家都不用水"],"a":2,"why":"“有人认为……，其实……”，前后形成对比。"},{"n":41,"o":["延长","产生","反映","缩短"],"a":3,"why":"为了节约用水，洗澡的时间要“缩短”。"},{"n":42,"o":["就能节约大量的水","水就会越来越贵","地球就会变小","我们就不用喝水了"],"a":0,"why":"“如果……，就……”：每个人都节约，结果是节约大量的水。"}]}],"r2":[{"start":46,"paras":["村里有个善良的老人，每天天不亮就到山上去找水。","从前，有一个小村子，村里只有一口很深的井，全村人都喝这口井里的水。","为了感激这位老人，村里人用他的名字给这股泉水命名，这个美丽的传说一直流传到今天。","有一年夏天，天气特别干旱，井里的水越来越少，大家都很着急。","找了整整一个月，他终于在山下发现了一股清凉的泉水。"],"ans":["B","D","A","E","C"],"why":"背景（B）→ 干旱缺水（D）→ 老人去找水（A）→ 发现泉水（E）→ 用老人的名字命名（C）。"}],"r3":[{"text":["济南被称为“泉城”，市区内分布着七百多个天然泉。可是在上个世纪末，由于连续多年气候干旱，再加上人们大量使用地下水，很多泉水都停止了流动，有名的趵突泉也一度干了。","泉水停了，济南人急坏了。政府开始保护泉水：一方面限制使用地下水，另一方面在山区种树，让更多的雨水进入地下。很多普通市民也主动节约用水，有人说：<u><b>“保护泉水，就是保护我们自己的家”<\/b><\/u>。","经过多年的努力，2003年，趵突泉终于再次流出了甜美的泉水。那一天，很多市民来到泉边，有人激动得流下了眼泪。","趵突泉的“从有到无，又从无到有”，让人们看到了水的宝贵。今天，节约用水已经成为很多济南人的习惯。"],"qs":[{"n":56,"s":"上个世纪末，济南很多泉水为什么停止了流动？","o":["人们不喜欢泉水","气候干旱，人们大量使用地下水","泉水被人抢走了","下雨太多"],"a":1,"why":"第一段：由于连续多年气候干旱，再加上人们大量使用地下水。"},{"n":57,"s":"政府为保护泉水做了什么？","o":["关闭了所有公园","让市民离开济南","限制使用地下水，在山区种树","从外地买了很多水"],"a":2,"why":"第二段：一方面限制使用地下水，另一方面在山区种树。"},{"n":58,"s":"第二段画线句子说明了：","o":["济南人都住在泉边","泉水对济南人非常重要","家里不能用水","泉水很便宜"],"a":1,"why":"把泉水比作“自己的家”，说明泉水对济南人非常重要。"},{"n":59,"s":"最适合做上文题目的是：","o":["济南的天气","怎样种树","地下水的形成","泉城的泉水又回来了"],"a":3,"why":"全文讲泉水干了、人们保护泉水、泉水重新流出。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写 Có thể dùng: 浪费、惭愧、缺水、提醒、节约."],"sample":"小明特别喜欢洗澡，每次都一边唱歌一边玩，水哗哗地流了半个小时也不关。第二天上课时，老师给大家讲了很多地方缺水的情况：有的孩子每天要走很远的路才能打到一桶水。小明听了，想起自己浪费的水，心里十分惭愧。回家以后，他把洗菜的水留下来浇花，洗澡的时间也缩短了。他还提醒爸爸妈妈：“我们要节约每一滴水。”","svn":"Tiểu Minh thích tắm, vừa hát vừa nghịch, nước chảy nửa tiếng… Nghe cô giáo kể về nơi thiếu nước, cậu thấy hổ thẹn… Về nhà cậu dùng nước rửa rau tưới hoa và nhắc bố mẹ tiết kiệm từng giọt nước."},"w72":{"prompt":"有人说：“水是取之不尽的。”也有人说：“如果不节约用水，最后一滴水将是人类的眼泪。”请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói “nước là vô tận”, có người nói “nếu không tiết kiệm, giọt nước cuối cùng sẽ là nước mắt của loài người”. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"别让最后一滴水成为眼泪","tips":["Nêu quan điểm → lý do 1 (nước ngọt có hạn) → lý do 2 + ví dụ suối Tế Nam → cách làm → kết luận.","Dùng khung 好句: 这就是……的原因, 可从……上反映出来."],"sample":"有人认为水是取之不尽的，可是我觉得，如果我们不节约用水，最后一滴水真的可能会是人类的眼泪。\n首先，地球上的水虽然很多，但是能直接使用的淡水只占很少的一部分。随着人口的增加，很多地区已经出现了缺水问题。\n其次，水资源一旦被破坏，很难恢复。课文中济南的泉水就是一个例子：前些年，由于气候干旱和人们不注意节水，很多泉水都干了，经过多年的努力，趵突泉才再次流出了泉水。\n所以，节约用水应该从每个人做起，从生活中的小事做起。比如刷牙时关上水龙头，用洗菜的水浇花。只要大家都行动起来，就能保护好我们宝贵的水资源。","svn":"Bài nghị luận: quan điểm → 首先 (nước ngọt có hạn) → 其次 + ví dụ suối Tế Nam → cách làm → kết luận."}},"PRACTICE":{"ex1":{"bank":["于","为","充满","从而","产生","描写"],"items":[["这首诗主要{}了一对年轻人的恋爱经历。",["描写"]],["新产品很受顾客欢迎，使我对公司的未来{}信心。",["充满"]],["我担心长期吃这种药会对身体{}不好的影响。",["产生"]],["办公室让我通知你明天下午的活动改{}下周一了。",["为"]],["刘经理毕业{}北京大学经济学院。",["于"]],["换一个角度考虑，也许正好就能发现问题的关键，{}找到解决问题的答案。",["从而"]]]},"ex2":[["____是五点，再过一刻钟小明就放学了。",["如今","现在"],1],["严芳长得不是____漂亮，但仔细看却很有味道。",["特别","独特"],0],["我这次来是想当面向你表示____的。",["感谢","感激"],1],["护士小姐____女儿很勇敢，本来很怕打针的她这次竟然没哭。",["赞美","表扬"],1]],"ex3match":{"title":"三、画线连接可以搭配的词语","groups":[[["打","晕"],["碰","见"],["救","活"],["抢","光"]],[["悠久的","文化"],["善良的","性格"],["独特的","味道"],["广大的","农村"]]]},"ex3":[],"ex4":[["泉水的优美","悠久、记载、泡茶、赞美、诗文","济南的泉水历史悠久，最早的文字记载可以推到3000多年前。人们用泉水泡茶，许多文人写了很多赞美泉水的诗文。"],["“天下第一泉”的美丽传说","鲍全、救、龙王、白玉壶、埋","善良的青年鲍全学医救人。他救了一位晕倒的老人，原来是东海龙王的哥哥。鲍全从龙王那儿求到了白玉壶，为了不被坏人抢走，他把壶埋入地下，于是就有了趵突泉。"],["优雅的名字","优美、独特、命名、动物、珍珠","济南有七百多个天然泉，名字优美又独特：有以人名命名的舜泉，以动物命名的黑虎泉，以形状命名的珍珠泉。"],["形成的原因","来自于、岩石、角度、斜、挡、积蓄、冲","济南的泉水来自于南边的山区。山区的岩石是石灰岩，以三十度的角度由南向北斜，地下水流向济南。市区的火成岩把水挡住，水积蓄起来，在地势低的地方冲出地表，形成了泉水。"]],"ext":{"title":"扩展 · 话题：文学","words":[["作品","zuòpǐn","tác phẩm"],["诗","shī","thơ"],["传说","chuánshuō","truyền thuyết"],["神话","shénhuà","thần thoại"],["戏剧","xìjù","kịch"],["风格","fēnggé","phong cách"],["形象","xíngxiàng","hình tượng"],["魅力","mèilì","sức hấp dẫn"],["生动","shēngdòng","sinh động"]],"items":[["这个电视剧取材于一个{}传说。","神话"],["咱家的装修{}搭配这样的家具很合适。","风格"],["作者正是以这座大山为背景，写下了这个{}感人的神话故事。","生动"],["嗓音直接影响着别人对我们的印象，好听的嗓音会让一个人更有{}。","魅力"]]}},"TEXT":[{"title":"泉水与诗文","sub":"悠久的历史","paras":["济南的泉水，历史悠久，最早的文字记载可以推到3000多年前。许多文人都对它的声音、颜色、形状、味道进行过描写，留下了许多赞美泉水的诗文。而济南的老百姓住在泉边，喝着这甜美的泉水，自然对它充满感激之情，从而也产生了许多关于泉水的美丽传说。"],"idea":"Suối Tế Nam có <b>lịch sử lâu đời<\/b>, được ghi chép từ hơn 3000 năm trước. Văn nhân để lại nhiều thơ văn ca ngợi; người dân biết ơn nguồn nước ngọt nên có nhiều <b>truyền thuyết<\/b> đẹp.","qs":[["济南泉水最早的文字记载可以推到什么时候？",["300多年前","3000多年前","30000多年前"],1],["文人们对泉水的哪些方面进行过描写？",["声音、颜色、形状、味道","价格和数量","历史和地理"],0],["为什么会产生许多关于泉水的传说？",["老百姓对泉水充满感激之情","泉水很危险","泉水很少"],0]]},{"title":"趵突泉的传说","sub":"鲍全和白玉壶","paras":["相传很久以前，济南城里有个善良的青年，名叫鲍全，他学习医术，救了很多人。一次，他在路边救了一位晕倒的老人，并把老人接回家照顾。这老人其实是东海龙王的哥哥。通过老人的介绍，鲍全从龙王那儿求到了治病救人的白玉壶。为了不被坏人抢走，他把壶埋入地下藏了起来，于是就变成了今天有“天下第一泉”美名的趵突泉。"],"idea":"Chàng trai tốt bụng Bào Toàn cứu một cụ già ngất bên đường — hóa ra là anh trai Đông Hải Long vương. Anh xin được <b>bình ngọc trắng<\/b> chữa bệnh, chôn xuống đất để giấu, và nơi đó thành suối Báo Đột — “thiên hạ đệ nhất tuyền”.","qs":[["鲍全是一个什么样的人？",["很有钱的商人","学习医术、救了很多人的善良青年","东海龙王的哥哥"],1],["那位晕倒的老人其实是谁？",["鲍全的父亲","东海龙王的哥哥","一位医生"],1],["鲍全为什么把白玉壶埋入地下？",["为了不被坏人抢走","因为壶坏了","为了让壶变大"],0]]},{"title":"七百多个天然泉","sub":"独特的名字","paras":["如今的济南市区内，分布着大大小小七百多个天然泉，这在国内外城市中是极为少有的。有如此之多的泉，名字当然也少不了。济南泉水的优美，还可从那独特的名字上反映出来，如：以人名命名的舜泉，以动物命名的黑虎泉，以形状命名的珍珠泉，等等。"],"idea":"Nội thành Tế Nam có <b>hơn 700 suối tự nhiên<\/b>, rất hiếm thấy trên thế giới. Vẻ đẹp của suối còn thể hiện qua <b>những cái tên độc đáo<\/b>: đặt theo tên người, tên con vật, theo hình dạng.","qs":[["济南市区内大约有多少个天然泉？",["七十多个","七百多个","七千多个"],1],["黑虎泉是以什么命名的？",["人名","动物","形状"],1],["珍珠泉是以什么命名的？",["人名","动物","形状"],2]]},{"title":"泉水是怎样形成的","sub":"“泉城”美名的由来","paras":["说到这里，您也许要问，这么多、这么好的泉水是如何形成的呢？济南的泉水，来自于济南市以南的广大山区，这些山区的岩石是大约四亿年前形成的一层厚厚的石灰岩。在这种石灰岩地区，陆地表面的水很容易进入地下。山区的石灰岩层，以大约三十度的角度，由南向北斜，因此大量的地下水向济南运动。而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。它无处可流，就得另找出路。济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。这就是济南“泉城”美名得来的原因。"],"idea":"Nước từ vùng núi phía nam thấm qua <b>đá vôi<\/b>, chảy nghiêng về phía bắc; đến nội thành gặp <b>đá mác-ma<\/b> chặn lại thì tích tụ. Phố cổ có địa thế thấp nên nước ngầm <b>phun lên mặt đất<\/b> thành suối — nguồn gốc tên gọi “泉城”.","qs":[["济南的泉水来自哪里？",["济南市以南的广大山区","大海","大明湖"],0],["地下水为什么会在济南市区积蓄起来？",["碰到火成岩挡住了路","天气太冷","人们把它挡住了"],0],["地下水为什么能冲出地表？",["旧城一带地势低","下了很多雨","人们挖了很多井"],0]]}],"TEXT_EXPLAIN":{"tab":"泉水是怎样形成的 · Giải thích","video":{"mp4":"video/jinan_quan.mp4","webm":"video/jinan_quan.webm","poster":"video/jinan_quan.jpg","link":"https://www.douyin.com/video/7598783205400282707","title":"济南泉水是怎么形成的？","note":"Video (~1 phút 30) kể <b>lịch sử địa chất<\/b> hàng trăm triệu năm tạo nên suối Tế Nam — bổ sung cho đoạn 3 của bài khóa. Xem hết một lượt, rồi bấm từng đoạn lời thuyết minh bên dưới để xem lại và học từ.","segs_lead":"Video đi theo dòng thời gian: <b>biển cổ → đá vôi → núi lửa → núi phía Nam nâng lên → nước ngầm chảy Nam→Bắc → bị đá mác-ma chặn → áp lực lớn → phun thành suối<\/b>.","segs":[{"t":"0:00","h":"Mở đầu · 大自然的馈赠","zh":"济南泉水是怎么形成的？独特的地质构造与地理环境造就了济南的泉水，这是大自然得天独厚的馈赠。","vn":"Suối Tế Nam hình thành thế nào? Chính <b>cấu tạo địa chất đặc biệt<\/b> và <b>môi trường địa lý<\/b> đã tạo nên suối Tế Nam — món quà ưu ái của thiên nhiên.","w":"得天独厚 dé tiān dú hòu — được trời ưu đãi đặc biệt · 馈赠 kuìzèng — món quà tặng"},{"t":"0:09","h":"4–5 亿年前 · 一片汪洋大海","zh":"距今四到五亿年前，济南包括整个华北地区曾是一片汪洋大海，海洋中有珊瑚、鹦鹉螺、三叶虫等古生物。","vn":"Cách đây <b>400–500 triệu năm<\/b>, Tế Nam và cả vùng Hoa Bắc từng là <b>biển cả mênh mông<\/b>, trong biển có san hô, ốc anh vũ, bọ ba thùy… và nhiều sinh vật cổ khác."},{"t":"0:19","h":"海底形成灰岩","zh":"随着海洋生物遗体的堆积以及海水中碳酸钙的析出，在海底形成了可溶性的灰岩。","vn":"Xác sinh vật biển tích tụ lại, cùng với <b>canxi cacbonat<\/b> kết tủa từ nước biển, tạo thành lớp <b>đá vôi dễ hòa tan<\/b> dưới đáy biển.","w":"→ chính là lớp <b>石灰岩<\/b> trong bài khóa (“大约四亿年前形成的一层厚厚的石灰岩”)."},{"t":"0:26","h":"约 1.3 亿年前 · 火山活动","zh":"距今一亿三千万年左右，济南北部火山开始活动，岩浆从地下涌出，在济南北面形成的岩浆岩宛如一道道高墙。此次火山运动，形成了匡山、药山、金牛山、华山、燕翅山、马鞍山等六个主要侵入岩山体。","vn":"Khoảng <b>130 triệu năm trước<\/b>, núi lửa phía bắc Tế Nam hoạt động, <b>dung nham<\/b> trào lên từ lòng đất; lớp <b>đá mác-ma<\/b> hình thành ở phía bắc giống như <b>từng bức tường cao<\/b>. Đợt núi lửa này tạo ra 6 khối núi đá xâm nhập chính: Khuông Sơn, Dược Sơn, Kim Ngưu Sơn, Hoa Sơn, Yến Sí Sơn, Mã An Sơn.","w":"→ “bức tường” này chính là <b>火成岩<\/b> chặn nước trong bài khóa."},{"t":"0:45","h":"约 6000 万年前 · 南部山区升高","zh":"大约六千万年前，地壳运动使得济南南部包括泰安地区地势大幅升高，形成了济南的南部山区和泰山的基本轮廓。","vn":"Khoảng <b>60 triệu năm trước<\/b>, <b>vận động vỏ Trái Đất<\/b> làm vùng phía nam Tế Nam (kể cả Thái An) <b>nâng cao mạnh<\/b>, tạo nên vùng núi phía Nam và hình dáng cơ bản của <b>núi Thái Sơn<\/b>.","w":"→ vì thế địa thế <b>nam cao – bắc thấp<\/b>, lớp đá vôi “由南向北斜”."},{"t":"0:55","h":"溶孔、溶洞 · 地下水自南向北","zh":"济南南部山区地势很高，透水的石灰岩经过长期溶蚀成大量溶孔、溶洞。地下水接受大气降水入渗补给后，自南向北流动。","vn":"Vùng núi phía Nam rất cao; đá vôi <b>thấm nước<\/b> bị nước <b>hòa tan, bào mòn<\/b> lâu ngày thành vô số <b>lỗ, hang karst<\/b>. Nước mưa thấm xuống bổ sung cho nước ngầm, rồi nước ngầm <b>chảy từ nam lên bắc<\/b>.","w":"→ bài khóa: “陆地表面的水很容易进入地下……大量的地下水向济南运动”."},{"t":"1:06","h":"石灰岩 vs 火成岩","zh":"市中心附近的地下岩石是石灰岩，有岩溶裂隙，水可以自然地流过，但是济南北郊的地下岩石是不透水的火成岩，就把地下水阻挡住了。","vn":"Đá dưới khu trung tâm là <b>đá vôi<\/b>, có <b>khe nứt karst<\/b>, nước chảy qua tự nhiên; nhưng đá dưới <b>ngoại ô phía bắc<\/b> là <b>đá mác-ma không thấm nước<\/b>, nên chặn nước ngầm lại."},{"t":"1:17","h":"极大的水压 → 四大泉群","zh":"而南部的地下水继续源源不断地流过来，在地下越积越多，形成了极大的水压，即形成市区四大泉群。","vn":"Nước ngầm từ phía nam vẫn <b>liên tục không ngừng<\/b> chảy tới, dưới đất <b>càng tích càng nhiều<\/b>, tạo ra <b>áp lực nước cực lớn<\/b> → phun lên thành <b>bốn nhóm suối lớn<\/b> trong nội thành (趵突泉、黑虎泉、珍珠泉、五龙潭).","w":"源源不断 yuányuán búduàn — liên tục không ngừng · 越积越多 = bài khóa “越积越多”."}],"terms":[["汪洋大海","wāngyáng dàhǎi","biển cả mênh mông"],["古生物","gǔshēngwù","sinh vật cổ"],["碳酸钙","tànsuāngài","canxi cacbonat"],["析出","xīchū","kết tủa, tách ra"],["可溶性","kěróngxìng","tính hòa tan được"],["岩浆 / 岩浆岩","yánjiāng / yánjiāngyán","dung nham / đá mác-ma (= 火成岩)"],["侵入岩","qīnrùyán","đá xâm nhập"],["地壳运动","dìqiào yùndòng","vận động vỏ Trái Đất"],["溶蚀","róngshí","hòa tan, ăn mòn (đá vôi)"],["溶洞","róngdòng","hang động karst"],["入渗补给","rùshèn bǔjǐ","thấm xuống bổ sung (nước ngầm)"],["岩溶裂隙","yánróng lièxì","khe nứt karst"],["水压","shuǐyā","áp lực nước"],["泉群","quánqún","nhóm suối"]]},"title":"济南的泉水是怎样形成的？","lead":"Đoạn 4 của bài khóa khó nhất vì nhiều từ địa lý. Hình dưới là <b>mặt cắt nam → bắc<\/b> của vùng Tế Nam. Bấm <b>Bước 1 → 5<\/b> để xem từng phần sáng lên, kèm câu gốc trong bài khóa và lời giải thích.","svg":"<svg viewBox=\"0 0 900 510\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"inherit\">\n<defs><marker id=\"xa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.6\"/><\/marker><\/defs>\n<polygon points=\"40,480 860,480 860,420 560,470 40,380\" fill=\"#dddad0\" stroke=\"#9a978e\" stroke-width=\"0.6\"/>\n<path d=\"M40 190 L150 95 L255 135 L360 115 L445 300 L500 300 L520 318 L580 318 L598 300 L860 300 L860 310 L605 310 L560 470 L40 380 Z\" fill=\"#efdcab\" stroke=\"#b79b5b\" stroke-width=\"0.8\"/>\n<text x=\"680\" y=\"288\" font-size=\"15\" fill=\"#3d3d3a\">济南市区 · nội thành<\/text>\n<text x= =\"url(#xa)\"/>\n<path d=\"M230 322 L430 364\" stroke=\"#378add\" stroke-width=\"2.2\" fill=\"none\" stroke-dasharray=\"7 5\" class=\"wflow\" marker-end=\"url(#xa)\"/>\n<path d=\"M360 290 L520 324\" stroke=\"#378add\" stroke-width=\"2.2\" fill=\"none\" stroke-dasharray=\"7 5\" class=\"wflow\" marker-end=\"url(#xa)\"/>\n<path d=\"M120 215 L600 305\" stroke=\"#185fa5\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"2 4\"/>\n<\/g>\n<g id=\"xs4\">\n<polygon points=\"478,322 596,322 578,440 466,418\" fill=\"#378add\" fill-opacity=\"0.28\"/>\n<polygon points=\"605,310 860,310 860,420 560,470\" fill=\"#a19f97\" stroke=\"#5f5e5a\" stroke-width=\"0.8\" class=\"hi\"/>\n<text x=\"650\" y=\"372\" font-size=\"16\" font-weight=\"700\" fill=\"#2c2c2a\">火成岩 · đá mác-ma<\/text>\n<text x=\"650\" y=\"394\" font-size=\"14\" fill=\"#2c2c2a\">挡住了路 → 积蓄起来<\/text>\n<text x=\"650\" y=\"414\" font-size=\"14\" fill=\"#2c2c2a\">chặn đường → nước dồn lại<\/text>\n<\/g>\n<g id=\"xs5\">\n<path d=\"M540 396 L540 330\" stroke=\"#1f6fd1\" stroke-width=\"2.4\" fill=\"none\" marker-end=\"url(#xa)\" class=\"wflow\" stroke-dasharray=\"7 5\"/>\n<path d=\"M566 396 L566 330\" stroke=\"#1f6fd1\" stroke-width=\"2.4\" fill=\"none\" marker-end=\"url(#xa)\" class=\"wflow\" stroke-dasharray=\"7 5\"/>\n<g stroke=\"#1f6fd1\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M540 316 Q532 296 524 288\"/><path d=\"M540 316 L540 282\"/><path d=\"M540 316 Q548 296 556 288\"/><path d=\"M566 316 Q559 300 552 294\"/><path d=\"M566 316 L566 288\"/><path d=\"M566 316 Q573 300 580 294\"/><\/g>\n<line x1=\"552\" y1=\"282\" x2=\"610\" y2=\"226\" stroke=\"#5f5e5a\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/>\n<text x=\"614\" y=\"222\" font-size=\"16\" font-weight=\"700\" fill=\"#0c447c\">冲出地表 · phun lên mặt đất<\/text>\n<line x1=\"582\" y1=\"320\" x2=\"640\" y2=\"250\" stroke=\"#5f5e5a\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/>\n<text x=\"644\" y=\"254\" font-size=\"14\" fill=\"#3d3d3a\">旧城地势低 · phố cổ trũng thấp<\/text>\n<\/g>\n<\/svg>","summary":"Nước mưa ở <b>vùng núi phía nam<\/b> thấm vào <b>đá vôi<\/b> → theo các lớp đá <b>nghiêng về phía bắc<\/b> chảy ngầm về Tế Nam → bị <b>đá mác-ma<\/b> dưới nội thành chặn lại, dồn ứ, áp lực tăng → ở <b>phố cổ trũng thấp<\/b> (thấp hơn mực nước ngầm) nước <b>phun lên mặt đất<\/b> thành hơn 700 con suối.","steps":[{"title":"Nguồn nước: vùng núi phía nam","ids":["xs1"],"zh":"济南的泉水，来自于济南市以南的广大山区……","vn":"Nước suối không tự sinh ra trong thành phố. Nó là <b>nước mưa<\/b> rơi xuống <b>vùng núi rộng lớn phía nam<\/b> Tế Nam (dãy Thái Sơn). Địa hình Tế Nam cao ở phía nam, thấp dần về phía bắc.","key":"<b>来自于<\/b> = đến từ (于 · văn viết, xem 注释). <b>以南<\/b> = phía nam của."},{"title":"Đá vôi hút nước","ids":["xs1","xs2"],"zh":"这些山区的岩石是大约四亿年前形成的一层厚厚的石灰岩。在这种石灰岩地区，陆地表面的水很容易进入地下。","vn":"Núi phía nam là một lớp <b>đá vôi<\/b> rất dày. Đá vôi bị nước hòa tan dần nên có vô số <b>khe nứt, hang ngầm<\/b> (giống Hạ Long, Phong Nha). Vì vậy nước mưa <b>không chảy trên mặt đất<\/b> mà thấm hết xuống dưới, giống bọt biển hút nước.","key":"<b>岩石<\/b> = đá, nham thạch · <b>石灰岩<\/b> = đá vôi · <b>陆地表面<\/b> = mặt đất liền · <b>进入地下<\/b> = đi vào lòng đất."},{"title":"Lớp đá nghiêng dẫn nước về Tế Nam","ids":["xs2","xs3"],"zh":"山区的石灰岩层，以大约三十度的角度，由南向北斜，因此大量的地下水向济南运动。","vn":"Các lớp đá vôi <b>nghiêng<\/b> từ nam xuống bắc như một <b>máng nước nghiêng<\/b>. Nước ngầm theo máng đó <b>chảy về phía Tế Nam<\/b>. Đường chấm xanh là <b>mực nước ngầm<\/b>.","key":"<b>以……的角度<\/b> = với góc…· <b>由南向北<\/b> = từ nam sang bắc · <b>斜<\/b> = nghiêng · <b>向……运动<\/b> = di chuyển về phía…"},{"title":"Đá mác-ma chặn đường, nước dồn lại","ids":["xs3","xs4"],"zh":"而济南市区的地下岩石变为了火成岩，地下水流到这里，碰到火成岩挡住了路，就积蓄起来，越积越多。它无处可流，就得另找出路。","vn":"Dưới nội thành, đá vôi <b>chuyển thành đá mác-ma<\/b> (火成岩 — dung nham nguội lại mà thành). Loại đá này đặc, <b>gần như không thấm nước<\/b>, như một bức tường ngầm. Nước đến đây bị <b>chặn đường<\/b>, phải <b>tích tụ lại, càng dồn càng nhiều<\/b>, áp lực càng lớn. Không còn chỗ chảy tiếp, nó phải <b>tìm lối thoát khác<\/b>.","key":"<b>变为<\/b> = biến thành (为 wéi · 注释) · <b>挡住<\/b> = chặn lại · <b>积蓄起来<\/b> = dồn tụ lại (起来 · 注释) · <b>越积越多<\/b> = càng dồn càng nhiều · <b>无处可流<\/b> = không còn nơi để chảy."},{"title":"Phố cổ trũng thấp — nước phun lên","ids":["xs4","xs5"],"zh":"济南旧城一带，地势低，有的地方甚至低过了地下水的水面，地下水就冲出地表，形成了众多的泉水。","vn":"Khu <b>phố cổ<\/b> có <b>địa thế thấp<\/b>, có chỗ còn <b>thấp hơn mực nước ngầm<\/b>. Nước đang bị nén liền theo khe đá <b>vọt lên mặt đất<\/b>, tạo thành rất nhiều suối. Đó là lý do Tế Nam có hơn 700 suối và được gọi là “泉城”.","key":"<b>地势<\/b> = địa thế · <b>低过<\/b> = thấp hơn · <b>水面<\/b> = mặt nước · <b>冲出地表<\/b> = phun ra khỏi mặt đất · <b>众多<\/b> = rất nhiều."}],"analogy":"<b>Hình ảnh dễ nhớ:<\/b> một <b>ống nước dài đặt nghiêng<\/b>. Đầu cao là núi phía nam, nơi rót nước vào. Đầu thấp bị <b>bịt kín bằng đá mác-ma<\/b>. Chọc một lỗ ở chỗ thấp nhất (phố cổ) là nước phun lên ngay.","terms":[["石灰岩","shíhuīyán","đá vôi","Đá mềm, bị nước hòa tan tạo khe hang → thấm nước rất tốt."],["火成岩","huǒchéngyán","đá mác-ma","Do dung nham nguội lại mà thành; đặc, hầu như không thấm nước."],["岩层","yáncéng","tầng đá","Các lớp đá chồng lên nhau; ở Tế Nam nghiêng về phía bắc."],["地下水","dìxiàshuǐ","nước ngầm","Nước nằm trong khe đá, lớp đất dưới mặt đất."],["地下水的水面","dìxiàshuǐ de shuǐmiàn","mực nước ngầm","Độ cao của mặt nước ngầm; đất thấp hơn mức này thì nước trào ra."],["斜","xié","nghiêng","由南向北斜 = nghiêng từ nam sang bắc."],["挡","dǎng","chặn, cản","碰到火成岩挡住了路 = gặp đá mác-ma bị chặn đường."],["积蓄","jīxù","tích tụ, dồn lại","积蓄起来，越积越多 = dồn lại, càng dồn càng nhiều."],["地势","dìshì","địa thế","Độ cao thấp của mặt đất: 地势低 = đất trũng."],["冲出地表","chōngchū dìbiǎo","phun lên mặt đất","Nước bị nén vọt ra khỏi mặt đất."]],"note":"<b>Liên hệ 背景分析:<\/b> những năm 1970–2000, người ta bơm nước ngầm quá nhiều nên mực nước tụt xuống <b>thấp hơn mặt đất phố cổ<\/b>, các suối ngừng chảy. Sau khi hạn chế khai thác và trồng rừng ở vùng núi, năm 2003 suối Báo Đột (趵突泉) phun trở lại — vì vậy chủ đề viết của bài là <b>节约每一滴水<\/b>.<br><span style='font-size:15px;color:var(--muted)'>Ghi chú: “约四亿年”, “三十度” là số liệu của sách. Thực tế đá vôi ở đây khoảng 4–5 trăm triệu năm, các lớp đá nghiêng khá thoải (đa phần dưới 10°); khi dạy giữ số liệu sách, chỉ cần nhấn ý “nghiêng về phía bắc”.<\/span>","quiz":[["济南泉水的水最早来自哪里？",["济南市以南的山区","大明湖","大海"],0,"Bước 1: 来自于济南市以南的广大山区."],["为什么地面上的水很容易进入地下？",["因为那里是石灰岩地区","因为那里有很多井","因为那里经常下大雨"],0,"Bước 2: 在这种石灰岩地区，陆地表面的水很容易进入地下."],["地下水为什么会向济南运动？",["人们用机器把水送过去","石灰岩层由南向北斜","济南的地势最高"],1,"Bước 3: 岩层由南向北斜，因此地下水向济南运动."],["地下水到了济南市区为什么会积蓄起来？",["碰到火成岩，被挡住了路","天气太冷，水结冰了","水流得太快了"],0,"Bước 4: 碰到火成岩挡住了路，就积蓄起来."],["泉水为什么集中在济南旧城一带？",["旧城的人最多","旧城地势低，有的地方低过了地下水的水面","旧城有很多石灰岩"],1,"Bước 5: 地势低，甚至低过了地下水的水面，地下水就冲出地表."]]},"TEXT_EXTRA":{"compare_title":"济南泉水的名字","compare_head":["命名方法","例子","Tiếng Việt"],"compare":[["以人名命名","舜泉","đặt theo tên người (vua Thuấn)"],["以动物命名","黑虎泉","đặt theo tên con vật (hổ đen)"],["以形状命名","珍珠泉","đặt theo hình dạng (ngọc trai)"]],"bg":"济南的泉水分布广、水量大、水质好，身边有这么好的泉水，生活在这里的济南人当然是幸福的。可是你知道吗？前些年，由于气候干旱和人们不注意节水，济南很多泉水都干了。这可急坏了爱泉的济南人，人们想了许多办法来解决这个问题。在政府和百姓的共同努力下，2003年，趵突泉终于再次流出了甜美的泉水。水是大自然送给我们的宝贵礼物，可是，生活中，水常常不被我们重视。趵突泉水的从有到无，又从无到有，使我们看到了水的重要。","bg_vn":"Mấy năm trước, do khô hạn (干旱 gānhàn) và không chú ý tiết kiệm nước, nhiều suối ở Tế Nam đã cạn. Nhờ chính quyền (政府 zhèngfǔ) và người dân cùng nỗ lực, năm 2003 suối Báo Đột chảy trở lại. Nước là món quà quý báu (宝贵 bǎoguì) của thiên nhiên.","discuss_title":"话题讨论：水与我们的生活","discuss":["在我们的生活中，哪些事是离不开水的？","地球上有些地方遇到了缺水的问题，你了解这方面的情况吗？","你觉得哪些做法是对水的浪费？怎样可以减少这种浪费？"],"write":"请以“节约每一滴水”为题写一段话，尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"_SVG":"<svg viewBox=\"0 0 900 510\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"inherit\">\n<defs><marker id=\"xa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" /><path d=\"M566 316 L566 288\"/><path d=\"M566 316 Q573 300 580 294\"/><\/g>\n<line x1=\"552\" y1=\"282\" x2=\"610\" y2=\"226\" stroke=\"#5f5e5a\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/>\n<text x=\"614\" y=\"222\" font-size=\"16\" font-weight=\"700\" fill=\"#0c447c\">冲出地表 · phun lên mặt đất<\/text>\n<line x1=\"582\" y1=\"320\" x2=\"640\" y2=\"250\" stroke=\"#5f5e5a\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/>\n<text x=\"644\" y=\"254\" font-size=\"14\" fill=\"#3d3d3a\">旧城地势低 · phố cổ trũng thấp<\/text>\n<\/g>\n<\/svg>","APPLY":{"topic":"请以“节约每一滴水”为题写一段话","topic_vn":"Viết một đoạn văn với đầu đề “Tiết kiệm từng giọt nước”","intro":"Dạng đề kêu gọi – thuyết minh (倡议型) · Nêu tầm quan trọng của nước, chỉ ra hiện tượng lãng phí, đưa cách làm cụ thể, rồi kêu gọi · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“节约每一滴水”：讲道理 + 给办法","lead":"Đầu đề là một <b>lời kêu gọi<\/b>. Giám khảo muốn thấy: bạn hiểu <b>vì sao<\/b> phải tiết kiệm nước, chỉ ra được <b>hiện tượng lãng phí<\/b> cụ thể, và đưa ra <b>cách làm<\/b> rõ ràng. Chỉ hô khẩu hiệu “我们要节约用水” thì bài rất mỏng.","parts":[["节约","Động từ chính: tiết kiệm — phải có việc làm cụ thể, không chỉ nói chung chung."],["每一滴","Nhấn mạnh từng giọt nhỏ → nên nói về những việc nhỏ hằng ngày."],["水","Có thể nói: nước là nguồn sống, nước ngọt có hạn, nơi thiếu nước."],["（课本）尽量用上本课生词，不少于100字","Dùng: 宝贵、充满、从而、形成、产生、反映… và ví dụ suối Tế Nam."]],"traps":[["Chỉ hô khẩu hiệu","节约用水很重要，我们一定要节约用水！→ không có lý do, không có cách làm."],["Liệt kê quá nhiều số liệu","Số liệu sai dễ bị trừ điểm; chỉ cần một ý chắc chắn như “淡水只占很少的一部分”."],["Lạc sang chủ đề khác","Viết về ô nhiễm không khí, rác thải… mà quên nước."],["Thiếu câu kết kêu gọi","Kết thúc ở cách làm, chưa quay lại đầu đề “节约每一滴水”."]],"link":"<b>Liên hệ bài 5 · 济南的泉水:<\/b> phần 背景分析 của sách kể chuyện suối Tế Nam từng <b>cạn khô<\/b> vì khô hạn và lãng phí nước, đến năm 2003 suối Báo Đột mới <b>chảy lại<\/b>. Đây là một <b>ví dụ thật<\/b> rất tốt cho bước ②."},"steps":[["①","点题：水的重要","Mở bài: nước là nguồn sống, là món quà quý của thiên nhiên.","水是生命之源……"],["②","问题：浪费与缺水","Nêu hiện tượng lãng phí và hậu quả (ví dụ suối Tế Nam, nơi thiếu nước).","可是，生活中……"],["③","办法：怎么节约","<b>Trọng tâm.<\/b> 2–3 việc làm cụ thể, dùng 首先……其次……另外…….","比如，刷牙时……"],["④","呼吁","Kêu gọi mọi người hành động, quay lại đầu đề.","让我们从现在做起，节约每一滴水。"]],"formula":["水很宝贵","浪费的现象 + 后果","具体的办法","让我们……节约每一滴水"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 生活中的小事","việc nhỏ hằng ngày","Tập trung vào thói quen: tắt vòi khi đánh răng, dùng lại nước rửa rau.","tắm quá lâu, vòi nước rỉ"],["B · 从济南泉水说起","bắt đầu từ suối Tế Nam","Kể chuyện suối cạn rồi chảy lại để nói nước quý giá.","趵突泉 năm 2003"],["C · 缺水的地方","nơi thiếu nước","So sánh với nơi thiếu nước để thấy mình nên trân trọng.","trẻ em phải đi rất xa lấy nước"],["D · 水是生命之源","nước là nguồn sống","Thuyết minh: con người, động vật, cây cối đều cần nước; nước ngọt có hạn.","nước ngọt chỉ chiếm phần nhỏ"]],"notes":[["Một hiện tượng thật","Chọn một hiện tượng lãng phí bạn từng thấy — cụ thể hơn mười câu khẩu hiệu."],["Cách làm phải làm được","Đưa việc ai cũng làm được ngay hôm nay, không phải việc của chính phủ."],["Câu kết","Quay lại đầu đề: “让我们从现在做起，节约每一滴水！”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> dùng chắc từ HSK4–5 (节约、浪费、宝贵、资源). Câu tục ngữ “别让最后一滴水成为我们的眼泪” chỉ để cộng điểm — dùng một câu là đủ.","patterns":[["① 点题","水是生命之源，没有水，就没有生命。","Nước là nguồn sống, không có nước thì không có sự sống."],["① 点题","水是大自然送给我们的宝贵礼物。","Nước là món quà quý báu thiên nhiên tặng chúng ta."],["② 问题","可是在生活中，很多人并不重视水，浪费水的现象到处都是。","Nhưng trong cuộc sống nhiều người không coi trọng nước, hiện tượng lãng phí ở khắp nơi."],["② 后果","如果不节约用水，总有一天，我们会没有水用。","Nếu không tiết kiệm nước, sẽ có ngày chúng ta không còn nước dùng."],["③ 办法","首先，刷牙、洗手的时候要随手关上水龙头。","Thứ nhất, khi đánh răng, rửa tay phải tiện tay khóa vòi nước."],["③ 办法","其次，洗菜的水可以用来浇花、冲厕所。","Thứ hai, nước rửa rau có thể dùng để tưới hoa, xả bồn cầu."],["④ 呼吁","让我们从现在做起，从小事做起，节约每一滴水！","Hãy bắt đầu từ bây giờ, từ việc nhỏ, tiết kiệm từng giọt nước!"]],"links":[["Nêu tầm quan trọng",["……是生命之源。","……离不开水。","没有……，就没有……"]],["Nêu hiện tượng",["可是，生活中……","……的现象到处都是。","比如，有的人……"]],["Đưa cách làm",["首先……其次……另外……","我们可以……","只要……，就能……"]],["Kêu gọi",["让我们……","从现在做起，从小事做起。","别让……成为……"]]],"open":[["直接式","水是生命之源，没有水，就没有生命。"],["提问式","你知道吗？地球上能直接使用的淡水只占很少的一部分。"],["故事式","前些年，济南的很多泉水都干了，这可急坏了爱泉的济南人。"]],"close":[["呼吁式","让我们从现在做起，节约每一滴水！"],["警示式","别让最后一滴水成为我们的眼泪。"],["总结式","这就是我们要节约每一滴水的原因。"]],"from_text":[["X，历史悠久，最早……可以推到……","人类用水的历史十分悠久，最早的文字记载可以推到几千年前。","Lấy từ 好句 ①: mở bài trang trọng."],["对……进行……","科学家对地球上的淡水进行过调查，发现能直接使用的水非常少。","Lấy từ 好句 ②: đưa thông tin."],["对……充满……之情，从而……","济南人对泉水充满感激之情，从而更加懂得节约用水。","Lấy từ 好句 ③: nêu tình cảm → hành động."],["A 的……，可从 B 上反映出来","一个人有没有节约的习惯，可以从他用水的小事上反映出来。","Lấy từ 好句 ④: lập luận."],["这就是……的原因","水是生命之源，这就是我们要节约每一滴水的原因。","Lấy từ 好句 ⑤: câu kết."]],"vocab":[["节约","jiéyuē","tiết kiệm","节约用水","idea"],["浪费","làngfèi","lãng phí","浪费水","idea"],["宝贵","bǎoguì","quý báu","宝贵的资源","idea"],["资源","zīyuán","tài nguyên","水资源","idea"],["缺水","quē shuǐ","thiếu nước","缺水的地区","idea"],["干旱","gānhàn","khô hạn","气候干旱","idea"],["生命","shēngmìng","sự sống, sinh mệnh","水是生命之源","idea"],["保护","bǎohù","bảo vệ","保护环境","idea"],["水龙头","shuǐlóngtóu","vòi nước","关上水龙头","act"],["关","guān","đóng, tắt","随手关水龙头","act"],["重复利用","chóngfù lìyòng","tái sử dụng","重复利用洗菜水","act"],["浇花","jiāo huā","tưới hoa","用洗菜的水浇花","act"],["养成","yǎngchéng","hình thành (thói quen)","养成节水的习惯","act"],["提醒","tíxǐng","nhắc nhở","提醒家人节水","act"],["减少","jiǎnshǎo","giảm","减少浪费","act"],["行动","xíngdòng","hành động","从现在开始行动","act"],["充满","chōngmǎn","tràn đầy","充满感激之情","lesson"],["从而","cóng'ér","nhờ đó","从而减少浪费","lesson"],["形成","xíngchéng","hình thành","形成好习惯","lesson"],["天然","tiānrán","tự nhiên","天然的泉水","lesson"],["生命之源","shēngmìng zhī yuán","nguồn gốc sự sống","水是生命之源","bonus"],["取之不尽","qǔ zhī bú jìn","lấy mãi không hết","水不是取之不尽的","bonus"],["滴水成河","dī shuǐ chéng hé","góp giọt thành sông","滴水成河，节约要从一点一滴做起","bonus"],["从我做起","cóng wǒ zuò qǐ","bắt đầu từ chính mình","节约用水，从我做起","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 5"],["bonus","加分 · thành ngữ"]],"legend":["① Tầm quan trọng của nước","② Lãng phí · hậu quả","③ Cách tiết kiệm","④ Kêu gọi"],"samples":{"speak":[{"who":"生活中的小事","meta":"Hướng A · bài nói ~1 phút 30","p":["水是生命之源，没有水，就没有生命。","可是在生活中，很多人并不重视水。比如，有的人刷牙的时候一直开着水龙头，有的人洗澡一洗就是半个小时，还有的水龙头坏了也没人修，水就这样白白地流走了。","其实，节约用水并不难。首先，刷牙、洗手的时候要随手关上水龙头；其次，洗菜的水可以用来浇花、冲厕所；另外，洗澡的时间可以缩短一些。","只要每个人都从小事做起，就能节约大量的水。让我们一起节约每一滴水吧！"],"vi":"Nước là nguồn sống, không có nước thì không có sự sống. Nhưng nhiều người không coi trọng nước: có người đánh răng để vòi chảy mãi, có người tắm nửa tiếng, có vòi hỏng không ai sửa, nước cứ chảy phí. Thật ra tiết kiệm nước không khó: thứ nhất tiện tay khóa vòi khi đánh răng, rửa tay; thứ hai dùng nước rửa rau tưới hoa, xả bồn cầu; ngoài ra rút ngắn thời gian tắm. Chỉ cần mỗi người bắt đầu từ việc nhỏ là tiết kiệm được rất nhiều nước. Hãy cùng tiết kiệm từng giọt nước!"},{"who":"从济南泉水说起","meta":"Hướng B · bài nói ~1 phút 30","p":["济南被称为“泉城”，有七百多个天然泉。","可是前些年，由于气候干旱，再加上人们不注意节约用水，济南很多泉水都干了，有名的趵突泉也停止了流动。","后来，在政府和老百姓的共同努力下，人们减少使用地下水，节约每一滴水，2003年，趵突泉终于再次流出了甜美的泉水。","趵突泉的从有到无，又从无到有，让我明白了水有多么宝贵。我们一定要珍惜水资源，节约每一滴水。"],"vi":"Tế Nam được gọi là “thành phố suối”, có hơn 700 suối tự nhiên. Nhưng mấy năm trước, do khô hạn và người dân không chú ý tiết kiệm nước, nhiều suối đã cạn, suối Báo Đột cũng ngừng chảy. Sau đó nhờ chính quyền và người dân cùng nỗ lực, giảm dùng nước ngầm, năm 2003 suối Báo Đột lại chảy ra nước ngọt. Chuyện suối từ có thành không rồi từ không thành có giúp tôi hiểu nước quý giá biết bao. Chúng ta nhất định phải trân trọng tài nguyên nước."}],"write":[{"who":"范文 1 · 生活中的小事","meta":"Dạng HSK5 · khoảng 80 chữ","title":"节约每一滴水","p":["水是生命之源，可是很多人并不重视水。","比如，刷牙的时候一直开着水龙头，洗澡一洗就是半个小时。","其实节约用水很简单：随手关水龙头，用洗菜的水浇花。","只要大家都从小事做起，就能节约大量的水。"],"vi":"Bố cục 4 câu đủ 4 bước; 只要……就…… là mẫu câu chắc điểm."},{"who":"范文 2 · 缺水的地方","meta":"Dạng HSK5 · khoảng 80 chữ","title":"节约每一滴水","p":["我们每天打开水龙头，就有干净的水用。","可是世界上还有很多地方缺水，有的孩子每天要走很远的路才能打到一桶水。","想到这些，我觉得我们没有理由浪费水。","让我们珍惜每一滴水，别让最后一滴水成为我们的眼泪。"],"vi":"So sánh hai hoàn cảnh để tạo cảm xúc; câu kết dùng câu cảnh tỉnh nổi tiếng."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"节约每一滴水","p":["水是大自然送给我们的宝贵礼物。济南的泉水历史悠久，最早的文字记载可以推到3000多年前，老百姓对泉水充满感激之情。","可是前些年，由于气候干旱和人们不注意节水，济南很多泉水都干了，直到2003年趵突泉才再次流出泉水。","其实，一个人有没有节约的习惯，可以从他用水的小事上反映出来。刷牙时关上水龙头，用洗菜的水浇花，都能节约不少水。","水是生命之源，这就是我们要节约每一滴水的原因。"],"good":["历史悠久，最早的文字记载可以推到3000多年前","可以从他用水的小事上反映出来","这就是我们要节约每一滴水的原因"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 历史悠久，最早……可以推到…… · 可以从……上反映出来 · 这就是……的原因."}]},"w5":["节约","浪费","宝贵","资源","缺水","干旱","生命","保护","水龙头","养成","提醒","减少","行动","珍惜","充满","从而","形成","天然","悠久","反映","产生","重视","习惯"],"step_names":["① 点题：水的重要","② 问题：浪费与后果","③ 办法：怎么节约","④ 呼吁"],"timer":[["① 10s",10],["② 25s",25],["③ 35s",35],["④ 20s",20]],"build_title":"选一个方向，拼出你的倡议","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 生活中的小事":[["水是生命之源，没有水，就没有生命。","水是大自然送给我们的宝贵礼物。"],["可是在生活中，有的人刷牙时一直开着水龙头，有的人洗澡一洗就是半个小时，白白浪费了很多水。","我发现，学校里有的水龙头坏了也没人修，水就这样白白地流走了。"],["首先，刷牙、洗手时要随手关水龙头；其次，洗菜的水可以用来浇花。","我们可以缩短洗澡的时间，看到坏了的水龙头要马上告诉别人。"],["只要每个人都从小事做起，就能节约大量的水。让我们一起行动起来吧！","让我们从现在做起，节约每一滴水！"]],"B · 从济南泉水说起":[["济南被称为“泉城”，有七百多个天然泉。","前些年，济南的很多泉水都干了，这可急坏了爱泉的济南人。"],["由于气候干旱，再加上人们不注意节约用水，有名的趵突泉也停止了流动。","泉水干了，人们才发现，原来水并不是取之不尽的。"],["后来大家减少使用地下水，节约用水，2003年，趵突泉终于再次流出了泉水。","在政府和老百姓的共同努力下，泉水又回来了。"],["这让我明白了水有多么宝贵，我们一定要珍惜水资源。","这就是我们要节约每一滴水的原因。"]],"C · 缺水的地方":[["我们每天打开水龙头，就有干净的水用。","你知道吗？世界上还有很多人用不上干净的水。"],["在一些缺水的地区，有的孩子每天要走很远的路，才能打到一桶水。","在那些地方，一盆水要先洗菜，再洗衣服，最后还要用来浇地。"],["想到这些，我们每个人都应该养成节约用水的好习惯。","我们可以从洗手、刷牙这些小事做起，不浪费一滴水。"],["让我们珍惜每一滴水，别让最后一滴水成为我们的眼泪。","滴水成河，节约要从一点一滴做起。"]]},"quiz":[["Câu nào hợp làm câu mở bài?",["我们要节约用水，节约用水很重
