<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 09 · 别样鲁迅 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

""],["近代","jìndài","名","thời cận đại",0,"中国历史上一般指1840年到1919年这段时间。","这是近代新时尚。","我对中国近代历史很感兴趣。","Tôi rất hứng thú với lịch sử cận đại Trung Quốc.",["近代史","近代文学"],"“近代”一般指1840—1919年；“现代”一般指1919年以后。"],["时尚","shíshàng","名","mốt, thời trang",0,"当时流行的风气和习惯。","这是近代新时尚。","现在骑自行车上班成了一种时尚。","Bây giờ đạp xe đi làm trở thành một trào lưu.",["新时尚","追求时尚"],""],["写作","xiězuò","动","sáng tác",0,"写文章或进行文学创作。","仅从这一时期鲁迅写作的日记中……","他每天上午都在家写作。","Mỗi sáng anh ấy đều ở nhà viết lách.",["写作能力","写作水平"],""],["点心","diǎnxin","名","bánh ngọt, điểm tâm",0,"糕饼一类的食品。","他还很爱吃稻香村的点心。","下午饿了，可以吃点儿点心。","Buổi chiều đói thì ăn chút điểm tâm.",["一盒点心"],""],["作为","zuòwéi","动／介","coi như; với tư cách",1,"当作；也作介词，引出人的身份或事物的性质。","作为大作家、大学问家，鲁迅对吃很讲究……","作为学生，学习是最重要的事。","Là học sinh, học tập là việc quan trọng nhất.",["作为学生","作为礼物"],"见“注释”：作为。"],["学问","xuéwen","名","tri thức, học thức",0,"系统的知识；知识和学识。","作为大作家、大学问家……","他是一个很有学问的人。","Ông ấy là người rất có học vấn.",["有学问","大学问家"],""],["讲究","jiǎngjiu","动／形","chú ý, chú trọng; cầu kỳ",1,"重视，力求完美；精美。","鲁迅对吃很讲究……","他穿衣服很讲究。","Anh ấy ăn mặc rất cầu kỳ.",["讲究吃","讲究穿","讲究卫生","讲究方法"],""],["平均","píngjūn","动／形","tính trung bình",1,"把总数按份儿均匀计算。","平均每周都要去一次。","这个班学生的平均年龄是二十岁。","Độ tuổi trung bình của lớp này là 20.",["平均每天","平均数"],""],["胡同","hútòng","名","ngõ hẻm",0,"北京等城市的小街道。","广和居的大门就在他当时住的胡同的斜对面。","北京有很多古老的胡同。","Bắc Kinh có rất nhiều ngõ cổ.",["一条胡同","老胡同"],""],["位于","wèiyú","动","nằm ở",1,"在某个地方。","位于菜市口附近的广和居……","越南位于东南亚。","Việt Nam nằm ở Đông Nam Á.",["位于……附近","位于城市中心"],""],["首","shǒu","名／量","người (vật) đứng đầu; bài (thơ, hát)",0,"第一，最高的；量词，用于诗词、歌曲。","是北京“八大居”之首……","这首歌很好听。","Bài hát này rất hay.",["……之首","一首诗","一首歌"],""],["豪华","háohuá","形","sang trọng, lộng lẫy",0,"（生活、建筑、装饰等）非常好、花钱多。","广和居算不上豪华……","这家酒店非常豪华。","Khách sạn này rất sang trọng.",["豪华的酒店"],""],["光临","guānglín","动","đến dự, ghé thăm (lời mời trang trọng)",0,"敬辞，称客人来到。","这里特别欢迎文人的光临……","欢迎光临！","Hân hạnh chào đón quý khách!",["欢迎光临"],""],["交际","jiāojì","名／动","xã giao, sự giao thiệp",0,"人和人之间的来往。","他爱好交际……","她 81–1936), tên thật Chu Thụ Nhân, nhà văn hiện đại nổi tiếng nhất Trung Quốc; tác phẩm: “Nhật ký người điên”, “AQ chính truyện”, “Cố hương”; hai tập truyện “Gào thét” (呐喊) và “Bàng hoàng” (彷徨).","table":[["作品","拼音","Tiếng Việt"],["《狂人日记》","Kuángrén Rìjì","Nhật ký người điên"],["《阿Q正传》","Ā Q Zhèngzhuàn","AQ chính truyện"],["《故乡》","Gùxiāng","Cố hương"],["《呐喊》","Nàhǎn","Gào thét"],["《彷徨》","Pánghuáng","Bàng hoàng"]]},{"tab":"朋友聚会","title":"你和朋友聚会时常常去哪些地方？","type":"discuss","q":"问一下你的同学或朋友，他们跟朋友聚会时常常去哪些地方，最喜欢进行什么活动。","vn":"Hỏi bạn học hoặc bạn bè: khi tụ tập với bạn bè họ thường đi đâu, thích làm hoạt động gì nhất?","answer_zh":"我和朋友聚会时常常去火锅店，因为火锅又热闹又好吃，大家可以一边吃一边聊天。有时候我们也去咖啡馆或者KTV唱歌。","answer_vn":"Gợi ý: quán lẩu (火锅店) — vừa náo nhiệt vừa ngon; quán cà phê (咖啡馆); hát karaoke (KTV唱歌).","table":[["常去的地方","进行的活动","介绍"],["火锅店","吃火锅、聊天","又热闹又好吃"],["咖啡馆","喝咖啡、看书","安静，适合聊天"],["KTV","唱歌","适合很多人一起玩"]]},{"tab":"名人与美食","title":"你知道哪些名人和美食的故事？","type":"discuss","q":"很多美食都和名人有关系，比如“东坡肉”和苏轼。你知道哪些名人和美食的故事？","vn":"Nhiều món ngon gắn với người nổi tiếng, như “thịt Đông Pha” và Tô Thức. Bạn biết câu chuyện nào về danh nhân và món ăn?","answer_zh":"“东坡肉”据说是苏轼发明的，他不但是大文学家，也是一个美食家。越南的“chả cá Lã Vọng”也有很长的历史，很多名人都去吃过。","answer_vn":"Câu hỏi dẫn vào bài khóa: Lỗ Tấn — nhà văn lớn, đồng thời là “行家” về ăn uống."}],"GAME":{"fill":[["这一点在民国时期{}得尤其突出。","表现",["表现","表达","表示","表演"]],["就算是个{}的行家……","地道",["地道","知道","道理","味道"]],["不但会吃，还会{}动手做……","亲自",["亲自","自己","自然","亲切"]],["{}大作家、大学问家，鲁迅对吃很讲究……","作为",["作为","因为","成为","以为"]],["鲁迅对吃很{}……","讲究",["讲究","研究","讲述","追究"]],["{}每周都要去一次。","平均",["平均","平时","平常","平安"]],["{}菜市口附近的广和居……","位于",["位于","关于","对于","善于"]],["广和居算不上{}，但却很适合朋友在这里聚会……","豪华",["豪华","繁华","华丽","热情"]],["虽然{}知道自己有胃病……","明明",["明明","明白","明显","说明"]],["郁达夫在1933年{}作诗形容他……","曾经",["曾经","已经","经常","经过"]]],"order":[["鲁迅|对吃|很讲究。"],["平均|每周|都要去|一次。"],["广和居|算不上|豪华。"],["这里|特别欢迎|文人的|光临。"],["他是|每顿饭|必喝酒的|人。"],["描写得|十分|形象。"]]},"GOOD":[{"zh":"美食很大一部分是靠名人推动的，这一点在民国时期表现得尤其突出","vn":"ẩm thực phần lớn là nhờ người nổi tiếng thúc đẩy, điều này thể hiện đặc biệt rõ vào thời Dân Quốc","why":"Mở bài kiểu “nêu nhận định + chứng minh bằng thời kỳ”: <b>A 很大一部分是靠 B……的，这一点在……表现得尤其突出<\/b>.","frame":"A 很大一部分是靠 B + 动词 + 的，这一点在……表现得尤其突出","apply":"一个人的成功很大一部分是靠坚持的，这一点在他身上表现得尤其突出。","apply_vn":"Thành công của một người phần lớn nhờ kiên trì, điều này thể hiện đặc biệt rõ ở anh ấy."},{"zh":"在吃喝这件事上，就算是个地道的行家","vn":"về chuyện ăn uống thì có thể coi là một người sành sỏi chính hiệu","why":"<b>在……这件事上，（算）是个地道的……<\/b>: khen một người giỏi ở một lĩnh vực — rất hợp đề “我喜欢的一位名人”.","frame":"在 + 某方面 + 这件事上，+ 某人 + 算是个地道的 + 行家／专家","apply":"在做菜这件事上，我妈妈算是个地道的行家。","apply_vn":"Về chuyện nấu ăn, mẹ tôi có thể coi là dân sành chính hiệu."},{"zh":"作为大作家、大学问家，鲁迅对吃很讲究","vn":"là một đại văn hào, đại học giả, Lỗ Tấn rất cầu kỳ trong chuyện ăn uống","why":"<b>作为 + thân phận，某人对……很讲究／很重视<\/b>: giới thiệu thân phận rồi nêu đặc điểm — câu giới thiệu nhân vật rất chuẩn.","frame":"作为 + 身份，+ 某人 + 对……很讲究／很重视／很认真","apply":"作为一名老师，她对学生的发音很讲究。","apply_vn":"Là một giáo viên, cô ấy rất chú trọng phát âm của học sinh."},{"zh":"广和居算不上豪华，但却很适合朋友在这里聚会、热闹","vn":"Quảng Hòa Cư chẳng thể gọi là sang trọng, nhưng lại rất hợp để bạn bè tụ tập vui vẻ","why":"<b>算不上……，但却……<\/b>: hạ một mặt để nâng mặt khác — đánh giá khách quan, tự nhiên.","frame":"A 算不上 + （优点），但却 + 很……","apply":"他算不上最聪明的学生，但却是最努力的一个。","apply_vn":"Cậu ấy không phải học sinh thông minh nhất, nhưng lại là người chăm chỉ nhất."},{"zh":"虽然明明知道自己有胃病，不应该喝酒，但却很难戒掉","vn":"dù biết rõ mình bị đau dạ dày, không nên uống rượu, nhưng lại rất khó bỏ","why":"<b>虽然明明知道……，但却……<\/b>: nói về <b>khuyết điểm<\/b> của một người một cách chân thực, làm nhân vật “có máu thịt”.","frame":"虽然明明知道 + ……，但却 + 很难……／还是……","apply":"我虽然明明知道熬夜对身体不好，但却很难改掉这个习惯。","apply_vn":"Tôi dù biết rõ thức khuya có hại, nhưng lại rất khó bỏ thói quen này."}],"GRAMMAR":[{"word":"算","py":"suàn","pos":"动词","forms":["算（是）+ 名词／形容词（= 认作、当作）：算是个行家、算很近","算 + 了（= 作罢、不再计较）：算了吧","算得上／算不上"],"vn":"<b>算<\/b> ① <b>coi là, xem như<\/b> (= 认作、当作): 就算是个地道的行家; 这钱就算我借你的. ② <b>算了<\/b>: <b>thôi, bỏ đi<\/b> — không tính toán nữa. Bổ ngữ khả năng: <b>算得上 / 算不上<\/b> (có thể / không thể coi là).","text":"例如著名的文学家鲁迅，在吃喝这件事上，就算是个地道的行家……","ex":[["这钱就算我借你的，将来你有了的时候再还我。","Tiền này coi như tôi cho bạn mượn, sau này có thì trả. (coi là)"],["不就是一个空瓶子吗？扔掉算了。","Chẳng qua là cái chai rỗng thôi mà? Vứt đi cho xong. (thôi)"],["算了吧，你跑得再快，也追不上会飞的鸟啊。","Thôi đi, bạn chạy nhanh mấy cũng không đuổi kịp con chim biết bay đâu. (thôi)"]],"err":[["❌ 广和居不算上豪华。","✅ 广和居算不上豪华。","Bổ ngữ khả năng: 算得上 / 算不上."],["❌ 他算一个行家。","✅ 他算是一个行家。／他算得上一个行家。","算 + danh từ thường thêm 是 hoặc dùng 算得上."]],"book":[["从我家去公司，坐几站地铁就到了，____________。（算）","Gợi ý: coi như là rất gần.","从我家去公司，坐几站地铁就到了，算是很近的"],["A：后天是孩子的生日，你打算怎么表示一下呀？<br>B：____________。（算）","Gợi ý: mua cho con quyển sách, coi như quà sinh nhật.","我给他买了一套书，就算是生日礼物吧"],["A：电影几点开始？吃好饭再去，时间是不是有点儿紧张啊？<br>B：____________。（算了）","Gợi ý: thôi, xem suất sau.","是有点儿紧张，算了，我们看下一场吧"]],"drill":[["“算”在这里是什么意思？ 这件衣服才一百块，算很便宜了。",["认作、当作","作罢、不再计较"],0,"Coi là rẻ."],["“算”在这里是什么意思？ 太远了，算了，我们不去了。",["认作、当作","作罢、不再计较"],1,"算了 = thôi."],["“算”放在哪里？ 这事你找我<u>A<\/u>商量<u>B<\/u>找对人<u>C<\/u>了。",["A","B","C"],1,"算找对人了 (课本练习3)."]]},{"word":"作为","py":"zuòwéi","pos":"动词／介词","forms":["动词：把 A 作为 B（= 看作、当作）","介词：作为 + 身份／性质，……（引出人的身份或事物的性质）"],"vn":"<b>作为<\/b> ① động từ: <b>coi như, làm<\/b> — 把 A 作为 B (lấy A làm B). ② giới từ, đầu câu: <b>với tư cách là, là<\/b> — dẫn ra <b>thân phận<\/b> của người hoặc <b>tính chất<\/b> của sự vật: 作为学生，……; 作为主要生产国之一，…….","text":"作为大作家、大学问家，鲁迅对吃很讲究，吃的内容在他的日记里占了很大一部分。","ex":[["北海公园离家最近，所以我把那儿作为每晚散步的去处。","Công viên Bắc Hải gần nhà nhất nên tôi lấy đó làm nơi đi dạo mỗi tối. (động từ)"],["经理要请我去吃顿饭，说是作为我加班的表扬。","Giám đốc mời tôi đi ăn, nói là để khen thưởng tôi làm thêm giờ. (động từ)"],["西红柿是世界上种植非常普遍的蔬菜，中国作为主要生产国之一也在扩大它的种植面积。","Cà chua là loại rau trồng rất phổ biến; Trung Quốc, là một trong những nước sản xuất chính, cũng đang mở rộng diện tích trồng. (giới từ)"]],"err":[["❌ 作为我是学生，我要努力学习。","✅ 作为学生，我要努力学习。","作为 + danh từ thân phận, không thêm chủ ngữ + 是."],["❌ 他作为一名医生了。","✅ 他成为了一名医生。","“trở thành” dùng 成为; 作为 là “với tư cách”."]],"book":[["____________，治病救人是我们的职责。（作为）","Gợi ý: là bác sĩ.","作为医生，治病救人是我们的职责"],["A：你做的面包比外边卖的都好吃，你真应该开个店。<br>B：我喜欢现在的工作，____________。（作为）","Gợi ý: làm bánh chỉ là sở thích.","我喜欢现在的工作，做面包只是作为我的爱好"],["A：小明每天从早忙到晚，又是学游泳，又是弹钢琴，可学习成绩下降了很多。<br>B：____________。（作为）","Gợi ý: là học sinh thì học là quan trọng nhất.","作为学生，学习才是最重要的，别的活动应该少一点儿"]],"drill":[["“作为”在这里是什么词？ 作为老师，我应该关心每个学生。",["动词","介词"],1,"Dẫn ra thân phận → giới từ."],["“作为”在这里是什么词？ 我把这本书作为生日礼物送给他。",["动词","介词"],0,"把 A 作为 B → động từ."],["Câu nào đúng?",["作为一名记者，他去过很多地方。","作为他是记者，他去过很多地方。","他作为了记者，去过很多地方。"],0,"作为 + thân phận, đầu câu."]]},{"word":"曾经","py":"céngjīng","pos":"副词","forms":["曾经 + 动词（+ 过）（表示从前有过某种行为或情况）"],"vn":"<b>曾经<\/b> là phó từ: <b>đã từng<\/b> — từng có hành vi/tình huống nào đó <b>trong quá khứ<\/b>, thường đã kết thúc. Hay đi với <b>过<\/b>. Phủ định thường dùng <b>没（有）……过<\/b>, không nói “不曾经”.","text":"郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”……","ex":[["鲁迅曾经说他是将别人喝牛奶、咖啡的时间用来学习。","Lỗ Tấn từng nói ông dùng thời gian người khác uống sữa, cà phê để học."],["孔子曾经带着学生周游各国14年，传播他的思想。","Khổng Tử từng dẫn học trò chu du các nước 14 năm, truyền bá tư tưởng."],["我曾经在中国学过一年汉语。","Tôi từng học tiếng Trung một năm ở Trung Quốc."]],"err":[["❌ 我不曾经去过上海。","✅ 我没去过上海。","Phủ định: 没（有）……过."],["❌ 我曾经在这儿工作三年了，现在还在。","✅ 我已经在这儿工作三年了。","Việc còn tiếp diễn dùng 已经……了, không dùng 曾经."]],"book":[["A：你和李阳好像很熟啊，你们以前就认识？<br>B：对，____________。（曾经）","Gợi ý: từng làm cùng công ty.","对，我们曾经在一个公司工作过"],["A：你来北京才半年，汉语怎么说得这么好？<br>B：哦，是这样的，____________。（曾经）","Gợi ý: từng học ở trường đại học nước mình hai năm.","哦，是这样的，我曾经在我们国家的大学学过两年汉语"],["A：____________。（曾经）<br>B：真的吗？我最近也迷上了摄影，以后遇到问题可以请教他了。","Gợi ý: nghe nói Lý Dương từng đoạt giải nhiếp ảnh.","听说李阳曾经拿过摄影比赛的大奖"]],"drill":[["选择：人们____把西红柿当做有害的果子。",["曾经","已经"],0,"Quá khứ, nay không còn (课本练习2)."],["Câu phủ định nào đúng?",["我没去过长城。","我不曾经去过长城。","我曾经没去过长城。"],0,"没……过."],["“曾经”常和哪个词一起用？",["过","着","呢"],0,"曾经……过."]]}],"HSK":{"r1":[{"text":["小王请朋友去一家老饭馆吃饭。菜一上来，朋友就说：“这家的菜做得真{36}，跟我小时候在北京吃的一模一样。”小王很得意：“那当然，这家店已经开了一百多年了。”吃完饭结账时，小王一看账单，{37}。朋友笑着问：“怎么了？”小王说：“{38}，没想到价格也是‘一百多年’的——一百多块一个菜！”"],"qs":[{"n":36,"o":["地道","豪华","大方","平均"],"a":0,"why":"“跟小时候在北京吃的一模一样”，说明菜的味道很正宗，用“地道”。"},{"n":37,"o":["高兴得什么似的","吓了一跳","马上睡着了","哈哈大笑"],"a":1,"why":"后文说价格很贵，所以看到账单时吃了一惊。"},{"n":38,"o":["菜太少了","我忘了带钱","我只知道这家店历史悠久","服务员态度不好"],"a":2,"why":"前文说店开了一百多年，这里用“历史悠久”和价格“一百多”形成幽默。"}]},{"text":["“老字号”是指那些历史悠久、{39}的商店，比如北京的全聚德烤鸭店、稻香村点心店等。这些店之所以能一直开下去，{40}，一是产品质量好，二是很讲究服务。不过，近些年来，一些老字号{41}，顾客越来越少。专家认为，老字号既要保存传统，{42}，这样才能吸引更多的年轻人。"],"qs":[{"n":39,"o":["很少有人知道","在老百姓中很有名","刚刚开业","只卖外国商品"],"a":1,"why":"老字号是历史悠久、很有名的商店。"},{"n":40,"o":["是因为老板很有钱","主要有两个原因","所以很便宜","但是不太好吃"],"a":1,"why":"后面“一是……，二是……”列出两个原因。"},{"n":41,"o":["因为不愿意改变","因为太受欢迎","因为价格太低","因为离得太近"],"a":0,"why":"后文专家说“既要保存传统，又要……”，说明问题在于不改变。"},{"n":42,"o":["也要关门","又要不断创新","还要提高价格","就不用管年轻人"],"a":1,"why":"“既……又……”，保存传统和不断创新并列，才能吸引年轻人。"}]}],"r2":[{"start":46,"paras":["传说北宋时，大文学家苏轼在杭州做官，他带着老百姓治理西湖，做了很多好事。","苏轼收到猪肉后，觉得应该和大家一起分享，就让家人把肉切成方块，用自己的方法做成红烧肉。","老百姓非常感激他，过年的时候，纷纷给他送来猪肉和酒，表达谢意。","后来，人们就把这种肉叫作“东坡肉”，它也成了杭州的一道名菜。","做好以后，他把肉分给参加治理西湖的人吃，大家都说味道特别好。"],"ans":["A","C","B","E","D"],"why":"苏轼治理西湖（A）→ 百姓送猪肉（C）→ 苏轼做成红烧肉（B）→ 分给大家吃（E）→ 东坡肉的由来（D）。"}],"r3":[{"text":["胡同是北京特有的一种小街道。据说，北京最多的时候有六千多条胡同。胡同两边是一个个四合院，人们在这里生活，在这里长大，形成了独特的“胡同文化”。","在胡同里住久了，邻居们彼此都很熟悉。夏天的傍晚，大家坐在胡同口一边乘凉一边聊天；谁家有了困难，邻居们都会主动帮忙。很多老北京人说，<u><b>胡同里最珍贵的不是房子，而是人和人之间的感情<\/b><\/u>。","随着城市的发展，很多胡同被拆了，人们搬进了高楼。住在楼房里虽然方便了，可是邻居之间却很少来往，有的住了好几年都不认识对门的人。","近年来，北京开始重视保护胡同。一些胡同经过修整，保存了原来的样子，还开了咖啡馆、小书店，吸引了很多游客。人们希望，胡同文化能一直流传下去。"],"qs":[{"n":56,"s":"关于胡同，可以知道：","o":["是北京特有的小街道","现在有一万多条","两边都是高楼","只有游客住"],"a":0,"why":"第一段：胡同是北京特有的一种小街道。"},{"n":57,"s":"第二段主要讲的是：","o":["胡同的历史","胡同里邻居之间的感情","四合院怎么建","怎样乘凉"],"a":1,"why":"第二段讲邻居熟悉、互相帮忙。"},{"n":58,"s":"画线句子的意思是：","o":["胡同的房子很贵","人和人之间的感情最珍贵","大家都不喜欢胡同","胡同里的房子很新"],"a":1,"why":"“不是房子，而是人和人之间的感情”。"},{"n":59,"s":"根据最后一段，现在北京对胡同的态度是：","o":["全部  z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><g transform=\"translate(190.0,66.0) scale(0.5,0.5)\"><g stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M8.0 0.0 L24.0 0.0\"/><path d=\"M6.9 4.0 L20.8 12.0\"/><path d=\"M4.0 6.9 L12.0 20.8\"/><path d=\"M0.0 8.0 L0.0 24.0\"/><path d=\"M-4.0 6.9 L-12.0 20.8\"/><path d=\"M-6.9 4.0 L-20.8 12.0\"/><path d=\"M-8.0 0.0 L-24.0 0.0\"/><path d=\"M-6.9 -4.0 L-20.8 -12.0\"/><path d=\"M-4.0 -6.9 L-12.0 -20.8\"/><path d=\"M-0.0 -8.0 L-0.0 -24.0\"/><path d=\"M4.0 -6.9 L12.0 -20.8\"/><path d=\"M6.9 -4.0 L20.8 -12.0\"/><\/g><circle r=\"3\" fill=\"#fff\"/><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: rủ bạn → đến quán → ăn uống, trò chuyện → chụp ảnh, hẹn lần sau.","Có thể dùng: 呼朋唤友、算不上豪华、地道、有胃口、招待."],"sample":"周末，小李在网上呼朋唤友，约了五个好朋友一起吃饭。他们来到胡同里的一家老饭馆。这家饭馆算不上豪华，但却非常热闹，墙上还挂着很多老照片。老板很好客，亲自给他们介绍了几个拿手菜。菜一上来，大家都说做得很地道，样样都让人有胃口。他们一边吃一边聊天，从学习聊到工作，笑声一直没停。吃完饭，大家拍了一张合影，约好下个月再来这里聚会。","svn":"Cuối tuần Tiểu Lý rủ năm người bạn đi ăn ở quán cổ trong ngõ; quán không sang nhưng rất náo nhiệt, ông chủ hiếu khách tự giới thiệu món; món ăn chuẩn vị, vừa ăn vừa trò chuyện; cuối cùng chụp ảnh chung, hẹn tháng sau."},"w72":{"prompt":"很多年轻人喜欢名人，有的人甚至花很多时间和钱去“追星”。有人认为名人能给年轻人带来积极的影响，也有人认为“追星”会影响学习和生活。请写一篇不少于200字的作文，谈谈你的看法。","vn":"Nhiều người trẻ thích người nổi tiếng, thậm chí tốn nhiều thời gian, tiền bạc để “thần tượng”. Có người cho rằng người nổi tiếng ảnh hưởng tích cực, có người cho rằng ảnh hưởng học tập và cuộc sống. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"向名人学什么","tips":["Nêu quan điểm (vừa có lợi vừa có hại, quan trọng là học gì) → lợi ích + ví dụ → tác hại → cách thần tượng đúng → kết luận.","Dùng khung 好句: 作为……，…… · 算不上……，但却…… · 虽然明明知道……，但却……"],"sample":"很多年轻人都有自己喜欢的名人。我认为，喜欢名人本身没有错，关键是要知道向他们学什么。\n一方面，名人能给年轻人带来积极的影响。比如鲁迅，作为大作家，他敢说真话，用笔做武器；居里夫人遇到再多困难也没有放弃。了解他们的故事，能让我们更有努力的动力。\n另一方面，如果只关心名人的穿着和私生活，花大量的时间和钱去“追星”，就会影响学习和生活。有的人虽然明明知道这样不好，但却很难控制自己。\n所以，我们应该理性地喜欢名人，学习他们的精神，而不是模仿他们的外表。这样，名人才能真正成为我们成长路上的榜样。","svn":"Bài nghị luận: quan điểm → 一方面 ảnh hưởng tích cực (Lỗ Tấn, Marie Curie) → 另一方面 tác hại khi chạy theo bề ngoài → 所以 thần tượng có lý trí, học tinh thần."}},"PRACTICE":{"ex1":{"bank":["戒","首","保存","地道","讲究","形象"],"items":[["著名的文学家、语言学家刘半农1920年写了一{}题为《教我如何不想她》的小诗，流传至今。",["首"]],["筷子是中餐最主要的进餐用具，在使用上也有很多{}。",["讲究"]],["你咳嗽得这么厉害，真得{}烟了！",["戒"]],["作为一家北京的川菜馆，能做出如此{}的麻婆豆腐真是不容易。",["地道"]],["新鲜的葡萄不易{}，因此其价格也比较高。",["保存"]],["公司这次要求招聘{}好的职员。",["形象"]]]},"ex2":[["他平时成绩一般，但在今晚的比赛中____得很突出。",["表达","表现"],1],["我对从1840年到1919年的中国____历史很感兴趣。",["近代","现代"],0],["我今天胃不太舒服，所以没什么____。",["胃","胃口"],1],["人们____把西红柿当做有害的果子。",["曾经","已经"],0]],"ex3":[["这事你找我<u>A<\/u>商量<u>B<\/u>找对人<u>C<\/u>了，这方面我可懂得<u>D<\/u>不少。","算",1,"这事你找我商量算找对人了，这方面我可懂得不少。"],["我<u>A<\/u>听说总理<u>B<\/u>将<u>C<\/u>参加这次活动<u>D<\/u>。","亲自",2,"我听说总理将亲自参加这次活动。"],["请写下与你<u>A<\/u>关系最<u>B<\/u>亲近的六个朋友，记下他们每个人的月收入，然后<u>C<\/u>算出他们月收入的<u>D<\/u>数。","平均",3,"……然后算出他们月收入的平均数。"],["<u>A<\/u>这<u>B<\/u>怎么<u>C<\/u>是个缺点呢？<u>D<\/u>是个优点呀！","明明",3,"这怎么是个缺点呢？明明是个优点呀！"]],"ex4":[["鲁迅与美食","算、亲自、作为、讲究","鲁迅在吃喝这件事上，算是个地道的行家，不但会吃，还会亲自动手做。作为大作家，他对吃很讲究，日记里记了很多吃的内容。"],["广和居","平均、位于、光临、交际、招待、胃口","鲁迅最喜欢广和居，平均每周去一次。广和居位于菜市口附近，欢迎文人光临。鲁迅爱好交际，常在这里请朋友吃饭，有时也让饭馆送菜到家里招待朋友。这里的菜样样都让人有胃口。"],["鲁迅与酒","胃、戒、保存、曾经","鲁迅有胃病，明明不应该喝酒，却很难戒掉。现在保存的资料说，他和郁达夫一起喝酒最多。郁达夫曾经写诗形容他喝醉的样子。"]],"ext":{"title":"扩展 · 话题：社会","words":[["道德","dàodé","đạo đức"],["传统","chuántǒng","truyền thống"],["风俗","fēngsú","phong tục"],["制度","zhìdù","chế độ"],["秩序","zhìxù","trật tự"],["权力","quánlì","quyền lực"],["权利","quánlì","quyền lợi"],["义务","yìwù","nghĩa vụ"],["文明","wénmíng","văn minh"],["人口","rénkǒu","dân số"],["集体","jítǐ","tập thể"]],"items":[["公司有严格的管理{}，保证了各项工作的正常进行。","制度"],["每一个学龄儿童都有受教育的{}。","权利"],["西安，古称“长安”，是世界四大{}古都之一。","文明"],["乘车、购物要排队，好的公共{}需要我们每个人的努力。","秩序"]]}},"TEXT":[{"title":"鲁迅与美食","sub":"地道的行家","paras":["美食很大一部分是靠名人推动的，这一点在民国时期表现得尤其突出。例如著名的文学家鲁迅，在吃喝这件事上，就算是个地道的行家，不但会吃，还会亲自动手做，对许多美食都有独特的见解。这是近代新时尚。"],"idea":"Ẩm thực phần lớn nhờ <b>người nổi tiếng<\/b> thúc đẩy, thời Dân Quốc càng rõ. Nhà văn <b>Lỗ Tấn<\/b> về chuyện ăn uống là một <b>“dân sành” chính hiệu<\/b>: không chỉ biết ăn mà còn tự tay nấu, có <b>kiến giải độc đáo<\/b> về nhiều món.","qs":[["根据第一段，美食很大一部分是靠什么推动的？",["名人","饭馆","政府"],0],["在吃喝这件事上，鲁迅是一个什么样的人？",["什么都不懂","地道的行家","只会吃不会做"],1],["“近代新时尚”指的是什么？",["名人对美食有研究、亲自做菜","去外国留学","写日记"],0]]},{"title":"北京的餐馆","sub":"日记里的65家","paras":["北京是鲁迅长期生活过的城市，仅从这一时期鲁迅写作的日记中，我们发现他去过的知名餐馆就有65家，另外，他还很爱吃稻香村的点心。作为大作家、大学问家，鲁迅对吃很讲究，吃的内容在他的日记里占了很大一部分。在众多餐馆里，鲁迅去得最多、最喜欢的是广和居，平均每周都要去一次。"],"idea":"Chỉ riêng nhật ký thời ở Bắc Kinh đã ghi <b>65 nhà hàng<\/b> nổi tiếng Lỗ Tấn từng đến; ông còn mê bánh của <b>Đạo Hương Thôn<\/b>. Là đại văn hào, ông rất <b>cầu kỳ<\/b> chuyện ăn; chuyện ăn chiếm phần lớn nhật ký. Ông thích nhất <b>Quảng Hòa Cư<\/b>, trung bình tuần nào cũng đến.","qs":[["从鲁迅的日记中可以知道，他去过多少家知名餐馆？",["15家","56家","65家"],2],["鲁迅还很爱吃什么？",["稻香村的点心","广东菜","西餐"],0],["鲁迅平均多长时间去一次广和居？",["每天","每周","每月"],1]]},{"title":"广和居","sub":"适合朋友聚会的地方","paras":["鲁迅经常到这家店的一个重要原因是距离近，广和居的大门就在他当时住的胡同的斜对面。位于菜市口附近的广和居是北京“八大居”之首，在民国时期非常出名。广和居算不上豪华，但却很适合朋友在这里聚会、热闹。这里特别欢迎文人的光临，为他们的聚会创造了很好的条件。广和居院里分成大小不同的各种房间，有一个人的，有三五人小聚的，也有十多个人大聚会的。这大大满足了鲁迅爱和朋友吃饭的要求。他爱好交际，大方好客，常呼朋唤友，多数是三五个人一起吃，有时甚至会直接让广和居送外卖到家里，在家招待朋友。当然最重要的还是因为广和居有鲁迅喜欢的菜。那里的菜既有高档的，也有适合普通百姓的，样样都让人有胃口。"],"idea":"Lý do: <b>gần<\/b> — cửa quán ngay chéo đối diện ngõ nhà ông; quán đứng đầu “bát đại cư”, <b>không sang trọng<\/b> nhưng rất hợp tụ tập, có phòng to nhỏ đủ loại. Lỗ Tấn <b>thích giao du, hào phóng, hiếu khách<\/b>, hay rủ bạn bè, có khi gọi đồ về nhà đãi khách. Quan trọng nhất: quán có món ông thích, cao cấp lẫn bình dân, món nào cũng <b>hấp dẫn<\/b>.","qs":[["鲁迅经常去广和居的一个重要原因是什么？",["价格很便宜","距离近","老板是他的朋友"],1],["关于广和居，下面哪个说法是对的？",["非常豪华","只有大房间","很适合朋友聚会"],2],["鲁迅是一个什么样的人？",["不喜欢交际","大方好客，常呼朋唤友","只喜欢一个人吃饭"],1]]},{"title":"鲁迅与酒","sub":"醉眼蒙眬上酒楼","paras":["鲁迅也爱喝酒，虽然明明知道自己有胃病，不应该喝酒，但却很难戒掉。他是每顿饭必喝酒的人。现在保存的历史资料记载，他和郁达夫一起喝酒的次数最多。鲁迅酒量不大，经常喝醉，而且在喝酒的过程中烟不离手。郁达夫在1933年曾经作诗形容他：“醉眼蒙眬上酒楼，彷徨呐喊两悠悠”，描写得十分形象。"],"idea":"Lỗ Tấn cũng mê rượu: biết rõ mình <b>đau dạ dày<\/b> mà vẫn khó <b>bỏ<\/b>, bữa nào cũng uống. Ông uống với <b>Úc Đạt Phu<\/b> nhiều nhất; tửu lượng kém, hay say, tay không rời thuốc. Năm 1933 Úc Đạt Phu làm thơ tả ông: “醉眼蒙眬上酒楼，彷徨呐喊两悠悠” — rất <b>sinh động<\/b>.","qs":[["鲁迅为什么不应该喝酒？",["他有胃病","医生不让他喝","酒太贵了"],0],["鲁迅和谁一起喝酒的次数最多？",["稻香村的老板","郁达夫","他的学生"],1],["郁达夫的诗中“彷徨”“呐喊”指的是什么？",["两家酒楼","鲁迅的两部小说集","两个朋友"],1]]}],"TEXT_EXTRA":{"compare_title":"认识鲁迅","compare_head":["项目","内容","Tiếng Việt"],"compare":[["原名","周树人","tên thật Chu Thụ Nhân"],["生卒","1881—1936，浙江绍兴人","1881–1936, người Thiệu Hưng, Chiết Giang"],["笔名由来","1918年发表《狂人日记》时开始使用","dùng từ khi đăng “Nhật ký người điên” (1918)"],["经历","留学日本学医，后从事文学创作","du học Nhật học y, sau chuyển sang văn chương"],["小说集","《呐喊》《彷徨》","“Gào thét”, “Bàng hoàng”"]],"bg":"鲁迅（1881—1936），浙江绍兴人，原名周树人，“鲁迅”是他在1918年5月发表中国第一篇白话小说《狂人日记》时开始使用的笔名。他曾留学日本学习医学，后从事（cóngshì）文学创作。在中国，鲁迅是中国现代文学史上一位地位独特、影响深远的作家。他的作品思想（sīxiǎng）深刻，充满批判（pīpàn）性，像是用笔做武器在战斗。《呐喊》和《彷徨》是他的两部小说集。","bg_vn":"Lỗ Tấn (1881–1936), người Thiệu Hưng, tên thật Chu Thụ Nhân; bút danh “Lỗ Tấn” dùng từ khi đăng truyện bạch thoại đầu tiên “Nhật ký người điên” (1918). Từng du học Nhật học y, sau chuyển sang sáng tác văn học. Tác phẩm tư tưởng sâu sắc, giàu tính phê phán, như dùng ngòi bút làm vũ khí chiến đấu.","discuss_title":"讨论话题：我喜欢的一位名人","discuss":["你喜欢的这位名人是谁？简单介绍一下有关他/她的情况。","你如何评价他/她？你喜欢他/她的理由是什么？","你觉得他/她对你有影响吗？有什么影响？"],"write":"请以“我喜欢的一位名人”为题，介绍一位你熟悉的著名人物。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我喜欢的一位名人”为题，介绍一位你熟悉的著名人物","topic_vn":"Viết bài với đầu đề “Một người nổi tiếng tôi yêu thích”, giới thiệu một nhân vật nổi tiếng bạn quen thuộc","intro":"Dạng đề giới thiệu nhân vật (介绍人物) · Người đó là ai → thành tựu / câu chuyện → lý do bạn thích (cả mặt “khác lạ”) → ảnh hưởng tới bạn · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我喜欢的一位名人”：介绍 + 评价 + 影响","lead":"Đề có ba câu hỏi gợi ý của sách: <b>他/她是谁<\/b> (giới thiệu), <b>你如何评价，喜欢的理由<\/b> (đánh giá), <b>对你有什么影响<\/b> (ảnh hưởng). Bài khóa “别样鲁迅” cho một bí quyết: kể <b>một mặt ít ai biết<\/b> (Lỗ Tấn sành ăn, mê rượu) làm nhân vật sống động hơn hẳn việc liệt kê thành tích.","parts":[["我喜欢的","Phải có tình cảm, lý do cá nhân: 我喜欢他，是因为……"],["一位","Chỉ <b>một<\/b> người — đừng viết lan man nhiều người."],["名人","Người nổi tiếng thật (nhà văn, nhà khoa học, vận động viên…). Thông tin phải chính xác: tên, thời đại, tác phẩm/thành tựu."],["（课本）尽量用上本课生词，不少于100字","Dùng: 作为、曾经、算是、地道、讲究、亲自、表现、突出、形容、形象… và khung 好句 của bài khóa."]],"traps":[["Chỉ liệt kê thành tích","Năm sinh, tác phẩm, giải thưởng… như tra từ điển → thiếu “我喜欢”."],["Không có lý do","Viết “他很有名，所以我喜欢他” → lý do yếu."],["Thông tin sai","Nhầm năm, nhầm tác phẩm bị trừ điểm. Không chắc thì viết chung: 十九世纪、写过很多有名的作品."],["Chọn đề tài nhạy cảm","Tránh nhân vật chính trị gây tranh cãi; chọn nhà văn, nhà khoa học, vận động viên… an toàn hơn."]],"link":"<b>Liên hệ bài 9:<\/b> khung 好句 “作为……，……对……很讲究” và “在……这件事上，算是个地道的……” dùng để giới thiệu; “虽然明明知道……，但却……” để kể khuyết điểm đáng yêu; “曾经” để kể chuyện quá khứ. Bài 7 có khung “善于……，被称为……” cũng rất hợp."},"steps":[["①","点题：他是谁","Mở bài: tên, thân phận, thời đại; vì sao nổi tiếng (1–2 câu).","我喜欢的名人是……，他是……"],["②","介绍：成就和故事","Thành tựu chính + một câu chuyện / một mặt ít người biết.","他曾经……"],["③","评价：喜欢的理由","<b>Trọng tâm.<\/b> Nêu 1–2 lý do cụ thể, có thể dùng 作为……","我喜欢他，是因为……"],["④","影响","Kết: người đó ảnh hưởng tới bạn thế nào.","他让我明白了……"]],"formula":["他是谁","成就 + 一个故事","我喜欢他，因为……","他对我的影响"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 鲁迅","Lỗ Tấn","Dùng ngay tư liệu bài khóa và phần 背景分析: nhà văn lớn + mặt sành ăn.","《呐喊》、广和居"],["B · 阮攸（Nguyễn Du）","đại thi hào Việt Nam","Giới thiệu nhà thơ Việt Nam và tác phẩm 《金云翘传》 (Truyện Kiều).","越南的大诗人"],["C · 居里夫人","Marie Curie","Nhà khoa học hai lần đoạt giải Nobel, kiên trì nghiên cứu.","两次获得诺贝尔奖"],["D · 你自己的选择","nhân vật bạn chọn","Một vận động viên, nghệ sĩ… bạn hiểu rõ.","运动员、音乐家"]],"notes":[["Một chi tiết “别样”","Một thói quen, một câu nói, một câu chuyện nhỏ làm nhân vật sống động (như Lỗ Tấn mê ăn)."],["Lý do phải cụ thể","Không chỉ “他很伟大” mà là “他遇到困难从不放弃”."],["Câu kết","Nói ảnh hưởng: “他让我明白了……”, “我也想像他一样……”."]],"rule":"<b>Nguyên tắc HSK5:<\/b> thông tin về người thật phải chính xác — chỉ viết điều bạn chắc chắn. Câu giới thiệu thân phận dùng <b>作为……<\/b>; chuyện quá khứ dùng <b>曾经……过<\/b>.","patterns":[["① 点题","我喜欢的一位名人是鲁迅，他是中国现代最有名的作家之一。","Người nổi tiếng tôi thích là Lỗ Tấn, một trong những nhà văn hiện đại nổi tiếng nhất Trung Quốc."],["① 点题","说到我喜欢的名人，我首先想到的是居里夫人。","Nói đến người nổi tiếng tôi thích, tôi nghĩ ngay đến bà Marie Curie."],["② 成就","他曾经留学日本学医，后来觉得改变人们的思想更重要，就开始写作。","Ông từng du học Nhật học y, sau thấy thay đổi tư tưởng con người quan trọng hơn nên chuyển sang viết."],["② 别样","很多人不知道，在吃喝这件事上，他算是个地道的行家。","Nhiều người không biết, về chuyện ăn uống, ông là dân sành chính hiệu."],["③ 理由","我喜欢他，是因为他的作品思想深刻，敢说真话。","Tôi thích ông vì tác phẩm tư tưởng sâu sắc, dám nói thật."],["③ 理由","作为一位科学家，她对工作非常认真，遇到困难从不放弃。","Là nhà khoa học, bà rất nghiêm túc, gặp khó khăn chưa bao giờ bỏ cuộc."],["④ 影响","他让我明白了，一个人要有自己的想法，并且敢于表达出来。","Ông giúp tôi hiểu: mỗi người phải có suy nghĩ riêng và dám nói ra."]],"links":[["Giới thiệu",["我喜欢的一位名人是……","说到……，我首先想到的是……","作为……，他……"]],["Kể thành tựu / chuyện",["他曾经……","很多人不知道，……","在……这件事上，他算是……"]],["Nêu lý do",["我喜欢他，是因为……","最让我佩服的是……","虽然……，但却……"]],["Ảnh hưởng",["他让我明白了……","我也想像他一样……","对我影响最大的是……"]]],"open":[["直接式","我喜欢的一位名人是鲁迅，他是中国现代最有名的作家之一。"],["印象式","说到我喜欢的名人，我首先想到的是一个留着胡子、拿着烟的作家——鲁迅。"],["别样式","大家都知道鲁迅是大作家，却很少有人知道他还是一个美食行家。"]],"close":[["影响式","他让我明白了，一个人要有自己的想法，并且敢于表达出来。"],["愿望式","我希望自己将来也能像他一样，做一个有用的人。"],["总结式","这就是我喜欢的名人——一个伟大而又真实的人。"]],"from_text":[["A 很大一部分是靠 B……的","她的成功很大一部分是靠坚持得来的。","Lấy từ 好句 ①: nêu nhận định."],["在……这件事上，算是个地道的……","在研究这件事上，居里夫人算是个地道的“工作狂”。","Lấy từ 好句 ②: khen một mặt."],["作为……，……对……很讲究","作为大诗人，阮攸对每一个字都很讲究。","Lấy từ 好句 ③: giới thiệu thân phận."],["算不上……，但却……","他的生活算不上富裕，但却写出了最美的诗。","Lấy từ 好句 ④: đánh giá hai mặt."],["虽然明明知道……，但却……","她虽然明明知道研究很危险，但却从来没有放弃。","Lấy từ 好句 ⑤: kể chi tiết cảm động."]],"vocab":[["著名","zhùmíng","nổi tiếng","著名的作家","idea"],["作品","zuòpǐn","tác phẩm","他的作品","idea"],["成就","chéngjiù","thành tựu","取得成就","idea"],["影响","yǐngxiǎng","ảnh hưởng","对我影响很大","idea"],["佩服","pèifú","khâm phục","最让我佩服","idea"],["伟大","wěidà","vĩ đại","伟大的作家","idea"],["评价","píngjià","đánh giá","怎么评价他","act"],["从事","cóngshì","làm (nghề)","从事文学创作","act"],["获得","huòdé","đạt được","获得诺贝尔奖","act"],["发表","fābiǎo","đăng, công bố","发表小说","act"],["坚持","jiānchí","kiên trì","坚持研究","act"],["敢于","gǎnyú","dám","敢于说真话","act"],["作为","zuòwéi","với tư cách","作为作家","lesson"],["曾经","céngjīng","đã từng","曾经留学","lesson"],["算","suàn","coi là","算是个行家","lesson"],["地道","dìdao","chính cống","地道的行家","lesson"],["讲究","jiǎngjiu","cầu kỳ","对吃很讲究","lesson"],["表现","biǎoxiàn","thể hiện","表现突出","lesson"],["形容","xíngróng","miêu tả","用诗形容他","lesson"],["见解","jiànjiě","kiến giải","独特的见解","lesson"],["多才多艺","duō cái duō yì","đa tài đa nghệ","一个多才多艺的人","bonus"],["家喻户晓","jiā yù hù xiǎo","ai ai cũng biết","在越南家喻户晓","bonus"],["影响深远","yǐngxiǎng shēnyuǎn","ảnh hưởng sâu xa","对后人影响深远","bonus"],["以身作则","yǐ shēn zuò zé","lấy mình làm gương","他总是以身作则","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 9"],["bonus","加分 · thành ngữ"]],"legend":["① Người đó là ai","② Thành tựu · câu chuyện","③ Lý do tôi thích","④ Ảnh hưởng"],"samples":{"speak":[{"who":"鲁迅","meta":"Hướng A · bài nói ~1 phút 30","p":["我喜欢的一位名人是鲁迅，他是中国现代最有名的作家之一。","鲁迅原名周树人，他曾经留学日本学医，后来觉得改变人们的思想更重要，就从事了文学创作。他的作品思想深刻，《呐喊》和《彷徨》是他的两部小说集。很多人不知道，在吃喝这件事上，他算是个地道的行家，北京的知名餐馆他去过六十多家。","我喜欢他，是因为他敢说真话，像是用笔做武器在战斗。而且他也有很真实的一面，虽然明明知道自己有胃病，但却很难戒掉酒。","鲁迅让我明白了，一个人要有自己的想法，并且敢于表达出来。"],"vi":"Người nổi tiếng tôi thích là Lỗ Tấn, một trong những nhà văn hiện đại nổi tiếng nhất Trung Quốc. Tên thật Chu Thụ Nhân, từng du học Nhật học y, sau chuyển sang sáng tác văn học; tác phẩm tư tưởng sâu sắc, có hai tập truyện “Gào thét”, “Bàng hoàng”. Ít người biết ông là dân sành ăn, từng đến hơn 60 nhà hàng nổi tiếng Bắc Kinh. Tôi thích ông vì ông dám nói thật, dùng ngòi bút làm vũ khí; ông cũng rất đời thường — biết mình đau dạ dày mà vẫn khó bỏ rượu. Ông giúp tôi hiểu phải có suy nghĩ riêng và dám nói ra."},{"who":"居里夫人","meta":"Hướng C · bài nói ~1 phút 30","p":["说到我喜欢的名人，我首先想到的是居里夫人。","她是一位伟大的科学家，曾经两次获得诺贝尔奖。她和丈夫一起发现了新的元素“镭”，为科学做出了很大的贡献。","我喜欢她，是因为她对工作非常认真。在研究这件事上，她算是个地道的“工作狂”，常常在条件很差的实验室里一干就是一整天。作为一位女科学家，她在那个时代遇到了很多困难，但却从来没有放弃。","居里夫人让我明白了，只要坚持，就一定能取得成就。"],"vi":"Nói đến người tôi thích, tôi nghĩ ngay đến bà Marie Curie — nhà khoa học vĩ đại, hai lần đoạt giải Nobel, cùng chồng phát hiện nguyên tố radium. Tôi thích bà vì bà làm việc cực kỳ nghiêm túc — một “người nghiện việc” chính hiệu, thường làm cả ngày trong phòng thí nghiệm điều kiện tồi tệ. Là nhà khoa học nữ thời đó, bà gặp nhiều khó khăn nhưng chưa từng bỏ cuộc. Bà giúp tôi hiểu: chỉ cần kiên trì sẽ có thành tựu."}],"write":[{"who":"范文 1 · 鲁迅","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜欢的一位名人","p":["我喜欢的一位名人是鲁迅，他是中国著名的文学家。","他曾经留学日本学医，后来从事文学创作。","我喜欢他，是因为他的作品思想深刻，敢说真话。","他让我明白了，一个人要有自己的想法。"],"vi":"Bố cục 4 câu đủ 4 bước: ai → từng làm gì (曾经) → lý do → ảnh hưởng."},{"who":"范文 2 · 阮攸","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜欢的一位名人","p":["我喜欢的名人是越南大诗人阮攸。","他写的《金云翘传》在越南家喻户晓，很多人都能背出里面的诗句。","作为大诗人，他对每一个字都很讲究。","读他的诗，让我更爱我们的语言。"],"vi":"Giới thiệu nhân vật Việt Nam; dùng 家喻户晓 và khung 作为……对……很讲究."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我喜欢的一位名人","p":["我喜欢的一位名人是鲁迅，他是中国现代最有名的作家之一。","鲁迅曾经留学日本学医，后来从事文学创作，他的作品思想深刻，影响深远。作为大作家、大学问家，鲁迅对吃也很讲究。在吃喝这件事上，他算是个地道的行家，还会亲自动手做菜。","我喜欢他，不只是因为他的作品，还因为他很真实。他虽然明明知道自己有胃病，但却很难戒掉酒。","鲁迅让我明白了，伟大的人也是普通人，一个人要有自己的想法，并且敢于表达出来。"],"good":["作为大作家、大学问家，鲁迅对吃也很讲究","在吃喝这件事上，他算是个地道的行家","虽然明明知道自己有胃病，但却很难戒掉酒"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 作为……，……对……很讲究 · 在……这件事上，算是个地道的…… · 虽然明明知道……，但却……."}]},"w5":["著名","作品","成就","影响","佩服","伟大","评价","从事","获得","坚持","作为","曾经","地道","讲究","表现","突出","形容","形象","见解","亲自","招待","交际","大方"],"step_names":["① 点题：他是谁","② 介绍：成就和故事","③ 评价：喜欢的理由","④ 影响"],"timer":[["① 10s",10],["② 35s",35],["③ 30s",30],["④ 15s",15]],"build_title":"选一位名人，拼出你的介绍","build_lead":"Chọn nhân vật, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 鲁迅":[["我喜欢的一位名人是鲁迅，他是中国现代最有名的作家之一。","说到我喜欢的名人，我首先想到的是一个留着胡子的作家——鲁迅。"],["他曾经留学日本学医，后来从事文学创作，《呐喊》和《彷徨》是他的两部小说集。","很多人不知道，在吃喝这件事上，他算是个地道的行家，还会亲自动手做菜。"],["我喜欢他，是因为他的作品思想深刻，敢说真话，像是用笔做武器在战斗。","作为大作家，他也有很真实的一面，虽然明明知道自己有胃病，但却很难戒掉酒。"],["鲁迅让我明白了，一个人要有自己的想法，并且敢于表达出来。","我希望自己将来也能像他一样，做一个敢说真话的人。"]],"B · 阮攸":[["我喜欢的名人是越南大诗人阮攸。","说到我喜欢的名人，我首先想到的是越南的阮攸。"],["他写的《金云翘传》在越南家喻户晓，很多人都能背出里面的诗句。","他生活在十八、十九世纪，他的作品对后来的越南文学影响深远。"],["作为大诗人，他对每一个字都很讲究，他的诗读起来特别美。","我喜欢他，是因为他的诗表达了对普通人的同情和爱。"],["读他的诗，让我更爱我们的语言。","他让我明白了，好的作品能感动很多代人。"]],"C · 居里夫人":[["说到我喜欢的名人，我首先想到的是居里夫人。","我喜欢的一位名人是伟大的科学家居里夫人。"],["她曾经两次获得诺贝尔奖，还和丈夫一起发现了新的元素“镭”。","在研究这件事上，她算是个地道的“工作狂”，常常在实验室里一干就是一整天。"],["我喜欢她，是因为她对工作非常认真，遇到困难从来没有放弃。","作为一位女科学家，她在那个时代遇到了很多困难，但却一直坚持了下来。"],["居里夫人让我明白了，只要坚持，就一定能取得成就。","我也想像她一样，做一个对社会有用的人。"]]},"quiz":[["Câu nào hợp làm câu mở bài?",["名人有很多，我喜欢很多名人。","我喜欢的一位名人是鲁迅，他是中国著名的作家。"],1,"Câu 2 vào thẳng đề, nêu tên và thân phận."],["Câu nào là lý do cụ thể?",["我喜欢他，因为他很有名。","我喜欢他，是因为他遇到困难从不放弃。"],1,"“很有名” không phải lý do thuyết phục."],["Câu nào dùng 作为 đúng?",["作为一位科学家，她对工作非常认真。","作为她是科学家，她对工作非常认真。"],0,"作为 + thân phận, không thêm 她是."],["Câu nào dùng 曾经 đúng?",["他曾经留学日本学医。","他曾经在这儿工作了三年，现在还在这儿。"],0,"曾经 = việc quá khứ đã kết thúc."],["Câu nào nói về “影响”?",["他让我明白了，一个人要有自己的想法。","他是1881年出生的。"],0,"Bước ④: người đó ảnh hưởng tới bạn."],["Chi tiết nào làm nhân vật sống động hơn?",["他写了很多书。","在吃喝这件事上，他算是个地道的行家。"],1,"Một mặt “khác lạ” ít người biết — bí quyết của bài khóa."]],"fix":[["我喜欢的名人是鲁迅，他是中国最有名的作家。","我喜欢的名人是鲁迅，他是中国最有名的作家之一。","Đánh giá khách quan: ……之一."],["作为我是学生，我很喜欢读他的书。","作为学生，我很喜欢读他的书。","作为 + danh từ, không thêm chủ ngữ + 是."],["他曾经留学日本学医了。","他曾经留学日本学医。／他曾经在日本学过医。","曾经 thường đi với 过, không đi với 了 cuối câu."],["我很佩服他的。","我很佩服他。","Bỏ 的 thừa."],["他对吃很讲究的人。","他是一个对吃很讲究的人。","Thiếu động từ 是."],["他让我明白了一个人要有自己想法。","他让我明白了，一个人要有自己的想法。","Định ngữ 自己的 cần 的."]],"tpl":"我喜欢的一位名人\n我喜欢的一位名人是【……】，他/她是【……】。他/她曾经【……】。很多人不知道，【别样的一面】。我喜欢他/她，是因为【理由】。他/她让我明白了【影响】。","chk":[["topic","Bám đề: có giới thiệu “我喜欢的……” / 名人","我喜欢|名人"],["intro","Có giới thiệu thân phận (作家 · 科学家 · 诗人 · 作为)","作家|科学家|诗人|文学家|运动员|作为|著名"],["story","Có thành tựu / câu chuyện (曾经 · 获得 · 作品)","曾经|获得|作品|写过|发现|小说"],["why","Có lý do (因为 · 佩服 · 喜欢他)","因为|佩服|是因为"],["end","Có ảnh hưởng (让我明白 · 像他一样 · 影响)","让我明白|像他一样|像她一样|影响|希望"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> thân phận, một thành tựu/câu chuyện, một lý do cụ thể và một câu về ảnh hưởng. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“介绍人物”的题目都可以这样写","var_lead":"Mọi đề giới thiệu nhân vật (名人、老师、家人、朋友) đều dùng khung: <b>ai → câu chuyện / chi tiết → lý do → ảnh hưởng<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）我喜欢的一位名人","我喜欢的一位名人是……，他是……"],["请以“对我影响最大的人”为题写一段话。","对我影响最大的人是我的……"],["请介绍一位你们国家的历史人物。","说到越南的历史人物，我首先想到的是……"],["请以“我的偶像”为题写一段话。","我的偶像是……，作为一名……"],["介绍一位你身边“别样”的人。","大家都觉得他很……，却很少有人知道他还……"],["请以“我最敬佩的老师”为题写一段话。","作为老师，她对每个学生都很……"]],"homework":"<b>Bài về nhà:<\/b> chọn một nhân vật (A–C hoặc tự chọn) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “我喜欢的一位名人” · bắt buộc có thân phận, một câu chuyện/chi tiết “别样”, một lý do cụ thể và một khung 好句 của bài khóa."}};</script>

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
