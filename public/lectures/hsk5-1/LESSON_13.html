<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 13 · 锯掉生活的“筐底” · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

frame":"某人 + 从 + ……中 + 得到了启发","apply":"我从妈妈做菜的过程中得到了启发，学会了做事要有计划。","apply_vn":"Tôi được gợi mở từ cách mẹ nấu ăn, học được làm việc phải có kế hoạch."},{"zh":"连运动员都不满意，更何况看比赛的球迷呢","vn":"đến vận động viên còn không hài lòng, huống chi người hâm mộ xem trận đấu","why":"<b>连 A 都……，更何况 B 呢？<\/b>: lập luận tăng tiến bằng câu hỏi tu từ — mạnh và tự nhiên.","frame":"连 A 都……，更何况 B 呢？","apply":"这个问题连老师都回答不了，更何况我们这些学生呢？","apply_vn":"Vấn đề này đến thầy còn không trả lời được, huống chi học sinh chúng tôi?"},{"zh":"困扰人们很长时间的取球问题就这样被一个小孩子解决了","vn":"vấn đề lấy bóng làm khổ mọi người bao lâu cứ thế được một đứa trẻ giải quyết","why":"Câu bị động có định ngữ dài: <b>困扰……的问题就这样被……解决了<\/b> — tạo bất ngờ, nhấn mạnh kết quả.","frame":"困扰 + 人们 + （很长时间）的 + 问题 + 就这样被 + 某人 + 解决了","apply":"困扰我们公司半年的问题就这样被一个新来的职员解决了。","apply_vn":"Vấn đề làm khổ công ty chúng tôi nửa năm cứ thế được một nhân viên mới giải quyết."},{"zh":"其实，世界上本来就没有太复杂的事，复杂都是我们自己造成的","vn":"thật ra trên đời vốn chẳng có việc gì quá phức tạp, phức tạp đều do chính ta tạo ra","why":"Câu chốt quan điểm: <b>其实，……本来就……，……都是……造成的<\/b> — đảo ngược cách nghĩ thông thường.","frame":"其实，+ ……本来就没有……，……都是我们自己造成的","apply":"其实，生活中本来就没有那么多烦恼，烦恼都是我们自己造成的。","apply_vn":"Thật ra cuộc sống vốn chẳng có nhiều phiền não đến thế, phiền não đều do ta tự chuốc lấy."},{"zh":"生活仿佛篮筐，许多时候，我们需要的不过是一把锯子，来锯掉那些阻碍我们的“筐底”","vn":"cuộc sống giống như chiếc giỏ, nhiều khi điều ta cần chỉ là một cái cưa để cưa bỏ những “đáy giỏ” cản trở mình","why":"Câu kết dùng <b>ẩn dụ<\/b>: <b>A 仿佛 B，……需要的不过是……<\/b> — nâng câu chuyện thành bài học cuộc sống.","frame":"A 仿佛 B，许多时候，我们需要的不过是……","apply":"学习仿佛爬山，许多时候，我们需要的不过是再坚持一步。","apply_vn":"Học tập giống như leo núi, nhiều khi ta chỉ cần cố thêm một bước nữa."}],"GRAMMAR":[{"word":"何况","py":"hékuàng","pos":"连词","forms":["A 都／尚且……，（更）何况 B（呢）？（更进一层，后句结论显而易见）","……，何况 + 另一种理由（补充理由）"],"vn":"<b>何况<\/b> là liên từ dùng ngữ khí phản vấn: ① <b>huống hồ, huống chi<\/b> — tăng tiến: A còn thế, B càng không phải nói; hay đi với <b>连……都……，更何况……呢？<\/b> ② <b>hơn nữa<\/b> — bổ sung thêm một lý do (= 况且).","text":"连运动员都不满意，更何况看比赛的球迷呢？","ex":[["北京的发展变化太快，我这个土生土长的老北京还常迷路呢，何况你一个外地人。","Bắc Kinh thay đổi quá nhanh, dân Bắc Kinh gốc như tôi còn hay lạc, huống chi bạn là người nơi khác. (tăng tiến)"],["这辆车外观漂亮，安全性高，又何况价钱也就比上次看的那辆贵了几千块，小王有点儿动心了。","Xe này đẹp, an toàn, hơn nữa giá chỉ đắt hơn chiếc lần trước vài nghìn, Tiểu Vương hơi động lòng. (bổ sung lý do)"],["上海冬天没有暖气，屋子里冷得让人伸不出手，何况李阳还是病人，自然是受不了的。","Thượng Hải mùa đông không có sưởi, trong nhà lạnh cóng, huống hồ Lý Dương đang ốm, tất nhiên chịu không nổi."]],"err":[["❌ 何况我们都不会，老师呢？","✅ 我们都不会，何况……／老师都不会，何况我们呢？","何况 đặt ở đầu phân câu sau, dẫn ra trường hợp “càng”."],["❌ 连大人都搬不动，何况小孩子能搬动。","✅ 连大人都搬不动，何况小孩子呢？","Dùng ngữ khí phản vấn, kết bằng 呢."]],"book":[["这段山路比较危险，____________，还是让我来开吧。（何况）","Gợi ý: tài xế lâu năm còn cẩn thận, huống chi bạn mới học lái.","这段山路比较危险，老司机都要非常小心，何况你刚学会开车，还是让我来开吧"],["A：这烤鸭不是你最爱吃的吗？今天怎么一口都不吃？<br>B：我正在减肥，连____________，____________呢？（何况）","Gợi ý: cơm còn không dám ăn nhiều, huống chi vịt quay.","我正在减肥，连米饭都不敢多吃，何况烤鸭呢"],["A：你原来不是很爱逛商场的吗？现在怎么都在网上买衣服了？<br>B：____________？（何况）","Gợi ý: trên mạng rẻ hơn, hơn nữa không cần ra ngoài.","网上的衣服比商场便宜，何况还不用出门，多方便啊"]],"drill":[["选择：这么重的箱子大人都搬不动，____一个孩子呢？",["何况","何必","因此"],0,"Tăng tiến → 何况."],["“何况”放在哪里？ 年轻人恐怕<u>A<\/u>都受不了，<u>B<\/u>一个有病的老人<u>C<\/u>呢？",["A","B","C"],1,"Đầu phân câu sau (课本练习3)."],["“何况”常和哪个结构一起用？",["连……都……","因为……所以……","虽然……但是……"],0,"连 A 都……，何况 B 呢."]]},{"word":"何必","py":"hébì","pos":"副词","forms":["何必 + 动词短语 + 呢？（用反问的语气表示不必）","……，何必……呢？……不就行了？"],"vn":"<b>何必<\/b> là phó từ, ngữ khí phản vấn: <b>hà tất, cần gì phải<\/b> = 不必. Thường đi với <b>呢<\/b> ở cuối, hay kèm theo đề xuất cách khác: <b>何必……呢？……不就行了吗？<\/b>","text":"何必这么麻烦呢？把篮筐的底去掉不就行了吗？","ex":[["食堂楼下就有个小超市，何必去学校外边呢？","Dưới căng-tin có siêu thị nhỏ, cần gì phải ra ngoài trường?"],["你何必亲自送一趟呢？叫个快递不就行了？","Cần gì bạn phải đích thân đi đưa? Gọi chuyển phát nhanh là được mà?"],["大家都是朋友，何必为这点儿小事生气呢？","Đều là bạn bè cả, cần gì vì chút chuyện nhỏ mà giận?"]],"err":[["❌ 你何必去吗？","✅ 你何必去呢？","何必 đi với 呢, không dùng 吗."],["❌ 何必你这么着急呢？","✅ 你何必这么着急呢？","何必 là phó từ, đứng sau chủ ngữ, trước động từ."]],"book":[["早知道你就有这本书，____________？（何必）","Gợi ý: tôi cần gì phải đi mua.","早知道你就有这本书，我何必再去书店买呢"],["既然她已经拒绝了你，你____________呢？（何必）","Gợi ý: cần gì cứ nghĩ mãi về cô ấy.","既然她已经拒绝了你，你何必还总想着她呢"],["A：你回家等我吧，我先去超市买点儿肉、蔬菜什么的。<br>B：____________。（何必）","Gợi ý: nhà còn nhiều, cần gì mua.","何必去超市呢？家里的冰箱里还有很多菜"]],"drill":[["“何必”的意思是：",["不必","一定","何况"],0,"何必 = 不必 (phản vấn)."],["“何必”放在哪里？ 您多画点儿画儿多好，<u>A<\/u>把时间<u>B<\/u>浪费在这些人的身上<u>C<\/u>？",["A","B","C"],0,"何必把时间浪费…… (课本练习3)."],["Câu nào đúng?",["你何必跟他生气呢？","你何必跟他生气吗？","何必你跟他生气呢？"],0,"Chủ ngữ + 何必 + V + 呢."]]},{"word":"多亏","py":"duōkuī","pos":"动词","forms":["多亏（了）+ 名词／小句，（才／要不……）（由于别人的帮助或有利因素，避免了不幸或得到了好处）"],"vn":"<b>多亏<\/b> là động từ: <b>may mà, nhờ có<\/b> — nhờ sự giúp đỡ của người khác hoặc yếu tố thuận lợi mà tránh được điều xấu / có được điều tốt. Hay đi kèm <b>要不（然）<\/b> (không thì…) hoặc <b>才<\/b>. Mang sắc thái <b>biết ơn<\/b>.","text":"多亏了他这句话，人们如梦初醒，一位球员连忙找来一把锯子把篮筐的底锯掉。","ex":[["赵老师，谢谢您，多亏您给我那瓶药，很管用。","Thầy Triệu, cảm ơn thầy, nhờ lọ thuốc thầy cho, rất hiệu quả."],["今天搬家多亏有你，你可帮我大忙了。","Hôm nay chuyển nhà may có bạn, bạn giúp tôi nhiều lắm."],["多亏你提醒，要不我肯定忘了下午还要开会。","May mà bạn nhắc, không thì tôi chắc quên chiều còn họp."]],"err":[["❌ 多亏他，我考试没通过。","✅ 因为他，我考试没通过。","多亏 dùng cho kết quả tốt; kết quả xấu dùng 因为/由于."],["❌ 我多亏你。","✅ 多亏你帮我，要不我就迟到了。","多亏 cần nói rõ nhờ điều gì và kết quả thế nào."]],"book":[["____________，要不今天的飞机我准赶不上了。（多亏）","Gợi ý: may mà bạn lái xe đưa tôi.","多亏你开车送我来机场，要不今天的飞机我准赶不上了"],["A：星期五晚上你不是和朋友约好了见面吗？<br>B：哎呀！____________。（多亏）","Gợi ý: may mà bạn nhắc, tôi quên mất.","哎呀！多亏你提醒我，我差点儿忘了"],["A：____________。（多亏）<br>B：是啊，医生说再过一个星期妈妈就能出院了。","Gợi ý: may mà phát hiện sớm.","多亏发现得早，你妈妈的病才没有变严重"]],"drill":[["“多亏”放在哪里？ <u>A<\/u>你提醒，<u>B<\/u>要不<u>C<\/u>我肯定忘了下午还要开会。",["A","B","C"],0,"多亏你提醒 (课本练习3)."],["“多亏”后面的结果一般是：",["好的结果","不好的结果"],0,"Tránh được điều xấu / có điều tốt."],["选择：____你帮忙，我才这么快搬完了家。",["多亏","何必","何况"],0,"Nhờ có → 多亏."]]}],"HSK":{"r1":[{"text":["小刚第一次参加篮球比赛，非常紧张。比赛开始后，他接到球就往篮筐跑，{36}，球进了！观众们都笑了起来。原来，{37}。教练拍拍他的肩膀说：“没关系，{38}，下次记住往对方的篮筐投就行了。”"],"qs":[{"n":36,"o":["一跳，一投","坐下来休息","把球扔给观众","马上停了下来"],"a":0,"why":"后文“球进了”，说明他投篮了。"},{"n":37,"o":["他投的是自己队的篮筐","他投得太好了","对方没有人","比赛已经结束了"],"a":0,"why":"教练说“下次记住往对方的篮筐投”，说明他投错了篮筐。"},{"n":38,"o":["至少你的投篮很准","你不要再来了","我们输了","你应该多休息"],"a":0,"why":"教练在安慰他，肯定他投得准。"}]},{"text":["遇到问题的时候，很多人习惯用复杂的办法去解决，{39}。其实，有时候最简单的办法往往就是最好的办法。篮球刚发明的时候，人们为了取球想了很多办法，{40}，最后却是一个小孩子的一句话解决了问题。所以，当我们{41}，不妨换一个角度想一想，{42}。"],"qs":[{"n":39,"o":["结果却越弄越麻烦","所以问题马上就解决了","因为他们很聪明","这样最省时间"],"a":0,"why":"后文“其实”转折，说明复杂的办法反而更麻烦。"},{"n":40,"o":["甚至还造出了机器","可是谁也不关心","于是不打篮球了","所以非常顺利"],"a":0,"why":"课文：工程师甚至造出了一种机器。"},{"n":41,"o":["被一个问题困扰很久的时候","吃饭的时候","打完篮球以后","很高兴的时候"],"a":0,"why":"被问题困扰时才需要换个角度。"},{"n":42,"o":["也许答案就在眼前","问题会更复杂","就不用想了","别人会帮你"],"a":0,"why":"换个角度想，也许很快就能找到答案，前后连贯。"}]}],"r2":[{"start":46,"paras":["有一辆大卡车要从一座桥下通过，可是车太高了，结果被卡在了桥下。","这时，一个小学生走过来说：“为什么不把轮胎里的气放掉一点儿呢？”","工程师们来了，有的说要把桥拆掉一部分，有的说要把车上的东西搬下来，大家争论了很久。","人们照他的办法做了，车子一下子就低了几厘米，顺利地从桥下开了过去。","这个故事告诉我们，解决问题的办法有时候非常简单。"],"ans":["A","C","B","D","E"],"why":"问题（A）→ 工程师争论（C）→ 小学生的办法（B）→ 问题解决（D）→ 道理（E）。"}],"r3":[{"text":["很多人都知道，篮球是1891年由美国的一位体育教师发明的。可是你知道吗？最早的篮球比赛和今天很不一样。","那时候，篮筐是有底的，每次投进一个球，都要有人上去把球取出来，比赛常常要停下来。而且，最早的比赛用的是足球，每队的人数也不固定，有时候一队有九个人，有时候甚至有五十个人。","后来，篮球的规则不断改进：篮筐的底被去掉了，人们专门为篮球设计了一种比足球更大的球，每队上场的人数也固定为五个。<u><b>正是这些改进，让篮球比赛变得越来越激烈、好看<\/b><\/u>。","如今，篮球已经成为世界上最受欢迎的运动之一，在很多国家都有大量的球迷。"],"qs":[{"n":56,"s":"最早的篮球比赛用的是：","o":["篮球","足球","排球","网球"],"a":1,"why":"第二段：最早的比赛用的是足球。"},{"n":57,"s":"关于最早的篮球比赛，可以知道：","o":["每队有五个人","常常要停下来取球","篮筐没有底","很少有人参加"],"a":1,"why":"第二段：每次投进一个球都要有人取球，比赛常常要停下来。"},{"n":58,"s":"画线句子中的“这些改进”不包括：","o":["去掉篮筐的底","设计专门的篮球","固定上场人数","增加比赛时间"],"a":3,"why":"第三段只提到了前三项改进。"},{"n":59,"s":"这段话主要谈的是：","o":["篮球比赛的变化","怎样打好篮球","足球的历史","篮球明星"],"a":0,"why":"全文讲篮球从最早到今天的变化。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小明是怎么解决问题 "vn":"Có người nói cách đơn giản thường là cách tốt nhất; có người nói vấn đề phức tạp cần cách phức tạp. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"锯掉思维的“筐底”","tips":["Quan điểm → ví dụ bóng rổ (篮筐的底) → vì sao ta hay nghĩ phức tạp (tư duy bị “đáy giỏ” chặn) → thừa nhận có việc thật sự phức tạp → kết luận: đổi góc nhìn.","Dùng khung 好句: 困扰……的问题就这样被……解决了 · 其实，……本来就……，……都是……造成的."],"sample":"很多人认为，复杂的问题需要复杂的办法来解决。我却觉得，简单的办法往往是最好的办法。\n篮球刚发明的时候，篮筐是有底的，每投进一个球都要有人踩着梯子去取。为了解决这个问题，有人甚至专门造出了机器，可比赛还是不顺畅。最后，一个小男孩说：“把篮筐的底去掉不就行了吗？”困扰人们很长时间的问题就这样被解决了。\n为什么大人们想不到呢？因为我们的思维常常被经验和习惯挡住了。其实，世界上本来就没有太复杂的事，复杂都是我们自己造成的。\n当然，有些问题确实很复杂，需要认真研究。但是在想复杂的办法之前，我们不妨先换个角度，看看有没有更简单的办法。","svn":"Bài nghị luận: quan điểm → ví dụ bóng rổ → vì sao ta nghĩ phức tạp (thói quen, kinh nghiệm) → 其实……都是我们自己造成的 → 当然 có việc phức tạp thật → nên thử đổi góc nhìn trước."}},"PRACTICE":{"ex1":{"bank":["重复","造成","气氛","缺乏","仿佛","连忙"],"items":[["今天的晚会你们组织得相当好，{}搞得轻松愉快。",["气氛"]],["一觉醒来发现已经8点多了，李阳{}穿好衣服往公司赶。",["连忙"]],["他一边听，一边在本子上记着什么，{}对我的发言挺感兴趣似的。",["仿佛"]],["心理学家指出，一个人的动作或想法，如果{}二十一天就会形成习惯。",["重复"]],["每天大量饮酒确实给我的身体健康{}了很大的伤害。",["造成"]],["在食物{}的季节，动物为了活下去就只能多睡觉。",["缺乏"]]]},"ex2":[["要整理的东西太多了，你看，这个箱子根本____不下。",["装","安装"],0],["昨晚我失眠了，睡不着就躺着____书，结果不知不觉天就亮了。",["瞧","看"],0],["即使在现代社会里，故事仍然是人们生活中不可____的一部分。",["缺少","缺乏"],0],["你们知道中国人除夕夜守岁、放鞭炮的风俗是怎么____的吗？",["形成","造成"],0]],"ex3":[["您<u>A<\/u>多画点儿画儿多好，<u>B<\/u>把时间<u>C<\/u>浪费在这些人的身上<u>D<\/u>？","何必",1,"您多画点儿画儿多好，何必把时间浪费在这些人的身上？"],["<u>A<\/u>年轻人<u>B<\/u>恐怕都受不了，<u>C<\/u>一个<u>D<\/u>有病的老人呢？","何况",2,"年轻人恐怕都受不了，何况一个有病的老人呢？"],["<u>A<\/u>你提醒，<u>B<\/u>要不<u>C<\/u>我肯定忘了<u>D<\/u>下午还要开会。","多亏",0,"多亏你提醒，要不我肯定忘了下午还要开会。"],["<u>A<\/u>经历了那件事后，<u>B<\/u>我<u>C<\/u>一夜之间长大<u>D<\/u>成人了。","仿佛",2,"经历了那件事后，我仿佛一夜之间长大成人了。"]],"ex4":[["篮球运动的发明","训练、缺乏、启发、项目、安装","1891年，奈史密斯所在的训练学校缺乏室内比赛项目。他从当地人把球扔进桃子筐的游戏中得到启发，把两只篮筐安装在栏杆上，发明了篮球。"],["取球的烦恼","断断续续、一再、激烈、气氛、制造、机器","因为篮筐有底，每投进一个球就要有人上去取球，这样的行为一再重复，比赛断断续续，缺少激烈的气氛。有位工程师制造了一种机器，可还是不顺畅。"],["问题的解决","幼儿园、好奇、何必、锯","一个上幼儿园的小男孩好奇地问：“何必这么麻烦呢？把篮筐的底去掉不就行了吗？”于是一位球员用锯子把篮筐的底锯掉了，问题就这样解决了。"]],"ext":{"title":"扩展 · 话题：体育","words":[["太极拳","tàijíquán","Thái cực quyền"],["球迷","qiúmí","người hâm mộ"],["武术","wǔshù","võ thuật"],["纪录","jìlù","kỷ lục"],["象棋","xiàngqí","cờ tướng"],["教练","jiàoliàn","huấn luyện viên"],["对手","duìshǒu","đối thủ"],["冠军","guànjūn","nhà vô địch"],["决赛","juésài","trận chung kết"]],"items":[["{}是中国传统的体育项目，太极拳是其中重要的组成部分。","武术"],["我认识一位大学的体育老师，他{}下得可棒了。","象棋"],["打羽毛球你可不是我的{}，不管打多少场你也赢不了。","对手"],["他决心苦练一年，好在下次比赛时打败对方，拿回{}的奖杯。","冠军"]]}},"TEXT":[{"title":"篮球的发明","sub":"桃子筐的启发","paras":["篮球运动是1891年由美国马萨诸塞州的体育教师詹姆士·奈史密斯博士发明的。那年的冬天特别冷，奈史密斯所在的训练学校缺乏在室内进行的球类比赛项目，他从当地人把球扔进桃子筐（当地产桃子，各家各户都备有装桃子的专用篮筐）的游戏中得到了启发，将两只篮筐分别安装在体育馆两边看台的栏杆上，学生分为甲乙两队，以足球为比赛工具向篮内投，按得分多少决定输赢。"],"idea":"Năm 1891, thầy giáo thể dục <b>James Naismith<\/b> (Mỹ) phát minh ra bóng rổ. Trường thiếu môn thi đấu trong nhà vào mùa đông; ông lấy <b>gợi ý<\/b> từ trò ném bóng vào <b>giỏ đựng đào<\/b> của dân địa phương, gắn hai giỏ lên lan can khán đài, chia hai đội ném bóng, tính điểm thắng thua.","qs":[["篮球运动是谁发明的？",["一位美国体育教师","一位工程师","一个小男孩"],0],["奈史密斯为什么要发明篮球？",["学校缺乏在室内进行的球类比赛项目","他喜欢吃桃子","学校让他发明"],0],["最早的篮筐是什么？",["铁做的圈","装桃子的篮筐","一个箱子"],1]]},{"title":"取球的烦恼","sub":"比赛断断续续","paras":["这项运动很快流行起来。不过，由于栏杆上固定的是真正的筐，每当球投进时，就得有一个人踩着梯子上去把球取出来。这样的行为必须一再地重复，为此，比赛不得不断断续续地进行，缺少了激烈紧张的气氛，连运动员都不满意，更何况看比赛的球迷呢？为了解决这个问题，大家纷纷出主意，想出了很多取球的办法。有一位工程师甚至专门制造出一种机器，在下面一拉篮筐就能把球弹出来。可是，这些办法都没能让比赛顺畅起来。"],"idea":"Môn này nhanh chóng thịnh hành. Nhưng giỏ thật có đáy, mỗi lần bóng vào phải có người <b>trèo thang<\/b> lấy bóng ra; trận đấu cứ <b>đứt quãng<\/b>, mất không khí gay cấn, cầu thủ còn không hài lòng <b>huống chi<\/b> khán giả. Mọi người nghĩ nhiều cách, có kỹ sư còn chế ra máy kéo để bật bóng ra — vẫn không trôi chảy.","qs":[["每当球投进时，要怎么做？",["有人踩着梯子上去把球取出来","球自己掉下来","换一个新篮筐"],0],["比赛为什么缺少了激烈紧张的气氛？",["运动员太少","比赛不得不断断续续地进行","球迷不来看"],1],["工程师想出了什么办法？",["锯掉篮筐的底","制造出一种机器，一拉就能把球弹出来","不用篮筐"],1]]},{"title":"小男孩的话","sub":"何必这么麻烦呢？","paras":["几年后的一天，一个上幼儿园的小男孩跟着父亲从一群正在进行篮球比赛的人旁边经过。看到大人们一次次辛苦地取球，小男孩好奇地问父亲：“何必这么麻烦呢？把篮筐的底去掉不就行了吗？”多亏了他这句话，人们如梦初醒，一位球员连忙找来一把锯子把篮筐的底锯掉。你瞧，困扰人们很长时间的取球问题就这样被一个小孩子解决了。"],"idea":"Mấy năm sau, một <b>cậu bé mẫu giáo<\/b> đi ngang qua sân bóng, thấy người lớn vất vả lấy bóng liền hỏi bố: “<b>Cần gì phiền thế?<\/b> Bỏ đáy giỏ đi là được mà?” <b>Nhờ<\/b> câu nói ấy mọi người như bừng tỉnh, một cầu thủ vội tìm cưa <b>cưa đáy giỏ<\/b>. Vấn đề làm khổ mọi người bao lâu được một đứa trẻ giải quyết.","qs":[["小男孩是什么人？",["一个球员","一个上幼儿园的孩子","工程师的儿子"],1],["小男孩提出了什么办法？",["把篮筐的底去掉","换一个大篮筐","请更多人取球"],0],["“人们如梦初醒”是什么意思？",["人们刚睡醒","人们一下子明白过来了","人们很生气"],1]]},{"title":"生活的“筐底”","sub":"复杂都是我们自己造成的","paras":["去掉篮筐的底，本是一件简单的事，可为什么那么多人都没有想到呢？说白了，因为我们的思维像篮球一样被篮筐的底挡在了半空中。于是，我们呆呆地去搬梯子、造机器……其实，世界上本来就没有太复杂的事，复杂都是我们自己造成的。生活仿佛篮筐，许多时候，我们需要的不过是一把锯子，来锯掉那些阻碍我们的“筐底”。"],"idea":"Việc đơn giản vậy sao nhiều người không nghĩ ra? Vì <b>tư duy<\/b> của ta như quả bóng bị đáy giỏ chặn giữa không trung. Thật ra thế giới vốn chẳng có việc gì quá phức tạp — <b>phức tạp là do ta tự tạo ra<\/b>. Cuộc sống <b>giống như<\/b> chiếc giỏ, nhiều khi ta chỉ cần một cái cưa để cưa bỏ những “đáy giỏ” cản trở mình.","qs":[["为什么那么多人都没有想到去掉篮筐的底？",["他们的思维被“筐底”挡住了","他们没有锯子","这件事太难了"],0],["作者认为复杂的事是怎么来的？",["是世界本来就有的","是我们自己造成的","是小孩子造成的"],1],["“锯掉生活的筐底”比喻什么？",["去掉阻碍我们的旧思维","去打篮球","买新的篮筐"],0]]}],"TEXT_EXTRA":{"compare_title":"篮球的变化","compare_head":["时间","篮筐","比赛情况"],"compare":[["1891年","装桃子的筐（有底）","每投进一个球就要踩梯子取球"],["后来","工程师的机器（一拉就弹出来）","还是不顺畅"],["几年后","锯掉筐底","比赛顺畅、激烈"]],"bg":"中国有句话：“饭后走一走，活到九十九；饭后趴一趴（pā），活到一百八。”前者主张（zhǔzhāng）运动，活到了九十九岁；后者主张静止，却活到了一百八十岁。当然这只不过是句笑话，但是大多数人一般还是认为，生命在于运动！运动必须因人、因时、因环境而论，身体的强弱（qiángruò）决定了运动的强弱。体弱者不要做过于激烈的运动；体强者也不可自以为身体好，就做超量的运动，这样也会对身体造成伤害。早晚时差，环境不同，也决定了运动时间的长短、运动方式的不同。运动仿佛长流之水，贵在坚持。","bg_vn":"Câu đùa: “ăn xong đi dạo sống 99, ăn xong nằm sấp sống 180”. Nhưng phần đông vẫn tin “sinh mệnh nằm ở vận động”. Vận động phải tùy người, tùy lúc, tùy môi trường: người yếu đừng tập quá mạnh, người khỏe cũng đừng tập quá sức. Vận động như dòng nước chảy dài — quý ở kiên trì.","discuss_title":"话题讨论：运动与健康","discuss":["你喜欢的运动是什么？你是怎么接触（jiēchù）到并喜欢上它的？","进行这项运动有什么要求或条件？它的好处或优点是什么？","介绍一下现在你参加这项运动的情况以及它给你的生活带来什么影响。"],"write":"请以“我喜欢的一项运动”为题，谈一谈你的看法。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我喜欢的一项运动”为题，谈一谈你的看法","topic_vn":"Viết bài với đầu đề “Môn thể thao tôi yêu thích”","intro":"Dạng đề giới thiệu + cảm nhận (介绍＋感受) · Môn gì, biết đến nó thế nào → yêu cầu, lợi ích → tình hình tham gia hiện nay → ảnh hưởng tới cuộc sống · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我喜欢的一项运动”：怎么喜欢上 + 好处 + 影响","lead":"Ba câu hỏi thảo luận của sách chính là dàn ý: <b>喜欢什么运动、怎么接触到的<\/b> → <b>有什么要求、好处<\/b> → <b>现在参加的情况、带来什么影响<\/b>. Bài hay phải có <b>một trải nghiệm cụ thể<\/b> (lần đầu chơi, một trận đấu, một lần bị thương…), không chỉ liệt kê “运动对身体好”.","parts":[["我喜欢的","Phải có tình cảm cá nhân và lý do: 我喜欢它，是因为……"],["一项","Chỉ một môn — lượng từ <b>项<\/b>: 一项运动、体育项目."],["运动","Môn cụ thể: 篮球、游泳、跑步、太极拳、羽毛球…"],["（课本）尽量用上本课生词，不少于100字","Dùng: 训练、激烈、气氛、缺乏、重复、启发、造成、仿佛、多亏… và khung 好句 của bài khóa."]],"traps":[["Chỉ nói “运动对身体好”","Ý quá chung; phải nói môn này tốt ở điểm gì, với bạn ra sao."],["Kể luật chơi quá dài","Luật bóng rổ 50 chữ → mất trọng tâm “我喜欢”."],["Thiếu ảnh hưởng","Kết bài nên nói môn này thay đổi bạn thế nào (sức khỏe, tính cách, bạn bè)."],["Dùng sai 激烈/强烈","Trận đấu, vận động → <b>激烈<\/b>; mong muốn, ánh nắng → <b>强烈<\/b>."]],"link":"<b>Liên hệ bài 13:<\/b> phần 背景分析 có ý hay: <b>运动必须因人、因时、因环境而论<\/b>, người yếu đừng tập quá mạnh, người khỏe đừng tập quá sức; <b>运动仿佛长流之水，贵在坚持<\/b> — câu kết rất đẹp cho bài viết."},"steps":[["①","点题：什么运动","Mở bài: môn gì, bắt đầu chơi từ khi nào, vì sao.","我最喜欢的运动是……"],["②","要求和好处","Môn này cần gì, có lợi gì (sức khỏe, tinh thần, bạn bè).","这项运动……"],["③","我的经历","<b>Trọng tâm.<\/b> Tình hình tập luyện hiện nay hoặc một kỷ niệm cụ thể.","现在我每周……"],["④","影响","Kết: môn này mang lại thay đổi gì; câu “贵在坚持”.","它让我明白了……"]],"formula":["我喜欢……，从……开始","好处：……","经历：……","影响：……贵在坚持"],"choices_title":"Chọn một môn","choices_key":"Ví dụ: ","choices":[["A · 篮球","bóng rổ","Liên hệ bài khóa; trận đấu gay cấn, tinh thần đồng đội.","激烈的比赛、球迷"],["B · 跑步","chạy bộ","Đơn giản, không cần nhiều dụng cụ; rèn ý chí kiên trì.","每天早上跑五公里"],["C · 太极拳","Thái cực quyền","Môn truyền thống Trung Quốc, nhẹ nhàng, hợp mọi lứa tuổi.","跟爷爷一起练"],["D · 游泳","bơi lội","Tốt cho toàn thân; kể lần đầu học bơi.","第一次下水很害怕"]],"notes":[["Một kỷ niệm thật","Lần đầu chơi, một trận thắng/thua, một lần bị thương — làm bài sống động."],["Lợi ích cụ thể","Không chỉ “身体好” mà “以前常感冒，现在一年都没生病”."],["Câu kết","“运动仿佛长流之水，贵在坚持。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> dùng đúng lượng từ <b>一项运动<\/b>; phân biệt <b>激烈的比赛<\/b> / <b>强烈的愿望<\/b>. Câu kể kinh nghiệm dùng <b>从……开始<\/b>, <b>多亏……<\/b>.","patterns":[["① 点题","我最喜欢的运动是篮球，我从中学开始打篮球，到现在已经八年了。","Môn tôi thích nhất là bóng rổ, tôi chơi từ cấp hai, đến nay đã tám năm."],["① 点题","说到运动，我首先想到的是跑步，因为它简单又方便。","Nói đến thể thao, tôi nghĩ ngay đến chạy bộ vì nó đơn giản, tiện lợi."],["② 好处","打篮球不但能锻炼身体，还能让人学会和别人合作。","Chơi bóng rổ không chỉ rèn luyện thân thể mà còn giúp học cách hợp tác."],["② 要求","这项运动不需要什么工具，只要有一双运动鞋就可以了。","Môn này không cần dụng cụ gì, chỉ cần một đôi giày thể thao."],["③ 经历","比赛非常激烈，球场上的气氛也特别热闹。","Trận đấu rất gay cấn, không khí sân bóng cũng cực kỳ náo nhiệt."],["③ 经历","多亏教练的耐心训练，我的技术提高得很快。","Nhờ huấn luyện viên kiên nhẫn, kỹ thuật tôi tiến bộ rất nhanh."],["④ 影响","运动仿佛长流之水，贵在坚持。","Vận động như dòng nước chảy dài, quý ở kiên trì."]],"links":[["Mở bài",["我最喜欢的运动是……","说到运动，我首先想到的是……","我是从……开始……的"]],["Lợi ích",["……不但……，还……","这项运动……","对……来说，……"]],["Kinh nghiệm",["现在我每周……","有一次，……","多亏……，……"]],["Kết",["它让我明白了……","……仿佛……，贵在坚持","我会一直坚持下去"]]],"open":[["直接式","我最喜欢的运动是篮球，我从中学开始打篮球，到现在已经八年了。"],["故事式","第一次站在球场上的时候，我连球都拿不稳。"],["引用式","中国人常说“生命在于运动”，我对这句话深有体会。"]],"close":[["道理式","运动仿佛长流之水，贵在坚持。"],["影响式","篮球不仅让我的身体更健康，也让我交到了很多好朋友。"],["决心式","不管学习多忙，我都会一直坚持下去。"]],"from_text":[["从……中得到了启发","我从一次失败的比赛中得到了启发：只有一起配合才能赢。","Lấy từ 好句 ①: bài học từ trải nghiệm."],["连……都……，更何况……呢","连专业运动员都需要每天训练，更何况我们呢？","Lấy từ 好句 ②: lập luận tăng tiến."],["困扰……的问题就这样被……解决了","困扰我多年的失眠问题就这样被跑步解决了。","Lấy từ 好句 ③: kể kết quả bất ngờ."],["其实，……本来就……，……都是……造成的","其实，运动本来就不难，难都是我们自己的懒造成的。","Lấy từ 好句 ④: quan điểm."],["A 仿佛 B，……需要的不过是……","运动仿佛长流之水，我们需要的不过是坚持。","Lấy từ 好句 ⑤: câu kết ẩn dụ."]],"vocab":[["锻炼","duànliàn","rèn luyện","锻炼身体","idea"],["健康","jiànkāng","khỏe mạnh","身体健康","idea"],["比赛","bǐsài","thi đấu","参加比赛","idea"],["合作","hézuò","hợp tác","和队友合作","idea"],["坚持","jiānchí","kiên trì","坚持锻炼","idea"],["技术","jìshù","kỹ thuật","篮球技术","idea"],["接触","jiēchù","tiếp xúc","第一次接触篮球","act"],["参加","cānjiā","tham gia","参加俱乐部","act"],["提高","tígāo","nâng cao","提高水平","act"],["放松","fàngsōng","thả lỏng","放松心情","act"],["出汗","chū hàn","ra mồ hôi","出了很多汗","act"],["受伤","shòu shāng","bị thương","打球时受伤","act"],["训练","xùnliàn","huấn luyện","认真训练","lesson"],["激烈","jīliè","gay cấn","激烈的比赛","lesson"],["气氛","qìfēn","bầu không khí","球场的气氛","lesson"],["缺乏","quēfá","thiếu","缺乏运动","lesson"],["重复","chóngfù","lặp lại","重复练习","lesson"],["多亏","duōkuī","nhờ có","多亏教练","lesson"],["仿佛","fǎngfú","như thể","仿佛长流之水","lesson"],["造成","zàochéng","gây ra","造成伤害","lesson"],["生命在于运动","shēngmìng zàiyú yùndòng","sống là phải vận động","都说生命在于运动","bonus"],["贵在坚持","guì zài jiānchí","quý ở kiên trì","运动贵在坚持","bonus"],["团队精神","tuánduì jīngshén","tinh thần đồng đội","培养团队精神","bonus"],["持之以恒","chí zhī yǐ héng","bền bỉ không ngừng","锻炼要持之以恒","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 13"],["bonus","加分 · thành ngữ"]],"legend":["① Môn gì","② Yêu cầu · lợi ích","③ Kinh nghiệm của tôi","④ Ảnh hưởng"],"samples":{"speak":[{"who":"篮球","meta":"Hướng A · bài nói ~1 phút 30","p":["我最喜欢的运动是篮球，我从中学开始打篮球，到现在已经八年了。","打篮球不但能锻炼身体，还能让人学会和别人合作。一个人打得再好，如果缺乏队友的配合，也很难赢得比赛。","现在我每个周末都和同学们在学校操场打两个小时。比赛有时候非常激烈，球场上的气氛特别热闹，每次打完都出很多汗，学习的压力也一下子没有了。多亏了篮球，我交到了很多好朋友。","我觉得，运动仿佛长流之水，贵在坚持，我会一直打下去。"],"vi":"Môn tôi thích nhất là bóng rổ, chơi từ cấp hai, đến nay tám năm. Bóng rổ không chỉ rèn luyện thân thể mà còn dạy cách hợp tác — giỏi mấy mà thiếu đồng đội cũng khó thắng. Giờ cuối tuần nào tôi cũng chơi hai tiếng với bạn; trận đấu nhiều khi rất gay cấn, không khí náo nhiệt, chơi xong ra đầy mồ hôi, áp lực học tập tan biến. Nhờ bóng rổ tôi có nhiều bạn tốt. Vận động như dòng nước chảy dài, quý ở kiên trì."},{"who":"跑步","meta":"Hướng B · bài nói ~1 phút 30","p":["说到运动，我首先想到的是跑步，因为它简单又方便。","这项运动不需要什么工具，只要有一双运动鞋就可以了。而且跑步可以根据自己的身体情况来决定速度和距离，不会造成伤害。","以前我很缺乏运动，经常感冒，晚上也睡不好。后来我开始每天早上跑三公里，刚开始很累，可是坚持了一个月以后，我仿佛变了一个人：精神好了，一年都没怎么生过病。困扰我很久的失眠问题就这样被跑步解决了。","跑步让我明白了，很多事情不难，难的是坚持。"],"vi":"Nói đến thể thao tôi nghĩ ngay đến chạy bộ vì đơn giản, tiện lợi: không cần dụng cụ, chỉ cần giày thể thao, tự điều chỉnh tốc độ và quãng đường nên không gây chấn thương. Trước tôi rất ít vận động, hay cảm, ngủ kém. Sau đó mỗi sáng chạy 3 km, đầu tiên rất mệt, nhưng sau một tháng như biến thành người khác: tinh thần tốt, cả năm hầu như không ốm; chứng mất ngủ được giải quyết. Chạy bộ dạy tôi: việc không khó, khó là kiên trì."}],"write":[{"who":"范文 1 · 篮球","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜欢的一项运动","p":["我最喜欢的运动是篮球。","打篮球不但能锻炼身体，还能让人学会和别人合作。","比赛很激烈，球场上的气氛也特别热闹。","多亏了篮球，我交到了很多好朋友。"],"vi":"Bố cục 4 câu: môn gì → lợi ích → không khí trận đấu (激烈、气氛) → ảnh hưởng (多亏)."},{"who":"范文 2 · 太极拳","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜欢的一项运动","p":["来中国以后，我喜欢上了太极拳。","它的动作很慢，不像别的运动那么激烈，老人和孩子都可以练。","每天早上，我都跟着公园里的爷爷奶奶一起练。","练完以后，我觉得身体和心情都放松了。"],"vi":"Giới thiệu môn truyền thống; so sánh với 激烈; kết bằng cảm nhận."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我喜欢的一项运动","p":["说到运动，我首先想到的是跑步，因为它简单又方便，只要有一双运动鞋就可以了。","以前我很缺乏运动，经常感冒，晚上也睡不好。后来我开始每天早上跑三公里，坚持了一个月以后，我仿佛变了一个人。困扰我很久的失眠问题就这样被跑步解决了。","其实，运动本来就不难，难都是我们自己的懒造成的。连专业运动员都需要每天训练，更何况我们呢？","运动仿佛长流之水，贵在坚持。"],"good":["困扰我很久的失眠问题就这样被跑步解决了","其实，运动本来就不难，难都是我们自己的懒造成的","连专业运动员都需要每天训练，更何况我们呢"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 困扰……的问题就这样被……解决了 · 其实，……本来就……，……都是……造成的 · 连……都……，更 (function(){
