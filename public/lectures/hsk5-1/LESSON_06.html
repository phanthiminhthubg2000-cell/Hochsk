<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 06 · 除夕的由来 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

<script>window.LESSON={"ALIAS":{"骨":"骨头","盆子":"盆"},"BIANXI":[{"pair":"打听 — 询问","book":true,"head":["","打听","询问"],"rows":[["共同点","都是动词，都有“问”的意思。<br><span class='zh'>他<b>打听/询问<\/b>了老人的身体和生活情况。<\/span>",null],["不同点 1","多用于<b>口语<\/b>。<br><span class='zh'>我跟您<b>打听<\/b>一下，附近有邮局吗？<\/span>","多用于<b>书面语<\/b>。<br><span class='zh'>他仔细地<b>询问<\/b>了公司近年来的发展情况。<\/span>"],["不同点 2","一般用于寻找、了解有关信息，后面可以跟结果补语“到”。<br><span class='zh'>我到处<b>打听<\/b>也没<b>打听到<\/b>这家公司。<\/span>","后面一般不能带结果补语“到”；另外，还有<b>征求意见<\/b>的意思。<br><span class='zh'>他打电话<b>询问<\/b>刘教授对论文的意见。<\/span>"],["不同点 3","没有这种用法。","后面可以跟<b>动作的对象<\/b>（人），还可以活用为名词。<br><span class='zh'>警察<b>询问<\/b>了当天见过他的邻居。他详细地回答了病人的<b>询问<\/b>。<\/span>"]],"opts":["打听","询问","都可以"],"quiz":[["A：打扰一下，向您____件事。你知道王老板有什么兴趣爱好吗？",0,"口语，向别人了解信息，用“打听”（课本例题）。"],["她____到北京有位医生能治这个病，就带着孩子来了。",0,"后面有结果补语“到”，只能用“打听”。"],["我____了一下，附近像这样的房子，差不多都得一百万。",0,"口语，了解房价信息，用“打听”。"],["我____了几个修过机器的顾客，他们对小刘的服务都很满意。",1,"后面直接跟动作的对象（顾客），用“询问”。"]]},{"pair":"赶紧 — 急忙","book":false,"head":["","赶紧","急忙"],"rows":[["共同点","都是副词，都表示动作快、不拖延。<br><span class='zh'>听到哭声，他<b>赶紧/急忙<\/b>跑了过去。<\/span>",null],["不同点 1","可以用于<b>还没发生<\/b>的事，常用于祈使句、建议。<br><span class='zh'>天快黑了，你<b>赶紧<\/b>回家吧！<\/span>","一般用于<b>已经发生<\/b>的事，多用于叙述，不能用于祈使句。<br><span class='zh'>“夕”吓得什么似的，<b>急忙<\/b>往外逃。<\/span>"],["不同点 2","侧重<b>抓紧时间<\/b>。","侧重<b>心里着急<\/b>，动作匆忙。可以说“急急忙忙”。"]],"opts":["赶紧","急忙","都可以"],"quiz":[["你____给他回个电话，他好像有什么急事找你。",0,"祈使句，还没发生的事，用“赶紧”（课本练习2）。"],["忽然，他看见小木屋的方向升起了黑烟，他____跑过去看。",2,"叙述已经发生的事，两个都可以（课本练习3用“急忙”）。"],["时间不早了，我们____出发吧。",0,"建议，用“赶紧”。"],["他起晚了，____忙地穿上衣服就出门了。",1,"“急急忙忙”是“急忙”的重叠形式，“赶紧”不能这样用。"]]},{"pair":"果然 — 居然","book":false,"head":["","果然","居然"],"rows":[["共同点","都是副词，都用在动词或形容词前面，表示对事情的看法。",null],["不同点 1","事实跟说的或想的<b>一样<\/b>。<br><span class='zh'>到了晚上，“夕”<b>果然<\/b>出来了。<\/span>","事实跟想的<b>不一样<\/b>，出乎意料。<br><span class='zh'>这么难的题，他<b>居然<\/b>做对了。<\/span>"],["不同点 2","前面常有“说、预报、听说”等表示预先知道的内容。","常带有吃惊、意外的语气。"]],"opts":["果然","居然","都可以"],"quiz":[["天气预报说今天有雨，下午____下起了大雨。",0,"跟预报的一样，用“果然”。"],["他平时成绩很差，这次____考了第一名。",1," i cùng của năm âm lịch. Ngay hôm sau là 春节 (mùng 1 Tết). Đêm 除夕 cả nhà ăn 年夜饭 (bữa cơm tất niên) và 守岁 (thức đón giao thừa).","table":[["词语","拼音","Tiếng Việt"],["除夕","chúxī","đêm giao thừa"],["大年三十","dànián sānshí","ngày 30 Tết"],["年夜饭","niányèfàn","bữa cơm tất niên"],["守岁","shǒusuì","thức đón giao thừa"],["春节","Chūnjié","Tết Nguyên đán"],["正月初一","zhēngyuè chūyī","mùng 1 tháng Giêng"]]},{"tab":"新年风俗","title":"这些图标代表什么新年风俗？","type":"reveal","lead":"Nhìn biểu tượng, nói phong tục năm mới bằng tiếng Trung, rồi bấm “？” để kiểm tra.","items":[["🥟","包饺子","gói sủi cảo"],["🧨","放鞭炮","đốt pháo"],["🧧","给压岁钱","lì xì (tiền mừng tuổi)"],["📜","贴春联","dán câu đối Tết"],["🐉","舞龙舞狮","múa rồng múa lân"],["🏮","逛庙会","đi hội chùa"]],"note":"Từ trong bài: <b class='zh'>守岁、鞭炮、风俗<\/b>. Phần 运用 (mục 07) sẽ dùng các phong tục này để viết “我眼中的中国春节”."},{"tab":"比一比","title":"中国的春节和你们国家的新年有什么相同或不同？","type":"discuss","q":"你知道中国春节时有哪些传统食物和风俗吗？和你们国家的新年比较一下，说说有什么相同或不同的情况。","vn":"Bạn biết những món ăn và phong tục truyền thống nào của Tết Trung Quốc? So sánh với năm mới ở nước bạn.","answer_zh":"中国人过春节要吃饺子、年糕，越南人过春节要吃粽子（bánh chưng）。两个国家都有守岁、拜年、给孩子压岁钱的习惯。不同的是，越南人大年初一很重视“第一个来家里拜年的人”。","answer_vn":"Giống: thức giao thừa, chúc Tết, lì xì. Khác: món ăn (饺子 sủi cảo / 粽子 bánh chưng), tục “xông đất” ở Việt Nam.","table":[["","中国","越南"],["食物","饺子、年糕、鱼","粽子（bánh chưng）、腌菜"],["活动","贴春联、放鞭炮、看春晚","拜年、给压岁钱、去寺庙"]]}],"GAME":{"fill":[["人们把农历十二月三十日这一年中的最后一天叫作{}","除夕",["除夕","春节","元旦","守岁"]],["经常出来{}百姓……","伤害",["伤害","伤心","害怕","危害"]],["百姓对其恨之入骨，但是又十分{}。","无奈",["无奈","无聊","无论","无数"]],["看到邻居家女孩的外公坐在路边哭，于是上前{}……","询问",["询问","打听","回答","问好"]],["替百姓除掉这个{}灾害的东西。","制造",["制造","创造","制作","发生"]],["{}，它还特别害怕声响。","此外",["此外","另外","然后","以外"]],["一见到“夕”就{}敲打东西……","赶紧",["赶紧","急忙","赶快","抓紧"]],["到了晚上，“夕”{}出来了。","果然",["果然","居然","竟然","虽然"]],["“夕”吓得什么{}，急忙往外逃。","似的",["似的","一样","好像","像"]],["百姓{}对七郎表达谢意。","纷纷",["纷纷","常常","渐渐","都"]]],"order":[["全家人|会一起|吃年夜饭，|守岁。"],["百姓|对其恨之入骨，|但是又|十分无奈。"],["他|到处打听|“夕”的消息。"],["此外，|它还|特别害怕|声响。"],["七郎跑上前去，|一箭|射死了|“夕”。"],["就这样|一代代|传下来。"]]},"GOOD":[{"zh":"人们把农历十二月三十日这一年中的最后一天叫作除夕","vn":"người ta gọi ngày cuối cùng trong năm — ngày 30 tháng 12 âm lịch — là 除夕","why":"Câu định nghĩa chuẩn để <b>giới thiệu một ngày lễ / khái niệm<\/b>: <b>人们把 A 叫作 B<\/b>. Định ngữ dài đặt trước A làm câu chặt chẽ.","frame":"人们把 + （时间／事物）+ 叫作 + 名称","apply":"在越南，人们把农历正月初一到初三这几天叫作“Tết”。","apply_vn":"Ở Việt Nam, người ta gọi mấy ngày từ mùng 1 đến mùng 3 tháng Giêng âm lịch là “Tết”."},{"zh":"百姓对其恨之入骨，但是又十分无奈","vn":"dân chúng căm ghét nó đến tận xương tủy nhưng lại hoàn toàn bất lực","why":"<b>对……恨之入骨／充满……<\/b> + <b>但是又十分无奈<\/b>: diễn tả hai cảm xúc mâu thuẫn trong một câu. 其 = 它 (văn viết).","frame":"某人 + 对 + 某事 + （感情很深），但是又十分无奈","apply":"很多人对城市的空气污染非常不满，但是又十分无奈。","apply_vn":"Nhiều người rất bất mãn với ô nhiễm không khí thành phố nhưng lại bất lực."},{"zh":"一问才知道，原来天真可爱的女孩被“夕”吃掉了","vn":"hỏi ra mới biết, hóa ra cô bé ngây thơ đáng yêu đã bị “Tịch” ăn mất","why":"<b>一 + V + 才知道，原来……<\/b>: kể chuyện có <b>bước ngoặt<\/b>, tạo bất ngờ cho người đọc — rất hợp bài viết 71 (kể theo tranh).","frame":"一 + 问／看／打听 + 才知道，原来 + 事实","apply":"我一打听才知道，原来春节前后的火车票早就卖光了。","apply_vn":"Tôi hỏi ra mới biết, hóa ra vé tàu dịp trước sau Tết đã bán hết từ lâu."},{"zh":"它一般在太阳落山后出来害人，到天亮前又会逃得连影子都找不着了","vn":"nó thường ra hại người sau khi mặt trời lặn, đến trước lúc trời sáng lại chạy trốn mất tăm, bóng cũng không thấy","why":"<b>逃得连影子都找不着了<\/b>: bổ ngữ trình độ + <b>连……都……<\/b> phóng đại, sinh động hơn hẳn “逃走了”.","frame":"V + 得 + 连……都 + 否定","apply":"下课铃一响，孩子们就跑得连影子都看不见了。","apply_vn":"Chuông tan học vừa reo, bọn trẻ đã chạy mất hút, bóng cũng chẳng thấy."},{"zh":"就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗","vn":"cứ thế truyền từ đời này sang đời khác, hình thành phong tục thức giao thừa, đốt pháo đêm 除夕","why":"Câu kết kinh điển khi viết về <b>nguồn gốc phong tục / truyền thống<\/b>: <b>就这样一代代传下来，形成了……的风俗<\/b>.","frame":"就这样一代代传下来，形成了 + ……的风俗／传统","apply":"就这样一代代传下来，形成了越南人春节包粽子的风俗。","apply_vn":"Cứ thế truyền qua bao đời, hình thành phong tục gói bánh chưng ngày Tết của người Việt."}],"GRAMMAR":[{"word":"替","py":"tì","pos":"动词／介词","forms":["动词：替 + 某人（= 代替）","介词：替 + 某人 + 动词（= 给、为）"],"vn":"<b>替<\/b> ① động từ: <b>thay thế<\/b> (代替) — 你能替替他吗？ ② giới từ: <b>thay cho, vì, cho<\/b> (= 给、为) — 替百姓除掉…, 替他高兴 (mừng cho anh ấy), 替我问好 (gửi lời hỏi thăm giúp tôi).","text":"七郎暗暗下定决心一定要杀死“夕”，替百姓除掉这个制造灾害的东西。","ex":[["见了外公，你替我向他问好。","Gặp ông ngoại, con gửi lời hỏi thăm ông giúp mẹ nhé. (giới từ)"],["刘老师今天有点儿事来不了，你能替替他吗？","Hôm nay thầy Lưu có việc không đến được, bạn dạy thay thầy được không? (động từ)"],["李阳要去留学了，我们都替他高兴。","Lý Dương sắp đi du học, chúng tôi đều mừng cho cậu ấy. (giới từ)"]],"err":[["❌ 我替你很高兴。","✅ 我替你高兴。／我真替你高兴。","替 + người + 高兴/着急: không chen 很 vào giữa; muốn nhấn mạnh dùng 真."],["❌ 你替我问好他。","✅ 你替我向他问好。","问好 không mang tân ngữ; dùng 向 + người + 问好."]],"book":[["你放心吧，他借的钱____________。（替）","Gợi ý: tôi trả thay anh ấy.","你放心吧，他借的钱我替他还"],["后天就要考试了，小明的病还没好，____________。（替）","Gợi ý: lo lắng cho cậu ấy.","后天就要考试了，小明的病还没好，大家都替他着急"],["A：明天，我去上海出差，要带点儿什么东西吗？<br>B：____________。（替）","Gợi ý: mua giúp tôi ít đặc sản.","不用带什么，你替我向上海的朋友问个好吧"]],"drill":[["“替”在这里是什么词？ 刘老师有事来不了，你能替替他吗？",["动词（代替）","介词（给、为）"],0,"替替他 = dạy thay → động từ, có thể lặp lại."],["“替”在这里是什么词？ 我们都替他高兴。",["动词（代替）","介词（给、为）"],1,"替 + người + 高兴 → giới từ."],["Câu nào đúng?",["你替我向王老师问好。","你替我问好王老师。","你问好替我王老师。"],0,"替我 + 向 + người + 问好."]]},{"word":"说不定","py":"shuōbudìng","pos":"动词／副词","forms":["动词：（还）说不定（= 不能肯定）","副词：说不定 + 动词短语（= 可能性很大）"],"vn":"<b>说不定<\/b> ① động từ: <b>chưa chắc, chưa nói trước được<\/b> — 时间还说不定. ② phó từ: <b>có lẽ, biết đâu<\/b> (khả năng lớn) — 说不定下次就成功了.","text":"于是七郎告诉这里的百姓，“夕”说不定晚上要出来伤害大家……","ex":[["这事儿经理已经同意了，只是出发的时间还说不定。","Việc này giám đốc đã đồng ý, chỉ là thời gian khởi hành còn chưa chắc. (động từ)"],["周末他起得晚，这会儿说不定还在睡觉呢。","Cuối tuần anh ấy dậy muộn, giờ này có lẽ vẫn đang ngủ. (phó từ)"],["别随随便便就说放弃，说不定下次就成功了。","Đừng tùy tiện nói bỏ cuộc, biết đâu lần sau sẽ thành công. (phó từ)"]],"err":[["❌ 他说不定明天来不来。","✅ 他明天来不来还说不定。／他明天说不定不来。","Động từ 说不定 đứng sau câu hỏi chính phản; phó từ 说不定 không đi với 来不来."],["❌ 说不定他会来吗？","✅ 说不定他会来。","说不定 là phỏng đoán, không dùng với 吗."]],"book":[["你再去图书馆或书店转转，____________。（说不定）","Gợi ý: biết đâu tìm được sách.","你再去图书馆或书店转转，说不定能找到那本书"],["A：今年的优秀毕业生定了吗？李阳有希望吗？<br>B：____________。（说不定）","Gợi ý: chưa định; cậu ấy học tốt, có lẽ được.","还没定呢，不过他成绩那么好，说不定能选上"],["A：要想达到他那样的成就，我这辈子是不敢想了。<br>B：____________。（说不定）","Gợi ý: cố gắng thì biết đâu còn hơn.","别这么说，只要你努力，说不定比他还成功呢"]],"drill":[["“说不定”在这里是什么用法？ 出发的时间还说不定。",["动词：不能肯定","副词：可能性很大"],0,"Làm vị ngữ, nghĩa “chưa chắc”."],["“说不定”在这里是什么用法？ 这会儿说不定还在睡觉呢。",["动词：不能肯定","副词：可能性很大"],1,"Đứng trước cụm động từ → phỏng đoán."],["选择：天这么阴，____要下雨，带把伞吧。",["说不定","不一定","一定不"],0,"Phỏng đoán khả năng lớn → 说不定."]]},{"word":"似的","py":"shìde","pos":"助词","forms":["像／跟／好像 + 名词／短语 + 似的","形容词／动词 + 得 + 什么似的（夸张）"],"vn":"<b>似的<\/b> là trợ từ, cuối cụm so sánh: <b>像/跟/好像……似的<\/b> = giống như…. Cấu trúc <b>……得什么似的<\/b> thay cho trạng thái muốn nói, mang ý <b>phóng đại<\/b>: 累得什么似的 (mệt muốn chết), 吓得什么似的 (sợ hết hồn). Văn viết.","text":"“夕”吓得什么似的，急忙往外逃。","ex":[["消息一出来，询问情况的电话雪片似的纷纷打来。","Tin vừa ra, điện thoại hỏi han gọi đến tới tấp như tuyết rơi."],["我不敢相信这是真的，好像做梦似的。","Tôi không dám tin đây là thật, cứ như đang mơ."],["刘方背着重重的电脑包挤地铁，下班回到家累得什么似的。","Lưu Phương đeo túi laptop nặng chen tàu điện ngầm, tan làm về nhà mệt rã rời."]],"err":[["❌ 他高兴得似的。","✅ 他高兴得什么似的。","Cấu trúc phóng đại phải có 什么: 得什么似的."],["❌ 她像妈妈似。","✅ 她像妈妈似的。","似的 đọc shìde, không bỏ 的."]],"book":[["丽丽爱读书，一天要是不看点儿什么，____________。（似的）","Gợi ý: như thiếu cái gì đó.","丽丽爱读书，一天要是不看点儿什么，就好像少了点儿什么似的"],["李阳考上了北大，____________。（似的）","Gợi ý: vui không tả xiết.","李阳考上了北大，高兴得什么似的"],["A：小刘怎么了？她今天有点儿不太高兴。<br>B：____________。（似的）","Gợi ý: hình như có tâm sự.","是啊，她好像有什么心事似的"]],"drill":[["选择：孩子们看到雪，高兴得____。",["什么似的","似的什么","什么一样似"],0,"……得什么似的."],["“累得什么似的”的意思是：",["非常累","一点儿也不累","好像累"],0,"Phóng đại mức độ: rất mệt."],["Câu nào đúng?",["他跑得像风似的。","他跑得似的像风。","他似的跑得像风。"],0,"像 + N + 似的."]]},{"word":"纷纷","py":"fēnfēn","pos":"形容词／副词","forms":["形容词：名词／动词 + 纷纷（多而乱）：落叶纷纷、议论纷纷","副词：纷纷 + 动词（接二连三地）"],"vn":"<b>纷纷<\/b> ① tính từ: (lời bàn tán, vật rơi) <b>nhiều và lộn xộn<\/b> — 落叶纷纷, 议论纷纷. ② phó từ, đứng trước động từ: <b>lần lượt, tới tấp<\/b> (nhiều người/vật nối tiếp nhau) — 纷纷表达谢意. Chủ ngữ phải là <b>số nhiều<\/b>.","text":"除掉“夕”以后，百姓纷纷对七郎表达谢意。","ex":[["秋风刮起，落叶纷纷。","Gió thu nổi lên, lá rụng lả tả. (tính từ)"],["他救起了妻子，孩子却被大水冲走了。事后，人们议论纷纷。","Anh ấy cứu được vợ nhưng con bị nước lũ cuốn đi. Sau đó mọi người bàn tán xôn xao. (tính từ)"],["要下雨了，路上的人纷纷往家里跑。","Sắp mưa rồi, người đi đường lần lượt chạy về nhà. (phó từ)"]],"err":[["❌ 他纷纷表达了谢意。","✅ 大家纷纷表达了谢意。","纷纷 cần chủ ngữ số nhiều; một người dùng 连连/不停地."],["❌ 同学们纷纷地都举手了。","✅ 同学们纷纷举手。","纷纷 đã có nghĩa “lần lượt, ai cũng”, không cần thêm 都."]],"book":[["新年快到了，各大商场、购物中心____________。（纷纷）","Gợi ý: lần lượt giảm giá.","新年快到了，各大商场、购物中心纷纷打折"],["见到熊猫的游客们非常兴奋，____________。（纷纷）","Gợi ý: lấy máy ảnh ra chụp.","见到熊猫的游客们非常兴奋，纷纷拿出相机拍照"],["A：听说了吗？小刘的妻子生了个女儿。<br>B：____________。（纷纷）","Gợi ý: đồng nghiệp lần lượt chúc mừng.","听说了，同事们纷纷去医院看望她们"]],"drill":[["“纷纷”在这里是什么词？ 秋风刮起，落叶纷纷。",["形容词（多而乱）","副词（接二连三地）"],0,"Làm vị ngữ sau danh từ → tính từ."],["“纷纷”在这里是什么词？ 路上的人纷纷往家里跑。",["形容词（多而乱）","副词（接二连三地）"],1,"Đứng trước động từ → phó từ."],["Câu nào đúng?",["比赛结束后，观众纷纷离开了。","比赛结束后，我纷纷离开了。","比赛结束后，观众离开了纷纷。"],0,"Chủ ngữ số nhiều + 纷纷 + V."]]}],"HSK":{"r1":[{"text":["除夕晚上，小明的爷爷给了他一个大红包。小明{36}打开一看，里面只有一张纸，上面写着：“好好学习，天天向上。”小明很失望。爷爷笑着说：“别急，这是第一个红包。{37}，我就给你第二个。”小明问：“那第二个红包里是什么？”爷爷说：“{38}——‘继续努力’。”"],"qs":[{"n":36,"o":["无奈地","赶紧","纷纷","果然"],"a":1,"why":"拿到红包很想知道里面是什么，所以“赶紧”打开。“纷纷”要求主语是多数。"},{"n":37,"o":["如果你今天不熬夜","因为你放了鞭炮","等你考了第一名","虽然你还小"],"a":2,"why":"“等……，我就……”，表示条件实现后再做某事，和后文“第二个红包”连贯。"},{"n":38,"o":["是更多的压岁钱","还是四个字","是一盒饺子","我还没想好"],"a":1,"why":"笑话的关键：第二个红包里也只是四个字“继续努力”，前后呼应。"}]},{"text":["每年春节前后，中国都会出现一次大规模的人口流动，人们把它叫作“春运”。在外地工作、学习的人{39}，就算买不到坐票，站十几个小时也要回去。{40}，是因为在中国人心中，春节最重要的意义是团圆。近年来，高铁越来越多，回家的时间{41}了。不过，不管路有多远，{42}。"],"qs":[{"n":39,"o":["纷纷赶回家乡","都留在城市","很少回家","一起去旅游"],"a":0,"why":"“春运”就是很多人接二连三地回家，后文“站十几个小时也要回去”也说明这一点。"},{"n":40,"o":["人们这么做","人们之所以这么想尽办法回家","火车票很便宜","城市里太冷"],"a":1,"why":"“之所以……，是因为……”是固定搭配，说明原因。"},{"n":41,"o":["延长","增加","缩短","制造"],"a":2,"why":"高铁速度快，回家的时间“缩短”了。"},{"n":42,"o":["人们回家的愿望都不会改变","人们都不想回家","高铁票都很便宜","春节都会变得不重要"],"a":0,"why":"“不管……，都……”，表示在任何条件下结果都不变，呼应“团圆”的主题。"}]}],"r2":[{"start":46,"paras":["这种木板叫作“桃符”，人们相信它能保护全家平安。","传说很久以前，有两个神仙专门管理那些出来害人的鬼怪。","就这样一代代传下来，桃符慢慢变成了今天的春联。","于是，每到过年的时候，人们就把这两个神仙的名字写在桃木板上，挂在大门两边。","到了宋代，人们开始在桃符上写吉利的对子，代替神仙的名字。"],"ans":["B","D","A","E","C"],"why":"传说的背景（B）→ 人们把神仙的名字写在桃木板上（D）→ 这种木板叫“桃符”（A）→ 宋代改写对子（E）→ 变成春联（C）。"}],"r3":[{"text":["1983年除夕，中央电视台第一次举办了春节联欢晚会，也就是人们常说的“春晚”。那时候，很多家庭刚刚买了电视，全家人围坐在一起看春晚，觉得又新鲜又热闹。从那以后，看春晚就成了很多中国人除夕夜的新风俗。","春晚一般从晚上八点开始，一直到第二天凌晨。节目有唱歌、跳舞、小品、相声等，其中最受欢迎的是小品。很多小品里的话第二天就被人们纷纷说起，成了流行语。到了十二点，主持人和观众一起倒数，迎接新年的到来。","可是近几年，<u><b>关于春晚的看法越来越不一样了<\/b><\/u>。有人说春晚的节目越来越没意思，宁可上网玩手机；也有人认为，春晚的意义不在于节目好不好看，而在于一家人能坐在一起。","不管怎样，春晚已经陪伴中国人走过了四十多年。对很多人来说，它就像年夜饭和鞭炮一样，是春节不能少的一部分。"],"qs":[{"n":56,"s":"关于第一届春晚，可以知道：","o":["是在2000年举办的","很多人觉得又新鲜又热闹","只有很少的人看","节目只有唱歌"],"a":1,"why":"第一段：全家人围坐在一起看春晚，觉得又新鲜又热闹。"},{"n":57,"s":"春晚的节目中，最受欢迎的是：","o":["唱歌","跳舞","相声","小品"],"a":3,"why":"第二段：其中最受欢迎的是小品。"},{"n":58,"s":"第三段画线句子的意思是：","o":["大家都不看春晚了","人们对春晚的评价不同","春晚的时间改了","春晚的节目越来越多"],"a":1,"why":"后文说“有人说……也有人认为……”，说明人们对春晚的看法不同。"},{"n":59,"s":"最适合做上文题目的是：","o":["除夕夜的“新风俗”——春晚","怎样表演小品","电视的历史","年夜饭吃什么"],"a":0,"why":"全文介绍春晚的由来、节目、人们的看法和它对中国人的意义。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出这位年轻人回家过年的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện chàng trai về quê ăn Tết.","panels":[["🏙️","小王在大城市工作，春节快到了，他特别想家。"],["🚄","火车站里人山人海，他排了很长时间的队才买到票。"],["🏠","除夕晚上，他终于回到家，妈妈做了一桌子菜。"],["🧨","十二点，全家人一起放鞭炮，小王觉得特别幸福。"]],"min":100,"tips":["Kể theo 4 tranh: nhớ nhà → mua vé vất vả → về đến nhà → cả nhà đón giao thừa.","Có thể dùng: 纷纷、熬夜、守岁、果然、高兴得什么似的."],"sample":"小王在大城市工作，已经一年没有回家了。春节快到了，他特别想念家人。火车站里人山人海，大家纷纷赶着回家，小王排了三个小时的队，才终于买到了一张票。除夕晚上，他推开家门，妈妈果然做了一桌子他最爱吃的菜。吃完年夜饭，全家人一起守岁。到了十二点，大家一起放鞭炮，小王高兴得什么似的。他觉得，再辛苦也值得。","svn":"Tiểu Vương làm việc ở thành phố, Tết sắp đến rất nhớ nhà; xếp hàng ba tiếng mới mua được vé; đêm giao thừa về đến nhà, mẹ quả nhiên nấu một bàn món anh thích; 12 giờ cả nhà đốt pháo, anh vui không tả xiết."},"w72":{"prompt":"现在，很多城市规定春节期间不许放鞭炮。有人支持，认为可以减少污染和危险；也有人反对，认为没有鞭炮声就没有年味儿。请写一篇不少于200字的作文，谈谈你的看法。","vn":"Nhiều thành phố cấm đốt pháo dịp Tết. Người ủng hộ: giảm ô nhiễm và nguy hiểm; người phản đối: không có tiếng pháo thì mất không khí Tết. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"年味儿不只在鞭炮声里","tips":["Nêu quan điểm → lý do 1 (ô nhiễm, an toàn) → lý do 2 (phong tục có thể thay đổi, có cách khác giữ 年味儿) → nhìn nhận ý kiến ngược lại → kết luận.","Dùng khung 好句: 就这样一代代传下来，形成了……的风俗 · 对……，但是又……"],"sample":"放鞭炮是中国春节的传统风俗。传说古时候人们敲打出响声，是为了吓跑一个叫“夕”的怪物，就这样一代代传下来，形成了除夕夜放鞭炮的风俗。可是我认为，在城市里限制放鞭炮是有道理的。\n首先，放鞭炮会制造大量的烟和垃圾，污染空气。其次，每年都有人因为放鞭炮受伤，甚至引起火灾，给自己和别人带来很大的伤害。\n当然，很多人对鞭炮有很深的感情，觉得没有鞭炮声，年味儿就少了很多。不过在我看来，春节最重要的意义是一家人团圆。一起包饺子、吃年夜饭、守岁、拜年，这些同样能让人感受到浓浓的年味儿。\n所以，风俗可以随着时代改变。年味儿不只在鞭炮声里，更在家人的笑声里。","svn":"Bài nghị luận: nguồn gốc tục đốt pháo → quan điểm ủng hộ hạn chế → 首先 ô nhiễm, 其次 nguy hiểm → thừa nhận ý kiến ngược lại → ý nghĩa thật của Tết là đoàn viên → kết luận."}},"PRACTICE":{"ex1":{"bank":["赶紧","无奈","制造","果然","伤害","此外"],"items":[["还真让你说对了，他{}还不知道这件事。",["果然"]],["两岁的果果是我们家最能{}麻烦的人。",["制造"]],["姑娘脸上表现出很{}的样子。",["无奈"]],["他喜欢音乐、电影、运动，{}还喜欢旅行。",["此外"]],["不用送了，{}回去吧，家里还有别的客人呢。",["赶紧"]],["经常熬夜对身体的{}极大。",["伤害"]]]},"ex2":[["人的思想感情是非常丰富的，有些是无法用语言准确____的。",["表示","表达"],1],["你____给他回个电话，他好像有什么急事找你。",["急忙","赶紧"],1],["今天是不可能了，你____安排一个时间见面吧。",["此外","另外"],1],["明星的影响力____不一般。",["果然","居然"],0]],"ex3":[["你的担心不是<u>A<\/u>没有<u>B<\/u>道理的，今天李阳<u>C<\/u>没有<u>D<\/u>通过面试。","果然",2,"你的担心不是没有道理的，今天李阳果然没有通过面试。"],["<u>A<\/u>学院<u>B<\/u>所有的<u>C<\/u>老师同学都在议论<u>D<\/u>这件事。","整个",0,"整个学院所有的老师同学都在议论这件事。"],["<u>A<\/u>路上的人<u>B<\/u>他着急，拉住<u>C<\/u>他的马，阻止<u>D<\/u>他说：“方向错了。”","替",1,"路上的人替他着急，拉住他的马，阻止他说：“方向错了。”"],["忽然，他<u>A<\/u>看见小木屋的方向<u>B<\/u>升起了黑烟，<u>C<\/u>他<u>D<\/u>跑过去看。","急忙",3,"忽然，他看见小木屋的方向升起了黑烟，他急忙跑过去看。"]],"ex4":[["“夕”的情况和习性","怪物、伤害、制造、灾害、响声、影子","传说很久以前有个叫“夕”的怪物，经常出来伤害百姓，制造灾害。它一般在太阳落山后出来害人，天亮前逃得连影子都找不着，还特别害怕响声。"],["七郎除掉“夕”的经过","果然、锅、盆、吓、似的、逃、射","年三十晚上，“夕”果然出来了。人们敲响了家里的锅和盆子，“夕”吓得什么似的，急忙往外逃。七郎的狗咬住了它，七郎一箭射死了“夕”。"],["年三十的风俗习惯","守岁、熬夜、鞭炮","后来，人们每年年三十晚上都熬夜不睡觉，敲打出响声。就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。"]],"ext":{"title":"扩展 · 话题：旅游 · 节日","words":[["名胜古迹","míngshèng gǔjì","danh lam thắng cảnh"],["风景","fēngjǐng","phong cảnh"],["展览","zhǎnlǎn","triển lãm"],["合影","hé yǐng","chụp ảnh chung"],["预订","yùdìng","đặt trước"],["结账","jiézhàng","thanh toán"],["团","tuán","đoàn"],["时差","shíchā","chênh lệch múi giờ"],["国庆节","Guóqìngjié","Quốc khánh"],["元旦","Yuándàn","Tết Dương lịch"],["除夕","chúxī","đêm giao thừa"]],"items":[["我们还是先{}好宾馆吧，到了那儿再找比较麻烦。","预订"],["你好，我要退房，现在可以{}吗？","结账"],["我昨天刚从英国回来，{}还没倒过来。","时差"],["在北京留学的这一年，这里的各大{}我都看遍了。","名胜古迹"]]}},"TEXT":[{"title":"什么是除夕","sub":"年三十的问题","paras":["在中国，人们把农历十二月三十日这一年中的最后一天叫作除夕，这一天，全家人会一起吃年夜饭，守岁。但是，人们为什么要把年三十叫作除夕呢？"],"idea":"Ngày cuối cùng của năm âm lịch (30 tháng Chạp) gọi là <b>除夕<\/b>; hôm ấy cả nhà ăn cơm tất niên và <b>thức đón giao thừa<\/b>. Câu hỏi mở bài: vì sao lại gọi là 除夕?","qs":[["中国人把哪一天叫作除夕？",["农历一月一日","农历一年中的最后一天","公历十二月三十一日"],1],["除夕这一天，全家人会做什么？",["一起吃年夜饭，守岁","一起去旅游","一起去上班"],0],["第一段最后的问题是什么作用？",["引出下面的传说","总结全文","介绍七郎"],0]]},{"title":"怪物和英雄","sub":"“夕”与七郎","paras":["传说在很久以前，有个叫作“夕”的怪物，经常出来伤害百姓，百姓对其恨之入骨，但是又十分无奈。当时有个英雄叫作七郎，他英俊高大、力大无比。七郎还有一条狗，这条狗非常勇敢，无论咬住什么都不会松口。"],"idea":"Ngày xưa có con quái vật tên <b>“Tịch”<\/b> thường ra hại dân; dân căm ghét đến tận xương nhưng <b>đành bất lực<\/b>. Có anh hùng <b>Thất Lang<\/b> khôi ngô, khỏe vô địch, cùng một con chó dũng cảm, cắn gì cũng không nhả.","qs":[["百姓对“夕”是什么态度？",["很喜欢它","恨之入骨，但是又十分无奈","一点儿也不怕它"],1],["七郎是一个什么样的人？",["英俊高大、力大无比","又矮又瘦","很胆小"],0],["七郎的狗有什么特点？",["很懒","非常勇敢，咬住什么都不松口","很爱叫"],1]]},{"title":"寻找“夕”","sub":"七郎下定决心","paras":["一天，七郎从外边回来，看到邻居家女孩的外公坐在路边哭，于是上前询问，一问才知道，原来天真可爱的女孩被“夕”吃掉了。七郎暗暗下定决心一定要杀死“夕”，替百姓除掉这个制造灾害的东西。于是七郎带着他的狗出发了，他到处打听“夕”的消息，但是一直找不到它。","这样过了差不多一年，这天正好是大年三十，七郎来到了一个热闹的城镇。这一年来，七郎虽然没有找到“夕”，但是了解到了很多关于“夕”的情况：它一般在太阳落山后出来害人，到天亮前又会逃得连影子都找不着了；此外，它还特别害怕声响。于是七郎告诉这里的百姓，“夕”说不定晚上要出来伤害大家，让大家今晚熬夜等着，一见到“夕”就赶紧敲打东西，大家一起把“夕”杀掉。"],"idea":"Cô bé hàng xóm bị “Tịch” ăn thịt, Thất Lang <b>quyết tâm giết “Tịch”<\/b> để trừ hại cho dân. Tìm gần một năm không thấy, nhưng anh biết được: “Tịch” ra sau khi mặt trời lặn, trốn biệt trước lúc trời sáng và <b>rất sợ tiếng động<\/b>. Đêm 30 Tết, anh bảo dân <b>thức trắng<\/b>, thấy “Tịch” thì gõ đồ thật to.","qs":[["七郎为什么下定决心要杀死“夕”？",["“夕”吃掉了邻居家的女孩","“夕”吃掉了他的狗","外公让他去"],0],["七郎了解到“夕”的什么情况？",["白天出来害人","太阳落山后出来，特别害怕声响","喜欢热闹"],1],["七郎让城镇里的百姓怎么做？",["早点儿睡觉","离开城镇","熬夜等着，见到“夕”就敲打东西"],2]]},{"title":"除掉“夕”","sub":"风俗的形成","paras":["太阳很快落山了，到了晚上，“夕”果然出来了。它想吃一户人家的姑娘，被这家人发现了，于是他们立刻敲响了家中的锅和盆子，跟着整个镇子都响了起来。“夕”吓得什么似的，急忙往外逃。七郎的狗追上了“夕”，并死死地咬住了它。七郎跑上前去，一箭射死了“夕”。","除掉“夕”以后，百姓纷纷对七郎表达谢意。由于这一天很有意义，于是人们就在每年的年三十这天晚上，仍然像那天一样整晚不睡觉，敲打出响声。就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。"],"idea":"Đêm đó “Tịch” <b>quả nhiên<\/b> xuất hiện; người dân gõ nồi chậu, cả thị trấn vang lên, “Tịch” sợ hãi bỏ chạy, bị chó cắn giữ và Thất Lang <b>bắn chết bằng một mũi tên<\/b>. Từ đó mỗi đêm 30 người ta thức trắng, tạo tiếng động — hình thành <b>phong tục thức giao thừa, đốt pháo<\/b>.","qs":[["人们发现“夕”以后做了什么？",["立刻敲响了家中的锅和盆子","马上跑出家门","给它吃的东西"],0],["“夕”最后是怎么死的？",["被狗咬死了","被七郎一箭射死了","被百姓打死了"],1],["除夕夜守岁、放鞭炮的风俗是怎么形成的？",["政府规定的","人们每年年三十像那天一样不睡觉、敲打出响声，一代代传下来","七郎要求的"],1]]}],"TEXT_EXTRA":{"compare_title":"春节的风俗习惯","compare_head":["风俗","拼音","Tiếng Việt"],"compare":[["拜年","bài nián","chúc Tết"],["贴春联","tiē chūnlián","dán câu đối Tết"],["放鞭炮","fàng biānpào","đốt pháo"],["包饺子","bāo jiǎozi","gói sủi cảo"],["逛庙会","guàng miàohuì","đi hội chùa"],["看舞龙、舞狮子","kàn wǔ lóng, wǔ shīzi","xem múa rồng, múa lân"],["给压岁钱","gěi yāsuìqián","cho tiền mừng tuổi (lì xì)"]],"bg":"每个国家都有自己的传统节日，新年应该是最热闹的节日之一了。中国人过年时有很多风俗习惯和庆祝活动。亲朋好友要互相拜年，家家户户都要贴春联，放鞭炮，包饺子，逛庙会，看舞龙、舞狮子。另外，大人们也忘不了给孩子红包，这个红包还有一个特别的名字叫“压岁钱”。以上介绍的有关春节的风俗习惯，你知道哪些？","bg_vn":"Năm mới là một trong những ngày lễ náo nhiệt nhất. Người Trung Quốc ăn Tết có nhiều phong tục: chúc Tết, dán câu đối (春联 chūnlián), đốt pháo, gói sủi cảo, đi hội chùa (庙会 miàohuì), xem múa rồng múa lân; người lớn còn cho trẻ con bao lì xì gọi là “压岁钱”.","discuss_title":"话题讨论：我知道的有关中国新年的风俗习惯","discuss":["有关春节的风俗习惯，你比较了解的是什么？","你是怎么知道这些情况的？你感兴趣的地方（或原因）是什么？","如果你能在中国过春节的话，你最想做的是什么？"],"write":"请以“我眼中的中国春节”为题写一段话，介绍一下你对中国春节的了解和看法。尽量用本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我眼中的中国春节”为题写一段话","topic_vn":"Viết một đoạn văn với đầu đề “Tết Trung Quốc trong mắt tôi”","intro":"Dạng đề giới thiệu + nêu cảm nhận (介绍＋看法) · Giới thiệu những gì bạn biết về Tết Trung Quốc, rồi nói cảm nhận, so sánh và mong muốn của bạn · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我眼中的中国春节”：介绍 + 看法","lead":"Đề có hai yêu cầu: <b>介绍一下你对中国春节的了解<\/b> (giới thiệu) và <b>看法<\/b> (cảm nhận, đánh giá). Chữ <b>“我眼中的”<\/b> nghĩa là phải có <b>góc nhìn của bạn<\/b> — chỉ liệt kê phong tục như sách giáo khoa thì mới được một nửa.","parts":[["我眼中的","Góc nhìn cá nhân: 我觉得…, 在我看来…, 让我印象最深的是… — bắt buộc có."],["中国春节","Đối tượng: Tết Trung Quốc — có thể nói thời gian (农历正月初一), phong tục (守岁, 放鞭炮, 包饺子, 压岁钱), ý nghĩa (团圆)."],["了解","Chọn 2–3 phong tục bạn biết rõ, kể cụ thể; có thể dùng truyền thuyết “夕” của bài 6."],["（课本）尽量用本课生词，不少于100字","Dùng: 风俗、守岁、鞭炮、除夕、意义、表达、纷纷、果然、似的… và khung 好句 của bài khóa."]],"traps":[["Chỉ liệt kê phong tục","春节要贴春联、放鞭炮、包饺子、逛庙会… → không có “我眼中”, không có cảm nhận."],["Kể lại cả câu chuyện “夕”","Bài 100 chữ mà dành 80 chữ kể truyền thuyết → lạc đề. Chỉ cần 1–2 câu."],["Nói sai thời gian","春节 là 农历正月初一, 除夕 là ngày cuối năm âm lịch — không nhầm với 元旦 (1/1 dương lịch)."],["Thiếu câu kết","Kết thúc ở phong tục; chưa có cảm nghĩ hay mong muốn của bản thân."]],"link":"<b>Liên hệ bài 6 · 除夕的由来:<\/b> câu kết của bài khóa “就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗” là khung rất hay để giải thích <b>nguồn gốc một phong tục<\/b> trong bước ②. Phần 背景分析 của sách cho sẵn danh sách phong tục: 拜年、贴春联、放鞭炮、包饺子、逛庙会、舞龙舞狮、压岁钱."},"steps":[["①","点题：春节是什么","Mở bài: Tết là ngày lễ quan trọng nhất; thời gian; ấn tượng chung của bạn.","春节是中国最重要的传统节日……"],["②","介绍：风俗习惯","Giới thiệu 2–3 phong tục cụ thể; có thể nói nguồn gốc một phong tục.","除夕晚上，全家人……"],["③","看法：我的感受","<b>Trọng tâm “我眼中”.<\/b> Bạn thích/ấn tượng điều gì, vì sao; có thể so sánh với Tết Việt Nam.","在我看来，春节最重要的意义是……"],["④","总结 · 愿望","Kết: tóm lại cảm nghĩ hoặc mong muốn (有机会去中国过春节).","如果有机会，我最想……"]],"formula":["春节是……","风俗：……、……","我觉得……，因为……","希望／如果有机会……"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 热闹的风俗","phong tục náo nhiệt","Giới thiệu phong tục, nhấn vào không khí vui vẻ, náo nhiệt.","放鞭炮、舞龙舞狮"],["B · 团圆的意义","ý nghĩa đoàn viên","Tập trung vào bữa cơm tất niên, người đi xa về nhà, ý nghĩa gia đình.","年夜饭、春运"],["C · 和越南的春节比一比","so sánh với Tết Việt","Nêu điểm giống và khác giữa Tết hai nước.","饺子 / 粽子 (bánh chưng)"],["D · 从“夕”的传说说起","bắt đầu từ truyền thuyết","Mở bằng câu chuyện “夕”, giải thích nguồn gốc 守岁、放鞭炮.","七郎、一代代传下来"]],"notes":[["Chọn ít mà cụ thể","Hai phong tục kể có chi tiết hay hơn sáu phong tục chỉ nêu tên."],["Luôn có “tôi”","Mỗi đoạn nên có ít nhất một câu thể hiện cảm nhận: 我觉得、让我印象最深的是、我最喜欢…"],["Câu kết","Quay lại đầu đề: “这就是我眼中的中国春节。” hoặc nêu mong muốn."]],"rule":"<b>Nguyên tắc HSK5:<\/b> dùng chắc từ HSK4–5 (传统、风俗、团圆、热闹、意义). Tên phong tục khó (春联、庙会) viết đúng chữ là được cộng điểm; không chắc thì dùng cách nói đơn giản hơn.","patterns":[["① 点题","春节是中国最重要的传统节日，也是最热闹的节日。","Tết là ngày lễ truyền thống quan trọng nhất, cũng là ngày lễ náo nhiệt nhất của Trung Quốc."],["① 点题","在我眼中，中国春节就是一个“红色”的节日。","Trong mắt tôi, Tết Trung Quốc là một ngày lễ “màu đỏ”."],["② 风俗","除夕晚上，全家人一起吃年夜饭，然后守岁到深夜。","Đêm giao thừa cả nhà ăn cơm tất niên rồi thức đón giao thừa đến khuya."],["② 风俗","大人们还会给孩子红包，这个红包叫作“压岁钱”。","Người lớn còn cho trẻ con bao lì xì, gọi là “tiền mừng tuổi”."],["② 由来","就这样一代代传下来，形成了放鞭炮的风俗。","Cứ thế truyền qua bao đời, hình thành phong tục đốt pháo."],["③ 看法","在我看来，春节最重要的意义是一家人团圆。","Theo tôi, ý nghĩa quan trọng nhất của Tết là cả nhà đoàn viên."],["③ 比较","中国的春节和越南的春节有很多相同的地方，比如都要守岁、拜年。","Tết Trung Quốc và Tết Việt Nam có nhiều điểm giống nhau, như đều thức giao thừa, chúc Tết."],["④ 愿望","如果有机会，我最想在中国过一次春节，亲自包一次饺子。","Nếu có cơ hội, tôi muốn nhất là ăn Tết ở Trung Quốc một lần, tự tay gói sủi cảo."]],"links":[["Mở bài",["……是中国最重要的传统节日。","在我眼中，……","说到中国春节，我首先想到的是……"]],["Giới thiệu phong tục",["人们把……叫作……","除夕晚上，……","此外，……还……"]],["Nêu cảm nhận",["在我看来，……","让我印象最深的是……","我觉得……，因为……"]],["Kết bài",["如果有机会，我最想……","这就是我眼中的中国春节。","希望……"]]],"open":[["直接式","春节是中国最重要的传统节日，也是最热闹的节日。"],["印象式","说到中国春节，我首先想到的是红色：红灯笼、红春联、红包。"],["故事式","传说很久以前，有个叫“夕”的怪物，每到年三十晚上就出来伤害百姓。"]],"close":[["愿望式","如果有机会，我最想在中国过一次春节。"],["总结式","这就是我眼中的中国春节：热闹、温暖、充满希望。"],["比较式","虽然两个国家的风俗不完全一样，但是人们对新年的希望是相同的。"]],"from_text":[["人们把 A 叫作 B","人们把农历正月初一叫作春节，把前一天晚上叫作除夕。","Lấy từ 好句 ①: giới thiệu khái niệm."],["对……（感情），但是又……","很多在外地工作的人对家乡十分想念，但是又买不到回家的火车票。","Lấy từ 好句 ②: hai cảm xúc mâu thuẫn (chuyện 春运)."],["一 + V + 才知道，原来……","我一问才知道，原来饺子的样子像古代的钱，表示新的一年能发财。","Lấy từ 好句 ③: chia sẻ điều mới biết."],["V 得连……都……","除夕晚上，鞭炮声大得连电视的声音都听不见了。","Lấy từ 好句 ④: miêu tả phóng đại, sinh động."],["就这样一代代传下来，形成了……的风俗","就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","Lấy từ 好句 ⑤: giải thích nguồn gốc phong tục."]],"vocab":[["传统节日","chuántǒng jiérì","ngày lễ truyền thống","最重要的传统节日","idea"],["团圆","tuányuán","đoàn viên","一家人团圆","idea"],["热闹","rènao","náo nhiệt","热闹的气氛","idea"],["气氛","qìfēn","bầu không khí","节日的气氛","idea"],["庆祝","qìngzhù","chúc mừng, ăn mừng","庆祝新年","idea"],["拜年","bài nián","chúc Tết","给长辈拜年","act"],["贴春联","tiē chūnlián","dán câu đối Tết","家家户户贴春联","act"],["包饺子","bāo jiǎozi","gói sủi cảo","全家一起包饺子","act"],["年夜饭","niányèfàn","cơm tất niên","吃年夜饭","act"],["压岁钱","yāsuìqián","tiền mừng tuổi","给孩子压岁钱","act"],["逛庙会","guàng miàohuì","đi hội chùa","初一逛庙会","act"],["春运","chūnyùn","cao điểm đi lại dịp Tết","春运期间","act"],["除夕","chúxī","đêm giao thừa","除夕晚上","lesson"],["守岁","shǒusuì","thức đón giao thừa","除夕守岁","lesson"],["鞭炮","biānpào","pháo","放鞭炮","lesson"],["风俗","fēngsú","phong tục","风俗习惯","lesson"],["意义","yìyì","ý nghĩa","很有意义","lesson"],["表达","biǎodá","bày tỏ","表达祝福","lesson"],["纷纷","fēnfēn","tới tấp","纷纷回家","lesson"],["熬夜","áo yè","thức khuya","熬夜守岁","lesson"],["家家户户","jiājiā hùhù","nhà nhà","家家户户都很热闹","bonus"],["辞旧迎新","cí jiù yíng xīn","tiễn năm cũ đón năm mới","辞旧迎新的日子","bonus"],["万象更新","wànxiàng gēngxīn","vạn vật đổi mới","新年到，万象更新","bonus"],["其乐融融","qí lè róngróng","vui vầy ấm cúng","一家人其乐融融","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Phong tục"],["lesson","Từ bài 6"],["bonus","加分 · thành ngữ"]],"legend":["① Tết là gì","② Phong tục","③ Cảm nhận của tôi","④ Kết · mong muốn"],"samples":{"speak":[{"who":"热闹的风俗","meta":"Hướng A · bài nói ~1 phút 30","p":["春节是中国最重要的传统节日，也是最热闹的节日。","除夕晚上，全家人一起吃年夜饭，然后熬夜守岁。到了十二点，家家户户纷纷放起鞭炮，声音大得连电视都听不清了。大年初一，人们穿上新衣服，互相拜年，大人们还会给孩子压岁钱。","让我印象最深的是放鞭炮的风俗。我一问才知道，原来它来自一个关于“夕”的传说，人们放鞭炮是为了把怪物吓跑。","在我看来，春节不只是热闹，更表达了人们对新一年的美好希望。如果有机会，我最想在中国过一次春节。"],"vi":"Tết là ngày lễ truyền thống quan trọng và náo nhiệt nhất Trung Quốc. Đêm giao thừa cả nhà ăn cơm tất niên rồi thức đón giao thừa; đúng 12 giờ nhà nhà đốt pháo, ồn đến mức không nghe rõ tivi. Mùng 1 mọi người mặc quần áo mới, chúc Tết nhau, người lớn lì xì trẻ con. Ấn tượng nhất với tôi là tục đốt pháo — hỏi ra mới biết nó bắt nguồn từ truyền thuyết “Tịch”, đốt pháo để dọa quái vật. Theo tôi, Tết không chỉ náo nhiệt mà còn thể hiện hy vọng tốt đẹp cho năm mới. Nếu có cơ hội, tôi muốn ăn Tết ở Trung Quốc một lần."},{"who":"和越南的春节比一比","meta":"Hướng C · bài nói ~1 phút 30","p":["说到中国春节，我首先想到的是我们越南的春节，因为两个国家都过农历新年。","中国和越南的春节有很多相同的地方：除夕晚上都要守岁，大年初一都要拜年，大人们也都会给孩子压岁钱。","不过，也有一些不同。比如，中国北方人过年一定要包饺子，而越南人过年要包粽子。另外，越南人特别重视大年初一第一个来家里拜年的人。","在我看来，虽然两个国家的风俗不完全一样，但是春节的意义是相同的，那就是一家人团圆，一起迎接新的一年。"],"vi":"Nói đến Tết Trung Quốc, tôi nghĩ ngay đến Tết Việt Nam vì hai nước đều ăn Tết âm lịch. Giống nhau: đêm giao thừa thức đón năm mới, mùng 1 chúc Tết, người lớn lì xì trẻ con. Khác nhau: người miền Bắc Trung Quốc ăn Tết nhất định gói sủi cảo, còn người Việt gói bánh chưng; người Việt còn rất coi trọng người xông đất. Theo tôi, phong tục tuy không giống hẳn nhưng ý nghĩa của Tết là như nhau: cả nhà đoàn viên, cùng đón năm mới."}],"write":[{"who":"范文 1 · 热闹的风俗","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我眼中的中国春节","p":["春节是中国最重要的传统节日。","除夕晚上，全家人一起吃年夜饭、守岁，到了十二点，家家户户都放鞭炮。","大年初一，人们互相拜年，孩子们还能拿到压岁钱。","在我眼中，春节是一个热闹又温暖的节日。"],"vi":"Bố cục 4 câu: Tết là gì → phong tục đêm giao thừa → phong tục mùng 1 → cảm nhận “在我眼中”."},{"who":"范文 2 · 团圆的意义","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我眼中的中国春节","p":["在我看来，春节最重要的意义是团圆。","春节前，在外地工作的人纷纷回家，就算买不到火车票，也要想办法回去。","除夕晚上，一家人坐在一起吃年夜饭，其乐融融。","这就是我眼中的中国春节。"],"vi":"Mở bằng quan điểm, chứng minh bằng chuyện 春运 và bữa cơm tất niên; dùng 纷纷 của bài 6."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我眼中的中国春节","p":["在中国，人们把农历正月初一叫作春节，这是一年中最重要的传统节日。","除夕晚上，全家人一起吃年夜饭、守岁。到了十二点，家家户户纷纷放起鞭炮，声音大得连电视都听不清了。我一问才知道，原来放鞭炮是为了吓跑一个叫“夕”的怪物。就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗。","在我看来，春节不只是热闹，更重要的是表达了人们对家人的爱和对新一年的希望。","如果有机会，我最想在中国过一次春节，亲自包一次饺子。"],"good":["人们把农历正月初一叫作春节","声音大得连电视都听不清了","我一问才知道，原来","就这样一代代传下来，形成了除夕夜守岁、放鞭炮的风俗"],"vi":"Bốn chỗ gạch chân dùng lại khung 好句 của bài khóa: 人们把 A 叫作 B · V得连……都…… · 一问才知道，原来…… · 就这样一代代传下来，形成了……的风俗."}]},"w5":["传统","风俗","习惯","团圆","热闹","气氛","庆祝","拜年","除夕","守岁","鞭炮","意义","表达","纷纷","熬夜","果然","似的","此外","整个","希望","印象","相同","重视"],"step_names":["① 点题：春节是什么","② 介绍：风俗习惯","③ 看法：我的感受","④ 总结 · 愿望"],"timer":[["① 10s",10],["② 35s",35],["③ 30s",30],["④ 15s",15]],"build_title":"选一个方向，拼出你眼中的春节","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 热闹的风俗":[["春节是中国最重要的传统节日，也是最热闹的节日。","说到中国春节，我首先想到的是红色：红灯笼、红春联、红包。"],["除夕晚上，全家人一起吃年夜饭、守岁，到了十二点，家家户户纷纷放起鞭炮。大年初一，人们互相拜年，孩子们还能拿到压岁钱。","春节期间，人们贴春联、逛庙会、看舞龙舞狮，到处都是热闹的气氛。"],["在我看来，春节最有意思的风俗是放鞭炮，因为它来自一个关于“夕”的传说。","让我印象最深的是压岁钱，它表达了大人对孩子的爱。"],["如果有机会，我最想在中国过一次春节。","这就是我眼中的中国春节：热闹、温暖、充满希望。"]],"B · 团圆的意义":[["在我眼中，春节是一个团圆的节日。","春节是中国人一年中最重视的节日。"],["春节前，在外地工作的人纷纷回家，就算买不到火车票，也要想办法回去。除夕晚上，一家人坐在一起吃年夜饭，有说有笑。","有的人一年只能回一次家，所以除夕的年夜饭对他们来说特别有意义。"],["我觉得春节最重要的意义是一家人团圆，因为家人在一起，就是最大的幸福。","在我看来，年夜饭吃什么并不重要，重要的是和谁一起吃。"],["希望每个人都能回家过一个团圆年。","这就是我眼中的中国春节。"]],"C · 和越南的春节比一比":[["中国和越南都过农历新年，所以我对中国春节一点儿也不陌生。","说到中国春节，我首先想到的是我们越南的春节。"],["两个国家都有守岁、拜年、给孩子压岁钱的风俗习惯。不过，中国北方人过年要包饺子，而越南人过年要包粽子。","此外，越南人特别重视大年初一第一个来家里拜年的人，中国人则喜欢在初一逛庙会。"],["在我看来，虽然风俗不完全一样，但是春节的意义是相同的。","我觉得两个国家的春节都表达了人们对新一年的美好希望。"],["如果有机会，我最想在中国过一次春节，亲自包一次饺子。","希望以后能和中国朋友一起过春节。"]]},"quiz":[["Câu nào hợp làm câu mở bài?",["春节要贴春联、放鞭炮、包饺子、逛庙会、看舞龙。","春节是中国最重要的传统节日，也是最热闹的节日。"],1,"Câu 2 giới thiệu đối tượng; câu 1 chỉ liệt kê, chưa vào đề."],["Câu nào thể hiện “我眼中”?",["春节是农历正月初一。","在我看来，春节最重要的意义是一家人团圆。"],1,"Đề yêu cầu cảm nhận cá nhân: 在我看来、我觉得…"],["Câu nào đúng về thời gian?",["除夕是农历一年中的最后一天。","除夕是公历一月一日。"],0,"1/1 dương lịch là 元旦."],["Câu nào dùng 纷纷 đúng?",["到了十二点，家家户户纷纷放起鞭炮。","到了十二点，我纷纷放起鞭炮。"],0,"纷纷 cần chủ ngữ số nhiều."],["Câu nào dùng 似的 đúng?",["孩子们拿到压岁钱，高兴得什么似的。","孩子们拿到压岁钱，高兴得似的。"],0,"Cấu trúc phóng đại: ……得什么似的."],["Câu kết nào tốt hơn?",["我的作文写完了，谢谢。","如果有机会，我最想在中国过一次春节。"],1,"Câu kết nêu mong muốn, gắn với đầu đề."]],"fix":[["春节是中国最重要的节日之一个。","春节是中国最重要的节日之一。","……之一 không thêm lượng từ 个."],["除夕晚上，全家人一起吃年夜饭，守岁到很晚了。","除夕晚上，全家人一起吃年夜饭，一直守岁到深夜。","Bổ ngữ thời gian không thêm 了 cuối; 到深夜 tự nhiên hơn."],["大人们给孩子红包，叫作压岁钱这个红包。","大人们给孩子红包，这个红包叫作“压岁钱”。","Chủ ngữ “这个红包” đứng trước 叫作."],["我很感兴趣春节的风俗。","我对春节的风俗很感兴趣。","对 + đối tượng + 感兴趣; 感兴趣 không mang tân ngữ."],["人们纷纷地都放鞭炮。","人们纷纷放鞭炮。","纷纷 đã có nghĩa “ai cũng, lần lượt”, bỏ 地 và 都."],["如果有机会，我最想去中国过春节一次。","如果有机会，我最想去中国过一次春节。","Bổ ngữ động lượng 一次 đứng trước tân ngữ chỉ sự vật."]],"tpl":"我眼中的中国春节\n春节是【……】。【时间】，人们【风俗一】；此外，【风俗二】。在我看来，【我的感受】，因为【原因】。如果有机会，我最想【愿望】。","chk":[["topic","Bám đề: có nói về 春节","春节"],["custom","Có giới thiệu phong tục (风俗 · 守岁 · 鞭炮 · 饺子…)","风俗|守岁|鞭炮|饺子|春联|压岁钱|年夜饭|拜年|庙会"],["view","Có góc nhìn cá nhân (我觉得 · 在我看来 · 我眼中 · 印象)","我觉得|我认为|在我看来|我眼中|印象|感兴趣|最喜欢"],["why","Có lý do / ý nghĩa / so sánh (因为 · 意义 · 越南 · 相同)","因为|意义|越南|相同|不同|表达"],["end","Có câu kết / mong muốn (如果有机会 · 希望 · 这就是)","如果有机会|希望|这就是|最想"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> ít nhất 2 phong tục cụ thể, một câu cảm nhận “我眼中／在我看来” kèm lý do, và một câu kết. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“我眼中的……”的题目都可以这样写","var_lead":"Mọi đề “giới thiệu + cảm nhận” (我眼中的……、我了解的……、……给我留下的印象) đều dùng khung: <b>giới thiệu → 2–3 chi tiết cụ thể → cảm nhận + lý do → kết<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）我眼中的中国春节","春节是中国最重要的传统节日……"],["请以“我们国家的新年”为题写一段话。","在越南，人们把农历新年叫作“Tết”……"],["请以“我眼中的中秋节”为题写一段话。","中秋节是农历八月十五，这一天的月亮又大又圆……"],["介绍一个你喜欢的传统节日。","我最喜欢的传统节日是……，因为……"],["谈谈你对“春节放鞭炮”的看法。","放鞭炮是春节的传统风俗，可是现在很多城市不许放鞭炮。我认为……"],["请以“难忘的除夕”为题写一段话。","去年除夕，是我第一次在中国过年……"]],"homework":"<b>Bài về nhà:<\/b> chọn một hướng (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “我眼中的中国春节” · bắt buộc có hai phong tục cụ thể, một câu cảm nhận có lý do, một câu kết và một khung 好句 của bài khóa."}};</script>
