<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 07 · 成语故事两则 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

<script>window.LESSON={"ALIAS":{"大象":"象","尽力":"尽"},"BIANXI":[{"pair":"忽然 — 突然","book":true,"head":["","忽然","突然"],"rows":[["共同点","都可用在动词前，表示很快发生、没想到的意思。<br><span class='zh'>我们正在上课，他<b>忽然/突然<\/b>站了起来。<\/span>",null],["不同点","是<b>副词<\/b>，只能用在动词或小句前（可以替换成“突然”）。<br><span class='zh'>一天傍晚，他正带着士兵们在山中打猎，<b>忽然<\/b>发现远处的草丛中蹲着一只大老虎。<\/span>","是副词，也是<b>形容词<\/b>，可做谓语、补语、定语。<br><span class='zh'>这件事太<b>突然<\/b>了！（谓语）这件事发生得太<b>突然<\/b>了！（补语）这<b>突然<\/b>的一声喊叫吓了我一跳。（定语）<\/span>"]],"opts":["忽然","突然","都可以"],"quiz":[["他抱着小狗走到门口，____想起妈妈不允许他在家里养小动物。",2,"用在动词前做状语，两个都可以（课本例题）。"],["消息来得太____了，我完全没有准备。",1,"“太……了”中做谓语，只能用形容词“突然”。"],["这是一个____的变化，我们谁也没想到。",1,"做定语，只能用“突然”。"],["有个铁路工人____就辞了职，买帆船出海了，你听说了吗？",2,"用在动词前，两个都可以。"]]},{"pair":"连续 — 继续","book":false,"head":["","连续","继续"],"rows":[["共同点","都是动词，都有“不断”的意思。",null],["不同点 1","强调<b>一个接一个、中间不断<\/b>，后面常有数量词。<br><span class='zh'>这次他<b>连续<\/b>换了几根箭，都没能再射进去。<\/span>","强调<b>停下以后接着做<\/b>，或者延续下去。<br><span class='zh'>休息十分钟，我们<b>继续<\/b>上课。<\/span>"],["不同点 2","多和数量、次数、时间一起用：<span class='zh'>连续三天、连续工作二十个小时<\/span>。","可以带宾语：<span class='zh'>继续努力、继续学习、继续他的工作<\/span>。"]],"opts":["连续","继续","都可以"],"quiz":[["我真的需要休息了，我已经____工作20个小时了。",0,"强调中间不断，后面有时间数量，用“连续”（课本练习2）。"],["休息一下，我们下午____讨论这个问题。",1,"停下以后接着做，用“继续”。"],["这个城市已经____下了一个星期的雨。",0,"一天接一天不断，用“连续”。"],["虽然失败了很多次，但他还想____试下去。",1,"延续下去，用“继续”。"]]},{"pair":"反应 — 反映","book":false,"head":["","反应","反映"],"rows":[["共同点","读音相近（fǎnyìng），都可以做动词和名词，容易用错。",null],["不同点 1","指受到刺激以后产生的<b>变化、行动或态度<\/b>。<br><span class='zh'>过了一会儿，老虎没什么<b>反应<\/b>。<\/span>","指<b>把情况表现出来<\/b>，或者<b>把意见告诉上级<\/b>。<br><span class='zh'>这部电影<b>反映<\/b>了农村的生活。<\/span>"],["不同点 2","常说：<span class='zh'>反应很快、没有反应、做出反应<\/span>。","常说：<span class='zh'>反映问题、反映情况、向领导反映<\/span>。"]],"opts":["反应","反映","都可以"],"quiz":[["对我们提出的意见，老板还没有做出____。",0,"“做出反应”，指态度、行动（课本练习2）。"],["济南泉水的优美，还可从那独特的名字上____出来。",1,"把情况表现出来，用“反映”（第5课）。"],["这个孩子很聪明，____特别快。",0,"“反应快”，指思维、动作的速度。"],["有问题可以直接向经理____。",1,"把意见告诉上级，用“反映”。"]]}],"COLLOC":[["动词","宾语",[["寻找","机会／信息／亲人／人才"],["确定","时间／地点／人选"]]],["状语","中心 iện thì không thể đưa ra kết luận","why":"Câu chốt đạo lý của truyện. Khung <b>只有……是不能……的<\/b> (là……的 nhấn mạnh) rất hợp làm <b>câu kết<\/b> bài nghị luận.","frame":"只有 + （不够的条件）+ 是不能 + 动词 + 的","apply":"只有一次失败的经验是不能说明你没有能力的。","apply_vn":"Chỉ một lần thất bại thì không thể chứng minh bạn không có năng lực."},{"zh":"他善于骑马射箭，作战勇敢，被称为“飞将军”","vn":"ông giỏi cưỡi ngựa bắn cung, chiến đấu dũng cảm, được gọi là “Phi tướng quân”","why":"Giới thiệu nhân vật gọn mà đủ: <b>善于……，（特点），被称为“……”<\/b>. Dùng được ngay cho đề “我喜欢的一位名人” (bài 9).","frame":"某人 + 善于 + ……，+ 特点，+ 被称为“……”","apply":"她善于用简单的语言讲复杂的道理，被称为“最会讲故事的老师”。","apply_vn":"Cô ấy giỏi dùng lời đơn giản giảng đạo lý phức tạp, được gọi là “cô giáo kể chuyện hay nhất”."},{"zh":"只见他从箭袋里取出一支箭，摆好姿势，全神贯注，用尽全力向老虎射去","vn":"chỉ thấy ông rút từ túi tên ra một mũi tên, vào tư thế, tập trung cao độ, dồn hết sức bắn về phía con hổ","why":"<b>只见<\/b> + chuỗi động tác liên tiếp tạo cảm giác như đang xem phim — rất hợp phần <b>kể chuyện<\/b> (书写 câu 71).","frame":"只见 + 某人 + 动作1，动作2，（状态），动作3","apply":"只见她深吸一口气，走上台，全神贯注地弹起了钢琴。","apply_vn":"Chỉ thấy cô hít một hơi sâu, bước lên sân khấu, tập trung chơi đàn piano."},{"zh":"连李广自己都不相信他能有这么大的力气","vn":"đến chính Lý Quảng cũng không tin mình có sức mạnh lớn như vậy","why":"<b>连……都……<\/b> nhấn mạnh mức độ bất ngờ: đến người trong cuộc còn không tin.","frame":"连 + 某人（自己）+ 都 + 不相信／没想到……","apply":"这次考了第一名，连我自己都不敢相信。","apply_vn":"Lần này đứng nhất, đến chính tôi cũng không dám tin."},{"zh":"如果诚心实意，即使像金属和石头那样硬的东西也会被打动","vn":"nếu thật lòng thành ý thì ngay cả thứ cứng như kim loại và đá cũng sẽ bị lay động","why":"Hai lớp điều kiện <b>如果……，即使……也……<\/b> + so sánh <b>像……那样……<\/b>: câu lập luận rất “HSK5”.","frame":"如果 + 条件，即使 + 极端情况 + 也 + 结果","apply":"如果有明确的目标，即使遇到再大的困难也不会轻易放弃。","apply_vn":"Nếu có mục tiêu rõ ràng, dù gặp khó khăn lớn đến đâu cũng sẽ không dễ bỏ cuộc."}],"GRAMMAR":[{"word":"瞎","py":"xiā","pos":"动词／副词","forms":["动词：（眼睛）瞎了（= 看不见）","副词：瞎 + 动词（= 没有根据、没有效果地做）：瞎说、瞎猜、瞎担心、瞎写"],"vn":"<b>瞎<\/b> ① động từ: <b>mù<\/b>, mắt không nhìn thấy. ② phó từ, đứng trước động từ: làm <b>bừa, vô căn cứ, vô ích<\/b> — 瞎说 (nói bậy), 瞎猜 (đoán mò), 瞎担心 (lo hão), 瞎写 (viết bừa). Khẩu ngữ.","text":"一天，他让士兵们去找一头大象和一些出生时眼睛就瞎了的人回来。","ex":[["聪明人用双手挡住了马的双眼，对那个人说：“要是这马真是你的，你一定知道马的哪只眼睛是瞎的。”","Người thông minh lấy hai tay che mắt ngựa, nói: “Nếu con ngựa này đúng là của anh, anh nhất định biết mắt nào của nó bị mù.” (động từ)"],["别听他瞎说，不用害怕。我们不会这么倒霉的。","Đừng nghe anh ta nói bậy, không cần sợ. Chúng ta không xui xẻo vậy đâu. (phó từ)"],["他自己的问题，他会想办法的，你就别替他瞎担心了。","Chuyện của anh ấy, anh ấy sẽ tự nghĩ cách, bạn đừng lo hão giùm. (phó từ)"]],"err":[["❌ 他说瞎。","✅ 他瞎说。","Phó từ 瞎 đứng trước động từ."],["❌ 我很瞎担心。","✅ 你别瞎担心了。","瞎 + V không thêm 很; thường dùng trong câu khuyên 别瞎……"]],"book":[["____________，但她的脸上总是有美丽的微笑。（瞎）","Gợi ý: mắt cô ấy bị mù.","她的眼睛虽然瞎了，但她的脸上总是有美丽的微笑"],["A：刚才的考试你考得怎么样？我有好几个题不会做。<br>B：____________。（瞎）","Gợi ý: tôi cũng không biết, đành viết bừa.","我也是，有几个题只好瞎写了"],["你少跟他打交道，____________。（瞎）","Gợi ý: anh ta toàn nói bậy.","你少跟他打交道，他总是瞎说"]],"drill":[["“瞎”在这里是什么意思？ 你别瞎猜了，我告诉你吧。",["眼睛看不见","没有根据地"],1,"瞎 + 猜 → đoán mò."],["“瞎”在这里是什么意思？ 这只猫的一只眼睛瞎了。",["眼睛看不见","没有根据地"],0,"Động từ: bị mù."],["Câu nào đúng?",["不知道就别瞎说。","不知道就别说瞎。","不知道就瞎别说。"],0,"别 + 瞎 + V."]]},{"word":"分别","py":"fēnbié","pos":"动词／副词／名词","forms":["动词：分别（= 离别）","副词：分别 + 动词（= 分头、各自；逐一）","名词：（没有）什么分别（= 区别）"],"vn":"<b>分别<\/b> ① động từ: <b>chia tay, xa nhau<\/b>. ② phó từ: <b>lần lượt, riêng từng người<\/b> — 分别去不同地方; cũng dùng khi kể từng cái một: 分别是茶、可乐和咖啡. ③ danh từ: <b>sự khác biệt<\/b> (= 区别).","text":"士兵们分别去不同地方寻找，把找到的大象和盲人带到他面前。","ex":[["从毕业到现在，我们已经分别20年了，一直都没有联系。","Từ lúc tốt nghiệp đến giờ chúng tôi đã xa nhau 20 năm, chưa hề liên lạc. (động từ)"],["一张桌子上放着三瓶饮料，分别是茶、可乐和咖啡。","Trên bàn có ba chai đồ uống, lần lượt là trà, cola và cà phê. (phó từ)"],["我不知道这两种做法有什么分别。","Tôi không biết hai cách làm này có gì khác nhau. (danh từ)"]],"err":[["❌ 我分别了他。","✅ 我和他分别了。","Động từ 分别 không mang tân ngữ; dùng 和/跟 + người + 分别."],["❌ 他分别问了我。","✅ 他分别问了我和小王。","Phó từ 分别 cần chủ thể hoặc đối tượng số nhiều."]],"book":[["时间过得真快，____________。（分别－动词）","Gợi ý: chúng ta xa nhau đã năm năm.","时间过得真快，我们分别已经五年了"],["A：快放寒假了，你们假期有什么打算？<br>B：____________。（分别－副词）","Gợi ý: tôi và em gái mỗi người đi một nơi.","我和妹妹打算分别去北京和上海旅游"],["A：我们有三年没见面了吧？<br>B：____________。（分别－名词）","Gợi ý: bạn chẳng khác gì ba năm trước.","是啊，不过你跟三年前没什么分别"]],"drill":[["“分别”在这里是什么词？ 分别是暂时的，我们以后一定会再见。",["动词","副词","名词"],0,"= 离别."],["“分别”在这里是什么词？ 这两张照片的分别一眼就看得出来。",["动词","副词","名词"],2,"= 区别."],["“分别”放在哪里？ 他们<u>A<\/u>去两个<u>B<\/u>不同的城市做调查。",["A","B"],0,"Phó từ đứng trước động từ 去 (课本练习3)."]]},{"word":"根","py":"gēn","pos":"名词／量词","forms":["名词：（植物的）根；事物的基础：从根上解决","量词：一根 + 细长的东西：一根绳子、一根箭、一根尾巴"],"vn":"<b>根<\/b> ① danh từ: <b>rễ cây<\/b>; nghĩa bóng: <b>gốc rễ, cơ sở<\/b> — 从根上解决 (giải quyết tận gốc). ② lượng từ cho <b>vật dài, mảnh<\/b>: 一根绳子, 一根箭, 一根筷子, 一根香蕉.","text":"可是，这次他连续换了几根箭，都没能再射进去……","ex":[["这种植物的根下雨时会大量吸水，从而满足自身的需要。","Rễ của loại cây này hút nhiều nước khi trời mưa, nhờ đó đáp ứng nhu cầu của mình. (danh từ)"],["这件事还是得从根上解决，只解决表面问题是不行的。","Việc này phải giải quyết tận gốc, chỉ giải quyết bề ngoài là không được. (danh từ)"],["摸到尾巴的盲人说大象像一根绳子。","Người mù sờ trúng đuôi nói con voi giống một sợi dây. (lượng từ)"]],"err":[["❌ 一根桌子","✅ 一张桌子","根 chỉ dùng cho vật dài, mảnh."],["❌ 一个筷子","✅ 一根筷子／一双筷子","Đũa: một chiếc 一根, một đôi 一双."]],"book":[["植物靠____________。（根－名词）","Gợi ý: rễ hút nước.","植物靠根吸收水分"],["第一次用筷子的时候，____________。（根－量词）","Gợi ý: đến một sợi mì cũng gắp không nổi.","第一次用筷子的时候，我连一根面条都夹不起来"],["A：你今天去超市主要想买什么？<br>B：____________。（根－量词）","Gợi ý: vài quả chuối, một quả dưa chuột.","我想买几根香蕉和一根黄瓜"]],"drill":[["选择：他只用一____绳子就做出了这么漂亮的图画。",["根","张","块"],0,"Vật dài, mảnh → 根."],["“根”在这里是什么意思？ 问题要从根上解决。",["植物的根","事物的基础"],1,"Nghĩa bóng: gốc rễ."],["Lượng từ nào sai?",["一根尾巴","一根石头","一根箭"],1,"Đá dùng 一块石头."]]},{"word":"便","py":"biàn","pos":"副词","forms":["便 = 就（书面语）：……，便 + 动词","不是……，便是……（= 不是……就是……）"],"vn":"<b>便<\/b> là phó từ, nghĩa như <b>就 (thì, liền, bèn)<\/b> nhưng dùng trong <b>văn viết<\/b>. Đứng sau chủ ngữ, trước động từ. Cũng có cấu trúc <b>不是……，便是……<\/b> (không phải… thì là…).","text":"“精诚所至，金石为开”这一成语也便由此流传下来。","ex":[["楼上新买了一架钢琴，我们家便多了一些不安静。","Tầng trên mới mua một cây đàn piano, nhà tôi liền bớt yên tĩnh."],["很多时候，仅仅是换一种心情，换一个角度，便可以从困境中走出来。","Nhiều khi chỉ cần đổi tâm trạng, đổi góc nhìn là có thể thoát khỏi khó khăn."],["他每天下班后便去公园跑步。","Mỗi ngày tan làm anh ấy liền đi chạy bộ ở công viên."]],"err":[["❌ 便他走了。","✅ 他便走了。","便 đứng sau chủ ngữ, trước động từ."],["❌ 你便来吧！","✅ 你就来吧！","Câu khẩu ngữ, câu mệnh lệnh dùng 就; 便 dùng trong văn viết."]],"book":[["他刚出门，发现没带钥匙，就转身回去拿。<br>→ 他刚出门，发现没带钥匙，____________。（便）","Gợi ý: thay 就 bằng 便.","他刚出门，发现没带钥匙，便转身回去拿"],["朋友不停地给她介绍男朋友，但是每次不是她不喜欢别人，就是别人不喜欢她。<br>→ 但是每次____________。（便）","Gợi ý: 不是……便是…….","但是每次不是她不喜欢别人，便是别人不喜欢她"],["如果我们坚持原来的想法，这个工作是不可能完成的。<br>→ 如果我们坚持原来的想法，____________。（便）","Gợi ý: …便不可能完成.","如果我们坚持原来的想法，这个工作便不可能完成"]],"drill":[["“便”的意思相当于：",["就","才","都"],0,"便 = 就 (văn viết)."],["“便”放在哪里？ 他<u>A<\/u>听完<u>B<\/u>这个消息，<u>C<\/u>马上<u>D<\/u>出发了。",["A","B","C"],2,"Đầu vế sau, trước động từ: 便马上出发了."],["Câu nào đúng?",["他不是看书，便是写字。","他便不是看书，是写字。","便他不是看书，是写字。"],0,"不是……，便是……"]]}],"HSK":{"r1":[{"text":["宋国有个农民，有一天在地里干活，忽然看见一只兔子跑过来，一头撞到树上{36}。他没花一点儿力气就得到了一只兔子，高兴极了。从那以后，他{37}，每天坐在那棵树下等着兔子再撞上来。结果，兔子没等到，地里的庄稼却全死了。这就是成语“守株待兔”，{38}。"],"qs":[{"n":36,"o":["跑了","死了","睡着了","笑了"],"a":1,"why":"后文“没花一点儿力气就得到了一只兔子”，说明兔子撞死了。"},{"n":37,"o":["更努力地种地","再也不干活了","去城里找工作","开始养兔子"],"a":1,"why":"“每天坐在那棵树下等着”说明他不干活了，结果庄稼全死了。"},{"n":38,"o":["说明兔子跑得很快","告诉我们种地很辛苦","比喻不努力、只想靠运气得到好处","说明农民很聪明"],"a":2,"why":"成语“守株待兔”比喻不主动努力，只希望靠运气得到好处。"}]},{"text":["成语是汉语中很有特点的一部分。它们大多由四个字组成，{39}，却能表达很丰富的意思。很多成语背后都有一个有趣的故事，{40}。学成语的时候，最好先了解它的来源和意思，再看看它在句子里{41}。如果只记住字面意思，{42}，比如“胸有成竹”并不是说心里真的有竹子。"],"qs":[{"n":39,"o":["虽然字数不多","因为很难记","如果写错了","只要多读"],"a":0,"why":"“虽然……却……”，字数少和意思丰富形成转折。"},{"n":40,"o":["所以成语都很短","这些故事很容易让人记住","可是没有人知道","成语就不重要了"],"a":1,"why":"故事有趣，所以容易记住，前后连贯。"},{"n":41,"o":["怎么写","多少钱","怎么用","在哪儿"],"a":2,"why":"学成语要看它在句子里“怎么用”。"},{"n":42,"o":["就能学得更快","很可能会用错","成语就更有意思","大家都会表扬你"],"a":1,"why":"后面举例说明不能只看字面意思，否则会理解错、用错。"}]}],"r2":[{"start":46,"paras":["有一个人很快就画好了，看到别人还没画完，他得意地说：“我还能给蛇画上脚呢！”","古时候，有几个人得到了一壶酒，可是酒太少，不够大家喝。","就在他给蛇画脚的时候，另一个人画完了，拿起酒壶说：“蛇本来没有脚，你画的不是蛇。”说完便把酒喝了。","于是有人提议：“我们每人在地上画一条蛇，谁先画好，这壶酒就归谁。”","后来人们用“画蛇添足”比喻做了多余的事，反而把事情办坏了。"],"ans":["B","D","A","C","E"],"why":"背景：酒不够（B）→ 提议比赛画蛇（D）→ 一人先画好又画脚（A）→ 别人拿走了酒（C）→ 成语的意思（E）。"}],"r3":[{"text":["古时候，宋国有个农民，总觉得自己田里的禾苗长得太慢。他每天都到田边去看，可是禾苗好像一点儿也没长高。他心里非常着急，想来想去，终于想出了一个“好办法”。","第二天，他一大早就来到田里，把禾苗一棵一棵地往上拔高一点儿。从早上一直忙到太阳落山，他累得什么似的。回到家，他高兴地对家里人说：“今天可累坏了，不过我帮助禾苗长高了！”","他的儿子听了，觉得很奇怪，赶紧跑到田里去看。结果发现，<u><b>禾苗全都枯死了<\/b><\/u>。","后来，人们用“拔苗助长”这个成语比喻违反事物发展的规律，急于求成，结果反而把事情办坏了。比如，有的父母让很小的孩子学很多东西，希望孩子早点儿成功，这其实也是一种“拔苗助长”。"],"qs":[{"n":56,"s":"农民为什么着急？","o":["田里没有水","觉得禾苗长得太慢","儿子不帮他干活","天气太热"],"a":1,"why":"第一段：总觉得自己田里的禾苗长得太慢。"},{"n":57,"s":"农民的“好办法”是什么？","o":["给禾苗多浇水","请别人帮忙","把禾苗一棵一棵往上拔","种新的禾苗"],"a":2,"why":"第二段：把禾苗一棵一棵地往上拔高一点儿。"},{"n":58,"s":"画线句子说明了：","o":["农民的办法很成功","儿子很聪明","禾苗长得很快","农民的做法反而把事情办坏了"],"a":3,"why":"禾苗枯死，说明违反规律的做法把事情办坏了。"},{"n":59,"s":"根据最后一段，下面哪种做法也是“拔苗助长”？","o":["让很小的孩子学很多东西","每天坚持锻炼身体","按计划复习功课","给植物按时浇水"],"a":0,"why":"最后一段的例子：父母让很小的孩子学很多东西。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，讲一讲这个成语故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể lại câu chuyện thành ngữ.","panels":[["🧑‍🌾","农民在地里干活，一只兔子跑过来撞到了树上。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk14875_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#cfe8ff\"/><stop offset=\"1\" stop-color=\"#f3f9ff\"/><\/linearGradient><\/defs><rect width=\"320\" height=\"240\" fill=\"url(#sk14875_1)\"/><g transform=\"translate(280.0,40.0) scale(0.8,0.8)\"><g stroke=\"#f5b82e\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M22.0 0.0 L30.0 0.0\"/><path d=\"M15.6 15.6 L21.2 21.2\"/><path d=\"M0.0 22.0 L0.0 30.0\"/><path d=\"M-15.6 15.6 L-21.2 21.2\"/><path d=\"M-2 (0.0,0.0) scale(0.9,0.9)\"><path d=\"M0 0 L0 -70\" stroke=\"#8b5e3c\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M0 -70 l16 4 l-2 10 l-14 -6z\" fill=\"#888\"/><\/g><\/g><g transform=\"translate(250.0,70.0)\"><g transform=\"translate(0.0,0.0)\"><text x=\"0\" y=\"0\" font-size=\"34\" font-weight=\"700\" fill=\"#7c5cd6\" text-anchor=\"middle\" font-family=\"sans-serif\">?<\/text><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh, câu cuối nêu ý nghĩa thành ngữ “守株待兔”.","Có thể dùng: 忽然、便、连……都……、结果."],"sample":"古时候，有个农民正在地里干活，忽然看见一只兔子飞快地跑过来，一头撞到树上死了。他没花一点儿力气就得到了一只兔子，高兴得什么似的。从那以后，他便不再种地了，每天坐在那棵树下，全神贯注地等着兔子再撞上来。可是一天天过去了，他连一只兔子的影子都没看见，地里的庄稼却全死了。这就是成语“守株待兔”，它告诉我们：不能只靠运气，要靠自己的努力。","svn":"Người nông dân thấy thỏ đâm vào gốc cây chết, mừng rỡ; từ đó bỏ ruộng ngồi chờ thỏ; chẳng thấy thỏ đâu mà lúa chết hết. Ý nghĩa: không thể chỉ trông vào may mắn."},"w72":{"prompt":"有人说：“成功主要靠天赋。”也有人说：“精诚所至，金石为开，成功主要靠努力。”请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói thành công chủ yếu nhờ thiên phú; có người nói thành công chủ yếu nhờ nỗ lực. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"成功离不开努力","tips":["Nêu quan điểm → thừa nhận vai trò thiên phú → lý do nỗ lực quan trọng hơn + ví dụ → nhấn mạnh mục tiêu (有的放矢) → kết luận.","Dùng khung 好句: 如果……，即使……也…… · 只有……是不能……的."],"sample":"有人认为成功主要靠天赋，我却认为，成功更离不开努力。\n当然，我不否认天赋的作用。有的人天生善于唱歌，有的人对数字特别敏感，他们在某些方面可能比别人学得更快。\n但是，只有天赋而不努力，是不能取得成功的。很多有天赋的孩子，长大以后并没有成功，因为他们不愿意吃苦。相反，有些人开始时并不聪明，却每天坚持练习，最后成了专家。正所谓“精诚所至，金石为开”，如果诚心实意，即使遇到再大的困难也能克服。\n另外，努力也要有的放矢。确定一个合适的目标，再一步一个脚印地去做，努力才会有结果。\n总之，天赋决定起点，努力决定终点。","svn":"Bài nghị luận: quan điểm → thừa nhận thiên phú → 但是 nỗ lực quan trọng hơn + ví dụ + 精诚所至 → 另外 cần mục tiêu → 总之."}},"PRACTICE":{"ex1":{"bank":["尽力","片面","确定","善于","寻找","不要紧"],"items":[["他在四处{}，但至今仍然没有结果。",["寻找"]],["不能这样{}地看问题，而要多方面地考虑。",["片面"]],["你{}他就是我们要找的那位英雄吗？",["确定"]],["我们班有个同学被车撞了，还好伤得不重，{}。",["不要紧"]],["她很爱护学生，也很{}教育他们。",["善于"]],["别难过了，虽然成绩不理想，但你已经{}了。",["尽力"]]]},"ex2":[["每天我一回家，可爱的小狗就____着尾巴冲我跑过来。",["摸","摇"],1],["对我们提出的意见，老板还没有做出____。",["反应","反映"],0],["我真的需要休息了，我已经____工作20个小时了。",["继续","连续"],1],["____，我想到了一个办法，你们看看行不行。",["唉","哎"],1]],"ex3":[["他<u>A<\/u>没回家，肯定是<u>B<\/u>公司有事，你<u>C<\/u>着什么<u>D<\/u>急！","瞎",2,"他没回家，肯定是公司有事，你瞎着什么急！"],["<u>A<\/u>半夜里，<u>B<\/u>他<u>C<\/u>睡着睡着<u>D<\/u>坐了起来。","忽然",3,"半夜里，他睡着睡着忽然坐了起来。"],["这么<u>A<\/u>美丽的<u>B<\/u>图画竟然是用<u>C<\/u>绳子<u>D<\/u>做的！","根",2,"这么美丽的图画竟然是用根绳子做的！"],["他们<u>A<\/u>去两个<u>B<\/u>不同的城市做社会调查，想了解<u>C<\/u>南方和北方<u>D<\/u>不同的风俗！","分别",0,"他们分别去两个不同的城市做社会调查，想了解南方和北方不同的风俗！"]],"ex4":[["盲人摸象","瞎、分别、摸、片面、结论","国王让士兵们分别去找一头大象和一些眼睛瞎了的人。盲人们摸了摸大象，有的说像角，有的说像绳子，有的说像墙，有的说像扇子。国王说，只有片面的认识是不能下结论的。"],["精诚所至，金石为开","称、忽然、不要紧、确定、连续、硬、便","李广被称为“飞将军”。一天打猎时，他忽然看见一只老虎，他表示不要紧，一箭射了过去。士兵去确定老虎死没死，发现那是一块石头，箭射进去了。李广连续射了几次都没成功。扬雄说，诚心实意的话，再硬的东西也会被打动，这个成语便流传了下来。"]],"ext":{"title":"扩展 · 话题：语言文字","words":[["文字","wénzì","văn tự"],["词汇","cíhuì","từ vựng"],["成语","chéngyǔ","thành ngữ"],["字母","zìmǔ","chữ cái"],["声调","shēngdiào","thanh điệu"],["拼音","pīnyīn","phiên âm"],["语气","yǔqì","ngữ khí, giọng điệu"],["疑问","yíwèn","nghi vấn"],["否定","fǒudìng","phủ định"],["省略","shěnglüè","lược bỏ"]],"items":[["对我来说，汉语拼音中的{}很难，我常常分不清二声和三声。","声调"],["你怎么能用这种{}跟父母说话呢？","语气"],["写文章的时候，不用在每个句子里都用“我”，前面已经有了，后面就可以{}了。","省略"],["我提出了我的看法，但领导{}了我的意见。","否定"]]}},"TEXT":[{"title":"盲人摸象（上）","sub":"国王的考题","paras":["很久以前，有一个很有智慧的国王。一天，他让士兵们去找一头大象和一些出生时眼睛就瞎了的人回来。士兵们分别去不同地方寻找，把找到的大象和盲人带到他面前。"],"idea":"Một vị vua rất <b>sáng suốt<\/b> sai lính đi tìm một con voi và mấy người <b>mù từ lúc mới sinh<\/b>. Lính chia nhau đi các nơi rồi đưa voi và những người mù đến trước mặt vua.","qs":[["国王是一个什么样的人？",["很有智慧","很胆小","很懒"],0],["国王让士兵们去找什么？",["一只老虎和几个将军","一头大象和一些盲人","一把扇子和一条绳子"],1],["士兵们是怎么寻找的？",["一起去同一个地方","分别去不同地方","让盲人自己来"],1]]},{"title":"盲人摸象（下）","sub":"片面的认识","paras":["国王叫盲人们去摸一摸大象，问他们：“你们觉得大象是什么样的呢？”摸到牙齿的盲人说：“我觉得像一个角。”“胡说！”摸到尾巴的盲人说，“它像一条绳子。”摸到大象身子的盲人说：“我觉得像一面又高又平的墙。”“不，你们都错了，应该是像一把扇子。”这个盲人摸到了大象的耳朵。","国王笑了起来：“你们每个人都只摸到了一点，就认为自己了解全部了吗？只有片面的认识是不能下结论的。”"],"idea":"Mỗi người mù sờ một chỗ: ngà → <b>cái sừng<\/b>, đuôi → <b>sợi dây<\/b>, thân → <b>bức tường<\/b>, tai → <b>cái quạt<\/b>. Vua cười: mỗi người chỉ sờ được một chút mà tưởng biết toàn bộ — nhận thức <b>phiến diện<\/b> thì không thể kết luận.","qs":[["摸到尾巴的盲人觉得大象像什么？",["一面墙","一条绳子","一把扇子"],1],["觉得大象像一把扇子的盲人摸到了哪里？",["牙齿","身子","耳朵"],2],["国王想说明什么道理？",["大象很大","盲人都很聪明","只有片面的认识不能下结论"],2]]},{"title":"精诚所至，金石为开（上）","sub":"飞将军射“虎”","paras":["西汉时期有一位著名的将军叫李广，他善于骑马射箭，作战勇敢，被称为“飞将军”。一天傍晚，他正带着士兵们在山中打猎，忽然发现远处蹲着一只大老虎。士兵们都紧张地围了上来，想要保护他。李广摇摇头，表示不要紧。只见他从箭袋里取出一支箭，摆好姿势，全神贯注，用尽全力向老虎射去。"],"idea":"Danh tướng Tây Hán <b>Lý Quảng<\/b> giỏi cưỡi ngựa bắn cung, được gọi là <b>“Phi tướng quân”<\/b>. Một chiều đi săn, ông bỗng thấy xa xa có con hổ lớn ngồi xổm. Ông lắc đầu ý bảo không sao, rút tên, <b>tập trung cao độ<\/b>, dồn hết sức bắn về phía con hổ.","qs":[["李广为什么被称为“飞将军”？",["他会飞","他善于骑马射箭，作战勇敢","他跑得很快"],1],["士兵们看到老虎以后做了什么？",["马上逃走了","紧张地围上来保护李广","去打老虎"],1],["李广射箭的时候是什么样子？",["很紧张","全神贯注，用尽全力","一边说话一边射"],1]]},{"title":"精诚所至，金石为开（下）","sub":"成语的由来","paras":["过了一会儿，老虎没什么反应，士兵们小心地走上前去，想确定它是不是死了。没想到仔细一看，被射中的竟不是老虎，而是一块形状很像老虎的大石头，而且一整支箭几乎全都射到石头中去了！大家都很吃惊，连李广自己都不相信他能有这么大的力气，于是他想再试试。可是，这次他连续换了几根箭，都没能再射进去，有的箭头碎了，有的箭杆断了，而大石头一点儿变化也没有。“哎，怎么会这样？”士兵奇怪地你看我，我看你。“唉！大概是我不够用心了吧！”李广也无奈地说。","人们对这件事情感到很不解，就去问当时最有影响力的学者扬雄。扬雄回答说：“如果诚心实意，即使像金属和石头那样硬的东西也会被打动。”“精诚所至，金石为开”这一成语也便由此流传下来。"],"idea":"Hóa ra thứ bị bắn trúng là <b>một tảng đá giống hổ<\/b>, cả mũi tên cắm ngập vào đá. Bắn lại nhiều lần đều không vào: đầu tên vỡ, cán tên gãy. Học giả <b>Dương Hùng<\/b> giải thích: nếu thật lòng thành ý thì đến kim loại, đá cứng cũng bị lay động — từ đó có thành ngữ <b>“精诚所至，金石为开”<\/b>.","qs":[["被李广射中的是什么？",["一只老虎","一块很像老虎的大石头","一棵大树"],1],["李广后来连续射了几根箭，结果怎么样？",["都射进去了","都没能再射进去","石头碎了"],1],["扬雄认为第一箭为什么能射进石头？",["箭特别好","石头不硬","李广诚心实意、全神贯注"],2]]}],"TEXT_EXTRA":{"compare_title":"两个成语的意思","compare_head":["成语","意思","Tiếng Việt"],"compare":[["盲人摸象","比喻只了解一部分就对整体下结论","thầy bói xem voi — nhìn phiến diện"],["精诚所至，金石为开","只要真心诚意，再难的事也能做成","có công mài sắt có ngày nên kim"],["有的放矢","说话做事有明确的目标","bắn tên có đích — làm việc có mục tiêu"]],"bg":"射箭的时候，我们要对准目标（mùbiāo）。这个目标，在古代叫作“的”，也就是我们今天说的“目的”的“的”；而箭，在古代叫做“矢”（shǐ）。连起来就是成语“有的放矢”。我们在这一课中学到了“精诚所至，金石为开”，它告诉我们，做事情的时候，态度很重要，如果诚心实意，即使像金属和石头那样硬的东西也会被打动。但另一方面，如何确定目标也很重要。我们都知道，箭射出的距离是有一定限度的，太远的目标，即使非常正确，也是无法达到（dádào）的。","bg_vn":"“的” (dì) thời cổ là cái đích, “矢” (shǐ) là mũi tên → 有的放矢: bắn tên phải có đích. Thái độ quan trọng (精诚所至), nhưng xác định mục tiêu cũng quan trọng: mục tiêu quá xa thì dù đúng cũng không đạt được.","discuss_title":"话题讨论：凡事应有的放矢","discuss":["你学习过射箭吗？应该怎么做才能更容易射中目标？","在学习、工作或者生活中，我们同样需要有目标，你的目标是什么？","你觉得给自己确定什么样的目标才是最合适的？"],"write":"请以“有的放矢”为题，谈一谈你对做事情时态度和目标的看法。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“有的放矢”为题，谈一谈你对做事情时态度和目标的看法","topic_vn":"Viết bài với đầu đề “Bắn tên có đích”, nêu quan điểm về thái độ và mục tiêu khi làm việc","intro":"Dạng đề nghị luận ngắn (议论型) · Giải thích thành ngữ → thái độ quan trọng → mục tiêu cũng quan trọng → ví dụ của bản thân → kết luận · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“有的放矢”：态度 + 目标","lead":"Đề yêu cầu bàn về <b>hai thứ<\/b>: <b>态度<\/b> (thái độ — bài khóa 精诚所至，金石为开) và <b>目标<\/b> (mục tiêu — 有的放矢). Bài tốt phải nói được <b>quan hệ<\/b> giữa hai cái: thái độ tốt mà mục tiêu sai/quá xa thì cũng không thành công.","parts":[["有的放矢","的 (dì) = cái đích, 矢 (shǐ) = mũi tên → bắn tên phải nhắm đích; nghĩa bóng: nói và làm có mục tiêu rõ ràng."],["态度","Liên hệ 精诚所至，金石为开: thật lòng, tập trung (全神贯注), cố gắng hết sức (尽力)."],["目标","Mục tiêu phải rõ ràng và <b>vừa sức<\/b>: “太远的目标，即使非常正确，也是无法达到的”."],["（课本）尽量用上本课生词，不少于100字","Dùng: 确定、全神贯注、尽力、片面、结论、善于、连续、便… và 好句 của bài khóa."]],"traps":[["Chỉ kể lại chuyện Lý Quảng","Kể hết câu chuyện mà không nêu quan điểm → lạc đề."],["Chỉ nói thái độ, quên mục tiêu","Đầu đề là “有的放矢” — mục tiêu là trọng tâm."],["Mục tiêu chung chung","“我的目标是学好汉语” → nên cụ thể: 今年通过HSK5、每天记20个生词."],["Hiểu sai “的”","Ở đây 的 đọc dì (cái đích), không phải trợ từ de."]],"link":"<b>Liên hệ bài 7:<\/b> phần 背景分析 nối hai thành ngữ: 精诚所至 (thái độ) và 有的放矢 (mục tiêu). Câu 好句 “如果诚心实意，即使……也会被打动” dùng cho ý thái độ; câu “只有片面的认识是不能下结论的” gợi ý cách viết câu kết."},"steps":[["①","点题：解释成语","Mở bài: giải thích 有的放矢 (的 là đích, 矢 là tên).","“有的放矢”的意思是……"],["②","态度很重要","Nêu ý thứ nhất: làm việc phải thật lòng, tập trung, liên hệ 精诚所至.","首先，做事情的态度很重要……"],["③","目标也很重要","<b>Trọng tâm.<\/b> Mục tiêu phải rõ ràng, phù hợp; nêu ví dụ của bản thân.","但是，只有好的态度还不够……"],["④","结论","Kết: thái độ + mục tiêu đều cần, quay lại đầu đề.","所以，做任何事情都应该有的放矢。"]],"formula":["有的放矢 = ……","态度：精诚所至","目标：明确、合适 + 例子","所以……有的放矢"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 学汉语的目标","mục tiêu học tiếng Trung","Lấy ví dụ đặt mục tiêu HSK5: cụ thể, vừa sức.","每天记20个生词"],["B · 从射箭说起","bắt đầu từ bắn cung","Liên hệ cách bắn trúng đích: tư thế, tập trung, khoảng cách.","全神贯注、目标太远"],["C · 从两个成语说起","từ hai thành ngữ","So sánh 精诚所至 và 有的放矢: thái độ + mục tiêu.","李广射石"],["D · 工作和生活","công việc, cuộc sống","Lấy ví dụ người làm việc rất chăm nhưng không có mục tiêu.","忙了一年，什么也没做成"]],"notes":[["Giải thích thành ngữ ngắn gọn","Một câu là đủ: “的”是目标，“矢”是箭。"],["Ví dụ thật của bạn","Một mục tiêu cụ thể (số, thời gian) thuyết phục hơn nhiều lời chung chung."],["Câu kết","Quay lại đầu đề: “做任何事情都应该有的放矢。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> thành ngữ dùng đúng một–hai cái là đủ (有的放矢、精诚所至、全神贯注). Câu lập luận nên có từ nối: 首先……其次……；但是……；所以…….","patterns":[["① 点题","“有的放矢”中的“的”是目标，“矢”是箭，意思是射箭要对准目标。","“的” là cái đích, “矢” là mũi tên — bắn tên phải nhắm đích."],["① 点题","这个成语告诉我们：说话、做事都要有明确的目标。","Thành ngữ này cho ta biết: nói và làm đều phải có mục tiêu rõ ràng."],["② 态度","首先，做事情的态度很重要，正所谓“精诚所至，金石为开”。","Trước hết, thái độ rất quan trọng, đúng như câu “lòng thành cảm động đất trời”."],["② 态度","只要全神贯注、尽力去做，再难的事情也能做成。","Chỉ cần tập trung, cố gắng hết sức, việc khó mấy cũng làm được."],["③ 目标","但是，只有好的态度还不够，还要确定一个合适的目标。","Nhưng chỉ thái độ tốt thì chưa đủ, còn phải xác định một mục tiêu phù hợp."],["③ 目标","太远的目标，即使非常正确，也是无法达到的。","Mục tiêu quá xa, dù rất đúng, cũng không thể đạt được."],["③ 例子","比如学汉语，我给自己确定的目标是每天记二十个生词。","Ví dụ học tiếng Trung, tôi đặt mục tiêu mỗi ngày nhớ 20 từ mới."],["④ 结论","所以，做任何事情都应该有的放矢，这样才能事半功倍。","Vì vậy làm việc gì cũng nên có mục tiêu, như thế mới làm ít được nhiều."]],"links":[["Giải thích",["“……”的意思是……","这个成语告诉我们……","所谓“……”，就是……"]],["Nêu ý thứ nhất",["首先，……","正所谓“……”","只要……，就……"]],["Chuyển ý",["但是，只有……还不够","另一方面，……","即使……，也……"]],["Kết luận",["所以，……","总之，……","这样才能……"]]],"open":[["解释式","“有的放矢”中的“的”是目标，“矢”是箭，意思是射箭要对准目标。"],["提问式","为什么有的人每天都很努力，却总是没有结果呢？"],["故事式","西汉的李广全神贯注，一箭射进了石头，这说明了态度的重要。"]],"close":[["总结式","所以，做任何事情都应该有的放矢。"],["对比式","态度决定能走多远，目标决定往哪儿走。"],["呼应式","只有态度没有目标，就像射箭没有靶子，是不能成功的。"]],"from_text":[["只有……是不能……的","只有努力而没有目标，是不能取得好成绩的。","Lấy từ 好句 ①: câu kết lập luận."],["善于……，被称为……","他善于给自己确定合适的目标，被称为班里的“计划大师”。","Lấy từ 好句 ②: giới thiệu ví dụ."],["只见……，……，全神贯注……","只见他摆好姿势，全神贯注，一箭射中了目标。","Lấy từ 好句 ③: kể ví dụ sinh động."],["连……都……","目标太高的话，连自己都会失去信心。","Lấy từ 好句 ④: nhấn mạnh hậu quả."],["如果……，即使……也……","如果目标明确，即使遇到困难也不会轻易放弃。","Lấy từ 好句 ⑤: lập luận hai lớp."]],"vocab":[["目标","mùbiāo","mục tiêu","确定目标","idea"],["态度","tàidu","thái độ","做事的态度","idea"],["明确","míngquè","rõ ràng","明确的目标","idea"],["合适","héshì","phù hợp","合适的目标","idea"],["达到","dádào","đạt được","达到目标","idea"],["计划","jìhuà","kế hoạch","制定计划","idea"],["坚持","jiānchí","kiên trì","坚持下去","act"],["放弃","fàngqì","từ bỏ","轻易放弃","act"],["努力","nǔlì","nỗ lực","努力学习","act"],["集中","jízhōng","tập trung","集中注意力","act"],["实现","shíxiàn","thực hiện","实现梦想","act"],["调整","tiáozhěng","điều chỉnh","调整目标","act"],["确定","quèdìng","xác định","确定目标","lesson"],["全神贯注","quánshén guànzhù","tập trung cao độ","全神贯注地学习","lesson"],["尽力","jìnlì","cố hết sức","尽力去做","lesson"],["片面","piànmiàn","phiến diện","片面的看法","lesson"],["结论","jiélùn","kết luận","得出结论","lesson"],["善于","shànyú","giỏi về","善于计划","lesson"],["连续","liánxù","liên tục","连续努力","lesson"],["精诚所至，金石为开","jīngchéng suǒ zhì","lòng thành cảm động đất trời","正所谓精诚所至","lesson"],["有的放矢","yǒu dì fàng shǐ","bắn tên có đích","做事要有的放矢","bonus"],["事半功倍","shì bàn gōng bèi","làm ít được nhiều","有了目标就能事半功倍","bonus"],["脚踏实地","jiǎo tà shí dì","chân chạy đất","脚踏实地地努力","bonus"],["一步一个脚印","yí bù yí ge jiǎoyìn","từng bước vững chắc","一步一个脚印地前进","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 7"],["bonus","加分 · thành ngữ"]],"legend":["① Giải thích thành ngữ","② Thái độ","③ Mục tiêu","④ Kết luận"],"samples":{"speak":[{"who":"学汉语的目标","meta":"Hướng A · bài nói ~1 phút 30","p":["“有的放矢”中的“的”是目标，“矢”是箭，意思是射箭要对准目标，做事情也要有明确的目标。","首先，做事情的态度很重要。正所谓“精诚所至，金石为开”，只要全神贯注、尽力去做，再难的事情也能做成。","但是，只有好的态度还不够，还要确定一个合适的目标。我刚开始学汉语的时候，给自己定的目标是一年说得像中国人一样，结果连自己都失去了信心。后来，我把目标改成每天记二十个生词，一年以后便通过了HSK四级。","所以我觉得，做任何事情都应该有的放矢，这样才能事半功倍。"],"vi":"“的” là cái đích, “矢” là mũi tên — bắn tên phải nhắm đích, làm việc cũng phải có mục tiêu rõ ràng. Trước hết thái độ rất quan trọng: lòng thành cảm động đất trời, chỉ cần tập trung và cố hết sức thì việc khó mấy cũng làm được. Nhưng thái độ tốt chưa đủ, còn phải có mục tiêu phù hợp. Lúc mới học tôi đặt mục tiêu một năm nói như người Trung Quốc, kết quả mất hết tự tin. Sau đó tôi đổi thành mỗi ngày nhớ 20 từ, một năm sau đã qua HSK4. Vì vậy làm gì cũng nên có mục tiêu, như vậy mới làm ít được nhiều."},{"who":"从两个成语说起","meta":"Hướng C · bài nói ~1 phút 30","p":["这一课我们学了“精诚所至，金石为开”，还了解了另一个成语——“有的放矢”。","第一个成语告诉我们，态度很重要。李广全神贯注、用尽全力，一箭便射进了石头。如果诚心实意，即使像石头那样硬的东西也会被打动。","第二个成语告诉我们，目标也很重要。射箭要对准靶子，可是箭射出的距离是有限的，太远的目标，即使非常正确，也是无法达到的。","在我看来，态度决定我们能走多远，目标决定我们往哪儿走。只有态度没有目标，就像射箭没有靶子，是不能成功的。"],"vi":"Bài này học “精诚所至，金石为开” và “有的放矢”. Thành ngữ thứ nhất: thái độ quan trọng — Lý Quảng tập trung, dồn hết sức nên một mũi tên cắm vào đá. Thành ngữ thứ hai: mục tiêu cũng quan trọng — bắn tên phải nhắm đích, nhưng tầm bắn có hạn, mục tiêu quá xa thì không đạt được. Theo tôi, thái độ quyết định đi được bao xa, mục tiêu quyết định đi về đâu."}],"write":[{"who":"范文 1 · 学汉语的目标","meta":"Dạng HSK5 · khoảng 80 chữ","title":"有的放矢","p":["“有的放矢”的意思是做事情要有明确的目标。","学汉语的时候，我每天都很努力，可是没有计划，进步很慢。","后来，我给自己确定了目标：每天记二十个生词。","一年以后，我便通过了HSK四级。"],"vi":"Bố cục 4 câu: giải thích → vấn đề → đặt mục tiêu → kết quả; 便 của bài 7 dùng ở câu cuối."},{"who":"范文 2 · 态度和目标","meta":"Dạng HSK5 · khoảng 80 chữ","title":"有的放矢","p":["做事情，态度和目标都很重要。","只要全神贯注、尽力去做，再难的事也能做成。","但是太远的目标，即使非常正确，也是无法达到的。","所以，我们应该有的放矢，确定一个合适的目标。"],"vi":"Nêu hai ý song song (态度 / 目标), câu kết quay lại đầu đề."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"有的放矢","p":["“有的放矢”中的“的”是目标，“矢”是箭，意思是射箭要对准目标。","首先，做事情的态度很重要。李广全神贯注，用尽全力，一箭射进了石头。如果诚心实意，即使遇到再大的困难也能克服。","但是，只有好的态度还不够。刚学汉语时，我给自己定的目标太高，连我自己都失去了信心。后来，我把目标改成每天记二十个生词，一年以后便通过了HSK四级。","所以我认为，只有努力而没有合适的目标，是不能取得好成绩的。"],"good":["全神贯注，用尽全力","连我自己都失去了信心","只有努力而没有合适的目标，是不能取得好成绩的"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: chuỗi động tác 全神贯注，用尽全力 · 连……都…… · 只有……是不能……的."}]},"w5":["目标","态度","明确","合适","达到","计划","坚持","放弃","努力","集中","实现","调整","确定","尽力","片面","结论","善于","连续","全神贯注","智慧","寻找","反应","不要紧"],"step_names":["① 点题：解释成语","② 态度很重要","③ 目标也很重要","④ 结论"],"timer":[["① 15s",15],["② 25s",25],["③ 35s",35],["④ 15s",15]],"build_title":"选一个方向，拼出你的看法","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 学汉语的目标":[["“有的放矢”中的“的”是目标，“矢”是箭，意思是射箭要对准目标。","“有的放矢”这个成语告诉我们，做事情要有明确的目标。"],["首先，做事情的态度很重要，只要全神贯注、尽力去做，再难的事情也能做成。","正所谓“精诚所至，金石为开”，态度决定了我们能走多远。"],["但是，只有好的态度还不够。我给自己确定的目标是每天记二十个生词，一年以后便通过了HSK四级。","刚学汉语时，我的目标太高，连我自己都失去了信心，后来我把目标改得合适多了。"],["所以，做任何事情都应该有的放矢。","只有努力而没有合适的目标，是不能取得好成绩的。"]],"B · 从射箭说起":[["射箭的时候，我们要对准目标，这就是“有的放矢”。","你学过射箭吗？射箭最重要的就是对准目标。"],["首先，射箭的人要摆好姿势，全神贯注，这说明态度很重要。","李广全神贯注，用尽全力，一箭便射进了石头。"],["其次，箭射出的距离是有限的，太远的目标，即使非常正确，也是无法达到的。","如果目标太远，即使你再努力，箭也射不到。"],["学习和工作也一样，我们应该确定一个合适的目标。","所以，做事情既要有好的态度，也要有合适的目标。"]],"C · 从两个成语说起":[["这一课我们学了“精诚所至，金石为开”，还知道了“有的放矢”。","两个成语，一个讲态度，一个讲目标。"],["第一个成语告诉我们，如果诚心实意，即使像石头那样硬的东西也会被打动。","李广的故事说明，全神贯注、尽力去做非常重要。"],["第二个成语告诉我们，确定一个明确、合适的目标也很重要。","可是只有态度没有目标，就像射箭没有靶子。"],["在我看来，态度决定能走多远，目标决定往哪儿走。","所以，我们做事情应该有的放矢。"]]},"quiz":[["“有的放矢”中的“的”读什么？",["de","dì"],1,"的 (dì) = cái đích."],["Câu nào hợp làm câu mở bài?",["我觉得做事情很重要，大家都要做事情。","“有的放矢”中的“的”是目标，“矢”是箭。"],1,"Câu 2 giải thích đầu đề; câu 1 không có nội dung."],["Câu nào nói về “目标”?",["只要全神贯注，就能做成。","太远的目标，即使正确，也无法达到。"],1,"Câu 1 nói về thái độ."],["Câu nào đúng?",["如果目标明确，即使遇到困难也不会放弃。","如果目标明确，虽然遇到困难也不会放弃。"],0,"如果……，即使……也……"],["Câu nào dùng 便 đúng?",["一年以后，我便通过了HSK四级。","便一年以后，我通过了HSK四级。"],0,"便 đứng sau chủ ngữ, trước động từ."],["Câu kết nào tốt hơn?",["李广是西汉的将军。","所以，做任何事情都应该有的放矢。"],1,"Câu kết phải quay lại đầu đề."]],"fix":[["我确定了一个目标很合适。","我确定了一个很合适的目标。","Định ngữ 很合适的 đặt trước danh từ 目标."],["只要努力，才能成功。","只要努力，就能成功。／只有努力，才能成功。","只要……就……；只有……才……"],["他全神贯注地看书着。","他全神贯注地看着书。","着 đứng ngay sau động từ."],["做事情要有的放矢的。","做事情要有的放矢。","Không thêm 的 thừa ở cuối câu."],["我已经尽力了所有。","我已经尽力了。／我已经用尽了全力。","尽力 không mang tân ngữ."],["即使目标很正确，但是太远也达不到。","即使目标很正确，太远也是达不到的。","即使……也……, không dùng 但是."]],"tpl":"有的放矢\n“有的放矢”的意思是【……】。首先，【态度很重要】。但是，只有好的态度还不够，【目标也很重要】。比如【我的例子】。所以，【结论】。","chk":[["topic","Bám đề: có nói về 目标 hoặc 有的放矢","目标|有的放矢"],["attitude","Có ý thái độ (态度 · 全神贯注 · 尽力 · 精诚所至)","态度|全神贯注|尽力|精诚所至|努力"],["goal","Có ý mục tiêu phù hợp (合适 · 明确 · 太远 · 太高)","合适|明确|太远|太高|确定"],["example","Có ví dụ (比如 · 我 · 李广)","比如|例如|李广|我给自己|我的目标"],["end","Có câu kết (所以 · 总之 · 应该)","所以|总之|应该"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> một câu giải thích thành ngữ, một ý về thái độ, một ý về mục tiêu kèm ví dụ và một câu kết. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“谈成语／谈道理”的题目都可以这样写","var_lead":"Đề “bàn về một thành ngữ/câu nói” đều dùng khung: <b>giải thích → ý 1 → ý 2 (+ ví dụ) → kết luận<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）有的放矢","“有的放矢”中的“的”是目标……"],["请以“盲人摸象”给我的启发为题写一段话。","“盲人摸象”告诉我们，看问题不能片面……"],["谈谈你对“精诚所至，金石为开”的理解。","这个成语的意思是，只要真心诚意……"],["请以“我的目标”为题写一段话。","每个人都有自己的目标，我的目标是……"],["你同意“态度决定一切”这句话吗？","我同意／不完全同意这句话，因为……"],["请以“坚持”为题写一段话。","很多成功的人都有一个共同点，那就是坚持……"]],"homework":"<b>Bài về nhà:<\/b> chọn một hướng (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “有的放矢” · bắt buộc có câu giải thích thành ngữ, ý thái độ, ý mục tiêu kèm ví dụ của bạn và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();
/* ---------- TTS ---------- */
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.getAttribute("data-say"),b);}},true);
/* ---------- VN toggle ---------- */
var topbar=el("div",{class:"topbar"});

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
    b.addEventListener("click",function(){if(q.classList.contains("done"))return;q.classList.add("done");
      $$(".op",q).forEach(function(x,j){if(j===ans)x.classList.add("ok");else if(j===i)x.classList.add("no");});
      if(score)score.hit(i===ans);});ops.appendChild(b);});

function linkVocab(text){var out="",i=0;while(i<text.length){var hit=null;for(var k=0;k<VORDER.length;k++){var w=VORDER[k].hz;if(text.substr(i,w.length)===w){hit=VORDER[k];break;}}

function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
  while(i<text.length){var g=null;for(var k=0;k<goods.length;k++){if(text.substr(i,goods[k].zh.length)===goods[k].zh){g=goods[k];break;}}
