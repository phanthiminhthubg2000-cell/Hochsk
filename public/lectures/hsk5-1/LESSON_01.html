<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 01 · 爱的细节 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

。"],["瘫痪","tānhuàn","动","bị liệt",0,"身体的一部分不能活动；也比喻交通、系统等不能正常工作。","妻子说，前几年她全身瘫痪了，医生说她站起来的可能性很小。","一场大雪让城市的交通几乎瘫痪了。","Một trận tuyết lớn khiến giao thông thành phố gần như tê liệt.",["全身瘫痪","交通瘫痪","系统瘫痪"],""],["离婚","lí hūn","动","ly hôn",0,"夫妻结束婚姻关系。","别人都觉得她的丈夫会跟她离婚，她也想过要自杀。","他们离过一次婚，后来又复婚了。","Họ từng ly hôn một lần, sau đó lại tái hôn.",["跟／和……离婚","离过婚","提出离婚"],"离合词：离过婚、离了婚。不说“离婚她”，要说“跟她离婚”。"],["自杀","zìshā","动","tự tử",0,"自己结束自己的生命。","别人都觉得她的丈夫会跟她离婚，她也想过要自杀。","小说的主人公最后没有选择自杀，而是勇敢地活了下去。","Nhân vật chính của tiểu thuyết cuối cùng không chọn tự tử mà dũng cảm sống tiếp.",["想过自杀","自杀的念头"],""],["抱怨","bàoyuàn","动","oán trách, phàn nàn",1,"因为不满意，说别人或事情不好。","并且几年如一日地照顾她，从不抱怨。","与其抱怨天气不好，不如出门时带上一把伞。","Thay vì phàn nàn thời tiết xấu, chi bằng mang theo ô khi ra ngoài.",["抱怨别人","抱怨妻子","抱怨餐厅的菜不好吃","从不抱怨"],""],["爱护","àihù","动","yêu quý, quý trọng",1,"关心并保护，不让受到伤害。","在丈夫的爱护和努力下，她终于又站了起来。","我们要爱护公物，不要在墙上乱画。","Chúng ta phải giữ gìn của công, không vẽ bậy lên tường.",["爱护环境","爱护花草树木","爱护公物","爱护学生"],""],["婚姻","hūnyīn","名","hôn nhân",1,"结婚以后夫妻之间的关系。","十几年的婚姻生活中，他们从来没为任何事红过脸、吵过架……","幸福的婚姻需要两个人共同努力。","Hôn nhân hạnh phúc cần cả hai người cùng cố gắng.",["婚姻生活","幸福的婚姻","婚姻关系"],""],["吵架","chǎo jià","动","cãi nhau",1,"两个人因为意见不同，大声地争论。","他们从来没为任何事红过脸、吵过架……","他们俩昨天为一点儿小事吵了一架。","Hôm qua hai người họ cãi nhau một trận vì chuyện nhỏ.",["跟……吵架","吵了一架","吵过架"],"辨析：吵—吵架。“吵架”是离合词，后面不能带宾语。见“辨析”部分。"],["相敬如宾","xiāngjìng-rúbīn","成","tương kính như tân",0,"夫妻互相尊重，像对待客人一样客气。","一直相亲相爱、相敬如宾。","他们结婚三十年，一直相敬如宾。","Họ cưới nhau ba mươi năm, luôn tôn trọng nhau như khách.",["夫妻相敬如宾","相敬如宾的生活"],""],["暗暗","àn'àn","副","thầm, ngấm ngầm",0,"在心里，不让别人知道或看出来。","评委们听了暗暗点头。","看到大家都在努力，他暗暗下决心一定要考好。","Thấy mọi người đều cố gắng, anh ấy thầm quyết tâm nhất định phải thi tốt.",["暗暗点头","暗暗下决心","暗暗高兴"],""],["轮","lún","动","luân phiên, đến lượt",0,"按照顺序一个接一个地做。","轮到第三对夫妻了，却很长时间不见人。","我们三个人轮着开车，一点儿也不累。","Ba chúng tôi thay phiên lái xe nên chẳng mệt chút nào.",["轮到……","轮着做","轮流"],""],["不耐烦","bú nàifán","形","sốt ruột, bực mình",1,"等得太久或事情太多，心里很烦，不想再等或再听。","评委们等得有些不耐烦，就走出来看个究竟。","我问了好几遍，服务员显得有点儿不耐烦。","Tôi hỏi mấy lần, nhân viên phục vụ có vẻ hơi bực mình.",["等得不耐烦","有些不耐烦","不耐烦地说"],"要说“不耐烦”，不说“不耐心”。“耐心”的用法：很有耐心、耐心地等。"],["靠","kào","动","dựa, tựa; dựa vào; gần",1,"让身体靠着别人或东西；也指依靠、接近。","男人的头靠在女人的肩膀上，睡着了。","一个人想成功，不能只靠运气。","Muốn thành công thì không thể chỉ dựa vào may mắn.",["靠在……上","靠着墙","靠自己","靠窗的座位"],"三个意思：身体靠着 · 依靠 · 接近。见“注释”部分。"],["肩膀","jiānbǎng","名","bờ vai, vai",0,"人的脖子和胳膊中间的部分。","男人的头靠在女人的肩膀上，睡着了。","爸爸让儿子坐在自己的肩膀上看表演。","Bố cho con trai ngồi trên vai mình để xem biểu diễn.",["拍拍肩膀","靠在肩膀上"],""],["喊","hǎn","动","kêu, gọi",0,"大声地叫。","一个评委要上前喊醒那个男的……","他在楼下大声喊我的名字。","Anh ấy ở dưới nhà gọi to tên tôi.",["大声（地）喊","兴奋地喊","对他喊","喊醒"],""],["伸","shēn","动","duỗi, chìa",0,"把身体的一部分向外展开。","女的却伸出手指做了个小声的动作……","坐了一上午，他站起来伸了伸腰。","Ngồi cả buổi sáng, anh ấy đứng dậy vươn vai một chút.",["伸出（来）","伸进（去）","伸开","伸到……","伸懒腰"],""],["手指","shǒuzhǐ","名","ngón tay",0,"手上能活动的五个部分。","女的却伸出手指做了个小声的动作……","他用手指在地图上指出了我们要去的地方。","Anh ấy dùng ngón tay chỉ ra trên bản đồ nơi chúng tôi sẽ đến.",["伸出手指","手指头"],""],["歪歪扭扭","wāiwāiniǔniǔ","形","xiêu vẹo, nguệch ngoạc",0,"不正、不直的样子，常用来说字写得不好看。","用左手歪歪扭扭写下一行字递给评委……","孩子刚学写字，字写得歪歪扭扭的。","Bé mới tập viết nên chữ nguệch ngoạc.",["写得歪歪扭扭","歪歪扭扭的字"],""],["递","dì","动","đưa, chuyền",0,"把手里的东西交给别人。","用左手歪歪扭扭写下一行字递给评委……","他把一杯热茶递给了妈妈。","Anh ấy đưa cho mẹ một cốc trà nóng.",["递给……","递过来","递名片"],""],["脑袋","nǎodai","名","đầu",0,"人的头，口语的说法。","而她的右肩一直让丈夫的脑袋靠着。","他摸摸脑袋，不好意思地笑了。","Anh ấy gãi đầu, cười ngượng ngùng.",["摇脑袋","脑袋疼"],""],["女士","nǚshì","名","bà, quý cô (cách gọi lịch sự)",0,"对女性有礼貌的叫法。","但是女士，我们得听你们夫妻俩的叙述啊！","女士们、先生们，欢迎大家来参加今天的晚会。","Thưa quý bà, quý ông, chào mừng mọi người đến dự buổi dạ hội hôm nay.",["女士们、先生们","王女士"],""],["叙述","xùshù","动","thuật lại",1,"把事情的经过说出来或写出来。","但是女士，我们得听你们夫妻俩的叙述啊！","请你把事情的经过简单地叙述一下。","Bạn hãy thuật lại ngắn gọn diễn biến sự việc.",["叙述经过","详细叙述","简单地叙述"],""],["居然","jūrán","副","(chỉ sự bất ngờ) lại, thế mà",1,"没想到；事情和自己想的不一样。","这个女人为了不影响丈夫睡觉，居然放弃这次机会！","他才学了半年汉语，居然能看懂中文电影了。","Anh ấy mới học tiếng Trung nửa năm mà đã xem hiểu phim Trung Quốc.",["居然会……","居然是……","居然没……"],"辨析：居然—果然。“居然”表示没想到，“果然”表示和想的一样。见“辨析”部分。"],["催","cuī","动","thúc giục, hối thúc",1,"让别人快一点儿做某件事。","但评委们还是决定先不催他们，而是再等待一段时间。","妈妈一直催我早点儿结婚。","Mẹ cứ giục tôi lấy chồng sớm.",["催他","催得很急","别催了"],""],["等待","děngdài","动","đợi, chờ",1,"等，多用于书面语。","但评委们还是决定先不催他们，而是再等待一段时间。","他耐心地等待着考试的结果。","Anh ấy kiên nhẫn chờ kết quả thi.",["等待机会","耐心地等待","等待结果"],""],["蚊子","wénzi","名","con muỗi",0,"一种很小的飞虫，会叮人。","我家住一楼，蚊子多。","夏天的晚上蚊子特别多。","Buổi tối mùa hè muỗi rất nhiều.",["赶蚊子","打蚊子","被蚊子叮"],""],["半夜","bànyè","名","nửa đêm, đêm hôm",0,"夜里十二点左右，也指很晚的夜里。","昨晚半夜我被蚊子叮醒了……","他常常工作到半夜。","Anh ấy thường làm việc đến nửa đêm.",["半夜醒来","后半夜","三更半夜"],""],["叮","dīng","动","đốt, chích",0,"蚊子等小虫用嘴咬人。","昨晚半夜我被蚊子叮醒了……","我腿上被蚊子叮了好几个包。","Chân tôi bị muỗi đốt mấy nốt.",["被蚊子叮","叮了一个包"],""],["老婆","lǎopo","名","vợ",0,"妻子，口语的说法。","我怕我老婆再被吵醒……","他每天下班都早早回家陪老婆孩子。","Ngày nào tan làm anh ấy cũng về sớm với vợ con.",["我老婆","老婆孩子"],"“老婆”和“老公”都是口语。"],["吵","chǎo","动/形","làm ồn; ồn ào",1,"声音大，让人不安静；也指大声地争论。","我怕我老婆再被吵醒……","外面太吵了，我一点儿也睡不着。","Bên ngoài ồn quá, tôi không ngủ được chút nào.",["吵醒","吵死了","太吵了","别吵了"],"辨析：吵—吵架。“吵”可以作形容词（太吵了），也可以带补语（吵醒）。见“辨析”部分。"],["项","xiàng","量","hạng mục, mục",1,"用于分成项目的事物。","最后的结果是，电台增加了两项奖项……","这项工作需要大家一起完成。","Hạng mục công việc này cần mọi người cùng hoàn thành.",["一项运动","一项任务","一项研究","一项调查","奖项"],""],["患难与共","huànnàn-yǔgòng","成","hoạn nạn có nhau",0,"遇到困难和危险的时候一起面对。","将第一对夫妻评为“患难与共夫妻”……","他们是患难与共的好朋友。","Họ là đôi bạn hoạn nạn có nhau.",["患难与共的朋友","患难与共的夫妻"],""]],"WARM":[{"tab":"思考","title":"思考：什么是爱？","type":"think","q":"如果一个人从来不说“我爱你”，你怎么知道他爱不爱你？","vn":"Nếu một người chưa bao giờ nói “Anh yêu em”, làm sao bạn biết người đó có yêu bạn hay không?","opts":[["A","每天说：“我爱你。”","Mỗi ngày đều nói: “Anh yêu em.”"],["B","记得对方不吃香菜。","Nhớ rằng người kia không ăn rau mùi."],["C","主动做家务。","Chủ động làm việc nhà."],["D","半夜起来帮对方赶蚊子。","Nửa đêm dậy đuổi muỗi giúp người kia."]],"discuss":"哪一个最能说明一个人爱另一个人？为什么？","discuss_vn":"Điều nào thể hiện rõ nhất một người yêu một người khác? Vì sao?","hint":"Không có đáp án duy nhất. Gợi ý: B, C, D đều là <b>hành động<\/b> và <b>chi tiết<\/b> trong cuộc sống — đúng với chủ đề bài 爱的细节. Đáp án D chính là chi tiết trong bài khóa (người chồng thức nửa đêm đuổi muỗi cho vợ).","hint_zh":"我觉得D最能说明爱。说“我爱你”很容易，可是半夜起来帮对方赶蚊子，需要真正的关心。爱不只是一句话，更是生活中的细节。"},{"tab":"人体部位","title":"人体部位","type":"body","lead":"Bạn biết các bộ phận cơ thể nói bằng tiếng Trung thế nào? Bấm vào số trên hình hoặc ô trong danh sách để xem đáp án.","items":[["脑袋","nǎodai","đầu",200,30,335,30],["眉毛","méimao","lông mày",188,50,60,48],["嗓子","sǎngzi","cổ họng",200,96,60,100],["脖子","bózi","cổ",210,110,335,104],["肩膀","jiānbǎng","vai",150,132,60,145],["胸","xiōng","ngực",228,170,335,170],["胳膊","gēbo","cánh tay",116,196,50,205],["手指","shǒuzhǐ","ngón tay",302,304,365,335],["腰","yāo","eo",138,250,50,262],["腿","tuǐ","chân (đùi, cẳng)",236,390,335,400],["脚","jiǎo","bàn chân",164,484,60,470]],"note":"Từ trong bài: <b class='zh'>肩膀、手指、脑袋<\/b>. Phần 扩展 (mục 04) có thêm từ chủ đề cơ thể người."},{"tab":"说话动词","title":"说话动词","type":"words","task":"你知道哪些与说话或口部动作有关的动词？请写下来，并说说它们是什么意思。","task_vn":"Bạn biết những động từ nào liên quan đến nói hoặc hoạt động của miệng? Hãy viết ra và nói nghĩa của chúng.","groups":[{"title":"本课生词中的","given":1,"items":[["抱怨","phàn nàn"],["吵架","cãi nhau"],["喊","kêu, gọi to"],["叙述","thuật lại"],["吵","làm ồn; cãi"]]},{"title":"其他你知道的","given":0,"items":[["说","nói"],["讲","kể, giảng"],["叫","gọi, kêu"],["聊","tán gẫu"],["问","hỏi"],["回答","trả lời"],["讨论","thảo luận"],["唱","hát"],["骂","mắng"],["笑","cười"],["哭","khóc"],["咬","cắn"]]}]}],"_N":{"不耐烦":"要说“不耐烦”，不说“不耐心”。“耐心”的用法：很有耐心、耐心地等。","吵":"辨析：吵—吵架。“吵”可以作形容词（太吵了），也可以带补语（吵醒）。见“辨析”部分。","吵架":"辨析：吵—吵架。“吵架”是离合词，后面不能带宾语。见“辨析”部分。","如何":"辨析：如何—怎么。“如何”多用于书面语，不能用来询问原因。见“辨析”部分。","居然":"辨析：居然—果然。“居然”表示没想到，“果然”表示和想的一样。见“辨析”部分。","离婚":"离合词：离过婚、离了婚。不说“离婚她”，要说“跟她离婚”。","老婆":"“老婆”和“老公”都是口语。","靠":"三个意思：身体靠着 · 依靠 · 接近。见“注释”部分。"},"GAME":{"fill":[["评委们等得有些{}，就走出来看个究竟。","不耐烦",["不耐烦","不耐心","耐烦","吃惊"]],["男人的头{}在女人的肩膀上，睡着了。","靠",["靠","伸","递","喊"]],["一个评委要上前{}醒那个男的……","喊",["喊","吵","催","叮"]],["用左手歪歪扭扭写下一行字{}给评委……","递",["递","伸","送","靠"]],["这个女人为了不影响丈夫睡觉，{}放弃这次机会！","居然",["居然","果然","仍然","当然"]],["评委们还是决定先不{}他们，而是再等待一段时间。","催",["催","喊","叫","等"]],["在丈夫的{}和努力下，她终于又站了起来。","爱护",["爱护","抱怨","保护","爱好"]],["十几年的{}生活中，他们从来没为任何事红过脸……","婚姻",["婚姻","离婚","结婚","恩爱"]],["评委们听了{}点头。","暗暗",["暗暗","慢慢","常常","偷偷"]],["电台增加了两{}奖项……","项",["项","个","件","条"]]],"order":[["评委们|听了|暗暗|点头。"],["男人的头|靠在|女人的|肩膀上，|睡着了。"],["在丈夫的|爱护和努力下，|她终于|又站了起来。"],["电台|要选出|一对|最恩爱的|夫妻。"],["我怕|我老婆|再被|吵醒。"],["评委们|还是决定|先不催他们，|而是|再等待|一段时间。"]]},"GOOD":[{"zh":"为她不知找了多少家医院，并且几年如一日地照顾她，从不抱怨","vn":"vì cô ấy mà không biết đã tìm bao nhiêu bệnh viện, lại còn bao năm như một ngày chăm sóc cô ấy, chưa từng phàn nàn","why":"Ba vế tăng dần: <b>不知……了多少<\/b> (nhiều không đếm xuể) → <b>几年如一日地<\/b> (bền bỉ không đổi) → <b>从不<\/b> (chốt lại thái độ). Rất hợp để tả sự hi sinh, kiên trì của một người.","frame":"不知 + V + 了多少 + N，并且 ……年如一日地 + V，从不 + V","apply":"为了写好这本书，他不知查了多少资料，并且十年如一日地坚持写作，从不放弃。","apply_vn":"Để viết tốt cuốn sách này, ông không biết đã tra bao nhiêu tài liệu, mười năm như một ngày kiên trì viết, chưa từng bỏ cuộc."},{"zh":"在丈夫的爱护和努力下，她终于又站了起来","vn":"Dưới sự chở che và nỗ lực của chồng, cuối cùng cô ấy lại đứng dậy được","why":"Khung <b>在……的……下<\/b> nêu điều kiện/sự giúp đỡ, vế sau nêu kết quả. Dùng để mở hoặc kết một đoạn kể về sự giúp đỡ, ảnh hưởng của ai đó.","frame":"在 + 某人 + 的 + 帮助／鼓励／支持 + 下，……终于……","apply":"在老师的鼓励和帮助下，我终于通过了HSK五级考试。","apply_vn":"Nhờ sự động viên và giúp đỡ của thầy cô, cuối cùng tôi đã thi đỗ HSK 5."},{"zh":"这个女人为了不影响丈夫睡觉，居然放弃这次机会","vn":"người phụ nữ này vì không muốn làm chồng mất giấc ngủ mà lại từ bỏ cơ hội lần này","why":"<b>为了 + mục đích<\/b> + <b>居然 + việc bất ngờ<\/b>: làm nổi bật một hành động hi sinh khiến người khác ngạc nhiên. Rất hợp với đoạn “kể một chi tiết cảm động”.","frame":"某人 + 为了 + 目的，居然 + 做出让人意外的事","apply":"他为了照顾生病的妈妈，居然放弃了出国留学的机会。","apply_vn":"Anh ấy vì chăm sóc mẹ ốm mà lại từ bỏ cơ hội đi du học."},{"zh":"评委们还是决定先不催他们，而是再等待一段时间","vn":"ban giám khảo vẫn quyết định tạm thời không giục họ, mà đợi thêm một lúc","why":"<b>不 A，而是 B<\/b>: phủ định một cách làm, khẳng định cách làm khác. Dùng khi nêu quan điểm, lời khuyên trong bài nghị luận.","frame":"不（是）+ A，而是 + B","apply":"遇到问题时，我们不应该一直抱怨，而是要想办法解决。","apply_vn":"Khi gặp vấn đề, chúng ta không nên phàn nàn mãi, mà phải tìm cách giải quyết."},{"zh":"而真正的“最恩爱夫妻”奖，却给了第三对夫妻","vn":"còn giải “vợ chồng ân ái nhất” thật sự thì lại dành cho cặp thứ ba","why":"<b>而真正的……却……<\/b>: đặt điều quan trọng nhất ở cuối, tạo bất ngờ và nhấn mạnh. Rất hợp làm câu kết bài.","frame":"……，而真正的 + N，却 + ……","apply":"很多人以为成功靠的是聪明，而真正让人成功的，却是坚持。","apply_vn":"Nhiều người nghĩ thành công nhờ thông minh, nhưng điều thật sự giúp người ta thành công lại là sự kiên trì."}],"GRAMMAR":[{"word":"如何","py":"rúhé","pos":"代词","forms":["如何 + 动词（询问方式）","……，如何？／情况如何？（句末，询问情况、征求意见）"],"vn":"<b>如何<\/b> = 怎么样, 用什么方法 (như thế nào). Thiên về văn viết, trang trọng. Đứng trước động từ để hỏi cách thức; đứng cuối câu để hỏi tình hình hoặc xin ý kiến. <b>Không<\/b> dùng để hỏi nguyên nhân.","text":"评委叫第一对夫妻说说他俩是如何恩爱的。","ex":[["我们明天开会，讨论这个问题该如何解决。","Ngày mai chúng ta họp, thảo luận vấn đề này nên giải quyết thế nào."],["我们希望由你来负责这个项目，如何？","Chúng tôi muốn anh phụ trách dự án này, anh thấy sao?"],["“80后”们的月收入情况如何？","Thu nhập hằng tháng của thế hệ 8x thế nào?"]],"err":[["❌ 你如何这么晚才来？","✅ 你怎么这么晚才来？","Hỏi nguyên nhân phải dùng 怎么."],["❌ 如何，你不认识我了？","✅ 怎么，你不认识我了？","Đầu câu tỏ ý ngạc nhiên chỉ dùng 怎么."]],"book":[["请你说一说，____________。（如何）","Gợi ý: giới thiệu cách bạn học tiếng Trung.","请你说一说，你是如何学习汉语的。"],["A：____________？（如何）<br>B：他们相敬如宾，关系很好。","Gợi ý: hỏi về quan hệ của hai người.","他们俩的关系如何？"],["A：你能不能简单地叙述一下那部电影的内容？<br>B：____________。（如何）","Gợi ý: tóm tắt nội dung phim.","这部电影讲的是一对夫妻如何互相照顾、一起面对困难的故事。"]],"drill":[["Câu nào đúng?",["你如何没来上课？","这个问题应该如何解决？","如何，你生气了？"],1,"如何 hỏi cách thức (giải quyết thế nào) → đúng."],["“如何”放在哪里？ 我们一起去吃饭，<u>A<\/u>你看<u>B<\/u>？",["A","B"],1,"Cuối câu, xin ý kiến: 你看如何？"],["Câu nào dùng 如何 để hỏi tình hình?",["最近工作如何？","你如何不高兴？","如何是你？"],0,"……如何？ đứng cuối câu hỏi tình hình."]]},{"word":"靠","py":"kào","pos":"动词","forms":["靠着／靠在 + 人／物（身体靠着）","靠 + 人／东西（依靠，得益于）","靠 + 地方（接近）"],"vn":"<b>靠<\/b> có 3 nghĩa: ① <b>dựa, tựa<\/b> — để một phần cơ thể dựa vào người/vật (靠着、靠在……上); ② <b>dựa vào, nhờ vào<\/b> (靠自己、靠朋友); ③ <b>gần, sát<\/b> (靠窗、靠海).","text":"……男人的头靠在女人的肩膀上，睡着了。","ex":[["他太累了，靠着椅背睡着了。","Anh ấy mệt quá, tựa lưng ghế ngủ thiếp đi. (nghĩa ①)"],["“在家靠父母，出门靠朋友。”有什么需要帮忙的，尽管开口。","Ở nhà nhờ cha mẹ, ra ngoài nhờ bạn bè. Cần giúp gì cứ nói. (nghĩa ②)"],["以后我一定要买一个靠海的房子。","Sau này tôi nhất định mua một căn nhà gần biển. (nghĩa ③)"]],"err":[["❌ 他靠着在椅子上睡觉。","✅ 他靠在椅子上睡觉。／他靠着椅子睡觉。","靠着 + tân ngữ hoặc 靠在 + nơi chốn, không dùng cả hai."],["❌ 我的成功是靠了运气。","✅ 我的成功是靠运气（得来）的。","Nghĩa 'dựa vào' thường không thêm 了."]],"book":[["快要到站了，你别____________，不安全。（靠）","Gợi ý: đừng dựa vào cửa xe.","快要到站了，你别靠着车门，不安全。"],["A：下个星期的考试，你需要我帮忙吗？<br>B：____________。（靠）","Gợi ý: muốn dựa vào chính mình.","谢谢你，不过这次我想靠自己的努力通过考试。"],["A：您好，请给我登机牌。<br>B：好的，____________？（靠）","Gợi ý: hỏi muốn ngồi ở đâu.","您要靠窗的座位还是靠过道的座位"]],"drill":[["“靠”是什么意思？ 我的座位是17号，是靠窗的座位。",["dựa, tựa","dựa vào","gần, sát"],2,"靠窗 = sát cửa sổ."],["“靠”是什么意思？ 没有一个人可以完全不靠别人而生活。",["dựa, tựa","dựa vào","gần, sát"],1,"Nghĩa ② dựa vào người khác."],["“靠”是什么意思？ 王老师喜欢靠着桌子讲课。",["dựa, tựa","dựa vào","gần, sát"],0,"Cơ thể tựa vào bàn."],["Câu nào đúng?",["他靠着在墙上。","他靠在墙上。","他靠墙上着。"],1,"靠在 + nơi chốn."]]},{"word":"居然","py":"jūrán","pos":"副词","forms":["主语 + 居然 + 动词／形容词","没想到 + （主语）+ 居然 + ……"],"vn":"<b>居然<\/b> = không ngờ, thế mà. Diễn tả sự việc <b>vượt ngoài dự đoán<\/b> của người nói. Là phó từ nên thường đứng <b>sau chủ ngữ, trước động từ<\/b>. Hay đi với 没想到.","text":"大家很吃惊，这个女人为了不影响丈夫睡觉，居然放弃这次机会！","ex":[["这么简单的题，你居然也不会做？上课时都干什么去了？","Đề dễ thế này mà em cũng không làm được? Lên lớp em làm gì vậy?"],["没想到居然在这儿碰到你！你也去上海？","Không ngờ lại gặp cậu ở đây! Cậu cũng đi Thượng Hải à?"],["他才学了三个月汉语，居然能用中文做报告了。","Anh ấy mới học tiếng Trung ba tháng mà đã thuyết trình được bằng tiếng Trung."]],"err":[["❌ 这么简单的题，他居然会做。","✅ 这么难的题，他居然会做。","Việc đơn giản làm được là bình thường; 居然 cần điều bất ngờ."],["❌ 我早就知道他会来，他居然来了。","✅ 我早就知道他会来，他果然来了。","Đúng như dự đoán → 果然, không phải 居然."]],"book":[["我快被气死了！____________。（居然）","Gợi ý: một việc khiến bạn bất ngờ, bực mình.","他居然把我的新电脑弄坏了，还不跟我道歉"],["A：你听说了吗？小王和小李离婚了！<br>B：____________。（居然）","Gợi ý: tỏ ý bất ngờ khi nghe tin.","真的吗？他们那么恩爱，居然离婚了"],["A：____________。（居然）<br>B：是啊，比赛之前我以为他肯定会赢呢。","Gợi ý: kết quả khác hẳn dự đoán.","没想到他居然输了"]],"drill":[["“居然”放在哪里？ <u>A<\/u>他<u>B<\/u>把这件事忘了。",["A","B"],1,"Phó từ đứng sau chủ ngữ: 他居然……"],["Câu nào dùng đúng 居然?",["天气预报说下雨，居然下雨了。","他平时成绩很差，这次居然考了第一名。","我知道他会帮我，他居然帮我了。"],1,"Thành tích kém mà đứng nhất → bất ngờ."],["选择：没想到他____会说这么流利的汉语。",["居然","果然","仍然"],0,"没想到 + 居然."]]}],"HSK":{"r1":[{"text":["王先生结婚二十年了，和太太一直很{36}。有一次，记者问他有什么秘诀。王先生笑着说：“其实很简单，结婚那天我们就约好了：大事由我决定，小事由太太决定。”记者又问：“那什么是大事，什么是小事呢？”王先生说：“买房子、买车、孩子上哪个学校，这些都是小事，{37}。”记者有点儿{38}：“那您决定什么？”“我决定国家应该怎么发展，世界上哪个国家应该加入联合国……”"],"qs":[{"n":36,"o":["热闹","恩爱","吃惊","安静"],"a":1,"why":"“和太太一直很恩爱”，形容夫妻感情好，用“恩爱”。"},{"n":37,"o":["我从来不管大事","记者不必知道","都由我太太决定","我们经常吵架"],"a":2,"why":"前面说“小事由太太决定”，买房、买车都是“小事”，所以都由太太决定。"},{"n":38,"o":["满足","委屈","不耐烦","吃惊"],"a":3,"why":"王先生把大事都说成小事，记者没想到，所以感到“吃惊”。"}]},{"text":["心理学家研究发现，让婚姻幸福的，往往不是轰轰烈烈的大事，{39}。比如，早上出门前的一个拥抱，下班回家时的一句“辛苦了”，生病时递过来的一杯热水。这些动作看起来很普通，却能让对方{40}到被关心、被爱护。相反，如果夫妻之间总是互相{41}，很少表达感谢，感情就会慢慢变淡。所以专家建议，{42}，不妨从每天说一句“谢谢”开始。"],"qs":[{"n":39,"o":["也不是互相关心","而是生活中的小细节","所以要常常吵架","而是很多的钱"],"a":1,"why":"“不是……，而是……”：后面举的例子都是生活中的小事，所以选“而是生活中的小细节”。"},{"n":40,"o":["感动","感谢","感受","感情"],"a":2,"why":"“感受到被关心”，“感受”后面可以带“到”。"},{"n":41,"o":["抱怨","鼓励","照顾","等待"],"a":0,"why":"后面说“感情就会慢慢变淡”，是不好的情况，所以选“抱怨”。"},{"n":42,"o":["如果夫妻已经离婚","要是工作太忙","想让婚姻更幸福","即使不爱对方"],"a":2,"why":"专家建议的目的是让婚姻更幸福。"}]}],"r2":[{"start":46,"paras":["后来，李奶奶的眼睛越来越不好，看书、读报都成了问题。","邻居们问他累不累，张爷爷笑着说：“当年她为我留了几十年的灯，现在该我做她的眼睛了。”","李奶奶和张爷爷结婚已经五十年了，在小区里是有名的恩爱夫妻。","于是，张爷爷每天早上都坐在她身边，一个字一个字地给她读报纸，一读就是十年。","年轻时，张爷爷工作很忙，常常半夜才回家。不管多晚，李奶奶都会给他留一盏灯和一碗热汤。"],"ans":["C","E","A","D","B"],"why":"先介绍人物（C），再讲年轻时的事（E），然后是“后来”（A）和“于是”（D），最后是张爷爷说的话（B）。"}],"r3":[{"text":["有人说，爱有很多种“语言”。有的人习惯用语言表达，常常说“我爱你”；有的人却从来不说，而是用行动表达，比如做一顿饭、修一把椅子。","小林和丈夫结婚三年，最常抱怨的就是丈夫“不浪漫”：他从来不送花，也不记得结婚纪念日。有一次，小林生病住院，丈夫每天下班后都赶到医院，半夜还起来给她倒水、盖被子，自己却瘦了好几斤。","出院那天，小林看着丈夫红红的眼睛，突然明白了：<u><b>原来他的爱一直都在，只是我没有听懂他的“语言”<\/b><\/u>。","专家认为，夫妻之间出现矛盾，很多时候不是因为不爱，而是因为表达爱的方式不同。了解对方的“爱的语言”，学会用对方能懂的方式去爱，婚姻才会越来越幸福。"],"qs":[{"n":56,"s":"小林以前最常抱怨丈夫什么？","o":["工作太忙","不够浪漫","不爱做饭","常常生病"],"a":1,"why":"第二段：最常抱怨的就是丈夫“不浪漫”。"},{"n":57,"s":"第三段画线句子的意思最可能是：","o":["丈夫一直爱她，只是表达方式不同","丈夫不会说普通话","丈夫不想跟她说话","她听不清丈夫的声音"],"a":0,"why":"这里的“语言”指表达爱的方式，丈夫用行动表达爱。"},{"n":58,"s":"根据最后一段，夫妻之间出现矛盾，常常是因为：","o":["不爱对方","经济条件不好","表达爱的方式不同","工作太累"],"a":2,"why":"最后一段：不是因为不爱，而是因为表达爱的方式不同。"},{"n":59,"s":"最适合做上文题目的是：","o":["浪漫的丈夫","住院的日子","结婚纪念日","读懂爱的语言"],"a":3,"why":"全文讲爱有不同的“语言”，要学会读懂对方的爱。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出发生在小美和丈夫身上的故事。","vn":"Dựa vào 4 khung tranh, viết một bài không ít hơn 100 chữ, kể câu chuyện của Tiểu Mỹ và chồng.","panels":[["🌧️","下班时突然下大雨，小美没带伞，站在公司门口发愁。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk3901_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#9aa8bb\"/><stop offset=\"1\" stop-color=\"#c9d1dc\"/><\/linearGradient><\/defs><rect width=\"320\" height=\"240\" fill=\"url(#sk3901_1)\"/><rect x=\"70\" y=\"40\" width=\"180\" height=\"170\" fill=\"#c9d3e3\"/><rect x=\"78\" y=\"50\" width=\"19\" height=\"16\" fill=\"#eaf3ff\"/><rect x=\"105\" y=\"50\" width=\"19\" height=\"16\" fill=\"#eaf3ff\"/><rect x=\"133\" y=\"50\" width=\"19\" height=\"16\" fill=\"#eaf3ff\"/><rect x=\"160\" y=\"50\" width=\"19\" height=\"16\" fill=\"#eaf3ff\"/><rect x=\"187\" y=\"50\" width=\"19\" height=\"16\" fill=\"#eaf3ff\"/><rect x=\"215\" y=\"50\" width=\"1 \n所以我认为，爱不只是一句话，更是生活中的每一个动作、每一个细节。","svn":"Bài nghị luận 4 đoạn: quan điểm → ví dụ ông bà → nhượng bộ (当然……但是……) → kết luận (不只是……更是……)."}},"PRACTICE":{"ex1":{"bank":["催","递","喊","项","爱护","抱怨","等待"],"items":[["她从小就{}小动物。",["爱护"]],["关于这段对话，下面哪{}是正确的？",["项"]],["请大家耐心地{}一会儿，不要{}他。",["等待","催"]],["请把那本杂志{}给我。",["递"]],["火车快到的时候你{}我一声。",["喊"]],["不要总是{}别人，要想想能不能改变自己。",["抱怨"]]]},"ex2":[["你的病都好了吗？现在感觉____？",["如何","怎么"],0],["电视里广告太多让观众感到很不____。",["耐心","耐烦"],1],["这儿太____了，我们换个地方吧。",["吵","吵架"],0],["他这么年轻，没想到____是一位著名的作家。",["居然","仍然"],0]],"ex3":[["如果<u>A<\/u>是你<u>B<\/u>，你会<u>C<\/u>选择<u>D<\/u>呢？","如何",2,"你会如何选择呢？"],["你跟<u>A<\/u>你的同屋<u>B<\/u>吵<u>C<\/u>架<u>D<\/u>吗？","过",2,"你跟你的同屋吵过架吗？"],["<u>A<\/u>机会是要<u>B<\/u>自己努力<u>C<\/u>去<u>D<\/u>获得的。","靠",1,"机会是要靠自己努力去获得的。"],["请不要<u>A<\/u>把头<u>B<\/u>到车窗外<u>C<\/u>去<u>D<\/u>。","伸",1,"请不要把头伸到车窗外去。"]],"ex4":[["第一对夫妻","离婚、自杀、抱怨、爱护","第一对夫妻中，妻子前几年全身瘫痪了。别人都觉得丈夫会跟她离婚，她也想过要自杀。可是丈夫一直鼓励她，几年如一日地照顾她，从不抱怨。在丈夫的爱护下，她终于又站了起来。"],["第二对夫妻","婚姻、吵架、暗暗","第二对夫妻说，十几年的婚姻生活中，他们从来没吵过架，一直相敬如宾。评委们听了暗暗点头。"],["第三对夫妻","不耐烦、靠、喊、伸、催、等待、半夜、吵","轮到第三对夫妻时，评委们等得不耐烦了，出来一看，丈夫的头靠在妻子的肩膀上睡着了。评委想喊醒他，妻子却伸出手指，让大家小声点儿。评委们决定不催他们，再等待一会儿。原来，丈夫昨天半夜被蚊子叮醒，怕妻子被吵醒，后半夜一直在为她赶蚊子。"]],"ext":{"title":"扩展 · 话题：人体","words":[["脑袋","nǎodai","đầu"],["脖子","bózi","cổ"],["肩膀","jiānbǎng","vai"],["胸","xiōng","ngực"],["腰","yāo","eo"],["后背","hòubèi","lưng"],["手指","shǒuzhǐ","ngón tay"],["眉毛","méimao","lông mày"],["嗓子","sǎngzi","cổ họng"],["牙齿","yáchǐ","răng"]],"items":[["你的{}好像一边高一边低，我建议你去买个双肩包。","肩膀"],["早上起来，伸个懒{}，真舒服！","腰"],["他长着两条又黑又粗的{}，一双大大的眼睛。","眉毛"],["讲了一天的课，老师的{}都疼了。","嗓子"]]}},"TEXT":[{"title":"第一对夫妻","sub":"患难中的爱","paras":["电台要选出一对最恩爱的夫妻。对比后，有三对夫妻入围。","评委叫第一对夫妻说说他俩是如何恩爱的。妻子说，前几年她全身瘫痪了，医生说她站起来的可能性很小。别人都觉得她的丈夫会跟她离婚，她也想过要自杀。但丈夫一直鼓励她，为她不知找了多少家医院，并且几年如一日地照顾她，从不抱怨。在丈夫的爱护和努力下，她终于又站了起来。她的故事十分感人，评委们听了都很感动。"],"idea":"Đài phát thanh chọn “cặp vợ chồng ân ái nhất”, ba cặp lọt vào vòng trong. Cặp thứ nhất: người vợ bị liệt toàn thân, người chồng không bỏ đi mà kiên trì động viên, tìm thầy chữa, chăm sóc nhiều năm không một lời phàn nàn — tình yêu <b>trong hoạn nạn<\/b>.","qs":[["有几对夫妻入围？",["两对","三对","四对"],1],["妻子前几年怎么了？",["跟丈夫离婚了","全身瘫痪了","找不到工作"],1],["下面哪一项<b>不是<\/b>丈夫做的？",["一直鼓励她","为她找医院","常常抱怨"],2]]},{"title":"第二对夫妻","sub":"尊重与和谐","paras":["随后进来的是第二对夫妻，他俩说，十几年的婚姻生活中，他们从来没为任何事红过脸、吵过架，一直相亲相爱、相敬如宾。评委们听了暗暗点头。"],"idea":"Cặp thứ hai kết hôn hơn mười năm, chưa từng đỏ mặt hay cãi nhau, luôn yêu thương và tôn trọng nhau — tình yêu <b>hòa hợp, tương kính<\/b>. Giám khảo thầm gật đầu.","qs":[["第二对夫妻结婚多长时间了？",["几年","十几年","几十年"],1],["评委们听了以后有什么反应？",["很不耐烦","暗暗点头","大声叫好"],1]]},{"title":"第三对夫妻","sub":"生活中的细节","paras":["轮到第三对夫妻了，却很长时间不见人。评委们等得有些不耐烦，就走出来看个究竟。只见第三对夫妻仍然坐在门口，男人的头靠在女人的肩膀上，睡着了。一个评委要上前喊醒那个男的，女的却伸出手指做了个小声的动作，然后小心地从包里拿出纸笔，用左手歪歪扭扭写下一行字递给评委，而她的右肩一直让丈夫的脑袋靠着。评委们看那纸条上面写着：别出声，他昨晚没睡好。一个评委提起笔在后面续写了一句话：但是女士，我们得听你们夫妻俩的叙述啊！女人又写：那我们就不参加了。","大家很吃惊，这个女人为了不影响丈夫睡觉，居然放弃这次机会！但评委们还是决定先不催他们，而是再等待一段时间。","过了一会儿，男人醒了。评委们问他怎么那么累。男人不好意思地笑笑说：“我家住一楼，蚊子多。昨晚半夜我被蚊子叮醒了，我怕我老婆再被吵醒，所以后半夜就在为她赶蚊子。”"],"idea":"Cặp thứ ba ngồi ngoài cửa: chồng ngủ gục trên vai vợ. Vợ ra hiệu im lặng, dùng tay trái viết nguệch ngoạc, sẵn sàng bỏ cuộc thi để chồng ngủ yên. Hóa ra đêm qua chồng thức nửa đêm đuổi muỗi cho vợ — tình yêu <b>trong từng chi tiết nhỏ<\/b>.","qs":[["第三对夫妻为什么很长时间不进来？",["他们迟到了","丈夫靠在妻子肩膀上睡着了","他们不想参加比赛"],1],["妻子为什么用左手写字？",["她是左撇子","右肩让丈夫靠着","右手受伤了"],1],["丈夫为什么那么累？",["工作到半夜","后半夜为妻子赶蚊子","照顾生病的孩子"],1]]},{"title":"最后的结果","sub":"最恩爱夫妻","paras":["最后的结果是，电台增加了两项奖项，将第一对夫妻评为“患难与共夫妻”，将第二对夫妻评为“相敬如宾夫妻”，而真正的“最恩爱夫妻”奖，却给了第三对夫妻。"],"idea":"Đài thêm hai giải cho cặp 1 và cặp 2, còn giải “vợ chồng ân ái nhất” thật sự thuộc về cặp 3. Thông điệp: tình yêu sâu sắc nhất thường nằm ở <b>những chi tiết nhỏ hằng ngày<\/b>.","qs":[["电台增加了几项奖项？",["一项","两项","三项"],1],["“最恩爱夫妻”奖给了谁？",["第一对夫妻","第二对夫妻","第三对夫妻"],2],["这篇课文主要想告诉我们什么？",["爱要常常说出来","爱常常藏在生活的细节里","夫妻之间不应该吵架"],1]]}],"TEXT_EXTRA":{"compare_title":"三个故事，三种“爱”","compare_head":["夫妻","奖项","他们的“爱”是什么？"],"discuss_title":"话题讨论：理想的夫妻关系是什么样的？","compare":[["第一对","患难与共","患难中不离不弃"],["第二对","相敬如宾","互相尊重、和谐相处"],["第三对","最恩爱夫妻","生活细节中互相体贴"]],"bg":"在这个世界上，人与人之间会有各种各样的关系，比如同学关系、同事关系、邻居关系等，而人际关系中最亲密的一种关系，应该是夫妻关系了。无论是中国人还是外国人，都很重视自己的婚姻。有人认为夫妻之间最重要的是恩爱，有人说是诚实，也有人说是关爱和理解。相信你对课文中讲的三对夫妻的故事也会有自己的看法。","bg_vn":"Giữa người với người có nhiều mối quan hệ; thân thiết nhất có lẽ là quan hệ vợ chồng. Có người cho rằng quan trọng nhất là ân ái, có người nói là thành thật, có người nói là quan tâm và thấu hiểu.","discuss":["本文提到的三对夫妻中，哪对夫妻给你留下的印象最深？","这对夫妻的什么地方让你感动？为什么？","你认为理想的夫妻关系应该是什么样的？"],"write":"请以“理想的夫妻关系”为题写一段话。尽量用上本课所学的生词，字数不少于100字。"},"APPLY":{"topic":"如果可以和历史人物聊天，你选谁？","topic_vn":"Nếu có thể trò chuyện với một nhân vật lịch sử, bạn chọn ai?","intro":"Dạng đề mở HSK5 · Một dàn ý 4 bước dùng cho cả bài nói (1–2 phút) và bài viết (80–150 chữ).","analyse":{"title":"开放性主观题：没有标准答案，只有好结构","lead":"Đề không kiểm tra kiến thức lịch sử, mà xem bạn có <b>nêu được lựa chọn<\/b>, <b>lý giải có logic<\/b> và <b>liên hệ bản thân<\/b> bằng từ ngữ HSK5 hay không.","parts":[["如果可以……","Câu giả định → trả lời bằng 如果有机会……，我会……"],["和历史人物聊天","Phải là nhân vật lịch sử có thật; nói được ông/bà ấy là ai."],["你选谁？","Nói ngay tên người được chọn ở câu đầu tiên."],["(ẩn) 为什么？想聊什么？","Đề không viết ra nhưng giám khảo chờ: lý do + câu muốn hỏi + điều học được."]],"traps":[["Kể tiểu sử dài","Năm sinh, quê quán, từng chức vụ… → mất thời gian, lạc trọng tâm."],["Khen chung chung","很有名、很厉害、很伟大 → không có lý do cụ thể."],["Thiếu câu “muốn hỏi gì”","Đề là “聊天” — phải có câu hỏi định đặt cho nhân vật."],["Không liên hệ bản thân","Thiếu phần 升华 (nâng ý) nên bài nhạt."]],"link":"<b>Liên hệ bài 1 · 爱的细节:<\/b> bài khóa thắng được người đọc nhờ <b>một chi tiết<\/b> (người chồng đuổi muỗi nửa đêm). Bài nói về nhân vật lịch sử cũng vậy: kể <b>một chi tiết cụ thể<\/b> về người đó có sức thuyết phục hơn mười câu khen."},"steps":[["①","点明人物","Nói ngay chọn ai. Một câu, không vòng vo.","如果有机会和历史人物聊天，我会选择……"],["②","简单介绍 + 一个细节","Thân phận + một chi tiết/trải nghiệm tiêu biểu, 1–2 câu.","他是……，相传他……"],["③","佩服什么 · 理由","Hai lý do: một về phẩm chất, một về tài năng/việc làm.","我选他主要有两个原因：一是……；二是……"],["④","请教 · 收获","Muốn hỏi gì + học được gì — phần ăn điểm.","我想向他请教……，这让我明白了……"]],"formula":["选谁","人物闪光点 + 一个细节","我想请教什么","对我的启发"],"choices_title":"Chọn nhân vật: 6 gợi ý an toàn","choices_key":"闪光点：","choices":[["孔子","Khổng Tử","思想家、教育家；“三人行，必有我师”","重视品德、坚持学习"],["李白","Lý Bạch","唐代诗人，“诗仙”","热爱自由、勇敢追求理想"],["杜甫","Đỗ Phủ","唐代诗人，“诗圣”","关心百姓、热爱国家"],["苏轼","Tô Thức","宋代文学家，多次被贬","乐观豁达、热爱生活"],["岳飞","Nhạc Phi","宋代将军","勇敢、热爱国家"],["屈原","Khuất Nguyên","古代诗人，与端午节有关","热爱祖国、坚持理想"]],"notes":[["Nên chọn ai?","Nhân vật quen thuộc: 孔子、李白、杜甫、苏轼、岳飞、屈原 — có sẵn từ vựng, ít sai."],["Tự kiểm tra 3 câu","Nói được: người đó là ai · phẩm chất gì · mình muốn hỏi gì. Thiếu một câu → đổi người."],["Nói khác viết","Nói: câu tự nhiên, nhiều từ nối. Viết: câu ngắn, từ trang trọng (佩服、坚强), đúng chữ, đúng dấu câu."]],"rule":"<b>Nguyên tắc HSK5:<\/b> dùng chắc từ HSK4–5. Thành ngữ khó (才华横溢、精忠报国…) chỉ để <b>cộng điểm<\/b>, mỗi bài một cái là đủ — và phải viết đúng. Chi tiết truyền thuyết nên mở đầu bằng <b>相传<\/b> (tương truyền).","patterns":[["① 点明人物","如果有机会和历史人物聊天，我会选择____。","Nếu có cơ hội trò chuyện với nhân vật lịch sử, tôi sẽ chọn…"],["② 简单介绍","他是……，一生……，但是一直……。","Ông là…, cả đời…, nhưng luôn…"],["② 一个细节","相传他……，这个小故事让我印象很深。","Tương truyền ông…, câu chuyện nhỏ này làm tôi ấn tượng sâu sắc."],["③ 写出理由","我选他主要有两个原因：一是……；二是……。","Tôi chọn ông vì hai lý do: một là…; hai là…"],["③ 表佩服","让我最佩服的是，他……。","Điều khiến tôi khâm phục nhất là ông…"],["④ 请教","如果有机会，我想向他请教……。","Nếu có cơ hội, tôi muốn thỉnh giáo ông…"],["④ 收获","这让我明白了……，也鼓励我……。","Điều đó giúp tôi hiểu…, cũng khích lệ tôi…"]],"links":[["说理由 · Nêu lý do",["我选他主要有两个原因……","首先……；其次……；另外……"]],["表佩服 · Khâm phục",["让我最佩服的是……","我很欣赏他……的性格。"]],["想请教 · Muốn hỏi",["我想当面问问他……","如果有机会，我想向他请教……"]],["谈收获 · Bài học",["这让我明白了……","他的精神一直鼓励着我……"]]],"open":[["直接式","如果有机会和历史人物聊天，我会选择苏轼。"],["提问式","如果真的能回到古代，你想见谁？我的答案是李白。"],["引用式","一提到“诗仙”，大家都会想到李白。"]],"close":[["学习式","我要学习他的精神，让自己不断进步。"],["联系式","在学汉语的路上，我也会像他一样不放弃。"],["总结式","很多人记住了他的才华，而真正打动我的，却是他乐观的心态。"]],"from_text":[["几年如一日地 + V","他几十年如一日地坚持写作，从不放弃。","Lấy từ 好句 ①: tả sự bền bỉ của nhân vật."],["在……的……下","在母亲的教育下，他从小就热爱自己的国家。","Lấy từ 好句 ②: nêu ảnh hưởng, điều kiện."],["为了……，居然……","为了坚持自己的理想，他居然放弃了做官的机会。","Lấy từ 好句 ③: kể một chi tiết bất ngờ."],["不 A，而是 B","他遇到挫折时不抱怨，而是想办法让生活变得更好。","Lấy từ 好句 ④: nêu phẩm chất."],["而真正的……却……","很多人佩服他的才华，而真正打动我的，却是他的善良。","Lấy từ 好句 ⑤: câu kết gây ấn tượng."]],"vocab":[["乐观","lèguān","lạc quan","保持乐观的心态","core"],["坚强","jiānqiáng","kiên cường","面对困难很坚强","core"],["勇敢","yǒnggǎn","dũng cảm","勇敢地追求理想","core"],["谦虚","qiānxū","khiêm tốn","对人很谦虚","core"],["宽容","kuānróng","khoan dung","对待别人很宽容","core"],["热爱","rè'ài","yêu tha thiết","热爱生活，热爱国家","core"],["关心","guānxīn","quan tâm","关心普通百姓","core"],["坚持","jiānchí","kiên trì","坚持自己的理想","core"],["佩服","pèifú","khâm phục","我最佩服他的勇气","write"],["挫折","cuòzhé","trắc trở, thất bại","一生遇到很多挫折","write"],["理想","lǐxiǎng","lý tưởng","追求自己的理想","write"],["品德","pǐndé","phẩm đức","重视品德","write"],["贡献","gòngxiàn","cống hiến","为国家做出贡献","write"],["请教","qǐngjiào","thỉnh giáo, hỏi ý","向他请教问题","write"],["艰难","jiānnán","gian nan","生活过得很艰难","write"],["相传","xiāngchuán","tương truyền","相传他发明了东坡肉","write"],["鼓励","gǔlì","khích lệ","他的精神鼓励我","lesson"],["细节","xìjié","chi tiết","一个小细节","lesson"],["居然","jūrán","thế mà, không ngờ","他居然放弃了做官的机会","lesson"],["抱怨","bàoyuàn","phàn nàn","遇到挫折从不抱怨","lesson"],["才华横溢","cáihuá-héngyì","tài hoa xuất chúng","李白才华横溢","bonus"],["乐观豁达","lèguān huòdá","lạc quan, phóng khoáng","苏轼乐观豁达","bonus"],["忧国忧民","yōuguó-yōumín","lo cho nước, cho dân","杜甫忧国忧民","bonus"],["精忠报国","jīngzhōng-bàoguó","tận trung báo quốc","岳飞精忠报国","bonus"]],"vgroups":[["core","Phẩm chất HSK4–5"],["write","Từ viết HSK5"],["lesson","Từ bài 1"],["bonus","加分 · thành ngữ"]],"samples":{"speak":[{"who":"苏轼","meta":"Tô Thức · bài nói ~1 phút 30","p":["如果有机会和历史人物聊天，我会选择苏轼。","他是宋代著名的文学家，一生遇到很多挫折，多次被贬到很远的地方。相传他在生活最艰难的时候，还自己研究做菜，有名的“东坡肉”就和他有关。","我选他主要有两个原因：一是他面对困难从不抱怨，非常坚强；二是他热爱生活，关心普通百姓。","我想向他请教，遇到挫折时怎样调整自己的心情。这让我明白了，心态比环境更重要。"],"vi":"Nếu có cơ hội trò chuyện với nhân vật lịch sử, tôi sẽ chọn Tô Thức. Ông là nhà văn nổi tiếng đời Tống, cả đời gặp nhiều trắc trở, nhiều lần bị đày đi xa. Tương truyền lúc khó khăn nhất ông vẫn tự nghiên cứu nấu ăn, món “thịt Đông Pha” nổi tiếng có liên quan đến ông. Tôi chọn ông vì hai lý do: một là ông không bao giờ phàn nàn trước khó khăn, rất kiên cường; hai là ông yêu cuộc sống, quan tâm dân thường. Tôi muốn hỏi ông khi gặp thất bại thì điều chỉnh tâm trạng thế nào. Điều đó giúp tôi hiểu: tâm thế quan trọng hơn hoàn cảnh."},{"who":"李白","meta":"Lý Bạch · bài nói ~1 phút 30","p":["如果真的能回到古代，你想见谁？我的答案是唐代诗人李白。","李白性格开朗，热爱自由，写下了很多流传至今的诗歌，人们叫他“诗仙”。相传他小时候不爱学习，看到一位老奶奶把铁棒磨成针，才明白了坚持的意义。","我选他主要有两个原因：一是他勇敢地追求理想，不为了钱和地位改变自己；二是他的诗想象丰富，读起来让人很开心。","我想问问他：理想很难实现的时候，怎样坚持下去？他的故事也鼓励我，学汉语遇到困难时不要轻易放弃。"],"vi":"Nếu thật sự có thể quay về thời cổ đại, bạn muốn gặp ai? Câu trả lời của tôi là nhà thơ đời Đường Lý Bạch. Ông tính cách cởi mở, yêu tự do, để lại nhiều bài thơ lưu truyền đến nay, được gọi là “Thi tiên”. Tương truyền hồi nhỏ ông không thích học, thấy một bà cụ mài thanh sắt thành kim mới hiểu ý nghĩa của kiên trì. Tôi chọn ông vì: một là ông dũng cảm theo đuổi lý tưởng, không vì tiền và địa vị mà thay đổi; hai là thơ ông giàu tưởng tượng. Tôi muốn hỏi ông: khi lý tưởng khó thành, làm sao kiên trì? Câu chuyện của ông khích lệ tôi không dễ bỏ cuộc khi học tiếng Trung."}],"write":[{"who":"范文 1 · 苏轼","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我想和苏轼聊天","p":["如果有机会和历史上的一个人物聊天，我会选择苏轼。","他是宋代著名的文学家，一生中遇到很多挫折，多次被贬到很远的地方。","我最佩服他就算生活很辛苦，也仍然保持乐观的心态。","我想问问他怎样调整自己的心情，学习他坚强的精神。"],"vi":"Chú ý mẫu câu 就算……也仍然…… (cho dù… vẫn…) — rất đáng học thuộc."},{"who":"范文 2 · 孔子","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我想和孔子聊天","p":["如果有机会和历史上的一个人物聊天，我会选择孔子。","他是古代著名的思想家和教育家，一辈子都在教育别人。","我最佩服他重视品德，一直坚持学习，对待别人很宽容。","我想向他请教怎样做一个品德好的人，这会鼓励我不断进步。"],"vi":"Câu cuối có liên hệ bản thân (这会鼓励我……) — phần “nâng ý” giúp ăn điểm."},{"who":"范文 3 · 苏轼","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我想和苏轼聊天","p":["如果有机会和历史人物聊天，我会选择宋代的文学家苏轼。","他一生遇到过很多挫折，几次被贬到很远的地方。可是他不但没有抱怨，反而自己种地、做饭，相传有名的“东坡肉”就和他有关。","我最佩服他的乐观。在那么艰难的环境下，他居然还能发现生活中的美好。","我想向他请教：遇到挫折时，怎样才能不放弃？很多人记住了他的才华，而真正打动我的，却是他的心态。我也要像他一样，乐观地面对学习中的困难。"],"good":["在那么艰难的环境下","居然还能发现生活中的美好","而真正打动我的，却是他的心态"],"vi":"Ba chỗ in đậm dùng lại khung câu của bài khóa: 在……下 · 居然 · 而真正的……却……. Cặp 不但没有……反而…… (không những không… mà ngược lại…) cũng rất đáng học."}]},"legend":["① Chọn ai","② Giới thiệu + chi tiết","③ Khâm phục / lý do","④ Thỉnh giáo · bài học"],"step_names":["① 点明人物","② 简单介绍 + 细节","③ 佩服 · 理由","④ 请教 · 收获"],"timer":[["① 10s",10],["② 20s",20],["③ 35s",35],["④ 25s",25]],"build_title":"选一个人物，拼出你的回答","build_lead":"Chọn nhân vật, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","var_title":"同一个模板，换一个开头","var_lead":"Bước ②③④ giữ nguyên — chỉ cần đổi câu ①. Bấm để xem câu mở đầu gợi ý.","w5":["佩服","乐观","挫折","坚持","理想","品德","坚强","贡献","请教","鼓励","勇敢","宽容","谦虚","热爱","关心","艰难","抱怨","居然","细节","相传"],"build":{"苏轼":[["如果有机会和历史人物聊天，我会选择苏轼。","如果真的能回到古代，我最想见到苏轼。"],["他是宋代著名的文学家，一生遇到很多挫折，但是一直很乐观。","相传他在生活最艰难的时候还自己做菜，“东坡肉”就和他有关。"],["我选他主要有两个原因：一是他非常坚强，有一次被贬到很远的地方，他还是笑着生活；二是他关心普通百姓，这一点让我非常佩服。","让我最佩服的是，就算生活很艰难，他也仍然保持乐观的心态。"],["我想向他请教，遇到挫折时怎样调整心情。这让我明白了，心态比环境更重要。","我想问问他怎样面对困难，学习他乐观坚强的精神。"]],"李白":[["如果有机会和历史人物聊天，我会选择李白。","一提到“诗仙”，大家都会想到李白，我也想和他聊一聊。"],["他是唐代伟大的诗人，性格开朗，热爱自由。","相传他小时候看到老奶奶把铁棒磨成针，才明白了坚持的意义。"],["我选他主要有两个原因：一是他勇敢地追求理想；二是他的诗想象丰富。","让我最佩服的是，他从不为了钱和地位改变自己。"],["我想问问他，理想很难实现的时候怎样坚持下去。","他的故事鼓励我，学汉语遇到困难时不要轻易放弃。"]],"孔子":[["如果有机会和历史人物聊天，我会选择孔子。","如果真的能回到古代，我最想见到孔子。"],["他是古代著名的思想家和教育家。","他说过“三人行，必有我师”，一辈子都在向别人学习。"],["我选他主要有两个原因：一是他重视品德；二是他一直坚持学习。","让我最佩服的是，他对待别人很宽容，也很谦虚。"],["我想向他请教，怎样做一个品德好的人。","我要学习他不断学习的态度，让自己不断进步。"]],"杜甫":[["如果有机会和历史人物聊天，我会选择杜甫。","我最想聊天的历史人物是唐代诗人杜甫。"],["他是唐代伟大的诗人，生活过得很艰难。","他自己住的房子很破，却希望天下的穷人都能有温暖的家。"],["我选他主要有两个原因：一是他同情普通人；二是他热爱自己的国家。","让我最佩服的是，他在困难中还一直关心别人。"],["我想听听他对生活的看法，学习他关心别人的品德。","这让我明白了，不管自己过得怎么样，都应该关心身边的人。"]],"岳飞":[["如果有机会和历史人物聊天，我会选择岳飞。","我最想聊天的历史人物是宋代将军岳飞。"],["他是宋代著名的将军，一生都在保卫国家。","相传他母亲在他背上刺了四个字，让他永远记住要报效国家。"],["我选他主要有两个原因：一是他非常勇敢；二是他热爱自己的国家。","让我最佩服的是，他遇到再大的困难，也坚持自己的信念。"],["我想向他请教，是什么让他一直坚持下去。","他的精神鼓励我，做事情要有责任心，不能轻易放弃。"]],"屈原":[["如果有机会和历史人物聊天，我会选择屈原。","一提到端午节，大家都会想到屈原。"],["他是古代著名的诗人，端午节就和他有关。","他一生热爱自己的国家，却常常被别人误会。"],["我选他主要有两个原因：一是他热爱祖国；二是他坚持自己的理想。","让我最佩服的是，被别人误会的时候，他也坚持做对的事。"],["我想问问他，被别人误会时，怎样还能坚持自己。","这让我明白了，做正确的事比别人的看法更重要。"]]},"quiz":[["Câu nào trả lời tốt hơn?",["我选李白，因为他诗写得好，他很有名，很厉害。","我选李白。我佩服他勇敢地追求理想，也喜欢他想象丰富的诗。我想向他请教怎样坚持理想。"],1,"Câu 2 có phẩm chất + tài năng + câu muốn hỏi. Câu 1 chỉ có lý do chung chung “很有名、很厉害”."],["Ở HSK5, câu nào nên viết?",["苏轼在宦海沉浮中虽屡遭贬谪却始终以超然物外之心境面对人生。","苏轼多次被贬，但是一直很乐观。"],1,"Câu đơn giản viết đúng được điểm cao hơn câu hoa mỹ dễ sai."],["Bước ② (giới thiệu) nên viết thế nào?",["他是宋代著名的文学家，一生遇到很多挫折。","苏轼1037年出生，小时候……二十岁……三十岁……后来……"],0,"Bước ② chỉ cần thân phận + một trải nghiệm chính, 1–2 câu."],["Câu kết nào tốt hơn?",["这就是我想和他聊天的原因。","在学汉语的路上，我也会像他一样不放弃。"],1,"Câu kết nên liên hệ bản thân — đó là phần “升华” ăn điểm."],["Chi tiết truyền thuyết nên viết thế nào?",["李白小时候真的看到老奶奶把铁棒磨成了针。","相传李白小时候看到老奶奶把铁棒磨成针。"],1,"Chuyện dân gian, chưa chắc có thật → mở đầu bằng 相传."],["Câu mở bài nào phù hợp nhất khi thi?",["我想说一下历史，历史有很多人，我觉得……","如果有机会和历史人物聊天，我会选择孔子。"],1,"Mở bài trực tiếp, nói ngay chọn ai."]],"fix":[["我最佩服他很勇敢的。","我最佩服他的勇敢。／我最佩服他很勇敢。","佩服 + danh từ/cụm chủ-vị; không thêm 的 ở cuối."],["如果有机会，我想请教他问题。","如果有机会，我想向他请教问题。","Cấu trúc đúng: 向 + người + 请教 + vấn đề."],["他对普通百姓很关心他们。","他很关心普通百姓。／他对普通百姓很关心。","Đã có 对 + đối tượng thì không lặp tân ngữ sau 关心."],["我想和他聊天关于诗歌。","我想和他聊聊关于诗歌的话题。／我想和他聊聊诗歌。","关于…… làm định ngữ hoặc đặt đầu câu, không đặt sau động từ."],["在老师的帮助，我进步了很多。","在老师的帮助下，我进步了很多。","Khung 在……下 (好句 bài khóa) không được thiếu 下."],["他一生被贬到很远地方。","他一生多次被贬到很远的地方。","Tính từ hai âm tiết + danh từ cần 的: 很远的地方."]],"tpl":"如果有机会和历史上的一个人物聊天，我会选择【人物】。他是【身份】，【一个细节】。我最佩服他【品格】。我想向他请教【问题】，学习他【精神】。","chk":[["start","Có câu mở bài nói rõ chọn ai (选择 / 选)","选择|我会选|我选"],["intro","Có giới thiệu thân phận (他是…… / 她是……)","他是|她是"],["detail","Có một chi tiết cụ thể (相传 / 有一次 / 小时候)","相传|有一次|小时候|曾经|那时"],["admire","Có nói điều khâm phục (佩服 / 欣赏 / 敬佩)","佩服|欣赏|敬佩"],["ask","Có câu muốn hỏi / thỉnh giáo (问问 / 请教)","问问|请教|想问|听听"],["learn","Có bài học cho bản thân (学习 / 明白 / 鼓励)","学习他|明白|鼓励|让我"]],"wmin":80,"wmax":150,"traps3":"<b>3 lỗi hay bị trừ điểm:<\/b> (1) chỉ khen, không có câu “muốn hỏi gì”; (2) câu quá dài, từ quá khó rồi viết sai; (3) kể chuyện quá nhiều, không liên hệ bản thân. Ở HSK5, <b>câu đơn giản viết đúng<\/b> được điểm cao hơn câu hoa mỹ viết sai.","variants":[["你最敬佩的人是谁？为什么？","我最敬佩的人是……"],["如果可以和一位名人吃饭，你选谁？","如果可以和名人吃饭，我想请……"],["如果可以回到古代，你想见谁？","如果能回到古代，我最想见到……"],["对你影响最大的人是谁？","对我影响最大的人是……"],["你想成为什么样的人？","我想成为像……一样的人。"],["介绍一位你们国家的历史人物。","在我们国家，……是一位非常有名的历史人物。"]],"homework":"<b>Bài về nhà:<\/b> chọn một nhân vật (khác bài mẫu) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 80–100 chữ · dùng ít nhất 3 từ HSK5, <b>một chi tiết cụ thể<\/b> và một câu liên hệ bản thân · thử dùng một khung câu 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
