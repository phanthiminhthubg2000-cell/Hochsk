<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 12 · 海外用户玩儿微信 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

_____。（以及）","Gợi ý: hiểu văn hóa, kết bạn và tìm việc tốt.","学中文可以了解中国文化、交中国朋友以及找到更好的工作"],["妈妈在电话里问了我很多问题，如北京的天气怎么样，吃饭习惯不习惯，____________。（以及）","Gợi ý: và cuộc sống có khó khăn gì không.","以及生活上有没有什么困难"],["A：送人礼物的时候要注意些什么？<br>B：____________。（以及）","Gợi ý: sở thích, thói quen của người nhận và giá quà.","要注意对方的爱好、习惯以及礼物的价格"]],"drill":[["“以及”放在哪里？ 本店销售<u>A<\/u>电视、<u>B<\/u>冰箱、<u>C<\/u>洗衣机<u>D<\/u>其他电器。",["A","C","D"],2,"Trước thành phần cuối (课本练习3)."],["Câu nào đúng?",["老师、家长以及学生都参加了这次活动。","以及老师、家长、学生都参加了这次活动。","老师以及、家长、学生都参加了这次活动。"],0,"A、B 以及 C."],["“以及”和哪个词意思最接近？",["和","但是","或者"],0,"以及 ≈ 和 (văn viết)."]]},{"word":"程度","py":"chéngdù","pos":"名词","forms":["……程度（水平或层次）：成熟程度、文化程度","发展到……的程度","在很大／一定程度上"],"vn":"<b>程度<\/b> là danh từ: <b>mức độ, trình độ<\/b> — mức mà một phương diện nào đó đạt tới. Cấu trúc hay dùng: <b>发展到……的程度<\/b> (đến mức…), <b>在很大程度上 / 在一定程度上<\/b> (ở mức độ lớn / nhất định), <b>文化程度<\/b> (trình độ học vấn).","text":"由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位……","ex":[["问题已经发展到了十分严重的程度。","Vấn đề đã phát triển đến mức hết sức nghiêm trọng."],["在很大程度上，一个人的未来取决于他所受的教育。","Ở mức độ lớn, tương lai một người phụ thuộc vào nền giáo dục người đó nhận được."],["他的汉语已经达到了可以当翻译的程度。","Tiếng Trung của anh ấy đã đạt đến mức có thể làm phiên dịch."]],"err":[["❌ 他的汉语程度很高。（可以说，但更常说）","✅ 他的汉语水平很高。","Nói năng lực ngôn ngữ thường dùng 水平; 程度 hay dùng với 文化程度, 严重程度."],["❌ 在很大程度，他是对的。","✅ 在很大程度上，他是对的。","Cấu trúc cố định: 在……程度上."]],"book":[["____________，你应该马上去看医生。（程度）","Gợi ý: bệnh đã đến mức nghiêm trọng.","你的病已经发展到很严重的程度了，你应该马上去看医生"],["A：____________。（程度）<br>B：我还不能完全理解。","Gợi ý: hỏi hiểu đến mức nào rồi.","这篇文章你理解到什么程度了"],["A：对他提出的意见，你有什么看法？<br>B：____________。（程度）","Gợi ý: ở mức độ nhất định là đúng.","在一定程度上，他的意见是对的"]],"drill":[["选择：问题已经发展到了十分严重的____。",["程度","水平","程序"],0,"发展到……的程度."],["Câu nào đúng?",["在很大程度上，成功取决于努力。","在很大程度，成功取决于努力。","在程度很大上，成功取决于努力。"],0,"在很大程度上."],["“文化程度”的意思是：",["受教育的水平","文化的历史","文化活动"],0,"Trình độ học vấn."]]}],"HSK":{"r1":[{"text":["奶奶七十岁了，最近孙子教她用微信。学会以后，奶奶特别高兴，{36}。有一天，孙子正在上课，手机响个不停，打开一看，全是奶奶发来的消息：“你吃饭了吗？”“天冷了，多穿点儿衣服。”孙子下课后给奶奶打电话：“奶奶，{37}？”奶奶笑着说：“{38}，我想你了，就多发了几条。”"],"qs":[{"n":36,"o":["每天都要用它给家人发消息","马上把手机送人了","再也不用手机了","觉得微信太难了"],"a":0,"why":"后文奶奶发了很多消息，说明她很喜欢用微信。"},{"n":37,"o":["您吃饭了吗","您怎么发了这么多消息","您在哪儿","您明天来吗"],"a":1,"why":"孙子看到“全是奶奶发来的消息”，所以问为什么发这么多。"},{"n":38,"o":["发消息又不要钱","手机坏了","我不认识字","我在上课"],"a":0,"why":"微信发消息免费，奶奶用这个理由，同时表达想念，前后连贯。"}]},{"text":["近几年，移动支付在中国发展得非常快。去超市买东西、坐公交车，甚至在路边买一个包子，{39}。很多人出门只带一部手机，{40}。移动支付不仅给人们的生活带来了方便，{41}。不过，专家也提醒大家，使用移动支付时要注意保护个人信息，{42}。"],"qs":[{"n":39,"o":["都必须用现金","都可以用手机付钱","都要排很长的队","都不能用手机"],"a":1,"why":"全段讲移动支付，说明这些地方都能用手机付钱。"},{"n":40,"o":["钱包都不用带了","所以很不方便","手机经常没电","都要带很多现金"],"a":0,"why":"只带手机，说明钱包不用带了。"},{"n":41,"o":["也让人们更容易丢钱","也推动了很多相关业务的发展","但是没有人用","所以大家不喜欢"],"a":1,"why":"“不仅……也……”，两方面都是积极影响。"},{"n":42,"o":["不要随便点击陌生的链接","多带现金","不要买东西","把手机借给别人"],"a":0,"why":"保护个人信息，要注意不点陌生的链接。"}]}],"r2":[{"start":46,"paras":["后来有人想出了一个办法：在街上放很多自行车，大家用手机扫一下码就能骑走。","在大城市里，从地铁站到家或者公司往往还有一两公里的路，走路太远，打车又太贵。","这就是“共享单车”。骑到目的地以后，把车停在路边，再用手机付钱就可以了。","因为又方便又便宜，共享单车很快就受到了年轻人的欢迎。","不过，也有人不按规定停车，影响了交通，这个问题还需要大家一起来解决。"],"ans":["B","A","C","D","E"],"why":"问题（B）→ 想出的办法（A）→ 共享单车的用法（C）→ 受欢迎（D）→ 新的问题（E）。"}],"r3":[{"text":["走在大街上、坐在地铁里，你会发现很多人都低着头看手机。人们给这些人起了一个名字，叫“低头族”。","手机让我们可以随时随地上网、聊天、看新闻，给生活带来了很大的方便。可是，长时间低头看手机，不仅会导致脖子疼、眼睛累，还会影响人与人之间的交流。有调查显示，很多家庭吃饭的时候，大家都在看各自的手机，<u><b>一家人坐在一起，却好像离得很远<\/b><\/u>。","更危险的是，有些人连走路、过马路的时候也在看手机，很容易发生交通事故。","专家建议，大家应该有意识地控制使用手机的时间，比如吃饭时把手机放在一边，睡前一个小时不看手机。毕竟，手机只是工具，身边的人才是最重要的。"],"qs":[{"n":56,"s":"“低头族”指的是：","o":["个子矮的人","经常低头看手机的人","喜欢看书的人","在地铁工作的人"],"a":1,"why":"第一段：很多人都低着头看手机，叫“低头族”。"},{"n":57,"s":"长时间低头看手机会怎么样？","o":["让人更健康","导致脖子疼、眼睛累，影响交流","让家人关系更好","提高学习成绩"],"a":1,"why":"第二段：会导致脖子疼、眼睛累，还会影响人与人之间的交流。"},{"n":58,"s":"画线句子的意思是：","o":["家里的房子很大","一家人在一起却很少交流","家人住得很远","大家都不在家吃饭"],"a":1,"why":"坐在一起都看手机，感情上好像离得很远。"},{"n":59,"s":"专家的建议是：","o":["不要用手机","买更好的手机","有意识地控制使用手机的时间","只在路上看手机"],"a":2,"why":"最后一段：有意识地控制使用手机的时间。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于1 \"#fff\" stroke=\"#ddd\"/><ellipse cx=\"-2\" cy=\"-16\" rx=\"9\" ry=\"3\" fill=\"#c0553f\"/><\/g><\/g><g transform=\"translate(300.0,226.0) scale(0.9,0.9)\"><rect x=\"-16\" y=\"-24\" width=\"8\" height=\"14\" rx=\"1.5\" fill=\"#333\" transform=\"rotate(-10 -12 -16)\"/><rect x=\"-7\" y=\"-24\" width=\"8\" height=\"14\" rx=\"1.5\" fill=\"#333\" transform=\"rotate(-2 -3 -16)\"/><rect x=\"2\" y=\"-24\" width=\"8\" height=\"14\" rx=\"1.5\" fill=\"#333\" transform=\"rotate(6 6 -16)\"/><path d=\"M-22 -14 h44 l-6 18 h-32z\" fill=\"#d6a85f\" stroke=\"#b3843f\"/><path d=\"M-16 -14 q16 -28 32 0\" stroke=\"#b3843f\" stroke-width=\"3\" fill=\"none\"/><path d=\"M-18 -6 h36 M-16 0 h32\" stroke=\"#b3843f\"/><\/g><g transform=\"translate(160.0,40.0)\"><g transform=\"translate(0.0,0.0) scale(0.7,0.7)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: ai cũng nhìn điện thoại → bà buồn → bà nghĩ ra cách → cả nhà vui vẻ trò chuyện.","Có thể dùng: 低头、交流、针对、收效相当不错、拉近距离."],"sample":"以前，我们家吃晚饭的时候，爸爸看新闻，妈妈刷朋友圈，我在玩游戏，大家都低着头看手机，谁也不说话。奶奶做了一桌子菜，看着我们，心里很难过。第二天，奶奶在饭桌旁边放了一个篮子，笑着说：“吃饭的时候，请把手机放进来。”刚开始，大家都有点儿不习惯，可是慢慢地，我们开始聊学校里的事、工作上的事，饭桌上又有了笑声。奶奶的这个办法收效相当不错，它拉近了我们一家人的距离。","svn":"Trước đây bữa tối ai cũng nhìn điện thoại, bà nấu cả bàn mà buồn; hôm sau bà đặt cái giỏ, bảo mọi người bỏ điện thoại vào khi ăn; dần dần cả nhà trò chuyện, tiếng cười trở lại."},"w72":{"prompt":"有人说，网络和手机拉近了人与人之间的距离；也有人说，网络和手机让人与人之间的距离越来越远。请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói mạng và điện thoại kéo gần khoảng cách giữa người với người; có người nói chúng làm khoảng cách ngày càng xa. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"远方的人近了，身边的人呢？","tips":["Nêu quan điểm hai mặt → kéo gần người ở xa (ví dụ WeChat gọi video) → làm xa người bên cạnh (低头族) → nguyên nhân là cách dùng → giải pháp → kết luận.","Dùng khung 好句: 如今，……已经……，是……最……的…… · 清楚地认识到了这样的现实 · 针对……，收效相当不错."],"sample":"如今，网络和手机已经成了人们生活中最离不开的东西。有人说它们拉近了人与人的距离，也有人说它们让人越来越远。我认为，这两种说法都有道理。\n一方面，网络拉近了远方的人。我在中国留学，每天晚上都能用微信跟爸爸妈妈视频聊天，虽然离得很远，却好像就在身边。\n另一方面，手机也让身边的人变远了。很多家庭吃饭的时候，大家都在低头看手机，谁也不说话。\n其实，问题不在手机，而在于我们怎么使用它。针对这个问题，我们家规定吃饭时不看手机，收效相当不错。\n总之，只要合理使用，网络和手机就能让远方的人更近，也不会让身边的人更远。","svn":"Bài nghị luận hai mặt: 一方面 kéo gần người ở xa (WeChat) → 另一方面 làm xa người bên cạnh → vấn đề ở cách dùng + giải pháp → 总之 dùng hợp lý."}},"PRACTICE":{"ex1":{"bank":["逗","合作","推广","业务","召开","注册"],"items":[["为了{}这项新产品，公司做了很多宣传。",["推广"]],["原本定在周三上午{}的会议改时间了。",["召开"]],["你做这么多事，难道只是为了{}女朋友开心？",["逗"]],["要想在这个网站购物，你必须先{}一个它的邮箱。",["注册"]],["那个新来的销售员这个月做成了三笔大{}，真厉害！",["业务"]],["我们跟这家公司{}过两次，很愉快。",["合作"]]]},"ex2":[["像这样能够给全社会信心与快乐的事情，我们应该重点____。",["宣传","推广"],0],["要吃中国菜，你首先要学会____筷子。",["应用","使用"],1],["过了这么多年，我的愿望终于____了！",["现实","实现"],1],["这是我的____爱好，跟我学什么专业没有关系。",["个人","自己"],0]],"ex3":[["这个问题<u>A<\/u>是在什么样的背景<u>B<\/u>提<u>C<\/u>出<u>D<\/u>来的？","下",1,"这个问题是在什么样的背景下提出来的？"],["公司<u>A<\/u>新<u>B<\/u>开发<u>C<\/u>的产品很受<u>D<\/u>消费者欢迎。","出",2,"公司新开发出的产品很受消费者欢迎。"],["本店销售<u>A<\/u>电视、<u>B<\/u>冰箱、<u>C<\/u>洗衣机<u>D<\/u>其他电器。","以及",3,"本店销售电视、冰箱、洗衣机以及其他电器。"],["<u>A<\/u>这个问题，<u>B<\/u>我们<u>C<\/u>开会讨论了<u>D<\/u>好几次。","针对",0,"针对这个问题，我们开会讨论了好几次。"]],"ex4":[["微信的广告","明星、逗、宣传","国际足球明星梅西用微信直播颠球，把一个正在哭的小宝贝逗笑了。这条宣传片在15个国家和地区同步上线。"],["微信的发展情况","总裁、召开、注册、实现、应用","在北京召开的大会上，腾讯总裁说，微信海外注册用户已经超过7000万。微信2011年上线，很快实现了全球100个国家的短信注册，如今是全球使用人数最多的移动通信应用。"],["微信的研发和营销","中心、以及、程度、针对、当地","2010年底，腾讯广州研发中心开始开发微信。当时中国互联网的用户数量以及市场成熟程度都低于发达国家，移动互联网是一个新机会。微信针对不同国家推出不同的广告，请当地明星代言。"]],"ext":{"title":"扩展 · 话题：电脑网络","words":[["键盘","jiànpán","bàn phím"],["鼠标","shǔbiāo","chuột"],["光盘","guāngpán","đĩa CD"],["信息","xìnxī","thông tin"],["硬件","yìngjiàn","phần cứng"],["软件","ruǎnjiàn","phần mềm"],["数码","shùmǎ","kỹ thuật số"],["数据","shùjù","dữ liệu"],["程序","chéngxù","chương trình"],["系统","xìtǒng","hệ thống"],["网络","wǎngluò","mạng"],["信号","xìnhào","tín hiệu"],["充电器","chōngdiànqì","sạc"]],"items":[["我忘带手机{}了，得节省着用，先关机吧。","充电器"],["汉字是一个整体的{}，字与字之间是有联系的。","系统"],["调查{}显示，用户们对微信的服务很满意。","数据"],["喂，您说什么？我听不清。这里{}不太好。","信号"]]}},"TEXT":[{"title":"梅西的广告","sub":"大手笔的推广","paras":["举着手机，边颠着球边拍……国际足球明星梅西用微信直播自己的颠球技术，把手机另一头一个正在哭的小宝贝逗笑。这条30秒的全新广告宣传片在全球15个国家和地区同步上线。","如此大手笔的推广，腾讯自有其底气所在。微信“在海外注册用户已经超过7000万，且在快速增长当中”。7月3日，在北京召开的2013腾讯合作伙伴大会上，腾讯总裁刘炽平言语间充满了骄傲。"],"idea":"Ngôi sao bóng đá <b>Messi<\/b> dùng WeChat livestream tâng bóng, chọc cười một em bé đang khóc ở đầu bên kia — quảng cáo 30 giây <b>ra mắt đồng thời ở 15 quốc gia, vùng lãnh thổ<\/b>. Tencent mạnh tay quảng bá vì có cơ sở: người dùng nước ngoài đã <b>vượt 70 triệu<\/b> và đang tăng nhanh.","qs":[["梅西在广告里做了什么？",["踢足球比赛","用微信直播颠球，把小宝贝逗笑","唱歌"],1],["这条广告在多少个国家和地区同步上线？",["5个","15个","50个"],1],["腾讯为什么敢这样大手笔地推广？",["海外注册用户已经超过7000万","梅西是腾讯的老板","广告很便宜"],0]]},{"title":"微信的发展","sub":"从上线到覆盖全球","paras":["2011年1月，微信上线；同年4月，以英文名WeChat正式进入国际市场；2011年12月，实现支持全球100个国家的短信注册；2012年底，覆盖国家和地区超过100个。如今，微信已经覆盖了200多个国家和地区、支持16种外语，是全球使用人数最多的移动通信应用。","在美国互联网企业“称霸”全球的背景下，作为中国自己的移动互联网产品，微信的出现，自然吸引了更多的关注。"],"idea":"Tháng 1/2011 WeChat ra mắt; tháng 4 cùng năm vào thị trường quốc tế; cuối 2012 phủ hơn 100 quốc gia. Nay phủ <b>hơn 200 quốc gia, vùng lãnh thổ<\/b>, hỗ trợ 16 ngoại ngữ. Trong bối cảnh doanh nghiệp Internet Mỹ <b>thống trị<\/b> toàn cầu, một sản phẩm của chính Trung Quốc tự nhiên thu hút nhiều chú ý.","qs":[["微信是什么时候上线的？",["2011年1月","2011年4月","2012年底"],0],["微信以什么名字进入国际市场？",["Weixin","WeChat","Tencent"],1],["为什么微信的出现吸引了更多的关注？",["它是中国自己的移动互联网产品","它是美国的产品","它很便宜"],0]]},{"title":"微信的研发","sub":"重新开始的机会","paras":["被称为“微信之父”的腾讯公司高级副总裁张小龙介绍了微信的发展过程：微信的研究开发工作开展得很早，2010年底，移动互联网刚起步，腾讯广州产品研发中心就开始考虑相关业务。他们清楚地认识到了这样的现实——在个人计算机时代，由于中国互联网的用户数量以及市场成熟程度等都低于发达国家，在产品创新上难有领导地位，而移动互联网是一个重新开始的机会。"],"idea":"“Cha đẻ WeChat” <b>Trương Tiểu Long<\/b> kể: từ cuối 2010, khi Internet di động vừa khởi bước, trung tâm R&D Quảng Châu đã bắt tay nghiên cứu. Họ nhận rõ: thời máy tính cá nhân, Trung Quốc thua các nước phát triển về số người dùng và độ trưởng thành của thị trường; <b>Internet di động là cơ hội bắt đầu lại<\/b>.","qs":[["谁被称为“微信之父”？",["刘炽平","张小龙","梅西"],1],["腾讯是什么时候开始考虑相关业务的？",["2010年底","2013年7月","2012年底"],0],["他们为什么认为移动互联网是一个机会？",["在个人计算机时代中国难有领导地位，移动互联网可以重新开始","移动互联网很便宜","发达国家不用手机"],0]]},{"title":"微信的营销","sub":"针对不同的国家和地区","paras":["在经营销售上，微信针对不同的国家和地区，推出了不同的广告片，邀请当地明星和名人代言，收效相当不错。海外用户群中不仅有华裔和新移民，还出现了更多的外国人。"],"idea":"Về kinh doanh, WeChat <b>nhắm vào từng quốc gia, khu vực<\/b> với các quảng cáo khác nhau, mời <b>ngôi sao, người nổi tiếng địa phương<\/b> làm đại diện — hiệu quả khá tốt. Người dùng nước ngoài không chỉ có người gốc Hoa, dân di cư mới mà còn ngày càng nhiều người nước ngoài.","qs":[["微信在海外是怎么做广告的？",["所有国家用同一个广告","针对不同的国家和地区推出不同的广告片","不做广告"],1],["微信邀请谁来代言？",["当地明星和名人","腾讯的员工","外国学生"],0],["现在微信的海外用户有哪些人？",["只有华裔","只有新移民","华裔、新移民和更多的外国人"],2]]}],"TEXT_EXTRA":{"compare_title":"微信的发展过程","compare_head":["时间","发展","Tiếng Việt"],"compare":[["2010年底","腾讯广州产品研发中心开始考虑相关业务","bắt đầu nghiên cứu"],["2011年1月","微信上线","ra mắt"],["2011年4月","以英文名WeChat进入国际市场","vào thị trường quốc tế"],["2011年12月","支持全球100个国家的短信注册","đăng ký SMS ở 100 nước"],["2012年底","覆盖国家和地区超过100个","phủ hơn 100 quốc gia"],["如今（课文）","覆盖200多个国家和地区、支持16种外语","hơn 200 quốc gia, 16 ngoại ngữ"]],"bg":"人类的科学技术总是在不断（búduàn）进步，并给我们的生活带来巨大（jùdà）的改变，使之变得更加轻松、方便。1946年，世界上第一台电子计算机问世（wènshì），随后，出现了网络技术，到今天，其应用已遍布社会生活的方方面面，全世界已大约有10亿网民，人们用手机就可以随时上网。手机的应用越来越广，许多人把它看作生活中的必备用品。不过，这些科技发明应用在给我们带来了许多方便的同时，也产生了一些我们不愿看到的现象：过度的应用造成经济上的浪费，时间的占用使我们忽略（hūlüè）了亲友间面对面的交往等等。","bg_vn":"Khoa học kỹ thuật không ngừng tiến bộ, làm cuộc sống thoải mái, tiện lợi hơn. Năm 1946 máy tính điện tử đầu tiên ra đời, rồi đến mạng internet; nay ai cũng lên mạng bằng điện thoại. Nhưng bên cạnh tiện lợi cũng có mặt trái: dùng quá mức gây lãng phí, chiếm thời gian khiến ta bỏ quên giao tiếp trực tiếp với người thân bạn bè.","discuss_title":"讨论话题：科技对生活的影响","discuss":["你是从什么时候开始使用××的？你觉得它在你的生活中重要吗？","××给你带来的好处是什么？","××对你的生活有什么不好的影响吗？"],"write":"请以“××（网络、手机等）改变我的生活”为题，谈一谈你对这个问题的看法。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“××（网络、手机等）改变我的生活”为题，谈一谈你对这个问题的看法","topic_vn":"Viết bài với đầu đề “×× (mạng, điện thoại…) thay đổi cuộc sống của tôi”, nêu quan điểm của bạn","intro":"Dạng đề “hai mặt” (利与弊) · Bắt đầu dùng từ khi nào → lợi ích → mặt trái → quan điểm và cách dùng hợp lý · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“××改变我的生活”：好处 + 问题 + 我的态度","lead":"Đề cho bạn <b>tự chọn ××<\/b> (mạng, điện thoại, WeChat, mua sắm trực tuyến…). Chữ <b>“我的生活”<\/b> nghĩa là phải nói về <b>chính bạn<\/b> với ví dụ thật. Câu hỏi thảo luận của sách gợi ý bố cục: <b>bắt đầu dùng khi nào → lợi ích → ảnh hưởng không tốt<\/b>. Bài tốt nhìn <b>cả hai mặt<\/b> rồi nêu thái độ.","parts":[["××","Chọn một thứ cụ thể: 手机、网络、微信、网上购物…; đừng viết chung chung “科技”."],["改变","Phải có “trước – sau”: 以前……，现在……"],["我的生活","Ví dụ thật của bạn: học tiếng Trung, liên lạc gia đình, mua sắm…"],["（课本）尽量用上本课生词，不少于100字","Dùng: 应用、实现、通信、移动、用户、注册、推广、以及、程度、针对… và 好句 của bài khóa."]],"traps":[["Chỉ nói lợi ích","Đề hỏi “看法” — nên có cả mặt trái (lãng phí thời gian, ít gặp mặt…)."],["Không có “我”","Viết như bài báo về xã hội → thiếu ví dụ cá nhân."],["Kết luận cực đoan","“手机应该被禁止” → thiếu thuyết phục; nên nói “合理使用”."],["Lặp từ 方便","Thay bằng: 节省时间、随时随地、实现了……、拉近了距离."]],"link":"<b>Liên hệ bài 12:<\/b> phần 背景分析 đã nêu hai mặt: khoa học kỹ thuật làm cuộc sống <b>轻松、方便<\/b>, nhưng dùng quá mức gây <b>浪费<\/b>, chiếm thời gian khiến ta <b>忽略了亲友间面对面的交往<\/b>. Câu 好句 “如今，……已经……，是……最……的……” dùng để nói ảnh hưởng hiện nay."},"steps":[["①","点题：开始使用","Mở bài: bạn bắt đầu dùng ×× từ khi nào, nó quan trọng thế nào.","我是从……开始使用……的"],["②","好处","1–2 lợi ích cụ thể, có ví dụ “以前……现在……”.","首先，……"],["③","问题","Mặt trái bạn thật sự gặp.","不过，……"],["④","我的看法","Kết: thái độ + cách dùng hợp lý.","所以，我认为……"]],"formula":["从……开始使用","好处：以前……现在……","问题：……","合理使用"],"choices_title":"Chọn ××","choices_key":"Ví dụ: ","choices":[["A · 手机","điện thoại","Học tiếng Trung, liên lạc, thanh toán… nhưng dễ nghiện, ít gặp mặt.","手机应用、移动支付"],["B · 微信","WeChat","Liên hệ bài khóa: liên lạc với bạn Trung Quốc, gọi video với gia đình.","跟中国朋友聊天"],["C · 网络","mạng internet","Tra tài liệu, học online, xem tin tức; nhưng thông tin thật giả lẫn lộn.","上网查资料"],["D · 网上购物","mua sắm trực tuyến","Tiện, rẻ; nhưng dễ mua thừa, lãng phí.","不用出门就能买东西"]],"notes":[["“以前……现在……”","Cách rõ nhất để thể hiện “改变”."],["Mặt trái thật","Một ví dụ thật: ăn cơm cùng gia đình mà ai cũng nhìn điện thoại."],["Câu kết cân bằng","“只要合理使用，××就能让我们的生活变得更好。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> đề hai mặt dùng khung <b>一方面……另一方面……<\/b> hoặc <b>首先……其次……不过……所以……<\/b>; kết luận nên <b>cân bằng<\/b>, không cực đoan.","patterns":[["① 点题","我是从上大学开始使用智能手机的，现在它已经成了我生活中的必备用品。","Tôi dùng điện thoại thông minh từ khi vào đại học, giờ nó đã là vật bất ly thân."],["① 点题","如今，手机已经走进了千家万户，是人们生活中最重要的工具之一。","Ngày nay điện thoại đã vào mọi nhà, là một trong những công cụ quan trọng nhất."],["② 好处","以前给家里打国际电话很贵，现在用微信就可以随时跟家人视频聊天。","Trước đây gọi quốc tế về nhà rất đắt, giờ dùng WeChat có thể gọi video với gia đình bất cứ lúc nào."],["② 好处","通过手机应用，我每天都能随时随地学汉语。","Nhờ ứng dụng điện thoại, ngày nào tôi cũng học tiếng Trung mọi lúc mọi nơi."],["③ 问题","不过，我花在手机上的时间越来越多，和朋友面对面交流的时间却越来越少。","Nhưng thời gian tôi dành cho điện thoại ngày càng nhiều, thời gian gặp mặt bạn bè ngày càng ít."],["③ 问题","有时候和家人一起吃饭，大家都在看手机，谁也不说话。","Có lúc ăn cơm với gia đình, ai cũng nhìn điện thoại, chẳng ai nói chuyện."],["④ 看法","所以，我认为只要合理使用，手机就能让我们的生活变得更好。","Vì vậy tôi cho rằng chỉ cần dùng hợp lý, điện thoại sẽ làm cuộc sống tốt đẹp hơn."]],"links":[["Mở bài",["我是从……开始使用……的","如今，……已经……","说到……，……"]],["Lợi ích",["首先，……","以前……，现在……","通过……，我……"]],["Mặt trái",["不过，……","另一方面，……","有时候……"]],["Kết luận",["所以，我认为……","只要……，就……","总之，……"]]],"open":[["经历式","我是从上大学开始使用智能手机的，现在它已经成了我生活中的必备用品。"],["对比式","十年前，我和家人联系只能写信；现在，打开微信就能视频聊天。"],["数据式","如今，全世界有几十亿人在使用手机，我也是其中的一个。"]],"close":[["合理式","所以，我认为只要合理使用，手机就能让我们的生活变得更好。"],["呼吁式","放下手机，多和身边的人聊聊天吧。"],["总结式","总之，手机改变了我的生活，但我不想让它控制我的生活。"]],"from_text":[["如此……，……自有其……所在","如此受欢迎，微信自有其道理所在：它又方便又免费。","Lấy từ 好句 ①: bình luận hiện tượng."],["如今，……已经……，是……最……的……","如今，手机已经成了我生活中的必备用品，是我最离不开的东西。","Lấy từ 好句 ②: tóm tắt ảnh hưởng."],["在……的背景下，作为……","在网络越来越发达的背景下，作为一个年轻人，我每天都离不开手机。","Lấy từ 好句 ③: mở bài trang trọng."],["清楚地认识到了这样的现实——","我清楚地认识到了这样的现实——我花在手机上的时间太多了。","Lấy từ 好句 ④: chuyển sang mặt trái."],["针对……，……，收效相当不错","针对这个问题，我规定自己每天只玩一个小时手机，收效相当不错。","Lấy từ 好句 ⑤: giải pháp + hiệu quả."]],"vocab":[["智能手机","zhìnéng shǒujī","điện thoại thông minh","使用智能手机","idea"],["网络","wǎngluò","mạng","上网","idea"],["方便","fāngbiàn","tiện lợi","给生活带来方便","idea"],["必备","bìbèi","thiết yếu","必备用品","idea"],["交流","jiāoliú","giao lưu, trao đổi","面对面交流","idea"],["浪费","làngfèi","lãng phí","浪费时间","idea"],["联系","liánxì","liên lạc","跟家人联系","act"],["视频","shìpín","video","视频聊天","act"],["支付","zhīfù","thanh toán","移动支付","act"],["依赖","yīlài","phụ thuộc","依赖手机","act"],["控制","kòngzhì","kiểm soát","控制时间","act"],["合理","hélǐ","hợp lý","合理使用","act"],["应用","yìngyòng","ứng dụng","手机应用","lesson"],["实现","shíxiàn","thực hiện","实现了……","lesson"],["通信","tōngxìn","liên lạc","移动通信","lesson"],["移动","yídòng","di động","移动互联网","lesson"],["用户","yònghù","người dùng","微信用户","lesson"],["注册","zhùcè","đăng ký","注册账号","lesson"],["以及","yǐjí","và","……以及……","lesson"],["程度","chéngdù","mức độ","在很大程度上","lesson"],["随时随地","suíshí suídì","mọi lúc mọi nơi","随时随地学习","bonus"],["面对面","miàn duì miàn","mặt đối mặt","面对面交流","bonus"],["拉近距离","lājìn jùlí","kéo gần khoảng cách","拉近了人与人的距离","bonus"],["有利有弊","yǒu lì yǒu bì","có lợi có hại","手机有利有弊","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 12"],["bonus","加分 · thành ngữ"]],"legend":["① Bắt đầu dùng","② Lợi ích","③ Mặt trái","④ Quan điểm"],"samples":{"speak":[{"who":"手机","meta":"Hướng A · bài nói ~1 phút 30","p":["我是从上大学开始使用智能手机的，现在它已经成了我生活中的必备用品。","首先，手机让我学汉语更方便了。以前我只能在课本上查生词，现在通过手机应用，我可以随时随地查词、听录音，还能跟中国朋友练习口语。其次，以前给家里打国际电话很贵，现在用微信就能跟家人视频聊天，实现了“面对面”的交流。","不过，我花在手机上的时间越来越多，有时候和家人一起吃饭，大家都在看手机，谁也不说话。","所以，我认为手机有利有弊，只要合理使用，它就能让我们的生活变得更好。"],"vi":"Tôi dùng điện thoại thông minh từ khi vào đại học, giờ là vật bất ly thân. Trước hết nó giúp học tiếng Trung tiện hơn: trước chỉ tra từ trong sách, giờ qua ứng dụng tra từ, nghe audio, luyện nói với bạn Trung Quốc mọi lúc mọi nơi. Thứ hai, trước gọi quốc tế rất đắt, giờ dùng WeChat gọi video với gia đình. Nhưng thời gian dành cho điện thoại ngày càng nhiều, có lúc ăn cơm ai cũng nhìn điện thoại. Vì vậy điện thoại có lợi có hại, dùng hợp lý thì cuộc sống tốt hơn."},{"who":"微信","meta":"Hướng B · bài nói ~1 phút 30","p":["来中国留学以后，我注册了微信，从那以后，微信就改变了我的生活。","首先，它让我和家人的距离更近了。每天晚上，我都用微信跟爸爸妈妈视频聊天，告诉他们我的学习以及生活情况。其次，在中国买东西、坐车、吃饭都可以用微信支付，非常方便。","不过，我也清楚地认识到了这样的现实——我越来越依赖手机，有一次手机没电了，我连饭都不知道怎么买。","所以，我觉得微信是个好东西，但我们不能被它控制。"],"vi":"Sau khi sang Trung Quốc du học tôi đăng ký WeChat, từ đó nó thay đổi cuộc sống tôi. Trước hết nó kéo gần khoảng cách với gia đình: tối nào tôi cũng gọi video kể chuyện học tập, cuộc sống. Thứ hai, ở Trung Quốc mua đồ, đi xe, ăn uống đều thanh toán bằng WeChat. Nhưng tôi nhận ra mình ngày càng phụ thuộc điện thoại — có lần hết pin đến mua cơm cũng không biết làm sao. Vì vậy WeChat tốt, nhưng không được để nó kiểm soát mình."}],"write":[{"who":"范文 1 · 手机","meta":"Dạng HSK5 · khoảng 80 chữ","title":"手机改变我的生活","p":["我是从上大学开始使用智能手机的。","以前我只能在课本上查生词，现在通过手机应用，可以随时随地学汉语。","不过，我花在手机上的时间也越来越多了。","所以，我们应该合理使用手机。"],"vi":"Bố cục 4 câu: bắt đầu dùng → lợi ích (以前……现在……) → mặt trái → kết luận."},{"who":"范文 2 · 网上购物","meta":"Dạng HSK5 · khoảng 80 chữ","title":"网上购物改变我的生活","p":["如今，网上购物已经成了我生活中的一部分。","不用出门，在手机上就能买到各种东西，节省了很多时间。","可是，因为太方便了，我常常买一些用不着的东西，造成了浪费。","看来，网上购物也是有利有弊的。"],"vi":"Hai mặt rõ ràng: tiết kiệm thời gian ↔ mua thừa, lãng phí; kết bằng 有利有弊."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"微信改变我的生活","p":["来中国留学以后，我注册了微信。如今，微信已经成了我生活中的必备用品，是我每天用得最多的手机应用。","首先，它拉近了我和家人的距离，每天晚上我都用微信跟爸爸妈妈视频聊天。其次，买东西、坐车以及吃饭都可以用微信支付，非常方便。","不过，我也清楚地认识到了这样的现实——我花在手机上的时间太多了。针对这个问题，我规定自己每天只玩一个小时手机，收效相当不错。","所以，我认为只要合理使用，微信就能让我们的生活变得更好。"],"good":["如今，微信已经成了我生活中的必备用品，是我每天用得最多的手机应用","我也清楚地认识到了这样的现实","针对这个问题，我规定自己每天只玩一个小时手机，收效相当不错"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 如今，……已经……，是……最……的…… · 清楚地认识到了这样的现实 · 针对……，……，收效相当不错."}]},"w5":["网络","方便","必备","交流","浪费","联系","视频","支付","依赖","控制","合理","应用","实现","通信","移动","用户","注册","以及","程度","针对","推广","发达","创新"],"step_names":["① 点题：开始使用","② 好处","③ 问题","④ 我的看法"],"timer":[["① 10s",10],["② 40s",40],["③ 25s",25],["④ 15s",15]],"build_title":"选一个“××”，拼出你的看法","build_lead":"Chọn chủ đề, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 手机":[["我是从上大学开始使用智能手机的，现在它已经成了我生活中的必备用品。","如今，手机已经走进了千家万户，是人们生活中最重要的工具之一。"],["以前我只能在课本上查生词，现在通过手机应用，可以随时随地学汉语，还能跟中国朋友练习口语。","以前给家里打国际电话很贵，现在用手机就能跟家人视频聊天，实现了“面对面”的交流。"],["不过，我花在手机上的时间越来越多，和朋友面对面交流的时间却越来越少。","有时候和家人一起吃饭，大家都在看手机，谁也不说话。"],["所以，我认为只要合理使用，手机就能让我们的生活变得更好。","总之，手机改变了我的生活，但我不想让它控制我的生活。"]],"B · 微信":[["来中国留学以后，我注册了微信，从那以后，微信就改变了我的生活。","如今，微信已经成了我每天用得最多的手机应用。"],["它拉近了我和家人的距离，每天晚上我都用微信跟爸爸妈妈视频聊天，告诉他们我的学习以及生活情况。","在中国买东西、坐车、吃饭都可以用微信支付，非常方便。"],["不过，我也清楚地认识到了这样的现实——我越来越依赖手机了。","有一次手机没电了，我连饭都不知道怎么买。"],["所以，我觉得微信是个好东西，但我们不能被它控制。","针对这个问题，我规定自己每天只玩一个小时手机，收效相当不错。"]],"C · 网络":[["在网络越来越发达的背景下，我每天都离不开网络。","说到网络改变我的生活，我首先想到的是学习。"],["以前查资料要去图书馆，现在上网几分钟就能找到需要的信息，还可以在网上上课。","通过网络，我认识了很多外国朋友，了解了不同国家的文化。"],["不过，网上的信息有真有假，如果不注意，很容易相信错误的消息。","另一方面，在网上看视频很容易浪费时间。"],["所以，我们应该学会正确地使用网络。","总之，网络有利有弊，关键看我们怎么用。"]]},"quiz":[["Câu nào thể hiện “改变” rõ nhất?",["手机很方便。","以前只能写信，现在打开微信就能视频聊天。"],1,"Có so sánh trước – sau."],["Câu nào hợp làm câu mở bài?",["科技很重要，大家都知道。","我是从上大学开始使用智能手机的，现在它已经成了我的必备用品。"],1,"Có “我” và vào thẳng đề."],["Câu nào nói về mặt trái?",["我可以随时随地学汉语。","大家一起吃饭时都在看手机，谁也不说话。"],1,"Câu 1 là lợi ích."],["Câu nào dùng 以及 đúng?",["买东西、坐车以及吃饭都可以用微信支付。","以及买东西、坐车、吃饭都可以用微信支付。"],0,"以及 đứng trước thành phần cuối."],["Câu nào đúng?",["只要合理使用，手机就能让生活变得更好。","只要合理使用，手机才能让生活变得更好。"],0,"只要……就……"],["Câu kết nào cân bằng hơn?",["手机应该被禁止。","只要合理使用，手机就能让我们的生活变得更好。"],1,"Kết luận cân bằng thuyết phục hơn."]],"fix":[["我从上大学开始使用手机。","我是从上大学开始使用手机的。","Nhấn mạnh thời điểm: 是……的."],["手机给我们的生活带来很多方便的。","手机给我们的生活带来了很多方便。","Bỏ 的 thừa; 带来了 hoàn thành."],["我每天用微信视频聊天跟家人。","我每天用微信跟家人视频聊天。","Giới từ 跟 + đối tượng đứng trước động từ."],["我越来越依赖手机很多。","我越来越依赖手机了。","越来越 không đi với 很多."],["网上购物有利有弊的。","网上购物有利有弊。","Thành ngữ làm vị ngữ, không thêm 的."],["只要合理使用手机，我们的生活才会更好。","只要合理使用手机，我们的生活就会更好。","只要……就……"]],"tpl":"××改变我的生活\n我是从【……】开始使用【××】的。首先，以前【……】，现在【……】。其次，【……】。不过，【问题】。所以，我认为【看法】。","chk":[["topic","Bám đề: có nhắc ×× (手机 · 网络 · 微信 · 网上)","手机|网络|微信|网上|电脑"],["change","Có so sánh trước – sau (以前 · 现在)","以前|现在|如今"],["good","Có lợi ích (方便 · 随时 · 节省 · 拉近)","方便|随时|节省|拉近|实现|联系"],["bad","Có mặt trái (不过 · 浪费 · 依赖 · 越来越少)","不过|浪费|依赖|越来越少|可是|另一方面"],["end","Có quan điểm / kết (所以 · 合理 · 总之)","所以|合理|总之|我认为"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> thời điểm bắt đầu dùng, ít nhất một lợi ích với “以前……现在……”, một mặt trái và một câu quan điểm. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“利与弊”的题目都可以这样写","var_lead":"Mọi đề hai mặt (××改变我的生活、谈谈××的好处和坏处) đều dùng khung: <b>giới thiệu → lợi ích → mặt trái → quan điểm cân bằng<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）××改变我的生活","我是从……开始使用……的"],["谈谈网上购物的好处和坏处。","如今，网上购物已经成了很多人生活中的一部分……"],["中学生应不应该带手机去学校？","关于中学生带手机，有人支持，有人反对，我认为……"],["请以“没有手机的一天”为题写一段话。","那天早上，我发现手机不见了……"],["你觉得网络让人与人的距离更近还是更远了？","网络拉近了我和远方家人的距离，可是……"],["请以“科技让生活更美好”为题写一段话。","人类的科学技术总是在不断进步……"]],"homework":"<b>Bài về nhà:<\/b> chọn một chủ đề (A–C hoặc tự chọn) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “××改变我的生活” · bắt buộc có “以前……现在……”, một mặt trái, một câu quan điểm và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}

function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}

function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}

  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
