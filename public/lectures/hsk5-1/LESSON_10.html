<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 10 · 争论的奇迹 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

了：……","apply":"一位科学家偶然忘了洗培养皿，“奇迹”出现了：他发现了青霉素。","apply_vn":"Một nhà khoa học tình cờ quên rửa đĩa nuôi cấy, “kỳ tích” xuất hiện: ông phát hiện ra penicillin."},{"zh":"经过艰苦的试验，电影拍摄技术逐渐改进、成熟","vn":"trải qua những thử nghiệm gian khổ, kỹ thuật quay phim dần dần được cải tiến, hoàn thiện","why":"<b>经过……，……逐渐……<\/b>: nói về quá trình phát triển của một phát minh / kỹ thuật.","frame":"经过 + （艰苦的）过程，+ 事物 + 逐渐 + 改进／成熟／发展","apply":"经过多年的研究，这项技术逐渐成熟，走进了千家万户。","apply_vn":"Qua nhiều năm nghiên cứu, kỹ thuật này dần hoàn thiện và đến với mọi nhà."},{"zh":"留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，或许重大发现就在你的眼前","vn":"để ý từng khoảnh khắc của cuộc sống, dám tranh luận vì nó, kịp thời nhờ giúp đỡ, nghiên cứu nghiêm túc — có lẽ phát hiện lớn đang ở ngay trước mắt bạn","why":"Câu kết bài kiểu “rút ra bài học”: chuỗi động từ + <b>或许……就在你的眼前<\/b>.","frame":"（做法1），（做法2），……，或许 + 结果 + 就在你的眼前","apply":"多观察，多思考，敢于提问，或许下一个伟大的发明就在你的手中。","apply_vn":"Quan sát nhiều, suy nghĩ nhiều, dám đặt câu hỏi — có lẽ phát minh vĩ đại tiếp theo nằm trong tay bạn."}],"GRAMMAR":[{"word":"毕竟","py":"bìjìng","pos":"副词","forms":["毕竟 + 结果（= 到底、终于）","……，毕竟 + 原因／事实（指出最重要或正确的部分）","A 毕竟是 A"],"vn":"<b>毕竟<\/b> ① <b>rốt cuộc, cuối cùng<\/b> (= 到底、终于): 但毕竟完成了任务. ② <b>suy cho cùng, dù sao thì<\/b> — chỉ ra sự thật/nguyên nhân quan trọng nhất, thường đi kèm câu kết luận “không gì thay đổi được”: 他毕竟是个孩子. Cấu trúc hay: <b>A 毕竟是 A<\/b>.","text":"不过摄影师毕竟是摄影师，主意还是有的。","ex":[["虽然我们遇到了很多困难，但毕竟完成了任务。","Dù gặp nhiều khó khăn nhưng rốt cuộc chúng tôi đã hoàn thành nhiệm vụ."],["生活中总有无法解决的问题，毕竟不是所有的对错都能讲清楚。","Cuộc sống luôn có vấn đề không giải quyết được, suy cho cùng không phải đúng sai nào cũng nói rõ được."],["他不高兴是正常的，毕竟没有人能在摔得头破血流的时候，还高兴得起来。","Anh ấy không vui là bình thường, dù sao chẳng ai ngã đến vỡ đầu chảy máu mà còn vui nổi."]],"err":[["❌ 毕竟他是孩子，所以我们要原谅他吗？","✅ 他毕竟是个孩子，我们就原谅他吧。","毕竟 dùng trong câu trần thuật, không dùng trong câu hỏi."],["❌ 我毕竟去了北京。","✅ 我终于去了北京。","Diễn tả “cuối cùng đã đạt được điều mong muốn” thường dùng 终于."]],"book":[["你们毕竟是好朋友，____________。","Gợi ý: có hiểu lầm thì nói ra là được.","你们毕竟是好朋友，有什么误会说开就好了"],["A：这孩子真是太淘气了！我快被他烦死了！<br>B：____________。（毕竟）","Gợi ý: dù sao nó vẫn là trẻ con.","别生气，他毕竟还是个孩子"],["A：他最近脾气真是太差了，一点儿小事就发火！<br>B：____________。（毕竟）","Gợi ý: áp lực công việc lớn.","他最近工作压力太大了，毕竟一个人要做三个人的工作"]],"drill":[["“毕竟”放在哪里？ <u>A<\/u>是秋天了，<u>B<\/u>再热<u>C<\/u>也不会像夏天那样。",["A","B","C"],0,"毕竟是秋天了 (课本练习3)."],["选择：别怪他了，他____才五岁。",["毕竟","终于","果然"],0,"Nêu sự thật quan trọng → 毕竟."],["“老师毕竟是老师”的意思是：",["老师就是有老师的本领","老师不是老师","老师已经走了"],0,"A 毕竟是 A: nhấn mạnh bản chất."]]},{"word":"逐渐","py":"zhújiàn","pos":"副词","forms":["逐渐 + 动词／形容词（表示程度或数量一点点增加或减少）"],"vn":"<b>逐渐<\/b> là phó từ: <b>dần dần<\/b>, mức độ/số lượng tăng hoặc giảm từng chút một. Đứng trước động từ: 逐渐改进、逐渐习惯、逐渐增加. Gần nghĩa với 渐渐, nhưng 逐渐 trang trọng hơn và không lặp lại được.","text":"经过艰苦的试验，电影拍摄技术逐渐改进、成熟。","ex":[["食物越来越少，老人不得不逐渐限制猴子的食量。","Thức ăn ngày càng ít, ông lão buộc phải hạn chế dần khẩu phần của khỉ."],["这项运动首先在亚太地区流行，并逐渐受到世界各地人们的欢迎。","Môn thể thao này thịnh hành trước ở châu Á – Thái Bình Dương, rồi dần được khắp thế giới yêu thích."],["来中国以后，我逐渐习惯了这里的生活。","Sau khi đến Trung Quốc, tôi dần quen với cuộc sống ở đây."]],"err":[["❌ 天气逐渐逐渐暖和了。","✅ 天气逐渐暖和了。／天气渐渐暖和了。","逐渐 không lặp lại."],["❌ 他逐渐一下子长大了。","✅ 他逐渐长大了。","逐渐 (dần dần) mâu thuẫn với 一下子 (đột ngột)."]],"book":[["A：刚来北京的时候，你习惯吗？<br>B：____________。（逐渐）","Gợi ý: lúc đầu chưa quen, sau dần quen.","刚开始不太习惯，后来逐渐习惯了"],["茶首先在中国出现，____________。（逐渐）","Gợi ý: sau đó dần truyền ra thế giới.","茶首先在中国出现，后来逐渐传到了世界各地"],["A：____________。（逐渐）<br>B：我觉得你说得对，就这么办吧。","Gợi ý: đề xuất thay đổi từng bước.","我觉得我们的工作方法应该逐渐改进，不能一下子全改"]],"drill":[["选择：随着年龄的增长，他____明白了父母的苦心。",["逐渐","突然","马上"],0,"Quá trình dần dần."],["Câu nào đúng?",["这里的人口逐渐增加了。","这里的人口逐渐逐渐增加了。","这里的人口增加逐渐了。"],0,"逐渐 + V."],["“逐渐”和哪个词意思最接近？",["渐渐","突然","始终"],0,"逐渐 ≈ 渐渐."]]},{"word":"或许","py":"huòxǔ","pos":"副词","forms":["或许 + 动词短语／小句（= 也许、有可能）"],"vn":"<b>或许<\/b> là phó từ: <b>có lẽ, có thể<\/b> (= 也许). Đứng trước động từ hoặc đầu câu, biểu thị phỏng đoán không chắc chắn. Văn viết. Đừng nhầm với liên từ <b>或者<\/b> (hoặc).","text":"留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，或许重大发现就在你的眼前。","ex":[["虽然以前她不支持你，但或许这次会有变化。","Tuy trước đây cô ấy không ủng hộ bạn, nhưng có lẽ lần này sẽ khác."],["或许正是因为这一点一滴的努力，你就会走在别人的前面。","Có lẽ chính nhờ từng chút nỗ lực ấy mà bạn sẽ đi trước người khác."],["他没来上课，或许是生病了。","Cậu ấy không đến lớp, có lẽ bị ốm."]],"err":[["❌ 你喝茶或许咖啡？","✅ 你喝茶还是咖啡？","Chọn lựa trong câu hỏi dùng 还是; 或许 là “có lẽ”."],["❌ 他一定或许会来。","✅ 他或许会来。","一定 (chắc chắn) mâu thuẫn với 或许 (có lẽ)."]],"book":[["他的妻子前几年瘫痪了，____________。（或许）","Gợi ý: có lẽ đó là lý do anh ấy ít tham gia hoạt động.","他的妻子前几年瘫痪了，或许这就是他很少参加活动的原因"],["A：你猜这场比赛的结果会怎么样？<br>B：____________。（或许）","Gợi ý: khó nói, có lẽ đội mình thắng.","很难说，或许我们队能赢"],["A：____________。（或许）<br>B：希望是这样，那我们再等五分钟。","Gợi ý: có lẽ anh ấy sắp đến rồi.","再等等吧，他或许马上就到了"]],"drill":[["选择：吃中餐____西餐都可以。",["或许","或者"],1,"Lựa chọn → 或者."],["选择：天这么阴，____会下雨。",["或许","或者"],0,"Phỏng đoán → 或许."],["“或许”的意思是：",["也许，有可能","一定","已经"],0,"或许 = 也许."]]}],"HSK":{"r1":[{"text":["小李刚买了一台新相机，非常得意。周末，他请朋友们来家里，{36}。拍完以后，大家围过来一看，每张照片上的人都闭着眼睛。小李很不好意思，朋友们却笑着说：“{37}，至少你拍下了我们最放松的样子。”小李想了想说：“{38}，下次我先数到三，大家再一起闭眼睛。”"],"qs":[{"n":36,"o":["给大家拍合影","请大家吃饭","一起看电影","教大家做菜"],"a":0,"why":"后文“拍完以后”“每张照片”，说明他给朋友们拍照。"},{"n":37,"o":["你的相机坏了","没关系","我们回家吧","你应该道歉"],"a":1,"why":"朋友们“笑着说”，后面“至少……”是安慰的话，所以是“没关系”。"},{"n":38,"o":["我知道问题在哪儿了","我不想拍照了","这台相机太贵了","你们都错了"],"a":0,"why":"小李开玩笑地“找到了原因”，前后形成幽默。"}]},{"text":["很多改变人类生活的发明，最初都来自于一场争论或一个偶然的发现。科学家们{39}，有时会争论得脸红脖子粗。不过，正是这些争论，{40}。历史告诉我们，{41}，而是在不断地试验和改进中逐渐成熟的。所以，当我们和别人意见不同时，不必害怕争论，{42}。"],"qs":[{"n":39,"o":["为了一个问题各执一词","从来不说话","都是好朋友","很少工作"],"a":0,"why":"后文“争论得脸红脖子粗”，说明他们意见不同、各执一词。"},{"n":40,"o":["让大家不再见面","推动了科学的发展","浪费了很多时间","让问题更难了"],"a":1,"why":"“不过，正是这些争论……”表示转折，强调争论的积极作用。"},{"n":41,"o":["发明都是很容易的","重大发明往往不是一下子就完成的","科学家都很聪明","发明都是外国人做的"],"a":1,"why":"“不是……，而是……逐渐成熟的”，前后呼应。"},{"n":42,"o":["应该马上离开","要认真听取对方的理由","要大声地说话","最好不说话"],"a":1,"why":"全文肯定争论的作用，所以要认真听对方的理由。"}]}],"r2":[{"start":46,"paras":["为了找到合适的灯丝材料，他和助手试验了一千多种材料，可是都失败了。","十九世纪七十年代，美国发明家爱迪生开始研究一种可以长时间发光的电灯。","有人说他是在浪费时间，爱迪生却说：“我没有失败，我只是发现了一千多种不合适的材料。”","经过不断地试验，他终于找到了比较合适的材料，电灯可以连续亮很长时间了。","从此，电灯逐渐走进了千家万户，人们的夜晚变得明亮起来。"],"ans":["B","A","C","D","E"],"why":"开始研究（B）→ 试验一千多种材料都失败（A）→ 别人的看法和爱迪生的回答（C）→ 终于成功（D）→ 电灯的影响（E）。"}],"r3":[{"text":["你一定用过便利贴吧？这种可以贴上又撕下的小纸片，其实是一次“失败”的结果。","二十世纪六十年代，一位科学家想研究一种粘力很强的胶水，可是做出来的胶水粘力很弱，贴上去的东西很容易就掉下来。大家都觉得这是一个失败的试验，这种胶水也被放在一边，好几年都没有人用。","后来，他的一位同事在教堂唱歌时，夹在歌本里的小纸条总是掉出来。他忽然想到：如果用那种粘力不强的胶水，<u><b>纸条既能贴住，又不会把书弄坏<\/b><\/u>。经过反复改进，便利贴终于诞生了。","如今，便利贴已经成了办公室里最常见的用品之一。这个故事告诉我们：失败的试验不一定没有价值，关键是能不能换一个角度去看它。"],"qs":[{"n":56,"s":"那位科学家本来想研究什么？","o":["便利贴","粘力很强的胶水","一种新的纸","歌本"],"a":1,"why":"第二段：想研究一种粘力很强的胶水。"},{"n":57,"s":"那种胶水为什么好几年没有人用？","o":["太贵了","大家觉得这是失败的试验","颜色不好看","没有人知道"],"a":1,"why":"第二段：大家都觉得这是一个失败的试验。"},{"n":58,"s":"画线句子说明这种胶水的特点是：","o":["粘力很强，撕不下来","能贴住，也容易撕下","会把书弄坏","只能贴在墙上"],"a":1,"why":"既能贴住，又不会把书弄坏，说明粘力适中、容易撕下。"},{"n":59,"s":"这个故事告诉我们什么？","o":["做试验很危险","失败的试验也可能有价值","唱歌对身体好","不要用胶水"],"a":1,"why":"最后一段：失败的试验不一定没有价值。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小明的发现。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể về phát hiện của Tiểu Minh.","panels":[["🌧️","下雨天，小明发现雨伞上的水总是滴到鞋上。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk23845_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#9aa8bb\"/><stop offset=\"1\" stop-color=\"#c9d1dc\"/><\/linearGradient><\/defs><rect width=\"320\" height=\"240\" fill=\"url(#sk23845_1)\"/><rect y=\"205\" width=\"320\" height=\"35\" fill=\"#b9bec7\"/><path d=\"M0 205 H320\" stroke=\"#9aa0aa\" stroke-width=\"3\"/><rect width=\"320\" height=\"240\" fill=\"#5d6b80\" opacity=\".35\"/><g stroke=\"#7fa6d6\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".8\"><path d=\"M79 125 l-4 11\"/><path d=\"M122 139 l-4 11\"/><path d=\"M206 15 l-4 11\"/><path d=\"M4 193 l-4 11\"/><path d=\"M86 54 l-4 11\"/><p 产生了电影。可以说，没有那场争论，就没有今天的电影。\n其次，争论能让我们从不同的角度看问题，避免片面的认识。\n当然，争论的时候要尊重对方，对事不对人。如果只想赢，甚至吵得脸红脖子粗，就会伤害感情。\n总之，不要害怕争论，或许重大的发现就藏在一场争论中。","svn":"Bài nghị luận: quan điểm → 首先 tranh luận giúp tìm chân lý (ví dụ điện ảnh) → 其次 nhìn nhiều góc → 当然 phải tôn trọng đối phương → 总之."}},"PRACTICE":{"ex1":{"bank":["插","系","拦","拍","说服","围绕"],"items":[["你今天{}这条领带吧，比较正式。",["系"]],["地球为什么会{}太阳转，一直是科学家们很感兴趣的问题。",["围绕"]],["如果不是他在中间{}了一手，事情不会变成现在这样。",["插"]],["这位导演{}过二十几部电影，得过好几项国际大奖。",["拍"]],["我始终没有办法{}他接受这个结论。",["说服"]],["前面不知道发生了什么事，路被{}住了。",["拦"]]]},"ex2":[["在昨天举行的____赛上，他的表现得到了大家的好评。",["争论","辩论"],1],["毕业二十年以来，我们____保持着联系。",["始终","终于"],0],["我们之间还有很大的____，我要向他学习，更加努力。",["差距","距离"],0],["吃中餐____西餐都可以，只是我不能吃太辣的。",["或许","或者"],1]],"ex3":[["我<u>A<\/u>都十八岁<u>B<\/u>，能照顾好<u>C<\/u>自己，您就放心<u>D<\/u>吧。","啦",1,"我都十八岁啦，能照顾好自己，您就放心吧。"],["<u>A<\/u>是秋天了，<u>B<\/u>再热<u>C<\/u>也不会<u>D<\/u>像夏天那样。","毕竟",0,"毕竟是秋天了，再热也不会像夏天那样。"],["这是<u>A<\/u>已经<u>B<\/u>经过很多人<u>C<\/u>证明的<u>D<\/u>经验。","成熟",3,"这是已经经过很多人证明的成熟经验。"],["真心<u>A<\/u>希望<u>B<\/u>您能同意我的<u>C<\/u>，<u>D<\/u>帮我这个忙！","请求",2,"真心希望您能同意我的请求，帮我这个忙！"]],"ex4":[["斯坦福与科恩的辩论","围绕、始终、说服","1872年，斯坦福和科恩围绕“马奔跑时蹄子是否着地”进行了辩论。斯坦福认为四蹄都不落地，科恩认为始终有一蹄着地，两人谁也说服不了谁。"],["麦布里奇的办法","操场、插、系、显示","摄影师麦布里奇在操场跑道的一边放了24个照相机，另一边插了24根木棍，木棍上系着细线，接上相机快门。马跑过时撞断细线，相机拍下了24张相片。相片显示马始终有一蹄着地。"],["电影的产生","奇迹、逐渐、播放、纪念","后来有人快速拉动那串相片，奇迹出现了：马好像活了。电影技术逐渐成熟，1895年12月28日，卢米埃尔兄弟第一次向公众播放电影，这一天成了电影产生的纪念日。"]],"ext":{"title":"扩展 · 话题：服饰","words":[["围巾","wéijīn","khăn quàng cổ"],["领带","lǐngdài","cà vạt"],["手套","shǒutào","găng tay"],["牛仔裤","niúzǎikù","quần bò"],["丝绸","sīchóu","lụa"],["布","bù","vải"],["耳环","ěrhuán","hoa tai"],["戒指","jièzhi","nhẫn"]],"items":[["天气太冷了，你系条{}再出去吧。","围巾"],["我们去年买的那双{}你放在哪儿了？","手套"],["今天不上班，不用穿西服，终于可以穿{}了。","牛仔裤"],["您觉得这条{}怎么样？当生日礼物送给您先生很合适。","领带"]]}},"TEXT":[{"title":"马蹄之争","sub":"谁也说服不了谁","paras":["1872年的一天，在美国加利福尼亚州的一个酒店里，斯坦福与科恩围绕“马奔跑时蹄子是否着地”进行了辩论。斯坦福认为，马跑得那么快，在跳起时四蹄应该都是不落地的；而科恩认为，马要是四蹄都不着地，那不是成了青蛙啦？应该是始终有一蹄着地。两人各执一词，争论得脸红脖子粗，谁也说服不了谁。"],"idea":"Năm 1872, Stanford và Cohen tranh luận: <b>ngựa khi phi có chân nào chạm đất không?<\/b> Stanford cho rằng lúc nhảy cả bốn chân đều rời đất; Cohen cho rằng nếu vậy ngựa thành ếch mất, phải luôn có một chân chạm đất. Hai người <b>mỗi người một ý<\/b>, cãi đến đỏ mặt tía tai.","qs":[["斯坦福和科恩在争论什么？",["马跑得快不快","马奔跑时蹄子是否着地","青蛙会不会跳"],1],["科恩的看法是什么？",["马跳起时四蹄都不落地","马始终有一蹄着地","马和青蛙一样"],1],["“争论得脸红脖子粗”说明了什么？",["两人争论得很激烈","两人生病了","两人很高兴"],0]]},{"title":"摄影师的办法","sub":"24个照相机","paras":["于是他们就请英国摄影师麦布里奇来判断，可麦布里奇也弄不清楚。不过摄影师毕竟是摄影师，主意还是有的。他们一起来到一个操场，在一条跑道的一边等距离放上24个照相机，照相机对准跑道；在跑道另一边打24个洞，分别插进24根木棍，木棍上系着细线，细线穿过跑道，接上相机快门。","一切都准备好了，麦布里奇让一匹马从跑道的一头飞奔到另一头，马一边跑，一边按顺序撞断拦路的24根细线，相机连续拍下了24张相片，相邻两张相片的差距都很小。相片显示：马奔跑时始终有一蹄着地，科恩赢了。"],"idea":"Họ nhờ nhiếp ảnh gia <b>Muybridge<\/b> phân xử. Ông đặt <b>24 máy ảnh<\/b> cách đều dọc đường chạy, bên kia cắm 24 cây gậy buộc dây nối với màn trập. Ngựa chạy qua làm đứt từng sợi dây, máy ảnh <b>chụp liên tục 24 tấm<\/b>. Ảnh cho thấy ngựa <b>luôn có một chân chạm đất<\/b> — Cohen thắng.","qs":[["麦布里奇是做什么的？",["医生","摄影师","老师"],1],["相机是怎么拍下相片的？",["有人一张一张地按快门","马撞断细线，带动相机快门","相机自己拍"],1],["最后谁赢了？",["斯坦福","科恩","麦布里奇"],1]]},{"title":"电影的产生","sub":"相片“活”了","paras":["事后，有人无意识地快速拉动那一长串相片，“奇迹”出现了：各张相片中静止的马连成了一匹运动的马，相片“活”了。这就是电影最早的样子。","经过艰苦的试验，电影拍摄技术逐渐改进、成熟。1895年12月28日，法国人卢米埃尔兄弟在巴黎第一次向公众播放了短片《火车到站》，这一天后来成为电影产生的纪念日，兄弟俩也成为历史上最早的电影导演。","留心生活的每一瞬间，并为之争论，适时请求帮助、认真研究，或许重大发现就在你的眼前。"],"idea":"Có người <b>vô tình<\/b> kéo nhanh chuỗi ảnh: những con ngựa đứng yên nối thành một con ngựa đang chạy — <b>hình dạng sớm nhất của điện ảnh<\/b>. Ngày 28/12/1895, <b>anh em Lumière<\/b> lần đầu chiếu phim “Tàu đến ga” ở Paris. Bài học: để ý từng khoảnh khắc, dám tranh luận, biết nhờ giúp đỡ — có lẽ <b>phát hiện lớn<\/b> ở ngay trước mắt.","qs":[["“奇迹”是怎么出现的？",["有人快速拉动那一长串相片","马跑得特别快","相机坏了"],0],["电影产生的纪念日是哪一天？",["1872年的一天","1895年12月28日","1985年12月28日"],1],["作者最后想告诉我们什么？",["要多看电影","留心生活，认真研究，或许就会有重大发现","不要和别人争论"],1]]}],"TEXT_EXTRA":{"compare_title":"中国古代四大发明","compare_head":["发明","拼音","Tiếng Việt"],"compare":[["造纸术","zàozhǐshù","kỹ thuật làm giấy"],["指南针","zhǐnánzhēn","la bàn"],["火药","huǒyào","thuốc súng"],["印刷术","yìnshuāshù","kỹ thuật in ấn"]],"bg":"历史上有很多伟大的发明。例如，中国传统的“四大发明”分别是造纸术、指南针（zhǐnánzhēn）、火药和印刷（yìnshuā）术。这些发明对我们的生产和生活产生了重大的影响。有趣的是，有些发明，不是科学家专门研究出来的，而是生活当中无意间发现的，就像我们课文中介绍的电影的产生一样。","bg_vn":"Bốn phát minh lớn của Trung Quốc cổ đại: giấy, la bàn, thuốc súng, in ấn. Thú vị là có những phát minh không do nhà khoa học chuyên tâm nghiên cứu mà được phát hiện tình cờ trong đời sống — giống như sự ra đời của điện ảnh trong bài.","discuss_title":"话题讨论：日常生活中的重大发现","discuss":["读过课文后，你认为电影的发明最重要的原因是什么？","你还知道哪些重大发现或发明的故事？请简单介绍一下。","从你介绍的这个发现或发明中你想到了什么？"],"write":"请以“日常生活中的大发现或发明”为题，谈一谈你所了解的日常生活中的重大发明或发现。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“日常生活中的大发现或发明”为题，谈一谈你所了解的日常生活中的重大发明或发现","topic_vn":"Viết bài với đầu đề “Phát hiện hay phát minh lớn trong đời sống thường ngày”","intro":"Dạng đề giới thiệu + rút ra bài học (介绍＋启发) · Chọn một phát minh/phát hiện → kể quá trình ra đời → ảnh hưởng tới cuộc sống → điều bạn học được · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“日常生活中的大发现或发明”：过程 + 影响 + 启发","lead":"Đề yêu cầu giới thiệu <b>một<\/b> phát minh/phát hiện quan trọng — tốt nhất là cái <b>gắn với đời sống<\/b> và ra đời <b>một cách bất ngờ<\/b> (như điện ảnh trong bài). Bài hay phải có <b>quá trình<\/b> (ai, khi nào, vì sao phát hiện), <b>ảnh hưởng<\/b> và <b>bài học<\/b> của bạn.","parts":[["日常生活中的","Phát minh gần gũi: phim ảnh, mì ăn liền, penicillin, giấy… hoặc phát hiện từ quan sát đời thường."],["大发现或发明","Phát hiện (发现: cái vốn có, nay tìm ra) ≠ phát minh (发明: tạo ra cái mới) — dùng từ đúng."],["谈一谈你所了解的","Thông tin phải chắc chắn; không nhớ năm thì viết “一百多年前”."],["（课本）尽量用上本课生词，不少于100字","Dùng: 奇迹、逐渐、改进、成熟、或许、毕竟、意识、试验、重大… và khung 好句 của bài khóa."]],"traps":[["Liệt kê nhiều phát minh","Kể bốn năm phát minh mỗi cái một câu → không có chiều sâu."],["Chỉ kể, không có bài học","Thiếu câu “从这个发明中我想到了……”."],["Nhầm 发现 / 发明","“发明了青霉素” chưa chuẩn — nên nói “发现了青霉素”; “发明了电影” đúng."],["Thông tin sai","Không chắc tên người, năm thì nói chung chung."]],"link":"<b>Liên hệ bài 10:<\/b> phần 背景分析 gợi ý: nhiều phát minh <b>không do chuyên tâm nghiên cứu<\/b> mà được phát hiện <b>tình cờ<\/b> trong đời sống. Câu kết bài khóa “留心生活的每一瞬间……或许重大发现就在你的眼前” là câu kết mẫu cho bài viết."},"steps":[["①","点题","Mở bài: có nhiều phát minh vĩ đại; có cái ra đời rất tình cờ.","历史上有很多伟大的发明……"],["②","过程","<b>Trọng tâm.<\/b> Kể ngắn quá trình ra đời của một phát minh/phát hiện.","……无意识地……，“奇迹”出现了"],["③","影响","Nó thay đổi cuộc sống của chúng ta thế nào.","这个发明给我们的生活带来了……"],["④","启发","Kết: bài học bạn rút ra.","从这个故事中我想到……"]],"formula":["发明很多，有的很偶然","过程：谁、怎么发现","影响：改变生活","启发：留心生活"],"choices_title":"Chọn một phát minh / phát hiện","choices_key":"Ví dụ: ","choices":[["A · 电影","điện ảnh","Dùng ngay tư liệu bài khóa: cuộc tranh luận → 24 máy ảnh → ảnh “sống”.","马蹄之争"],["B · 青霉素","penicillin","Năm 1928, Fleming tình cờ thấy nấm mốc diệt vi khuẩn trên đĩa nuôi cấy quên rửa.","忘了洗的培养皿"],["C · 方便面","mì ăn liền","Phát minh gần gũi với sinh viên: tiện lợi, rẻ, nhanh.","三分钟就能吃"],["D · 造纸术","kỹ thuật làm giấy","Một trong bốn phát minh lớn của Trung Quốc, giúp văn hóa lưu truyền.","四大发明"]],"notes":[["Một chi tiết bất ngờ","Điểm “奇迹”: quên rửa đĩa, kéo nhanh chuỗi ảnh… làm bài hấp dẫn."],["Ảnh hưởng cụ thể","Không chỉ “很重要” mà là “救了无数人的生命”, “让人们可以……”."],["Câu kết","“留心生活，或许下一个重大发现就在你的眼前。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> phân biệt 发明 (tạo ra) – 发现 (tìm ra). Dùng từ chỉ thời gian để kể quá trình: 起初……后来……经过……逐渐…….","patterns":[["① 点题","历史上有很多伟大的发明，有些发明是在生活中无意间发现的。","Lịch sử có nhiều phát minh vĩ đại, có cái được phát hiện tình cờ trong đời sống."],["① 点题","说到日常生活中的大发现，我首先想到的是青霉素。","Nói đến phát hiện lớn trong đời sống, tôi nghĩ ngay đến penicillin."],["② 过程","一位科学家偶然忘了洗培养皿，“奇迹”出现了。","Một nhà khoa học tình cờ quên rửa đĩa nuôi cấy, “kỳ tích” xuất hiện."],["② 过程","经过艰苦的试验，这项技术逐渐改进、成熟。","Qua thử nghiệm gian khổ, kỹ thuật này dần được cải tiến, hoàn thiện."],["③ 影响","这个发现救了无数人的生命，对人类产生了重大的影响。","Phát hiện này cứu vô số sinh mạng, ảnh hưởng to lớn đến nhân loại."],["④ 启发","这个故事告诉我们，要留心生活中的每一个细节。","Câu chuyện cho ta biết phải để ý từng chi tiết trong cuộc sống."],["④ 启发","留心生活的每一瞬间，或许重大发现就在你的眼前。","Để ý từng khoảnh khắc, có lẽ phát hiện lớn ở ngay trước mắt bạn."]],"links":[["Mở bài",["历史上有很多……","说到……，我首先想到的是……","有些发明不是……，而是……"]],["Kể quá trình",["起初……","……无意识地／偶然……","经过……，……逐渐……"]],["Ảnh hưởng",["……给我们的生活带来了……","……对……产生了重大的影响","如今，……"]],["Bài học",["这个故事告诉我们……","从中我想到……","或许……就在你的眼前"]]],"open":[["直接式","历史上有很多伟大的发明，有些是在生活中无意间发现的。"],["提问式","你知道电影是怎么来的吗？它竟然来自一场关于马蹄的争论。"],["故事式","1928年，一位英国科学家度假回来，发现实验室里的一个培养皿长了霉。"]],"close":[["启发式","留心生活的每一瞬间，或许重大发现就在你的眼前。"],["总结式","这些看起来很偶然的发现，毕竟离不开认真的研究。"],["感想式","每次看电影的时候，我都会想起那场有趣的争论。"]],"from_text":[["各执一词，……谁也说服不了谁","起初，科学家们各执一词，谁也说服不了谁。","Lấy từ 好句 ①: kể tranh luận."],["A 毕竟是 A","科学家毕竟是科学家，他马上意识到这个发现很重要。","Lấy từ 好句 ②: nhấn mạnh năng lực."],["无意识地……，“奇迹”出现了","他无意识地把食物放进了热油里，“奇迹”出现了。","Lấy từ 好句 ③: khoảnh khắc phát hiện."],["经过……，……逐渐……","经过艰苦的试验，这种药的生产技术逐渐成熟。","Lấy từ 好句 ④: quá trình phát triển."],["或许……就在你的眼前","多观察生活，或许重大发现就在你的眼前。","Lấy từ 好句 ⑤: câu kết."]],"vocab":[["发明","fāmíng","phát minh","伟大的发明","idea"],["发现","fāxiàn","phát hiện","重大发现","idea"],["偶然","ǒurán","tình cờ","偶然发现","idea"],["技术","jìshù","kỹ thuật","拍摄技术","idea"],["科学家","kēxuéjiā","nhà khoa học","英国科学家","idea"],["影响","yǐngxiǎng","ảnh hưởng","产生影响","idea"],["观察","guānchá","quan sát","留心观察","act"],["研究","yánjiū","nghiên cứu","认真研究","act"],["改变","gǎibiàn","thay đổi","改变生活","act"],["带来","dàilái","mang lại","带来方便","act"],["推广","tuīguǎng","phổ biến","推广到全世界","act"],["留心","liúxīn","để ý","留心生活","act"],["奇迹","qíjì","kỳ tích","奇迹出现了","lesson"],["逐渐","zhújiàn","dần dần","逐渐成熟","lesson"],["改进","gǎijìn","cải tiến","改进技术","lesson"],["成熟","chéngshú","hoàn thiện","技术成熟","lesson"],["或许","huòxǔ","có lẽ","或许就在眼前","lesson"],["毕竟","bìjìng","suy cho cùng","毕竟是科学家","lesson"],["试验","shìyàn","thử nghiệm","艰苦的试验","lesson"],["重大","zhòngdà","to lớn","重大影响","lesson"],["无意间","wúyì jiān","vô tình","无意间发现","bonus"],["千家万户","qiān jiā wàn hù","nghìn nhà vạn hộ","走进千家万户","bonus"],["无数","wúshù","vô số","救了无数人","bonus"],["功不可没","gōng bù kě mò","công lao không thể phủ nhận","这项发明功不可没","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 10"],["bonus","加分 · thành ngữ"]],"legend":["① Mở bài","② Quá trình","③ Ảnh hưởng","④ Bài học"],"samples":{"speak":[{"who":"电影","meta":"Hướng A · bài nói ~1 phút 30","p":["历史上有很多伟大的发明，有些发明不是科学家专门研究出来的，而是在生活中无意间发现的，电影就是这样。","1872年，两个人围绕“马奔跑时蹄子是否着地”争论得脸红脖子粗，谁也说服不了谁。摄影师麦布里奇用24个照相机拍下了马奔跑的样子。后来，有人无意识地快速拉动那一长串相片，“奇迹”出现了：马好像活了。经过艰苦的试验，电影拍摄技术逐渐成熟。","如今，电影已经成了人们生活中不可缺少的一部分。","这个故事告诉我们：留心生活的每一瞬间，或许重大发现就在你的眼前。"],"vi":"Lịch sử có nhiều phát minh vĩ đại, có cái được phát hiện tình cờ — điện ảnh là ví dụ. Năm 1872 hai người tranh cãi về móng ngựa, nhiếp ảnh gia dùng 24 máy ảnh chụp ngựa chạy; sau có người vô tình kéo nhanh chuỗi ảnh, ngựa như sống dậy. Qua thử nghiệm, kỹ thuật dần hoàn thiện. Nay phim ảnh không thể thiếu trong đời sống. Bài học: để ý từng khoảnh khắc, có lẽ phát hiện lớn ở ngay trước mắt."},{"who":"青霉素","meta":"Hướng B · bài nói ~1 phút 30","p":["说到日常生活中的大发现，我首先想到的是青霉素。","1928年，英国科学家弗莱明度假回来，发现实验室里一个忘了洗的培养皿长了霉，而霉的周围细菌都死了。科学家毕竟是科学家，他马上意识到这个发现很重要。后来，经过很多人艰苦的研究，青霉素的生产技术逐渐成熟。","青霉素救了无数人的生命，对人类产生了重大的影响。","这个故事让我明白了，很多伟大的发现就藏在生活的小细节里，我们应该多观察、多思考。"],"vi":"Nói đến phát hiện lớn, tôi nghĩ ngay đến penicillin. Năm 1928, nhà khoa học Anh Fleming đi nghỉ về thấy một đĩa nuôi cấy quên rửa bị mốc, quanh chỗ mốc vi khuẩn chết hết. Nhà khoa học vẫn là nhà khoa học — ông lập tức nhận ra tầm quan trọng. Sau nhiều nghiên cứu, kỹ thuật sản xuất dần hoàn thiện. Penicillin cứu vô số sinh mạng. Bài học: phát hiện vĩ đại ẩn trong chi tiết nhỏ, phải quan sát và suy nghĩ nhiều."}],"write":[{"who":"范文 1 · 电影","meta":"Dạng HSK5 · khoảng 80 chữ","title":"日常生活中的大发现","p":["电影不是科学家专门研究出来的，而是在生活中无意间发现的。","有人快速拉动一长串马的相片，静止的马好像活了。","经过艰苦的试验，电影技术逐渐成熟。","这告诉我们，要留心生活的每一瞬间。"],"vi":"Bố cục 4 câu: mở bài → khoảnh khắc phát hiện → phát triển (逐渐) → bài học."},{"who":"范文 2 · 方便面","meta":"Dạng HSK5 · khoảng 80 chữ","title":"日常生活中的大发明","p":["我觉得方便面是一个很重要的发明。","它出现于二十世纪五十年代，用开水泡三分钟就能吃。","后来，方便面的味道越来越多，如今已经走进了千家万户。","对忙碌的学生来说，它真是一个“奇迹”。"],"vi":"Giới thiệu phát minh gần gũi; dùng 于 (bài 5) và 千家万户."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"日常生活中的大发现或发明","p":["历史上有很多伟大的发明，有些发明是在生活中无意间发现的，青霉素就是这样。","1928年，英国科学家弗莱明发现，一个忘了洗的培养皿长了霉，而霉的周围细菌都死了。科学家毕竟是科学家，他马上意识到这个发现很重要。经过艰苦的试验，青霉素的生产技术逐渐成熟。","如今，青霉素已经救了无数人的生命。","这个故事告诉我们：留心生活的每一瞬间，或许重大发现就在你的眼前。"],"good":["科学家毕竟是科学家","经过艰苦的试验，青霉素的生产技术逐渐成熟","或许重大发现就在你的眼前"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: A 毕竟是 A · 经过……，……逐渐…… · 或许……就在你的眼前."}]},"w5":["发明","发现","偶然","技术","科学家","影响","观察","研究","改变","推广","奇迹","逐渐","改进","成熟","或许","毕竟","试验","重大","意识","艰苦","显示","始终","播放"],"step_names":["① 点题","② 过程","③ 影响","④ 启发"],"timer":[["① 15s",15],["② 40s",40],["③ 15s",15],["④ 20s",20]],"build_title":"选一个发明，拼出你的介绍","build_lead":"Chọn phát minh, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 电影":[["历史上有很多伟大的发明，有些是在生活中无意间发现的，电影就是这样。","你知道电影是怎么来的吗？它竟然来自一场关于马蹄的争论。"],["摄影师用24个照相机拍下了马奔跑的样子，后来有人无意识地快速拉动那一长串相片，“奇迹”出现了：马好像活了。","两个人围绕马蹄是否着地各执一词，谁也说服不了谁，于是请摄影师用照相机来判断。"],["经过艰苦的试验，电影拍摄技术逐渐成熟，如今已经成了人们生活中不可缺少的一部分。","1895年，卢米埃尔兄弟第一次向公众播放了电影，这一天成了电影的纪念日。"],["这个故事告诉我们：留心生活的每一瞬间，或许重大发现就在你的眼前。","所以，我们要多观察、多思考，敢于为问题争论。"]],"B · 青霉素":[["说到日常生活中的大发现，我首先想到的是青霉素。","有些伟大的发现，其实来自一次小小的“粗心”。"],["1928年，英国科学家弗莱明发现，一个忘了洗的培养皿长了霉，霉的周围细菌都死了。","科学家毕竟是科学家，他马上意识到这个发现很重要，并开始认真研究。"],["经过很多人艰苦的研究，青霉素的生产技术逐渐成熟，救了无数人的生命。","青霉素对人类产生了重大的影响，被称为二十世纪最伟大的发现之一。"],["这个故事让我明白了，伟大的发现就藏在生活的小细节里。","留心生活的每一瞬间，或许重大发现就在你的眼前。"]],"C · 方便面":[["我觉得方便面是一个很重要的发明。","对学生来说，最“伟大”的发明或许是方便面。"],["它出现于二十世纪五十年代，用开水泡三分钟就能吃。","发明方便面的人看到很多人排长队吃面，就想发明一种在家里很快就能吃的面。"],["后来，方便面的生产技术逐渐改进，味道也越来越多，如今已经走进了千家万户。","它给忙碌的人们带来了很大的方便，也推广到了全世界。"],["从方便面的发明中我想到，留心生活中的需要，就能找到发明的机会。","所以我认为，很多大发明其实就来自日常生活。"]]},"quiz":[["“青霉素”应该说：",["弗莱明发明了青霉素。","弗莱明发现了青霉素。"],1,"Penicillin vốn có trong tự nhiên → 发现."],["Câu nào hợp làm câu mở bài?",["发明有很多很多，我都很喜欢。","历史上有很多伟大的发明，有些是在生活中无意间发现的。"],1,"Câu 2 có ý, dẫn vào đề."],["Câu nào kể quá trình tốt hơn?",["电影很重要。","有人无意识地快速拉动那一长串相片，“奇迹”出现了。"],1,"Có chi tiết cụ thể, sinh động."],["Câu nào dùng 逐渐 đúng?",["电影拍摄技术逐渐改进、成熟。","电影拍摄技术逐渐一下子成熟了。"],0,"逐渐 mâu thuẫn với 一下子."],["Câu nào dùng 毕竟 đúng?",["科学家毕竟是科学家，他马上意识到了。","毕竟科学家是不是科学家？"],0,"A 毕竟是 A, câu trần thuật."],["Câu kết nào tốt hơn?",["这就是电影。","留心生活的每一瞬间，或许重大发现就在你的眼前。"],1,"Câu kết nêu bài học."]],"fix":[["弗莱明发明了青霉素。","弗莱明发现了青霉素。","Thứ vốn có trong tự nhiên dùng 发现."],["电影给我们的生活带来了很大方便的。","电影给我们的生活带来了很大的方便。","Định ngữ cần 的, bỏ 的 thừa cuối câu."],["经过艰苦的试验，电影技术逐渐逐渐成熟。","经过艰苦的试验，电影技术逐渐成熟。","逐渐 không lặp lại."],["这个发明对我们的生活影响很重大。","这个发明对我们的生活产生了重大的影响。","重大 thường làm định ngữ: 重大的影响／发现."],["或者重大发现就在你的眼前。","或许重大发现就在你的眼前。","Phỏng đoán dùng 或许, không phải 或者."],["方便面出现在于二十世纪五十年代。","方便面出现于二十世纪五十年代。","出现于 = 出现在, không dùng cả hai."]],"tpl":"日常生活中的大发现或发明\n历史上有很多伟大的发明，【……】。【谁、什么时候】，【无意间发现】，“奇迹”出现了。经过【……】，【逐渐……】。如今，【影响】。这个故事告诉我们，【启发】。","chk":[["topic","Bám đề: có 发明 hoặc 发现","发明|发现"],["process","Có quá trình (经过 · 后来 · 无意 · 偶然)","经过|后来|无意|偶然|起初"],["effect","Có ảnh hưởng (如今 · 影响 · 带来 · 改变)","如今|影响|带来|改变|生命"],["lesson","Có bài học (告诉我们 · 明白 · 想到 · 或许)","告诉我们|明白|想到|或许|留心"],["words","Dùng từ bài 10 (逐渐 · 毕竟 · 奇迹 · 试验)","逐渐|毕竟|奇迹|试验|成熟|改进"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> một phát minh/phát hiện cụ thể, quá trình ra đời, ảnh hưởng và một câu bài học. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“介绍发明／事物”的题目都可以这样写","var_lead":"Đề giới thiệu một sự vật / phát minh đều dùng khung: <b>giới thiệu → quá trình ra đời → ảnh hưởng → bài học<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）日常生活中的大发现或发明","历史上有很多伟大的发明……"],["请介绍中国古代的一项发明。","造纸术是中国古代的四大发明之一……"],["你觉得哪项发明最改变了人们的生活？","我觉得最改变人们生活的发明是……"],["请以“如果没有手机”为题写一段话。","如果没有手机，我们的生活会……"],["介绍一个你身边的“小发明”。","我的爷爷是个爱动脑筋的人，他曾经……"],["谈谈“争论”的好处。","很多人害怕争论，可是课文中的一场争论却……"]],"homework":"<b>Bài về nhà:<\/b> chọn một phát minh (A–C hoặc tự chọn) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “日常生活中的大发现或发明” · bắt buộc có quá trình, ảnh hưởng, bài học và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";

var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}

(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();

var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}

  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}

}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}

/* ---------- generic MC ---------- */
function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
    b.addEventListener("click",function(){if(q.classList.contains("done"))return;q.classList.add("done");
      $$(".op",q).forEach(function(x,j){if(j===ans)x.classList.add("ok");else if(j===i)x.classList.add("no");});
      if(score)score.hit(i===ans);});ops.appendChild(b);});
  q.appendChild(ops);if(ex)q.appendChild(el("div",{class:"ex"},"💡 "+ex));if(score)score.add();return q;}
function scoreBar(parent,label,onReset,zh){var r=el("div",{class:"row",style:"margin:8px 0 14px"});var s=el("span",{class:"score"});r.appendChild(s);

function reveal(label,answer,cls){var b=el("button",{class:"rv"+(cls?" "+cls:""),type:"button"},label);b.addEventListener("click",function(){if(b.classList.contains("shown")){b.innerHTML=label;b.classList.remove("shown");}else{b.innerHTML=answer;b.classList.add("shown");}});return b;}
/* ---------- modal framework ---------- */
var MODALS={};
function modal(key,no,title,tabs){
  var m=el("div",{class:"modal",id:"m-"+key,role:"dialog","aria-modal":"true"});
  var p=el("div",{class:"panel"});var hd=el("div",{class:"mhead"});

  var tb=el("div",{class:"tabs"});hd.appendChild(tb);p.appendChild(hd);
  var body=el("div",{class:"mbody"});p.appendChild(body);m.appendChild(p);document.body.appendChild(m);
  m.addEventListener("click",function(e){if(e.target===m)closeModal(m);});
  var secs=[];
  tabs.forEach(function(t,i){var b=el("button",{class:"tab",type:"button"},t);b.addEventListener("click",function(){showTab(i);});tb.appendChild(b);var s=el("div",{class:"sec"});body.appendChild(s);secs.push(s);});
  function showTab(i){$$(".tab",tb).forEach(function(b,j){b.classList.toggle("on",i===j);});secs.forEach(function(s,j){s.classList.toggle("on",i===j);});body.scrollTop=0;}
  showTab(0);if(tabs.length<2)tb.style.display="none";
  MODALS[key]={m:m,secs:secs,show:showTab};return MODALS[key];}

function linkVocab(text){var out="",i=0;while(i<text.length){var hit=null;for(var k=0;k<VORDER.length;k++){var w=VORDER[k].hz;if(text.substr(i,w.length)===w){hit=VORDER[k];break;}}

function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
  while(i<text.length){var g=null;for(var k=0;k<goods.length;k++){if(text.substr(i,goods[k].zh.length)===goods[k].zh){g=goods[k];break;}}

    var j=text.length;goods.forEach(function(gg){var p=text.indexOf(gg.zh,i);if(p>=0&&p<j)j=p;});
