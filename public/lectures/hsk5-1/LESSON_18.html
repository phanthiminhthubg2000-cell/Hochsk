<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 18 · 抽象艺术美不美？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

ổ nước ra bàn.",["洒水","洒上颜料"],""],["极其","jíqí","副","vô cùng, hết sức",1,"非常（书面语，多修饰双音节形容词）。","……在有人看来极其神秘甚至丑陋……","在中国，餐桌上放一把刀是极其少见的现象。","Ở Trung Quốc, đặt một con dao trên bàn ăn là điều cực kỳ hiếm thấy.",["极其神秘","极其重要"],"见“注释”：极其。辨析：极其—非常。见“辨析”部分。"],["神秘","shénmì","形","thần bí, huyền bí",0,"使人捉摸不透的；高深莫测的。","……在有人看来极其神秘甚至丑陋……","这个地方有一种神秘的感觉。","Nơi này có một cảm giác huyền bí.",["神秘的人","极其神秘"],""],["丑","chǒu","形","xấu xí",0,"相貌或样子难看。也说“丑陋”。","……在有人看来极其神秘甚至丑陋……","我觉得这件衣服有点儿丑。","Tôi thấy chiếc áo này hơi xấu.",["丑陋","长得丑"],""],["自由","zìyóu","名／形","sự tự do; tự do",1,"在法律规定的范围内随自己意志活动的权利；不受拘束。","……有人却从中感受到对自由、对生命的赞美。","大学生活比中学自由多了。","Cuộc sống đại học tự do hơn cấp ba nhiều.",["自由时间","追求自由"],""],["设计","shèjì","动／名","thiết kế; bản thiết kế",1,"在做某项工作之前根据一定的目的要求，预先制定方法、图样等。","研究者设计了一个有趣的实验。","这是我新设计的作品，请您过目。","Đây là tác phẩm tôi mới thiết kế, mời ông xem qua.",["设计图","设计作品","设计方案"],""],["组","zǔ","名／量","tổ, nhóm",0,"由不多的人员组织成的单位；量词，用于成组的事物。","……每个人会看到两两一组出现的一些图画……","我们班分成了四个组。","Lớp chúng tôi chia thành bốn nhóm.",["一组学生","一组照片","两两一组"],""],["幅","fú","量","bức, tấm (tranh, vải)",1,"用于布帛、呢绒、图画等。","……每组中一幅出自著名抽象艺术家之手……","书房的墙上挂着一幅静物画。","Trên tường phòng sách treo một bức tranh tĩnh vật.",["一幅画","一幅作品"],""],["出自","chūzì","动","xuất phát từ, đến từ",0,"从……出来；来源于。","……每组中一幅出自著名抽象艺术家之手……","这句话出自《论语》。","Câu này xuất phát từ “Luận ngữ”.",["出自……之手"],""],["业余","yèyú","形","nghiệp dư",1,"工作时间以外的；非专业的。","……另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","我们只是一支业余的乐队，不够专业水平。","Chúng tôi chỉ là một ban nhạc nghiệp dư, chưa đủ trình độ chuyên nghiệp.",["业余时间","业余爱好","业余水平"],""],["婴儿","yīng'ér","名","trẻ sơ sinh",0,"不满一岁的小孩儿。","……另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","婴儿每天要睡很长时间。","Trẻ sơ sinh mỗi ngày ngủ rất lâu.",[],""],["猩猩","xīngxing","名","(con) đười ươi, tinh tinh",0,"一种和人类很接近的动物。","……另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","动物园里的大猩猩很聪明。","Con khỉ đột trong sở thú rất thông minh.",["黑猩猩"],""],["涂鸦","túyā","动","vẽ/viết nguệch ngoạc",0,"随便地乱写乱画。","……另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。","墙上有很多孩子的涂鸦。","Trên tường có nhiều hình vẽ nguệch ngoạc của trẻ con.",["随手涂鸦"],""],["签","qiān","动","ký tên",0,"写上自己的名字或画上记号。","其中三分之一的画作作者没有签名，而其余的则标明了身份。","请在这里签上你的名字。","Xin ký tên bạn vào đây.",["签名","签字"],""],["其余","qíyú","代","cái còn lại, những cái khác",1,"剩下的；另外的。","其中三分之一的画作作者没有签名，而其余的则标明了身份。","怎么只有你们两个人？其余的同学呢？","Sao chỉ có hai bạn? Các bạn còn lại đâu?",["其余的人"],"见“注释”：其余。"],["身份","shēnfèn","名","thân phận, địa vị",0,"人在社会上或法律上的地位、资格。","其中三分之一的画作作者没有签名，而其余的则标明了身份。","他的真实身份是一名警察。","Thân phận thật của anh ấy là cảnh sát.",["身份证","标明身份"],""],["确认","quèrèn","动","xác nhận",1,"明确承认（事实、原则等）。","……志愿者无法确认作者到底是谁……","请再确认一下航班的时间。","Xin xác nhận lại giờ chuyến bay.",["确认身份","确认时间"],""],["随手","suíshǒu","副","tiện tay, thuận tay",0,"顺手，顺便。","……所以有可能志愿者认为自己看到的是黑猩猩的随手涂鸦……","可能出门时我随手把钥匙放在门口的桌子上了。","Có lẽ lúc ra cửa tôi tiện tay để chìa khóa trên bàn chỗ cửa.",["随手关门","随手涂鸦"],"辨析：随手—随便。见“辨析”部分。"],["分辨","fēnbiàn","动","phân biệt",0,"辨别。","也许有人认为，在这种情况下根本不可能分辨出来。","这两种颜色太像了，我分辨不出来。","Hai màu này giống quá, tôi không phân biệt được.",["分辨出来","分辨不清"],""],["挥","huī","动","vẫy, múa, vung",0,"舞动（手臂、手里拿的东西）。","然而在每一次测试中，志愿者普遍更喜欢的作品都是由人类艺术家挥笔完成的。","他向我们挥了挥手。","Anh ấy vẫy tay với chúng tôi.",["挥手","挥笔"],""],["可见","kějiàn","连","có thể thấy rõ",1,"可以看出，可以想见（承接上文，表示可以作出判断）。","由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","他已经住院好几天了，一直诊断不出是什么问题，可见情况不太好。","Anh ấy nằm viện mấy hôm rồi mà vẫn chưa chẩn đoán ra bệnh gì, đủ thấy tình hình không tốt lắm.",["由此可见"],"见“注释”：可见。"],["哪怕","nǎpà","连","dù cho, cho dù",1,"表示假设兼让步（多用于口语），常与“也、都”配合。","由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","哪怕熬夜，我今天也得把这个计划做完。","Dù phải thức đêm, hôm nay tôi cũng phải làm xong kế hoạch này.",["哪怕……也……"],"“哪怕”和“即使”意思差不多，“哪怕”多用于口语。"],["元素","yuánsù","名","yếu tố, nguyên tố",0,"构成事物的基本单位；化学元素。","……志愿者同时欣赏原作和画面元素被调整后的画作……","这件衣服加入了很多中国传统元素。","Chiếc áo này thêm nhiều yếu tố truyền thống Trung Quốc.",["画面元素","中国元素"],""],["调整","tiáozhěng","动／名","điều chỉnh; sự điều chỉnh",1,"改变原有的情况，使适应客观环境和要求。","……志愿者同时欣赏原作和画面元素被调整后的画作……","因为销售情况不太好，我们正准备调整产品价格。","Vì tình hình bán hàng không tốt, chúng tôi đang chuẩn bị điều chỉnh giá sản phẩm.",["调整时间","调整价格","调整计划","调整结构"],""],["位置","wèizhì","名","vị trí",0,"所在或所占的地方。","研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","请回到自己的位置上。","Xin về chỗ của mình.",["位置变化","重要的位置"],""],["含意","hányì","名","hàm ý, ẩn ý",0,"（诗文、词语、说话等）里面包含的意思。","研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","这句话的含意很深。","Hàm ý câu nói này rất sâu.",["深刻的含意"],""],["区域","qūyù","名","khu vực, vùng",0,"地区范围。","研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","这个区域不允许停车。","Khu vực này không được đỗ xe.",["大脑区域"],""],["活跃","huóyuè","形／动","sinh động, sôi nổi; làm sôi nổi",1,"行动积极，气氛热烈；使活跃。","研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。","每次晚会他都是主持人，要靠他来活跃气氛。","Buổi tối nào anh ấy cũng là người dẫn, phải nhờ anh ấy khuấy động không khí.",["活跃气氛","活跃市场","活跃经济"],""],["布局","bùjú","名","bố cục",0,"对事物的结构、格局进行全面安排；指安排的结果。","……我们的大脑注意到了原作的布局……","这幅画的布局很好。","Bố cục bức tranh này rất tốt.",["画面布局","城市布局"],""],["事实","shìshí","名","sự thật",1,"事情的真实情况。","……即使我们还没有清楚地感受到这个事实。","我认为你们其实忽略了一个十分重要的事实。","Tôi cho rằng các bạn thực ra đã bỏ qua một sự thật rất quan trọng.",["事实上","忽略事实"],"辨析：事实—实际。见“辨析”部分。"],["目前","mùqián","名","hiện nay",1,"指说话的时候。","至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","到目前为止，事情还没有变化。","Đến nay, sự việc vẫn chưa có thay đổi.",["到目前为止"],"辨析：目前—现在。见“辨析”部分。"],["证据","zhèngjù","名","chứng cứ, bằng chứng",1,"能够证明某事物的真实性的有关事实或材料。","至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","如果没有可靠的证据，你就不能这么说。","Nếu không có bằng chứng đáng tin, bạn không thể nói vậy.",["可靠的证据","找到证据"],""],["话题","huàtí","名","chủ đề, đề tài",0,"谈话的中心。","我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。","我们换个话题吧。","Chúng ta đổi chủ đề đi.",["有趣的话题","热门话题"],""]],"WARM":[{"tab":"抽象与古典","title":"哪一幅是抽象艺术的作品，哪一幅是古典艺术的作品？","type":"discuss","q":"（图1：一幅由各种颜色的方块和线条组成的画，看不出画的是什么；图2：一幅黑白的人物画像，画得非常真实。）说一说哪一幅是抽象艺术的作品，哪一幅是古典艺术的作品。你对它们有什么评价？","vn":"(Hình 1: tranh gồm các mảng màu, đường nét, không nhận ra vẽ gì; Hình 2: tranh chân dung đen trắng rất chân thực.) Tranh nào là nghệ thuật trừu tượng, tranh nào là cổ điển? Bạn đánh giá thế nào?","answer_zh":"第一幅是抽象艺术的作品，画上都是不规则的色块和线条，我看不出画的是什么，但是颜色很活跃。第二幅是古典艺术的作品，人物画得非常真实，我更容易欣赏。","answer_vn":"Từ hữu ích: 抽象 (trừu tượng), 古典 (cổ điển), 色块 (mảng màu), 线条 (đường nét), 真实 (chân thực), 欣赏 (thưởng thức)."},{"tab":"你喜欢的艺术家","title":"你最喜欢你们国家的哪位著名艺术家？","type":"discuss","q":"你最喜欢你们国家的哪位著名艺术家？他/她有什么代表作品？请给老师和同学们讲一讲。","vn":"Bạn thích nhất nghệ sĩ nổi tiếng nào của nước mình? Tác phẩm tiêu biểu của họ là gì?","answer_zh":"我最喜欢越南画家裴春派，他的代表作品是一系列关于河内老街的画。他画的老房子和小街非常有特点，人们把这些画叫作“派街”。","answer_vn":"Ví dụ: họa sĩ Bùi Xuân Phái với loạt tranh phố cổ Hà Nội (“phố Phái”); nhạc sĩ Trịnh Công Sơn…"},{"tab":"猜一猜","title":"你能分辨出名画和孩子的画吗？","type":"discuss","q":"如果把一幅著名抽象画家的作品和一个孩子的随手涂鸦放在一起，你觉得自己能分辨出来吗？","vn":"Nếu đặt tranh của danh họa trừu tượng cạnh một bức vẽ nguệch ngoạc của trẻ con, bạn có phân biệt được không?","answer_zh":"我觉得很难分辨，因为抽象画看起来都像是随便画的。不过也许仔细看的话，能感觉到大画家的画更有布局。","answer_vn":"Câu hỏi dẫn vào bài khóa: một thí nghiệm cho thấy người xem thường vẫn thích tranh của nghệ sĩ hơn."}],"GAME":{"fill":[["抽象艺术没有古典艺术那么容易{}……","欣赏",["欣赏","观赏","奖赏","赞赏"]],["画布上那些不{}的色块、线条……","规则",["规则","规定","规律","原则"]],["在有人看来{}神秘甚至丑陋……","极其",["极其","其实","尤其","其他"]],["研究者{}了一个有趣的实验。","设计",["设计","计划","统计","估计"]],["另一幅是{}爱好者、婴儿、黑猩猩或者大象的涂鸦。","业余",["业余","其余","多余","剩余"]],["而{}的则标明了身份。","其余",["其余","其中","其次","业余"]],["志愿者无法{}作者到底是谁……","确认",["确认","确定","认识","承认"]],["{}，志愿者能够从画作中感知艺术家的用心……","由此可见",["由此可见","由此看来地","可想而知","显而易见地"]],["大脑中有关含意和解释的区域{}性下降了。","活跃",["活跃","活动","生活","灵活"]],["没有{}表明黑猩猩或儿童可以这样做。","证据",["证据","根据","证明","依据"]]],"order":[["研究者|设计了|一个有趣的|实验。"],["志愿者的任务|很|简单。"],["一些签名|被故意|弄错了。"],["几乎每个人|都更喜欢|原作。"],["我们的大脑|注意到了|原作的|布局。"],["这既是|挑战，|也是|自由。"]]},"GOOD":[{"zh":"对有些人来说，抽象艺术没有古典艺术那么容易欣赏","vn":"với một số người, nghệ thuật trừu tượng không dễ thưởng thức như nghệ thuật cổ điển","why":"<b>对……来说，A 没有 B 那么……<\/b>: so sánh kém kèm phạm vi đối tượng — mở bài nhẹ nhàng, khách quan.","frame":"对 + 某些人 + 来说，A 没有 B 那么 + 形容词","apply":"对很多外国人来说，京剧没有电影那么容易看懂。","apply_vn":"Với nhiều người nước ngoài, kinh kịch không dễ hiểu như phim ảnh."},{"zh":"在有人看来极其神秘甚至丑陋，有人却从中感受到对自由、对生命的赞美","vn":"có người thấy cực kỳ huyền bí thậm chí xấu xí, có người lại cảm nhận được lời ca ngợi tự do, sự sống","why":"Hai cách nhìn đối lập: <b>在有人看来……，有人却……<\/b> — rất hợp để mở bài nghị luận về nghệ thuật, quan điểm.","frame":"A，在有人看来……，有人却……","apply":"流行音乐，在有人看来太吵了，有人却从中感受到了青春的活力。","apply_vn":"Nhạc pop, có người thấy quá ồn ào, có người lại cảm nhận được sức sống tuổi trẻ."},{"zh":"由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因","vn":"từ đó có thể thấy, người tình nguyện cảm nhận được tâm huyết của nghệ sĩ qua tranh, dù họ không giải thích được nguyên nhân","why":"Câu kết luận sau ví dụ: <b>由此可见，……，哪怕……<\/b> (可见 · 注释) — dùng để rút ra nhận định.","frame":"由此可见，+ 结论，哪怕 + 让步情况","apply":"由此可见，好的音乐能打动每一个人，哪怕听不懂歌词。","apply_vn":"Từ đó có thể thấy, âm nhạc hay có thể lay động mọi người, dù không hiểu lời."},{"zh":"我们的大脑注意到了原作的布局，并且可以感知其背后的用意，即使我们还没有清楚地感受到这个事实","vn":"não chúng ta đã nhận ra bố cục của bản gốc và cảm nhận được ý đồ phía sau, dù ta chưa ý thức rõ sự thật này","why":"<b>A……，并且……，即使……<\/b>: nối hai hành động rồi thêm điều kiện nhượng bộ — câu dài, chặt chẽ.","frame":"A + V1……，并且可以 + V2……，即使……","apply":"孩子能感觉到父母的爱，并且可以学会去爱别人，即使父母从来不说“我爱你”。","apply_vn":"Trẻ cảm nhận được tình yêu của cha mẹ và học được cách yêu thương người khác, dù cha mẹ chưa từng nói “con yêu”."},{"zh":"每个人对抽象艺术可以有不同的解读，这既是挑战，也是自由","vn":"mỗi người có thể có cách hiểu khác nhau về nghệ thuật trừu tượng, điều đó vừa là thách thức, vừa là tự do","why":"Câu kết giàu ý nghĩa: <b>每个人对……可以有不同的……，这既是……，也是……<\/b>.","frame":"每个人对 A 可以有不同的……，这既是……，也是……","apply":"每个人对成功可以有不同的理解，这既是选择，也是自由。","apply_vn":"Mỗi người có thể hiểu thành công theo cách riêng, điều đó vừa là lựa chọn, vừa là tự do."}],"GRAMMAR":[{"word":"极其","py":"jíqí","pos":"副词","forms":["极其 + 双音节／多音节形容词或动词（= 非常，书面语）"],"vn":"<b>极其<\/b> là phó từ: <b>vô cùng, hết sức<\/b> (= 非常), dùng trong <b>văn viết<\/b>, và <b>chỉ bổ nghĩa cho từ hai âm tiết trở lên<\/b>: 极其神秘、极其重要、极其糟糕. Không nói “极其好”, “极其丑”.","text":"抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋……","ex":[["在中国，餐桌上放一把刀是极其少见的现象。","Ở Trung Quốc, đặt một con dao trên bàn ăn là điều cực kỳ hiếm thấy."],["每天说“太糟糕了”“太讨厌了”“真倒霉”的人，遇到的困难也格外多，运气也显得极其糟糕。","Người ngày nào cũng than “tệ quá”, “ghét quá”, “xui thật” thường gặp nhiều khó khăn hơn, vận may cũng cực kỳ tệ."],["这个决定对公司来说极其重要。","Quyết định này cực kỳ quan trọng với công ty."]],"err":[["❌ 他长得极其高。","✅ 他长得非常高。","极其 không bổ nghĩa cho từ một âm tiết."],["❌ 极其极其重要。","✅ 非常非常重要。／极其重要。","极其 không lặp lại."]],"book":[["这个项目是我们用了三年时间才谈下来的，____________。（极其）","Gợi ý: cực kỳ quan trọng với công ty.","这个项目是我们用了三年时间才谈下来的，对公司来说极其重要"],["____________，谁也不说话。（极其）","Gợi ý: không khí cực kỳ căng thẳng.","会议室里的气氛极其紧张，谁也不说话"],["A：你知道孔子吗？<br>B：____________。（极其）","Gợi ý: ông là người cực kỳ nổi tiếng trong lịch sử Trung Quốc.","知道，他是中国历史上极其著名的思想家和教育家"]],"drill":[["选择：那个人长得____丑。",["非常","极其"],0,"丑 là một âm tiết → 非常 (课本练习2)."],["“极其”放在哪里？ 我<u>A<\/u>对这个人<u>B<\/u>欣赏，我<u>C<\/u>认为他<u>D<\/u>很有才华。",["A","B","C"],1,"我对这个人极其欣赏 (课本练习3)."],["Câu nào đúng?",["这个问题极其复杂。","这个问题极其难。","这个问题极其极其复杂。"],0,"极其 + từ hai âm tiết."]]},{"word":"其余","py":"qíyú","pos":"代词","forms":["其余（的）+ 名词：其余的同学","……，其余（的）都／则……（剩下的、另外的部分）"],"vn":"<b>其余<\/b> là đại từ: <b>phần còn lại, những cái khác<\/b> (剩下的、另外的). Thường đứng đầu vế sau, sau khi đã nói về một phần: 其中三分之一……，而其余的则…….","text":"其中三分之一的画作作者没有签名，而其余的则标明了身份。","ex":[["怎么只有你们两个人？其余的同学呢？","Sao chỉ có hai bạn? Các bạn còn lại đâu?"],["只有一个房间亮着灯，其余窗户都是黑的。","Chỉ có một phòng sáng đèn, các cửa sổ khác đều tối."],["我只认识这两个字，其余都不认识。","Tôi chỉ biết hai chữ này, còn lại đều không biết."]],"err":[["❌ 其余我只认识这两个字。","✅ 我只认识这两个字，其余都不认识。","其余 đứng sau phần đã nhắc tới."],["❌ 其余的同学们们","✅ 其余的同学","Không lặp 们."]],"book":[["A：这些行李怎么拿？<br>B：____________。（其余）","Gợi ý: tôi xách cái lớn, còn lại bạn cầm.","我拿这个大的，其余的你拿吧"],["A：你看过哪些中国的传统体育表演？<br>B：____________。（其余）","Gợi ý: chỉ xem võ thuật, còn lại chưa xem.","我只看过武术表演，其余的都没看过"],["你们几个负责新产品的宣传，____________。（其余）","Gợi ý: những người còn lại phụ trách bán hàng.","你们几个负责新产品的宣传，其余的人负责销售"]],"drill":[["“其余”放在哪里？ 我只认识<u>A<\/u>这<u>B<\/u>两个字，<u>C<\/u>都不认识<u>D<\/u>。",["A","B","C"],2,"其余都不认识 (课本练习3)."],["“其余”的意思是：",["剩下的、另外的部分","全部","最重要的"],0,"Phần còn lại."],["选择：班里只有三个人去过中国，____都没去过。",["其余","其中","其实"],0,"Phần còn lại → 其余."]]},{"word":"可见","py":"kějiàn","pos":"连词","forms":["……，（由此）可见 + 判断（根据上文的情况做出判断）"],"vn":"<b>可见<\/b> là liên từ: <b>có thể thấy, đủ thấy<\/b> — dựa vào tình huống vừa nói để rút ra nhận định. Hay dùng <b>由此可见<\/b> (từ đó có thể thấy) ở đầu câu kết luận.","text":"由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。","ex":[["他已经住院好几天了，一直诊断不出是什么问题，可见情况不太好。","Anh ấy nằm viện mấy hôm rồi mà chưa chẩn đoán ra bệnh, đủ thấy tình hình không tốt."],["汉语中有个成语叫“自知之明”，把“自知”称为“明”，可见“自知”是一种智慧。","Tiếng Trung có thành ngữ “tự tri chi minh”, gọi việc tự biết mình là “minh”, đủ thấy tự biết mình là một trí tuệ."],["他每天都练习到很晚，可见他非常想赢这场比赛。","Ngày nào anh ấy cũng tập đến khuya, đủ thấy anh ấy rất muốn thắng trận này."]],"err":[["❌ 可见他生病了，所以没来上课。","✅ 他今天没来上课，可见他生病了。","可见 đứng sau phần căn cứ, dẫn ra kết luận."],["❌ 由此看见，……","✅ 由此可见，……","Cấu trúc cố định: 由此可见."]],"book":[["连这么简单的题你都不会，____________。（可见）","Gợi ý: đủ thấy bạn không ôn bài.","连这么简单的题你都不会，可见你根本没有好好复习"],["A：你觉得周末的活动他会参加吗？<br>B：____________。（可见）","Gợi ý: anh ấy hỏi thời gian mấy lần, đủ thấy rất muốn đi.","他已经问了我好几次活动的时间，可见他很想参加"],["A：____________。（可见）<br>B：是啊，我也觉得他很孝敬父母。","Gợi ý: cuối tuần nào cũng về thăm bố mẹ.","他每个周末都回家看父母，可见他是一个孝顺的孩子"]],"drill":[["“由此可见”一般放在：",["结论的前面","例子的前面","句子的最后"],0,"Dẫn ra kết luận."],["选择：他已经三天没吃饭了，____他心里有多难过。",["可见","可是","可能"],0,"Rút ra nhận định → 可见."],["Câu nào đúng?",["大家都喜欢原作，可见大脑能感知布局。","可见大家都喜欢原作，大脑能感知布局。","大家都喜欢原作，可是见大脑能感知布局。"],0,"Căn cứ，可见 + kết luận."]]}],"HSK":{"r1":[{"text":["周末，我和朋友去美术馆看了一个抽象画展。说实话，{36}，画布上只有一些不规则的色块和线条。朋友却看得非常认真，他说：“{37}，你可以根据自己的感觉去理解。”听了他的话，我又仔细看了看，{38}，好像真的有点儿意思了。"],"qs":[{"n":36,"o":["我非常喜欢这些画","我一开始根本看不懂","这些画都是古典作品","门票太贵了"],"a":1,"why":"画布上只有不规则的色块和线条，所以看不懂。"},{"n":37,"o":["抽象画没有标准答案","这些画都是孩子画的","我们快走吧","这些画不值得看"],"a":0,"why":"后文“根据自己的感觉去理解”，说明没有标准答案。"},{"n":38,"o":["还是什么都看不出来","觉得越来越无聊","发现那些颜色很活跃","马上就离开了"],"a":2,"why":"后文“好像真的有点儿意思了”，说明有了新的发现。"}]},{"text":["很多人以为，抽象画谁都能画，{39}。但研究表明，事实并非如此。在一个实验中，研究者让志愿者在大师的作品和动物的涂鸦之间做选择，{40}，结果大多数人依然更喜欢大师的作品。另一个实验中，研究者调整了画面元素的位置，{41}。由此可见，抽象画并不是随便画的，{42}。"],"qs":[{"n":39,"o":["孩子随手涂鸦也差不多","只有大师才能画","需要学习很多年","比古典画难得多"],"a":0,"why":"“谁都能画”，所以孩子的涂鸦也差不多。"},{"n":40,"o":["每幅画都标明了作者","哪怕画上没有签名","大家都是画家","志愿者都很累"],"a":1,"why":"“哪怕……，结果……依然……”表示在不知道作者的情况下也能选出来。"},{"n":41,"o":["志愿者更喜欢调整后的画","志愿者分辨不出来","几乎每个人都更喜欢原作","画变得更漂亮了"],"a":2,"why":"与课文一致：几乎每个人都更喜欢原作。"},{"n":42,"o":["它的布局里有艺术家的用心","谁都可以随便画","它没有任何意义","只有专家才能欣赏"],"a":0,"why":"“由此可见”后是结论：布局中有艺术家的用心。"}]}],"r2":[{"start":46,"paras":["老师把他的画挂在了教室的墙上，还在旁边写上了他的名字。","小明从小就喜欢画画儿，可是他画的东西别人常常看不懂。","后来，小明成了一位有名的抽象派画家。","同学们都笑他画得丑，只有美术老师说他的画很有想象力。","他常说，是老师的那句话让他坚持了下来。"],"ans":["B","D","A","C","E"],"why":"喜欢画画儿但看不懂（B）→ 同学笑、老师鼓励（D）→ 老师挂画（A）→ 成了画家（C）→ 感谢老师（E）。"}],"r3":[{"text":["剪纸是中国最古老的民间艺术之一，已经有一千多年的历史了。人们用剪刀或刻刀在纸上剪出各种图案，用来装饰门窗、墙壁和灯笼。","剪纸的题材非常丰富，有花鸟、动物、人物，也有表示吉祥的文字，比如“福”字和“喜”字。每到春节，很多人家都会在窗户上贴上红色的窗花，看起来喜气洋洋的。","剪纸看起来简单，其实极其考验技术。<u><b>一幅好的剪纸作品，常常需要剪很多刀，哪怕剪错一刀，整幅作品就可能失败<\/b><\/u>。所以，剪纸艺术家不但要手巧，还要有耐心。","如今，剪纸已经成为一种世界闻名的艺术形式，不少外国留学生也开始学习剪纸。"],"qs":[{"n":56,"s":"关于剪纸，可以知道：","o":["只有一百年的历史","是中国古老的民间艺术","只用来装饰灯笼","必须用机器做"],"a":1,"why":"第一段：中国最古老的民间艺术之一。"},{"n":57,"s":"春节时人们在窗户上贴窗花，是为了：","o":["挡住阳光","让房间看起来喜气洋洋","练习技术","卖给外国人"],"a":1,"why":"第二段：看起来喜气洋洋的。"},{"n":58,"s":"画线句子主要说明剪纸：","o":["非常便宜","很考验技术","颜色很多","很容易学"],"a":1,"why":"画线句前面：其实极其考验技术。"},{"n":59,"s":"这篇文章最可能出自：","o":["一本介绍中国传统艺术的书","一份天气预报","一本数学书","一张菜单"],"a":0,"why":"全文介绍剪纸这种传统艺术。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小丽看画展的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện Tiểu Lệ đi xem triển lãm tranh.","panels":[["🖼️","小丽和朋友去美术馆看抽象画展。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk22648_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#cfe8ff\"/><stop offset=\ \"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#9b6bd6\"/><path d=\"M-14 -106 L-22 -66\" stroke=\"#9b6bd6\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-22\" cy=\"-66\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M-18 -132 q0 -20 18 -20 q18 0 18 20 l2 26 q-8 4 -14 0 l-4 -18 h-4 l-4 18 q-6 4 -14 0z\" fill=\"#3a2a22\"/><circle cx=\"-16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"-130\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -133 q2 -16 17 -16 q15 0 17 16 q-10 -6 -17 -9 q-6 6 -17 9z\" fill=\"#3a2a22\"/><circle cx=\"-5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-6 -125 q6 8 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><path d=\"M14 -106 L22 -96 L6 -118\" stroke=\"#9b6bd6\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"6\" cy=\"-118\" r=\"4\" fill=\"#f6d1b1\"/><\/g><g transform=\"translate(112.0,60.0)\"><g transform=\"translate(0.0,0.0) scale(0.7,0.7)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><g transform=\"translate(40.0,70.0)\"><g transform=\"translate(0.0,0.0) scale(0.5,0.5)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><g transform=\"translate(120.0,30.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><polygon points=\"0.0,-10.0 2.5,-3.4 9.5,-3.1 4.0,1.3 5.9,8.1 0.0,4.2 -5.9,8.1 -4.0,1.3 -9.5,-3.1 -2.5,-3.4\" fill=\"#f5b82e\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: đi xem → không hiểu → được hướng dẫn → dần thích.","Có thể dùng: 抽象、欣赏、规则、作品、极其、含意、自由."],"sample":"上个周末，小丽和朋友一起去美术馆看了一个抽象画展。一走进展厅，她就看到墙上挂着很多幅大画，画布上只有一些不规则的色块和线条。她看了半天，觉得这些作品极其神秘，根本不知道画的是什么。这时候，一位讲解员走过来告诉她，抽象画没有标准答案，每个人都可以根据自己的感觉去欣赏。听了这句话，小丽又仔细地看了很久，慢慢地感受到了画中活跃的颜色和自由的感觉。从那以后，她就喜欢上了抽象画。","svn":"Tiểu Lệ cùng bạn xem triển lãm tranh trừu tượng; thấy toàn mảng màu, đường nét không quy tắc, thấy cực kỳ khó hiểu; hướng dẫn viên bảo cứ cảm nhận theo cảm giác của mình; cô ngắm kỹ, dần cảm được màu sắc sinh động, tự do, và thích tranh trừu tượng."},"w72":{"prompt":"现在，很多传统艺术，比如京剧、剪纸等，喜欢的年轻人越来越少。你认为应该怎样保护和传承传统艺术？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Ngày nay nhiều nghệ thuật truyền thống như kinh kịch, cắt giấy… ngày càng ít người trẻ yêu thích. Theo bạn nên bảo vệ và truyền thừa nghệ thuật truyền thống thế nào? Viết bài không ít hơn 200 chữ.","min":200,"title":"怎样保护传统艺术","tips":["Hiện tượng → nguyên nhân → biện pháp 1 (giáo dục ở trường) → biện pháp 2 (kết hợp yếu tố hiện đại, mạng) → biện pháp 3 (chính phủ hỗ trợ nghệ nhân) → kết luận.","Dùng: 极其、其余、可见、哪怕、调整、元素."],"sample":"现在，很多传统艺术，比如京剧、剪纸等，喜欢的年轻人越来越少。在我看来，传统艺术是一个国家极其宝贵的财富，我们应该想办法保护它。\n为什么年轻人不喜欢传统艺术呢？我觉得主要是因为他们平常很少接触，觉得传统艺术离自己的生活太远。可见，让年轻人了解传统艺术是最重要的。\n首先，学校可以开设传统艺术课，让学生从小就有机会学习，哪怕只学一点儿，也能培养兴趣。其次，传统艺术也可以适当地调整，加入一些现代元素，比如在网上直播京剧表演，或者用剪纸设计新的产品。另外，政府也应该支持民间艺术家，让他们的技术能传下去。\n总之，保护传统艺术需要大家共同努力。","svn":"Nghị luận: hiện tượng → nghệ thuật truyền thống là tài sản quý → nguyên nhân: ít tiếp xúc → 首先 dạy ở trường → 其次 kết hợp yếu tố hiện đại → 另外 nhà nước hỗ trợ nghệ nhân → 总之 cần chung tay."}},"PRACTICE":{"ex1":{"bank":["幅","规则","活跃","调整","业余","证据"],"items":[["书房的墙上挂着一{}静物画。",["幅"]],["因为销售情况不太好，我们正准备{}产品价格。",["调整"]],["这块布上只有一些不{}的色块，我看不出来画的是什么。",["规则"]],["我们只是一支{}的乐队，不够专业水平。",["业余"]],["每次晚会他都是主持人，要靠他来{}气氛。",["活跃"]],["如果没有可靠的{}，你就不能这么说。",["证据"]]]},"ex2":[["那个人长得____丑。",["非常","极其"],0],["这次展览的作品分为三____，每组十幅。",["组","套"],0],["可能出门时我____把钥匙放在门口的桌子上了。",["随便","随手"],1],["我认为你们其实忽略了一个十分重要的____。",["事实","实际"],0]],"ex3":[["我<u>A<\/u>对这个人<u>B<\/u>欣赏，我<u>C<\/u>认为他<u>D<\/u>很有才华。","极其",1,"我对这个人极其欣赏，我认为他很有才华。"],["<u>A<\/u>这是我<u>B<\/u>新<u>C<\/u>的作品，请您过目<u>D<\/u>。","设计",2,"这是我新设计的作品，请您过目。"],["我只认识<u>A<\/u>这<u>B<\/u>两个字，<u>C<\/u>都不认识<u>D<\/u>。","其余",2,"我只认识这两个字，其余都不认识。"],["<u>A<\/u>熬夜<u>B<\/u>，我<u>C<\/u>今天<u>D<\/u>也得把这个计划做完。","哪怕",0,"哪怕熬夜，我今天也得把这个计划做完。"]],"ex4":[["开头","欣赏、规则、作品、极其、自由","对有些人来说，抽象艺术不容易欣赏，画上都是不规则的色块。抽象派的作品在有人看来极其神秘，有人却从中感受到对自由的赞美。"],["第一个实验","设计、组、幅、业余、其余、确认、可见","研究者设计了一个实验：每组两幅画，一幅是著名艺术家的，另一幅是业余爱好者或黑猩猩的。三分之一没有签名，其余的标明了身份，有些签名被弄错，志愿者无法确认作者。结果大家都更喜欢艺术家的作品，可见他们能感知艺术家的用心。"],["第二个实验","调整、位置、表明、目前","志愿者欣赏原作和被调整后的画，几乎都更喜欢原作。物体位置变化后，大脑有关区域活跃性下降，这表明大脑注意到了原作的布局。目前没有证据表明黑猩猩能这样做。"],["总结","话题、挑战","大脑如何感知抽象艺术是一个有趣的话题。每个人可以有不同的解读，这既是挑战，也是自由。"]],"ext":{"title":"扩展 · 话题：影视艺术","words":[["导演","dǎoyǎn","đạo diễn"],["角色","juésè","vai diễn"],["明星","míngxīng","ngôi sao"],["动画片","dònghuàpiàn","phim hoạt hình"],["娱乐","yúlè","giải trí"],["录音","lù yīn","thu âm"],["麦克风","màikèfēng","micro"],["频道","píndào","kênh"],["字幕","zìmù","phụ đề"],["乐器","yuèqì","nhạc cụ"],["美术","měishù","mỹ thuật"]],"items":[["在{}设备发明之前，没有人注意到你的声音在自己听来和别人听来是不一样的。","录音"],["主持人，你胸前的{}歪了，请调整一下。","麦克风"],["这个连续剧最近好几个{}都在放，你看了没有？","频道"],["除了钢琴，我没有学过别的{}。","乐器"]]}},"TEXT":[{"title":"抽象艺术","sub":"神秘还是丑陋？","paras":["对有些人来说，抽象艺术没有古典艺术那么容易欣赏，画布上那些不规则的色块、线条，实在看不出有什么意义。抽象派画家的作品中经常见到好像随便洒上颜料而形成的画作，在有人看来极其神秘甚至丑陋，有人却从中感受到对自由、对生命的赞美。"],"idea":"Với nhiều người, nghệ thuật <b>trừu tượng<\/b> không dễ thưởng thức như <b>cổ điển<\/b>: những mảng màu, đường nét <b>không theo quy tắc<\/b> chẳng thấy ý nghĩa gì. Nhiều bức như thể <b>vẩy màu tùy tiện<\/b> — có người thấy <b>cực kỳ huyền bí, thậm chí xấu xí<\/b>, có người lại cảm nhận được lời ca ngợi <b>tự do, sự sống<\/b>.","qs":[["对有些人来说，抽象艺术怎么样？",["比古典艺术容易欣赏","没有古典艺术那么容易欣赏","一点儿意义也没有"],1],["抽象派画家的作品经常是什么样的？",["好像随便洒上颜料而形成的","画得非常真实","只有黑白两种颜色"],0],["有人从抽象画中感受到了什么？",["对自由、对生命的赞美","很多钱","古典的美"],0]]},{"title":"第一个实验","sub":"大师还是黑猩猩？","paras":["研究者设计了一个有趣的实验。志愿者的任务很简单，每个人会看到两两一组出现的一些图画，每组中一幅出自著名抽象艺术家之手，另一幅是业余爱好者、婴儿、黑猩猩或者大象的涂鸦。志愿者必须判断每一组画作中自己更喜欢哪一幅。","其中三分之一的画作作者没有签名，而其余的则标明了身份。令人头疼的是，一些签名被故意弄错了，志愿者无法确认作者到底是谁，所以有可能志愿者认为自己看到的是黑猩猩的随手涂鸦，实际则是著名抽象艺术家的大作。","也许有人认为，在这种情况下根本不可能分辨出来。然而在每一次测试中，志愿者普遍更喜欢的作品都是由人类艺术家挥笔完成的。由此可见，志愿者能够从画作中感知艺术家的用心，哪怕他们不能够解释原因。"],"idea":"Thí nghiệm 1: mỗi nhóm hai bức — một của <b>danh họa trừu tượng<\/b>, một của <b>người nghiệp dư, em bé, tinh tinh hay voi<\/b>; người xem chọn bức mình thích. 1/3 tranh không ký tên, số còn lại có ghi tác giả nhưng <b>có chữ ký cố tình ghi sai<\/b>. Vậy mà lần nào người xem cũng <b>thích tranh của nghệ sĩ hơn<\/b> — chứng tỏ họ <b>cảm nhận được tâm huyết của nghệ sĩ<\/b>, dù không giải thích được.","qs":[["每组画中的另一幅可能是谁画的？",["另一位著名画家","业余爱好者、婴儿、黑猩猩或者大象","研究者自己"],1],["为什么志愿者无法确认作者是谁？",["画上没有颜色","一些签名被故意弄错了","画太小了"],1],["实验结果说明了什么？",["志愿者能感知艺术家的用心","志愿者更喜欢黑猩猩的画","抽象画没有意义"],0]]},{"title":"第二个实验","sub":"大脑注意到了布局","paras":["另一个实验是这样，志愿者同时欣赏原作和画面元素被调整后的画作，包括静物画和抽象画。结果，几乎每个人都更喜欢原作。研究者发现，当看到画上物体位置变化后，大脑中有关含意和解释的区域活跃性下降了。这表明，我们的大脑注意到了原作的布局，并且可以感知其背后的用意，即使我们还没有清楚地感受到这个事实。至少目前可以这么说，没有证据表明黑猩猩或儿童可以这样做。","我们的大脑究竟如何感知抽象艺术，是一个有趣的话题。每个人对抽象艺术可以有不同的解读，这既是挑战，也是自由。"],"idea":"Thí nghiệm 2: xem <b>bản gốc<\/b> và bản đã <b>điều chỉnh vị trí các yếu tố<\/b> (cả tranh tĩnh vật lẫn trừu tượng) — hầu như ai cũng thích bản gốc. Khi vị trí thay đổi, <b>vùng não liên quan đến hàm ý và giải thích<\/b> kém hoạt động hơn: não đã nhận ra <b>bố cục<\/b> của bản gốc và cảm nhận ý đồ phía sau. Mỗi người có cách hiểu riêng về nghệ thuật trừu tượng — vừa là <b>thách thức<\/b>, vừa là <b>tự do<\/b>.","qs":[["第二个实验中，志愿者更喜欢哪一种画？",["原作","被调整后的画作","都不喜欢"],0],["看到画上物体位置变化后，大脑中哪个区域的活跃性下降了？",["有关含意和解释的区域","有关声音的区域","有关运动的区域"],0],["作者认为对抽象艺术的不同解读是什么？",["一种错误","既是挑战，也是自由","没有意义的事"],1]]}],"TEXT_EXTRA":{"compare_title":"两个实验","compare_head":["","第一个实验","第二个实验"],"compare":[["看什么","两两一组：著名抽象艺术家的画 + 业余者、婴儿、黑猩猩或大象的涂鸦","原作 + 画面元素被调整后的画作"],["结果","志愿者普遍更喜欢人类艺术家的作品","几乎每个人都更喜欢原作"],["说明","能感知艺术家的用心","大脑注意到了原作的布局"]],"bg":"艺术是人类共同的爱好，它可以打破国家和语言的界限（jièxiàn），把人们联系在一起。艺术形式不是单一的，它包括很多不同的类型，如音乐、舞蹈（wǔdǎo）、美术、摄影、戏剧、影视甚至建筑等。每个国家都有自己独特的艺术形式，每个人也可能喜欢不同的艺术类型。很多外国留学生对中国的京剧、水墨画、剪纸等传统艺术产生了浓厚（nónghòu）的兴趣。你在生活中喜欢哪些艺术形式呢？","bg_vn":"Nghệ thuật là sở thích chung của nhân loại, vượt qua ranh giới quốc gia, ngôn ngữ. Có nhiều loại hình: âm nhạc, múa, mỹ thuật, nhiếp ảnh, kịch, điện ảnh, cả kiến trúc. Nhiều du học sinh rất hứng thú với kinh kịch, tranh thủy mặc, cắt giấy của Trung Quốc.","discuss_title":"话题讨论：艺术形式","discuss":["文章中说“每个人对抽象艺术可以有不同的解读”，你同意这种说法吗？","你对哪些艺术形式感兴趣？","请介绍一种你最喜欢的艺术，并说说喜欢的理由或你对它的看法。"],"write":"请以“我喜爱的艺术”为题，谈一谈你感兴趣的艺术形式。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我喜爱的艺术”为题，谈一谈你感兴趣的艺术形式","topic_vn":"Viết bài với đầu đề “Môn nghệ thuật tôi yêu thích”: nói về loại hình nghệ thuật bạn hứng thú","intro":"Dạng đề giới thiệu + lý do (介绍＋理由) · Loại hình nghệ thuật bạn thích → nó là gì, đặc điểm → vì sao thích (trải nghiệm) → cảm nhận / ý nghĩa · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我喜爱的艺术”：介绍 + 理由 + 感受","lead":"Đề yêu cầu <b>chọn MỘT loại hình nghệ thuật<\/b> (âm nhạc, hội họa, kinh kịch, cắt giấy, nhiếp ảnh, điện ảnh…), <b>giới thiệu<\/b> nó và <b>nói lý do yêu thích<\/b>, tốt nhất kèm <b>một trải nghiệm<\/b> của bản thân. Điểm cộng: liên hệ bài khóa — mỗi người có cách hiểu nghệ thuật khác nhau (这既是挑战，也是自由).","parts":[["我喜爱的","Ngôi thứ nhất, nói về sở thích thật của bạn — phải có lý do."],["艺术","Một loại hình cụ thể: 音乐、美术、京剧、剪纸、摄影、舞蹈、电影…"],["感兴趣的艺术形式","Giới thiệu ngắn: nó là gì, có đặc điểm gì."],["（课本）尽量用上本课所学的生词，不少于100字","Dùng: 欣赏、作品、抽象、古典、极其、自由、业余、设计、布局、可见、哪怕… và khung 好句 của bài khóa."]],"traps":[["Liệt kê nhiều loại hình","Chỉ chọn một, viết sâu."],["Chỉ nói “rất hay, rất đẹp”","Cần lý do cụ thể: âm thanh, màu sắc, bố cục, câu chuyện, cảm xúc…"],["Thiếu trải nghiệm","Thêm: lần đầu tiếp xúc, một tác phẩm đáng nhớ, việc bạn tự học…"],["Dùng sai 极其","极其 + từ hai âm tiết: 极其美丽 ✓, 极其美 ✗."]],"link":"<b>Liên hệ bài 18:<\/b> nghệ thuật trừu tượng — có người thấy <b>极其神秘甚至丑陋<\/b>, có người thấy <b>tự do, sự sống<\/b>; não bộ cảm nhận được <b>布局<\/b> và tâm huyết nghệ sĩ. Phần 背景: 艺术形式 gồm 音乐、舞蹈、美术、摄影、戏剧、影视、建筑; du học sinh thích 京剧、水墨画、剪纸."},"steps":[["①","点题","Mở bài: tôi thích loại hình nghệ thuật nào.","在所有的艺术形式中，我最喜爱的是……"],["②","介绍","Giới thiệu: nó là gì, đặc điểm.","……是一种……的艺术。"],["③","理由与经历","<b>Trọng tâm.<\/b> Vì sao thích + một trải nghiệm.","我喜欢它，是因为……"],["④","感受","Kết: ý nghĩa của nghệ thuật này với bạn.","对我来说，……"]],"formula":["我最喜爱的艺术是……","它是……的艺术","因为……；记得有一次……","感受：艺术给我……"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 中国剪纸","nghệ thuật truyền thống","Giới thiệu cắt giấy, lần đầu thử cắt chữ “福”, cảm nhận sự khéo léo.","极其考验技术"],["B · 抽象画","liên hệ bài khóa","Từ không hiểu đến yêu thích tranh trừu tượng.","从看不懂到喜欢"],["C · 音乐（钢琴）","sở thích cá nhân","Chơi đàn nghiệp dư, âm nhạc giúp thư giãn.","业余时间弹钢琴"],["D · 京剧","kinh kịch","Trang phục, mặt nạ (脸谱), giọng hát; lần đầu xem.","色彩极其鲜艳"]],"notes":[["Lý do cụ thể","Dùng: 我喜欢它，一是因为……，二是因为……"],["Một tác phẩm / trải nghiệm","记得第一次……的时候，……"],["Câu kết","Dùng ý bài khóa: 每个人对艺术可以有不同的理解，这既是挑战，也是自由。"]],"rule":"<b>Nguyên tắc HSK5:<\/b> đề “我喜爱的……” cần <b>giới thiệu → lý do → trải nghiệm → cảm nhận<\/b>; lý do phải cụ thể, có ví dụ.","patterns":[["① 点题","在所有的艺术形式中，我最喜爱的是中国的剪纸。","Trong mọi loại hình nghệ thuật, tôi yêu nhất cắt giấy Trung Quốc."],["① 点题","我的业余爱好很多，其中最让我着迷的是音乐。","Tôi có nhiều sở thích, mê nhất là âm nhạc."],["② 介绍","剪纸是中国最古老的民间艺术之一，人们用剪刀在红纸上剪出各种图案。","Cắt giấy là một trong những nghệ thuật dân gian lâu đời nhất của Trung Quốc."],["③ 理由","剪纸看起来简单，其实极其考验技术，哪怕剪错一刀，整幅作品就可能失败。","Nhìn đơn giản nhưng rất thử thách kỹ thuật, cắt sai một nhát là hỏng."],["③ 经历","记得第一次看抽象画展时，我觉得那些作品极其神秘，根本看不懂。","Nhớ lần đầu xem triển lãm tranh trừu tượng, tôi thấy chúng cực kỳ bí ẩn."],["④ 感受","对我来说，音乐不但能让我放松，还能让我感受到自由。","Với tôi, âm nhạc không chỉ giúp thư giãn mà còn cho cảm giác tự do."],["④ 课文","每个人对艺术可以有不同的解读，这既是挑战，也是自由。","Mỗi người hiểu nghệ thuật theo cách riêng — vừa là thách thức, vừa là tự do."]],"links":[["Mở bài",["在所有的艺术形式中，我最喜爱的是……","我的业余爱好很多，其中……","说到艺术，我首先想到的是……"]],["Giới thiệu",["……是一种……的艺术","……已经有……年的历史了","最有特点的是……"]],["Lý do",["我喜欢它，一是因为……，二是因为……","记得第一次……","哪怕……，我也……"]],["Cảm nhận",["对我来说，……","由此可见，……","……，这既是……，也是……"]]],"open":[["直接式","在所有的艺术形式中，我最喜爱的是中国的剪纸。"],["对比式","对很多人来说，抽象画没有古典画那么容易欣赏，可我却特别喜欢它。"],["经历式","第一次听到钢琴曲《梦中的婚礼》时，我就爱上了钢琴。"]],"close":[["课文式","每个人对艺术可以有不同的解读，这既是挑战，也是自由。"],["感受式","对我来说，艺术让平常的生活变得更美好。"],["愿望式","我希望以后能有更多的时间学习剪纸，把这门艺术介绍给我的朋友。"]],"from_text":[["对……来说，A 没有 B 那么……","对很多人来说，京剧没有电影那么容易看懂。","Lấy từ 好句 ①: so sánh."],["在有人看来……，有人却……","抽象画，在有人看来极其神秘，有人却从中感受到了自由。","Lấy từ 好句 ②: hai cách nhìn."],["由此可见，……，哪怕……","由此可见，好的音乐能打动每一个人，哪怕听不懂歌词。","Lấy từ 好句 ③: kết luận."],["……，并且……，即使……","剪纸艺术家能看出作品的布局，并且可以感知其中的含意，即使只看一眼。","Lấy từ 好句 ④: câu dài."],["每个人对……可以有不同的……，这既是……，也是……","每个人对艺术可以有不同的理解，这既是挑战，也是自由。","Lấy từ 好句 ⑤: câu kết."]],"vocab":[["剪纸","jiǎnzhǐ","cắt giấy","中国剪纸","idea"],["京剧","jīngjù","kinh kịch","看京剧","idea"],["水墨画","shuǐmòhuà","tranh thủy mặc","中国水墨画","idea"],["舞蹈","wǔdǎo","múa","民族舞蹈","idea"],["摄影","shèyǐng","nhiếp ảnh","摄影作品","idea"],["图案","tú'àn","họa tiết","剪出图案","idea"],["着迷","zháo mí","say mê","对音乐着迷","act"],["演奏","yǎnzòu","biểu diễn (nhạc cụ)","演奏钢琴","act"],["表演","biǎoyǎn","biểu diễn","京剧表演","act"],["创作","chuàngzuò","sáng tác","创作作品","act"],["放松","fàngsōng","thư giãn","让人放松","act"],["感受","gǎnshòu","cảm nhận","感受自由","act"],["欣赏","xīnshǎng","thưởng thức","欣赏作品","lesson"],["作品","zuòpǐn","tác phẩm","艺术作品","lesson"],["抽象","chōuxiàng","trừu tượng","抽象画","lesson"],["古典","gǔdiǎn","cổ điển","古典音乐","lesson"],["极其","jíqí","vô cùng","极其神秘","lesson"],["自由","zìyóu","tự do","感受到自由","lesson"],["业余","yèyú","nghiệp dư","业余爱好","lesson"],["布局","bùjú","bố cục","画面布局","lesson"],["赏心悦目","shǎng xīn yuè mù","đẹp mắt vui lòng","让人赏心悦目","bonus"],["栩栩如生","xǔxǔ rú shēng","sống động như thật","剪得栩栩如生","bonus"],["百看不厌","bǎi kàn bú yàn","xem trăm lần không chán","这幅画百看不厌","bonus"],["心灵手巧","xīn líng shǒu qiǎo","khéo tay sáng dạ","剪纸艺术家心灵手巧","bonus"]],"vgroups":[["idea","Loại hình"],["act","Hành động"],["lesson","Từ bài 18"],["bonus","加分 · thành ngữ"]],"legend":["① Mở bài","② Giới thiệu","③ Lý do – trải nghiệm","④ Cảm nhận"],"samples":{"speak":[{"who":"中国剪纸","meta":"Hướng A · bài nói ~1 phút 30","p":["在所有的艺术形式中，我最喜爱的是中国的剪纸。","剪纸是中国最古老的民间艺术之一，人们用剪刀在红纸上剪出花鸟、动物和“福”字等各种图案。每到春节，很多中国人家的窗户上都贴着红色的窗花，看起来喜气洋洋的。","我喜欢剪纸，一是因为它的图案栩栩如生，二是因为它极其考验技术。记得第一次跟老师学剪“福”字时，我剪了好几次都失败了，哪怕剪错一刀，整幅作品就不能用了。","对我来说，剪纸不但是一种艺术，还让我更了解了中国文化。"],"vi":"Trong mọi loại hình nghệ thuật, tôi yêu nhất cắt giấy Trung Quốc. Đó là nghệ thuật dân gian lâu đời, dùng kéo cắt hoa chim, con vật, chữ “Phúc” trên giấy đỏ; Tết đến nhà nào cũng dán hoa giấy đỏ lên cửa sổ, rất rộn ràng. Tôi thích vì họa tiết sống động và vì nó rất thử thách kỹ thuật: lần đầu học cắt chữ “Phúc” tôi hỏng mấy lần, sai một nhát là bỏ cả tác phẩm. Với tôi, cắt giấy còn giúp tôi hiểu văn hóa Trung Quốc hơn."},{"who":"从看不懂到喜欢：抽象画","meta":"Hướng B · bài nói ~1 phút 30","p":["对很多人来说，抽象画没有古典画那么容易欣赏，可我却特别喜欢它。","记得第一次看抽象画展时，我觉得那些作品极其神秘，画布上只有一些不规则的色块和线条，我根本看不懂。","后来我读了一篇文章，知道了大脑能注意到画的布局，感知艺术家的用心。从那以后，我开始用自己的感觉去欣赏，慢慢地从活跃的颜色中感受到了自由。","我觉得，每个人对艺术可以有不同的解读，这既是挑战，也是自由。"],"vi":"Với nhiều người, tranh trừu tượng không dễ thưởng thức như tranh cổ điển, nhưng tôi lại rất thích. Lần đầu xem triển lãm tôi thấy cực kỳ bí ẩn, chỉ toàn mảng màu, đường nét không quy tắc. Sau khi đọc bài viết biết não bộ nhận ra bố cục và tâm huyết nghệ sĩ, tôi bắt đầu thưởng thức bằng cảm giác của mình, dần cảm được sự tự do từ màu sắc sinh động. Mỗi người hiểu nghệ thuật theo cách riêng — vừa là thách thức, vừa là tự do."}],"write":[{"who":"范文 1 · 剪纸","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜爱的艺术","p":["在所有的艺术形式中，我最喜爱的是中国的剪纸。","剪纸是中国最古老的民间艺术之一。","它看起来简单，其实极其考验技术，哪怕剪错一刀，整幅作品就可能失败。","对我来说，剪纸让我更了解了中国文化。"],"vi":"Bố cục 4 câu: mở bài → giới thiệu → lý do (极其 · 哪怕) → cảm nhận."},{"who":"范文 2 · 音乐","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我喜爱的艺术","p":["我的业余爱好很多，其中最让我着迷的是音乐。","每天晚上，我都会弹半个小时钢琴。","哪怕工作再累，听着自己演奏的音乐，我也会马上放松下来。","对我来说，音乐能让我感受到自由。"],"vi":"Kể sở thích cá nhân; dùng 其中 · 哪怕……也……."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我喜爱的艺术","p":["对很多人来说，抽象画没有古典画那么容易欣赏，可我却特别喜欢它。","记得第一次看抽象画展时，我只看到了一些不规则的色块和线条。这样的作品，在有人看来极其神秘甚至丑陋，有人却从中感受到了对自由的赞美。","后来我知道，我们的大脑能注意到画的布局。由此可见，好的作品能打动每一个人，哪怕我们说不出原因。现在，我常常用业余时间去美术馆。","我觉得，每个人对艺术可以有不同的理解，这既是挑战，也是自由。"],"good":["对很多人来说，抽象画没有古典画那么容易欣赏","在有人看来极其神秘甚至丑陋，有人却从中感受到了对自由的赞美","每个人对艺术可以有不同的理解，这既是挑战，也是自由"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 对……来说，A 没有 B 那么…… · 在有人看来……，有人却…… · 每个人对……可以有不同的……，这既是……，也是……."}]},"w5":["剪纸","京剧","舞蹈","摄影","图案","着迷","演奏","表演","创作","放松","欣赏","作品","抽象","古典","极其","自由","业余","布局","设计","规则","可见","哪怕","调整"],"step_names":["① 点题","② 介绍","③ 理由与经历","④ 感受"],"timer":[["① 10s",10],["② 25s",25],["③ 40s",40],["④ 15s",15]],"build_title":"选一个方向，拼出你的“我喜爱的艺术”","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 中国剪纸":[["在所有的艺术形式中，我最喜爱的是中国的剪纸。","说到艺术，我首先想到的是中国的剪纸。"],["剪纸是中国最古老的民间艺术之一，人们用剪刀在红纸上剪出各种图案。","每到春节，很多中国人家的窗户上都贴着红色的窗花，看起来喜气洋洋的。"],["我喜欢剪纸，是因为它看起来简单，其实极其考验技术，哪怕剪错一刀，整幅作品就可能失败。","记得第一次跟老师学剪“福”字时，我剪了好几次都失败了。"],["对我来说，剪纸不但是一种艺术，还让我更了解了中国文化。","我希望以后能有更多的时间学习剪纸，把这门艺术介绍给我的朋友。"]],"B · 抽象画":[["对很多人来说，抽象画没有古典画那么容易欣赏，可我却特别喜欢它。","我的业余爱好很多，其中最让我着迷的是抽象画。"],["记得第一次看抽象画展时，我觉得那些作品极其神秘，根本看不懂。","抽象画上常常只有一些不规则的色块和线条，在有人看来极其神秘甚至丑陋。"],["我喜欢抽象画，是因为我后来知道，我们的大脑能注意到画的布局，感知艺术家的用心。","现在我常常用自己的感觉去欣赏，慢慢地从活跃的颜色中感受到了自由。"],["我觉得，每个人对艺术可以有不同的解读，这既是挑战，也是自由。","由此可见，好的作品能打动每一个人，哪怕我们说不出原因。"]],"C · 音乐（钢琴）":[["我的业余爱好很多，其中最让我着迷的是音乐。","第一次听到钢琴曲的时候，我就爱上了钢琴。"],["我从八岁开始学钢琴，到现在已经弹了十几年了，记得第一次上台演奏时，我紧张得手都在发抖。","我最喜欢古典音乐，它的旋律优美，让人百听不厌。"],["我喜欢弹钢琴，是因为哪怕工作再累，听着自己演奏的音乐，我也会马上放松下来。","记得第一次在台上演奏时，我紧张得手都在发抖，可是弹完以后，大家都给了我热烈的掌声。"],["对我来说，音乐不但能让我放松，还能让我感受到自由。","我觉得，音乐是一种不需要翻译的语言，能打动每一个人。"]]},"quiz":[["Câu nào nêu lý do cụ thể?",["剪纸很好，我很喜欢。","我喜欢剪纸，是因为它的图案栩栩如生。"],1,"Lý do phải cụ thể."],["Câu nào hợp làm câu mở bài?",["艺术有很多很多种。","在所有的艺术形式中，我最喜爱的是中国的剪纸。"],1,"Vào đề, nêu rõ loại hình."],["Câu nào dùng 极其 đúng?",["这幅画极其美丽。","这幅画极其美。"],0,"极其 + từ hai âm tiết."],["Câu nào dùng 哪怕 đúng?",["哪怕工作再累，我也要弹钢琴。","哪怕工作再累，我就要弹钢琴。"],0,"哪怕……也……"],["Câu nào liên hệ được bài khóa?",["我喜欢画画儿。","每个人对艺术可以有不同的解读，这既是挑战，也是自由。"],1,"Câu kết của bài 18."],["Câu kết nào tốt hơn?",["就这些。","对我来说，艺术让平常的生活变得更美好。"],1,"Câu kết có ý nghĩa."]],"fix":[["我最喜爱的艺术是剪纸中国的。","我最喜爱的艺术是中国的剪纸。","Định ngữ đặt trước danh từ."],["这幅画极其好看极了。","这幅画极其好看。","极其 và 极了 không dùng cùng nhau."],["我对音乐很感兴趣音乐。","我对音乐很感兴趣。","Không lặp tân ngữ."],["哪怕很累，我还弹钢琴。","哪怕很累，我也要弹钢琴。","哪怕 đi với 也."],["我欣赏了一张剪纸作品。","我欣赏了一幅剪纸作品。","Lượng từ của tranh, tác phẩm: 幅."],["由此看见，艺术很重要。","由此可见，艺术很重要。","Cấu trúc cố định: 由此可见."]],"tpl":"我喜爱的艺术\n在所有的艺术形式中，我最喜爱的是【……】。【介绍】。我喜欢它，是因为【理由】。记得【经历】。对我来说，【感受】。","chk":[["topic","Bám đề: có nói 艺术 / loại hình cụ thể","艺术|剪纸|京剧|音乐|画|舞蹈|摄影|电影"],["like","Có nói yêu thích (喜爱 · 喜欢 · 着迷)","喜爱|喜欢|着迷|爱上"],["why","Có lý do (因为 · 是因为 · 一是)","因为|一是|原因"],["detail","Có chi tiết / trải nghiệm (记得 · 第一次 · 作品)","记得|第一次|作品|有一次"],["end","Có cảm nhận / kết (对我来说 · 我觉得 · 自由)","对我来说|我觉得|自由|希望"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> một loại hình nghệ thuật cụ thể, phần giới thiệu ngắn, lý do yêu thích, một trải nghiệm và một câu cảm nhận. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“我喜爱的……”的题目都可以这样写","var_lead":"Mọi đề nói về sở thích (艺术、运动、书、城市…) đều dùng khung: <b>giới thiệu → lý do → trải nghiệm → cảm nhận<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）我喜爱的艺术","在所有的艺术形式中，我最喜爱的是……"],["请介绍一种中国传统艺术。","剪纸是中国最古老的民间艺术之一……"],["你喜欢抽象艺术还是古典艺术？","对很多人来说，抽象画没有古典画那么容易欣赏……"],["请以“我的业余爱好”为题写一段话。","我的业余爱好很多，其中最让我着迷的是……"],["谈谈艺术对生活的影响。","对我来说，艺术让平常的生活变得更美好……"],["请介绍一部你喜欢的电影。","在我看过的电影中，最让我难忘的是……"]],"homework":"<b>Bài về nhà:<\/b> chọn một hướng (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “我喜爱的艺术” · bắt buộc có giới thiệu, lý do, một trải nghiệm, một câu cảm nhận và một khung 好句 của bài khóa."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();
/* ---------- TTS ---------- */
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.getAttribute("data-say"),b);}},true);
/* ---------- VN toggle ---------- */
var topbar=el("div",{class:"topbar"});

vnBtn.addEventListener("click",function(){var h=document.body.classList.toggle("hide-vn");vnBtn.classList.toggle("on",h);vnBtn.textContent=h?"Hiện tiếng Việt":"Ẩn tiếng Việt";$$(".vn.peek").forEach(function(x){x.classList.remove("peek");});});
topbar.appendChild(vnBtn);document.body.appendChild(topbar);
document.addEventListener("click",function(e){if(!document.body.classList.contains("hide-vn"))return;var v=e.target.closest&&e.target.closest(".vn");if(v){v.classList.toggle("peek");e.stopPropagation();}},true);
/* ---------- generic MC ---------- */
function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
    b.addEventListener("click",function(){if(q.classList.contains("done"))return;q.classList.add("done");
      $$(".op",q).forEach(function(x,j){if(j===ans)x.classList.add("ok");else if(j===i)x.classList.add("no");});
      if(score)score.hit(i===ans);});ops.appendChild(b);});
  q.appendChild(ops);if(ex)q.appendChild(el("div",{class:"ex"},"💡 "+ex));if(score)score.add();return q;}
function scoreBar(parent,label,onReset,zh){var r=el("div",{class:"row",style:"margin:8px 0 14px"});var s=el("span",{class:"score"});r.appendChild(s);
  if(onReset){var b=el("button",{class:"btn sm",type:"button"},zh?"重做":"Làm lại");b.addEventListener("click",onReset);r.appendChild(b);}parent.appendChild(r);var S=new Score(s);S.zh=!!zh;return S;}
function reveal(label,answer,cls){var b=el("button",{class:"rv"+(cls?" "+cls:""),type:"button"},label);b.addEventListener("click",function(){if(b.classList.contains("shown")){b.innerHTML=label;b.classList.remove("shown");}else{b.innerHTML=answer;b.classList.add("shown");}});return b;}
/* ---------- modal framework ---------- */
var MODALS={};
function modal(key,no,title,tabs){
  var m=el("div",{class:"modal",id:"m-"+key,role:"dialog","aria-modal":"true"});
  var p=el("div",{class:"panel"});var hd=el("div",{class:"mhead"});
  hd.appendChild(el("div",{class:"eyebrow"},no+" · "+title));hd.appendChild(el("div",{class:"mtitle"},title));
  var x=el("button",{class:"close",type:"button","aria-label":"Đóng"},"×");x.addEventListener("click",function(){closeModal(m);});hd.appendChild(x);
  var tb=el("div",{class:"tabs"});hd.appendChild(tb);p.appendChild(hd);
  var body=el("div",{class:"mbody"});p.appendChild(body);m.appendChild(p);document.body.appendChild(m);
  m.addEventListener("click",function(e){if(e.target===m)closeModal(m);});
  var secs=[];
  tabs.forEach(function(t,i){var b=el("button",{class:"tab",type:"button"},t);b.addEventListener("click",function(){showTab(i);});tb.appendChild(b);var s=el("div",{class:"sec"});body.appendChild(s);secs.push(s);});
  function showTab(i){$$(".tab",tb).forEach(function(b,j){b.classList.toggle("on",i===j);});secs.forEach(function(s,j){s.classList.toggle("on",i===j);});body.scrollTop=0;}
  showTab(0);if(tabs.length<2)tb.style.display="none";
  MODALS[key]={m:m,secs:secs,show:showTab};return MODALS[key];}
function openModal(key){MODALS[key].m.classList.add("open");document.body.style.overflow="hidden";}
function closeModal(m){m.classList.remove("open");hidePop();if(!$$(".modal.open").length)document.body.style.overflow="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($(".pop.open")){hidePop();return;}var o=$$(".modal.open");if(o.length)closeModal(o[o.length-1]);}});

function linkVocab(text){var out="",i=0;while(i<text.length){var hit=null;for(var k=0;k<VORDER.length;k++){var w=VORDER[k].hz;if(text.substr(i,w.length)===w){hit=VORDER[k];break;}}
  if(hit){out+='<span class="vlink" data-v="'+hit.i+'">'+esc(hit.hz)+'</span>';i+=hit.hz.length;}else{out+=esc(text[i]);i++;}}return out;}
function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
  while(i<text.length){var g=null;for(var k=0;k<goods.length;k++){if(text.substr(i,goods[k].zh.length)===goods[k].zh){g=goods[k];break;}}
    if(g){out+='<span class="good" data-g="'+g.i+'">'+linkVocab(g.zh)+'</span>';i+=g.zh.length;continue;}
    var j=text.length;goods.forEach(function(gg){var p=text.indexOf(gg.zh,i);if(p>=0&&p<j)j=p;});
