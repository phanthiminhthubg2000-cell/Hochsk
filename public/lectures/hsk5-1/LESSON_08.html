<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 08 · “朝三暮四”的古今义 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

Trung Quốc, món nào khác?","answer_zh":"越南人和中国人一样，都以米饭为主食，也常吃面条、饺子。不同的是，中国北方人常吃馒头，越南人更喜欢吃米粉，做菜时常用鱼露。","answer_vn":"Giống: cơm là món chính, ăn mì, sủi cảo. Khác: miền Bắc Trung Quốc ăn màn thầu (馒头), người Việt chuộng bún/phở (米粉) và nước mắm (鱼露).","table":[["","中国","越南"],["主食","米饭、馒头、面条","米饭、米粉、法棍面包"],["调料","酱油、醋","鱼露、柠檬"]]},{"tab":"猜一猜","title":"“朝三暮四”是什么意思？","type":"discuss","q":"“朝”是早上，“暮”是晚上。猜一猜，“朝三暮四”原来是什么意思？现在又是什么意思？","vn":"“朝” là buổi sáng, “暮” là buổi tối. Đoán xem “朝三暮四” ban đầu nghĩa là gì, bây giờ nghĩa là gì?","answer_zh":"原来的意思是：不管是早上三个晚上四个，还是早上四个晚上三个，实际上没有变化。现在用来形容做事经常改变，甚至形容一个人对感情不专一。","answer_vn":"Nghĩa gốc: sáng ba chiều bốn hay sáng bốn chiều ba thì thực chất như nhau. Nghĩa nay: hay thay đổi, thậm chí chỉ người không chung thủy trong tình cảm."}],"GAME":{"fill":[["成语有{}的结构，不能随便更改……","固定",["固定","一定","肯定","决定"]],["而是综合起来表达一个{}的意思。","完整",["完整","整体","整个","完成"]],["从前有位老人，{}了一群猴子当宠物。","喂养",["喂养","培养","保养","养成"]],["{}久了，彼此居然可以……","相处",["相处","相同","相互","相信"]],["老人甚至必须减少家人的{}……","消费",["消费","浪费","花费","收费"]],["他注意到该{}猴子的食量了。","限制",["限制","控制","制造","制定"]],["在其他粮食{}的情况下……","不足",["不足","不够","不满","不对"]],["猴子们{}只弄懂了主人前面说的一个“三”……","似乎",["似乎","几乎","好像","在乎"]],["就换了一种方式，{}它们说道……","安慰",["安慰","安静","安排","安全"]],["所以马上安静下来，显得{}开心。","格外",["格外","另外","此外","意外"]]],"order":[["成语|有固定的结构，|不能|随便更改。"],["他注意到|该限制|猴子的|食量了。"],["我早上|给你们三颗，|晚上|给四颗。"],["老人见|猴子们不接受，|就换了|一种方式。"],["所以|马上安静下来，|显得|格外开心。"],["老人|看着这情景，|哈哈地|笑了。"]]},"GOOD":[{"zh":"意义是整体性的，不是每个字意思的简单相加，而是综合起来表达一个完整的意思","vn":"ý nghĩa mang tính chỉnh thể, không phải là phép cộng đơn giản nghĩa từng chữ, mà là tổng hợp lại để diễn đạt một ý hoàn chỉnh","why":"Câu định nghĩa/giải thích chuẩn văn viết: <b>不是……，而是……<\/b> phủ định cách hiểu sai rồi đưa cách hiểu đúng.","frame":"A 是……的，不是……，而是……","apply":"学习汉语不是简单地记生词，而是要综合起来提高听说读写的能力。","apply_vn":"Học tiếng Trung không phải là nhớ từ đơn thuần, mà là tổng hợp nâng cao các kỹ năng nghe nói đọc viết."},{"zh":"一般来说，成语的意义也是稳定的，很少发生变化","vn":"nói chung, ý nghĩa của thành ngữ cũng ổn định, rất ít thay đổi","why":"<b>一般来说，……；但也有……<\/b>: nêu quy luật chung rồi chuyển sang ngoại lệ — khung mở bài nghị luận rất hay.","frame":"一般来说，……很少……。但也有……","apply":"一般来说，词汇的意思是稳定的，很少发生变化，但也有一些词古今意思完全不同。","apply_vn":"Nói chung nghĩa của từ ổn định, ít thay đổi, nhưng cũng có một số từ nghĩa xưa và nay hoàn toàn khác."},{"zh":"相处久了，彼此居然可以从表情、声音和行为举止中了解对方的意思","vn":"sống chung lâu ngày, hai bên vậy mà có thể hiểu ý nhau qua nét mặt, giọng nói và cử chỉ","why":"<b>相处久了，彼此……<\/b> + liệt kê ba yếu tố: rất hợp viết về <b>bạn bè, gia đình, thú cưng<\/b>.","frame":"相处久了，彼此（居然）可以从……中了解对方的……","apply":"我和同屋相处久了，彼此一看表情就知道对方在想什么。","apply_vn":"Tôi và bạn cùng phòng sống chung lâu, nhìn nét mặt là biết người kia nghĩ gì."},{"zh":"哪有那么大的财力满足一群猴子对食物的长期需要呢","vn":"làm gì có tài lực lớn như vậy để đáp ứng nhu cầu thức ăn lâu dài của cả một bầy khỉ","why":"Câu hỏi tu từ <b>哪有……呢？<\/b> = khẳng định “không có”, làm lập luận mạnh hơn câu trần thuật.","frame":"（条件），哪有 + ……（能力／时间）+ 去……呢？","apply":"每天工作十二个小时，哪有那么多时间去健身呢？","apply_vn":"Mỗi ngày làm 12 tiếng, làm gì có nhiều thời gian đi tập thể dục?"},{"zh":"发展到今天，“朝三暮四”这个成语的意义已经完全改变了","vn":"phát triển đến ngày nay, ý nghĩa của thành ngữ “朝三暮四” đã thay đổi hoàn toàn","why":"Câu then chốt cho đề viết “古与今”: <b>发展到今天，……已经完全改变了<\/b>.","frame":"发展到今天，+ 某事物 + 已经（完全）改变了／有了很大的变化","apply":"发展到今天，“汤”这个字的意思已经完全改变了。","apply_vn":"Đến ngày nay, nghĩa của chữ “汤” đã thay đổi hoàn toàn."}],"GRAMMAR":[{"word":"倒","py":"dào","pos":"副词","forms":["表示跟一般情况相反：……倒（是）……","表示没有想到：倒 + 动词","表示让步：A 倒是……，就是／可是……","表示不耐烦地催问：你倒是 + 动词 + 呀！"],"vn":"<b>倒<\/b> (dào) là phó từ, có 4 cách dùng: ① <b>trái với thông thường<\/b> (lại…); ② <b>không ngờ<\/b>; ③ <b>nhượng bộ<\/b>: 倒是……，就是…… (thì… nhưng…) — khẳng định một mặt trước rồi nói mặt khác; ④ <b>giục giã, mất kiên nhẫn<\/b>: 你倒是说话呀！","text":"在其他粮食不足的情况下，用橡子喂猴子倒是个办法。","ex":[["少年不解地问：“怎么勇敢反倒成为缺点了？”","Cậu thiếu niên khó hiểu hỏi: “Sao dũng cảm lại thành khuyết điểm?” (trái thông thường)"],["质量倒是挺好，就是价格太贵了。","Chất lượng thì khá tốt, chỉ là giá đắt quá. (nhượng bộ)"],["你究竟去还是不去？倒是说句话呀！","Rốt cuộc bạn đi hay không? Nói một câu đi chứ! (giục giã)"]],"err":[["❌ 倒质量挺好，就是太贵了。","✅ 质量倒是挺好，就是太贵了。","倒 đứng sau chủ ngữ, trước vị ngữ."],["❌ 他倒是很聪明，所以考得很好。","✅ 他倒是很聪明，就是不太努力。","倒是 nhượng bộ phải đi với 就是/可是/但是 (chuyển ý)."]],"book":[["A：你觉得这套房子装修得怎么样？<br>B：____________。（倒）","Gợi ý: trang trí thì đẹp, chỉ là hơi nhỏ.","装修倒是挺漂亮的，就是面积小了点儿"],["____________，做起来可就难了。（倒）","Gợi ý: nói thì dễ.","说起来倒是容易，做起来可就难了"],["A：____________。（倒）<br>B：着什么急啊？再等两分钟，马上就好了。","Gợi ý: giục: bạn nhanh lên chứ!","你倒是快点儿啊，电影马上就要开始了"]],"drill":[["“倒”在这里表示什么？ 质量倒是挺好，就是价格太贵了。",["让步","催问","没想到"],0,"倒是……，就是…… → nhượng bộ."],["“倒”在这里表示什么？ 你倒是说句话呀！",["让步","催问","跟一般情况相反"],1,"Giục giã, mất kiên nhẫn."],["“倒是”放在哪里？ <u>A<\/u>我<u>B<\/u>很想辞职，但是我妻子不支持。",["A","B"],1,"Sau chủ ngữ: 我倒是很想辞职 (课本练习3)."]]},{"word":"……来……去","py":"……lái……qù","pos":"固定格式","forms":["动词1 + 来 + 动词2 + 去（动词1、动词2相同或意思相近）：跳来跳去、找来找去、研究来讨论去"],"vn":"<b>V来V去<\/b> diễn tả động tác <b>lặp đi lặp lại nhiều lần<\/b> (qua lại, tới lui). Hai động từ thường <b>giống nhau<\/b> (跑来跑去, 想来想去) hoặc <b>gần nghĩa<\/b> (研究来讨论去). Hay dùng: 想来想去 (nghĩ tới nghĩ lui), 找来找去 (tìm khắp nơi).","text":"一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。","ex":[["小狗追着自己的尾巴，在草地上跑来跑去。","Chú chó đuổi theo đuôi mình, chạy tới chạy lui trên bãi cỏ."],["他们研究来讨论去，还是没找出原因。","Họ nghiên cứu tới bàn bạc lui, vẫn chưa tìm ra nguyên nhân."],["我想来想去，还是决定去中国留学。","Tôi nghĩ tới nghĩ lui, vẫn quyết định đi du học Trung Quốc."]],"err":[["❌ 他跑来走去。","✅ 他跑来跑去。／他走来走去。","Hai động từ phải giống nhau hoặc gần nghĩa."],["❌ 我想来想去了很久。","✅ 我想来想去，想了很久。","V来V去 không mang 了 và bổ ngữ thời lượng phía sau."]],"book":[["他的手机不见了，很着急，____________。（……来……去）","Gợi ý: tìm khắp phòng.","他的手机不见了，很着急，在房间里找来找去"],["公园里，____________。（……来……去）","Gợi ý: trẻ con chạy tới chạy lui.","公园里，孩子们跑来跑去，玩得很开心"],["A：怎么帮他把丢掉的手机找回来，你有办法了吗？<br>B：____________。（……来……去）","Gợi ý: nghĩ mãi, chỉ có một cách.","我想来想去，只有一个办法：给他的手机打个电话试试"]],"drill":[["选择：他在房间里走____走____，不知道该怎么办。",["来…去","去…来","上…下"],0,"V来V去."],["Câu nào đúng?",["孩子们在院子里跑来跑去。","孩子们在院子里跑来走去。","孩子们在院子里来跑去跑。"],0,"Hai động từ giống nhau."],["“想来想去”的意思是：",["想了很多次、很久","想来这里","不想去"],0,"Lặp lại nhiều lần."]]},{"word":"要不","py":"yàobù","pos":"连词","forms":["……，要不（然）+ 结果（= 如果不这样，就会……）","要不（然）+ 另一种选择（= 或者）：要不……吧"],"vn":"<b>要不 / 要不然<\/b> là liên từ, thường đứng đầu phân câu sau, trước chủ ngữ: ① <b>nếu không thì<\/b> — nêu hậu quả: 快走吧，要不就迟到了. ② <b>hay là<\/b> — đưa ra một lựa chọn khác, hay đi với 吧: 要不你明天再走吧.","text":"要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗……","ex":[["老太太说：“4块，要不我不买。”","Bà cụ nói: “4 đồng, không thì tôi không mua.” (nếu không thì)"],["还好碰见你了，要不然我今天肯定要迟到了。","May mà gặp bạn, không thì hôm nay tôi chắc chắn muộn rồi. (nếu không thì)"],["今天太晚了，要不你明天再走吧。","Hôm nay muộn quá rồi, hay là mai bạn hẵng đi. (hay là)"]],"err":[["❌ 你快走吧，我要不送你。","✅ 你快走吧，要不我送你吧。","要不 đứng trước chủ ngữ của phân câu sau."],["❌ 要不下雨，我们就去爬山。","✅ 要是不下雨，我们就去爬山。","“nếu không mưa” là 要是不……; 要不 = nếu không như vậy."]],"book":[["谢谢你昨晚给我发了个短信，____________。（要不）","Gợi ý: không thì tôi quên mất cuộc họp.","谢谢你昨晚给我发了个短信，要不我就忘了今天的会了"],["A：后天我们打算去中国朋友家过除夕，你有什么计划？<br>B：____________。（要不）","Gợi ý: chưa có kế hoạch, hay là tôi đi cùng.","我还没有计划呢，要不我跟你们一起去吧"],["A：____________。（要不）<br>B：我都行，看你什么时候方便吧。","Gợi ý: hỏi: hôm nay đi hay là mai?","今天下午我有点儿事，要不我们明天上午去吧"]],"drill":[["“要不”在这里表示什么？ 快走吧，要不就赶不上火车了。",["如果不这样","另一种选择"],0,"Nêu hậu quả."],["“要不”在这里表示什么？ 要不你明天再来吧。",["如果不这样","另一种选择"],1,"Đề nghị lựa chọn khác."],["Câu nào đúng?",["多穿点儿衣服，要不会感冒的。","多穿点儿衣服，会要不感冒的。","要不多穿点儿衣服，会感冒的。"],0,"要不 đầu phân câu nêu hậu quả."]]}],"HSK":{"r1":[{"text":["一个外国留学生去参加中国朋友的生日晚会。朋友笑着说：“{36}，只是一点儿小意思。”留学生很奇怪：“这是什么意思？”旁边的人告诉他：“‘小意思’就是一点儿小礼物的意思。”晚会结束时，朋友又说：“{37}，今天招待不周，真不好意思。”留学生听了，{38}：“汉语的‘意思’可真有意思！”"],"qs":[{"n":36,"o":["这是送给大家的礼物","我今天不舒服","你来晚了","饭菜都吃完了"],"a":0,"why":"后文说“小意思”就是一点儿小礼物，所以前面是在介绍礼物。"},{"n":37,"o":["你什么时候走","谢谢大家来参加","明天还要上班","我的礼物很贵"],"a":1,"why":"晚会结束时主人感谢客人，后面说“招待不周”是客气话。"},{"n":38,"o":["生气地离开了","马上回家了","哈哈地笑了","一句话也没说"],"a":2,"why":"最后一句“汉语的‘意思’可真有意思”是笑着说的感想。"}]},{"text":["随着社会的发展，汉语中出现了很多新词，也有很多老词的意思{39}。比如“同志”这个词，以前是很常用的称呼，{40}。又比如“充电”，原来只是指给电池充电，现在{41}，比如“周末我要去图书馆充充电”。有人担心这些变化会让汉语越来越乱，但也有人认为，{42}，正说明汉语是一门活的语言。"],"qs":[{"n":39,"o":["发生了变化","完全一样","没有人用","越来越短"],"a":0,"why":"后面举了“同志”“充电”意思变化的例子。"},{"n":40,"o":["现在用得越来越多","现在在日常生活中用得少了","所以大家都喜欢","只有孩子才用"],"a":1,"why":"“以前……”和“现在……”对比，说明用得少了。"},{"n":41,"o":["只能给手机充电","也可以指通过学习提高自己","意思更少了","已经没人说了"],"a":1,"why":"例句“去图书馆充充电”说明“充电”有了“学习提高”的新意思。"},{"n":42,"o":["词义发生变化是很正常的","大家应该少说话","新词都是错的","汉语太难了"],"a":0,"why":"“但也有人认为……正说明汉语是一门活的语言”，前后意思一致。"}]}],"r2":[{"start":46,"paras":["他家的墙上画着龙，柱子上刻着龙，连衣服上也绣着龙。","古时候有一个叫叶公的人，大家都知道他非常喜欢龙。","没想到叶公一看见真龙，吓得什么似的，转身就逃走了。","天上的真龙听说了这件事，很受感动，就飞到叶公家来看他。","原来，叶公喜欢的并不是真的龙。后来，人们就用“叶公好龙”比喻表面上喜欢，实际上并不真喜欢。"],"ans":["B","A","D","C","E"],"why":"人物介绍（B）→ 家里到处是龙（A）→ 真龙来看他（D）→ 叶公吓跑了（C）→ 成语的意思（E）。"}],"r3":[{"text":["今天我们说“菜”，一般有两个意思：一是蔬菜，比如白菜、菠菜；二是做好的、可以吃的菜，比如“这家饭馆的菜很好吃”。可是在古代，“菜”只指可以吃的植物，也就是蔬菜。","那时候，人们把鸡、鸭、鱼、肉叫作“荤”，把蔬菜叫作“菜”。普通百姓的生活比较困难，平时很少吃肉，主要靠吃粮食和蔬菜生活。所以，“菜”在古代常常和普通人的生活联系在一起。","随着生活水平的提高，人们的饭桌上肉越来越多，“菜”的意义也慢慢扩大了。<u><b>到了今天，不管是青菜还是红烧肉，都可以叫“菜”<\/b><\/u>。我们去饭馆点菜，点的不只是蔬菜，也包括各种鱼、肉。","像“菜”这样意义发生变化的词，在汉语中还有很多。了解这些变化，不但能帮助我们读懂古代的文章，还能让我们更深地了解中国人生活的变化。"],"qs":[{"n":56,"s":"在古代，“菜”指的是：","o":["鸡、鸭、鱼、肉","可以吃的植物","所有的食物","饭馆"],"a":1,"why":"第一段：在古代，“菜”只指可以吃的植物，也就是蔬菜。"},{"n":57,"s":"古代普通百姓主要靠什么生活？","o":["粮食和蔬菜","鱼和肉","水果","点心"],"a":0,"why":"第二段：主要靠吃粮食和蔬菜生活。"},{"n":58,"s":"画线句子说明了什么？","o":["人们不爱吃青菜了","红烧肉很好吃","“菜”的意义扩大了","饭馆的菜很贵"],"a":2,"why":"前一句说“菜”的意义慢慢扩大了，画线句是具体说明。"},{"n":59,"s":"这段话主要谈的是：","o":["怎样做菜","“菜”的意义变化","古代人的饭馆","蔬菜的营养"],"a":1,"why":"全文讲“菜”从古代到今天意义的变化。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出这位留学生学成语的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện du học sinh học thành ngữ.","panels":[["📖","留学生大卫在书上看到了成语“朝三暮四”。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><rect width=\"320\" height=\"240\" fill=\"#f3efe6\"/><rect y=\"185\" width=\"320\" height=\"55\" fill=\"#d9c7aa\"/><path d=\"M0 185 H320\" st ữ → nói sai bị cười → được giải thích, rút bài học.","Có thể dùng: 似乎、显得、一问才知道、原来、发展到今天."],"sample":"留学生大卫在书上看到了一个成语——“朝三暮四”。他只看了字面意思，以为是“早上三个，晚上四个”。第二天吃午饭时，他对中国朋友说：“我吃饺子朝三暮四，早上三个，晚上四个。”朋友们听了，都哈哈地笑了。大卫觉得很奇怪，就去问老师。一问才知道，原来这个成语出自一个寓言故事，发展到今天，已经用来形容做事经常改变了。大卫明白了：学成语不能只看字面意思。","svn":"David thấy thành ngữ 朝三暮四, hiểu theo mặt chữ là “sáng ba chiều bốn”, nói với bạn “tôi ăn sủi cảo sáng ba chiều bốn”, bị cười; hỏi thầy mới biết nghĩa nay là hay thay đổi; rút ra bài học không thể chỉ nhìn mặt chữ."},"w72":{"prompt":"现在网络上出现了很多新词，一些老词的意思也发生了变化。有人认为这会让语言变得不规范，也有人认为这是语言发展的正常现象。请写一篇不少于200字的作文，谈谈你的看法。","vn":"Trên mạng xuất hiện nhiều từ mới, nhiều từ cũ đổi nghĩa. Có người cho rằng làm ngôn ngữ thiếu chuẩn mực, có người cho đây là hiện tượng bình thường. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"语言是活的","tips":["Nêu quan điểm → lý do 1: nghĩa từ vốn luôn thay đổi (朝三暮四, 走, 菜) → lý do 2: từ mới phản ánh đời sống → thừa nhận vấn đề (dùng bừa) → kết luận: cần dùng đúng chỗ.","Dùng khung 好句: 一般来说，……；但也有…… · 发展到今天，……已经完全改变了."],"sample":"现在网络上出现了很多新词，有人担心汉语会变得不规范。我却认为，这是语言发展的正常现象。\n首先，词汇的意义本来就在不断变化。一般来说，成语的意义是稳定的，但也有古今不同的，比如“朝三暮四”，原来的意思是实际上没有变化，发展到今天，它的意义已经完全改变了。“走”“菜”等词的意思也和古代不一样。\n其次，新词往往能反映社会的变化。比如“充电”现在也可以指学习、提高自己，这说明人们越来越重视学习。\n当然，我们也不能随便乱用网络语言，特别是在正式的场合和文章中。\n总之，语言是活的，只要用得合适，新词和新义能让汉语变得更丰富。","svn":"Bài nghị luận: quan điểm → 首先 nghĩa từ vốn thay đổi (朝三暮四, 走, 菜) → 其次 từ mới phản ánh xã hội (充电) → 当然 không dùng bừa → 总之 ngôn ngữ là sống."}},"PRACTICE":{"ex1":{"bank":["颗","群","安慰","似乎","限制","相处"],"items":[["希望我们能够友好{}，共同发展。",["相处"]],["他最近心情不太好，事情{}办得不太顺利。",["似乎"]],["聚在电台门口的那{}人是干什么的？",["群"]],["她跟丈夫离婚后非常伤心，朋友们轮流来{}她。",["安慰"]],["小明昨天掉了一{}牙齿，这是他第一次换牙。",["颗"]],["这次的作文不{}字数，你可以想写多少就写多少。",["限制"]]]},"ex2":[["我建议这几天我们应该把下周会议讨论话题的顺序____下来。",["固定","一定"],0],["汉语的____非常丰富，你得特别注意近义词之间的区别。",["词","词汇"],1],["这篇文章____上写得不错，有些小地方还要再改改。",["整体","完整"],0],["这两个女孩儿关系非常好，____亲姐妹一样。",["似乎","好像"],1]],"ex3":[["从成为<u>A<\/u>大学同学以来，<u>B<\/u>他们就<u>C<\/u>相爱<u>D<\/u>了。","彼此",2,"从成为大学同学以来，他们就彼此相爱了。"],["他输了这场比赛不是因为能力<u>A<\/u>不够<u>B<\/u>，而是因为<u>C<\/u>准备<u>D<\/u>。","不足",3,"他输了这场比赛不是因为能力不够，而是因为准备不足。"],["<u>A<\/u>我<u>B<\/u>很想辞职，但是<u>C<\/u>我妻子<u>D<\/u>不支持我的想法。","倒是",1,"我倒是很想辞职，但是我妻子不支持我的想法。"],["你已经<u>A<\/u>不错了，别老觉得自己好像<u>B<\/u>吃了<u>C<\/u>亏<u>D<\/u>似的！","大",2,"你已经不错了，别老觉得自己好像吃了大亏似的！"]],"ex4":[["老人和猴子的关系","群、相处、彼此","从前有位老人喂养了一群猴子。他们相处久了，彼此可以从表情、声音和行为中了解对方的意思。"],["老人发现的问题","粮食、财产、节省、限制、淘气","猴子每天要吃大量的粮食，可是老人家里财产不多，只好节省家人的食物。他想限制猴子的食量，可是猴子吃不饱就会跟人淘气。"],["老人和猴子的交流","不足、倒、似乎、……来……去、要不、显得","粮食不足，用橡子喂猴子倒是个办法。老人说早上给三颗，晚上给四颗，猴子似乎觉得吃了亏，跳来跳去地发脾气。老人说：“要不早上四颗，晚上三颗吧。”猴子马上安静下来，显得格外开心。"]],"ext":{"title":"扩展 · 话题：饮食 1","words":[["食物","shíwù","thức ăn"],["粮食","liángshi","lương thực"],["蔬菜","shūcài","rau"],["豆腐","dòufu","đậu phụ"],["辣椒","làjiāo","ớt"],["花生","huāshēng","lạc, đậu phộng"],["土豆","tǔdòu","khoai tây"],["玉米","yùmǐ","ngô"],["馒头","mántou","màn thầu"],["海鲜","hǎixiān","hải sản"],["香肠","xiāngcháng","lạp xưởng"]],"items":[["{}主要是指可以做主食的东西，比如大米、土豆、玉米等。","粮食"],["你不能每顿饭光吃肉，还得多吃{}。","蔬菜"],["我不太能吃辣，麻烦你做菜时少放点儿{}。","辣椒"],["我老家靠海，所以我从小就喜欢吃{}。","海鲜"]]}},"TEXT":[{"title":"成语的特点","sub":"固定的结构，整体的意义","paras":["成语是汉语中非常有特点的一部分词汇。成语有固定的结构，不能随便更改；意义是整体性的，不是每个字意思的简单相加，而是综合起来表达一个完整的意思。","一般来说，成语的意义也是稳定的，很少发生变化，比如我们学过的“盲人摸象”和“精诚所至，金石为开”。但也有古今不同的，像我们今天要学习的“朝三暮四”。","中国古代有一位哲学家，在他的书中讲了这样一个寓言故事："],"idea":"Thành ngữ có <b>kết cấu cố định<\/b>, không tùy tiện sửa; nghĩa mang <b>tính chỉnh thể<\/b>, không phải cộng nghĩa từng chữ. Nghĩa thành ngữ thường ổn định, nhưng cũng có cái <b>nghĩa xưa khác nghĩa nay<\/b> như “朝三暮四”.","qs":[["关于成语，下面哪个说法是对的？",["可以随便更改","有固定的结构","意思是每个字意思相加"],1],["“盲人摸象”的意义有什么特点？",["很少发生变化","古今完全不同","每天都在变"],0],["“朝三暮四”这个故事最早来自哪里？",["一位哲学家的书","一个将军的日记","一首诗"],0]]},{"title":"老人和猴子","sub":"猴子太多，粮食太少","paras":["从前有位老人，喂养了一群猴子当宠物。相处久了，彼此居然可以从表情、声音和行为举止中了解对方的意思。","猴子太多，每天要吃大量的瓜果、蔬菜和粮食。然而，一个普通的家庭，财产不多，哪有那么大的财力满足一群猴子对食物的长期需要呢？老人甚至必须减少家人的消费，好节省些食物拿去喂养猴子。他注意到该限制猴子的食量了。","问题是，猴子不像猪、狗，吃不饱时仅仅只是叫叫，它们如果得不到好的待遇，就会像一群调皮的孩子，经常跟人淘气。"],"idea":"Một ông lão nuôi một bầy khỉ làm thú cưng; sống lâu, hai bên <b>hiểu ý nhau<\/b> qua nét mặt, tiếng kêu, cử chỉ. Khỉ nhiều, ăn rất nhiều, nhà bình thường không đủ của cải → ông phải <b>hạn chế khẩu phần<\/b>. Nhưng khỉ không như lợn, chó: không được đối xử tốt là <b>quậy phá<\/b>.","qs":[["老人和猴子相处久了，有什么变化？",["猴子都跑了","彼此可以了解对方的意思","老人不喜欢猴子了"],1],["老人为什么要限制猴子的食量？",["猴子太胖了","家里财产不多，食物不够","医生让他这样做"],1],["猴子吃不饱的时候会怎么样？",["只是叫叫","像调皮的孩子一样跟人淘气","自己去找吃的"],1]]},{"title":"朝三暮四","sub":"猴子觉得吃了亏","paras":["老人的朋友送给他很多橡子，这是一种猴子爱吃的果实。在其他粮食不足的情况下，用橡子喂猴子倒是个办法。于是老人对猴子们说：“今后你们除了吃馒头，还可以再吃一些橡子。我早上给你们三颗，晚上给四颗。”","猴子们似乎只弄懂了主人前面说的一个“三”，觉得自己吃了亏，一个个立起身子跳来跳去，对着老人大喊大叫地发脾气。"],"idea":"Bạn ông lão tặng nhiều <b>hạt dẻ rừng<\/b>. Ông bảo khỉ: ngoài màn thầu, <b>sáng cho ba hạt, tối cho bốn hạt<\/b>. Bầy khỉ hình như chỉ nghe được chữ “ba”, cho là <b>bị thiệt<\/b>, nhảy loạn lên, la hét nổi giận.","qs":[["老人用什么来喂猴子？",["馒头和橡子","米饭和蔬菜","肉和鱼"],0],["老人第一次说每天怎么给橡子？",["早上四颗，晚上三颗","早上三颗，晚上四颗","早上晚上各三颗"],1],["猴子们为什么发脾气？",["橡子不好吃","觉得自己吃了亏","老人打了它们"],1]]},{"title":"朝四暮三","sub":"成语意义的变化","paras":["老人见猴子们不接受，就换了一种方式，安慰它们说道：“要不这样吧，既然你们觉得少，那就改成每天早上四颗，晚上三颗，这样总够了吧？”","猴子把主人前面说的一个“四”当成全天多得了的橡子，所以马上安静下来，显得格外开心。老人看着这情景，哈哈地笑了。","哲学家用这个故事告诉人们，不要太关心生死、得失，因为到最后我们会发现没有失去什么，也没有得到什么。不过，发展到今天，“朝三暮四”这个成语的意义已经完全改变了。你知道它现在是什么意思吗？"],"idea":"Ông lão đổi cách nói: <b>sáng bốn, tối ba<\/b>. Khỉ tưởng được nhiều hơn nên lập tức yên lặng, vui ra mặt. Nhà triết học muốn nói: đừng quá bận tâm <b>được mất<\/b>, rốt cuộc chẳng mất gì cũng chẳng được gì. Nhưng ngày nay nghĩa của “朝三暮四” đã <b>thay đổi hoàn toàn<\/b>.","qs":[["老人第二次是怎么说的？",["早上四颗，晚上三颗","早上五颗，晚上两颗","不给橡子了"],0],["猴子为什么马上安静下来？",["它们吃饱了","以为全天多得了橡子","老人生气了"],1],["哲学家用这个故事告诉人们什么？",["要多吃橡子","不要太关心生死、得失","猴子很聪明"],1]]}],"TEXT_EXTRA":{"compare_title":"词汇的古今义","compare_head":["词语","古义","今义"],"compare":[["朝三暮四","实际上没有变化（用欺骗的方法骗人）","做事经常改变；对感情不专一"],["走","跑","步行"],["汤","热水","做好的汤（菜汤、鸡汤）"],["金","金属的总称","黄金"],["菜","蔬菜","做好的菜；蔬菜"]],"bg":"“朝三暮四”这个词原来的意思是说不管是“朝三暮四”，还是“朝四暮三”，实际上没有变化，我们没有得到什么，也没有失去什么。后来这个成语用来形容（xíngróng）做事经常改变，到今天甚至发展成专门用来形容一个人对感情不专一。从这个例子，我们可以看到词汇在使用过程中意义发生了变化。这种情况在每种语言中都会出现。","bg_vn":"Nghĩa gốc: sáng ba chiều bốn hay sáng bốn chiều ba thực ra như nhau. Sau dùng để chỉ làm việc hay thay đổi, ngày nay còn chỉ người không chung thủy trong tình cảm. Nghĩa của từ thay đổi trong quá trình sử dụng — ngôn ngữ nào cũng có.","discuss_title":"话题讨论：词汇的语义变化","discuss":["请调查一下汉语中词汇语义从古代到现代发生变化的情况，例如“菜”“金”“汤”“走”等。","举一个你自己母语中词汇语义变化的例子。","你觉得了解这种语义变化现象对你的汉语学习有帮助吗？举例说明。"],"write":"请以“‘朝三暮四’的古与今”为题，谈一谈你对词汇语义变化的看法。尽量用本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“‘朝三暮四’的古与今”为题，谈一谈你对词汇语义变化的看法","topic_vn":"Viết bài với đầu đề “‘Sáng ba chiều bốn’ xưa và nay”, nêu quan điểm về sự thay đổi nghĩa của từ","intro":"Dạng đề giải thích + nêu quan điểm (说明＋议论) · Nghĩa xưa → nghĩa nay → nhận xét về hiện tượng đổi nghĩa (ví dụ khác) → ý nghĩa với việc học · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“‘朝三暮四’的古与今”：古义 → 今义 → 看法","lead":"Đề có hai phần: <b>“古与今”<\/b> — phải nói được <b>nghĩa xưa<\/b> và <b>nghĩa nay<\/b> của 朝三暮四; và <b>“对词汇语义变化的看法”<\/b> — phải mở rộng ra hiện tượng chung, có ví dụ khác và quan điểm của bạn. Chỉ kể lại chuyện con khỉ là <b>lạc đề<\/b>.","parts":[["古","Nghĩa xưa: sáng ba chiều bốn hay sáng bốn chiều ba thì thực chất <b>không thay đổi<\/b>, không được không mất."],["今","Nghĩa nay: <b>做事经常改变<\/b>, thậm chí <b>对感情不专一<\/b>."],["词汇语义变化","Mở rộng: 走 (xưa = chạy), 汤 (xưa = nước nóng), 金, 菜…; ví dụ từ tiếng Việt."],["（课本）尽量用本课生词，不少于100字","Dùng: 固定、整体、完整、综合、词汇、似乎、显得、倒… và khung 好句 “发展到今天，……已经完全改变了”."]],"traps":[["Kể lại cả câu chuyện","Kể 100 chữ chuyện khỉ ăn hạt dẻ → không có “看法”."],["Chỉ có nghĩa nay","Thiếu nghĩa xưa thì không thành “古与今”."],["Nói nghĩa nay sai","Ngày nay 朝三暮四 là nghĩa xấu: hay thay đổi, không chung thủy — không phải “tiết kiệm” hay “chia đều”."],["Thiếu quan điểm","Kết bài phải trả lời: hiện tượng này bình thường không? có ích gì cho việc học?"]],"link":"<b>Liên hệ bài 8:<\/b> đoạn đầu bài khóa đã cho sẵn ý: thành ngữ có <b>kết cấu cố định<\/b>, nghĩa thường <b>ổn định<\/b>, nhưng cũng có cái <b>xưa nay khác nhau<\/b>. Câu 好句 “一般来说，……很少发生变化” rất hợp làm câu mở, câu “发展到今天，……已经完全改变了” làm câu chuyển sang nghĩa nay."},"steps":[["①","古义","Nêu nguồn gốc và nghĩa xưa trong 1–2 câu.","“朝三暮四”出自一个寓言故事……"],["②","今义","Nghĩa ngày nay khác thế nào.","发展到今天，这个成语的意义已经完全改变了……"],["③","看法 + 例子","<b>Trọng tâm.<\/b> Nhận xét: nghĩa của từ thay đổi là bình thường; ví dụ khác (汉语 / tiếng Việt).","其实，词汇的意义发生变化是很正常的……"],["④","结论","Kết: hiểu sự thay đổi nghĩa giúp học tiếng Trung thế nào.","所以，学习成语的时候，……"]],"formula":["古义：没有变化","今义：经常改变、不专一","词义变化很正常 + 例子","对学习的帮助"],"choices_title":"Chọn một hướng viết","choices_key":"Ví dụ: ","choices":[["A · 从故事说起","bắt đầu từ câu chuyện","Tóm tắt chuyện khỉ trong 1–2 câu rồi so sánh nghĩa xưa – nay.","早上三颗，晚上四颗"],["B · 汉语里的其他例子","các ví dụ khác trong tiếng Trung","Dùng 走、汤、金、菜 để chứng minh hiện tượng phổ biến.","“走”古代是“跑”"],["C · 和越南语比一比","so sánh với tiếng Việt","Nêu một từ tiếng Việt đổi nghĩa (hoặc từ Hán Việt khác nghĩa với tiếng Trung hiện đại).","“bác sĩ”、“phương tiện”"],["D · 对学习的帮助","lợi ích cho việc học","Nhấn vào việc tra nguồn gốc giúp nhớ lâu và dùng đúng.","不能只看字面意思"]],"notes":[["Tóm tắt câu chuyện thật ngắn","Một câu: 老人说早上给三颗、晚上给四颗，猴子不高兴；改成早上四颗、晚上三颗，猴子就高兴了。"],["Ví dụ chắc chắn","Chỉ dùng ví dụ bạn chắc chắn: 走 (古：跑)、汤 (古：热水) là an toàn."],["Câu kết","Nêu bài học: 学成语不能只看字面意思，要了解它的古今变化。"]],"rule":"<b>Nguyên tắc HSK5:<\/b> phân biệt rõ <b>原来的意思 / 现在的意思<\/b>; dùng từ nối thời gian: 原来……，后来……，到今天……. Đừng viết sai nghĩa nay của thành ngữ — đây là lỗi bị trừ điểm nặng.","patterns":[["① 古义","“朝三暮四”出自一个寓言故事，原来的意思是实际上没有变化。","“朝三暮四” bắt nguồn từ một truyện ngụ ngôn, nghĩa gốc là thực chất không thay đổi."],["① 古义","不管是“朝三暮四”，还是“朝四暮三”，我们都没有得到什么，也没有失去什么。","Dù sáng ba chiều bốn hay sáng bốn chiều ba, ta chẳng được cũng chẳng mất gì."],["② 今义","发展到今天，这个成语的意义已经完全改变了。","Đến ngày nay, nghĩa của thành ngữ này đã thay đổi hoàn toàn."],["② 今义","现在人们用它来形容做事经常改变，甚至形容对感情不专一。","Ngày nay người ta dùng nó để chỉ làm việc hay thay đổi, thậm chí không chung thủy."],["③ 看法","其实，词汇的意义在使用过程中发生变化是很正常的。","Thật ra, nghĩa của từ thay đổi trong quá trình sử dụng là rất bình thường."],["③ 例子","比如“走”，在古代是“跑”的意思，现在却是“步行”的意思。","Ví dụ “走” thời xưa nghĩa là “chạy”, nay lại nghĩa là “đi bộ”."],["④ 结论","所以，学习成语的时候，不能只看字面意思，还要了解它的古今变化。","Vì vậy khi học thành ngữ, không thể chỉ nhìn nghĩa mặt chữ, còn phải hiểu sự thay đổi xưa nay."]],"links":[["Nêu nghĩa xưa",["……出自……","原来的意思是……","不管……还是……，都……"]],["Chuyển sang nghĩa nay",["后来……","发展到今天，……","现在人们用它来形容……"]],["Nêu quan điểm",["其实，……是很正常的","一般来说，……；但也有……","比如……"]],["Kết luận",["所以，……","了解……对……很有帮助","不能只……，还要……"]]],"open":[["解释式","“朝三暮四”出自一个寓言故事，原来的意思是实际上没有变化。"],["规律式","一般来说，成语的意义是稳定的，很少发生变化，但“朝三暮四”是个例外。"],["提问式","早上三颗、晚上四颗，和早上四颗、晚上三颗，有什么不同吗？"]],"close":[["结论式","所以，学习成语的时候，不能只看字面意思，还要了解它的古今变化。"],["感想式","了解词义的变化，让我觉得学汉语更有意思了。"],["总结式","语言是活的，词义的变化正是语言发展的结果。"]],"from_text":[["不是……，而是……","成语的意思不是每个字的简单相加，而是一个完整的整体。","Lấy từ 好句 ①: giải thích khái niệm."],["一般来说，……很少……","一般来说，成语的意义是稳定的，很少发生变化。","Lấy từ 好句 ②: câu mở bài."],["相处久了，彼此……","人们使用久了，词汇的意思也会慢慢发生变化。","Lấy từ 好句 ③: giải thích nguyên nhân."],["哪有……呢？","如果只看字面意思，哪有可能真正理解成语呢？","Lấy từ 好句 ④: câu hỏi tu từ."],["发展到今天，……已经完全改变了","发展到今天，“朝三暮四”这个成语的意义已经完全改变了。","Lấy từ 好句 ⑤: chuyển sang nghĩa nay."]],"vocab":[["意义","yìyì","ý nghĩa","成语的意义","idea"],["原来","yuánlái","vốn dĩ, ban đầu","原来的意思","idea"],["古代","gǔdài","cổ đại","古代的意思","idea"],["现代","xiàndài","hiện đại","现代汉语","idea"],["变化","biànhuà","thay đổi","发生变化","idea"],["形容","xíngróng","miêu tả, hình dung","用来形容……","idea"],["专一","zhuānyī","chuyên nhất, chung thủy","对感情不专一","idea"],["字面","zìmiàn","mặt chữ","字面意思","idea"],["出自","chūzì","xuất phát từ","出自一个寓言","act"],["使用","shǐyòng","sử dụng","使用过程中","act"],["发展","fāzhǎn","phát triển","发展到今天","act"],["理解","lǐjiě","hiểu","正确理解","act"],["词汇","cíhuì","từ vựng","词汇的意义","lesson"],["固定","gùdìng","cố định","固定的结构","lesson"],["整体","zhěngtǐ","chỉnh thể","整体性","lesson"],["完整","wánzhěng","hoàn chỉnh","完整的意思","lesson"],["综合","zōnghé","tổng hợp","综合起来","lesson"],["寓言","yùyán","ngụ ngôn","寓言故事","lesson"],["似乎","sìhū","dường như","似乎没有变化","lesson"],["显得","xiǎnde","tỏ ra","显得很有意思","lesson"],["古今","gǔ jīn","xưa và nay","古今不同","bonus"],["随着时代的发展","suízhe shídài de fāzhǎn","cùng với sự phát triển của thời đại","随着时代的发展，词义也在变化","bonus"],["一词多义","yì cí duō yì","một từ nhiều nghĩa","汉语里一词多义的现象很多","bonus"],["望文生义","wàng wén shēng yì","nhìn chữ đoán nghĩa (sai)","学成语不能望文生义","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 8"],["bonus","加分 · thành ngữ"]],"legend":["① Nghĩa xưa","② Nghĩa nay","③ Quan điểm + ví dụ","④ Kết luận"],"samples":{"speak":[{"who":"从故事说起","meta":"Hướng A · bài nói ~1 phút 30","p":["“朝三暮四”出自一个寓言故事。老人说早上给猴子三颗橡子，晚上给四颗，猴子们很不高兴；改成早上四颗、晚上三颗，猴子们马上就显得格外开心。其实，不管是哪一种，猴子都没有得到什么，也没有失去什么。","可是，发展到今天，这个成语的意义已经完全改变了。现在人们用它来形容做事经常改变，甚至形容一个人对感情不专一。","其实，词汇的意义在使用过程中发生变化是很正常的，比如“走”在古代是“跑”的意思，现在却是“步行”的意思。","所以我觉得，学习成语的时候，不能只看字面意思，还要了解它的古今变化。"],"vi":"“朝三暮四” bắt nguồn từ truyện ngụ ngôn: ông lão cho khỉ sáng ba chiều bốn, khỉ không vui; đổi thành sáng bốn chiều ba, khỉ vui hẳn. Thực ra cách nào khỉ cũng chẳng được chẳng mất. Nhưng đến nay nghĩa thành ngữ đã đổi hoàn toàn: chỉ làm việc hay thay đổi, thậm chí không chung thủy. Nghĩa của từ thay đổi là bình thường, ví dụ “走” xưa là “chạy”, nay là “đi bộ”. Vì vậy học thành ngữ không thể chỉ nhìn mặt chữ."},{"who":"和越南语比一比","meta":"Hướng C · bài nói ~1 phút 30","p":["一般来说，成语的意义是稳定的，很少发生变化，但“朝三暮四”是个例外。","它原来的意思是实际上没有变化，后来用来形容做事经常改变，到今天甚至专门用来形容对感情不专一。","这种情况在每种语言中都会出现。比如越南语里有很多汉越词，它们的意思和现代汉语并不完全一样。“方便”在越南语里是“phương tiện”，意思却变成了“交通工具”。","我觉得了解词义的变化对汉语学习很有帮助，它能让我们少用错词，也让学汉语显得更有意思了。"],"vi":"Nói chung nghĩa thành ngữ ổn định, nhưng 朝三暮四 là ngoại lệ: từ “thực chất không đổi” → “hay thay đổi” → “không chung thủy”. Ngôn ngữ nào cũng vậy: nhiều từ Hán Việt khác nghĩa tiếng Trung hiện đại, ví dụ 方便 trong tiếng Việt là “phương tiện” (xe cộ). Hiểu sự đổi nghĩa giúp ít dùng sai từ và học thú vị hơn."}],"write":[{"who":"范文 1 · 古义和今义","meta":"Dạng HSK5 · khoảng 80 chữ","title":"“朝三暮四”的古与今","p":["“朝三暮四”出自一个寓言故事，原来的意思是实际上没有变化。","发展到今天，它的意义已经完全改变了，","现在用来形容做事经常改变，或者对感情不专一。","所以，学成语不能只看字面意思。"],"vi":"Bố cục 4 câu: nghĩa xưa → chuyển → nghĩa nay → bài học."},{"who":"范文 2 · 汉语里的其他例子","meta":"Dạng HSK5 · khoảng 80 chữ","title":"“朝三暮四”的古与今","p":["词汇的意义在使用过程中会发生变化，“朝三暮四”就是一个例子。","汉语里这样的词还有很多，","比如“走”在古代是“跑”，“汤”在古代是“热水”。","了解这些变化，能帮我们更好地理解汉语。"],"vi":"Mở bằng nhận định chung, chứng minh bằng 走 và 汤, kết bằng lợi ích."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"“朝三暮四”的古与今","p":["一般来说，成语的意义是稳定的，很少发生变化，但“朝三暮四”是个例外。","它出自一个寓言故事：老人给猴子橡子，不管是早上三颗晚上四颗，还是早上四颗晚上三颗，实际上都没有变化。发展到今天，“朝三暮四”这个成语的意义已经完全改变了，现在用来形容做事经常改变，甚至对感情不专一。","其实，词汇的意义在使用过程中发生变化是很正常的，比如“走”在古代是“跑”的意思。","所以，学习成语不是简单地记住字面意思，而是要了解它完整的古今意义。"],"good":["一般来说，成语的意义是稳定的，很少发生变化","发展到今天，“朝三暮四”这个成语的意义已经完全改变了","不是简单地记住字面意思，而是要了解它完整的古今意义"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 一般来说，……很少发生变化 · 发展到今天，……已经完全改变了 · 不是……，而是……."}]},"w5":["意义","原来","古代","现代","变化","形容","字面","使用","发展","理解","词汇","固定","整体","完整","综合","寓言","似乎","显得","格外","方式","限制","相处","彼此"],"step_names":["① 古义","② 今义","③ 看法 + 例子","④ 结论"],"timer":[["① 25s",25],["② 20s",20],["③ 30s",30],["④ 15s",15]],"build_title":"选一个方向，拼出你的看法","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 从故事说起":[["“朝三暮四”出自一个寓言故事，不管是早上三颗晚上四颗，还是早上四颗晚上三颗，猴子实际上都没有得到什么。","老人给猴子橡子，早上三颗晚上四颗，猴子不高兴；改成早上四颗晚上三颗，猴子就显得格外开心。"],["发展到今天，这个成语的意义已经完全改变了，现在用来形容做事经常改变，甚至对感情不专一。","后来，人们用它来形容做事经常改变，到今天甚至用来形容对感情不专一的人。"],["其实，词汇的意义在使用过程中发生变化是很正常的，比如“走”在古代是“跑”的意思。","我觉得这种变化很有意思，每种语言里都有这样的例子。"],["所以，学习成语的时候，不能只看字面意思，还要了解它的古今变化。","了解词义的变化，让我觉得学汉语更有意思了。"]],"B · 汉语里的其他例子":[["一般来说，成语的意义是稳定的，很少发生变化，但“朝三暮四”是个例外。","词汇的意义在使用过程中会发生变化，“朝三暮四”就是一个例子。"],["它原来的意思是实际上没有变化，现在却用来形容做事经常改变。","发展到今天，这个成语的意义已经完全改变了。"],["汉语里这样的词还有很多，比如“走”在古代是“跑”，“汤”在古代是“热水”。","再比如“金”，古代指各种金属，现在一般指黄金。"],["了解这些变化，能帮我们更好地理解汉语。","所以，学汉语不能只看字面意思。"]],"C · 和越南语比一比":[["“朝三暮四”原来的意思是实际上没有变化，现在却用来形容做事经常改变。","发展到今天，“朝三暮四”这个成语的意义已经完全改变了。"],["这种情况在每种语言中都会出现，越南语也不例外。","其实，词汇的意义在使用过程中发生变化是很正常的。"],["比如越南语里有很多汉越词，它们的意思和现代汉语并不完全一样。","比如“方便”在越南语里是“phương tiện”，意思却变成了“交通工具”。"],["我觉得了解词义的变化对汉语学习很有帮助。","所以，我们学汉语的时候要特别注意这些词。"]]},"quiz":[["“朝三暮四”现在是什么意思？",["早上吃三个，晚上吃四个","做事经常改变；对感情不专一"],1,"Nghĩa nay mang nghĩa xấu."],["Câu nào hợp làm câu mở bài?",["一般来说，成语的意义是稳定的，但“朝三暮四”是个例外。","从前有位老人，喂养了一群猴子当宠物。相处久了……"],0,"Câu 2 kể chuyện quá dài, chưa vào đề."],["Câu nào nói về “今义”?",["发展到今天，这个成语的意义已经完全改变了。","猴子觉得自己吃了亏。"],0,"Câu 2 chỉ là tình tiết câu chuyện."],["Câu nào đúng?",["不管是早上三颗还是早上四颗，实际上都没有变化。","不管是早上三颗或者早上四颗，实际上都没有变化。"],0,"不管……还是……"],["Câu nào dùng 不是……而是…… đúng?",["成语的意思不是每个字的相加，而是一个完整的意思。","成语的意思不是每个字的相加，但是一个完整的意思。"],0,"不是……，而是……"],["Câu kết nào tốt hơn?",["猴子们都很开心。","所以，学成语不能只看字面意思，还要了解它的古今变化。"],1,"Câu kết nêu quan điểm, bài học."]],"fix":[["这个成语的意义已经完全改变。","这个成语的意义已经完全改变了。","已经……了: thay đổi đã hoàn thành."],["现在人们用它形容对感情不专一的人们。","现在人们用它形容对感情不专一的人。","Danh từ có định ngữ không thêm 们."],["“走”在古代是“跑”的意义。","“走”在古代是“跑”的意思。","Nghĩa của một từ dùng 意思; 意义 thường là ý nghĩa, giá trị."],["词汇的意义发生变化很正常的。","词汇的意义发生变化是很正常的。","Cấu trúc 是……的 cần 是."],["我们不能只看字面意思，也要了解古今变化。","我们不能只看字面意思，还要了解古今变化。","不能只……，还要……"],["发展到今天，成语的意思改变得很完全。","发展到今天，成语的意思已经完全改变了。","完全 làm trạng ngữ đứng trước động từ."]],"tpl":"“朝三暮四”的古与今\n“朝三暮四”出自【……】，原来的意思是【……】。发展到今天，【今义】。其实，【看法】，比如【例子】。所以，【结论】。","chk":[["topic","Bám đề: có nhắc 朝三暮四","朝三暮四"],["old","Có nghĩa xưa (原来 · 古代 · 没有变化)","原来|古代|没有变化|出自"],["new","Có nghĩa nay (现在 · 今天 · 经常改变 · 不专一)","现在|今天|经常改变|不专一"],["view","Có quan điểm + ví dụ (其实 · 比如 · 正常)","其实|比如|例如|正常|我觉得|我认为"],["end","Có câu kết (所以 · 总之 · 不能只)","所以|总之|不能只"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> nghĩa xưa, nghĩa nay, một ví dụ đổi nghĩa khác và một câu quan điểm/kết. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“谈语言现象”的题目都可以这样写","var_lead":"Đề về hiện tượng ngôn ngữ / văn hóa đều dùng khung: <b>hiện tượng cụ thể → giải thích → mở rộng + ví dụ → quan điểm<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）“朝三暮四”的古与今","一般来说，成语的意义是稳定的，但……"],["请以“我最喜欢的一个成语”为题写一段话。","我最喜欢的成语是……，它出自……"],["谈谈学习成语的好处和困难。","成语是汉语中非常有特点的一部分词汇……"],["举例说说你母语中一个词的意思变化。","在越南语里，……这个词原来的意思是……"],["你觉得网络流行语会改变汉语吗？","随着时代的发展，很多网络流行语……"],["请以“学汉语时闹过的笑话”为题写一段话。","刚学汉语的时候，我只看字面意思，结果……"]],"homework":"<b>Bài về nhà:<\/b> chọn một hướng (A–C) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “‘朝三暮四’的古与今” · bắt buộc có nghĩa xưa, nghĩa nay, một ví dụ khác và một khung 好句 của bài khóa."}};</script>
