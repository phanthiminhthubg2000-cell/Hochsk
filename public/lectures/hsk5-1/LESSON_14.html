<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 14 · 北京的四合院 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

ểu tượng, nói tên công trình và quốc gia bằng tiếng Trung, rồi bấm “？”.","items":[["🗼","埃菲尔铁塔 · 法国","tháp Eiffel · Pháp"],["🗽","自由女神像 · 美国","tượng Nữ thần Tự do · Mỹ"],["🏛️","古罗马斗兽场 · 意大利","đấu trường La Mã · Ý"],["🔺","金字塔 · 埃及","Kim tự tháp · Ai Cập"],["🎭","悉尼歌剧院 · 澳大利亚","Nhà hát Opera Sydney · Úc"],["⛩️","鸟居 · 日本","cổng torii · Nhật Bản"]],"note":"Bài này giới thiệu một kiến trúc tiêu biểu của Trung Quốc: <b class='zh'>四合院<\/b>."},{"tab":"你知道四合院吗","title":"你知道中国北京的四合院吗？","type":"discuss","q":"你知道中国北京的四合院吗？参观过的话，请给老师和同学们讲一讲。","vn":"Bạn có biết tứ hợp viện ở Bắc Kinh không? Nếu đã tham quan, hãy kể cho thầy cô và các bạn.","answer_zh":"四合院是北京传统的民居，四面都是房子，中间有一个院子。我去北京旅游的时候，在胡同里参观过一个四合院，院子里种着花和树，非常安静。","answer_vn":"Tứ hợp viện (四合院): nhà ở truyền thống, bốn phía là dãy nhà, ở giữa là sân vuông. Thường nằm trong các ngõ (胡同)."},{"tab":"你家的房子","title":"你们国家的传统民居是什么样的？","type":"discuss","q":"你们国家的传统民居是什么样的？和四合院有什么相同或不同的地方？","vn":"Nhà ở truyền thống của nước bạn trông thế nào? Giống và khác tứ hợp viện ở đâu?","answer_zh":"越南北方农村的传统民居一般有一个院子，正房在中间，旁边有厨房，院子前面常常有一个池塘。和四合院一样，一家几代人住在一起；不同的是，越南的院子一般没有四面都围起来。","answer_vn":"Ví dụ nhà truyền thống Bắc Bộ: sân, nhà chính, bếp bên cạnh, ao trước nhà; nhiều thế hệ cùng sống, nhưng không khép kín bốn phía."}],"GAME":{"fill":[["四合院，是中国华北地区民居中的一种{}建筑形式。","组合",["组合","组成","组织","结合"]],["{}四合，“四”指东、西、南、北四面……","所谓",["所谓","所以","所有","称为"]],["四合院在中国汉族民居中历史最悠久，分布最{}。","广泛",["广泛","广大","广阔","宽广"]],["而有钱人家的，{}是由好几座四合院并列组成的。","通常",["通常","常常","经常","往常"]],["一般包括长辈的卧室和{}日常起居、接待客人等功能的客厅。","具备",["具备","准备","具有","装备"]],["有的人家{}喜欢用大盆养金鱼。","则",["则","就","却","而"]],["对{}生活情趣起了很大作用……","创造",["创造","制造","建造","造成"]],["{}最为人们所喜爱。","因而",["因而","反而","然而","从而"]],["住在四合院里的人不常与周围的邻居{}。","打交道",["打交道","打招呼","打电话","打听"]],["这种{}的情感是许多老北京人无法忘记的。","浓浓",["浓浓","淡淡","深深","慢慢"]]],"order":[["四合院|在中国汉族民居中|历史|最悠久。"],["北京|有各种规模的|四合院。"],["院子|是十分理想的|室外生活|空间。"],["有的人家|则喜欢|用大盆|养金鱼。"],["住户|多为|普通|劳动人民。"],["院中的北房|是|正房。"]]},"GOOD":[{"zh":"所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子","vn":"cái gọi là “tứ hợp”: “tứ” chỉ bốn phía đông tây nam bắc, “hợp” là bốn dãy nhà quây lại, ở giữa thành một cái sân vuông","why":"Cách <b>giải thích một khái niệm<\/b> chuẩn văn viết: <b>所谓 X，“A”指……，“B”就是……<\/b> — dùng ngay cho bài giới thiệu một công trình, một phong tục.","frame":"所谓 + 词语，“A”指……，“B”就是……","apply":"所谓“胡同”，就是北京城里那些又窄又长的小街道。","apply_vn":"Cái gọi là “hồ đồng” chính là những con phố nhỏ hẹp và dài trong thành Bắc Kinh."},{"zh":"只要人们一提到四合院，便自然会想到北京四合院","vn":"chỉ cần người ta nhắc đến tứ hợp viện là tự nhiên sẽ nghĩ ngay đến tứ hợp viện Bắc Kinh","why":"<b>只要……一提到 A，便自然会想到 B<\/b>: nói về tính tiêu biểu, nổi tiếng của một sự vật.","frame":"只要（人们）一提到 A，便自然会想到 B","apply":"只要人们一提到越南美食，便自然会想到河粉。","apply_vn":"Chỉ cần nhắc đến ẩm thực Việt Nam, người ta tự nhiên nghĩ ngay đến phở."},{"zh":"院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流","vn":"sân không chỉ kéo gần quan hệ giữa con người và thiên nhiên, mà còn giúp người trong nhà giao lưu tình cảm","why":"<b>A 不仅拉近了……，也让……<\/b>: nêu hai tác dụng của một sự vật — rất hợp để nói “ý nghĩa” của kiến trúc.","frame":"A + 不仅拉近了……的关系／距离，也让……","apply":"这个广场不仅拉近了邻居之间的距离，也让老人们有了锻炼的地方。","apply_vn":"Quảng trường này không chỉ kéo gần hàng xóm mà còn giúp người già có chỗ tập thể dục."},{"zh":"在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣","vn":"trong khoảng sân nhỏ, cả nhà sống những ngày không tranh với đời, tận hưởng trọn vẹn niềm vui gia đình","why":"Miêu tả cuộc sống yên bình: <b>过着……的日子，充分享受……的乐趣<\/b> — câu văn đẹp cho bài miêu tả.","frame":"在……里，+ 某人 + 过着……的日子，充分享受……的乐趣","apply":"退休以后，爷爷在乡下过着安静的日子，充分享受种花养鱼的乐趣。","apply_vn":"Sau khi nghỉ hưu, ông sống những ngày yên tĩnh ở quê, tận hưởng niềm vui trồng hoa nuôi cá."},{"zh":"邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人","vn":"giữa hàng xóm tuy đôi khi cũng có mâu thuẫn, nhưng phần lớn là giúp đỡ lẫn nhau, không phải ruột thịt mà hơn ruột thịt","why":"Câu đánh giá khách quan: <b>虽然有时也……，但更多时候是……<\/b> + thành ngữ <b>不是亲人胜过亲人<\/b>.","frame":"A 之间有时虽然也有……，但更多时候是……","apply":"我和同屋之间有时虽然也有矛盾，但更多时候是互相帮助。","apply_vn":"Tôi và bạn cùng phòng tuy đôi khi có mâu thuẫn, nhưng phần lớn là giúp đỡ nhau."}],"GRAMMAR":[{"word":"所谓","py":"suǒwèi","pos":"形容词","forms":["所谓 + 词语，（就是）……（提出需要解释的词语）","所谓的 + “……”（某些人所说的，表示不同意、不承认）"],"vn":"<b>所谓<\/b> ① <b>cái gọi là<\/b> — đưa ra một từ cần giải thích, sau đó giải thích: 所谓四合，……. ② <b>cái mà (ai đó) gọi là<\/b> — mang ý <b>không đồng ý, không thừa nhận<\/b>, thường có ngoặc kép: 他所谓的“新闻”，其实我们早就知道了.","text":"所谓四合，“四”指东、西、南、北四面……","ex":[["很多时候，烦恼是自己找来的，这就是所谓的“自寻烦恼”。","Nhiều khi phiền não là tự chuốc lấy, đó chính là cái gọi là “tự tìm phiền não”. (giải thích)"],["他所谓的“新闻”，其实我们早就知道了！","Cái “tin tức” mà anh ta nói, thật ra chúng tôi biết từ lâu rồi! (không thừa nhận)"],["现在市场上所谓的“健康食品”其实没有统一的标准。","Cái gọi là “thực phẩm sức khỏe” trên thị trường hiện nay thật ra không có tiêu chuẩn thống nhất. (không thừa nhận)"]],"err":[["❌ 所谓四合院是很漂亮。","✅ 所谓四合院，就是四面房屋围在一起的院子。","所谓 dùng để giải thích khái niệm, sau đó phải có lời giải thích."],["❌ 这是所谓。","✅ 这就是所谓的“……”。","所谓 phải đi kèm từ cần giải thích."]],"book":[["四面房屋围在一起，中间形成一个方形的院子，____________。（所谓）","Gợi ý: đó chính là cái gọi là tứ hợp viện.","四面房屋围在一起，中间形成一个方形的院子，这就是所谓的“四合院”"],["A：这么长时间没回家了，回去后感觉怎么样？<br>B：____________。（所谓）","Gợi ý: “nhà” chính là nơi có bố mẹ.","所谓“家”，就是有爸爸妈妈的地方，回去以后感觉特别温暖"],["这次考试怎么又这么差？____________！（所谓）","Gợi ý: cái “phương pháp học” bạn nói chẳng có tác dụng.","你所谓的“学习方法”根本没有用"]],"drill":[["“所谓”在这里表示什么？ 所谓“胡同”，就是北京的小街道。",["提出需要解释的词语","表示不同意"],0,"Giải thích khái niệm."],["“所谓”在这里表示什么？ 他所谓的“好办法”，其实一点儿用也没有。",["提出需要解释的词语","表示不同意"],1,"Không thừa nhận."],["Câu nào đúng?",["所谓“民居”，就是老百姓住的房子。","所谓“民居”是。","“民居”所谓老百姓的房子。"],0,"所谓 X，就是……"]]},{"word":"则","py":"zé","pos":"量词／连词","forms":["量词：一则 + 新闻／故事（成篇或成条的短小文字）","连词：A……，（而）B 则……（前后两项的对比）","连词：……则……（因果，书面语，= 就）"],"vn":"<b>则<\/b> ① lượng từ cho bài văn ngắn: 一则新闻、两则故事. ② liên từ <b>đối chiếu<\/b>: A…，(而) B <b>则<\/b>… (còn B thì…), đứng sau chủ ngữ của vế sau. ③ liên từ chỉ <b>nhân quả<\/b> (văn viết) = 就: 有风则寒，无风则暖.","text":"有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。","ex":[["今天的报纸上有一则非常重要的新闻。","Báo hôm nay có một mẩu tin rất quan trọng. (lượng từ)"],["猫享受独处的快乐，而狗则是希望和别人分享快乐。","Mèo tận hưởng niềm vui một mình, còn chó thì muốn chia sẻ niềm vui với người khác. (đối chiếu)"],["北京的冬天，有风则寒，无风则暖。","Mùa đông Bắc Kinh có gió thì lạnh, không gió thì ấm. (nhân quả)"]],"err":[["❌ 有的人喜欢喝茶，则有的人喜欢喝咖啡。","✅ 有的人喜欢喝茶，有的人则喜欢喝咖啡。","则 đứng sau chủ ngữ của vế sau."],["❌ 一则书","✅ 一本书／一则故事","则 chỉ dùng cho bài văn ngắn: tin, truyện, quảng cáo."]],"book":[["A：最近你读了什么有意思的书吗？<br>B：____________。（则－量词）","Gợi ý: đọc mấy mẩu chuyện thành ngữ.","我读了几则很有意思的成语故事"],["A：你知道中国北方人和南方人吃饭的习惯有什么不同吗？<br>B：____________。（则－连词）","Gợi ý: miền Bắc ăn mì, miền Nam thì ăn cơm.","北方人喜欢吃面食，南方人则喜欢吃米饭"],["一项调查显示，只有37%的人愿意回到没有手机的时代，____________。（则－连词）","Gợi ý: còn 63% thì không muốn.","而另外63%的人则不愿意"]],"drill":[["“则”在这里是什么词？ 我在报纸上看到一则消息。",["量词","连词"],0,"一则 + tin tức."],["“则”放在哪里？ 哥哥喜欢运动，<u>A<\/u>弟弟<u>B<\/u>喜欢看书。",["A","B"],1,"Sau chủ ngữ vế sau: 弟弟则喜欢看书."],["“有风则寒”中“则”的意思是：",["就","但是","一则"],0,"则 = 就 (nhân quả)."]]},{"word":"为……所……","py":"wéi……suǒ……","pos":"固定结构","forms":["A + 为 + B + 所 + 动词（A 被 B……，书面语）"],"vn":"<b>为……所……<\/b> là cấu trúc bị động văn viết: <b>A 为 B 所 V<\/b> = A 被 B V (A được/bị B…). 为 đọc <b>wéi<\/b>. Động từ thường hai âm tiết: 所感动、所喜爱、所熟悉、所用.","text":"对创造生活情趣起了很大作用，因而最为人们所喜爱。","ex":[["认识他的人，没有人不为他认真的工作态度所感动。","Những ai quen anh ấy, không ai không cảm động trước thái độ làm việc nghiêm túc của anh."],["有了科学，大自然就可以更好地为人所用。","Có khoa học, thiên nhiên có thể được con người sử dụng tốt hơn."],["这首歌一直为年轻人所喜爱。","Bài hát này luôn được giới trẻ yêu thích."]],"err":[["❌ 这本书为大家喜爱。","✅ 这本书为大家所喜爱。","Cấu trúc đầy đủ: 为……所 + V."],["❌ 他为老师所批评了。（口语中不自然）","✅ 他被老师批评了。","为……所…… là văn viết, khẩu ngữ hằng ngày dùng 被."]],"book":[["这个老师____________，____________。（为……所……）","Gợi ý: được học sinh yêu quý, vì rất quan tâm học sinh.","这个老师为学生们所喜爱，因为他非常关心每一个学生"],["在这座小城，她____________，因为她把这里的每一位老人都当成家人来照顾。（为……所……）","Gợi ý: được mọi người biết đến.","在这座小城，她为大家所熟悉"],["A：你知道梅西这个人吗？<br>B：____________。（为……所……）","Gợi ý: là ngôi sao bóng đá được cả thế giới biết đến.","当然知道，他是为全世界球迷所熟悉的足球明星"]],"drill":[["“为……所……”的意思相当于：",["被","把","给"],0,"Bị động văn viết."],["Câu nào đúng?",["四合院最为人们所喜爱。","四合院为人们喜爱所。","四合院所为人们喜爱。"],0,"为 + B + 所 + V."],["“为……所……”中的“为”读：",["wéi","wèi"],0,"Đọc wéi."]]},{"word":"起","py":"qǐ","pos":"动词（补语）","forms":["动词 + 起（表示连接、结合和固定）：拉起手、关闭起大门、建立起……"],"vn":"<b>V + 起<\/b> làm bổ ngữ chỉ sự <b>nối liền, kết hợp, cố định<\/b>: 拉起手 (nắm tay nhau), 关闭起大门 (đóng chặt cổng lại), 建立起制度 (xây dựng nên chế độ). Khác với 起来 (bắt đầu) hay 起 chỉ hướng lên trên.","text":"只要关闭起大门，四合院内便形成一个封闭式的小环境。","ex":[["拉起手，我们就是好朋友。","Nắm tay nhau, chúng ta là bạn tốt."],["对公司来说，最重要的是建立起一套行之有效的制度。","Với công ty, quan trọng nhất là xây dựng nên một chế độ hiệu quả."],["他们用绳子把这些箱子捆起，放到了车上。","Họ dùng dây buộc những thùng này lại, đặt lên xe."]],"err":[["❌ 他拉起来我的手就跑。（意思不清）","✅ 他拉起我的手就跑。","Có tân ngữ ngay sau thường dùng V + 起 + tân ngữ."],["❌ 关闭起来大门","✅ 关闭起大门／把大门关起来","Khi có tân ngữ: V起 + O, hoặc 把 O + V起来."]],"book":[["他拉起我的手，____________。","Gợi ý: nói chúng ta mãi là bạn.","他拉起我的手，说我们永远是好朋友"],["我们两国____________。（动词+起）","Gợi ý: xây dựng nên quan hệ hữu nghị.","我们两国建立起了友好的关系"],["这是我们自己家的事，应该____________。（动词+起）","Gợi ý: đóng cửa lại tự giải quyết.","这是我们自己家的事，应该关起门来自己解决"]],"drill":[["“关闭起大门”中“起”表示：",["连接、固定","开始","向上"],0,"V + 起: kết hợp, cố định."],["选择：只要大家团结____来，就没有解决不了的困难。",["起","下","出"],0,"团结起来."],["Câu nào đúng?",["我们拉起手，一起往前走。","我们拉手起，一起往前走。","我们起拉手，一起往前走。"],0,"V + 起 + O."]]}],"HSK":{"r1":[{"text":["一位外国游客第一次来北京，导游带他去参观四合院。游客看了很久，问导游：“这么多房子，{36}？”导游说：“以前，一个大家庭的几代人都住在这里。”游客想了想说：“那他们吵架的时候怎么办？”导游笑着回答：“{37}，因为院子太小了，{38}。”"],"qs":[{"n":36,"o":["一共住多少人","门票多少钱","什么时候建的","哪个房间最大"],"a":0,"why":"导游回答“一个大家庭的几代人都住在这里”，说明游客问的是住多少人。"},{"n":37,"o":["他们很少吵架","他们每天都吵","他们会搬家","他们去公园吵"],"a":0,"why":"后面说“因为院子太小了”，说明吵架很少。"},{"n":38,"o":["吵什么大家都能听见","没有地方睡觉","房子太旧了","邻居太多了"],"a":0,"why":"院子小，吵架大家都听得见，所以很少吵，形成幽默。"}]},{"text":["胡同是北京特有的小街道，{39}。据说北京最多的时候有六千多条胡同，每一条胡同都有自己的名字和故事。不过，随着城市的发展，很多胡同被拆了，{40}。近年来，北京开始重视保护胡同，{41}，还开了很多咖啡馆和小商店。现在，胡同已经成为{42}，吸引了大量的中外游客。"],"qs":[{"n":39,"o":["四合院就分布在胡同的两边","所以很少有人住","因为街道很宽","可是没有名字"],"a":0,"why":"胡同和四合院有密切的关系，四合院分布在胡同两边。"},{"n":40,"o":["人们搬进了高楼","胡同越来越多","游客也越来越多","四合院也变大了"],"a":0,"why":"胡同被拆以后，人们搬进了高楼。"},{"n":41,"o":["一些胡同经过修整，保留了原来的样子","把所有胡同都拆了","不让游客进去","改成了高速公路"],"a":0,"why":"保护胡同的做法是修整、保留原样。"},{"n":42,"o":["北京的一张“名片”","最危险的地方","没有人去的地方","新的工厂"],"a":0,"why":"吸引了大量游客，说明成了北京的代表，即“名片”。"}]}],"r2":[{"start":46,"paras":["后来，他在苏州买下了一块地，请人设计了一座有山有水的园林。","明朝时，有一位官员因为不满意官场的生活，决定回到家乡过安静的日子。","他把这座园林叫作“拙政园”，意思是自己不会做官，只会种花种菜。","园林建成以后，他每天在里面读书、种花，充分享受与世无争的乐趣。","如今，拙政园已经成为苏州园林的代表，每年都有很多游客来参观。"],"ans":["B","A","C","D","E"],"why":"官员决定回乡（B）→ 建园林（A）→ 命名（C）→ 在园中生活（D）→ 如今的影响（E）。"}],"r3":[{"text":["中国传统建筑有很多特点，其中最重要的一点是讲究“对称”。所谓对称，就是以一条中间线为准，左右两边的建筑在大小、形状上都一样。","北京的故宫就是一个很好的例子。从天安门到神武门，有一条长长的中轴线，故宫里最重要的建筑都建在这条线上，其他建筑则分布在两边，左右对称。四合院也一样，北房在中间，东西厢房在两边，互相对着。","为什么中国人这么喜欢对称呢？一方面，对称的建筑看起来很稳定、很整齐；另一方面，这也反映了中国人重视“中”和“平衡”的思想。<u><b>在古人看来，中间的位置最重要<\/b><\/u>，所以最重要的人住在中间的房子里。","当然，也有一些中国建筑并不讲究对称，比如江南的园林，它们更追求自然的美。"],"qs":[{"n":56,"s":"什么是“对称”？","o":["房子越高越好","左右两边的建筑大小、形状一样","建筑都是圆的","院子在房子外面"],"a":1,"why":"第一段：左右两边的建筑在大小、形状上都一样。"},{"n":57,"s":"关于故宫，可以知道：","o":["最重要的建筑建在中轴线上","没有中轴线","建筑都在一边","不讲究对称"],"a":0,"why":"第二段：最重要的建筑都建在这条线上。"},{"n":58,"s":"根据画线句子，四合院里最重要的人住在：","o":["东厢房","西厢房","北房（正房）","大门旁边"],"a":2,"why":"中间的位置最重要；四合院北房在中间。"},{"n":59,"s":"根据最后一段，江南园林：","o":["特别讲究对称","更追求自然的美","都建在北京","没有花和树"],"a":1,"why":"最后一段：它们更追求自然的美。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出大卫参观四合院的经历。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể trải nghiệm tham quan tứ hợp viện của David.","panels":[["🏮","大卫跟着导游走进了一条老胡同。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk19986_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#cfe8ff\"/><stop offset=\"1\" stop-color=\"#eef7ff\"/><\/linearGradient><\/defs><rect width=\"320\" height=\"240\" fill=\"url(#sk19986_1)\"/><rect y path d=\"M14 -106 L30 -126 L26 -150\" stroke=\"#7a6bd6\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"26\" cy=\"-150\" r=\"4\" fill=\"#f6d1b1\"/><circle cx=\"0\" cy=\"-149\" r=\"8\" fill=\"#d9d6d2\"/><circle cx=\"-16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"-130\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -131 q0 -17 17 -17 q17 0 17 17 q-6 -8 -17 -9 q-11 1 -17 9z\" fill=\"#d9d6d2\"/><path d=\"M-8.5 -131 q3 -3 6 0 M2.5 -131 q3 -3 6 0\" stroke=\"#3b2f2f\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M-6 -125 q6 9 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><path d=\"M-12 -121 q2 1 3 0 M9 -121 q2 1 3 0\" stroke=\"#c99a7a\" stroke-width=\"1\" fill=\"none\"/><\/g><g transform=\"translate(155.0,48.0)\"><g transform=\"translate(0.0,0.0) scale(0.7,0.7)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: vào ngõ → vào tứ hợp viện → được bà chủ tiếp đãi → chụp ảnh, cảm nhận.","Có thể dùng: 所谓、接待、亲切、令人、充分、日子."],"sample":"暑假的时候，大卫来北京旅游，导游带他走进了一条安静的老胡同。他们来到一座四合院前，推开大门，只见院子里种着竹子，大盆里养着几条金鱼，十分安静。院子的主人王奶奶热情地接待了他们，请大卫喝茶，还给他讲了很多四合院的故事。王奶奶说，她在这里住了几十年，邻居们像亲人一样互相帮助。离开的时候，大卫和王奶奶拍了一张合影。他觉得，四合院里的生活令人感到特别亲切。","svn":"David theo hướng dẫn viên vào ngõ cổ, vào một tứ hợp viện có trúc và cá vàng; bà Vương nhiệt tình mời trà, kể chuyện tứ hợp viện và tình hàng xóm; lúc đi David chụp ảnh với bà, thấy cuộc sống ở đây thật thân thương."},"w72":{"prompt":"随着城市的发展，很多老房子被拆掉，建起了高楼大厦。有人认为这是社会进步的表现，也有人认为应该保护这些老建筑。请写一篇不少于200字的作文，谈谈你的看法。","vn":"Thành phố phát triển, nhiều nhà cổ bị phá để xây cao ốc. Có người cho đó là tiến bộ, có người cho rằng nên bảo vệ kiến trúc cũ. Viết bài không ít hơn 200 chữ nêu quan điểm.","min":200,"title":"别让城市失去记忆","tips":["Thừa nhận lợi ích của nhà cao tầng → quan điểm: nên bảo vệ → lý do 1 (ký ức, văn hóa) → lý do 2 (tình người, du lịch) → giải pháp: vừa phát triển vừa bảo vệ.","Dùng khung 好句: 只要人们一提到……，便自然会想到…… · ……不仅拉近了……，也让……"],"sample":"随着城市的发展，很多老房子被拆掉，建起了高楼大厦。高楼确实能让更多的人住上舒适的房子，但是我认为，老建筑同样应该好好保护。\n首先，具有传统特色的建筑是一个城市的记忆。只要人们一提到北京，便自然会想到胡同和四合院。如果这些老建筑都没了，城市就失去了自己的特点。\n其次，老建筑里还保存着一种生活方式。四合院的院子不仅拉近了人与自然的关系，也让邻居们像亲人一样互相帮助，这是高楼里很难找到的。\n当然，保护老建筑并不是不发展。我们可以把一些老房子修整好，让它们成为博物馆或者咖啡馆。\n总之，城市发展和保护老建筑并不矛盾，关键是要找到合适的办法。","svn":"Bài nghị luận: thừa nhận cao ốc có ích → quan điểm bảo vệ → 首先 ký ức thành phố → 其次 lối sống, tình hàng xóm → 当然 có thể tu sửa thành bảo tàng, quán cà phê → 总之 không mâu thuẫn."}},"PRACTICE":{"ex1":{"bank":["浓","广泛","具备","矛盾","日常","组合"],"items":[["现在的手机都{}很多功能，不再只是个打电话的工具。",["具备"]],["刚开始学中文的时候，我学的主要是一些{}用语。",["日常"]],["今天雾很{}，对面的建筑都看不清了。",["浓"]],["这个问题需要进行{}调查，然后才能做出决定。",["广泛"]],["这本书是由三个部分{}起来的。",["组合"]],["老人家里有两个儿子，他们俩常常闹{}。",["矛盾"]]]},"ex2":[["手机已经成为人们生活中的重要____部分。",["组成","组合"],0],["他的兴趣爱好非常____，跟谁都能聊到一块儿。",["广大","广泛"],1],["他坚持锻炼，____身体很好。",["因而","反而"],0],["是那位工程师____我把机器安装在这儿。",["令","让"],1]],"ex3match":{"title":"三、画线连接可以搭配的词语","groups":[[["产生","矛盾"],["接待","客人"],["创造","条件"],["组成","家庭"]],[["充分的","准备"],["广泛的","兴趣"],["幸福的","日子"],["固定的","样式"]]]},"ex3":[],"ex4":[["什么是四合院","建筑、所谓、广泛","四合院是中国华北地区的一种组合建筑形式。所谓四合，就是东西南北四面房屋围在一起，中间是一个方形的院子。四合院历史悠久，分布广泛。"],["北京四合院的结构与功能","规模、通常、功能、空间、则、因而、为","北京四合院规模不同，有钱人家的通常由好几座四合院组成。北房是正房，具备起居、接待客人等功能；两边是厢房。院子是理想的生活空间，有人种花，有人则养金鱼，因而最为人们所喜爱。"],["四合院的人际关系","起、打交道、令、矛盾","关闭起大门，四合院就是一个封闭的小环境，人们不常和邻居打交道，有一种令人感到亲切的气氛。大杂院里邻居之间有时也有矛盾，但更多时候是互帮互助。"]],"ext":{"title":"扩展 · 话题：建筑","words":[["屋子","wūzi","căn phòng"],["卧室","wòshì","phòng ngủ"],["阳台","yángtái","ban công"],["台阶","táijiē","bậc thềm"],["墙","qiáng","tường"],["玻璃","bōli","kính"],["宿舍","sùshè","ký túc xá"],["公寓","gōngyù","căn hộ"],["单元","dānyuán","đơn nguyên (cầu thang)"],["隔壁","gébì","nhà bên"],["大厦","dàshà","cao ốc"],["广场","guǎngchǎng","quảng trường"]],"items":[["这套房子除了客厅、卧室、厨房、卫生间，还有两个大{}。","阳台"],["我在外面租了套公寓，但下学期我想搬到学校{}去住。","宿舍"],["我家住在学知小区一号楼二{}403。","单元"],["她就住在我家{}，是我的邻居。","隔壁"]]}},"TEXT":[{"title":"什么是四合院","sub":"四面房屋，一个院子","paras":["四合院，是中国华北地区民居中的一种组合建筑形式。所谓四合，“四”指东、西、南、北四面，“合”就是四面房屋围在一起，中间形成一个方形的院子。四合院在中国汉族民居中历史最悠久，分布最广泛。不过，只要人们一提到四合院，便自然会想到北京四合院，这是因为传统的北京四合院都有一套固定的样式，十分具有代表性，在各种各样的四合院中，北京四合院可以代表其主要特点。"],"idea":"Tứ hợp viện là một kiểu <b>kiến trúc tổ hợp<\/b> của nhà dân vùng Hoa Bắc. “Tứ” là bốn phía đông tây nam bắc, “hợp” là bốn dãy nhà quây lại, ở giữa là <b>sân vuông<\/b>. Nó có lịch sử lâu đời, phân bố rộng nhất; nhưng nhắc đến tứ hợp viện người ta nghĩ ngay đến <b>Bắc Kinh<\/b> vì kiểu dáng cố định, rất tiêu biểu.","qs":[["四合院是哪个地区的民居？",["华南","华北","西北"],1],["“四合”中的“合”是什么意思？",["四面房屋围在一起","四个人住在一起","四个院子合在一起"],0],["为什么人们一提到四合院就会想到北京四合院？",["北京四合院最大","北京四合院有一套固定的样式，十分具有代表性","北京只有四合院"],1]]},{"title":"结构与功能","sub":"正房、厢房和院子","paras":["北京有各种规模的四合院。最简单的四合院只有一个院子，比较复杂的有两三个，而有钱人家的，通常是由好几座四合院并列组成的。大门一般开在东南角或西北角，院中的北房是正房，比其他房屋的规模大，一般包括长辈的卧室和具备日常起居、接待客人等功能的客厅。院子的两边是东西厢房，是晚辈们生活的地方。在正房和厢房之间建有走廊，可以供人行走和休息。院子是十分理想的室外生活空间。有的人家喜欢种草、养花、种竹子，有的人家则喜欢用大盆养金鱼。院子不仅拉近了人与自然的关系，也让家里人在此得到了感情的交流，对创造生活情趣起了很大作用，因而最为人们所喜爱。"],"idea":"Tứ hợp viện có nhiều quy mô; nhà giàu thường do <b>nhiều tứ hợp viện song song<\/b> hợp thành. Cổng ở góc đông nam hoặc tây bắc; <b>nhà chính<\/b> phía bắc là phòng ngủ của bề trên và phòng khách; hai bên là <b>chái nhà<\/b> cho con cháu; giữa có hành lang. <b>Sân<\/b> là không gian sống ngoài trời lý tưởng: trồng hoa, trúc, nuôi cá vàng — kéo gần người với thiên nhiên và tình cảm gia đình.","qs":[["有钱人家的四合院通常是什么样的？",["只有一个院子","由好几座四合院并列组成","没有院子"],1],["正房里一般住着谁？",["长辈","晚辈","客人"],0],["院子有什么作用？",["只能停车","拉近人与自然的关系，让家里人交流感情","放不用的东西"],1]]},{"title":"四合院的人际关系","sub":"小院与大杂院","paras":["只要关闭起大门，四合院内便形成一个封闭式的小环境。住在四合院里的人不常与周围的邻居打交道。在小院里，一家人过着与世无争的日子，充分享受家庭的乐趣，自然有一种令人感到自在亲切的气氛。但也有多户合住一座四合院的情况，被称为“大杂院”，住户多为普通劳动人民。邻里之间有时虽然也有矛盾，但更多时候是互帮互助，不是亲人胜过亲人，这种浓浓的情感是许多老北京人无法忘记的。"],"idea":"Đóng cổng lại, tứ hợp viện thành một môi trường <b>khép kín<\/b>; người trong nhà ít giao thiệp với hàng xóm, sống cuộc sống <b>không tranh với đời<\/b>, tận hưởng niềm vui gia đình. Cũng có khi nhiều hộ ở chung gọi là <b>“đại tạp viện”<\/b>, phần đông là người lao động; tuy có lúc mâu thuẫn nhưng phần lớn giúp đỡ nhau, <b>không phải ruột thịt mà hơn ruột thịt<\/b>.","qs":[["关闭起大门以后，四合院会怎么样？",["形成一个封闭式的小环境","变得很热闹","邻居们都进来"],0],["什么是“大杂院”？",["很大的公园","多户合住的一座四合院","有钱人的院子"],1],["大杂院里的邻居关系怎么样？",["从来不说话","有时有矛盾，但更多时候是互帮互助","常常吵架"],1]]}],"TEXT_EXTRA":{"compare_title":"北京四合院的结构","compare_head":["部分","位置","功能"],"compare":[["大门","东南角或西北角","出入"],["正房（北房）","院子北边，规模最大","长辈的卧室、客厅（日常起居、接待客人）"],["厢房","院子东西两边","晚辈生活的地方"],["走廊","正房和厢房之间","供人行走和休息"],["院子","中间","室外生活空间：种花、养鱼、交流感情"]],"bg":"有人曾说：“生活中不是缺少美，而是缺少发现美的眼睛。”美在生活中随处可见，建筑之美就是其中一个重要的组成部分。在世界各地旅行，我们可以欣赏（xīnshǎng）到不同的建筑，从中也可以了解到各地不同的历史、文化、风俗等，具有传统特色（tèsè）的建筑是一个国家、一个城市的记忆，四合院就是中国建筑的一个代表作。许多外国或外地游客来到北京旅游时，都会专门去看看北京的胡同（hútòng）和四合院。","bg_vn":"“Cuộc sống không thiếu cái đẹp, chỉ thiếu đôi mắt phát hiện ra cái đẹp.” Kiến trúc là một phần quan trọng của cái đẹp; qua kiến trúc có thể hiểu lịch sử, văn hóa, phong tục mỗi nơi. Kiến trúc truyền thống là “ký ức” của một đất nước, một thành phố — tứ hợp viện là tác phẩm tiêu biểu của kiến trúc Trung Quốc.","discuss_title":"讨论话题：建筑与旅游","discuss":["你最喜欢（或印象最深）的建筑是什么？你是怎么知道它的？","介绍一下你了解到的情况。","介绍一下你通过旅行这种方式来了解各地建筑的感受及收获。"],"write":"请以“我眼中最美的中国建筑”为题，介绍一下你了解到的或在中国旅行时亲眼所见的印象最深的一处建筑。尽量用上本课所学的生词，字数不少于100字。（→ xem mục 07 运用）"},"APPLY":{"topic":"请以“我眼中最美的中国建筑”为题，介绍一下你了解到的或在中国旅行时亲眼所见的印象最深的一处建筑","topic_vn":"Viết bài với đầu đề “Công trình kiến trúc Trung Quốc đẹp nhất trong mắt tôi”","intro":"Dạng đề giới thiệu + miêu tả + cảm nhận (介绍＋描写＋感受) · Công trình nào, biết đến thế nào → vị trí, lịch sử, đặc điểm → điều làm bạn ấn tượng nhất → thu hoạch / cảm nhận · Bài nói 1–2 phút, bài viết 100–150 chữ.","analyse":{"title":"“我眼中最美的中国建筑”：介绍 + 描写 + 我的感受","lead":"Đề yêu cầu chọn <b>một công trình<\/b> (bạn đã thấy tận mắt hoặc tìm hiểu được). Chữ <b>“我眼中”<\/b> và <b>“最美”<\/b> nghĩa là phải nói <b>vì sao bạn thấy nó đẹp<\/b> — không chỉ chép thông tin từ sách du lịch. Bố cục học từ bài khóa: <b>giải thích (所谓……) → kết cấu / đặc điểm → ý nghĩa với con người<\/b>.","parts":[["我眼中","Góc nhìn cá nhân: 在我看来、让我印象最深的是、我觉得最美的是……"],["最美的","Phải nêu cái đẹp cụ thể: màu sắc, hình dáng, cảnh xung quanh, ý nghĩa lịch sử…"],["中国建筑","Chọn một công trình: 四合院、长城、故宫、天坛、苏州园林…"],["（课本）尽量用上本课生词，不少于100字","Dùng: 建筑、所谓、广泛、代表、具备、功能、空间、创造、令、亲切、充分… và khung 好句 của bài khóa."]],"traps":[["Chép thông tin du lịch","Năm xây, diện tích, số phòng… → thiếu “我眼中”."],["Chọn nhiều công trình","Đề nói “一处建筑” — chỉ một."],["Thông tin sai","Không chắc năm xây thì viết “有几百年的历史”."],["Thiếu cảm nhận","Kết bài nên nói bạn hiểu thêm gì về văn hóa Trung Quốc."]],"link":"<b>Liên hệ bài 14:<\/b> phần 背景分析: “生活中不是缺少美，而是缺少发现美的眼睛” — câu mở bài rất hay; “具有传统特色的建筑是一个国家、一个城市的记忆” — câu kết đẹp. Khung 好句 “只要人们一提到……，便自然会想到……” dùng để nói tính tiêu biểu."},"steps":[["①","点题：哪一处建筑","Mở bài: tên công trình, bạn biết/đến đó khi nào.","在我眼中，最美的中国建筑是……"],["②","介绍：位置、历史、特点","Giới thiệu ngắn: ở đâu, lịch sử, kết cấu đặc biệt.","它位于……，历史悠久……"],["③","描写：最美的地方","<b>Trọng tâm.<\/b> Điều làm bạn ấn tượng nhất, miêu tả cụ thể.","让我印象最深的是……"],["④","感受","Kết: cảm nhận, thu hoạch về văn hóa.","它让我明白了……"]],"formula":["最美的是……","位置、历史、特点","印象最深：……","感受：……是城市的记忆"],"choices_title":"Chọn một công trình","choices_key":"Ví dụ: ","choices":[["A · 北京四合院","tứ hợp viện","Dùng ngay tư liệu bài khóa: sân, nhà chính, chái nhà, tình hàng xóm.","院子里的金鱼和竹子"],["B · 长城","Vạn Lý Trường Thành","Công trình nổi tiếng nhất; cảm giác khi leo lên.","不到长城非好汉"],["C · 苏州园林","vườn Tô Châu","Vườn cảnh nhỏ mà tinh tế: nước, đá, cây, hành lang.","一步一景"],["D · 故宫","Cố Cung","Cung điện của hoàng đế, mái vàng tường đỏ.","红墙黄瓦"]],"notes":[["Một hình ảnh cụ thể","Một chi tiết bạn nhớ: ánh hoàng hôn trên tường thành, con cá vàng trong sân…"],["Giải thích bằng 所谓","“所谓园林，就是……” giúp bài rõ ràng, đúng phong cách bài khóa."],["Câu kết","“具有传统特色的建筑是一个国家、一个城市的记忆。”"]],"rule":"<b>Nguyên tắc HSK5:<\/b> miêu tả theo trình tự không gian (从外到里、从上到下); dùng từ chỉ vị trí: 位于、两边、中间、正对着…; thông tin lịch sử chỉ viết điều chắc chắn.","patterns":[["① 点题","在我眼中，最美的中国建筑是北京的四合院。","Trong mắt tôi, công trình đẹp nhất Trung Quốc là tứ hợp viện Bắc Kinh."],["① 点题","生活中不是缺少美，而是缺少发现美的眼睛。去年在苏州，我发现了园林的美。","Cuộc sống không thiếu cái đẹp, chỉ thiếu đôi mắt phát hiện. Năm ngoái ở Tô Châu, tôi phát hiện vẻ đẹp của vườn cảnh."],["② 介绍","所谓四合院，就是四面房屋围在一起，中间形成一个院子的民居。","Tứ hợp viện là kiểu nhà bốn dãy quây lại, ở giữa là sân."],["② 介绍","长城历史悠久，有两千多年的历史，是中国建筑的代表。","Vạn Lý Trường Thành có hơn hai nghìn năm lịch sử, là đại diện của kiến trúc Trung Quốc."],["③ 描写","让我印象最深的是院子里的竹子和金鱼，充满了生活的情趣。","Ấn tượng nhất với tôi là trúc và cá vàng trong sân, tràn đầy thú vị cuộc sống."],["③ 描写","站在长城上往远处看，长城就像一条长龙，令人感到十分震撼。","Đứng trên Trường Thành nhìn xa, nó như một con rồng dài, khiến người ta vô cùng choáng ngợp."],["④ 感受","具有传统特色的建筑是一个国家、一个城市的记忆。","Kiến trúc mang đặc sắc truyền thống là ký ức của một đất nước, một thành phố."]],"links":[["Mở bài",["在我眼中，最美的……是……","说到中国建筑，我首先想到的是……","只要人们一提到……，便自然会想到……"]],["Giới thiệu",["所谓……，就是……","它位于……","……历史悠久，……"]],["Miêu tả",["让我印象最深的是……","……就像……","令人感到……"]],["Cảm nhận",["它让我明白了……","……不仅……，也……","……是……的记忆"]]],"open":[["直接式","在我眼中，最美的中国建筑是北京的四合院。"],["引用式","有人说：“生活中不是缺少美，而是缺少发现美的眼睛。”"],["印象式","说到中国建筑，我首先想到的是红墙黄瓦的故宫。"]],"close":[["记忆式","具有传统特色的建筑是一个国家、一个城市的记忆。"],["收获式","通过这次旅行，我对中国的历史和文化有了更深的了解。"],["愿望式","希望以后有机会再去看看那里的美景。"]],"from_text":[["所谓 X，“A”指……，“B”就是……","所谓园林，“园”指花园，“林”就是树林，合起来就是有山有水有树的花园。","Lấy từ 好句 ①: giải thích khái niệm."],["只要人们一提到 A，便自然会想到 B","只要人们一提到中国，便自然会想到长城。","Lấy từ 好句 ②: tính tiêu biểu."],["A 不仅拉近了……，也让……","四合院的院子不仅拉近了人与自然的关系，也让一家人有了交流的空间。","Lấy từ 好句 ③: tác dụng."],["过着……的日子，充分享受……的乐趣","住在这里的老人过着安静的日子，充分享受着种花养鱼的乐趣。","Lấy từ 好句 ④: miêu tả cuộc sống."],["虽然有时也……，但更多时候是……","胡同里虽然有时也很吵，但更多时候是邻居们热情的问候。","Lấy từ 好句 ⑤: đánh giá hai mặt."]],"vocab":[["建筑","jiànzhù","kiến trúc","中国建筑","idea"],["历史","lìshǐ","lịch sử","历史悠久","idea"],["特色","tèsè","đặc sắc","传统特色","idea"],["风格","fēnggé","phong cách","建筑风格","idea"],["欣赏","xīnshǎng","thưởng ngoạn","欣赏美景","idea"],["印象","yìnxiàng","ấn tượng","印象最深","idea"],["位于","wèiyú","nằm ở","位于北京","act"],["参观","cānguān","tham quan","参观故宫","act"],["拍照","pāi zhào","chụp ảnh","在门口拍照","act"],["保护","bǎohù","bảo vệ","保护古建筑","act"],["了解","liǎojiě","tìm hiểu","了解历史","act"],["吸引","xīyǐn","thu hút","吸引游客","act"],["所谓","suǒwèi","cái gọi là","所谓四合院","lesson"],["广泛","guǎngfàn","rộng rãi","分布广泛","lesson"],["代表","dàibiǎo","đại diện","中国建筑的代表","lesson"],["具备","jùbèi","có đủ","具备……功能","lesson"],["空间","kōngjiān","không gian","生活空间","lesson"],["创造","chuàngzào","tạo ra","创造情趣","lesson"],["令","lìng","khiến","令人难忘","lesson"],["亲切","qīnqiè","thân thiết","感到亲切","lesson"],["历史悠久","lìshǐ yōujiǔ","lịch sử lâu đời","历史悠久的建筑","bonus"],["一步一景","yí bù yì jǐng","mỗi bước một cảnh","苏州园林一步一景","bonus"],["雄伟壮观","xióngwěi zhuàngguān","hùng vĩ tráng lệ","长城雄伟壮观","bonus"],["流连忘返","liúlián wàng fǎn","lưu luyến quên về","让人流连忘返","bonus"]],"vgroups":[["idea","Khái niệm"],["act","Hành động"],["lesson","Từ bài 14"],["bonus","加分 · thành ngữ"]],"legend":["① Công trình nào","② Giới thiệu","③ Miêu tả cái đẹp","④ Cảm nhận"],"samples":{"speak":[{"who":"北京四合院","meta":"Hướng A · bài nói ~1 phút 30","p":["在我眼中，最美的中国建筑是北京的四合院。","所谓四合院，就是四面房屋围在一起，中间形成一个方形的院子的民居。北房是正房，住着长辈；两边是厢房，是晚辈们生活的地方。","去年我去北京旅游的时候，参观了胡同里的一座四合院。让我印象最深的是那个院子：里面种着竹子，养着金鱼，一位老奶奶坐在院子里晒太阳，令人感到十分亲切。院子不仅拉近了人与自然的关系，也让一家人有了交流的空间。","我觉得，具有传统特色的建筑是一个城市的记忆，我们应该好好保护它们。"],"vi":"Trong mắt tôi, kiến trúc đẹp nhất Trung Quốc là tứ hợp viện Bắc Kinh: bốn dãy nhà quây lại, giữa là sân vuông; nhà chính cho bề trên, chái nhà cho con cháu. Năm ngoái tôi tham quan một tứ hợp viện trong ngõ; ấn tượng nhất là khoảng sân có trúc, cá vàng, một bà cụ ngồi sưởi nắng — rất thân thương. Sân không chỉ kéo gần con người với thiên nhiên mà còn tạo không gian trò chuyện cho cả nhà. Kiến trúc truyền thống là ký ức của một thành phố, nên được bảo vệ."},{"who":"长城","meta":"Hướng B · bài nói ~1 phút 30","p":["只要人们一提到中国，便自然会想到长城。在我眼中，长城就是最美的中国建筑。","长城历史悠久，有两千多年的历史，它是古代人们为了保护国家而建的，是中国建筑的代表。","前年秋天，我第一次爬上了长城。那天天气很好，站在长城上往远处看，长城就像一条长龙，在山上一直延伸到看不见的地方，令人感到十分震撼。我一边爬一边想：古代人没有机器，是怎么建造出这么伟大的建筑的呢？","通过这次旅行，我对中国的历史和文化有了更深的了解。"],"vi":"Nhắc đến Trung Quốc ai cũng nghĩ ngay đến Vạn Lý Trường Thành — công trình đẹp nhất trong mắt tôi. Nó có hơn hai nghìn năm lịch sử, được xây để bảo vệ đất nước, là đại diện của kiến trúc Trung Quốc. Mùa thu năm kia tôi lần đầu leo lên: nhìn xa, Trường Thành như con rồng dài uốn lượn đến tận chân trời, vô cùng choáng ngợp. Tôi tự hỏi người xưa không có máy móc làm sao xây nổi. Chuyến đi giúp tôi hiểu sâu hơn lịch sử, văn hóa Trung Quốc."}],"write":[{"who":"范文 1 · 四合院","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我眼中最美的中国建筑","p":["在我眼中，最美的中国建筑是北京的四合院。","四面房屋围在一起，中间有一个方形的院子。","院子里种着竹子，养着金鱼，令人感到很亲切。","它让我感受到了中国人的家庭生活。"],"vi":"Bố cục 4 câu: công trình nào → kết cấu → chi tiết đẹp (令人感到亲切) → cảm nhận."},{"who":"范文 2 · 苏州园林","meta":"Dạng HSK5 · khoảng 80 chữ","title":"我眼中最美的中国建筑","p":["去年在苏州，我参观了有名的园林。","园林不大，但是有山有水，还有长长的走廊和各种各样的花木。","走在里面，一步一景，让人流连忘返。","我觉得，这种人与自然和谐的美，就是中国建筑的特色。"],"vi":"Kể chuyến đi; miêu tả theo trình tự; dùng thành ngữ 一步一景、流连忘返."},{"who":"范文 3 · 课本命题写作","meta":"Bài mở rộng · khoảng 150 chữ · dùng 好句 của bài khóa","title":"我眼中最美的中国建筑","p":["有人说：“生活中不是缺少美，而是缺少发现美的眼睛。”在我眼中，最美的中国建筑是北京的四合院。","所谓四合院，就是四面房屋围在一起，中间形成一个方形的院子的民居。去年我参观了胡同里的一座四合院，让我印象最深的是那个院子：里面种着竹子，养着金鱼。院子不仅拉近了人与自然的关系，也让一家人有了交流的空间。","住在这里的老人过着安静的日子，充分享受着种花养鱼的乐趣。","具有传统特色的建筑是一个城市的记忆，我们应该好好保护它们。"],"good":["所谓四合院，就是四面房屋围在一起","院子不仅拉近了人与自然的关系，也让一家人有了交流的空间","过着安静的日子，充分享受着种花养鱼的乐趣"],"vi":"Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 所谓……，就是…… · 不仅拉近了……，也让…… · 过着……的日子，充分享受……的乐趣."}]},"w5":["建筑","历史","特色","风格","欣赏","印象","位于","参观","保护","了解","吸引","所谓","广泛","代表","具备","空间","创造","令","亲切","功能","组成","日常","充分"],"step_names":["① 点题：哪一处建筑","② 介绍：位置、历史、特点","③ 描写：最美的地方","④ 感受"],"timer":[["① 10s",10],["② 25s",25],["③ 40s",40],["④ 15s",15]],"build_title":"选一处建筑，拼出你的介绍","build_lead":"Chọn công trình, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, rồi bấm <b>Bắt đầu nói<\/b> để luyện với đồng hồ 90 giây.","build":{"A · 北京四合院":[["在我眼中，最美的中国建筑是北京的四合院。","只要人们一提到北京，便自然会想到胡同和四合院。"],["所谓四合院，就是四面房屋围在一起，中间形成一个方形的院子的民居。","北房是正房，住着长辈；两边是厢房，是晚辈们生活的地方。"],["让我印象最深的是院子里的竹子和金鱼，一位老奶奶坐在院子里晒太阳，令人感到十分亲切。","院子不仅拉近了人与自然的关系，也让一家人有了交流的空间。"],["我觉得，具有传统特色的建筑是一个城市的记忆，我们应该好好保护它们。","通过参观四合院，我对老北京人的生活有了更深的了解。"]],"B · 长城":[["只要人们一提到中国，便自然会想到长城。","在我眼中，最美的中国建筑是长城。"],["长城历史悠久，有两千多年的历史，是中国建筑的代表。","长城是古代人们为了保护国家而建的，分布在中国北方的很多地方。"],["站在长城上往远处看，长城就像一条长龙，令人感到十分震撼。","我一边爬一边想：古代人没有机器，是怎么建造出这么伟大的建筑的呢？"],["通过这次旅行，我对中国的历史和文化有了更深的了解。","中国人常说“不到长城非好汉”，我现在也是“好汉”了！"]],"C · 苏州园林":[["生活中不是缺少美，而是缺少发现美的眼睛。去年在苏州，我发现了园林的美。","在我眼中，最美的中国建筑是苏州的园林。"],["苏州园林历史悠久，有山有水，还有长长的走廊和各种各样的花木。","所谓园林，就是有山有水有树的花园，是中国传统建筑的一种。"],["走在园林里，一步一景，每走几步就能看到不同的风景，让人流连忘返。","让我印象最深的是池塘里的荷花和金鱼，安静又美丽。"],["我觉得，这种人与自然和谐的美，就是中国建筑最大的特色。","希望以后有机会再去看看那里的美景。"]]},"quiz":[["Câu nào hợp làm câu mở bài?",["中国有很多建筑，比如长城、故宫、四合院、天坛……","在我眼中，最美的中国建筑是北京的四合院。"],1,"Đề yêu cầu một công trình và góc nhìn “我眼中”."],["Câu nào dùng 所谓 đúng?",["所谓四合院，就是四面房屋围在一起的民居。","所谓四合院很漂亮。"],0,"所谓 + giải thích."],["Câu nào thể hiện “最美” cụ thể hơn?",["四合院很美。","院子里种着竹子，养着金鱼，令人感到十分亲切。"],1,"Có chi tiết cụ thể."],["Câu nào đúng?",["长城令人感到十分震撼。","长城让人感到十分震撼了。"],0,"Bỏ 了 thừa."],["Câu nào dùng 位于 đúng?",["故宫位于北京市中心。","故宫位于在北京市中心。"],0,"位于 không thêm 在."],["Câu kết nào tốt hơn?",["我说完了。","具有传统特色的建筑是一个城市的记忆。"],1,"Câu kết có ý nghĩa, lấy từ 背景分析."]],"fix":[["故宫位于在北京市中心。","故宫位于北京市中心。","位于 = 位 + 于 (ở), không thêm 在."],["长城有两千多年历史悠久。","长城历史悠久，有两千多年的历史。","Tách hai ý cho đúng ngữ pháp."],["我最美的中国建筑是四合院。","我眼中最美的中国建筑是四合院。","Thiếu 眼中, câu không logic."],["院子里种竹子着，养金鱼着。","院子里种着竹子，养着金鱼。","着 đứng ngay sau động từ."],["这座建筑令我很感动了。","这座建筑令我很感动。","Bỏ 了 thừa sau tính từ có 很."],["通过这次旅行，使我了解了中国文化。","通过这次旅行，我了解了中国文化。","通过…… và 使 cùng dùng làm câu thiếu chủ ngữ."]],"tpl":"我眼中最美的中国建筑\n在我眼中，最美的中国建筑是【……】。所谓【……】，就是【……】。让我印象最深的是【……】，令人感到【……】。【感受】。","chk":[["topic","Bám đề: có nói 建筑 hoặc tên công trình","建筑|四合院|长城|故宫|园林|天坛"],["view","Có góc nhìn cá nhân (我眼中 · 我觉得 · 印象)","我眼中|我觉得|印象|在我看来"],["intro","Có giới thiệu (所谓 · 位于 · 历史 · 房屋)","所谓|位于|历史|房屋|院子"],["detail","Có miêu tả cụ thể (令人 · 像 · 种着 · 养着)","令人|像|种着|养着|看到"],["end","Có cảm nhận / kết (记忆 · 了解 · 明白 · 保护)","记忆|了解|明白|保护|希望"]],"wmin":100,"wmax":160,"traps3":"<b>Bắt buộc có:<\/b> tên một công trình, một câu giới thiệu (所谓/位于/历史), một chi tiết miêu tả và một câu cảm nhận. Đề viết của sách yêu cầu <b>không ít hơn 100 chữ<\/b> — xem 范文 3.","var_title":"“介绍一个地方／建筑”的题目都可以这样写","var_lead":"Mọi đề giới thiệu nơi chốn (建筑、城市、景点、家乡) đều dùng khung: <b>là gì → giới thiệu → chi tiết ấn tượng nhất → cảm nhận<\/b>. Bấm để xem câu mở đầu gợi ý.","variants":[["（课本）我眼中最美的中国建筑","在我眼中，最美的中国建筑是……"],["请介绍你们国家的一处有名的建筑。","说到越南的建筑，我首先想到的是……"],["请以“我的家乡”为题写一段话。","我的家乡位于越南北部，那里……"],["请以“一次难忘的旅行”为题写一段话。","去年夏天，我和朋友去了……"],["你喜欢住在传统的房子还是现代的高楼里？","我更喜欢住在……，因为……"],["谈谈保护古建筑的意义。","具有传统特色的建筑是一个国家、一个城市的记忆……"]],"homework":"<b>Bài về nhà:<\/b> chọn một công trình (A–C hoặc tự chọn) · ① ghi âm bài nói khoảng 1 phút 30 giây · ② viết đoạn 100–150 chữ với đầu đề “我眼中最美的中国建筑” · bắt buộc có một câu giới thiệu, một chi tiết miêu tả, một câu cảm nhận và một khung 好句 của bài khóa."}};</script>
<script>
(function(){

var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}

}
