<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 13 · 从旅游指南看世事变迁 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

.","vệ tinh","vệ tinh",1,"","按一定轨道绕行星运行的天体；人造卫星。","卫星导航系统","月亮是地球的卫星。","Mặt Trăng là vệ tinh của Trái Đất.",["人造卫星","卫星电视"],"SBT câu 22."],[48,"导航","dǎoháng","đgt.","đạo hàng","dẫn đường",1,"","利用航行标志、雷达、卫星等引导飞机、轮船、汽车等航行。","卫星导航系统","开车时我习惯用手机导航。","Lái xe tôi quen dùng điện thoại chỉ đường.",["导航系统","卫星导航"],""],[49,"向导","xiàngdǎo","dt.","hướng đạo","người dẫn đường",1,"","带路的人。","犹如有位随身的向导","我们请了一位当地人当向导。","Chúng tôi thuê một người địa phương làm hướng dẫn.",[],""],[50,"租赁","zūlìn","đgt.","tô nhẫm","thuê, cho thuê",1,"书","租用；出租。","到汽车租赁公司租上辆汽车","这家公司专门租赁设备。","Công ty này chuyên cho thuê thiết bị.",["租赁公司","房屋租赁"],"SBT câu 12."],[51,"帐篷","zhàngpeng","dt.","trướng bồng","lều",1,"","撑在地上遮蔽风雨、日光并供临时居住的篷。","带上顶帐篷","我们在山上搭了帐篷。","Chúng tôi dựng lều trên núi.",["一顶帐篷","搭帐篷"],"Lượng từ: <span class='zh'>顶</span>."]],extra:[["短缺","duǎnquē","thiếu hụt"],["安居","ānjū","an cư"],["游山玩水","yóushān wánshuǐ","du sơn ngoạn thủy"],["足迹","zújì","dấu chân"],["困难重重","kùnnan chóngchóng","khó khăn chồng chất"],["口袋书","kǒudàishū","sách bỏ túi"],["改革开放","gǎigé kāifàng","cải cách mở cửa"],["家常便饭","jiācháng biànfàn","chuyện thường ngày"],["接地气","jiē dìqì","gần gũi thực tế"],["自助游","zìzhùyóu","du lịch tự túc"],["背包客","bēibāokè","dân phượt"],["自由行","zìyóuxíng","du lịch tự do"],["青年旅社","qīngnián lǚshè","nhà nghỉ thanh niên (hostel)"]],T:[{zh:"人类一向与旅游共存。从有了人类，就有了旅行。",vn:"Loài người xưa nay luôn song hành cùng du lịch. Từ khi có con người là đã có những chuyến đi.",idea:"Câu chủ đề: du lịch song hành cùng loài người.",q:[],note:[["一向","Xem 辨析 一向—一度."]]},{zh:"起初，人类旅行更准确地说，应该叫迁徙。天气变化、食物短缺，或者有敌人侵犯，人们不得不远离居住地，寻找能够安居的地方，那时的旅行纯粹是生存和安全的需要。",vn:"Thuở ban đầu, nói chính xác hơn thì việc “du lịch” của loài người nên gọi là di cư. Thời tiết thay đổi, thức ăn khan hiếm, hoặc có kẻ thù xâm phạm, con người buộc phải rời xa nơi ở, tìm chốn an cư; khi ấy đi lại hoàn toàn là nhu cầu sinh tồn và an toàn.",idea:"Ban đầu: di cư để sinh tồn.",q:["起初，人类为什么要旅行？"],note:[["更准确地说","Chen ngữ: nói chính xác hơn."],["纯粹是……的需要","<span class='zh'>纯粹</span> làm phó từ = hoàn toàn."]]},{zh:"后来，古人远离家乡，去游山玩水，也就有了真正意义上的旅游。指南针发明后，中国有了海外旅行者。若干年来，旅游在世界范围内都是一个热门话题。",vn:"Về sau, người xưa rời quê đi du sơn ngoạn thủy, thế là có du lịch theo đúng nghĩa. Sau khi la bàn được phát minh, Trung Quốc có những người du hành ra nước ngoài. Bao năm nay, du lịch luôn là đề tài nóng trên toàn thế giới.",idea:"Về sau: du lịch đúng nghĩa.",q:["什么时候有了真正意义上的旅游？"],note:[["真正意义上的……","= … theo đúng nghĩa."],["若干年来","<span class='zh'>若干</span> = một số (văn viết)."]]},{zh:"一些足迹遍布世界的旅行者千方百计来到了中国，可开始，他们连一本旅游指南类的书籍都没有，可以说是困难重重。直到1898年，中国最早的旅游指南问世了。那是一本携带方便的口袋书，作者在序言中说“天津异常繁华”，为便于外地人出行，他搜集了当地文化习俗以及车船码头等信息，做了简要介绍。之后，一度引起轰动的旅游指南要算《北平旅行指南》了，它趣味性强，实用价值高。这本书是在中外人士的共同努力下完成的，中、外文版本同时发行，真正方便了读者。",vn:"Một số người du hành từng đặt chân khắp thế giới đã tìm trăm phương nghìn kế đến Trung Quốc, nhưng ban đầu họ đến một cuốn sách hướng dẫn du lịch cũng không có, có thể nói là khó khăn chồng chất. Mãi đến năm 1898, cuốn cẩm nang du lịch sớm nhất của Trung Quốc mới ra đời. Đó là một cuốn sách bỏ túi tiện mang theo; tác giả viết trong lời tựa rằng “Thiên Tân vô cùng phồn hoa”, để người nơi khác tiện đi lại, ông thu thập phong tục văn hóa địa phương và thông tin bến xe, bến tàu…, giới thiệu ngắn gọn. Sau đó, cuốn cẩm nang từng gây xôn xao một thời phải kể đến “Bắc Bình lữ hành chỉ nam” — rất thú vị, giá trị thực dụng cao. Cuốn sách hoàn thành nhờ nỗ lực chung của các nhân sĩ trong và ngoài nước, bản tiếng Trung và tiếng nước ngoài phát hành đồng thời, thật sự tiện cho bạn đọc.",idea:"Những cuốn cẩm nang đầu tiên.",q:["中国最早的旅游指南是什么时候问世的？有什么特点？","《北平旅行指南》为什么一度引起轰动？"],note:[["连……都没有","Nhấn mạnh mức độ thiếu thốn."],["直到……，……才/了","Mốc thời gian muộn."],["为便于……","<span class='zh'>便于</span> — xem Ngữ pháp 1."],["要算……了","= phải kể đến…"],["在……的共同努力下","Khung trạng ngữ điều kiện."]]},{zh:"改革开放前，旅游是中国外交事业的延伸和补充。改革开放以后，旅游真正作为经济型产业受到重视，旅游指南也随着旅游业的振兴变得越来越丰富，越来越全面。",vn:"Trước cải cách mở cửa, du lịch là phần kéo dài và bổ sung cho sự nghiệp ngoại giao của Trung Quốc. Sau cải cách mở cửa, du lịch thật sự được coi trọng như một ngành kinh tế, cẩm nang du lịch cũng theo sự chấn hưng của ngành mà ngày càng phong phú, toàn diện.",idea:"Bước ngoặt cải cách mở cửa.",q:["改革开放前后，旅游有什么变化？"],note:[["作为……受到重视","<span class='zh'>作为</span> = với tư cách là."],["随着……变得越来越……","Biến đổi theo."]]},{zh:"开始，由于游客主要是外国人，旅游类书籍便把服务对象锁定为他们。1999年以后，中国人逐渐成为游客中的主流，国内旅游和出国旅游都变得犹如家常便饭，旅游书籍也就扩大了服务对象，调整了服务宗旨，增加了相关栏目，变得越来越接地气，越来越人性化了。",vn:"Lúc đầu, vì du khách chủ yếu là người nước ngoài, sách du lịch nhắm đối tượng phục vụ vào họ. Sau năm 1999, người Trung Quốc dần trở thành lực lượng chính, du lịch trong nước và ra nước ngoài đều trở nên như chuyện cơm bữa; sách du lịch cũng mở rộng đối tượng, điều chỉnh tôn chỉ phục vụ, thêm các chuyên mục liên quan, ngày càng gần gũi thực tế và thân thiện hơn.",idea:"Sau 1999: người Trung Quốc thành chủ lưu.",q:["1999年以后，旅游书籍有了哪些变化？"],note:[["把……锁定为……","Nhắm vào, xác định là."],["犹如家常便饭","<span class='zh'>犹如</span> — xem Ngữ pháp 2; <span class='zh'>家常便饭</span> = chuyện thường ngày."],["扩大了……，调整了……，增加了……","Ba động từ song song."]]},{zh:"现在，最受欢迎的是自助游。背包客、自由行已成为中国人旅游最重要的方式之一。和过去相比，游客不再仅关注著名旅游城市，偏僻省份、沿海城市、秀美的乡镇，都成了游客感兴趣的地方。旅游指南不仅介绍地理环境、风土人情、人文特色、著名风景，还会介绍当地饮食、宗教、考古新发现等，青年旅社、经济型酒店、当地交通等内容更是必不可少。帮助读者选择最佳旅游时间，甚至为游客提供经费预算方面的信息，旅游指南绝对是游客的好参谋。",vn:"Hiện nay, được ưa chuộng nhất là du lịch tự túc. Dân phượt, du lịch tự do đã thành một trong những cách đi chơi quan trọng nhất của người Trung Quốc. So với trước kia, du khách không còn chỉ chú ý các thành phố du lịch nổi tiếng; những tỉnh hẻo lánh, thành phố ven biển, thị trấn xinh đẹp đều thành nơi họ quan tâm. Cẩm nang không chỉ giới thiệu môi trường địa lý, phong thổ nhân tình, đặc sắc văn hóa, cảnh đẹp nổi tiếng, mà còn giới thiệu ẩm thực, tôn giáo, phát hiện khảo cổ mới…; hostel, khách sạn bình dân, giao thông địa phương càng không thể thiếu. Giúp người đọc chọn thời điểm du lịch tốt nhất, thậm chí cung cấp thông tin dự toán kinh phí — cẩm nang du lịch đúng là “quân sư” đắc lực của du khách.",idea:"Hiện nay: du lịch tự túc; cẩm nang toàn diện.",q:["和过去相比，游客关注的地方有什么不同？","现在的旅游指南包括哪些内容？"],note:[["和过去相比，……","Xem Ngữ pháp 3."],["不仅……，还……，……更是必不可少","Tăng tiến ba bậc."]]},{zh:"如今，繁体字、简体字旅游网站的开通，更大范围地方便了游客。卫星导航系统的广泛应用，使得人们不管走到哪儿，都犹如有位随身的向导。说得夸张点儿，到汽车租赁公司租上辆汽车，带上顶帐篷，就算走到天边，你都不用发愁。",vn:"Ngày nay, việc mở các trang web du lịch chữ phồn thể, giản thể đã tiện lợi cho du khách trên phạm vi rộng hơn. Hệ thống định vị vệ tinh được ứng dụng rộng rãi khiến người ta dù đi đến đâu cũng như có người dẫn đường bên mình. Nói hơi cường điệu một chút: đến công ty cho thuê xe thuê một chiếc, mang theo cái lều, dù đi đến tận chân trời bạn cũng chẳng phải lo.",idea:"Công nghệ: web, định vị vệ tinh.",q:["现在人们旅行还有哪些便利条件？"],note:[["使得……","= khiến cho (văn viết)."],["说得夸张点儿","Chen ngữ: nói hơi quá."],["就算……，都……","= dù… cũng…"]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ vựng giao thông & nông nghiệp",G:[{id:"g1",grp:0,word:"便于",zh:"便于",py:"biànyú",tag:"Chú thích 1 · động từ",mean:"Động từ: <b>tương đối dễ làm việc gì</b>, “tiện cho…”. Theo sau phần lớn là <b>từ ngữ động từ</b>. Phủ định: <span class='zh'>不便于</span>.",forms:["A + 便于 + V（携带 / 理解 / 管理）","为（了）便于 + V，……"],ex:[["科普文章应该写得简明易懂、便于理解。","Bài phổ biến khoa học nên viết ngắn gọn dễ hiểu, tiện cho việc lý giải."],["多数学者认为目前图书分类太过繁杂，不便于利用。","Đa số học giả cho rằng cách phân loại sách hiện nay quá rườm rà, bất tiện khi sử dụng."],["为便于外地人出行，他搜集了当地文化习俗以及车船码头等信息，做了简要介绍。","",1]],tips:["Khác <span class='zh'>方便</span>: <span class='zh'>方便</span> là tính từ/động từ, có thể <span class='zh'>很方便</span>; <span class='zh'>便于</span> phải có động từ theo sau."],practice:{q:"为“便于”选择适当的位置",type:"pos",items:[["A为了B推销，她给这种儿童服装C起了个D好听的名字——帅王子。","B","为了便于推销，她给这种儿童服装起了个好听的名字——帅王子。"],["那时的建筑系只A收男生，B不收女生，学校的管理者说，这样更C管理，……","C","……这样更便于管理，……"],["一种A说法是，B老年人胃的消化力弱，C吃面条，更D消化吸收。","D","……吃面条，更便于消化吸收。"]]}},{id:"g2",grp:0,word:"一度",zh:"一向 / 一度",py:"yíxiàng / yídù",tag:"Xem 辨析 bên dưới",mean:"Đều là phó từ chỉ <b>phạm vi thời gian</b> nhưng <b>thường không thay nhau được</b>: <span class='zh'>一向</span> = từ trước đến nay <b>luôn</b>; <span class='zh'>一度</span> = trong quá khứ <b>đã từng có một thời</b>.",forms:["一向 + Adj / V（từ xưa đến nay）","一度 + V（đã có một thời）"],ex:[["人类一向与旅游共存。","",1],["之后，一度引起轰动的旅游指南要算《北平旅行指南》了。","",1]],tips:["Bài tập 2⑤: <span class='zh'>虽然他现在很成功，但一度……</span>"]},{id:"g3",grp:1,word:"犹如",zh:"犹如",py:"yóurú",tag:"Chú thích 2 · động từ (văn viết)",mean:"Động từ = <span class='zh'>好像 · 如同</span>, “giống như”. Dùng trong văn viết, thường làm phép so sánh; hay đi với <span class='zh'>……般 / 一般 / 似的</span>.",forms:["A 犹如 B（般 / 一般）","……，都犹如……"],ex:[["公司的劣质产品气坏了消费者，顾客的愤怒情绪犹如火山爆发般难以控制。","Hàng kém chất lượng làm khách tức điên, cơn giận của họ như núi lửa phun trào khó kiềm chế."],["1999年以后，中国人逐渐成为游客中的主流，国内旅游和出国旅游都变得犹如家常便饭。","",1],["卫星导航系统的广泛应用，使得人们不管走到哪儿，都犹如有位随身的向导。","",1]],tips:["Mức trang trọng: <span class='zh'>像 &lt; 好像 &lt; 如同 &lt; 犹如</span>."],practice:{q:"为句子选择适当的上句：A 我们的人生 · B 先生讲课声调不高 · C 夕阳照耀下的古城",type:"complete",items:[["(____)，犹如温暖的春风扑面，智慧的清泉入心。","B 先生讲课声调不高，犹如温暖的春风扑面，智慧的清泉入心。"],["(____)，色彩犹如油画般厚重。","C 夕阳照耀下的古城，色彩犹如油画般厚重。"],["(____)，犹如一片一望无际的大海，我们每个人，每天都在这片广阔的大海上航行。","A 我们的人生，犹如一片一望无际的大海，……"]]}},{id:"g4",grp:2,word:"",zh:"和……相比",py:"hé … xiāngbǐ",tag:"Chú thích 3",mean:"Dạng đầy đủ: <span class='zh'>A 和 B 相比，A……</span> — hai chữ A là cùng một sự vật; trọng tâm câu là <b>miêu tả đầy đủ A</b>. Cũng nói <span class='zh'>与……相比 · 同……相比</span>. Cụm này thường đứng <b>đầu câu</b>, trước chủ ngữ.",forms:["（A）和 B 相比，A + miêu tả","与 / 同 + B + 相比，……"],ex:[["由于经济环境的不确定，企业的寿命越来越短，和10年前相比，人们要经历更多次的职业选择。","Do kinh tế bất định, tuổi thọ doanh nghiệp ngày càng ngắn; so với 10 năm trước, người ta phải chọn nghề nhiều lần hơn."],["走出书店的大门，他眼前一亮，和昏暗、冷清的书店相比，外面的大街既明亮又热闹。","Ra khỏi hiệu sách, mắt anh sáng lên: so với hiệu sách tối tăm vắng vẻ, phố bên ngoài vừa sáng vừa nhộn nhịp."],["和过去相比，游客不再仅关注著名旅游城市……","",1]],tips:["Bài tập 2②."],practice:{q:"把括号里的内容放在句子中合适的位置",type:"pos",items:[["今天，A我们B从阅读、写信、学习、购物到看病，C无不依赖电脑来完成。D人们的生活方式、工作方式已发生了深刻的变革。（和昨天相比，）","D","……和昨天相比，人们的生活方式、工作方式已发生了深刻的变革。"],["虽然，A大学生对自我情绪B具有一定的控制能力，C但在激动状态下，D也常因情绪失控而产生冲动性的行为。（和中学生相比，）","A","虽然，和中学生相比，大学生对自我情绪具有一定的控制能力，……"],["A影视服装有着自身的艺术形式和规律B，其设计C必须服从影视剧的特定时间、环境、情节和角色的身份需求D。（和其他服装相比，）","A","和其他服装相比，影视服装有着自身的艺术形式和规律，……"]]}}],BX:{grp:0,word:"一度",cols:["一向","一度"],pair:"一向 — 一度",same:["Làm <b>phó từ</b>, đều chỉ phạm vi thời gian, nhưng thường <b>không thay nhau được</b>.","—"],diff:[["Từ quá khứ đến hiện tại, <b>luôn luôn</b>.","我们家一向好客，来了客人总是热情招待。","Trong quá khứ <b>có một khoảng thời gian</b> đã xảy ra, đã từng.<div class='zh' style='margin-top:4px'>去年，老师一度病得很厉害，现在好多了。</div>"],["Từ lần gặp trước đến nay (lời hỏi thăm).","你一向好啊！","Không có nghĩa này."],["Không có cách dùng này.","—","Còn là <b>số lượng từ</b> = một lần, một đợt: <span class='zh'>一年一度</span>.<div class='zh' style='margin-top:4px'>一年一度的春节又到了。</div>"]],task:{q:"选择“一向”或“一度”填空",cols:["一向","一度"],sample:!1,items:[["他的性格比较古怪，____独来独往，不跟别人交流。",0,"Xưa nay luôn như vậy → 一向."],["一年____春又到，柳树已经发芽，燕子也都飞回来了。",1,"<span class='zh'>一年一度</span> — số lượng từ."],["老王，好久不见，你____可好？",0,"Hỏi thăm từ lần gặp trước → 一向."],["汉语太难了，我____想放弃，但最后还是坚持下来了。",1,"Đã có một thời (nay không còn) → 一度."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["犹<u>如</u>","比如 · 例如 · 譬如 · 一如既往"],items:[["生<u>存</u>","存","幸存 · 保存 · 存在 · 存款"],["<u>简</u>要","简","简单 · 简介 · 简明 · 简直"],["<u>趣</u>味","趣","有趣 · 兴趣 · 乐趣 · 趣事"],["产<u>业</u>","业","农业 · 工业 · 业余 · 业务"]]},EX2:{q:"用所给词语或结构完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["________，后来我慢慢明白了父母的心。","起初","起初我很不理解父母为什么对我那么严格，后来我慢慢明白了父母的心。"],["________，他几乎没生过病。","和……相比","和同龄人相比，他的身体好多了，几乎没生过病。"],["大学毕业以后，________。","若干","大学毕业以后，他先后在若干家公司工作过。"],["印度尼西亚被称为千岛之国，________。","遍布","印度尼西亚被称为千岛之国，大大小小的岛屿遍布赤道两侧。"],["虽然他现在很成功，但________。","一度","虽然他现在很成功，但他也曾一度失业，生活非常困难。"],["为了公司的发展，________。","千方百计","为了公司的发展，他千方百计地引进人才和技术。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["人士","版本","问世","简要","序言"],text:"他是一位深受广大读者喜爱的作家。最近，他的又一本新书{问世}了，在中外{人士}的共同努力下，该书的中、外文{版本}同时发行。作者在{序言}中{简要}介绍了这本书的内容，除此以外，还对家人和朋友的支持表示了感谢。"},{bank:["振兴","偏僻","人性","产业","风土人情"],text:"随着中国经济的发展，旅游逐渐成为人们生活中必不可少的一部分。人们不但关注那些著名的旅游城市，也把越来越多的目光投向了{偏僻}省份，那些地方独特的{风土人情}吸引了越来越多的游客。随着当地旅游{产业}的{振兴}，服务质量也有所提升，变得越来越{人性}化了。"}]},EX4:{q:"给下列两组复句重新排序",type:"order",vn:"Nhập thứ tự chữ cái rồi bấm Kiểm tra. Mẹo: cặp quan hệ từ <span class='zh'>因为……不但……而且…… / 无论……都…… / 不但……而且……否则……</span>.",sets:[{ans:"CADB",full:"北京是美丽的，我知道，因为我不但是北京人，而且到过欧美，看见过许多西方的名城。",items:[["A","因为我不但是北京人"],["B","看见过许多西方的名城"],["C","北京是美丽的，我知道"],["D","而且到过欧美"]]},{ans:"ACBDE",full:"我们无论认识什么事物，都必须全面地去看，不但要看到它的正面，而且要看到它的反面，否则，就不能有比较完整和正确的认识。",items:[["A","我们无论认识什么事物"],["B","不但要看到它的正面"],["C","都必须全面地去看"],["D","而且要看到它的反面"],["E","否则，就不能有比较完整和正确的认识"]]}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["从古到今，人类旅行的目的有什么变化？","起初，天气……，食物……，敌人……，人们不得不…… / 后来，……，游山玩水，有了……","起初，天气变化、食物短缺或者有敌人侵犯，人们不得不远离居住地，旅行纯粹是为了生存和安全；后来，古人远离家乡去游山玩水，才有了真正意义上的旅游。"],["说一说中国旅游指南的发展历程。","开始，连……都没有 / 1898年，……问世：为便于……，……搜集……等信息 / 之后，《北平旅行指南》：趣味性……，实用价值……；中、外文版本","开始，来中国的旅行者连一本旅游指南都没有；1898年，中国最早的旅游指南问世，为便于外地人出行，作者搜集了当地习俗和车船码头等信息；之后，《北平旅行指南》趣味性强，实用价值高，中、外文版本同时发行，一度引起轰动。"],["改革开放前后，旅游指南有什么变化？","改革开放前：是……的延伸和补充；游客主要是……，服务对象…… / 改革开放后：……受到重视，……变得越来越……；1999年后，……成了主流，……扩大了……，调整了……，增加了……","改革开放前，旅游是外交事业的延伸和补充，游客主要是外国人，旅游书籍的服务对象也是他们；改革开放后，旅游作为产业受到重视，指南越来越丰富全面；1999年以后，中国人成了游客中的主流，旅游书籍扩大了服务对象，调整了宗旨，增加了栏目。"],["说一说目前旅游指南的内容和发展情况。","内容：不仅介绍……，还会介绍……，……更是必不可少 / 发展：旅游网站……，卫星导航系统……，使人们……","现在的旅游指南不仅介绍地理环境、风土人情、人文特色和风景，还介绍饮食、宗教、考古新发现等，青年旅社、经济型酒店、当地交通更是必不可少；旅游网站开通了，卫星导航系统使人们走到哪儿都犹如有位随身的向导。"]]},BJ:{title:"病句类型：逻辑不通",vn:"Câu sai — loại 6: logic không thông",intro:"<b>逻辑不通</b>: câu <b>đúng ngữ pháp</b>, nhưng ý nghĩa <b>mâu thuẫn trước sau</b>, hoặc không hợp logic về khái niệm, phán đoán, suy luận, hoặc trái lẽ thường. Các dạng hay gặp: dùng sai quan hệ từ nhân quả, mâu thuẫn ý, <b>khái niệm bao hàm nhau</b> đặt ngang hàng, phán đoán không thành lập, <b>phủ định kép</b> thành khẳng định.",types:[["关联词错用","Dùng sai quan hệ từ","骑自行车可以锻炼身体，还不用汽油，因为它是最环保的交通工具。","……，所以 / 因此它是最环保的交通工具。","Hai vế đầu là <b>nguyên nhân</b>, vế sau là <b>kết quả</b> → dùng <span class='zh'>所以 / 因此</span>."],["语义前后矛盾","Mâu thuẫn trước sau","下一步金融改革的重点之一是加快建立存款保险制度，目前存款保险制度建立接近成熟。","（删去后一分句或改写）","“Đẩy nhanh xây dựng” nghĩa là <b>chưa có</b>, mâu thuẫn với “gần hoàn thiện”."],["概念包含关系错误","Khái niệm bao hàm nhau","人们更喜欢吃一些新鲜的梨、桃、瓜果，而不喜欢服用维生素C药丸。","……新鲜的梨、桃、苹果……","<span class='zh'>梨 · 桃</span> thuộc <span class='zh'>瓜果</span> → không xếp ngang hàng."],["判断不成立","Phán đoán không thành lập","中国是个多民族国家，是56个民族。","中国是个多民族国家，有56个民族。","“Trung Quốc <b>là</b> 56 dân tộc” không thành lập → <span class='zh'>有</span>."],["多重否定","Phủ định kép thành khẳng định","为了杜绝假冒伪劣产品不再流入市场，必须加强生产、流通环节的监督管理。","为了杜绝假冒伪劣产品流入市场，……","<span class='zh'>杜绝</span> + <span class='zh'>不再</span> = hai lần phủ định → ý thành “để hàng giả <b>lọt vào</b> thị trường”."]],practice:[["年轻人缺乏的就是理论水平不高和工作经验不足。","不高和工作经验不足","年轻人缺乏的就是理论水平和工作经验。","<span class='zh'>缺乏</span> đã mang nghĩa “thiếu” → thêm <span class='zh'>不高 · 不足</span> là thừa, logic rối."],["晚会上表演了音乐、舞蹈、武术和很多文艺节目。","很多","晚会上表演了音乐、舞蹈、武术和其他文艺节目。","Âm nhạc, múa, võ thuật <b>thuộc</b> tiết mục văn nghệ → phải nói <span class='zh'>其他</span>."],["由北京人民艺术剧院复排的大型历史话剧《蔡文姬》定于5月1日在首都剧场上演，日前正在紧张的排练之中。","日前","……，目前正在紧张的排练之中。","<span class='zh'>日前</span> = mấy hôm trước (quá khứ) mâu thuẫn với <span class='zh'>正在</span> → dùng <span class='zh'>目前</span>."],["在古代，这类音乐作品只有文字记载，没有乐谱资料，既无法演奏，也无法演唱。","在古代","这类古代的音乐作品只有文字记载，没有乐谱资料，因此现在既无法演奏，也无法演唱。","Thời cổ đại chính là lúc tác phẩm được biểu diễn — “thời cổ không thể biểu diễn” là vô lý; ý đúng là <b>bây giờ</b> không thể."],["昨天是HSK考试报名截止日期的最后一天，还陆续有人前来报名。","截止日期的最后一天","昨天是HSK考试报名的截止日期 / 最后一天，……","<span class='zh'>截止日期</span> đã là một ngày → “ngày cuối cùng của hạn chót” thừa và mâu thuẫn."]]},DP:[{title:"词汇：熟悉下列交通方面的词语",vn:"Từ vựng giao thông — chia theo nhóm (cột 搭配 là nhóm).",items:[["轮船","lúnchuán","tàu thủy","工具","我们坐轮船去了大连。"],["隧道","suìdào","đường hầm","路桥","火车穿过了一条很长的隧道。"],["立交桥","lìjiāoqiáo","cầu vượt","路桥","北京有很多立交桥。"],["航行","hángxíng","đi tàu, bay","有关动词","这艘船在海上航行了一个月。"],["航天","hángtiān","hàng không vũ trụ","有关动词","中国的航天事业发展很快。"],["失事","shī shì","gặp nạn","有关动词","那架飞机失事了。"],["托运","tuōyùn","ký gửi (hành lý)","有关动词","行李太多了，我们托运吧。"]]},{title:"熟悉下列农业方面的词语并选择填空",vn:"Từ vựng nông nghiệp (đáp án bài tập sách in đậm trong câu ví dụ).",items:[["杂交","zájiāo","lai giống","杂交水稻","这个地区大面积种植了<b>杂交</b>水稻。"],["灌溉","guàngài","tưới tiêu","方便灌溉","为了方便<b>灌溉</b>，人们兴修水利。"],["水利","shuǐlì","thủy lợi","兴修水利","为了方便灌溉，人们兴修<b>水利</b>。"],["畜牧","xùmù","chăn nuôi gia súc","畜牧业","草原地区可以大力发展<b>畜牧</b>业。"],["化肥","huàféi","phân bón hóa học","使用化肥","使用<b>化肥</b>可以提高农作物单位面积的产量。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"世界上有些珍奇动物，尽管人们千方百计去保护，仍然处于即将灭绝的境地。可是有些动物，比如老鼠，虽然人们在用各种方法消灭它们，但却总是消灭不了，成群的老鼠依然到处作祟。",o:["珍奇动物灭绝得更快","老鼠不喜欢单独行动","人类想尽办法消灭老鼠","人类保护动物效果很好"],a:2,why:"“人们在用各种方法消灭它们”. D sai: dù bảo vệ vẫn sắp tuyệt chủng."},{n:2,say:"手脚并用原地跑减肥方案的最大特点是在原地跑的基础上将上肢运动很好地融进来，通过每2～3分钟变速和花样变化跑，加之现场的互动气氛，增加了原地跑的趣味性，减少了原地跑的枯燥、乏味，使原地跑更易坚持。",o:["原地跑步减肥成功概率高","手脚并用原地跑趣味性强","原地跑枯燥，但容易坚持","跑步需要互动，需要鼓励"],a:1,why:"“增加了原地跑的趣味性”."},{n:3,say:"腌制食品口味独特，包装简单，便于携带，成为上班族的家常便饭。可是你知道吗，这些食品在腌制过程中需要大量放盐，这会导致此类食物盐含量超标，经常食用会加重肾脏的负担，增加发生高血压的风险。",o:["腌制食品的包装非常独特","高血压病人不能吃腌制食品","上班族经常在家制作腌制食品","腌制食品含盐多，常吃不利于健康"],a:3,why:"“盐含量超标，经常食用会加重肾脏的负担”. A: hương vị độc đáo, bao bì <b>đơn giản</b>."},{n:4,say:"与人会谈时，若言不及义、唠唠叨叨，再多的时间也浪费了，如能把握谈话要领，言谈简要切题，就可以节省很多时间。节省下时间，就可以解决更多的问题，并且为自己赢得更多的自由时间。",o:["谈话要简单、抓住重点","会谈前应做好时间计划","每个人都应有自由时间","节省下时间能发现问题"],a:0,why:"“把握谈话要领，言谈简要切题”."},{n:5,say:"余老师是个热心人，她多次从自己微薄的收入中拿出钱来给家庭困难的学生交学费。前不久，又从自己多年的积蓄中拿出钱资助村里修路。邻居们谁家有事也总爱找她参谋，她是周围十里八乡大伙儿的贴心人。",o:["余老师热爱每一个学生","余老师的孩子没钱交学费","邻居家的闲事余老师都管","大伙把余老师看成最亲近的人"],a:3,why:"“她是……大伙儿的贴心人” — <span class='zh'>贴心人</span> = người thân thiết."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：您好！我们都知道您25岁考古系毕业就一头扎进了敦煌，在敦煌一待就是几十年，被誉为“敦煌女儿”。今天您就跟我们谈谈敦煌吧。\n女：刚去的时候，虽说对大西北恶劣的自然环境早有心理准备，可是没想到反差那么大。那时候整个研究所只有一部电话，晚上只能用手电照明，上厕所要跑好远的路。和北京相比，简直就不是一个世界。可是每当我走过石窟的时候，都会赞叹：敦煌太好了，太美了！\n男：敦煌莫高窟从发现到现在100多年了，把毕生精力都献给敦煌的人不少吧？\n女：是的，它1900年一被发现便轰动了世界。1944年中国第一批有志之士奔赴敦煌，在那儿设立了敦煌艺术研究所，至今已有三代学人在遍布黄沙的偏僻荒漠撰写了敦煌传奇。\n男：我注意到您在那儿的研究不纯粹局限于考古，您的研究成果包括敦煌石窟考古美术方面的书籍、有关石窟考古与艺术的论文，还有大量探索古遗址科学保护及管理的论文。另外，“数字敦煌”也是在您的提倡下实现的，当时这在国内文物保护领域还是创举吧？\n女：对。敦煌壁画是画在岩洞里的，自然侵蚀会使壁画慢慢消亡。莫高窟犹如人体，也会一天天变老，100年前人们看到的莫高窟和现在看到的是不一样的。可是什么东西一旦数字化了就不变了，我们想利用计算机技术实现敦煌壁画、彩塑艺术永久保存的构想。\n男：具体来讲，什么是“数字敦煌”？\n女：这还要从游客说起。我们发现很多游客来之前没有做功课，不了解莫高窟。来了直接进入洞窟，看半天也看不出所以然。“数字敦煌”就是数字电影，把敦煌的历史、洞窟的相关内容以及分散在世界各地的相关资料、研究成果汇集到了一起。这样便于游客通过“数字敦煌”先了解敦煌，再进洞窟参观，效果会更好。实践证明“数字敦煌”很成功，它一问世就受到游客的欢迎。",qs:[{n:6,q:"女的为什么被誉为“敦煌女儿”？",o:["她对考古研究情有独钟","她多次去敦煌参观游览","她把毕生精力献给了敦煌","她自愿放弃了北京的生活"],a:2,why:"“在敦煌一待就是几十年” — cống hiến cả đời."},{n:7,q:"关于敦煌莫高窟，下列哪项正确？",o:["莫高窟的历史长达百年","只有一批爱国人士去过敦煌","全世界都知道敦煌艺术研究所","三代学者为敦煌研究艰苦奉献"],a:3,why:"“至今已有三代学人在……偏僻荒漠撰写了敦煌传奇”. A: được <b>phát hiện</b> hơn 100 năm, không phải lịch sử."},{n:8,q:"女的做的哪件事在当时属于创新之举？",o:["她写了敦煌石窟考古美术方面的书籍","她写了石窟考古与艺术方面的论文","关于古遗址科学保护及管理方面的探索","利用计算机技术实现对文物的永久保存"],a:3,why:"“数字敦煌”……“当时这……还是创举”."},{n:9,q:"实现“数字敦煌”的好处是什么？",o:["可实现敦煌艺术的永久保存","可代替人们去实地参观敦煌","可回看百年之前的敦煌莫高窟","可缓解自然对敦煌壁画的侵蚀"],a:0,why:"“实现敦煌壁画、彩塑艺术永久保存的构想”."},{n:10,q:"游客为什么欢迎“数字敦煌”？",o:["“数字敦煌”价格便宜","“数字敦煌”更为环保","游客直接看洞窟看不懂","游客喜欢电影这种形式"],a:2,why:"“来了直接进入洞窟，看半天也看不出所以然”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"这是一个奇怪的组合，一对退休的老夫妻，一辆年逾百岁的老爷车。不知是冲动还是执念，他们相伴踏上了环游世界的奇妙旅途。\n老夫妻来自荷兰，丈夫叫德克，妻子唤作特鲁迪，他们在1997年购入了一款生产于1915年的老式福特T型车。这辆本应在博物馆里沉睡的老爷车，却在德克的手中焕发了青春。\n2012年夏，漫漫旅程拉开了序幕。他们先是去了非洲，行程大约24000公里，这是他们的第一次尝试，幸运的是，比他们年纪都大的福特T型车并没有吃不消。2013年，他们来到了美国和加拿大，走过了27000公里，在这段旅途中，福特T型车仅仅出了一点儿小毛病。2014年，他们开赴南美地区，总行程26000公里。随着名声渐起，这一次，他们还顺便做了一场公益活动，全程共募集爱心捐款3万英镑，悉数用来资助贫困儿童。\n旅行还没有完成，但德克夫妇由衷地感谢这辆年迈的爱车，是它伴随着他们进行了这场他们盼望已久的挑战。",qs:[{n:11,q:"关于德克夫妇的环游世界之旅，下列哪项正确？",o:["德克夫妇为了旅行辞掉了工作","德克夫妇一共去了4个国家","环球旅行的费用全部来自公益活动","环球旅行对德克夫妇来说是一场挑战"],a:3,why:"“进行了这场他们盼望已久的挑战”. A: họ đã <b>nghỉ hưu</b>."},{n:12,q:"关于福特T型车，下列哪项正确？",o:["博物馆喜欢收藏这款车","车是1915年生产的","1997年这款车坏了","2012年老夫妻租赁了这款车"],a:1,why:"“生产于1915年的老式福特T型车”. 1997 là năm <b>mua</b>."},{n:13,q:"在旅途中，可以知道什么？",o:["车经常会出一些小问题","这辆百岁老车一直很棒","出发前德克夫妇已闻名世界","德克夫妇长年帮助贫困儿童"],a:1,why:"Xe “并没有吃不消”, “仅仅出了一点儿小毛病”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"东明是我的一位朋友，她习惯先做喜欢的事，心情好了，再做不喜欢做的事。她喜欢旅行，有朋友对她说，钱花在玩儿上，多浪费啊，用这些钱干点儿什么不好。她说，再穷也要去旅行。不去旅行，你会更穷。这是什么逻辑？可她真是这样做的，云南、西藏、沿海渔村，我想去却因为种种原因没去成的地方，她都去了。每次回来，她虽然疲惫，精神却很饱满。那次从西藏回来，她写了一个很久都写不下去的提案，灵感如泉涌，下笔如神助，讨厌的事就这么又快又好地做完了。后来那个提案得了奖，她的旅费都赚回来了。\n东明在做一件很重要的事之前，总是先给自己一个奖励。比如坐周末航班去另一个城市见一位想见的朋友，先在那里和好友喝咖啡逛店，聊天聊到深夜，周一回来再开始工作，因为心情放松了，事情也就完成得特别顺利。",qs:[{n:14,q:"东明的逻辑是什么？",o:["没钱也要去旅行","穷人不用去旅行","心情好才适合旅行","少花钱也可以旅行"],a:0,why:"“再穷也要去旅行”."},{n:15,q:"东明从西藏回来有什么收获？",o:["高质量地写完了提案","改善了一度疲惫的状态","顺便在那里赚了一笔钱","找到了一份更好的工作"],a:0,why:"“讨厌的事就这么又快又好地做完了”."},{n:16,q:"东明做重要事情之前，先做什么？",o:["拜访老友","喝杯咖啡","逛店聊天","奖励自己"],a:3,why:"“总是先给自己一个奖励” — A, B, C chỉ là ví dụ."},{n:17,q:"根据这段话可以知道什么？",o:["有钱要花在刀刃上","旅游有助于调整情绪","游山玩水花钱是浪费","人都有心情不好的时候"],a:1,why:"Du lịch giúp tâm trạng tốt → làm việc hiệu quả."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["这件作品我整整做了10年，是我辛苦最多的。","李老汉做的松皮扣肉远近闻名，饭店常请他帮忙，以便招徕食客。","假如我不去留学，一直留在家里，我的人生完全会变成另外一副样子。","他是专程赶到阿姆斯特丹，去看那些很慢、很长，又很有情怀的纪录片的。"],a:0,why:"<b>Kết hợp sai</b>: <span class='zh'>辛苦</span> không đi với <span class='zh'>最多</span> → <span class='zh'>是我付出心血最多的</span>."},{n:19,o:["他是很重友情的，永远会全心全意对待每一个朋友。","全世界章鱼种类大约有650多种，它们的个头相差极大。","初来乍到，我们既不熟悉当地风土人情，也听不懂他们的方言。","在一个人的成长道路上，要是能够找到自己的指南针，就会少走许多弯路。"],a:1,why:"<b>Logic</b>: <span class='zh'>大约</span> và <span class='zh'>多</span> đều chỉ số ước lượng → bỏ một trong hai."},{n:20,o:["调查表明，城市各主要街道繁体字使用率高达39%。","为了防止不再发生乱收费的问题，有关部门加强了管理。","社会的发展变迁必然会在语言的词汇系统里留下时代印迹。","他生活在繁华的都市，忙得日理万机，但他始终不能淡忘儿时的往事。"],a:1,why:"<b>Phủ định kép</b>: <span class='zh'>防止 + 不再</span> → bỏ <span class='zh'>不再</span> (đúng dạng bài này!)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"鸟类在不同季节___栖息地，或是从居住地移至越冬地，或是从越冬地___居住地，这种现象称为迁徙。鸟类因迁徙___的不同可分为留鸟、夏候鸟、冬候鸟、旅鸟、迷鸟等几个类型。",o:["交换　搬回　方法","更改　移居　风格","转换　迁移　习俗","更换　返回　习性"],a:3,why:"<span class='zh'>更换栖息地</span>; <span class='zh'>返回居住地</span>; <span class='zh'>习性</span> (tập tính con vật — <span class='zh'>习俗</span> chỉ dùng cho người)."},{n:22,text:"卫星导航技术的发展___有三：一是卫星导航的多系统并存，使系统可用性___提高，应用范围更大；二是多元组合导航技术得到___应用；三是卫星导航与无线通信等其他高科技相结合，从___上促进IT技术的整体发展。",o:["趋势　得以　推广　根本","事业　可以　延伸　基础","主流　能够　若干　基本","产业　获得　深入　本来"],a:0,why:"<span class='zh'>发展趋势</span>; <span class='zh'>得以提高</span>; <span class='zh'>推广应用</span>; <span class='zh'>从根本上</span>."},{n:23,text:"___凶猛的鲨鱼一般在海洋中上层活动，它能一口吞下成群的小鱼，还能咬死和吃掉比它大的鱼或其他动物，奇怪的是，它从不吞食和它___的小伙伴——向导鱼。向导鱼在鲨鱼周围游来游去，反应___，一点儿也不___鲨鱼。",o:["脾气　不离不弃　灵活　畏惧","个性　难舍难分　灵敏　恐怕","性情　形影不离　敏捷　害怕","性格　亲密无间　矫健　惊恐"],a:2,why:"<span class='zh'>性情凶猛</span> (con vật); <span class='zh'>形影不离</span>; <span class='zh'>反应敏捷</span>; <span class='zh'>不害怕</span> + tân ngữ."}]},read3:{ins:"第24–28题：选句填空。",text:"曾经有人说过，要么读书，要么旅行，身体和心灵，(24)。\n生活在这个世界上，我们会遇见很多的人，经历很多的事，我们会感到困惑、疲惫。这个时候，(25)？在行走中领悟人生，在与大自然的接触中找到自我。\n旅行，让人见多识广。在旅行中，我们可以看美丽的风景，了解新的文化习俗，(26)，所以不要再被束缚在书本里了，旅行吧，更好地去了解生存的意义。\n旅行，能让我们的心灵得到一次真正的解脱，远离现实的复杂，远离城市的喧闹，(27)。行走在阳光下，徜徉在微风中。在那样的美景里，每一秒钟的自己都是全新的。\n所谓旅行，并不光是去过多少地方，吃过多少美食，看过多少美景，而是在一个又一个的旅途中，对自己有不同的认识，对人生有不同的感受。其实，人生就是一次旅行，重要的不是目的地，(28)。",opts:["何不去旅行呢","远离所有的烦恼","我们还能发现那些在书本上找不到的东西","而是欣赏风景的心情","必须有一个在路上"],ans:{24:4,25:0,26:2,27:1,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"旅游，顾名思义是外出旅行游览。跋山涉水，观赏自然界的美丽风光，忘情于山水之间。\n古人也喜爱这项情趣高雅的活动。大约1500年前，中国就有了“旅游”一词。当时的诗人沈约就有“旅游媚年春，年春媚游人”的诗句，意思是说“游客留恋春天的美景，春景也在取悦着游人”。\n古人旅游交通不便，基本靠脚，其他交通工具多是驴车、马车或木船，大部分时间都要花在行程中，真所谓历尽艰辛，因此多数百姓是就近游玩。史载，唐朝，西安郊外曲江风光秀美，景色宜人。每年三月三、重阳节，曲水悠悠，亭台楼阁，游人如织。大家兴致高了，便登高作诗，借以助兴。\n明末旅行家徐霞客一生志在四方，足迹遍及如今的21个省、市、自治区。所到之处，探幽寻秘。徐霞客的传世之作《徐霞客游记》便是他旅行34年，撰写的一本以日记体形式完成的地理著作，主要记录了他观察到的人文、地理、动植物等状况。如今中国将5月19日定为“中国旅游日”，便是选择的《徐霞客游记》的开篇之日。\n古人旅行是把心放在山水里，认为风景是属于懂它的人。在自然面前，山水之美，让人世间的是非恩怨都淡了。古人旅游的兴致与情趣令今人自叹弗如，让我们试着感受古人的旅游，心随山水走，诗意地行走于生活，尽情释放自己的真性情。",qs:[{n:29,q:"古人旅行：",o:["寄情于山水之间","一心为喝酒写诗","没有今人的兴致高","在旅行中寻找人性"],a:0,why:"“把心放在山水里”."},{n:30,q:"第3段画线词语“就近”的意思是：",o:["靠近","趁着近","如果近","在附近"],a:3,why:"Đi lại khó khăn → dân thường chơi <b>ở gần</b>."},{n:31,q:"古人旅游最大的困难是：",o:["行程不好定","交通不方便","景点太集中","没有人组织"],a:1,why:"“古人旅游交通不便，基本靠脚”."},{n:32,q:"为什么称徐霞客为旅行家？",o:["他旅行的时候坚持天天写日记","他用34年的时间写了一本游记","他遍览中国名山大川并有著作传世","他号召设立了“中国旅游日”"],a:2,why:"Dấu chân khắp 21 tỉnh + 《徐霞客游记》传世."}]},{ins:"第33–36题：请选出正确答案。",text:"瑞士拉沃梯田式葡萄园，位于瑞士沃州莱蒙湖北岸一片18公里长的山坡上。800多年来，这片“世外桃源”始终坚持人与自然的完美对话，在改造自然、战胜自然的同时，面对势如破竹的城市化进程依然独善其身，被称为“人间仙境”。\n拉沃梯田式葡萄园总面积898公顷，包括574公顷葡萄园和散落其间的14个小村落。路特里——拉沃地区西端的第一个村落，就是梯田式葡萄园的起点。湖边一直平缓的山坡从这里开始变得险要，坡度从25°到70°不等，然而，这几乎直立的山坡上，却满是碧绿的葡萄园，18公里长的坡地就像一条时宽时窄的翠带，丝毫看不出这里曾是一片多石少土的荒蛮之地。\n拉沃梯田式葡萄园始建于12世纪中叶。起初是教士们从山坡最为险要的地段开始开垦这片贫瘠的土地，他们用双手将山坡上的石头垒成一道道石墙，在石墙里堆上土，建成一道道梯田，种上一株株葡萄苗。随后，附近的村民也加入到改造山坡、种植葡萄的大军中。经过数个世纪的辛勤劳作，葡萄种植和酿酒已成为拉沃地区的支柱产业之一。这里生产的葡萄酒品牌远近闻名，德萨雷牌葡萄酒更是供不应求。\n20世纪70年代初，拉沃也面临着城市化的问题，甚至有人相中了这里的湖光山色、林木葱茏，一心一意要在这里建造高档别墅区，届时超级市场、娱乐场所、大型停车场等一样都少不了，果真如此，保持了几个世纪的拉沃地区梯田式葡萄园将会被彻底破坏掉。最后经过当地居民的不断努力，拉沃成功避免了城市化的侵犯。从1998年起，拉沃地区梯田式葡萄园开辟出32公里长的旅游步行线，人们可以步行在田埂小道上欣赏葡萄园。2007年，拉沃梯田式葡萄园成功进入《世界文化遗产名录》，人们称它是“种出来的世界文化遗产”。",qs:[{n:33,q:"800多年来，拉沃梯田式葡萄园有过怎样的经历？",o:["村里盖起了别墅","与城市化擦肩而过","葡萄园里有了娱乐场所","这里酿出来的酒总是不够喝"],a:1,why:"“拉沃成功避免了城市化的侵犯”."},{n:34,q:"拉沃梯田式葡萄园的特点是：",o:["葡萄园散落在村子里","葡萄都种在平缓地带","葡萄种在多石少土的山坡上","几乎直立的山坡上种满了葡萄"],a:3,why:"“这几乎直立的山坡上，却满是碧绿的葡萄园”. C: “多石少土” là <b>trước kia</b>."},{n:35,q:"12世纪中叶，拉沃地区发生了什么事？",o:["教士们带头修建梯田","村民们学习种植葡萄","葡萄酒成了当地特产","这里的葡萄酒出名了"],a:0,why:"“起初是教士们……开垦……建成一道道梯田”."},{n:36,q:"最适合做上文标题的是：",o:["美丽的葡萄园","人与自然的完美对话","拉沃创造了人间奇迹","种出来的世界文化遗产"],a:3,why:"Câu kết, khái quát nhất."}]}]},W:{zh:"写作",vn:"Viết văn: 我最喜欢的一本旅行指南",t:"35 phút",min:!0,task:"这篇课文介绍了中国旅行指南发展的历程，同时告诉我们旅行指南一般包括哪些内容，有什么作用。你常旅游吗？你也经常用到旅行指南吗？请参照本文内容，以“我最喜欢的一本旅行指南”为题，介绍一本你最喜欢的旅行指南。说清楚这本指南包括的内容以及你喜欢它的原因。文章不少于400字。",target:400,steps:[["Mở bài","Bạn đi du lịch thế nào? Gặp cuốn cẩm nang này khi nào? (<span class='zh'>起初 · 一度 · 一向</span>)"],["Giới thiệu cuốn sách","Tên, tác giả/nhà xuất bản, <span class='zh'>版本 · 问世 · 序言 · 栏目</span>, đặc điểm hình thức (<span class='zh'>便于携带</span>)."],["Nội dung","Khung bài khóa: <span class='zh'>不仅介绍……，还会介绍……，……更是必不可少</span>."],["Lý do yêu thích","2–3 lý do + 1 kỷ niệm cụ thể; <span class='zh'>和其他指南相比 · 犹如……的参谋 / 向导</span>."],["Kết bài","Khái quát vai trò của cẩm nang với bạn."]],outline:[["一 · 引子","我爱旅游；这本书是怎么来的"],["二 · 介绍","书名、版本、特点"],["三 · 内容","地理、风土人情、饮食、住宿、交通、预算"],["四 · 喜欢的原因","实用、有趣味、人性化 + 一次经历"],["五 · 结尾","它是我的好参谋"]],model:"我最喜欢的一本旅行指南\n我一向喜欢旅游，每年都要去几个新地方。起初我出门从来不做准备，到了目的地才发现，不知道去哪儿玩儿，也不知道吃什么。后来，朋友送了我一本《云南自助游》，从此它就成了我最喜欢的旅行指南。\n这本书是一本携带方便的口袋书，有中、英文两个版本，我买的是中文版。作者在序言中说，写这本书是为了便于第一次去云南的背包客出行。\n和其他指南相比，这本书的内容非常全面。它不仅介绍了云南的地理环境、风土人情和著名风景，还介绍了当地的饮食、少数民族的节日和习俗。青年旅社、经济型酒店、长途汽车站等信息更是必不可少。书的最后还有一个栏目，专门帮读者做经费预算，告诉你去一个地方大概要花多少钱。\n我喜欢它，第一是因为它实用。去年我一个人去了一个很偏僻的小村子，那里手机没有信号，导航也用不了，我就是靠这本书找到了住的地方。第二是因为它很有趣味，书里有很多作者自己的小故事，读起来就像听朋友聊天儿。第三是因为它很人性化，每一页都留了空白，可以写下自己的感受。\n现在，这本书已经被我翻得很旧了，上面写满了我的旅行笔记。对我来说，它犹如一位随身的向导，也是我旅行路上最好的参谋。",check:["Có tiêu đề “我最喜欢的一本旅行指南”","Giới thiệu sách (tên, đặc điểm)","Nêu nội dung sách","Có ít nhất 2 lý do yêu thích","Có kỷ niệm / ví dụ cụ thể","Dùng ít nhất 4: 便于 · 犹如 · 和……相比 · 一向 · 一度 · 问世 · 栏目","Không ít hơn 400 chữ"]},SUM:{words:["变迁","一向","起初","迁徙","侵犯","纯粹","生存","若干","遍布","千方百计","书籍","问世","携带","序言","繁华","便于","习俗","简要","一度","轰动","人士","版本","发行","延伸","产业","振兴","主流","犹如","宗旨","栏目","偏僻","沿海","风土人情","经费","预算","参谋","向导","租赁"],patterns:[["为便于……，……","为便于外地人出行，他搜集了……信息。"],["……犹如……","国内旅游和出国旅游都变得犹如家常便饭。"],["和……相比，……","和过去相比，游客不再仅关注著名旅游城市。"],["不仅……，还……，……更是必不可少","旅游指南不仅介绍……，还会介绍……，……更是必不可少。"],["在……的共同努力下","这本书是在中外人士的共同努力下完成的。"]],diff:["一向：xưa nay luôn; hỏi thăm (你一向好) — 一度：đã có một thời; số lượng từ (一年一度)","便于 + động từ (≠ 方便) · 若干 = một số (văn viết) · 书籍 = sách (tập hợp) · 人性化 = thân thiện · 习俗 (người) ≠ 习性 (con vật)"],sentences:["起初，人类旅行更准确地说，应该叫迁徙。","改革开放以后，旅游真正作为经济型产业受到重视。","卫星导航系统的广泛应用，使得人们不管走到哪儿，都犹如有位随身的向导。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “我最喜欢的一本旅行指南” ≥400 chữ (mục 7).","Làm Sách bài tập bài 13.","Đọc trước bài 14."]}});
