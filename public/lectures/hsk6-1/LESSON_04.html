<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 4 · 完美的胜利 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-04",num:4,book:"HSK 标准教程 6（上）",unit:{n:1,zh:"生活点滴",vn:"Những việc nhỏ nhặt trong cuộc sống"},title:"完美的胜利",vn:"Chiến thắng hoàn hảo",chars:750,source:"改编自《参考消息》台湾《智慧小品》",goals:["Đọc hiểu truyện ngụ ngôn 750 chữ “chuột và voi” — rút ra bài học <b>化敌为友，就是最大的胜利</b>.","Dùng được 48 từ mới, đặc biệt nhóm từ <b>cảm xúc – thái độ</b>: <span class='zh'>厌倦 · 厌恶 · 蔑视 · 愤怒 · 悲惨 · 残忍 · 良心</span>.","Nắm <span class='zh'>乘机 · 不料 · 未免</span> và mẫu <span class='zh'>倘若……必须……否则…… · 只要……就……，不就……吗？</span>","Phân biệt <span class='zh'>恰巧 — 正好</span>; hiểu nghĩa từ tố (语素义) và một số lượng từ ít gặp.","Viết 缩写 300 chữ có <b>khởi nhân – diễn biến – kết quả – bài học</b>; làm thử đề 缩写 HSK thật (400 chữ)."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (倘若…否则… · 乘机 · 不料) · Bài khóa đoạn 1–3"],["Buổi 2","Từ vựng & ngữ pháp nhóm 3 (未免 · 恰巧—正好 · 只要…不就…吗) · Đoạn 4–6 · Bài tập · Mở rộng · Luyện đề · 缩写"]],outline:[{tag:"起",name:"Mở đầu",paras:"Đoạn 1",zh:"老鼠离开山神，条件是战胜大象",vn:"Chuột chán làm thú cưng của Sơn thần, xin xuống trần; điều kiện quay về: thắng được voi."},{tag:"承",name:"Thử lần 1",paras:"Đoạn 2–3",zh:"钻进象鼻失败，被大象蔑视",vn:"Chuột chui vào vòi voi — bị hắt hơi bắn ra, bị voi khinh bỉ, không dám thách thức nữa."},{tag:"转",name:"Bước ngoặt",paras:"Đoạn 4–5",zh:"大象落网，老鼠不忍下手，咬断绳网救了大象",vn:"Voi sa lưới thợ săn; chuột có cơ hội “thắng” nhưng không nỡ, cắn đứt lưới cứu voi; hai bên thành bạn."},{tag:"合",name:"Kết – bài học",paras:"Đoạn 6",zh:"化敌为友，是最完美的胜利",vn:"Sơn thần: biến thù thành bạn — chiến thắng hoàn hảo nhất."}],warm1:{q:"给下面的词语选择对应的图片，并回答下面的问题。",vn:"Nối từ với tranh (A voi · B khỉ · C hổ · D chuột · E bướm · F mèo), rồi trả lời câu hỏi.",items:[["🐭","老鼠 → D　·　蝴蝶 → E　·　猴子 → B","chuột · bướm · khỉ"],["🐯","老虎 → C　·　大象 → A　·　猫 → F","hổ · voi · mèo"],["💭","上边的动物中，你觉得强大的是哪些？弱小的是哪些？你认为老鼠可以战胜大象吗？如果可以，方法是什么？","Con nào mạnh, con nào yếu? Chuột có thể thắng voi không? Nếu được thì bằng cách nào?"]],talk:["“强大”和“弱小”是绝对的吗？","你听过哪些“以小胜大”的故事？"],link:"Bài khóa đưa ra một câu trả lời bất ngờ: chuột “thắng” voi không phải bằng sức mạnh mà bằng <b>lòng tốt</b> — <span class='zh'>化敌为友</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"物",rule:"物 = <b>vật, đồ vật</b>. Từ chỉ loại sự vật: N/V + 物.",w:[["宠物","chǒngwù","thú cưng (có trong bài)"],["人物","rénwù","nhân vật"],["动物","dòngwù","động vật"],["植物","zhíwù","thực vật"],["食物","shíwù","thức ăn"],["事物","shìwù","sự vật"],["博物馆","bówùguǎn","viện bảo tàng"],["购物","gòuwù","mua sắm"],["读物","dúwù","sách báo để đọc"],["废物","fèiwù","phế liệu; đồ vô dụng"],["药物","yàowù","thuốc men"],["建筑物","jiànzhùwù","công trình kiến trúc"],["物质","wùzhì","vật chất"]]},{k:"弱",rule:"弱 = <b>yếu</b> (trái nghĩa 强).",w:[["弱小","ruòxiǎo","nhỏ yếu (có trong bài)"],["弱点","ruòdiǎn","điểm yếu"],["弱者","ruòzhě","kẻ yếu"],["瘦弱","shòuruò","gầy yếu"],["软弱","ruǎnruò","yếu đuối"],["体弱","tǐruò","thể chất yếu"],["微弱","wēiruò","yếu ớt"],["减弱","jiǎnruò","suy giảm"],["柔弱","róuruò","mềm yếu"],["示弱","shìruò","tỏ ra yếu thế"],["虚弱","xūruò","suy nhược"],["老弱病残","lǎo ruò bìng cán","người già yếu, bệnh tật, tàn tật"]]},{k:"悲",rule:"悲 = <b>buồn, bi thương</b>.",w:[["悲伤","bēishāng","đau buồn (có trong bài)"],["悲观","bēiguān","bi quan"],["悲痛","bēitòng","đau thương"],["悲剧","bēijù","bi kịch"],["悲苦","bēikǔ","buồn khổ"],["悲惨","bēicǎn","bi thảm (từ mới)"],["悲欢离合","bēihuān-líhé","vui buồn hợp tan"],["可悲","kěbēi","đáng buồn"],["乐极生悲","lè jí shēng bēi","vui quá hóa buồn"]]},{k:"费",rule:"费 = <b>tốn, tiêu tốn</b>; cũng là danh từ “phí”.",w:[["耗费","hàofèi","hao tốn (từ mới)"],["花费","huāfèi","chi tiêu"],["浪费","làngfèi","lãng phí"],["消费","xiāofèi","tiêu dùng"],["白费","báifèi","uổng phí"],["费时","fèishí","tốn thời gian"],["费心","fèixīn","bận tâm"],["费力","fèilì","tốn sức"],["费钱","fèiqián","tốn tiền"],["费电","fèidiàn","tốn điện"],["费劲","fèijìn","vất vả, tốn công"],["费尽心机","fèijìn xīnjī","dốc hết tâm cơ"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Lời hứa với Sơn thần",from:1,to:13},{name:"Nhóm 2 · Đoạn 3",sub:"Lần thử thất bại",from:14,to:27},{name:"Nhóm 3 · Đoạn 4–6",sub:"Cứu voi – chiến thắng hoàn hảo",from:28,to:48}],V:[[1,"厌倦","yànjuàn","đgt.","yếm quyện","chán ngán",0,"","对某种活动失去兴趣而不愿继续。","它厌倦了宠物的生活","他厌倦了每天重复的工作。","Anh ấy chán ngán công việc lặp đi lặp lại mỗi ngày.",["厌倦了……","感到厌倦"],"* Ngoài đề cương. <b>厌倦</b>: chán vì kéo dài, lặp lại; <b>厌恶</b> (từ 2): ghét, ghê tởm."],[2,"厌恶","yànwù","đgt.","yếm ố","chán ghét, ghê tởm",1,"","（对人或事物）产生很大的反感。","也很厌恶宠物这个角色","我厌恶说谎的人。","Tôi ghét những kẻ nói dối.",["令人厌恶","厌恶情绪"],"⚠️ 恶 đọc <b>wù</b> (ghét). So sánh: <span class='zh'>恶 è</span> (ác), <span class='zh'>恶心 ě</span> (buồn nôn), <span class='zh'>可恶 kěwù</span> (từ 24)."],[3,"倘若","tǎngruò","liên.","thảng nhược","nếu như",1,"书","表示假设，相当于“如果”。","倘若你还想回来，必须战胜大象","倘若明天下雨，比赛就推迟。","Nếu mai mưa thì trận đấu hoãn lại.",["倘若……就……","倘若……否则……"],"Văn viết của <span class='zh'>如果 / 要是</span>. Xem Ngữ pháp và Bài tập 4①."],[4,"发觉","fājué","đgt.","phát giác","phát hiện ra, nhận ra",1,"","开始知道（隐藏的或以前没注意到的事）。","便发觉它对山神的承诺是多么草率","走了很远，我才发觉钱包丢了。","Đi rất xa rồi tôi mới phát hiện mất ví.",["发觉问题","没有发觉"],"<b>发觉</b>: tự mình nhận ra điều trước đó không biết; <b>发现</b>: dùng rộng hơn, còn chỉ phát minh, khám phá."],[5,"承诺","chéngnuò","đgt.","thừa nặc","hứa hẹn, cam kết",1,"","对某项事务答应照办；也作名词。","它对山神的承诺","公司承诺三天内退款。","Công ty cam kết hoàn tiền trong ba ngày.",["做出承诺","遵守承诺","兑现承诺"],"Trong bài là danh từ: <span class='zh'>对山神的承诺</span>. SBT 33: <span class='zh'>不再带宠物回家的承诺</span>."],[6,"草率","cǎoshuài","tt.","thảo suất","qua loa, hấp tấp",1,"","（做事）不认真，不细致；敷衍了事。","承诺是多么草率","这么重要的事，不能草率决定。","Việc quan trọng thế, không thể quyết định qua loa.",["草率决定","草率行事","草率了事"],"Trái nghĩa: <span class='zh'>慎重 · 认真</span>."],[7,"对抗","duìkàng","đgt.","đối kháng","đối chọi, chống lại",1,"","对立起来相持不下；抵抗。","丝毫没有对抗大象的力量","两支球队的对抗非常激烈。","Cuộc đối đầu giữa hai đội rất kịch liệt.",["对抗赛","与……对抗","正面对抗"],"Bài tập 3①."],[8,"尝试","chángshì","đgt.","thường thí","thử",1,"","试；试验。","老鼠还是决定尝试一下","不妨尝试一下新的方法。","Cứ thử một p  với âm nhạc.",["毫无办法","毫无意义","毫无兴趣"],"Sau là danh từ hai âm tiết. Họ hàng: <span class='zh'>毫不 + V/Adj</span> (<span class='zh'>毫不犹豫</span>). Bài tập 3②."],[38,"抵抗","dǐkàng","đgt.","để kháng","chống cự, kháng cự",1,"","用力量制止对方的进攻。","毫无抵抗能力","多运动可以增强身体的抵抗力。","Vận động nhiều giúp tăng sức đề kháng.",["抵抗力","奋起抵抗"],"<span class='zh'>抵抗力</span> = sức đề kháng (Ngữ pháp 乘机)."],[39,"部位","bùwèi","dt.","bộ vị","bộ phận, vị trí (cơ thể)",1,"","位置（多用于人的身体）。","在它身体的重要部位咬几个洞","受伤的部位还很疼。","Chỗ bị thương vẫn còn đau.",["重要部位","受伤部位"],""],[40,"悲惨","bēicǎn","tt.","bi thảm","bi thảm, thê thảm",1,"","处境或遭遇极其痛苦，令人伤心。","看到大象悲惨的样子","他小时候的经历非常悲惨。","Tuổi thơ của anh ấy vô cùng bi thảm.",["悲惨的遭遇","悲惨的命运"],""],[41,"未免","wèimiǎn","phó.","vị miễn","có phần, hơi (quá)",1,"书","表示不以为然，只能说是……","那样未免太过残忍","你这样说未免太过分了。","Anh nói vậy thì có phần quá đáng rồi.",["未免太……了","未免有些……"],"Xem <b>Ngữ pháp 3</b>."],[42,"残忍","cánrěn","tt.","tàn nhẫn","tàn nhẫn",1,"","狠毒。","太过残忍","虐待动物是很残忍的行为。","Ngược đãi động vật là hành vi rất tàn nhẫn.",["残忍的手段","太残忍了"],""],[43,"良心","liángxīn","dt.","lương tâm","lương tâm",1,"","内心对是非、善恶的正确认识。","良心告诉它，应该救大象","做事要对得起自己的良心。","Làm việc phải không hổ thẹn với lương tâm.",["有良心","没良心","良心不安"],"Bài tập 4②: <span class='zh'>良心告诉我……</span>."],[44,"锋利","fēnglì","tt.","phong lợi","sắc bén",1,"","（刀、剑等）头尖或刃薄，容易刺入或切入物体。","用锋利的牙齿咬","这把刀非常锋利。","Con dao này rất sắc.",["锋利的刀","言辞锋利"],"Nghĩa bóng: lời lẽ sắc bén."],[45,"缠绕","chánrào","đgt.","triền nhiễu","quấn quanh",1,"","条状物回旋地束缚在别的物体上。","缠绕着大象的网和绳子","藤缠绕在大树上。","Dây leo quấn quanh cây lớn.",["缠绕着","被……缠绕"],"SBT câu 1: <span class='zh'>大树上都缠绕着……白藤</span>."],[46,"耗费","hàofèi","đgt.","hao phí","hao tốn",1,"","消耗，花费。","老鼠几乎耗费了全部力气","这项工程耗费了大量资金。","Công trình này hao tốn lượng vốn lớn.",["耗费时间","耗费精力","耗费资金"],"Bài tập 3②."],[47,"缺口","quēkǒu","dt.","khuyết khẩu","lỗ hổng, chỗ thủng",1,"","物体上缺掉一块而形成的空隙；也指资金等的不足。","巨网出现了一个大缺口","碗边有个缺口。","Miệng bát bị mẻ một chỗ.",["资金缺口","打开缺口"],""],[48,"举世瞩目","jǔshì zhǔmù","thành ngữ","cử thế chúc mục","được cả thế giới chú ý",1,"成","全世界的人都注视着。","创造了举世瞩目的成就","北京奥运会举世瞩目。","Thế vận hội Bắc Kinh được cả thế giới chú ý.",["举世瞩目的成就"],"Hay đi với <span class='zh'>成就 · 成果 · 事件</span>. Bài tập 2⑥."]],extra:[["山神","shānshén","thần núi"],["证明实力","zhèngmíng shílì","chứng minh thực lực"],["暗自","ànzì","thầm, ngầm"],["认输","rèn shū","chịu thua"],["打喷嚏","dǎ pēntì","hắt hơi"],["痒","yǎng","ngứa"],["踩","cǎi","giẫm"],["巨网","jùwǎng","tấm lưới lớn"],["不忍下手","bùrěn xiàshǒu","không nỡ ra tay"],["咬断","yǎoduàn","cắn đứt"],["化敌为友","huà dí wéi yǒu","biến thù thành bạn"]],T:[{zh:"老鼠是山神的宠物，它厌倦了宠物的生活，也很厌恶宠物这个角色，于是向山神请假，要求到动物世界走一回，心想一定要找机会证明一下自己的实力。山神说：“动物世界中，大象是最强大的，倘若你还想回来，必须战胜大象，否则，你就永远留在动物世界吧。”老鼠答应了山神的条件，并暗自把挑战目标定为了大象。",vn:"Chuột là thú cưng của Sơn thần. Nó chán ngấy cuộc sống thú cưng, cũng rất ghét vai trò ấy, bèn xin Sơn thần cho phép xuống thế giới động vật một chuyến, trong bụng nghĩ nhất định phải tìm cơ hội chứng minh thực lực của mình. Sơn thần nói: “Trong thế giới động vật, voi là mạnh nhất. Nếu ngươi còn muốn quay về thì phải thắng được voi, bằng không, ngươi cứ ở lại thế giới động vật mãi mãi đi.” Chuột nhận lời điều kiện của Sơn thần, và thầm đặt mục tiêu thách đấu là voi.",idea:"Chuột rời Sơn thần với điều kiện: phải thắng voi mới được về.",q:["老鼠为什么要到动物世界去？","山神给老鼠提了什么条件？"],note:[["倘若你还想回来，必须战胜大象，否则，你就永远留在动物世界吧","Chuỗi <span class='zh'>倘若……必须……否则……</span> = nếu… thì phải…, bằng không… — mẫu đặt điều kiện. Xem <b>Bài tập 4①</b>."],["厌倦了……，也很厌恶……","Hai động từ cùng gốc 厌 tăng tiến: chán → ghét."]]},{zh:"老鼠一来到动物界，便发觉它对山神的承诺是多么草率，它是那么弱小，丝毫没有对抗大象的力量，但老鼠还是决定尝试一下。它想，我太小了，不可以盲目行动，但我可以乘大象不注意，进到大象鼻子里去，大象不能喘气了，就得请求我饶恕，我就可以强迫它认输。",vn:"Chuột vừa đến thế giới động vật liền nhận ra lời hứa với Sơn thần thật hấp tấp biết bao: nó nhỏ yếu thế, chẳng có chút sức nào để đối đầu với voi. Nhưng chuột vẫn quyết định thử. Nó nghĩ: mình nhỏ quá, không thể hành động mù quáng, nhưng mình có thể nhân lúc voi không để ý chui vào vòi voi; voi không thở được, sẽ phải xin mình tha, thế là mình ép được nó chịu thua.",idea:"Biết mình yếu, chuột nghĩ ra kế chui vào vòi voi.",q:["老鼠来到动物界以后发觉了什么？","老鼠的计划是什么？"],note:[["一来到动物界，便发觉……","<span class='zh'>一……便……</span> = vừa… liền… (văn viết của <span class='zh'>一……就……</span>)."],["是多么草率","<span class='zh'>多么 + Adj</span> trong câu trần thuật = biết bao, nhấn mạnh mức độ."]]},{zh:"这天，大象正在吃树叶，老鼠乘机跑进大象的鼻子中，准备实施它的计划。不料，刚进去，大象痒得难受，猛烈地打起了喷嚏，老鼠像子弹一样被射了出来。大象用蔑视的眼光盯着它，愤怒地说：“你这个愚蠢的家伙，太可恶了，下次再耍流氓，我一定踩扁了你。”从此老鼠再也不敢挑战大象了。",vn:"Hôm ấy, voi đang ăn lá cây, chuột nhân cơ hội chạy vào vòi voi, chuẩn bị thực hiện kế hoạch. Không ngờ vừa vào, voi ngứa không chịu nổi, hắt hơi một cái thật mạnh, chuột bị bắn ra như viên đạn. Voi nhìn chằm chằm nó bằng ánh mắt khinh bỉ, giận dữ nói: “Đồ ngu ngốc, thật đáng ghét! Lần sau còn giở trò lưu manh, ta nhất định giẫm bẹp ngươi.” Từ đó chuột không dám thách thức voi nữa.",idea:"Kế hoạch thất bại, chuột bị voi khinh miệt.",q:["老鼠的计划成功了吗？为什么？","大象对老鼠是什么态度？"],note:[["老鼠乘机跑进……。不料，刚进去，……","<span class='zh'>乘机</span> (nhân cơ hội) + <span class='zh'>不料</span> (không ngờ) — hai từ trọng điểm, tạo bước ngoặt hài hước."],["老鼠像子弹一样被射了出来","So sánh <span class='zh'>像……一样</span> + bị động <span class='zh'>被射了出来</span>."]]},{zh:"那是一个夕阳将落的傍晚，大象不留神落入了打猎者设下的巨网中。它不顾一切地用力挣扎，往外乱窜，想摆脱巨网，可是，它的一切努力都没用。大象又悲伤又害怕，它觉得死亡越来越近了。恰巧，老鼠看到了这一切，它想，大象现在毫无抵抗能力，只要我在它身体的重要部位咬几个洞，它就没命了，我不就战胜大象了吗？然而，看到大象悲惨的样子，老鼠不忍下手，它觉得那样未免太过残忍，良心告诉它，应该救大象，于是，它开始用锋利的牙齿咬缠绕着大象的网和绳子。不知过了多久，老鼠几乎耗费了全部力气，绳子终于被咬断了，巨网出现了一个大缺口，大象猛地一用力，脱离了巨网。",vn:"Đó là một buổi chiều hoàng hôn sắp tắt, voi sơ ý sa vào tấm lưới lớn của thợ săn giăng sẵn. Nó bất chấp tất cả vùng vẫy, lao loạn ra ngoài, muốn thoát khỏi lưới, nhưng mọi cố gắng đều vô ích. Voi vừa đau buồn vừa sợ hãi, cảm thấy cái chết ngày càng gần. Vừa khéo, chuột nhìn thấy tất cả. Nó nghĩ: voi giờ không còn chút sức chống cự nào, chỉ cần mình cắn vài lỗ vào chỗ hiểm trên người nó là nó toi mạng, thế chẳng phải mình đã thắng voi rồi sao? Thế nhưng, nhìn dáng vẻ thảm thương của voi, chuột không nỡ ra tay, nó thấy làm thế có phần quá tàn nhẫn. Lương tâm bảo nó phải cứu voi. Thế là nó bắt đầu dùng hàm răng sắc nhọn cắn lưới và dây thừng quấn quanh voi. Chẳng biết bao lâu, chuột gần như cạn kiệt sức lực, dây cuối cùng cũng đứt, tấm lưới hở một lỗ lớn, voi dồn sức một cái, thoát khỏi lưới.",idea:"Voi sa lưới; chuột không nỡ hại mà cứu voi.",q:["大象遇到了什么危险？","老鼠本来可以怎么做？它最后为什么救了大象？"],note:[["只要我在……咬几个洞，它就没命了，我不就战胜大象了吗？","<span class='zh'>只要……就……</span> + câu hỏi tu từ <span class='zh'>不就……了吗？</span> = chẳng phải… rồi sao. Xem <b>Bài tập 4②</b>."],["然而，……老鼠不忍下手，它觉得那样未免太过残忍","<span class='zh'>然而</span> chuyển ý; <span class='zh'>未免太过……</span> = có phần quá… (đánh giá không tán thành)."],["大象又悲伤又害怕","<span class='zh'>又 A 又 B</span>: hai trạng thái cùng lúc."]]},{zh:"从此，老鼠和大象成了好朋友。",vn:"Từ đó, chuột và voi trở thành bạn tốt.",idea:"Chuột và voi thành bạn.",q:["老鼠和大象的关系发生了什么变化？"],note:[["从此，……","Đối xứng với đoạn 3: <span class='zh'>从此老鼠再也不敢挑战大象了</span> → <span class='zh'>从此，老鼠和大象成了好朋友</span>."]]},{zh:"不久，山神找到了老鼠，要它回到自己身边。老鼠说：“这大概不可能了，我无法战胜大象。”山神说：“你化敌为友，创造了举世瞩目的成就，世界上还有比这更完美的胜利吗？”",vn:"Ít lâu sau, Sơn thần tìm đến chuột, muốn nó trở về bên mình. Chuột nói: “Chắc là không được rồi, con không thể thắng voi.” Sơn thần nói: “Ngươi biến kẻ thù thành bạn, làm nên thành tựu cả thế giới phải ngưỡng mộ — trên đời còn chiến thắng nào hoàn hảo hơn thế sao?”",idea:"Bài học: biến thù thành bạn là chiến thắng hoàn hảo nhất.",q:["山神为什么说老鼠胜利了？","你同意“化敌为友就是最大的胜利”吗？"],note:[["世界上还有比这更完美的胜利吗？","Câu hỏi tu từ = không có chiến thắng nào hoàn hảo hơn — <b>điểm đề</b> (点题) cho nhan đề."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: nghĩa từ tố & lượng từ",G:[{id:"g1",grp:0,word:"倘若",zh:"倘若……，必须……，否则……",py:"",tag:"Mẫu câu điều kiện (Bài tập 4①)",mean:"<span class='zh'>倘若</span> = <span class='zh'>如果</span> (văn viết). Chuỗi ba vế: <b>nếu muốn A</b> → <b>bắt buộc phải B</b> → <b>bằng không thì C</b> (hậu quả).",forms:["倘若 + giả thiết，（就）+ kết quả","倘若 A，必须 B，否则 C"],ex:[["倘若你还想回来，必须战胜大象，否则，你就永远留在动物世界吧。","Nếu ngươi muốn quay về thì phải thắng voi, bằng không cứ ở lại thế giới động vật mãi đi.",1],["倘若你想通过考试，必须每天坚持复习，否则，很难拿到好成绩。","Nếu muốn qua kỳ thi, phải ôn tập đều mỗi ngày, bằng không khó đạt điểm cao."],["倘若您能帮我这个忙，我将无比感激。","Nếu anh giúp tôi việc này, tôi sẽ vô cùng biết ơn."]],tips:["Đồng nghĩa văn viết: <span class='zh'>假如 · 假若 · 如若</span>.","<span class='zh'>否则</span> = <span class='zh'>要不然 / 不然</span> (khẩu ngữ)."]},{id:"g2",grp:1,word:"",zh:"乘机",py:"chéngjī",tag:"Chú thích 1 · phó từ",mean:"Phó từ, nghĩa là <span class='zh'>利用机会</span> — <b>nhân cơ hội, thừa dịp</b>.",forms:["（tình huống tạo ra cơ hội），S + 乘机 + V"],ex:[["这次出差去北京，我们可以乘机游览一下长城。","Chuyến công tác Bắc Kinh lần này, ta có thể nhân tiện đi thăm Vạn Lý Trường Thành."],["这天，大象正在吃树叶，老鼠乘机跑进大象的鼻子中，准备实施它的计划。","Hôm ấy voi đang ăn lá, chuột nhân cơ hội chạy vào vòi voi.",1],["因为一些法律法规还不完善，让犯罪分子乘机钻了空子。","Vì một số luật lệ chưa hoàn thiện, tội phạm nhân cơ hội lách luật."]],tips:["Khẩu ngữ: <span class='zh'>趁机</span>. Trước <span class='zh'>乘机</span> phải có <b>tình huống tạo cơ hội</b>.","Trung tính hoặc nghĩa xấu (lợi dụng): <span class='zh'>乘机捣乱 · 乘机偷东西</span>.","Phân biệt: <span class='zh'>乘机</span> (phó từ) ≠ <span class='zh'>乘飞机</span> (đi máy bay)."],practice:{q:"用“乘机”改写句子",items:[["当人抵抗力下降的时候，病毒就会利用这一机会进入人的身体。","当人抵抗力下降的时候，病毒就会乘机进入人的身体。"],["节日里，老人们一边品尝美酒，一边唱歌跳舞，青年男女则利用这一机会谈情说爱，寻找自己的伴侣。","节日里，老人们一边品尝美酒，一边唱歌跳舞，青年男女则乘机谈情说爱，寻找自己的伴侣。"],["对方守门员救球脱手，我们利用这个机会攻入一球。","对方守门员救球脱手，我们乘机攻入一球。"]]}},{id:"g3",grp:1,word:"不料",zh:"不料",py:"búliào",tag:"Chú thích 2 · liên từ",mean:"Liên từ, nghĩa là <span class='zh'>没想到</span>. Vế trước nêu <b>tình hình / dự định ban đầu</b>, vế sau dùng <span class='zh'>不料</span> dẫn ra <b>điều không ngờ</b>. Hay đi với <span class='zh'>却、竟、竟然、倒、还</span>.",forms:["Dự định / tình hình，不料 + (S) + 却 / 竟然 + V"],ex:[["我只想和她开个玩笑，不料她却生气了。","Tôi chỉ định đùa cô ấy, không ngờ cô ấy lại giận."],["我们做好了一切准备，下个星期就去旅行，不料他竟病倒了。","Chúng tôi chuẩn bị xong hết, tuần sau đi du lịch, không ngờ anh ấy lại ngã bệnh."],["老鼠乘机跑进大象的鼻子中，准备实施它的计划。不料，刚进去，大象痒得难受，猛烈地打起了喷嚏。","…Không ngờ vừa vào, voi ngứa quá hắt hơi một cái thật mạnh.",1]],tips:["<span class='zh'>不料</span> đứng <b>đầu vế sau</b>, không đứng đầu câu đơn.","Đồng nghĩa: <span class='zh'>没想到 · 谁知 · 哪知</span>.","Kết quả thường <b>trái mong đợi</b> (tiêu cực hoặc bất ngờ)."],practice:{q:"完成句子",type:"complete",items:[["早上天气还是好好的，不料________。","早上天气还是好好的，不料中午竟然下起了大雨。"],["考试前我准备得特别充分，不料题目太多，________。","考试前我准备得特别充分，不料题目太多，我还是没做完。"],["我想在这个公司好好干，不料，刚来一个月，________。","我想在这个公司好好干，不料，刚来一个月，公司就倒闭了。"]]}},{id:"g4",grp:2,word:"未免",zh:"未免",py:"wèimiǎn",tag:"Chú thích 3 · phó từ",mean:"Phó từ, biểu thị <b>không tán thành</b>, đánh giá nhẹ nhàng “chỉ có thể nói là… (hơi quá)”. Thường bổ nghĩa cho <b>tính từ mang nghĩa tiêu cực</b>; ít đứng trước động từ.",forms:["未免 + 太 / 过于 / 有些 / 不大 + Adj","未免 + Adj + 了一点儿 / 一些"],ex:[["他这个人也未免太不会关心人了。","Người này cũng có phần quá vô tâm."],["看到大象悲惨的样子，老鼠不忍下手，它觉得那样未免太过残忍。","…nó thấy làm thế có phần quá tàn nhẫn.",1],["举办展览的想法是不错，只是现在能够展出的展品未免少了一些。","Ý tưởng tổ chức triển lãm thì hay, chỉ là số hiện vật trưng bày được hơi ít."]],tips:["Giọng <b>uyển chuyển</b> hơn <span class='zh'>太……了</span> — phê bình nhẹ nhàng.","So sánh <span class='zh'>难免</span> = khó tránh khỏi (bài 2 ngữ pháp 不由得)."],practice:{q:"用“未免”改写句子",items:[["这么小的屋子一个月房租4500，价格太贵了吧？","这么小的屋子一个月房租4500，价格未免太贵了。"],["这篇文章有些长，好好修改一下还是不错的。","这篇文章未免有些长，好好修改一下还是不错的。"],["现在的规定有点儿太复杂了吧，真应该好好简练一番。","现在的规定未免太复杂了，真应该好好简练一番。"]]}},{id:"g5",grp:2,word:"",zh:"只要……就……，不就……了吗？",py:"",tag:"Mẫu suy luận (Bài tập 4②)",mean:"Nêu điều kiện đủ (<span class='zh'>只要……就……</span>), rồi kết luận bằng <b>câu hỏi tu từ</b> <span class='zh'>不就……了吗？</span> = chẳng phải… rồi sao — giọng chắc chắn, dễ dàng.",forms:["只要 A，B 就……，S 不就 + V + 了吗？"],ex:[["只要我在它身体的重要部位咬几个洞，它就没命了，我不就战胜大象了吗？","Chỉ cần cắn vài lỗ vào chỗ hiểm là nó toi mạng, chẳng phải mình đã thắng voi rồi sao?",1],["只要我把钱包捡起来，钱包就是我的了，我不就发财了吗？","Chỉ cần nhặt ví lên là ví thành của mình, chẳng phải mình phát tài rồi sao?"]],tips:["Thường theo sau là <span class='zh'>然而 / 可是</span> để lật ngược suy nghĩ — như bài khóa."]}],BX:{grp:2,word:"恰巧",cols:["恰巧","正好"],pair:"恰巧 — 正好",same:["Đều có thể biểu thị <b>thời gian vừa đúng lúc</b>, điều kiện tình cờ trùng khớp.","我离开北京那一天，恰巧 / 正好是他到达北京的日子。"],diff:[["<b>Phó từ</b>, thiên về thời gian, điều kiện; nhấn <b>sự ngẫu nhiên, tình cờ</b> (thay được bằng 正好).","我赶到上海找他时，他却恰巧出差了。 / 我正愁没人帮忙，恰巧老王来了。","<b>Phó từ</b>, ngoài thời gian, điều kiện còn chỉ sự vừa khít về <b>không gian, thể tích, số lượng</b>; nhấn <b>vừa vặn, thích hợp</b>.<div class='zh' style='margin-top:4px'>交了房租剩下的钱正好留着交学费。 / 两个人一间，我们十个人，正好是五个房间。</div>"],["<b>Chỉ</b> là phó từ, không đứng một mình, không làm vị ngữ.","✗我去的时间恰巧。","Còn là <b>tính từ</b>: đứng một mình, làm vị ngữ, bổ ngữ.<div class='zh' style='margin-top:4px'>你来得正好，我们刚开始吃饭。 / A：这件衣服你穿怎么样？B：正好。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["这块布正好够做一件衬衫，一点儿都不浪费。",0,"Vừa đủ về số lượng → 正好 đúng."],["这场雨下得恰巧，及时缓解了土地的干旱问题。",1,"Làm bổ ngữ sau <span class='zh'>得</span> → phải dùng tính từ <span class='zh'>正好</span>."],["朋友来北京看我，可我恰巧没空儿，真遗憾。",0,"Tình cờ về thời gian → 恰巧 đúng."],["A：你觉得水温怎么样，合适吗？B：正好，不冷也不热。",0,"正好 đứng một mình (tính từ) — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>毫</u>无","毫不 · 毫厘 · 丝毫 · 分毫"],items:[["发<u>觉</u>","觉","感觉 · 觉醒 · 觉悟 · 觉察"],["猛<u>烈</u>","烈","热烈 · 激烈 · 剧烈 · 强烈"],["<u>眼</u>光","眼","眼镜 · 眼睛 · 眼神 · 眼色"],["夕<u>阳</u>","阳","太阳 · 阳光 · 阳台 · 阳历"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["我准备去图书馆好好复习功课，________。","不料","我准备去图书馆好好复习功课，不料图书馆今天竟然关门了。"],["普普通通一顿饭花了这么多钱，________。","未免","普普通通一顿饭花了这么多钱，未免太浪费了。"],["没吃早饭，正饿得不得了时，________。","恰巧","没吃早饭，正饿得不得了时，恰巧同事给我带来了两个包子。"],["________，我将无比感激。","倘若","倘若您能帮我解决这个难题，我将无比感激。"],["妈妈不在家，孩子________。","乘机","妈妈不在家，孩子乘机打了一下午游戏。"],["经过几十年的改革开放，中国经济________。","举世瞩目","经过几十年的改革开放，中国经济取得了举世瞩目的成就。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["对抗","摆脱","留神","愤怒","愚蠢"],text:"《猫和老鼠》是很多小朋友都喜欢看的动画片，它讲了一只聪明的老鼠跟猫{对抗}的故事。每次小老鼠都能{摆脱}猫的追赶，一不{留神}，猫还会上老鼠的当，被老鼠笑话一番，猫虽然很{愤怒}，却也没有办法。小老鼠用自己的智慧战胜了{愚蠢}的猫。"},{bank:["倘若","毫无","强迫","厌恶","耗费"],text:"我们的态度会决定做事情的心情。{倘若}你对一件事{毫无}兴趣，那么有人{强迫}你做时，你会觉得痛苦和{厌恶}。而如果是你感兴趣的事情，无论{耗费}多少时间和精力，心里也都是快乐的。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"动物世界中，大象是最强大的，<u>倘若</u>你还想回来，<u>必须</u>战胜大象，<u>否则</u>，你就永远留在动物世界吧。",task:"没有人轻轻松松就能取得成功，倘若______，必须______，否则，______。",model:"没有人轻轻松松就能取得成功，倘若你想实现自己的梦想，必须付出比别人更多的努力，否则，梦想永远只是梦想。"},{src:"它想，大象现在毫无抵抗能力，<u>只要</u>我在它身体的重要部位咬几个洞，它<u>就</u>没命了，我<u>不就</u>战胜大象了<u>吗</u>？<u>然而</u>，看到大象悲惨的样子，老鼠不忍下手，它觉得那样<u>未免</u>太过残忍，良心告诉它，应该救大象。",task:"地上有个很大的钱包，周围也没有别人，只要______，钱包就______，我不就______了吗？然而，想到丢钱包的人着急的样子，我觉得那样做未免太______了，良心告诉我，应该把它还给它的主人。",model:"地上有个很大的钱包，周围也没有别人，只要我把它捡起来放进口袋，钱包就是我的了，我不就发了一笔小财了吗？然而，想到丢钱包的人着急的样子，我觉得那样做未免太自私了，良心告诉我，应该把它还给它的主人。"}]},EX5:{q:"根据提示，简述课文主要内容",vn:"Trả lời từng câu theo gợi ý — ghép lại chính là dàn ý cho bài 缩写 ở mục 7.",rows:[["老鼠想当普通的动物，山神对老鼠提出了什么条件？","①倘若……战胜大象 ②否则……","山神说，倘若老鼠还想回来，必须战胜动物世界中最强大的大象，否则就永远留在动物世界。"],["老鼠的第一次尝试成功了吗？它是怎么做的？","进入大象鼻子、打喷嚏、像子弹一样被射出来","没有成功。老鼠乘大象吃树叶时跑进它的鼻子，不料大象痒得猛烈地打了个喷嚏，老鼠像子弹一样被射了出来。"],["大象的反应是什么？","蔑视、愤怒、愚蠢、可恶、踩扁","大象用蔑视的眼光盯着老鼠，愤怒地骂它是愚蠢可恶的家伙，说下次再这样就踩扁它。"],["当大象落入打猎者的巨网时，老鼠是怎么做的？","①大象（挣扎、窜、摆脱、悲伤、害怕）②老鼠想（毫无抵抗力、咬几个洞、战胜、不忍下手、太过残忍）③老鼠（锋利、咬断）","大象落入巨网，拼命挣扎也摆脱不了，又悲伤又害怕。老鼠想，大象毫无抵抗力，咬几个洞就能战胜它；可它不忍下手，觉得太过残忍，于是用锋利的牙齿咬断了网和绳子，救了大象。"],["山神为什么说老鼠胜利了？","化敌为友、举世瞩目","因为老鼠化敌为友，创造了举世瞩目的成就，这是最完美的胜利。"]]},DP:[{title:"词汇（1）：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ (语素) giúp đoán nghĩa từ mới — kỹ năng quan trọng cho phần đọc HSK6.",items:[["俯视","fǔshì","nhìn xuống","俯：低头 ＋ 视：看","站在山顶俯视整个城市。"],["偿还","chánghuán","hoàn trả","偿：抵偿 ＋ 还：归还","他终于偿还了所有的债务。"],["敌视","díshì","thù địch","敌：敌人 ＋ 视：看待","两国曾经互相敌视。"],["孤立","gūlì","cô lập","孤：单独 ＋ 立：站","他在班里被孤立了。"],["过奖","guòjiǎng","quá khen","过：过分 ＋ 奖：勉励","您过奖了，我做得还很不够。"],["捍卫","hànwèi","bảo vệ (quyền lợi)","捍：保卫 ＋ 卫：保卫","我们要捍卫自己的权利。"],["草案","cǎo'àn","bản dự thảo","草：初步的 ＋ 案：记录计划、建议等的文件","这份法律草案正在征求意见。"],["畅通","chàngtōng","thông suốt","畅：没有阻碍 ＋ 通：通行","节日期间道路畅通。"],["巩固","gǒnggù","củng cố","巩：结实 ＋ 固：结实","课后要及时巩固学过的知识。"],["雇佣","gùyōng","thuê mướn","雇：出钱让别人给自己做事 ＋ 佣：雇佣","这家公司雇佣了很多临时工。"],["解雇","jiěgù","sa thải","解：废除 ＋ 雇：出钱让别人给自己做事","他因为经常迟到被解雇了。"],["表态","biǎotài","bày tỏ thái độ","表：表示 ＋ 态：态度","领导还没有表态。"]]},{title:"词汇（2）：熟悉下列量词",items:[["磅","bàng","pao (≈ 454 g)","一磅黄油 / 一磅蛋糕","请给我一磅黄油。"],["筐","kuāng","sọt, giỏ","一筐蔬菜 / 一筐水果","他从地里摘了一筐蔬菜。"],["艘","sōu","chiếc (tàu thuyền)","一艘轮船 / 一艘军舰","港口停着一艘大轮船。"],["丸","wán","viên (thuốc)","一丸药","每天饭后吃一丸药。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"在热带、亚热带森林中，许多大树上都缠绕着一根根又细又长的“长鞭”，这就是白藤。一般的白藤长二三百米，最长的可达400多米，是植物中的长度冠军。白藤浑身长满小钩刺，当细长的白藤随风摇摆的时候，一旦碰上大树，倒生的小钩刺就会紧紧钩住大树不放。",o:["白藤生长在温带地区","白藤的长度参差不齐","有的树上会生长长鞭","大树想摆脱白藤的缠绕"],a:1,why:"“一般……二三百米，最长的可达400多米” → dài ngắn khác nhau. (A sai: nhiệt đới; C sai: “长鞭” chính là dây leo, không phải mọc ra từ cây.)"},{n:2,say:"你很可能从未注意过自己抱怨的习惯，但在别人的眼中，你已经是一个喜欢抱怨的人了。没有人愿意总是听你抱怨，因为抱怨会传播负面情绪，而负面情绪会使人们长时间地心情不好。",o:["经常抱怨有损健康","抱怨是一种心理疾病","爱抱怨的人不受欢迎","喜欢抱怨的人很愚蠢"],a:2,why:"“没有人愿意总是听你抱怨” → người hay than phiền không được ưa."},{n:3,say:"很多人选择假期开车出行，不是不想坐飞机，而是想带着自己的宠物，尽管主人会耗费更多的精力和体力。因此我们在高速公路上常会看到这样一幕：奔跑着的汽车的车窗中，一闪而过的是一张幸福的狗脸。",o:["带着宠物去旅行的人不少","不喜欢坐飞机的人才开车","眼下假期开车远行很时髦","假期有人会带着狗去打猎"],a:0,why:"“很多人……想带着自己的宠物”."},{n:4,say:"读书最快乐的，并不一定是你学到了什么。知识不会给你带来最快乐的东西，而是你本来就有的一些想法和感受，在书中被唤醒了，“啊，我也是这么想的！”这时候你会很快乐。",o:["只要读书就会感到快乐","读书就是为了得到知识","要趁情绪好的时候读书","心灵与书相通就会快乐"],a:3,why:"Suy nghĩ của mình “在书中被唤醒了” → tâm hồn đồng điệu với sách."},{n:5,say:"农夫发现一条快冻死的蛇，觉得它很可怜，就把它放在怀里，用体温温暖着它。蛇暖和过来以后，咬了农夫一口，农夫中毒而死。农夫死前十分悔恨，说：“我可怜这家伙，得到这样的结果是应该的。”这故事说明，恶人的本性是不会改变的。",o:["恶人就是恶人","那条蛇中毒而死","蛇的牙齿很锋利","做事之前应认真思考"],a:0,why:"“恶人的本性是不会改变的”. (B: người nông dân chết, không phải rắn.)"}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：大家好，今天我们请到了儿童文学作家赵老师，跟大家谈谈寓言。\n男：我先从“寓言”这两个字谈起。“寓”的意思是“寄托”，“寓言”就是把作者的思想藏在一个故事里。\n女：那“寓言”故事可不能听完就完了，必须弄明白其中的道理。\n男：对。寓言很有特点。有位作家做过这样的描述：“寓言是一个怪物，当它朝你走过来的时候，它是一个故事，生动活泼；当它转身要走开的时候，却突然变成了一个哲理，严肃认真。”“寓言是一把钥匙，这把钥匙可以打开心灵之门，启发智慧，让思想活跃。”\n女：嗯，这段话非常生动。赵老师，世界最早的寓言集是什么时候出现的？\n男：大约成书在公元前6世纪，就是《伊索寓言》。\n女：中国的寓言创作情况又是如何？\n男：中国寓言创作的历史也很长，春秋战国时期，也就是大约2000多年前，寓言就已经广泛流传。当时中国思想界很活跃，一些政治家、思想家提出各自不同的主张，并且争论不休。他们喜欢借寓言表明自己的观点，因为在简单的故事中包含着大道理。\n女：我发现那个时候流传下来的很多寓言我们都很熟悉，比如“揠苗助长”、“自相矛盾”。\n男：你说的不错。\n女：汉语很多成语也是寓言，我们上面说的“揠苗助长”、“自相矛盾”就是。那么，成语和寓言是什么关系呀？\n男：成语是人们长期以来惯用的、简洁深刻的定型词组或短句，大多数是四个字。一般成语都有来源，有些成语从字面上就能理解，比如“后来居上”，这个成语最开始用在《史记》当中，意思是“后来者超过前辈”。而有些成语必须知道来源或典故才能懂得意思，如“朝三暮四”、“画蛇添足”。\n女：所以很多成语故事本身就是一个寓言故事，但不是所有的寓言故事都会形成成语。\n男：对。",qs:[{n:6,q:"男的是干什么的？",o:["老师","作家","思想家","语言学家"],a:1,why:"“儿童文学作家赵老师”."},{n:7,q:"那位作家对寓言的描述表达的是什么意思？",o:["寓言故事都有些奇怪","寓言作家都是聪明人","寓言故事常包含哲理","思想活跃才能写寓言"],a:2,why:"“……却突然变成了一个哲理”."},{n:8,q:"以下哪一项符合2000多年前中国的情况？",o:["各种思想非常活跃","对寓言有很多争论","当时的人都喜欢寓言","创作了《伊索寓言》"],a:0,why:"“当时中国思想界很活跃”. (B: tranh luận về chủ trương chính trị, không phải về ngụ ngôn.)"},{n:9,q:"以下哪一项是成语的特点？",o:["都是四个字组成的","包含着深刻的道理","从字面就知道意思","是定型的词组或短句"],a:3,why:"“简洁深刻的定型词组或短句”. (A sai: “大多数”是四个字.)"},{n:10,q:"成语和寓言是什么关系？",o:["二者没有任何关系","成语都来源于寓言故事","寓言故事都可以形成成语","有的成语故事就是寓言故事"],a:3,why:"“很多成语故事本身就是一个寓言故事，但不是所有的寓言故事都会形成成语”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"大象因记忆力强而著称，但一份新的研究报告显示，大象还有预测天气的本领。大象的耳朵很大，对声音极其敏感，它们能听到远处很小的雷声和较大的雨声，由此可预测雨水何时会到来。\n科学家们是在研究纳米比亚象群突然搬迁这一现象后得出上述结论的。研究小组记录了9头来自不同象群的大象的活动情况，经过历时七年的观察，研究人员发现，这些大象在纳米比亚的雨季经常改变行进路线，它们能对200多公里以外的天气“有感觉”，并凭这种感觉预测暴风雨，进而向有暴风雨的方向前行。大象需要雨，经过漫长的旱季，大象一旦知道哪里有雨，就会朝下雨的方向行进，这样它们可以更快地获得水源。\n研究者认为，这项研究除了能够了解大象追逐暴风雨行进的状况、原因，更积极的意义在于，它有助于动物保护者预测大象的活动，从而使它们免遭偷猎者毒手。",qs:[{n:11,q:"大象广为称道的特点是什么？",o:["耳朵特别大","对气候敏感","记忆力特别好","能对抗暴风雨"],a:2,why:"“大象因记忆力强而著称”."},{n:12,q:"经过跟踪，研究者发现了什么？",o:["大象总是追寻暴风雨","大象凭视觉选择路线","纳米比亚象群经常搬家","大象每天能走200公里"],a:0,why:"“预测暴风雨，进而向有暴风雨的方向前行”. (B: dựa vào thính giác.)"},{n:13,q:"这一研究成果的积极意义是什么？",o:["有利于保护大象","有助于保护水源","使天气预报更为准确","可更好地预防自然灾害"],a:0,why:"“使它们免遭偷猎者毒手”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"有一种动物叫麋鹿。麋鹿的尾巴有些像驴尾，蹄子有些像牛蹄，面部有些像马面，角有些像鹿角，但整体看上去却似鹿非鹿，似马非马，似牛非牛，似驴非驴，因此又叫“四不像”。麋鹿性情温和，十分可爱。\n有个人出去打猎，得到一头小麋鹿，决定把它带回家养起来。刚进家门，家里的几只狗就流着口水，摇着尾巴聚拢过来，主人气愤地吓跑了狗。此后主人每天抱着小麋鹿与狗接近，希望狗慢慢习惯，不再伤害小麋鹿。后来又逐渐让狗和小麋鹿一起玩耍，一段时间以后，狗能按主人的意愿做了。\n小麋鹿稍微长大后，以为狗就是自己的好伙伴，不但对狗毫无防备之心，还整日和狗翻滚打闹，亲热极了。狗害怕主人，也就天天老老实实地和麋鹿玩耍，但还是会时常忍不住流出口水。\n三年过去了，一次麋鹿独自出门，看见外面有很多不相识的狗，就跑过去想和它们一起玩儿。结果狗见了麋鹿，一起冲上去把麋鹿吃了。可怜的麋鹿到死也不明白这是怎么回事。\n这则寓言告诉我们，认敌为友，必然会招致灭亡。",qs:[{n:14,q:"麋鹿有什么特点？",o:["十分胆小","样子最像鹿","是马的一种","性情温和顺从"],a:3,why:"“麋鹿性情温和”. (B sai: “似鹿非鹿”.)"},{n:15,q:"主人把麋鹿带回家以后，家里发生了什么事？",o:["狗被麋鹿吓跑了","主人天天抱着狗","主人看见狗就生气","主人让狗和麋鹿玩儿"],a:3,why:"“逐渐让狗和小麋鹿一起玩耍”."},{n:16,q:"三年后发生了什么事？",o:["麋鹿和狗成了真正的朋友","家里的狗终于把麋鹿吃了","麋鹿独自出门遇到了危险","外面的狗也爱和麋鹿玩耍"],a:2,why:"Ra ngoài một mình gặp đàn chó lạ và bị ăn thịt. (B sai: chó <i>bên ngoài</i>.)"},{n:17,q:"这则寓言告诉我们什么？",o:["主人救了麋鹿","不能敌我不分","狗活得很委屈","狗都害怕主人"],a:1,why:"“认敌为友，必然会招致灭亡” = không được lẫn lộn bạn thù — đối lập với <span class='zh'>化敌为友</span> trong bài khóa!"}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["“中国设计红星奖”让世界看到了中国设计的力量。","作为一家商业公司，吉尼斯世界纪录有自己的盈利模式。","又粗心了！她特别后悔极了，不知道如何才能把失去的分数找回来。","欧洲大部分火车站都是开放式的，乘客进出火车站跟进出公园一样方便。"],a:2,why:"<b>Thừa phó từ mức độ</b>: <span class='zh'>特别</span> và <span class='zh'>极了</span> không dùng cùng lúc → <span class='zh'>她后悔极了 / 她特别后悔</span>."},{n:19,o:["现在工作不忙，乘机去趟三亚，倒是个不错的选择。","在电影《白鹿原》中，老腔艺术家们也有过一段完整的表演。","曾因技术原因被延期上映的电影《东北偏北》终于确定要正式上映了。","尽管陈燕钢琴调律技术一流的，但当时人们还是无法接受盲人调琴师。"],a:3,why:"<b>Thiếu thành phần</b>: <span class='zh'>技术（是）一流的</span> hoặc bỏ <span class='zh'>的</span>: <span class='zh'>技术一流</span>."},{n:20,o:["圣诞节最热闹的地方还是欧美地区。","父亲和母亲是个裁缝，为我做了好多漂亮的衣服。","这次表演的成功给了她很大的鼓舞，演出后她在台上激动得热泪盈眶。","自铁路诞生以来，火车就作为重要的旅行工具承载着无数人的旅行梦想。"],a:1,why:"<b>Số lượng không khớp</b>: hai người không thể <span class='zh'>是个裁缝</span> → <span class='zh'>父亲和母亲都是裁缝</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"傍晚，金色染红了远处的山和一片片田野，夕阳下的大地显得___美丽，它们在___地等待着暮色的降临，等待那一___明亮的弯月。",o:["恰巧　文静　块","的确　平静　个","过分　冷静　条","格外　安静　轮"],a:3,why:"<span class='zh'>格外美丽</span>; <span class='zh'>安静地等待</span>; lượng từ của trăng: <span class='zh'>一轮明月</span>."},{n:22,text:"人生在世有很多的时候需要选择，但是选择是一个___的过程。过于犹豫，机会可能会从面前跑掉，___草率，可能会给今后的生活和工作带来不小的麻烦，所以选择既要___时机，又要谨慎___。",o:["难过　未免　掌握　小心","艰难　过分　把握　仔细","为难　盲目　思考　认真","艰巨　毕竟　利用　留神"],a:1,why:"<span class='zh'>艰难的过程</span>; <span class='zh'>过于……，过分……</span> (song song); <span class='zh'>把握时机</span>; <span class='zh'>谨慎仔细</span>."},{n:23,text:"我从事的工作会接触到很多处于困扰、悲伤、痛苦之中的人。___困境，有的人只是悲叹自己的___，有的人却能重新振作起来，___着找到生活的方向。只有那些能够比较快地摆脱困境、得到新生的人才___是生活的强者。",o:["面对　不幸　尝试　称得上","临到　命运　强迫　提得到","陷身　遭遇　挣扎　够得上","身临　倒霉　试验　配得上"],a:0,why:"<span class='zh'>面对困境</span>; <span class='zh'>悲叹自己的不幸</span>; <span class='zh'>尝试着</span>; <span class='zh'>称得上</span> (≈ 算得上, bài 3)."}]},read3:{ins:"第24–28题：选句填空。",text:"寓言是文学作品的一种体裁。这类作品通常为用散文体写的简短的故事，(24)，大多具有讽刺、劝喻或教诲的寓意，因而称为寓言。借喻是寓言的重要特点，(25)，但寓言的作者有时会在故事的开头或结尾点出主题。(26)，人物少，并大量运用拟人化手法，动物、植物都可以成为寓言的主人公。\n寓言最初是由人民群众口头创作和流传的动物故事演变而来。梵文故事集《五卷书》就记录了大量的古代寓言。(27)，是希腊寓言作品的汇集，它对欧洲的寓言创作产生了深刻的影响。以后著名的作家相继写作寓言，如古罗马作家费德鲁斯、法国诗人拉封丹、(28)。近世在世界各国涌现了很多寓言作家，创作的题材也日趋广泛。",opts:["它向读者暗示寓言所蕴含而未直接表露的思想","《伊索寓言》300余篇","俄国作家克雷洛夫等","寓言的情节通常高度集中","有时也采用诗体形式"],ans:{24:4,25:0,26:3,27:1,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"我们知道，人类的语言符号和其他动物的交际方式有着本质的区别，比如叫喊、舞蹈、脚踢、击打等都是动物的交际方式，但是动物上蹿下跳呢？是交际还是情绪的表达？\n人类的语言结构具有二层性特点，即人类语言有语音系统和语法系统。这两个层面都以数量有限的最小单位，按照一定的规则组合起来，生成数量无限多的大单元。相反，动物的“语言”不能分解成单位，也谈不上结构，结构的二层性就更无从谈起了。\n人类语言具有能产的特点，人们能够运用有限的语言手段通过替换和组合创造出新的话语来。人们可以理解、说出从未说过或听到过的句子。动物的“语言”只能表达有限的信息，它能传递的信息是固定的，是受刺激限定的。\n人类语言是不受时地环境限制的，动物则不然。动物的交际是由当时当地的刺激引起的，是对具体情景的感性反应，只能传递某种信息，既不能回顾过去发生过的事情，也不能设想未来。蜜蜂发现蜜源，回来后会立即做出必要的舞蹈动作，可它从不为昨天的发觉而舞，也不猜测未来的发现。只有人类能用语言说古道今，表达深刻的哲理。",qs:[{n:29,q:"人类语言：",o:["有极其强大的生成能力","可以不顾规则任意创新","有语言和文字两个系统","只传递当时当地的信息"],a:0,why:"“生成数量无限多的大单元” / “能产”. (C sai: hai hệ thống là ngữ âm và ngữ pháp.)"},{n:30,q:"其他动物的交际方式：",o:["表达的信息比人类丰富","以上蹿下跳来表达愿望","是受刺激后的感性反应","至今也没有被研究清楚"],a:2,why:"“是对具体情景的感性反应”."},{n:31,q:"第2段画线词语“无从谈起”的意思最可能是：",o:["不必再说了","不值得一提","根本没这回事","没有办法谈论"],a:2,why:"Động vật không có cấu trúc → “tính hai tầng” <b>hoàn toàn không tồn tại</b> (theo đáp án sách)."},{n:32,q:"人类语言符号和其他动物的交际方式：",o:["大同小异","都在进化中","各有各的优势","有实质性的区别"],a:3,why:"“有着本质的区别” = khác biệt về bản chất."}]},{ins:"第33–36题：请选出正确答案。",text:"黄黄是一只四岁半的大黄猫。\n四年前的深秋，一个寒冷的周末，我路过一片废弃的工地，听到大风中传来小猫无力的叫声，格外可怜。我想给它买些肉肠之类的食物，结果周围一家商店都没有，我咬咬牙要求自己狠下心来开车离开，以实现对家里人立下的不再带宠物回家的承诺，可是车没走出多远，我还是停了下来，最终走向那只瘦弱的小猫，并把它带回了家。\n黄黄的到来，家里人都持反对意见，理由是这猫长得太难看了，毛色不纯不说，还又脏又瘦，也不是什么名贵的品种。只有儿子，欢天喜地，把黄黄看成了自己的小弟弟。\n黄黄出身贫苦，从不挑食，有时我们买些很贵的猫粮和罐头，它自然吃得满足，倘若赶上便宜的猫粮，它也从不抗议，用鼻子闻一闻，照吃不误，碰上最爱吃的鱼、虾，黄黄几口吃光，没饱也绝不再要，什么时候都不失绅士风度。\n和黄黄相处时间久了，才知道动物也有感情，只是它不会说话。那次过节，家里人去外地玩儿了几天，喂猫的事就请朋友帮忙。我们回来的时候，看见黄黄瞪大眼睛盯着我们看，我叫它过来，不料，它扭过脸去，满脸的不高兴。那是我第一次看见猫有表情，而且是真正地生气，黄黄肯定以为我们不要它了。朋友告诉我，我们走的这些天，只要她来喂食，黄黄就会带着她先跑进卧室，然后跳上床，冲着她喵喵叫，似乎在问，家里人都去哪儿了？\n这只懂事、规矩，又有情义的猫，就这样一天天赢得了全家人的喜爱。",qs:[{n:33,q:"四年前的一个周末，发生了什么事？",o:["我保证不再带宠物回家","我在废工地发现了黄黄","我去买东西结果迷了路","我开的车坏在了半路上"],a:1,why:"“我路过一片废弃的工地，听到……小猫无力的叫声”. (A: lời hứa có từ trước.)"},{n:34,q:"第3段画线词语“欢天喜地”的意思是：",o:["非常快乐","喜欢动物","热爱生活","极其紧张"],a:0,why:"欢天喜地 = vui mừng hớn hở (Khởi động 2 bài 3)."},{n:35,q:"黄黄吃东西：",o:["先闻，味好再吃","不好吃的就不吃","天天都要吃鱼虾","给什么就吃什么"],a:3,why:"“从不挑食……照吃不误”."},{n:36,q:"为什么说动物也有感情？",o:["猫惦念我们全家人","猫生气了就不理人","猫不怕我们不要它","猫对我的朋友更好"],a:0,why:"Mèo dẫn bạn vào phòng ngủ, kêu như hỏi “mọi người đâu rồi” → nhớ cả nhà (<span class='zh'>惦念</span>)."}]}]},W:{task:"这篇小故事告诉我们一个道理：化敌为友，就是最大的胜利。请参考练习5，把课文缩写成300字左右的短文。缩写时注意写清楚故事发生的起因、经过、结果，最后要点明这个故事告诉我们的道理。",target:300,steps:[["Khởi nhân","Vì sao chuột muốn thắng voi? (chán làm thú cưng, điều kiện của Sơn thần) — 1–2 câu."],["Diễn biến 1","Lần thử thất bại: chui vào vòi → hắt hơi → bị khinh miệt. Rút gọn lời voi thành một câu gián tiếp."],["Diễn biến 2","Voi sa lưới; chuột có cơ hội nhưng không nỡ; cắn đứt lưới cứu voi. Đây là phần quan trọng nhất."],["Kết quả","Thành bạn; Sơn thần nói đây là chiến thắng hoàn hảo."],["Điểm đề","Câu cuối nêu bài học: <span class='zh'>化敌为友，就是最大的胜利。</span>"]],model:"完美的胜利\n老鼠是山神的宠物，它厌倦了宠物的生活，想到动物世界证明自己的实力。山神说，倘若它还想回来，必须战胜最强大的大象，否则就永远留在动物世界。老鼠答应了。\n来到动物界，老鼠才发觉自己太弱小了，根本无法和大象对抗。于是，它乘大象吃树叶时跑进大象的鼻子，想强迫大象认输。不料大象痒得打了个喷嚏，老鼠像子弹一样被射了出来。大象蔑视地骂它愚蠢，从此老鼠再也不敢挑战大象了。\n一天傍晚，大象落入了打猎者的巨网，怎么挣扎也摆脱不了。老鼠看到后想，现在只要咬它几口，就能战胜它了。可是看到大象悲惨的样子，老鼠觉得那样太残忍了，就用牙齿咬断了网和绳子，救出了大象。从此，它们成了好朋友。\n后来山神找到老鼠，老鼠说自己无法战胜大象。山神却说，化敌为友，就是最完美的胜利。",check:["Có tiêu đề","Có khởi nhân (điều kiện của Sơn thần)","Có hai lần “đối đầu”: thất bại → cứu voi","Có kết quả và câu nêu bài học","Lời thoại chuyển sang gián tiếp","Dùng ít nhất 6 từ mới","Khoảng 300 chữ (±30)"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"1910年，华罗庚出生在江苏省金坛市。他小时候，家中日子过得清贫，父亲在镇上开了个小店，一家人过着半饥半饱的生活。华罗庚上初中时，对数学产生了浓厚的兴趣，他的老师王维克尤其欣赏这个聪明机灵的少年，常常单独辅导他，给他出一些难题做，这使少年华罗庚受益匪浅。\n华罗庚念完初中，家里没钱再供他上学，他只好到父亲的小店帮忙。可这位喜爱数学的年轻人，虽然人守在柜台前，心里想着的却还是数学。王维克老师借给他三本数学书：一本大代数，一本解析几何，一本微积分。华罗庚跟着这几位不会说话的老师步入了高等数学的大门。\n华罗庚18岁那年，在王维克老师的帮助下，到金坛中学找了个工作——会计兼管学校事务。他曾回忆当时艰难的生活：“除了学校里繁重的事务外，早晚还要帮助父亲料理小店。每天晚上大约8点钟才能回家。清理好小店的账目之后，才能钻研数学，常常到深夜。”\n不久，华罗庚不幸染病，卧床半年，病慢慢才好，可是他的左脚却弯曲变形，落下了终身残疾。\n华罗庚在贫病之中仍然刻苦自学，不但读了许多书，还勤于独立思考，敢于向权威挑战。19岁那年，他发现一位大学教授的论文写错了，便把自己的看法写成一篇文章，发表在上海的《科学》杂志上。随后，华罗庚又连续发表了几篇数学论文，署名“金坛人”。\n这位数学论坛上的新人引起了著名学府清华大学数学系主任熊庆来教授的注意。当他打听到这个数学奇才原来是个只读过初中的小青年时，深为震惊，便写信邀请华罗庚来清华大学数学系当管理员。\n到清华后，华罗庚进步更快了。他自学了英语、德语。24岁时，已能用英文撰写数学论文。25岁时，他的论文已引起国外数学界的注意。28岁时，他当上了西南联大教授。后来，他又被熊庆来教授推荐到英国剑桥大学去深造。\n华罗庚成功了，国外数学界这样评价他：“华罗庚教授的研究和著作范围之广，使他当之无愧地成为世界上名列前茅的数学家之一。”\n华罗庚一生刻苦钻研，在给人们留下了大量的研究著作的同时，也留下了他自学成才的足迹。",model:"自学成才的华罗庚\n华罗庚1910年出生在江苏金坛，小时候家里很穷。上初中时，他对数学产生了浓厚的兴趣，老师王维克很欣赏他，常常单独辅导他。\n初中毕业后，家里没钱供他上学，他只好到父亲的小店帮忙，但心里想的还是数学。王老师借给他三本数学书，他靠自学走进了高等数学的大门。18岁时，在王老师的帮助下，他到金坛中学当会计。他白天工作，晚上还要帮父亲料理小店，只能在深夜钻研数学。\n不久，华罗庚得了一场大病，左脚落下了终身残疾。可是他仍然刻苦自学，而且勤于思考，敢于向权威挑战。19岁时，他发现一位大学教授的论文有错误，就写文章发表在《科学》杂志上，后来又发表了几篇论文。\n清华大学数学系主任熊庆来教授注意到了他，知道他只读过初中，非常震惊，就请他到清华当管理员。在清华，华罗庚进步更快，自学了英语和德语，24岁就能用英文写论文，28岁当上了西南联大的教授，后来又被推荐到英国剑桥大学深造。\n华罗庚最终成为世界上著名的数学家之一。他一生刻苦钻研，留下了大量著作，也留下了自学成才的足迹。"}},SUM:{words:["厌恶","倘若","发觉","承诺","草率","对抗","尝试","盲目","强迫","实施","不料","蔑视","愤怒","愚蠢","留神","不顾","挣扎","摆脱","恰巧","毫无","抵抗","悲惨","未免","残忍","良心","耗费","举世瞩目"],patterns:[["倘若……，必须……，否则……","倘若你还想回来，必须战胜大象，否则……"],["乘机 + V","老鼠乘机跑进大象的鼻子中。"],["……，不料……（却／竟然）……","不料，刚进去，大象……打起了喷嚏。"],["未免 + 太 / 有些 + Adj","那样未免太过残忍。"],["只要……就……，不就……了吗？","我不就战胜大象了吗？"]],diff:["恰巧：chỉ là phó từ, nhấn tình cờ — 正好：phó từ + tính từ (đứng một mình, làm bổ ngữ: 来得正好), dùng cả cho số lượng, kích thước","厌倦 (chán vì lặp lại) ≠ 厌恶 (ghét) · 发觉 ≈ 发现 · 摆脱 (cố thoát) ≈ 脱离 · 猛烈 (lực) ≠ 强烈 (cảm xúc) · 眼光 ≈ 目光 · 饶恕 > 原谅"],sentences:["动物世界中，大象是最强大的，倘若你还想回来，必须战胜大象，否则，你就永远留在动物世界吧。","看到大象悲惨的样子，老鼠不忍下手，它觉得那样未免太过残忍，良心告诉它，应该救大象。","你化敌为友，创造了举世瞩目的成就，世界上还有比这更完美的胜利吗？"],hw:["Học thuộc 48 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 4, gồm đề 缩写 华罗庚 (400 chữ, 45 phút).","Đọc trước bài 5 《学一门外语需要理由吗？》 — mở đầu Chủ đề 2 不甘平庸."]}});
