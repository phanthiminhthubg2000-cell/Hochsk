<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 9 · 不用手机的日子 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-09",num:9,book:"HSK 标准教程 6（上）",unit:{n:3,zh:"多彩社会",vn:"Xã hội muôn màu"},title:"不用手机的日子",vn:"Một ngày không dùng điện thoại",chars:844,source:"改编自《北京晚报》文章《不用手机的一天》，作者：珠珠侠",goals:["Đọc hiểu bài 844 chữ — câu chuyện hài hước về một người “nô lệ điện thoại” thử sống một ngày không điện thoại.","Dùng được 47 từ mới, đặc biệt nhóm từ <b>cảm giác – tâm trạng</b>: <span class='zh'>受罪 · 麻木 · 空虚 · 踏实 · 兴高采烈 · 安宁</span> và nhóm <b>tin tức</b>: <span class='zh'>侦探 · 案件 · 突破 · 震惊 · 恐怖 · 袭击</span>.","Nắm tính từ trạng thái <span class='zh'>通红 · 雪白</span>, mẫu <span class='zh'>说A就A</span>, <span class='zh'>Adj/V + 得 + 要命</span>, <span class='zh'>难道……吗？何不……？</span>","Phân biệt <span class='zh'>索性 — 干脆</span>; nhận diện câu sai loại <b>kết hợp sai</b> (搭配不当).","Viết bài nghị luận “如何离开手机” ≥300 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (通红/雪白 · 说A就A · 索性—干脆) · Bài khóa đoạn 1–10"],["Buổi 2","Từ vựng nhóm 3 (……得要命) · Đoạn 11–12 · Bài tập · 搭配不当 · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Mở đầu",paras:"Đoạn 1–6",zh:"开会玩手机，老板发火，禁止带手机",vn:"Cả phòng lén xem điện thoại trong cuộc họp — sếp nổi giận cấm mang điện thoại."},{tag:"承",name:"Tự nhận",paras:"Đoạn 7–8",zh:"“我”是手机的奴隶，决定每周关机一天",vn:"“Tôi” thừa nhận mình là nô lệ điện thoại, quyết định mỗi tuần tắt máy một ngày."},{tag:"转",name:"Thử nghiệm",paras:"Đoạn 9–11",zh:"藏手机、去公园跳舞、回家熬粥",vn:"Cất điện thoại thật kỹ, ra công viên nhảy, về nhà nấu cháo — từ bồn chồn đến bình tâm."},{tag:"合",name:"Kết",paras:"Đoạn 12",zh:"没有手机的干扰，生活安宁，回归生活",vn:"Không bị điện thoại quấy nhiễu, cuộc sống yên bình — niềm vui “trở về với cuộc sống”."}],warm1:{q:"你经常玩儿手机吗？对你来说，手机有什么用途？请在下面的选项中划出，如果还有其他用途，请在横线上补充。",vn:"Bạn có hay dùng điện thoại không? Với bạn, điện thoại dùng để làm gì? Đánh dấu các lựa chọn, bổ sung nếu còn công dụng khác.",items:[["📞","打电话　·　上网看新闻","Gọi điện · Lên mạng đọc tin"],["📷","拍照　·　看时间","Chụp ảnh · Xem giờ"],["🎧","听音乐　·　玩儿游戏","Nghe nhạc · Chơi game"]],talk:["补充：______","你一天看多少次手机？离开手机你能坚持多久？"],link:"Nhân vật trong bài dùng điện thoại cho <b>tất cả</b> những việc này — đến mức trở thành <span class='zh'>手机的奴隶</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"好 (hǎo)",rule:"好 + V → <b>dễ / dễ chịu khi làm</b> (tính từ).",w:[["好玩儿","hǎowánr","vui (có trong bài)"],["好闻","hǎowén","thơm"],["好卖","hǎomài","dễ bán"],["好使","hǎoshǐ","dễ dùng, nhạy"],["好用","hǎoyòng","dễ dùng"],["好听","hǎotīng","hay"],["好感","hǎogǎn","thiện cảm"],["好受","hǎoshòu","dễ chịu"],["好过","hǎoguò","dễ sống, dễ chịu"]]},{k:"报",rule:"报 = <b>báo, thông báo</b>.",w:[["报到","bàodào","báo danh, có mặt"],["报道","bàodào","đưa tin"],["报考","bàokǎo","đăng ký thi"],["报信","bàoxìn","báo tin"],["报时","bàoshí","báo giờ"],["报警","bào jǐng","báo cảnh sát (từ mới)"],["报告","bàogào","báo cáo"],["报表","bàobiǎo","bảng báo cáo"],["预报","yùbào","dự báo"],["回报","huíbào","đền đáp"],["上报","shàngbào","báo lên trên"],["通报","tōngbào","thông báo"]]},{k:"转",rule:"转 = <b>chuyển</b> (qua tay người khác / nơi khác).",w:[["转发","zhuǎnfā","chuyển tiếp (có trong bài)"],["转车","zhuǎn chē","đổi xe"],["转告","zhuǎngào","nhắn lại"],["转给","zhuǎngěi","chuyển cho"],["转交","zhuǎnjiāo","chuyển giao"],["转手","zhuǎnshǒu","sang tay"],["转卖","zhuǎnmài","bán lại"],["转送","zhuǎnsòng","chuyển tặng"],["转运","zhuǎnyùn","vận chuyển tiếp"],["转租","zhuǎnzū","cho thuê lại"],["中转","zhōngzhuǎn","trung chuyển"]]},{k:"何",rule:"何 = <b>gì, nào</b> (văn viết của 什么 / 怎么).",w:[["何不","hébù","sao không (có trong bài)"],["何处","héchù","nơi nào"],["何种","hézhǒng","loại nào"],["何人","hérén","người nào"],["何时","héshí","khi nào"],["何地","hédì","đâu"],["何必","hébì","cần gì phải"],["何况","hékuàng","huống hồ"],["如何","rúhé","như thế nào"],["为何","wèihé","vì sao"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–7",sub:"Nô lệ điện thoại",from:1,to:13},{name:"Nhóm 2 · Đoạn 8–10",sub:"Bắt đầu thử nghiệm",from:14,to:28},{name:"Nhóm 3 · Đoạn 11–12",sub:"Về nhà nấu cháo",from:29,to:47}],V:[[1,"正经","zhèngjing","tt.","chính kinh","đứng đắn, nghiêm túc",1,"","端庄正派；正当的；正式的。","别假装正经了","他说话一本正经的，大家都笑了。","Anh ta nói chuyện nghiêm trang quá, ai cũng bật cười.",["假装正经","一本正经","正经事"],"<span class='zh'>正经事</span> = việc đứng đắn, việc chính. SBT bài 8: <span class='zh'>没几个正经花盆</span>."],[2,"玩意儿","wányìr","dt.","—","đồ chơi; cái thứ",1,"口","玩具；泛指东西（有时含轻视意）。","那玩意儿就那么好玩儿？","这是什么玩意儿？","Cái thứ này là gì vậy?",["小玩意儿","什么玩意儿"],"Khẩu ngữ, chỉ đồ vật (giọng coi thường hoặc thân mật)."],[3,"憋","biē","đgt.","biệt","nén, nín; bí bách",1,"","抑制或堵住不让出来；闷。","我脸憋得通红","他憋了一肚子气。","Anh ấy nén một bụng tức.",["憋气","憋得慌","憋不住"],"<span class='zh'>脸憋得通红</span> = mặt đỏ bừng vì nín (ngượng)."],[4,"报警","bào jǐng","đgt.","báo cảnh","báo cảnh sát",1,"","向治安机关报告危急情况。","没报警，先下车拍照发微信","发生交通事故要马上报警。","Xảy ra tai nạn giao thông phải báo cảnh sát ngay.",["打电话报警","报警电话"],"Từ ly hợp. Bài tập 3①."],[5,"绑架","bǎngjià","đgt.","bảng giá","bắt cóc",1,"","用强力把人劫走。","都让手机给绑架了","警察救出了被绑架的孩子。","Cảnh sát giải cứu đứa trẻ bị bắt cóc.",["绑架案","被绑架"],"Bài dùng ẩn dụ: bị điện thoại “bắt cóc”. Bài tập 3①."],[6,"受罪","shòu zuì","đgt.","thụ tội","chịu khổ",1,"","受到折磨；泛指遇到不愉快的事。","这么过日子，不受罪吗？","这么热的天去爬山，简直是受罪。","Trời nóng thế này đi leo núi, đúng là hành xác.",["活受罪","受了不少罪"],"Bài 3 SBT: <span class='zh'>死要面子活受罪</span>."],[7,"吼","hǒu","đgt.","hống","gầm, hét",1,"","（猛兽）大声叫；（人）因愤怒而大声叫。","老板大吼","老虎大吼一声。","Con hổ gầm lên một tiếng.",["大吼一声","怒吼"],""],[8,"智能","zhìnéng","tt.","trí năng","thông minh (thiết bị)",1,"","具有人的某些智慧和能力的。","有了智能手机","智能家居越来越普及了。","Nhà thông minh ngày càng phổ biến.",["智能手机","人工智能"],"<span class='zh'>人工智能</span> = trí tuệ nhân tạo (AI)."],[9,"奴隶","núlì","dt.","nô lệ","nô lệ",1,"","为奴隶主劳动而没有人身自由的人。","我就成了手机的奴隶","不要做金钱的奴隶。","Đừng làm nô lệ của đồng tiền.",["……的奴隶"],""],[10,"麻木","mámù","tt.","ma mộc","tê dại; thờ ơ",1,"","身体某部分发麻；比喻对外界事物反应迟钝。","对什么都麻木了","在外面站了一个小时，脚都冻麻木了。","Đứng ngoài một tiếng, chân tê cóng.",["感到麻木","麻木不仁"],"SBT câu 19: <span class='zh'>麻木的机器</span>."],[11,"狼吞虎咽","lángtūn-hǔyàn","thành ngữ","lang thôn hổ yết","ăn ngấu nghiến",1,"成","形容吃东西又猛又急的样子。","狼吞虎咽吃完","他饿坏了，狼吞虎咽地吃了三碗饭。","Đói quá, anh ấy ăn ngấu nghiến ba bát cơm.",["狼吞虎咽地吃"],"Bài tập 3②."],[12,"伺候","cìhou","đgt.","tứ hậu","hầu hạ, chăm sóc",1,"口","在人身边供使唤，照料饮食起居。","把手机它老人家伺候得好好的","她在家伺候生病的母亲。","Cô ấy ở nhà chăm mẹ ốm.",["伺候老人","伺候得好好的"],"⚠️ 伺 đọc <b>cì</b>. Bài dùng hài hước: <span class='zh'>手机它老人家</span> — gọi điện thoại như “cụ”."],[13,"眨","zhǎ","đgt.","trát","chớp (mắt)",1,"","（眼睛）闭上又立刻睁开。","我冲他眨眨眼","一眨眼，孩子就长大了。","Chớp mắt một cái, con đã lớn.",["眨眼","一眨眼"],"<span class='zh'>一眨眼</span> = trong chớp mắt."],[14,"索性","suǒxìng","phó.","tác tính","dứt khoát, đã vậy thì",1,"","表示直截了当，干脆。","索性这礼拜就开始","既然来了，索性玩儿个痛快。","Đã đến rồi thì chơi cho đã luôn.",["索性不……"],"Xem <b>辨析 索性—干脆</b>."],[15,"作息","zuòxī","đgt.","tác tức","làm và nghỉ",1,"","工作和休息。","按小学生的作息时间","我们要养成良好的作息习惯。","Chúng ta phải tập thói quen sinh hoạt tốt.",["作息时间","作息规律"],"Bài tập 3②."],[16,"着手","zhuóshǒu","đgt.","trước thủ","bắt tay vào",1,"","开始做；动手。","先着手安置我的手机","公司已经着手准备新产品。","Công ty đã bắt tay chuẩn bị sản phẩm mới.",["着手准备","着手解决"],"⚠️ 着 đọc <b>zhuó</b>. Bài tập 2④."],[17,"安置","ānzhì","đgt.","an trí","sắp xếp, bố trí",1,"","使人或事物有着落。","安置我的手机","政府妥善安置了受灾群众。","Chính phủ thu xếp ổn thỏa cho người dân bị thiên tai.",["安置好","妥善安置"],""],[18,"防止","fángzhǐ","đgt.","phòng chỉ","phòng ngừa, ngăn ngừa",1,"","预先设法制止（坏事发生）。","为了防止自己意志薄弱","勤洗手可以防止疾病传播。","Rửa tay thường xuyên có thể ngăn bệnh lây lan.",["防止……发生","防止事故"],"Tân ngữ là <b>việc xấu</b>."],[19,"薄弱","bóruò","tt.","bạc nhược","yếu",1,"","容易被摧毁或破坏；不雄厚，不坚强。","防止自己意志薄弱","这个地区的教育基础比较薄弱。","Nền tảng giáo dục vùng này khá yếu.",["意志薄弱","薄弱环节"],"⚠️ 薄 đọc <b>bó</b> ở đây (khác <span class='zh'>薄 báo</span> = mỏng)."],[20,"精致","jīngzhì","tt.","tinh trí","tinh xảo",1,"","精巧细致。","我找来个精致的盒子","这件工艺品做得非常精致。","Món đồ thủ công này làm rất tinh xảo.",["精致的礼物","小巧精致"],""],[21,"庄重","zhuāngzhòng","tt.","trang trọng","trang trọng",1,"","（言语、举止）不随便，不轻浮。","庄重地放在盒子里","会场气氛十分庄重。","Không khí hội trường rất trang nghiêm.",["神情庄重","庄重地宣布"],"Bài dùng hài hước — cất điện thoại như làm lễ."],[22,"分散","fēnsàn","đgt.","phân tán","phân tán",1,"","散在各处；使分散。","为了分散注意力","上课玩手机会分散注意力。","Chơi điện thoại trong giờ học làm phân tán chú ý.",["分散注意力","人口分散"],"Trái nghĩa: <span class='zh'>集中</span>."],[23,"僵硬","jiāngyìng","tt.","cương ngạnh","cứng đờ",1,"","（肢体）不能活动；呆板。","锻炼我那僵硬的四肢","坐了一天，脖子都僵硬了。","Ngồi cả ngày, cổ cứng đờ.",["动作僵硬","四肢僵硬"],""],[24,"四肢","sìzhī","dt.","tứ chi","tay chân",1,"书","指人体的两上肢和两下肢。","僵硬的四肢","运动可以让四肢更灵活。","Vận động giúp tay chân linh hoạt hơn.",["活动四肢","四肢发达"],"Bài tập 3②."],[25,"特长","tècháng","dt.","đặc trường","sở trường, năng khiếu",1,"","特别擅长的技能。","跳舞是我的特长","你有什么特长？","Bạn có năng khiếu gì?",["发挥特长"],"Bài tập 4②."],[26,"兴高采烈","xìnggāo-cǎiliè","thành ngữ","hưng cao thái liệt","hớn hở, phấn khởi",1,"成","兴致高，情绪热烈。","我兴高采烈地跳起了摇滚","孩子们兴高采烈地去郊游了。","Bọn trẻ hớn hở đi dã ngoại.",["兴高采烈地……"],"⚠️ 兴 đọc <b>xìng</b>."],[27,"摇滚","yáogǔn","dt.","dao cổn","nhạc rock",1,"","摇滚乐。","跳起了摇滚","他是一名摇滚歌手。","Anh ấy là ca sĩ nhạc rock.",["摇滚乐","摇滚歌手"],""],[28,"一举两得","yìjǔ-liǎngdé","thành ngữ","nhất cử lưỡng đắc","một công đôi việc",1,"成","做一件事得到两方面的好处。","既能娱乐身心，又能锻炼身体，一举两得","骑车上班既省钱又锻炼身体，一举两得。","Đạp xe đi làm vừa tiết kiệm vừa rèn luyện, một công đôi việc.",["真是一举两得"],"Hay đi với <span class='zh'>既……又……</span>."],[29,"冷落","lěngluò","đgt.","lãnh lạc","bỏ rơi, đối xử lạnh nhạt",1,"","使受到冷淡的待遇。","被冷落了半天儿的手机","他觉得自己被大家冷落了。","Anh ấy cảm thấy bị mọi người lạnh nhạt.",["受到冷落","冷落客人"],"Còn là tính từ = vắng vẻ: <span class='zh'>门庭冷落</span>."],[30,"踏实","tāshi","tt.","đạp thực","yên tâm; chắc chắn",1,"口","（情绪）安定；（工作、学习）切实，不浮躁。","我心里踏实了许多","他工作很踏实。","Anh ấy làm việc rất chắc chắn.",["心里踏实","踏踏实实"],"Hai nghĩa: (1) yên lòng; (2) chăm chỉ, chắc chắn."],[31,"空虚","kōngxū","tt.","không hư","trống rỗng",1,"","里面没有什么实在的东西；不充实。","我心空虚得要命","退休以后，他觉得生活很空虚。","Sau khi nghỉ hưu, ông thấy cuộc sống trống rỗng.",["内心空虚","精神空虚"],""],[32,"要命","yào mìng","đgt.","yếu mệnh","chết người; kinh khủng",1,"口","使丧失生命；表示程度达到极点。","我心空虚得要命","今天热得要命。","Hôm nay nóng kinh khủng.",["Adj ","khủng bố","kinh hoàng, khủng bố",1,"","使人感到可怕的。","前两天的恐怖袭击","这部电影太恐怖了。","Bộ phim này đáng sợ quá.",["恐怖片","恐怖袭击"],"Nghĩa rộng hơn tiếng Việt: <span class='zh'>恐怖片</span> = phim kinh dị."],[45,"袭击","xíjī","đgt.","tập kích","tấn công bất ngờ",1,"","出其不意地打击。","恐怖袭击到底是谁干的","台风袭击了沿海城市。","Bão tấn công các thành phố ven biển.",["遭到袭击","恐怖袭击"],""],[46,"干扰","gānrǎo","đgt.","can nhiễu","quấy nhiễu",1,"","扰乱，打扰。","没有手机的干扰","请不要干扰我工作。","Xin đừng làm phiền tôi làm việc.",["排除干扰","受到干扰"],"Bài tập 3②."],[47,"安宁","ānníng","tt.","an ninh","yên bình",1,"书","（秩序）正常，没有骚扰；（心情）安定，宁静。","生活这么安宁","他们过着安宁的日子。","Họ sống những ngày yên bình.",["生活安宁","心神不安宁"],"⚠️ Khác “an ninh” tiếng Việt (= <span class='zh'>安全 · 治安</span>): <span class='zh'>安宁</span> = <b>yên bình</b>."]],extra:[["假装","jiǎzhuāng","giả vờ"],["通红","tōnghóng","đỏ bừng"],["微信","Wēixìn","WeChat"],["搜索","sōusuǒ","tìm kiếm"],["精神病","jīngshénbìng","bệnh tâm thần"],["黑着脸","hēizhe liǎn","mặt sa sầm"],["埋头","máitóu","cúi đầu (chăm chú)"],["分心","fēn xīn","mất tập trung"],["关机","guān jī","tắt máy"],["雪白","xuěbái","trắng như tuyết"],["回归","huíguī","trở về"]],T:[{zh:"开会时老板火了：“别假装正经了，我知道你们都在玩儿手机，那玩意儿就那么好玩儿？”",vn:"Trong cuộc họp, sếp nổi cáu: “Đừng giả vờ nghiêm túc nữa, tôi biết các anh chị đều đang nghịch điện thoại, cái thứ đó vui đến thế à?”",idea:"Sếp nổi giận vì nhân viên nghịch điện thoại.",q:["老板为什么发火？"],note:[["老板火了","<span class='zh'>火</span> làm động từ = nổi giận (khẩu ngữ)."],["那玩意儿就那么好玩儿？","Câu hỏi tu từ, giọng mỉa mai."]]},{zh:"老板指着我：“你说说，看了什么？比我说话还有意思？”",vn:"Sếp chỉ vào tôi: “Cậu nói xem, xem cái gì thế? Còn hay hơn tôi nói à?”",idea:"Sếp chỉ đích danh “tôi”.",q:[],note:[]},{zh:"我脸憋得通红，说：“一对年轻人边开车边拿手机拍照，把桥撞坏了，没报警，先下车拍照发微信。要不要转发给您？”",vn:"Tôi đỏ bừng mặt, nói: “Một cặp trẻ vừa lái xe vừa cầm điện thoại chụp ảnh, đâm hỏng cả cây cầu, không báo cảnh sát mà xuống xe chụp ảnh đăng WeChat trước. Có cần chuyển tiếp cho sếp không ạ?”",idea:"“Tôi” đang xem tin về đôi trẻ mải chụp ảnh gây tai nạn.",q:["“我”在手机上看到了什么新闻？"],note:[["我脸憋得通红","<span class='zh'>通红</span> = đỏ bừng — tính từ trạng thái. Xem Ngữ pháp 1."],["要不要转发给您？","Câu thoại hài: bị bắt quả tang mà còn hỏi có muốn chuyển tiếp không."]]},{zh:"老板一摆手：“你们呀，都让手机给绑架了，这么过日子，不受罪吗？”",vn:"Sếp xua tay: “Các anh chị đấy, đều bị điện thoại bắt cóc rồi, sống như thế không khổ à?”",idea:"Sếp: các anh chị bị điện thoại “bắt cóc”.",q:["老板说大家“让手机给绑架了”是什么意思？"],note:[["都让手机给绑架了","Bị động khẩu ngữ <span class='zh'>让 + tác nhân + 给 + V</span> (bài 3: 把……给……)."]]},{zh:"一同事举手：“老板，刚搜索了一下，离不开手机也是一种精神病。”",vn:"Một đồng nghiệp giơ tay: “Sếp ơi, em vừa tra thử, không rời được điện thoại cũng là một loại bệnh tâm thần đấy.”",idea:"Đồng nghiệp “tra cứu” ngay tại chỗ.",q:[],note:[["刚搜索了一下","Chi tiết hài: vừa bị mắng vẫn dùng điện thoại tra."]]},{zh:"老板大吼：“有病就得治！”，随后黑着脸扔下一句话：“以后开会谁都不许带手机！”",vn:"Sếp quát lớn: “Có bệnh thì phải chữa!”, rồi sa sầm mặt buông một câu: “Từ nay họp ai cũng không được mang điện thoại!”",idea:"Sếp cấm mang điện thoại khi họp.",q:["老板最后做了什么决定？"],note:[["谁都不许……","<span class='zh'>谁都 + 不</span> = không ai được…"]]},{zh:"老板说的没错，特别是有了智能手机，我就成了手机的奴隶，对什么都麻木了，心里只有手机：三分钟看一次新闻；十分钟发一次微信；吃饭前先拍照；狼吞虎咽吃完，又埋头看微信；睡觉之前先给手机充电……把手机它老人家伺候得好好的。有一次阿毛对我说：“我跟你说话呢，你干吗老看手机？”。我冲他眨眨眼，说：“那你也拿出手机，咱们手机上聊吧，保证不分心！”",vn:"Sếp nói không sai, nhất là từ khi có điện thoại thông minh, tôi đã thành nô lệ của nó, thờ ơ với mọi thứ, trong lòng chỉ có điện thoại: ba phút xem tin một lần; mười phút gửi WeChat một lần; trước bữa ăn chụp ảnh trước; ăn ngấu nghiến xong lại cúi đầu xem WeChat; trước khi ngủ sạc pin cho điện thoại trước… hầu hạ “cụ” điện thoại chu đáo vô cùng. Có lần A Mao bảo tôi: “Tôi đang nói chuyện với cậu đấy, sao cậu cứ nhìn điện thoại thế?” Tôi nháy mắt với cậu ấy: “Vậy cậu cũng lấy điện thoại ra, chúng mình chat trên điện thoại, đảm bảo không mất tập trung!”",idea:"“Tôi” thừa nhận mình là nô lệ điện thoại.",q:["为什么说“我”成了手机的奴隶？"],note:[["三分钟……；十分钟……；吃饭前……；……；睡觉之前……","Liệt kê nhịp nhanh bằng dấu chấm phẩy — miêu tả thói quen."],["把手机它老人家伺候得好好的","Nhân hóa hài hước: gọi điện thoại là <span class='zh'>它老人家</span> (cụ)."]]},{zh:"离开了手机，难道会死吗？何不尝试一下一周关机一天？说干就干，索性这礼拜就开始。",vn:"Rời điện thoại thì chết sao? Sao không thử mỗi tuần tắt máy một ngày? Nói là làm, dứt khoát tuần này bắt đầu luôn.",idea:"Quyết định mỗi tuần tắt máy một ngày.",q:["“我”做了什么决定？"],note:[["难道……吗？何不……？","Hai câu hỏi tu từ liên tiếp: phủ định → đề nghị. Xem <b>Bài tập 4①</b>."],["说干就干，索性……就……","<span class='zh'>说A就A</span> + <span class='zh'>索性</span> — quyết đoán. Xem Ngữ pháp."]]},{zh:"周日，我按小学生的作息时间七点起床，之后，先着手安置我的手机。为了防止自己意志薄弱，我找来个精致的盒子，把手机层层包好，庄重地放在盒子里，收到衣柜最里面。为了分散注意力，我决定去公园锻炼我那僵硬的四肢，因为迷上智能手机以后，我已经好久不锻炼了。",vn:"Chủ nhật, tôi dậy lúc bảy giờ theo giờ giấc của học sinh tiểu học, sau đó bắt tay vào “an trí” chiếc điện thoại. Để phòng ý chí mình yếu đuối, tôi tìm một chiếc hộp tinh xảo, gói điện thoại nhiều lớp, trang trọng đặt vào hộp, cất vào tận cùng tủ quần áo. Để phân tán sự chú ý, tôi quyết định ra công viên vận động tay chân cứng đờ của mình, vì từ khi mê điện thoại thông minh, tôi đã lâu lắm không tập thể dục.",idea:"Cất điện thoại thật kỹ, ra công viên.",q:["为了关机一天，“我”怎样安置自己的手机？"],note:[["为了防止……，……；为了分散……，……","Hai vế <span class='zh'>为了</span> song song — giải thích mục đích từng hành động."],["层层包好，庄重地放在盒子里","Miêu tả cường điệu như nghi lễ — giọng hài."]]},{zh:"公园里唱的跳的都有。跳舞是我的特长，我兴高采烈地跳起了摇滚，既能娱乐身心，又能锻炼身体，一举两得。",vn:"Trong công viên người hát người nhảy đủ cả. Nhảy là sở trường của tôi, tôi hớn hở nhảy nhạc rock, vừa giải trí thân tâm, vừa rèn luyện cơ thể, một công đôi việc.",idea:"Nhảy rock ở công viên — một công đôi việc.",q:["“我”在公园做了什么？"],note:[["唱的跳的都有","<span class='zh'>V的 V的都有</span> = người làm việc này, người làm việc kia đều có."],["既能……，又能……，一举两得","Xem <b>Bài tập 4②</b>."]]},{zh:"跳完舞，我往家走，突然想起被冷落了半天儿的手机，急忙赶回家，打开衣柜，手机还在，我心里踏实了许多。五个小时没碰它，我心空虚得要命，我决定用熬粥这件最消耗时间的事来弥补心中的空虚。烧水，下米，看着雪白的米在沸腾的水中翻滚，屋子里渐渐弥漫着粥的香气，屋外竟然传来了鸟的叫声，我的心慢慢静了下来。要在往常，我一定早待不住了，惦记着某某侦探的案件是不是有了突破，科学家是否有了震惊世界的发现，彩票大奖开了没有，前两天的恐怖袭击到底是谁干的……",vn:"Nhảy xong, tôi đi về, chợt nhớ đến chiếc điện thoại bị bỏ rơi nửa ngày, vội vàng về nhà, mở tủ — điện thoại vẫn còn đó, lòng tôi yên tâm hơn nhiều. Năm tiếng không chạm vào nó, lòng tôi trống rỗng kinh khủng; tôi quyết định dùng việc tốn thời gian nhất là nấu cháo để lấp khoảng trống ấy. Đun nước, cho gạo, nhìn những hạt gạo trắng tinh cuộn trong nước sôi sùng sục, trong nhà dần lan tỏa mùi thơm của cháo, bên ngoài lại vọng vào tiếng chim hót, lòng tôi từ từ lắng xuống. Nếu là mọi khi, tôi hẳn đã không ngồi yên được, cứ canh cánh vụ án của thám tử nọ có tiến triển chưa, nhà khoa học có phát hiện chấn động thế giới nào không, giải xổ số đã mở chưa, vụ khủng bố hôm trước rốt cuộc là ai làm…",idea:"Về nhà nấu cháo — từ trống rỗng đến bình tâm.",q:["回家后，“我”做了什么？心情有什么变化？","要在往常，“我”会惦记什么？"],note:[["我心空虚得要命","<span class='zh'>Adj + 得要命</span> = … kinh khủng. Xem Ngữ pháp 3."],["雪白的米在沸腾的水中翻滚","<span class='zh'>雪白</span> — tính từ trạng thái."],["要在往常，我一定早……了","<span class='zh'>要（是）在往常</span> = nếu là mọi khi — giả định trái thực tế."]]},{zh:"没有手机的干扰，生活这么安宁，我突然有了一种回归生活的欣慰。",vn:"Không có điện thoại quấy nhiễu, cuộc sống thật yên bình, tôi bỗng có niềm vui yên lòng của việc trở về với cuộc sống.",idea:"Kết: cuộc sống yên bình khi không có điện thoại.",q:["“我”最后有什么感受？"],note:[["回归生活的欣慰","<span class='zh'>欣慰</span> (bài 2) — vui và yên lòng."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: nghĩa của hình vị",G:[{id:"g1",grp:0,word:"",zh:"通红 · 雪白",py:"tōnghóng · xuěbái",tag:"Chú thích 1 · tính từ trạng thái",mean:"<span class='zh'>通红</span> = đỏ <b>toàn bộ</b>; <span class='zh'>雪白</span> = trắng <b>như tuyết</b>. Đây là <b>tính từ trạng thái</b> (状态形容词): dùng để <b>miêu tả</b> trạng thái sự vật, trọng tâm nghĩa ở <b>chữ thứ hai</b>. Bản thân đã hàm ý mức độ cao nên <b>không</b> thêm <span class='zh'>很 · 非常 · 特别</span> phía trước, cũng <b>không</b> thêm <span class='zh'>极了 · 得很</span> phía sau. Lặp lại theo kiểu <b>ABAB</b>.",forms:["脸憋得通红 · 通红通红的","雪白的米 · 雪白雪白的","✗ 很通红 · ✗ 雪白极了"],ex:[["我脸憋得通红。","",1],["雪白的米在沸腾的水中翻滚，……","",1],["那几只还没断奶的小猫幸福地躺在妈妈的怀里，肚子都吃得滚圆滚圆的。","Mấy chú mèo con chưa cai sữa nằm hạnh phúc trong lòng mẹ, bụng đứa nào cũng tròn vo."]],tips:["Cùng loại: <span class='zh'>冰凉 · 笔直 · 雪亮 · 漆黑 · 火热 · 滚圆 · 碧绿 · 金黄</span>.","Cấu tạo: <b>vật so sánh + tính từ</b> (<span class='zh'>雪+白, 冰+凉</span>) hoặc <b>phó từ + tính từ</b> (<span class='zh'>通+红</span>)."],practice:{q:"选择合适的词语填空：雪亮 · 冰凉 · 笔直",type:"complete",items:[["夏天，(____)的啤酒加上美味的海鲜，对很多人来讲，极具吸引力。","夏天，冰凉的啤酒加上美味的海鲜，对很多人来讲，极具吸引力。"],["那是一条(____)的公路，她的车无精打采地在公路上前行，远处是茫茫雪山。","那是一条笔直的公路，她的车无精打采地在公路上前行，远处是茫茫雪山。"],["人民有自己的亲身经历，眼睛是(____)的。","人民有自己的亲身经历，眼睛是雪亮的。"]]}},{id:"g2",grp:1,word:"",zh:"说A就A",py:"shuō A jiù A",tag:"Chú thích 2 · khẩu ngữ",mean:"Mẫu khẩu ngữ, biểu thị sự việc <b>xảy ra / tiến triển rất nhanh</b>, “nói là… liền…”. Hai chữ A giống nhau: có thể là <b>động từ, cụm động từ</b> hoặc <b>tính từ</b>.",forms:["说 + V + 就 + V（说干就干 · 说走就走）","说 + Adj + 就 + Adj（说热就热）","说不 + V + 就不 + V（说不干就不干）"],ex:[["说干就干，索性这礼拜就开始。","",1],["他辞了职去旅游，可把爸妈气坏了，天天在家唠叨：“挺好的工作，一点儿都不珍惜，说不干就不干了。”","Anh ấy bỏ việc đi du lịch, làm bố mẹ tức điên, ngày nào cũng cằn nhằn: “Việc tốt thế, chẳng biết quý, nói nghỉ là nghỉ.”"],["六月下旬，天气说热就热了，人们争先恐后地往商店跑，去买电扇，去买空调。","Cuối tháng Sáu, trời nói nóng là nóng ngay, người ta tranh nhau chạy đến cửa hàng mua quạt, mua điều hòa."]],tips:["Bài tập 2①: <span class='zh'>她的脾气不好，说生气就生气。</span>","<span class='zh'>说走就走的旅行</span> = chuyến đi bộc phát (cụm rất phổ biến)."],practice:{q:"用“说A就A”改写句子",type:"complete",items:[["你看天上，阴云密布的，马上就得下雨，不带伞哪行啊！","你看天上，阴云密布的，说下雨就下雨，不带伞哪行啊！"],["小孩儿就是这样，一会儿哭，一会儿笑。","小孩儿就是这样，说哭就哭，说笑就笑。"],["很快他们两个就好上了，好得朝夕相伴，形影不离。","他们两个说好就好上了，好得朝夕相伴，形影不离。"]]}},{id:"g3",grp:1,word:"索性",zh:"索性 / 干脆",py:"suǒxìng / gāncuì",tag:"Xem 辨析 bên dưới",mean:"Phó từ: nói, làm <b>thẳng thắn, dứt khoát</b>, không đắn đo nhiều — thường dùng khi tình huống không như ý, “đã vậy thì…”.",forms:["既然……，索性 / 干脆 + V 吧","……，索性不 + V 了"],ex:[["说干就干，索性这礼拜就开始。","",1],["找了好几个地方都没找着，索性不找了。","Tìm mấy chỗ rồi không thấy, thôi khỏi tìm luôn."]],tips:["Bài tập 2③."]},{id:"g4",grp:1,word:"",zh:"难道……吗？何不……？",py:"nándào … ma? hébù …?",tag:"Câu hỏi tu từ · Bài tập 4①",mean:"<span class='zh'>难道……吗？</span> — câu hỏi tu từ, ý <b>phủ định</b> mạnh (“chẳng lẽ…?” → không phải). <span class='zh'>何不……？</span> (văn viết = <span class='zh'>为什么不</span>) — <b>đề nghị</b> “sao không…?”. Ghép lại: bác bỏ nỗi lo → đưa ra giải pháp.",forms:["……，难道 + 会 / 能 + V 吗？何不 + V？"],ex:[["离开了手机，难道会死吗？何不尝试一下一周关机一天？","",1],["丢了工作，难道就活不下去了吗？何不趁这个机会好好休息一下？","Mất việc thì chẳng lẽ không sống nổi? Sao không nhân dịp này nghỉ ngơi cho tử tế?"]],tips:["Khởi động 2: nhóm <span class='zh'>何不 · 何必 · 何况 · 如何 · 为何</span>."]},{id:"g5",grp:1,word:"一举两得",zh:"既……，又……，一举两得",py:"",tag:"Bài tập 2② · 4②",mean:"<span class='zh'>既……又……</span> nối hai lợi ích song song; kết bằng thành ngữ <span class='zh'>一举两得</span> (một công đôi việc) để tổng kết.",forms:["既能 + V₁，又能 + V₂，一举两得"],ex:[["跳舞是我的特长，我兴高采烈地跳起了摇滚，既能娱乐身心，又能锻炼身体，一举两得。","",1],["这么做既能增加公司的利润，又能方便用户。","Làm như vậy vừa tăng lợi nhuận công ty, vừa tiện cho người dùng."]],tips:["<span class='zh'>既……又……</span> trang trọng hơn <span class='zh'>又……又……</span>; hai vế thường cùng cấu trúc."]},{id:"g6",grp:2,word:"要命",zh:"Adj / V + 得 + 要命",py:"… de yàomìng",tag:"Chú thích 3 · bổ ngữ mức độ",mean:"Biểu thị mức độ <b>đạt đến cực điểm</b> (… kinh khủng, … chết đi được). Khẩu ngữ, thường đi với trạng thái <b>khó chịu</b> (mệt, sợ, lo, đau, nóng…) nhưng cũng dùng được với từ tích cực (<span class='zh'>高兴得要命</span>).",forms:["Adj + 得要命（空虚 / 紧张 / 累 / 热）","V + 得要命（吓 / 想 / 后悔）"],ex:[["五个小时没碰它，我心空虚得要命。","",1],["每次考试之前，不少同学都紧张得要命，吃不好，睡不着，有的还生病。","Mỗi lần trước kỳ thi, nhiều bạn căng thẳng kinh khủng, ăn không ngon, ngủ không được, có bạn còn ốm."],["他风趣地说，自从那次让蛇咬了一口，就害怕所有的爬行动物、虫子，见了麻绳都吓得要命。","Anh ấy hài hước kể từ lần bị rắn cắn, sợ mọi loài bò sát, sâu bọ, thấy sợi dây thừng cũng sợ chết khiếp."]],tips:["Đồng nghĩa: <span class='zh'>……得不得了 · ……得要死 · ……极了</span>.","Bài tập 2⑥: <span class='zh'>考试时，我紧张得要命，手心里都是汗。</span>"],practice:{q:"完成句子",type:"complete",items:[["他的确是个热心肠，尽管他平日大事小事特别多，________，可是只要有人求他，他一定会全力相助。","他的确是个热心肠，尽管他平日大事小事特别多，忙得要命，可是只要有人求他，他一定会全力相助。"],["那是我第一次拍戏。临拍前一晚，我________，整晚睡不着，想戏怎么演，手势怎么摆，足足想了一夜。","那是我第一次拍戏。临拍前一晚，我紧张得要命，整晚睡不着，……"],["妈妈不但在生气，而且________。","妈妈不但在生气，而且气得要命。"]]}}],BX:{grp:1,word:"索性",cols:["索性","干脆"],pair:"索性 — 干脆",same:["Làm <b>phó từ</b>, cách dùng về cơ bản giống nhau: nói, làm <b>thẳng thắn, dứt khoát</b>, không cân nhắc nhiều.","这鞋子太旧了，索性 / 干脆扔掉吧。"],diff:[["Chỉ là <b>phó từ</b>.","我做事一直都很索性。✗","Còn là <b>tính từ</b>, làm <b>vị ngữ</b> = sảng khoái, dứt khoát.<div class='zh' style='margin-top:4px'>这个人说话做事很干脆，一点儿也不拖泥带水。</div>"],["Không làm định ngữ, bổ ngữ.","—","Làm được định ngữ, trạng ngữ có 地, bổ ngữ.<div class='zh' style='margin-top:4px'>他很干脆地拒绝了我。 / 你干脆点儿行吗？</div>"]],task:{q:"判断对错：索性 / 干脆",cols:["√","×"],sample:!1,items:[["他觉得这门课没有用，索性不去上课了。",0,"Phó từ trước động từ → đúng."],["你干脆点儿行吗？别总是犹犹豫豫的。",0,"<span class='zh'>干脆</span> là tính từ, + <span class='zh'>点儿</span> → đúng."],["我做事一直都很索性，从来不琢磨来琢磨去。",1,"<span class='zh'>索性</span> không làm tính từ → phải dùng <span class='zh'>干脆</span>."],["他很干脆地拒绝了我，一点儿余地都没有。",0,"<span class='zh'>干脆地</span> làm trạng ngữ → đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>智</u>能","智力 · 智慧 · 智商 · 理智"],items:[["<u>安</u>置","安","安心 · 安全 · 安静 · 安装"],["<u>防</u>止","防","防范 · 防备 · 提防 · 预防"],["<u>精</u>致","精","精心 · 精细 · 精彩 · 精明"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["她的脾气不好，经常不知道为什么突然就生气了。→ ________","说A就A","她的脾气不好，说生气就生气。"],["这么做不但能增加公司的利润，还能方便用户。→ ________","既……又……","这么做既能增加公司的利润，又能方便用户。"],["找了好几个地方都没找着，干脆不找了。→ ________","索性","找了好几个地方都没找着，索性不找了。"],["很多单位在年底就开始制定第二年的计划了。→ ________","着手","很多单位在年底就着手制定第二年的计划了。"],["今天不知道怎么了，堵得这么厉害，以前这里很少堵车。→ ________","往常","今天不知道怎么了，堵得这么厉害，往常这里很少堵车。"],["考试时，我非常紧张，手心里都是汗。→ ________","……得要命","考试时，我紧张得要命，手心里都是汗。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["报警","绑架","侦探","震惊","案件"],text:"上个月，这里发生了一起令人{震惊}的{案件}，两个年轻人{绑架}了他们的同学，然后向同学的父母要一大笔钱。受害孩子的家人{报警}以后，警察迅速开展工作，他们派出一位非常有经验的{侦探}，很快就抓住了那两个年轻人，救出了他们的同学。"},{bank:["干扰","作息","着手","四肢","狼吞虎咽"],text:"我的{作息}时间是这样的：早上6:00起床，先活动活动{四肢}，然后做一顿营养丰富的早餐，我吃饭从来不{狼吞虎咽}，享受了美味的早餐后，我{着手}写我的新书，在没人{干扰}的情况下，我的写作进度会很快，写着写着一天的时光不知不觉就过去了。"}]},EX4:{q:"模仿课文，完成语段",vn:"Học cấu trúc đoạn văn mẫu rồi viết đoạn của bạn.",items:[{src:"离开了手机，<u>难道</u>会死吗？<u>何不</u>尝试一下一周关机一天？<u>说干就干</u>，索性这礼拜<u>就</u>开始。",task:"丢了工作，难道____吗？何不____？说干就干，____就____。",model:"丢了工作，难道就活不下去了吗？何不趁这个机会去学一门新技术？说干就干，索性明天就去报名。"},{src:"跳舞<u>是我的特长</u>，我兴高采烈地跳起了摇滚，<u>既</u>能娱乐身心，<u>又</u>能锻炼身体，一举两得。",task:"____是我的特长，我____，既____，又____。",model:"做饭是我的特长，我周末常常给朋友们做一桌好菜，既能让大家吃得开心，又能练习厨艺，一举两得。"}]},EX5:{q:"根据提示，简述课文主要内容",vn:"Trả lời từng câu theo gợi ý.",rows:[["公司老板为什么开会时发火？","（自己总结）","因为开会时大家都在偷偷玩儿手机，没有认真听他说话。"],["开会时，“我”在手机上看什么？","一对年轻人……","一对年轻人边开车边拿手机拍照，把桥撞坏了，没报警，先下车拍照发微信。"],["为什么说“我”成了手机的奴隶？","①看新闻 ②发微信 ③拍照 ④充电……","“我”三分钟看一次新闻，十分钟发一次微信，吃饭前先拍照，睡觉前先给手机充电，心里只有手机。"],["为了关机一天，“我”怎样安置自己的手机？","包好、放在、收到","“我”把手机层层包好，庄重地放在一个精致的盒子里，收到衣柜最里面。"],["“我”如何出门锻炼的？","公园、跳舞、既……又……","“我”去公园跳摇滚，既能娱乐身心，又能锻炼身体，一举两得。"],["回家后，“我”又做了什么？","打开、熬粥、往常……","“我”打开衣柜看到手机还在，心里踏实了；然后熬粥弥补心中的空虚，心慢慢静了下来。要在往常，“我”一定早待不住了。"]]},BJ:{title:"病句类型：搭配不当",vn:"Câu sai — loại 4: kết hợp từ không đúng",intro:"<b>搭配不当</b>: các từ trong câu kết hợp với nhau <b>không hợp thói quen</b> ngôn ngữ, không đúng quy tắc ngữ pháp. Có thể sai giữa <b>chủ ngữ – vị ngữ</b>, <b>động từ – tân ngữ</b>, <b>giới từ – tân ngữ</b>, <b>cặp quan hệ từ</b>, <b>phó từ thời thái – trợ từ động thái</b>; cả <b>định ngữ / trạng ngữ – trung tâm ngữ</b> cũng là loại dễ sai.",types:[["主谓搭配不当","Chủ ngữ – vị ngữ không hợp","他们每年的粮食产量，除了自己消费以外，还要大量卖给国家。","他们每年生产的粮食，除了自己消费以外，……","“Sản lượng” không thể “tiêu dùng / bán” — phải là “lương thực sản xuất ra”."],["动宾搭配不当","Động từ – tân ngữ không hợp","告诉你一个好消息，我考上了HSK四级考试。","我通过了HSK四级考试。","<span class='zh'>考上</span> + trường (<span class='zh'>考上大学</span>); với <span class='zh'>考试</span> dùng <span class='zh'>通过</span>."],["介词搭配不当","Giới từ kết hợp sai","温度从24℃～26℃之间，是最适合这种植物生长的。","温度在24℃～26℃之间，……","Cố định: <span class='zh'>在……之间</span>; <span class='zh'>从</span> đi với <span class='zh'>到</span>."],["时态副词与动态助词搭配不当","Phó từ thời thái – trợ từ động thái","他是个勤奋好学的学生，自从他选择了汉语，就一直在努力学习了。","……，就一直在努力学习。","<span class='zh'>一直在</span> = đang tiếp diễn, mâu thuẫn với <span class='zh'>了</span> (hoàn thành) → bỏ <span class='zh'>了</span>."],["状语和中心语搭配不当","Trạng ngữ – trung tâm ngữ","蓝方先是被打倒，接着，他渐渐地爬了起来……","……，他慢慢地爬了起来……","<span class='zh'>渐渐</span> = tăng/giảm dần về mức độ, số lượng; tả động tác chậm dùng <span class='zh'>慢慢</span>."]],opts:["主谓搭配不当","动词和宾语搭配不当","定语搭配不当","介词和宾语搭配不当","动词和补语搭配不当"],practice:[["这里有“庐山第一景”之称，一年四季泉水叮咚、鸟语花香、青松翠柏、云蒸雾绕。","主谓搭配不当","……，一年四季泉水叮咚、鸟语花香、松柏常青、云蒸雾绕。","Ba cụm kia đều là <b>chủ – vị</b> (<span class='zh'>泉水 + 叮咚</span>), riêng <span class='zh'>青松翠柏</span> là cụm danh từ → đổi thành <span class='zh'>松柏 + 常青</span>."],["老板很赏识李朝阳温文尔雅的风度和丰富的知识，对他十分器重。","动词和宾语搭配不当","李朝阳有着温文尔雅的风度和丰富的知识，老板很赏识他，对他十分器重。","<span class='zh'>赏识</span> + <b>người</b> (tài năng của người), không đi với <span class='zh'>风度</span>."],["他相信，凭着自己聪明能干的双手，一定能养活自己。","定语搭配不当","他相信，凭着自己勤劳能干的双手，一定能养活自己。","Đôi tay không “thông minh” → <span class='zh'>勤劳能干的双手</span>."],["妈妈对于我不太信任，老把我当成孩子。","介词和宾语搭配不当","妈妈对我不太信任，老把我当成孩子。","Đối tượng là <b>người</b> + thái độ (<span class='zh'>信任</span>) → dùng <span class='zh'>对</span>, không dùng <span class='zh'>对于</span>."],["快过春节了，人们把自己的家打扫得又干净又整齐。","动词和补语搭配不当","快过春节了，人们把自己的家打扫得干干净净。","<span class='zh'>打扫</span> tạo ra kết quả “sạch”, không tạo ra “ngăn nắp” (<span class='zh'>整齐</span> đi với <span class='zh'>收拾 / 摆放</span>)."]]},DP:{title:"词汇：语素义",vn:"Hiểu nghĩa từng chữ (hình vị) để đoán nghĩa từ mới — kỹ năng rất hữu ích ở phần đọc HSK6.",items:[["无知","wúzhī","thiếu hiểu biết","无：没有 · 知：知识","不要因为无知而犯错。"],["破例","pò lì","phá lệ","破：突破，撤除 · 例：规则","老板破例给他放了一周假。"],["盛产","shèngchǎn","sản xuất nhiều","盛：兴盛 · 产：生产","这个地区盛产水果。"],["额外","éwài","ngoài định mức","额：规定的数目 · 外：以外","加班会有额外的报酬。"],["埋没","máimò","vùi lấp, mai một","埋：用土等物盖住 · 没：隐藏","他的才华被埋没了很多年。"],["扩散","kuòsàn","khuếch tán, lan rộng","扩：扩大 · 散：分散到各处","消息很快扩散开来。"],["登陆","dēng lù","đổ bộ (lên đất liền)","登：由低处上到高处 · 陆：陆地","台风今晚将在沿海登陆。"],["失踪","shīzōng","mất tích","失：找不着 · 踪：踪迹","警方正在寻找失踪的孩子。"],["散布","sànbù","rải rác; tung (tin)","散：分开 · 布：排列","不要散布没有根据的消息。"],["密封","mìfēng","niêm kín","密：空隙小 · 封：密闭，关住","茶叶要密封保存。"],["密度","mìdù","mật độ","密：事物之间距离近 · 度：程度","这个城市的人口密度很大。"],["废墟","fèixū","đống đổ nát","废：没用的 · 墟：荒废的地方","地震后，小镇变成了一片废墟。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"水是地球上最丰富的物质，它覆盖了70%以上的地球表面。不仅江河、大海里有水，空气、云层里有水，我们吃的蔬菜、水果里有水，连人体内也含有大量的水。水对我们真是太重要了。",o:["地球内70%都是水","大部分水在空气、云层里","水果是含水最多的物质","水对我们非常重要"],a:3,why:"Câu kết: “水对我们真是太重要了”. A sai: 70% là <b>bề mặt</b> trái đất."},{n:2,say:"我们每个人都有属于自己的名字，电话也有名字，这就是电话号码。电话号码是由电话局统一编制的号码。固定电话号码一般为7～9位数，手机号码通常是11位数。一个城市的电话号码一般是不会重复的。",o:["电话号码就好像是电话的名字","电话号码是由用户自己编制的","固定电话号码一般为7～11位数","一个城市的电话号码往往会重复"],a:0,why:"“电话也有名字，这就是电话号码”."},{n:3,say:"光照亮了我们的世界，让我们可以看清万物。然而，我们平时看见的只是光的一部分——可见光，它还有很大部分是我们肉眼看不见的，如微波、红外线、紫外线等。",o:["我们能看见大部分光","我们平时看见的是可见光","微波是肉眼能看见的","红外线、紫外线不属于光"],a:1,why:"“我们平时看见的只是光的一部分——可见光”."},{n:4,say:"侦探指负责调查案件的职业，也指负责调查的调查员。侦探一般是通过秘密调查来获取信息的。要成为一个好侦探，高度的注意力和敏锐的观察力是必不可少的。同时要有丰富的知识和良好的记忆力，这样才能在复杂的情况下，排除干扰，找到答案。",o:["侦探通过公开调查来获取信息","侦探是负责审判案件的职业","侦探需要有丰富的知识","侦探要有良好的体力"],a:2,why:"“同时要有丰富的知识和良好的记忆力”. A: 秘密 ≠ 公开; B: 调查 ≠ 审判; D: 记忆力 ≠ 体力."},{n:5,say:"假如你家里只有一台电视机，爸爸想看足球，而你想看动画片，怎么办呢？双画面电视机就可以解决这个问题。这种电视机有一大一小两个画面，可以同时收看两个节目。",o:["双画面电视机需要两台电视机","双画面电视机可以收看动画片","双画面电视机有两个相同大小的画面","双画面电视机可以同时收看两个节目"],a:3,why:"“可以同时收看两个节目”. C sai: <span class='zh'>一大一小</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：观众朋友们，大家好，今天我们来谈一谈与我们生活息息相关的电话。我们请到了电信专家王老师，让他跟我们说说电话。\n男：大家好，很高兴能与大家分享关于电话的故事和知识。\n女：王老师，我们都知道，只要在电话键盘上拨下一组数字，就可以和世界各地的人互相通话了。电话是人类一个了不起的发明，它将人与人之间的距离拉得很近很近。可是，王老师，您能给我们介绍一下电话是怎样工作的吗？\n男：电话是通过电话网来工作的。这个网由电话机、电话线和交换机组成。当我们对着话筒说话时，电话机会将声音转换为电子信号，并传达到电话局的交换机上。交换机再将这些信号输送到和我们通话的电话机上，由那部电话机把电子信号还原成声音。\n女：那拨打电话为什么有时会占线呢？\n男：因为每个有线电话机都需要一对电话线传送声音。可是，电话线可以通过的信号是有限的，当通过电话线的信号太多时，就会产生电话占线现象。\n女：当今科技发展很快，已经出现了可视电话，这又是什么原理呢？\n男：可视电话非常神奇，使用它时不但可以听到对方的声音，还能够看到对方的模样。可视电话也是用电话线进行信息传递的，只不过它将声音信号与图像信号合并在一起传输出去，并通过电话两端的摄像管扫描、还原，这样，我们就能看到对方了。",qs:[{n:6,q:"关于电话，下列哪项正确？",o:["可以拉近人与人的距离","是历史上最伟大的发明","与人们的健康息息相关","能让世界各地的人见面"],a:0,why:"“它将人与人之间的距离拉得很近很近”."},{n:7,q:"电话是通过什么来工作的？",o:["电话线","电话机","电话网","交换机"],a:2,why:"“电话是通过电话网来工作的” — A, B, D chỉ là các bộ phận của mạng."},{n:8,q:"电话机会把声音转换成什么？",o:["电子信号","声音信号","图像信号","交换信号"],a:0,why:"“电话机会将声音转换为电子信号”."},{n:9,q:"拨打电话为什么会占线？",o:["电话线的长度不够","电话线的宽度不够","通过电话线的信号太多了","电话机或电话线出现故障"],a:2,why:"“当通过电话线的信号太多时，就会产生电话占线现象”."},{n:10,q:"为什么说可视电话非常神奇？",o:["利用电话线进行信息传递","先传递声音，再传递图像","利用交换机扫描、还原图像","不但可以听到，还能看到对方"],a:3,why:"“不但可以听到对方的声音，还能够看到对方的模样”. B sai: hai tín hiệu <b>hợp lại</b> truyền cùng lúc."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"对于喜欢四处游玩的旅行者来说，自拍杆是个好东西，它可以让“手臂”变长，获得更好的拍摄角度。不过自拍杆有个弊病，不知道你发现没有。那就是如果自拍期间突然想拍点儿别的景色，比如正划过天空的流星，那又该怎么办呢？把自拍杆缩短，然后把相机或手机取下来，放好自拍杆，再用相机或手机来拍摄，等你弄好这些，估计流星雨早就过去了。\n怎么办呢？试试这款可以改变拍摄方向的自拍杆吧，让你360度无死角。和普通自拍杆一样，机身上有一个按键。不过这不是拍照按键，而是控制电动云台的。每按一下，云台就会旋转180度，自拍还是拍他人一眨眼就能搞定。再也不用担心错过转瞬即逝的流星了。",qs:[{n:11,q:"传统自拍杆有什么优点？",o:["增加了人们的身高","帮助人们四处游玩","让人们360度无死角","让人获得更好的拍摄角度"],a:3,why:"“让‘手臂’变长，获得更好的拍摄角度”. C là ưu điểm của <b>gậy mới</b>."},{n:12,q:"传统自拍杆的弊病是什么？",o:["不能缩短","不方便携带","不能改变拍摄的方向","不容易把相机取下来"],a:2,why:"Muốn chụp cảnh khác phải tháo ra → không đổi được hướng chụp."},{n:13,q:"新款自拍杆有什么特点？",o:["方便大家进行自拍","机身上有拍照按键","一眨眼就能结束拍摄","能快速改变拍摄角度"],a:3,why:"Nút xoay 180° — “一眨眼就能搞定”. B sai: “这不是拍照按键”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"机器人是人类发明的最复杂的自动化机器之一，它能够帮助人们做很多事情。机器人干起活来又快又准，而且它不怕脏不怕累，因此应用很广泛。\n一说到机器人，你可能会想到电视中那种跟人一样有鼻子、眼睛的机器。其实，现代机器人大多还没有达到这种逼真的程度，它们不仅没有鼻子、眼睛，甚至也没有胳膊和腿。它们有的像机器，有的像怪物，有的脑袋又尖又长，有的三头六臂。真是千奇百怪。\n机器人刚造出来的时候，只有一只手臂，称为“机器手”。机器手是个相当复杂的装置。大多数机器人的手臂都像人的手臂一样，能够进行弯曲和翻转，还能够夹住东西。\n现在已经有可以用来处置炸弹的机器人。这种机器人体内安置了一个摄像机，当机器人用专门的开启装置打开包裹时，工作人员可以通过摄像机进行观察，然后通过遥控来指挥拆除炸弹。这种机器人可以帮助人类有效打击恐怖袭击，保卫我们安宁的生活。",qs:[{n:14,q:"以下哪一项不是机器人的优点？",o:["干活又快又准","不怕脏不怕累","应用非常广泛","结构最为复杂"],a:3,why:"“最复杂的……之一” là đặc điểm, không phải ưu điểm."},{n:15,q:"根据本文，机器人是什么样子的？",o:["有鼻子、眼睛","有胳膊有腿","千奇百怪","跟人一样"],a:2,why:"“真是千奇百怪”."},{n:16,q:"根据本文，机器手有什么功能？",o:["能够拍照、摄像","能够弯曲、翻转","能够读书、写字","能够踢球、游泳"],a:1,why:"“能够进行弯曲和翻转，还能够夹住东西”."},{n:17,q:"怎么通过机器人处置炸弹？",o:["通过电子眼处置炸弹","用三头六臂打开包裹","通过摄像机观察后遥控拆弹","用手臂弯曲翻转，夹住炸弹"],a:2,why:"“通过摄像机进行观察，然后通过遥控来指挥拆除炸弹”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["如果心里有憋闷的事，他就随时向老伴儿诉说。","我妈妈是个有耐性的人，却我爸爸一点儿耐性也没有。","宽容是一首优美动听的歌，它给宽容的人带来好心情。","冰冷刺骨的海水没有让他退却，反而使他产生了更旺盛的斗志。"],a:1,why:"<b>Sai vị trí liên từ</b>: <span class='zh'>却</span> là phó từ, đứng <b>sau chủ ngữ</b> → <span class='zh'>可我爸爸 / 我爸爸却……</span>."},{n:19,o:["机会都在等待中失去了，事不宜迟，说干就干。","他简直成了一台麻木的机器，在那儿机械地运转。","听到小鸟放在笼子里被饿死的消息，他大哭起来。","因为我们的语言没有声调，所以我们说汉语很不好。"],a:3,why:"<b>Quan hệ nhân quả không hợp lý</b>: tiếng mẹ đẻ không có thanh điệu không phải nguyên nhân tất yếu → <span class='zh'>说汉语的声调很不好</span>."},{n:20,o:["在西双版纳旅游时，我坐出租汽车二十个小时。","我们要防止片面地、孤立地、静止地研究心理现象。","在主要大都市出现了不同往常的人口明显减少的局面。","只要把握好生命的每一分钟，也就把握了理想的人生。"],a:0,why:"<b>Sai trật tự bổ ngữ thời lượng</b>: <span class='zh'>坐了二十个小时的出租汽车</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"斜阳岛好像一___盛开的莲花，仅有的几十户人家生活在莲花的蕊中。从海边走向花蕊中的渔村，那真是我走过的最美的路。路边___野花，山上巨树参天，林间小鸟鸣叫，阳光似乎___，那时才知道为什么它叫斜阳岛。",o:["支　种满　兴高采烈","朵　开满　无处不在","束　长遍　狼吞虎咽","棵　生遍　一举两得"],a:1,why:"Lượng từ hoa: <span class='zh'>一朵莲花</span>; <span class='zh'>开满野花</span>; nắng <span class='zh'>无处不在</span> (có mặt khắp nơi)."},{n:22,text:"如何才能减少或___城市热岛效应的产生呢？一是实施城市及周边环境绿化工程。二是在现有条件上，___使用空调并给建筑物的外墙加隔热保温层，___能源的利用率，改燃煤___燃气等。",o:["停止　限制　增长　作","制止　强制　增加　是","禁止　管制　升高　成","防止　控制　提高　为"],a:3,why:"<span class='zh'>防止</span> + việc xấu sẽ xảy ra; <span class='zh'>控制使用</span>; <span class='zh'>提高……利用率</span>; <span class='zh'>改A为B</span>."},{n:23,text:"___绝大多数的人来说，要想在短时间内___自己长期形成的不良习惯并不是件容易的事。___他们已经努力尝试了很多次，想把这些不良习惯改___，但是最后的结果往往并不像他们希望的那样。",o:["对于　抛弃　尽管　掉","关于　放弃　因为　完","至于　舍弃　虽然　变","乐于　丢弃　不管　住"],a:0,why:"<span class='zh'>对于……来说</span>; <span class='zh'>抛弃……习惯</span>; <span class='zh'>尽管……但是</span>; <span class='zh'>改掉</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"很多人喜欢爬山。有的山容易爬，(24)。然而，不管多么艰难，(25)，我就是其中之一。\n爬到山顶之后干什么呢？我注意观察并总结了一下，大概有这样三种情况。\n第一种，兴高采烈，仰天大吼：“我爬到山顶了，我成功了！”\n第二种，气喘吁吁地蹲在地上，哀叹：“累个半死，出一身臭汗，(26)！”\n第三种，喜笑颜开，轻吟：“啊，风景多么迷人、多么漂亮啊！”\n最初，我是第一种人。爬上山顶后，我不管不顾，似乎天下唯我独尊，大有“一览众山小”之势，(27)。\n后来，我成了第二种人。爬上山顶后，闲情逸致荡然无存，唯一的感觉就是疲劳，甚至后悔不该登顶受罪，抱怨山上无景可看。\n现在，我是第三种人。爬上山顶后，我首先想做的不是登顶的炫耀，也不是无休止的抱怨，(28)，欣赏山腰的美景，一草一木都能看出它的味道来。\n爬山犹如人生，任何成功都不值得炫耀，再大的付出也不必抱怨，最佳状态就是学会体味、懂得欣赏。",opts:["山顶上光秃秃的，什么也没有呀","有的山则很难爬","而是浏览山下的风光","总有一些人非要爬到山顶不可","恨不能炫耀自己的伟大"],ans:{24:1,25:3,26:0,27:4,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"我们姐妹都在外地，因为距离远，很难抽出时间回家。今年秋天，母亲生日那天，我们都赶了回去。\n二姐送了母亲一款精致的智能手机，母亲拿起手机，试着拨通一个个电话，我们各自的手机都跟着及时响应，音乐声此起彼伏，十分热闹。\n这时，远在重庆上大学的小弟打来了为母亲祝福生日的电话。这个家里最小的孩子第一次独自离家，想家想得要命，他每天都会打一个电话回来，汇报自己的学习和生活情况。\n邻居李婶来串门时，母亲刚笑呵呵地接完了小弟的电话。李婶羡慕地说：“你家儿子真好呀，天天给你打电话。”\n母亲忽然叹了口气说：“孩子们倒是常和我电话联系，可我怎么感觉，这个玩意儿把孩子们一个个都变成符号了？哪里比得上你有福气，孩子离得不远，想啥时见都可以，心里多踏实啊。”\n姐妹们都在客厅里说话，我无意中听到了母亲的叹息，不由心里一阵难过。年少时，总是想着逃离，随着外出求学、工作，我们一个个扑棱着翅膀，飞得越来越远，有谁留意过，母亲在岁月的尘埃里，已经到了风烛残年。\n为了弥补这一缺憾，我忍不住跟姐妹们建议：“以后，咱们还是轮流回来伺候母亲吧。毕竟，她也是60多岁的人了。”\n姐姐和妹妹都同意了我的建议，大家悄悄制订了一个计划表，根据各自的实际情况，确定回家探望的日子，保证母亲每月都能看到我们其中的一个。\n我们不想成为手机中的数字，也不想仅仅成为母亲住在手机里的孩子，趁现在还来得及。",qs:[{n:29,q:"为什么“我们”很少回家探望母亲？",o:["因为距离远","因为工作忙","因为有手机","因为生活困难"],a:0,why:"“因为距离远，很难抽出时间回家”."},{n:30,q:"下面哪一项不符合小弟的情况：",o:["在重庆上大学","非常想家","每天都给母亲打电话","总想逃离家庭"],a:3,why:"<span class='zh'>想着逃离</span> nói về chị em “我们” lúc nhỏ, không phải em trai."},{n:31,q:"母亲为什么叹息？",o:["小儿子没回家给自己过生日","自己不会使用手机","儿女都不在身边","自己到了风烛残年"],a:2,why:"“哪里比得上你有福气，孩子离得不远……”."},{n:32,q:"“我”跟姐妹们制订了一个什么计划？",o:["经常给母亲打电话","轮流回家照顾母亲","一起外出求学、工作","成为母亲住在手机里的孩子"],a:1,why:"“咱们还是轮流回来伺候母亲吧”."}]},{ins:"第33–36题：请选出正确答案。",text:"寒冷的冬天已经过去，气温正在慢慢升高，人们的作息规律开始变化。俗话说“春困秋乏夏打盹”，春天一到，很多人明显感到四肢无力，头昏脑涨，尤其是早晨起不来床，上班总想打瞌睡，注意力分散。不过你相信吗？在换了一款闹钟之后，你就能清醒地去上班了。\n这款玩具闹钟是由专业的游戏开发商设计出的产品，最大的特点就是充满童趣，在让你快速清醒的同时还能收获一份好心情，可谓一举两得。\n首次使用闹钟时需选定一款主题，目前有三款主题样式——托马斯、梦幻公主以及风火轮，选择你喜欢的闹钟风格就好了。\n下边着手设定一下你期望的起床时间吧。和普通闹钟功能类似，这款玩具闹钟的可设置项还是比较齐全的，包括是否重复、是否需要贪睡等等，不过它最大的特色还是闹钟游戏。如果你虽然醒了但还是头昏脑涨，没事儿，来玩儿几个游戏就清醒了。根据不同的主题，闹钟内含有多款小游戏，不过玩儿法都很简单，对于还处在神游状态的用户来说设定很合理。当然只有完成了游戏任务才能关闭闹钟，不然的话它会一直在耳边发出响声直到你清醒过来。\n玩具闹钟其实更适合小朋友，游戏人物造型可爱很容易吸引孩子的注意力。它一点儿也不强迫，而是用一种温和的方式叫醒你，怎么样，还不快试试。",qs:[{n:33,q:"下列哪一项不属于春天一到，人们常有的情形？",o:["四肢无力","头昏脑涨","上班打瞌睡","快速清醒"],a:3,why:"“快速清醒” là tác dụng của đồng hồ báo thức."},{n:34,q:"这款闹钟的最大特点是什么？",o:["充满童趣","设置比较齐全","有三款主题样式","会一直发出响声"],a:0,why:"“最大的特点就是充满童趣”."},{n:35,q:"关于闹钟游戏，下列哪一项表述正确？",o:["用强迫的方式叫醒你","游戏玩儿法都很简单","不完成游戏也能关闭闹钟","可以让用户处于神游状态"],a:1,why:"“不过玩儿法都很简单”."},{n:36,q:"为什么说玩具闹钟更适合小朋友？",o:["完成游戏后才能设置","可设置是否需要贪睡","人物可爱能吸引孩子","有不同风格可以选择"],a:2,why:"“游戏人物造型可爱很容易吸引孩子的注意力”."}]}]},W:{zh:"写作",vn:"Viết văn: 如何离开手机",t:"35 phút",min:!0,task:"有人说“手机、电脑等高科技产品已经控制了人们的生活”，你是否也像这篇课文所描述的那样成了它们的奴隶？要想改变这种状况，你有什么好的建议吗？请以“如何离开手机”为题，结合自己的实际写一篇不少于300字的文章。",target:300,steps:[["Mở bài: hiện tượng","Nêu tình trạng “nô lệ điện thoại” quanh bạn — dùng <span class='zh'>离不开 · 成了……的奴隶 · 麻木</span>."],["Bản thân bạn","Thói quen của bạn: một ngày xem điện thoại bao nhiêu lần? Hậu quả: <span class='zh'>分散注意力 · 空虚得要命 · 受罪</span>."],["Đề xuất 2–3 cách","Mỗi cách một đoạn ngắn: tắt máy định kỳ, cất điện thoại xa, tìm sở thích thay thế (<span class='zh'>既……又……，一举两得</span>)."],["Kết bài","Lợi ích khi rời điện thoại: <span class='zh'>没有……的干扰 · 安宁 · 踏实 · 回归生活</span>."],["Mẫu câu bài học","<span class='zh'>难道……吗？何不……？ · 说干就干 · 索性 · ……得要命</span>."]],outline:[["一 · 提出问题","手机已经控制了我们的生活"],["二 · 我的情况","我也是手机的奴隶：看新闻、刷微信……"],["三 · 我的建议","①定时关机 ②把手机放远 ③培养爱好"],["四 · 结论","离开手机，回归生活"]],model:"如何离开手机\n现在，无论是在地铁上、饭桌上，还是在会议室里，到处都能看到埋头看手机的人。手机给我们带来了方便，可也慢慢控制了我们的生活。\n说实话，我也是手机的奴隶。早上醒来第一件事就是看手机，吃饭时要刷微信，睡觉前还要玩儿一个小时游戏。有一次手机没电了，我心里空虚得要命，什么事都做不下去。我这才发现，自己已经离不开手机了。\n离开了手机，难道就活不下去吗？当然不是。我觉得可以从下面几点做起：\n第一，定时关机。每天晚上十点以后关机，周末选一天不用手机。刚开始会很难受，但坚持一段时间就习惯了。\n第二，把手机放远一点儿。学习和工作的时候，把手机放在别的房间，这样可以防止自己分散注意力，效率会高很多。\n第三，培养一个爱好。跑步、跳舞、做饭都可以，既能娱乐身心，又能让自己没时间想手机，一举两得。\n没有手机的干扰，我们才能真正和家人朋友聊天，看看身边的风景。说干就干，何不从今天就开始呢？",check:["Có tiêu đề “如何离开手机”","Nêu hiện tượng / tình trạng của bản thân","Có ít nhất 2 đề xuất cụ thể","Có kết luận","Dùng ít nhất 3 mẫu: 难道……吗 · 何不 · 说A就A · 索性 · 得要命 · 既……又……","Không ít hơn 300 chữ"]},SUM:{words:["正经","绑架","受罪","奴隶","麻木","狼吞虎咽","伺候","索性","着手","安置","防止","薄弱","分散","僵硬","兴高采烈","一举两得","冷落","踏实","空虚","要命","消耗","弥补","弥漫","往常","震惊","干扰","安宁"],patterns:[["通红 / 雪白（状态形容词）","我脸憋得通红。"],["说A就A","说干就干，索性这礼拜就开始。"],["难道……吗？何不……？","离开了手机，难道会死吗？何不尝试一下一周关机一天？"],["既……又……，一举两得","既能娱乐身心，又能锻炼身体，一举两得。"],["Adj + 得 + 要命","五个小时没碰它，我心空虚得要命。"]],diff:["索性：chỉ là phó từ — 干脆：phó từ + tính từ (很干脆 · 干脆点儿 · 干脆地拒绝)","通红 · 雪白 · 冰凉 · 笔直：không thêm 很 / 极了; lặp ABAB · 安宁 = yên bình ≠ “an ninh” · 伺候 cì · 着手 zhuó · 薄弱 bó"],sentences:["你们呀，都让手机给绑架了，这么过日子，不受罪吗？","为了防止自己意志薄弱，我找来个精致的盒子，把手机层层包好，庄重地放在盒子里。","没有手机的干扰，生活这么安宁，我突然有了一种回归生活的欣慰。"],hw:["Học thuộc 47 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “如何离开手机” không ít hơn 300 chữ (mục 7).","Làm Sách bài tập bài 9.","Đọc trước bài 10 《全球化视野中的中国饮食》."]}});
