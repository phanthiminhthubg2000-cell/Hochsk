<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 5 · 学一门外语需要理由吗？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}

<script>window.LESSON={id:"hsk6-1-05",num:5,book:"HSK 标准教程 6（上）",unit:{n:2,zh:"不甘平庸",vn:"Không cam chịu tầm thường"},title:"学一门外语需要理由吗？",vn:"Học ngoại ngữ cần lý do ư?",chars:832,source:"改编自《北京青年报》同名文章，作者：孙小宁",goals:["Đọc hiểu bài 832 chữ — trải nghiệm hài hước của một người học ngoại ngữ “vì thích” bị trung tâm hỏi dồn về <b>mục tiêu</b>.","Dùng được 44 từ mới, đặc biệt nhóm từ <b>thái độ – tâm lý</b>: <span class='zh'>迫不及待 · 兴致勃勃 · 反感 · 忍耐 · 崩溃 · 果断 · 津津有味</span>.","Nắm <span class='zh'>而已 · 固然 · 无非</span> và các mẫu <span class='zh'>为……着想，以…… · V着V着 · ……的方面……，……在于……</span>","Phân biệt <span class='zh'>专程 — 专门</span>; nhận diện câu sai loại <b>thiếu thành phần</b> (成分残缺).","Làm khảo sát nhỏ “Bạn học ngoại ngữ để làm gì?” và viết <b>báo cáo khảo sát</b> ≥300 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (专程—专门 · 为…着想 · 而已 · 固然 · 无非) · Bài khóa đoạn 1–12"],["Buổi 2","Từ vựng nhóm 3 (……的方面……在于……) · Đoạn 13–14 · Bài tập · 成分残缺 · Luyện đề · Báo cáo khảo sát"]],outline:[{tag:"起",name:"Mở đầu",paras:"Đoạn 1",zh:"想学外语，兴致勃勃去语言机构咨询",vn:"Muốn tự đọc nguyên tác, “tôi” hào hứng tìm đến một trung tâm ngoại ngữ."},{tag:"承",name:"Va chạm",paras:"Đoạn 2–12",zh:"被接连追问学习目标，“我”反感、崩溃，果断离开",vn:"Bị hỏi dồn “học để làm gì” — từ bực bội, được đồng cảm rồi lại bị nói “chỉ dựa vào hứng thú khó bền” — “tôi” dứt khoát bỏ về."},{tag:"转",name:"Chuyển hướng",paras:"Đoạn 13",zh:"改为在线学习，心里舒服",vn:"Chuyển sang học online: giảng kỹ, không ai ép, không ai hỏi chuyện riêng."},{tag:"合",name:"Đánh giá",paras:"Đoạn 14",zh:"利弊权衡，利大于弊，享受学习",vn:"Cân nhắc lợi hại: lợi nhiều hơn hại — quan trọng là tận hưởng niềm vui học."}],warm1:{q:"你为什么学习汉语？请从下面的选项中找出答案，如果都不是你的答案，请在横线上补充说明。",vn:"Bạn học tiếng Trung vì sao? Chọn trong các đáp án; nếu không có, hãy bổ sung.",items:[["💼","为了找工作　·　大学的专业是中文","Để tìm việc · Chuyên ngành đại học là tiếng Trung"],["✈️","为了在中国旅行　·　我有中国朋友","Để du lịch Trung Quốc · Có bạn người Trung Quốc"],["💡","对汉语感兴趣　·　为了显得很酷","Thích tiếng Trung · Để trông “ngầu”"]],talk:["其他原因：______","学一门外语一定要有明确的目标吗？"],link:"Nhân vật trong bài chỉ có lý do “<b>thích</b>” — và bị trung tâm ngoại ngữ cho rằng như thế là <b>không đủ</b>. Bạn đứng về phía ai?"},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"原",rule:"原 = <b>ban đầu, gốc, nguyên</b>.",w:[["原文","yuánwén","nguyên văn (có trong bài)"],["原来","yuánlái","vốn dĩ, hóa ra"],["原先","yuánxiān","trước kia (bài 3)"],["原地","yuándì","tại chỗ"],["原因","yuányīn","nguyên nhân"],["原有","yuányǒu","vốn có"],["原价","yuánjià","giá gốc"],["原版","yuánbǎn","bản gốc"],["原始","yuánshǐ","nguyên thủy"],["原形","yuánxíng","nguyên hình"],["原状","yuánzhuàng","trạng thái ban đầu"],["原意","yuányì","ý ban đầu"]]},{k:"员",rule:"员 = <b>người làm một việc / thành viên</b> của tổ chức.",w:[["学员","xuéyuán","học viên (có trong bài)"],["服务员","fúwùyuán","nhân viên phục vụ"],["售货员","shòuhuòyuán","người bán hàng"],["售票员","shòupiàoyuán","người bán vé"],["演员","yǎnyuán","diễn viên"],["人员","rényuán","nhân sự"],["职员","zhíyuán","nhân viên"],["运动员","yùndòngyuán","vận động viên"],["店员","diànyuán","nhân viên cửa hàng"],["船员","chuányuán","thủy thủ"],["员工","yuángōng","nhân viên"]]},{k:"力",rule:"力 = <b>sức, lực</b>.",w:[["动力","dònglì","động lực (từ mới)"],["精力","jīnglì","tinh lực"],["能力","nénglì","năng lực"],["压力","yālì","áp lực"],["财力","cáilì","tài lực"],["脑力","nǎolì","trí lực"],["体力","tǐlì","thể lực"],["听力","tīnglì","nghe hiểu"],["努力","nǔlì","nỗ lực"],["尽力","jìnlì","cố hết sức"],["出力","chūlì","góp sức"],["用力","yònglì","dùng sức"],["力气","lìqi","sức lực"],["力量","lìliàng","sức mạnh"]]},{k:"久",rule:"久 = <b>lâu</b>.",w:[["持久","chíjiǔ","lâu bền (từ mới)"],["悠久","yōujiǔ","lâu đời"],["不久","bùjiǔ","không lâu"],["长久","chángjiǔ","lâu dài"],["多久","duōjiǔ","bao lâu"],["好久","hǎojiǔ","lâu lắm"],["许久","xǔjiǔ","rất lâu"],["永久","yǒngjiǔ","vĩnh cửu"],["久远","jiǔyuǎn","xa xưa"],["久别","jiǔbié","xa cách lâu"],["日久天长","rì jiǔ tiān cháng","ngày tháng dài lâu"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–4",sub:"Đến trung tâm ngoại ngữ",from:1,to:18},{name:"Nhóm 2 · Đoạn 5–12",sub:"Cuộc “thẩm vấn” về mục tiêu",from:19,to:33},{name:"Nhóm 3 · Đoạn 13–14",sub:"Học online — lợi và hại",from:34,to:44}],V:[[1,"迫不及待","pòbùjídài","thành ngữ","bách bất cập đãi","nóng lòng, không chờ nổi",1,"成","急迫得不能再等待。","迫不及待地想不再依靠翻译","一放学，孩子们就迫不及待地跑出了教室。","Vừa tan học, bọn trẻ đã nóng lòng chạy ùa ra khỏi lớp.",["迫不及待地……"],"Làm trạng ngữ: <span class='zh'>迫不及待地 + V</span>. Bài tập 3①."],[2,"依靠","yīkào","đgt.","y kháo","dựa vào",1,"","指望（别的人或事物来达到一定目的）；也作名词。","不再依靠翻译","我们不能总依靠父母。","Chúng ta không thể mãi dựa vào bố mẹ.",["依靠自己","依靠别人","生活的依靠"],"Bài tập 3②."],[3,"借助","jièzhù","đgt.","tá trợ","nhờ vào, mượn",1,"书","靠别的人或事物的帮助。","借助字典勉强查阅","借助望远镜，我们看清了远处的山。","Nhờ ống nhòm, chúng tôi nhìn rõ ngọn núi đằng xa.",["借助……","借助工具"],"Tân ngữ thường là <b>công cụ, phương tiện</b>: <span class='zh'>借助字典 / 网络 / 翻译软件</span>."],[4,"勉强","miǎnqiǎng","tt.","miễn cưỡng","gắng gượng; miễn cưỡng",1,"","能力不够还尽力做；不是甘心情愿的。","借助字典勉强查阅","他病还没好，勉强来上班了。","Anh ấy chưa khỏi bệnh, cố gượng đi làm.",["勉强同意","勉强接受","不要勉强"],"Còn là động từ = ép: <span class='zh'>别勉强他</span>. SBT câu 8: <span class='zh'>读书不能勉强</span>."],[5,"机构","jīgòu","dt.","cơ cấu","cơ quan, tổ chức",1,"","机关、团体等工作单位；也指其内部组织。","一家语言学习机构","这是一家国际教育机构。","Đây là một tổ chức giáo dục quốc tế.",["培训机构","政府机构","金融机构"],""],[6,"栋","dòng","lượng.","đống","tòa (nhà)",1,"","房屋一座叫一栋。","一栋办公楼","小区里有二十多栋楼。","Khu dân cư có hơn hai mươi tòa nhà.",["一栋楼","一栋房子"],"Bài tập 3①."],[7,"兴致勃勃","xìngzhì bóbó","thành ngữ","hứng trí bột bột","hào hứng bừng bừng",1,"成","兴头很足。","这天我兴致勃勃地专程前去咨询","孩子们兴致勃勃地参观了动物园。","Bọn trẻ hào hứng tham quan vườn thú.",["兴致勃勃地……"],"⚠️ 兴 đọc <b>xìng</b>. Bài tập 3①."],[8,"专程","zhuānchéng","phó.","chuyên trình","chuyên đi, đi riêng để",1,"","专门为某事而去某地。","专程前去咨询","他专程从上海赶来参加婚礼。","Anh ấy cất công từ Thượng Hải đến dự đám cưới.",["专程赶来","专程拜访"],"Xem <b>辨析 专程—专门</b>."],[9,"修养","xiūyǎng","dt.","tu dưỡng","sự tu dưỡng, cách cư xử",1,"","指理论、知识、艺术、思想等方面达到的水平；养成的待人处事的正确态度。","一位很有修养的女士","他是一个很有修养的人，从不说粗话。","Anh ấy là người có giáo dưỡng, chưa từng nói tục.",["有修养","文化修养","艺术修养"],""],[10,"接连","jiēlián","phó.","tiếp liên","liên tiếp, liên tục",1,"","一个跟着一个。","接连不断的发问","他接连三次获得冠军。","Anh ấy liên tiếp ba lần đoạt chức vô địch.",["接连不断","接连几天"],"Bài tập 3①: <span class='zh'>惊喜接连不断</span>."],[11,"涉及","shèjí","đgt.","thiệp cập","liên quan đến, động chạm đến",1,"书","牵涉到；关联到。","她的问题涉及了我的隐私","这个问题涉及很多方面。","Vấn đề này liên quan đến nhiều mặt.",["涉及……问题","涉及面广"],""],[12,"隐私","yǐnsī","dt.","ẩn tư","đời tư, chuyện riêng",1,"","不愿告诉别人或不愿公开的个人的事。","涉及了我的隐私","我们应该尊重别人的隐私。","Chúng ta nên tôn trọng đời tư người khác.",["个人隐私","保护隐私","侵犯隐私"],"SBT câu 6–10: <span class='zh'>这不是隐私吧？</span>"],[13,"反感","fǎngǎn","tt.","phản cảm","ác cảm, khó chịu",1,"","反对或不满的情绪；也作动词。","我很反感","他说话的态度让人很反感。","Thái độ nói chuyện của anh ta khiến người ta khó chịu.",["很反感","引起反感","对……反感"],"⚠️ Khác “phản cảm” trong tiếng Việt (hơi nặng): <span class='zh'>反感</span> = <b>không ưa, bực</b>."],[14,"火药","huǒyào","dt.","hỏa dược","thuốc súng",1,"","炸药的一类，中国古代四大发明之一。","话也变得火药味十足","火药是中国古代四大发明之一。","Thuốc súng là một trong bốn phát minh lớn của TQ cổ đại.",["火药味"],"<span class='zh'>火药味十足</span> = (lời nói) nồng mùi thuốc súng — gay gắt, sẵn sàng cãi nhau."],[15,"忍耐","rěnnài","đgt.","nhẫn nại","nhẫn nhịn, kiềm chế",1,"","把痛苦的感觉或某种情绪抑制住不使表现出来。","她极力忍耐着","再忍耐一下，马上就到了。","Cố nhịn thêm chút nữa, sắp đến rồi.",["极力忍耐","忍耐不住","忍耐力"],"<span class='zh'>极力忍耐着</span> = cố hết sức nhẫn nhịn."],[16,"着想","zhuóxiǎng","đgt.","trước tưởng","nghĩ cho, lo cho",1,"","（为某人或某事的利益）考虑。","为学员着想","他总是为别人着想。","Anh ấy luôn nghĩ cho người khác.",["为……着想"],"⚠️ 着 đọc <b>zhuó</b>. Luôn dùng trong khung <span class='zh'>为……着想</span>. Bài tập 2①."],[17,"策划","cèhuà","đgt.","sách hoạch","lên kế hoạch, trù tính",1,"","筹划，谋划。","帮他策划学习方案","这次活动是由他策划的。","Hoạt động lần này do anh ấy lên kế hoạch.",["策划活动","精心策划","策划人"],""],[18,"达成","dáchéng","đgt.","đạt thành","đạt được",1,"书","达到，得到（多指商谈后得到结果）。","以达成他的目标","双方达成了协议。","Hai bên đã đạt được thỏa thuận.",["达成协议","达成共识","达成目标"],""],[19,"口气","kǒuqì","dt.","khẩu khí","giọng, giọng điệu",1,"","说话的气势；言外之意；说话时流露出来的感情色彩。","使自己的口气缓和下来","他用命令的口气跟我说话。","Anh ta nói với tôi bằng giọng ra lệnh.",["口气缓和","命令的口气","口气很大"],"Bài 2 SBT: <span class='zh'>不要用命令的口气对孩子说话</span>."],[20,"缓和","huǎnhé","tt.","hoãn hòa","dịu đi, hòa hoãn",1,"","（局势、气氛等）和缓；也作动词：使和缓。","使自己的口气缓和下来","两国关系有所缓和。","Quan hệ hai nước đã dịu bớt.",["缓和气氛","缓和下来","局势缓和"],""],[21,"随意","suíyì","tt.","tùy ý","tùy ý, tùy thích",1,"","任凭自己的意思。","随意学学而已","请随意，别客气。","Cứ tự nhiên, đừng khách sáo.",["随意学学","随意地说","请随意"],""],[22,"而已","éryǐ","trợ.","nhi dĩ","mà thôi",1,"书","用在陈述句末尾，有把事情往小里说的意味。","随意学学而已","我只是随便问问而已。","Tôi chỉ hỏi chơi vậy thôi.",["不过……而已","只是……而已"],"Xem <b>Ngữ pháp 1</b>."],[23,"设置","shèzhì","đgt.","thiết trí","thiết lập, sắp đặt",1,"","设立；安排。","我们的班都是根据学员的具体情况设置的","学校设置了很多选修课。","Trường mở nhiều môn tự chọn.",["设置课程","设置目标","设置密码"],"Bài tập 3②."],[24,"动力","dònglì","dt.","động lực","động lực",1,"","推动工作、事业等前进和发展的力量。","没有目标就缺乏动力","兴趣是学习最好的动力。","Hứng thú là động lực học tập tốt nhất.",["学习动力","缺乏动力","动力十足"],"Bài tập 3②."],[25,"固然","gùrán","liên.","cố nhiên","tất nhiên, tuy là",1,"书","表示承认某个事实，引起下文转折或补充。","这道理我固然懂，可是……","钱固然重要，但健康更重要。","Tiền tuy quan trọng, nhưng sức khỏe còn quan trọng hơn.",["固然……但是……","固然……也……"],"Xem <b>Ngữ pháp 2</b>."],[26,"恳切","kěnqiè","tt.","khẩn thiết","tha thiết, chân thành",1,"书","诚恳而殷切。","真诚恳切","他恳切地希望大家能原谅他。","Anh ấy tha thiết mong mọi người tha thứ.",["态度恳切","言辞恳切"],""],[27,"无非","wúfēi","phó.","vô phi","chẳng qua là",1,"","只，不过（把事情往小里说）。","学习语言无非是为了看原文电影、读文学作品","他说这些话，无非是想让你高兴。","Anh ấy nói vậy chẳng qua muốn bạn vui.",["无非是……","无非……而已"],"Xem <b>Ngữ pháp 3</b>."],[28,"知音","zhīyīn","dt.","tri âm","tri âm, tri kỷ",0,"","指了解自己、懂得自己心意的朋友。","终于碰上了知音","人生得一知音足矣。","Đời người có được một tri âm là đủ.",["碰上知音","人生知音"],"* Ngoài đề cương. Điển cố Bá Nha – Tử Kỳ (伯牙子期)."],[29,"客户","kèhù","dt.","khách hộ","khách hàng",1,"","企业或经纪人称来往的主顾。","我碰到过您这样的客户","我们要为客户提供优质的服务。","Chúng ta phải cung cấp dịch vụ tốt cho khách hàn 工作薪水不高，但是很稳定。","Công việc này lương không cao nhưng ổn định.",["薪水高","发薪水"],"Đồng nghĩa: <span class='zh'>工资 · 薪酬 · 收入</span>."],[39,"弊端","bìduān","dt.","tệ đoan","mặt hại, tệ nạn",1,"书","由于工作上有漏洞而发生的损害公益的事情；坏处。","当然弊端也不少","这种制度有很多弊端。","Chế độ này có nhiều điểm hạn chế.",["存在弊端","利与弊","消除弊端"],"<span class='zh'>利弊</span> = lợi và hại. Mở rộng 2: <span class='zh'>弊病 — 弊端</span>."],[40,"拼命","pīnmìng","phó.","bính mệnh","liều mạng, dốc sức",1,"","尽最大的力量；极度地。","高兴了拼命学一阵子","为了考上大学，他每天拼命学习。","Để đỗ đại học, ngày nào cậu ấy cũng học như điên.",["拼命工作","拼命地跑"],"Còn là động từ ly hợp: <span class='zh'>跟他拼命</span> (liều mạng với hắn)."],[41,"搁","gē","đgt.","các","đặt, để; gác lại",1,"口","放；放下，暂停进行。","不高兴了就搁在一边","把书搁在桌子上吧。","Để sách lên bàn đi.",["搁在一边","搁下","耽搁"],"<span class='zh'>搁在一边</span> = gác sang một bên. SBT 14–17: <span class='zh'>学了就搁在一边，等于没学</span>."],[42,"颠倒","diāndǎo","đgt.","điên đảo","đảo lộn, ngược",1,"","上下、前后跟原有的或应有的位置相反。","有时还前后颠倒","你把顺序弄颠倒了。","Bạn làm đảo lộn thứ tự rồi.",["前后颠倒","颠倒黑白","颠倒是非"],""],[43,"权衡","quánhéng","đgt.","quyền hành","cân nhắc",1,"书","衡量，比较。","利弊权衡，利还是大于弊","经过一番权衡，他决定接受这份工作。","Sau một phen cân nhắc, anh ấy quyết định nhận việc.",["权衡利弊","反复权衡"],"<span class='zh'>权衡利弊</span> là cụm cố định."],[44,"津津有味","jīnjīn yǒu wèi","thành ngữ","tân tân hữu vị","say sưa, ngon lành",1,"成","形容吃得很有滋味或谈得很有兴趣。","津津有味地享受学习","孩子们津津有味地听着故事。","Bọn trẻ say sưa nghe kể chuyện.",["吃得津津有味","听得津津有味"],"Dùng cho ăn, nghe, đọc, nói chuyện — đều “ngon lành, say sưa”."]],extra:[["原文","yuánwén","nguyên văn, bản gốc"],["查阅","cháyuè","tra cứu"],["咨询","zīxún","tư vấn, hỏi ý kiến"],["学员","xuéyuán","học viên"],["插班","chā bān","vào học giữa chừng"],["欢天喜地","huāntiān-xǐdì","vui mừng hớn hở"],["绕回来","rào huilai","vòng trở lại"],["不死心","bù sǐxīn","chưa cam lòng"],["死角","sǐjiǎo","góc khuất, điểm mù"],["硬逼着","yìng bīzhe","ép buộc"],["忘我","wàngwǒ","quên mình, say mê"]],T:[{zh:"我想学一门外语，迫不及待地想不再依靠翻译，独自阅读原文，哪怕是借助字典勉强查阅呢。我很快找到了一家语言学习机构，它在离我家不远的一栋办公楼上。这天我兴致勃勃地专程前去咨询。",vn:"Tôi muốn học một ngoại ngữ, nóng lòng muốn không phải dựa vào bản dịch nữa mà tự mình đọc nguyên tác, dù chỉ là nhờ từ điển gắng gượng tra cứu. Tôi nhanh chóng tìm được một trung tâm ngoại ngữ, nằm trong một tòa văn phòng không xa nhà. Hôm ấy tôi hào hứng cất công đến tư vấn.",idea:"Muốn tự đọc nguyên tác, “tôi” hào hứng tìm trung tâm ngoại ngữ.",q:["“我”为什么想学外语？","“我”去语言机构时心情怎么样？"],note:[["哪怕是借助字典勉强查阅呢","<span class='zh'>哪怕……呢</span> = dù là… cũng được — nhấn mạnh mong muốn mạnh mẽ."],["迫不及待 · 兴致勃勃","Hai thành ngữ bốn chữ miêu tả tâm trạng hăm hở — đối lập với <span class='zh'>崩溃</span> ở đoạn 11."]]},{zh:"进了门，一位很有修养的女士迎上来，我以为交了学费就能开始快乐而美好的学习了，不料首先面对的是她接连不断的发问：“为什么要学外语？最近有出国计划吗？职业是什么？”",vn:"Vào cửa, một người phụ nữ rất lịch thiệp ra đón. Tôi tưởng đóng học phí xong là có thể bắt đầu việc học vui vẻ và tốt đẹp, không ngờ điều đầu tiên phải đối mặt là những câu hỏi liên tiếp không ngừng của chị ấy: “Vì sao học ngoại ngữ? Gần đây có kế hoạch ra nước ngoài không? Nghề nghiệp là gì?”",idea:"Bị hỏi dồn dập về lý do học.",q:["“我”原来以为会怎么样？实际上遇到了什么？"],note:[["我以为……，不料……","<span class='zh'>以为</span> (tưởng — mà thực tế không phải) + <span class='zh'>不料</span> (bài 4) — tạo bất ngờ."]]},{zh:"“这很重要吗？”说实在的，她的问题涉及了我的隐私，我很反感，话也变得火药味十足。",vn:"“Điều đó quan trọng lắm sao?” Nói thật, câu hỏi của chị ấy động chạm đến đời tư tôi, tôi rất khó chịu, lời nói cũng trở nên nồng mùi thuốc súng.",idea:"“Tôi” khó chịu vì bị hỏi chuyện riêng.",q:["“我”为什么反感？"],note:[["话也变得火药味十足","Ẩn dụ <span class='zh'>火药味</span> + <span class='zh'>十足</span> (bài 1) = lời nói gay gắt, sẵn sàng “nổ”."]]},{zh:"她极力忍耐着，“是这样，我必须了解学员，为学员着想，帮他策划学习方案，以达成他的目标。”",vn:"Chị ấy cố hết sức kiềm chế: “Là thế này, tôi phải hiểu học viên, nghĩ cho học viên, giúp họ lên phương án học tập, để đạt được mục tiêu của họ.”",idea:"Trung tâm giải thích: phải hiểu học viên để lập kế hoạch.",q:["那位女士为什么要问这些问题？"],note:[["我必须……，为……着想，帮……，以……","Chuỗi mục đích <span class='zh'>为……着想 · 帮…… · 以……</span> — xem <b>Bài tập 4①</b>. <span class='zh'>以</span> = để (văn viết)."]]},{zh:"我努力使自己的口气缓和下来：“我没什么具体目标。就是找一个班插班听课，随意学学而已。”",vn:"Tôi cố làm giọng mình dịu xuống: “Tôi không có mục tiêu cụ thể gì. Chỉ là tìm một lớp vào học ké, học tùy hứng thế thôi.”",idea:"“Tôi” nói mình chỉ học cho vui.",q:["“我”学外语有具体目标吗？"],note:[["随意学学而已","<span class='zh'>V V + 而已</span>: nói nhẹ đi — “học chơi thôi”. Xem Ngữ pháp 而已."]]},{zh:"“可是，我们的班都是根据学员的具体情况设置的，如果您没有具体目标，是学不好一种语言的。”",vn:"“Nhưng lớp của chúng tôi đều được thiết kế theo tình hình cụ thể của học viên. Nếu anh/chị không có mục tiêu cụ thể thì sẽ không học tốt một ngôn ngữ được.”",idea:"Trung tâm khẳng định: không mục tiêu thì không học tốt.",q:["机构的班是怎么设置的？"],note:[["是学不好一种语言的","<span class='zh'>是……的</span> nhấn mạnh nhận định, giọng chắc chắn."]]},{zh:"没有目标就缺乏动力，这道理我固然懂，可是，我的确说不出她所说的目标。我说我回去想想。",vn:"Không có mục tiêu thì thiếu động lực — đạo lý này tôi đương nhiên hiểu, nhưng tôi thật sự không nói ra được cái mục tiêu chị ấy nói. Tôi bảo để tôi về nghĩ đã.",idea:"“Tôi” hiểu đạo lý nhưng không nói ra được mục tiêu.",q:["“我”同意“没有目标就缺乏动力”吗？"],note:[["这道理我固然懂，可是，……","<span class='zh'>固然……，可是……</span>: thừa nhận một điều rồi chuyển ý. Xem Ngữ pháp 固然."]]},{zh:"“您等一下。”她迅速出门，瞬间换来了一位男士。“您学这门语言是为了……”他态度和蔼，真诚恳切，我被打动了，跟他滔滔不绝起来：“我喜欢这个国家的文化，学习语言无非是为了看原文电影、读文学作品……”",vn:"“Anh/chị đợi chút.” Chị ấy nhanh chóng ra ngoài, thoáng chốc đã đổi một người đàn ông vào. “Anh/chị học ngôn ngữ này là để…” Anh ấy thái độ hòa nhã, chân thành tha thiết, tôi bị lay động, bắt đầu thao thao bất tuyệt với anh ấy: “Tôi thích văn hóa nước này, học ngôn ngữ chẳng qua để xem phim, đọc tác phẩm văn học bản gốc…”",idea:"Một người khác ân cần hỏi — “tôi” mở lòng.",q:["那位男士的态度怎么样？","“我”学这门语言是为了什么？"],note:[["学习语言无非是为了……","<span class='zh'>无非是</span> = chẳng qua là (nói nhẹ lý do). Xem Ngữ pháp 无非."],["和蔼 · 滔滔不绝","Ôn lại từ bài 2 (和蔼) và bài 1 (滔滔不绝)."]]},{zh:"“明白了。不想通过翻译，直接进入原文的世界？”",vn:"“Hiểu rồi. Không muốn qua bản dịch, mà trực tiếp bước vào thế giới nguyên tác?”",idea:"Anh ấy tóm tắt đúng ý “tôi”.",q:["男士理解“我”的想法吗？"],note:[]},{zh:"“对！”我欢天喜地，终于碰上了知音。",vn:"“Đúng!” Tôi mừng rỡ hớn hở, cuối cùng cũng gặp được tri âm.",idea:"“Tôi” mừng vì gặp người hiểu mình.",q:["“我”为什么欢天喜地？"],note:[["终于碰上了知音","<span class='zh'>碰上</span> = tình cờ gặp. <span class='zh'>知音</span> — điển tích Bá Nha – Tử Kỳ."]]},{zh:"“我碰到过您这样的客户，可是，光凭兴趣，恐怕难以持久。”我顿时崩溃了，怎么说着说着又绕回来了。",vn:"“Tôi từng gặp những khách hàng như anh/chị, nhưng chỉ dựa vào hứng thú thì e là khó bền.” Tôi lập tức “sụp đổ” — sao nói tới nói lui lại vòng về chỗ cũ.",idea:"Lại bị nói “chỉ thích thì khó bền” — “tôi” suy sụp.",q:["男士的看法和女士有什么相同的地方？","“我”为什么崩溃了？"],note:[["光凭兴趣，恐怕难以持久","<span class='zh'>光凭</span> = chỉ dựa vào; <span class='zh'>难以 + V</span> = khó mà…"],["怎么说着说着又绕回来了","<span class='zh'>V着V着</span> = đang… thì (chuyển biến bất ngờ). Xem Ngữ pháp & Bài tập 2⑥."]]},{zh:"我果断地站起来，斩钉截铁地表明要走。",vn:"Tôi dứt khoát đứng dậy, như đinh đóng cột nói rõ là mình phải đi.",idea:"“Tôi” dứt khoát bỏ về.",q:["“我”最后怎么做的？"],note:[["果断地……，斩钉截铁地……","Hai trạng ngữ cùng nghĩa “dứt khoát” — nhấn quyết tâm."]]},{zh:"回家后，我不死心，开始在网上找在线学习。后来发现有一家，还真不错，从基础教起，每个句子的语法都详细讲解，不留死角，和我的思维很搭。更重要的是心里舒服——没有人硬逼着我执行学习计划，也没人问我为啥要学它，以及我的单位、身份，包括薪水——我就是个语言学习者，你管我这些干吗？",vn:"Về nhà, tôi chưa cam lòng, bắt đầu tìm học trực tuyến trên mạng. Sau đó phát hiện một trang khá tốt: dạy từ cơ bản, ngữ pháp từng câu đều giảng chi tiết, không bỏ sót góc nào, rất hợp với lối tư duy của tôi. Quan trọng hơn là thấy thoải mái — không ai ép tôi thực hiện kế hoạch học, cũng không ai hỏi tôi học để làm gì, cơ quan, thân phận, cả lương bổng — tôi chỉ là một người học ngôn ngữ, các người quản mấy chuyện đó làm gì?",idea:"Chuyển sang học online — hợp tư duy, thoải mái, không bị hỏi han.",q:["“我”选择了什么学习方式？","在线学习有哪些好处？"],note:[["没有人硬逼着我……，也没人问我……，以及……，包括……","Liệt kê dài với <span class='zh'>以及 · 包括</span> + dấu gạch ngang — giọng bực bội, hài hước."],["你管我这些干吗？","Câu hỏi tu từ khẩu ngữ = không phải việc của anh."]]},{zh:"我的学习方式绝对对学习效果有利，当然弊端也不少：有利的方面如上所说，弊端在于高兴了拼命学一阵子，不高兴了就搁在一边。有时还前后颠倒，因为后面那课的话题太诱惑我了。但是，利弊权衡，利还是大于弊。因为我总能在忘我的快乐中，津津有味地享受学习。",vn:"Cách học của tôi chắc chắn có lợi cho hiệu quả học tập, đương nhiên mặt hạn chế cũng không ít: mặt lợi như đã nói ở trên, còn mặt hại ở chỗ vui thì học cật lực một thời gian, không vui thì gác sang một bên. Có khi còn học lộn thứ tự, vì chủ đề bài sau hấp dẫn tôi quá. Nhưng cân nhắc lợi hại, lợi vẫn lớn hơn hại. Bởi tôi luôn được say sưa tận hưởng việc học trong niềm vui quên cả bản thân.",idea:"Tự đánh giá: có lợi có hại, nhưng lợi lớn hơn — vì được tận hưởng.",q:["“我”的学习方式有什么利弊？","你同意作者的看法吗？"],note:[["绝对……，当然……也……：有利的方面……，弊端在于……","Khung <b>đánh giá lợi – hại</b>, rất hữu ích cho văn nghị luận. Xem <b>Bài tập 4②</b>."],["利弊权衡，利还是大于弊","<span class='zh'>A 大于 B</span> = A lớn hơn B (văn viết)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: câu thiếu thành phần & từ gần nghĩa",G:[{id:"g1",grp:0,word:"着想",zh:"为……着想，以……",py:"",tag:"Mẫu câu mục đích (Bài tập 2① · 4①)",mean:"<span class='zh'>为 + người/việc + 着想</span> = <b>nghĩ cho lợi ích của…</b>. <span class='zh'>以</span> (văn viết) đứng đầu vế sau = <b>để, nhằm</b> (= <span class='zh'>以便 · 为了</span>).",forms:["S + 为 + O + 着想","……，以 + V（mục đích）"],ex:[["我必须了解学员，为学员着想，帮他策划学习方案，以达成他的目标。","Tôi phải hiểu học viên, nghĩ cho học viên, giúp lập phương án học, để đạt mục tiêu của họ.",1],["为孩子的未来着想，家长应该培养孩子独立的能力。","Vì tương lai của con, phụ huynh nên rèn khả năng tự lập cho con."],["商店增加了很多手推车，以便于顾客购物。","Cửa hàng bổ sung nhiều xe đẩy để khách tiện mua sắm."]],tips:["⚠️ 着 đọc <b>zhuó</b>; không dùng ✗<span class='zh'>着想孩子</span>.","<span class='zh'>以</span> chỉ mục đích luôn đứng <b>đầu vế sau</b>, chủ ngữ của hai vế giống nhau."]},{id:"g2",grp:0,word:"",zh:"以为……，不料……",py:"",tag:"Ôn tập (đoạn 2)",mean:"<span class='zh'>以为</span> = <b>tưởng rằng</b> (thực tế không phải vậy); kết hợp <span class='zh'>不料</span> (bài 4) để dẫn ra sự thật bất ngờ.",forms:["S + 以为 + mệnh đề，不料 + sự thật"],ex:[["我以为交了学费就能开始快乐而美好的学习了，不料首先面对的是她接连不断的发问。","Tôi tưởng nộp học phí là bắt đầu học vui vẻ, không ngờ trước tiên phải đối mặt với hàng loạt câu hỏi.",1],["我以为他会生气，不料他只是笑了笑。","Tôi tưởng anh ấy sẽ giận, không ngờ anh ấy chỉ cười."]],tips:["<span class='zh'>以为</span> (tưởng, thường sai) ≠ <span class='zh'>认为</span> (cho rằng, nêu quan điểm)."]},{id:"g3",grp:1,word:"而已",zh:"而已",py:"éryǐ",tag:"Chú thích 1 · trợ từ",mean:"Trợ từ, đặt <b>cuối câu trần thuật</b>, có ý <b>nói giảm, nói nhẹ</b> sự việc — “…mà thôi”. Thường phối hợp với <span class='zh'>不过、只、只是、仅</span>. Cũng nói <span class='zh'>罢了、就是了</span>.",forms:["S + 不过 / 只（是）/ 仅仅 + V…… + 而已"],ex:[["你怎么做的，谁心里都明白，大家不过嘴上说说而已。","Anh làm thế nào ai cũng biết, mọi người chẳng qua ngoài miệng nói vậy thôi."],["他的工作是警察，写小说仅仅是他的业余爱好而已。","Anh ấy làm cảnh sát, viết tiểu thuyết chỉ là sở thích ngoài giờ thôi."],["我没什么具体目标。就是找一个班插班听课，随意学学而已。","…chỉ là tìm một lớp học ké, học tùy hứng thế thôi.",1]],tips:["Văn viết hơn <span class='zh'>罢了</span>.","Không dùng trong câu nghi vấn, câu cầu khiến."],practice:{q:"用“而已”改写句子",items:[["他心中的家乡“美食”，在大多数人眼里，是再大众不过的食品了。","他心中的家乡“美食”，在大多数人眼里，不过是很大众的食品而已。"],["谁都不想做饭，到外面吃去吧，不就是多花点儿钱吗！","谁都不想做饭，到外面吃去吧，不过多花点儿钱而已。"],["我仅仅是举个例子，类似的情况还有很多。","我仅仅是举个例子而已，类似的情况还有很多。"]]}},{id:"g4",grp:1,word:"固然",zh:"固然",py:"gùrán",tag:"Chú thích 2 · liên từ",mean:"Liên từ, <b>thừa nhận một sự thật</b>, dùng ở vế trước. ① Vế sau <b>chuyển ý</b>, nêu sự thật đối lập (đi với <span class='zh'>可是、但是、却、然而</span>). ② Vế sau <b>tiếp nối</b>, nêu một sự thật khác cũng cần thừa nhận, chuyển ý nhẹ, nhấn vào vế sau (đi với <span class='zh'>也</span>).",forms:["① A 固然……，可是 / 但是 + B（đối lập）","② A 固然……，B 也……（cũng đúng）"],ex:[["没有目标就缺乏动力，这道理我固然懂，可是，我的确说不出她所说的目标。","Đạo lý này tôi đương nhiên hiểu, nhưng tôi thật sự không nói ra được mục tiêu.",1],["这么做，好固然是好，可是又费时间，成本又高，肯定不行。","Làm thế tốt thì tốt thật, nhưng tốn thời gian, chi phí lại cao, chắc chắn không được."],["考上大学固然好，没考上大学也不是就没有出路了。","Đỗ đại học thì tất nhiên tốt, không đỗ cũng chẳng phải hết đường."],["上世纪末兴起的积极心理学运动，固然有心理学自身发展要求的原因，另一方面也是时代发展的必然。","Phong trào tâm lý học tích cực cuối thế kỷ trước tất nhiên có nguyên nhân từ nhu cầu phát triển của ngành, mặt khác cũng là tất yếu của thời đại."]],tips:["So sánh <span class='zh'>虽然</span>: <span class='zh'>固然</span> nhấn <b>thừa nhận</b> vế trước là đúng; <span class='zh'>虽然</span> chỉ nhượng bộ.","Mẫu khẩu ngữ tương đương: <span class='zh'>A 是 A，可是……</span> (<span class='zh'>好是好，可是……</span>) — Bài tập 2⑤."],practice:{q:"完成句子",type:"complete",items:[["搬家以后新家离单位固然是远了许多，可是________。","搬家以后新家离单位固然是远了许多，可是周围的环境比以前好多了。"],["谁有意见大胆地提，说得对，固然好，说错了，________。","谁有意见大胆地提，说得对，固然好，说错了，也没有关系。"],["屋里挂张画儿固然不错，可并________，要是一点儿美感都没有的画，不挂也罢。","屋里挂张画儿固然不错，可并不是什么画儿都适合挂，要是一点儿美感都没有的画，不挂也罢。"]]}},{id:"g5",grp:1,word:"无非",zh:"无非",py:"wúfēi",tag:"Chú thích 3 · phó từ",mean:"Phó từ, biểu thị <b>không vượt quá một phạm vi nào đó</b>, nghĩa là <span class='zh'>只、不过</span> — “chẳng qua là”. Có ý <b>nói nhẹ đi</b>.",forms:["S + 无非（是）+ V / N","无非……而已 / 罢了"],ex:[["他这么努力地工作，无非想多挣些钱，让妻子、孩子生活得更舒适。","Anh ấy làm việc chăm chỉ thế, chẳng qua muốn kiếm thêm tiền để vợ con sống thoải mái hơn."],["我喜欢这个国家的文化，学习语言无非是为了看原文电影、读文学作品……","…học ngôn ngữ chẳng qua là để xem phim, đọc tác phẩm bản gốc…",1],["我们把汉语口语称作“说的汉语”，把汉语书面语称作“看的汉语”，无非是强调汉语两种不同的语言形式具有不同的特性和使用场合。","Gọi khẩu ngữ là “tiếng Hán để nói”, văn viết là “tiếng Hán để đọc”, chẳng qua là nhấn mạnh hai hình thức có đặc tính và phạm vi dùng khác nhau."]],tips:["Hay đi với <span class='zh'>是 · 而已 · 罢了</span>.","<span class='zh'>无非</span> và <span class='zh'>而已</span> cùng “nói nhẹ”: <span class='zh'>无非</span> đứng <b>trước</b> vị ngữ, <span class='zh'>而已</span> đứng <b>cuối câu</b>."],practice:{q:"用“无非”改写句子",items:[["父母们在一起也实在没什么好谈的，就是孩子的成长、教育问题。","父母们在一起也实在没什么好谈的，无非是孩子的成长、教育问题。"],["他的菜谱特别单调，只有西红柿炒鸡蛋，偶尔还可能有黄瓜炒鸡蛋。","他的菜谱特别单调，无非是西红柿炒鸡蛋，偶尔还可能有黄瓜炒鸡蛋。"],["人类的穿戴只不过十几年、几十年为一周期地来回换，来回时髦。","人类的穿戴无非是十几年、几十年为一周期地来回换，来回时髦。"]]}},{id:"g6",grp:1,word:"",zh:"V着V着",py:"",tag:"Bài tập 2⑥",mean:"Lặp <span class='zh'>V着</span> hai lần: hành động <b>đang tiếp diễn</b> thì <b>bất ngờ</b> xảy ra một việc khác / nảy sinh trạng thái mới.",forms:["S + V着V着 + (就) + kết quả bất ngờ"],ex:[["我顿时崩溃了，怎么说着说着又绕回来了。","…sao nói tới nói lui lại vòng về chỗ cũ.",1],["周末去郊外玩儿，走着走着，我发现自己迷路了。","Cuối tuần ra ngoại ô chơi, đi mãi đi mãi thì phát hiện mình lạc đường."],["孩子听着听着就睡着了。","Đứa bé nghe mãi rồi ngủ thiếp đi."]],tips:["Động từ thường là đơn âm tiết: <span class='zh'>说、走、看、听、想</span>."]},{id:"g7",grp:2,word:"弊端",zh:"……当然……也……：……的方面……，……在于……",py:"",tag:"Khung đánh giá lợi – hại (Bài tập 4②)",mean:"Khung lập luận hai mặt: khẳng định ưu điểm (<span class='zh'>绝对……</span>), thừa nhận nhược điểm (<span class='zh'>当然……也不少</span>), rồi phân tích từng mặt (<span class='zh'>……的方面…… / ……在于……</span>), cuối cùng kết luận (<span class='zh'>利弊权衡，利大于弊</span>).",forms:["A 绝对……，当然 B 也不少：好的方面……，缺点在于……","利弊权衡，……还是大于……"],ex:[["我的学习方式绝对对学习效果有利，当然弊端也不少：有利的方面如上所说，弊端在于高兴了拼命学一阵子，不高兴了就搁在一边。","",1],["网上购物绝对很方便，当然问题也不少：好的方面是省时省力，问题在于看不到实物，质量难以保证。","Mua sắm online chắc chắn tiện, đương nhiên cũng nhiều vấn đề: mặt tốt là tiết kiệm thời gian công sức, vấn đề ở chỗ không thấy hàng thật, chất lượng khó đảm bảo."]],tips:["<span class='zh'>在于</span> = nằm ở chỗ (văn viết) — sau là danh từ hoặc mệnh đề.","Rất hữu ích cho phần viết báo cáo khảo sát ở mục 7."]}],BX:{grp:0,word:"专程",cols:["专程","专门"],pair:"专程 — 专门",same:["Đều biểu thị <b>đặc biệt (đi) làm việc gì</b>.","这次到上海来，我是专程 / 专门来看你的。"],diff:[["Phó từ, <b>chỉ</b> dùng cho hành động phải <b>đi một quãng đường</b>; nhấn thái độ trịnh trọng.","他专程来机场送你。","Phó từ, ngoài di chuyển còn dùng cho <b>mọi hành động khác</b>.<div class='zh' style='margin-top:4px'>这个礼物是专门给你买的，不知道你喜欢不喜欢。</div>"],["Không có nghĩa này.","","Phó từ, hành động <b>chỉ giới hạn trong một phạm vi</b>.<div class='zh' style='margin-top:4px'>这次会议专门讨论了公司的人事问题。</div>"],["Không có cách dùng này.","","Còn là <b>tính từ</b>: chuyên (làm/nghiên cứu một việc), đứng trước danh từ.<div class='zh' style='margin-top:4px'>他们都是电脑方面的专门人才。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["他专程研究中国文学，发表了一些这方面的论文。",1,"Nghiên cứu không phải “đi lại” → <span class='zh'>专门研究</span>."],["他们为国家培养了很多相关学科的专门人才。",0,"<span class='zh'>专门</span> làm định ngữ — đúng."],["今天是我的生日，妈妈专程做了我喜欢吃的饭菜。",1,"Nấu ăn không cần đi đường xa → <span class='zh'>专门做</span>."],["昨天同事们专门举行了一个晚会欢迎我。",0,"<span class='zh'>专门</span> dùng cho mọi hành động — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["拼<u>命</u>","救命 · 生命 · 寿命 · 命运"],items:[["忍<u>耐</u>","耐","耐心 · 耐热 · 耐寒 · 耐用"],["<u>缓</u>和","缓","缓慢 · 缓解 · 缓冲 · 迟缓"],["客<u>户</u>","户","用户 · 窗户 · 户口 · 千家万户"],["<u>思</u>维","思","思考 · 思想 · 思念 · 思路"]]},EX2:{q:"用所给词语或结构改写句子",items:[["为孩子的未来考虑，家长应该培养孩子独立的能力。","为……着想","为孩子的未来着想，家长应该培养孩子独立的能力。"],["商店增加了很多手推车，是为了便于顾客购物。","以","商店增加了很多手推车，以便于顾客购物。"],["他只不过是不小心碰了你一下，你干吗生那么大的气啊？","无非","他无非是不小心碰了你一下，你干吗生那么大的气啊？"],["他并不比别人聪明，只是比别人更努力一些。","而已","他并不比别人聪明，只是比别人更努力而已。"],["这个方法好是好，可实施起来太难了。","固然","这个方法固然好，可实施起来太难了。"],["周末去郊外玩儿，走了一段时间后，我发现自己迷路了。","……着……着","周末去郊外玩儿，走着走着，我发现自己迷路了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["兴致勃勃","迫不及待","啥","接连","栋"],text:"朋友邀请我参加他们的新年晚会，他住在离我家不远的一{栋}居民楼上。我{兴致勃勃}地前去参加。晚会上惊喜{接连}不断，不但有好吃的、好喝的，朋友还为每位客人准备了一份礼物。我很想知道里边是{啥}东西，就{迫不及待}地打开包装，原来是我最喜欢吃的巧克力，晚会结束后，大家都高高兴兴地拿着礼物回家了。"},{bank:["依靠","动力","设置","持久","执行"],text:"学习一门外语，光{依靠}热情是远远不够的，那样的话，恐怕难以{持久}。我们还应该根据自身的情况{设置}短期和长期的学习目标，制定详细的学习计划，有了目标就有了学习的{动力}。短期目标帮助我们一步一步逐渐提高，同时又不觉得太过吃力；长期目标给我们指明了方向。最后，严格{执行}学习计划也是非常重要的。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"她极力忍耐着，“是这样，我<u>必须</u>了解学员，<u>为</u>学员<u>着想</u>，<u>帮</u>他策划学习方案，<u>以</u>达成他的目标。”",task:"球队教练说：“我必须______，为______着想，帮______，以______。”",model:"球队教练说：“我必须了解每一位队员，为队员的发展着想，帮他们制定训练计划，以取得更好的比赛成绩。”"},{src:"我的学习方式<u>绝对</u>对学习效果有利，<u>当然</u>弊端<u>也</u>不少：有利<u>的方面</u>如上所说，弊端<u>在于</u>高兴了拼命学一阵子，不高兴了就搁在一边。",task:"那个人绝对是个很好的人，当然______也不少，好的方面是______，缺点在于______。",model:"那个人绝对是个很好的人，当然缺点也不少，好的方面是热心、愿意帮助别人，缺点在于脾气太急，常常说话不考虑别人的感受。"}]},EX5:{q:"根据提示，简述课文主要内容",vn:"Trả lời từng câu theo gợi ý — ôn lại toàn bộ nội dung bài.",rows:[["“我”学习外语的原因是：","①喜欢…… ②不依靠……，看……，阅读……","“我”喜欢这个国家的文化，想不再依靠翻译，看原文电影，阅读原文的文学作品。"],["那家机构认为学习外语必须有什么？","具体目标，比如：出国、职业……","那家机构认为学习外语必须有具体目标，比如是不是要出国，职业是什么，否则就缺乏动力，难以持久。"],["最后“我”选择了什么方式学习，为什么？","①在线…… ②教学方法：…… ③没有人硬逼着我…… ④没有人问我……","“我”选择了在线学习，因为它从基础教起，语法讲解详细，和“我”的思维很搭；没有人硬逼着“我”执行学习计划，也没有人问“我”为什么学、单位、身份和薪水。"],["“我”的学习方式的利弊是：","①利：…… ②弊：……","利：学习效果好，心里舒服，能津津有味地享受学习。弊：高兴了拼命学，不高兴了就搁在一边，有时还前后颠倒。但利还是大于弊。"]]},BJ:{title:"病句类型：成分残缺",vn:"Câu sai — loại 2: thiếu thành phần",intro:"<b>成分残缺</b>: trong câu lược bỏ bộ phận không được phép lược bỏ, khiến cấu trúc không hoàn chỉnh, ý không chính xác. Hay gặp: thiếu <b>chủ ngữ</b> (do đổi chủ ngữ ngầm), thiếu <b>vị ngữ</b>, thiếu <b>tân ngữ</b> (do định ngữ dài), thiếu <b>bổ ngữ</b>, thiếu <b>quan hệ từ</b>.",types:[["主语残缺","Thiếu chủ ngữ","他向国家捐献出了一张祖传的字画，具有极高的研究、保存价值。","……，这张字画具有极高的研究、保存价值。","Vế trước chủ ngữ là “他”, vế sau ngầm đổi thành “字画” → phải nêu chủ ngữ mới."],["谓语残缺","Thiếu vị ngữ","我们已办理了婚姻登记手续，我们真的夫妻了。","我们真的是夫妻了。","Vế sau thiếu động từ vị ngữ <span class='zh'>是</span>."],["宾语残缺","Thiếu tân ngữ","我们将提前做好各项筹备工作，最终实现举办一届“有特色、高水平”奥运会。","……实现举办一届“有特色、高水平”奥运会的目标。","Định ngữ dài làm ta nhầm một phần định ngữ là tân ngữ; tân ngữ thật của <span class='zh'>实现</span> là <span class='zh'>目标</span>."],["补语残缺","Thiếu bổ ngữ","我读杂志的时候，看一张广告，有话剧，我决定买两张票。","看到一张广告","<span class='zh'>看</span> thiếu bổ ngữ kết quả <span class='zh'>到</span>."],["关联词语残缺","Thiếu quan hệ từ","就算肉再好吃，你也不准吃太多，以后更胖了。","……，不然以后更胖了。","Vế chỉ kết quả cần <span class='zh'>不然</span>."]],opts:["主语残缺","谓语残缺","宾语残缺","补语残缺","关联词语残缺"],practice:[["为了写好汉字，他每天抄写一篇短文，养成了书写规范、端正、整洁。","宾语残缺","为了写好汉字，他每天抄写一篇短文，养成了书写规范、端正、整洁的习惯。","<span class='zh'>养成</span> cần tân ngữ <span class='zh'>习惯</span>; “书写规范、端正、整洁” chỉ là định ngữ."],["他边走边想，非常投入，突然路旁的河里有人喊“救命！”","谓语残缺","他边走边想，非常投入，突然听到路旁的河里有人喊“救命！”","Chủ ngữ “他” thiếu động từ vị ngữ <span class='zh'>听到</span>."],["他的习惯是一边吃早饭，一边看报纸，对身体不好。","关联词语残缺","他的习惯是一边吃早饭，一边看报纸，但是这样对身体不好。","Vế cuối mang ý chuyển ngoặt, cần <span class='zh'>但是这样</span>."],["经过专家组分析论证，排除了人为破坏因素导致事故发生的可能性。","主语残缺","经过专家组分析论证，他们排除了人为破坏因素导致事故发生的可能性。","Câu bắt đầu bằng <span class='zh'>经过……</span> (trạng ngữ) nên thiếu chủ ngữ cho <span class='zh'>排除</span>."],["我觉得她好棒啊，居然把一件旧牛仔裤改造了一个洋气又实用的背包。","补语残缺","我觉得她好棒啊，居然把一件旧牛仔裤改造成了一个洋气又实用的背包。","<span class='zh'>改造</span> cần bổ ngữ <span class='zh'>成</span>: <span class='zh'>把 A 改造成 B</span>."]]},DP:{title:"词汇：熟悉下列近义词",vn:"Các cặp từ gần nghĩa — cột “搭配” ghi cặp đối ứng, cột cuối là ví dụ phân biệt sắc thái.",items:[["安详","ānxiáng","điềm tĩnh, an lành","↔ 祥和","老人安详地睡着了。/ 节日的街头一片祥和。"],["报仇","bào chóu","báo thù","↔ 复仇","他发誓要为父亲报仇。"],["报答","bàodá","đền đáp","↔ 回报","我一定要报答父母的养育之恩。"],["弊病","bìbìng","tệ hại, khuyết điểm","↔ 弊端","这种做法有不少弊病。"],["采纳","cǎinà","tiếp thu (ý kiến)","↔ 采用","经理采纳了我的建议。"],["参照","cānzhào","tham chiếu","↔ 参考","请参照说明书安装。"],["操练","cāoliàn","luyện tập (thao tác)","↔ 训练","士兵们正在操场上操练。"],["充沛","chōngpèi","dồi dào","↔ 充足","他每天都精力充沛。"],["代理","dàilǐ","đại lý, thay mặt","↔ 代办","他代理了这个品牌在中国的业务。"],["丰盛","fēngshèng","thịnh soạn","↔ 丰富","妈妈做了一桌丰盛的晚餐。"],["抚养","fǔyǎng","nuôi dưỡng","↔ 养活","是奶奶把我抚养长大的。"],["更正","gēngzhèng","đính chính","↔ 改正","报纸更正了昨天的错误报道。"],["供给","gōngjǐ","cung cấp","↔ 供应","学校免费供给学生午餐。"],["宏伟","hóngwěi","hùng vĩ, to lớn","↔ 雄伟","这是一座宏伟的建筑。"],["混合","hùnhé","pha trộn","↔ 掺杂","把两种颜料混合在一起。"],["加剧","jiājù","tăng thêm (mức độ xấu)","↔ 加重","矛盾进一步加剧了。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"活儿总算忙完了，他累得都要崩溃了，满脑子都是客户和协议。虽然困得要死，可躺在床上颠来倒去睡不着，心烦意乱之中，突然听到儿子的房间传来了朗读英语的声音，轻柔、平静，不知不觉中，他竟入睡了。",o:["他每天都学习英语","他白天工作特别多","他每天很晚才睡觉","他晚上一直没睡着"],a:1,why:"“活儿总算忙完了，他累得都要崩溃了” → ban ngày việc rất nhiều. (D sai: cuối cùng ông ấy ngủ được.)"},{n:2,say:"人的头发中有一种叫作黑色素的物质，黑色素越多头发的颜色越黑，黑色素少了，头发便会发黄或变白。人进入老年，身体的各种机能会逐渐衰退，色素也会越来越少，所以头发就会渐渐变白。",o:["头发是否变白和人的肤色有关","头发变白说明人各种机能变好","头发的颜色取决于黑色素的多少","黑色素的多少决定着头发的多少"],a:2,why:"“黑色素越多头发的颜色越黑”."},{n:3,say:"1915年中国将清明节定为植树节，1928年将植树节改为3月12日，这一设定一直沿用至今。此外，一些省市还根据当地的气候规律，规定了其他的植树日、植树周、植树月。",o:["1915年中国有了清明节","1928年中国首创植树节","很多省市有自己的植树节","植树节在每年的3月12号"],a:3,why:"“将植树节改为3月12日……沿用至今”. (C: “一些” tỉnh, không phải “很多”.)"},{n:4,say:"盛文强长期从事海洋民间故事的采集整理，并出版了多部海洋题材小说。作为传统的农业国家，中国文学中的农业元素太多了，所以盛文强的“海洋文学”出现在读者面前时，不免让人眼前一亮。",o:["盛文强从小生活在农村","盛文强的作品取材海洋","盛文强很会讲民间故事","盛文强特别喜欢看小说"],a:1,why:"“出版了多部海洋题材小说”."},{n:5,say:"我带着狗去郊游，狗发现了野兔就兴奋地前去追赶。野兔明明知道狗来了，却像没这事一样，照样坐在那儿吃草，直到狗跑近了，野兔才一跃而起，迅速跑开，当它跑到自认为安全的地方，便又马上安定下来。",o:["狗追近了，兔子才会躲开","兔子看到狗就会拼命地跑","兔子看到狗就会心神不定","我专程去郊外看狗追兔子"],a:0,why:"“直到狗跑近了，野兔才一跃而起”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：今天来参加我们访谈节目的是年轻朋友非常崇拜的著名节目主持人刘可心。欢迎您！您知道年轻朋友私底下怎么称呼您吗？\n男：“可心同学”？\n女：对。\n男：可以这么叫我。我喜欢这个称呼。\n女：那好，咱们就这么叫了。可心同学，很多听众喜欢听您说话，认为您思维角度与众不同，听您说话不只是听听而已，关键是总能受到启发。\n男：过奖了。我之所以能成为今天的我，无非是和读书，特别是和读名著有关。阅读经典，肯定会对我们的人生产生影响。比如，我小时候对“美”和“丑”的理解，就跟读法国作家雨果的《巴黎圣母院》有关，这本书让我意识到，不能光凭外表长得不好看就觉得这个人也不好。\n女：名著这么好，有些孩子怎么就是不愿意读呢？\n男：主要是因为老师家长把这事当任务布置给孩子，孩子就会觉得很累，甚至反感。读书不能勉强，其实读名著是件很好玩儿的事情，名著都是经受住了历史考验的。所以，家长要让孩子带着好奇心去读，他就有了动力。\n女：您的孩子喜欢读书吗？这不是隐私吧？\n男：当然不是。我的孩子非常喜欢读书。\n女：他读的第一本书是什么，您还记得吗？\n男：他认真读的第一本书是武侠小说。\n女：哦？\n男：在读书方面，我给他非常大的自由。我觉得最重要的是让他在年少时喜欢读书，而不是读哪本书。\n女：听说您的孩子马上就要高考了，而且选择的是历史？\n男：对，应该说他的选择跟他的阅读经历有关，他读金庸的武侠小说着迷，读完一遍还想读第二遍，书里涉及一些他不懂的内容，就到处查书查资料，这样他的阅读面就会不断向外延伸。\n女：这么说，名著也不需要读全？您怎么看古人说过的“读万卷书行万里路”？\n男：在我看来，不管行万里路还是读万卷书，关键得看走不走心，到哪儿赶紧拍照，奔下一个景点，万里路固然是走了，可一点儿用都没有。即使你没读万卷书，但把10本书给读明白了，要比囫囵吞枣读100本书好得多。",qs:[{n:6,q:"关于刘可心，可以知道什么？",o:["他很受年轻人欢迎","他还没工作，是个学生","他的话没有太大的价值","他总能从生活中受到启发"],a:0,why:"“年轻朋友非常崇拜的著名节目主持人”."},{n:7,q:"刘可心怎么评价自己？",o:["他在哪儿都会受表扬","他的成功和读书有关","他一直喜欢法国小说","人长相难看心眼儿才好"],a:1,why:"“我之所以能成为今天的我，无非是和读书……有关”."},{n:8,q:"刘可心认为有的孩子不愿意读名著的原因是什么？",o:["孩子们学习太紧张","家长自己就不读书","孩子们没找到好书","大人的方法有问题"],a:3,why:"“老师家长把这事当任务布置给孩子” → cách làm của người lớn có vấn đề."},{n:9,q:"关于刘可心的孩子，下列哪项正确？",o:["读书使他喜欢上了历史","每本书他都会认真读完","每部小说他都会反复看","父亲喜欢武侠他也喜欢"],a:0,why:"“他的选择（历史）跟他的阅读经历有关”."},{n:10,q:"对“读万卷书行万里路”，刘可心怎么看？",o:["书当然是读得越多越好","行万里路一点儿用都没有","读书不在多少，关键是用心","天天忙着旅游就没法读书了"],a:2,why:"“关键得看走不走心……把10本书给读明白了，要比囫囵吞枣读100本书好得多”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"我们常常会听到家长感叹，现在的孩子，能安安静静坐下来看书的实在太少。想想我们小的时候，一本书在同学之间传来传去，大家迫不及待地轮流传阅，兴致勃勃地捧着一本书，如痴如醉……那样的乐趣，我们的孩子为什么就完全没有感觉呢？\n王先生常抱怨，儿子小的时候，自己每天晚上给他读故事，本以为他长大了，在读书方面，会成为自己的知音。现实却并非如此，儿子对老师推荐的书、家长给他买的书好像都没兴致，偶尔翻看一下，不过是应付老师和家长。\n在浮躁的现代生活氛围中，借助互联网和各色电子产品，人们可以接触到最新娱乐资讯，可以在卡通动漫和电脑游戏中得到放松。人们将大量时间耗费在手机、电脑与电视机前。因此，如何让心灵回归沉静，已经成为摆在人们面前的难题。",qs:[{n:11,q:"家长常为什么事感叹？",o:["孩子们安静不下来","孩子们不喜欢看书","自己小时候没有书看","自己小时候没钱买书"],a:1,why:"“能安安静静坐下来看书的实在太少”."},{n:12,q:"王先生常抱怨什么？",o:["儿子对自己很反感","儿子长大了，不听话了","儿子长大后并不爱读书","现在的老师不为学生着想"],a:2,why:"“本以为……会成为自己的知音。现实却并非如此”."},{n:13,q:"如今摆在人们面前的难题是什么？",o:["怎样远离电脑游戏","怎样让心灵安静下来","怎样克服互联网的弊端","如何让娱乐资讯有深度"],a:1,why:"“如何让心灵回归沉静”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"有人说学好外语就得努力学、拼命学，得有大把的时间，我却说学外语就得“见缝插针”。所谓“见缝插针”，就是要把一般人看着不起眼的零碎时间都利用起来。可千万别看不起这几分钟十几分钟的时间，根据记忆心理学的原理，对于外语等以机械记忆为主的学习内容，及时地利用零碎时间进行复习，效果是很好的，学了就搁在一边，等于没学。\n“见缝插针”的另一种方式就是把外语学习和日常生活联系起来，处处学，时时学，事事学。只要有了学习外语的强烈愿望和兴趣，日常生活的各个方面都可以成为外语学习的第二课堂，而且在日常生活中学到的外语记得快、记得牢，学习效果特别好。\n“见缝插针”时间长了，就会感到外语学习已成为自己生活中不可缺少的内容，就会感到学习外语是一种乐趣和享受，一天不学就好像缺了点儿什么。",qs:[{n:14,q:"怎样“见缝插针”学外语？",o:["工作给别人，自己学外语","有了充足的时间再学外语","别人看电视时自己学外语","多么短的时间都利用起来"],a:3,why:"“把一般人看着不起眼的零碎时间都利用起来”."},{n:15,q:"“见缝插针”学外语的好处是什么？",o:["有新鲜感","有成就感","有利于记忆","不浪费时间"],a:2,why:"“根据记忆心理学的原理……效果是很好的”."},{n:16,q:"“见缝插针”的另一种学习方式是什么？",o:["在日常生活中学习","培养学外语的兴趣","锻炼自己的记忆力","和外国人多多接触"],a:0,why:"“把外语学习和日常生活联系起来”."},{n:17,q:"这段话告诉我们什么？",o:["工作忙不是学不好外语的借口","学习外语的过程也是一种享受","只要有时间就不会学不好外语","会“见缝插针”的人都能成功"],a:0,why:"Theo đáp án sách: ý chính là không cần nhiều thời gian — bận không phải lý do để học không tốt."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["一切成功的教育必须基于爱，借助于爱，归结于爱。","一个用心温暖别人的人，她自己的心也必然是温暖的。","他的父亲、爷爷都是书法家，书法作品对他一点儿也不陌生。","夕阳西下，我看到她正坐在门口专注地倾听着什么，脸上有种奇异的微笑。"],a:2,why:"<b>Chủ – khách đảo lộn</b>: người mới “陌生” với vật → <span class='zh'>他对书法作品一点儿也不陌生</span>."},{n:19,o:["听家里人说他是春节以后找到工作了。","这是一本值得一辈子去学习、去研究、去实践的好书。","妈妈年轻的时候有一个最奢侈的梦想，就是拥有一辆新自行车。","春天，万物复苏，小草从土里悄悄地探出头来，好奇地四处张望。"],a:0,why:"<b>Thiếu thành phần</b>: cấu trúc nhấn mạnh <span class='zh'>是……的</span> thiếu <span class='zh'>的</span> → <span class='zh'>他是春节以后找到工作的</span>."},{n:20,o:["世界各国民航部门都对商业无人机的滥用挠头不已。","我的家乡物产丰富、风景秀丽，被人们称为“草原明珠”。","他比过去成熟了，知道身体健康的重要性，更懂得约束自己。","念大学的时候，我常跟朋友去游泳，其实我并不喜欢游泳，只是凑个热闹。"],a:0,why:"<b>Thiếu trung tâm ngữ</b> (theo đáp án sách): <span class='zh'>对商业无人机的滥用问题挠头不已</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"她的教育人生，如果用一个字来___，那就是“爱”。有了“爱”，她就有了无限的精力、无限的___、无限的事业___。",o:["总结　本领　动能","概述　技能　能量","概括　才能　动力","包括　才华　能力"],a:2,why:"<span class='zh'>用一个字来概括</span>; <span class='zh'>无限的才能</span>; <span class='zh'>事业动力</span> (từ mới)."},{n:22,text:"幸福是什么？___很重要，但仅仅“够用”就可以了。北欧人的幸福感，更多来源于简约、自然、平和的___以及家庭的温暖、个人的___，而这些是我们可以学会，可以身体力行的，也是我们自古以来___倡导的。",o:["物质　心态　努力　一直","物资　心理　勤劳　从来","东西　想法　奋斗　不停","财物　态度　尽力　不断"],a:0,why:"<span class='zh'>物质</span> (vật chất) đối lập tinh thần; <span class='zh'>平和的心态</span>; <span class='zh'>个人的努力</span>; <span class='zh'>一直倡导</span>."},{n:23,text:"中华鲟是古老的___鱼类，现今仅在中国长江流域___有分布。曾有外国人希望将它___到自己的国度安家落户，但中华鲟总要洄游到故乡的江河生儿育女，所以人们给它___“中华”二字。",o:["珍视　且　转移　加上","珍稀　尚　引进　冠以","珍重　仍　搬家　命名","爱惜　犹　移民　起名"],a:1,why:"<span class='zh'>珍稀鱼类</span> (quý hiếm); <span class='zh'>尚有分布</span> (vẫn còn — văn viết); <span class='zh'>引进</span> (du nhập); <span class='zh'>冠以……二字</span> (đặt thêm tên trước)."}]},read3:{ins:"第24–28题：选句填空。",text:"2400多年前，有个叫曾子的人，他16岁拜孔子为师，勤奋好学，(24)。\n曾子不仅有学问，(25)，即使对孩子，也是一样。一次，曾子的妻子要到街上去买东西，儿子哭闹着要跟着去。妻子对儿子说，(26)，好好待在家里，回来就杀猪给他炖肉吃。孩子以为母亲说的是真的，就不闹了，在家里安安静静地等着。\n妻子买东西回来，一进门就看到曾子已经拿出了刀，做着杀猪的准备。妻子吓了一跳，赶忙说：“你真的要杀猪吗？我没跟他说实话，(27)，我没真想把家里的猪杀了呀。”曾子认真地说：“我们的行为会影响孩子，如果我们说话不算数，(28)，我们就会把孩子教育成不诚实的人。”妻子听了曾子的话，觉得有道理，于是，帮着丈夫把猪杀了，做了一顿丰盛的晚餐。",opts:["做人诚实也是出了名的","无非是为了哄孩子不要哭闹","是春秋时期的著名学者","孩子会跟我们学","只要他不闹"],ans:{24:2,25:0,26:4,27:1,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"精通古汉语，对外文完全是门外汉的林纾是中国著名翻译家，近代文学翻译的开创者，正式译介西方文学的第一人。他以“耳受笔追”的方式，与留洋学子合作，翻译了11个国家107位作家的作品，对引进西方文学和促进中国社会文化的进步做出了巨大贡献。\n林纾有个朋友叫王昌寿，曾赴法留学6年，精通法语。他常给林纾讲外国名著，每次林纾都听得津津有味。一来二去林纾喜欢上了西方文学，并产生了将其翻译给国人的念头。林纾想虽然自己看不懂外文，可是搭上王昌寿，俩人就没啥做不成的。于是二人达成协议，合作翻译法国名著《茶花女》，办法是王昌寿口译，林纾记录并成文。那时，人们常看到这样一幅景致：王昌寿面前搁着本原著，边浏览，边口述；林纾耳聪手疾，文思如泉涌，经常是王昌寿说完一句的同时，林纾就已经挥笔成文了。半天下来，两人能译出6000多字。1899年夏天，中国首部翻译小说《巴黎茶花女遗事》公开发售。一时间，阅读翻译小说成了社会风尚，众人争相抢阅。此后的27年里，林纾与魏易、陈家麟等留学归来的才子合作翻译了160余部外国名著，这些小说向中国民众展示了丰富的西方文化，开阔了人们的视野。\n除翻译外，林纾还是一位深受读者欢迎的作家，他接连发表的长篇小说和一系列短篇小说生动地反映了当时的社会现实，深受读者喜爱。此外，林纾还是一位不错的画家，他23岁拜师学画，绘画成就不亚于文学创作和翻译。",qs:[{n:29,q:"根据第1段可以知道，林纾：",o:["一点儿外语也不会","把古汉语翻译成了外文","曾经去过十多个国家","促进了西方文学的发展"],a:0,why:"“对外文完全是门外汉”."},{n:30,q:"根据第2段可以知道：",o:["《茶花女》是林纾、王昌寿合写的","1899年中国出版了第一本翻译小说","《巴黎茶花女遗事》一出版就被抢光","1899年之后，中国出了很多翻译家"],a:1,why:"“1899年夏天，中国首部翻译小说……公开发售”."},{n:31,q:"第2段画线词语“耳聪手疾”的意思是：",o:["手有问题了","耳朵听不见了","耳朵很好手不行","耳朵也好手也快"],a:3,why:"聪 = nghe rõ; 疾 = nhanh → tai thính tay nhanh."},{n:32,q:"通过最后一段我们还知道，林纾：",o:["尊重每一位读者","喜欢看各类小说","23岁时教过画画儿","画画儿不比写作差"],a:3,why:"“绘画成就不亚于文学创作和翻译”. (C: 23 tuổi <i>học</i> vẽ.)"}]},{ins:"第33–36题：请选出正确答案。",text:"不少工作繁忙、不希望把学习过程拖得太长的中国人，都希望能在短时间内学会英语。有人提出过这样的问题，“英语速成”可能吗？\n如果我斩钉截铁地告诉你，到现在为止没有例子能够证明在一年之内可以做到听说读写没问题，请你不要失望。因为对于中国人来说，英语是一门外语，从什么都不会到能够听、说、读、写，是一个必须按照学习规律一步一个脚印走过的过程，期间没有近路可走。\n如果让我为你策划学习方式，我想告诉你，学英语首先要以最严格的要求，从基础知识抓起，要学好每一个词、每一句话，之后再谈提高和强化。学习中要先把课本知识学好，把课本内容掌握得滚瓜烂熟之后，再去光顾课外材料，这种看起来在基础知识上耽误了时间的笨方法，倒有可能使你收到事半功倍的效果。\n其次，不要把心思放在应试技巧上，梦想依靠所谓技巧在短期内通过某种考试。虽然一些技巧对某些人的命运能够起到决定性作用，但离开考场以后，所谓的技巧却没有任何实际应用价值。学习英语的根本目的在于应用，因此学习英语的每一个环节都应着眼于实际能力的培养与提高。\n另外，一种很好的学习方法就是“听写录音”，把你听到的英语记录下来，可以让你清楚，你什么地方听不懂、写不出，让你直观地感受到你的不足在哪里，你也就找到了真正的出发点。经过努力，就能听懂了、写对了，你取得的进步也是实实在在的。如此这般，英语水平自然会日渐提高，最后顺利到达终点。",qs:[{n:33,q:"什么样的人希望学习“速成英语”？",o:["自认为聪明过人的人","做事随意不善计划的人","了解外语学习规律的人","想在短时间学会英语的人"],a:3,why:"“都希望能在短时间内学会英语”."},{n:34,q:"学英语最重要的方法是什么？",o:["记住单词","背诵句子","打好基础","看课外书"],a:2,why:"“从基础知识抓起”."},{n:35,q:"关于应试技巧，作者认为：",o:["掌握应试技巧很重要","学应试技巧很费时间","靠应试技巧学不好英语","应试技巧在生活中有用"],a:2,why:"“离开考场以后，所谓的技巧却没有任何实际应用价值”."},{n:36,q:"作者认为一种很好的学习方法是什么？",o:["边听录音边写下听到的英语","反复听录音中听不懂的地方","善于发现自己学习中的弱点","每天都能感受到自己的进步"],a:0,why:"“‘听写录音’，把你听到的英语记录下来”."}]}]},W:{zh:"写作",vn:"Báo cáo khảo sát",t:"35 phút",min:!0,task:"请对3～4个不同年龄、不同国家、不同职业的对象进行调查，主题是调查“你为什么学习外语”，将调查内容填入表中（国家 · 年龄 · 职业 · 学习外语的原因 · 现在的学习方式（利与弊）），课上向同学汇报，同时将调查内容写成一篇不少于300字的调查报告。",target:300,steps:[["Phỏng vấn","Hỏi 3–4 người khác nhau về <b>quốc tịch, tuổi, nghề</b>. Ghi vào bảng 5 cột như đề bài."],["Mở đầu","Nêu <b>mục đích – đối tượng – phương pháp</b>: <span class='zh'>为了了解……，我调查了……</span>"],["Trình bày kết quả","Mỗi người một đoạn ngắn hoặc gom theo nhóm lý do. Dùng <span class='zh'>有的……，有的……，还有的……</span>"],["Phân tích lợi – hại","Áp dụng khung: <span class='zh'>……的方面是……，弊端在于……</span>"],["Kết luận","Rút ra nhận xét chung + ý kiến của bạn: <span class='zh'>由此可见…… / 我认为……</span>"]],outline:[["一 · 调查目的和对象","为了了解大家学习外语的原因，我调查了四位……"],["二 · 调查结果","原因：工作 / 兴趣 / 留学 / 交朋友……；学习方式：机构 / 在线 / 自学 / 语伴"],["三 · 利弊分析","……的方面是……，弊端在于……"],["四 · 结论","由此可见……；我认为学外语……"]],model:"关于“你为什么学习外语”的调查报告\n为了了解大家学习外语的原因和方法，我调查了四位不同国家、不同年龄、不同职业的朋友。\n第一位是来自越南的阮先生，35岁，是一家贸易公司的主管。他学习汉语主要是为了工作，因为公司的客户大多是中国人。他每周去语言机构上两次课，好的方面是老师会根据他的目标设置课程，进步很快，弊端在于学费比较贵。\n第二位是韩国大学生金同学，20岁。她学习中文无非是因为喜欢中国的电视剧，想不借助字幕直接看懂原文。她主要在网上学习，时间随意，可是有时候高兴了拼命学，不高兴了就搁在一边。\n第三位是泰国的退休教师，62岁。他说学外语是为了让自己的头脑保持活跃，并没有什么具体目标。第四位是日本的公司职员，她打算明年来中国留学，所以每天都按计划学习。\n由此可见，大家学习外语的原因各不相同：有的为了工作，有的为了兴趣，还有的为了留学。我认为，有目标固然好，但最重要的是找到适合自己的方法，并且享受学习的过程。",check:["Có tiêu đề “……调查报告”","Có mục đích, đối tượng khảo sát","Trình bày được 3–4 người với lý do và cách học","Có phân tích lợi – hại","Có kết luận / ý kiến riêng","Dùng ít nhất 2 trong: 而已 · 固然 · 无非 · 为……着想","Không ít hơn 300 chữ"]},SUM:{words:["迫不及待","依靠","借助","勉强","兴致勃勃","专程","修养","接连","涉及","隐私","反感","忍耐","着想","策划","缓和","随意","动力","固然","无非","持久","崩溃","果断","斩钉截铁","执行","弊端","拼命","权衡","津津有味"],patterns:[["为……着想，以……","为学员着想，帮他策划学习方案，以达成他的目标。"],["……而已","随意学学而已。"],["固然……，可是……","这道理我固然懂，可是……"],["无非（是）……","学习语言无非是为了看原文电影……"],["V着V着","怎么说着说着又绕回来了。"],["……的方面……，弊端在于……","弊端在于高兴了拼命学一阵子……"]],diff:["专程：chỉ dùng cho việc phải đi đường — 专门：dùng cho mọi hành động; “chỉ chuyên về”; còn là tính từ (专门人才)","而已 (cuối câu) ≈ 无非 (trước vị ngữ) — đều nói nhẹ · 固然 (thừa nhận) ≠ 虽然 (nhượng bộ) · 以为 (tưởng) ≠ 认为 (cho rằng) · 执行 (kế hoạch, nhiệm vụ) ≠ 实行 (chế độ, chính sách)"],sentences:["没有目标就缺乏动力，这道理我固然懂，可是，我的确说不出她所说的目标。","我碰到过您这样的客户，可是，光凭兴趣，恐怕难以持久。","利弊权衡，利还是大于弊。因为我总能在忘我的快乐中，津津有味地享受学习。"],hw:["Học thuộc 44 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Phỏng vấn 3–4 người và viết báo cáo khảo sát ≥300 chữ (mục 7).","Làm Sách bài tập bài 5 (nghe 1–17, đọc 18–36).","Đọc trước bài 6 《当好职场插班生》."]}});
</script>
