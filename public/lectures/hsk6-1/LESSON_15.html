<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 15 · 山脉上的雕刻 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}

>."],[38,"心血","xīnxuè","dt.","tâm huyết","tâm huyết",1,"","心思和精力。","用心血","这本书花了他十年的心血。","Cuốn sách tốn mười năm tâm huyết của ông.",["花费心血","付出心血"],"SBT nghe câu 2."],[39,"辛勤","xīnqín","tt.","tân cần","cần cù, vất vả",1,"","辛苦勤劳。","用日复一日的辛勤劳动","老师们辛勤地工作。","Các thầy cô làm việc cần mẫn.",["辛勤劳动","辛勤工作"],"Bài tập 1: <span class='zh'>勤劳 · 勤奋 · 勤快 · 出勤</span>."],[40,"阻拦","zǔlán","đgt.","trở lan","ngăn cản",1,"","阻止；拦挡。","任何困难也阻拦不了他们","他想走，谁也阻拦不住。","Anh ấy muốn đi, ai cũng không cản được.",["阻拦不住"],"Bài tập 2④."],[41,"生态","shēngtài","dt.","sinh thái","sinh thái",1,"","生物在一定的自然环境下生存和发展的状态。","宝贵的生态、文化和审美价值","我们要保护生态环境。","Chúng ta phải bảo vệ môi trường sinh thái.",["生态环境","生态平衡"],"Bài tập 3②."],[42,"审美","shěnměi","đgt.","thẩm mỹ","thẩm mỹ",1,"书","领会事物或艺术品的美。","宝贵的……审美价值","每个人的审美观不同。","Mỗi người có quan điểm thẩm mỹ khác nhau.",["审美价值","审美观"],"Bài tập 3②."],[43,"罕见","hǎnjiàn","tt.","hãn kiến","hiếm thấy",1,"","难得见到；很少见到。","展示着它的罕见和珍稀","这是一种罕见的疾病。","Đây là một căn bệnh hiếm gặp.",["极为罕见"],"Bài tập 2③."],[44,"珍稀","zhēnxī","tt.","trân hy","quý hiếm",1,"","珍贵而稀少。","展示着它的罕见和珍稀","大熊猫是珍稀动物。","Gấu trúc là động vật quý hiếm.",["珍稀动物"],"Bài tập 1: <span class='zh'>珍贵 · 珍惜 · 珍爱 · 珍藏</span>. Bài tập 3②."],[45,"陶醉","táozuì","đgt.","đào túy","say sưa, mê đắm",1,"","很满意地沉浸在某种境界或思想活动中。","哈尼梯田的美景让人陶醉","大家都陶醉在美妙的音乐中。","Mọi người say sưa trong tiếng nhạc tuyệt diệu.",["令人陶醉","陶醉于……"],"Bài tập 3②."],[46,"遗产","yíchǎn","dt.","di sản","di sản",1,"","死者留下的财产；历史上遗留下来的精神财富或物质财富。","是人类的宝贵遗产","长城是世界文化遗产。","Trường Thành là di sản văn hóa thế giới.",["文化遗产","自然遗产"],"Bài tập 3②."],[47,"拥有","yōngyǒu","đgt.","ủng hữu","sở hữu, có",1,"","领有；具有（大量的土地、人口、财产等）。","人类拥有惊人的创造精神","这个国家拥有丰富的石油资源。","Quốc gia này có nguồn dầu mỏ dồi dào.",[],"Xem <b>辨析 拥有—具有</b>."]],extra:[["滇","Diān","tên gọi tắt tỉnh Vân Nam"],["哈尼族","Hānízú","dân tộc Hà Nhì"],["绝收","juéshōu","mất trắng mùa màng"],["旱情","hànqíng","tình hình hạn hán"],["流转","liúzhuǎn","uốn lượn"],["山腰","shānyāo","sườn núi"],["身临其境","shēn lín qí jìng","như đang ở tại chỗ"],["对抗","duìkàng","đối kháng"],["服从","fúcóng","phục tùng"],["农耕","nónggēng","canh tác"],["日复一日","rì fù yí rì","ngày này qua ngày khác"]],T:[{zh:"2010年中国西南遭遇百年不遇的干旱，耕地上，庄稼枯萎而死，农作物大面积绝收。就在各地旱情严重、人和牲畜饮水都难的时候，滇南红河哀牢山南部的一片片梯田壮丽依旧，它们依山形而流转，一片片、一层层由半山腰延伸至峡谷，像一张张亮丽的油画，铺天盖地，席卷而至。蔚蓝的天空，漂浮的白云，摇摆的树影，更衬托出梯田的壮美。",vn:"Năm 2010, Tây Nam Trung Quốc gặp hạn hán trăm năm có một; trên đồng ruộng, hoa màu héo khô mà chết, cây trồng mất trắng trên diện rộng. Đúng lúc các nơi hạn nặng, người và gia súc khó có nước uống, thì từng mảng ruộng bậc thang phía nam núi Ai Lao, Hồng Hà, nam Vân Nam vẫn tráng lệ như xưa; chúng uốn lượn theo thế núi, từng mảng, từng tầng kéo dài từ lưng chừng núi xuống tận hẻm núi, như từng bức tranh sơn dầu rực rỡ, phủ kín đất trời, ập tới như cuốn chiếu. Bầu trời xanh thẳm, mây trắng bồng bềnh, bóng cây đung đưa càng làm nổi bật vẻ đẹp hùng tráng của ruộng bậc thang.",idea:"Giữa hạn hán, ruộng bậc thang vẫn tráng lệ.",q:["当中国西南遭遇干旱时，哈尼梯田怎么样？"],note:[["壮丽依旧","<span class='zh'>Adj + 依旧</span> (văn viết) = vẫn tráng lệ như xưa."],["一片片、一层层 · 一张张","Lặp lượng từ (bài 14)."],["蔚蓝的天空，漂浮的白云，摇摆的树影","Ba cụm định ngữ song song — tả cảnh."]]},{zh:"我们的车在大山里沿着公路盘旋而行，时而行驶在深深的谷底，时而爬升到海拔一千多米高的山腰。遥望山顶，是大片的森林，峡谷间闪闪发光的是小溪、泉水和瀑布，半山腰是村子，村子下是如山如海、纵横万里、汹涌而来的梯田。",vn:"Xe chúng tôi men theo đường núi uốn lượn, lúc thì chạy dưới đáy thung lũng sâu, lúc thì leo lên sườn núi cao hơn một nghìn mét. Nhìn xa lên đỉnh núi là rừng bạt ngàn, lấp lánh giữa hẻm núi là suối, mạch nước và thác; lưng chừng núi là bản làng, dưới bản là ruộng bậc thang như núi như biển, ngang dọc vạn dặm, cuồn cuộn ập tới.",idea:"Cảnh nhìn từ trên xe — từ trên xuống dưới.",q:["描述一下坐在车上遥望梯田时看到的风景。"],note:[["时而……，时而……","Xem Ngữ pháp 1."],["山顶……，峡谷间……，半山腰……，村子下……","Tả cảnh theo trình tự không gian — dàn ý cho Bài tập 5."],["如山如海、纵横万里、汹涌而来","Ba cụm bốn chữ — văn miêu tả trang trọng."]]},{zh:"尽管已目睹这奇迹无数次，但我每次身临其境，都会为哈尼族山民们在这重重叠叠的山脉上雕塑出的美丽画卷而震惊。这是以大地为背景，用生命和毅力雕刻出的杰出作品，它比万里长城更让我震撼，它比历史悠久的宫殿更让我感动。我不禁问自己，这里的人为什么选择了梯田？后来，我在当地听到了一首古老的曲子，歌词的意思是，祖先们只靠打猎过不了日子，光靠采集树果也过不了日子，于是学会了翻地，学会了种植。他们发现种子和水最亲近，喝过水的种子就是金闪闪的稻谷，从此他们再也离不开梯田和水。经过数十代人的锲而不舍，他们终于将一座座大山，雕塑成了梯田。面对大山，山民们没有对抗，而是选择了服从——他们服从自然规律，选择开辟梯田这种农耕方式，最终与大自然和谐相处。",vn:"Dù đã tận mắt chứng kiến kỳ tích này vô số lần, nhưng mỗi lần đứng giữa cảnh ấy, tôi đều kinh ngạc trước bức tranh tuyệt đẹp mà người Hà Nhì đã tạc nên trên những dãy núi trùng điệp. Đây là tác phẩm kiệt xuất lấy đất trời làm phông nền, được khắc nên bằng sinh mệnh và nghị lực; nó khiến tôi rung động hơn cả Vạn Lý Trường Thành, cảm động hơn cả những cung điện lâu đời. Tôi không kìm được tự hỏi: vì sao người ở đây chọn ruộng bậc thang? Về sau, tôi nghe được ở địa phương một bài hát cổ, lời ca đại ý: tổ tiên chỉ săn bắn thì không sống nổi, chỉ hái lượm quả cây cũng không sống nổi, thế là học cày đất, học trồng trọt. Họ phát hiện hạt giống và nước gần gũi nhau nhất, hạt giống được uống nước sẽ thành thóc vàng óng, từ đó họ không rời được ruộng bậc thang và nước. Qua mấy chục thế hệ kiên trì không ngừng, cuối cùng họ đã tạc từng ngọn núi thành ruộng bậc thang. Đối mặt với núi lớn, người dân không chống lại mà chọn thuận theo — thuận theo quy luật tự nhiên, chọn cách canh tác ruộng bậc thang, rốt cuộc chung sống hài hòa với thiên nhiên.",idea:"Vì sao chọn ruộng bậc thang: thuận theo tự nhiên.",q:["为什么“我”每次目睹哈尼梯田都感到震惊？","这里的人为什么选择了梯田？"],note:[["尽管……，但……都……","Xem <b>Bài tập 4①</b>."],["以……为背景","<span class='zh'>以……为……</span> (bài 11)."],["不禁","Xem Ngữ pháp 2."],["没有……，而是选择了……，最终……","Xem <b>Bài tập 4②</b>."]]},{zh:"1300多年，山民们用汗水，用心血，用日复一日的辛勤劳动完成了山脉上的雕刻，任何困难也阻拦不了他们。这幅画卷以其宝贵的生态、文化和审美价值，展示着它的罕见和珍稀。",vn:"Hơn 1300 năm, người dân miền núi đã dùng mồ hôi, tâm huyết và lao động cần cù ngày này qua ngày khác để hoàn thành tác phẩm điêu khắc trên dãy núi; không khó khăn nào ngăn cản được họ. Bức tranh này, bằng giá trị sinh thái, văn hóa và thẩm mỹ quý báu, đang phô bày sự hiếm có và quý giá của mình.",idea:"1300 năm lao động; giá trị quý hiếm.",q:["哈尼梯田有什么价值？"],note:[["用……，用……，用……","Điệp ngữ ba lần — nhấn mạnh."],["以其……，展示着……","<span class='zh'>以其</span> = bằng… của nó (văn viết)."]]},{zh:"有人说：“哈尼梯田的美景让人陶醉，这里的一切无不体现着当地百姓与自然和谐相处的智慧，体现着民众对自身文化和自然环境的尊重。它所蕴含的人与自然高度和谐发展的古老文化特征，正是21世纪人类所追求的一种精神。”",vn:"Có người nói: “Cảnh đẹp ruộng bậc thang Hà Nhì khiến người ta say đắm; mọi thứ ở đây đều thể hiện trí tuệ chung sống hài hòa với thiên nhiên của người dân địa phương, thể hiện sự tôn trọng của họ với văn hóa và môi trường tự nhiên của mình. Đặc trưng văn hóa cổ xưa về sự phát triển hài hòa cao độ giữa người và thiên nhiên mà nó chứa đựng chính là một tinh thần mà loài người thế kỷ 21 theo đuổi.”",idea:"Trí tuệ hài hòa với thiên nhiên.",q:["哈尼梯田体现了什么样的智慧和精神？"],note:[["无不体现着……","<span class='zh'>无不</span> = không gì không — xem Ngữ pháp 3."],["它所蕴含的……","<span class='zh'>所 + V</span> làm định ngữ (văn viết)."]]},{zh:"也有人说，哈尼梯田“是人类的宝贵遗产，它向我们证明人类拥有惊人的创造精神”！",vn:"Cũng có người nói, ruộng bậc thang Hà Nhì “là di sản quý báu của nhân loại, nó chứng minh với chúng ta rằng loài người có tinh thần sáng tạo đáng kinh ngạc”!",idea:"Kết: di sản nhân loại.",q:[],note:[["拥有","Xem 辨析 拥有—具有."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: danh từ & từ vựng thiên nhiên",G:[{id:"g1",grp:0,word:"时而",zh:"时而……，时而……",py:"shí'ér",tag:"Chú thích 1 · phó từ (văn viết)",mean:"Phó từ văn viết, hai cách dùng: ① <b>hai (hoặc hơn) 时而 dùng liền</b> → câu song song, nhiều tình huống <b>xen kẽ nhau</b> (“lúc thì…, lúc thì…”); ② <b>dùng một mình</b> → hành động lặp lại <b>không định kỳ</b> (“thỉnh thoảng”), thường đứng trước cụm động từ.",forms:["时而 + A，时而 + B（，时而 + C）","时而 + V（thỉnh thoảng）"],ex:[["我们的车在大山里沿着公路盘旋而行，时而行驶在深深的谷底，时而爬升到海拔一千多米高的山腰。","",1],["五彩的蝴蝶颜色鲜艳极了，尤其是在阳光下，时而金黄，时而翠绿，时而由紫变蓝。","Con bướm sặc sỡ, nhất là dưới nắng, lúc vàng óng, lúc xanh biếc, lúc từ tím chuyển lam."],["主人去世以后，那狗没有了往日的精神，一点儿东西不吃，时而发出令人伤心的叫声。","Chủ mất, con chó mất hết sinh khí, chẳng ăn gì, thỉnh thoảng lại kêu lên thảm thiết."],["女儿第一天上幼儿园回来特别高兴，时而掏出老师奖励的小红花，看后又小心地珍藏起来。","Con gái đi mẫu giáo ngày đầu về rất vui, thỉnh thoảng lại lấy bông hoa đỏ cô thưởng ra xem rồi cẩn thận cất đi."]],tips:["Khẩu ngữ: <span class='zh'>一会儿……，一会儿……</span>.","Bài tập 2②."],practice:{q:"为句子选择适当的上句或下句：A 高低不平，延伸到看不到尽头的远方 · B 他的语言来自民间 · C 半天了，他还是拿不定主意",type:"complete",items:[["那是一条年久失修的老路，时而土路，时而水泥道，(____)。","……时而土路，时而水泥道，A 高低不平，延伸到看不到尽头的远方。"],["(____)，时而说已经想好了，就这么办，时而又犹豫不决，说还得好好想想。","C 半天了，他还是拿不定主意，时而说已经想好了，……"],["(____)，时而朴实、自然，时而幽默、生动，有的像政论，有的像诗歌，深受读者喜爱。","B 他的语言来自民间，时而朴实、自然，时而幽默、生动，……"]]}},{id:"g2",grp:0,word:"依旧",zh:"依旧",py:"yījiù",tag:"Bài tập 2①",mean:"Động từ / phó từ văn viết = <span class='zh'>照旧 · 仍旧</span> — vẫn như cũ. Có thể đứng <b>trước</b> động từ (phó từ) hoặc <b>sau</b> tính từ / cụm chủ vị làm vị ngữ (<span class='zh'>壮丽依旧 · 风景依旧</span>).",forms:["依旧 + V/Adj","N + Adj + 依旧"],ex:[["……一片片梯田壮丽依旧。","",1],["几十年过去了，这个地方依旧贫穷落后。","Mấy chục năm trôi qua, nơi này vẫn nghèo nàn lạc hậu."]],tips:["Khởi động 2: nhóm <span class='zh'>旧</span>."]},{id:"g3",grp:1,word:"不禁",zh:"不禁",py:"bùjīn",tag:"Chú thích 2 · phó từ",mean:"Phó từ = <b>không tự chủ được, không kìm được</b>. Theo sau có thể là <b>cụm động từ, cụm chủ vị, tính từ</b>.",forms:["不禁 + V（问 / 笑 / 流泪）","不禁 + Adj（起来）"],ex:[["……它比历史悠久的宫殿更让我感动。我不禁问自己，这里的人为什么选择了梯田？","",1],["那是我第一次用汉语演讲，走上讲台，不禁心里有些发慌。","Đó là lần đầu tôi thuyết trình bằng tiếng Trung, bước lên bục, không khỏi thấy hơi hoảng."],["听到这个消息，大家不禁兴奋起来。","Nghe tin ấy, mọi người không kìm được phấn khích."]],tips:["Gần nghĩa: <span class='zh'>不由得 · 忍不住</span>.","⚠️ 禁 đọc <b>jīn</b> (khác <span class='zh'>禁止 jìn</span>)."],practice:{q:"完成句子",type:"complete",items:[["听他说得________，大家不禁连连点头。","听他说得头头是道，大家不禁连连点头。"],["看着电影中父子情深，他不禁________。","看着电影中父子情深，他不禁想起了自己的父亲，流下了眼泪。"],["看到污染的河流，人们不禁要问：“________？”","看到污染的河流，人们不禁要问：“我们的子孙后代还能喝上干净的水吗？”"]]}},{id:"g4",grp:1,word:"锲而不舍",zh:"锲而不舍 · 目睹 · 罕见",py:"",tag:"Bài tập 2③⑤⑥",mean:"Ba từ văn viết hay dùng để thay cách nói khẩu ngữ: <span class='zh'>坚持到底、不放弃 → 锲而不舍</span>; <span class='zh'>亲眼看到 → 目睹</span>; <span class='zh'>非常少见 → 罕见</span>.",forms:["……的锲而不舍","目睹了……","罕见的 + N"],ex:[["经过数十代人的锲而不舍，他们终于将一座座大山，雕塑成了梯田。","",1],["她目睹了自己的家被大火烧掉了，内心非常痛苦。","Cô tận mắt thấy nhà mình bị lửa thiêu rụi, lòng đau đớn vô cùng."],["他患上了一种罕见的疾病，连最有经验的大夫都感到头疼。","Anh mắc một căn bệnh hiếm gặp, đến bác sĩ giàu kinh nghiệm nhất cũng đau đầu."]],tips:["<span class='zh'>锲而不舍</span> xuất xứ 《荀子》: <span class='zh'>锲而舍之，朽木不折；锲而不舍，金石可镂</span>."]},{id:"g5",grp:2,word:"",zh:"无不",py:"wúbù",tag:"Chú thích 3 · phó từ (văn viết)",mean:"Phó từ = <span class='zh'>没有一个不 · 全都</span> — “không ai / không gì không…”. Phủ định kép → khẳng định mạnh. Thường đứng trước <b>động từ, cụm động từ</b>. Dùng trong văn viết.",forms:["chủ ngữ (tất cả) + 无不 + V"],ex:[["坏人受到了应有的惩罚，百姓无不拍手称快。","Kẻ xấu bị trừng phạt thích đáng, dân chúng ai cũng vỗ tay hả hê."],["哈尼梯田的美景让人陶醉，这里的一切无不体现着当地百姓与自然和谐相处的智慧。","",1],["……任何人的一言一行，一举一动，无不影响着你周围的人们……","… lời nói, cử chỉ của bất kỳ ai đều ảnh hưởng đến những người xung quanh bạn…"]],tips:["So sánh <span class='zh'>无不 = 都</span>; <span class='zh'>不无 = 有些</span> (không phải không có).","Bài 13: <span class='zh'>无不依赖电脑来完成</span>."],practice:{q:"为“无不”选择适当的位置",type:"pos",items:[["A他设计的灯具、家具B和各种装饰品，C造型新颖，D光彩照人。","C","……和各种装饰品，无不造型新颖，光彩照人。"],["……C但凡有一些创业体会的人，D在他一针见血的点评中了解到了创业的本质。","D","但凡有一些创业体会的人，无不在他一针见血的点评中了解到了创业的本质。"],["……李敖的情感经历C与他笔下那颇含激情的文章一样，D充满传奇的色彩。","D","……一样，无不充满传奇的色彩。"]]}}],BX:{grp:2,word:"拥有",cols:["拥有","具有"],pair:"拥有 — 具有",same:["Đều là động từ, đều chứa nghĩa <b>“có”</b>, nhưng thường <b>không thay nhau được</b>.","—"],diff:[["Thiên về <b>sở hữu</b>, thường chỉ những thứ <b>nhiều, quý</b>: đất đai, dân số, tài sản, tài nguyên, tình yêu, quyền lợi…","我国拥有丰富的水电资源。","Thiên về <b>tồn tại</b>, dùng nhiều cho sự vật <b>trừu tượng</b>: đặc sắc, đặc điểm, hứng thú, trình độ, ý nghĩa…<div class='zh' style='margin-top:4px'>我喜欢看具有民族风情的电视节目。</div>"]],task:{q:"选择“拥有”或“具有”填空",cols:["拥有","具有"],sample:!1,items:[["柴达木盆地____22万平方公里的面积。",0,"Diện tích (đất đai) → 拥有."],["这次改革____划时代的伟大意义。",1,"<span class='zh'>意义</span> trừu tượng → 具有."],["每个公民都____选举权和被选举权。",0,"Quyền lợi → 拥有."],["这项工艺____相当高的技术水准。",1,"<span class='zh'>水准</span> trừu tượng → 具有."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>雕</u>刻","雕塑 · 雕花 · 雕像 · 石雕"],items:[["<u>枯</u>萎","枯","枯燥 · 枯竭 · 干枯 · 海枯石烂"],["<u>震</u>撼","震","震动 · 震惊 · 震荡 · 地震"],["辛<u>勤</u>","勤","勤劳 · 勤奋 · 勤快 · 出勤"],["<u>珍</u>稀","珍","珍贵 · 珍惜 · 珍爱 · 珍藏"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["几十年过去了，这个地方还是贫穷落后。→ ________","依旧","几十年过去了，这个地方依旧贫穷落后。"],["他们玩儿得兴高采烈，一会儿唱歌，一会儿跳舞。→ ________","时而……，时而……","他们玩儿得兴高采烈，时而唱歌，时而跳舞。"],["他患上了一种非常少见的疾病，连最有经验的大夫都感到头疼。→ ________","罕见","他患上了一种罕见的疾病，连最有经验的大夫都感到头疼。"],["他要做的事情，谁也拦不住，你们就别管他了。→ ________","阻拦","他要做的事情，谁也阻拦不了，你们就别管他了。"],["她亲眼看到自己的家被大火烧掉了，内心非常痛苦。→ ________","目睹","她目睹了自己的家被大火烧掉了，内心非常痛苦。"],["由于小王做事能坚持到底、不放弃，所以最后取得了成功。→ ________","锲而不舍","由于小王做事锲而不舍，所以最后取得了成功。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["庄稼","牲畜","干旱","耕地","枯萎"],text:"连续几个月没下雨，我国西部地区遭遇了几十年不遇的{干旱}，{庄稼}大面积{枯萎}，人和{牲畜}饮水困难，旱情十分严重。但勤劳的农民们想方设法从各地运水来浇灌{耕地}，使得农作物没有大面积绝收。"},{bank:["珍稀","审美","生态","遗产","陶醉"],text:"九寨沟是中国第一个以保护自然风景为主要目的的自然保护区。它像一幅美丽画卷展示在人们面前，令人{陶醉}。由于风景优美，{生态}环境良好，它获得了“世界自然{遗产}”的称号。除了具有很高的{审美}价值，九寨沟还蕴藏着丰富、{珍稀}的动植物资源。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"<u>尽管</u>已目睹这奇迹无数次，<u>但</u>我每次身临其境，<u>都</u>会为哈尼族的山民们在这重重叠叠的山脉上雕塑出的美丽画卷而震惊。",task:"尽管____，但____，都____。",model:"尽管已经来过下龙湾很多次，但我每次坐船进入海湾，都会为那些千姿百态的小岛而陶醉。"},{src:"<u>面对</u>大山，山民们<u>没有</u>对抗，<u>而是选择</u>了服从——他们服从自然规律，选择开辟梯田这种农耕方式，<u>最终</u>与大自然和谐相处。",task:"面对____，____没有____，而是选择____，最终____。",model:"面对失败，他没有放弃，而是选择了从头再来，最终考上了理想的大学。"}]},EX5:{q:"根据课文内容回答问题",rows:[["当中国西南遭遇干旱时，哈尼梯田怎么样？","……壮丽依旧，…… / ……的天空，……的白云，……的树影，更衬托出……","西南遭遇干旱时，哈尼梯田壮丽依旧，依山形而流转，像一张张亮丽的油画；蔚蓝的天空、漂浮的白云、摇摆的树影，更衬托出梯田的壮美。"],["描述一下坐在车上遥望梯田时看到的风景。","山顶……，峡谷间……，半山腰……，村子下……","山顶是大片的森林，峡谷间是闪闪发光的小溪、泉水和瀑布，半山腰是村子，村子下是如山如海、纵横万里的梯田。"],["为什么“我”每次目睹哈尼梯田都感到震惊？","这是……的作品，它比长城……，比宫殿……","这是以大地为背景、用生命和毅力雕刻出的杰出作品，它比万里长城更让我震撼，比历史悠久的宫殿更让我感动。"],["这里的人为什么选择了梯田？","古老的曲子：…… / 经过数十代人的锲而不舍…… / ……与大自然和谐相处","古老的曲子说，祖先们只靠打猎、采集过不了日子，于是学会了种植，发现种子离不开水；经过数十代人的锲而不舍，他们把大山雕塑成梯田，服从自然规律，与大自然和谐相处。"],["哈尼梯田有什么价值？","以其……，展示着……","它以其宝贵的生态、文化和审美价值，展示着它的罕见和珍稀。"],["哈尼梯田体现了什么样的智慧和精神？","体现：和谐相处、对……的尊重 / 蕴含：人与自然、人类","它体现着当地百姓与自然和谐相处的智慧和对自身文化、自然环境的尊重；蕴含着人与自然和谐发展的精神，也证明人类拥有惊人的创造精神。"]]},BJ:{title:"病句类型：成分冗余",vn:"Câu sai — loại 7: thừa thành phần",intro:"<b>成分冗余</b>: kết cấu câu đã hoàn chỉnh, ý câu đã rõ, nhưng lại xuất hiện thêm từ ngữ <b>không cần thiết</b> — lặp chủ ngữ, lặp tân ngữ, lặp phó từ, lặp trạng ngữ, lặp nghĩa từ. Bấm vào phần <b>thừa</b>.",types:[["主语重复","Lặp chủ ngữ","我们班同学，上课的时候，我们都能专心听讲，认真思考问题。","我们班同学，上课的时候，都能专心听讲……","Bỏ chữ <span class='zh'>我们</span> thứ hai."],["宾语重复","Lặp tân ngữ","一想起我教过的学生，真的打心眼里舍不得离开这些学生。","……舍不得离开他们。","Bỏ <span class='zh'>这些学生</span> cuối câu hoặc đổi thành <span class='zh'>他们</span>."],["副词重复","Lặp phó từ","那个地方谁也都不想去。","那个地方谁也不想去。 / 谁都不想去。","Từ phiếm chỉ đi với <span class='zh'>也</span> <b>hoặc</b> <span class='zh'>都</span>, không dùng cả hai."],["状语重复","Lặp trạng ngữ","我们碰到了一些困难，这个问题短时间内不可能很快得到解决。","……短时间内不可能得到解决。","<span class='zh'>短时间内</span> và <span class='zh'>很快</span> trùng nghĩa — bỏ một."],["词义重复","Lặp nghĩa từ","人们如果连续看电视超过四个多小时，就会疲劳。","……超过四个小时 / 四个多小时……","<span class='zh'>超过</span> và <span class='zh'>多</span> trùng nghĩa."]],practice:[["我始终不明白，他为什么要那样做的原因。","的原因","我始终不明白，他为什么要那样做。 / ……他那样做的原因。","<span class='zh'>为什么</span> và <span class='zh'>原因</span> lặp nghĩa."],["凡事要依靠群众，否则只靠自己，什么事也做不成。","只靠自己","凡事要依靠群众，否则什么事也做不成。","<span class='zh'>否则</span> đã bao hàm “nếu không dựa vào quần chúng” → <span class='zh'>只靠自己</span> thừa."],["经法院审理，违约经营的张某被判赔偿原告经济损失5万多余元。","多","……经济损失5万多元。 / 5万余元。","<span class='zh'>多</span> và <span class='zh'>余</span> cùng nghĩa “hơn”."],["这幅画是祖上传下来的，出自于名家之手。","于","这幅画是祖上传下来的，出自名家之手。","<span class='zh'>自</span> đã là giới từ “từ” → <span class='zh'>于</span> thừa."],["根据美国某大学研究所发布的《2013全球幸福指数报告》显示，丹麦成为世界最幸福的国家。","根据","美国某大学研究所发布的《……报告》显示，…… / 根据……《……报告》，……","<span class='zh'>根据</span> và <span class='zh'>显示</span> lặp — giữ một (lỗi rất hay gặp!)."]]},DP:[{title:"词汇：看图片，熟悉下列名词",vn:"Danh từ đời sống — văn hóa.",items:[["泡沫","pàomò","bọt","—","洗手时一定要把泡沫清洗干净。"],["杂技","zájì","xiếc, tạp kỹ","表演杂技","我喜欢看杂技表演。"],["书法","shūfǎ","thư pháp","书法作品","这是一幅书法作品。"],["压岁钱","yāsuìqián","tiền mừng tuổi","给压岁钱","过春节时，大人要给孩子压岁钱。"],["塔","tǎ","tháp","一座塔","远处有一座塔。"],["亭子","tíngzi","đình, chòi nghỉ","一个亭子","河边有一个小亭子。"]]},{title:"熟悉下列自然方面的词语",vn:"Từ vựng thiên nhiên — chia nhóm (cột 搭配).",items:[["冰雹","bīngbáo","mưa đá","天气","昨天下了一场冰雹。"],["台风","táifēng","bão (nhiệt đới)","天气","台风明天将在沿海登陆。"],["气象","qìxiàng","khí tượng","天气","他在气象台工作。"],["气压","qìyā","áp suất không khí","天气","高山上气压很低。"],["淡水","dànshuǐ","nước ngọt","资源","地球上的淡水资源非常有限。"],["天然气","tiānránqì","khí thiên nhiên","资源","我们家用天然气做饭。"],["太空","tàikōng","vũ trụ, không gian","宇宙","宇航员在太空中生活了半年。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"1768年7月下旬，酷热笼罩着大地。紫禁城里，人们开始为皇家一年一度前往承德避暑山庄的转移做准备。在那里，有一片按照江南风格与神韵巧妙设计而成的园林，坐落着富有南方情调的豪华宫殿以及令人赏心悦目的亭台楼阁。",o:["皇帝要去承德避暑了","7月的北方气候舒适","避暑山庄的宫殿十分简朴","紫禁城里有一片美丽的园林"],a:0,why:"“为皇家一年一度前往承德避暑山庄的转移做准备”. C: cung điện <b>xa hoa</b>; D: khu vườn ở Thừa Đức."},{n:2,say:"雏燕放飞的时候终于到了。为了这一天的到来，女儿的老师、朋友，以及我先生、我和女儿本人，都付出了许多心血。这些心血已经变成女儿起飞的动力，使她能够展开翅膀，飞翔在全球资本市场的上空。",o:["女儿是个科学家","女儿是个飞行员","很多人付出了心血","很多人来祝贺女儿"],a:2,why:"“都付出了许多心血”. B: “bay” chỉ là ẩn dụ (thị trường vốn toàn cầu)."},{n:3,say:"喜欢旅游是因为她想放眼世界，在旅游中体验“行千里路胜读万卷书”的乐趣。喜欢烹饪，是因为她想用美味佳肴奖励辛勤工作之后的自己，同时也为亲朋好友献上在餐厅里吃不到的“美女私房菜”。",o:["她喜欢旅游途中读书","她有一家自己的餐厅","她喜欢读与旅游相关的书","她喜欢做出美味与朋友共享"],a:3,why:"“为亲朋好友献上……私房菜”."},{n:4,say:"李小龙是一个神话。他以原本并不优秀的天赋自创截拳道，并成为影响世界的一代功夫巨星。他可在拍出多部影响世界的功夫电影的同时著书立说。他惊人的毅力和坚韧的品格，都已成为后人无法复制的神话。",o:["李小龙有书出版","李小龙口才很好","李小龙十分有天赋","没人想复制李小龙"],a:0,why:"“著书立说” = viết sách. C sai: “原本并不优秀的天赋”."},{n:5,say:"很显然，一些学科所以能够产生、存在和发展是因为它对于社会、人类有着自己的功能和价值。这种功能、价值一旦消失，这门学科便会失掉存在的意义，便会或迟或早地枯萎，直至被取消。",o:["学科产生是社会发展的必然","学科存在的前提是对社会有用","学科的功能、价值迟早会消失","随着社会的发展将不再区分学科"],a:1,why:"Ngành học tồn tại “是因为它对于社会、人类有着自己的功能和价值”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：大家好，现在坐在我身边的是旅行家郑先生。郑先生，您好！\n男：您好！我不是什么旅行家，只是喜欢旅行。\n女：或者说是喜欢旅行在路上的感觉？\n男：对，这个贴切。旅行在路上不仅能让你陶醉于风景，更重要的是体验人与人的沟通。忘却自己的身份去和来自不同地方的人面对面交流，这是我最喜欢的。\n女：听说您尤其喜欢搭车旅行？\n男：是，因为异样的旅行方式会带你感受不一样的风景。\n女：搭车旅行是最近才兴起的吗？\n男：不，国外早就有。中国是前几年，美籍华裔小伙谷岳和纪录片导演刘畅两个人历经三个月，从北京出发到柏林，一路上只依靠陌生人的帮助，共搭车88次，走了16000多公里，穿越13个国家。这件事在中国传开之后，很多人开始搭车旅行。\n女：碰上的都是未知的，我们不禁会对未知产生憧憬和向往！\n男：也会充满惶恐，因为不知道自己该如何踏出勇敢的第一步。\n女：能跟我们分享一下您记忆最深刻的搭车旅行吗？\n男：那就是去西藏了。\n女：冒险加神秘感？\n男：不是，是西藏的壮美让我震撼。我那次运气特别好，搭的是一位藏族同胞的车，他是做生意的，我搭他的车几乎跑遍了我计划中所有想去的地方。\n女：成专车了！\n男：嗯，他说一个人开车也闷得慌，有我一路聊天儿，他还能跟我练练普通话。我们第一天是从拉萨去林芝，一路上抬头是蔚蓝的天空、漂浮的白云，远望是牧民、草场和牛、羊等牲畜，天上偶尔有老鹰盘旋。翻过米拉山，汽车开始在山谷间行驶，山上有泉水、瀑布，在峡谷间汇集成小溪，随着水量的增加，小溪汇聚成了江河，最后成了汪洋一片。那天的行程是我最有感悟的一天。\n女：感悟什么呢？\n男：“不积小流，无以成江海。”\n女：是啊，就像滴水穿石一样，积累的作用不能小看。",qs:[{n:6,q:"男的为什么喜欢“旅行在路上”的感觉？",o:["因为能够认识更多有身份的人","因为别人能告诉你哪里风景好","因为能与不同的人面对面交流","因为能够了解各地的风土人情"],a:2,why:"“和来自不同地方的人面对面交流，这是我最喜欢的”."},{n:7,q:"关于搭车旅行，下列哪项正确？",o:["美国人在中国经常搭车旅行","很早以前中国人就搭车旅行","三个月以前有人尝试搭车旅行","谷岳、刘畅的搭车旅行影响了中国人"],a:3,why:"“这件事在中国传开之后，很多人开始搭车旅行”."},{n:8,q:"搭车旅行的魅力是什么？",o:["对未知的神往","对已知的期待","对艰辛的恐惧","对能力的提升"],a:0,why:"“对未知产生憧憬和向往”."},{n:9,q:"关于男的在西藏搭车的经历，下列哪项正确？",o:["车主是个汉族人","车主也喜欢旅游","车主喜欢有人聊天儿","车主对西藏不太熟悉"],a:2,why:"“一个人开车也闷得慌，有我一路聊天儿”."},{n:10,q:"男的在西藏有什么感悟？",o:["西藏的生态环境很好","西藏的江河湖海很美","一路的景色自然纯朴","积累的作用不能小看"],a:3,why:"“不积小流，无以成江海” — tích tiểu thành đại."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"“地球生态超载日”又称“生态越界日”或“生态负债日”。“地球生态超载日”指的是，根据估计，地球当天进入了本年度生态赤字状态，即地球上全部人类活动的总消费量已超出了地球本年度产生的可再生自然资源的总量。\n我们的地球就像失去了尾巴的壁虎，本来是可以恢复原貌的。它可以让植物再生长，可以恢复鱼类资源，重新吸收空气中的碳，让干净的水重回湖泊、河流和地下蓄水层。但这些过程需要时间。\n自文明发祥以来的很长一段时间，地球补充资源的速度快于人类消耗资源的速度。然而，我们最终还是跨过了那条看不见的界线。从1970年起，我们每年从地球获取的资源开始超过其可以恢复的资源，自那以后，“地球生态超载日”就一路狂奔，不可阻挡，2015年的8月13日它就已经来了。",qs:[{n:11,q:"“地球生态超载日”意味着什么？",o:["生态已经入不敷出","地球资源已近枯竭","地球已无法再制造资源","人类对再生资源利用不够"],a:0,why:"Tiêu thụ vượt tài nguyên tái tạo trong năm → <span class='zh'>入不敷出</span> (chi vượt thu)."},{n:12,q:"说话人举壁虎的例子主要想说明什么？",o:["壁虎的自愈能力非常强","地球资源是取之不尽的","地球修复是需要时间的","污染的水无法自行净化"],a:2,why:"“本来是可以恢复原貌的……但这些过程需要时间”."},{n:13,q:"人类活动造成了怎样的后果？",o:["地球补充资源的速度变慢了","地球的修复时间越来越快了","“地球生态超载日”不好计算了","“地球生态超载日”越来越提前了"],a:3,why:"“一路狂奔，不可阻挡，2015年的8月13日它就已经来了”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"丝绸之路，简称丝路。是指西汉时，张骞出使西域开辟的以长安（今天的西安）为起点，经甘肃、新疆，到中亚、西亚，并联结地中海各国，通往欧、非大陆的陆路通道。\n中国是丝绸的故乡，在经由这条路线进行的贸易中，中国输出的商品以丝绸最具代表性，而输入的商品有玉石、珠宝、皮毛、香料、汗血马以及葡萄、黄瓜等农产品。19世纪下半期，德国地理学家李希霍芬在1877年出版的《中国》一书中将这条陆上交通路线称为“丝绸之路”，此后中外史学家都赞成此说，沿用至今。\n除了上述的路线之外，还有一条在南北朝时期形成，在明末发挥巨大作用的海上丝绸之路以及另一条在元末取代西北丝绸之路成为路上交流通道的南方丝绸之路。",qs:[{n:14,q:"这段话中的“丝路”指的是什么？",o:["陆上丝绸之路","海上丝绸之路","南方丝绸之路","运送丝绸的路"],a:0,why:"“……通往欧、非大陆的陆路通道”."},{n:15,q:"说话人提到德国地理学家李希霍芬主要想说明什么？",o:["他是一位地理学家","他是很有影响力的学者","他写过一本书叫《中国》","“丝绸之路”名字的由来"],a:3,why:"“将这条陆上交通路线称为‘丝绸之路’”."},{n:16,q:"丝绸之路的起点是今天的哪里？",o:["新疆","西安","甘肃","中亚"],a:1,why:"“以长安（今天的西安）为起点”."},{n:17,q:"根据这段话，可以知道什么？",o:["有了丝绸之路中国才有了马匹","中国出口商品中丝绸影响最大","陆路贸易通道在当时更受欢迎","丝绸之路是贸易往来的唯一通道"],a:1,why:"“中国输出的商品以丝绸最具代表性”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["皮格马利翁是古代塞浦路斯的一位善于雕刻的国王。","这天，邻居家办喜事，请我去写对联，回来时已近中午。","他的豌豆杂交试验历时7年，他逐个地分析了数以万计的种子和植株。","制作糖瓜很难勾起年轻人的积极性，天天起早贪黑不算，还挣不了多少钱。"],a:3,why:"<b>Kết hợp sai</b>: <span class='zh'>勾起</span> + hồi ức/hứng thú; với <span class='zh'>积极性</span> phải dùng <span class='zh'>调动</span>."},{n:19,o:["每到开花季节，勤劳的蜜蜂到处采集花蜜，然后酿成蜜糖。","他是我们班学习最努力的学生，我断定他大概会考上大学。","这里环境优美，迷人的峡谷装饰着四时各异的色彩，令人流连忘返。","鸳鸯既吃小鱼小虾和昆虫一类动物性食物，也吃稻谷、草籽等植物性食物。"],a:1,why:"<b>Mâu thuẫn</b>: <span class='zh'>断定</span> (khẳng định chắc) ↔ <span class='zh'>大概</span> (phỏng đoán)."},{n:20,o:["他家过年的餐桌上曾经必备的一道菜，还有蛋饺。","具有锲而不舍追求真理的精神是一个人走向成功的必要因素。","计划工作是为实现组织未来目标铺平道路的，其本身就具有前瞻性。","21世纪，经济全球化的浪潮汹涌澎湃，金融一体化则是经济全球化的关键。"],a:0,why:"<b>Trật tự / thiếu thành phần</b>: → <span class='zh'>他家过年的餐桌上曾经必备的一道菜是蛋饺</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"“温室___”使全球气候变得___，许多地方发生干旱或洪涝，还会使冰山融化，海平面___，海拔低的国家或岛屿有可能被淹没。",o:["效果　反常　抬高","效应　异常　升高","现状　失常　提升","现象　特别　提高"],a:1,why:"<span class='zh'>温室效应</span> (cố định); <span class='zh'>气候异常</span>; <span class='zh'>海平面升高</span> (tự nhiên dâng lên — <span class='zh'>提高</span> cần chủ thể làm)."},{n:22,text:"石林是世界___的风景名胜，是大自然的___之作。在广达400平方公里的区域内，___着上百个黑色大森林一般的巨石群。有的独立成景，有的___交错，连成一片。",o:["珍稀　出色　充满　时而","拥有　鬼斧　漫布　犬牙","目睹　经典　遍及　重叠","罕见　杰出　遍布　纵横"],a:3,why:"<span class='zh'>世界罕见</span>; <span class='zh'>杰出之作</span>; <span class='zh'>遍布着</span>; <span class='zh'>纵横交错</span> — gần như toàn từ mới bài này!"},{n:23,text:"随着人口的增加和耕地面积的减少，对农业生产的要求也越来越高，科学家必须___更多高产、优质、抗病虫的动植物___，提供效率更高的高产优质生产___和更好保护地球环境的___发展策略。",o:["培育　品种　技术　可持续","培养　种类　技能　可利用","养育　产品　能力　可行性","耕种　商品　本领　可靠性"],a:0,why:"<span class='zh'>培育品种</span> (bài 10); <span class='zh'>生产技术</span>; <span class='zh'>可持续发展</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"世界文化遗产，是一项由联合国发起、联合国教育科学文化组织负责执行的国际公约建制，以保存对全世界人类都具有杰出普遍性价值的自然或文化处所为目的。(24)，世界文化遗产属于世界遗产范畴。\n世界遗产分为自然遗产、文化遗产、自然遗产与文化遗产混合体（即双重遗产）、文化景观遗产4类。国际文化纪念物与历史场所委员会等非政府组织作为联合国教科文组织的协力组织，(25)。\n1972年，联合国教科文组织在世界文化遗产总部巴黎通过了《保护世界文化和自然遗产公约》，(26)，其宗旨在于促进各国和各国人民之间的合作，(27)。\n自中华人民共和国在1985年12月12日加入《保护世界文化与自然遗产公约》的缔约国行列至今，世界文化遗产、世界文化景观遗产、世界文化与自然双重遗产、世界自然遗产，(28)。",opts:["成立联合国教科文组织世界遗产委员会","参与世界遗产的甄选、管理与保护工作","均有经联合国教科文组织审核被批准列入《世界遗产名录》的项目","为合理保护和恢复全人类共同的遗产做出积极的贡献","世界文化遗产是文化的保护与传承的最高等级"],ans:{24:4,25:1,26:0,27:3,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"三江并流自然保护区是世界上蕴藏最丰富的地质地貌博物馆。4000万年前，印度次大陆板块与欧亚大陆板块大碰撞，引发了横断山脉的急剧挤压、隆升、切割，高山与大江交替展布，形成世界上独有的三江并行奔流170千米的自然奇观。\n三江并流是一个很大的区域。准确地讲，是指长江上游的金沙江、湄公河上游的澜沧江以及怒江三条大江的并流区域，三江并行奔流，穿越于崇山峻岭之间，形成世界上罕见的“江水并流而不交汇”的奇特自然地理景观。\n三江并流地处东亚、南亚和青藏高原三大地理区域的交汇处，是世界上罕见的高山地貌及其演化的代表地区，也是世界上生物物种最丰富的地区之一。三江并流自然保护区总面积3500多平方公里。景观主要包括三江并流、高山雪峰、峡谷险滩、林海雪原、冰蚀湖泊，广阔美丽的雪山花甸、丰富的珍稀动植物、独特的民族风情等。同时，该地区还是16个民族的聚居地，是世界上罕见的多民族、多语言、多种宗教信仰和风俗习惯并存的地区，是一块令人神往的处女景区。",qs:[{n:29,q:"关于三江并流的形成，下列哪项正确？",o:["是横断山脉断裂的结果","是江水奔流冲刷的结果","是大陆板块碰撞的结果","是人为改造自然的结果"],a:2,why:"“印度次大陆板块与欧亚大陆板块大碰撞，引发了……”."},{n:30,q:"三江并流的奇特之处在于：",o:["三条大江都很长","三条大江都很有名","三条大江都发源于长江","三条大江并行而不交叉"],a:3,why:"“江水并流而不交汇”."},{n:31,q:"关于三江并流，下列哪项正确？",o:["那里的景观丰富壮丽","那里的生态保护做得不好","那里的动物种类为世界之最","那里的百姓聚居在16个区域"],a:0,why:"Liệt kê: sông, núi tuyết, hẻm núi, rừng, hồ, đồng hoa… C: “<b>之一</b>”; D: <b>16 dân tộc</b>."},{n:32,q:"第3段画线词语“处女景区”的意思是：",o:["尚未开发的景区","神仙都想去的景区","女人比男人多的景区","母系民族文化尚存的景区"],a:0,why:"<span class='zh'>处女地</span> = vùng đất chưa khai phá."}]},{ins:"第33–36题：请选出正确答案。",text:"1981年，法国创设“最美乡村”品牌，至今已有157个古镇被列入法国文化遗产保护范围。有着1000多年历史的古镇贝弗龙，就是“最美乡村”之一。为保持原生态，贝弗龙严格控制商业用房的开发数量，至今依旧只有一家面包店、一家小超市和为数不多的几家咖啡馆与餐馆。虽然生活不太方便，但保护与开发的平衡发展为贝弗龙赢得了生机，也给村民带来了实实在在的好处。\n英国古城镇的保护与19世纪兴起的历史文化遗产立法运动息息相关。《古迹保护法令》《城市规划法令》《古建筑及古迹法令》《地方政府古建筑法令》等多部专门的法律法规相继出台。根据这些法律规定，凡是1840年前的建筑物，都要加以保护，不得更改外观。\n在德国，保护、修复甚至重建古城和古代建筑很少引发德国公众大讨论。二战后，德国人努力按照原样修复或重建历史建筑，由此形成的“老建筑”无不以假乱真。为保护和修复古建筑以及古镇，德国政府积极采取措施吸引投资者参与，同时通过立法约束确保古建筑保护到位。\n中国古镇的开发、保护热潮早已席卷全国，除了乌镇、丽江、凤凰这些游客早已耳熟能详的古镇外，四川的丹巴藏寨，几百幢民居依山就势，融于自然之中，体现了天人合一的理念；新疆的图瓦村环境优美，四周山清水秀，充满着古朴的原始色彩；云南的哈尼村落坐落在美丽的田园之中，与梯田、庄稼相依相谐，如同仙境一般；腾冲的和顺古镇有清代民居100多座，风光如诗如画，被誉为中国古代建筑的活化石。",qs:[{n:33,q:"法国贝弗龙古镇：",o:["开发中避免了过度商业化","只为村民想，不为游客想","生活不方便阻碍了它的发展","在保护与开发之间经常摇摆"],a:0,why:"“严格控制商业用房的开发数量”."},{n:34,q:"在英国：",o:["开展了古镇保护的讨论","就城市建设有一系列法令","曾兴起历史文化遗产立法运动","1840年前的建筑物可以更改外观"],a:2,why:"“与19世纪兴起的历史文化遗产立法运动息息相关”. A là chuyện nước Đức (<b>ít</b> tranh luận)."},{n:35,q:"德国的“老建筑”：",o:["都是假的","修复后一点儿痕迹不露","全部由投资者参与修复","通过立法决定是否进行保护"],a:1,why:"“无不以假乱真” = giống y như thật (dùng <span class='zh'>无不</span> của bài này!)."},{n:36,q:"和第4段画线词语“耳熟能详”意思最相近的是：",o:["熟能生巧","轻而易举","耳闻目睹","家喻户晓"],a:0,why:"Đáp án sách bài tập ghi <b>A</b>. Lưu ý: xét nghĩa, <span class='zh'>耳熟能详</span> (nghe nhiều đến thuộc) gần nhất với <span class='zh'>家喻户晓</span> (nhà nhà đều biết); <span class='zh'>熟能生巧</span> = quen tay hay việc."}]}]},W:{zh:"写作",vn:"Viết văn: 我熟悉的……",t:"35 phút",min:!0,task:"这篇课文介绍了中国云南的哈尼梯田，请模仿课文以“我熟悉的……”为题介绍你所熟悉的一处名胜古迹或自然风景。内容尽量包括“地理位置、周边环境、历史变迁、人文或自然价值”等方面。写一篇不少于400字的文章。",target:400,steps:[["Chọn địa điểm & mở bài","VD: <span class='zh'>下龙湾 · 会安古镇 · 木仓柴梯田 · 顺化皇城</span>. Mở bằng một khoảnh khắc ấn tượng (như đoạn 1 bài khóa)."],["Vị trí & cảnh quan","Tả theo trình tự không gian: <span class='zh'>远望…… · 近看…… · 时而……时而……</span>; tính từ: <span class='zh'>壮丽 · 蔚蓝 · 纵横 · 重叠</span>."],["Lịch sử biến đổi","Hình thành thế nào, đã thay đổi ra sao (<span class='zh'>经过……的锲而不舍 · 依旧</span>)."],["Giá trị","<span class='zh'>以其……价值，展示着……</span>; <span class='zh'>无不体现着……</span>."],["Cảm xúc kết","<span class='zh'>尽管……，但……都会…… · 不禁……</span>"]],outline:[["一 · 引子","第一次 / 每次来到……的感受"],["二 · 地理位置与风景","位置；远望、近看"],["三 · 历史变迁","它是怎样形成的；过去和现在"],["四 · 价值","自然价值 / 人文价值"],["五 · 结尾","我的感受；它是……的遗产"]],model:"我熟悉的下龙湾\n下龙湾位于越南东北部的广宁省，离首都河内大约170公里。尽管我已经去过那里很多次，但每次坐船进入海湾，都会为眼前的景色而震撼。\n远远望去，蔚蓝的海面上，一千多座大大小小的石灰岩小岛重重叠叠，纵横交错，有的像大象，有的像斗鸡，有的像老人的脸，千姿百态。船在岛屿之间慢慢穿行，时而经过高高的石壁，时而进入平静的小湾，海风吹来，让人陶醉。有些岛上还有巨大的山洞，洞里的钟乳石在灯光下闪闪发光，好像一座座地下宫殿。\n关于下龙湾，越南有一个古老的传说：很久以前，外敌从海上侵犯，天上的龙母带着小龙飞下来，吐出无数的珍珠，变成了海上的岛屿，挡住了敌人。“下龙”的意思就是“龙下来的地方”。其实，这些小岛是经过几亿年的海水侵蚀才形成的。过去，这里只有一些渔民在船上生活；如今，下龙湾已经成了越南最有名的旅游景点，每年吸引几百万游客。\n下龙湾不仅具有很高的审美价值，还拥有珍稀的地质资源和丰富的海洋生物。1994年，它被列入《世界自然遗产名录》。这里的一切无不体现着大自然的神奇力量。\n每次离开下龙湾，我都不禁回头再看一眼。我希望人们在开发旅游的同时，也能好好保护这片美丽的海湾，让它成为子孙后代的宝贵遗产。",check:["Có tiêu đề “我熟悉的……”","Có vị trí địa lý","Có miêu tả cảnh theo trình tự","Có lịch sử / biến đổi","Có giá trị tự nhiên hoặc nhân văn","Dùng ít nhất 4: 时而 · 不禁 · 无不 · 拥有 · 具有 · 依旧 · 尽管……但……都","Không ít hơn 400 chữ"]},SUM:{words:["山脉","雕刻","干旱","耕地","庄稼","枯萎","牲畜","壮丽","依旧","峡谷","蔚蓝","漂浮","衬托","盘旋","时而","海拔","瀑布","纵横","汹涌","目睹","重叠","毅力","杰出","震撼","不禁","采集","锲而不舍","开辟","心血","辛勤","阻拦","生态","审美","罕见","珍稀","陶醉","遗产","拥有"],patterns:[["时而……，时而……","时而行驶在深深的谷底，时而爬升到……山腰。"],["我不禁……","我不禁问自己，这里的人为什么选择了梯田？"],["……无不……","这里的一切无不体现着当地百姓与自然和谐相处的智慧。"],["尽管……，但……都……","尽管已目睹这奇迹无数次，但我每次身临其境，都会……而震惊。"],["以其……，展示着……","这幅画卷以其宝贵的生态、文化和审美价值，展示着它的罕见和珍稀。"]],diff:["拥有：sở hữu thứ nhiều, quý (đất, dân số, tài nguyên, quyền) — 具有：có đặc điểm trừu tượng (意义 · 水平 · 特色 · 价值)","不禁 jīn ≠ 禁止 jìn · 重叠 chóng · 种子 zhǒng · 曲子 qǔ · 锲 qiè · 依旧 có thể đứng sau tính từ (壮丽依旧)"],sentences:["这是以大地为背景，用生命和毅力雕刻出的杰出作品。","面对大山，山民们没有对抗，而是选择了服从。","1300多年，山民们用汗水，用心血，用日复一日的辛勤劳动完成了山脉上的雕刻。"],hw:["Học thuộc 47 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “我熟悉的……” ≥400 chữ (mục 7).","Làm Sách bài tập bài 15.","Đọc trước bài 16."]}});
</script>
