<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 8 · 遇见原来的我 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-08",num:8,book:"HSK 标准教程 6（上）",unit:{n:2,zh:"不甘平庸",vn:"Không cam chịu tầm thường"},title:"遇见原来的我",vn:"Gặp lại tôi của ngày xưa",chars:932,source:"改编自《同龄鸟·问你问我》同名文章，作者：辛西娅·莱文森（Cynthia Levinson），翻译：凯西",goals:["Đọc hiểu bài 932 chữ bàn về câu hỏi triết học <b>“Hôm qua và hôm nay, tôi có còn là tôi?”</b> (vấn đề bản thể).","Dùng được 41 từ mới, đặc biệt nhóm từ <b>trình bày quan điểm</b>: <span class='zh'>确信 · 比喻 · 阐述 · 陈述 · 见解 · 推测 · 各抒己见 · 言论 · 学说 · 思索 · 设想</span>.","Nắm <span class='zh'>对……而言 · 有关 · 不瞒你说</span> (và các chen ngữ <span class='zh'>说实在的 / 依我看…</span>).","Phân biệt <span class='zh'>极端 — 极度</span>; luyện <b>sắp xếp câu thành đoạn</b> và từ trái nghĩa.","Viết 缩写 300 chữ tóm tắt các quan điểm triết học; làm thử đề 缩写 HSK (400 chữ)."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (对……而言 · 有关 · 极端—极度) · Bài khóa đoạn 1–7"],["Buổi 2","Từ vựng nhóm 3 (不瞒你说) · Đoạn 8–10 · Bài tập · Từ trái nghĩa · Luyện đề · 缩写"]],outline:[{tag:"问",name:"Đặt câu hỏi",paras:"Đoạn 1–3",zh:"婴儿照片上的是不是你？",vn:"Nhìn ảnh lúc sơ sinh — da, lúm đồng tiền, não bộ đã thay đổi hết; đứa bé ấy có phải là bạn không?"},{tag:"论",name:"Các quan điểm",paras:"Đoạn 4–6",zh:"赫拉克利特：始终只有一个你；休谟：自我在不断演变",vn:"Heraclitus: con người như dòng sông, vẫn là một; Hume: cái tôi là quá trình biến đổi liên tục."},{tag:"思",name:"Câu hỏi thực tế",paras:"Đoạn 7–9",zh:"承诺、罪犯、整形、移植——你还是你吗？帕菲特：本体不重要",vn:"Lời hứa, tội phạm, phẫu thuật, cấy ghép… bạn còn là bạn? Parfit: bản thể không thật sự quan trọng."},{tag:"结",name:"Kết – mở",paras:"Đoạn 10",zh:"普通人只想无忧无虑地过日子，但也许有一天会遇见崭新的我",vn:"Người thường chỉ muốn sống vô tư — nhưng biết đâu một ngày ta gặp một “tôi” hoàn toàn mới."}],warm1:{q:"你思考过这样的哲学问题吗：“昨天的你和今天的你是同一个人吗？”下列观点你同意哪一个？",vn:"Bạn từng nghĩ đến câu hỏi triết học: “Bạn hôm qua và bạn hôm nay có phải là một người không?” Bạn đồng ý với quan điểm nào?",items:[["🌊","不管你变化了多少，始终只有一个你。","Dù thay đổi bao nhiêu, vẫn chỉ có một bạn. (≈ Heraclitus)"],["🔄","以前的你跟现在的你并不是同一个人。","Bạn trước kia và bạn bây giờ không phải là một người. (≈ Hume)"],["🧠","人的思想最重要，本体并不是最重要的。","Tư tưởng con người quan trọng nhất, bản thể không quan trọng nhất. (≈ Parfit)"]],talk:["你觉得十年前的你和现在的你有什么不同？","什么东西让你一直是“你”？"],link:"Ba lựa chọn này chính là ba quan điểm của ba triết gia trong bài khóa."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"信",rule:"信 = <b>tin</b>.",w:[["确信","quèxìn","tin chắc (từ mới)"],["相信","xiāngxìn","tin"],["自信","zìxìn","tự tin"],["坚信","jiānxìn","tin chắc chắn"],["可信","kěxìn","đáng tin"],["听信","tīngxìn","nghe theo, tin theo"],["信用","xìnyòng","tín dụng, chữ tín"],["信心","xìnxīn","niềm tin"],["信任","xìnrèn","tín nhiệm"],["信念","xìnniàn","niềm tin, tín niệm"],["半信半疑","bàn xìn bàn yí","bán tín bán nghi"]]},{k:"现",rule:"现 = <b>hiện ra, lộ ra</b>.",w:[["发现","fāxiàn","phát hiện"],["表现","biǎoxiàn","biểu hiện"],["实现","shíxiàn","thực hiện"],["再现","zàixiàn","tái hiện"],["体现","tǐxiàn","thể hiện"],["展现","zhǎnxiàn","thể hiện, phô bày"],["呈现","chéngxiàn","hiện ra (từ mới)"],["现象","xiànxiàng","hiện tượng"],["活灵活现","huólíng-huóxiàn","sống động như thật"]]},{k:"述",rule:"述 = <b>kể, trình bày</b>.",w:[["口述","kǒushù","kể miệng"],["讲述","jiǎngshù","kể"],["复述","fùshù","kể lại"],["记述","jìshù","ghi chép lại"],["论述","lùnshù","luận thuật"],["转述","zhuǎnshù","thuật lại"],["自述","zìshù","tự thuật"],["陈述","chénshù","trình bày (từ mới)"],["表述","biǎoshù","diễn đạt"],["描述","miáoshù","miêu tả"],["阐述","chǎnshù","trình bày rõ (từ mới)"],["述说","shùshuō","kể lể"]]},{k:"变",rule:"变 = <b>thay đổi</b>.",w:[["改变","gǎibiàn","thay đổi"],["变化","biànhuà","biến hóa"],["变动","biàndòng","biến động"],["变换","biànhuàn","thay đổi, hoán đổi"],["变样","biànyàng","đổi khác"],["变形","biànxíng","biến dạng"],["转变","zhuǎnbiàn","chuyển biến"],["渐变","jiànbiàn","biến đổi dần"],["巨变","jùbiàn","thay đổi lớn"],["演变","yǎnbiàn","diễn biến (từ mới)"],["变心","biànxīn","thay lòng"],["变种","biànzhǒng","biến chủng"],["千变万化","qiānbiàn-wànhuà","thiên biến vạn hóa"],["一成不变","yì chéng bú biàn","không hề thay đổi"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–5",sub:"Bạn đã thay đổi thế nào? — Heraclitus",from:1,to:15},{name:"Nhóm 2 · Đoạn 6–9",sub:"Hume, câu hỏi thực tế, Parfit",from:16,to:32},{name:"Nhóm 3 · Đoạn 10",sub:"Người thường nghĩ gì?",from:33,to:41}],V:[[1,"婴儿","yīng'ér","dt.","anh nhi","trẻ sơ sinh",1,"","不满一岁的小孩儿。","你看到自己婴儿时期的一张照片","婴儿每天要睡十几个小时。","Trẻ sơ sinh mỗi ngày ngủ mười mấy tiếng.",["婴儿时期","婴儿车"],""],[2,"翻天覆地","fāntiān-fùdì","thành ngữ","phiên thiên phúc địa","long trời lở đất",0,"成","形容变化巨大而彻底。","发生了翻天覆地的变化","三十年来，这座城市发生了翻天覆地的变化。","Ba mươi năm qua, thành phố này thay đổi long trời lở đất.",["翻天覆地的变化"],"* Ngoài đề cương. Gần như chỉ đi với <span class='zh'>变化</span>."],[3,"更新","gēngxīn","đgt.","canh tân","đổi mới, thay mới",1,"","旧的去了，新的来了；除去旧的，换成新的。","皮肤……已经被更新130多次了","手机软件需要经常更新。","Phần mềm điện thoại cần cập nhật thường xuyên.",["更新换代","更新设备","系统更新"],"Còn nghĩa “cập nhật” (phần mềm, thông tin)."],[4,"酒窝","jiǔwō","dt.","tửu oa","lúm đồng tiền",0,"","笑时脸颊上露出的小圆窝。","你的酒窝不见了","她一笑就露出两个小酒窝。","Cô ấy cười lộ hai lúm đồng tiền.",["小酒窝"],"* Ngoài đề cương. SBT 33–36: <span class='zh'>只是那对酒窝……</span>"],[5,"蹦","bèng","đgt.","bính","nhảy (bật lên)",1,"口","双脚并拢跳。","你从高处往下蹦","孩子们高兴得又蹦又跳。","Bọn trẻ vui đến nhảy cẫng lên.",["蹦蹦跳跳","往下蹦","蹦起来"],"SBT: <span class='zh'>三蹦两跳</span>."],[6,"跌","diē","đgt.","điệt","ngã, té; sụt giảm",1,"","（身体）失去平衡而倒下；（物价）下降。","跌倒了","股价跌了不少。","Giá cổ phiếu giảm khá nhiều.",["跌倒","下跌","跌价"],"Nghĩa kinh tế: <span class='zh'>价格下跌</span>."],[7,"疤","bā","dt.","ba","vết sẹo",1,"","伤口或疮平复以后留下的痕迹。","脸上留下的疤痕","他手上有一道疤。","Tay anh ấy có một vết sẹo.",["伤疤","疤痕","留疤"],""],[8,"掩盖","yǎngài","đgt.","yểm cái","che, che giấu",1,"","遮盖；隐藏，隐瞒。","疤痕掩盖了它","大雪掩盖了道路。","Tuyết lớn phủ kín con đường.",["掩盖真相","掩盖错误"],"So sánh bài 2: <span class='zh'>掩饰</span> (che giấu cảm xúc), <span class='zh'>隐瞒</span> (giấu sự thật)."],[9,"大脑","dànǎo","dt.","đại não","bộ não",0,"","人和高等动物脑的最大部分。","你的大脑已经比拍照时增加了2～3倍的重量","多用大脑思考问题。","Hãy dùng đầu óc suy nghĩ nhiều hơn.",["开发大脑","大脑移植"],"* Ngoài đề cương."],[10,"确信","quèxìn","đgt.","xác tín","tin chắc",1,"","确实地相信；也作名词。","如果你确信你就是你","我确信他一定会成功。","Tôi tin chắc anh ấy sẽ thành công.",["确信无疑","我确信……"],""],[11,"比喻","bǐyù","đgt.","tỉ dụ","ví, so sánh",1,"","打比方，用某些有类似点的事物来比拟想要说的某一事物。","赫拉克利特把自我比喻为一条河","人们常把老师比喻为园丁。","Người ta thường ví thầy cô như người làm vườn.",["把A比喻为/成B","比喻句"],"Bài 7 đã luyện câu so sánh."],[12,"呈现","chéngxiàn","đgt.","trình hiện","hiện ra, thể hiện",1,"书","显出，露出。","河流流动时会呈现出不同的状态","大地呈现出一片生机。","Mặt đất hiện lên một màu sức sống.",["呈现出……","呈现在眼前"],"Bài tập 3②."],[13,"固有","gùyǒu","tt.","cố hữu","vốn có",1,"书","本来有的，不是外来的。","它始终是固有的那条河","这是中国固有的领土。","Đây là lãnh thổ vốn có của Trung Quốc.",["固有的观念","固有文化"],""],[14,"阐述","chǎnshù","đgt.","xiển thuật","trình bày rõ, giải thích",1,"书","论述，详细说明（较深奥的问题）。","他将自己的观点阐述为","他详细阐述了自己的理论。","Ông ấy trình bày chi tiết lý luận của mình.",["阐述观点","详细阐述"],"Dùng cho <b>lý luận, quan điểm</b> sâu."],[15,"陈述","chénshù","đgt.","trần thuật","trình bày, nói rõ",1,"书","有条理地说出。","他是这样陈述自己的见解的","请你陈述一下事情的经过。","Mời anh trình bày diễn biến sự việc.",["陈述理由","陈述句"],"<span class='zh'>陈述句</span> = câu trần thuật."],[16,"见解","jiànjiě","dt.","kiến giải","kiến giải, quan điểm",1,"","对于事物的认识和看法。","陈述自己的见解","他对这个问题有独到的见解。","Anh ấy có kiến giải độc đáo về vấn đề này.",["独到的见解","发表见解"],"Bài tập 3①."],[17,"演变","yǎnbiàn","đgt.","diễn biến","biến đổi, tiến triển",1,"","历时较久的发展变化。","连续不断的认知组成的演变过程","汉字是经过几千年演变而来的。","Chữ Hán biến đổi qua mấy nghìn năm mà thành.",["演变过程","历史演变"],"⚠️ Khác “diễn biến” tiếng Việt (= quá trình sự việc ≈ <span class='zh'>经过</span>): <span class='zh'>演变</span> = biến đổi dài lâu."],[18,"推测","tuīcè","đgt.","suy trắc","suy đoán",1,"","根据已经知道的事情来想象不知道的事情。","你可以推测","据专家推测，明年房价会下降。","Theo dự đoán của chuyên gia, sang năm giá nhà sẽ giảm.",["据……推测","推测结果"],""],[19,"譬如","pìrú","đgt.","thí như","ví như",1,"书","比如。","譬如，婴儿大卫的油画……","很多水果都含有维生素C，譬如橙子、猕猴桃。","Nhiều loại quả chứa vitamin C, ví như cam, kiwi.",["譬如说"],"Văn viết của <span class='zh'>比如</span>. Bài tập 3②."],[20,"各抒己见","gèshū-jǐjiàn","thành ngữ","các trữ kỷ kiến","mỗi người nói ý kiến mình",1,"成","各人充分发表自己的意见。","哲学家们对本体的问题各抒己见","会上大家各抒己见，讨论得很热烈。","Trong cuộc họp mọi người đều nêu ý kiến, thảo luận sôi nổi.",["大家各抒己见"],"Bài tập 3①."],[21,"通缉","tōngjī","đgt.","thông tập","truy nã",1,"","公安、司法机关通令有关地区缉拿在逃的犯罪嫌疑人。","一个被通缉了15年的罪犯","警方正在通缉这名逃犯。","Cảnh sát đang truy nã tên tội phạm bỏ trốn này.",["通缉令","被通缉"],""],[22,"触犯","chùfàn","đgt.","xúc phạm","vi phạm, xúc phạm",1,"","冒犯；侵犯。","触犯法律的行为","他的话触犯了很多人。","Lời anh ta xúc phạm nhiều người.",["触犯法律","触犯规定"],""],[23,"惩罚","chéngfá","đgt.","trừng phạt","trừng phạt",1,"","严厉地处罚。","受到惩罚","犯了错就应该受到惩罚。","Phạm lỗi thì phải chịu phạt.",["受到惩罚","严厉惩罚"],"SBT câu 1."],[24,"忧郁","yōuyù","tt.","ưu uất","u sầu, trầm uất",1,"","忧伤，愁闷。","你因为过于忧郁而吃药","她的眼神里带着一丝忧郁。","Ánh mắt cô ấy phảng phất nét u sầu.",["忧郁症","性格忧郁"],"Bài tập 3②."],[25,"肺","fèi","dt.","phế","phổi",1,"","人和高等动物的呼吸器官。","你做心、肺或者其他器官移植手术","吸烟对肺有害。","Hút thuốc có hại cho phổi.",["肺病","肺炎"],""],[26,"器官","qìguān","dt.","khí quan","cơ quan (cơ thể)",1,"","构成生物体的一部分，具有某种独立的生理机能。","其他器官移植手术","心脏是人体最重要的器官之一。","Tim là một trong những cơ quan quan trọng nhất.",["器官移植","感觉器官"],"Bài tập 3②."],[27,"移植","yízhí","đgt.","di thực","cấy ghép; di thực",0,"","把植物移到别处种植；将机体的一部分组织或器官补在另一部分或另一机体上。","器官移植手术","他接受了肾脏移植手术。","Anh ấy đã phẫu thuật ghép thận.",["器官移植","移植手术"],"* Ngoài đề cương."],[28,"面貌","miànmào","dt.","diện mạo","diện mạo, bộ mặt",1,"","脸的形状，相貌；比喻事物所呈现的景象、状态。","逐渐改变你的面貌","这几年家乡的面貌发生了很大变化。","Mấy năm nay bộ mặt quê hương thay đổi nhiều.",["精神面貌","城市面貌"],""],[29,"极端","jíduān","tt.","cực đoan","cực đoan; cực kỳ",1,"","事物顺着某个发展方向达到的顶点；绝对，偏激。","极端得空前绝后的假设","看问题不要太极端。","Nhìn vấn đề đừng quá cực đoan.",["走极端","极端天气","极端主义"],"Xem <b>辨析 极端—极度</b>."],[30,"空前绝后","kōngqián-juéhòu","thành ngữ","không tiền tuyệt hậu","có một không hai",1,"成","以前没有过，以后也不会有。","极端得空前绝后的假设","这场演出的盛况空前绝后。","Thịnh cảnh buổi biểu diễn này có một không hai.",["空前绝后的……"],"SBT câu 5."],[31,"昏迷","hūnmí","đgt.","hôn mê","hôn mê",1,"","因大脑功能严重紊乱而长时间失去知觉。","两个人术后从昏迷中清醒过来","他已经昏迷了三天三夜。","Anh ấy đã hôn mê ba ngày ba đêm.",["陷入昏迷","昏迷不醒"],""],[32,"清醒","qīngxǐng","đgt.","thanh tỉnh","tỉnh lại; tỉnh táo",1,"","（头脑）清楚，明白；神志由昏迷而恢复正常。","从昏迷中清醒过来","遇事要保持清醒的头脑。","Gặp chuyện phải giữ đầu óc tỉnh táo.",["清醒过来","头脑清醒"],"Cũng là tính từ: tỉnh táo."],[33,"言论","yánlùn","dt.","ngôn luận","ngôn luận, lời nói",1,"","关于政治和一般公共事务的议论。","哲学家们的言论、学说","言论自由","Tự do ngôn luận",["发表言论","言论自由"],""],[34,"学说","xuéshuō","dt.","học thuyết","học thuyết",1,"","学术上的有系统的主张或见解。","学说离我们十分遥远","这个学说创立于18世纪。","Học thuyết này ra đời thế kỷ 18.",["创立学说"],"Bài 6: <span class='zh'>创立学说</span> (không dùng 创办)."],[35,"遥远","yáoyuǎn","tt.","diêu viễn","xa xôi",1,"","很远。","离我们十分遥远","那是一个遥远的梦想。","Đó là một giấc mơ xa vời.",["遥远的地方","遥远的未来"],"Bài tập 3②."],[36,"陷入","xiànrù","đgt.","hãm nhập","rơi vào, sa vào",1,"","落在（不利的境地）；比喻深深地进入（某种境界或思想活动中）。","我们不会陷入本体的思索","他陷入了沉思。","Anh ấy chìm vào suy tư.",["陷入困境","陷入沉思","陷入昏迷"],""],[37,"思索","sīsuǒ","đgt.","tư tác","suy nghĩ, ngẫm nghĩ",1,"","思考探求。","本体的思索","他不假思索地回答了问题。","Anh ấy trả lời ngay không cần suy nghĩ.",["不假思索","思索片刻"],"Bài tập 3①."],[38,"设想","shèxiǎng","đgt.","thiết tưởng","hình dung, giả định",1,"","想象；假想；着想。","我们也不会设想将大脑移植给两个人","后果不堪设想。","Hậu quả khôn lường.",["不堪设想","大胆设想"],"Bài 3: <span class='zh'>后果不堪设想</span>."],[39,"性命","xìngmìng","dt.","tính mệnh","tính mạng",1,"","人和动物的生命。","那简直就是拿自己的性命开玩笑","他救了我的性命。","Anh ấy đã cứu mạng tôi.",["拿性命开玩笑","性命难保"],""],[40,"无忧无虑","wú yōu wú lǜ","thành ngữ","vô ưu vô lự","vô tư lự",1,"成","没有任何忧虑。","我们只想无忧无虑地过日子","孩子们无忧无虑地在草地上玩儿。","Bọn trẻ vô tư chơi đùa trên bãi cỏ.",["无忧无虑地……"],"Bài 1: “vô tư” tiếng Việt = <span class='zh'>无忧无虑</span>. Bài tập 3①."],[41,"崭新","zhǎnxīn","tt.","trảm tân","mới tinh",1,"","极新；全新。","一个崭新的我","他穿了一套崭新的西服。","Anh ấy mặc bộ vest mới tinh.",["崭新的……"],"Chỉ làm định ngữ hoặc vị ngữ với <span class='zh'>是……的</span>."]],extra:[["本体","běntǐ","bản thể"],["哲学家","zhéxuéjiā","triết gia"],["自我","zìwǒ","cái tôi, bản ngã"],["赫拉克利特","Hèlākèlìtè","Heraclitus"],["大卫·休谟","Dàwèi Xiūmó","David Hume"],["德里克·帕菲特","Délǐkè Pàfēitè","Derek Parfit"],["认知","rènzhī","nhận thức"],["整形","zhěngxíng","phẫu thuật thẩm mỹ"],["一分为二","yī fēn wéi èr","chia làm hai"],["不瞒你说","bù mán nǐ shuō","nói thật với bạn"]],T:[{zh:"如果有一天，你看到自己婴儿时期的一张照片，你能认出自己吗？",vn:"Nếu một ngày nào đó bạn nhìn thấy một tấm ảnh hồi còn sơ sinh của mình, bạn có nhận ra chính mình không?",idea:"Câu hỏi mở đầu.",q:["你能认出自己婴儿时期的照片吗？"],note:[["如果……，你能……吗？","Mở bài bằng <b>câu hỏi</b> để thu hút người đọc."]]},{zh:"也许你会一下子认出自己，因为你觉得你一直都是你，但实际上，从拍照片的那一刻起，你的身上已经发生了翻天覆地的变化。比如说，你的皮肤自你出生以来已经被更新130多次了。你的酒窝不见了，5岁那年，你从高处往下蹦，跌倒了，脸上留下的疤痕掩盖了它。你的大脑已经比拍照时增加了2～3倍的重量。",vn:"Có lẽ bạn sẽ nhận ra ngay, vì bạn thấy mình trước sau vẫn là mình; nhưng thực ra, từ khoảnh khắc chụp tấm ảnh ấy, trên người bạn đã diễn ra những thay đổi long trời lở đất. Chẳng hạn, làn da của bạn từ khi sinh ra đã được thay mới hơn 130 lần. Lúm đồng tiền của bạn không còn nữa — năm 5 tuổi, bạn nhảy từ chỗ cao xuống, ngã, vết sẹo trên mặt đã che mất nó. Bộ não bạn đã nặng gấp 2–3 lần so với lúc chụp ảnh.",idea:"Cơ thể bạn đã thay đổi hoàn toàn: da, lúm đồng tiền, não.",q:["从婴儿时期到现在，“你”发生了哪些变化？"],note:[["自你出生以来","<span class='zh'>自……以来</span> = từ khi… đến nay (văn viết)."],["脸上留下的疤痕掩盖了它","Định ngữ dài <span class='zh'>脸上留下的</span> + chủ ngữ <span class='zh'>疤痕</span>."]]},{zh:"如果你确信你就是你，不管怎样变化，那么，照片上的婴儿到底是不是你？是现在的你，还是一个不同的过去的你？如果是过去的你，那么，有多少个过去的你？是不是还会有更多的不同的你？你用电脑生成了一张你50岁时的图片，对你而言，就像看一个陌生人。",vn:"Nếu bạn tin chắc rằng mình vẫn là mình dù thay đổi thế nào, vậy thì đứa trẻ trong ảnh rốt cuộc có phải là bạn không? Là bạn của hiện tại, hay là một bạn khác của quá khứ? Nếu là bạn của quá khứ, vậy có bao nhiêu bạn của quá khứ? Liệu có còn nhiều bạn khác nữa không? Bạn dùng máy tính tạo ra một bức ảnh bạn lúc 50 tuổi — với bạn, nó giống như nhìn một người xa lạ.",idea:"Chuỗi câu hỏi: có bao nhiêu “bạn”?",q:["作者提出了哪些问题？","看到50岁时的自己，你会有什么感觉？"],note:[["如果……，那么，……","<span class='zh'>那么</span> dẫn ra kết luận / câu hỏi tiếp theo (Bài tập 2①)."],["对你而言，就像看一个陌生人","<span class='zh'>对……而言</span> = đối với… mà nói (văn viết). Xem Ngữ pháp 1."]]},{zh:"有关本体的问题，困扰了哲学家2500多年。什么是本体？这里说的本体就是我们的思想或身体。",vn:"Những vấn đề về bản thể đã làm khó các triết gia hơn 2500 năm. Bản thể là gì? Bản thể ở đây chính là tư tưởng hoặc cơ thể của chúng ta.",idea:"Giới thiệu khái niệm “bản thể”.",q:["这里说的“本体”指什么？"],note:[["有关本体的问题","<span class='zh'>有关 + N</span> = liên quan đến… (giới từ). Xem Ngữ pháp 2."]]},{zh:"赫拉克利特把自我比喻为一条河，河流流动时会呈现出不同的状态，但它始终是固有的那条河。他将自己的观点阐述为：不管你变化了多少，始终只有一个你。",vn:"Heraclitus ví cái tôi như một dòng sông: khi chảy, dòng sông hiện ra những trạng thái khác nhau, nhưng trước sau vẫn là dòng sông vốn có ấy. Ông trình bày quan điểm của mình là: dù bạn thay đổi bao nhiêu, vẫn chỉ có một bạn.",idea:"Heraclitus: chỉ có một bạn duy nhất.",q:["赫拉克利特怎样比喻“自我”？他的观点是什么？"],note:[["把自我比喻为一条河","<span class='zh'>把 A 比喻为 B</span> = ví A như B."],["将自己的观点阐述为：……","<span class='zh'>将……阐述为</span> — văn viết, trình bày quan điểm."]]},{zh:"大卫·休谟不同意“连续的自我”的观点。他是这样陈述自己的见解的：“我们的思想，是连续不断的认知组成的演变过程”。而你可以推测，譬如，婴儿大卫的油画呈现的是一个与成年大卫类似的人，并非完全相同。",vn:"David Hume không đồng ý với quan điểm “cái tôi liên tục”. Ông trình bày kiến giải của mình thế này: “Tư tưởng của chúng ta là một quá trình biến đổi được tạo nên từ những nhận thức nối tiếp không ngừng.” Và bạn có thể suy đoán, chẳng hạn, bức tranh sơn dầu vẽ Hume lúc còn bé thể hiện một người tương tự như Hume trưởng thành, chứ không hoàn toàn giống hệt.",idea:"Hume: cái tôi là quá trình biến đổi không ngừng.",q:["休谟的观点是什么？"],note:[["他是这样陈述自己的见解的：……","Câu nhấn mạnh <span class='zh'>是……的</span> + dẫn lời."],["类似……，并非完全相同","Ôn bài 7: <span class='zh'>类似 · 并非</span>."]]},{zh:"哲学家们对本体的问题各抒己见，我们却在想一些更为实际的问题，假如休谟是对的，那么从现在开始，10年后你就会成为另一个人，你还需要遵守现在的你做出的承诺吗？或者说，一个被通缉了15年的罪犯，今天还应该为当初触犯法律的行为受到惩罚吗？",vn:"Các triết gia mỗi người một ý về vấn đề bản thể, còn chúng ta lại nghĩ đến những câu hỏi thực tế hơn: nếu Hume đúng, thì kể từ bây giờ, 10 năm sau bạn sẽ thành một người khác — bạn có còn phải giữ lời hứa mà bạn của hiện tại đã đưa ra không? Hay nói cách khác, một tội phạm bị truy nã 15 năm, hôm nay có còn phải chịu phạt vì hành vi phạm pháp năm xưa không?",idea:"Câu hỏi thực tế: lời hứa, tội phạm.",q:["如果休谟是对的，会带来什么问题？"],note:[["假如……，那么……","Giả thiết → hệ quả."],["或者说，……","<span class='zh'>或者说</span> = hay nói cách khác — đưa thêm ví dụ."]]},{zh:"我们每个人都会发生变化。譬如，你去整形，你因为过于忧郁而吃药，你做心、肺或者其他器官移植手术，这些都会逐渐改变你的面貌、情绪和行为，你还是你吗？",vn:"Mỗi chúng ta đều sẽ thay đổi. Chẳng hạn, bạn đi phẫu thuật thẩm mỹ, bạn uống thuốc vì quá u uất, bạn phẫu thuật ghép tim, phổi hoặc cơ quan khác — những điều ấy đều dần thay đổi diện mạo, cảm xúc và hành vi của bạn; bạn có còn là bạn không?",idea:"Thẩm mỹ, thuốc, cấy ghép — bạn còn là bạn?",q:["哪些因素会改变我们？"],note:[["譬如，……，……，……，这些都会……","Liệt kê ba ví dụ rồi khái quát bằng <span class='zh'>这些都……</span>."]]},{zh:"德里克·帕菲特有一个极端得空前绝后的假设，例如将他的大脑一分为二，移植进另外两个身体中，两个人术后从昏迷中清醒过来，都会认为：“我是德里克。”但是，德里克不可能是两个人，他也不可能只是其中的一个。由此，他得出结论：“个人的本体并不是真正重要的事情。”",vn:"Derek Parfit có một giả thiết cực đoan có một không hai: chẳng hạn chia đôi bộ não của ông, ghép vào hai cơ thể khác; sau phẫu thuật, hai người tỉnh lại từ hôn mê đều cho rằng: “Tôi là Derek.” Nhưng Derek không thể là hai người, cũng không thể chỉ là một trong số họ. Từ đó ông rút ra kết luận: “Bản thể cá nhân không phải là điều thực sự quan trọng.”",idea:"Parfit: bản thể không thật sự quan trọng.",q:["帕菲特的假设是什么？他得出了什么结论？"],note:[["极端得空前绝后","<span class='zh'>Adj + 得 + thành ngữ</span> = … đến mức… (bổ ngữ mức độ)."],["由此，他得出结论：……","<span class='zh'>由此</span> = từ đó — dùng để rút ra kết luận."]]},{zh:"不瞒你说，对这个问题，我是这样想的：哲学家们的言论、学说离我们十分遥远，我们不会陷入本体的思索，我们也不会设想将大脑移植给两个人，那简直就是拿自己的性命开玩笑，我们只想无忧无虑地过日子。可是，会不会有一天，你醒来，感觉今天的我不像原来的我，而像是一个崭新的我了呢？",vn:"Nói thật với bạn, về vấn đề này tôi nghĩ thế này: ngôn luận, học thuyết của các triết gia cách chúng ta rất xa, chúng ta sẽ không sa vào suy tư về bản thể, cũng không hình dung chuyện ghép não cho hai người — thế chẳng khác nào đem tính mạng mình ra đùa — chúng ta chỉ muốn sống những ngày vô lo vô nghĩ. Nhưng liệu có một ngày, bạn tỉnh dậy, cảm thấy “tôi” hôm nay không giống “tôi” ngày xưa, mà như một “tôi” hoàn toàn mới?",idea:"Người thường không nghĩ nhiều — nhưng biết đâu sẽ gặp một “tôi” mới.",q:["作者对本体问题有什么看法？","你有没有过“不像原来的我”的感觉？"],note:[["不瞒你说，……","Chen ngữ <span class='zh'>不瞒你说</span> = nói thật với bạn — nêu suy nghĩ chủ quan. Xem Ngữ pháp 3."],["那简直就是拿自己的性命开玩笑","<span class='zh'>拿……开玩笑</span> = đem… ra đùa."],["会不会有一天，……呢？","Kết bài bằng câu hỏi mở — <b>điểm đề</b> “遇见原来的我”."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ trái nghĩa",G:[{id:"g1",grp:0,word:"",zh:"对……而言",py:"duì … ér yán",tag:"Chú thích 1 · văn viết",mean:"Biểu thị nhìn <b>từ góc độ của người / việc nào đó</b>. Dùng trong văn viết. Khẩu ngữ: <span class='zh'>对……来说 · 对……说来</span>.",forms:["对 + N + 而言，……"],ex:[["对今天的中国而言，经济发展必须坚持走可持续发展的道路。","Đối với Trung Quốc hôm nay, phát triển kinh tế phải kiên trì con đường phát triển bền vững."],["对年轻的我们而言，面对困难是件快乐的事情——那意味着挑战。","Với những người trẻ như chúng ta, đối mặt khó khăn là chuyện vui — điều đó có nghĩa là thử thách."],["你用电脑生成了一张你50岁时的图片，对你而言，就像看一个陌生人。","",1]],tips:["Biến thể: <span class='zh'>就……而言</span> (xét về…).","Bài tập 2②."],practice:{q:"完成句子",type:"complete",items:[["对母亲而言________。","对母亲而言，孩子的健康比什么都重要。"],["对年轻人而言，________。","对年轻人而言，最重要的是找到自己真正喜欢的事情。"],["________，不看那场球，简直就是一辈子的遗憾。","对一个铁杆球迷而言，不看那场球，简直就是一辈子的遗憾。"]]}},{id:"g2",grp:0,word:"",zh:"有关",py:"yǒuguān",tag:"Chú thích 2 · động từ / giới từ",mean:"① <b>Động từ</b> = <span class='zh'>有关系</span> (có liên quan): <span class='zh'>A 和 B 有关</span>. ② <b>Giới từ</b> = <span class='zh'>涉及</span>, đứng <b>trước danh từ</b> làm định ngữ: <span class='zh'>有关 + N</span>.",forms:["A 和 / 与 B 有关","有关 + N（问题 / 资料 / 部门……）"],ex:[["有关本体的问题，困扰了哲学家2500多年。","",1],["中国的语文教学向来重视识字，这固然和汉字的特点有关。","Dạy ngữ văn ở TQ xưa nay coi trọng nhận chữ, điều này dĩ nhiên liên quan đến đặc điểm chữ Hán."],["手术前，他仔细研究了中外有关病例的文字记载。","Trước ca mổ, ông nghiên cứu kỹ tư liệu về các ca bệnh liên quan trong và ngoài nước."],["为了这部历史剧服装的设计，他查阅了大量有关服饰问题的资料。","Để thiết kế trang phục cho bộ phim lịch sử, anh ấy tra cứu nhiều tư liệu về trang phục."]],tips:["<span class='zh'>有关部门</span> = cơ quan hữu quan (rất hay gặp).","Đồng nghĩa giới từ: <span class='zh'>关于</span>."],practice:{q:"为“有关”选择适当的位置",type:"pos",items:[["据A记载，从B明代中后期始，中国C的丝绸、瓷器等商品已由D中外商人贩运到拉美地区。","A","据有关记载，从明代中后期始，……"],["A专家提出，办好B没有围墙的C大学，是中国高等教育迈入D大众化时代的关键一步。","A","有关专家提出，办好没有围墙的大学，……"],["A人们仿照B“酒吧”一词，在C汉语中复制出了很多“吧”。其中与原意稍为近似、与“喝”D的营业性场所就有……","D","……与“喝”有关的营业性场所就有……"]]}},{id:"g3",grp:1,word:"极端",zh:"极端 / 极度",py:"",tag:"Xem 辨析 bên dưới",mean:"Hai từ đều chỉ <b>mức độ cực cao</b> khi làm phó từ; <span class='zh'>极端</span> còn là danh từ, tính từ (cực đoan).",forms:["极端 / 极度 + Adj / V（mức độ）","走极端 · 太极端了"],ex:[["德里克·帕菲特有一个极端得空前绝后的假设……","",1]],tips:["Bài tập 2⑥: <span class='zh'>环境极端恶劣</span>."]},{id:"g4",grp:2,word:"",zh:"不瞒你说 · 说实在的 · 依我看……",py:"",tag:"Chú thích 3 · chen ngữ",mean:"<b>Chen ngữ</b> (插入语) biểu thị suy nghĩ, cách nhìn, ý kiến, thái độ <b>chủ quan</b> của người nói. Thường gặp: <span class='zh'>我看 · 我想 · 说实在的 · 说真的 · 依我看 · 依我说 · 依我之见</span>.",forms:["不瞒你说 / 说真的 / 依我之见，+ ý kiến"],ex:[["不瞒你说，对这个问题，我是这样想的。","",1],["不瞒你说，书法方面，本人虽称不上“家”，但水平还是有一些的。","Nói thật với bạn, về thư pháp tôi tuy chưa thể gọi là “nhà”, nhưng cũng có chút trình độ."],["说真的，这次真是孩子给我上了一课……","(Bài 1)"],["说实在的，她的问题涉及了我的隐私，我很反感……","(Bài 5)"]],tips:["<span class='zh'>依我之见</span> trang trọng nhất; <span class='zh'>我看</span> khẩu ngữ nhất.","Bài 7: <span class='zh'>依我看，无论你怎么选择……</span>"],practice:{q:"完成句子",type:"complete",items:[["依我之见，无论你怎么选择，________。","依我之见，无论你怎么选择，都应该先听听父母的意见。"],["不瞒你说，这个歌儿________。","不瞒你说，这个歌儿我已经听了不下一百遍了。"],["他淡淡地说：“我写文章，说真的，就是玩儿，________。”","他淡淡地说：“我写文章，说真的，就是玩儿，从来没想过要出名。”"]]}}],BX:{grp:1,word:"极度",cols:["极端","极度"],pair:"极端 — 极度",same:["Làm <b>phó từ</b>, đều biểu thị <b>mức độ cực sâu</b>.","整整工作了24小时，他感到极度 / 极端疲劳。"],diff:[["Phần nhiều bổ nghĩa cho từ <b>không tốt</b>.","面对这件自己解决不了的事情，他极端苦恼。","Bổ nghĩa được cả từ <b>khác</b> (tích cực).<div class='zh' style='margin-top:4px'>听到这个消息，我们都极度兴奋。</div>"],["Có thể làm <b>danh từ</b>.","看问题要全面，不要走极端。","Thường <b>không</b> làm danh từ."],["Có thể làm <b>tính từ</b> = tuyệt đối, cực đoan.","这种观点太极端。 / 他有个极端得空前绝后的想法。","<b>Không</b> có cách dùng này."]],task:{q:"选择“极端”或“极度”填空",cols:["极端","极度"],sample:!1,items:[["他的做法____得让我们无法相信。",0,"Tính từ + 得 → 极端."],["紧张的考试之后，他感到____地放松。",1,"Bổ nghĩa từ tích cực (放松) → 极度."],["他从一个____走向了另一个____。",0,"Danh từ (một thái cực → thái cực khác) → 极端."],["你的这种观点太____了，不能代表大多数人的看法。",0,"Tính từ “cực đoan” → 极端."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>更</u>新","更改 · 更换 · 更替 · 变更"],items:[["<u>比</u>喻","比","比较 · 比赛 · 比例 · 对比"],["<u>昏</u>迷","昏","昏暗 · 昏庸 · 黄昏 · 天昏地暗"],["<u>思</u>索","思","思考 · 思路 · 思虑 · 思想"],["崭<u>新</u>","新","新鲜 · 新郎 · 新年 · 更新"]]},EX2:{q:"用所给词语或结构完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["如果明天天气不好，________。","那么","如果明天天气不好，那么我们就改天再去爬山吧。"],["日韩同学觉得汉字没那么难，可________。","对……而言","日韩同学觉得汉字没那么难，可对欧美同学而言，汉字是最大的难题。"],["同学们________。","各抒己见","同学们围绕“幸福是什么”这个话题各抒己见，讨论得非常热烈。"],["经过一段时间的观察，________。","确信","经过一段时间的观察，我确信他是一个值得信任的人。"],["如果环境继续恶化，专家们________。","推测","如果环境继续恶化，专家们推测，几十年后很多动物将会灭绝。"],["青藏高原海拔很高，氧气稀薄，环境________。","极端","青藏高原海拔很高，氧气稀薄，环境极端恶劣。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["各抒己见","见解","无忧无虑","思索","比喻"],text:"今天讨论课的话题是“幸福是什么？”同学们经过一番{思索}后纷纷{各抒己见}。有人说：“幸福就是{无忧无虑}地过日子。”有人把幸福{比喻}为盛开的花儿，虽然美好，却很短暂；也有人认为幸福是以物质为基础的。可以说，以上这些{见解}其实代表了每个人不同的价值观和人生观。"},{bank:["忧郁","遥远","呈现","譬如","器官"],text:"现代社会，人们的压力越来越大，精神类疾病日益增多。这类疾病会{呈现}出不同的状态，{譬如}，有的人因为过于{忧郁}而吃药；有的人怀疑身边的人或事；还有的人出现幻觉……这类疾病离我们并不{遥远}，所以我们应该像关注身体{器官}上的疾病一样去关注心理问题。"}]},EX4:{q:"把下面的句子按照正确顺序重新组合成语段",type:"order",vn:"Nhập thứ tự chữ cái (VD: ABCDE) rồi bấm Kiểm tra. Mẹo: tìm câu mở đầu (có chủ ngữ đầy đủ), tìm từ nối (可是、当时…).",ans:"BCEAD",full:"她想起去年的现在，她是和男朋友两个人坐在这地方，她当时心情是多么激动和欢快啊，可是一年后的今天，她一个人坐在这里，心里像装着一块冰。",items:[["A","她一个人坐在这里"],["B","她想起去年的现在，她是和男朋友两个人坐在这地方"],["C","她当时心情是多么激动和欢快啊"],["D","心里像装着一块冰"],["E","可是一年后的今天"]]},EX5:{q:"根据提示，简述课文主要内容",vn:"Trả lời từng câu theo gợi ý — ghép lại chính là dàn ý cho bài 缩写 ở mục 7.",rows:[["从婴儿时期到现在，“你”发生了什么变化？","①皮肤 ②酒窝 ③大脑","皮肤已经更新了130多次；酒窝被疤痕掩盖了；大脑的重量增加了2～3倍。"],["到底有多少个“你”？","①婴儿 ②现在 ③以后","照片上的婴儿是过去的你，还有现在的你，以后还会有更多不同的你，电脑生成的50岁的你就像一个陌生人。"],["关于本体的问题，哲学家们都有什么言论？","赫拉克利特：不管……，始终只有…… / 大卫·休谟：不同意……观点，……过程 / 德里克·帕菲特：个人的本体并不是……","赫拉克利特把自我比喻为一条河，认为不管你变化了多少，始终只有一个你；大卫·休谟不同意“连续的自我”的观点，认为思想是连续不断的认知组成的演变过程；德里克·帕菲特认为个人的本体并不是真正重要的事情。"],["假如休谟的观点是对的，会带来什么样的问题？","10年后……遵守……承诺 / 罪犯……受到惩罚","10年后你成了另一个人，还需要遵守现在的你做出的承诺吗？被通缉了15年的罪犯还应该受到惩罚吗？"],["导致人们改变的因素有哪些？","整形、吃药、手术","整形、因为忧郁而吃药、器官移植手术，都会改变人的面貌、情绪和行为。"],["对普通人而言，本体的问题是怎样的？","（自己总结）","对普通人而言，哲学家的学说十分遥远，我们只想无忧无虑地过日子；可是也许有一天，我们会感觉遇见了一个崭新的自己。"]]},DP:{title:"词汇：熟悉下列反义词",vn:"13 cặp trái nghĩa — rất hữu ích cho phần đọc chọn từ.",items:[["动荡","dòngdàng","rối ren, bất ổn","↔ 稳定","社会动荡，百姓生活困苦。"],["服从","fúcóng","phục tùng","↔ 违抗","军人以服从命令为天职。"],["复活","fùhuó","sống lại, phục sinh","↔ 灭亡","这项古老的技艺又复活了。"],["高潮","gāocháo","cao trào","↔ 低潮","比赛进入了高潮。"],["高尚","gāoshàng","cao thượng","↔ 低俗","他是一个品德高尚的人。"],["合并","hébìng","sáp nhập","↔ 解散","两家公司合并了。"],["混浊","húnzhuó","đục ngầu","↔ 清澈","下雨后，河水变得混浊。"],["简陋","jiǎnlòu","sơ sài, đơn sơ","↔ 豪华","房间虽然简陋，但很干净。"],["歌颂","gēsòng","ca ngợi","↔ 批判","这首诗歌颂了母爱。"],["停滞","tíngzhì","đình trệ","↔ 发展","经济停滞不前。"],["推翻","tuīfān","lật đổ","↔ 建立","新证据推翻了原来的结论。"],["延期","yánqī","hoãn lại","↔ 提前","会议延期到下周举行。"],["制止","zhìzhǐ","ngăn chặn","↔ 允许","警察及时制止了打架行为。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"在惩罚实施后对受罚者保持关爱，通常会收到良好的效果。这是因为惩罚会给人带来羞愧、痛苦、不安和悔恨等消极情绪，这时人的心理承受能力较低，比平时更期望得到别人的关爱，儿童、青少年尤其如此。",o:["青少年触犯刑法也要惩罚","对受到惩罚的人更要关心","惩罚会给人带来极大的伤害","惩罚就是为了造成心理压力"],a:1,why:"“在惩罚实施后对受罚者保持关爱，通常会收到良好的效果”."},{n:2,say:"机器人指能够自动执行工作的机器装置，它可以接受人类指挥，也可以根据已编好的程序运行。它的任务是帮助或代替人类工作，可应用于生产业、建筑业，或是危险工作。",o:["机器人是外形像人的一种机器","想指挥机器人必须先编好程序","机器人可代替人进行危险作业","机器人迟早要取代人类"],a:2,why:"“可应用于……危险工作”. (B sai: có thể nhận chỉ huy trực tiếp <i>hoặc</i> chạy theo chương trình.)"},{n:3,say:"那一年，中国开始推动介入治疗，张医生发现当时手术用的封堵器全部是进口的，价格贵不说，由于材质偏硬，极易造成其他组织的损伤。他天天想，可否找到一种能降低成本，同时能提升治疗效果的新材料？",o:["进口的手术材料比较便宜","进口的手术材料材质不好","张医生发明了一种新材料","张医生手术技术全国闻名"],a:1,why:"“材质偏硬，极易造成其他组织的损伤”. (C: ông mới đang <i>nghĩ</i> tìm vật liệu mới.)"},{n:4,say:"人脑的重量虽然只占人体重量的2%左右，但大脑消耗的能量却占全身消耗能量的20%。人脑每天需要116～145克的糖，当血糖浓度降低时，大脑的耗氧量也随之下降，轻者会感到头昏、疲倦，重者则会陷入昏迷。",o:["人脑消耗的能量非常少","人的血糖浓度低很危险","为了大脑健康要多吃糖","血糖浓度过高人会昏迷"],a:1,why:"“血糖浓度降低时……重者则会陷入昏迷”."},{n:5,say:"李小龙用33岁短暂的人生创造了一段传奇。从他离开这个世界的第一天起，他的追随者就对这位“功夫之王”进行了各种形式的追忆和纪念，这种狂热的纪念逐渐演变成一个神话，一个龙的神话，一个空前绝后的神话。",o:["李小龙33岁就辞世了","李小龙崇拜“功夫之王”","李小龙的电影是个神话","李小龙对功夫十分狂热"],a:0,why:"“用33岁短暂的人生……离开这个世界”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：你七年前生病后逃离上海，如今带着自己的新书《逃离》回到上海做宣传，是否多少有些感慨？\n男：我当年就特别有感触。七年前生病，我首先要逃出医院，要知道，当时我住的是中国肺科最好的医院。然后我要逃离上海。\n女：那时候你好像刚结婚？\n男：我结婚一个月后就查出得了大家都认为是不治之症的病，当时我的想法是和老婆离婚，不想耽误她。\n女：她怎么想？\n男：她说她没觉得这是多大的事，病了就病了，死了就死了，这都是命，你想那么多干吗。\n女：在上海你的一切都很稳定，做出逃离上海的决定也不容易吧？\n男：在上海，我有大房子，有车，有社会地位。但对我来说，逃出医院才是最艰难的，因为我选择了自我治疗。\n女：上海这座城市曾经给你什么美好的记忆吗？\n男：上海带给我的记忆一直很美好。我的不适应还是在生活上、语言上，包括生病这件事。我之所以选择离开，主要是对于我生病地的水，我再也不想喝了。因为我只信水，所以想找到好的水、干净的水。我在《逃离》一书中反复地说，生命是以水为基础的。生病是生命的一部分，我决定用换水的方式来解决病的问题。那时医院的肺科主任对我说：“马老师，什么事情都没有耽误治疗的事情大。”这位医生说得入情入理，但我跟他们说，我自己的命，我做一回主。\n女：你在山里过上了世外桃源的生活。你觉得，逃离最大的好处是什么？\n男：不久前我才有了网络。这种与世隔绝的生活最大的好处是可以免遭外界干扰。对于都市生活的负面影响，各种各样的说法都有，比如“都市病”，大家越来越觉得都市生活对人性本身是一种禁锢。在大山里则不同，可以让我在寂静中沉下心来思索。一个人独居，就会有特别多的想法。我每天的生活是简单的，在这个简单里，你很容易进入一种抽象思维的状态，很容易变得哲学化。",qs:[{n:6,q:"七年前发生了什么事？",o:["男的生了重病","男的准备结婚","妻子不高兴了","男的出了新书"],a:0,why:"“查出得了……不治之症的病”."},{n:7,q:"对男的来说，最艰难的是什么？",o:["卖掉房子、车子","放弃优越的生活","拒绝在医院治疗","远离社会的尊重"],a:2,why:"“逃出医院才是最艰难的，因为我选择了自我治疗”."},{n:8,q:"男的为什么选择离开上海？",o:["医生都特别不会说话","再也不想喝上海的水","很多人听不懂上海话","妻子决定要离开上海"],a:1,why:"“对于我生病地的水，我再也不想喝了”."},{n:9,q:"男的认为远离都市的生活有什么好处？",o:["可以思考哲学问题","可以不受外界干扰","可以比城里人少生病","可以吃到鲜美的桃子"],a:1,why:"“最大的好处是可以免遭外界干扰”. (D: <span class='zh'>世外桃源</span> = chốn đào nguyên, không phải ăn đào!)"},{n:10,q:"关于男的，下列哪项正确？",o:["他很爱他的妻子","他不愿和人打交道","他是有影响的哲学家","他把妻子的事写成了书"],a:0,why:"Bệnh nặng muốn ly hôn “不想耽误她” → rất yêu vợ."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"自1957年人类发射第一颗人造卫星至今，太空中的废弃航天器已有5000颗左右，而失效的卫星、探测器以及火箭发射后残留下来的碎片就更多了，它们漂浮在太空中，形成太空垃圾，即“空间碎片”。\n目前太空碎片总数已超过4000万个，而且空间碎片每年还在以2%～5%的速度增加。数量多、速度快是空间碎片的危害所在，这些碎片以每秒6000～7000米的速度运行，一个仅10克重的太空垃圾的撞击强度，与以100公里时速行驶的两辆轿车迎面相撞的强度相当。对人类而言，空间碎片落到地面，后果将会是灾难性的。\n面对太空垃圾，人类必须清醒，我们只有一个地球，也只有一个外层空间，维护外层空间的清洁迫在眉睫，而且空间碎片问题需要全球共同努力，共同面对。",qs:[{n:11,q:"太空垃圾还叫什么？",o:["空间碎片","失效卫星","火箭残片","废弃航天器"],a:0,why:"“形成太空垃圾，即‘空间碎片’”."},{n:12,q:"太空垃圾的危害是什么？",o:["碎片重量过大","每年大量增加","数量多，速度快","会经常撞击地球"],a:2,why:"“数量多、速度快是空间碎片的危害所在”."},{n:13,q:"人类最紧急的任务是什么？",o:["减少发射人造卫星","了解太空垃圾的危害","提高思考问题的能力","维护外层空间的清洁"],a:3,why:"“维护外层空间的清洁迫在眉睫”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"人的大脑只有在体力、脑力和心力处于最佳状态时，才能得到最好的发挥，这是不可不信的科学。\n先说体力，它是大脑开发的基础条件，在实现目标的过程中是否会白白失去成功的机会，有时确实与是否具备充足的体力有关。因此我们要长久地保养和锻炼身体，保持体力，增进健康。至于父母为了提高孩子的学习成绩，让孩子不停地奔忙于学校和各种补习班之间，绝非聪明之举，这样做只会导致孩子体力欠缺，进而造成注意力、免疫力不同程度地下降。\n脑力，也就是我们常说的“聪明才智”，并非只有学习才能促进其增长。玩耍、运动、休息、调整，同样会不断地刺激大脑，使头脑更加灵活，进而提高人的判断力、识别力、记忆力，甚至做事的效率。试想，具备了这些能力的人，还存在脑力、心智不足的问题吗？\n人的心力是一种正义的力量。当一个人的品质最接近人生的本质时，心力指数会明显提高，他的人格魅力也会增强，更会被人尊重和喜爱。心力是人的灵魂觉醒时产生的力量，也是能唤醒人的灵魂的力量。",qs:[{n:14,q:"父母最聪明的做法是什么？",o:["让孩子多玩儿","让孩子锻炼身体","让孩子劳逸结合","让孩子集中注意力"],a:2,why:"Không bắt con chạy học thêm liên tục; chơi, nghỉ cũng kích thích não → kết hợp làm và nghỉ (劳逸结合)."},{n:15,q:"怎样才能使我们更聪明？",o:["不断提高做事的效率","刺激大脑，促其灵活","多向能力强的人学习","克服脑力不足的缺陷"],a:1,why:"“不断地刺激大脑，使头脑更加灵活”."},{n:16,q:"人的“心力”是什么？",o:["灵魂的觉醒","人格的魅力","正义的力量","人生的本质"],a:2,why:"“人的心力是一种正义的力量”."},{n:17,q:"这段话主要想告诉我们什么？",o:["身体健康是最重要的","谁都不能不相信科学","离开科学我们寸步难行","大脑如何得到最好地发挥"],a:3,why:"Câu chủ đề: “大脑只有在……时，才能得到最好的发挥”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["猫咪抬头看看我，一双绿色的眼睛流露出淡淡的哀怨。","车坏了，我俩心里都明白，这辆车被人修不好我们就走不了。","每到烈日炎炎的盛夏，沙漠吹来的热风都会把这里变成一个大蒸笼。","我觉得无论什么猫都是胖一点儿好，圆滚滚的，看着舒服，摸着也舒服。"],a:1,why:"<b>Câu bị động sai</b>: phủ định phải đứng trước 被, và 被 không hợp với bổ ngữ khả năng → <span class='zh'>这辆车要是没人修好，我们就走不了</span>."},{n:19,o:["大家不用担心，估计明天的天气肯定很好。","马继兴一生埋头读书，勤奋笔耕，60多年出版专著20余部。","就是在这个论坛上，他第一次尝到了与人交流分享爱好的乐趣。","大兴安岭的秋色，南疆的戈壁、草原、雪山，都是中国最美的景色。"],a:0,why:"<b>Mâu thuẫn</b>: <span class='zh'>估计</span> (ước đoán) và <span class='zh'>肯定</span> (chắc chắn) không đi cùng nhau."},{n:20,o:["有人为追求浪漫，在屋子里安装上许多彩灯。","从广义上讲，濒危动物泛指珍贵、稀有的野生动物。","她着装简洁，言谈高雅，第一次见面，我被她的美所深深吸引了。","我是个随性的人，我不喜欢的事就不干，只要喜欢，玩儿了命也要往里钻。"],a:2,why:"<b>Trật tự trạng ngữ</b>: <span class='zh'>深深地</span> phải đứng sau <span class='zh'>所</span> trước động từ hoặc bỏ <span class='zh'>所</span>: <span class='zh'>我深深地被她的美吸引了</span> (theo đáp án sách)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"人类有___的感觉器官，能眼观六路，耳听八方，通过听觉、视觉、触觉等反映___现象，认识客观事物，这就为大脑这个加工车间提供了形成语言的___。",o:["敏感　当时　见解","敏锐　现实　原料","灵活　实际　材料","聪明　更新　资料"],a:1,why:"<span class='zh'>敏锐的感觉器官</span>; <span class='zh'>反映现实</span>; <span class='zh'>加工车间</span> → <span class='zh'>原料</span> (ẩn dụ nhất quán)."},{n:22,text:"我今年16岁，___是无忧无虑的年龄，可我却整天愁眉不展。我很小的时候，爸爸就教育我要好好学习，将来考大学，可我只对音乐___。我一心一意只想报考艺术学校，全家只有爸爸坚决不___，其他人都不___。",o:["确信　出神　答应　否认","原来　入迷　批准　阻止","本来　走神　认同　抗议","本该　着迷　同意　反对"],a:3,why:"<span class='zh'>本该是……，可……</span>; <span class='zh'>对……着迷</span>; <span class='zh'>同意 ↔ 反对</span>."},{n:23,text:"坎儿井是沙漠地区一种___的灌溉系统，普遍应用于中国新疆吐鲁番地区。坎儿井与万里长城、京杭大运河___为中国古代三大工程。吐鲁番的坎儿井___达1100多条，全长___5000公里。",o:["特定　起名　数量　达","特殊　并称　总数　约","特别　简称　总量　计","奇特　合称　条数　共"],a:1,why:"<span class='zh'>特殊的灌溉系统</span>; <span class='zh'>A与B、C并称为……</span>; <span class='zh'>总数达</span>; <span class='zh'>约5000公里</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"Geminoid F被视为当前高度仿真机器人中最优秀的作品，(24)，甚至有人称赞“她”是世界上最性感的美女机器人。她可以识别对方的眼神和身体语言，甚至模仿对方的面部动作。\n(25)，她身高1.68米，皮肤由柔软的硅胶制成，肤色逼真度极高。她能通过视觉系统读懂人类的面部表情并成功复制，具有微笑、皱眉等65种不同的面部表情，还可以像真人一样发声、对话和唱歌。(26)，远看就是一位活生生的美丽女子。\n机器人的研发者说，现在，大部分语音识别系统还不能很好地工作，(27)，未来，他们希望借助这款机器人研制出更完美的人工智能系统。他们希望这款机器人能让科技离主流人群更近，(28)。",opts:["最终“飞入寻常百姓家”","也是目前方兴未艾的情感机器人领域的优秀代表作","这个美女机器人的原型是一名20多岁的日俄混血女模特","尤其是在杂乱的环境下","她的呼吸似乎都与真人无异"],ans:{24:1,25:2,26:4,27:3,28:0}},read4:[{ins:"第29–32题：请选出正确答案。",text:"我家附近有几家卖婴幼儿物品的商店，商品的种类、价格相差无几。只是大家差不多都喜欢中间的那家，进去后质量、价格一概不问，直接拿东西付钱。那家小店跟别的店没什么区别，唯一不同的是店门口台阶上摆着好些花。花盆不是破了沿儿的塑料盆，就是没了盖儿的茶壶，再不就是装过东西的塑料桶剪去了上半部分，反正没几个正经花盆，基本都是废品利用。花儿也不怎么名贵，都是一些插在土里就能活的品种，可是店主每天都亲自把花草打理得干净、清爽、水灵。\n我和朋友们曾经讨论过这家店聚集人气的原因，朋友们看法不一。有的说，爱花的人一定心地善良，这样的人断然不会也不忍用假货欺骗顾客。有的说，看着满台阶的花就知道店主一定热爱生活，以诚待客，他卖的东西我信。虽然这两种说法都是推测，但也不无道理，不瞒你说，我每次走到这条小街，都会被这家店洋溢着的生活气息所吸引，经常会不由自主地走进这家店，也许就是因为生活中任何人都喜爱美好的事物吧。",qs:[{n:29,q:"关于“我”家附近的几家商店，下列哪项正确？",o:["价格差别很大","质量不用担心","有一家最受欢迎","商品的来源不同"],a:2,why:"“大家差不多都喜欢中间的那家”."},{n:30,q:"关于中间的那家店，下列哪项正确？",o:["店里同时还卖花","店中没有服务员","店主勤劳爱干净","东西价格最便宜"],a:2,why:"“店主每天都亲自把花草打理得干净、清爽、水灵”."},{n:31,q:"文中提到的花盆和花，下列哪项正确？",o:["花盆的形状很有趣","花盆都是废旧物品","花的价格出奇的贵","花都是请人打理的"],a:1,why:"“基本都是废品利用”."},{n:32,q:"大家对这家店的看法，下列哪项正确？",o:["店主一定不骗人","店主很会做生意","店主的做法没道理","店主很有人格魅力"],a:0,why:"“这样的人断然不会也不忍用假货欺骗顾客”."}]},{ins:"第33–36题：请选出正确答案。",text:"世间万物都在变，一点一点细微地变，等到哪一天你突然发现它已经有了翻天覆地的变化的时候，你可能会在大脑中反复搜寻，希望抓住它的演变过程，可是你找不到，呈现在你脑海中的就是那个以前的它和如今让你感到陌生的崭新的它。无论是人、物或环境都在改变。人的性格会变、观念会变、长相会变；物的形会变，环境更是每时每刻都在变。我有时常想：到底是人改变了环境，还是环境改变了我们……\n暮春时节，夕阳懒洋洋地照在村口的核桃树上，我兴冲冲地回到阔别了十年的村子。温暖的夕阳、老气横秋的核桃树、树下的青石板，和十年前一模一样，我恨不得和小时候一样，三蹦两跳跑到叔叔家，可是我没有，如今的我已不是那个毛头小伙子了，我成熟了。我极力掩盖着内心的兴奋，快步向村中走去。\n快到叔叔家的时候，不远处一位跟我年龄相仿、穿着白色连衣裙的漂亮女孩儿向我走来，我立刻开始在脑子中搜寻：我这么大的玩伴，谁能娶来这么漂亮的女孩儿？正想得出神，她竟叫了声我的小名，我下意识地应了一声，疑惑地问了句：“我认识你吗？”走近了，她笑着说：“真的是你啊，好久没见了！我是建萍呀，我们小时候天天在一块儿玩儿！”我顿时傻了眼，我脑海中的她个子矮矮的，皮肤有点儿黑，性格有点儿内向……再看看现在的她，个子好高，皮肤也变白了，性格好活泼，只是那对酒窝，还依稀保留着一丝她小时候的影子。我说她变了，她很淑女地笑着说：“你也变了。”\n一直以来我都觉得自己没有变，她说我也变了的时候，我才发现原来我也在变。",qs:[{n:33,q:"根据第1段，“变化”的特点是：",o:["在不知不觉中发生","某一天会突然发生","人的性格很难改变","环境总是被人改变"],a:0,why:"“一点一点细微地变……你找不到（演变过程）”."},{n:34,q:"“我”进村时的情景，下列哪项正确？",o:["“我”特想用小时候的方式跑到叔叔家","“我”十年前春天一个傍晚离开了这里","“我”和小时候不一样，已经跑不动了","十年前村子里的核桃树早已找不到了"],a:0,why:"“我恨不得和小时候一样，三蹦两跳跑到叔叔家”."},{n:35,q:"关于建萍，下列哪项正确？",o:["已经和我的小伙伴结婚了","面貌、性格都有了巨大变化","小时候的影子一点儿都没了","她说我变得她都认不出来了"],a:1,why:"Cao lên, trắng ra, hoạt bát hơn."},{n:36,q:"最适合做上文标题的是：",o:["我回到了故乡","小时候的朋友","记忆有时不可靠","原来我们都在变"],a:3,why:"Câu kết: “我才发现原来我也在变”."}]}]},W:{task:"“今天的你跟昨天的你是同一个人吗？”这是一个关于本体的哲学问题，哲学家们有不同的见解，这篇课文介绍了不同的哲学家对本体的认识和观点，请参考练习5，把课文缩写成300字左右的短文。",target:300,steps:[["Mở bằng câu hỏi","Giữ câu hỏi về tấm ảnh sơ sinh + 2–3 thay đổi tiêu biểu."],["Ba triết gia","Mỗi người 1–2 câu: Heraclitus (dòng sông), Hume (quá trình biến đổi), Parfit (bản thể không quan trọng)."],["Câu hỏi thực tế","Lời hứa, tội phạm; các nhân tố thay đổi con người."],["Kết","Quan điểm của tác giả về người thường + câu hỏi mở."],["Từ văn viết","Dùng <span class='zh'>比喻为 · 阐述 · 陈述 · 见解 · 各抒己见 · 对……而言</span>."]],outline:[["一 · 提出问题","婴儿照片 — 皮肤、酒窝、大脑都变了"],["二 · 哲学家的见解","赫拉克利特 / 休谟 / 帕菲特"],["三 · 实际问题","承诺、罪犯；整形、吃药、移植"],["四 · 作者的看法","对普通人而言……；会不会有一天……"]],model:"遇见原来的我\n如果你看到自己婴儿时期的照片，你能认出自己吗？其实，从那时起，你已经发生了翻天覆地的变化：皮肤更新了一百多次，酒窝被疤痕掩盖了，大脑也重了好几倍。那么，照片上的婴儿还是你吗？\n有关本体的问题，哲学家们各抒己见。赫拉克利特把自我比喻为一条河，河流会呈现出不同的状态，但始终是那条河，所以不管你怎么变，始终只有一个你。大卫·休谟却认为，我们的思想是一个不断演变的过程。德里克·帕菲特设想把一个人的大脑分成两半移植给两个人，由此得出结论：个人的本体并不是真正重要的事情。\n如果休谟是对的，十年后你还需要遵守现在的承诺吗？一个被通缉多年的罪犯还应该受到惩罚吗？整形、吃药、器官移植等都会改变我们，我们还是原来的自己吗？\n对普通人而言，这些学说离我们十分遥远，我们只想无忧无虑地过日子。可是，也许有一天醒来，你会发现自己已经是一个崭新的我了。",check:["Có tiêu đề","Có câu hỏi mở đầu và ví dụ thay đổi","Nêu đủ quan điểm của 3 triết gia","Có câu hỏi thực tế","Có kết luận của tác giả","Dùng ít nhất 5 từ văn viết của bài","Khoảng 300 chữ (±30)"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"朴道草堂身处京城最热闹的南锣鼓巷的一条小胡同里，从外表看，简单朴素的门脸并无特别之处，进去才发现草堂别有洞天：院子里一眼古井，两棵枣树，伴着茶香和午后的阳光，让人的心一下子安静下来。从四壁高高的木质书架上挑两本喜爱的书，坐在后院那棵400多岁的大枣树下，时光似乎又飞回到了遥远的过往。\n草堂主人周一方是个低调而神秘的中年男人，他学的是外语专业，爱好写诗和哲学，早年下海创业，公司有上千名员工，如今却一心扑在这间书店上，书友们都称他为“老周”。\n老周豪爽、坦诚，笑容温暖，他说：“开书店是一个使人幸福的职业，在这里你可以遇到无数美好的人。”\n第一次见老周，是在冬天。天气虽然寒冷，南锣鼓巷却是人声鼎沸，游人如织，商家都在忙生意。当我走到朴道草堂门口，却分明感受到截然不同的气氛，门口那张醒目的100元门票的“入门须知”把绝大多数游人挡在了门外，有人稍作停留、好奇地打量一会儿走了，有人瞥一眼“须知”匆匆而过。卖门票的书店大概在京城这是头一家。\n推开紧闭的大门，书店内几乎没有人，显得很冷清，我有些迷惑，为什么要收门票，难道不欢迎更多的游客来书店逛？\n见了老周，才明白老周收门票的缘由：“一个人愿意为一家书店付门票，还是愿意去酒吧喝一杯啤酒、买一瓶香水或者住更舒适的酒店，这是一种选择。人就是这样，在选择中让自己成为什么样的人。”\n老周告诉我，他真诚地给每个愿意付门票而进门的客人准备了意想不到的惊喜，例如，一本由作者亲笔签名的书，一本老周自己的诗集，他亲手拓印的一张手工版画，还有香茗和咖啡……礼物是随机的，每位都不一样，客人事先不会知道。这并非交换，因为礼物的实际价值远远超过100元，但是，这种惊喜是不能用价值来衡量的。老周希望，那是一种多年后也不会忘记的温暖和感动，会记得在北京的一条小胡同中和一家书店的相遇，会让人心中庆幸，幸好没有错过。\n老周印象很深，第一个买票进书店的是一个女孩儿。她进门的时候很忧郁，在书店流连了很久，喝茶，看书，最后甚至和店里的女孩儿聊起了自己的心事，女孩儿还哭了起来，不过，最后她走的时候很满足，很高兴。\n“也有人因为书店收门票而心有不悦。我十分理解。事实上，你做任何选择都是只有部分人认同的。我愿意尊重不来的人，珍惜入门的人。”老周说，他拒绝的只是随意闲逛的客人，愿意买门票进来的都是真正热爱读书的人。",model:"要门票的书店\n在北京最热闹的南锣鼓巷的一条小胡同里，有一家叫朴道草堂的书店。书店外表简单朴素，进去以后却别有洞天：院子里有古井、枣树，还有满墙的书架。坐在四百多岁的老枣树下读书、喝茶，人的心一下子就安静下来了。\n书店的主人叫周一方，大家叫他老周。他学的是外语，喜欢写诗和哲学，以前开过一家有上千名员工的公司，现在却一心经营这家书店。他说，开书店是一个使人幸福的职业。\n这家书店最特别的地方是进门要买100元的门票。南锣鼓巷里游人很多，可是大部分人看到门口的“入门须知”就走了，所以书店里很冷清。老周解释说，一个人愿意花钱进书店，还是去喝酒、买香水，这是一种选择，人就是在选择中成为什么样的人。\n老周给每位买票的客人都准备了不同的礼物，比如作者签名的书、他自己的诗集、手工版画，还有茶和咖啡。礼物的价值远远超过100元，但老周说这并不是交换，他希望客人能记住这份温暖和感动。他记得，第一个买票进来的是一个很忧郁的女孩儿，她在书店待了很久，还和店员聊起了心事，离开时很高兴。\n老周说，有人对收门票不满意，他很理解。他愿意尊重不来的人，珍惜进门的人，因为愿意买票进来的，都是真正热爱读书的人。"}},SUM:{words:["婴儿","更新","确信","比喻","呈现","固有","阐述","陈述","见解","演变","推测","譬如","各抒己见","通缉","触犯","惩罚","忧郁","器官","面貌","极端","空前绝后","昏迷","清醒","言论","学说","遥远","陷入","思索","设想","无忧无虑","崭新"],patterns:[["对……而言","对你而言，就像看一个陌生人。"],["有关 + N","有关本体的问题，困扰了哲学家2500多年。"],["把 A 比喻为 B","赫拉克利特把自我比喻为一条河。"],["不瞒你说，……","不瞒你说，对这个问题，我是这样想的。"],["由此，……得出结论","由此，他得出结论：……"]],diff:["极端：phó từ (thường + từ xấu) / danh từ (走极端) / tính từ (太极端) — 极度：chỉ phó từ, + mọi loại từ (极度兴奋)","阐述 (lý luận) · 陈述 (sự việc, lý do) · 描述 (miêu tả) · 演变 (biến đổi lâu dài) ≠ “diễn biến” · 掩盖 ≈ 掩饰 ≈ 隐瞒 · 譬如 = 比如 (văn viết)"],sentences:["赫拉克利特把自我比喻为一条河，河流流动时会呈现出不同的状态，但它始终是固有的那条河。","哲学家们对本体的问题各抒己见，我们却在想一些更为实际的问题。","可是，会不会有一天，你醒来，感觉今天的我不像原来的我，而像是一个崭新的我了呢？"],hw:["Học thuộc 41 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 8, gồm đề 缩写 “朴道草堂” (400 chữ).","Đọc trước bài 9 《不用手机的日子》 — mở đầu Chủ đề 3 多彩社会."]}});
