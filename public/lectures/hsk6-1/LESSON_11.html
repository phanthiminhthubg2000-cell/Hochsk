<script>window.LESSON={id:"hsk6-1-11",num:11,book:"HSK 标准教程 6（上）",unit:{n:3,zh:"多彩社会",vn:"Xã hội muôn màu"},title:"我不在时，猫在干什么？",vn:"Các chú mèo làm gì khi tôi đi vắng?",chars:845,source:"改编自《北京晚报》文章《我不在时，猫在家干吗》，作者：李环宇",goals:["Đọc hiểu bài 845 chữ — anh Tiền Tiểu Kỳ lắp hệ thống camera để xem ba chú mèo làm gì khi mình vắng nhà.","Dùng được 46 từ mới, nhất là nhóm <b>tính cách – miêu tả con vật</b>: <span class='zh'>见多识广 · 教养 · 懒惰 · 馋 · 知足常乐 · 恭敬 · 灵敏 · 敏捷 · 快活 · 亲热 · 迷人</span> và nhóm <b>công nghệ</b>: <span class='zh'>监视 · 镜头 · 尖端 · 储存 · 遥控 · 操纵 · 跟踪 · 操作</span>.","Nắm <span class='zh'>统统</span>, <span class='zh'>以……为……</span>, mẫu khẩu ngữ <span class='zh'>该干吗干吗</span>.","Phân biệt <span class='zh'>急切 — 急忙</span>; nhận diện câu sai loại <b>biểu ý không rõ</b> (表意不明).","Viết tóm tắt (缩写) bài khóa khoảng 300 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1–2 (统统 · 急切—急忙) · Bài khóa đoạn 1–2"],["Buổi 2","Nhóm 3 (以……为…… · 该干吗干吗) · Đoạn 3–6 · Bài tập · 表意不明 · Luyện đề · Viết 缩写"]],outline:[{tag:"一",name:"Ba chú mèo",paras:"Đoạn 1",zh:"大黄 · 白白 · 喜儿",vn:"Đại Hoàng điềm đạm như quân tử, Bạch Bạch hiếu động, Hỷ Nhi điệu đà."},{tag:"二",name:"Chủ và mèo",paras:"Đoạn 2",zh:"模范饲养员；回家开门的那一刻",vn:"Người nuôi mẫu mực; khoảnh khắc mở cửa về nhà là điều anh mong nhất."},{tag:"三",name:"Lắp camera",paras:"Đoạn 3",zh:"安摄像头 → 增加设备 → 自力更生装尖端系统",vn:"Từ một camera cố định đến hệ thống điều khiển từ xa qua Internet."},{tag:"四",name:"Phát hiện",paras:"Đoạn 4",zh:"大多数时间在睡觉；行动很有规律",vn:"Mèo ngủ phần lớn thời gian, ăn uống đúng giờ, nghe tiếng chìa khóa mới ra đón."},{tag:"五",name:"Công dụng khác",paras:"Đoạn 5–6",zh:"找到钱包；即时“报警”",vn:"Tìm được ví rơi, tự gửi ảnh “báo động” — một robot an ninh gia đình."}],warm1:{q:"你养过猫吗？猫喜欢做什么？请找出与下列图片相对应的内容。",vn:"Bạn từng nuôi mèo chưa? Mèo thích làm gì? Ghép hoạt động với hình (sách: ①F ②E ③B ④D ⑤C ⑥A).",items:[["😴","睡觉 · 在窗台上晒太阳","Ngủ · Phơi nắng trên bậu cửa sổ"],["🥛","喝水 · 抓老鼠","Uống nước · Bắt chuột"],["🚪","在门口迎接主人 · 梳理自己的毛发","Ra cửa đón chủ · Chải chuốt bộ lông"]],talk:["你觉得猫和狗哪个更适合养在城市里？为什么？","你想知道你不在家时，宠物在干什么吗？"],link:"Cả sáu hoạt động này đều xuất hiện trong bài — và camera của nhân vật sẽ cho biết mèo <b>thật sự</b> làm gì cả ngày."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"好 (hào)",rule:"好 đọc <b>hào</b> = <b>thích, ham</b> (động từ).",w:[["好动","hàodòng","hiếu động (có trong bài)"],["好客","hàokè","hiếu khách"],["好奇","hàoqí","tò mò (có trong bài)"],["好强","hàoqiáng","hiếu thắng, không chịu thua"],["好学","hàoxué","ham học"],["好胜","hàoshèng","hiếu thắng"],["好战","hàozhàn","hiếu chiến"],["爱好","àihào","sở thích"],["喜好","xǐhào","yêu thích"]]},{k:"理",rule:"理 = <b>sắp xếp, xử lý, quản lý</b>.",w:[["整理","zhěnglǐ","sắp xếp"],["梳理","shūlǐ","chải chuốt (có trong bài)"],["管理","guǎnlǐ","quản lý"],["办理","bànlǐ","làm (thủ tục)"],["护理","hùlǐ","chăm sóc (y tế)"],["修理","xiūlǐ","sửa chữa"],["自理","zìlǐ","tự lo"],["处理","chǔlǐ","xử lý"],["代理","dàilǐ","đại lý"],["理财","lǐcái","quản lý tài chính"],["理发","lǐfà","cắt tóc"],["经理","jīnglǐ","giám đốc"]]},{k:"养",rule:"养 = <b>nuôi, trồng</b>.",w:[["养花","yǎng huā","trồng hoa"],["养草","yǎng cǎo","trồng cỏ"],["养猫","yǎng māo","nuôi mèo"],["养狗","yǎng gǒu","nuôi chó"],["养鸡","yǎng jī","nuôi gà"],["养鱼","yǎng yú","nuôi cá"],["养育","yǎngyù","nuôi dạy"],["饲养","sìyǎng","chăn nuôi (từ mới)"],["喂养","wèiyǎng","nuôi, cho ăn"],["放养","fàngyǎng","thả nuôi"]]},{k:"急",rule:"急 = <b>gấp, vội</b>.",w:[["急切","jíqiè","thiết tha, nóng lòng (từ mới)"],["急忙","jímáng","vội vàng"],["急诊","jízhěn","cấp cứu"],["急病","jíbìng","bệnh cấp"],["急救","jíjiù","sơ cứu"],["急事","jíshì","việc gấp"],["急需","jíxū","cần gấp"],["急用","jíyòng","dùng gấp"],["着急","zháojí","sốt ruột"],["紧急","jǐnjí","khẩn cấp"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1",sub:"Ba chú mèo",from:1,to:19},{name:"Nhóm 2 · Đoạn 2–3",sub:"Người nuôi & hệ thống camera",from:20,to:41},{name:"Nhóm 3 · Đoạn 4–6",sub:"Những phát hiện",from:42,to:46}],V:[[1,"流浪","liúlàng","đgt.","lưu lãng","lang thang",1,"","生活没有着落，到处转移，随地谋生。","大黄原本是只流浪猫","街上有很多流浪狗。","Ngoài phố có nhiều chó hoang.",["流浪猫","流浪汉","四处流浪"],"Bài tập 3①."],[2,"淋","lín","đgt.","lâm","dầm (mưa), dội",1,"","水或其他液体落在物体上。","淋着大雨来钱小奇家拜访","没带伞，全身都淋湿了。","Không mang ô, ướt sũng cả người.",["淋雨","淋湿"],"SBT câu 29–32: <span class='zh'>如果淋了雨……</span>"],[3,"拜访","bàifǎng","đgt.","bái phỏng","đến thăm",1,"","敬辞，访问。","来钱小奇家拜访","明天我要去拜访一位老教授。","Mai tôi đi thăm một vị giáo sư già.",["登门拜访","拜访朋友"],"Bài tập 1: <span class='zh'>拜会 · 拜见 · 拜望 · 拜年</span>. Dùng hài: con mèo “đến thăm”."],[4,"见多识广","jiàn duō shí guǎng","thành ngữ","kiến đa thức quảng","thấy nhiều biết rộng",1,"成","见过的多，知道的广。","见多识广的大黄","他走过很多地方，见多识广。","Ông ấy đi nhiều nơi, thấy nhiều biết rộng.",[],"Bài tập 2⑥."],[5,"教养","jiàoyǎng","dt.","giáo dưỡng","giáo dưỡng, phép lịch sự",1,"","指一般文化和品德的修养。","却很有教养","一看就知道他是个有教养的人。","Nhìn là biết anh ấy là người có giáo dục.",["有教养","没教养"],"⚠️ 教 đọc <b>jiào</b>. Bài tập 3①."],[6,"懒惰","lǎnduò","tt.","lãn nọa","lười biếng",1,"","不爱劳动和工作；不勤快。","它既不懒惰，也不嘴馋","懒惰的人很难成功。","Người lười khó mà thành công.",[],"SBT nghe câu 2: <span class='zh'>并不是因为它们懒惰</span>."],[7,"馋","chán","tt.","sàm","thèm ăn, háu ăn",1,"","看见好的食物就想吃；专爱吃好的。","也不嘴馋","这孩子特别馋，看见零食就走不动。","Đứa bé này háu ăn lắm, thấy đồ ăn vặt là không đi nổi.",["嘴馋","馋猫"],"<span class='zh'>馋猫</span> = mèo tham ăn → người tham ăn."],[8,"趴","pā","đgt.","bát","nằm sấp; bò bám",1,"","胸腹朝下卧倒；身体向前靠在东西上。","天天趴在窗台上晒太阳","他趴在桌子上睡着了。","Anh ấy gục xuống bàn ngủ quên.",["趴在……上"],"Bài tập 3②. Bài tập 4①: <span class='zh'>把脸趴在他的肩上</span>."],[9,"知足常乐","zhīzú cháng lè","thành ngữ","tri túc thường lạc","biết đủ thì luôn vui",1,"成","知道满足，就总是快乐。","一副知足常乐的样子","奶奶总说，知足常乐。","Bà luôn nói: biết đủ là vui.",[],""],[10,"恭敬","gōngjìng","tt.","cung kính","cung kính",1,"","对尊长或宾客严肃有礼貌。","它都恭恭敬敬地在门口迎接","学生恭恭敬敬地向老师鞠了一躬。","Học trò cung kính cúi chào thầy.",["恭恭敬敬"],"Lặp kiểu AABB: <span class='zh'>恭恭敬敬</span>."],[11,"君子","jūnzǐ","dt.","quân tử","quân tử",1,"","指品格高尚的人。","不失君子风度","君子一言，驷马难追。","Lời quân tử nói ra, bốn ngựa khó đuổi.",["君子风度","正人君子"],""],[12,"嗅觉","xiùjué","dt.","khứu giác","khứu giác",1,"","鼻子辨别气味的感觉。","嗅觉灵敏","狗的嗅觉非常灵敏。","Khứu giác của chó rất nhạy.",["嗅觉灵敏"],"⚠️ 嗅 đọc <b>xiù</b>."],[13,"灵敏","língmǐn","tt.","linh mẫn","nhạy",1,"","反应快；能对极微小的刺激迅速做出反应。","嗅觉灵敏","这台仪器非常灵敏。","Thiết bị này rất nhạy.",["反应灵敏","嗅觉灵敏"],"Bài tập 1: <span class='zh'>灵活 · 灵巧 · 灵验 · 机灵</span>."],[14,"敏捷","mǐnjié","tt.","mẫn tiệp","nhanh nhẹn",1,"","（动作等）迅速而灵敏。","动作敏捷","他思维敏捷，反应很快。","Anh ấy tư duy nhanh nhạy, phản ứng rất nhanh.",["动作敏捷","思维敏捷"],"<span class='zh'>灵敏</span> = nhạy (giác quan, máy); <span class='zh'>敏捷</span> = nhanh (động tác, tư duy). Bài tập 3①."],[15,"快活","kuàihuo","tt.","khoái hoạt","vui vẻ",1,"口","快乐。","快活而好动","孩子们在草地上快活地玩耍。","Bọn trẻ vui đùa trên bãi cỏ.",["快快活活"],"Bài tập 3②."],[16,"扑","pū","đgt.","phác","nhào tới, vồ",1,"","用力向前冲，使全身突然伏在物体上。","它就扑上来","孩子一见妈妈就扑了过去。","Đứa bé thấy mẹ là nhào tới.",["扑上来","扑过去","扑到怀里"],"Bài tập 3②."],[17,"亲热","qīnrè","tt.","thân nhiệt","thân mật, quấn quýt",1,"","亲密而热情。","亲热地撞主人的腿","两个老朋友见了面亲热得不得了。","Hai người bạn cũ gặp nhau tay bắt mặt mừng.",["亲热地……"],"Bài tập 1: <span class='zh'>热闹 · 热烈 · 热情 · 炎热</span>. Bài tập 3①."],[18,"统统","tǒngtǒng","phó.","thống thống","tất cả, hết thảy",1,"口","表示全部。","把……东西统统闻一遍","把这些旧衣服统统扔了吧。","Vứt hết mấy bộ đồ cũ này đi.",["统统都……"],"Xem <b>Ngữ pháp: 统统</b>."],[19,"迷人","mírén","tt.","mê nhân","quyến rũ",1,"","使人陶醉；吸引人。","把自己梳理得漂亮而迷人","这里的风景十分迷人。","Phong cảnh ở đây vô cùng quyến rũ.",["迷人的风景","迷人的微笑"],""],[20,"模范","mófàn","tt.","mô phạm","gương mẫu, mẫu mực",1,"","可以作为榜样的。","钱小奇是个模范饲养员","他是我们公司的模范员工。","Anh ấy là nhân viên gương mẫu của công ty.",["模范作用","劳动模范"],"Còn là danh từ = người gương mẫu."],[21,"饲养","sìyǎng","đgt.","tự dưỡng","chăn nuôi",1,"","喂养（动物）。","模范饲养员","这个农场饲养了很多牛。","Trang trại này nuôi nhiều bò.",["饲养员","饲养动物"],"Bài tập 3①."],[22,"清洁","qīngjié","đgt.","thanh khiết","làm sạch; sạch sẽ",1,"","没有尘土、油垢等；使干净。","清洁猫舍","每天都有人来清洁教室。","Ngày nào cũng có người đến lau dọn lớp học.",["清洁工","保持清洁"],"Vừa là động từ vừa là tính từ."],[23,"喂","wèi","đgt.","ủy","cho ăn",1,"","给动物吃东西；把食物送到人嘴里。","喂水，喂饭","妈妈正在给孩子喂饭。","Mẹ đang đút cơm cho con.",["喂饭","喂猫","喂奶"],"Khác <span class='zh'>喂 wéi</span> (“A lô”)."],[24,"繁忙","fánmáng","tt.","phồn mang","bận rộn",1,"书","事情多，不得空。","他虽然工作繁忙","年底是工作最繁忙的时候。","Cuối năm là lúc công việc bận rộn nhất.",["工作繁忙","交通繁忙"],"Văn viết hơn <span class='zh'>忙</span>."],[25,"急切","jíqiè","tt.","cấp thiết","thiết tha, nóng lòng",1,"","迫切。","每天最急切盼望的","我急切地想知道考试结果。","Tôi nóng lòng muốn biết kết quả thi.",["急切地……","急切的心情"],"Xem <b>辨析 急切—急忙</b>."],[26,"例外","lìwài","dt.","lệ ngoại","ngoại lệ",1,"","在一般的规律、规定之外的情况。","喜儿则毫无例外地站在远处","大家都要参加，谁也不能例外。","Mọi người đều phải tham gia, không ai được ngoại lệ.",["毫无例外","没有例外"],"Bài tập 2④. Còn là động từ: <span class='zh'>不能例外</span>."],[27,"凝视","níngshì","đgt.","ngưng thị","nhìn chăm chú",1,"书","聚精会神地看。","用凝视表达着它深沉的热情","她静静地凝视着远方。","Cô ấy lặng lẽ nhìn chăm chăm về phía xa.",["凝视着……"],"Bài tập 3②. SBT câu 18."],[28,"深沉","shēnchén","tt.","thâm trầm","sâu lắng, kín đáo",1,"","程度深；（声音）低沉；沉着，不外露。","深沉的热情","父亲的爱是深沉的。","Tình cha sâu lắng.",["深沉的爱","性格深沉"],""],[29,"监视","jiānshì","đgt.","giám thị","theo dõi, giám sát",1,"","从旁严密注视、观察。","监视猫的一举一动","警察一直在监视他。","Cảnh sát luôn theo dõi hắn.",["监视器","监视……的一举一动"],""],[30,"举动","jǔdòng","dt.","cử động","hành động, cử chỉ",1,"","动作；行动。","监视猫的一举一动","他的举动很奇怪。","Hành động của anh ta rất lạ.",["一举一动"],"<span class='zh'>一举一动</span> = nhất cử nhất động."],[31,"缺陷","quēxiàn","dt.","khuyết hãm","khuyết điểm, khiếm khuyết",1,"","欠缺或不够完备的地方。","这个不能移动的摄像头有缺陷","这款产品存在设计缺陷。","Sản phẩm này có lỗi thiết kế.",["有缺陷","生理缺陷"],""],[32,"镜头","jìngtóu","dt.","kính đầu","ống kính; cảnh quay",1,"","摄影机、照相机上的透镜；拍摄的画面。","拍下的很多镜头都是空的","这部电影有很多感人的镜头。","Bộ phim này có nhiều cảnh cảm động.",["拍镜头","特写镜头"],"Bài tập 1: <span class='zh'>头脑 · 头部 · 石头 · 烟头</span>. SBT câu 18."],[33,"自力更生","zìlì-gēngshēng","thành ngữ","tự lực cánh sinh","tự lực cánh sinh",1,"成","不依赖外力，靠自己的力量把事情办起来。","决定自力更生安装一套尖端玩意儿","我们要自力更生，不能总依靠别人。","Chúng ta phải tự lực, không thể mãi dựa vào người khác.",[],"Bài tập 2⑤. SBT câu 29–32."],[34,"尖端","jiānduān","tt.","tiêm đoan","tiên tiến nhất, mũi nhọn",1,"","发展水平最高的（科学技术等）。","一套尖端玩意儿","这家公司掌握了很多尖端技术。","Công ty này nắm nhiều công nghệ tiên tiến.",["尖端技术","尖端科学"],"SBT câu 20."],[35,"钻研","zuānyán","đgt.","toản nghiên","nghiền ngẫm, nghiên cứu sâu",1,"","深入研究。","他边钻研边安装","他刻苦钻研业务。","Anh ấy chăm chỉ nghiền ngẫm chuyên môn.",["钻研技术","刻苦钻研"],"⚠️ 钻 đọc <b>zuān</b>. SBT câu 20."],[36,"动态","dòngtài","dt.","động thái","trạng thái hoạt động; động thái",1,"","（事情）变化发展的情况；运动变化状态。","对猫的动态进行抓拍","请随时关注市场动态。","Hãy luôn theo dõi diễn biến thị trường.",["市场动态","最新动态"],"Đối lập: <span class='zh'>静态</span>."],[37,"储存","chǔcún","đgt.","trữ tồn","lưu trữ, cất giữ",1,"","（钱或物等）存放起来，暂时不用。","储存下图像","手机里储存了很多照片。","Điện thoại lưu rất nhiều ảnh.",["储存数据","储存粮食"],""],[38,"遥控","yáokòng","đgt.","dao khống","điều khiển từ xa",1,"","通过有线或无线电路的装置操纵一定距离以外的机器、仪器等。","通过互联网遥控摄像头","这辆玩具车可以遥控。","Chiếc xe đồ chơi này điều khiển từ xa được.",["遥控器","遥控飞机"],"SBT nghe câu 5: <span class='zh'>好像身体里安装了一个遥控器</span>."],[39,"即时","jíshí","phó.","tức thời","ngay lập tức",0,"","立即。","对家里的猫进行即时监控","有问题请即时联系我们。","Có vấn đề xin liên hệ ngay với chúng tôi.",["即时通信"],"Từ có dấu * (không bắt buộc HSK)."],[40,"操纵","cāozòng","đgt.","thao túng","điều khiển; thao túng",1,"","控制或开动机械、仪器等；用不正当手段支配、控制。","通过操纵、移动摄像头","他熟练地操纵着机器。","Anh ấy điều khiển máy móc thành thạo.",["操纵机器","幕后操纵"],"Nghĩa xấu: thao túng (<span class='zh'>操纵市场</span>)."],[41,"跟踪","gēnzōng","đgt.","căn tung","bám theo, theo dõi",1,"","紧紧跟在后面（追赶、监视）。","跟踪到家里的任何一个角落","我觉得有人在跟踪我。","Tôi cảm thấy có người đang bám theo mình.",["跟踪调查","跟踪报道"],"SBT nghe 6–10, 11–13: <span class='zh'>跟踪猎物</span>."],[42,"角落","jiǎoluò","dt.","giác lạc","góc, xó",1,"","两堵墙或类似墙的东西相接处的凹角；偏僻的地方。","家里的任何一个角落","他一个人坐在教室的角落里。","Cậu ấy ngồi một mình trong góc lớp.",["每个角落","世界各个角落"],""],[43,"误差","wùchā","dt.","ngộ sai","sai số",1,"","测定的数值或计算中的近似值与准确值的差。","时间误差平均不到5分钟","这台仪器的误差很小。","Sai số của thiết bị này rất nhỏ.",["有误差","误差很小"],"Bài tập 1: <span class='zh'>误解 · 误会 · 误导 · 错误</span>."],[44,"踪迹","zōngjì","dt.","tung tích","dấu vết, tung tích",1,"","行动所留下的痕迹。","了解了猫的踪迹","警察找到了逃犯的踪迹。","Cảnh sát tìm thấy dấu vết của kẻ chạy trốn.",["不见踪迹","寻找踪迹"],""],[45,"动静","dòngjing","dt.","động tĩnh","tiếng động; động tĩnh",1,"","动作或说话的声音；（打听或侦察的）情况。","只要家里稍有动静","屋里一点儿动静都没有。","Trong nhà không có chút tiếng động nào.",["有动静","没有动静"],"⚠️ 静 đọc nhẹ <b>jing</b>. SBT nghe 11–13."],[46,"操作","cāozuò","đgt.","thao tác","thao tác, vận hành",1,"","按照一定的程序和技术要求进行活动或工作。","操作系统就能将图像记录下来","这台机器操作起来很简单。","Máy này vận hành rất đơn giản.",["操作系统","操作方法"],"<span class='zh'>操作系统</span> = hệ điều hành. SBT câu 20."]],extra:[["窗台","chuāngtái","bậu cửa sổ"],["风度","fēngdù","phong độ, phong thái"],["好动","hàodòng","hiếu động"],["人见人爱","rén jiàn rén ài","ai thấy cũng yêu"],["梳理","shūlǐ","chải chuốt"],["猫舍","māoshè","chuồng mèo"],["忧郁","yōuyù","u uất (bài 8)"],["摄像头","shèxiàngtóu","camera"],["抓拍","zhuāpāi","chụp nhanh khoảnh khắc"],["监控","jiānkòng","giám sát"],["钥匙","yàoshi","chìa khóa"],["邮箱","yóuxiāng","hộp thư"],["远程","yuǎnchéng","từ xa"]],T:[{zh:"钱小奇养了3只猫。大黄原本是只流浪猫，那天，淋着大雨来钱小奇家拜访，下完雨就不走了。见多识广的大黄虽有流浪史，却很有教养，它既不懒惰，也不嘴馋，天天趴在窗台上晒太阳，一副知足常乐的样子。每次钱小奇出门回来，它都恭恭敬敬地在门口迎接，不失君子风度。白白是个男孩儿，嗅觉灵敏，动作敏捷，快活而好动。钱小奇一回家，它就扑上来，亲热地撞主人的腿，还要把钱小奇和他带回来的东西统统闻一遍。喜儿是个人见人爱的女孩儿，每天大部分时间都在整理自己的毛发，把自己梳理得漂亮而迷人。",vn:"Tiền Tiểu Kỳ nuôi 3 con mèo. Đại Hoàng vốn là mèo hoang, hôm ấy dầm mưa lớn đến “thăm” nhà Tiểu Kỳ, mưa tạnh rồi cũng không đi nữa. Đại Hoàng thấy nhiều biết rộng, tuy có “tiền sử lang thang” nhưng rất có giáo dục: nó chẳng lười, cũng chẳng háu ăn, ngày ngày nằm sấp trên bậu cửa sổ phơi nắng, vẻ biết đủ thì vui. Mỗi lần Tiểu Kỳ ra ngoài về, nó đều cung kính ra cửa đón, không mất phong độ quân tử. Bạch Bạch là “con trai”, mũi thính, động tác nhanh nhẹn, vui vẻ và hiếu động. Tiểu Kỳ vừa về là nó nhào tới, quấn quýt cọ vào chân chủ, còn phải ngửi một lượt hết thảy Tiểu Kỳ và đồ anh mang về. Hỷ Nhi là “cô gái” ai thấy cũng yêu, phần lớn thời gian mỗi ngày đều sửa sang bộ lông, chải chuốt mình thật xinh đẹp quyến rũ.",idea:"Giới thiệu ba chú mèo — mỗi con một tính cách.",q:["钱小奇家的三只猫各有什么特点？"],note:[["来钱小奇家拜访","Nhân hóa hài hước: mèo hoang được tả như vị khách đến “bái phỏng”."],["虽有流浪史，却很有教养","<span class='zh'>虽……却……</span> — văn viết của <span class='zh'>虽然……但是……</span>."],["既不……，也不……","Phủ định song song."],["统统闻一遍","<span class='zh'>统统</span> — xem Ngữ pháp 1."],["快活而好动 · 漂亮而迷人","<span class='zh'>Adj + 而 + Adj</span> — nối hai tính từ (văn viết)."]]},{zh:"钱小奇是个模范饲养员，每天早起第一件事就是伺候猫：清洁猫舍，喂水，喂饭。他虽然工作繁忙，但每天最急切盼望的就是回家开门的那一刻——大黄和白白在门口等候他，喜儿则毫无例外地站在远处，用凝视表达着它深沉的热情。",vn:"Tiền Tiểu Kỳ là người nuôi mèo gương mẫu, việc đầu tiên mỗi sáng là hầu hạ mèo: dọn chuồng, cho uống nước, cho ăn. Anh tuy công việc bận rộn, nhưng điều anh nóng lòng mong đợi nhất mỗi ngày chính là khoảnh khắc về mở cửa — Đại Hoàng và Bạch Bạch chờ anh ở cửa, còn Hỷ Nhi thì không trừ lần nào, đứng ở đằng xa, dùng ánh mắt chăm chú để bày tỏ tình cảm nồng nhiệt mà kín đáo của nó.",idea:"Tình cảm giữa chủ và mèo.",q:["钱小奇每天最急切盼望的是什么？"],note:[["伺候猫","<span class='zh'>伺候</span> (bài 9) — hầu hạ."],["喜儿则……","<span class='zh'>则</span> = còn (đối chiếu, văn viết)."],["毫无例外地","= không có ngoại lệ, lần nào cũng vậy."]]},{zh:"钱小奇很好奇，自己不在家时猫在做什么？那么长时间，猫们多无聊，会不会忧郁得生病？为了弄清楚这事，他在家里安了个摄像头，监视猫的一举一动。很快，他发现这个不能移动的摄像头有缺陷，拍下的很多镜头都是空的，于是，他增加了设备，并决定自力更生安装一套尖端玩意儿。他边钻研边安装，经过三个多月的努力，安装好的设备不仅能够对猫的动态进行抓拍并储存下图像，钱小奇在外面时还能通过互联网遥控摄像头，对家里的猫进行即时监控，同时能通过操纵、移动摄像头，跟踪到家里的任何一个角落。",vn:"Tiền Tiểu Kỳ rất tò mò: khi mình không ở nhà, mèo làm gì? Thời gian dài như thế, lũ mèo buồn chán biết bao, liệu có u uất mà sinh bệnh không? Để làm rõ chuyện này, anh lắp ở nhà một chiếc camera theo dõi nhất cử nhất động của mèo. Chẳng bao lâu, anh phát hiện camera cố định này có khiếm khuyết, nhiều cảnh quay được đều trống trơn; thế là anh tăng thêm thiết bị và quyết định tự lực lắp một bộ “đồ chơi” tối tân. Anh vừa nghiên cứu vừa lắp, sau hơn ba tháng nỗ lực, thiết bị lắp xong không chỉ chụp lại được hoạt động của mèo và lưu trữ hình ảnh, mà khi ở ngoài Tiểu Kỳ còn có thể điều khiển camera từ xa qua Internet, giám sát mèo ở nhà ngay tức thì, đồng thời có thể điều khiển, di chuyển camera, theo dõi đến bất kỳ góc nào trong nhà.",idea:"Lắp hệ thống camera theo dõi mèo.",q:["钱小奇为什么要安摄像头？","他安装的设备有哪些功能？"],note:[["猫们","Thêm <span class='zh'>们</span> cho con vật — nhân hóa."],["忧郁得生病","<span class='zh'>忧郁</span> (bài 8)."],["对……进行 + V (song tiết)","Cấu trúc văn viết: <span class='zh'>对猫的动态进行抓拍 · 对家里的猫进行即时监控</span>."],["不仅……，还……，同时……","Liệt kê tăng tiến chức năng."]]},{zh:"通过对大量数据和图片进行分析，钱小奇发现，这三只猫大多数时间都在睡觉。除了睡觉，猫们的行动很有规律，以其中一只猫为例，它每天下午两点左右吃饭喝水，时间误差平均不到5分钟。更有趣的是，每次回家时，守在门口的大黄和白白也不是长时间在门口等他，而是在屋里该干吗干吗，听到主人的脚步声和钥匙响后，才会跑到门口来迎接。",vn:"Qua phân tích lượng lớn dữ liệu và hình ảnh, Tiểu Kỳ phát hiện ba con mèo phần lớn thời gian đều ngủ. Ngoài ngủ, hành động của chúng rất có quy luật — lấy một con làm ví dụ, mỗi ngày nó ăn uống khoảng hai giờ chiều, sai số trung bình không tới 5 phút. Thú vị hơn là mỗi lần anh về, Đại Hoàng và Bạch Bạch canh ở cửa cũng không phải chờ anh ở cửa thật lâu, mà ở trong nhà làm gì thì làm nấy, nghe thấy tiếng bước chân và tiếng chìa khóa của chủ rồi mới chạy ra cửa đón.",idea:"Phát hiện: mèo ngủ nhiều, sống có quy luật.",q:["主人不在时，猫到底在干吗？"],note:[["以其中一只猫为例","<span class='zh'>以……为例</span> — xem Ngữ pháp 2."],["不是……，而是……","Bác bỏ – khẳng định."],["该干吗干吗","Khẩu ngữ: việc gì cần làm thì làm, không vì gì mà thay đổi. Xem Ngữ pháp 3."]]},{zh:"这套系统除了帮钱小奇了解了猫的踪迹以外，还帮过钱小奇不少忙。一次，他在办公室上网遥控摄像头，找到了掉在家里桌子下的钱包。如今，只要家里稍有动静，操作系统就能将图像记录下来，并把拍下的照片即时发到他的邮箱里“报警”。",vn:"Hệ thống này ngoài giúp Tiểu Kỳ nắm được hành tung của mèo, còn giúp anh không ít việc. Một lần, anh ở văn phòng lên mạng điều khiển camera, tìm thấy chiếc ví rơi dưới gầm bàn ở nhà. Giờ đây, chỉ cần trong nhà có chút động tĩnh, hệ thống liền ghi lại hình ảnh và gửi ngay ảnh chụp vào hộp thư của anh để “báo động”.",idea:"Công dụng khác: tìm đồ, báo động.",q:["这套系统还帮过钱小奇什么忙？"],note:[["除了……以外，还……","Bổ sung."],["帮过……不少忙","<span class='zh'>帮忙</span> là từ ly hợp: <span class='zh'>帮 + 过 + tân ngữ + 不少忙</span>."],["将图像记录下来","<span class='zh'>将</span> = <span class='zh'>把</span> (văn viết)."]]},{zh:"这是一套多么有用的远程遥控家庭安全机器人啊。",vn:"Đây quả là một “robot an ninh gia đình” điều khiển từ xa hữu ích biết bao.",idea:"Kết: cảm thán về công dụng của hệ thống.",q:[],note:[["多么……啊","Câu cảm thán."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: danh từ đồ vật",G:[{id:"g1",grp:0,word:"统统",zh:"统统",py:"tǒngtǒng",tag:"Chú thích 1 · phó từ (khẩu ngữ)",mean:"Phó từ: hành vi liên quan đến <b>toàn bộ</b> đối tượng — “không trừ cái nào, không còn sót cái nào”. Dùng nhiều trong khẩu ngữ. Cũng nói <span class='zh'>通通</span>.",forms:["把 + N + 统统 + V","N（tất cả）+ 统统 + V / 与……无缘"],ex:[["我把随身携带着的DV小摄像机、录音机以及照相机统统从包里取了出来。","Tôi lấy hết máy quay DV, máy ghi âm và máy ảnh mang theo người ra khỏi túi."],["钱小奇一回家，它就扑上来，亲热地撞主人的腿，还要把钱小奇和他带回来的东西统统闻一遍。","",1],["他不抽烟、不喝酒、不喝茶、不喝咖啡、不讲究饮食，什么电影院、酒吧，统统与他无缘。","Anh ấy không hút thuốc, không rượu, không trà, không cà phê, chẳng cầu kỳ ăn uống; rạp phim, quán bar — tất cả đều không dính dáng gì đến anh."]],tips:["Đồng nghĩa: <span class='zh'>全部 · 都 · 通通</span>; <span class='zh'>统统</span> nhấn mạnh “sạch trơn”.","Bài tập 2①, 3②."],practice:{q:"用“统统”改写句子",type:"complete",items:[["这回我也想把放假的时间全部用来打工。","这回我也想把放假的时间统统用来打工。"],["今天的节目没意思，节目还没演完，剧场里的人就都走光了。","今天的节目没意思，节目还没演完，剧场里的人就统统走光了。"],["二十年后再回到北京，我几乎认不出它了，到处都是高楼，我熟悉的胡同里的老房子全都被拆掉了。","……我熟悉的胡同里的老房子统统被拆掉了。"]]}},{id:"g2",grp:1,word:"急切",zh:"急切 / 急忙",py:"jíqiè / jímáng",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa “vội, gấp” nhưng <b>thường không thay nhau được</b>: <span class='zh'>急切</span> là <b>tâm trạng</b> nóng lòng; <span class='zh'>急忙</span> là <b>hành động</b> vội vàng.",forms:["急切地 + 盼望 / 想 / 希望……","急忙 + V（跑 / 出发 / 穿上……）"],ex:[["他虽然工作繁忙，但每天最急切盼望的就是回家开门的那一刻。","",1]],tips:["Khởi động 2: nhóm <span class='zh'>急</span>."]},{id:"g3",grp:1,word:"例外",zh:"毫无例外 / 谁也不能例外",py:"",tag:"Bài tập 2④",mean:"<span class='zh'>例外</span>: danh từ (ngoại lệ) và động từ (là ngoại lệ). Cụm hay gặp: <span class='zh'>毫无例外 · 没有例外 · 也不例外 · 谁也不能例外</span>.",forms:["毫无例外地 + V","……，A 也不例外","谁也不能例外"],ex:[["喜儿则毫无例外地站在远处，用凝视表达着它深沉的热情。","",1],["每个人都应该遵守学校纪律，谁也不能例外。","Mọi người đều phải tuân thủ kỷ luật nhà trường, không ai được ngoại lệ."]],tips:["<span class='zh'>A 也不例外</span> = A cũng không ngoại lệ (cũng như vậy)."]},{id:"g4",grp:2,word:"",zh:"以……为……",py:"yǐ … wéi …",tag:"Chú thích 2 · văn viết",mean:"Cấu trúc <b>văn viết</b>, tương đương khẩu ngữ <span class='zh'>把 / 拿……作为 / 当作……</span> — “lấy… làm…”. Khi hai cụm <span class='zh'>以……为……</span> dùng liền nhau, chữ <span class='zh'>以</span> thứ hai có thể lược bỏ.",forms:["以 A 为例 / 为主 / 为标准 / 为目的 / 为对象","以 A 为主，B 为辅"],ex:[["猫们的行动很有规律，以其中一只猫为例，它每天下午两点左右吃饭喝水，时间误差平均不到5分钟。","",1],["普通话以北京语音为标准音，以北方话为基础方言，以典范的现代白话文著作为语法规范。","Tiếng phổ thông lấy ngữ âm Bắc Kinh làm âm chuẩn, phương ngữ phương Bắc làm phương ngữ cơ sở, tác phẩm bạch thoại hiện đại mẫu mực làm chuẩn ngữ pháp."],["今天的晚会大伙准备了不少节目，当然以学生为主，老师为辅。","Dạ hội hôm nay mọi người chuẩn bị nhiều tiết mục, tất nhiên học sinh là chính, thầy cô là phụ."]],tips:["<span class='zh'>为</span> đọc <b>wéi</b>.","Bài 10: <span class='zh'>以本国物产为基本原料</span>."],practice:{q:"用“以……为……”改写句子",type:"complete",items:[["考试不要把学生当作敌人，把难倒学生作为目的。","考试不要以学生为敌人，以难倒学生为目的。"],["这部短篇小说集里描写农村生活的作品最多。","这部短篇小说集以描写农村生活的作品为主。"],["教育学是一门科学，它的研究对象是教育。","教育学是一门以教育为研究对象的科学。"]]}},{id:"g5",grp:2,word:"",zh:"该干吗干吗",py:"gāi gànmá gànmá",tag:"Chú thích 3 · khẩu ngữ",mean:"Rút gọn từ mẫu khẩu ngữ <span class='zh'>该 + V + O + 还 / 就得 + V + O</span> (VD: <span class='zh'>该学汉语还得学汉语</span>): mọi việc <b>vẫn diễn ra như vốn có</b>, không gì làm thay đổi được — “việc gì cần làm thì cứ làm”. <span class='zh'>还 / 就得</span> thường lược.",forms:["该 + V + V（该吃吃，该玩儿玩儿）","该 + V + O + V + O（该打球打球）","该 + O + 还 + V + O（该什么结果还是什么结果）"],ex:[["在中国，过年过节商店最忙了，哪儿有假呀，该开门就得开门。","Ở Trung Quốc, dịp lễ Tết cửa hàng bận nhất, làm gì có nghỉ, cần mở cửa thì vẫn phải mở."],["每次回家时，守在门口的大黄和白白也不是长时间在门口等他，而是在屋里该干吗干吗。","",1],["哭、着急都不管用，该什么结果还是什么结果。","Khóc hay sốt ruột đều vô ích, kết quả thế nào vẫn thế ấy."]],tips:["<span class='zh'>干吗</span> = <span class='zh'>干什么</span> (khẩu ngữ).","Bài tập 2②."],practice:{q:"用“该+动词+宾语+动词+宾语”或其省略形式改写句子",type:"complete",items:[["到点了，走吧，别等她了。","到点了，该走就走吧，别等她了。"],["不管是和平年代还是战争年代，人们到了年龄就会恋爱、结婚，丝毫没有改变。","不管是和平年代还是战争年代，人们到了年龄该恋爱恋爱，该结婚结婚。"],["没有什么事情能让他发愁，他整天都是乐呵呵的，吃、玩儿都不耽误。","没有什么事情能让他发愁，他整天都是乐呵呵的，该吃吃，该玩儿玩儿。"]]}}],BX:{grp:1,word:"急切",cols:["急切","急忙"],pair:"急切 — 急忙",same:["Về nghĩa đều biểu thị <b>sốt ruột, vội</b>, nhưng thường <b>không thay thế</b> nhau được.","—"],diff:[["<b>Tính từ</b>, chỉ <b>tâm trạng</b> nóng lòng, tha thiết.","大家急切地盼望试验成功。","<b>Phó từ</b>, chỉ <b>hành động</b> vội vàng vì gấp.<div class='zh' style='margin-top:4px'>听说公司有要紧事，他急忙穿上衣服跑出门去。</div>"],["Theo sau được <b>danh từ</b> (làm định ngữ).","你急切的心情我们都能理解，但凡事都要慢慢来。","Theo sau chỉ là <b>động từ</b>, không đi với danh từ."]],task:{q:"选择“急切”或“急忙”填空",cols:["急切","急忙"],sample:!1,items:[["一听说是急诊病人，大夫____进行抢救。",1,"Hành động vội → 急忙."],["妈妈____地盼望孩子早点儿放假回家。",0,"Tâm trạng mong ngóng → 急切."],["她____的表情引起了我的注意。",0,"+ danh từ (表情) → 急切."],["一接到命令我们就____出发了，没来得及跟大家告别。",1,"Hành động (出发) → 急忙."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>拜</u>访","拜会 · 拜见 · 拜望 · 拜年"],items:[["<u>灵</u>敏","灵","灵活 · 灵巧 · 灵验 · 机灵"],["亲<u>热</u>","热","热闹 · 热烈 · 热情 · 炎热"],["镜<u>头</u>","头","头脑 · 头部 · 石头 · 烟头"],["<u>误</u>差","误","误解 · 误会 · 误导 · 错误"]]},EX2:{q:"用所给词语或结构完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["我不喜欢的东西________。","统统","我不喜欢的东西，你统统拿走吧。"],["他的心情一点儿都没受这个坏消息的影响，________。","该+V+O+V+O","他的心情一点儿都没受这个坏消息的影响，该吃饭吃饭，该睡觉睡觉。"],["上个周末我________，我们聊得很高兴。","拜访","上个周末我去拜访了大学时的老师，我们聊得很高兴。"],["每个人都应该遵守学校纪律，________。","例外","每个人都应该遵守学校纪律，谁也不能例外。"],["任何事情都________，不要总依靠别人。","自力更生","任何事情都要自力更生，不要总依靠别人。"],["他游历过很多国家，________。","见多识广","他游历过很多国家，见多识广，什么事情都难不倒他。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["敏捷","流浪","亲热","饲养","教养"],text:"昨天，我在小区里遇到一只{流浪}狗，金色的毛发，动作{敏捷}，看见我，{亲热}地跟在我身边。虽然它没有主人，但看起来很有{教养}，像个君子似的。我心里想：这么帅气的狗，主人怎么忍心扔掉呢？我们人类一旦决定{饲养}一种动物，就要对它负责到底。"},{bank:["统统","快活","凝视","扑","趴"],text:"最近，家里的母猫生了几只小猫，小家伙们{快活}而好动。我一回家，它们就{扑}过来，跟我玩耍。而母猫则{趴}在沙发上{凝视}着它的孩子们，眼神中充满了母爱。现在我每天最热切盼望的就是早点儿回家看看它们，别的事情{统统}都不重要。"}]},EX4:{q:"把下列分句按叙述的次序排列成完整的句子",type:"order",vn:"Nhập thứ tự chữ cái rồi bấm Kiểm tra. Mẹo: tìm vế có chủ ngữ để mở đầu; từ chỉ thứ tự (<span class='zh'>突然 · 然后</span>); miêu tả đi từ khái quát đến chi tiết.",sets:[{ans:"ACBD",full:"小王压不住火气，突然用拳头打丈夫的肩膀，然后，又把脸趴在他的肩上，哭了起来。",items:[["A","小王压不住火气"],["B","然后，又把脸趴在他的肩上"],["C","突然用拳头打丈夫的肩膀"],["D","哭了起来"]]},{ans:"CADBE",full:"听说在很远很远的地方有一座山，山上住着个种树的老爷爷，白头发白眉毛白胡子，他的胡子很长，一直拖到地上。",items:[["A","山上住着个种树的老爷爷"],["B","他的胡子很长"],["C","听说在很远很远的地方有一座山"],["D","白头发白眉毛白胡子"],["E","一直拖到地上"]]}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["描述一下钱小奇家的三只猫。","①大黄 ②白白 ③喜儿","大黄原本是流浪猫，见多识广，很有教养，既不懒惰也不嘴馋；白白嗅觉灵敏，动作敏捷，快活而好动；喜儿人见人爱，每天都把自己梳理得漂亮而迷人。"],["钱小奇跟三只猫的感情怎么样？","①钱小奇对待猫 ②猫对待钱小奇","钱小奇是个模范饲养员，每天早起先伺候猫；每次他回家，大黄和白白都在门口迎接，喜儿在远处用凝视表达热情。"],["为了弄清楚主人不在时，猫在做什么，钱小奇采取了什么措施？","①安摄像头 ②增加设备","他先安了一个摄像头，发现有缺陷后又增加设备，自力更生安装了一套可以通过互联网遥控的尖端系统。"],["主人不在时，猫到底在干吗？","①睡觉 ②有规律","猫大多数时间都在睡觉，行动很有规律；大黄和白白也不是一直在门口等，而是听到脚步声和钥匙响才跑去迎接。"],["这套系统还帮过钱小奇什么忙？","找到了……","它帮钱小奇找到了掉在桌子下的钱包；家里稍有动静，就会把照片即时发到他的邮箱里“报警”。"]]},BJ:{title:"病句类型：表意不明",vn:"Câu sai — loại 5: biểu ý không rõ ràng",intro:"<b>表意不明</b>: người đọc không hiểu được ý chính xác của câu, rất khó hiểu. Chủ yếu thể hiện ở <b>chỉ đại không rõ</b> (指代不明): đại từ <span class='zh'>它 · 他 · 自己 · 这方面</span> không biết thay cho ai / cái gì, hoặc thiếu chủ ngữ khiến câu có thể hiểu hai cách.",types:[["“它”指代不明","Đại từ 它 không rõ","醋最好不要和羊肉一起吃，一起吃会使它的温补作用大打折扣。","……会使羊肉的温补作用大打折扣。","<span class='zh'>它</span> là giấm hay thịt cừu? → nói rõ <span class='zh'>羊肉</span>."],["暗中更换主语","Ngầm đổi chủ ngữ","慕尼黑的啤酒生产已有四百多年历史了，它以清香甘醇而遐迩闻名，因而素有“啤酒城”之称。","慕尼黑生产啤酒已有四百多年历史了，素有“啤酒城”之称，那里的啤酒以清香甘醇而遐迩闻名。","<span class='zh'>它</span> là bia, nhưng “thành phố bia” là Munich → các vế ngầm đổi chủ ngữ."],["“这方面”指代不明","Cụm chỉ đại không rõ","唱好一首歌不容易，创作出一首好歌更不容易，她是个文艺爱好者，平时在这方面下了不少功夫。","……平时在创作歌曲方面下了不少功夫。","“Mặt này” là hát hay hay sáng tác? → nói rõ một trong hai."],["“的”字短语指代不明","Cụm chữ 的 không rõ","开刀的是他父亲。","给他父亲开刀的是王医生。 / 他父亲做了手术。","“Người mổ” có thể là bác sĩ hoặc bệnh nhân."],["缺少主语","Thiếu chủ ngữ","记得吗，我和你认识的时候，还是个中学生，充满热情，充满理想。","……，我还是个中学生，……","Ai là học sinh trung học — “tôi” hay “bạn”? → thêm chủ ngữ."]],practice:[["我一定说服妈妈和你一同去，这样你在路上就有个伴儿了。","妈妈和你一同去","我一定说服妈妈让她和你一同去 / 我一定说服妈妈让我和你一同去，……","Nội dung “thuyết phục” không rõ: <b>mẹ</b> đi cùng bạn, hay mẹ cho <b>tôi</b> đi cùng bạn?"],["今天师傅在班会上表扬了自己，但是我觉得还需要继续努力。","自己","今天师傅在班会上表扬了他自己，但是我觉得他还需要继续努力。 / 今天师傅在班会上表扬了我，但是我觉得自己还需要继续努力。","<span class='zh'>自己</span> chỉ “sư phụ” hay “tôi”?"],["小张和小王商量好了，他请他看电影，他请他吃饭。","他","小张和小王商量好了，小张请小王看电影，小王请小张吃饭。","Bốn chữ <span class='zh'>他</span> — không biết ai mời ai."],["对学生会提出的建议，我举双手赞成。","学生会","对于学生会提出的建议，我举双手赞成。 / 对于您向学生会提出的建议，我举双手赞成。","<span class='zh'>学生会</span> là bên <b>đưa ra</b> kiến nghị hay bên <b>nhận</b> kiến nghị?"],["我看见小李和他女朋友有说有笑地走过来，肩上背着双肩包。","肩上背着双肩包","……，小李肩上背着双肩包。 / ……，他们肩上都背着双肩包。","Thiếu chủ ngữ: ai đeo ba lô — Tiểu Lý, bạn gái, hay cả hai?"]]},DP:{title:"词汇：看图片，熟悉下列名词",vn:"Danh từ đồ vật thường gặp trong phần nghe – đọc HSK6 (kèm lượng từ / cụm từ).",items:[["床单","chuángdān","ga trải giường","铺床单","她正在给新床铺床单。"],["膜","mó","màng","保鲜膜","家里的保鲜膜用完了。"],["锤","chuí","búa","一把锤子","帮我拿一把锤子过来。"],["话筒","huàtǒng","micro; ống nghe","一个话筒","桌子上放着一个话筒。"],["轮胎","lúntāi","lốp xe","一个轮胎","汽车的轮胎被扎破了。"],["钩子","gōuzi","cái móc","一个钩子","钩子上挂着几个杯子。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"猫行动敏捷，善跳跃。嗅觉灵敏，喜欢吃鱼、鼠、兔、鸟等。因为猫是夜行动物，为了在夜间能看清事物，需要大量的牛磺酸，而鱼和老鼠的体内就含较多牛磺酸，所以猫不仅仅是因为喜欢而吃鱼和老鼠，也是因为自己的需要才吃。",o:["猫能发现老鼠的踪迹","猫需要牛磺酸提高嗅觉","猫的体内含有较多牛磺酸","猫因为自己的需要而吃鱼和老鼠"],a:3,why:"“也是因为自己的需要才吃”. B: taurine giúp <b>nhìn</b> ban đêm, không phải khứu giác; C: cá và chuột chứa nhiều taurine."},{n:2,say:"我们常常看到猫趴在那儿睡觉。这并不是因为它们懒惰，而是为了补充精力。猫每天的睡眠时间比较长，在12～16小时之间，猫、老鼠、猪都喜欢睡懒觉。蝙蝠、沙鼠和狮子每天的睡眠时间更长，它们一生之中有多达三分之二的时间在梦乡中度过。",o:["猫是睡眠时间最长的动物","老鼠和猪并不喜欢睡懒觉","猫为了补充体力，睡眠时间比较长","狮子一生中三分之一的时间在睡觉"],a:2,why:"“是为了补充精力……睡眠时间比较长”. D: <b>hai phần ba</b>."},{n:3,say:"看到主人，狗会快活地扑过来，与人交往是狗的天性，但程度常取决于3～7周龄时其与人接触的程度。假如狗出生的头两个月只跟狗类在一起，不是由人类饲养的，或者说没有真正接触过人类，那它一生都不会亲近人，并难以训练。",o:["狗天生不喜欢与人交往","通过练习，所有的狗都能与人友善","狗与人的亲密关系要经过几年的时间才能建立起来","狗是否与人亲热，取决于出生后3～7周与人接触的程度"],a:3,why:"“程度常取决于3～7周龄时其与人接触的程度”."},{n:4,say:"天鹅体态优雅迷人，好像高贵的君子。白天鹅浑身雪白，声音像喇叭一样洪亮。小天鹅叫声清脆，好像哨子声，所以也叫“口哨天鹅”。黑天鹅浑身长着卷曲的黑褐色羽毛，嘴巴是红色的。",o:["天鹅是高贵的君子","白天鹅又称“口哨天鹅”","黑天鹅的嘴巴是红色的","小天鹅的叫声像喇叭一样"],a:2,why:"“黑天鹅……嘴巴是红色的”. B, D đảo: thiên nga trắng như kèn, thiên nga nhỏ như còi."},{n:5,say:"鸽子的方向感极强，特别是信鸽，无论飞出去多远，都能准确无误地飞回家，好像身体里安装了一个遥控器一样。常生活在山区的原鸽有很强的飞翔能力，一天可以飞行十几个小时而不疲倦。",o:["鸽子是方向感很强的鸟类","信鸽的身体里安装了遥控器","所有鸟都能准确无误地飞回家","原鸽可以飞行几十个小时而不疲倦"],a:0,why:"“鸽子的方向感极强”. B chỉ là so sánh <span class='zh'>好像</span>; D: <b>mười mấy</b> giờ."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：今天我们请到了小朋友都非常喜欢的明明老师来跟大家谈谈关于动物的话题。明明老师，很多小朋友都想知道动物是怎么分类的。您能跟我们说说吗？\n男：动物的分类标准有很多，我先给小朋友们介绍一种超级简单的分类方法吧。跟你们一样，每种动物都有它们喜欢的食物。爱吃肉的动物叫作肉食动物，被它们吃的动物是猎物，它们会跟踪并捕捉猎物。你家里养的小猫和小狗都是肉食动物，老虎也是。注意啦，老虎会很高兴吃掉你的猫、吞下你的狗，所以不能把它们关在一起。\n女：这么说，爱吃草的动物就是草食动物了？\n男：没错，以植物为主要食物的动物统统归入草食动物，包括大象、马、牛、羊等等。\n女：还有的动物既吃动物也吃植物，应该属于哪一类呢？\n男：动植物都吃的动物，被称为杂食动物。比如小猪、熊等等。希望小朋友也是杂食动物啊，这样营养才会全面。还有吃昆虫的动物是食虫动物，这类动物包括食蚁兽等。\n女：那这些动物之间有什么关系吗？\n男：肉食动物吃草食动物，草食动物吃植物……科学家把动物彼此之间谁吃谁的关系，画成了一张特殊的关系网，称为食物链或食物网。如果草食动物灭绝了，肉食动物也会灭绝，因为它们没有东西可吃了。如果肉食动物灭绝了，草食动物的数目会大量增加，并吃光所有植物。接着，草食动物会因为没有东西可吃而灭绝。",qs:[{n:6,q:"明明老师介绍了哪种动物分类方法？",o:["根据动物的体型分类","根据动物的食物分类","根据动物的栖息地分类","根据动物的身体结构分类"],a:1,why:"“每种动物都有它们喜欢的食物” → phân loại theo thức ăn."},{n:7,q:"文中没提到哪类动物？",o:["肉食动物","草食动物","杂食动物","食鱼动物"],a:3,why:"Có 肉食、草食、杂食、<b>食虫</b> — không có 食鱼."},{n:8,q:"明明老师为什么希望小朋友也是杂食动物？",o:["营养更全面","吃得更安全","更节省资源","性格会更好"],a:0,why:"“这样营养才会全面”."},{n:9,q:"下列哪种关系被称为食物链？",o:["草食动物吃植物","肉食动物吃草食动物","肉食动物吃杂食动物","动物间谁吃谁的关系"],a:3,why:"“把动物彼此之间谁吃谁的关系……称为食物链”."},{n:10,q:"如果草食动物灭绝了，会出现什么情况？",o:["肉食动物也灭绝","植物都会被吃光","杂食动物也灭绝","食虫动物也灭绝"],a:0,why:"“如果草食动物灭绝了，肉食动物也会灭绝”. B là khi động vật ăn thịt tuyệt chủng."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"每当夏天来到，我们就会在花园里、草坪上，看到轻轻飞过的蜻蜓。而在池塘边，我们还会看到蜻蜓用尾巴在水面上一点，然后飞走。这是怎么回事呢？这其实是蜻蜓产卵的动作。第二年春天到来时，小蜻蜓便会破卵而出，慢慢长出跟妈妈一样的翅膀。\n蜻蜓常常一边飞行，一边寻找小昆虫，一碰上猎物，就会立刻进攻。它们用6只脚把猎物钩住，然后送入口中。据科学家研究，蜻蜓靠“运动伪装”来追踪猎物。蜻蜓慢慢靠近猎物，在猎物的眼中，飞行的蜻蜓好像是个固定的点，因此完全不知危险已经来临。\n蜻蜓的头顶有一对亮晶晶的大眼睛，这就是复眼。复眼给了它们非常敏锐和宽广的视觉。所以蜻蜓能在飞行时看清各个方向每个角落的动静。",qs:[{n:11,q:"蜻蜓用尾巴在水面上一点是在干什么？",o:["喝水","洗澡","产卵","照顾小蜻蜓"],a:2,why:"“这其实是蜻蜓产卵的动作”."},{n:12,q:"蜻蜓用什么方法追踪猎物？",o:["立刻进攻","运动伪装","快速飞行","固定不动"],a:1,why:"“蜻蜓靠‘运动伪装’来追踪猎物”."},{n:13,q:"蜻蜓为什么能看清各个方向的动静？",o:["蜻蜓的眼睛很大","蜻蜓的眼睛很亮","蜻蜓的眼睛是复眼","蜻蜓的眼睛在头顶"],a:2,why:"“复眼给了它们非常敏锐和宽广的视觉”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"在春天或夏天的雨后，我们常能看到慢慢爬行的蜗牛。小小的蜗牛背着重重的外壳，一副吃力的样子，但这个壳却是用来保护蜗牛的“房子”。一旦遇到危险，蜗牛就会缩进里面，躲过侵扰。蜗牛大多生活在温暖、潮湿的地方，喜欢在植物丛中躲避太阳直晒。\n蜗牛以蔬菜、青草、瓜果为食，它是怎么吃东西的呢？蜗牛的舌头上有135排整齐的角质牙齿，总共有14000多颗牙齿，称得上是世界上牙齿最多的动物。蜗牛就是利用这些牙齿，刮下蔬菜、青草和瓜果皮来进食。\n蜗牛的头上有两对触角，一对长一对短。长触角上的两个黑点是眼睛，不过视力不太好，幸亏这对长触角能伸缩自如，摸索前进，帮助眼睛了解周围的情况。蜗牛的那对小触角具有嗅觉功能，如果受到损伤，它们就很难找到食物了。",qs:[{n:14,q:"蜗牛的外壳有什么作用？",o:["用来储存食物","用来保护蜗牛","用来给蜗牛保温","用来躲避太阳直晒"],a:1,why:"“这个壳却是用来保护蜗牛的‘房子’”."},{n:15,q:"蜗牛喜欢在什么样的环境中生活？",o:["安静的地方","凉爽的地方","温暖、潮湿的地方","有太阳直晒的地方"],a:2,why:"“蜗牛大多生活在温暖、潮湿的地方”."},{n:16,q:"蜗牛利用什么来吃东西？",o:["重重的外壳","灵活的舌头","舌头上的牙齿","长短两对触角"],a:2,why:"“蜗牛就是利用这些牙齿……来进食”."},{n:17,q:"蜗牛的小触角具有什么功能？",o:["视觉功能","嗅觉功能","帮助蜗牛消化食物","帮助蜗牛躲过侵扰"],a:1,why:"“那对小触角具有嗅觉功能”. A: mắt nằm trên râu <b>dài</b>."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["她默默凝视着手中的照片，陷入了沉思。","他用自己的镜头记录了老百姓们多彩的生活。","小狮子带有传奇色彩的故事在当地流传了很久很久。","我们应该采取措施，尽量避免今后不会发生这样的事故。"],a:3,why:"<b>Phủ định thừa</b>: <span class='zh'>避免</span> đã mang nghĩa phủ định → bỏ <span class='zh'>不会</span>: <span class='zh'>避免今后发生这样的事故</span>."},{n:19,o:["这个不幸的消息我是最近从朋友得知的。","整个地球表面，将近71%的面积被水覆盖着。","茶是中国传统的保健饮品，受到世界人民的喜爱。","油灯的原料是油，包括植物油和动物油，在古代都是贵重物品。"],a:0,why:"<b>Giới từ + người cần từ chỉ nơi</b>: <span class='zh'>从朋友<b>那儿</b>得知</span>."},{n:20,o:["妈妈每天都把房间打扫得一尘不染得干净。","当然，一些独一无二的尖端技术，往往不轻易出售。","不同按钮所代表的功能不是自动出现的，而是由人工操作完成的。","应鼓励学生认真钻研和思考，自助探究，自行设计解决问题的方案。"],a:0,why:"<b>Bổ ngữ chồng chéo</b>: <span class='zh'>一尘不染</span> đã là “sạch không một hạt bụi” → <span class='zh'>打扫得一尘不染</span> / <span class='zh'>打扫得干干净净</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"你养宠物吗？___你家中有宠物的话，那么你___比没有亲人、没有宠物的人快乐健康，而且很可能比一些有家人亲友、___没有宠物的人健康快乐。",o:["如果　虽然　可","倘若　不但　但","不管　即使　也","尽管　因为　就"],a:1,why:"<span class='zh'>倘若……的话，那么</span> (giả thiết); <span class='zh'>不但……而且</span>; <span class='zh'>有家人亲友、但没有宠物</span> (chuyển ý)."},{n:22,text:"在动物世界里，有时不是吃别的动物___被别的动物吃。为了安全地躲避敌人，有的动物___地隐藏起来，或假装成别的东西。有的昆虫身体___像树叶或树枝，这种融合到背景中去的做法叫伪装。它使得动物难___被发现，因此能保证自身安全。",o:["就是　巧妙　形状　以","而是　美妙　健康　于","还是　漂亮　味道　能","但是　恰巧　颜色　免"],a:0,why:"<span class='zh'>不是……就是……</span>; <span class='zh'>巧妙地隐藏</span>; <span class='zh'>形状像树叶</span>; <span class='zh'>难以被发现</span>."},{n:23,text:"一只蜜蜂停在一朵花上。它___出管状舌头，___甘甜的花蜜。蜜蜂在花中忙碌的时候，黄色的花粉就掉到了蜜蜂的身体上。___花粉被擦落到蜜蜂后来拜访的每一朵花上从而完成授粉的过程，因为一朵花需要___同种的另一朵花的花粉才能制造种子。",o:["拉　获得　其后　产自","探　采摘　身后　出自","推　取得　以后　从来","伸　吸食　之后　来自"],a:3,why:"<span class='zh'>伸出舌头</span>; <span class='zh'>吸食花蜜</span>; <span class='zh'>之后</span> đứng đầu câu; <span class='zh'>来自</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"鸵鸟生活在非洲的草原和沙漠地区。虽然是鸟类的一种，(24)。因为鸵鸟身体又大又笨重，翅膀已经严重退化，它们只能在大地上奔跑。鸵鸟是世界上现存体形最大的鸟，高可达3米，体重在100公斤以上。(25)，能观察到10公里以外的敌人的举动，便于及时逃脱。鸵鸟虽然体形庞大，身体强壮，但性情温和，(26)。\n鸵鸟粗壮有力、善于奔跑的双腿和展开后的翅膀，(27)，必要时还能顺利逃走。除此之外，鸵鸟还善于伪装。(28)，它们便把脖子平贴在地面上，身体蜷曲成一团，以自己暗褐色的羽毛伪装成石头或灌木丛，以躲避敌害。",opts:["鸵鸟目光高远","都能吓退敌人","但它们根本不会飞行","一旦受到惊吓或发现敌情","很容易被人类驯养"],ans:{24:2,25:0,26:4,27:1,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"天气渐冷，昼夜的温差越来越大。这时，小动物们很容易受凉生病。不管是在室外生活还是室内生活的小动物们都渴望有一个温暖而舒适的窝。那么，在繁忙的工作之余，让我们自力更生，亲自动手为宠物建造一个温暖而舒适的窝吧。\n首先，冷风和潮气总是贴着地面吹过来，因此，在冬季要把宠物的窝垫得高一些，让其离地面有一定的距离，并且放置在没有风的地方，在里面铺上清洁而保暖的毯子。这样可以预防宠物关节炎的发生。对于年老多病或已经患有关节炎的宠物，这么做尤其重要。此外，动物的窝要选择结实且密封的材料，切记不要让窝门朝向风口，以免让寒风吹进来。\n在冬季带宠物去室外散步时，主人和宠物都应该穿得暖暖和和的。在雨雪天可以给宠物穿上雨衣，如果淋了雨，回来以后一定要把动物的全身擦干，短毛的可以用毛巾擦干，而长毛的则要用吹风机吹干。",qs:[{n:29,q:"天气渐冷，小动物们容易出现什么情况？",o:["受凉生病","淋雨生病","贪吃贪睡","动手建窝"],a:0,why:"“小动物们很容易受凉生病”."},{n:30,q:"在冬季，动物的窝应该：",o:["贴着地面","朝向风口","垫得高一些","放在通风的地方"],a:2,why:"“在冬季要把宠物的窝垫得高一些”."},{n:31,q:"在冬季，带宠物去外边散步时，应该注意：",o:["给宠物穿暖和些","给宠物穿上雨衣","回来以后用毛巾擦干毛","出门前用吹风机吹毛"],a:0,why:"“主人和宠物都应该穿得暖暖和和的”. B chỉ khi trời mưa tuyết."},{n:32,q:"这篇文章主要是针对哪类动物的？",o:["野生的动物","生病的动物","家里的动物","动物园里的动物"],a:2,why:"Cả bài nói về <span class='zh'>宠物</span> — thú cưng trong nhà."}]},{ins:"第33–36题：请选出正确答案。",text:"小时候，我最喜欢看燕子在电线杆上飞来飞去。有一次回家，捡到一只受伤的燕子，我给它包扎好伤口，精心喂养，等它能走了，我又在院子里的大树上搭了个简陋的窝，我以为等伤好了它会急切地想飞走，谁知它竟住下了，一住就是几个月。不仅如此，第二年，它又从南方飞了回来，还带了伴儿来。燕子越来越多，树上的窝也越建越多，到第四年的时候，已经整整有十个了。这成了村里很特别的一道风景，燕子来的时候，大人小孩儿都来看。老人们说，燕子和人一样，懂得感恩，只要你不伤害它，它就把这里当成自己的家，一辈子都不会忘记。\n读大学时，一次和朋友逛街，突然有个人从后面拍了一下我的肩膀，我转身一看，是个挺帅气的小伙子，他说他下火车时钱包丢了，实在太饿了，请我帮帮他，要不然他不知道会流浪到何方。我笑了笑，大大方方请他吃了一顿，并送他上了回家的火车。这对我来说只是举手之劳，没想到他一直记在心上。大学毕业几个月后，我因为一直没找到合适的工作而焦急万分。一天我在一家大公司面试时，突然碰到了那个小伙子，他就在这家知名企业担任经理，他说他一直在找我，也一直都记得那顿饭的交情。那次我们聊了整整一个晚上，在他的引荐下，我顺利进入了该公司。\n这些事情都让我感动万分，懂得感恩让世界充满了温暖。",qs:[{n:33,q:"为什么那只燕子后来没有飞走？",o:["它受伤飞不了","这里有很多燕子","它有了一个简陋的窝","它把这里当成了自己的家"],a:3,why:"“只要你不伤害它，它就把这里当成自己的家”."},{n:34,q:"那个小伙子在大街上找“我”有什么事？",o:["要请“我”吃顿饭","让“我”送他上火车","希望“我”能帮助他","要帮“我”找份工作"],a:2,why:"“请我帮帮他”."},{n:35,q:"“我”后来是什么时候又遇见那个小伙子的？",o:["逛街的时候","找工作的时候","坐火车的时候","在饭馆吃饭的时候"],a:1,why:"“一天我在一家大公司面试时，突然碰到了那个小伙子”."},{n:36,q:"这个故事主要告诉我们什么？",o:["“我”家的燕子为什么越来越多","帮助别人是为了得到回报","“我”是怎样找到工作的","懂得感恩让世界很温暖"],a:3,why:"Câu kết: “懂得感恩让世界充满了温暖”."}]}]},W:{task:"你养过猫吗？你想过人不在家时猫在做什么吗？这篇课文给我们介绍了钱小奇家几只可爱的猫，描述了主人与猫之间的感情，同时告诉我们主人不在家时猫在做什么。请参考练习5，把课文缩写成300字左右的短文。",target:300,steps:[["Ba chú mèo","Mỗi con 1 câu, giữ tính từ then chốt: <span class='zh'>有教养 · 敏捷好动 · 迷人</span>."],["Chủ và mèo","<span class='zh'>模范饲养员 · 最急切盼望……</span>"],["Lắp hệ thống","Gộp: camera → có khiếm khuyết → <span class='zh'>自力更生</span> lắp hệ thống <span class='zh'>遥控 · 跟踪</span>."],["Phát hiện","<span class='zh'>大多数时间在睡觉 · 很有规律 · 该干吗干吗</span>."],["Công dụng khác + kết","Tìm ví, <span class='zh'>报警</span>; câu cảm thán kết."]],outline:[["一 · 三只猫","大黄 / 白白 / 喜儿"],["二 · 主人与猫","模范饲养员；门口迎接"],["三 · 安装系统","摄像头 → 尖端设备"],["四 · 发现","睡觉；有规律；该干吗干吗"],["五 · 其他用处","找钱包；报警"]],model:"我不在时，猫在干什么？\n钱小奇养了三只猫。大黄原本是流浪猫，却很有教养，每次主人回来都恭恭敬敬地在门口迎接；白白嗅觉灵敏，动作敏捷，快活而好动；喜儿人见人爱，总把自己梳理得漂亮而迷人。\n钱小奇是个模范饲养员，每天早起先伺候猫。他工作虽然繁忙，但最急切盼望的就是回家开门的那一刻。\n他很好奇：自己不在家时，猫在做什么？为了弄清楚，他先在家里安了个摄像头，发现有缺陷后，又增加设备，自力更生安装了一套尖端系统。现在，他在外面也能通过互联网遥控摄像头，跟踪到家里的任何一个角落。\n通过分析，他发现猫大多数时间都在睡觉，行动也很有规律。大黄和白白并不是一直在门口等他，而是在屋里该干吗干吗，听到脚步声和钥匙响才跑去迎接。\n这套系统还帮过他不少忙：有一次帮他找到了掉在桌子下的钱包；只要家里稍有动静，它就会把照片即时发到他的邮箱里“报警”。这真是一个有用的家庭安全机器人。",check:["Có tiêu đề","Giới thiệu đủ 3 con mèo","Có tình cảm chủ – mèo","Có quá trình lắp hệ thống","Có phát hiện + công dụng khác","Dùng ít nhất 4: 统统 · 以……为…… · 该干吗干吗 · 急切 · 自力更生 · 见多识广","Khoảng 300 chữ (±30)"]},SUM:{words:["流浪","拜访","见多识广","教养","懒惰","知足常乐","恭敬","灵敏","敏捷","快活","扑","亲热","统统","迷人","模范","饲养","繁忙","急切","例外","凝视","深沉","监视","缺陷","镜头","自力更生","尖端","钻研","储存","遥控","操纵","跟踪","误差","动静","操作"],patterns:[["……统统……","把钱小奇和他带回来的东西统统闻一遍。"],["以……为例 / 为主","以其中一只猫为例，……"],["该干吗干吗","在屋里该干吗干吗。"],["虽……，却……","大黄虽有流浪史，却很有教养。"],["对……进行 + V","对家里的猫进行即时监控。"]],diff:["急切：tính từ, tâm trạng nóng lòng, + danh từ (急切的心情) — 急忙：phó từ, hành động vội, chỉ + động từ","灵敏 (giác quan, máy móc nhạy) · 敏捷 (động tác, tư duy nhanh) · 好 hào (好动 · 好奇) · 教养 jiào · 嗅觉 xiù · 钻研 zuān · 动静 dòngjing"],sentences:["见多识广的大黄虽有流浪史，却很有教养，它既不懒惰，也不嘴馋。","他虽然工作繁忙，但每天最急切盼望的就是回家开门的那一刻。","只要家里稍有动静，操作系统就能将图像记录下来，并把拍下的照片即时发到他的邮箱里“报警”。"],hw:["Học thuộc 46 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 11.","Đọc trước bài 12 《我们都爱白噪音》."]}});
