<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 17 · 小动物眼中的慢世界 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-17",num:17,book:"HSK 标准教程 6（上）",unit:{n:5,zh:"美丽家园",vn:"Ngôi nhà tươi đẹp"},title:"小动物眼中的慢世界",vn:"Thế giới chậm trong mắt động vật nhỏ",chars:845,source:"改编自《南都周刊》文章《小生灵，慢世界》，作者：石悦",goals:["Đọc hiểu bài khoa học phổ thông 845 chữ: vì sao người khó đập trúng ruồi còn mèo thì dễ — <b>tần số nhấp nháy tới hạn (CFF)</b>.","Dùng được 44 từ mới, nhất là nhóm <b>động tác – phản ứng</b>: <span class='zh'>端 · 盛 · 企图 · 跳跃 · 瞄准 · 颤抖 · 迟钝 · 迟缓 · 笨拙</span> và nhóm <b>khoa học</b>: <span class='zh'>视力 · 闪烁 · 推论 · 新陈代谢 · 能量 · 论证 · 筛选 · 标记</span>.","Nắm mẫu <span class='zh'>东A西B</span>, động từ <span class='zh'>中 (zhòng)</span>, phó từ <span class='zh'>姑且</span>.","Phân biệt <span class='zh'>势必 — 一定</span>; nhận diện câu sai loại <b>trộn lẫn cấu trúc</b> (句式杂糅).","Viết tóm tắt (缩写) bài khóa khoảng 400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (东A西B · 中) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (姑且 · 势必—一定) · Đoạn 4–7 · Bài tập · 句式杂糅 · Luyện đề · Viết 缩写"]],outline:[{tag:"问",name:"Hiện tượng",paras:"Đoạn 1",zh:"人打不中苍蝇，猫一下就拍到",vn:"Người đập ruồi không trúng, mèo vồ một cái là trúng — vì trong mắt ruồi, cú đập của người là “quay chậm”."},{tag:"释 1",name:"Lượng thông tin",paras:"Đoạn 2",zh:"小动物一秒钟接收的信息量多得多",vn:"Động vật nhỏ tiếp nhận thông tin mỗi giây nhiều hơn; nhìn người như người nhìn voi."},{tag:"释 2",name:"CFF",paras:"Đoạn 3–4",zh:"临界闪光频率；人60、犬80、苍蝇250HZ",vn:"Tần số nhấp nháy tới hạn: người 60 Hz, chó 80 Hz, ruồi 250 Hz."},{tag:"释 3",name:"Nguyên nhân",paras:"Đoạn 5",zh:"与体重、新陈代谢有关；松鼠第一",vn:"CFF liên quan cân nặng và tốc độ trao đổi chất; sóc đứng đầu."},{tag:"结",name:"Ý nghĩa",paras:"Đoạn 6–7",zh:"迅速判断 → 生存机会；小动物显得更敏捷",vn:"Phán đoán nhanh giúp sinh tồn; vì thế động vật nhỏ, trẻ con trông hiếu động hơn."}],warm1:{q:"结合图片思考下面的问题，选择你认为正确的答案：人为什么很难一下子拍到苍蝇（cāngying）？",vn:"Vì sao người rất khó đập trúng ruồi ngay một phát?",items:[["🤔","人太笨了 · 苍蝇飞得很快","Người quá vụng · Ruồi bay rất nhanh"],["👁️","苍蝇的视力很好 · 苍蝇有预感","Ruồi mắt rất tinh · Ruồi có linh cảm"],["🐢","在苍蝇眼里，人的动作太慢了","Trong mắt ruồi, động tác của người quá chậm"]],talk:["你打苍蝇时能打中吗？","你觉得猫为什么能一下子抓到苍蝇？"],link:"Đáp án khoa học là lựa chọn cuối: <b>trong mắt ruồi, người như đang “quay chậm”</b> — bài khóa sẽ giải thích bằng chỉ số CFF."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"收",rule:"收 = <b>nhận, thu</b>.",w:[["接收","jiēshōu","tiếp nhận (có trong bài)"],["吸收","xīshōu","hấp thụ"],["查收","cháshōu","kiểm tra và nhận"],["收入","shōurù","thu nhập"],["收到","shōudào","nhận được"],["收据","shōujù","biên lai"],["收发","shōufā","nhận và gửi"],["收看","shōukàn","xem (TV)"],["收留","shōuliú","cưu mang"],["收录","shōulù","thu nhận, ghi vào"],["收取","shōuqǔ","thu (phí)"],["收集","shōují","thu thập"],["收听","shōutīng","nghe (đài)"],["收养","shōuyǎng","nhận nuôi"]]},{k:"型",rule:"型 = <b>kiểu, loại, khuôn</b>.",w:[["体型","tǐxíng","vóc dáng (có trong bài)"],["类型","lèixíng","loại hình"],["大型","dàxíng","cỡ lớn"],["中型","zhōngxíng","cỡ vừa"],["小型","xiǎoxíng","cỡ nhỏ"],["微型","wēixíng","cỡ siêu nhỏ"],["巨型","jùxíng","khổng lồ"],["型号","xínghào","mẫu mã"],["成型","chéngxíng","thành hình"],["发型","fàxíng","kiểu tóc"],["新型","xīnxíng","kiểu mới"],["轻型","qīngxíng","loại nhẹ"],["血型","xuèxíng","nhóm máu"],["原型","yuánxíng","nguyên mẫu"]]},{k:"感",rule:"感 = <b>cảm giác, cảm nhận</b>.",w:[["感知","gǎnzhī","cảm nhận (có trong bài)"],["感受","gǎnshòu","cảm nhận"],["感觉","gǎnjué","cảm giác"],["感到","gǎndào","cảm thấy"],["灵感","línggǎn","cảm hứng"],["快感","kuàigǎn","khoái cảm"],["敏感","mǐngǎn","nhạy cảm"],["痛感","tònggǎn","cảm giác đau"],["同感","tónggǎn","đồng cảm"],["预感","yùgǎn","linh cảm"],["语感","yǔgǎn","cảm giác ngôn ngữ"]]},{k:"率",rule:"率 (lǜ) = <b>tỉ lệ, tần suất</b>.",w:[["速率","sùlǜ","tốc độ (có trong bài)"],["频率","pínlǜ","tần số (có trong bài)"],["心率","xīnlǜ","nhịp tim"],["比率","bǐlǜ","tỉ lệ"],["概率","gàilǜ","xác suất"],["汇率","huìlǜ","tỉ giá"],["利率","lìlǜ","lãi suất"],["出生率","chūshēnglǜ","tỉ lệ sinh"],["死亡率","sǐwánglǜ","tỉ lệ tử vong"],["就业率","jiùyèlǜ","tỉ lệ có việc làm"],["失业率","shīyèlǜ","tỉ lệ thất nghiệp"],["离婚率","líhūnlǜ","tỉ lệ ly hôn"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Ruồi, mèo và bồ câu",from:1,to:18},{name:"Nhóm 2 · Đoạn 3–5",sub:"Chỉ số CFF",from:19,to:34},{name:"Nhóm 3 · Đoạn 6–7",sub:"Ưu thế của động vật nhỏ",from:35,to:44}],V:[[1,"场面","chǎngmiàn","dt.","trường diện","cảnh tượng",1,"","戏剧、电影中由布景、音乐和人物组成的景况；泛指一定场合下的情景。","你见过这样的场面吗？","比赛的场面非常激烈。","Cảnh trận đấu vô cùng gay cấn.",["热闹的场面","大场面"],""],[2,"端","duān","đgt.","đoan","bưng",1,"","平举着拿。","有人端来一个盛着菜的盘子","服务员端来了两杯咖啡。","Phục vụ bưng tới hai tách cà phê.",["端菜","端茶"],""],[3,"盛","chéng","đgt.","thịnh","đựng, xới",1,"","把东西放在器具里。","盛着菜的盘子","妈妈给我盛了一碗饭。","Mẹ xới cho tôi một bát cơm.",["盛饭","盛汤"],"⚠️ Đọc <b>chéng</b> (khác <span class='zh'>盛 shèng</span> = thịnh vượng: <span class='zh'>盛产 · 盛开</span>)."],[4,"东张西望","dōng zhāng xī wàng","thành ngữ","đông trương tây vọng","nhìn ngang ngó dọc",1,"成","向四处张望。","飞来一只东张西望的苍蝇","他在门口东张西望，好像在找人。","Anh ta ngó nghiêng ở cửa, như đang tìm ai.",[],"Xem <b>Ngữ pháp: 东A西B</b>. Bài tập 3①."],[5,"企图","qǐtú","đgt.","xí đồ","mưu toan, định",1,"","图谋；打算（多含贬义）。","企图落在盘子上","小偷企图逃跑，被警察抓住了。","Tên trộm định chạy trốn thì bị cảnh sát bắt.",["企图逃跑"],"Thường mang nghĩa <b>xấu</b>. Bài tập 2①, 3①."],[6,"动手","dòng shǒu","đgt.","động thủ","ra tay, bắt tay vào",1,"","开始做；用手接触；打人。","人动手去打","说好了不能动手打人。","Đã nói là không được ra tay đánh người.",["自己动手","动手术"],"Bài tập 3①. Ba nghĩa: bắt tay làm · chạm tay · đánh nhau."],[7,"纳闷儿","nà mènr","đgt.","nạp muộn","thắc mắc, khó hiểu",1,"口","疑惑不解。","有人纳闷儿","我很纳闷儿，他为什么突然不来了。","Tôi rất thắc mắc sao anh ấy bỗng dưng không đến.",["感到纳闷儿"],"Bài tập 2②."],[8,"跳跃","tiàoyuè","đgt.","khiêu dược","nhảy",1,"","跳。","猫为什么能快速跳跃起来","运动员跳跃着冲过了终点。","Vận động viên nhảy vọt qua vạch đích.",[],"Bài tập 1: <span class='zh'>跳舞 · 跳高 · 跳远 · 跳水</span>."],[9,"瞄准","miáo zhǔn","đgt.","miêu chuẩn","nhắm",1,"","射击时使枪口或炮口对准目标；比喻对准某一目标。","瞄准都不用","这家公司瞄准了年轻人市场。","Công ty này nhắm vào thị trường người trẻ.",["瞄准目标"],"Bài tập 1: <span class='zh'>精准 · 准确 · 准备 · 准时</span>."],[10,"鸽子","gēzi","dt.","cáp tử","chim bồ câu",1,"","鸟名，翅膀大，善于飞行。","如果你观察一下鸽子","广场上有很多鸽子。","Quảng trường có nhiều bồ câu.",["和平鸽","信鸽"],""],[11,"视线","shìxiàn","dt.","thị tuyến","tầm mắt, ánh nhìn",1,"","用眼睛看东西时，眼睛和物体之间的假想直线。","当它的视线扫过周边时","一辆大车挡住了我的视线。","Một chiếc xe to che mất tầm nhìn của tôi.",["挡住视线"],"Bài tập 1: <span class='zh'>电线 · 毛线 · 线路 · 线条</span>."],[12,"周边","zhōubiān","dt.","chu biên","xung quanh",1,"","周围；四周。","当它的视线扫过周边时","学校周边有很多小饭馆。","Quanh trường có nhiều quán ăn nhỏ.",["周边环境","周边地区"],"Bài tập 1: <span class='zh'>周围 · 周密 · 周期 · 周全</span>. Bài tập 3①."],[13,"颤抖","chàndǒu","đgt.","chiến đẩu","run rẩy",1,"","哆嗦；发抖。","它在微微颤抖","他冷得全身颤抖。","Anh ấy rét run cả người.",[],"⚠️ 颤 đọc <b>chàn</b>. SBT câu 20."],[14,"确切","quèqiè","tt.","xác thiết","chính xác",1,"","准确；恰当；确实可靠。","确切地说","我还没有得到确切的消息。","Tôi chưa nhận được tin chính xác.",["确切地说","确切的消息"],"Bài tập 3①."],[15,"迟钝","chídùn","tt.","trì độn","chậm (phản ứng)",1,"","（感官、思想、行动等）反应慢，不灵敏。","人类反应迟钝","年纪大了，反应有点儿迟钝。","Lớn tuổi rồi, phản ứng hơi chậm.",["反应迟钝"],"Bài tập 1: <span class='zh'>迟缓 · 迟到 · 推迟 · 延迟</span>. Bài tập 3②."],[16,"迟缓","chíhuǎn","tt.","trì hoãn","chậm chạp",1,"","缓慢。","动作迟缓","老人行动迟缓。","Người già đi lại chậm chạp.",["动作迟缓"],"<span class='zh'>迟钝</span> = chậm phản ứng (giác quan, đầu óc); <span class='zh'>迟缓</span> = chậm động tác, tiến độ. Bài tập 3②."],[17,"庞大","pángdà","tt.","bàng đại","to lớn, đồ sộ",1,"","很大（常含过大或大而无当的意思）。","庞大、笨拙的大象","这是一项庞大的工程。","Đây là một công trình đồ sộ.",["体积庞大","庞大的开支"],""],[18,"笨拙","bènzhuō","tt.","bản chuyết","vụng về",1,"","笨；不聪明；不灵巧。","庞大、笨拙的大象","他笨拙地包着饺子。","Anh ấy vụng về gói sủi cảo.",["动作笨拙"],""],[19,"比方","bǐfang","đgt.","bỉ phương","ví như",1,"","用容易明白的甲事物来说明不容易明白的乙事物。","比方说","比方说，你想去哪儿旅行？","Ví dụ nhé, bạn muốn đi du lịch đâu?",["比方说","打比方"],"Bài tập 2③."],[20,"间隔","jiàngé","đgt.","gián cách","cách nhau",1,"","（事物在空间或时间上）隔开；隔开的距离。","当一个间隔频率较低的光刺激我们的眼睛时","两次服药要间隔四个小时。","Hai lần uống thuốc phải cách nhau bốn tiếng.",["间隔时间"],"⚠️ 间 đọc <b>jiàn</b>."],[21,"闪烁","shǎnshuò","đgt.","thiểm thước","lấp lánh, nhấp nháy",1,"","（光亮）动摇不定，忽明忽暗。","一明一暗的闪烁","夜空中星星闪烁。","Trên bầu trời đêm sao nhấp nháy.",[],""],[22,"视力","shìlì","dt.","thị lực","thị lực",1,"","在一定距离内眼睛辨别物体形象的能力。","我们的视力感到的","长时间看手机会影响视力。","Xem điện thoại lâu ảnh hưởng thị lực.",["保护视力"],""],[23,"姑且","gūqiě","phó.","cô thả","tạm, tạm thời",1,"","表示暂时地（含有让步的意思）。","我们姑且换一个文雅的称呼吧","你姑且试试吧。","Cậu cứ tạm thử xem.",[],"Xem <b>Ngữ pháp: 姑且</b>. Bài tập 2④."],[24,"文雅","wényǎ","tt.","văn nhã","nho nhã",1,"","（言谈、举止）温和有礼貌，不粗俗。","换一个文雅的称呼","她说话很文雅。","Cô ấy ăn nói rất nho nhã.",["举止文雅"],""],[25,"犬","quǎn","dt.","khuyển","chó",1,"书","狗。","犬的CFF为80HZ","警犬帮助警察抓坏人。","Chó nghiệp vụ giúp cảnh sát bắt kẻ xấu.",["警犬","导盲犬"],"Văn viết của <span class='zh'>狗</span> — bài khóa nói đùa đổi tên cho “nho nhã”."],[26,"系列","xìliè","dt.","hệ liệt","loạt, chuỗi",1,"","相关联的成组成套的事物。","一系列静止图像的迅速变换","这家公司推出了一系列新产品。","Công ty này tung ra loạt sản phẩm mới.",["一系列","系列产品"],"SBT câu 33–36."],[27,"推论","tuīlùn","đgt.","suy luận","suy luận",1,"","用语言的形式进行推理。","有科学家推论","根据这些数据，我们可以推论出……","Từ những số liệu này, có thể suy ra…",[],"Còn là danh từ: <span class='zh'>这一推论</span>."],[28,"本身","běnshēn","đt.","bản thân","bản thân",1,"","自身（多指集体、单位或事物）。","与其本身的体重和新陈代谢速率有关","这个问题本身并不难。","Bản thân vấn đề này không khó.",[],"Bài tập 3②."],[29,"新陈代谢","xīnchén-dàixiè","thành ngữ","tân trần đại tạ","trao đổi chất; cái mới thay cái cũ",1,"成","生物体从环境摄取营养物转变为自身物质，同时将自身原有组成转变为废物排出到环境中的不断更新的过程。","新陈代谢速率","运动可以加快新陈代谢。","Vận động giúp tăng trao đổi chất.",[],"Bài tập 3②."],[30,"能量","néngliàng","dt.","năng lượng","năng lượng",1,"","度量物质运动的一种物理量；比喻人的活动能力。","有更充足的能量支持","早餐能给人提供一天的能量。","Bữa sáng cung cấp năng lượng cho cả ngày.",["正能量"],"<span class='zh'>正能量</span> = năng lượng tích cực."],[31,"论证","lùnzhèng","đgt.","luận chứng","luận chứng, chứng minh",1,"","论述并证明。","在论证这一推论时","这个观点需要进一步论证。","Quan điểm này cần chứng minh thêm.",[],""],[32,"筛选","shāixuǎn","đgt.","si tuyển","sàng lọc",1,"","利用筛子进行选种等；泛指通过淘汰的方法挑选。","科学家筛选出34种动物","公司从一百多份简历中筛选出了十个人。","Công ty lọc ra mười người từ hơn trăm hồ sơ.",[],""],[33,"标记","biāojì","đgt.","tiêu ký","đánh dấu",1,"","做出记号；标志；记号。","标记在同一张图表中","请把重要的地方标记出来。","Hãy đánh dấu những chỗ quan trọng.",[],"Còn là danh từ = ký hiệu."],[34,"名次","míngcì","dt.","danh thứ","thứ hạng",1,"","依照一定标准排列的姓名或名称的次序。","CFF值名次最靠前的是松鼠","他在比赛中取得了好名次。","Cậu ấy đạt thứ hạng tốt trong cuộc thi.",["取得名次"],"SBT câu 20."],[35,"感慨","gǎnkǎi","đgt.","cảm khái","cảm khái, bùi ngùi",1,"","有所感触而慨叹。","我们也许曾经发出过这样的感慨","看到老照片，他感慨万千。","Xem ảnh cũ, ông bùi ngùi khôn xiết.",["感慨万千","发出感慨"],"Bài tập 2⑥."],[36,"渺小","miǎoxiǎo","tt.","miểu tiểu","nhỏ bé",1,"","微小。","看似渺小的苍蝇","在大自然面前，人类显得很渺小。","Trước thiên nhiên, con người thật nhỏ bé.",[],"Trái nghĩa: <span class='zh'>伟大</span>."],[37,"攻击","gōngjī","đgt.","công kích","tấn công",1,"","进攻；恶意指摘。","能躲过人类的攻击","这种蛇一般不主动攻击人。","Loài rắn này thường không chủ động tấn công người.",["受到攻击","人身攻击"],""],[38,"势必","shìbì","phó.","thế tất","ắt sẽ",1,"书","根据形势推测必然会怎样。","势必有其过人之处","这样下去，势必会影响健康。","Cứ thế này ắt sẽ ảnh hưởng sức khỏe.",["势必会……"],"Xem <b>辨析 势必—一定</b>."],[39,"博大精深","bódà-jīngshēn","thành ngữ","bác đại tinh thâm","sâu rộng, uyên thâm",1,"成","（思想、学识等）广博高深。","它们没有博大精深的思想","中国文化博大精深。","Văn hóa Trung Hoa sâu rộng uyên thâm.",[],"SBT câu 22."],[40,"深奥","shēn'ào","tt.","thâm áo","sâu xa, khó hiểu",1,"","（道理、含义）高深不易理解。","不能进行深奥的思考","这本书太深奥了，我看不懂。","Cuốn sách này quá cao siêu, tôi đọc không hiểu.",[],""],[41,"无能为力","wúnéngwéilì","thành ngữ","vô năng vi lực","bất lực",1,"成","用不上力量；没有能力去做或解决。","对强大的对手无能为力","对这件事，我也无能为力。","Chuyện này tôi cũng bất lực.",[],"Bài tập 3②."],[42,"实惠","shíhuì","tt.","thực huệ","thiết thực, lợi",1,"","有实际的好处。","这一优势真的实惠极了","这家饭馆的菜又好吃又实惠。","Món ở quán này vừa ngon vừa lợi.",["经济实惠"],"SBT nghe câu 2: <span class='zh'>经济实惠</span>."],[43,"个体","gètǐ","dt.","cá thể","cá thể",1,"","单个的人或生物。","总显得比成年个体更为好动和焦急","每个个体都是不同的。","Mỗi cá thể đều khác nhau.",["个体户"],"<span class='zh'>个体户</span> = hộ kinh doanh cá thể."],[44,"焦急","jiāojí","tt.","tiêu cấp","sốt ruột, nóng lòng",1,"","着急。","总显得比成年个体更为好动和焦急","他焦急地等待着考试结果。","Anh ấy sốt ruột chờ kết quả thi.",[],"SBT nghe câu 5."]],extra:[["苍蝇","cāngying","con ruồi"],["闪电","shǎndiàn","tia chớp"],["慢动作","màndòngzuò","cảnh quay chậm"],["昆虫","kūnchóng","côn trùng"],["量化","liànghuà","định lượng"],["感知","gǎnzhī","cảm nhận"],["临界","línjiè","tới hạn"],["赫兹","hèzī","hertz (Hz)"],["速率","sùlǜ","tốc độ"],["相关性","xiāngguānxìng","tính tương quan"],["松鼠","sōngshǔ","con sóc"],["过人之处","guòrén zhī chù","chỗ hơn người"],["悠闲","yōuxián","nhàn nhã"]],T:[{zh:"你见过这样的场面吗？有人端来一个盛着菜的盘子，立刻飞来一只东张西望的苍蝇，企图落在盘子上，人动手去打，却总是打不中。有人纳闷儿，猫为什么能快速跳跃起来，瞄准都不用，一下就能拍到苍蝇？科学家这样解释：在苍蝇眼里，人类自认为闪电般快速的一拍，只是个慢动作而已。",vn:"Bạn đã thấy cảnh này chưa? Có người bưng tới một đĩa thức ăn, lập tức một con ruồi ngó nghiêng bay tới, định đậu xuống đĩa; người ta ra tay đập nhưng mãi không trúng. Có người thắc mắc: sao mèo có thể nhảy vọt lên thật nhanh, chẳng cần nhắm, vồ một phát là trúng ruồi? Các nhà khoa học giải thích thế này: trong mắt con ruồi, cú đập mà con người tự cho là nhanh như chớp chỉ là một động tác quay chậm mà thôi.",idea:"Hiện tượng: người không đập trúng ruồi, mèo thì được.",q:["在打苍蝇方面，人和猫有什么不同？为什么？"],note:[["东张西望","Mẫu <span class='zh'>东A西B</span> — xem Ngữ pháp 1."],["打不中","<span class='zh'>中 zhòng</span> = trúng — xem Ngữ pháp 2."],["……只是……而已","= chỉ là… mà thôi."]]},{zh:"有研究表明，昆虫这样的小动物，一秒钟之内接收的信息量，比人类等体型大的生物多得多。如果你观察一下鸽子就会发现，当它的视线扫过周边时，它在微微颤抖，看上去好像体内有另外一个钟表，走得比我们快好几倍。确切地说，在小动物看来，人类反应迟钝、动作迟缓，它们看人类，就像人类看庞大、笨拙的大象。",vn:"Có nghiên cứu cho thấy, những động vật nhỏ như côn trùng tiếp nhận lượng thông tin trong một giây nhiều hơn hẳn những sinh vật to lớn như con người. Nếu bạn quan sát chim bồ câu sẽ thấy, khi ánh mắt nó quét quanh, nó khẽ run rẩy, trông như trong người có một chiếc đồng hồ khác chạy nhanh hơn của ta mấy lần. Nói chính xác thì, trong mắt động vật nhỏ, con người phản ứng chậm, động tác chậm chạp; chúng nhìn con người như con người nhìn con voi khổng lồ vụng về.",idea:"Động vật nhỏ tiếp nhận thông tin nhanh hơn.",q:["昆虫等小动物在接收信息方面跟人类有什么不同？"],note:[["比……多得多","So sánh hơn với bổ ngữ mức độ."],["确切地说","Chen ngữ = nói chính xác."],["在……看来","= theo cách nhìn của…"]]},{zh:"为了量化这种看不见、摸不着的视觉感知，科研人员采用了临界闪光频率的办法。“临界闪光频率”简称“CFF (Critical Flicker Frequency)”，比方说，当一个间隔频率较低的光刺激我们的眼睛时，我们看到的是一明一暗的闪烁，随着光刺激间隔的缩短，我们的视力感到的就会是一个连续的光。CFF值反映的就是眼睛处理光线的速度。处理速度越快，CFF值就越高。",vn:"Để định lượng cảm nhận thị giác không nhìn thấy, không sờ được này, các nhà nghiên cứu dùng phương pháp tần số nhấp nháy tới hạn, gọi tắt là “CFF”. Chẳng hạn, khi một nguồn sáng có tần số ngắt quãng thấp kích thích mắt ta, ta thấy ánh sáng chớp tắt lúc sáng lúc tối; khi khoảng ngắt của kích thích rút ngắn, thị giác của ta sẽ cảm nhận một luồng sáng liên tục. Giá trị CFF phản ánh tốc độ mắt xử lý ánh sáng. Xử lý càng nhanh, CFF càng cao.",idea:"Giới thiệu chỉ số CFF.",q:["什么是CFF？"],note:[["看不见、摸不着","Bổ ngữ khả năng phủ định song song."],["比方说，……","Dẫn ví dụ."],["……越……，……就越……","Càng… càng…"]]},{zh:"人眼的CFF为60HZ左右，狗，哦，我们姑且换一个文雅的称呼吧，犬的CFF为80HZ。在犬的眼里，电视画面不是连续的，而是一系列静止图像的迅速变换。苍蝇的CFF高达250HZ，对视觉刺激的反应速度是人眼的4倍。",vn:"CFF của mắt người khoảng 60 Hz; chó — à, ta tạm đổi một cách gọi nho nhã hơn nhé — “khuyển” có CFF 80 Hz. Trong mắt loài khuyển, hình ảnh tivi không liên tục mà là một loạt ảnh tĩnh thay đổi rất nhanh. CFF của ruồi lên tới 250 Hz, tốc độ phản ứng với kích thích thị giác gấp 4 lần mắt người.",idea:"So sánh CFF: người – chó – ruồi.",q:["人和狗等动物的CFF有何不同？"],note:[["姑且","Xem Ngữ pháp 3. Tác giả đùa: đổi “狗” thành “犬” cho văn vẻ."],["不是……，而是……","Bác bỏ – khẳng định."],["高达……","= lên tới…"]]},{zh:"有科学家推论，物种的CFF与其本身的体重和新陈代谢速率有关。体型越小，信号传达到大脑所需时间越短；新陈代谢速率越高，说明传递过程有更充足的能量支持。在论证这一推论时，科学家筛选出34种动物，把它们的典型体重、代谢速率和CFF标记在同一张图表中，变量显示出了显著的相关性。在科学家的研究中，CFF值名次最靠前的是松鼠。",vn:"Có nhà khoa học suy luận, CFF của một loài liên quan đến cân nặng và tốc độ trao đổi chất của chính nó. Cơ thể càng nhỏ, tín hiệu truyền đến não càng nhanh; tốc độ trao đổi chất càng cao chứng tỏ quá trình truyền dẫn có năng lượng dồi dào hơn. Khi chứng minh suy luận này, các nhà khoa học lọc ra 34 loài, đánh dấu cân nặng điển hình, tốc độ trao đổi chất và CFF của chúng lên cùng một biểu đồ; các biến số cho thấy tương quan rõ rệt. Trong nghiên cứu, loài có CFF đứng đầu là con sóc.",idea:"CFF liên quan cân nặng và trao đổi chất.",q:["CFF与什么有关？"],note:[["与……有关","Xem <b>Bài tập 4①</b>."],["……越……，……越……；……越……，说明……","Câu suy luận khoa học."]]},{zh:"我们也许曾经发出过这样的感慨：看似渺小的苍蝇既然能躲过人类的攻击，势必有其过人之处。确实，它们没有博大精深的思想，不能进行深奥的思考，对强大的对手无能为力，但对外部环境能迅速做出判断，使它们有了更多的生存机会，这一优势真的实惠极了。",vn:"Có lẽ ta từng cảm thán: con ruồi trông nhỏ bé thế mà tránh được đòn tấn công của con người, ắt hẳn có chỗ hơn người. Quả thật, chúng không có tư tưởng uyên thâm, không thể suy nghĩ sâu xa, bất lực trước đối thủ mạnh, nhưng có thể phán đoán nhanh môi trường bên ngoài, giúp chúng có thêm cơ hội sống sót — ưu thế này thật sự rất thiết thực.",idea:"Ưu thế sinh tồn của động vật nhỏ.",q:["苍蝇为什么能躲过人类的攻击？"],note:[["既然……，势必……","Suy luận tất yếu — xem 辨析 势必—一定."],["虽然没有……，不能……，对……无能为力，但……，使……","Xem <b>Bài tập 4②</b>."]]},{zh:"信息处理速度上的差别，也是小动物看上去更敏捷的原因。小猫小狗甚至小孩儿，总显得比成年个体更为好动和焦急，其实对于他们，这只是个悠闲的速度。",vn:"Khác biệt về tốc độ xử lý thông tin cũng là lý do động vật nhỏ trông nhanh nhẹn hơn. Mèo con, chó con, thậm chí trẻ nhỏ luôn có vẻ hiếu động và nóng vội hơn cá thể trưởng thành, nhưng thật ra với chúng, đó chỉ là một tốc độ thong thả.",idea:"Kết: vì sao trẻ nhỏ, thú nhỏ hiếu động.",q:["为什么小动物看上去更敏捷？"],note:[["更为 + Adj","Văn viết của <span class='zh'>更</span>."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: nghĩa của hình vị",G:[{id:"g1",grp:0,word:"东张西望",zh:"东A西B",py:"dōng A xī B",tag:"Chú thích 1 · mẫu bốn chữ",mean:"Mẫu <span class='zh'>东A西B</span> biểu thị “<b>chỗ này… chỗ kia…</b>”, làm lung tung, không tập trung. A và B thường là những từ <b>gần nghĩa</b>.",forms:["东 + V₁ + 西 + V₂（东张西望 · 东拉西扯 · 东躲西藏 · 东奔西走）","东一 + lượng + 西一 + lượng（东一句西一句）"],ex:[["大家吃完饭没事干，只好东拉西扯地闲聊天儿。","Ăn xong chẳng có việc gì, mọi người đành chuyện trên trời dưới đất."],["有人端来一个盛着菜的盘子，立刻飞来一只东张西望的苍蝇……","",1],["客人还不走，我只好跟他东一句西一句地没话找话说。","Khách vẫn chưa về, tôi đành nói câu này câu nọ cho có chuyện."]],tips:["Thêm: <span class='zh'>东奔西走 · 东拼西凑 · 东倒西歪 · 东鳞西爪</span>."],practice:{q:"选择合适的词语填空：东拉西扯 · 东张西望 · 东躲西藏",type:"complete",items:[["那孩子像是找不到家了，站在路口，(____)，显得有些着急。","那孩子像是找不到家了，站在路口，东张西望，显得有些着急。"],["黑猫被打败了，被大黄猫追得(____)，跳上跳下。","黑猫被打败了，被大黄猫追得东躲西藏，跳上跳下。"],["坐在火车上，大家都没事，便天南海北、(____)地闲聊起来。","……便天南海北、东拉西扯地闲聊起来。"]]}},{id:"g2",grp:0,word:"",zh:"中 (zhòng)",py:"zhòng",tag:"Chú thích 2 · động từ",mean:"Đọc <b>zhòng</b>, động từ: ① <b>đúng vào, khớp</b> (“trúng”): <span class='zh'>打中 · 猜中 · 选中 · 看中 · 考中</span>; ② <b>bị, chịu</b>: <span class='zh'>中暑 · 中毒 · 中弹 · 中计</span>.",forms:["V + 中（打中 / 猜中 / 看中）","中 + N（中暑 / 中毒 / 中奖）"],ex:[["人动手去打，却总是打不中。","",1],["今天的谜语，猜中了有奖。","Câu đố hôm nay, đoán trúng có thưởng."],["晚上再出去吧，中午太热，小心出门中暑。","Tối hãy ra ngoài, trưa nóng lắm, coi chừng say nắng."],["这种蘑菇不能吃，吃了会中毒的。","Loại nấm này không ăn được, ăn vào sẽ ngộ độc."]],tips:["<span class='zh'>中奖</span> = trúng thưởng · <span class='zh'>相中 / 看中</span> = ưng ý."],practice:{q:"用带“中”的词语完成句子",type:"complete",items:[["他的腿被(____)了，走不了了。","他的腿被打中了，走不了了。"],["六几年我自学英语，(____)一套英国Longman出版社的《基础英语》……","六几年我自学英语，选中了一套英国Longman出版社的《基础英语》……"],["……妈妈陪我左看右看，最后我(____)的竟然是一件白衬衫。","……最后我看中的竟然是一件白衬衫。"]]}},{id:"g3",grp:1,word:"姑且",zh:"姑且",py:"gūqiě",tag:"Chú thích 3 · phó từ",mean:"Phó từ: trong tình huống này <b>đành tạm thời</b> làm vậy, sau sẽ tính tiếp — mang ý <b>miễn cưỡng, nhượng bộ</b>. “Tạm…, cứ… đã”.",forms:["姑且 + V（先 / 试试 / 不论 / 听听）"],ex:[["狗，哦，我们姑且换一个文雅的称呼吧，犬的CFF为80HZ。","",1],["这件事，你姑且先答应下来，然后再慢慢想办法。","Chuyện này cậu cứ tạm nhận lời trước, rồi từ từ nghĩ cách."],["别让你妈妈着急了，你姑且按她说的做吧。","Đừng để mẹ sốt ruột, cậu tạm làm theo lời mẹ đi."]],tips:["<span class='zh'>姑且不论……</span> = tạm không bàn đến…","Bài tập 2④."],practice:{q:"为括号里的内容选择适当的位置",type:"pos",items:[["A最后怎么处理，B等我了解了解情况再说C。（这件事姑且先这么办，）","A","这件事姑且先这么办，最后怎么处理，等我了解了解情况再说。"],["A说的随便说说，B都不必认真C。（听的姑且听听，）","B","说的随便说说，听的姑且听听，都不必认真。"],["A但有一点可以肯定：B腐败不得人心C。（他的看法是否正确姑且不论，）","A","他的看法是否正确姑且不论，但有一点可以肯定：……"]]}},{id:"g4",grp:2,word:"势必",zh:"势必 / 一定",py:"shìbì / yídìng",tag:"Xem 辨析 bên dưới",mean:"Làm phó từ đều có nghĩa <b>“tất nhiên sẽ như thế nào”</b>. <span class='zh'>势必</span> (văn viết) suy đoán kết quả theo đà phát triển, thường là kết quả <b>bất lợi</b>.",forms:["……，势必（会）+ kết quả (thường xấu)"],ex:[["看似渺小的苍蝇既然能躲过人类的攻击，势必有其过人之处。","",1]],tips:["Bài tập 2⑤."]}],BX:{grp:2,word:"势必",cols:["势必","一定"],pair:"势必 — 一定",same:["Làm <b>phó từ</b>, đều có nghĩa “tất nhiên sẽ như thế nào”.","经常不来上课，势必 / 一定会影响考试成绩。"],diff:[["Suy đoán theo đà phát triển của sự việc, kết quả <b>thường bất lợi</b>.","人口过度增长势必影响经济水平的提高。","Suy đoán, kết quả <b>không nhất thiết</b> bất lợi.<div class='zh' style='margin-top:4px'>他是健身教练，身材一定很好。</div>"],["Không có cách dùng này.","—","Biểu thị <b>thái độ kiên quyết</b>, đứng trước động từ hoặc <span class='zh'>要 · 得</span>.<div class='zh' style='margin-top:4px'>要想学好汉语，一定得努力。</div>"],["Không có cách dùng này.","—","Còn là <b>tính từ</b> = quy định, xác định; cố định, tất yếu.<div class='zh' style='margin-top:4px'>要按一定的程序进行操作。 / 文章的难易跟篇幅的长短并没有一定的关系。</div>"]],task:{q:"选择“势必”或“一定”填空",cols:["势必","一定"],sample:!1,items:[["人人都不遵守交通规则，____会导致交通混乱。","0,1","Kết quả xấu, suy đoán → <b>cả hai đều được</b>."],["这件事就交给你了，你____要把它办好。",1,"Thái độ kiên quyết + 要 → 一定."],["他学习这么好，____能考上名牌大学。",1,"Kết quả <b>tốt</b> → 一定."],["他没日没夜地工作，吃饭睡觉都没有____的时间。",1,"Tính từ “cố định” (一定的时间) → 一定."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>跳</u>跃","跳舞 · 跳高 · 跳远 · 跳水"],items:[["瞄<u>准</u>","准","精准 · 准确 · 准备 · 准时"],["视<u>线</u>","线","电线 · 毛线 · 线路 · 线条"],["<u>周</u>边","周","周围 · 周密 · 周期 · 周全"],["<u>迟</u>钝","迟","迟缓 · 迟到 · 推迟 · 延迟"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["他________，但他的计划被我识破了。","企图","他企图骗走我的钱，但他的计划被我识破了。"],["听说有人找我，________？","纳闷儿","听说有人找我，我很纳闷儿：谁会知道我住在这儿呢？"],["我非常喜欢运动，________等等。","比方说","我非常喜欢运动，比方说跑步、游泳、打篮球等等。"],["如果你想洗衣服，我这里有台旧洗衣机，你________。","姑且","如果你想洗衣服，我这里有台旧洗衣机，你姑且先用着吧。"],["不好好发展经济，________。","势必","不好好发展经济，势必会影响人民的生活水平。"],["看到家乡的巨大变化，________。","感慨","看到家乡的巨大变化，他感慨万千，说这里简直认不出来了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["东张西望","确切","周边","企图","动手"],text:"小偷在{企图}偷东西时，总是先{东张西望}，看看{周边}有没有人注意自己，当{确切}知道没人注意时，他们再{动手}偷。如果在公共场合看到这样可疑的人，一定要多加小心，注意保管好自己的财物。"},{bank:["无能为力","本身","迟钝","迟缓","新陈代谢"],text:"人类跟其他动物一样，随着年龄的增长，反应越来越{迟钝}，行动越来越{迟缓}。同样的，我们{本身}的{新陈代谢}也逐渐变慢。年轻时，你轻而易举就能做到的动作，到了老年却{无能为力}了。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"有科学家推论，物种的CFF<u>与</u>其本身的体重和新陈代谢速率<u>有关</u>。体型<u>越</u>小，信号传达到大脑所需时间<u>越</u>短；新陈代谢速率越高，<u>说明</u>传递过程有更充足的能量支持。",task:"有科学家推论，身高与____有关。父母的____越____，孩子的____越____，这说明____是会遗传的。",model:"有科学家推论，身高与遗传因素有关。父母的个子越高，孩子的个子往往越高，这说明身高是会遗传的。"},{src:"<u>虽然</u>它们<u>没有</u>博大精深的思想，<u>不能</u>进行深奥的思考，<u>对</u>强大的对手<u>无能为力</u>，<u>但</u>对外部环境能迅速做出判断，<u>使</u>它们<u>有了</u>更多的生存机会。",task:"虽然他没有____，不能____，对____无能为力，但____，使____有了____。",model:"虽然他没有很高的学历，不能做复杂的研究，对电脑技术也无能为力，但他待人真诚、工作认真，使他有了很多愿意帮助他的朋友。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["在打苍蝇方面，人和猫有什么不同？为什么？","人：动手、打不中 / 猫：一下子拍到 / 在苍蝇眼里、慢动作","人动手打苍蝇总是打不中，猫却一下子就能拍到，因为在苍蝇眼里，人类快速的一拍只是个慢动作。"],["昆虫等小动物在接收信息方面跟人类有什么不同？","小动物：接收的信息量……，比如鸽子…… / 人类：反应……、动作……","小动物一秒钟内接收的信息量比人类多得多，比如鸽子好像体内有个走得更快的钟表；在它们看来，人类反应迟钝、动作迟缓。"],["什么是CFF？","视觉感知、光刺激、闪烁、连续的光、处理光线的速度","CFF即临界闪光频率，用来量化视觉感知：光刺激间隔较长时，我们看到一明一暗的闪烁；间隔缩短后，就感到连续的光。CFF反映眼睛处理光线的速度。"],["人和狗等动物的CFF有何不同？","CFF值：人、犬、苍蝇","人眼的CFF约为60HZ，犬为80HZ，苍蝇高达250HZ，是人眼的4倍。"],["CFF与什么有关？","体重、新陈代谢","CFF与物种本身的体重和新陈代谢速率有关：体型越小、代谢越快，CFF越高。"],["苍蝇为什么能躲过人类的攻击？","对……做出判断，使……有了生存机会","因为它们能对外部环境迅速做出判断，这使它们有了更多的生存机会。"],["为什么小动物看上去更敏捷？","信息处理速度","因为它们处理信息的速度更快，人类看来很快的动作，对它们来说只是悠闲的速度。"]]},BJ:{title:"病句类型：句式杂糅",vn:"Câu sai — loại 8: trộn lẫn cấu trúc",intro:"<b>句式杂糅</b>: cùng một nội dung vốn có thể diễn đạt theo nhiều cách, nhưng lại <b>trộn hai cách nói</b> vào một câu. Nguyên nhân chính: <b>trộn kiểu câu</b> (trần thuật + nghi vấn), <b>trộn kết cấu</b> (<span class='zh'>分为……/ 由……组成</span>, <span class='zh'>受……欢迎 / 为……所欢迎</span>), câu đã hoàn chỉnh lại làm thành phần của câu khác. Bấm vào phần <b>thừa / bị trộn</b>.",types:[["语气混杂","Trộn ngữ khí","我发觉，为什么只要你用功成绩就能提高了？","我发觉只要你用功成绩就能提高。","Tân ngữ của <span class='zh'>发觉</span> phải là câu <b>trần thuật</b>, không phải câu hỏi."],["完整句再做主语","Câu hoàn chỉnh lại làm chủ ngữ","做了演员以后，她一方面努力提高自己的专业水平，一方面努力提高自己的文化修养也是很重要的。","……一方面努力提高……，一方面努力提高自己的文化修养。","Vế trước đã đủ ý, lại bị dùng làm chủ ngữ của <span class='zh'>也是很重要的</span>."],["分为……/由……组成","Trộn hai kết cấu","展览分为地震突袭、抗震救灾、灾后重建、美好家园四部分组成……","展览分为……四部分。 / 展览由……四部分组成。","Chọn <b>một</b> trong hai."],["受……欢迎/为……所欢迎","Trộn chủ động – bị động","《消费者权益保护法》深受广大消费者所欢迎……","深受广大消费者欢迎 / 为广大消费者所欢迎","<span class='zh'>受……欢迎</span> và <span class='zh'>为……所 + V</span> (bài 16) không dùng chung."],["兼语句混用","Trộn câu kiêm ngữ","……黄曲霉素能够使人致癌。","黄曲霉素能够致癌。","<span class='zh'>致癌</span> đã đủ nghĩa (gây ung thư) → bỏ <span class='zh'>使人</span>."]],practice:[["这次参加比赛的，除了本校的学生，还有来自各国的留学生也参加了比赛。","也参加了比赛","这次参加比赛的，除了本校的学生，还有来自各国的留学生。","Câu đã đủ ý ở <span class='zh'>还有……留学生</span>; thêm vị ngữ là trộn hai cách nói."],["即使我所做的哪怕只给大家带来一点点的快乐，我也会很高兴。","即使","我所做的哪怕只给大家带来一点点的快乐，我也会很高兴。","<span class='zh'>即使</span> và <span class='zh'>哪怕</span> cùng nghĩa → bỏ một."],["父亲一直想让儿子学门手艺，他认为只要身怀绝技，一辈子才有了铁饭碗。","只要","……只有身怀绝技，一辈子才有了铁饭碗。","Quan hệ từ dùng sai cặp: <span class='zh'>只有……才……</span> (không phải <span class='zh'>只要</span>)."],["她为人的正直、诚恳，做事的严谨、认真，在我心里给我留下了深刻的印象。","在我心里给我","……，在我心里留下了深刻的印象。 / ……，给我留下了深刻的印象。","Trộn <span class='zh'>在我心里留下</span> và <span class='zh'>给我留下</span>."],["钱虽然不多，却是我用汗水换来的，拿在手里似乎比从父母那里得到的重得多了。","多了","……比从父母那里得到的重得多。","Câu so sánh <span class='zh'>比……Adj得多</span> không thêm <span class='zh'>了</span> (trộn với <span class='zh'>Adj多了</span>)."]]},DP:{title:"词汇：熟悉下列词语的语素义",vn:"Hiểu nghĩa từng chữ để đoán nghĩa từ.",items:[["导向","dǎoxiàng","định hướng","导：带领 · 向：方向","正确的舆论导向很重要。"],["搏斗","bódòu","vật lộn, chiến đấu","搏：对打 · 斗：对打","他和歹徒进行了搏斗。"],["苍白","cāngbái","nhợt nhạt","苍：灰白色 · 白：白色","她病了，脸色苍白。"],["陈列","chénliè","trưng bày","陈：安放 · 列：排列","博物馆里陈列着很多文物。"],["腐蚀","fǔshí","ăn mòn","腐：变坏 · 蚀：损坏","酸雨会腐蚀建筑物。"],["精华","jīnghuá","tinh hoa","精：完美 · 华：最好的","这本书是作者思想的精华。"],["和解","héjiě","hòa giải","和：放弃矛盾 · 解：消除","两家公司最终和解了。"],["保养","bǎoyǎng","bảo dưỡng","保：保护 · 养：休息，调理","汽车要定期保养。"],["腐烂","fǔlàn","thối rữa","腐：变坏 · 烂：因微生物滋生，破坏了机体","水果放久了会腐烂。"],["表决","biǎojué","biểu quyết","表：表示 · 决：决定","大会对这项提案进行了表决。"],["反思","fǎnsī","tự suy ngẫm","反：回 · 思：思考","失败以后要好好反思。"],["罢工","bà gōng","đình công","罢：停止 · 工：工作","工人们罢工要求提高工资。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"教师上课精神焕发、情绪饱满，学生也会注意力集中。在这种状态下进行体育教学，学生就会思想敏捷、动作反应快；反之，则动作迟缓、接受能力差。",o:["身体不好就不适合教书","老师的情绪会影响学生","好老师未必能教出好学生","老师上课都会集中注意力"],a:1,why:"Giáo viên phấn chấn → học sinh tập trung; ngược lại → chậm chạp."},{n:2,say:"书有精装，有平装。我喜欢平装的那种，一是经济实惠，二是便于阅读。硬皮的精装版不适于携带，阅读时需要正襟危坐，本来看书是一种赏心悦目的享受，这样严阵以待弄得就有些累了。",o:["精装书便于阅读","平装书价格便宜","收藏精装书是享受","说话人喜欢欣赏书"],a:1,why:"“一是经济实惠” = rẻ. A ngược: bìa mềm mới dễ đọc."},{n:3,say:"仿生学是生物学的一个分支，研究生物体系统的结构、功能等，用来改进工程技术系统。如模拟人脑的结构和功能原理，改善计算机的性能。",o:["仿生学等同于生物学","仿生学可仿制人脑的结构","计算机中就有仿生学的研究成果","生物体系统的结构、功能有待改进"],a:2,why:"“模拟人脑……改善计算机的性能”. B: <b>mô phỏng</b> nguyên lý, không “chế tạo” bộ não."},{n:4,say:"别看小青长得不起眼，她的工作可是一级棒。想当初她应聘，没有一个部门要她。看她笔试成绩第一，我决定姑且一试。结果不到一星期，她就把部门所有的烂账搞得一清二楚，现在大家都想来抢她。嘿嘿，这可是门儿都没有的事。",o:["小青样子很漂亮","小青面试不合格","小青数学成绩好","谁都要不走小青"],a:3,why:"“门儿都没有” = không đời nào (không ai giành được Tiểu Thanh). Chú ý <span class='zh'>姑且一试</span> — từ của bài!"},{n:5,say:"对于我这个小球迷，姥姥可是操心不少，她总是担心我看足球比赛影响学习。我向她保证，只会学习球员勇争第一的精神，一定不会影响学习。可是，独自看球多没劲呀，一个人喝彩、一个人焦急！我真想看球的时候有个伴儿。",o:["姥姥不爱看足球比赛","姥姥喜欢球员的勇敢","一个人看球很没意思","“我”有个朋友也爱看球"],a:2,why:"“独自看球多没劲呀”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：您新书上市以后，引起了不少读者的共鸣，您是怎么决定写这本书的？\n男：我爱人给我讲了一个真实的故事。一个弱女子为了爱远嫁他乡，但换来的既有短暂的幸福又有暴力相加的婚姻生活。她想过逃，可一想到还有甜蜜的爱，又不想逃了，就这样，她已年近40。我想知道现在人的爱情观，他们的爱与被爱，他们的幸福与不幸福。我开始有了写书的念头，我希望写一本书，能给爱或即将爱的人一些思考抑或参考。\n女：素材来自哪里呢？\n男：既然要真实，那就采访吧。我采访了各行各业的数十个男男女女，听他们讲述各自的情感故事。\n女：难怪这本书是由一系列并无关联的小故事构成的。\n男：是。我打心眼里相信，有的人的人生是故事，也有可能是事故，而在人生的爱情部分，有太多的存在方式。比如自爱、他爱、离爱、被爱、弃爱。我的愿望是写出真实、可感、可悟的作品，客观地呈现当代人的情感状态。\n女：为了搜集这些情感故事，您一定付出了很多。\n男：是啊，一边采访一边写。我每天观察身边的人，不想漏掉任何一个好故事，再筛选其中最有价值的。我每天带着纸和笔，我拒绝用录音、录像那些高科技手段做记录，因为原始的方法给我一种“融入”或“参与”其中的感觉，我怕其中掺杂了太多想象的成分。\n女：能给我们讲一个您印象最深的故事吗？\n男：书里面有一个电脑先生的故事。电脑先生一直单身。一次他去一个客户家维修电脑，他娴熟的技术和温文尔雅的态度给客户小姐留下了深刻的印象。从此，客户小姐电脑一出问题立刻就找他，再后来，家里所有的东西出了问题都会请他来。结局你当然猜得到，文雅、漂亮、收入好的客户小姐相中了电脑先生。这个故事呈现出爱情的千万种可能，所以我把它写进了书里。",qs:[{n:6,q:"关于男的的爱人讲的故事，下列哪项正确？",o:["女的身体一直不好","女的婚后有时挨打","女的婚后非常幸福","女的四十岁去世了"],a:1,why:"“暴力相加的婚姻生活” = bị bạo hành."},{n:7,q:"男的写这本书的目的是什么？",o:["给人们提供一些思考","避免人生事故的出现","告诉人们要相信爱情","写出一本最畅销的书"],a:0,why:"“能给爱或即将爱的人一些思考抑或参考”."},{n:8,q:"关于素材，下列哪项正确？",o:["故事必须是自己的","当事人要写下故事","故事必须有录音录像","作者追求融入的感觉"],a:3,why:"“原始的方法给我一种‘融入’……的感觉”. C ngược: anh <b>từ chối</b> ghi âm."},{n:9,q:"关于电脑先生的故事，下列哪项正确？",o:["电脑先生非常会讨好女士","电脑先生修电脑的技术差","客户小姐看上了电脑先生","客户小姐独立生活能力差"],a:2,why:"“客户小姐相中了电脑先生” — <span class='zh'>相中</span> (中 zhòng)!"},{n:10,q:"关于小说创作，男的看重什么？",o:["书的真实性","书的发行量","书的影响力","书的知名度"],a:0,why:"“既然要真实……”, “写出真实、可感、可悟的作品”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"到了美国的一个港口，我们准备下船透透风，突然大厨发现码头一根横梁上有几只鸽子蛋，说：“这蛋的母亲也太不负责任了，一阵风不就刮到海里去了？”说着，他小心地把蛋捧在手里，船也不下了，找了些棉花包起来，放在房间里孵着，一天不知要看多少次。终于有一天小鸽子破壳出世了，他高兴得喜形于色，手舞足蹈，见人就拖着去看，为此还特地请了几个人一块儿喝了几杯。\n这几个肉乎乎、娇滴滴的小东西也真难为他了。它们不能进食，大厨就用笨拙的大手扒着嫩嫩的小嘴喂奶粉，那场面真是动人。有时喂不进去，大厨也火，可火过之后还是喂。他常自嘲地说，自己的儿子出世那会儿也没这么伺候过。",qs:[{n:11,q:"关于鸽子可以知道什么？",o:["小鸽子被妈妈扔掉了","大风把鸽子蛋刮跑了","小鸽子个个都很调皮","小鸽子是大厨喂大的"],a:3,why:"Đầu bếp ấp trứng, cho chim non bú sữa bột."},{n:12,q:"大厨为什么和别人喝酒？",o:["他捡到几只鸽子","他朋友特别高兴","他的鸽子出世了","那天有舞蹈表演"],a:2,why:"“小鸽子破壳出世了……为此还特地请了几个人一块儿喝了几杯”."},{n:13,q:"大厨为什么自嘲？",o:["他对鸽子太好了","鸽子不听他的话","他有些无能为力","鸽子给他出难题"],a:0,why:"“自己的儿子出世那会儿也没这么伺候过”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"在日常生活中，存在着大量从自然界得到启发的发明，但大多数人对此却知之甚少。比方说，我们对铁丝网再熟悉不过了，但是你知道它是怎么来的吗？早在1868年，迈克尔·凯利发现人们放牧的时候，通常使用一种叫作荆棘的扎手的灌木做围栏圈养动物，于是仿照荆棘制造的铁丝网就问世了。\n你知道水母吧？早在5亿多年前它就已经在海里生活了。人们发现当水母成群结队地游向大海，风暴就要来了。原来，海上风暴来临之前，海浪与空气摩擦会产生8～13HZ的次声波，人耳无法听到这种次声波，而水母特殊的听觉系统却可以听到。科学家通过研究，仿照水母的听觉系统，发明了水母耳风暴预测仪。把这种仪器安装在舰船的前甲板上，当接受到风暴的次声波时，可令旋转360°的喇叭自行停止旋转，它所指的方向，就是风暴前进的方向，指示器上的读数即可告知风暴的强度。这种预测仪能提前15小时对风暴做出预报，对航海和渔业的安全具有重要意义。",qs:[{n:14,q:"关于日常生活中存在的发明，可以知道什么？",o:["思路来自自然界","大多数人不清楚","我们都非常熟悉","出自人类的智慧"],a:0,why:"Theo đáp án sách: “从自然界得到启发的发明”. B cũng được nhắc nhưng chủ đề là nguồn cảm hứng."},{n:15,q:"谁发明了铁丝网？",o:["工人","科学家","放牧人","迈克尔·凯利"],a:3,why:"“迈克尔·凯利发现……于是仿照荆棘制造的铁丝网就问世了”."},{n:16,q:"水母为什么能够预测风暴？",o:["它生活在海里","它进化5亿年了","它能发出次声波","它有特殊的听觉系统"],a:3,why:"“水母特殊的听觉系统却可以听到”. C: sóng hạ âm do <b>sóng biển</b> tạo ra."},{n:17,q:"水母耳风暴预测仪的用途是什么？",o:["方便人类随时跟踪水母","可以有效防止风暴发生","有利于航海和渔业的安全","为科学家的研究提供根据"],a:2,why:"“对航海和渔业的安全具有重要意义”. B: chỉ <b>dự báo</b>, không ngăn được."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["任何一个团队的力量都大于任何一个强大的个体。","我一生中最想做的第一件事是小说家，第二件事是画家。","神舟九号发射几秒钟以后就在我们的视线中消失得无影无踪了。","为了生存，狼会主动攻击比自己强大数倍的敌人，为同类创造生机。"],a:1,why:"<b>Chủ – tân không hợp</b>: “việc muốn làm” ≠ “nhà văn” → <span class='zh'>……是当小说家，第二件事是当画家</span>."},{n:19,o:["我喜欢所有的动物，从爬行的蚂蚁到跳跃的羚羊。","他今天居然动手干家务活了，真是太阳从西边出来啦！","全场观众站了起来，用最激烈的掌声感谢演员们的精彩演出。","我虽然住的地方比较偏僻，但周边餐馆、公园、购物场所一应俱全。"],a:2,why:"<b>Kết hợp sai</b>: tràng vỗ tay dùng <span class='zh'>热烈</span>, không dùng <span class='zh'>激烈</span>."},{n:20,o:["这个大玩具有3800多个零件，耗时3个月，售价1.75万。","我们的目标是第三名，要是能获得更好的名次，就是意外的惊喜了。","在电脑前工作一个小时，要休息10分钟，这样可以有效地保护视力。","冷空气袭来，山冷得在颤抖，江河也僵硬了，空气也似乎要凝固起来。"],a:0,why:"<b>Thiếu chủ ngữ / logic</b>: “耗时3个月” không rõ chủ thể (làm ra nó?) → <span class='zh'>制作耗时3个月</span>; <span class='zh'>1.75万</span> thiếu đơn vị."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"运动时___机体的新陈代谢较快，___流汗过多，汗液中的酸性物质会伤害表层皮肤，使皮肤___老化，所以运动过后更应呵护肌肤。",o:["尽管　以致　过于","由于　导致　过早","经常　势必　过度","既然　必然　本身"],a:1,why:"<span class='zh'>由于……，导致……</span> (nhân – quả); <span class='zh'>过早老化</span>."},{n:22,text:"每到群星灿烂之时，小院的主人或独自___星空，或在院中散步，或___地望着院中的两棵百年老树，___在思忖些什么，或许他在回忆过去，或许他在感悟一种博大精深的人生___吧。",o:["关注　小心　似乎　追求","注视　专一　类似　理想","瞻仰　深奥　好像　感慨","仰望　呆呆　仿佛　意义"],a:3,why:"<span class='zh'>仰望星空</span>; <span class='zh'>呆呆地望着</span>; <span class='zh'>仿佛</span>; <span class='zh'>人生意义</span>."},{n:23,text:"猎豹___早睡早起，一般清晨5点半左右起来，然后外出寻食。行走时___性很高，常常停下来东张西望。即使午睡时，也___约6分钟就坐起来，察看四周的___。",o:["通通　规律　每停　信息","惯于　自觉　每次　消息","通常　警惕　每隔　动静","大凡　积极　每睡　风声"],a:2,why:"<span class='zh'>通常</span>; <span class='zh'>警惕性</span>; <span class='zh'>每隔……</span>; <span class='zh'>察看动静</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"章鱼又称八爪鱼，虽然叫鱼，它却不属于鱼类，(24)。\n章鱼种类繁多，身体的大小差别极大，(25)，有8条爪。章鱼的爪很有用，可以爬行，可以游泳，可以握持东西。\n章鱼约有3500组世上独一无二的基因，其中很多组基因都是负责大脑、爪及隐身能力的。章鱼不仅聪明无比，分散的大脑亦使它们的8条手爪能独立移动。情急时，章鱼可连续六次喷射黑色液体，(26)。它有时会变得像一块覆盖着藻类的石头，在猎物完全没有察觉之时突然扑过去，结果自然是大获全胜。除了伪装术以外，章鱼还会用两足“走路”逃生。\n海洋学家还曾观察到章鱼一种不同寻常的捕食方式：太平洋条纹大章鱼在捕食时，(27)，伸出一只爪，轻轻地拍了下虾较远一边的肩部，被惊吓到的虾想快速跑到安全地带，没想到正好跑进了章鱼的怀中。(28)！",opts:["它的头与躯体分界不明显","偷偷地跟踪在一只虾的身后","还能够像变色龙一样改变自身的颜色和构造","这是怎样充满智慧的诱捕啊","而是海洋软体动物"],ans:{24:4,25:0,26:2,27:1,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"达·芬奇在鸟类飞行的启发下造出第一个飞行器400年之后，人们经过长期反复的实践，终于在1903年发明了飞机，圆了人类飞上天空的梦。之后又经过30年的不断努力，飞机在速度、高度和飞行距离上都超过了鸟类，但是在继续研制飞行更快更高的飞机时，设计师碰到了一个更大的难题，就是颤振现象。\n当飞机飞行时，飞机的翅膀会发生有害振动，飞行越快，颤振越强烈，甚至会折断翅膀，不少试飞的飞行员因此而丧生。飞机设计师们为此绞尽脑汁，费尽周折，最后终于找到解决这一难题的方法，就是在飞机翅膀前缘的远端上安放一个加重装置，这样就消除了有害振动。\n此后人们发现，昆虫早在三亿年以前就飞翔在空中了，它们也同样躲避不掉颤振的危害，只是经过长期的进化，早已成功地获得了防止颤振的方法。生物学家发现蜻蜓每个翅膀前缘的上方都有一块深色的角质加厚区，人们将它称为翅痣或翼眼。如果把翅痣去掉，蜻蜓就会在空中荡来荡去。实验证明正是翅痣的角质组织消除了蜻蜓飞行时翅膀的颤振危害，这与人类的发明简直有异曲同工之妙。\n假如设计师们能够早些发现昆虫翅痣的功用，受益于颤振的解决思路，就可以避免长期的探索和人员的牺牲了。面对蜻蜓翅膀的翅痣，飞机设计师们抱憾良久。",qs:[{n:29,q:"1903年发生了什么事情？",o:["鸟给了达·芬奇很大启发","人类造出了第一个飞行器","人类实现了飞上天空的梦想","人类瞄准飞机市场做出努力"],a:2,why:"“1903年发明了飞机，圆了人类飞上天空的梦”."},{n:30,q:"人类在研制飞行更快更高的飞机时，碰到的难题是：",o:["机翼的有害振动","飞行速度上不去","飞行员安全问题","做不出加重装置"],a:0,why:"“颤振现象……翅膀会发生有害振动”."},{n:31,q:"和第3段画线词语“异曲同工”意思最相近的是：",o:["异途同归","异口同声","不约而同","不谋而合"],a:0,why:"<span class='zh'>异曲同工 ≈ 异途同归</span> = cách khác nhau nhưng kết quả như nhau."},{n:32,q:"通过上文，我们知道什么？",o:["鸟类和昆虫比人类更有智慧","人类在大自然面前非常渺小","鸟帮助人类克服了有害振动","鸟的飞行给人类提供了启示"],a:3,why:"Theo đáp án sách: D — “达·芬奇在鸟类飞行的启发下造出第一个飞行器”. C sai: là <b>chuồn chuồn</b> (côn trùng)."}]},{ins:"第33–36题：请选出正确答案。",text:"进入6月，又到了登革热高发期。全球每年约有50万人因患重症登革热住院，约2.5%的感染者死亡。没有针对性药物，没有疫苗。伊蚊是登革热的主要传播媒介，包括埃及伊蚊和白纹伊蚊。科研人员正在“创造”一种特种部队，以蚊治蚊。\n随着纱布被移开，数百只雄性白纹伊蚊飞出笼子，四散开去。如果顺利的话，它们将在接下来一周里，找到一只只野生雌蚊，在飞舞中、在叶片上，一次次地交配。不过，那些野生雌蚊诞下的虫卵，将等不到发育成蚊的那一刻。原来，这群雄性白纹伊蚊身上带着科研人员专门挑选出的沃尔巴克氏体，与它们交配后，野生雌蚊的卵在胚胎发育早期便直接发生卵死亡。以蚊治蚊，科研人员计划用这种方式，使白纹伊蚊数量锐减。\n所谓沃尔巴克氏体，早在1924年便被发现，是一类广泛存在于节肢动物体内、可以经卵垂直传播的胞内共生菌，但将它变成子弹装入枪支，人类却经过了约80年的努力。\n除了发现和提取合适的沃尔巴克氏体菌种，掌握显微胚胎注射技术也是这项实验成功的关键。科研人员用小毛笔挑起一颗刚产下不久的白纹伊蚊虫卵，放在载玻片上，置于显微镜下，视觉上将虫卵放大到鸡蛋大小，再用毛细吸管将沃尔巴克氏体注射到卵细胞的包浆中。至此还不能算大功告成，因为胚胎的成活率很低，稍微控制不好，绝大多数卵就会死亡。\n确切地讲，人类煞费苦心策划了这场战争，期待自己是真正的赢家——抵抗登革热。",qs:[{n:33,q:"面对登革热，人类正在做什么？",o:["减少感染者死亡","用蚊子消灭蚊子","千方百计发明药物","想方设法制作疫苗"],a:1,why:"“以蚊治蚊”."},{n:34,q:"第2段画线词语“锐减”的意思是：",o:["急剧减少","少量减少","逐渐减少","稍微减少"],a:0,why:"<span class='zh'>锐</span> = mạnh, gắt → giảm mạnh."},{n:35,q:"科研人员放出的蚊子是：",o:["普通白纹伊蚊","野生雌性蚊子","发育成熟的蚊子","特殊的雄性蚊子"],a:3,why:"Muỗi đực mang vi khuẩn Wolbachia được chọn lọc."},{n:36,q:"“以蚊治蚊”的战争中，技术关键包括：",o:["发明显微胚胎提取技术","研制出专用的毛笔和鸡蛋","制作出沃尔巴克氏体菌种","保证注射过菌种胚胎的成活率"],a:3,why:"“胚胎的成活率很低……绝大多数卵就会死亡” → phải bảo đảm tỉ lệ sống. A: là kỹ thuật <b>tiêm</b>, không phải chiết xuất."}]}]},W:{task:"这篇课文讲了一个很有趣的自然现象，为什么人类打苍蝇很难，小猫却很容易就能抓到苍蝇？这主要是由于一个CFF值在起作用。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Hiện tượng","Người đập ruồi không trúng / mèo vồ trúng → “慢动作”."],["Lượng thông tin","Động vật nhỏ tiếp nhận nhiều hơn; ví dụ bồ câu; <span class='zh'>迟钝 · 迟缓 · 庞大 · 笨拙</span>."],["CFF là gì","Định nghĩa ngắn gọn + số liệu người 60 / chó 80 / ruồi 250."],["Vì sao khác nhau","<span class='zh'>与……有关；越……越……</span>; con sóc đứng đầu."],["Ý nghĩa","<span class='zh'>势必有其过人之处 · 迅速判断 · 生存机会</span>; trẻ nhỏ hiếu động."]],outline:[["一 · 现象","打不中苍蝇"],["二 · 小动物接收信息快","鸽子；看人类像看大象"],["三 · CFF","定义；人、犬、苍蝇"],["四 · 原因","体重、新陈代谢"],["五 · 意义","生存优势；小动物更敏捷"]],model:"小动物眼中的慢世界\n生活中，人们打苍蝇总是打不中，猫却瞄准都不用，一下子就能拍到苍蝇。科学家解释说，在苍蝇眼里，人类闪电般的一拍只是个慢动作。\n研究表明，昆虫等小动物一秒钟内接收的信息量比人类多得多。比如鸽子看周边时会微微颤抖，好像体内有一个走得更快的钟表。在小动物看来，人类反应迟钝、动作迟缓，就像人类眼中庞大、笨拙的大象。\n为了量化这种视觉感知，科研人员采用了“临界闪光频率”，简称CFF。光刺激间隔较长时，我们看到的是一明一暗的闪烁；间隔缩短以后，我们就会感到连续的光。CFF反映的就是眼睛处理光线的速度，速度越快，CFF值就越高。人眼的CFF约为60HZ，犬为80HZ，在犬的眼里，电视画面是一系列静止的图像；苍蝇的CFF高达250HZ，反应速度是人眼的4倍。\n科学家推论，CFF与动物本身的体重和新陈代谢速率有关：体型越小，信号传到大脑的时间越短；代谢越快，能量越充足。他们研究了34种动物，结果证明了这一推论，CFF值最高的是松鼠。\n看似渺小的苍蝇虽然不能进行深奥的思考，对强大的对手也无能为力，但它能对外部环境迅速做出判断，因此有了更多的生存机会。这也是小猫小狗甚至小孩儿看上去更敏捷、更好动的原因，其实对他们来说，这只是一个悠闲的速度。",check:["Có tiêu đề","Có hiện tượng mở đầu","Giải thích lượng thông tin","Có định nghĩa CFF + số liệu","Có nguyên nhân (cân nặng, trao đổi chất)","Có ý nghĩa sinh tồn","Dùng ít nhất 4: 东张西望 · 打不中 · 姑且 · 势必 · 比方说 · 确切地说","Khoảng 400 chữ (±40)"]},SUM:{words:["场面","端","盛","东张西望","企图","动手","纳闷儿","跳跃","瞄准","视线","周边","颤抖","确切","迟钝","迟缓","庞大","笨拙","比方","间隔","闪烁","视力","姑且","文雅","系列","推论","本身","新陈代谢","能量","论证","筛选","标记","名次","感慨","渺小","攻击","势必","博大精深","深奥","无能为力","实惠","个体","焦急"],patterns:[["东A西B","立刻飞来一只东张西望的苍蝇。"],["V + 中 (zhòng)","人动手去打，却总是打不中。"],["姑且 + V","我们姑且换一个文雅的称呼吧。"],["既然……，势必……","看似渺小的苍蝇既然能躲过人类的攻击，势必有其过人之处。"],["……与……有关；……越……，……越……","物种的CFF与其本身的体重和新陈代谢速率有关。"]],diff:["势必：suy đoán theo xu thế, kết quả thường xấu (văn viết) — 一定：suy đoán (tốt/xấu), thái độ kiên quyết (一定要), tính từ (一定的时间)","迟钝 (phản ứng chậm) ≠ 迟缓 (động tác chậm) · 盛 chéng (đựng) / shèng (thịnh) · 中 zhòng (打中 · 中暑) · 间隔 jiàn · 颤抖 chàn"],sentences:["在苍蝇眼里，人类自认为闪电般快速的一拍，只是个慢动作而已。","在小动物看来，人类反应迟钝、动作迟缓，它们看人类，就像人类看庞大、笨拙的大象。","信息处理速度上的差别，也是小动物看上去更敏捷的原因。"],hw:["Học thuộc 44 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 400 chữ (mục 7).","Làm Sách bài tập bài 17.","Đọc trước bài 18."]}});
