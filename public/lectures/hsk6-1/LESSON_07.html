<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 7 · 我的人生我做主。 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-07",num:7,book:"HSK 标准教程 6（上）",unit:{n:2,zh:"不甘平庸",vn:"Không cam chịu tầm thường"},title:"我的人生我做主。",vn:"Đời tôi, tôi làm chủ",chars:739,source:"改编自《北京青年报》文章《如何远离职场选择焦虑症》，作者：新精英生涯规划师",goals:["Đọc hiểu bài nghị luận 739 chữ về <b>nỗi sợ chọn sai nghề</b> và năng lực ra quyết định.","Dùng được 45 từ mới, đặc biệt nhóm từ <b>kinh tế – việc làm</b>: <span class='zh'>成本 · 亏损 · 倒闭 · 金融危机 · 盈利 · 裁员 · 热门 · 饱和 · 就业 · 机遇</span>.","Nắm <span class='zh'>于 · 致使 · 并非</span> và các mẫu <span class='zh'>意味着 · 伴随着 · 由于……以致…… · 谁……谁……</span>","Phân biệt <span class='zh'>日益 — 越来越</span>; nhận diện câu sai loại <b>trật tự từ</b> (语序不当); luyện câu so sánh – ẩn dụ (比喻).","Viết bài nghị luận – kể chuyện “判断力来自哪里” ≥300 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (于 · 致使 · 并非 · 日益—越来越 · 意味着) · Bài khóa đoạn 1–5"],["Buổi 2","Từ vựng nhóm 3 (由于……以致…… · 谁……谁……) · Đoạn 6–7 · Bài tập · 语序不当 · Luyện đề · Viết văn"]],outline:[{tag:"提",name:"Nêu vấn đề",paras:"Đoạn 1–2",zh:"小王想换工作，怕选错，顾虑重重",vn:"Tiểu Vương muốn đổi việc nhưng sợ chọn sai, lo âu nặng nề — chuyên gia: do thiếu tự tin, quá bi quan."},{tag:"析",name:"Phân tích",paras:"Đoạn 3–5",zh:"判断力来自错误；做决定的能力在实践和挫折中得来；世界充满不确定",vn:"Lời Steve Jobs: phán đoán đến từ sai lầm. Năng lực quyết định không bẩm sinh. Thế giới ngày càng bất định."},{tag:"论",name:"Lập luận",paras:"Đoạn 6",zh:"不可能一份工作干一辈子；谁及早抓住机会谁就赢",vn:"Không ai làm một việc cả đời; ai nắm bắt cơ hội sớm sẽ thắng."},{tag:"结",name:"Kết luận",paras:"Đoạn 7",zh:"不怕犯错，提升决策能力，为人生做主",vn:"Đừng sợ sai — sai lầm tăng “miễn dịch tâm hồn”; nâng năng lực quyết định để làm chủ đời mình."}],warm1:{q:"当你在为一件事情犹豫不决时，有的人却能很快就做出正确的决定。这种做决定的能力是怎么得来的呢？请在下列选项中选出你认为正确的答案，或者在横线上做出补充。",vn:"Khi bạn còn do dự, có người lại nhanh chóng ra quyết định đúng. Năng lực ấy từ đâu mà có? Chọn đáp án bạn cho là đúng hoặc bổ sung.",items:[["👶","生下来就有的　·　通过不断实践得到的","Bẩm sinh · Qua thực tiễn không ngừng"],["🏫","在学校里学习的　·　在不断失败中学习到的","Học ở trường · Học từ thất bại liên tiếp"],["🔀","在不确定中提升了决策能力　·　性格不同造成的","Nâng cao năng lực quyết định trong bất định · Do tính cách khác nhau"]],talk:["补充：______","你最近一次很难做的决定是什么？"],link:"Bài khóa trả lời: năng lực quyết định <b>không phải bẩm sinh</b>, mà <span class='zh'>是通过实践和挫折得来的</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"做",rule:"做 + N → <b>đóng vai, làm (ai)</b>.",w:[["做主","zuò zhǔ","làm chủ (từ mới)"],["做伴","zuò bàn","làm bạn"],["做客","zuò kè","làm khách"],["做官","zuò guān","làm quan"],["做人","zuò rén","làm người"],["做东","zuò dōng","làm chủ, mời khách"],["做演员","zuò yǎnyuán","làm diễn viên"]]},{k:"观",rule:"观 = <b>cách nhìn, quan điểm</b>.",w:[["悲观","bēiguān","bi quan (có trong bài)"],["乐观","lèguān","lạc quan"],["主观","zhǔguān","chủ quan"],["客观","kèguān","khách quan"],["人生观","rénshēngguān","nhân sinh quan"],["世界观","shìjièguān","thế giới quan"],["历史观","lìshǐguān","sử quan"],["观点","guāndiǎn","quan điểm"],["观念","guānniàn","quan niệm"]]},{k:"悔",rule:"悔 = <b>hối, ân hận</b>.",w:[["悔恨","huǐhèn","hối hận (từ mới)"],["悔改","huǐgǎi","hối cải"],["悔过","huǐguò","hối lỗi"],["悔婚","huǐ hūn","hủy hôn"],["悔不当初","huǐ bù dāngchū","hối không kịp"],["悔过自新","huǐguò zìxīn","hối cải làm người mới"],["反悔","fǎnhuǐ","nuốt lời"],["后悔","hòuhuǐ","hối hận"],["追悔","zhuīhuǐ","ân hận muộn màng"]]},{k:"于",rule:"Động / tính từ + 于 → <b>động từ hai âm tiết</b> (văn viết).",w:[["勇于","yǒngyú","dám, mạnh dạn (từ mới)"],["急于","jíyú","vội, nóng lòng"],["长于","chángyú","giỏi về"],["乐于","lèyú","vui lòng"],["苦于","kǔyú","khổ vì"],["难于","nányú","khó mà"],["善于","shànyú","giỏi"],["安于","ānyú","an phận với"],["敢于","gǎnyú","dám"],["属于","shǔyú","thuộc về"],["在于","zàiyú","nằm ở"]],trap:"Xem <b>Ngữ pháp 于</b>: <span class='zh'>勇于承担 · 苦于没有时间</span>."}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Nỗi lo của Tiểu Vương",from:1,to:13},{name:"Nhóm 2 · Đoạn 3–5",sub:"Năng lực quyết định & thế giới bất định",from:14,to:33},{name:"Nhóm 3 · Đoạn 6–7",sub:"Nắm bắt cơ hội, làm chủ đời mình",from:34,to:45}],V:[[1,"做主","zuò zhǔ","đgt.","tố chủ","làm chủ, tự quyết",1,"","对某项事情负完全责任而做出决定。","我的人生我做主","这件事我做不了主，得问问我爸。","Việc này tôi không quyết được, phải hỏi bố tôi.",["自己做主","为……做主","做不了主"],"Từ ly hợp: <span class='zh'>做不了主</span>. Bài 2 SBT: <span class='zh'>自己做主的能力</span>."],[2,"伤脑筋","shāng nǎojīn","cụm","thương não cân","đau đầu, nhức óc",1,"口","形容事情难办，费心思。","小王正为工作的事伤脑筋","孩子不爱学习，真让父母伤脑筋。","Con không thích học, thật khiến bố mẹ đau đầu.",["为……伤脑筋","让人伤脑筋","伤透了脑筋"],"Mẫu <span class='zh'>为……伤脑筋</span>. Bài tập 3①."],[3,"枯燥","kūzào","tt.","khô táo","khô khan, nhàm chán",1,"","单调，没有趣味。","枯燥而且压力大","这本书内容太枯燥了。","Nội dung cuốn sách này khô khan quá.",["枯燥无味","枯燥乏味"],"Trái nghĩa: <span class='zh'>有趣 · 生动</span>."],[4,"擅长","shàncháng","đgt.","thiện trường","giỏi về, sở trường",1,"","在某方面有特长。","不确定自己真正擅长什么","她擅长画画儿。","Cô ấy giỏi vẽ.",["擅长……","不擅长"],"Gần nghĩa <span class='zh'>善于 · 长于</span>. SBT câu 7: <span class='zh'>擅长写小说</span>."],[5,"成本","chéngběn","dt.","thành bản","giá thành, chi phí",1,"","生产一种产品所需的全部费用；泛指付出的代价。","时间成本和经济成本","降低生产成本是企业的重要任务。","Hạ giá thành sản xuất là nhiệm vụ quan trọng của doanh nghiệp.",["时间成本","降低成本","成本高"],"Bài tập 3①: <span class='zh'>时间成本太高了</span>."],[6,"急躁","jízào","tt.","cấp táo","nóng nảy, nôn nóng",1,"","碰到不称心的事情马上激动不安；想马上达到目的，不做好准备就行动。","他变得急躁、紧张","遇事不要急躁，要冷静。","Gặp chuyện đừng nóng vội, phải bình tĩnh.",["脾气急躁","急躁情绪"],""],[7,"顾虑","gùlǜ","dt.","cố lự","nỗi lo, băn khoăn",1,"","担心对自己、对人或对事情不利而不敢照自己本意说话或行动；也作动词。","顾虑重重","你有什么顾虑，就说出来吧。","Có băn khoăn gì thì cứ nói ra.",["顾虑重重","打消顾虑","没有顾虑"],"<span class='zh'>顾虑重重</span> = lo trước lo sau. Bài tập 3①."],[8,"过度","guòdù","tt.","quá độ","quá mức",1,"","超过适当的限度。","对未来过度悲观","过度劳累对身体不好。","Làm việc quá sức không tốt cho sức khỏe.",["过度紧张","过度疲劳","饮酒过度"],"So sánh <span class='zh'>过于</span> (bài 3): <span class='zh'>过度</span> còn làm bổ ngữ / vị ngữ: <span class='zh'>饮酒过度</span>."],[9,"致使","zhìshǐ","đgt./liên.","trí sử","khiến cho; đến nỗi",1,"书","由于某种原因而使得。","致使小王出现以上现象","大雾致使航班延误。","Sương mù dày khiến chuyến bay bị trễ.",["致使……","由于……，致使……"],"Xem <b>Ngữ pháp 2</b>."],[10,"终身","zhōngshēn","dt.","chung thân","suốt đời",1,"","一生；一辈子（多就切身的事说）。","一旦选错，终身悔恨","这件事让他终身难忘。","Việc này khiến anh ấy nhớ suốt đời.",["终身大事","终身学习","终身难忘"],"<span class='zh'>终身大事</span> = chuyện hôn nhân."],[11,"悔恨","huǐhèn","đgt.","hối hận","ân hận, hối hận",1,"书","懊悔怨恨。","终身悔恨","他对自己当年的选择悔恨不已。","Anh ấy ân hận khôn nguôi về lựa chọn năm xưa.",["悔恨不已","感到悔恨"],"Mạnh hơn <span class='zh'>后悔</span>."],[12,"类似","lèisì","đgt.","loại tự","tương tự",1,"","大致相像。","类似小王这样的年轻人","我也遇到过类似的问题。","Tôi cũng từng gặp vấn đề tương tự.",["类似的情况","与……类似"],"Hay làm định ngữ: <span class='zh'>类似的问题 / 情况</span>."],[13,"并非","bìngfēi","đgt.","tịnh phi","không phải (là)",1,"书","并不是。","类似小王这样的年轻人并非少数","事情并非你想象的那样简单。","Mọi chuyện không đơn giản như bạn nghĩ.",["并非如此","并非……而是……"],"Xem <b>Ngữ pháp 3</b>."],[14,"精确","jīngquè","tt.","tinh xác","chính xác",1,"","非常准确。","来自精确的判断力","这个仪器能精确地测量温度。","Thiết bị này đo nhiệt độ rất chính xác.",["精确计算","精确的数据"],"<b>精确</b>: chính xác cao (số liệu, đo lường); <b>准确</b>: đúng (nói chung)."],[15,"天生","tiānshēng","tt.","thiên sinh","bẩm sinh, trời sinh",1,"","天然生成的。","能力不是天生的","她天生一副好嗓子。","Cô ấy bẩm sinh có giọng hát hay.",["天生的","天生丽质"],""],[16,"挫折","cuòzhé","đgt.","tỏa chiết","trắc trở, thất bại",1,"","失败；失利。","通过实践和挫折得来的","遇到挫折不要灰心。","Gặp trắc trở đừng nản lòng.",["遭受挫折","经历挫折","挫折感"],"Thường làm danh từ. Bài tập 3②."],[17,"意志","yìzhì","dt.","ý chí","ý chí",1,"","决定达到某种目的而产生的心理状态。","坚定的意志力","他有着坚强的意志。","Anh ấy có ý chí kiên cường.",["意志力","意志坚强","磨炼意志"],"Bài tập 3②: <span class='zh'>增强意志力</span>."],[18,"敏锐","mǐnruì","tt.","mẫn duệ","nhạy bén",1,"","（感觉）灵敏；（眼光）尖锐。","敏锐的判断力","记者对新闻要有敏锐的嗅觉。","Phóng viên phải có khứu giác nhạy bén với tin tức.",["目光敏锐","敏锐地发现"],""],[19,"畏惧","wèijù","đgt.","úy cụ","sợ hãi, e sợ",1,"书","害怕。","不畏惧付出和失败","面对困难，他毫不畏惧。","Đối mặt khó khăn, anh ấy không hề sợ hãi.",["无所畏惧","畏惧困难"],"Bài tập 3②. SBT 14–17: <span class='zh'>无所畏惧</span>."],[20,"勇于","yǒngyú","đgt.","dũng vu","dám, mạnh dạn",1,"书","在困难面前不退缩，有勇气去做。","勇于承担责任","我们应该勇于承认错误。","Chúng ta nên dám nhận lỗi.",["勇于创新","勇于承担","勇于面对"],"Luôn đi với động từ phía sau. Xem Ngữ pháp 于."],[21,"伴随","bànsuí","đgt.","bạn tùy","đi kèm, theo",1,"书","随同，跟。","伴随着经济全球化","伴随着音乐，大家跳起舞来。","Theo tiếng nhạc, mọi người nhảy múa.",["伴随着……","伴随一生"],"Mẫu <span class='zh'>伴随着……，……</span> ≈ <span class='zh'>随着</span>. Bài tập 2⑤."],[22,"日益","rìyì","phó.","nhật ích","ngày càng",1,"书","一天比一天。","不确定因素日益增多","两国关系日益密切。","Quan hệ hai nước ngày càng mật thiết.",["日益增多","日益严重","日益提高"],"Xem <b>辨析 日益—越来越</b>."],[23,"昔日","xīrì","dt.","tích nhật","ngày xưa",1,"书","往日，从前。","昔日风光无限的世界一流企业","这里早已不是昔日的小渔村了。","Nơi này từ lâu không còn là làng chài nhỏ ngày xưa.",["昔日的朋友","昔日风光"],"Văn viết của <span class='zh'>以前 · 过去</span>."],[24,"风光","fēngguāng","tt.","phong quang","vẻ vang, huy hoàng",1,"","体面，光彩；也作名词：风景。","风光无限","他当年可风光了。","Năm xưa ông ấy vẻ vang lắm.",["风光无限","北国风光（名）"],"Danh từ = phong cảnh: <span class='zh'>风光秀丽</span>; tính từ (khẩu ngữ) = nở mày nở mặt."],[25,"亏损","kuīsǔn","đgt.","khuy tổn","thua lỗ",1,"","支出超过收入；亏本。","世界一流企业也会亏损","公司连续两年亏损。","Công ty thua lỗ hai năm liền.",["严重亏损","扭亏为盈"],"Trái nghĩa: <span class='zh'>盈利</span>."],[26,"倒闭","dǎobì","đgt.","đảo bế","phá sản, đóng cửa",1,"","（企业、商店等）因亏本而停业。","也会倒闭","受疫情影响，很多小店倒闭了。","Do dịch bệnh, nhiều cửa hàng nhỏ đóng cửa.",["公司倒闭","面临倒闭"],"Trái nghĩa: <span class='zh'>开业 · 开张</span>."],[27,"金融","jīnróng","dt.","kim dung","tài chính",1,"","指货币的发行、流通和回笼，贷款的发放和收回，存款的存入和提取等经济活动。","一次金融危机","他在一家金融公司工作。","Anh ấy làm ở một công ty tài chính.",["金融危机","金融中心","金融业"],""],[28,"危机","wēijī","dt.","nguy cơ","khủng hoảng",1,"","严重困难的关头；潜伏的危险。","金融危机","公司正面临一场危机。","Công ty đang đối mặt một cuộc khủng hoảng.",["经济危机","信任危机","化解危机"],"⚠️ Khác “nguy cơ” tiếng Việt (= nguy hiểm tiềm ẩn ≈ <span class='zh'>风险</span>): <span class='zh'>危机</span> chủ yếu = <b>khủng hoảng</b>."],[29,"盈利","yínglì","đgt.","doanh lợi","có lãi",1,"","获得利润；也作名词。","连年盈利","这家公司今年盈利五百万。","Công ty năm nay lãi năm triệu.",["连年 生就业压力越来越大。","Áp lực việc làm của sinh viên ngày càng lớn.",["就业机会","就业率","就业压力"],"Từ ly hợp."],[41,"及早","jízǎo","phó.","cập tảo","sớm, kịp thời",1,"","趁早。","谁能够及早抓住机会","有病要及早治疗。","Có bệnh phải chữa sớm.",["及早发现","及早决定"],"Bài tập 3①."],[42,"机遇","jīyù","dt.","cơ ngộ","cơ hội, thời cơ",1,"书","时机；机会（多指有利的）。","谁就赢得了机遇","机遇总是留给有准备的人。","Cơ hội luôn dành cho người có chuẩn bị.",["抓住机遇","机遇与挑战"],"Bài tập 3②."],[43,"心灵","xīnlíng","dt.","tâm linh","tâm hồn",1,"","内心；精神；思想。","心灵免疫力","音乐能净化人的心灵。","Âm nhạc có thể thanh lọc tâm hồn.",["心灵美","心灵深处"],"⚠️ Khác “tâm linh” tiếng Việt (tín ngưỡng): <span class='zh'>心灵</span> = <b>tâm hồn</b>."],[44,"免疫","miǎnyì","đgt.","miễn dịch","miễn dịch",1,"","由于具有抵抗力而不患某种传染病。","增加我们的心灵免疫力","接种疫苗可以提高免疫力。","Tiêm vắc-xin giúp tăng miễn dịch.",["免疫力","免疫系统"],"Ẩn dụ: <span class='zh'>心灵免疫力</span> = sức đề kháng tinh thần."],[45,"决策","juécè","đgt.","quyết sách","ra quyết định (chiến lược)",1,"书","决定策略或办法；也作名词。","提升自己的决策能力","这是一项重大决策。","Đây là một quyết sách quan trọng.",["决策能力","做出决策"],""]],extra:[["会计","kuàijì","kế toán"],["打交道","dǎ jiāodao","giao tiếp, tiếp xúc"],["心理专家","xīnlǐ zhuānjiā","chuyên gia tâm lý"],["乔布斯","Qiáobùsī","Steve Jobs"],["判断力","pànduànlì","khả năng phán đoán"],["经济全球化","jīngjì quánqiúhuà","toàn cầu hóa kinh tế"],["安安稳稳","ān'ānwěnwěn","yên ổn"],["寿命","shòumìng","tuổi thọ"],["走弯路","zǒu wānlù","đi đường vòng"],["犯错","fàn cuò","phạm lỗi"]],T:[{zh:"最近，小王正为工作的事伤脑筋。毕业于3年前的他，一直做会计，成天和数字打交道，枯燥而且压力大，他做梦都想换一份工作。小王对艺术、心理学都感兴趣，觉得当老师也不错，可他不确定自己真正擅长什么，怕万一选错了，要付出很大的时间成本和经济成本，为此他变得急躁、紧张、顾虑重重。",vn:"Dạo này Tiểu Vương đang đau đầu vì chuyện công việc. Tốt nghiệp từ ba năm trước, anh ấy luôn làm kế toán, suốt ngày làm bạn với những con số, vừa khô khan vừa áp lực, nằm mơ cũng muốn đổi việc. Tiểu Vương thích cả nghệ thuật lẫn tâm lý học, thấy làm giáo viên cũng hay, nhưng anh không chắc mình thật sự giỏi gì, sợ lỡ chọn sai sẽ phải trả giá lớn về thời gian và tiền bạc, vì thế trở nên nóng nảy, căng thẳng, lo trước lo sau.",idea:"Tiểu Vương muốn đổi việc nhưng sợ chọn sai.",q:["小王为什么想换工作？","小王为什么顾虑重重？"],note:[["毕业于3年前的他","<span class='zh'>V + 于 + thời gian</span> làm định ngữ — văn viết. Xem Ngữ pháp 于."],["他做梦都想换一份工作","<span class='zh'>做梦都想……</span> = nằm mơ cũng muốn (cường điệu)."],["急躁、紧张、顾虑重重","Ba từ tâm trạng tăng dần."]]},{zh:"心理专家认为，对自己缺乏信心，对未来过度悲观致使小王出现以上现象。悲观主要包括：我不敢想最坏的结果是什么；我无法承受这个结果；一旦选错，终身悔恨，甚至会觉得人生都没有希望了。其实，类似小王这样的年轻人并非少数，不知道小王们是否读过下面这段对话：",vn:"Chuyên gia tâm lý cho rằng: thiếu tự tin vào bản thân, quá bi quan về tương lai khiến Tiểu Vương có những biểu hiện trên. Sự bi quan chủ yếu gồm: tôi không dám nghĩ kết quả tồi tệ nhất là gì; tôi không chịu nổi kết quả đó; một khi chọn sai sẽ hối hận cả đời, thậm chí thấy đời chẳng còn hy vọng. Thật ra, những người trẻ giống Tiểu Vương không phải là ít — không biết các “Tiểu Vương” đã đọc đoạn đối thoại dưới đây chưa:",idea:"Nguyên nhân: thiếu tự tin, quá bi quan; người như vậy không ít.",q:["心理专家认为小王的问题是什么造成的？","悲观主要包括哪些方面？"],note:[["……致使小王出现以上现象","<span class='zh'>A 致使 B + V</span> = A khiến B… (thường là kết quả xấu). Xem Ngữ pháp 2."],["类似小王这样的年轻人并非少数","<span class='zh'>并非</span> = không phải là — nhấn mạnh phủ định. <span class='zh'>小王们</span>: thêm 们 sau tên riêng = những người như Tiểu Vương."]]},{zh:"年轻人：你的智慧从哪里来？　乔布斯：来自精确的判断力。　年轻人：精确的判断力从哪里来？　乔布斯：来自经验的积累。　年轻人：那你的经验又从哪里来？　乔布斯：来自无数错误的判断。",vn:"Người trẻ: Trí tuệ của ông từ đâu mà có? — Jobs: Từ khả năng phán đoán chính xác. — Người trẻ: Khả năng phán đoán chính xác từ đâu mà có? — Jobs: Từ kinh nghiệm tích lũy. — Người trẻ: Vậy kinh nghiệm của ông từ đâu mà có? — Jobs: Từ vô số lần phán đoán sai.",idea:"Trí tuệ ← phán đoán ← kinh nghiệm ← vô số sai lầm.",q:["乔布斯的智慧从哪里来？"],note:[["来自……","<span class='zh'>来自</span> = đến từ (văn viết). Chuỗi hỏi – đáp lặp lại tạo <b>chuỗi nhân quả ngược</b>."]]},{zh:"做决定是一种能力，而能力不是天生的，是通过实践和挫折得来的，在这个过程中，人同时具有了坚定的意志力和敏锐的判断力，不畏惧付出和失败，勇于承担责任，这就是成长。",vn:"Ra quyết định là một năng lực, mà năng lực không phải bẩm sinh, nó có được qua thực tiễn và vấp ngã. Trong quá trình ấy, con người đồng thời có được ý chí kiên định và khả năng phán đoán nhạy bén, không sợ hãi việc bỏ công sức và thất bại, dám gánh vác trách nhiệm — đó chính là trưởng thành.",idea:"Năng lực quyết định có được qua thực tiễn và vấp ngã.",q:["做决定的能力是怎么得来的？","作者认为什么是“成长”？"],note:[["不是天生的，是通过……得来的","<span class='zh'>不是 A，是 B</span> — phủ định để khẳng định."],["不畏惧……，勇于……","<span class='zh'>不畏惧</span> (văn viết của 不怕) + <span class='zh'>勇于</span> (dám) — cặp từ thường đi cùng nhau."]]},{zh:"事实上，伴随着经济全球化，生活中的不确定因素日益增多。昔日风光无限的世界一流企业也会亏损，也会倒闭；一次金融危机，就会使一些连年盈利、运行很好的企业不得不裁员。这意味着，原本英明的决定今天看来可能并非如此了。",vn:"Thực tế là, cùng với toàn cầu hóa kinh tế, các yếu tố bất định trong cuộc sống ngày càng nhiều. Những doanh nghiệp hàng đầu thế giới từng huy hoàng vô hạn cũng có thể thua lỗ, có thể phá sản; một cuộc khủng hoảng tài chính có thể khiến những doanh nghiệp lãi liên tục nhiều năm, vận hành tốt buộc phải cắt giảm nhân sự. Điều đó có nghĩa là, một quyết định vốn sáng suốt thì hôm nay nhìn lại có thể không còn như vậy nữa.",idea:"Thế giới ngày càng bất định — quyết định đúng hôm qua có thể sai hôm nay.",q:["为什么说生活中的不确定因素日益增多？"],note:[["伴随着经济全球化，……日益增多","<span class='zh'>伴随着</span> ≈ <span class='zh'>随着</span> (văn viết); <span class='zh'>日益 + V/Adj 2 âm tiết</span>."],["这意味着，……","<span class='zh'>这意味着</span> = điều này có nghĩa là — dùng để rút ra kết luận."]]},{zh:"依我看，无论你怎么选择，都不太可能选一份称心如意的工作安安稳稳一辈子，由于经济环境的不确定，企业的寿命越来越短，现在，人们要经历更多次的职业选择。除此以外，由于人们争先恐后报考热门专业，以致人才饱和，就业困难。而一些新职业的出现，需要新型人才的加入，谁能够及早抓住机会，谁就赢得了机遇。",vn:"Theo tôi thấy, dù bạn chọn thế nào cũng khó mà chọn được một công việc vừa ý rồi yên ổn cả đời. Do môi trường kinh tế bất định, tuổi thọ doanh nghiệp ngày càng ngắn, bây giờ con người phải trải qua nhiều lần chọn nghề hơn. Ngoài ra, vì mọi người tranh nhau thi vào các ngành hot, dẫn đến nhân lực bão hòa, khó tìm việc. Còn sự xuất hiện của những nghề mới cần nhân lực kiểu mới tham gia — ai nắm bắt cơ hội sớm, người đó giành được thời cơ.",idea:"Không ai làm một việc cả đời; ai sớm nắm cơ hội sẽ thắng.",q:["为什么说不太可能选一份工作干一辈子？","怎样才能赢得机遇？"],note:[["依我看，……","<span class='zh'>依我看</span> = theo tôi thấy — mở đầu nêu quan điểm."],["由于……，以致……","<span class='zh'>以致</span> dẫn ra <b>kết quả xấu</b>. Xem Ngữ pháp."],["谁能够及早抓住机会，谁就赢得了机遇","<span class='zh'>谁……，谁就……</span> = ai… thì người đó… (đại từ nghi vấn dùng phiếm chỉ)."]]},{zh:"不要怕犯错，不要害怕走弯路，犯些小错并非坏事，它会增加我们的心灵免疫力。不确定中充满成长的机会，只有不断提升自己的决策能力，才能真正为自己的人生做主。",vn:"Đừng sợ phạm lỗi, đừng sợ đi đường vòng — mắc vài lỗi nhỏ không phải chuyện xấu, nó sẽ tăng “sức miễn dịch” cho tâm hồn ta. Trong bất định đầy cơ hội trưởng thành; chỉ có không ngừng nâng cao năng lực ra quyết định thì mới thật sự làm chủ được cuộc đời mình.",idea:"Đừng sợ sai; nâng năng lực quyết định để làm chủ đời mình.",q:["作者为什么说“犯些小错并非坏事”？","怎样才能为自己的人生做主？"],note:[["不要害怕走弯路","<span class='zh'>走弯路</span> = đi đường vòng — <b>ẩn dụ</b> (比喻) cho thất bại, sai lầm. Xem <b>Bài tập 4</b>."],["只有……，才能……","Điều kiện cần — câu kết, <b>điểm đề</b> (呼应标题)."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: trật tự từ & từ gần nghĩa",G:[{id:"g1",grp:0,word:"",zh:"于",py:"yú",tag:"Chú thích 1 · giới từ (văn viết)",mean:"Giới từ, dùng trong <b>văn viết</b>. ① Chỉ <b>thời gian, nơi chốn</b> = <span class='zh'>在</span>. ② Chỉ <b>phương diện, nguyên nhân, mục đích</b> — thường kết hợp thành động từ hai âm tiết: <span class='zh'>勇于、苦于、善于、急于、忙于……</span>",forms:["V + 于 + thời gian / nơi chốn（毕业于……、产于……、出版于……）","Adj/V + 于 + V / N（勇于承担、苦于没有时间、忙于工作）"],ex:[["毕业于3年前的他，一直做会计，成天和数字打交道，枯燥而且压力大。","",1],["著名的西湖龙井茶产于浙江省的西湖一带。","Trà Long Tỉnh Tây Hồ nổi tiếng được sản xuất ở vùng Tây Hồ, Chiết Giang."],["我一直想和他一起去旅行，只是苦于没有时间。","Tôi luôn muốn đi du lịch cùng anh ấy, chỉ khổ nỗi không có thời gian."],["……不畏惧付出和失败，勇于承担责任，这就是成长。","",1]],tips:["<span class='zh'>于</span> đứng <b>sau</b> động từ (khác <span class='zh'>在</span> thường đứng trước): <span class='zh'>生于1990年 = 1990年出生</span>.","Ôn Khởi động 2: <span class='zh'>勇于、急于、长于、乐于、苦于、难于、善于、安于、敢于、属于、在于</span>."],practice:{q:"给“于”选择适当的位置",type:"pos",items:[["我已经A开始B写论文了，C最近正忙D收集资料。","D","我已经开始写论文了，最近正忙于收集资料。"],["A那时候，人们苦B长期C战乱，渴望D政治统一。","B","那时候，人们苦于长期战乱，渴望政治统一。"],["A第三届茅盾文学奖B获奖小说C《平凡的世界》出版D 1986年。","D","第三届茅盾文学奖获奖小说《平凡的世界》出版于1986年。"]]}},{id:"g2",grp:0,word:"致使",zh:"致使",py:"zhìshǐ",tag:"Chú thích 2 · động từ / liên từ",mean:"① <b>Động từ</b>: do nguyên nhân nào đó mà <b>khiến cho</b>. ② <b>Liên từ</b>: đứng đầu vế sau, dẫn ra <b>kết quả</b> do nguyên nhân ở trên — kết quả thường <b>tiêu cực</b>, ngoài mong muốn.",forms:["Nguyên nhân + 致使 + O + V","（由于 / 因为）……，致使 + kết quả xấu"],ex:[["他的粗心致使试验失败。","Sự cẩu thả của anh ấy khiến thí nghiệm thất bại."],["对自己缺乏信心，对未来过度悲观致使小王出现以上现象。","",1],["因为人类对木材的需求与日俱增，致使森林面积大幅度减少。","Vì nhu cầu gỗ của con người tăng từng ngày, khiến diện tích rừng giảm mạnh."],["由于新产品研发能力有限，致使企业逐渐失去竞争力。","Do năng lực nghiên cứu sản phẩm mới có hạn, khiến doanh nghiệp dần mất sức cạnh tranh."]],tips:["Văn viết; khẩu ngữ dùng <span class='zh'>使 / 让 / 所以</span>.","Nhóm “kết quả xấu”: <span class='zh'>致使 · 以致 · 导致</span>."],practice:{q:"完成句子",type:"complete",items:[["暖冬致使流感病人________。","暖冬致使流感病人比往年增加了很多。"],["由于连日暴风雪，致使________，几千名乘客滞留机场。","由于连日暴风雪，致使大批航班被迫取消，几千名乘客滞留机场。"],["由于经营管理不善，致使________。","由于经营管理不善，致使公司连年亏损，最后不得不倒闭。"]]}},{id:"g3",grp:0,word:"并非",zh:"并非",py:"bìngfēi",tag:"Chú thích 3 · động từ",mean:"Động từ, nghĩa là <span class='zh'>并不是</span>. <span class='zh'>并</span> đứng trước từ phủ định <span class='zh'>非</span>, <b>tăng cường giọng phủ định</b> (bác bỏ một suy nghĩ thông thường).",forms:["S + 并非 + N / Adj / mệnh đề","并非……，而是……"],ex:[["类似小王这样的年轻人并非少数。","",1],["这意味着，原本英明的决定今天看来可能并非如此了。","",1],["不要怕犯错，不要害怕走弯路，犯些小错并非坏事，它会增加我们的心灵免疫力。","",1]],tips:["Văn viết; khẩu ngữ: <span class='zh'>并不是</span>.","Cụm cố định: <span class='zh'>并非如此 · 并非偶然 · 并非易事</span>."],practice:{q:"用“并非”完成句子",type:"complete",items:[["城里人心里的农村特别美，而农民眼中的农村却________。","城里人心里的农村特别美，而农民眼中的农村却并非如此。"],["原本以为他结婚了，就会安心过日子，可事实并非________，他还像个孩子似的，天天心里想的就是玩儿。","原本以为他结婚了，就会安心过日子，可事实并非这样，他还像个孩子似的，天天心里想的就是玩儿。"],["你以为我只是教训你吗？其实________，我是希望你________。","你以为我只是教训你吗？其实我并非想教训你，我是希望你少走弯路。"]]}},{id:"g4",grp:1,word:"意味着",zh:"意味着 / 伴随着",py:"",tag:"Bài tập 2②⑤",mean:"<b>意味着</b> = <b>có nghĩa là, hàm ý</b> — dùng để rút ra ý nghĩa, hệ quả. <b>伴随（着）</b> = <b>đi kèm, cùng với</b> (văn viết của <span class='zh'>随着</span>).",forms:["这（就）意味着 + mệnh đề","伴随着 + N（sự thay đổi），……"],ex:[["这意味着，原本英明的决定今天看来可能并非如此了。","",1],["满18岁就意味着成人了，要承担起成年人的义务和责任。","Đủ 18 tuổi có nghĩa là thành người lớn, phải gánh vác nghĩa vụ và trách nhiệm."],["事实上，伴随着经济全球化，生活中的不确定因素日益增多。","",1],["伴随着他的压力越来越大，他的精神越来越紧张。","Cùng với áp lực ngày càng lớn, tinh thần anh ấy ngày càng căng thẳng."]],tips:["<span class='zh'>意味着</span> không dùng phủ định với 不: ✗<span class='zh'>不意味着</span> → <span class='zh'>并不意味着</span>."]},{id:"g5",grp:2,word:"以致",zh:"由于……，以致……",py:"",tag:"Mẫu nguyên nhân – kết quả xấu (đoạn 6)",mean:"<span class='zh'>以致</span> đứng đầu vế sau, chỉ <b>kết quả (thường xấu)</b> do nguyên nhân ở vế trước gây ra — “đến nỗi, dẫn đến”.",forms:["由于 + nguyên nhân，以致 + kết quả xấu"],ex:[["由于人们争先恐后报考热门专业，以致人才饱和，就业困难。","",1],["他平时不注意锻炼，以致身体越来越差。","Bình thường không chú ý rèn luyện, đến nỗi sức khỏe ngày càng kém."]],tips:["⚠️ <span class='zh'>以致</span> (đến nỗi — kết quả) ≠ <span class='zh'>以便</span> (để — mục đích, bài 5) ≠ <span class='zh'>以至</span> (cho đến).","SBT 24–28: <span class='zh'>以致事后悔恨</span>."]},{id:"g6",grp:2,word:"",zh:"谁……，谁就……",py:"",tag:"Đại từ nghi vấn phiếm chỉ (đoạn 6)",mean:"Hai <span class='zh'>谁</span> chỉ cùng một người bất kỳ: <b>ai… thì người đó…</b>. Cũng dùng với <span class='zh'>哪儿……哪儿…… / 什么……什么……</span>.",forms:["谁 + điều kiện，谁就 + kết quả"],ex:[["谁能够及早抓住机会，谁就赢得了机遇。","",1],["谁先到，谁就先买票。","Ai đến trước thì mua vé trước."],["你想去哪儿，我们就去哪儿。","Cậu muốn đi đâu thì chúng ta đi đó."]],tips:["Vế sau thường có <span class='zh'>就</span>."]}],BX:{grp:1,word:"日益",cols:["日益","越来越"],pair:"日益 — 越来越",same:["Đều biểu thị <b>mức độ tăng dần theo thời gian</b>, ngày một hơn.","建立外交关系后，两国的往来日益 / 越来越密切。"],diff:[["Sau <span class='zh'>日益</span> có thể là <b>động từ hai âm tiết</b>, không dùng động từ đơn âm.","改革开放后，人们的生活状况日益改善。","Sau <span class='zh'>越来越</span> rất ít động từ, chủ yếu là <b>động từ tâm lý</b> (喜欢、想、希望、盼望).<div class='zh' style='margin-top:4px'>我越来越喜欢周末去郊区玩儿了。(√) / 人们的生活状况越来越改善。(×)</div>"],["Sau <span class='zh'>日益</span> là <b>tính từ hai âm tiết</b>, không dùng tính từ đơn âm.","最近几十年，人口问题日益严重。(√) / 我的汉语水平日益高了。(×)","Sau <span class='zh'>越来越</span> là tính từ <b>bất kỳ</b> số âm tiết.<div class='zh' style='margin-top:4px'>天气越来越寒冷了。/ 天气越来越冷了。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["城乡人民的消费水平日益提高，消费结构也发生了变化。",0,"<span class='zh'>日益 + 提高</span> (động từ 2 âm tiết) — đúng."],["大家普遍认为市场上销售的产品种类越来越增加了。",1,"<span class='zh'>越来越</span> không đi với động từ thường như <span class='zh'>增加</span> → <span class='zh'>日益增加 / 越来越多</span>."],["最近的一项调查显示世界各国的经济形势日益好了。",1,"<span class='zh'>日益</span> không đi với tính từ đơn âm 好 → <span class='zh'>越来越好 / 日益好转</span>."],["受中国朋友的影响，我越来越喜欢东方文化了。",0,"<span class='zh'>越来越 + 喜欢</span> (động từ tâm lý) — đúng."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["热<u>门</u>","冷门 · 专门 · 部门 · 门类"],items:[["<u>伤</u>脑筋","伤","伤心 · 伤害 · 伤感 · 受伤"],["<u>致</u>使","致","致力 · 导致 · 精致 · 专心致志"],["类<u>似</u>","似","相似 · 似乎 · 胜似 · 似是而非"],["精<u>确</u>","确","准确 · 的确 · 正确 · 确实"]]},EX2:{q:"用所给词语改写句子",items:[["因为地址不清楚，所以信件无法送达。","致使","因为地址不清楚，致使信件无法送达。"],["满18岁就代表着成人了，要承担起成年人的义务和责任。","意味着","满18岁就意味着成人了，要承担起成年人的义务和责任。"],["真相其实跟你想象的完全不同。","并非","真相其实并非跟你想象的一样。"],["我们应该勇敢地承认自己的错误。","勇于","我们应该勇于承认自己的错误。"],["随着他的压力越来越大，他的精神越来越紧张。","伴随","伴随着他的压力越来越大，他的精神越来越紧张。"],["随着经济的发展，城市里汽车的数量越来越多。","日益","随着经济的发展，城市里汽车的数量日益增多。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["成本","及早","顾虑","伤脑筋","称心如意"],text:"最近，我在为租房子的事情{伤脑筋}，离单位近的吧，太贵了；便宜的吧，每天花在路上的时间要三四个小时，时间{成本}太高了。一个人住吧，不安全；跟别人合租吧，又怕有矛盾。见此情形，朋友劝我：“现在想找一个{称心如意}的房子本来就很难，如果你再{顾虑}重重，就更找不到房子了。你前两天看的那个房子就不错，我看你还是{及早}决定吧，省得将来后悔。”"},{bank:["畏惧","意志","挫折","机遇","勇于"],text:"人们常说：“失败是成功之母”。人的一生中总会遇到一些{挫折}，只有不{畏惧}失败，{勇于}面对困难，才会在实践中获得经验，增强{意志}力，进而抓住{机遇}，获得成功。"}]},EX4:{q:"课文中的“不要怕走弯路”是一种比喻的说法，阅读下列表示比喻的句子，并模仿造句",vn:"Mẫu so sánh – ẩn dụ: <span class='zh'>A 是 B · A 像 B 一样 · A 像 B + V · 急得像……</span>",items:[{src:"男人是山，女人是水。",task:"男人______，女人______。",model:"男人是一棵大树，女人是一阵春风。"},{src:"漂亮的姑娘像花儿一样。",task:"漂亮的姑娘______。",model:"漂亮的姑娘像一朵盛开的玫瑰。"},{src:"月亮像一个银色的盘子挂在天空上。",task:"月亮______。",model:"月亮像一只弯弯的小船挂在夜空中。"},{src:"一闪一闪的星星像调皮的孩子眨着眼睛。",task:"星星______。",model:"星星像无数颗钻石撒在黑色的天幕上。"},{src:"他急得像热锅上的蚂蚁。",task:"他急得______。",model:"他急得像丢了魂儿一样，在屋里团团转。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["为什么小王最近为工作的事伤脑筋？","①目前的工作…… ②对……感兴趣，可……，怕……","小王目前做会计，成天和数字打交道，枯燥而且压力大。他对艺术、心理学都感兴趣，可不确定自己真正擅长什么，怕选错了要付出很大的时间成本和经济成本。"],["什么原因使小王出现急躁、紧张、顾虑重重的现象？","①对……缺乏…… ②对……过度悲观（不敢想…… / 无法承受…… / 一旦选错，……）","小王对自己缺乏信心，对未来过度悲观：不敢想最坏的结果，无法承受这个结果，觉得一旦选错就会终身悔恨。"],["乔布斯的智慧从哪里来？","智慧 ← 精确的判断力 ← 经验的积累 ← 无数错误的判断","乔布斯的智慧来自精确的判断力，判断力来自经验的积累，而经验来自无数错误的判断。"],["做决定的能力是怎么得来的？","通过……得来的，在这个过程中，人同时具有了……，不畏惧……，勇于……","做决定的能力是通过实践和挫折得来的，在这个过程中，人同时具有了坚定的意志力和敏锐的判断力，不畏惧付出和失败，勇于承担责任。"],["为什么说生活中的不确定因素日益增多？","①世界一流企业也会…… ②金融危机使……不得不……","伴随着经济全球化，昔日风光的世界一流企业也会亏损、倒闭；一次金融危机就会使连年盈利的企业不得不裁员。"],["为什么说无论你怎么选择，都不太可能选一份称心如意的工作安安稳稳过一辈子？","①经济环境……，企业寿命……，人们要经历…… ②……报考热门专业，以致…… ③新职业的出现，……","经济环境不确定，企业寿命越来越短，人们要经历更多次职业选择；人们争先恐后报考热门专业，以致人才饱和、就业困难；新职业的出现需要新型人才，谁及早抓住机会，谁就赢得机遇。"]]},BJ:{title:"病句类型：语序不当",vn:"Câu sai — loại 3: trật tự từ không đúng",intro:"<b>语序不当</b>: thứ tự từ không đúng quy tắc ngữ pháp hoặc không hợp thói quen tiếng Hán. Nguyên nhân chính: vị trí <b>định ngữ, trạng ngữ, tân ngữ</b> sai; thứ tự <b>nhiều tầng định ngữ / trạng ngữ</b> sai; vị trí <b>hư từ</b> sai; ngoài ra các câu đặc biệt (<span class='zh'>是</span>, <span class='zh'>把</span>, <span class='zh'>被</span>, kiêm ngữ, so sánh) và <b>từ ly hợp</b> cũng dễ sai trật tự.",types:[["状语位置不当","Sai vị trí trạng ngữ","你不必给我打电话，已经别人给我打了。","别人已经给我打了。","Thứ tự trạng ngữ: <b>phó từ</b> (已经) → <b>đối tượng</b> (给我) → động từ."],["宾语位置不当","Sai vị trí tân ngữ","地形图上的川藏线弯弯曲曲，像极了高原反应时极速抖动的心电图谱。","……，和高原反应时极速抖动的心电图谱像极了。","<span class='zh'>像极了</span> không mang tân ngữ → dùng <span class='zh'>和 A 像极了</span>."],["主语位置不当","Sai vị trí chủ ngữ","郑晓龙执导的很多电视剧，对中国人是不陌生的。","中国人对郑晓龙执导的很多电视剧是不陌生的。","Người mới “không xa lạ” với phim, không phải ngược lại."],["“把”字句否定式语序错误","Sai vị trí phủ định trong câu 把","这事对她打击一定很大，她肯定会受不了，我把这事没告诉她。","我没把这事告诉她。","Từ phủ định đứng <b>trước</b> <span class='zh'>把</span>."],["离合词语序错误","Sai trật tự từ ly hợp","我们公司管理比较严格，没有特殊情况不准迟到早退，每两个星期一次开会。","每两个星期开一次会。","Số lượng chen vào giữa từ ly hợp: <span class='zh'>开一次会</span>."]],opts:["离合词语序错误","宾语位置不当","补语位置不当","状语位置不当","比较句语序错误"],practice:[["想着想着，他发怒起来。","离合词语序错误","想着想着，他发起怒来。","<span class='zh'>发怒</span> là từ ly hợp: bổ ngữ xu hướng tách đôi → <span class='zh'>发起怒来</span>."],["她不但说了那样，而且也做了那样。","宾语位置不当","她不但那样说了，而且也那样做了。","<span class='zh'>那样</span> chỉ cách thức, đứng <b>trước</b> động từ làm trạng ngữ."],["她不是看书就是写文章，每天到深夜都忙。","补语位置不当","她不是看书就是写文章，每天都忙到深夜。","Thời gian kết thúc làm <b>bổ ngữ</b> sau động từ: <span class='zh'>忙到深夜</span>."],["我想去一起喝茶和我的朋友。","状语位置不当","我想和我的朋友一起去喝茶。","Trạng ngữ đối tượng <span class='zh'>和我的朋友</span> + <span class='zh'>一起</span> đứng trước động từ <span class='zh'>去</span>."],["她很有绘画天赋，不光油画画得好，中国画也并比别人画得不差。","比较句语序错误","她很有绘画天赋，不光油画画得好，中国画也并不比别人画得差。","Phủ định câu so sánh <span class='zh'>比</span>: <span class='zh'>不</span> đứng trước <span class='zh'>比</span>: <span class='zh'>并不比……差</span>."]]},DP:{title:"词汇：熟悉下列近义词",vn:"Các cặp gần nghĩa — chú ý sắc thái và phạm vi dùng.",items:[["取缔","qǔdì","cấm, giải tán (bằng pháp luật)","↔ 取消","政府取缔了非法市场。"],["生疏","shēngshū","lạ lẫm; lụt nghề","↔ 疏远","好久没弹琴，手都生疏了。"],["惋惜","wǎnxī","tiếc thương","↔ 可惜","大家都为他的离去感到惋惜。"],["诬陷","wūxiàn","vu khống, hãm hại","↔ 陷害","他被人诬陷偷了钱。"],["羞耻","xiūchǐ","xấu hổ, nhục","↔ 耻辱","说谎是一件羞耻的事。"],["削弱","xuēruò","làm suy yếu","↔ 减弱","这会削弱我们的竞争力。"],["遗失","yíshī","đánh rơi, thất lạc","↔ 丢失","他不小心遗失了护照。"],["遭殃","zāo yāng","gặp họa","↔ 倒霉","洪水来了，老百姓遭殃了。"],["镇定","zhèndìng","bình tĩnh, trấn tĩnh","↔ 冷静","遇到危险时一定要保持镇定。"],["自满","zìmǎn","tự mãn","↔ 骄傲","取得成绩也不能自满。"],["宰","zǎi","giết (gia súc); “chặt chém”","↔ 杀","这家饭馆太宰人了。"],["请柬","qǐngjiǎn","thiệp mời","↔ 请帖","我收到了他们的结婚请柬。"],["公正","gōngzhèng","công minh","↔ 公平","法官判决很公正。"],["揍","zòu","đánh (khẩu ngữ)","↔ 打","再不听话就揍你！"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"古人云“书到用时方恨少”，今天确实有了体会。妻子出差，我陪儿子睡觉。儿子要求讲故事，我搜肠刮肚也找不出故事。找书求救吧，这才发现，家里书是不少，但除了计算机还是计算机，竟找不出一本能救急。",o:["古人的话未必有道理","说话人脑子里没故事","说话人家里只有电脑","说话人有本急救手册"],a:1,why:"“我搜肠刮肚也找不出故事”. (C: sách toàn về <i>máy tính</i>, không phải chỉ có máy tính.)"},{n:2,say:"我小的时候，一直看着父亲和周围的人忙碌，于是觉得一切都理所当然。长大了自然和父亲一样，每天过着除了工作没有其他内容的生活。但日复一日，现在这种紧张的生活已经让我有些身心俱疲。",o:["“我”很欣赏父亲的生活","父亲的生活非常丰富多彩","父亲影响了“我”的工作","“我”忙得身体和心都累"],a:3,why:"“身心俱疲” = thân và tâm đều mệt."},{n:3,say:"天才常给人留下不爱和人打交道甚至独来独往的印象，或经常有着悲惨的经历。和其他天才不同的是，他被很多爱热闹的朋友们环绕，有着温暖的家庭和优秀的员工。",o:["他是一位天才","老板很喜欢他","社会很关注他","他很有同情心"],a:0,why:"“和其他天才不同的是，他……” → anh ấy cũng là thiên tài."},{n:4,say:"这本纪念普及版的《城南旧事》2003年由中国青年出版社出版，作者是台湾女作家林海音。全书讲述的是英子童年的故事，反映了作者对童年的怀念和对故乡的思念。同名电影在中外电影节荣获过多个奖项。",o:["有部电影名为《城南旧事》","英子是《城南旧事》的作者","写《城南旧事》的是个孩子","《城南旧事》写的是2003年的事"],a:0,why:"“同名电影……荣获过多个奖项”."},{n:5,say:"有人说，最幸运的人是在年轻时犯过所有的错误，然后及早明白了人生道理，从此踏上坦途。小李就是这样的幸运儿，如今的他，感谢自己曾经遭受过的一切挫折，因为那些正是他成长的动力。",o:["小李一辈子都比别人走运","人年轻时没有不犯错误的","常常旅行能明白很多道理","小李能从失败中吸取教训"],a:3,why:"“感谢自己曾经遭受过的一切挫折，因为那些正是他成长的动力”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：好久不见，您好！\n女：您好！\n男：作为记者，虽然我自认为已经很资深了，但还是很期待今天的采访。大家都知道，您是前女排国手，一位尽人皆知的明星运动员。而退役之后，您的生活更引人关注，因为您选择了一条与众不同的路。如今您的小说已确定入围华语科幻星云奖了，您有什么样的感受？\n女：这是另一个领域给自己的肯定。我很开心，非常开心。当然这只能算是一个起点。\n男：您觉得写科幻小说和打排球是不一样的？\n女：打排球压力很大，背负了太多国家、球迷和家人给的压力。\n男：运动员退役写自传的比较多，您却选择了写科幻小说，您是觉得自己擅长写科幻？还是科幻对您有特别的意义？\n女：我从小好奇心就比较重。也喜欢看探索、揭秘这种节目，包括外星人这些话题。\n男：您觉得作为一个作家，您的优势在哪里？\n女：勤奋。打排球教会我很多东西。我学到了坚持，拼搏，不怕挫折。当别人认为可能没有机会的时候，我还想努力去拼一下。可能只有1%的概率，我也想去挑战，这可能就是运动员的性格。\n男：运动员退役转型很受关注，您觉得自己的决策算是成功的吗？\n女：有些人会觉得我出书了，还入围了奖项，我成功了。我自己倒是觉得，勇于义无反顾地丢掉铁饭碗，勇于为自己的人生做主，这是我的成功之处。\n男：很多人愿意留在相对稳定的环境中，您这样做意味着要终身为自己的生计操劳，您对自己的选择不后悔吗？\n女：不会呀。当然，刚开始会觉得不安，突然有一天没人给你发工资了，你的医疗卡也被取消了。会觉得我脱离这些以后，我能做什么呢？我父母也有顾虑，觉得起码要有一个保障。但我觉得，我要自由，我想做自己想做的事情。我会对自己的将来负责任。不管是好是坏，我都认。我不后悔自己所做的任何选择，就算是错误的，那也是我成长的经历。",qs:[{n:6,q:"记者为什么期待这次采访？",o:["他要采访一位老牌作家","他好久没有采访明星了","他的采访对象非同一般","他一直在关注采访对象"],a:2,why:"Cựu tuyển thủ bóng chuyền quốc gia chuyển sang viết khoa học viễn tưởng — “与众不同”."},{n:7,q:"女的怎么看排球或者是科幻小说？",o:["她认为自己擅长写小说","她认为打排球更伤脑筋","写小说会背负更多压力","好奇心使她选择了科幻"],a:3,why:"“我从小好奇心就比较重”."},{n:8,q:"女的作为作家，她的优势是什么？",o:["她勤奋好学，热爱读书","她有运动员不屈的性格","有没有可能她都会拼搏","打排球的经历给她机会"],a:1,why:"“坚持，拼搏，不怕挫折……这可能就是运动员的性格”."},{n:9,q:"女的认为自己什么地方是成功的？",o:["她的书出版了","她的书获奖了","她终于成了名人","她做了自己想做的事"],a:3,why:"“勇于为自己的人生做主，这是我的成功之处”."},{n:10,q:"对于自己的选择，女的怎么想？",o:["她会对自己的选择负责","她担心不能去奉养父母","她顾虑没有稳定的收入","她担心不再有医疗保障"],a:0,why:"“我会对自己的将来负责任……我都认”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"几个学生去拜会大学教授。起初大家相谈甚欢，可是说着说着，学生们的话题就转向了抱怨，抱怨生活的压力和功课的超负荷。这时，教授不动声色地从厨房取出了许多杯子，其中有木制的，有玻璃的，也有塑料的。教授让学生们自己取杯子倒水喝。学生们取完后，桌子上只剩下了粗糙难看的杯子。教授这时别有深意地微笑着说：“你们瞧，所有的漂亮杯子都被拿走了，剩下的全是让人瞧不上眼儿的塑料杯。现在我想问的是，你们选杯子的目的是什么？”学生们异口同声地说：“喝水呀。”教授又问：“既然是喝水，那为什么杯子好看不好看在你们心里那么重要呢？随手拿一个不就完了吗？为什么还要争先恐后地选好的、美的？”学生们被问得哑口无言。教授说道：“主副不分而又什么都不想失去的心态正是造成压力的主因。就好比你们喝的是水，还要选美的杯子，甚至在选不到好杯子时心生抱怨。”",qs:[{n:11,q:"学生们到教授家去干什么？",o:["看望教授","请教问题","教授请客","开茶话会"],a:0,why:"“几个学生去拜会大学教授” — 拜会 = thăm hỏi."},{n:12,q:"教授请学生喝水的目的是什么？",o:["显示他的杯子多","平复学生的怨气","给学生讲道理","没有特殊目的"],a:2,why:"“别有深意地微笑着说……” → để giảng đạo lý."},{n:13,q:"这段话主要想告诉我们什么？",o:["有得有失是很正常的","难看的东西没人喜欢","塑料杯子最不受欢迎","现代社会的压力太大"],a:0,why:"“什么都不想失去的心态正是造成压力的主因” → có được có mất là bình thường."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"美国青年亨利已经30多岁了，依然一事无成，自卑伴随了他将近30年，因为他矮，因为他的英语不标准。一天，他的一位好友兴冲冲地拿着本杂志找到他，说上面有篇文章讲的是拿破仑的一个儿子流落到了美国，而亨利的父亲和拿破仑儿子的特征几乎一模一样：矮矮的个子，说着带有法国口音的英语。\n亨利半信半疑，他细细读完那篇文章，他愿意相信自己就是拿破仑的孙子。之后，他像变了一个人。过去，他为自己个子矮小而自卑，现在他认为这是天生的值得骄傲的特点；昔日，他认为自己英语讲得不好，而今他以讲一口带有法国口音的英语而自豪。每当遇到困难时，他会对自己说：“拿破仑的字典里没有‘难’这个字！”就这样，凭着超人的意志，他克服了一个又一个困难，仅仅三年，他便成为一家大公司的总裁。\n后来，他派人调查自己的身世，原来他和拿破仑没有半点儿关系，然而现在，他认为是不是拿破仑的孙子已经不重要了，重要的是他懂得了一个道理，那就是：当你自信时，你就会无所畏惧，就会创造出惊人的奇迹。",qs:[{n:14,q:"亨利30岁的时候是一种什么状况？",o:["什么事情都没做成","为父亲的缺陷难过","就喜欢看各种杂志","只有一位好朋友"],a:0,why:"“依然一事无成”."},{n:15,q:"亨利为什么像变了一个人？",o:["他听说拿破仑的儿子在美国","他得到了拿破仑使用的字典","他愿意相信自己是名门之后","他发现自己的英语其实很棒"],a:2,why:"“他愿意相信自己就是拿破仑的孙子”."},{n:16,q:"三年当中，亨利做了些什么？",o:["他努力纠正英语的发音","他换了一个又一个工作","他只选意志超群的职员","他有了一家自己的公司"],a:3,why:"Theo đáp án sách: “成为一家大公司的总裁”."},{n:17,q:"根据这段话，下列哪项正确？",o:["亨利最后学好了英语","没有自信就不可能成功","亨利的确是拿破仑的后代","很多人想到亨利的公司就业"],a:1,why:"“当你自信时，你就会无所畏惧，就会创造出惊人的奇迹”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["人类最大的敌人是自己，我们需要战胜的也是自己。","小时候，每当盛夏时节，我都会和小伙伴们到这里游泳。","不管这样的推介效果如何，但中国文学走出去总算是有了一个开始。","那时候，我爱好写作，业余时间就写些散文、小说、报告文学之类的东西。"],a:2,why:"<b>Sai cặp quan hệ từ</b>: <span class='zh'>不管……</span> đi với <span class='zh'>都 / 总</span>, không đi với <span class='zh'>但</span> → bỏ <span class='zh'>但</span>."},{n:19,o:["那一年，我上了大学，要离开家去住学校了。","生活中那些有着和她一样逻辑思维的人和事，难道还少吗？","他于1235年开创了法医鉴定学，因此被尊为世界法医学鼻祖。","爸爸早年喜欢玩儿手风琴，退休后想重拾旧爱，可是已经抱不动沉重的琴了。"],a:1,why:"<b>Kết hợp sai</b>: “事” không thể <span class='zh'>有着逻辑思维</span> → <span class='zh'>那些有着和她一样逻辑思维的人</span>."},{n:20,o:["月光下，我们边走边聊，不知不觉就走了十几里左右。","尽管如此，他依然表现得很平静，没有任何激动的言行。","菠萝炒熟，煮糖水或者泡盐水食用，可去除口腔麻痹、胃肠不适感。","咖啡之所以提神，是因为它所含有的咖啡因具有刺激人交感神经的作用。"],a:0,why:"<b>Thừa / mâu thuẫn</b>: <span class='zh'>十几</span> đã là ước lượng, không thêm <span class='zh'>左右</span> → <span class='zh'>十几里 / 十里左右</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"中国剪纸具有___的群众基础，是一种百姓___的艺术品，大家用它来装点生活。中国剪纸饱含着丰富的文化历史___，表达了广大民众的美学情趣。",o:["可靠　疼爱　消息","宽广　热爱　内容","广泛　喜爱　信息","无边　爱好　形式"],a:2,why:"<span class='zh'>广泛的群众基础</span> (cố định); <span class='zh'>百姓喜爱</span>; <span class='zh'>文化历史信息</span>."},{n:22,text:"教育对人的发展起着重要作用，___随着社会的发展，科学技术的___进步，教育对人的发展所起的作用越来越___。在现代社会生活中，很难___一个没有受过系统教育的人能够做好工作。",o:["并且　日益　明显　设想","尚且　渐渐　清楚　预想","从而　继续　显然　构想","进而　一直　明确　猜想"],a:0,why:"<span class='zh'>并且</span> (tăng tiến); <span class='zh'>日益进步</span> (Ngữ pháp bài này!); <span class='zh'>越来越明显</span>; <span class='zh'>很难设想</span>."},{n:23,text:"要想美丽和健康，比外部___更重要的是练“内功”，意思是说你要更重视在身体内部___。你可以把自己的脸想象成一件美丽的衣服，___它的外层看上去有多么漂亮，如果内层做得不合适或是不平整，衣服还是穿不出___。",o:["修饰　下功夫　不管　效果","打扮　花力气　就是　结果","装扮　搭时间　好在　后果","美容　伤脑筋　并非　风光"],a:0,why:"<span class='zh'>外部修饰</span>; <span class='zh'>在……下功夫</span>; <span class='zh'>不管……多么……</span>; <span class='zh'>穿不出效果</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"小张到一家大公司应聘公关经理，进门时，(24)，顿时手中的资料散落一地。小张不慌不忙地一一捡起，微笑着走到董事长面前坐下。\n董事长显然对他的从容不迫很好奇，问他，(25)？小张微笑着回答：“在人生的旅程中，常常会有类似刚才这样意想不到的事情发生，而这些事情产生什么样的结果，很大程度上取决于我们是以何种态度去面对。(26)。通常我不会以消极的态度去面对，以致事后悔恨；我会以从容、积极、正面的态度去面对，只要尽了力，我就不太在乎结果怎么样。因为很多事情的结果，我们都无法控制。(27)，结果是在董事长您的手中啊。”\n不久后，小张接到了录取通知。(28)，意思是说，小张摔了一跤之后应付得当，才被录取。如果不摔那一跤，说不定没有机会展现出他的危机处理能力。",opts:["不同的态度会产生不同的结果","董事长开玩笑说他是一跤摔进公司的","他竟然一跤摔进了屋子","你觉得这样的事情会影响你的面试成绩吗","如同今天这件事"],ans:{24:2,25:3,26:0,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"这几年不少年轻朋友来找我，询问如何应对人生或职场所面临的困难。我通常会问：“你的长期目标是什么？”虽然这是个平淡无奇的问题，可是竟然有九成的人答不上来。这就怪了，一方面想问路，另一方面却不知道自己最终想去哪里。\n这其中我发现大部分人选择工作的方法是拍拍脑袋想一想，什么行业最热门就往哪里走，并不曾想过自己往那样的方向去到底是为了什么。我通常会追问他们：“你为什么从事现在的工作？”大部分人说：“因为念了这个专业，可是干了几年，发现自己不是很喜欢这个领域，成就感也不高，薪水也不满意，所以就很不称心如意了。”这些人当中的大部分会问我，“我是不是该去读硕士？”“该不该拿个博士？”“去考公务员好吗？”“我该换到什么新领域去？”总觉得一定有条快速路通往理想之国，只要找别人问一问，换线开上去就能平步青云了。\n其实职场痛苦，通常都是来自于不知道自己的人生目标是什么，不知道自己要什么，致使每次尝试到最后都是痛苦。因为从没有对自己的人生大方向做过深入的思考，就会把钱多不多、同事烦人不烦人、老板是否好相处等问题放大来看，稍有不如意，就觉得是天大的委屈，甚至面对这样的问题会感到束手无策。相反，如果你确曾深思熟虑过自己的人生大目标，首先，你不会动不动就想换条路，其次，你不会碰上一点儿细枝末节的问题就备感挫折。",qs:[{n:29,q:"根据第1段，下列说法正确的是：",o:["迷路是很多人经常碰到的问题","大家的人生目标都差不了多少","“我”的朋友在工作中碰到了困难","90%的人没想过人生目标的问题"],a:3,why:"“竟然有九成的人答不上来” (九成 = 90%)."},{n:30,q:"根据第2段可以知道：",o:["很多人选工作没经过深思熟虑","选择工作不能光考虑收入多少","大部分人认为当公务员也不错","有人觉得多读些书就有好工作"],a:0,why:"“拍拍脑袋想一想，什么行业最热门就往哪里走”."},{n:31,q:"职场痛苦的根源是什么？",o:["同事和老板很不好相处","没想过人生目标的问题","日常不顺心的事情太多","个人缺乏解决问题的能力"],a:1,why:"“职场痛苦，通常都是来自于不知道自己的人生目标是什么”."},{n:32,q:"上文的主要观点是：",o:["人生规划是最重要的问题","对入职单位的考察要慎重","过于计较就永远不会满意","能否碰上好单位全靠运气"],a:0,why:"Cả bài nhấn mạnh phải suy nghĩ kỹ về mục tiêu cuộc đời."}]},{ins:"第33–36题：请选出正确答案。",text:"有人捡到一只小鸟，就将它带回了家里。孩子将小鸟与小鸡放在一起。慢慢地，小鸟长大了，人们才发现，它原来是一只鹰。虽然这只鹰和家里的鸡相处得很好，但周围总有人家里丢鸡，有人怀疑是这只鹰吃了鸡，强烈要求主人将鹰处死。这家人舍不得，但迫于压力，主人决定放生这只鹰。\n主人把鹰带出村子放了，没一会儿它就回来了。第二次主人坐车带它走了很远很远，没出两天它又回来了。第三次主人将鹰带到了高山上，面对深渊将鹰扔了下去。一开始鹰直直地向下落，突然它展开了翅膀，奇迹般地飞了起来，而且越飞越高，越飞越远，再也没有回来。\n鹰本来是有翅膀的，能飞很高很远，但是，混在鸡群里，它就被同化了。没有经过锻炼，又依恋温暖舒适的家，渐渐地，就失去了翱翔蓝天的勇气和信心。要是没有人将它扔下山崖，它永远不可能飞上蓝天，寻找属于自己的世界。\n美国作曲家乔治·格什温从没有写过交响曲。当时美国最著名的指挥家认定他是个写交响曲的高手，邀请他为交响乐团写一部曲子。格什温声称自己不会，不肯从命。这位指挥家竟然在报纸上登了一则广告，说20天后，音乐厅将上演格什温的交响乐《蓝色狂想曲》。格什温看到广告气坏了，质问指挥家为何令他出丑，指挥家微笑着说，反正全城人都知道了，你看着办吧。格什温没办法，只好把自己关在屋子里，硬是用两周的时间，完成了这部作品。结果演出大获成功，格什温的名气迅速传遍美国。\n人和鹰一样，不把自己逼上绝路，永远不会知道自己有多么能干！",qs:[{n:33,q:"主人要放掉这只鹰的原因是：",o:["鹰偷吃了小鸟","邻居们意见大","鹰吃家里的鸡","邻居们害怕鹰"],a:1,why:"“强烈要求主人将鹰处死……迫于压力”."},{n:34,q:"主人放鹰的事情说明什么？",o:["鸡的生活安逸、舒适","鹰跟主人的关系很好","鹰跟主人学会了飞翔","放生的鹰找回了蓝天"],a:3,why:"Bị đẩy xuống vực, đại bàng mới bay lên trời xanh."},{n:35,q:"作曲家乔治·格什温：",o:["做事认真，做人谦虚","什么事都是逼急了才去做","是《蓝色狂想曲》的作者","有位长得很丑的指挥家朋友"],a:2,why:"“完成了这部作品”《蓝色狂想曲》. (D: <span class='zh'>出丑</span> = bẽ mặt, không phải xấu xí!)"},{n:36,q:"根据上文，下列哪项正确？",o:["鹰是非常凶猛的动物","指挥家做事特别急躁","指挥家看错了格什温","面对绝境能创造奇迹"],a:3,why:"“不把自己逼上绝路，永远不会知道自己有多么能干”."}]}]},W:{zh:"写作",vn:"Viết văn: 判断力来自哪里",min:!0,task:"这篇课文告诉我们，敏锐的判断力来自实践和挫折。那么你是怎样在实践和挫折中提升自己的判断力的？请以“判断力来自哪里”为题，结合自己的实际经历写一篇不少于300字的文章。（提示：你在做什么事情时犹豫不决？什么因素促使你做出了决定？事实证明这个决策是否正确？通过这件事，你明白了什么道理？这件事是如何提升你的判断力的？）",target:300,steps:[["Chọn một quyết định","Một lần bạn <b>do dự</b> (chọn trường, chọn ngành, đổi việc, mua đồ lớn…)."],["Vì sao do dự","Dùng từ của bài: <span class='zh'>伤脑筋 · 顾虑重重 · 怕万一……</span>"],["Điều gì thúc đẩy","Yếu tố giúp bạn quyết: lời khuyên, sự kiện, suy nghĩ…"],["Kết quả","Đúng hay sai? Nếu sai, bạn học được gì (<span class='zh'>犯些小错并非坏事</span>)."],["Bài học","Trả lời câu hỏi đề: <span class='zh'>判断力来自……</span>; có thể trích lời Jobs."]],outline:[["开头 · Nêu chuyện","那年，我为……的事伤脑筋……"],["经过 · Do dự & quyết định","我顾虑重重……后来，……促使我做出了决定"],["结果 · Đúng / sai","事实证明……"],["结尾 · Bài học","这件事让我明白，判断力来自……；只有……，才能……"]],model:"判断力来自哪里\n高中毕业那年，我为选专业的事伤透了脑筋。父母希望我学热门的计算机，说将来好就业；可我从小喜欢中文，梦想当一名翻译。我顾虑重重，怕万一选错了，会终身悔恨。\n后来，我去请教一位大学老师。他告诉我，热门专业固然好找工作，但是由于大家争先恐后地报考，以致人才饱和；而且只有真正喜欢，才能坚持下去。他的话促使我做出了决定：学中文。\n大学第一年，我的成绩并不理想，还一度怀疑自己的选择。但我没有放弃，每天坚持练习听说读写，还利用假期去旅行社做兼职翻译。在实践中，我犯过不少错误，有一次甚至把客人的航班时间翻译错了。不过，每一次挫折都让我学到了东西。毕业时，我顺利进入了一家国际公司，做上了自己喜欢的工作。\n这件事让我明白，判断力并非天生的，它来自经验的积累，而经验又来自一次次的实践和挫折。不要怕犯错，只有勇于做决定、勇于承担责任，我们的判断力才会越来越敏锐，才能真正为自己的人生做主。",check:["Tiêu đề 《判断力来自哪里》","Có việc do dự cụ thể và lý do","Có yếu tố giúp quyết định","Có kết quả (đúng/sai) và trải nghiệm vấp ngã","Kết bằng bài học về phán đoán","Dùng ít nhất 2 trong: 致使 · 并非 · 于 · 以致 · 意味着","Không ít hơn 300 chữ"]},SUM:{words:["做主","伤脑筋","枯燥","擅长","成本","急躁","顾虑","过度","致使","终身","类似","并非","精确","天生","挫折","意志","敏锐","畏惧","勇于","伴随","日益","亏损","倒闭","危机","盈利","裁员","意味着","英明","称心如意","争先恐后","热门","以致","就业","及早","机遇","决策"],patterns:[["V + 于 + thời gian / nơi chốn","毕业于3年前的他……"],["A 致使 B + V（kết quả xấu）","对未来过度悲观致使小王出现以上现象。"],["并非 + ……","类似小王这样的年轻人并非少数。"],["这意味着……","这意味着，原本英明的决定今天看来可能并非如此了。"],["由于……，以致……","由于人们争先恐后报考热门专业，以致人才饱和。"],["谁……，谁就……","谁能够及早抓住机会，谁就赢得了机遇。"]],diff:["日益：+ động từ / tính từ 2 âm tiết (日益增多、日益严重) — 越来越：+ tính từ bất kỳ; động từ chủ yếu là tâm lý (越来越喜欢)","致使 · 以致 · 导致 (kết quả xấu) ≠ 以便 (mục đích) · 过度 ≈ 过于 · 精确 > 准确 · 危机 (khủng hoảng) ≠ “nguy cơ” · 心灵 = tâm hồn"],sentences:["做决定是一种能力，而能力不是天生的，是通过实践和挫折得来的。","谁能够及早抓住机会，谁就赢得了机遇。","不要怕犯错，不要害怕走弯路，犯些小错并非坏事，它会增加我们的心灵免疫力。"],hw:["Học thuộc 45 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 (câu so sánh) vào vở.","Viết bài 《判断力来自哪里》 ≥300 chữ (mục 7).","Làm Sách bài tập bài 7 (nghe 1–17, đọc 18–36).","Đọc trước bài 8 《遇见原来的我》."]}});
