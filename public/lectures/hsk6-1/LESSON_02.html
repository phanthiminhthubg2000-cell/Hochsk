<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 2 · 父母之爱 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-02",num:2,book:"HSK 标准教程 6（上）",unit:{n:1,zh:"生活点滴",vn:"Những việc nhỏ nhặt trong cuộc sống"},title:"父母之爱",vn:"Tình yêu của cha mẹ",chars:701,source:"改编自《北京青年报》文章《假装没那么担心你》，作者：猪小浅",goals:["Đọc hiểu bài khóa 701 chữ — câu chuyện <b>“hiểu lầm → vỡ lẽ”</b> về cách cha mẹ buông tay để con tự lập.","Dùng được 44 từ mới, đặc biệt nhóm từ cảm xúc: <span class='zh'>孤独 · 埋怨 · 无精打采 · 心疼 · 欣慰 · 热泪盈眶</span>.","Nắm 3 từ trọng điểm <span class='zh'>恨不得 · 顿时 · 不由得</span> và mẫu câu <span class='zh'>……就更甭提了</span>, <span class='zh'>不……，怎么……？</span>","Phân biệt <span class='zh'>体谅 — 原谅</span>; phân biệt nhóm từ chỉ thời gian rất ngắn <span class='zh'>刹那 · 片刻 · 瞬间 · 顿时</span>.","Viết bài văn kể chuyện <b>“父母给我的爱”</b> (≥300 chữ) có đủ nguyên nhân – diễn biến – kết quả – cảm nhận."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (恨不得 · ……更甭提了 · 体谅—原谅) · Bài khóa đoạn 1–4"],["Buổi 2","Từ vựng & ngữ pháp nhóm 3 (顿时 · 不由得 · 不……，怎么……？) · Đoạn 5–7 · Bài tập · Từ chỉ động tác · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Mở đầu",paras:"Đoạn 1–2",zh:"在爱中长大，向往独立；上大学后想家",vn:"Lớn lên trong vòng tay yêu thương, khao khát tự lập; lên đại học xa nhà lại thấy cô đơn, nóng lòng muốn về."},{tag:"转",name:"Bước ngoặt",paras:"Đoạn 3–4",zh:"母亲不让回家，“我”埋怨父母，独自过假期",vn:"Mẹ bảo đừng về; “tôi” trách bố mẹ không thông cảm, đành ở lại trường — và phát hiện niềm vui làm việc trong yên tĩnh."},{tag:"合",name:"Kết – vỡ lẽ",paras:"Đoạn 5–7",zh:"回家听到父母的谈话，明白了父母的苦心",vn:"Về nhà, nghe bố mẹ nói chuyện nửa đêm, nhìn tóc bạc nếp nhăn — hiểu ra tình yêu thầm lặng của cha mẹ."}],warm1:{q:"中国有句俗话：“打是亲，骂是爱”，你能理解吗？下面这些事情中，你觉得父母做得对不对？为什么？",vn:"Tiếng Trung có câu tục ngữ “đánh là thương, mắng là yêu” — bạn có hiểu không? Trong những việc dưới đây, bạn thấy bố mẹ làm đúng hay sai? Vì sao?",items:[["🧺","帮孩子做所有的事情","Làm hết mọi việc thay con"],["📔","为了了解孩子，偷看孩子的日记","Để hiểu con, đọc trộm nhật ký của con"],["🧹","让孩子分担家务","Cho con chia sẻ việc nhà"],["💼","假期让孩子去打工赚自己的零花钱","Kỳ nghỉ cho con đi làm thêm kiếm tiền tiêu vặt"],["🙈","对孩子的事情不闻不问","Không hỏi han gì đến chuyện của con"],["✋","孩子做错了事情，打骂孩子","Con làm sai thì đánh mắng"]],talk:["你同意“打是亲，骂是爱”这句话吗？","你的父母用什么方式表达对你的爱？"],link:"Bài khóa kể một kiểu tình yêu <b>“khó hiểu”</b> khác: cha mẹ <b>cố ý không cho con về nhà</b> để con tập tự lập — đúng tinh thần <span class='zh'>让孩子分担 · 让孩子打工</span>."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"光",rule:"Cùng có chữ 光 = <b>ánh sáng</b>. Danh từ + 光 → loại ánh sáng (阳光, 月光…); 光 + tính từ → sáng sủa (光明, 光亮).",w:[["阳光","yángguāng","ánh nắng"],["月光","yuèguāng","ánh trăng"],["星光","xīngguāng","ánh sao"],["灯光","dēngguāng","ánh đèn (có trong bài)"],["火光","huǒguāng","ánh lửa"],["发光","fāguāng","phát sáng"],["放光","fàngguāng","tỏa sáng"],["光明","guāngmíng","quang minh, tươi sáng"],["光亮","guāngliàng","sáng bóng"]],trap:"Bài khóa còn có <span class='zh'>目光</span> (ánh mắt) — 光 ở đây là <b>tia nhìn</b>."},{k:"爱",rule:"爱 = yêu. Đứng sau → các kiểu tình yêu (亲爱, 疼爱…); đứng trước → động từ/danh từ (爱心, 爱护…).",w:[["亲爱","qīn'ài","thân yêu"],["可爱","kě'ài","đáng yêu"],["热爱","rè'ài","yêu tha thiết"],["疼爱","téng'ài","thương yêu"],["友爱","yǒu'ài","thân ái"],["恋爱","liàn'ài","yêu đương"],["关爱","guān'ài","quan tâm yêu thương"],["求爱","qiú'ài","tỏ tình"],["相爱","xiāng'ài","yêu nhau"],["爱情","àiqíng","tình yêu (nam nữ)"],["爱心","àixīn","lòng nhân ái"],["爱护","àihù","yêu quý, giữ gìn"],["爱惜","àixī","quý trọng"],["爱好","àihào","sở thích"]],trap:"⚠️ <span class='zh'>爱情</span> chỉ tình yêu nam nữ; tình cha mẹ là <span class='zh'>父母之爱 · 亲情</span>."},{k:"自",rule:"自 = <b>tự mình</b>. 自 + động/tính từ → hành động do bản thân (自动, 自信…).",w:[["自动","zìdòng","tự động"],["自豪","zìháo","tự hào"],["自觉","zìjué","tự giác"],["自私","zìsī","ích kỷ"],["自由","zìyóu","tự do"],["自愿","zìyuàn","tự nguyện"],["自信","zìxìn","tự tin"],["自费","zìfèi","tự túc chi phí"],["自夸","zìkuā","tự khoe"],["自救","zìjiù","tự cứu"],["亲自","qīnzì","đích thân"],["各自","gèzì","mỗi người tự"]],trap:"Từ mới trong bài: <span class='zh'>自主</span> (tự chủ) — <span class='zh'>独立自主</span>."},{k:"心",rule:"心 = <b>lòng, tim</b>. Tính/động từ + 心 → trạng thái tâm lý (放心, 伤心…); 心 + danh từ (心情, 心理…).",w:[["放心","fàngxīn","yên tâm"],["关心","guānxīn","quan tâm"],["小心","xiǎoxīn","cẩn thận"],["粗心","cūxīn","cẩu thả"],["开心","kāixīn","vui vẻ"],["耐心","nàixīn","kiên nhẫn"],["伤心","shāngxīn","đau lòng"],["专心","zhuānxīn","chuyên tâm"],["信心","xìnxīn","lòng tin"],["决心","juéxīn","quyết tâm"],["热心","rèxīn","nhiệt tình"],["心情","xīnqíng","tâm trạng"],["心理","xīnlǐ","tâm lý"],["心脏","xīnzàng","tim (cơ quan)"]],trap:"Từ mới trong bài: <span class='zh'>心疼</span> (xót xa) — 心 đứng <b>trước</b>."}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Khao khát tự lập và nỗi nhớ nhà",from:1,to:21},{name:"Nhóm 2 · Đoạn 3–4",sub:"Kỳ nghỉ không được về nhà",from:22,to:33},{name:"Nhóm 3 · Đoạn 5–7",sub:"Lần về nhà năm thứ ba",from:34,to:44}],V:[[1,"和蔼","hé'ǎi","tt.","hòa ái","hòa nhã, hiền hòa",1,"","态度温和，容易接近。","他们对我态度和蔼","新来的校长和蔼可亲，同学们都很喜欢他。","Thầy hiệu trưởng mới hiền hòa dễ gần, học sinh ai cũng quý.",["态度和蔼","和蔼可亲","和蔼的笑容"],"Thường dùng cho <b>người lớn tuổi, bề trên</b> đối với người dưới. So sánh <span class='zh'>和气</span> (từ 2) dùng rộng hơn."],[2,"和气","héqi","tt.","hòa khí","nhã nhặn, ôn tồn",1,"","态度温和；和睦。","说话和气","他说话总是和和气气的，从来不发火。","Anh ấy lúc nào nói năng cũng nhẹ nhàng, chưa bao giờ nổi nóng.",["说话和气","和和气气","一团和气","伤了和气"],"Còn là <b>danh từ</b> = hòa khí: <span class='zh'>别为这点儿小事伤了和气</span> (đừng vì chuyện nhỏ mà mất hòa khí)."],[3,"目光","mùguāng","dt.","mục quang","ánh mắt; tầm nhìn",1,"","视线；眼睛的神采；也比喻眼光、见识。","目光中都充满着慈祥 / 父母不舍的目光","大家的目光都集中在他身上。","Ánh mắt mọi người đều đổ dồn vào anh ấy.",["目光温柔","目光短浅","把目光投向……"],"Bài khóa dùng <span class='zh'>目光</span> ở <b>đoạn đầu và đoạn cuối</b> — kỹ thuật hô ứng đầu cuối. <span class='zh'>目光短浅</span> = tầm nhìn hạn hẹp."],[4,"慈祥","cíxiáng","tt.","từ tường","hiền từ, hiền hậu",1,"","（老年人的态度、神色）和蔼安详。","目光中都充满着慈祥","奶奶慈祥地看着我们，脸上满是笑容。","Bà hiền từ nhìn chúng tôi, mặt rạng rỡ nụ cười.",["慈祥的老人","慈祥的笑容","面容慈祥"],"Chỉ dùng cho <b>người lớn tuổi</b> (ông bà, cha mẹ). Không nói ✗<span class='zh'>慈祥的小姑娘</span>."],[5,"跨","kuà","đgt.","khóa","bước (dài); vượt qua",1,"","抬腿向前迈一大步；超越（时间、地区等的界限）。","在跨进大学校门之前","他一步跨过了小水沟。","Anh ấy bước một bước qua con mương nhỏ.",["跨进","跨过","跨国公司","跨年"],"<span class='zh'>跨进大学校门</span> = bước chân vào đại học. Nghĩa mở rộng: <span class='zh'>跨国</span> (xuyên quốc gia), <span class='zh'>跨年</span> (đón giao thừa)."],[6,"自主","zìzhǔ","đgt.","tự chủ","tự chủ, tự quyết",1,"","自己作主。","独立自主的能力","婚姻自主是法律保护的权利。","Tự do hôn nhân là quyền được pháp luật bảo vệ.",["独立自主","自主选择","自主权"],"<span class='zh'>不由自主</span> = không tự chủ được — gần nghĩa với <span class='zh'>不由得</span> (từ 43)."],[7,"甭","béng","phó.","—","khỏi, không cần",1,"口","“不用”的合音，表示不需要或劝阻。","就更甭提了 / 就甭回来了","这点儿小事，你就甭操心了。","Chuyện nhỏ này, anh khỏi phải bận tâm.",["甭提了","甭管","甭说"],"Chữ 甭 = 不 + 用 ghép lại, đọc liền thành <b>béng</b>. Xem <b>Ngữ pháp: ……就更甭提了</b>."],[8,"脱离","tuōlí","đgt.","thoát ly","thoát khỏi, rời khỏi",1,"","离开（某种环境或情况）；断绝（某种联系）。","脱离父母，独立生活","经过抢救，病人已经脱离了危险。","Sau khi cấp cứu, bệnh nhân đã qua cơn nguy hiểm.",["脱离危险","脱离实际","脱离关系","脱离父母"],"Tân ngữ thường là môi trường, tình trạng trừu tượng: <span class='zh'>危险 · 实际 · 群众</span>."],[9,"诱惑","yòuhuò","đgt.","dụ hoặc","cám dỗ; hấp dẫn",1,"","用手段引人做坏事；吸引，招引。","对我具有巨大的诱惑","面对金钱的诱惑，他一点儿也不动心。","Trước sự cám dỗ của đồng tiền, anh ấy không hề lay động.",["经不起诱惑","抵制诱惑","巨大的诱惑"],"Nghĩa 1 (xấu): dụ dỗ. Nghĩa 2 (trung tính): sức hút — bài dùng nghĩa 2, làm danh từ: <span class='zh'>具有巨大的诱惑</span>."],[10,"无比","wúbǐ","đgt.","vô tỉ","vô cùng, không gì sánh",1,"书","没有别的能够相比（多用于好的方面）。","让我无比向往","拿到录取通知书的那一刻，我无比激动。","Khoảnh khắc nhận giấy báo trúng tuyển, tôi vô cùng xúc động.",["无比激动","无比幸福","无比强大"],"Thường đứng <b>trước tính từ / động từ tâm lý hai âm tiết</b>, nghĩa tích cực. Văn viết hơn <span class='zh'>非常</span>."],[11,"向往","xiàngwǎng","đgt.","hướng vãng","mong mỏi, khao khát",1,"","因热爱、羡慕某种事物或境界而希望达到。",  thấu hiểu",1,"","设身处地为人着想，给以谅解。","埋怨父母不体谅我","父母工作很辛苦，我们应该体谅他们。","Bố mẹ làm việc vất vả, chúng ta nên thông cảm cho họ.",["体谅别人","互相体谅","很体谅"],"Xem <b>辨析 体谅—原谅</b>."],[27,"无精打采","wújīng-dǎcǎi","thành ngữ","vô tinh đả thái","ủ rũ, uể oải",1,"成","形容精神不振，提不起劲头。","无精打采了几天之后","他昨晚没睡好，今天上课一直无精打采的。","Tối qua cậu ấy ngủ không ngon, hôm nay lên lớp cứ ủ rũ.",["无精打采的样子","无精打采地……"],"Trái nghĩa: <span class='zh'>精神饱满 · 神采奕奕</span>. Bài tập 3①."],[28,"规划","guīhuà","đgt.","quy hoạch","lên kế hoạch",1,"","比较全面、长远的计划；做这样的计划。","开始规划怎样熬过漫长的假期","大学生应该早点儿规划自己的职业。","Sinh viên nên sớm lên kế hoạch nghề nghiệp cho mình.",["规划人生","城市规划","长远规划"],"<b>规划</b>: kế hoạch tổng thể, dài hạn; <b>计划</b>: dùng cho cả việc nhỏ."],[29,"熬","áo","đgt.","ngao","chịu đựng, cố vượt qua; nấu lâu",1,"","忍受（疼痛或艰苦的生活等）；久煮。","怎样熬过漫长的假期","最困难的日子终于熬过去了。","Những ngày khó khăn nhất cuối cùng cũng qua.",["熬夜","熬过去","熬粥","熬药"],"Nghĩa 1: nấu lâu (<span class='zh'>熬粥</span>). Nghĩa 2: chịu đựng — <span class='zh'>熬夜</span> thức khuya, <span class='zh'>熬过</span> vượt qua."],[30,"漫长","màncháng","tt.","mạn trường","dài dằng dặc",1,"","（时间、道路）很长，看不到尽头。","漫长的假期","经过漫长的等待，他终于收到了录取通知书。","Sau thời gian chờ đợi dài dằng dặc, cuối cùng cậu ấy nhận được giấy báo trúng tuyển.",["漫长的冬天","漫长的岁月","道路漫长"],"Mang cảm giác chủ quan <b>dài lê thê</b>, thường đi với chờ đợi, chịu đựng."],[31,"寂静","jìjìng","tt.","tịch tĩnh","vắng lặng",1,"书","没有声音；很静。","假期的校园寂静得很 / 难得的寂静","夜深了，四周一片寂静。","Đêm đã khuya, xung quanh vắng lặng.",["一片寂静","寂静的夜晚","打破寂静"],"<b>寂静</b>: không một tiếng động, hơi quạnh hiu; <b>安静</b>: trung tính, dùng được cho người (<span class='zh'>安静点儿</span>)."],[32,"稿件","gǎojiàn","dt.","cảo kiện","bài viết, bản thảo",1,"书","作者交给出版社、报刊等的作品。","给杂志社写稿件","这篇稿件已经被杂志社录用了。","Bài viết này đã được tạp chí nhận đăng.",["写稿件","审稿件","投稿"],"<span class='zh'>投稿</span> = gửi bài cho báo (có trong bài nghe SBT câu 4)."],[33,"难得","nándé","tt.","nan đắc","hiếm có, khó có được",1,"","不容易得到或做到（有可贵意）；不常常。","在难得的寂静中工作","这是一次难得的机会，你一定要抓住。","Đây là cơ hội ,"眼角越来越深的皱纹","爷爷的脸上布满了皱纹。","Mặt ông nội đầy nếp nhăn.",["长皱纹","皱纹很深","满脸皱纹"],"皱 còn là động từ: <span class='zh'>皱眉头</span> (nhíu mày)."],[42,"顿时","dùnshí","phó.","đốn thời","lập tức, ngay lúc đó",1,"书","立刻，一下子（多用于叙述过去的事情）。","顿时什么都明白了","听到这个好消息，大家顿时欢呼起来。","Nghe tin vui này, mọi người lập tức reo hò.",["顿时明白","顿时安静下来"],"Xem <b>Ngữ pháp 2</b>. Chỉ dùng kể chuyện <b>đã xảy ra</b>."],[43,"不由得","bùyóude","phó.","—","bất giác, không kìm được",1,"","不禁；控制不住自己。","不由得热泪盈眶","听到这首歌，我不由得想起了大学时光。","Nghe bài hát này, tôi bất giác nhớ lại thời đại học.",["不由得笑了","不由得想起","不由得担心"],"Xem <b>Ngữ pháp 3</b>."],[44,"热泪盈眶","rèlèi yíng kuàng","thành ngữ","nhiệt lệ doanh khuông","nước mắt lưng tròng",1,"成","眼泪充满眼眶，形容非常感动或激动。","不由得热泪盈眶","看到失散多年的亲人，老人热泪盈眶。","Gặp lại người thân thất lạc nhiều năm, cụ già rưng rưng nước mắt.",["感动得热泪盈眶","激动得热泪盈眶"],"Thường là nước mắt <b>xúc động</b>, không phải đau buồn. Hay làm bổ ngữ: <span class='zh'>感动得热泪盈眶</span>."]],extra:[["感情和睦","gǎnqíng hémù","tình cảm hòa thuận (和睦 — bài 1)"],["宠爱","chǒng'ài","cưng chiều"],["独立自主","dúlì zìzhǔ","độc lập tự chủ"],["节假日","jiéjiàrì","ngày lễ, ngày nghỉ"],["恋家情绪","liànjiā qíngxù","tâm trạng nhớ nhà"],["兼职","jiānzhí","việc làm thêm"],["暗暗","àn'àn","thầm, trong lòng"],["一丝疑惑","yì sī yíhuò","một thoáng nghi ngờ"],["享福","xiǎng fú","hưởng phúc, sống sung sướng"],["不舍","bùshě","không nỡ, lưu luyến"],["新增的白发","xīnzēng de báifà","tóc bạc mới thêm"]],T:[{zh:"我从小生活在一个有爱的家庭，父母感情和睦，很少吵架，他们对我态度和蔼，说话和气，目光中都充满着慈祥。他们和我身边所有父母一样，给我很多宠爱，我也和身边所有的孩子一样，在跨进大学校门之前，从没有离开过家，独立自主的能力就更甭提了。脱离父母，独立生活对我具有巨大的诱惑，让我无比向往。",vn:"Từ nhỏ tôi đã sống trong một gia đình đầy yêu thương: bố mẹ tình cảm hòa thuận, hiếm khi cãi nhau, đối với tôi luôn hiền hòa, nói năng nhỏ nhẹ, ánh mắt chan chứa sự hiền từ. Cũng như mọi bậc cha mẹ quanh tôi, họ dành cho tôi rất nhiều cưng chiều; và tôi cũng như mọi đứa trẻ quanh mình, trước khi bước chân vào cổng trường đại học chưa từng rời nhà lần nào, còn khả năng tự lập tự chủ thì càng khỏi phải nói. Thoát khỏi bố mẹ, sống độc lập có sức hấp dẫn cực lớn với tôi, khiến tôi khao khát vô cùng.",idea:"Lớn lên trong yêu thương, chưa từng tự lập — nên rất khao khát sống độc lập.",q:["“我”的家庭是什么样的？","上大学以前，“我”的独立能力怎么样？为什么向往独立生活？"],note:[["他们和我身边所有父母一样，……我也和身边所有的孩子一样，……","Hai vế song song <span class='zh'>和……一样</span>: cha mẹ “giống mọi cha mẹ”, tôi “giống mọi đứa trẻ” → câu chuyện mang tính phổ biến."],["独立自主的能力就更甭提了","<span class='zh'>……就更甭提了</span> = …thì càng khỏi nói (điều sau còn rõ ràng hơn điều trước). Xem Ngữ pháp."]]},{zh:"几年以后，我终于在别的城市上了大学。第一次离开家，心里的孤独感一下子跑了出来。记得刚开学的时候，宿舍里的同学一给家里打电话就哭鼻子，每到节假日，大家更是片刻不停地往家赶。有同学回趟家要坐一夜的火车，这也阻挡不了大家回家的步伐。回家的快乐和被亲情包围的幸福感染了我，我也恨不得马上飞到父母跟前，与他们团圆。",vn:"Mấy năm sau, cuối cùng tôi cũng vào đại học ở một thành phố khác. Lần đầu xa nhà, nỗi cô đơn trong lòng bỗng chốc trào lên. Nhớ hồi mới khai giảng, bạn cùng phòng hễ gọi điện về nhà là khóc nhè; mỗi dịp lễ, mọi người lại càng không ngơi nghỉ phút nào mà vội vã về nhà. Có bạn về một chuyến phải ngồi tàu cả đêm, cũng chẳng cản được bước chân về nhà. Niềm vui về nhà và hạnh phúc được tình thân bao bọc lây sang cả tôi, tôi cũng chỉ mong được bay ngay về bên bố mẹ, sum họp với họ.",idea:"Lên đại học xa nhà: cô đơn, nhìn bạn bè về nhà mà nóng lòng muốn về.",q:["刚开学时，宿舍里的同学是什么样的？","“我”为什么也恨不得马上回家？"],note:[["一给家里打电话就哭鼻子，每到节假日，大家更是……","Mẫu <span class='zh'>一……就……</span> + <span class='zh'>每到……，更是……</span> — xem <b>Bài tập 4①</b>."],["这也阻挡不了大家回家的步伐","<span class='zh'>这也……不了……</span> = điều đó cũng không… nổi (nhượng bộ). <span class='zh'>步伐</span> dùng nghĩa bóng."]]},{zh:"假期终于要到了，我给父母打电话，告诉他们我准备回家。母亲却说，近来他们比较忙，要没什么事，就甭回来了，在学校看看书，或找份兼职做做。母亲的话使我酝酿已久的恋家情绪刹那间就没有了，我无法理解父母的反常，心中暗暗埋怨父母不体谅我。无精打采了几天之后，我不得不开始规划怎样熬过漫长的假期。",vn:"Kỳ nghỉ cuối cùng cũng sắp đến, tôi gọi điện cho bố mẹ báo là chuẩn bị về. Nhưng mẹ lại nói, dạo này bố mẹ khá bận, nếu không có việc gì thì khỏi về, ở trường đọc sách, hoặc tìm việc làm thêm. Lời mẹ khiến nỗi nhớ nhà ấp ủ bấy lâu của tôi tan biến trong giây lát. Tôi không sao hiểu nổi sự khác thường của bố mẹ, thầm trách họ không thông cảm cho mình. Sau mấy ngày ủ rũ, tôi đành phải bắt đầu lên kế hoạch làm sao để chịu đựng qua kỳ nghỉ dài dằng dặc.",idea:"Mẹ bảo đừng về — “tôi” hụt hẫng, trách bố mẹ.",q:["母亲为什么不让“我”回家？","听了母亲的话，“我”心里怎么样？"],note:[["要没什么事，就甭回来了","<span class='zh'>要</span> = <span class='zh'>要是</span> (nếu). <span class='zh'>甭</span> = <span class='zh'>不用</span> — lời mẹ nói rất khẩu ngữ, nhẹ tênh, che giấu cảm xúc thật."],["母亲的话使我……刹那间就没有了","Câu kiêm ngữ <span class='zh'>A 使 B + V</span>: lời mẹ khiến nỗi nhớ nhà biến mất."],["我不得不开始规划怎样熬过……","<span class='zh'>不得不</span> = đành phải; <span class='zh'>熬过</span> cho thấy kỳ nghỉ là sự chịu đựng."]]},{zh:"假期的校园寂静得很，我在图书馆看书，给杂志社写稿件，发现在难得的寂静中工作是那么美好。",vn:"Sân trường kỳ nghỉ vắng lặng vô cùng. Tôi đọc sách ở thư viện, viết bài cho tạp chí, và phát hiện ra làm việc trong sự tĩnh lặng hiếm có là điều tuyệt vời biết bao.",idea:"Ở lại trường, tìm thấy niềm vui làm việc trong yên tĩnh — “tôi” bắt đầu thay đổi.",q:["假期里“我”在学校做了什么？有什么发现？"],note:[["寂静得很","<span class='zh'>Adj + 得很</span> = rất… (khẩu ngữ, nhấn mạnh)."]]},{zh:"大学三年级，我回了趟家。母亲第一眼看到我时，脸上满是心疼，但瞬间那情绪就被她掩饰起来，我心中飞快地闪过一丝疑惑：他们在隐瞒什么呢？",vn:"Năm ba đại học, tôi về nhà một chuyến. Lần đầu nhìn thấy tôi, mặt mẹ đầy vẻ xót xa, nhưng chỉ trong tích tắc cảm xúc ấy đã bị mẹ giấu đi. Trong lòng tôi thoáng lóe lên một nghi ngờ: bố mẹ đang giấu điều gì vậy?",idea:"Về nhà, thấy mẹ vội che giấu sự xót xa — “tôi” nghi ngờ.",q:["母亲看到“我”时表情有什么变化？","“我”为什么产生了疑惑？"],note:[["脸上满是心疼，但瞬间那情绪就被她掩饰起来","Câu bị động <span class='zh'>被 + 她 + 掩饰起来</span>. Chi tiết <b>mẹ giấu cảm xúc</b> là “manh mối” cho đoạn kết."]]},{zh:"那晚，我躺下怎么也睡不着，半夜听到母亲还在跟父亲唠叨：“孩子比在家时瘦多了，肯定是吃苦了，可她的变化还是挺让咱们欣慰的。”接着是父亲的声音：“总有一天她会明白的，不吃苦，怎么长本事？社会不需要只会享福的人。”",vn:"Đêm ấy, tôi nằm mãi không sao ngủ được. Nửa đêm nghe mẹ vẫn còn rủ rỉ với bố: “Con gầy hơn hồi ở nhà nhiều quá, chắc là chịu khổ rồi, nhưng sự thay đổi của con vẫn khiến chúng mình mừng lắm.” Tiếp đó là giọng bố: “Rồi sẽ có ngày con hiểu thôi. Không chịu khổ thì sao có bản lĩnh? Xã hội không cần những người chỉ biết hưởng sung sướng.”",idea:"Nghe lỏm bố mẹ nói chuyện — sự thật: bố mẹ cố tình để con tự lập.",q:["母亲对“我”的变化是什么态度？","父亲为什么说“总有一天她会明白的”？"],note:[["肯定是吃苦了，可她的变化还是挺让咱们欣慰的","Mẫu <span class='zh'>肯定是……，可……</span> — đoán nguyên nhân rồi chuyển ý. Xem <b>Bài tập 4②</b>."],["不吃苦，怎么长本事？","Câu hỏi tu từ <span class='zh'>不……，怎么……？</span> = không… thì không thể… Xem Ngữ pháp."]]},{zh:"我悄悄走出卧室，看到灯光下父母不舍的目光、头上新增的白发和眼角越来越深的皱纹，顿时什么都明白了，不由得热泪盈眶。",vn:"Tôi lặng lẽ bước ra khỏi phòng ngủ, nhìn thấy dưới ánh đèn ánh mắt lưu luyến của bố mẹ, những sợi tóc bạc mới thêm và nếp nhăn nơi khóe mắt ngày càng sâu — bỗng chốc tôi hiểu ra tất cả, nước mắt bất giác dâng đầy.",idea:"Vỡ lẽ: tình yêu của cha mẹ là “giả vờ không lo” để con trưởng thành.",q:["“我”看到了什么？明白了什么？","你觉得题目《父母之爱》中的“爱”指什么？"],note:[["看到灯光下父母不舍的目光、头上新增的白发和眼角越来越深的皱纹","Tân ngữ là chuỗi ba cụm danh từ dài — miêu tả cận cảnh, giàu cảm xúc."],["顿时什么都明白了，不由得热泪盈眶","<span class='zh'>顿时</span> (lập tức) + <span class='zh'>不由得</span> (không kìm được) — hai từ trọng điểm của bài trong một câu."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ chỉ động tác",G:[{id:"g1",grp:0,word:"恨不得",zh:"恨不得",py:"hènbude",tag:"Chú thích 1 · động từ",mean:"Động từ, biểu thị <b>nóng lòng mong làm ngay được việc gì</b> — “chỉ hận không thể…”. Thường dùng cho những việc <b>thực tế không làm được</b> (cách nói phóng đại).",forms:["S + 恨不得 + V (马上 / 一下子 / 立刻……)","S + 恨不得 + mệnh đề phóng đại"],ex:[["工作忙的时候，她恨不得一个人干两个人的活儿。","Lúc công việc bận, cô ấy chỉ hận không thể một mình làm việc của hai người."],["他累坏了，恨不得一下子倒在床上，睡上三天三夜。","Anh ấy mệt rã rời, chỉ muốn đổ ngay xuống giường ngủ ba ngày ba đêm."],["回家的快乐和被亲情包围的幸福感染了我，我也恨不得马上飞到父母跟前，与他们团圆。","Niềm vui về nhà và hạnh phúc được tình thân bao bọc lây sang tôi, tôi chỉ mong bay ngay về bên bố mẹ, sum họp với họ.",1]],tips:["So sánh <span class='zh'>巴不得</span> (bài 1): <b>巴不得</b> = mong điều <b>có thể xảy ra</b> (<span class='zh'>我们巴不得呢</span>); <b>恨不得</b> thiên về điều <b>không thể làm được</b>, giọng phóng đại (<span class='zh'>恨不得飞回去</span>).","Không có dạng phủ định ✗<span class='zh'>不恨不得</span>.","Sau <span class='zh'>恨不得</span> phải là động từ / mệnh đề, không dùng danh từ đơn."],practice:{q:"完成句子",type:"complete",items:[["听到这个消息，他难受得不得了，恨不得________。","听到这个消息，他难受得不得了，恨不得马上大哭一场。"],["他饿极了，恨不得________。","他饿极了，恨不得一口气吃下三碗饭。"],["我又看了看表，它好像根本就没往前走，我真恨不得把表________。","我又看了看表，它好像根本就没往前走，我真恨不得把表拨快一个小时。"]]}},{id:"g2",grp:0,word:"甭",zh:"……，……就更甭提了",py:"jiù gèng béng tí le",tag:"Mẫu câu khẩu ngữ (đoạn 1)",mean:"Nêu một việc trước, rồi nói việc sau <b>càng hiển nhiên hơn, khỏi cần nói</b> — “…thì càng khỏi phải nói”. <span class='zh'>甭提</span> = <span class='zh'>别提 / 不用说</span>.",forms:["A（mức dễ hơn）+ 都 / 也 + 不 / 没……，B（mức khó hơn）+ 就更甭提了"],ex:[["在跨进大学校门之前，从没有离开过家，独立自主的能力就更甭提了。","Trước khi vào đại học chưa từng xa nhà, khả năng tự lập thì càng khỏi nói.",1],["他连自行车都不会骑，开汽车就更甭提了。","Xe đạp anh ấy còn không biết đi, lái ô tô thì càng khỏi nói."],["这道题老师都做不出来，我们就更甭提了。","Bài này thầy còn không giải được, chúng tôi thì càng khỏi nói."]],tips:["Thường đi với <span class='zh'>连……都……</span> ở vế trước.","Văn viết dùng <span class='zh'>更不用说……了 / 更谈不上……</span>.","<span class='zh'>甭</span> còn dùng khuyên ngăn: <span class='zh'>你甭管</span> (anh đừng lo / đừng xen vào)."]},{id:"g3",grp:2,word:"顿时",zh:"顿时",py:"dùnshí",tag:"Chú thích 2 · phó từ",mean:"Phó từ, biểu thị động tác, sự việc <b>xảy ra ngay lập tức</b> trong một tình huống hoặc ngay sau một việc khác. Thường dùng trong <b>văn viết</b>, kể chuyện <b>đã xảy ra</b>.",forms:["Nguyên nhân / tình huống，S + 顿时 + V / Adj","……，顿时，S + V（đứng đầu vế câu）"],ex:[["傍晚，我们在大山里迷路了，……大家拿出手机看了看，居然都快没电了，两个女生顿时急得哭了起来。","Chiều tối chúng tôi lạc trong núi… mọi người lấy điện thoại ra xem, hóa ra đều sắp hết pin, hai bạn nữ lập tức cuống đến bật khóc."],["我悄悄走出卧室，看到灯光下父母不舍的目光、头上新增的白发和眼角越来越深的皱纹，顿时什么都明白了。","Tôi lặng lẽ ra khỏi phòng… bỗng chốc hiểu ra tất cả.",1],["听了医生的话，顿时，他的心里又燃起了希望。","Nghe bác sĩ nói, ngay lập tức trong lòng anh lại nhen lên hy vọng."]],tips:["<b>顿时</b> chỉ dùng cho việc <b>đã xảy ra</b>: ✗<span class='zh'>明天你顿时就明白了</span> → <span class='zh'>马上 / 立刻</span>.","Nhóm từ “rất ngắn”: <span class='zh'>顿时</span> (phó từ, trước động từ) · <span class='zh'>刹那 / 片刻 / 瞬间</span> (danh từ: <span class='zh'>刹那间、片刻之后、一瞬间</span>).","Hay đi với kết quả bất ngờ: <span class='zh'>顿时安静下来 · 顿时明白了 · 顿时哭了起来</span>."],practice:{q:"用“顿时”改写句子",items:[["听她这么一说，我立刻没了主意。","听她这么一说，我顿时没了主意。"],["一场大雨过后，我们要经过的那条公路断路了，计划好的旅行不能成行，孩子立刻急哭了。","一场大雨过后，我们要经过的那条公路断路了，计划好的旅行不能成行，孩子顿时急哭了。"],["专题讲座就要开始了，深受大家喜爱的老教授走上了讲台，马上，会场变得鸦雀无声。","专题讲座就要开始了，深受大家喜爱的老教授走上了讲台，顿时，会场变得鸦雀无声。"]]}},{id:"g4",grp:2,word:"不由得",zh:"不由得",py:"bùyóude",tag:"Chú thích 3 · phó từ",mean:"Phó từ, biểu thị <b>không kiểm soát được bản thân, không kìm được</b>. Phía trước thường có <b>nguyên nhân</b> khiến không thể kìm nén.",forms:["Nguyên nhân，S + 不由得 + V / cụm động từ","Nguyên nhân，不由得 + S + V（cụm chủ vị）"],ex:[["李朋带病上场参加比赛了，我不由得有些担心。","Lý Bằng mang bệnh ra sân thi đấu, tôi không khỏi có chút lo lắng."],["书中描写的情景，让我不由得回想起和圆圆谈恋爱时的幸福和快乐。","Cảnh trong sách khiến tôi bất giác nhớ lại hạnh phúc hồi yêu Viên Viên."],["我悄悄走出卧室，……顿时什么都明白了，不由得热泪盈眶。","…bỗng chốc hiểu ra tất cả, nước mắt bất giác dâng đầy.",1]],tips:["Đồng nghĩa: <span class='zh'>不禁 · 忍不住 · 情不自禁 · 不由自主</span>.","Sau <span class='zh'>不由得</span> thường là động từ tâm lý hoặc phản ứng tự nhiên: <span class='zh'>担心、想起、笑、哭、鼓掌</span>.","Cũng có nghĩa “không thể không”: <span class='zh'>他说得这么诚恳，不由得你不信</span>."],practice:{q:"用“不由得”改写句子",items:[["山路窄窄的，还不平，车开得飞快，我们坐在车上难免有些担心。","山路窄窄的，还不平，车开得飞快，我们坐在车上不由得有些担心。"],["第一次上台，我的心里不免有些发慌。","第一次上台，我的心里不由得有些发慌。"],["表演太精彩了，大家情不自禁地鼓起掌来。","表演太精彩了，大家不由得鼓起掌来。"]]}},{id:"g5",grp:2,word:"",zh:"不……，怎么……？",py:"",tag:"Câu hỏi tu từ (đoạn 6)",mean:"Câu hỏi tu từ biểu thị <b>điều kiện tất yếu</b>: không làm A thì không thể có B. Mạnh hơn câu khẳng định <span class='zh'>只有……才……</span>.",forms:["不 + V₁，怎么 + V₂？ = 只有 V₁，才能 V₂"],ex:[["总有一天她会明白的，不吃苦，怎么长本事？","Rồi có ngày con sẽ hiểu, không chịu khổ thì sao có bản lĩnh?",1],["不努力学习，怎么能考上好大学？","Không chăm học thì sao đỗ được đại học tốt?"],["不试一试，怎么知道自己不行？","Không thử thì sao biết mình không làm được?"]],tips:["Đổi sang câu khẳng định: <span class='zh'>只有吃苦，才能长本事。</span>","Dùng nhiều trong bài nói, bài viết nghị luận để tăng sức thuyết phục."]}],BX:{grp:1,word:"体谅",cols:["体谅","原谅"],pair:"体谅 — 原谅",same:["Đều là <b>động từ</b>, đều có nghĩa <b>cảm thông, lượng thứ</b> cho người khác, nhưng thường <b>không thay thế cho nhau</b>.","请你体谅我。（hãy hiểu cho hoàn cảnh của tôi） ≠ 请你原谅我。（hãy tha lỗi cho tôi）"],diff:[["Nhấn <b>đặt mình vào hoàn cảnh người khác</b> (设身处地为人着想) mà thông cảm. Trước có thể thêm phó từ mức độ <span class='zh'>很、非常</span>.","我的家离公司很远，孩子又小，老板很体谅我，允许我晚半个小时上班。","Nhấn <b>bỏ qua sơ suất, lỗi lầm</b>, không trách phạt. Trước thường <b>không</b> thêm phó từ mức độ.<div class='zh' style='margin-top:4px'>昨天我没写完作业，是因为我病了，所以老师原谅了我。</div>"],["Có thể <b>lặp lại</b>: ABAB.","他家确实有特殊情况，你就体谅体谅他吧。","Thường <b>không lặp lại</b>: ✗<span class='zh'>原谅原谅</span>."]],task:{q:"选择“体谅”或“原谅”填空",cols:["体谅","原谅"],sample:!1,items:[["妈妈，____我吧，我不是故意的，下次一定不这样了。",1,"Có lỗi (<span class='zh'>不是故意的</span>) → xin tha thứ: 原谅."],["他太不____我了，我又要工作又要做家务，他还批评我干得慢。",0,"Hoàn cảnh vất vả cần được hiểu; trước có <span class='zh'>太不</span> → 体谅."],["小丽是个善良的女孩，很能____别人。",0,"<span class='zh'>很能 + 体谅</span> — biết đặt mình vào chỗ người khác."],["虽然这次我____了他，但他并没有就此改正自己的错误。",1,"Có <span class='zh'>错误</span> → bỏ qua lỗi: 原谅."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["<u>和</u>蔼","和睦 · 和气 · 和平 · 心平气和"],items:[["脱<u>离</u>","离","分离 · 离婚 · 离别 · 离开"],["<u>无</u>比","无","无奈 · 无法 · 无论 · 无可厚非"],["吃<u>苦</u>","苦","艰苦 · 辛苦 · 劳苦 · 苦心经营"],["顿<u>时</u>","时","时间 · 时候 · 时差 · 暂时"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["我喜欢旅行，________。","向往","我喜欢旅行，一直向往着能去世界各地看一看。"],["那家饭馆的环境很不好，顾客们________。","埋怨","那家饭馆的环境很不好，顾客们都埋怨饭馆又吵又脏。"],["看到这么精彩的表演，大家________。","不由得","看到这么精彩的表演，大家不由得鼓起掌来。"],["中秋节，全家团圆在一起，妈妈________。","无比","中秋节，全家团圆在一起，妈妈感到无比幸福。"],["一天没吃饭，我饿坏了，________。","恨不得","一天没吃饭，我饿坏了，恨不得一口气吃下一整只烤鸭。"],["他丢了工作，但怕妈妈担心，所以________。","隐瞒","他丢了工作，但怕妈妈担心，所以一直向妈妈隐瞒着这件事。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["无精打采","隐瞒","反常","热泪盈眶","不由得"],text:"最近我的朋友小李有些{反常}，每天都{无精打采}的，他以前可是非常开朗的啊。我{不由得}担心起他来。于是我找了个机会跟他说：“如果你遇到了什么困难，千万别{隐瞒}，告诉我，我们一起想办法解决吧！”听了我的话，小李感动得{热泪盈眶}。"},{bank:["酝酿","埋怨","近来","顿时","体谅"],text:"{近来}公司的事情比较多，我{酝酿}已久的旅行也只能放弃了。心中暗暗{埋怨}老板太不{体谅}员工了。但反过来一想，只有公司发展好了，我们才会有更好的未来。于是，那些不满的情绪{顿时}消失了。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"<u>记得</u>刚开学的时候，宿舍里的同学<u>一</u>给家里打电话<u>就</u>哭鼻子，<u>每到</u>节假日，大家<u>更是</u>片刻不停地往家赶。……回家的快乐和被亲情包围的幸福感染了我，我也<u>恨不得</u>马上飞到父母跟前，与他们团圆。",task:"记得______的时候，我一______就______，每到______，我更是______。那些下班后急急忙忙赶回家的人们感染了我，我也恨不得______。",model:"记得刚到北京工作的时候，我一想起家就难过，每到周末，我更是想家想得睡不着觉。那些下班后急急忙忙赶回家的人们感染了我，我也恨不得马上买张机票飞回家去。"},{src:"“孩子比在家时瘦多了，<u>肯定是</u>吃苦了，<u>可</u>她的变化还是挺让咱们欣慰的。”",task:"他现在开着豪华汽车，全身上下都是名牌，肯定是______，可______。",model:"他现在开着豪华汽车，全身上下都是名牌，肯定是赚了不少钱，可他看起来并不快乐。"}]},DP:{title:"词汇：看图片，熟悉下列表示动作的词语",vn:"Nhóm động từ chỉ động tác tay, vai, thân — rất hay gặp trong phần <b>đọc</b> và <b>viết lại</b> của HSK6. Bấm 🔊 để nghe câu mẫu, thử làm động tác khi đọc.",items:[["掰","bāi","bẻ (bằng tay)","掰开 / 掰成两半","把面包掰开。"],["鞠躬","jū gōng","cúi chào","鞠了一个躬","孩子给父母鞠躬。"],["搀","chān","dìu, đỡ","搀扶 / 搀着","搀着老人过马路。"],["扛","káng","vác (trên vai)","扛着箱子 / 扛起责任","他扛着一个箱子。"],["飞翔","fēixiáng","bay lượn","展翅飞翔 / 自由飞翔","天空中有一只飞翔的鸟儿。"],["啃","kěn","gặm, cắn","啃骨头 / 啃苹果","孩子在啃苹果。"],["搅拌","jiǎobàn","khuấy, trộn","搅拌均匀","把碗里的鸡蛋搅拌一下。"],["挎","kuà","khoác (trên cánh tay)","挎着包 / 挎包","她胳膊上挎着很多包。"],["敬礼","jìng lǐ","chào (theo nghi thức)","向……敬礼 / 举手敬礼","他们在给领导敬礼。"],["晾","liàng","phơi","晾衣服 / 晾干","外面晾着几件衣服。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"夜深了，我还在熬夜，为了准备考试，没有片刻的休息。一阵轻轻的脚步声，爸爸来到了我的身旁，轻声对我说：“渴了吧？”我回头，看到爸爸慈祥的目光，“爸爸，您还没睡？”他点点头。我喝了一口温热的牛奶，顿时，幸福传遍了我的全身。",o:["爸爸为人很和气","爸爸也喜欢夜读","爸爸非常关心我","睡前应该喝牛奶"],a:2,why:"Bố thức khuya mang sữa cho “tôi”, hỏi “渴了吧？” → bố rất quan tâm tôi."},{n:2,say:"王先生是师范大学教育学院的教授，兼任《中国家庭教育》杂志的主编，还是中国教育学会家庭教育专业委员会理事长。作为中国当代家庭教育研究的开拓者，他在家庭教育理论与实践的研究上做出过很多贡献。",o:["王先生是搞家庭教育研究的","王先生喜欢看家庭教育杂志","王先生创办了家庭教育专业","《中国家庭教育》办得不错"],a:0,why:"“作为中国当代家庭教育研究的开拓者” → ông nghiên cứu giáo dục gia đình."},{n:3,say:"家庭教育是学校教育与社会教育的基础，在人的一生中起着重要的作用。据研究，目前我国将近70%的家庭教育方式不够好，因此，转变家庭教育观念，提高家庭教育水平是家长必须认真面对的问题。",o:["中国70%的家长不重视教育","中国不少家庭教育存在问题","多数家长教育观念十分先进","学校教育是家庭教育的基础"],a:1,why:"“将近70%的家庭教育方式不够好” → nhiều gia đình có vấn đề. (A sai: không phải “không coi trọng”; D đảo ngược quan hệ.)"},{n:4,say:"漫长的暑假就要开始了。怎样度过这个假期，在同学们的心中酝酿了很久。有人想脱离父母的视线，找个寂静之处，享受一下孤独；有人想寻找打工的机会；有人想尝试给报刊、杂志投投稿，检验一下自己的本事；也有人禁不住旅游的诱惑，恨不得立刻投入大自然的怀抱。",o:["同学们的父母都想团圆","有人想隐瞒自己的事情","想投稿的同学都很孤独","假期有同学打算去旅游"],a:3,why:"“也有人禁不住旅游的诱惑” → có bạn định đi du lịch."},{n:5,say:"我尊重我的父母，他们虽然学历不高，但是和蔼可亲，心地善良，更难得的是，他们总是告诉我要宽容，不要总想着别人的缺点，总想改变别人，要站在对方的立场上为别人着想，多体谅他人。",o:["父母教育“我”好好读书","“我”的父母念书不太多","父母改变了“我”的一切","父母认为“我”没有缺点"],a:1,why:"“他们虽然学历不高” = bố mẹ học không nhiều."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：今天我们很荣幸请到了教育方面的专家李老师和大家一起聊聊“啃老族”的问题。李老师，近来我们常听人说起“啃老族”，“啃老族”指的是些什么样的人呢？\n男：指那些不升学、不就业、不进修，终日无所事事，有谋生能力，却还靠父母供养的年轻人。\n女：这样一个族群是怎么产生的呢？\n男：“啃老族”产生的原因是多方面的。比如，经济不景气，社会对就业的吸纳能力不足，年轻人找不到理想的工作，也有的是年轻人对工作的要求比较高，自身的学历、知识水平却不怎么过硬，又怕吃苦，不愿出去工作养活自己，于是选择了啃老。\n女：“啃老族”的出现，是不是也和家庭教育有关系呢？\n男：那当然，父母的责任也是不可逃脱的，对孩子溺爱的家庭才会出“啃老族”。在孩子成长过程中，父母没有教会他们做人要有独立精神，没有教会孩子怎样规划人生。当然，社会原因也是有的，如前边提到的经济不够景气，年轻人就业压力大，他们找不到工作，只能选择“啃老”。\n女：“啃老族”的出现，对家庭、对社会的影响是很负面的哈。\n男：是，“啃老族”会使很多家庭出现矛盾，也会使原本能够生活得很幸福的家庭失去幸福的根基，“啃老族”的问题将成为未来影响家庭生活的“第一杀手”。特别是在中国已进入老年社会的今天，“啃老族”必将带来更多的社会问题。\n女：那“啃老族”的问题应该怎么解决呢？\n男：年轻人要独立自主，这种精神的树立除了要有正确的人生观、价值观，社会也应该为他们创造适合的工作机会。与其让父母养活“啃老族”，不如给他们工作岗位，让他们成为有能力养活父母的“养老族”。",qs:[{n:6,q:"“啃老族”的特点是什么？",o:["整天闲着不干事","失去了学习机会","家里经济条件好","没有能力养活自己"],a:0,why:"“终日无所事事” = cả ngày không làm gì. (D sai: họ “有谋生能力”.)"},{n:7,q:"以下哪一项是“啃老族”产生的原因？",o:["年轻人缺少工作能力","年轻人学的知识太少","父母愿意掏钱养活他们","社会提供的工作机会不足"],a:3,why:"“社会对就业的吸纳能力不足” = xã hội thiếu việc làm."},{n:8,q:"“啃老族”的出现和家庭教育哪方面的问题有关？",o:["父母过分宠爱孩子","父母做事不负责任","父母缺少独立精神","父母不替孩子规划"],a:0,why:"“对孩子溺爱的家庭才会出‘啃老族’” — 溺爱 = cưng chiều quá mức."},{n:9,q:"“啃老族”的负面影响是什么？",o:["经济不景气","家庭不和谐","社会不安定","老人不健康"],a:1,why:"“会使很多家庭出现矛盾” → gia đình không hòa thuận."},{n:10,q:"怎样解决“啃老族”的问题？",o:["提高年轻人的能力，让他们学习","让有能力的人给年轻人工作机会","让年轻人树立正确的人生观、价值观","父母要给“啃老族”存下足够的钱"],a:2,why:"“要有正确的人生观、价值观”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"读大三的小孙每年都会利用寒暑假做不同类型的打工工作。“我想锻炼一下自己，学点儿与人交流的技巧，顺便赚点儿生活费。”小孙笑着说。\n这个充满活力的女生告诉记者，这并不是她的第一份打工工作，之前在快餐店做过收银，在外语培训机构做过电话咨询。通过一次次不同的工作经历，小孙渐渐学会了如何与不同的人交流，特别是面对挑剔的消费者，如何让对方消火，化解危机，小孙有了自己的心得。“一味地谦让是不行的，要在与对方的交流中让他们认识到自己的不足，同时还要给对方台阶下，这样才能化解矛盾。这些都是在学校学不到的东西，我感觉自己在工作中成长了很多。”小孙跟记者谈到打工的收获时，脸上不由得满是兴奋。",qs:[{n:11,q:"关于小孙选择打工工作，下列哪项正确？",o:["不愿意在快餐店工作","最喜欢做商店收银员","做过很多不同的工作","在外语培训机构上过课"],a:2,why:"“每年都会……做不同类型的打工工作”."},{n:12,q:"小孙在与人交流方面有什么心得？",o:["有的消费者很难交流","吵架的时候没必要谦让","对不讲理的人就不用客气","解决矛盾时要给对方留面子"],a:3,why:"“还要给对方台阶下” = cho đối phương bậc thang để xuống = giữ thể diện."},{n:13,q:"小孙打工最大的收获是什么？",o:["能够自己赚生活费了","每天能顺便锻炼身体","每个假期都过得开心","能学到课本外的东西"],a:3,why:"“这些都是在学校学不到的东西”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"随着旅游旺季的到来，小岛上的餐厅变得异常忙碌。与往年不同的是，这里大大小小餐厅的打工者除了中老年人，就是18岁以下的年轻人，往年忙里忙外的大学生不见了踪影。啤酒屋老板分析说：“以前确实有不少大学生会来店里找工作，现在是越来越少了，可能是大家生活好了，家长舍不得吧。”对这种现象，大学生却另有解释：现在打工的大学生比以前多多了，只是大家不干饭店服务员了。服务员、促销员等工作太简单，对自身能力提升有限，难以吸引大学生。即使挣钱也不值得浪费时间。\n王新在一家咖啡吧打工，性格开朗的她说自己喜欢这里的工作环境，可以和来自全国，甚至全世界的游客聊天儿，还可以学习冲泡咖啡的手艺。王新计划毕业后也开一家创意咖啡馆。\n与王新的悠闲相比，张海涛则忙碌了许多。他和同伴合开了一家特色纪念品小店，他们的小店一共就5个人，所以他们每人都身兼数职。不过张海涛认为这份忙碌是值得的，他就是想通过辛苦的工作取得一份创业的“真经”。",qs:[{n:14,q:"旅游旺季时，小岛上是什么景象？",o:["旅游者老年人居多","餐厅的生意特别好","小岛上餐厅特别多","大学生都在餐厅打工"],a:1,why:"“小岛上的餐厅变得异常忙碌” → làm ăn rất đắt khách."},{n:15,q:"大学生现在对打工是怎么想的？",o:["不缺钱就不用打工","不如抓紧时间读书","打工纯属浪费时间","希望能够提升自己"],a:3,why:"Việc đơn giản “对自身能力提升有限” nên không hấp dẫn → họ muốn nâng cao bản thân."},{n:16,q:"王新、张海涛现象说明什么？",o:["大学生打工更追求金钱之外的收获","年轻人不怕累，只希望工作有钱赚","悠闲、简单的工作最受大学生欢迎","年轻人觉得和朋友一起创业太辛苦"],a:0,why:"Vương Tân học pha cà phê, Trương Hải Đào học kinh nghiệm khởi nghiệp → mục đích ngoài tiền."},{n:17,q:"根据这段话，下列哪项正确？",o:["在中国，喜欢喝咖啡的人多了","假期打工的大学生越来越少了","大学生打工的目的发生了变化","大学生打工只能做简单的工作"],a:2,why:"Sinh viên vẫn đi làm (còn nhiều hơn), chỉ là mục đích đã đổi. (B sai — đó là nhận định của ông chủ quán.)"}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["看似简单的藤椅，其实制作起来却并不难。","真是瞎折腾，这条路刚开通几天又被挖了，这不是浪费钱嘛！","民宿作为中国旅游的新业态，一经出现便受到了很多人的关注。","有了政府支持、社会保障、科技助力，智能养老产业一定能不断发展壮大。"],a:0,why:"<b>Mâu thuẫn logic</b>: <span class='zh'>看似简单……其实却……</span> phải nói điều ngược lại → <span class='zh'>其实制作起来并不容易</span>."},{n:19,o:["柬埔寨吴哥窟以其历史悠久成为众多游客向往的旅游之地。","中小企业在创业初期，大多资金不足，市场受限，经营相对艰难。","望着儿子，我想起了我的童年，是在和哥哥尽情地玩耍中愉快度过的。","父亲背驼了，也没有了使不完的力气，可我相信他还是世界上最伟大的父亲。"],a:2,why:"<b>Câu bị trộn</b> (句式杂糅): <span class='zh'>我想起了我的童年</span> + <span class='zh'>我的童年是在……度过的</span> → <span class='zh'>我想起了我的童年，那是在……度过的</span>."},{n:20,o:["曾经参加过的一次环保活动，至今让他印象深刻。","每天晚上，不管再忙，全家一起共进晚餐也是必要的。","手术前，我多少有些担心，因为这毕竟是国内第一例开颅手术。","火星上温差很大，从零下一百多度到二十几度，我们想象不出该穿什么衣服。"],a:1,why:"<span class='zh'>不管</span> phải đi với từ nghi vấn / lựa chọn: <span class='zh'>不管多忙</span>; còn <span class='zh'>再忙</span> đi với <span class='zh'>即使 / 就是</span>: <span class='zh'>再忙也……</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"一般来说，随着孩子年龄的增长，其独立___越来越强，叛逆心也是如此。这段时间，父母应___注重与青春期孩子的沟通交流。在交流中，要充分___孩子的学习热情，肯定孩子在学习上的付出及价值。",o:["意识　特别　认可","想法　分外　认同","思维　无比　同意","能力　相当　重视"],a:0,why:"<span class='zh'>独立意识</span> là kết hợp cố định (bài khóa đọc 33–36 cũng có); <span class='zh'>特别注重</span>; <span class='zh'>认可……热情</span> = ghi nhận, đi cùng <span class='zh'>肯定</span>."},{n:22,text:"___调查，35%的大学生打工是为了增加收入，以便自付学费；36%的大学生是想自食其力，挣自己的生活费，___也可以减轻家庭负担；29%的大学生是想锻炼自己的能力，报酬___，如果有，那___更好。",o:["经　大概　不在乎　自然","照　顺便　不要紧　绝对","按　从而　没关系　果然","据　同时　无所谓　当然"],a:3,why:"<span class='zh'>据调查</span> (cố định); <span class='zh'>同时</span> = đồng thời; <span class='zh'>报酬无所谓</span> = thù lao không quan trọng; <span class='zh'>那当然更好</span>."},{n:23,text:"我小时候爱看动画片，常常坐在电视机前一看就是大半天。姐姐实在忍不住了，就___勇气提醒我，要我___眼睛，多运动。我一听就来气，___姐姐唠叨。直到后来我戴上了厚厚的眼镜，才知道姐姐是对的，她那是___我。",o:["拿出　珍惜　恨　可怜","激发　爱护　怨　疼爱","鼓起　爱惜　嫌　关心","重振　保护　烦　心疼"],a:2,why:"<span class='zh'>鼓起勇气</span> (cố định); <span class='zh'>爱惜眼睛</span>; <span class='zh'>嫌 + người + tính chất</span> = chê ai (嫌姐姐唠叨); <span class='zh'>关心我</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"诸葛亮小的时候，跟水镜先生学习兵法。水镜先生养了一只公鸡，每天中午鸡叫三声，(24)。诸葛亮每天都是听得正来劲的时候鸡就叫了。怎么能让鸡晚叫会儿呢？诸葛亮心想。不久他想出了个好办法，每天上学的时候抓几把小米放在口袋里，快到中午的时候，他就往窗外撒一把小米。(25)，也不叫了，过一会儿再撒一把，直到把口袋里面的小米撒完。公鸡吃完小米再叫时，水镜先生已经多讲了半天。\n水镜先生天天晚下课，(26)：“这么晚才下课，也不知道饿呀！”“你没听见鸡才叫吗？”水镜先生说。师娘猜想其中必有原因。\n第二天快到中午时，师娘来到院子里，只见公鸡伸长脖子刚要叫，窗口就撒出一把小米。她把事情看了个仔细，(27)：“你这个当先生的，还不如小诸葛。”她把看到的一五一十告诉了水镜先生。水镜先生听后哈哈大笑，(28)，将来一定是个人才。",opts:["师娘开始埋怨","回家后对水镜先生说","水镜先生就下课","公鸡看见小米就专心地吃起来","说诸葛亮聪明过人"],ans:{24:2,25:3,26:0,27:1,28:4}},read4:[{ins:"第29–32题：请选出正确答案。",text:"20岁，我天天坐在轮椅上。除去给人家画彩蛋，我想我还应该再干点儿别的事，先后改变了几次主意，最后想学写作。母亲那时已不年轻，为了我的腿，她头上开始有了白发。医院明确表示，我的病目前没办法治。母亲的全副心思却还放在给我治病上。她找来许多稀奇古怪的药，让我吃，让我喝，或者是洗……花去很多钱。“别浪费时间啦！根本没用！”我说，一心只想着写小说，仿佛那东西能把我这个残疾的人救出困境。“再试一回，不试你怎么会知道没用？”母亲说，每一回都抱着满满的希望。然而对我的腿，有多少回希望就有多少回失望。最后一回，我被烫伤了。医院的大夫说，太危险了，对于我这样的病人，这差不多是要命的事。我倒没太害怕，心想死了也好，死了倒痛快。母亲吓坏了，白天黑夜守着我，一换药就说：“怎么会烫伤了呢？我还留着神呢呀！”幸亏伤口好起来，不然她非疯了不可。\n后来母亲跟我说：“那就好好写吧。”我听出来，她对治好我的腿也终于绝望了。我们俩都尽力把我的腿忘掉。她到处去给我借书，顶着雨或冒着雪推我去看电影，像过去给我找大夫、治腿那样，抱了希望。\n30岁时，我的第一篇小说发表了，母亲却已不在人世。过了几年，我的另一篇小说侥幸获奖，母亲已经离开我整整七年。\n我常常摇着车去我家附近那座安静的小公园，坐在树林里，想：“上帝为什么早早地召母亲回去呢？”迷迷糊糊中我听见回答：“她心里太苦了。上帝看她受不住了，就召她回去。”我的心得到一丝安慰，睁开眼睛，看见风正在树林里吹过。",qs:[{n:29,q:"以下哪一项符合“我”20岁时的状况？",o:["遇事总是拿不定主意","画画儿已经小有名气","“我”的腿不能走路","知道自己可以当作家"],a:2,why:"“我天天坐在轮椅上”, “为了我的腿” → chân không đi được. (A sai: đổi ý vài lần chỉ là chuyện chọn việc.)"},{n:30,q:"“我”的母亲：",o:["年轻时头上就有了白发","天天给“我”做各种好吃的","因为“我”被烫伤变疯了","对“我”学习写作抱了希望"],a:3,why:"“那就好好写吧……像过去给我找大夫、治腿那样，抱了希望”. (C sai: “不然她非疯了不可” = suýt phát điên, nhưng không điên.)"},{n:31,q:"20岁时的“我”：",o:["开始决定学习写作","最喜欢陪母亲去看电影","对治好病始终抱有信心","很感激母亲尽力为自己治病"],a:0,why:"“最后想学写作”. (C, D sai: “我” nói “别浪费时间啦！根本没用！”)"},{n:32,q:"“我”30岁时：",o:["腿治好了","发表了小说","小说获奖了","母亲生病了"],a:1,why:"“30岁时，我的第一篇小说发表了”. Đoạt giải là <i>mấy năm sau</i>."}]},{ins:"第33–36题：请选出正确答案。",text:"不少父母发现，孩子上了初中以后就像变了一个人，不听父母的管教，爱顶嘴，一直听话的孩子也会和父母对着干，也有的为了表现自己的个性，把头发染成彩色的等等。别见怪，您的孩子已进入青春期。\n青春期的孩子心中充满矛盾。这种矛盾首先表现为独立性和依赖性的矛盾。青春期少年逐渐有了成人感，由此增强了独立意识。比如，生活上他们不愿父母过多地照顾或干预，否则便产生厌烦情绪；很多事不愿意听从父母的意见，强烈地想表达自己的想法。第二是成人感与幼稚感的矛盾。青春期少年认为自己已经成熟，长大成人，因而在一些行为活动、思维认识、社会交往等方面，表现出成人的样式。期待别人把自己当大人看，能够尊重自己、理解自己。第三，开放性与封闭性的矛盾。青春期少年期望与同龄人，特别是与异性、与父母平等交往。第四，渴求感与压抑感的矛盾。青春期少年出现了与异性交往的渴求，喜欢在异性面前表现自己，甚至出现朦胧的恋爱念头，但现实生活中学习的压力却常常会使他们烦躁不堪。\n面对青春期的孩子，父母要格外关爱他们。青春期正是孩子形成主见的关键时期，父母要包容孩子，不要过分约束他们，不要总认为自己讲的话是对的，孩子是错的，不要什么都自己说了算，不要用命令的口气对孩子说话，不要总是盯着孩子的缺点，要知道，每个孩子都是有优点的，不要拿孩子的短处和别的孩子的优点比。父母要给孩子发言权、自主权、时间支配权；同时，父母也要让孩子承担家中的事务，让孩子学会负责，懂得担当。",qs:[{n:33,q:"孩子有了什么变化就是进入了青春期？",o:["孩子进入中学以后","父母不能管孩子了","孩子开始有个性了","孩子变得不听话了"],a:3,why:"“不听父母的管教，爱顶嘴……和父母对着干……别见怪，您的孩子已进入青春期”."},{n:34,q:"青春期少年期待什么？",o:["父母不再把自己当成小孩子","经济上独立，不要父母照顾","异性朋友在自己面前表现才能","自己变成大人，能够帮助父母"],a:0,why:"“期待别人把自己当大人看”."},{n:35,q:"面对青春期少年，父母应注意什么？",o:["不要批评孩子的缺点","在孩子面前要少说话","不要说“你应该……”","家里的事要让孩子做主"],a:2,why:"“不要用命令的口气对孩子说话” — “你应该……” là giọng ra lệnh. (A sai: là “不要总是盯着”缺点.)"},{n:36,q:"根据上文，下列哪项正确？",o:["父母必须认同青春期少年的想法","父母要对青春期少年多关心爱护","青春期少年要有自己独立的房间","青春期少年要学会分担家中的烦恼"],a:1,why:"“父母要格外关爱他们”."}]}]},W:{zh:"写作",vn:"Viết văn: 父母给我的爱",t:"35 phút",min:!0,task:"学完了这篇课文，请想一想，父母对孩子的爱只是简单的爱吗？有时候父母的做法可能孩子不理解，但其实都是对孩子的爱。你跟父母之间有这样的故事吗？请以“父母给我的爱”为题，写一篇不少于300字的文章。文章中请写清楚事情发生的前因后果，以及怎样通过这件事情感受到了父母之爱。",target:300,steps:[["Chọn chuyện","Chọn <b>một</b> sự việc cụ thể mà lúc đầu bạn <b>không hiểu</b> bố mẹ: bị cấm, bị bắt làm việc, bị từ chối, bị mắng…"],["Tiền nhân hậu quả","Viết rõ <b>nguyên nhân</b> – <b>diễn biến</b> – <b>kết quả</b>: chuyện gì xảy ra, bạn phản ứng ra sao, sau đó thế nào."],["Mô phỏng bài khóa","Đi theo mạch: <b>hiểu lầm</b> (<span class='zh'>埋怨、不体谅</span>) → <b>chi tiết gợi mở</b> (nghe được, nhìn thấy) → <b>vỡ lẽ</b> (<span class='zh'>顿时明白、不由得热泪盈眶</span>)."],["Cảm nhận","Đoạn cuối nói rõ bạn <b>cảm nhận tình yêu</b> của bố mẹ thế nào — có thể kết bằng một câu khái quát."],["Dùng từ của bài","Dùng 6–8 từ mới: <span class='zh'>埋怨 · 体谅 · 恨不得 · 无精打采 · 心疼 · 吃苦 · 欣慰 · 顿时 · 不由得 · 热泪盈眶</span>…"]],outline:[["开头 · Mở bài","Bố mẹ đã làm gì khiến bạn không hiểu? (thời gian, địa điểm, nhân vật)"],["经过 · Diễn biến","Phản ứng và cảm xúc của bạn lúc đó (埋怨、委屈、恨不得……、无精打采)"],["转折 · Bước ngoặt","Chi tiết hay lời nói giúp bạn hiểu ra (后来……, 听到……, 看到……)"],["结尾 · Kết bài","Cảm nhận về tình yêu của bố mẹ (顿时明白……，不由得……；父母的爱……)"]],model:"父母给我的爱\n上高中的时候，我最怕的就是周末，因为爸爸总让我去他朋友的小饭馆帮忙。同学们在家睡懒觉、玩儿游戏，我却要端盘子、洗碗，忙得片刻不停。我心里暗暗埋怨爸爸：家里又不缺这点儿钱，他为什么一点儿也不体谅我呢？\n有一次，一位客人嫌菜上得慢，大声地骂我。我委屈得恨不得马上跑回家，可想到爸爸说过“做事要有始有终”，只好忍着眼泪向客人道歉，把菜重新端了上去。那天晚上回到家，我无精打采地坐在沙发上，一句话也不想说。\n后来我上了大学，一个人在外地生活。别的同学遇到一点儿困难就给家里打电话哭鼻子，我却能自己想办法解决。打工时，老板夸我做事认真，懂得和人打交道。这时我才明白，原来那些辛苦的周末，让我学会了独立，也学会了坚强。\n去年春节回家，我问爸爸当初为什么让我去打工。爸爸笑了笑说：“不吃苦，怎么长本事？我们不能陪你一辈子啊。”看着他头上新增的白发，我顿时什么都明白了，不由得热泪盈眶。父母的爱，有时候不是把我们抱在怀里，而是放手让我们自己去走路。",check:["Có tiêu đề 《父母给我的爱》","Có đủ nguyên nhân – diễn biến – kết quả","Có bước ngoặt “hiểu ra”","Đoạn cuối nói rõ cảm nhận tình yêu của bố mẹ","Dùng ít nhất 6 từ mới của bài","Dùng ít nhất 1 trong 3 cấu trúc 恨不得 / 顿时 / 不由得","Không ít hơn 300 chữ"]},SUM:{words:["和蔼","慈祥","脱离","诱惑","向往","孤独","片刻","感染","团圆","酝酿","反常","埋怨","体谅","无精打采","熬","漫长","难得","心疼","掩饰","隐瞒","欣慰","本事","热泪盈眶"],patterns:[["恨不得 + V (phóng đại)","我也恨不得马上飞到父母跟前。"],["……，……就更甭提了","独立自主的能力就更甭提了。"],["顿时 + V (đã xảy ra)","顿时什么都明白了。"],["不由得 + V","不由得热泪盈眶。"],["不……，怎么……？","不吃苦，怎么长本事？"],["一……就……，每到……更是……","一给家里打电话就哭鼻子，每到节假日，大家更是……"]],diff:["体谅：设身处地理解别人（很体谅 / 体谅体谅） — 原谅：不责备别人的过错（不加程度副词，不重叠）","恨不得（做不到的事，夸张） ≠ 巴不得（可能实现的事） · 掩饰（情绪、缺点） ≠ 隐瞒（真相、事实） · 近来 ≠ 最近 · 寂静 ≈ 安静 · 刹那 / 片刻 / 瞬间（名词） — 顿时（副词）"],sentences:["回家的快乐和被亲情包围的幸福感染了我，我也恨不得马上飞到父母跟前，与他们团圆。","总有一天她会明白的，不吃苦，怎么长本事？社会不需要只会享福的人。","我悄悄走出卧室，看到灯光下父母不舍的目光、头上新增的白发和眼角越来越深的皱纹，顿时什么都明白了，不由得热泪盈眶。"],hw:["Học thuộc 44 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 (đặt câu) và Bài tập 4 (mô phỏng) vào vở.","Viết bài 《父母给我的爱》 ≥300 chữ (mục 7), nộp bản viết tay.","Làm Sách bài tập bài 2 (nghe 1–17, đọc 18–
