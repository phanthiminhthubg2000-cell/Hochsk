<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 1 · 孩子给我们的启示 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-01",num:1,book:"HSK 标准教程 6（上）",unit:{n:1,zh:"生活点滴",vn:"Những việc nhỏ nhặt trong cuộc sống"},title:"孩子给我们的启示",vn:"Điều con trẻ dạy chúng ta",chars:698,source:"改编自《爱得有分寸，孩子才优秀》文章《别让孩子抓住你的“把柄”》",goals:["Đọc hiểu bài khóa 698 chữ, nắm bố cục <b>起 → 转 → 合</b> của một câu chuyện gia đình.","Dùng được 40 từ mới, đặc biệt nhóm từ quan hệ: <span class='zh'>融洽 · 和睦 · 亲密 · 别扭 · 宽容 · 严厉</span>.","Nắm 2 cấu trúc khẩu ngữ <span class='zh'>巴不得</span>, <span class='zh'>别提多……了</span> và cặp từ văn viết / khẩu ngữ <span class='zh'>将—把, 道—说, 便—就</span>.","Phân biệt <span class='zh'>人家 — 别人</span>; nhận diện câu sai loại <b>dùng sai từ</b> (病句).","Viết tóm tắt bài khóa khoảng 300 chữ — làm quen dạng <b>缩写</b> của đề HSK6."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (巴不得 · 别提多……了 · 人家—别人) · Bài khóa đoạn 1–5"],["Buổi 2","Từ vựng & ngữ pháp nhóm 3 (văn viết–khẩu ngữ · 这话确实不假) · Đoạn 6–7 · Bài tập · 病句 · Luyện đề · 缩写"]],outline:[{tag:"起",name:"Mở đầu",paras:"Đoạn 1–3",zh:"天天来家里住，两个孩子相处融洽",vn:"Thiên Thiên đến ở nhờ, hai đứa trẻ thân thiết, ngoan ngoãn."},{tag:"转",name:"Bước ngoặt",paras:"Đoạn 4–5",zh:"孩子背后议论人，父母批评，女儿反问",vn:"Hai đứa nói xấu bạn sau lưng; bố mẹ dạy dỗ thì bị con hỏi ngược đến cứng họng."},{tag:"合",name:"Kết – suy ngẫm",paras:"Đoạn 6–7",zh:"父母实行“两套标准”，要约束好自己的言行",vn:"Bố mẹ nhận ra mình dùng “hai tiêu chuẩn”; muốn dạy con phải giữ gìn lời nói, việc làm của mình."}],warm1:{q:"在你跟父母（或孩子）的关系中，遇到过下列情况吗？如果遇到，想一想该怎么办？如有更多情况，请补充说明。",vn:"Trong quan hệ giữa bạn với bố mẹ (hoặc con cái), bạn đã gặp những tình huống dưới đây chưa? Nếu gặp rồi, hãy nghĩ xem nên làm thế nào. Nếu có tình huống khác, hãy bổ sung.",items:[["📺","父母不让孩子看电视，自己却在看。","Bố mẹ không cho con xem tivi, còn mình thì lại xem."],["🤥","父母教育孩子要诚实，自己却说谎。","Bố mẹ dạy con phải trung thực, còn mình lại nói dối."],["🤝","父母告诉孩子要多帮助别人，自己有时候却怕麻烦不愿意帮助别人。","Bố mẹ bảo con phải giúp đỡ người khác, còn mình đôi khi lại ngại phiền không muốn giúp."]],talk:["遇到这种情况，孩子会怎么想？","如果你是父母，你会怎么做？"],link:"Cả ba tình huống có điểm chung: <b>bố mẹ yêu cầu con một đằng, mình làm một nẻo</b> — chính là chủ đề của bài khóa (<span class='zh'>两套标准</span>)."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"女",rule:"Cùng có chữ 女 — chỉ <b>nữ giới</b>. 女 đứng đầu (女人, 女生…) hoặc đứng sau (妇女, 母女…).",w:[["女人","nǚrén","phụ nữ, đàn bà"],["女士","nǚshì","quý bà, chị (lịch sự)"],["女厕","nǚcè","nhà vệ sinh nữ"],["女方","nǚfāng","bên nữ, nhà gái"],["女生","nǚshēng","nữ sinh; con gái"],["女皇","nǚhuáng","nữ hoàng"],["女装","nǚzhuāng","trang phục nữ"],["女性","nǚxìng","nữ giới"],["妇女","fùnǚ","phụ nữ"],["少女","shàonǚ","thiếu nữ"],["美女","měinǚ","người đẹp, mỹ nữ"],["独生女","dúshēngnǚ","con gái một (có trong bài)"],["母女","mǔnǚ","mẹ và con gái"]]},{k:"无",rule:"无 = không có (văn viết của 没有). 无 + danh từ / động từ → tính từ hoặc thành ngữ.",w:[["无数","wúshù","vô số"],["无边","wúbiān","vô biên, mênh mông"],["无价","wújià","vô giá"],["无声","wúshēng","không tiếng động"],["无语","wúyǔ","không nói nên lời; “cạn lời”"],["无法","wúfǎ","không có cách nào"],["无关","wúguān","không liên quan"],["无私","wúsī","không vụ lợi, không ích kỷ (có trong bài)"],["无悔","wúhuǐ","không hối tiếc"],["无望","wúwàng","vô vọng"]],trap:"⚠️ <span class='zh'>无私</span> = <b>không ích kỷ</b>, khác “vô tư” trong tiếng Việt (= không lo nghĩ, hồn nhiên → <span class='zh'>无忧无虑</span>)."},{k:"醒",rule:"Động từ + 醒 (bổ ngữ kết quả): hành động khiến ai đó <b>tỉnh dậy</b>.",w:[["叫醒","jiàoxǐng","gọi dậy"],["吵醒","chǎoxǐng","làm ồn khiến thức giấc"],["惊醒","jīngxǐng","giật mình tỉnh giấc"],["推醒","tuīxǐng","lay cho tỉnh"],["睡醒","shuìxǐng","ngủ dậy, tỉnh giấc"]]},{k:"视",rule:"视 = nhìn; nghĩa rộng: xem xét, đối xử (重视, 忽视, 轻视).",w:[["重视","zhòngshì","coi trọng"],["忽视","hūshì","xem nhẹ, lơ là (có trong bài)"],["轻视","qīngshì","coi thường"],["环视","huánshì","nhìn quanh"],["对视","duìshì","nhìn nhau (có trong bài: 对视一眼)"],["相视","xiāngshì","nhìn nhau"],["视觉","shìjué","thị giác"],["视线","shìxiàn","tầm mắt, ánh nhìn"],["视而不见","shì ér bú jiàn","nhìn mà như không thấy"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Trước và sau khi Thiên Thiên đến",from:1,to:19},{name:"Nhóm 2 · Đoạn 4–5",sub:"Chuyện tối hôm ấy",from:20,to:33},{name:"Nhóm 3 · Đoạn 6–7",sub:"Bài học của bố mẹ",from:34,to:40}],V:[[1,"启示","qǐshì","dt.","khải thị","sự gợi mở, bài học rút ra",1,"书","启发提示，使人有所领悟（的道理）。","孩子给我们的启示","这个故事给了我很大的启示。","Câu chuyện này đã cho tôi một bài học lớn.",["给人启示","得到启示","深刻的启示","从中得到启示"],"<b>启示</b> thiên về danh từ (bài học, điều ngộ ra); <b>启发</b> hay dùng làm động từ: <span class='zh'>老师启发学生思考</span>."],[2,"老公","lǎogōng","dt.","lão công","chồng",0,"口","丈夫（口语）。","我和老公爽快地答应下来","我老公做饭特别好吃。","Chồng tôi nấu ăn ngon lắm.",["我老公","老公老婆"],"Khẩu ngữ (* = từ ngoài đề cương HSK). Văn viết dùng <span class='zh'>丈夫 / 先生</span>; cặp với <span class='zh'>老婆</span> (vợ)."],[3,"爽快","shuǎngkuai","tt.","sảng khoái","thẳng thắn, dứt khoát; sảng khoái",1,"","（说话做事）直截了当，不拖拉；也指舒适痛快。","我和老公爽快地答应下来","他爽快地答应了我的请求。","Anh ấy dứt khoát nhận lời đề nghị của tôi.",["爽快地答应","为人爽快","心里很爽快"],"Nghĩa 1 (tính cách): thẳng thắn, không lề mề. Nghĩa 2 (cảm giác): khoan khoái — <span class='zh'>洗了个澡，身上爽快多了</span>."],[4,"巴不得","bābudé","đgt.","—","chỉ mong sao, ước gì",1,"口","迫切盼望（口语）。","有个孩子和我们的独生女朝夕相处，我们巴不得呢！","一放假，孩子们巴不得天天出去玩儿。","Vừa được nghỉ, bọn trẻ chỉ mong ngày nào cũng được ra ngoài chơi.",["巴不得马上……","巴不得呢"],"Xem <b>Ngữ pháp 1</b>. Khẩu ngữ, mong muốn rất mạnh; không dùng dạng phủ định <span class='zh'>✗不巴不得</span>."],[5,"嚷","rǎng","đgt.","nhượng","la hét, kêu gào",0,"","喊叫；吵闹。","嚷着要用爸爸最拿手的美味佳肴欢迎天天来我家","别嚷了，孩子刚睡着。","Đừng la nữa, con vừa mới ngủ.",["大声嚷","嚷着要……"],"<span class='zh'>嚷着要……</span> = cứ la lên đòi… Lặp lại <span class='zh'>嚷嚷</span> đọc <b>rāngrang</b> (khẩu ngữ): ồn ào, la toáng lên."],[6,"拿手","náshǒu","tt.","nã thủ","sở trường, giỏi, thạo",1,"","（对某种技术）擅长。","爸爸最拿手的美味佳肴","红烧肉是妈妈的拿手菜。","Thịt kho tàu là món tủ của mẹ.",["拿手菜","拿手好戏","最拿手"],"Hay làm định ngữ: <span class='zh'>拿手菜 · 拿手好戏</span>; làm vị ngữ: <span class='zh'>他修电脑很拿手</span>."],[7,"佳肴","jiāyáo","dt.","giai hào","món ngon",0,"书","精美的菜肴。","美味佳肴","节日的餐桌上摆满了美味佳肴。","Bàn ăn ngày lễ bày đầy món ngon.",["美味佳肴"],"Văn viết, gần như chỉ dùng trong cụm <span class='zh'>美味佳肴</span> (sơn hào hải vị)."],[8,"异常","yìcháng","phó.","dị thường","đặc biệt, cực kỳ",1,"书","非常，特别（副词）；不同于平常（形容词）。","林林就变得异常勤劳 / 日子过得异常省心","听到这个消息，大家异常兴奋。","Nghe tin này, mọi người vô cùng phấn khởi.",["异常兴奋","异常激动","异常安静","情况异常"],"Phó từ = <span class='zh'>非常</span> nhưng trang trọng hơn. Tính từ = <b>bất thường</b>: <span class='zh'>今年天气异常</span>."],[9,"勤劳","qínláo","tt.","cần lao","siêng năng, cần cù",1,"","努力劳动，不怕辛苦。","林林就变得异常勤劳","她是个勤劳的姑娘，家务活儿样样都会。","Cô ấy là cô gái chăm chỉ, việc nhà gì cũng biết làm.",["勤劳勇敢","勤劳致富","勤劳的双手"],"<b>勤劳</b>: chăm lao động, làm lụng; <b>勤奋</b>: chăm học, chăm làm việc trí óc — <span class='zh'>勤奋学习</span>."],[10,"绅士","shēnshì","dt.","thân sĩ","quý ông, người lịch thiệp",0,"","有教养、有风度的男子。","却也绅士风度十足","他对女士总是很绅士。","Anh ấy luôn rất lịch thiệp với phụ nữ.",["绅士风度","很绅士"],"Khẩu ngữ hiện đại dùng như tính từ: <span class='zh'>他很绅士</span>."],[11,"风度","fēngdù","dt.","phong độ","phong thái, phong độ",1,"","美好的举止姿态。","绅士风度十足","输了比赛，他还很有风度地向对手祝贺。","Thua trận, anh ấy vẫn lịch thiệp chúc mừng đối thủ.",["有风度","风度翩翩","绅士风度"],"⚠️ Khác “phong độ” trong thể thao tiếng Việt (= <span class='zh'>状态</span>). <span class='zh'>风度</span> chỉ <b>cử chỉ, phong thái đẹp</b>."],[12,"十足","shízú","tt.","thập túc","tràn đầy, hoàn toàn",1,"","非常充足；十分。","绅士风度十足","他干起活儿来劲头十足。","Hễ bắt tay vào việc là anh ấy hăng hái hết mức.",["信心十足","劲头十足","十足的把握"],"Đứng <b>sau</b> danh từ: <span class='zh'>信心十足</span>; hoặc trước <span class='zh'>的</span>: <span class='zh'>十足的把握</span>."],[13,"督促","dūcù","đgt.","đốc xúc","đôn đốc, thúc giục",1,"","监督催促。","做作业不用督促","老师经常督促我们按时完成作业。","Thầy giáo thường đôn đốc chúng tôi làm bài đúng hạn.",["督促孩子","在……的督促下"],"<b>督促</b> = giục + giám sát (mạnh, trang trọng); <b>催</b> = giục (khẩu ngữ, đơn giản)."],[14,"打架","dǎ jià","đgt.","đả giá","đánh nhau",1,"","互相争吵殴打。","她们不打架","两个孩子为了一个玩具打起架来。","Hai đứa trẻ đánh nhau vì một món đồ chơi.",["跟人打架","打了一架"],"Từ <b>ly hợp</b>: <span class='zh'>打了一架 · 打起架来</span>; không nói <span class='zh'>✗打架他</span> → <span class='zh'>跟他打架</span>."],[15,"别扭","bièniu","tt.","biệt nữu","xích mích; gượng gạo",1,"口","不顺心；意见不合；（说话、作文）不通顺。","不闹别扭","这句话读起来有点儿别扭。","Câu này đọc lên hơi trúc trắc.",["闹别扭","心里别扭","说话别扭"],"<span class='zh'>闹别扭</span> = giận dỗi, xích mích. Còn nghĩa <b>khó chịu, gượng gạo, không trôi chảy</b>."],[16,"融洽","róngqià","tt.","dung hiệp","hòa hợp, hòa thuận",1,"","彼此感情好，没有抵触。","关系别提多融洽了","新同事和大家相处得很融洽。","Đồng nghiệp mới hòa hợp với mọi người.",["关系融洽","气氛融洽","相处融洽"],"Hay đi với <span class='zh'>关系 / 气氛</span>. So sánh với <span class='zh'>和睦</span> ở từ 28."],[17,"亲密","qīnmì","tt.","thân mật","thân thiết, thân mật",1,"","感情好，关系密切。","看到女儿和天天这么亲密","我们俩是无话不谈的亲密朋友。","Hai chúng tôi là bạn thân chuyện gì cũng kể.",["亲密无间","亲密的伙伴","关系亲密"],""],[18,"忽略","hūlüè","đgt.","hốt lược","bỏ qua, không để ý đến",1,"","没有注意到；疏忽。","大有忽略我们的趋势","我们常常忽略身边最亲的人。","Chúng ta thường lơ là những người thân thiết nhất bên mình.",["忽略细节","被忽略","不可忽略"],"<b>忽略</b>: vô ý không để ý tới; <b>忽视</b> (đoạn 6): xem nhẹ, không coi trọng — có thái độ."],[19,"嫉妒","jídù","đgt.","tật đố","ghen tỵ, đố kỵ",1,"","对比自己好的人心怀不满。","我和老公都有点儿嫉妒了","他嫉妒同事升职比他快。","Anh ta ghen tỵ vì đồng nghiệp thăng chức nhanh hơn mình.",["嫉妒别人","嫉妒心"],"Trong bài dùng nhẹ nhàng, hài hước: bố mẹ “ghen” vì con thân với bạn hơn."],[20,"滔滔不绝","tāotāo bù jué","thành ngữ","thao thao bất tuyệt","nói mãi không dứt",1,"成","形容说话连续不断。","开始滔滔不绝地聊了起来","一说起足球，他就滔滔不绝。","Hễ nhắc đến bóng đá là anh ấy nói mãi không thôi.",["滔滔不绝地说","说得滔滔不绝"],"Làm trạng ngữ (<span class='zh'>滔滔不绝地讲</span>) hoặc vị ngữ."],[21,"嘲笑","cháoxiào","đgt.","trào tiếu","chế giễu, chê cười",1,"","用言辞笑话对方。","还老嘲笑别人","我们不应该嘲笑别人的缺点。","Chúng ta không nên chế giễu khuyết điểm của người khác.",["嘲笑别人","遭到嘲笑"],""],[22,"讨好","tǎo hǎo","đgt.","thảo hảo","lấy lòng, nịnh",1,"","迎合别人，取得别人的欢心。","他最会讨好老师了","他总想讨好领导。","Anh ta lúc nào cũng muốn lấy lòng sếp.",["讨好别人","费力不讨好"],"Sắc thái <b>chê</b>. <span class='zh'>费力不讨好</span> = tốn công mà chẳng được lòng ai."],[23,"郑重","zhèngzhòng","tt.","trịnh trọng","nghiêm túc, trịnh trọng",1,"书","严肃认真。","我郑重地走到她们跟前","他郑重地向大家道歉。","Anh ấy nghiêm túc xin lỗi mọi người.",["郑重地宣布","郑重其事"],""],[24,"当面","dāng miàn","phó.","đương diện","trước mặt, trực tiếp",1,"","在面前；面对面（做某事）。","应该当面说","有意见请当面提出来。","Có ý kiến gì xin cứ nói thẳng trước mặt.",["当面说","当面问","当面道谢"],"Trái nghĩa trong bài: <span class='zh'>背后</span> (sau lưng)."],[25,"人家","rénjia","đt.","nhân gia","người ta, người khác",1,"","别人；特定的人（他/他们）；也可指说话人自己。","背后说人家的坏话不好","你帮了我这么多，我真不知道怎么感谢人家。","Anh giúp tôi nhiều thế, tôi chẳng biết cảm ơn sao cho phải.",["人家都……","说人家的坏话"],"Xem <b>辨析 人家—别人</b>. Đọc <b>rénjiā</b> (thanh 1) thì là <b>hộ gia đình</b>: <span class='zh'>村里有十几户人家</span>."],[26,"附和","fùhè","đgt.","phụ họa","phụ họa, hùa theo",1,"","（言语、行动）追随别人。","老公也在旁边附和","他没有自己的看法，总是附和别人。","Anh ta không có chính kiến, lúc nào cũng hùa theo người khác.",["随声附和","附和别人"],"Chú ý âm: 和 đọc <b>hè</b> (không phải hé)."],[27,"大伙儿","dàhuǒr","đt.","—","mọi người",0,"口","大家（口语）。","大伙儿要和睦相处","大伙儿一起想想办法吧。","Mọi người cùng nghĩ cách đi.",["大伙儿一起"],"Khẩu ngữ = <span class='zh'>大家</span>."],[28,"和睦","hémù","tt.","hòa mục","hòa thuận",1,"","相处融洽友好。","大伙儿要和睦相处","他们一家人生活得很和睦。","Gia đình họ sống rất hòa thuận.",["家庭和睦","和睦相处","邻里和睦"],"<b>和睦</b>: dùng cho gia đình, hàng xóm, dân tộc (sống lâu dài với nhau). <b>融洽</b>: quan hệ, không khí nói chung."],[29,"宽容","kuānróng","đgt.","khoan dung","khoan dung, rộng lượng",1,"","宽大有气量，不计较或追究。","对人要宽容 / 对自己宽容","对别人宽容一点儿，自己也会更快乐。","Rộng lượng với người khác một chút, bản thân cũng vui hơn.",["宽容别人","对……宽容","宽容的态度"],"Trong đoạn 6, <span class='zh'>对自己宽容</span> mang nghĩa <b>dễ dãi với bản thân</b> — đối lập <span class='zh'>对孩子严厉</span>."],[30,"疑惑","yíhuò","dt.","nghi hoặc","sự nghi hoặc, thắc mắc",1,"","心里不明白；困惑。","女儿却是一脸的疑惑","他的解释没能消除我的疑惑。","Lời giải thích của anh ấy không xóa được thắc mắc của tôi.",["一脸疑惑","心中的疑惑","感到疑惑"],""],[31,"反问","fǎnwèn","đgt.","phản vấn","hỏi ngược lại",1,"","对提问的人发问；用疑问语气表达肯定的意思。","反问道","“难道你不知道吗？”他反问道。","“Chẳng lẽ anh không biết à?” anh ấy hỏi lại.",["反问道","反问句"],"<span class='zh'>反问句</span> = câu hỏi tu từ: <span class='zh'>你们不是也……吗？</span> = các người cũng… đấy thôi."],[32,"瞬间","shùnjiān","dt.","thuấn gian","khoảnh khắc, trong chốc lát",1,"书","转眼之间；极短的时间。","瞬间我和老公被问得说不出话来","那一瞬间，我明白了一切。","Trong khoảnh khắc ấy, tôi đã hiểu ra tất cả.",["一瞬间","瞬间消失"],""],[33,"鸦雀无声","yāquè-wúshēng","thành ngữ","nha tước vô thanh","im phăng phắc, lặng như tờ",1,"成","连乌鸦、麻雀的声音都没有，形容非常安静。","屋子里鸦雀无声","老师一进来，教室里顿时鸦雀无声。","Thầy vừa bước vào, lớp học lập tức im phăng phắc.",["……里鸦雀无声"],"Chủ ngữ thường là <b>nơi chốn</b>: <span class='zh'>教室里 / 会场上 + 鸦雀无声</span>."],[34,"启蒙","qǐméng","đgt.","khải mông","vỡ lòng, khai sáng",1,"","使初学的人得到基本的、入门的知识。","启蒙老师的重要性不可忽视","奶奶是我学画画的启蒙老师。","Bà là người thầy vỡ lòng dạy tôi vẽ.",["启蒙老师","启蒙教育"],""],[35,"任","rèn","lượng.","nhiệm","(lượng từ) nhiệm kỳ, đời",0,"","用于担任职务的次数。","父母就是孩子的第一任老师","他是这家公司的第三任总经理。","Ông ấy là tổng giám đốc đời thứ ba của công ty.",["第一任","上一任","现任"],"* Từ ngoài đề cương. Dùng: <span class='zh'>第 + số + 任</span>."],[36,"反驳","fǎnbó","đgt.","phản bác","phản bác, bác bỏ",1,"","说出自己的理由来否定别人的说法。","如果这次不是女儿反驳","他的话说得很有道理，谁也无法反驳。","Lời anh ấy rất có lý, không ai bác được.",["反驳对方","无法反驳"],""],[37,"意识","yìshí","đgt.","ý thức","nhận ra, ý thức được",1,"","觉察（常跟“到”连用）；也作名词。","我还意识不到","他终于意识到了自己的错误。","Cuối cùng anh ấy cũng nhận ra lỗi của mình.",["意识到","意识不到","安全意识（名）"],"Động từ gần như luôn đi với <span class='zh'>到</span>: <span class='zh'>意识到 / 意识不到</span>."],[38,"实行","shíxíng","đgt.","thực hành","thực hiện, thi hành",1,"","用行动来实现（纲领、政策、计划等）。","实行的是两套标准","这家公司实行弹性工作制。","Công ty này áp dụng chế độ giờ làm linh hoạt.",["实行制度","实行改革","实行……标准"],"<b>实行</b>: thi hành chính sách, chế độ, tiêu chuẩn; <b>执行</b>: chấp hành mệnh lệnh, nhiệm vụ cụ thể."],[39,"严厉","yánlì","tt.","nghiêm lệ","nghiêm khắc, khắt khe",1,"","严肃而厉害。","对孩子严厉","父亲对我一向很严厉。","Bố xưa nay vẫn rất nghiêm khắc với tôi.",["严厉批评","严厉的目光","对……严厉"],"<b>严厉</b>: thái độ, lời nói gay gắt; <b>严格</b>: làm đúng quy định, tiêu chuẩn — <span class='zh'>严格要求</span>."],[40,"约束","yuēshù","đgt.","ước thúc","kiềm chế, ràng buộc",1,"","限制使不越出范围。","首先要约束好自己的言行","每个人都应该约束自己的行为。","Mỗi người đều nên tự kiềm chế hành vi của mình.",["约束自己","受到约束","无拘无束"],""]],extra:[["朝夕相处","zhāoxī xiāngchǔ","sớm tối bên nhau"],["独生女","dúshēngnǚ","con gái một"],["无私","wúsī","không vụ lợi, không ích kỷ"],["省心","shěngxīn","đỡ lo, khỏi bận tâm"],["大有……的趋势","dà yǒu … de qūshì","rất có xu hướng…"],["对视一眼","duìshì yì yǎn","liếc nhìn nhau một cái"],["背后议论人","bèihòu yìlùn rén","bàn tán sau lưng người khác"],["说不出话来","shuō bu chū huà lai","không nói nên lời"],["两套标准","liǎng tào biāozhǔn","hai tiêu chuẩn (tiêu chuẩn kép)"],["给……上了一课","gěi … shàngle yí kè","dạy cho … một bài học"],["言行","yánxíng","lời nói và việc làm"]],T:[{zh:"林林和天天是同学。天天的父母要出差，想请我们帮忙照看几天女儿，我和老公爽快地答应下来，有个孩子和我们的独生女朝夕相处，我们巴不得呢！最兴奋的是林林，嚷着要用爸爸最拿手的美味佳肴欢迎天天来我家，还提出，她的书桌可以和天天共用。看到女儿对伙伴热情无私，我和老公别提多高兴了。",vn:"Lâm Lâm và Thiên Thiên là bạn học. Bố mẹ Thiên Thiên phải đi công tác, muốn nhờ chúng tôi trông giúp con gái họ mấy ngày. Vợ chồng tôi vui vẻ nhận lời ngay — có một đứa trẻ sớm tối bên cạnh đứa con gái một của mình, chúng tôi còn mong không được ấy chứ! Phấn khích nhất là Lâm Lâm: con bé cứ la lên đòi dùng món ngon tủ của bố để đón Thiên Thiên đến nhà, lại còn đề nghị cho Thiên Thiên dùng chung bàn học. Thấy con gái nhiệt tình, không ích kỷ với bạn như vậy, vợ chồng tôi vui khỏi phải nói.",idea:"Nhận lời trông Thiên Thiên — cả nhà đều vui.",q:["天天为什么要来“我”家？","林林为欢迎天天做了哪些准备？"],note:[["有个孩子和我们的独生女朝夕相处，我们巴不得呢！","Câu cảm thán khẩu ngữ: <span class='zh'>巴不得呢</span> đứng cuối = “còn mong mãi ấy chứ”. <span class='zh'>朝夕相处</span> (sớm tối bên nhau) là thành ngữ bốn chữ."]]},{zh:"天天还没来，林林就变得异常勤劳，将屋子收拾得干干净净，东西摆放得整整齐齐，什么好事都想着天天。我家林林虽是女孩，却也绅士风度十足。",vn:"Thiên Thiên còn chưa đến, Lâm Lâm đã trở nên chăm chỉ lạ thường: dọn nhà sạch sẽ tinh tươm, đồ đạc xếp ngăn nắp gọn gàng, có chuyện gì hay cũng nghĩ đến Thiên Thiên. Lâm Lâm nhà tôi tuy là con gái mà cũng đầy phong thái quý ông.",idea:"Lâm Lâm thay đổi hẳn trước khi bạn đến.",q:["天天来之前，林林有什么变化？"],note:[["将屋子收拾得干干净净，东西摆放得整整齐齐","Hai vế song song: <span class='zh'>V + 得 + AABB</span> (tính từ lặp lại làm bổ ngữ mức độ). <span class='zh'>将</span> = <span class='zh'>把</span> (văn viết)."],["虽是女孩，却也绅士风度十足","<span class='zh'>虽……却也……</span> = tuy… nhưng cũng… (văn viết của <span class='zh'>虽然……但是也……</span>)."]]},{zh:"天天的到来，使我和老公的日子过得异常省心。两个孩子每天早上不用叫就醒了，上学不用接送，做作业不用督促；她们不打架，不闹别扭，关系别提多融洽了。看到女儿和天天这么亲密，大有忽略我们的趋势，我和老公都有点儿嫉妒了。",vn:"Thiên Thiên đến khiến vợ chồng tôi đỡ lo hẳn. Sáng nào hai đứa cũng tự dậy không cần gọi, đi học không cần đưa đón, làm bài không cần đôn đốc; chúng không đánh nhau, không giận dỗi, hòa thuận khỏi phải nói. Thấy con gái thân thiết với Thiên Thiên đến mức như sắp “bỏ rơi” bố mẹ, vợ chồng tôi đều thấy hơi ghen tị.",idea:"Hai đứa trẻ ngoan, hòa thuận — bố mẹ đỡ lo, còn hơi “ghen”.",q:["天天来了以后，两个孩子表现怎么样？","“我”和老公为什么有点儿嫉妒？"],note:[["不用叫就醒了，上学不用接送，做作业不用督促","Chuỗi ba vế <span class='zh'>不用……</span> nhấn mạnh trẻ tự giác — mẫu câu liệt kê rất hay dùng trong bài viết."],["大有忽略我们的趋势","<span class='zh'>大有……的趋势</span> = rất có xu hướng… (văn viết, hơi hài hước ở đây)."]]},{zh:"这天晚上，两个孩子做完作业，开始滔滔不绝地聊了起来，一个说，我不喜欢王朵朵，她就喜欢跟穿得漂亮的同学一起玩儿，还老嘲笑别人。另一个说我讨厌高春来，他最会讨好老师了……",vn:"Tối hôm đó, hai đứa làm bài xong rồi bắt đầu nói chuyện thao thao bất tuyệt. Một đứa nói: con không thích Vương Đóa Đóa, bạn ấy chỉ thích chơi với những bạn ăn mặc đẹp, lại còn hay chế giễu người khác. Đứa kia nói: con ghét Cao Xuân Lai, bạn ấy giỏi nịnh thầy cô nhất…",idea:"Hai đứa trẻ nói xấu bạn sau lưng.",q:["两个孩子在聊什么？"],note:[["一个说……，另一个说……","Mẫu kể chuyện: <span class='zh'>一个说……，另一个说……</span> — xem <b>Bài tập 4</b>."]]},{zh:"我和老公对视一眼，这么小的孩子怎么学会了背后议论人。我郑重地走到她们跟前，严肃地说：“看到别人有缺点，应该当面说，背后说人家的坏话不好。”老公也在旁边附和：“大伙儿要和睦相处，对人要宽容。”女儿却是一脸的疑惑，反问道：“你们不是也有时候说，哪个朋友好相处，哪个朋友很自私吗？”瞬间我和老公被问得说不出话来，屋子里鸦雀无声。",vn:"Vợ chồng tôi liếc nhìn nhau: con còn nhỏ thế sao đã học thói bàn tán sau lưng người khác. Tôi nghiêm trang bước đến trước mặt hai đứa, nói một cách nghiêm túc: “Thấy người khác có khuyết điểm thì nên nói thẳng trước mặt, nói xấu sau lưng người ta là không tốt.” Chồng tôi cũng phụ họa: “Mọi người phải sống hòa thuận, đối xử với người khác phải rộng lượng.” Thế nhưng con gái lại ngơ ngác, hỏi ngược: “Chẳng phải bố mẹ cũng có lúc nói bạn này dễ chơi, bạn kia ích kỷ lắm đó sao?” Trong phút chốc, hai vợ chồng tôi bị hỏi đến cứng họng, cả phòng lặng ngắt như tờ.",idea:"Bố mẹ dạy con — bị con hỏi ngược đến cứng họng.",q:["父母怎样教育孩子？","女儿的疑惑是什么？"],note:[["你们不是也有时候说……吗？","Câu hỏi tu từ <span class='zh'>不是……吗？</span> = khẳng định: “bố mẹ cũng nói thế còn gì”."],["瞬间我和老公被问得说不出话来","Câu bị động <span class='zh'>被 + V + 得 + kết quả</span>: bị hỏi đến mức không nói được gì."]]},{zh:"人们常说，启蒙老师的重要性不可忽视，父母就是孩子的第一任老师，这话确实不假，可如果这次不是女儿反驳，我还意识不到，我们自己的做法和对孩子的要求实行的是两套标准，那便是对自己宽容，对孩子严厉。孩子也可以是我们的老师啊。",vn:"Người ta thường nói, vai trò của người thầy vỡ lòng không thể xem nhẹ, cha mẹ chính là người thầy đầu tiên của con — câu ấy quả không sai. Nhưng nếu lần này không bị con gái phản bác, tôi vẫn chưa nhận ra rằng cách mình làm và điều mình đòi hỏi ở con là hai tiêu chuẩn khác nhau: dễ dãi với bản thân, khắt khe với con. Con trẻ cũng có thể là thầy của chúng ta.",idea:"Nhận ra bố mẹ đang dùng “hai tiêu chuẩn”.",q:["大人做错了什么？","为什么说“孩子也可以是我们的老师”？"],note:[["……，这话确实不假，可如果……","Mẫu lập luận <b>nhượng bộ – chuyển ý</b>: thừa nhận một nhận định chung, rồi đưa ra góc nhìn khác. Xem <b>Bài tập 4</b>."],["如果这次不是女儿反驳，我还意识不到……","<span class='zh'>如果不是 A，（我）还 B</span> = nếu không có A thì (tôi) vẫn chưa B."],["实行的是两套标准，那便是……","<span class='zh'>……的是……</span> nhấn mạnh tân ngữ; <span class='zh'>那便是</span> = <span class='zh'>那就是</span> (văn viết)."]]},{zh:"说真的，这次是孩子给我上了一课：我深深地感到，想当好父母，首先要约束好自己的言行。",vn:"Nói thật, lần này là con dạy cho tôi một bài học: tôi thấm thía rằng muốn làm cha mẹ tốt, trước hết phải giữ gìn lời nói và việc làm của chính mình.",idea:"Bài học: muốn dạy con, trước hết phải tự kiềm chế lời nói, việc làm.",q:["这个故事告诉我们什么道理？"],note:[["想当好父母，首先要约束好自己的言行。","Câu chủ đề của bài: <span class='zh'>想 + mục đích，首先要 + điều kiện</span>. Nên thuộc lòng để dùng trong bài viết."]]}]},Object.assign(window.LESSON,{G:[{id:"g1",grp:0,word:"巴不得",zh:"巴不得",py:"bābudé",tag:"Chú thích 1 · khẩu ngữ",mean:"Động từ, nghĩa là <span class='zh'>迫切盼望</span> — <b>mong mỏi tha thiết, chỉ mong sao</b>. Dùng trong khẩu ngữ.",forms:["S + 巴不得 + V / mệnh đề","……，S + 巴不得呢！（đứng cuối câu, cảm thán）"],ex:[["有个孩子和我们的独生女朝夕相处，我们巴不得呢！","Có đứa trẻ sớm tối bên con gái một của chúng tôi, chúng tôi còn mong mãi ấy chứ!",1],["就快到春节了，在外地打工一整年的他巴不得马上回到老家和父母、孩子团聚。","Sắp Tết rồi, làm thuê xa nhà cả năm, anh ấy chỉ mong được về quê đoàn tụ với bố mẹ, con cái ngay."],["我巴不得他们能真的和好，从此以后和和睦睦过日子。","Tôi chỉ mong họ làm lành thật sự, từ nay sống với nhau hòa thuận."]],tips:["Mức độ mạnh hơn <span class='zh'>希望 / 盼望</span>.","Không có dạng phủ định <span class='zh'>✗不巴不得</span>.","Đồng nghĩa khẩu ngữ: <span class='zh'>恨不得</span> (hận không thể) — thường dùng cho việc khó/không thể làm."],practice:{q:"用“巴不得”改写句子",items:[["他不来太好了，我就希望他不来呢。","他不来太好了，我巴不得他不来呢。"],["有人请你玩儿你还不去？这样的好事我盼还盼不来呢。","有人请你玩儿你还不去？这样的好事我巴不得呢。"],["我多么希望你来帮帮我呀，怎么会觉得你多事呢？","我巴不得你来帮帮我呢，怎么会觉得你多事呢？"]]}},{id:"g2",grp:0,word:"",zh:"别提多……了",py:"bié tí duō … le",tag:"Chú thích 2 · khẩu ngữ",mean:"Biểu thị <b>mức độ rất cao, không cần nói kỹ</b> — “khỏi phải nói”, mang giọng <b>phóng đại</b>.",forms:["S + 别提多 + Adj / động từ tâm lý + 了"],ex:[["这个人办事，别提多负责了。","Người này làm việc thì có trách nhiệm khỏi phải nói."],["看到女儿对伙伴热情无私，我和老公别提多高兴了。","Thấy con gái nhiệt tình, không ích kỷ với bạn, vợ chồng tôi vui khỏi phải nói.",1],["为了帮我的忙，把他累成那样，弄得我心里别提多过意不去了。","Vì giúp tôi mà anh ấy mệt đến thế, tôi áy náy vô cùng."]],tips:["Phía sau thường là tính từ hoặc động từ tâm lý (<span class='zh'>高兴、生气、喜欢</span>…).","Không đi kèm phó từ mức độ khác: <span class='zh'>✗别提多非常高兴了</span>.","Trong bài còn có: <span class='zh'>关系别提多融洽了</span> (đoạn 3)."],practice:{q:"用“别提多……了”改写句子",items:[["听说女儿把这么好的工作给辞了，妈妈气坏了。","听说女儿把这么好的工作给辞了，妈妈别提多生气了。"],["看到他们两个相处得这么好，我高兴极了。","看到他们两个相处得这么好，我别提多高兴了。"],["联欢会上，我们自编自演的节目特别特别受欢迎。","联欢会上，我们自编自演的节目别提多受欢迎了。"]]}},{id:"g3",grp:2,word:"",zh:"具有语体差别的同义词",py:"",tag:"Chú thích 3 · văn viết ↔ khẩu ngữ",mean:"Có những từ <b>cùng nghĩa nhưng khác phong cách</b>. Từ đứng trước mang màu sắc <b>văn viết (书面语)</b>, từ đứng sau dùng nhiều trong <b>khẩu ngữ (口语)</b>. Khi viết phải chọn từ cho <b>thống nhất phong cách</b> cả bài.",table:[["将","把"],["道","说"],["便","就"],["即","就是"],["令","让"],["食","吃"],["与","和"],["饮","喝"],["是否","是不是"],["虽","虽然"],["仍","还"],["之","的"]],ex:[["天天还没来，林林就变得异常勤劳，<u>将</u>屋子收拾得干干净净……","将 = 把",1],["女儿却是一脸的疑惑，反问<u>道</u>：“……”","道 = 说",1],["我们自己的做法和对孩子的要求实行的是两套标准，那<u>便</u>是对自己宽容，对孩子严厉。","便 = 就",1]],tips:["Đề HSK6 (đọc phần 1 và 缩写) rất hay kiểm tra việc <b>trộn lẫn phong cách</b>.","Bài 缩写 nên dùng một số từ văn viết (<span class='zh'>将、便、与、虽</span>) để bài trang trọng hơn."],practice:{q:"写出与带点词语相对应的口语词",type:"dot",items:[["在<u>与</u>林小雨的相处中，我发现她不仅爽快，还很健谈，跟谁都能滔滔不绝，聊起来没完。","和"],["中国是世界上最早种茶、制茶、<u>饮</u>茶的国家，种茶的历史已有几千年了。","喝"],["他在信中写道：“我不知道这本书<u>是否</u>能让你了解我及我生活的全部，我们努力吧。”","是不是"]]}},{id:"g4",grp:2,word:"",zh:"这话确实不假，可如果……",py:"",tag:"Mẫu câu lập luận (Bài tập 4)",mean:"Thừa nhận một câu nói / quan điểm phổ biến (<span class='zh'>人们常说……，这话确实不假</span>), sau đó <b>chuyển ý</b> bằng <span class='zh'>可如果……</span> để nêu điều ít ai để ý. Rất hữu ích cho bài nói và bài viết nghị luận.",forms:["人们常说 + quan điểm，这话确实不假，可（是）如果 + điều kiện，（就）+ kết luận khác"],ex:[["人们常说，启蒙老师的重要性不可忽视，父母就是孩子的第一任老师，这话确实不假，可如果这次不是女儿反驳，我还意识不到……","",1],["人们常说“有钱就有幸福”，这话确实不假，可如果一个人只知道赚钱，没有时间陪伴家人，他也不一定幸福。","Người ta thường nói “có tiền là có hạnh phúc”, câu này không sai, nhưng nếu chỉ biết kiếm tiền, không có thời gian ở bên gia đình thì chưa chắc đã hạnh phúc."]],tips:["Mẫu kể chuyện đi kèm: <span class='zh'>一个说……，另一个说……</span> — dùng khi thuật lại lời hai người."]}],BX:{grp:1,word:"人家",pair:"人家 — 别人",same:["Đều là <b>đại từ</b>, có thể chỉ người ngoài người nói và người nghe, <b>không xác định</b>.","人家/别人都这么说，可是我不相信。"],diff:[["Có thể chỉ <b>một/những người cụ thể</b> đã xuất hiện ở trước, gần bằng <span class='zh'>他 / 他们</span>.","李阳天天帮我复习功课，我要是考不好，都对不起人家（指李阳）。","Không có cách dùng này."],["Có thể chỉ <b>chính người nói</b> = <span class='zh'>我</span> (thân mật, nũng nịu, hay dùng khi con gái làm nũng).","你跑慢点儿行不行？人家跟不上。","Không có cách dùng này."]],task:{q:"下列句子中的“人家”指的是什么？",cols:["别人","前边说过的人","说话人自己"],items:[["我说了我的观点，可是人家都不同意。",0,"Không xác định cụ thể — mẫu."],["你老给小丽打电话，不知道人家喜欢不喜欢你啊！",1,"人家 = 小丽, người đã nhắc ở trước."],["你把我的生日都忘了，人家能不生气吗？",2,"人家 = 我 (giọng nũng nịu)."],["你昨天借了小王100块钱，今天别忘了还给人家！",1,"人家 = 小王."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["反<u>问</u>","询问 · 提问 · 疑问 · 问题"],items:[["爽<u>快</u>","快","痛快 · 愉快 · 凉快 · 赶快"],["<u>打</u>架","打","打听 · 打针 · 打工 · 打包"],["<u>亲</u>密","亲","亲戚 · 亲切 · 亲情 · 亲自"],["<u>反</u>驳","反","反对 · 反抗 · 反思 · 相反"]]},EX2:{q:"用所给词语或结构改写句子",items:[["听到这个消息，大家非常兴奋，忍不住欢呼起来。","异常","听到这个消息，大家异常兴奋，忍不住欢呼起来。"],["他做得最好吃的菜是西红柿炒鸡蛋。","拿手","他的拿手菜是西红柿炒鸡蛋。"],["我的工作就是不断提醒食品厂加强卫生管理。","督促","我的工作就是督促食品厂加强卫生管理。"],["这个老师很严格，谁不做作业都不行。","严厉","这个老师很严厉，谁不做作业都不行。"],["我非常希望能马上回家见到妈妈。","巴不得","我巴不得能马上回家见到妈妈。"],["这件事情太复杂了，我一个人根本处理不了。","别提多……了","这件事情别提多复杂了，我一个人根本处理不了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["和睦","绅士","爽快","宽容","十足"],text:"我老公是个热心人，别人有事需要帮忙时，他总是{爽快}地答应；我老公也很{宽容}，能原谅伤害过他的人，几乎跟所有的人都能{和睦}相处；我老公还很{绅士}，不管是挤汽车，还是上电梯，都坚持女士优先，风度{十足}，我身边的朋友都羡慕我找了个好老公。"},{bank:["别扭","亲密","嘲笑","当面","反问"],text:"我和小丽关系很融洽，从来没闹过{别扭}。可突然有一天，我听说小丽在背后{嘲笑}我长得又胖又丑，我非常吃惊，马上要找她{当面}问个究竟。小丽听了我的话后，笑了，她{反问}道：“你觉得我会说那样的话吗？一定是有人嫉妒我们关系好，故意那么说的。”我的疑惑没有了，我们仍然是{亲密}的朋友。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"这天晚上，两个孩子做完作业，开始滔滔不绝地聊了起来，<u>一个说</u>，我不喜欢王朵朵……<u>另一个说</u>我讨厌高春来，他最会讨好老师了……",task:"刚一下课，他们就争论起来，一个说______，另一个说______。",model:"刚一下课，他们就争论起来，一个说周末应该去爬山，另一个说周末应该在家好好休息。"},{src:"人们常说，启蒙老师的重要性不可忽视，父母就是孩子的第一任老师，<u>这话确实不假</u>，<u>可如果</u>这次不是女儿反驳我，我还意识不到……",task:"人们常说“有钱就有幸福”，这话确实不假，可如果______。",model:"人们常说“有钱就有幸福”，这话确实不假，可如果为了赚钱失去了健康和家人的陪伴，有再多的钱也不会幸福。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["天天要来“我们”家，“我们”全家的态度怎么样？","①“我”和老公的态度：…… ②林林的态度：…… ③全家别提多……了","“我”和老公爽快地答应了；林林最兴奋，要用爸爸的拿手菜欢迎天天，还要和她共用书桌；全家别提多高兴了。"],["天天到来之前，林林有什么变化？","①变得异常…… ②……收拾得…… ③……摆放得…… ④什么好事都……","林林变得异常勤劳，把屋子收拾得干干净净，东西摆放得整整齐齐，什么好事都想着天天。"],["天天来了之后，两个孩子表现如何？","早上……，上学……，做作业……，不……，不……，关系……","早上不用叫就醒，上学不用接送，做作业不用督促，不打架，不闹别扭，关系别提多融洽了。"],["两个孩子做错了什么？父母怎样教育他们？","①一个说……，另一个说…… ②“我”严肃地说：“……” ③老公附和：“……”","两个孩子在背后议论同学：一个说王朵朵老嘲笑别人，另一个说高春来最会讨好老师。“我”严肃地说，有缺点应该当面说，背后说人家坏话不好；老公附和说大家要和睦相处，对人要宽容。"],["孩子的疑惑是什么？大人有什么做错了的地方？","①女儿反问：“你们不是也……吗？” ②两套标准：对自己……，对孩子……","女儿反问：“你们不是也有时候说哪个朋友好相处、哪个朋友很自私吗？”大人实行的是两套标准：对自己宽容，对孩子严厉。"],["这个故事告诉我们什么道理？","想当好父母，首先要……","想当好父母，首先要约束好自己的言行。孩子也可以是父母的老师。"]]},BJ:{title:"病句类型：词语误用（一）",vn:"Câu sai — loại 1: dùng sai từ",intro:"Nhiều từ gần nghĩa chỉ khác nhau rất nhỏ: <b>phạm vi nghĩa rộng/hẹp</b>, <b>nặng/nhẹ</b>, <b>trọng điểm nghĩa</b>, <b>khen/chê</b>… Sơ ý một chút là dùng sai.",types:[["词义范围大小","Phạm vi nghĩa rộng – hẹp","在公益<u>行为</u>中，受助者固然得益，助人者也获得了精神的满足。","行为 → 行动","<span class='zh'>行为</span> thường là của cá nhân; hoạt động tập thể dùng <span class='zh'>行动</span>."],["词义轻重","Nghĩa nặng – nhẹ","他的毕业论文被评为优秀论文，爸妈都为儿子的<u>成就</u>高兴。","成就 → 成绩","<span class='zh'>成就</span> = thành tựu lớn trong sự nghiệp; luận văn tốt chỉ là <span class='zh'>成绩</span>."],["个体名词与集体名词","Danh từ cá thể – tập thể","飞机还没落地，接机大厅便站满了数百名前来迎接的<u>人群</u>。","人群 → 人","<span class='zh'>人群</span> là danh từ tập thể, không đếm bằng <span class='zh'>数百名</span>."],["词义侧重点","Trọng điểm nghĩa khác nhau","网络的隐蔽性，使人在交往中减少了顾虑，就算是初次在聊天室搭话，也可以做到无所<u>拘谨</u>。","拘谨 → 拘束","<span class='zh'>拘谨</span> nhấn vào quá thận trọng; <span class='zh'>无所拘束</span> = không gò bó."],["褒贬义","Sắc thái khen – chê","我们的晚会开得可<u>喧闹</u>了，大家玩儿得高兴极了，直到凌晨才散。","喧闹 → 热闹","<span class='zh'>喧闹</span> mang nghĩa chê (ồn ào khó chịu); vui vẻ đông vui là <span class='zh'>热闹</span>."]],practice:[["看到这样的事情，我惊讶得目瞪口呆，不信任这样离奇的事竟然真的在我眼前发生了。","不信任","不相信","Phạm vi nghĩa: <span class='zh'>信任</span> = tin tưởng (một người); tin một sự việc là thật → <span class='zh'>相信</span>."],["这次比赛暴露出很多思维敏捷、口才出众、演讲能力强的学生。","暴露","涌现","Khen – chê: <span class='zh'>暴露</span> dùng cho điều xấu (lộ ra); người tài xuất hiện nhiều → <span class='zh'>涌现</span>."],["他们觉得你刚工作，年龄又小，实际上你聪明，能力也很强，你不能太衰弱了，要做生活的强者。","衰弱","软弱","Trọng điểm nghĩa: <span class='zh'>衰弱</span> = suy nhược (cơ thể); yếu đuối về tính cách → <span class='zh'>软弱</span>."],["越是到了冬天，我越爱迟到，这星期我迟到了好几次，老师批判了我，弄得我好没面子。","批判","批评","Nặng – nhẹ: <span class='zh'>批判</span> = phê phán (tư tưởng, sai lầm nghiêm trọng); đi muộn chỉ bị <span class='zh'>批评</span>."],["每到上下班的时候，马路上一辆辆的车辆排成长龙，把马路堵得水泄不通。","车辆","车","Cá thể – tập thể: <span class='zh'>车辆</span> là danh từ tập thể, không dùng với <span class='zh'>一辆辆</span>."]]},DP:{title:"词汇：熟悉下列词语搭配",items:[["留恋","liúliàn","lưu luyến","十分留恋 / 留恋故土","飞机起飞了，对这片土地，我心中充满留恋。"],["开朗","kāilǎng","cởi mở, vui tươi","性格开朗 / 心情开朗","她开朗乐观，热爱生活。"],["闲话","xiánhuà","chuyện phiếm; lời ra tiếng vào","说闲话","大家在院里聊了会儿闲话，就回家了。"],["风趣","fēngqù","dí dỏm, hóm hỉnh","幽默风趣","王教授讲课十分风趣，选他的课的人特别多。"],["恩怨","ēnyuàn","ân oán","个人恩怨 / 恩怨情仇","我们决定，为了工作，忘掉多年的恩怨。"],["娇气","jiāoqi","yếu ớt, nhõng nhẽo","太娇气了","她个子瘦小，却不娇气。"],["伶俐","línglì","lanh lợi","口齿伶俐 / 聪明伶俐","他们有个聪明伶俐的好儿子。"],["挑剔","tiāoti","kén chọn, bắt bẻ","过分挑剔","她把自己打扮得很美，美得无可挑剔。"],["挑拨","tiǎobō","xúi giục, gây chia rẽ","挑拨离间","没有人能够挑拨我们之间的关系。"],["气质","qìzhì","khí chất","有气质 / 气质优雅","他变得更英俊，也更有气质了。"],["容貌","róngmào","dung mạo","容貌秀美","她不但有出众的容貌，而且心地善良。"],["福气","fúqi","phúc, phúc phần","有福气 / 福气大","一生没有遇到战争就是福气。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"妈妈不在家，明明像个小绅士，把阿姨迎进门，跑到桌子前，费力地踮起脚尖，倒了一大杯凉茶，郑重地捧到阿姨面前。阿姨别提多感动了，接过凉茶，瞬间，暑气已经消散了一半。",o:["阿姨特别喜欢孩子","阿姨去明明家做客","明明很喜欢喝凉茶","明明自己喝茶自己倒"],a:1,why:"明明“把阿姨迎进门”, “倒了一大杯凉茶……捧到阿姨面前” → dì đến nhà Minh Minh làm khách."},{n:2,say:"露西来到我家。早餐我准备了包子和小馄饨，孩子们边吃边聊，滔滔不绝。吃完早饭，露西对我说：“这是我吃过的最好吃的美味佳肴，非常感谢您！”我瞬间被露西的赞美感动了。",o:["露西跟“我”很亲密","露西特别不会说话","“我”嫉妒露西会说话","“我”被露西称赞很高兴"],a:3,why:"“我瞬间被露西的赞美感动了” → được khen nên rất vui."},{n:3,say:"到底应该怎样培养孩子？显然，过分地溺爱、过度地保护、天天督促他们埋头在书本堆里死读书都是错误的。大家知道，自然是孩子的天性，自由是孩子的本性，约束天性和本性，就是扼杀成长的活力和动力，这样的教育一定不会成功。",o:["孩子应有人督促","孩子都喜欢自由","父母知道应该怎样培养孩子","溺爱孩子会扼杀成长的动力"],a:1,why:"“自由是孩子的本性” → trẻ con đều thích tự do. (D sai: cái “扼杀动力” là <i>gò bó bản tính</i>, không phải nuông chiều.)"},{n:4,say:"我很喜欢古典小说《西游记》里的孙悟空，他勇敢、聪明，能分清好人与坏人，他用超人的本领守护他的师傅和弟兄们，就像我们生活里的警察，抓坏人，帮好人，时刻保卫着我们，这就是《西游记》给我的启示。",o:["孙悟空是警察","孙悟空很有风度","我们都离不开孙悟空","《西游记》是一本小说"],a:3,why:"“古典小说《西游记》” → Tây Du Ký là một cuốn tiểu thuyết. (A sai: chỉ là “就像” cảnh sát.)"},{n:5,say:"当孩子告诉父母“我感到难受”“我很失望”时，粗心的父母往往会一笑了之，甚至会说：“小孩子，有什么可失望的。”这就是现今多数父母存在的问题，他们忽略了孩子的心理成长。",o:["孩子应关注父母的健康","父母也应学会讨好孩子","有些父母让孩子感到失望","父母应重视孩子的心理成长"],a:3,why:"“他们忽略了孩子的心理成长” → bố mẹ nên coi trọng sự phát triển tâm lý của con."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：张老师，我最近拜读了一些您在杂志上发表的关于青少年教育的文章，很受启发，很多家长也想借今天的机会向您请教一些生活中碰到的实际问题。我就开门见山了，第一个问题就是怎样才能帮助孩子养成良好的学习习惯和生活习惯。\n女：家长要从小培养孩子自己做主的能力，要让孩子自己设定做事规则，然后自己遵守，大了，要懂得自己承担结果。要相信孩子有能力做到这一点，让他们自己建立好的生活习惯。家长的作用只是引导他们，在旁边鼓励他们，告诉他们错在哪儿。好的生活习惯是一点一点建立的，要给他们时间去坚持。\n男：有些家长很苦恼，觉得孩子很大了，独立自主的生活能力却很差。\n女：我认为，最重要的一点就是要学会给孩子独立成长的空间。现在很多家长什么事都替孩子做了，让他们丧失了锻炼的机会。家长以为这就是爱，实际是害！家长要克制自己保护的欲望，不要事事都不放心，要让孩子拥有成长的空间。\n男：您说得有道理，家长也巴不得孩子能自己的事自己做主呢，可是如今生活节奏很快，一步走错就可能耽误一生，孩子的事输不起呀。\n女：可是谁都不能代替孩子一辈子啊！\n男：还有一些家庭，在孩子教育问题上，爷爷奶奶、姥姥姥爷和孩子的父母会出现不同意见，这时候应该怎么办呢？\n女：无论意见多么不同，家庭成员之间最重要的是沟通。家庭和睦、彼此融洽是首要的，最怕的是吵架，或者是大伙儿同时过于严厉或过于慈爱。家庭成员要有角色定位，老公扮演慈父，妻子就是严母；老公扮演严父，妻子就是慈母。过于严厉，孩子可能会出现离家出走或者自杀的极端行为；过于慈爱，对孩子的成长也是不利的。",qs:[{n:6,q:"关于张老师，可以知道什么？",o:["她是一名作家","她在杂志社工作","她研究青少年教育","她是一位严厉的母亲"],a:2,why:"“您在杂志上发表的关于青少年教育的文章” → cô nghiên cứu giáo dục thanh thiếu niên."},{n:7,q:"张老师觉得应该怎样培养孩子良好的学习习惯和生活习惯？",o:["教育孩子不能害怕失败","要教会孩子做事有计划","不能让孩子事事自己拿主意","应该学会多引导和鼓励孩子"],a:3,why:"“家长的作用只是引导他们，在旁边鼓励他们”."},{n:8,q:"怎样解决孩子独立自主能力缺乏的问题？",o:["家长不要太能干了","家长不要包办代替","要让孩子懂得负责","要多给孩子一些爱"],a:1,why:"“很多家长什么事都替孩子做了……要让孩子拥有成长的空间” → đừng làm thay con (包办代替)."},{n:9,q:"家长为什么总喜欢事事代替孩子做？",o:["他们怕孩子做错了主","他们想一生替孩子做主","他们觉得孩子做不了主","他们觉得孩子做事没道理"],a:0,why:"“一步走错就可能耽误一生，孩子的事输不起” → sợ con quyết định sai."},{n:10,q:"家庭成员之间，在教育孩子的问题上意见不一致时要注意什么？",o:["要多和老师沟通","要多替对方着想","要多给孩子一些爱","家庭成员之间不要吵架"],a:3,why:"“家庭和睦、彼此融洽是首要的，最怕的是吵架”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"新美南吉，1913年出生于日本爱知县半田市。童话和儿童小说作家。日本儿童文学研究者石井桃子曾说过：“北有宫泽贤治，南有新美南吉。”新美南吉代表作《小狐狸阿权》《小狐狸买手套》《去年的树》等多篇经典童话被日本、韩国、中国选入语文教材。他终生独身，英年早逝，去世时仅仅30岁。他的童话和儿童小说极具人情味，重视故事性。家乡的自然风土人情造就了他非凡的感受力，复杂的家庭环境和贫困体弱等生活背景又使得他在作品中对处于不同生存状态的人和动物寄予了无限的同情。为了纪念新美南吉，在他的家乡爱知县半田市建有“新美南吉纪念馆”；以他的名字命名的“新美南吉儿童文学奖”是日本最重要的儿童文学奖项之一。",qs:[{n:11,q:"根据这段话，可以知道什么？",o:["新美南吉懂韩语和汉语","新美南吉一生没有结婚","新美南吉30岁成名","新美南吉最喜欢狐狸"],a:1,why:"“他终生独身” = cả đời không kết hôn."},{n:12,q:"关于新美南吉的作品，可以知道什么？",o:["在日本南方知道的人不多","只有三篇作品称得上经典","作品主要描写家乡的自然风景","中国的语文课本选了他的作品"],a:3,why:"“被日本、韩国、中国选入语文教材”."},{n:13,q:"人们是怎么纪念新美南吉的？",o:["在他的家乡建了纪念馆","大力参与保护动物的活动","出版了新美南吉的所有童话","以他的童话命名儿童文学奖"],a:0,why:"“在他的家乡……建有‘新美南吉纪念馆’”. (D sai: giải thưởng mang <i>tên ông</i>, không phải tên truyện.)"}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"“子不教，父之过”，意思是说生养了孩子却不教育，是父亲的过错，这句话一点儿也不假。父亲参与家教有利于子女的智力开发和体质的增强。父亲与孩子游戏时，善于变换花样，更能满足孩子不同爱好和情趣的需要。父亲参与家教有利于培养子女的社交能力。父亲常和孩子在一起，孩子在人际关系中就有安全感和自尊心，容易与他人友好相处。此外，父亲参与教育孩子还能促使孩子产生对事业成就的追求。社会学家认为，一个人的事业成就感同父亲与他们的关系有密切的联系。换言之，与父亲关系密切的子女，一般都有较强的上进心和工作毅力。如果父亲和母亲一起关心培养孩子，那么无论男孩还是女孩，在语言、理解各种概念和数学计算等方面都会发展得比较全面。大量研究资料表明：孩子总是接受母亲的教育而缺乏父亲的参与，就容易产生依赖性，一旦离开家庭，独立自主能力差的问题就会体现出来。因此，“子不教，父之过”这话一点儿都不假。",qs:[{n:14,q:"“子不教，父之过”是什么意思？",o:["过去父亲不管教育子女","培养孩子比给他生命重要","孩子不愿意接受父亲的管教","孩子没教育好是父亲的责任"],a:3,why:"“生养了孩子却不教育，是父亲的过错”."},{n:15,q:"父亲参与家教的好处是什么？",o:["孩子会有更多爱好","孩子会变得更有情趣","孩子会更懂得尊重别人","孩子的事业心会更强"],a:3,why:"“促使孩子产生对事业成就的追求……有较强的上进心”."},{n:16,q:"如果家教中缺乏父亲的参与，孩子可能怎样？",o:["容易与他人相处","独立自主能力差","不愿意参加体育活动","不知道怎样能够成功"],a:1,why:"“缺乏父亲的参与，就容易产生依赖性……独立自主能力差”."},{n:17,q:"这段话主要想告诉我们什么？",o:["孩子更喜欢依赖母亲","缺少父爱的孩子问题多","父亲在家教中不可缺少","孩子在父爱下学会坚强"],a:2,why:"Cả đoạn chứng minh vai trò của bố trong giáo dục gia đình."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["明清时期，这里成了旅游胜地。","我约好了，下午去见面我的朋友。","他人倒是挺好，就是有时候太任性，也不够宽容。","如果你想听清别人说什么话，就别急着嚷嚷，耐心听别人把话说完。"],a:1,why:"<span class='zh'>见面</span> là từ ly hợp, không mang tân ngữ → <span class='zh'>下午去和我的朋友见面</span> / <span class='zh'>去见我的朋友</span>."},{n:19,o:["我的家乡在南方，夏天比这里热极了。","她这个人就是爽快，我喜欢和这样的人打交道。","“接触”无疑是重要的，因为只有接触了，才会了解。","今天是妈妈的生日，我决定在她下班前给她做两样我的拿手好菜。"],a:0,why:"Câu so sánh <span class='zh'>比</span> không dùng <span class='zh'>极了 / 很 / 非常</span> → <span class='zh'>比这里热多了 / 热得多</span>."},{n:20,o:["苏轼，号东坡居士，北宋文学家、书画家、美食家。","书法和围棋，都是在一个共同的社会和文化背景下发展起来的。","晚会散了，我们十多个同学们意犹未尽，想再找个地方接着玩儿。","张家口的地理位置非常重要，是沟通华北平原与山西、内蒙古的交通要道。"],a:2,why:"Đã có số lượng <span class='zh'>十多个</span> thì không thêm <span class='zh'>们</span> → <span class='zh'>十多个同学</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"20世纪80年代中期，学生骑车上学成为风尚，___一人一辆自行车，学校一放学，景象颇为壮观。白天学校最安静的地方就是车棚，成___的自行车一辆挤靠着一辆，___就没有下脚的地方，我真佩服他们是怎么取车回家的。",o:["大概　辆　好在","大约　堆　实在","险些　行　确定","几乎　片　简直"],a:3,why:"<span class='zh'>几乎</span> (gần như ai cũng) · <span class='zh'>成片</span> (thành từng mảng) · <span class='zh'>简直</span> (quả thực, phóng đại)."},{n:22,text:"所谓“421家庭”，指四个老人、一对夫妻、一个孩子。___第一代独生子女___婚育年龄，这种家庭模式开始出现。___这种“倒金字塔”式的家庭结构，衍生出的现实问题就是如何养老、如何教育孩子，身处“上有老、下有小”的中间层如何___异常巨大的生活压力。",o:["跟随　走进　由　承载","陪着　开始　以　忍耐","跟着　进行　却　接受","随着　步入　而　承受"],a:3,why:"<span class='zh'>随着……步入……年龄</span> · <span class='zh'>而</span> nối ý · <span class='zh'>承受压力</span> (kết hợp cố định)."},{n:23,text:"孩子会___了，会走了，就要给孩子准备一些玩具，满足孩子的好奇心。这些玩具不管类型如何，都要注意安全和卫生。比如，毛绒玩具可以___阳光暴晒来杀毒；木质玩具可以用肥皂水洗烫。除了卫生清洁之外，玩具上___的小部件也需引起家长的注意，不要让孩子___入口中。",o:["吃　凭借　安装　吸","睡　使用　设计　咬","爬　通过　掉落　吞","笑　利用　具有　吃"],a:2,why:"Trình tự phát triển <span class='zh'>会爬 → 会走</span> · <span class='zh'>通过……来……</span> · <span class='zh'>掉落的小部件</span> · <span class='zh'>吞入口中</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"中国古代有个人叫王冕，七八岁时，父亲叫他去放牛，他偷偷地跑进学堂，听学生念书，听完以后就默默地记在心里。傍晚，他常常自己回到家，(24)。父亲很生气，自然就会打王冕。但过后，王冕仍是这样。后来，王冕的母亲说：“(25)，何不由着他呢？”王冕从此以后就离开家去读书，晚上寄住在寺庙里。\n每到夜里，王冕就坐在佛像的膝盖上，拿着书本，就着佛像前的灯光诵读，书声琅琅，(26)。\n韩性听说了王冕的事情，觉得他与众不同，就将他收作学生。后来，(27)。\n王冕的父亲去世之后，(28)。时间长了，母亲想要回老家，王冕就买来头牛，架上车，母亲坐在车上，王冕亲自跟在车后，随同母亲一同回家。",opts:["一直读到天亮","把放的牛都忘了","这孩子想读书都入迷了","王冕把母亲接到自己的住处敬养","王冕成了著名的画家、诗人"],ans:{24:1,25:2,26:0,27:4,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"因为平时没有时间看电视、玩儿电脑，一放假，有的孩子就整天坐在电视机前，一直到电视里没了节目才肯罢休；有的孩子抱着平板电脑或坐在台式电脑前，打游戏长达十几个小时；还有的家长，为了鼓励孩子考出好成绩，把假期随便看电视、玩儿电脑作为奖励，并给孩子买来各种零食助阵。\n专家指出：如此看电视、玩儿电脑会损害孩子的身心健康。首先，长时间盯着电视看，会导致眼疲劳，影响视力。其次，或躺或靠，姿势五花八门，会引起脖子软组织劳损。再次，边吃边看电视，会导致消化不良。更应注意的是，孩子专注于看电视、玩儿电脑，会减少与家人、外界的沟通。\n大家都知道，孩子往往缺乏自制力，帮助孩子管住自己最好的“医生”就是家长。家长要正确引导孩子科学看电视。每天看电视的时间应有控制；人与电视间的距离要在三米左右；电视机的高度应与人的视线平行；看半个小时电视就应该休息一会儿，到户外活动活动；要保持端正的姿势，不要东倒西歪；进餐时不要看电视；看电视后要洗脸，洗去脸上含有静电的尘埃和微生物。\n对使用电脑的孩子们来说，保护眼睛是十分重要的。父母要告诉孩子，用电脑时要特别注意保护视力。要坚持每隔十分钟休息一下，望望窗外，每天至少要做两次眼保健操，并多吃一些有益眼睛的食物，如鱼、蛋、绿色蔬菜等。",qs:[{n:29,q:"孩子假期会出现什么状况？",o:["不做假期作业","不愿意再上学","有奖励才学习","玩儿命打游戏"],a:3,why:"“打游戏长达十几个小时”."},{n:30,q:"专家的看法是：",o:["躺着看电视比坐着看舒服","视力不好的孩子不能看电视","边看电视边吃东西影响健康","喜欢看电视的孩子不爱说话"],a:2,why:"“边吃边看电视，会导致消化不良”."},{n:31,q:"科学看电视应注意什么？",o:["保持正确的姿势","洗完脸再看电视","离电视越远越好","先看电视后吃饭"],a:0,why:"“要保持端正的姿势”. (B sai: rửa mặt <i>sau khi</i> xem.)"},{n:32,q:"用电脑时应注意什么？",o:["每次休息十分钟","多吃一些肉类食物","打开窗户再用电脑","每隔十分钟休息一次"],a:3,why:"“每隔十分钟休息一下”."}]},{ins:"第33–36题：请选出正确答案。",text:"曾几何时，《劳动最光荣》的儿歌响彻大江南北，影响了一代又一代人。对于35岁以上的绝大多数人而言，他们还是孩子的时候，勤劳致富、劳动光荣等传统美德就深深地扎根在他们的心里。\n可现在的一些孩子，同他们讲热爱劳动、勤劳致富，他们会认为这些都过时了。一位小学三年级学生的妈妈说，三年级以前我还会让孩子自己洗洗袜子，后来作业多了，就不让孩子洗了，也基本不让她参与家务劳动。实际情况是，劳动在家庭教育里日渐缺失。是否需要补齐、如何补齐劳动这一课，是不少家长所困惑的。\n一位品学兼优的中学生的家长却向记者展示了一份特别的简历——她女儿的“日常考核表”。这份考核表中包括劳动、礼貌等指标。家长说：“从幼儿园开始，我们就要求孩子逐渐学会自理，参与家庭劳动，在她上小学时就带她参加植树、去养老院打扫卫生等。”可见学习任务重，不是孩子舍弃劳动的理由。\n有教师认为，家庭中的劳动教育需要家长用心设计。家长要根据孩子的身体状况、时间状况制订劳动计划，并和孩子一起体验；还可以设计一些创意性劳动，让孩子参与其中，享受由此带来的成就感。事实证明，转变家长对孩子参与劳动的观念，使家长先意识到劳动在孩子学习、生活和未来长远发展中的积极意义，是改变孩子不参加劳动的根本办法。",qs:[{n:33,q:"关于《劳动最光荣》，我们知道：",o:["对很多年轻人有影响","孩子最喜欢这个电影","影响了中国不止一代人","是中国南方的一首儿歌"],a:2,why:"“影响了一代又一代人”."},{n:34,q:"现在的孩子：",o:["认为劳动能致富","连袜子都不会洗","每天都需要补课","家长不怎么让干活"],a:3,why:"“也基本不让她参与家务劳动”."},{n:35,q:"那位中学生家长展示的特别简历说明：",o:["学习紧张和劳动并不矛盾","爱劳动的孩子也会有礼貌","春天很多孩子都愿意去种树","劳动习惯是在幼儿园养成的"],a:0,why:"“可见学习任务重，不是孩子舍弃劳动的理由”."},{n:36,q:"教师的观点是什么？",o:["孩子可以为家庭设计多出力","孩子不参与劳动的根源在家长","要让孩子意识到劳动的意义","教师应设计带有创意性的劳动"],a:1,why:"“转变家长……的观念……是改变孩子不参加劳动的根本办法” → gốc rễ nằm ở phụ huynh."}]}]},W:{task:"这篇课文通过家庭生活中的一件小事告诉我们：虽然父母是孩子的启蒙老师，可有时孩子也是父母的老师。要想当好父母，首先要约束好自己的言行。请参考练习5，把课文缩写成300字左右的短文。",target:300,steps:[["Giữ khung","Giữ đủ <b>nhân vật – sự việc – diễn biến – kết quả – bài học</b>. Theo bố cục 起 → 转 → 合 (3 đoạn)."],["Lược bỏ","Bỏ chi tiết miêu tả phụ (美味佳肴, 共用书桌…), bỏ tên các bạn bị nói xấu nếu cần."],["Chuyển lời thoại","Đổi lời thoại trực tiếp thành gián tiếp: <span class='zh'>“我”严肃地说……</span> → <span class='zh'>我告诉她们，有缺点应该当面说……</span>"],["Giữ câu then chốt","Giữ nguyên câu chủ đề: <span class='zh'>想当好父母，首先要约束好自己的言行。</span>"],["Không thêm ý","Không thêm bình luận cá nhân. Đề HSK6 thật: đọc 1000 chữ trong 10 phút, viết lại khoảng <b>400 chữ</b> trong 35 phút, tự đặt tiêu đề."]],model:"孩子给我们的启示\n林林和天天是同学。天天的父母要出差，请我们照看她几天，我和老公爽快地答应了。林林非常兴奋，天天还没来，她就变得异常勤劳，把屋子收拾得干干净净。天天来了以后，两个孩子早上不用叫就起床，上学不用接送，做作业不用督促，关系别提多融洽了。\n一天晚上，两个孩子聊天时，一个说不喜欢王朵朵，因为她老嘲笑别人；另一个说讨厌高春来，因为他最会讨好老师。我严肃地告诉她们，看到别人有缺点应该当面说，背后说人家的坏话不好。老公也附和说，大家要和睦相处，对人要宽容。没想到女儿反问道：“你们不是也常说哪个朋友好相处，哪个朋友很自私吗？”我和老公一下子说不出话来。\n这件事让我意识到，我们对自己宽容，对孩子严厉，实行的是两套标准。父母是孩子的第一任老师，可孩子也是父母的老师。想当好父母，首先要约束好自己的言行。",check:["Có tiêu đề","Đủ 3 đoạn 起–转–合","Có nhân vật, sự việc, kết quả","Lời thoại đã chuyển sang gián tiếp (giữ tối đa 1 câu trực tiếp quan trọng)","Dùng ít nhất 5 từ mới của bài","Có câu chủ đề ở cuối","Khoảng 300 chữ (±30)"]},SUM:{words:["爽快","异常","勤劳","督促","别扭","融洽","亲密","忽略","嘲笑","讨好","当面","和睦","宽容","反问","启蒙","反驳","意识","严厉","约束","鸦雀无声"],patterns:[["巴不得 + V / mệnh đề","我们巴不得呢！"],["别提多 + Adj + 了","关系别提多融洽了。"],["将 / 道 / 便 (văn viết)","将屋子收拾得干干净净"],["人家 (= 他 / 我)","你老给小丽打电话，不知道人家喜欢不喜欢你啊！"],["……，这话确实不假，可如果……","父母就是孩子的第一任老师，这话确实不假，可如果……"]],diff:["人家：别人 / 前边说过的人（他）/ 说话人自己（我） — 别人：chỉ “người khác” không xác định.","勤劳 ≠ 勤奋 · 忽略 ≠ 忽视 · 严厉 ≠ 严格 · 和睦 ≈ 融洽 · 实行 ≠ 执行"],sentences:["看到别人有缺点，应该当面说，背后说人家的坏话不好。","我们自己的做法和对孩子的要求实行的是两套标准，那便是对自己宽容，对孩子严厉。","想当好父母，首先要约束好自己的言行。"],hw:["Học thuộc 40 từ mới — ưu tiên 20 từ ★ trong bảng tổng kết.","Làm lại Bài tập 2 và 3 không nhìn đáp án.","Viết bài 缩写 khoảng 300 chữ (mục 7), nộp bản viết tay.","Làm Sách bài tập bài 1 (nghe 1–17, đọc 18–36).","Đọc trước bài 2 《父母之爱》."]}});
