<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 16 · 徐健和他的野生动物摄影师们 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}

<script>window.LESSON={id:"hsk6-1-16",num:16,book:"HSK 标准教程 6（上）",unit:{n:4,zh:"走遍天下",vn:"Đi khắp thế giới"},title:"徐健和他的野生动物摄影师们",vn:"Từ Kiện và các nhà nhiếp ảnh động vật hoang dã",chars:898,source:"改编自《人物》文章《IBE挑选摄影师的第一标准 你是不是狂热的Naturalist？》，作者：衷生",goals:["Đọc hiểu bài 898 chữ về <b>IBE</b> — nhóm nhiếp ảnh gia “nhà bác vật học” chụp và lưu trữ hình ảnh đa dạng sinh học Trung Quốc.","Dùng được 45 từ mới, nhất là nhóm <b>bảo tồn</b>: <span class='zh'>濒临 · 致力 · 现状 · 严峻 · 空白 · 识别 · 鉴别 · 评估 · 统计</span> và nhóm <b>đánh giá</b>: <span class='zh'>名副其实 · 高超 · 素质 · 成效 · 显著 · 浓厚 · 权威</span>.","Nắm chen ngữ <span class='zh'>换句话说 · 也就是说</span>, bị động văn viết <span class='zh'>为……所……</span>, <span class='zh'>足以</span>.","Phân biệt <span class='zh'>以便 — 便于</span>; mở rộng <b>14 cặp từ gần nghĩa</b>.","Viết tóm tắt (缩写) 400 chữ và luyện đề 缩写 HSK."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (换句话说) · Bài khóa đoạn 1–2"],["Buổi 2","Nhóm 2–3 (为……所…… · 足以 · 以便—便于) · Đoạn 3–7 · Bài tập · Luyện đề · Viết 缩写"]],outline:[{tag:"一",name:"Mở cảnh",paras:"Đoạn 1–2",zh:"拍雪豹；雪豹濒临消亡；摄影师是“博物学家”",vn:"Cảnh chụp báo tuyết ở độ cao 4500 m; báo tuyết sắp tuyệt chủng; giới thiệu nhóm nhiếp ảnh."},{tag:"二",name:"Vấn đề",paras:"Đoạn 3",zh:"认识非洲动物，却不认识藏羚羊；影像空白；卖照片几近童话",vn:"Người ta biết hươu cao cổ nhưng không biết linh dương Tây Tạng; hình ảnh trống rỗng; bán ảnh nuôi hoạt động là “chuyện cổ tích”."},{tag:"三",name:"Giải pháp IBE",paras:"Đoạn 4–6",zh:"社会企业；影像库；集合式工作；科考性质",vn:"Lập doanh nghiệp xã hội, kho ảnh, làm việc tập trung, ảnh mang tính khảo sát khoa học."},{tag:"四",name:"Kết",paras:"Đoạn 7",zh:"天天在路上忙碌着",vn:"Họ vẫn ngày ngày bôn ba trên đường."}],warm1:{q:"看下列图片，熟悉相应的动物的名称。",vn:"Làm quen tên các loài động vật quý hiếm của Trung Quốc.",items:[["🐆","雪豹 xuěbào · 藏狐 zànghú","Báo tuyết · Cáo Tây Tạng"],["🦌","赤斑羚 chìbānlíng · 藏羚羊 zànglíngyáng","Sơn dương đỏ · Linh dương Tây Tạng"],["🐿️","喜马拉雅旱獭 Xǐmǎlāyǎ hàntǎ · 牦牛 máoniú","Sóc đất Himalaya (marmot) · Bò Tây Tạng (yak)"],["🐼","大熊猫 dàxióngmāo · 大紫胸鹦 V:[[1,"野生","yěshēng","tt.","dã sinh","hoang dã",0,"","生物在自然环境里生长而不是由人饲养或栽培的。","野生动植物摄影师们","我们要保护野生动物。","Chúng ta phải bảo vệ động vật hoang dã.",["野生动物"],"Từ có dấu * (không bắt buộc HSK). Khởi động 2: nhóm <span class='zh'>野</span>."],[2,"压抑","yāyì","đgt.","áp ức","kìm nén",1,"","对感情、力量等加以限制，使不能充分流露或发挥。","压抑住兴奋","他压抑不住心中的愤怒。","Anh ấy không kìm nổi cơn giận trong lòng.",["压抑感情"],"Còn là tính từ = ngột ngạt, bức bối: <span class='zh'>心里很压抑</span>."],[3,"完毕","wánbì","đgt.","hoàn tất","xong, hoàn tất",1,"书","完结。","拍摄完毕","考试完毕，请交卷。","Thi xong, xin nộp bài.",["V + 完毕"],"Bài tập 3①. SBT câu 20."],[4,"瞪","dèng","đgt.","trừng","trừng mắt",1,"","用力睁大（眼睛）；睁大眼睛注视，表示不满意。","正瞪着眼睛注视着自己","他生气地瞪了我一眼。","Anh ấy tức giận lườm tôi một cái.",["瞪眼","瞪着"],""],[5,"注视","zhùshì","đgt.","chú thị","nhìn chăm chú",1,"","注意地看。","瞪着眼睛注视着自己","全世界都在注视着这次会议。","Cả thế giới đang dõi theo hội nghị này.",[],"SBT nghe câu 2."],[6,"斑","bān","dt.","ban","đốm, vằn",1,"","一种颜色的物体表面上显露出来的别种颜色的点子或条纹。","皮毛上带着美丽花斑","这只猫身上有黑色的斑点。","Con mèo này có đốm đen trên người.",["斑点","花斑"],""],[7,"濒临","bīnlín","đgt.","tần lâm","kề, đứng trước bờ",1,"书","紧接；临近。","正濒临消亡","这种动物已经濒临灭绝。","Loài vật này đã đứng trước nguy cơ tuyệt chủng.",["濒临灭绝","濒临破产"],"Bài tập 1: <span class='zh'>面临 · 降临 · 光临 · 临时</span>. <span class='zh'>濒危动物</span> = động vật nguy cấp."],[8,"致力","zhìlì","đgt.","trí lực","dốc sức",1,"书","把力量用在某个方面。","致力于保护野生物种","他一生致力于教育事业。","Cả đời ông dốc sức cho sự nghiệp giáo dục.",["致力于……"],"Bài tập 2⑤."],[9,"领袖","lǐngxiù","dt.","lãnh tụ","lãnh tụ, người dẫn đầu",1,"","国家、政治团体、群众组织等的领导人。","徐健是摄影师中的领袖人物","他是学生们心中的领袖。","Cậu ấy là người dẫn dắt trong lòng các bạn học.",["领袖人物"],"Bài tập 1: <span class='zh'>短袖 · 袖子 · 袖口 · 袖手旁观</span>."],[10,"辨认","biànrèn","đgt.","biện nhận","nhận ra, phân biệt",1,"","根据特点辨别，作出判断，以便找出或认定某一对象。","另外4种辨认不出","字迹太模糊，很难辨认。","Nét chữ quá mờ, rất khó nhận ra.",["辨认不出","难以辨认"],"SBT câu 18."],[11,"现状","xiànzhuàng","dt.","hiện trạng","hiện trạng",1,"","目前的状况。","我们的现状是","我们不能满足于现状。","Chúng ta không thể bằ "đội ngũ, đoàn",1,"","有组织的集体；行列。","徐健和他的队伍","我们需要一支专业的队伍。","Chúng ta cần một đội ngũ chuyên nghiệp.",[],"⚠️ 伍 đọc nhẹ <b>wu</b>."]],extra:[["玩耍","wánshuǎ","chơi đùa"],["憋气","biē qì","nín thở"],["相视而笑","xiāngshì ér xiào","nhìn nhau mà cười"],["猫科","māokē","họ mèo"],["博物学家","bówùxuéjiā","nhà bác vật học"],["风餐露宿","fēngcān-lùsù","dãi gió dầm sương"],["创始人","chuàngshǐrén","người sáng lập"],["社会企业","shèhuì qǐyè","doanh nghiệp xã hội"],["影像库","yǐngxiàngkù","kho hình ảnh"],["生物多样性","shēngwù duōyàngxìng","đa dạng sinh học"],["越冬","yuèdōng","qua đông"]],T:[{zh:"中国青海，海拔4500米的山上，3头雪豹正在玩耍。野生动植物摄影师们压抑住兴奋，憋住气，全力拍摄雪豹。拍摄完毕，一回头，发现两只藏在山头的雪豹正瞪着眼睛注视着自己，大家相视而笑。",vn:"Thanh Hải, Trung Quốc, trên ngọn núi cao 4500 mét, ba con báo tuyết đang nô đùa. Các nhiếp ảnh gia động thực vật hoang dã nén cơn phấn khích, nín thở, dồn hết sức chụp báo tuyết. Chụp xong, ngoảnh lại, phát hiện hai con báo tuyết nấp trên đỉnh núi đang trừng mắt nhìn chằm chằm vào mình — mọi người nhìn nhau mà cười.",idea:"Cảnh mở đầu: chụp báo tuyết.",q:["摄影师们在青海遇到了什么有趣的事？"],note:[["压抑住兴奋，憋住气","Hai động từ + bổ ngữ kết quả <span class='zh'>住</span> = giữ chặt."],["拍摄完毕","<span class='zh'>V + 完毕</span> (văn viết) = V xong."]]},{zh:"雪豹，这种皮毛上带着美丽花斑的大型猫科动物正濒临消亡，换句话说，在不久的将来我们很可能再也见不到这种动物。而这些摄影师们是致力于保护野生物种，记录和展示中国生物多样性的“博物学家”。长期风餐露宿在山野，他们不但不觉得苦，反而感到无比的快乐。",vn:"Báo tuyết — loài thú lớn họ mèo có bộ lông vằn đẹp — đang đứng trước bờ diệt vong; nói cách khác, trong tương lai không xa rất có thể ta sẽ không bao giờ gặp lại loài vật này nữa. Còn các nhiếp ảnh gia này là những “nhà bác vật học” dốc sức bảo vệ loài hoang dã, ghi lại và giới thiệu sự đa dạng sinh học của Trung Quốc. Dãi gió dầm sương trên núi lâu ngày, họ không những không thấy khổ mà còn vô cùng vui sướng.",idea:"Báo tuyết sắp tuyệt chủng; giới thiệu nhóm nhiếp ảnh.",q:["这些摄影师为什么被称为“博物学家”？"],note:[["……，换句话说，……","Chen ngữ giải thích — xem Ngữ pháp 1."],["致力于……","<span class='zh'>致力于 + N/V</span> = dốc sức vào."],["不但不……，反而……","Phủ định – tăng tiến ngược."]]},{zh:"徐健是摄影师中的领袖人物，IBE的创始人，他拿出8张照片，我认识大熊猫、金丝猴、牦牛和雪豹，另外4种辨认不出，据说，它们是藏狐、赤斑羚、藏羚羊和喜马拉雅旱獭。徐健说：“我们的现状是，人们能识别长颈鹿、大猩猩、河马，知道它们的来历，却不认识藏羚羊，大家对非洲的动物好像比对我们自己国家的动物更为熟悉。”徐健面带苦涩地说：“许多动植物，连一张清楚的照片都没有，大家不认识，怎么指望保护？更严峻的是自然保护区的影像空白，很多特有物种，还没来得及为我们所了解，就消失了。”徐健和他的朋友曾苦苦琢磨，怎样为野生动物保护尽一份责任。他们不分昼夜地奔波，渴望拍出足以使人疯狂的照片，吸引大家心甘情愿地去购买，以便支撑他们深入野外的巨大开支，但摄影作品不是畅销书，摄影师报酬很低，这样的想法，几近童话。",vn:"Từ Kiện là người dẫn dắt trong nhóm nhiếp ảnh, người sáng lập IBE. Anh đưa ra 8 bức ảnh; tôi nhận ra gấu trúc, khỉ lông vàng, bò Tây Tạng và báo tuyết, 4 con còn lại thì chịu; nghe nói đó là cáo Tây Tạng, sơn dương đỏ, linh dương Tây Tạng và sóc đất Himalaya. Từ Kiện nói: “Hiện trạng của chúng ta là: người ta nhận ra hươu cao cổ, khỉ đột, hà mã, biết cả nguồn gốc của chúng, nhưng lại không biết linh dương Tây Tạng; mọi người dường như quen thuộc với động vật châu Phi hơn cả động vật nước mình.” Từ Kiện chua chát nói: “Nhiều loài động thực vật ngay một tấm ảnh rõ nét cũng không có, mọi người không biết chúng thì trông mong gì bảo vệ? Nghiêm trọng hơn là khoảng trống hình ảnh của các khu bảo tồn — nhiều loài đặc hữu chưa kịp được chúng ta biết đến đã biến mất.” Từ Kiện và bạn bè từng trăn trở mãi, làm sao góp một phần trách nhiệm bảo vệ động vật hoang dã. Họ ngày đêm bôn ba, khao khát chụp được những bức ảnh đủ khiến người ta phát cuồng, thu hút mọi người tự nguyện mua, để gánh khoản chi khổng lồ cho những chuyến vào sâu hoang dã; nhưng ảnh không phải sách bán chạy, thù lao nhiếp ảnh gia rất thấp — ý tưởng ấy gần như chuyện cổ tích.",idea:"Hiện trạng: thiếu hình ảnh → khó bảo vệ.",q:["为什么大家对非洲生物的熟悉程度远远大于自己的国家？","徐健他们以前希望照片可以怎样？结果呢？"],note:[["为我们所了解","Bị động văn viết <span class='zh'>为……所……</span> — xem Ngữ pháp 2."],["足以使人疯狂的照片","<span class='zh'>足以</span> — xem Ngữ pháp 3."],["……，以便……","Xem 辨析 以便—便于."],["连……都没有，……怎么指望……？","Câu hỏi tu từ."]]},{zh:"于是徐健成立了社会企业IBE，为保护区、政府等各类课题提供服务，他们的工作是建立野生动植物影像库，立体还原一个地区的生态多样性。",vn:"Thế là Từ Kiện thành lập doanh nghiệp xã hội IBE, cung cấp dịch vụ cho các đề tài của khu bảo tồn, chính quyền…; công việc của họ là xây dựng kho hình ảnh động thực vật hoang dã, tái hiện lập thể sự đa dạng sinh thái của một vùng.",idea:"Giải pháp: doanh nghiệp xã hội IBE.",q:["IBE的工作内容是什么？"],note:[["为……提供服务","Cụm cố định."]]},{zh:"IBE的摄影师个个是名副其实的博物学家，不但有高超的摄影技术，还有非同一般的专业素质。他们分散在全国各地，徐健一发出号召，大家立刻聚在一起。实践证实，这种集合式工作成效显著，用户也很喜欢他们的作品。",vn:"Nhiếp ảnh gia của IBE ai cũng là nhà bác vật học đúng nghĩa, không chỉ có kỹ thuật chụp điêu luyện mà còn có tố chất chuyên môn khác thường. Họ ở rải rác khắp cả nước, Từ Kiện vừa phát lời kêu gọi là mọi người lập tức tụ họp. Thực tiễn chứng minh, cách làm việc tập trung này hiệu quả rõ rệt, người dùng cũng rất thích tác phẩm của họ.",idea:"Cách làm việc: tập trung khi có dự án.",q:["IBE的工作方式是什么？"],note:[["个个是……","Lặp lượng từ = ai cũng."],["一……，……立刻……","Vừa… là… ngay."]]},{zh:"IBE的作品带有浓厚的科考性质，每张照片都有详细的数据可供使用，比如精确统计的动物数量。一次在梅里雪山遇见大紫胸鹦鹉群，摄影师在Photoshop上一个一个地数，统计出1500只的精确数据，之后权威专家表示，这是有记录以来，近30年此地区出现的最大规模鹦鹉越冬群。拍摄同时，他们还进行物种鉴别、动物行为分析等。项目结束后，他们还会向当地保护区提交一份环境评估调查报告。",vn:"Tác phẩm của IBE mang đậm tính khảo sát khoa học, mỗi bức ảnh đều có số liệu chi tiết để sử dụng, ví dụ số lượng động vật được thống kê chính xác. Một lần ở núi tuyết Mai Lý gặp đàn vẹt ngực tím, nhiếp ảnh gia đếm từng con trên Photoshop, thống kê ra con số chính xác 1500 con; sau đó chuyên gia có uy tín cho biết đây là đàn vẹt qua đông lớn nhất xuất hiện ở vùng này trong gần 30 năm kể từ khi có ghi chép. Đồng thời với việc chụp, họ còn giám định loài, phân tích hành vi động vật… Kết thúc dự án, họ còn nộp cho khu bảo tồn địa phương một bản báo cáo điều tra đánh giá môi trường.",idea:"Tính khảo sát khoa học của tác phẩm.",q:["为什么说IBE的作品带有浓厚的科考性质？"],note:[["有……可供使用","<span class='zh'>可供 + V</span> = có thể dùng để."],["一个一个地数","Lặp lượng từ làm trạng ngữ = đếm từng con."]]},{zh:"如今，徐健和他的队伍天天在路上忙碌着。",vn:"Giờ đây, Từ Kiện và đội ngũ của anh ngày ngày vẫn bận rộn trên đường.",idea:"Kết.",q:[],note:[]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ gần nghĩa",G:[{id:"g1",grp:0,word:"",zh:"换句话说 · 也就是说 · 就是说",py:"huàn jù huà shuō",tag:"Chú thích 1 · chen ngữ",mean:"Chen ngữ (插入语) biểu thị <b>giải thích, nói rõ lại</b> ý vừa nêu bằng cách khác — “nói cách khác”. Cùng loại: <span class='zh'>也就是说 · 就是说</span>.",forms:["A，换句话说 / 也就是说，A'（giải thích A）"],ex:[["雪豹……正濒临消亡，换句话说，在不久的将来我们很可能再也见不到这种动物。","",1],["推销产品靠的是广告，但是做广告需要高额资金……换句话说，一个产品的广告越多，它的零售价格也会越高。","Bán hàng dựa vào quảng cáo, mà quảng cáo tốn nhiều tiền… nói cách khác, sản phẩm càng quảng cáo nhiều thì giá bán lẻ càng cao."],["每个国家都应与他国和睦相处，尽其该尽的国际义务。就是说，国家拥有主权，但并不是可以为所欲为的。","Mỗi nước nên chung sống hòa thuận với nước khác… tức là, quốc gia có chủ quyền nhưng không thể muốn làm gì thì làm."]],tips:["Bài 8: chen ngữ thể hiện ý kiến chủ quan (<span class='zh'>说实在的 · 依我看</span>); bài này: chen ngữ <b>giải thích</b>."],practice:{q:"把叙述同一事物的两个小句用“换句话说”连接起来（A–F 配对）",type:"complete",items:[["A 有人这样说，结婚前要睁大眼睛仔细瞧，结婚后就要睁一只眼闭一只眼 + ____","A + E：……睁一只眼闭一只眼。换句话说，婚前要多看看对方的短处，婚后要多想想对方的长处。"],["B 中国古典小说《水浒传》中的武松赤手空拳打死了老虎 + ____","B + D：……打死了老虎。换句话说，武松什么武器都没用，就用拳头打死了老虎。"],["C 现在，世界上每小时就有五千个孩子出生 + ____","C + F：……出生。换句话说，每天地球上就要多出十二万人。"]]}},{id:"g2",grp:1,word:"",zh:"为……所……",py:"wéi … suǒ …",tag:"Chú thích 2 · bị động văn viết",mean:"Giới thiệu <b>tác nhân</b>, tạo câu <b>bị động</b> trong văn viết. Khẳng định: <span class='zh'>为 + N + 所 + V</span>; phủ định: <span class='zh'>不 + 为 + N + 所 + V</span>.",forms:["为 + N + 所 + V（了解 / 掌握 / 感动 / 惑）","不为 + N + 所 + V"],ex:[["很多特有物种，还没来得及为我们所了解，就消失了。","",1],["我们要通过教育，使原来为少数人所掌握的科学知识，在较短的时间内为更多的人所掌握。","Qua giáo dục, làm cho tri thức khoa học vốn chỉ số ít người nắm được, trong thời gian ngắn được nhiều người nắm hơn."],["他是个有原则的人，绝不会为金钱所惑。","Anh ấy là người có nguyên tắc, tuyệt đối không bị đồng tiền mê hoặc."],["说到那个电影，没有一个人不喜欢，没有一个人不为电影中的人物所感动。","Nói đến bộ phim ấy, không ai không thích, không ai không cảm động trước các nhân vật."]],tips:["<span class='zh'>为</span> đọc <b>wéi</b>.","Tương đương khẩu ngữ <span class='zh'>被……</span>, nhưng động từ thường song tiết, không mang bổ ngữ."],practice:{q:"参考提示词，用“为……所……”完成句子",type:"complete",items:[["京酱肉丝这道菜________。（很多人，称道）","京酱肉丝这道菜为很多人所称道。"],["连日大雪，部分牧民________，日前，救助他们的队伍已经出发。（大雪，困）","连日大雪，部分牧民为大雪所困，……"],["废气、废水有望真正变废为宝，________。（人们，利用）","废气、废水有望真正变废为宝，为人们所利用。"]]}},{id:"g3",grp:1,word:"足以",zh:"足以",py:"zúyǐ",tag:"Chú thích 3 · động từ",mean:"Động từ = <b>hoàn toàn có thể, hoàn toàn đủ để</b>. Theo sau là <b>cụm động từ</b>. Phủ định: <span class='zh'>不足以</span> (không đủ để).",forms:["A + 足以 + V（说明 / 证明 / 使……）","不足以 + V"],ex:[["他们不分昼夜地奔波，渴望拍出足以使人疯狂的照片……","",1],["对这样的坏人不严惩就不足以平民愤。","Không trừng trị nghiêm kẻ xấu này thì không đủ để xoa dịu lòng dân."],["跟儿童谈话很讲究技巧……要能够随时提出足以了解儿童心理状态而又不会引起儿童反感的问题。","Nói chuyện với trẻ cần kỹ năng… phải đặt được câu hỏi đủ để hiểu tâm lý trẻ mà không gây phản cảm."]],tips:["Bài tập 2④."],practice:{q:"用“足以”改写句子",type:"complete",items:[["听说我们一年浪费掉的粮食够50万人吃一天了。","听说我们一年浪费掉的粮食足以让50万人吃一天。"],["这些材料完全能够说明问题了。","这些材料足以说明问题了。"],["哪怕……只领先或落后几个星期、几天，甚至几个小时，就完全能够使一个企业利润剧增或面临破产。","……就足以使一个企业利润剧增或面临破产。"]]}},{id:"g4",grp:1,word:"以便",zh:"以便 / 便于",py:"yǐbiàn / biànyú",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa <b>làm cho mục đích phía sau dễ thực hiện</b>. <span class='zh'>以便</span> là liên từ đứng <b>đầu vế sau</b>; <span class='zh'>便于</span> (bài 13) là động từ.",forms:["……，以便 + mục đích","为了便于 + V，……","A + 便于 + V"],ex:[["……吸引大家心甘情愿地去购买，以便支撑他们深入野外的巨大开支。","",1]],tips:["Bài tập 2①."]}],BX:{grp:1,word:"以便",cols:["以便","便于"],pair:"以便 — 便于",same:["Đều có nghĩa <b>làm cho mục đích nói phía sau dễ thực hiện</b>.","大家现在要努力掌握各种相关知识，以便 / 便于将来更好地工作。"],diff:[["<b>Liên từ</b>, chỉ đứng <b>đầu vế sau</b>.","你先把材料准备好，以便小组开会研究。","<b>Động từ</b>, dùng được ở <b>vế trước</b>.<div class='zh' style='margin-top:4px'>为了便于管理，我们制定了一些规章制度。</div>"],["Không có nghĩa này.","—","Biểu thị “nhờ <b>bản thân có điều kiện</b> nào đó mà đạt được kết quả phía sau”.<div class='zh' style='margin-top:4px'>这种新型电脑体积小，便于大家携带。</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["为了以便联系，老师把所有学生的电话制成了一张表。",1,"<span class='zh'>以便</span> không đứng sau <span class='zh'>为了</span> / ở vế trước → <span class='zh'>为了便于联系</span>."],["你把需要用到的各种食材都准备好，这样便于制作。",0,"Đúng."],["请参加此次活动的人员报一下名，以便我们统计人数。",0,"Đầu vế sau → đúng."],["场地很大，以便大家开展活动。",1,"Điều kiện tự thân (场地很大) → phải dùng <span class='zh'>便于</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["来<u>历</u>","经历 · 历史 · 简历 · 学历"],items:[["濒<u>临</u>","临","面临 · 降临 · 光临 · 临时"],["领<u>袖</u>","袖","短袖 · 袖子 · 袖口 · 袖手旁观"],["<u>识</u>别","识","认识 · 知识 · 见识 · 常识"],["报<u>酬</u>","酬","酬劳 · 酬谢 · 薪酬 · 应酬"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["请在信封上写清地址，________。","以便","请在信封上写清地址，以便邮递员准确投递。"],["他对中国非常了解，是个________。","名副其实","他对中国非常了解，是个名副其实的“中国通”。"],["很多年轻人都________。","渴望","很多年轻人都渴望到大城市去闯一闯。"],["这些事实________。","足以","这些事实足以证明他是无辜的。"],["他从小就爱好写作，几十年来他一直________。","致力于","他从小就爱好写作，几十年来他一直致力于儿童文学的创作。"],["孩子长大后都忙于自己的工作，父母________。","指望","孩子长大后都忙于自己的工作，父母也不能指望他们天天陪在身边。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["渴望","高超","昼夜","完毕","浓厚"],text:"一天的工作处理{完毕}，她终于可以休息一下了。在不分{昼夜}的忙碌之外，她非常{渴望}拥有一段属于自己的时间。安静地读点儿书，去旅行，或者做自己喜欢做的事情。她对摄影有{浓厚}的兴趣，而且拍摄技术{高超}，如果有时间，她很想约上几个朋友，一起去野外拍些照片。"},{bank:["童话","畅销","足以","报酬","心甘情愿"],text:"我的朋友是个作家，他写的书很{畅销}，自然他得到的{报酬}也不少。年轻女孩子喜欢他写的{童话}式的爱情故事，虽然不真实，但{足以}带给人幻想和安慰。所以，每当他的新书出版，他的书迷们都会{心甘情愿}起大早排队去购买。"}]},EX4:{q:"将下列句子及其解释连线，并体会插入语的用法",type:"order",vn:"Nhập 4 chữ cái lần lượt là lời giải thích cho câu ①②③④ (VD: ABCD).",sets:[{ans:"BCDA",ph:"VD: ABCD (cho ①②③④)",full:"① 他一个月的工资是我的三倍，也就是说，他一个月的工资相当于我三个月的。<br>② 他所有的辛劳都是心甘情愿的，换句话说，没有人强迫他。<br>③ 他非名牌不穿，就是说，他只穿名牌，不是名牌不穿。<br>④ 现在很多年轻人都是“月光族”，也就是说，到了月底，钱就都花光了。",items:[["①","他一个月的工资是我的三倍，也就是说，"],["②","他所有的辛劳都是心甘情愿的，换句话说，"],["③","他非名牌不穿，就是说，"],["④","现在很多年轻人都是“月光族”，也就是说，"],["A","到了月底，钱就都花光了。"],["B","他一个月的工资相当于我三个月的。"],["C","没有人强迫他。"],["D","他只穿名牌，不是名牌不穿。"]]}]},EX5:{q:"根据课文内容回答问题",rows:[["徐健他们的工作是什么？","①……摄影师 ②博物学家","他们是野生动植物摄影师，也是致力于保护野生物种、记录和展示中国生物多样性的“博物学家”。"],["为什么大家对非洲生物的熟悉程度远远大于自己的国家？","影像空白","因为中国许多动植物连一张清楚的照片都没有，自然保护区存在影像空白，大家不认识它们。"],["徐健他们以前希望自己为野生动物拍摄的照片可以怎样？结果呢？","①吸引……购买 ②支撑……开支 ③但……，几近……","他们希望拍出足以使人疯狂的照片，吸引大家心甘情愿地购买，以便支撑深入野外的巨大开支；但摄影作品不是畅销书，报酬很低，这个想法几近童话。"],["IBE的工作内容和工作方式分别是什么？","①为……提供服务，建……影像库，还原…… ②分散，号召，聚在一起，集合式工作","IBE为保护区、政府等提供服务，建立野生动植物影像库，立体还原一个地区的生态多样性；摄影师们分散在全国各地，徐健一号召，大家就聚在一起，进行集合式工作。"],["为什么说IBE的作品带有浓厚的科考性质？","每张照片都有……可供使用，精确统计……，物种鉴别，动物行为分析，提交……调查报告","每张照片都有详细的数据可供使用，比如精确统计的动物数量；他们还进行物种鉴别、动物行为分析，项目结束后提交环境评估调查报告。"]]},DP:{title:"词汇：熟悉下列近义词",vn:"14 cặp gần nghĩa — cột “搭配” là từ đối ứng.",items:[["布告","bùgào","bố cáo","↔ 公告","学校门口贴着一张布告。"],["诞辰","dànchén","ngày sinh (người được kính trọng)","↔ 生日","今天是孔子诞辰纪念日。"],["发布","fābù","công bố, phát hành","↔ 公布","公司发布了新产品。"],["范畴","fànchóu","phạm trù","↔ 范围","这不属于法律的范畴。"],["挥霍","huīhuò","phung phí","↔ 浪费","他把父母的钱都挥霍光了。"],["坚固","jiāngù","kiên cố","↔ 牢固","这座桥非常坚固。"],["奖赏","jiǎngshǎng","ban thưởng","↔ 奖励","老板奖赏了表现优秀的员工。"],["恐吓","kǒnghè","đe dọa","↔ 威胁","他打电话恐吓对方。"],["谅解","liàngjiě","thông cảm, lượng thứ","↔ 原谅","请大家谅解。"],["勉励","miǎnlì","khích lệ","↔ 鼓励","老师勉励我们好好学习。"],["藐视","miǎoshì","coi thường","↔ 蔑视","不要藐视任何对手。"],["洽谈","qiàtán","đàm phán","↔ 协商","双方正在洽谈合作事宜。"],["谦逊","qiānxùn","khiêm tốn","↔ 谦虚","他为人十分谦逊。"],["区分","qūfēn","phân biệt","↔ 区别","要区分好坏。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"这不是一所普通小学，它是中华人民共和国成立后北京出现的第一所私立小学——京华私立学校。家长在给孩子办理报名手续的同时，还要交3万元的入学赞助费。这一切令当时的北京人目瞪口呆。",o:["北京人不喜欢私立学校","北京人对交赞助费习以为常","京华私立学校成立于解放前","私立学校的所作所为让人吃惊"],a:3,why:"“令当时的北京人目瞪口呆” = kinh ngạc."},{n:2,say:"过桥时，如果对脚下湍急的河水过多地注视，则会觉得桥逆水流而动，河水却不动，这就是运动错觉。产生这种运动错觉的原因是人们把流动的河水参照系当成了静止的参照系。",o:["运动不当会产生错觉","过河时必须注意安全","过桥时注视哪里很重要","流动的河水突然静止了"],a:2,why:"Nhìn chăm vào nước → ảo giác; nhìn vào đâu quyết định cảm nhận."},{n:3,say:"一个处于积极状态的人可以拥有好成绩、高分数、好的经济地位和社会地位，但积极状态并不是指这些外在的指标，这些只是一个人奋斗和机遇的结果。积极状态指一个人具有的出色的综合心理素质、积极的人生态度。",o:["状态不积极就不可能有好机遇","好的经济地位是因为遇到积极的人","积极状态指好成绩、好地位这些指标","积极状态与心理素质、人生态度有关"],a:3,why:"“积极状态指……心理素质、积极的人生态度”. C bị phủ định trực tiếp."},{n:4,say:"大工业时代延续至今的“快文化”，使全世界40%的人患上“时间疾病”。他们整日为工作忙碌，精神焦虑，忘记了自己的兴趣和爱好。因此丢掉快节奏，号召人们让自己的生活节奏慢下来，让生活更加人性化才是正道。",o:["舍弃快节奏才是正确的做法","世界上近半数人患有焦虑症","没有兴趣爱好的人生活很轻松","“大工业”是“快文化”的产物"],a:0,why:"“丢掉快节奏……才是正道”. D đảo ngược quan hệ."},{n:5,say:"过去，西藏可可西里偷捕藏羚羊的现象十分严重，偷猎分子洋枪快车，甚为嚣张。由于这些年加大了打击力度，捕杀藏羚羊的事件不断减少。这说明只要重视，野生动物一定可以得到更大限度的保护。",o:["偷猎藏羚羊的事件在减少","偷猎藏羚羊的人枪法很准","偷猎藏羚羊的人都很紧张","藏羚羊遭受到很大的打击"],a:0,why:"“捕杀藏羚羊的事件不断减少”. D: bị “đánh mạnh” là <b>kẻ săn trộm</b>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"男：您是一位从事野外生态研究的科学家，今天现场的观众都渴望和您聊聊大熊猫。\n女：大家都知道，大熊猫是国家一级保护动物，是中国的国宝。\n男：世界上动物那么多，为什么大熊猫得到了这么特殊的待遇呢？就是因为它长得憨态可掬吗？\n女：不是，主要是因为它稀少，已经濒临灭绝，换句话说，大熊猫这个物种正面临着从地球上消失的危险。\n男：真是挺严峻的！大熊猫濒临灭绝和我们人类的活动有关吗？\n女：关系很大。比如，人类不断扩大自己的生存空间，使大熊猫栖息地面积缩减；再比如，由于生态环境的破坏，使熊猫唯一的食物来源——竹林减少，这些都会直接威胁到熊猫的生存。\n男：那大熊猫濒临灭绝有它自身的原因吗？\n女：当然也有。\n男：您不妨先说说，在大自然里，什么样的动物才能生存下去吧。\n女：一般说来动物要生存下去，至少要具备以下七点中的某几点：一、有强健的肌肉，有锐利的爪子或锋利的牙齿；二、有快速奔跑的能力；三、有挖洞穴居的习性；四、有爬树的本事，或者能在树上生存，躲避敌害，储藏食物；五、有很强的繁殖能力；六、有很杂的食性；七、有很好的消化吸收能力。\n男：大熊猫呢？\n女：可以说，以上七点中，大熊猫哪一点都不具备。大熊猫的祖先是凶猛的食肉动物，可今天的大熊猫既没有利爪，也没有利牙，整天一副懒洋洋、温顺可人的样子；虽然它还保留着爬树的本领，可是那速度，也就是饭后遛食了；至于食谱，它只以新鲜的竹叶做主食，在它每天都吃掉的竹叶里，也只能消化掉一小部分，大多数营养都白白地浪费了；还有，它的繁殖能力也很差。这就是大熊猫濒临灭绝的内在因素。\n男：是啊，这一切足以证实，大熊猫的保护工作确实是迫在眉睫。",qs:[{n:6,q:"大熊猫为什么成为国家一级保护动物？",o:["因为它天真可爱","因为它身处险境","因为它是一种濒危动物","这是人们给它的特殊待遇"],a:2,why:"“主要是因为它稀少，已经濒临灭绝”."},{n:7,q:"人类怎样威胁到了大熊猫的生存？",o:["人类不再给熊猫种植竹子","人类活动不利于竹林生长","人类改变了大熊猫的习性","人类活动导致了气候变化"],a:1,why:"“由于生态环境的破坏，使……竹林减少”."},{n:8,q:"有利于动物生存的内在因素不包括什么？",o:["爱吃肉","速度快","穴居","杂食"],a:0,why:"Bảy điểm gồm chạy nhanh, đào hang, ăn tạp… — không có “thích ăn thịt”."},{n:9,q:"大熊猫濒临灭绝的内在因素有什么？",o:["大熊猫太懒","大熊猫太可爱","大熊猫不会爬树","大熊猫消化能力差"],a:3,why:"“只能消化掉一小部分”. C sai: vẫn biết trèo (chậm)."},{n:10,q:"这段话主要谈的是什么？",o:["动物生存的条件","怎样保护大熊猫","大熊猫濒危的原因","人类为什么喜欢大熊猫"],a:2,why:"Nguyên nhân bên ngoài (con người) + bên trong (bản thân)."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"如果你的工作，让你心中充满的是苦涩，一想到上班就难受，一到班上就压抑，每天熬到快下班就心花怒放，你就不要再硬撑。但反过来说，如果你对这份工作还没有厌恶到每天觉得不痛快，那我建议你试久一点儿。因为成就感很多时候是在我们驾轻就熟、独当一面并能产生某种价值后才有的。所以如果某份工作自己没有很讨厌，那就让自己积累实力，提升熟练度。很可能当你哪天成为资深员工时，就会发现自己已经喜欢上这个工作，到你当上那个领域的大师，一群人对你投来佩服的眼光时，你会觉得这个工作非常棒。\n若只是随便试那么一两个月，觉得不好不坏就溜走，那就永远不要指望你能够成为那一领域的大师。",qs:[{n:11,q:"说话人认为什么情况下应该放弃一份工作？",o:["上班前起不来","对报酬不满意","从情感上厌恶","干起来很吃力"],a:2,why:"“心中充满的是苦涩，一想到上班就难受……就不要再硬撑”."},{n:12,q:"一份工作做得时间长了会怎样？",o:["有成就感","让人不痛快","发现它的价值","引来别人的好感"],a:0,why:"“成就感很多时候是在我们驾轻就熟……后才有的”."},{n:13,q:"说话人认为最不可取的是哪种做法？",o:["没有远大的目标","不遵守劳动纪律","随随便便就不干了","不向资深员工学习"],a:2,why:"“随便试那么一两个月……就溜走”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"随着科学的进步，人类对自然的了解越来越深入，但是人类对自然的研究目的似乎只是为了让自然更好地为人类服务，因为人类滥用资源的行为对大自然造成了极大的破坏，这种状况一天也没有停止。\n全球化使我们的世界不断变小，我们共同生活在地球村里。每个人都不能把自己的行为看成是个人行为，每个人的一举一动都与其他人、与我们的生存环境息息相关。因此，我们必须换一种方式对待自然，应该保护有限的自然资源，而非毫无节制地开发、剥夺自然资源。我们要学会和自然和谐相处，因为自然是我们的朋友。我们不能持续地为了人类的利益而去伤害它，但现实情况是，我们离共生这种状态已经非常遥远。\n与自然相处，是一个道德问题，而不仅仅与知识相关。我们想要更好地立足于这个世界，必须跳出自我，处理好人与人、人与自然的关系，处理好不同文明、不同文化之间的关系。只有这样，地球人才能和谐相处，我们的生活才能更加美好。",qs:[{n:14,q:"人类对自然的行为体现了人类怎样的品质？",o:["自私","粗暴","悲观","正义"],a:0,why:"“只是为了让自然更好地为人类服务” → ích kỷ."},{n:15,q:"全球化的结果是什么？",o:["人的生活空间变小了","自然资源变得稀有了","大家生活在同一个世界里","每个人的一举一动都涉及他人"],a:3,why:"Theo đáp án sách: “每个人的一举一动都与其他人……息息相关”."},{n:16,q:"我们怎样才能生活得更好？",o:["认清敌我","增加修养","爱护自然","实现自我"],a:2,why:"Bảo vệ tài nguyên, hài hòa với tự nhiên."},{n:17,q:"这段话主要谈什么？",o:["不要让大自然成为我们的敌人","全球化使我们的世界不断变小","我们可设法拓展自己的生存空间","人与人、人与自然应该和谐相处"],a:3,why:"Câu kết: “处理好人与人、人与自然的关系……和谐相处”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["你的字要写得清楚些，否则难以辨认。","见了面，我心里、他心里都踏实了，我们相互需要对方的支撑。","工地上，挖掘机、装卸机和十几辆翻斗车正在工作人员的指挥下挖土。","就这样，一个濒临死亡的国有工厂摇身变成了城市最具时尚气质的地方。"],a:2,why:"<b>Chủ – vị không hợp</b>: <span class='zh'>装卸机、翻斗车</span> không “đào đất” → sửa vị ngữ thành <span class='zh'>……正在……指挥下工作</span>."},{n:19,o:["他才来，许多人还不认识。","他整日忙忙碌碌，每天在公司和用户之间来回奔波。","可以说，一个从小学会这种语言的人就是使用这种语言的权威。","他出身于名门世家，他父亲是清朝末年戊戌维新运动的领袖人物。"],a:0,why:"<b>Mơ hồ / thiếu tân ngữ</b>: không rõ ai không quen ai → <span class='zh'>许多人还不认识他</span>."},{n:20,o:["会议顺顺当当开了3个小时，所有议题都讨论完毕。","我们不断要提高和培养自己的发现问题和解决问题的能力。","这些统计方法都比较复杂，必须应用一些现成的计算机统计程序。","《口述中国——口述与文献，谁能还原历史》一书于2004年出版。"],a:1,why:"<b>Trật tự sai</b>: <span class='zh'>要不断培养和提高</span> (phó từ sau động từ năng nguyện; <span class='zh'>培养</span> trước <span class='zh'>提高</span>)."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"人生在世，若能时时___心甘情愿的___为理想奋斗，必能有苦时不觉苦，有难时不觉难。这样，一切___都可迎刃而解，而且无愿不成。",o:["从　心情　逆境","打　高度　绝境","凭　智慧　坎坷","以　态度　困境"],a:3,why:"<span class='zh'>以……的态度</span>; <span class='zh'>困境</span> + <span class='zh'>迎刃而解</span>."},{n:22,text:"自然语言太过___，人们没有办法让机器全部接受。如果我们把自然语言___得很透彻，连机器也能___，那么人和机器就能直接对话，___经过算法语言的中介了。",o:["复杂　分析　识别　不必","麻烦　解析　鉴别　未必","繁复　剖析　辨认　不妨","丰富　解剖　评估　不大"],a:0,why:"<span class='zh'>太过复杂</span>; <span class='zh'>分析透彻</span>; máy <span class='zh'>识别</span> (từ mới); <span class='zh'>不必</span> = không cần."},{n:23,text:"综述是议论文的一种形式，是某一学术研究领域在一定___内发展情况的研究总结，即___需要研究的课题，从一定时期内相当大量的专门选定的原始文献中摘取材料，利用这些材料对问题进行___性描述，在系统归纳和加工整理的基础上，表明作者的___。",o:["区域　本着　特定　立场","时期　针对　综合　观点","季节　对准　细节　态度","期间　根据　一般　发现"],a:1,why:"<span class='zh'>一定时期内</span>; <span class='zh'>针对课题</span>; <span class='zh'>综合性</span> (综述 = tổng thuật); <span class='zh'>表明观点</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"有一天，巴洛教授在树林边散步的时候，发现最粗最壮的那棵红杉树上出现了蚂蚁浩浩荡荡的队伍。显然，(24)。巴洛教授决定把它们从树上赶走。\n教授在树干上找到了蚂蚁进出的洞穴，(25)。可是第二天教授过来一看，毫无成效，蚂蚁早已把泥巴的边缘打穿，自由出入了。这一次，教授找来了更结实的木块，(26)。结果，还是不能阻止这帮家伙快乐地进进出出。后来，教授听人说蚂蚁很怕胶水和樟脑丸，就将胶水和樟脑丸混在一起，封住蚂蚁洞口。这一招似乎有些效果，蚂蚁们不敢从洞口经过了。然而，一周后，(27)，蚂蚁们在远离樟脑丸的树干上重新打开了一个洞口。\n教授对蚂蚁产生了浓厚的兴趣，他苦苦地琢磨，在与蚂蚁的战斗中，(28)？很快，教授找到了答案：是蚂蚁对环境的超强适应能力。",opts:["牢牢地堵住入口","用湿泥巴将洞口结结实实地封死","教授遗憾地发现","蚂蚁把红杉树当成了它们的家","我为什么一次次败下阵来"],ans:{24:3,25:1,26:0,27:2,28:4}},read4:[{ins:"第29–32题：请选出正确答案。",text:"彭懿大学本科学的是昆虫专业，硕士读的是教育学，博士专攻文学。现在做研究，主要研究方向是幻想小说及图画书。他是个少有的跨界作家。在中国，很多人都认可彭懿是“幻想文学的倡导人”。他不仅创作幻想小说，还翻译了大量图画书，另外著有学术著作。\n他的《图画书：阅读与经典》颇具影响力，透过实例告诉读者如何从头至尾阅读一本图画书，被誉为“中国儿童文学理论界一本填补空白的图画书论”，畅销十万册，成为中国父母选购图画书的指南。\n年初，彭懿的图画书处女作《妖怪山》上市，当月即加印，创造了国内原创图画书的奇迹。“每个人心中都有一座‘妖怪山’。愧疚、自责、悔恨……如果没有足够的勇气，它就是一座藏在内心深处的‘妖怪山’，无法碰触、不敢直面。”说起自己十年磨一剑的新书，彭懿还拿出了《妖怪山》插图作者九儿给他寄来的手稿翻给我们看：“我喜欢写妖怪，我相信每个孩子的心里都住着个小妖怪。”彭懿对九儿的插画极尽赞美：“光画就用了两年，改了好几稿，每个细节都颇具匠心。”",qs:[{n:29,q:"为什么说彭懿是个跨界作家？",o:["他学过教育学和文学","他写小说，还画插图","他研究幻想小说和图画书","他兼顾小说创作、翻译和学术研究"],a:3,why:"“不仅创作幻想小说，还翻译了大量图画书，另外著有学术著作”. B sai: tranh do <b>九儿</b> vẽ."},{n:30,q:"《图画书：阅读与经典》的主要内容是：",o:["童话故事","图书选购指南","告诉人们怎样读图画书","告诉家长如何做父母"],a:2,why:"“告诉读者如何从头至尾阅读一本图画书”. B chỉ là tác dụng phụ."},{n:31,q:"《妖怪山》最可能写的是：",o:["童年的心事","山上的妖怪","不健康的心理","不敢面对的痛心事"],a:3,why:"“愧疚、自责、悔恨……无法碰触、不敢直面”."},{n:32,q:"关于彭懿的《妖怪山》，下列哪项正确？",o:["一出版就被读者追捧","作者和女儿一块儿写的","书的出版是一个奇迹","作者对插图的要求很高"],a:0,why:"“当月即加印” → vừa ra đã được săn đón. B: 九儿 là họa sĩ minh họa, không phải con gái."}]},{ins:"第33–36题：请选出正确答案。",text:"大多数摄影师喜欢用多张照片构成的组图来讲述故事，因为仅仅一张照片，往往不足以把一个影像故事表达完整。这就向摄影师提出了更高的要求：摄影师不能只会拍照片，还要学会用编辑的思维进行视觉的流畅表达。\n杂志上用图片讲故事始于20世纪30年代。当编辑们意识到在跨页上刊登成系列的照片可以以一种跟纯文字完全不同的方式来讲故事的时候，它成为一种独特的立体叙事手法。《生活》杂志给这种手法起名为“图片故事”，并让它得到充分的发展。\n早期图片故事中最经典的作品之一是尤金·史密斯1948年为《生活》杂志拍摄的“乡村医生”。这个故事有很多前期准备，包括寻找一个戏剧化的环境和一个比较上镜的主角。这个故事的编辑架构有两个层面：首先是最表层的，这是一个人物故事，读者有机会看到一个富有同情心而且身份重要的社区成员的生活；另一个层面就是，它反映当时的政策，这也是一个关于现代医疗落地的故事。\n在进行版面设计的时候，对于疲惫的医生泡好咖啡的摆拍照片是否该用整版的问题，摄影师和编辑的意见稍有不同，经过商讨，最后还是统一了。大多数图片故事都需要进行一定程度的摆拍、重新安排以及现场导控，以便让图片和编辑思路一致。这么做是为了更好地把现场的神韵传达到图片当中，这是完全符合职业操守的。",qs:[{n:33,q:"拍摄“图片故事”，对摄影师的要求是：",o:["擅长跨页排版","具有良好的职业操守","能用文字方式流畅表达故事","能以编辑的思维用照片进行立体叙事"],a:3,why:"“还要学会用编辑的思维进行视觉的流畅表达”."},{n:34,q:"第3段画线词语“上镜”的意思最可能是：",o:["被导演选中","出现在影视作品中","无意中被别人拍摄到","在镜头中的相貌比本人好看"],a:3,why:"<span class='zh'>上镜</span> = ăn ảnh."},{n:35,q:"关于“乡村医生”，下列哪项正确：",o:["幽默并具有戏剧性","是《生活》杂志拍摄的","是最经典的图片故事之一","拍摄中发明了摆拍的方式"],a:2,why:"“最经典的作品之一”. B: do <b>尤金·史密斯</b> chụp cho tạp chí."},{n:36,q:"下列哪项最适合做上文的标题：",o:["关于“图片故事”","“图片故事”是一种尝试","“乡村医生”的拍摄经过","致力于“图片故事”创作的摄影师"],a:0,why:"Cả bài giới thiệu khái niệm, lịch sử, ví dụ của “图片故事”."}]}]},W:{task:"为了保护和宣传野生动物，徐健成立了IBE，专门为野生动物拍照，他们的作品不但摄影技术高超，还带有浓厚的科考性质。请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Mở bằng cảnh báo tuyết","1–2 câu + <span class='zh'>濒临消亡，换句话说，……</span>."],["Giới thiệu nhóm","<span class='zh'>致力于……的“博物学家”；风餐露宿……</span>."],["Vấn đề","Ai cũng biết hươu cao cổ nhưng không biết linh dương Tây Tạng; <span class='zh'>影像空白；还没来得及为我们所了解就消失了</span>."],["Giải pháp IBE","Ý tưởng bán ảnh <span class='zh'>几近童话</span> → doanh nghiệp xã hội, kho ảnh, làm việc tập trung."],["Tính khoa học & kết","Ví dụ đàn vẹt 1500 con; báo cáo đánh giá; <span class='zh'>天天在路上忙碌着</span>."]],outline:[["一 · 拍雪豹","青海雪豹；濒临消亡"],["二 · 现状","认识非洲动物，不认识藏羚羊；影像空白"],["三 · 成立IBE","卖照片几近童话 → 社会企业、影像库"],["四 · 工作方式与特点","集合式工作；科考性质"],["五 · 结尾","天天在路上"]],model:"为野生动物拍照的人\n在中国青海海拔4500米的山上，一群摄影师正憋着气拍摄三头玩耍的雪豹。雪豹是一种濒临消亡的动物，换句话说，不久以后我们可能再也见不到它了。这些摄影师致力于保护野生物种，记录中国的生物多样性，被称为“博物学家”。他们常年风餐露宿，却感到无比快乐。\n徐健是他们的领袖人物。他发现，人们能识别长颈鹿、河马，却不认识藏羚羊，对非洲动物比对自己国家的动物还熟悉。因为许多动植物连一张清楚的照片都没有，自然保护区的影像几乎是空白，很多物种还没来得及为人们所了解就消失了。\n徐健和朋友们曾想拍出足以使人疯狂的照片，让大家心甘情愿地购买，以便支撑巨大的开支。可是摄影作品不是畅销书，这个想法几近童话。于是，徐健成立了社会企业IBE，为保护区、政府等提供服务，建立野生动植物影像库，立体还原一个地区的生态多样性。\nIBE的摄影师个个技术高超、素质过硬。他们分散在全国各地，徐健一号召，大家就聚在一起工作，成效非常显著。他们的作品带有浓厚的科考性质：每张照片都有详细的数据，比如有一次他们一只一只地数出了1500只大紫胸鹦鹉，专家说这是近30年来当地最大的鹦鹉越冬群。他们还进行物种鉴别和动物行为分析，并向保护区提交环境评估报告。\n如今，徐健和他的队伍仍然天天在路上忙碌着。",check:["Có tiêu đề","Có cảnh mở đầu + báo tuyết sắp tuyệt chủng","Nêu hiện trạng / vấn đề","Có việc thành lập IBE","Có cách làm việc + tính khoa học","Dùng ít nhất 4: 换句话说 · 为……所…… · 足以 · 以便 · 濒临 · 致力于 · 名副其实","Khoảng 400 chữ (±40)"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"凌晨，杨赫出发了，从市区赶往海子水库。\n每年三四月份，是候鸟从南方向北迁徙的季节，海子水库是候鸟停留期间的主要栖息地。到达水库边，天还没有大亮，极目远眺，对面点点白色就是大天鹅的身影。今天，他要与保护站的其他队员一起，完成巡护记录、图片拍摄、鸟群健康状况统计、周边环境安全调查以及种类分析等工作。\n杨赫是野生动物保护站的青年志愿者，常年从事野生动物救助和保护工作。每年春秋两季，候鸟南迁北飞，他都要为候鸟的健康、安全保驾护航。\n杨赫是这个保护站里的老队员，他在首都机场工作，一个偶然的机会，他知道了这个野生动物保护站。每天可以在山林里转，接触不经修饰、最本真的大自然，这样的生活，他无比向往，于是他志愿加入了保护站。\n做野生动物保护工作，的确可以领略到壮美的湖光山色，看到平时难得一见的美景，但不同于一般的志愿服务，野生动物保护者的足迹要遍布山野，其中的艰苦，不说也能想象得到。可是，对杨赫来说，守护着迁徙路过北京的几万只候鸟，看着它们在自己面前起飞、降落，听着它们的叫声，那幸福，没有语言能够形容，这也是他与候鸟每年的“约定”。\n不久前，有个村子，到了开春和收获的季节，野猪总是不请自来，村民防不胜防。而且野猪糟蹋粮食后，村民就没有了收入。人与野生动物之间的矛盾日趋紧张。野生动物保护站得知这个消息后，在村里设了分站，一方面劝说村民不要伤害野猪，它们也是国家保护动物；另一方面，保护站用了一年多的时间寻找野猪下山的主要路径，在野猪饮水的地方架设多台红外线相机进行监测，然后通过投狼粪、在树上挂光盘等方法，成功阻止了野猪的进犯。\n虽然野生动物保护工作能够亲近自然，可他们也时时与危险相伴。每次上山，六七十度的陡坡，都是在考验野生动物保护者的经验和体力，有时石头一碰就会滚落下来。可以说，每次登山都是险象环生。尽管面对危险，杨赫却说：“从事野生动物保护的人有个共性，他们都有一颗热爱自然、向往自然的心。他们从心出发，愿意做大自然的守护者，这是这代年轻人的使命，也是对自然的一份承诺。”",model:"大自然的守护者\n凌晨，杨赫从市区出发，赶往海子水库。每年三四月份，候鸟从南方向北迁徙，海子水库是它们停留时的主要栖息地。今天，他要和保护站的其他队员一起，完成巡护记录、拍照、统计鸟群健康状况、调查周边环境等工作。\n杨赫在首都机场工作，也是野生动物保护站的青年志愿者。一个偶然的机会，他知道了这个保护站。他非常向往每天在山林里接触最本真的大自然的生活，于是志愿加入了保护站，常年从事野生动物的救助和保护工作。\n野生动物保护工作虽然能看到美丽的湖光山色，但是非常辛苦，保护者的足迹要遍布山野。可对杨赫来说，守护几万只路过北京的候鸟，看着它们起飞、降落，听着它们的叫声，是无法形容的幸福，这是他和候鸟每年的“约定”。\n不久前，有个村子经常有野猪来糟蹋粮食，村民没有了收入，人和野生动物的矛盾越来越紧张。保护站在村里设了分站，一方面劝村民不要伤害野猪，因为它们也是国家保护动物；另一方面，他们用一年多的时间找到野猪下山的路，用红外线相机进行监测，再通过投狼粪、挂光盘等方法，成功阻止了野猪进村。\n这份工作也时时充满危险，每次爬六七十度的陡坡，都可能遇到滚落的石头。但杨赫说，从事野生动物保护的人都有一颗热爱自然的心，做大自然的守护者，是这代年轻人的使命，也是对自然的承诺。"}},SUM:{words:["压抑","完毕","注视","濒临","致力","领袖","辨认","现状","识别","来历","苦涩","指望","严峻","空白","琢磨","昼夜","奔波","渴望","足以","心甘情愿","以便","支撑","畅销","报酬","童话","课题","立体","还原","名副其实","高超","素质","号召","证实","成效","显著","浓厚","统计","权威","鉴别","评估"],patterns:[["……，换句话说，……","雪豹……正濒临消亡，换句话说，在不久的将来我们很可能再也见不到这种动物。"],["为 + N + 所 + V","很多特有物种，还没来得及为我们所了解，就消失了。"],["足以 + V","渴望拍出足以使人疯狂的照片。"],["……，以便……","吸引大家心甘情愿地去购买，以便支撑他们深入野外的巨大开支。"],["致力于……","这些摄影师们是致力于保护野生物种……的“博物学家”。"]],diff:["以便：liên từ, chỉ đầu vế sau — 便于：động từ, đứng vế trước được; biểu thị điều kiện tự thân (体积小，便于携带)","琢磨 zuómo (suy ngẫm) · 报酬 chou · 还原 huán · 空白 kòng · 为……所 wéi · 濒临灭绝 / 濒危动物"],sentences:["许多动植物，连一张清楚的照片都没有，大家不认识，怎么指望保护？","IBE的摄影师个个是名副其实的博物学家，不但有高超的摄影技术，还有非同一般的专业素质。","实践证实，这种集合式工作成效显著。"],hw:["Học thuộc 45 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 400 chữ (mục 7).","Làm Sách bài tập bài 16, gồm đề 缩写 “大自然的守护者” (400 chữ).","Ôn tập Chủ đề 4 (bài 13–16) · Đọc trước bài 17 — mở đầu Chủ đề 5 美丽家园."]}});
