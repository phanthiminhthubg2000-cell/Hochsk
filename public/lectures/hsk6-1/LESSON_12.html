<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 12 · 我们都爱白噪音。 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

1,"白噪音","bái zàoyīn","dt.","bạch táo âm","tiếng ồn trắng",0,"","一种功率频谱密度为常数的随机信号；指雨声、风声等平稳柔和的背景声音。","我们都爱白噪音","很多人听着白噪音更容易入睡。","Nhiều người nghe tiếng ồn trắng dễ ngủ hơn.",["听白噪音"],"Từ có dấu * (không bắt buộc HSK)."],[2,"嘈杂","cáozá","tt.","tào tạp","ồn ào, huyên náo",1,"书","（声音）杂乱；喧闹。","屋子里一片嘈杂","车站里人声嘈杂。","Trong nhà ga tiếng người ồn ào.",["人声嘈杂","嘈杂声"],""],[3,"莫名其妙","mòmíngqímiào","thành ngữ","mạc danh kỳ diệu","khó hiểu, chẳng hiểu vì sao",1,"成","没有人能说明它的奥妙（道理），表示事情很奇怪，使人不明白。","房间里莫名其妙地一片寂静","他莫名其妙地发了一通火。","Anh ta nổi nóng một trận chẳng hiểu vì sao.",["莫名其妙地……","感到莫名其妙"],"SBT câu 20."],[4,"淘汰","táotài","đgt.","đào thải","đào thải, loại",1,"","去坏的留好的；去掉不适合的。","在自然界早已被淘汰掉了","他在第一轮比赛中就被淘汰了。","Anh ấy bị loại ngay vòng đầu.",["被淘汰","淘汰赛"],""],[5,"不妨","bùfáng","phó.","bất phương","cứ, thử… cũng được",1,"","表示可以这样做，没有什么妨碍。","我们不妨形象地描绘一下","有什么意见，你不妨直说。","Có ý kiến gì cứ nói thẳng.",["不妨试试"],"Xem <b>Ngữ pháp: 不妨</b>."],[6,"描绘","miáohuì","đgt.","miêu hội","miêu tả, vẽ lại",1,"","描画；描写。","形象地描绘一下","这本书描绘了农村的生活。","Cuốn sách miêu tả cuộc sống nông thôn.",["描绘出……","生动地描绘"],""],[7,"波浪","bōlàng","dt.","ba lãng","sóng",1,"","江湖海洋上起伏不平的水面。","像波浪拍打岩石的声音","海上波浪很大。","Trên biển sóng rất lớn.",["波浪声"],"Bài tập 3①."],[8,"岩石","yánshí","dt.","nham thạch","đá",1,"","构成地壳的矿物的集合体。","波浪拍打岩石","海边有很多奇形怪状的岩石。","Bờ biển có nhiều tảng đá hình thù kỳ lạ.",[],"Bài tập 3①."],[9,"抚摸","fǔmō","đgt.","phủ mạc","vuốt ve",1,"","用手轻轻按着并来回移动。","微风抚摸树叶","她轻轻抚摸着小猫的头。","Cô ấy nhẹ nhàng vuốt đầu chú mèo con.",[],"Bài tập 3①."],[10,"务必","wùbì","phó.","vụ tất","nhất thiết phải",1,"","必须；一定要。","务必要提高警惕了","请务必准时到达。","Xin nhất định đến đúng giờ.",["务必注意","请务必……"],"Xem <b>Ngữ pháp: 务必</b>."],[11,"警惕","jǐngtì","đgt.","cảnh thích","cảnh giác",1,"","对可能发生的危险情况或错误倾向保持敏锐的感觉。","务必要提高警惕了","我们要警惕网络诈骗。","Chúng ta phải cảnh giác lừa đảo qua mạng.",["提高警惕","保持警惕"],""],[12,"解除","jiěchú","đgt.","giải trừ","dỡ bỏ, xóa bỏ",1,"","去掉；消除。","警报才会解除","台风警报已经解除。","Cảnh báo bão đã được dỡ bỏ.",["解除警报","解除合同"],"Bài tập 1: <span class='zh'>删除 · 免除 · 除掉 · 除去</span>. SBT câu 19."],[13,"不得已","bùdéyǐ","tt.","bất đắc dĩ","bất đắc dĩ",1,"","无可奈何；不能不如此。","不得已而采取的危险举动","这是不得已的办法。","Đây là cách bất đắc dĩ.",["出于不得已","迫不得已"],"Xem <b>辨析 不得已—不得不</b>."],[14,"暴露","bàolù","đgt.","bạo lộ","để lộ, bại lộ",1,"","（隐蔽的事物、缺陷、矛盾、问题等）显露出来。","叫声暴露了自己","他的谎言终于暴露了。","Lời nói dối của hắn cuối cùng cũng bại lộ.",["暴露目标","暴露问题"],"⚠️ 露 đọc <b>lù</b>."],[15,"惹祸","rě huò","đgt.","nhạ họa","gây họa",1,"","引起祸事。","很容易惹祸","这孩子太调皮，经常惹祸。","Đứa bé này nghịch quá, hay gây họa.",[],"Từ ly hợp."],[16,"雌雄","cíxióng","dt.","thư hùng","đực cái; thắng bại",1,"","雌性和雄性；比喻胜负、高下。","雌雄两性谁也发现不了对方","这种鸟雌雄很难分辨。","Loài chim này khó phân biệt đực cái.",["一决雌雄"],"<span class='zh'>一决雌雄</span> = phân thắng bại."],[17,"祖先","zǔxiān","dt.","tổ tiên","tổ tiên",1,"","民族或家族的上代，特指年代比较久远的。","祖先遗留下的DNA","我们的祖先创造了灿烂的文化。","Tổ tiên chúng ta đã tạo ra nền văn hóa rực rỡ.",[],""],[18,"遗留","yíliú","đgt.","di lưu","để lại",1,"","以前的事物或现象继续存在；（过去的）留下来。","祖先遗留下的DNA","这是历史遗留下来的问题。","Đây là vấn đề lịch sử để lại.",["遗留问题"],"SBT nghe câu 5."],[19,"嘛","ma","trợ.","ma","mà, đi (lý lẽ hiển nhiên)",1,"口","用在句末，表示道理显而易见。","怎么送给异性嘛","有话就说嘛！","Có gì thì cứ nói đi mà!",[],"SBT câu 20."],[20,"延续","yánxù","đgt.","diên tục","tiếp tục, kéo dài",1,"","照原来的样子继续下去；延长下去。","既要延续后代","这个传统一直延续到今天。","Truyền thống này kéo dài đến tận hôm nay.",["延续后代","延续传统"],"Bài tập 1: <span class='zh'>继续 · 连续 · 断断续续 · 持续</span>."],[21,"后代","hòudài","dt.","hậu đại","đời sau, con cháu",1,"","某一时代以后的时代；后代的人。","延续后代","我们要为后代保护好环境。","Chúng ta phải bảo vệ môi trường cho con cháu.",["子孙后代"],"Bài tập 1: <span class='zh'>代替 · 代表 · 代理 · 代沟</span>."],[22,"呼唤","hūhuàn","đgt.","hô hoán","kêu gọi, gọi",1,"","召唤；呼喊。","拼命呼唤","妈妈在门口呼唤孩子回家吃饭。","Mẹ đứng ở cửa gọi con về ăn cơm.",[],"Khởi động 2: nhóm <span class='zh'>呼</span>."],[23,"竖","shù","đgt.","thụ","dựng đứng",1,"","使物体跟地面垂直。","同时竖起耳朵","他竖起大拇指说：“好！”","Anh ấy giơ ngón cái: “Hay!”",["竖起耳朵","竖起大拇指"],"<span class='zh'>竖起耳朵</span> = vểnh tai (chăm chú nghe). SBT câu 19."],[24, 所当然地成了医生的好帮手","帮助朋友是理所当然的事。","Giúp bạn bè là chuyện đương nhiên.",["理所当然地……"],"Bài tập 2⑥."],[36,"疾病","jíbìng","dt.","tật bệnh","bệnh tật",1,"书","病（总称）。","神经系统疾病","预防疾病比治疗疾病更重要。","Phòng bệnh quan trọng hơn chữa bệnh.",[],""],[37,"患者","huànzhě","dt.","hoạn giả","người bệnh",1,"书","患某种疾病的人。","神经系统疾病患者","医生耐心地给患者解释病情。","Bác sĩ kiên nhẫn giải thích bệnh tình cho bệnh nhân.",[],"Bài tập 3②."],[38,"辅助","fǔzhù","tt.","phụ trợ","phụ, bổ trợ",1,"","非主要的；协助的。","进行辅助性治疗","音乐可以作为一种辅助治疗手段。","Âm nhạc có thể là một phương pháp hỗ trợ điều trị.",["辅助性","辅助工作"],"Còn là động từ = giúp đỡ. Bài tập 3②."],[39,"症状","zhèngzhuàng","dt.","chứng trạng","triệu chứng",1,"","有机体因发生疾病而表现出来的异常状态。","减轻了病人的症状","感冒的症状有发烧、咳嗽等。","Triệu chứng cảm có sốt, ho…",[],"Bài tập 3②."],[40,"愈","yù","tt.","dũ","khỏi bệnh",1,"书","（病）好。","用它治愈了……障碍","他的病已经痊愈了。","Bệnh của anh ấy đã khỏi hẳn.",["治愈","痊愈"],"Bài tập 2⑤. Còn là phó từ: <span class='zh'>愈……愈……</span> = càng…càng."],[41,"障碍","zhàng'ài","dt.","chướng ngại","trở ngại",1,"","阻挡前进的东西。","精神集中能力障碍","语言是我们交流的最大障碍。","Ngôn ngữ là trở ngại giao tiếp lớn nhất của chúng tôi.",["睡眠障碍","扫除障碍"],"Bài tập 3②. SBT câu 19: <span class='zh'>扫除障碍</span>."],[42,"噪音","zàoyīn","dt.","táo âm","tiếng ồn",1,"","嘈杂刺耳的声音。","受到环境噪音污染的人群","马路上的噪音太大了。","Tiếng ồn ngoài đường to quá.",["噪音污染"],""],[43,"给予","jǐyǔ","đgt.","cấp dữ","dành cho, cho",1,"书","使对方得到。","大自然给予我们的声音暗示","感谢大家给予我的帮助。","Cảm ơn mọi người đã giúp đỡ tôi.",["给予帮助","给予支持"],"⚠️ 给 đọc <b>jǐ</b>. Bài tập 3①."],[44,"嘿","hēi","thán.","hắc","này, ê",1,"口","表示招呼或提起注意。","嘿，你可以放松精神","嘿，你看那边！","Ê, nhìn bên kia kìa!",[],""]],extra:[["寂静","jìjìng","tĩnh lặng"],["减退","jiǎntuì","giảm đi"],["拍打","pāidǎ","vỗ, đập"],["沙沙声","shāshāshēng","tiếng xào xạc"],["警报器","jǐngbàoqì","còi báo động"],["险情","xiǎnqíng","tình hình nguy hiểm"],["异性","yìxìng","người khác giới"],["焦虑","jiāolǜ","lo âu"],["存活","cúnhuó","sống sót"],["预警","yùjǐng","cảnh báo sớm"],["多动症","duōdòngzhèng","chứng tăng động"]],T:[{zh:"你有过这样的经验吗？会还没开始，屋子里一片嘈杂，突然房间里莫名其妙地一片寂静，有人说了句“好安静啊”，马上大家又聊了起来。这是什么现象？其实这是千万年自然选择的结果，没有学会在白噪音减退时闭嘴的人，在自然界早已被淘汰掉了。",vn:"Bạn đã từng trải qua chuyện này chưa? Cuộc họp chưa bắt đầu, trong phòng ồn ào, bỗng nhiên chẳng hiểu sao cả phòng im phăng phắc; có người nói một câu “Yên tĩnh quá nhỉ”, lập tức mọi người lại nói chuyện tiếp. Đây là hiện tượng gì? Thật ra đây là kết quả của hàng chục triệu năm chọn lọc tự nhiên: người không học được cách im lặng khi tiếng ồn trắng giảm đi đã bị tự nhiên đào thải từ lâu.",idea:"Mở bài bằng một hiện tượng quen thuộc.",q:["开会前的屋子里发生了什么现象？","作者认为这是什么的结果？"],note:[["一片嘈杂 · 一片寂静","<span class='zh'>一片 + Adj</span> — miêu tả cả không gian."],["莫名其妙地","Thành ngữ làm trạng ngữ + 地."],["没有学会……的人，……早已被淘汰掉了","Định ngữ dài + bị động."]]},{zh:"什么是白噪音？我们不妨形象地描绘一下：白噪音听上去像下雨的声音，或者像波浪拍打岩石的声音，或者像微风抚摸树叶时发出的沙沙声。",vn:"Tiếng ồn trắng là gì? Chúng ta cứ thử miêu tả hình ảnh một chút: tiếng ồn trắng nghe như tiếng mưa rơi, hoặc như tiếng sóng vỗ vào đá, hoặc như tiếng xào xạc khi gió nhẹ vuốt ve lá cây.",idea:"Định nghĩa bằng hình ảnh.",q:["白噪音听上去像什么？"],note:[["不妨","Xem Ngữ pháp 1."],["像……，或者像……，或者像……","Ba phép so sánh song song."]]},{zh:"在森林里，鸟的叫声就是白噪音，也是天然的警报器。鸟在叫，说明没有危险，鸟叫停止，意味着有了险情，务必要提高警惕了，这时，所有动物都会静下来，只有当鸟叫重新开始时，警报才会解除。",vn:"Trong rừng, tiếng chim kêu chính là tiếng ồn trắng, cũng là còi báo động tự nhiên. Chim đang hót chứng tỏ không có nguy hiểm; chim ngừng hót nghĩa là có biến, nhất thiết phải nâng cao cảnh giác — lúc này mọi con vật đều im lặng, chỉ khi tiếng chim vang lên trở lại, báo động mới được dỡ bỏ.",idea:"Tiếng chim là còi báo động tự nhiên.",q:["为什么说鸟的叫声是“天然的警报器”？"],note:[["说明…… / 意味着……","Hai cách nói “cho thấy, nghĩa là”."],["务必","Xem Ngữ pháp 2."],["只有当……时，……才……","Điều kiện duy nhất."]]},{zh:"其实不论是鸟叫，还是虫叫，都是寻求异性时，不得已而采取的危险举动，因为叫声暴露了自己，很容易惹祸。倘若不叫，雌雄两性谁也发现不了对方，“婚事”就更谈不上了，那么，祖先遗留下的DNA怎么送给异性嘛。既要延续后代，又要保护自己，那就只有用最大的声音，拼命呼唤，同时竖起耳朵，提高警惕，有危险马上闭嘴。原始社会之前，我们的祖先还没有进化成人类，他们最喜欢的事情，可能就是在鸟叫声中无忧无虑地睡大觉。最焦虑的事情就是周围一片寂静，因为那说明危险正在靠拢。我们喜欢听鸟的叫声，因为那会让紧张的神经放松下来。经过数千万年的自然选择，对白噪音减弱越敏感的生物，存活和找到配偶的可能性越大，这种意识在DNA中保留下来，并且世代相传。",vn:"Thật ra dù là chim kêu hay côn trùng kêu, đều là hành động nguy hiểm bất đắc dĩ phải làm khi tìm bạn khác giới, vì tiếng kêu làm lộ bản thân, rất dễ chuốc họa. Nếu không kêu, con đực con cái chẳng ai tìm được ai, “chuyện cưới xin” càng không thể bàn tới, vậy DNA tổ tiên để lại biết trao cho ai được chứ. Vừa phải duy trì nòi giống, vừa phải bảo vệ mình, thì chỉ còn cách kêu thật to, gọi hết sức, đồng thời vểnh tai cảnh giác, có nguy hiểm là im ngay. Trước thời công xã nguyên thủy, tổ tiên chúng ta chưa tiến hóa thành người, điều họ thích nhất có lẽ là được ngủ một giấc vô tư trong tiếng chim hót. Điều khiến họ lo âu nhất là xung quanh im phăng phắc, vì điều đó cho thấy nguy hiểm đang đến gần. Ta thích nghe tiếng chim vì nó làm thần kinh căng thẳng được thả lỏng. Qua hàng chục triệu năm chọn lọc tự nhiên, sinh vật nào càng nhạy cảm với sự suy giảm của tiếng ồn trắng thì khả năng sống sót và tìm được bạn đời càng lớn; ý thức này được lưu giữ trong DNA và truyền qua bao đời.",idea:"Nguồn gốc: tiếng kêu để duy trì nòi giống; ý thức cảnh giác được di truyền.",q:["鸟和虫为什么要叫？叫声有什么危险？","我们的祖先最喜欢和最焦虑的事情是什么？"],note:[["不论是……，还是……，都……","Xem <b>Bài tập 4①</b>."],["不得已而采取的","<span class='zh'>不得已而 + V</span> — bất đắc dĩ mà làm."],["倘若……，……就更谈不上了","<span class='zh'>倘若</span> = nếu (văn viết); <span class='zh'>谈不上</span> = không thể nói tới."],["既要……，又要……，那就只有……，同时……","Xem <b>Bài tập 4②</b>."],["对……越敏感的生物，……的可能性越大","<span class='zh'>越……越……</span> trong câu dài."]]},{zh:"会议室里的嘈杂声就是白噪音，大量的白噪音暗示着安全。当嘈杂声减弱时，提示大家要警惕，然后闭嘴、观察，这是人类大脑深处的预警意识。当有人说“好安静啊”时，大家发现没有危险，于是，报警解除。",vn:"Tiếng ồn trong phòng họp chính là tiếng ồn trắng, lượng lớn tiếng ồn trắng ngầm báo hiệu an toàn. Khi tiếng ồn giảm, nó nhắc mọi người phải cảnh giác, rồi im lặng, quan sát — đây là ý thức cảnh báo sớm nằm sâu trong não người. Khi có ai nói “Yên tĩnh quá nhỉ”, mọi người phát hiện không có nguy hiểm, thế là báo động được dỡ bỏ.",idea:"Quay lại giải thích hiện tượng phòng họp.",q:["当有人说“好安静啊”时，为什么大家又开始聊天了？"],note:[["暗示 · 提示","<span class='zh'>暗示</span> = ngầm báo; <span class='zh'>提示</span> = nhắc rõ."]]},{zh:"白噪音会让我们有安全感，从而放松身心。鉴于白噪音有这样的功效，它理所当然地成了医生的好帮手：人们利用它对神经系统疾病患者进行辅助性治疗，成功地减轻了病人的症状；用它治愈了一些多动症患儿的精神集中能力障碍；受到环境噪音污染的人群，也可用白噪音帮助恢复工作效率……",vn:"Tiếng ồn trắng khiến ta có cảm giác an toàn, từ đó thư giãn thân tâm. Xét thấy tiếng ồn trắng có công hiệu như vậy, nó đương nhiên trở thành trợ thủ đắc lực của bác sĩ: người ta dùng nó để hỗ trợ điều trị cho bệnh nhân bệnh hệ thần kinh, giảm nhẹ thành công triệu chứng; dùng nó chữa khỏi chứng khó tập trung ở một số trẻ tăng động; những người bị ô nhiễm tiếng ồn môi trường cũng có thể dùng tiếng ồn trắng để giúp khôi phục hiệu suất làm việc…",idea:"Công dụng y học của tiếng ồn trắng.",q:["白噪音有什么功效？"],note:[["鉴于……，……理所当然地……","Xem Ngữ pháp 3."],["利用它对……进行辅助性治疗","<span class='zh'>对……进行 + V</span> (văn viết)."]]},{zh:"白噪音实际上是大自然给予我们的声音暗示，它清晰地对我们说：“嘿，你可以放松精神，不必焦虑啦。”",vn:"Tiếng ồn trắng thực chất là lời ám thị bằng âm thanh mà thiên nhiên dành cho chúng ta, nó nói rõ với ta: “Này, bạn có thể thả lỏng tinh thần, không cần lo âu nữa đâu.”",idea:"Kết: thông điệp của thiên nhiên.",q:[],note:[["给予","Đọc <b>jǐyǔ</b>, văn viết."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: kết hợp từ",G:[{id:"g1",grp:0,word:"不妨",zh:"不妨",py:"bùfáng",tag:"Chú thích 1 · phó từ",mean:"Phó từ: <b>có thể làm như vậy, không trở ngại gì</b>; hàm ý người nói cho rằng <b>làm vậy thì tốt hơn</b> — dùng khi <b>khuyến khích, đề nghị</b>. ≈ “cứ…, thử… xem”.",forms:["(chủ ngữ) + 不妨 + V（一下 / 试试 / 直说）"],ex:[["有什么意见，你不妨直说。","Có ý kiến gì bạn cứ nói thẳng."],["什么是白噪音？我们不妨形象地描绘一下。","",1],["改变人们的传统观念可能不容易，但我们不妨试一试。","Thay đổi quan niệm truyền thống có thể không dễ, nhưng chúng ta cứ thử xem."]],tips:["Giọng mềm, lịch sự hơn <span class='zh'>可以 · 应该</span>.","Bài tập 2①."],practice:{q:"用“不妨”改写句子",type:"complete",items:[["她说的方法也许可行，你试试也可以。","她说的方法也许可行，你不妨试试。"],["想接触社会、了解社会，你可以从做志愿者入手。","想接触社会、了解社会，你不妨从做志愿者入手。"],["从目前我们掌握的证据来看，我们或许可以做这样的假设。","从目前我们掌握的证据来看，我们不妨做这样的假设。"]]}},{id:"g2",grp:0,word:"务必",zh:"务必",py:"wùbì",tag:"Chú thích 2 · phó từ",mean:"Phó từ: thái độ <b>kiên quyết</b> — <b>nhất thiết phải, nhất định phải</b>. Thường bổ nghĩa cho động từ, cụm động từ; hay đi với <span class='zh'>要 · 请</span>.",forms:["务必（要）+ V","请务必 + V"],ex:[["鸟叫停止，意味着有了险情，务必要提高警惕了。","",1],["50岁以上的人容易骨折，因此进行跳跃或其他剧烈活动时务必注意了。","Người trên 50 tuổi dễ gãy xương, vì vậy khi nhảy hoặc vận động mạnh nhất định phải chú ý."],["海带凉拌菜做法超级简单，不过务必将海带多泡些时间，不然不易消化。","Món nộm rong biển rất dễ làm, nhưng nhất định phải ngâm rong lâu một chút, không thì khó tiêu."]],tips:["Trang trọng hơn <span class='zh'>一定要</span>; hay gặp trong thông báo: <span class='zh'>请务必准时出席</span>.","Bài tập 2②."],practice:{q:"用“务必”改写句子",type:"complete",items:[["危险来临的时候，大家一定要镇静。","危险来临的时候，大家务必要镇静。"],["请转告他，明天一定要出席会议。","请转告他，明天务必出席会议。"],["山路不好走，开车一定要小心。","山路不好走，开车务必小心。"]]}},{id:"g3",grp:1,word:"不得已",zh:"不得已 / 不得不",py:"bùdéyǐ / bùdébù",tag:"Xem 辨析 bên dưới",mean:"Đều nghĩa <b>không còn cách nào, buộc phải làm vậy</b>, đều bổ nghĩa cho động từ được.",forms:["不得已 / 不得不 + V","不得已的 + N · 是不得已 · 出于不得已"],ex:[["其实不论是鸟叫，还是虫叫，都是寻求异性时，不得已而采取的危险举动。","",1],["他们实在没有别的办法，不得已出去向别人借钱。","Họ thực sự hết cách, bất đắc dĩ phải đi vay tiền người khác."]],tips:["<span class='zh'>不得已而 + V</span> (văn viết) = bất đắc dĩ mà…","Bài tập 2③."]},{id:"g4",grp:2,word:"鉴于",zh:"鉴于",py:"jiànyú",tag:"Chú thích 3 · giới từ / liên từ (văn viết)",mean:"<b>Giới từ</b>: “xét thấy, cân nhắc đến”. <b>Liên từ</b>: đứng đầu vế trước của câu phức nhân quả, nêu <b>căn cứ, nguyên nhân, lý do</b> cho hành vi ở vế sau. Dùng trong văn viết (thông báo, quyết định…).",forms:["鉴于 + N / mệnh đề，(chủ ngữ) + quyết định / hành động"],ex:[["鉴于农村教师严重缺乏，他决定大学毕业以后，到农村去当老师。","Xét thấy nông thôn thiếu giáo viên trầm trọng, anh quyết định tốt nghiệp xong sẽ về quê dạy học."],["鉴于白噪音有这样的功效，它理所当然地成了医生的好帮手。","",1],["鉴于中国的娱乐片起步较晚，……这样的研讨会无疑给创作者提供了极大的帮助。","Xét thấy phim giải trí TQ khởi đầu muộn, … hội thảo như vậy chắc chắn giúp ích rất lớn cho người sáng tác."]],tips:["Vế sau thường là <b>quyết định, biện pháp</b>: <span class='zh'>决定 · 只好 · 特……</span>","Bài tập 2④."],practice:{q:"完成句子",type:"complete",items:[["鉴于近来生意清淡，大家讨论决定________。","鉴于近来生意清淡，大家讨论决定先减少进货，同时加大宣传力度。"],["鉴于篇幅所限，本章仅________。","鉴于篇幅所限，本章仅介绍最常用的几种方法。"],["鉴于________，学校决定明天停课一天。","鉴于明天有强台风，学校决定明天停课一天。"]]}}],BX:{grp:1,word:"不得已",cols:["不得已","不得不"],pair:"不得已 — 不得不",same:["Đều biểu thị <b>không có cách nào, buộc phải làm vậy</b>, đều bổ nghĩa cho động từ được.","半路上车坏了，我们不得已 / 不得不又回来了。"],diff:[["Là <b>tính từ</b>, bổ nghĩa được cho <b>danh từ</b>.","这也是不得已的办法，你试试吧。","Chỉ bổ nghĩa cho <b>động từ</b>.<div class='zh' style='margin-top:4px'>由于资金不足，这项工程不得不停止。</div>"],["Dùng được kiểu <span class='zh'>chủ ngữ + 是 + 不得已</span>, hoặc <b>đứng riêng</b> thành một vế câu.","他半夜动身也是不得已。 / 屋里坐不下，不得已，我们只好站在外边。","<b>Không</b> có cách dùng này."],["Đứng sau <span class='zh'>由于 / 出于 / 因为</span> được.","出于不得已，我只好把孩子放在亲戚家里。","<b>Không</b> có cách dùng này."]],task:{q:"选择“不得已”或“不得不”填空",cols:["不得已","不得不"],sample:!1,items:[["实在是____，我把房子卖了。",0,"<span class='zh'>是 + 不得已</span> → chỉ 不得已."],["父亲去世以后，他____放弃学业，出去打工。","0,1","Đứng trước động từ → <b>cả hai đều đúng</b>."],["这是____的措施，请大家谅解。",0,"Bổ nghĩa danh từ (措施) → 不得已."],["这样安排也是出于____，你就别抱怨了。",0,"<span class='zh'>出于 + 不得已</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["解<u>除</u>","删除 · 免除 · 除掉 · 除去"],items:[["务<u>必</u>","必","必然 · 必定 · 必要 · 必须"],["延<u>续</u>","续","继续 · 连续 · 断断续续 · 持续"],["后<u>代</u>","代","代替 · 代表 · 代理 · 代沟"],["<u>功</u>效","功","功能 · 功劳 · 功利 · 成功"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["有什么意见，你可以当面提出来，不要在背后议论。→ ________","不妨","有什么意见，你不妨当面提出来，不要在背后议论。"],["明天的会非常重要，大家一定要参加。→ ________","务必","明天的会非常重要，大家务必要参加。"],["他们实在没有别的办法，只好出去向别人借钱。→ ________","不得已","他们实在没有别的办法，不得已出去向别人借钱。"],["考虑到他出色的表现，公司决定让他担任部门经理。→ ________","鉴于","鉴于他出色的表现，公司决定让他担任部门经理。"],["他的病彻底治好了，全家都非常高兴。→ ________","愈","他的病彻底治愈了，全家都非常高兴。"],["孩子按道理应该孝顺父母。→ ________","理所当然","孩子孝顺父母是理所当然的事情。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["波浪","抚摸","岩石","神经","给予"],text:"人们喜欢在海边听{波浪}拍打{岩石}的声音，喜欢在森林里听鸟儿的叫声，也喜欢听微风{抚摸}树叶发出的沙沙声，因为这些声音可以让紧张的{神经}放松下来。这些声音是大自然{给予}人们的宝贵礼物，可以治疗很多神经系统疾病。"},{bank:["患者","障碍","症状","功效","辅助"],text:"对于有睡眠{障碍}的人来说，除了去医院接受治疗以外，一些{辅助}性治疗方法的{功效}也很不错，比如：睡前喝一杯牛奶，听一些轻柔的音乐，放松心情等等，都可以减轻{患者}的{症状}。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"其实<u>不论</u>是鸟叫，<u>还是</u>虫叫，<u>都</u>是寻求异性时，不得已而采取的危险举动，<u>因为</u>叫声暴露了自己，很容易惹祸。",task:"不论____，还是____，都喜欢吃烤鸭，因为____。",model:"不论是中国人，还是外国游客，都喜欢吃烤鸭，因为烤鸭皮脆肉嫩，味道特别香。"},{src:"<u>既要</u>延续后代，<u>又要</u>保护自己，<u>那就只有</u>用最大的声音，拼命呼唤，<u>同时</u>竖起耳朵，提高警惕，有危险马上闭嘴。",task:"学习汉语时，既要____，又要____，那就只有____，同时____。",model:"学习汉语时，既要记住大量汉字，又要练好听说能力，那就只有每天坚持读和写，同时多找机会跟中国人聊天儿。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["文中提到了哪几种白噪音？","①下雨的声音 ②波浪拍打岩石的声音 ③微风抚摸树叶的声音 ④鸟的叫声 ⑤会议室的嘈杂声","下雨的声音、波浪拍打岩石的声音、微风抚摸树叶的沙沙声、森林里鸟的叫声，还有会议室里的嘈杂声，都是白噪音。"],["白噪音给我们什么暗示？","①安全 ②危险","大量的白噪音暗示着安全；白噪音突然减弱或停止，则暗示着危险，提示我们要提高警惕。"],["鸟儿为什么要叫？","①寻找异性 ②延续后代","鸟叫是为了寻找异性、延续后代；虽然叫声会暴露自己，但它们不得已只能拼命呼唤，同时提高警惕。"],["白噪音有什么功效？","①放松身心 ②治疗疾病（神经系统疾病 / 多动症患儿）③恢复工作效率","白噪音能让人有安全感、放松身心；可以辅助治疗神经系统疾病，治愈一些多动症患儿的精神集中能力障碍，还能帮助受噪音污染的人恢复工作效率。"]]},DP:{title:"词汇：熟悉下列词语搭配",vn:"12 từ hay gặp trong đề HSK6 — chú ý cột kết hợp.",items:[["颁发","bānfā","ban hành; trao tặng","颁发证书 / 颁发奖状","1995年3月，国务院颁发通知，全国实行每周五天工作制。"],["报复","bàofù","trả thù, báo thù","报复心理 / 打击报复","人类不爱护环境，最终必将招致大自然疯狂的报复。"],["报销","bàoxiāo","thanh toán (chi phí)","凭票报销","因公出差车票可以报销。"],["备份","bèifèn","sao lưu","备份文件","这个文件很重要，记得及时做个备份。"],["补贴","bǔtiē","trợ cấp","补贴家用 / 生活补贴","听说有些国家对多植树的个人和家庭会给一定的绿化补贴。"],["哺乳","bǔrǔ","cho bú","哺乳动物 / 哺乳期","猫是哺乳动物吗？"],["巢穴","cháoxué","tổ, hang ổ","建造巢穴","出去捕食的鸟妈妈一直惦记着巢穴里的孩子。"],["处分","chǔfèn","kỷ luật","受处分","考试作弊当然要处分。"],["档案","dàng'àn","hồ sơ","人事档案","我们公司有非常完整的客户档案。"],["东道主","dōngdàozhǔ","chủ nhà","—","这次奥运会，东道主获得的金牌总数最多。"],["对称","duìchèn","đối xứng","不对称","中国很多传统建筑都是对称设计的。"],["对应","duìyìng","tương ứng","与……（相）对应","进入考场后请先找到与准考证上号码对应的座位坐好。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"我们生活在一个充满声音的世界里。有些声音是自然界产生的，如风声、雨声、波浪声；有些声音则是人、动物或机器发出的，如说话声、音乐声、机器声等。我们周围的这许多声音都是通过振动产生的。",o:["人们喜欢充满声音的世界","自然界发出的声音占大部分","音乐声是自然界产生的声音","声音都是通过振动产生的"],a:3,why:"“这许多声音都是通过振动产生的”."},{n:2,say:"有时候，你会看到一大群蚂蚁围成一个圆形，集合在一起。中间的蚂蚁好像是集会的首领，其他蚂蚁向它靠拢，似乎在静静地聆听，而最外围的蚂蚁头朝外，警惕地观察着，看样子是警卫员。这就是最有纪律的蚂蚁王国。",o:["中间的蚂蚁向外围靠拢","最外围的蚂蚁头朝里观察着","一大群蚂蚁围成一个半圆形","蚂蚁王国是最有纪律的"],a:3,why:"“这就是最有纪律的蚂蚁王国”. A, B ngược chiều; C: hình <b>tròn</b>."},{n:3,say:"从小到大，我们可能生过很多病，比如感冒、发烧、肚子疼等等。这些疾病损害了我们的健康，影响了我们的生活，所以，聪明的人类就想出了各种各样的办法来预防和治疗疾病，这些方法的功效各不相同。",o:["疾病是没有办法预防的","疾病损害了我们的健康","疾病不会影响我们的生活","治疗疾病的方法功效相同"],a:1,why:"“这些疾病损害了我们的健康”."},{n:4,say:"多数蜜蜂和黄蜂都生活在有组织的社会群体中，一个群体中通常只有一只雌性蜂产卵，负责延续后代，成为“蜂后”。其余成员大部分是工蜂，它们负责照料年幼的蜜蜂、建造和修理蜂巢、收集食物，是蜂群中最辛苦的。",o:["一个蜂群中通常有几只雌性蜂产卵","工蜂负责延续后代、照料年幼的蜜蜂","工蜂要建造和修理蜂巢、收集食物","“蜂后”是蜂群中最辛苦的蜜蜂"],a:2,why:"Ong thợ “负责照料……、建造和修理蜂巢、收集食物”. B: duy trì nòi giống là việc của <b>ong chúa</b>."},{n:5,say:"俗话说“种瓜得瓜，种豆得豆”，人也一样，当我们照镜子时，会发现自己的长相有些地方像爸爸，有些地方像妈妈，这种现象就叫遗传。它是人类在进化的过程中，把祖先的DNA遗留给后代的一种现象。",o:["遗传是只有人类才有的特性","人类在进化过程中改变了DNA","我们的长相跟父母有很大不同","遗传就是祖先的DNA遗留给了后代"],a:3,why:"“把祖先的DNA遗留给后代的一种现象”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：观众朋友们，你们好，先问大家一个问题：你们家里养宠物吗？你觉得宠物能带给你什么？健康？快乐？还是麻烦？今天我们就请王教授给我们讲一讲动物跟人类的关系。\n男：有关专家早已发现，那些有亲人感情支持的人，病痛较少，就是病倒了治愈速度也比无亲无故的人快一些。不久前发表的一项研究报告显示：动物给予人类的支持同样有效。\n女：这就是为什么很多人，特别是孤独的老人喜欢养宠物的原因吧？\n男：没错，很多老人都感觉孤独，这种孤独足以使他们患上精神类疾病或其他疾病。不过，研究表明，家里养有宠物的老人显然比较快乐。\n女：那么动物怎么给人感情支持呢？\n男：动物能给人无条件的支持。人际关系会受其他因素影响，你要求别人帮忙，未必会如愿；有些人帮忙了，却又觉得你欠他的似的；又或者他们的精神支持是有限度的。但动物则不同，你可以把所有精神压力都倾诉给它们，跟它们说说心事，这不但是很好的宣泄途径，而且又不会增加别人的负担。\n女：鉴于上述这些表现，所以宠物也可以辅助治疗一些疾病吧？\n男：是的，欧洲最大的宠物治疗组织有个庞大的“治疗队伍”——8500只动物，这些动物不时会到医院探望患者，有时也会去老人院跟老人们玩耍，是很出色的“医疗助手”。",qs:[{n:6,q:"本文主要讲了什么方面的内容？",o:["宠物的喂养方法","怎么治疗孤独症老人","医生如何利用宠物治病","宠物给人类精神上的帮助"],a:3,why:"Chủ đề: động vật cho con người <span class='zh'>感情支持</span>."},{n:7,q:"那些有亲人感情支持的人会怎样？",o:["病痛较少","容易病倒","特别孤独","比较快乐"],a:0,why:"“有亲人感情支持的人，病痛较少”. D là người già <b>nuôi thú</b>."},{n:8,q:"如果家里有宠物，会出现怎样的状况？",o:["人们就不需要亲朋好友了","上年纪的人一般身体不好","人际关系会受到很大影响","人们可能更加健康和快乐"],a:3,why:"“家里养有宠物的老人显然比较快乐” + hỗ trợ sức khỏe."},{n:9,q:"怎样理解动物给人的支持？",o:["动物给人类的支持是有条件的","动物给人类的支持不如人类互相的支持","动物给人类的支持会增加人类的负担","动物给人类的支持可能是人类不能给予的"],a:3,why:"Động vật cho sự ủng hộ <b>vô điều kiện</b>, khác hẳn quan hệ người – người."},{n:10,q:"欧洲最大的宠物治病组织的动物能做什么？",o:["协助医生出诊","到医院探望病人","得到老人的照顾","在动物园陪人玩耍"],a:1,why:"“这些动物不时会到医院探望患者”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"所有的鸟都有羽毛，有些鸟的羽毛非常美丽。但是鸟的羽毛是干什么用的呢？除了帮助它们飞翔，还有其他用处吗？回答是肯定的！\n在寒冷的天气，鸟用羽毛做成一件温暖的冬季外套。鸟弄松它的羽毛让身体保持温暖。对有些鸟来说，防水的羽毛就像一件雨衣。这些鸟能游泳和潜水，不至于因为湿透了而沉入水中。\n羽毛的颜色也很重要。有的鸟靠鲜艳的羽毛吸引配偶。有的鸟的羽毛和栖息地融为一体，这样它们就不容易被发现，饥饿的敌人就不会注意到它们。",qs:[{n:11,q:"本文没有提到的羽毛的作用是什么？",o:["帮助飞翔","保暖防水","吸引配偶","寻找食物"],a:3,why:"Bài nhắc bay, giữ ấm, chống nước, thu hút bạn đời, ngụy trang — không có tìm thức ăn."},{n:12,q:"鸟用什么方法让身体保持温暖？",o:["多飞翔","多吃食物","弄松自己的羽毛","穿一件温暖的外套"],a:2,why:"“鸟弄松它的羽毛让身体保持温暖”. D chỉ là so sánh."},{n:13,q:"鲜艳的羽毛对鸟有什么帮助？",o:["吸引配偶","不易被敌人发现","方便游泳和潜水","让鸟儿与栖息地融为一体"],a:0,why:"“有的鸟靠鲜艳的羽毛吸引配偶”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"世界上，每天都有很多人出生。理所当然，所有的人都需要生存空间，还需要食物。\n人砍掉森林，为庄稼、工厂、房子和道路腾出空间。一旦这种事情发生，动物的栖息地和家园就被破坏了。在人们用有害的化学物质或其他废物污染河流、湖泊和森林时，动物的栖息地都会受到影响。\n热带雨林是许多动植物的家。但是在人们伐木、开矿和采集其他材料时，每年都有大面积的热带雨林被破坏。科学家和其他人担心，如果有更多的雨林被破坏，成千上万种植物和动物将会灭绝。",qs:[{n:14,q:"人们需要空间来做什么？",o:["种植大面积的热带雨林","开发河流、湖泊和森林","给动物建立栖息地和家园","建农场、工厂、房子和道路"],a:3,why:"“为庄稼、工厂、房子和道路腾出空间”."},{n:15,q:"动物的栖息地是怎样遭到破坏的？",o:["人们砍掉了森林","人们污染了河流","人们伐木、开矿","上述三个方面都包括"],a:3,why:"Cả ba đều được nhắc."},{n:16,q:"如果更多的热带雨林被破坏，会导致什么样的后果？",o:["每年有很多的人出生","人们占据了大量空间","成千上万种动植物将会灭绝","化学物质污染河流、湖泊和森林"],a:2,why:"“成千上万种植物和动物将会灭绝”."},{n:17,q:"这篇短文主要讲述了什么？",o:["人类是如何破坏环境的","人类是如何保护环境的","人类与动植物的关系密切","人类与动植物的进化过程"],a:0,why:"Toàn bài nói các cách con người phá hủy môi trường sống."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["他把那面大镜子摆好在客厅的中央。","对于产品的价格，除非不得已，不要任意调高。","在这样复杂艰巨的改革当中，务必要高度关心群众利益。","尤其可悲的是，你的坏情绪会使周围的朋友也渐渐地疏远你。"],a:0,why:"<b>Bổ ngữ chồng</b>: đã có bổ ngữ nơi chốn <span class='zh'>在……</span> thì không thêm <span class='zh'>好</span> → <span class='zh'>摆在客厅的中央</span>."},{n:19,o:["公司不能单方面无故解除劳动合同。","我们会竖起耳朵倾听消费者的意见。","大家紧张地工作，相信最后一定能扫障碍。","建议家长让孩子参加一些志愿者活动之类的社会实践。"],a:2,why:"<b>Kết hợp sai</b>: phải là <span class='zh'>扫除障碍</span>."},{n:20,o:["这种处理方法是对的，因为效果出来了嘛！","他突然说出这样一番话，实在让人莫名其妙。","老板看见到那种情况，吓得一直跑回店里去。","晚上有人陪着她还害怕呢，更何况今天她一个人在家。"],a:2,why:"<b>Thừa / kết hợp sai</b>: <span class='zh'>看见到</span> → <span class='zh'>看到 / 看见</span>; <span class='zh'>一直跑回</span> → <span class='zh'>一口气跑回</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"在安静的沙漠里，时常有一种沙沙声。是风声吗？不是。这是响尾蛇振动的尾巴___的。响尾蛇___这种声音引诱小动物，或者吓跑敌人。响尾蛇___是怎么发出沙沙作响的声音的？因为它们的尾部有很多响环，摇动时互相摩擦就会发出这种声音。",o:["打出　应用　究竟","给出　作用　终于","发出　利用　到底","做出　效用　终究"],a:2,why:"<span class='zh'>发出声音</span>; <span class='zh'>利用……引诱</span>; câu hỏi dùng <span class='zh'>到底</span> (<span class='zh'>究竟</span> cũng được nhưng A sai hai chỗ đầu)."},{n:22,text:"在科学界，___争论需要花费很长时间。___其中一方正确的最佳方法是设计可重复的实验。可重复的意思是___不管谁来做这个实验，所得结果都应该是一样的。一个科学家提出一个假说，同时也建立了一套实验，清楚地___他的假说，我们就说他遵循了科学的方法。",o:["解决　证明　指　支持","攻克　说明　拿　坚定","超越　表明　提　支撑","处理　标明　说　保持"],a:0,why:"<span class='zh'>解决争论</span>; <span class='zh'>证明……正确</span>; <span class='zh'>……的意思是指</span>; <span class='zh'>支持假说</span>."},{n:23,text:"春天一到，大地上就会开满___的花朵。各种不同的花朵不仅有美丽的颜色、优雅的___，而且还有___的香气和巧妙的结构。花有香气，这是因为它们的花瓣能够分泌出具有香气的芳香油，由于不同的花分泌的芳香油不同，所以它们___出来的香气也就各不相同。",o:["五光十色　身体　浓烈　发布","五颜六色　身姿　芬芳　散发","琳琅满目　姿势　悠久　分散","十全十美　形状　美好　传播"],a:1,why:"<span class='zh'>五颜六色的花朵</span>; <span class='zh'>优雅的身姿</span>; <span class='zh'>芬芳的香气</span>; <span class='zh'>散发香气</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"生物计量学即生物识别技术，(24)。对于大多数生物识别系统来说，信息通过图像、录音或者其他数据形式进入电脑，然后用设定好的算法进行数学计算，将原始图像或声音转化为数字，即特征，(25)。\n生物识别系统并不完美，但你仍然会在生活中发现它越来越多的身影。在许多机场、国防设施、公司、学校等，(26)，它在这些需要限制进入的区域进行入口管制。在一些商店里，买家甚至用触摸方式，进行指纹扫描付款，就像使用信用卡一样。你还可以找到可以用指纹解锁的计算机或手机，(27)。\n正像迪士尼乐园的管理者所说，(28)，它将身份盗窃之类的行为减至比较低的程度，提高安全性，并节省经费。\n在希思罗机场，乘客韦曼说：“我不用排队等候。”机器会扫描他的眼睛虹膜，通过后他会收到一张打印出来的纸条：欢迎来到英国。\n欢迎来到生物计量学的世界！",opts:["最后，系统将结果与个体进行关联","拥有无法复制和忘记的密码，保护自己的信息","它通过计算机程序和计算，根据身体与行为自动识别个体","你都能够发现生物识别技术的应用","生物识别可以带给管理者和使用者便捷"],ans:{24:2,25:0,26:3,27:1,28:4}},read4:[{ins:"第29–32题：请选出正确答案。",text:"提起近视，许多同学都觉得是不良的用眼习惯造成的，如看书距离不当、光线太暗、持久用眼等。但你知道吗？研究证明，饮食不当也是诱发青少年近视的重要原因之一。\n美国纽约大学研究员贝兰博士对大量青少年近视病例进行分析后指出，体内缺乏微量元素铬与近视的形成有一定的关系。铬元素是人体中球蛋白代谢所必需的。它主要存在于粗粮、红糖、蔬菜及水果等食物中。有些小朋友不喜欢吃粗粮，只吃一些精细食物，从而造成身体缺铬，引起机体血液渗透压的改变，进而导致眼睛晶状体渗透压的变化，使晶状体变凸，产生近视。\n许多同学喜欢甜食，而糖在体内摄入过多可使血液偏酸。人体欲保持酸碱平衡，不得不动员大量钙质去中和酸，从而引起血钙不足，减弱眼球壁的弹性，使眼轴伸长，埋下近视的隐患。同时，血糖升高，会使晶状体变凸而形成近视。\n吃硬质食品过少也是引起青少年近视增加的原因之一。吃硬质食物能促使面部肌肉运动，包括支配眼球运动的肌肉，进而有效地发挥调节眼睛晶状体的能力。因此，大家常吃如胡萝卜、土豆、黄豆、水果等耐嚼的硬质食品，增加咀嚼的机会，也可预防近视眼发生。",qs:[{n:29,q:"为什么缺铬会导致近视？",o:["铬是人体中重要的微量元素","铬主要存在于粗粮、蔬菜中","人体代谢需要铬元素的参与","引起眼睛晶状体渗透压的变化"],a:3,why:"Thiếu crôm → áp suất thẩm thấu máu thay đổi → <b>thủy tinh thể</b> thay đổi → lồi → cận thị."},{n:30,q:"摄入过多甜食产生的后果不包括下面哪一项？",o:["使血液偏酸","机体血液渗透压改变","引起血钙不足","减弱眼球壁的弹性"],a:1,why:"B là hậu quả của <b>thiếu crôm</b>, không phải ăn nhiều đồ ngọt."},{n:31,q:"为什么吃硬质食物过少会引起近视？",o:["影响球蛋白的代谢","血糖升高，使晶状体变凸","肌肉调节晶状体的能力降低","使眼轴伸长，埋下近视的隐患"],a:2,why:"Nhai đồ cứng giúp cơ mặt (cả cơ mắt) vận động → điều tiết thủy tinh thể; ăn ít → khả năng này giảm."},{n:32,q:"本文主要谈了哪一方面的内容？",o:["近视有哪些危害","饮食不当导致近视","运动方式对近视的影响","不良的用眼习惯造成近视"],a:1,why:"“饮食不当也是诱发青少年近视的重要原因之一”."}]},{ins:"第33–36题：请选出正确答案。",text:"生物体大脑中的树突之于神经细胞，就犹如十指之于双手。你的手指从手掌延展出去，接触物体时，接收到来自物体的感觉信息。对于树突来说，它们接触的物体就是其他的神经细胞。\n我们不妨这样来描绘一下神经细胞，它像一棵“微型树”，主干上分出很多枝丫，而枝丫上又分出更细的枝丫，如此类推，直到分出很多细小的长有叶子的细枝。神经细胞的“细枝”就是“突触”，正是通过它，神经细胞之间的信息才能相互传递。分支越多，突触就越多，突触越多，大脑接收到的信息也就越多。\n神经学家通过实验发现：被置于充满刺激物环境中的老鼠，其神经细胞的树突要比那些被单独关起来的老鼠平均多出20%～25%。这就给我们一些暗示，这些老鼠是否更聪明呢？实验结果显示，它们比后者更容易走出迷宫。这个结果提示我们，你在成长的过程中处理的信息越多，你得到的学习机会也就越多，你的大脑就变得更复杂，神经细胞之间的联系也就越多。\n研究人员在随后进行的研究工作中发现，随着阅历的丰富，大脑改变自身结构的能力会贯穿人的一生。",qs:[{n:33,q:"“树突”接触的物体是什么？",o:["大脑","十指","手掌","细胞"],a:3,why:"“它们接触的物体就是其他的神经细胞”."},{n:34,q:"神经细胞之间的信息通过什么传递？",o:["树突","树干","树枝","树叶"],a:0,why:"Theo đáp án sách: thông tin truyền qua các nhánh <b>突触</b> trên <b>树突</b> — B, C, D chỉ là hình ảnh so sánh."},{n:35,q:"神经细胞的树突更多的老鼠，是：",o:["被置于充满刺激物环境中的老鼠","被单独关起来的老鼠","正在迷宫里寻找出口的老鼠","学习机会不多的老鼠"],a:0,why:"“被置于充满刺激物环境中的老鼠……多出20%～25%”."},{n:36,q:"根据文章内容，下面说法不正确的是：",o:["树突跟神经细胞的关系就像十指跟双手的关系","神经细胞就像一棵“微型树”，有很多枝丫","处理的信息越多，神经细胞之间的联系就越多","大脑改变自身结构的能力会随着年龄增长而消失"],a:3,why:"Bài nói khả năng này <span class='zh'>贯穿人的一生</span> — không mất đi."}]}]},W:{task:"这篇课文告诉我们什么是白噪音，大自然中有哪些白噪音，白噪音会带来什么样的暗示以及白噪音有哪些作用。请参考练习5，把课文缩写成300字左右的短文。",target:300,steps:[["Hiện tượng","1–2 câu: phòng họp ồn → im bặt → “好安静啊” → lại ồn; đây là kết quả của chọn lọc tự nhiên."],["Định nghĩa","Liệt kê tiếng mưa, sóng, gió, tiếng chim — gộp thành 1 câu."],["Ám thị","<span class='zh'>鸟在叫 = 安全；鸟叫停止 = 危险</span>; vì sao chim vẫn kêu (<span class='zh'>不得已 · 延续后代</span>)."],["Giải thích","Ý thức cảnh giác lưu trong DNA; áp lại vào phòng họp."],["Công dụng + kết","<span class='zh'>鉴于……，理所当然地……</span>; 3 công dụng; câu kết của thiên nhiên."]],outline:[["一 · 现象","会前突然安静"],["二 · 什么是白噪音","雨声、波浪声、风声、鸟叫"],["三 · 暗示与来源","安全 / 危险；鸟为什么叫；DNA"],["四 · 功效","放松；辅助治疗；恢复效率"]],model:"白噪音\n开会前，屋子里一片嘈杂，有时会突然莫名其妙地安静下来，有人说一句“好安静啊”，大家又聊了起来。其实这是千万年自然选择的结果。\n白噪音听上去像下雨的声音、波浪拍打岩石的声音或者微风吹过树叶的沙沙声。在森林里，鸟的叫声就是白噪音，也是天然的警报器：鸟在叫，说明没有危险；鸟叫停止，就意味着有了险情，所有动物都会静下来。\n鸟叫是为了寻找异性、延续后代，虽然叫声会暴露自己，但它们不得已只能一边拼命呼唤，一边提高警惕。我们的祖先也最喜欢在鸟叫声中睡觉，最怕周围一片寂静。经过数千万年的自然选择，对白噪音减弱越敏感的生物越容易存活，这种意识在DNA中保留了下来。会议室里的嘈杂声也是白噪音，当它减弱时，人们就会闭嘴观察；有人说“好安静啊”，大家发现没有危险，警报才解除。\n白噪音能让人有安全感，放松身心。鉴于这样的功效，它成了医生的好帮手，可以辅助治疗神经系统疾病和多动症，还能帮助人们恢复工作效率。",check:["Có tiêu đề","Có hiện tượng mở đầu","Có định nghĩa + ví dụ tiếng ồn trắng","Giải thích ám thị an toàn / nguy hiểm","Có công dụng","Dùng ít nhất 3: 不妨 · 务必 · 鉴于 · 不得已 · 理所当然","Khoảng 300 chữ (±30)"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"在青岛生活若干年后，有一年春节期间，我和先生受邀到朋友家中吃饭。\n那是个相当殷实的家庭。这对夫妻做生意多年，有了丰厚的财富积累。家有一女，十五六岁。一家三口住在东部海边一高档社区，住的房子装修得相当讲究。那顿餐食准备得很丰盛，大菜小菜有十好几个，长方形的餐桌摆得满满当当，我们吃得自然很开心。大家边吃边聊，谈住房、谈教育、谈养生、谈健康，话题和菜品一样丰富。\n最后一道主食，热气腾腾的饺子端上了桌。我夹饺子时不小心筷子一滑，圆溜溜的饺子脱出控制，掉在脚下擦得晶亮的木地板上。这是个意外，我有些尴尬，忙下意识地弯腰捡起，又下意识地要扔进旁边的垃圾筒。这时，另一个意外发生了。女主人一边笑着安慰我“没事没事”，一边又制止我扔掉饺子。她说：“别扔，给我！”我愣住了。不会吧？这么有钱的家庭，不会抠门成这样吧？掉到地上的饺子不让扔掉，难道还能再吃？谁吃？\n在那个短暂的瞬间，我不知道女主人要干什么。我伸向垃圾桶的手僵在半空中，愈发地尴尬。女主人从容不迫，笑着接过饺子。她女儿——那位一直在饭桌上很安静的小姑娘，立即明白了母亲要干什么，马上起身去拿来一只一次性纸杯。女主人笑着说：“就是沾了点儿灰，扔了怪可惜，一会儿让她拿去喂小猫。”边说，边将饺子剥了皮，将沾了灰的面皮扔进垃圾筒，将圆鼓鼓一团肉馅放进一次性纸杯。女主人顺便又从鱼盘里夹出两块细白的鱼肉，细心地剔了刺儿，一起放入纸杯。小姑娘看来非常了解自己的母亲，她将装了肉的纸杯拿离餐桌，很认真地放在门口玄关处。然后她冲我调皮地笑笑，说：“阿姨，小猫可爱吃肉啦！”我方才明白其意。又奇怪，压根没见着家中有猫啊！便问：“你们养猫啦？猫在哪儿呢？”女主人笑着回答：“小区里的流浪猫，好几只呢，没人管，大过年的，怪可怜的。”\n我和先生都沉默了。我仿佛上了一堂课：有关于节约、珍惜与善念。我想从这一刻起，对这个物质富裕的家庭，我们都有了全新的认识。餐饭结束后，这对夫妇送我们到楼下，他们的女儿，手里拿着那只纸杯，一声不响地跟在我们身后。我们在小区启动了车子，隔着车窗，我看到那位小姑娘一边快乐地学着小猫“喵喵”叫，一边弯下身，动作娴熟地将那只杯子放进花坛边的草丛里。\n大约两年后，朋友家传来喜讯，他们的女儿考进北京一所无数高考生梦寐以求的重点大学。四年后，也就是去年，他们家又传来好消息，他们的女儿因品学兼优，被美国一所大学以奖励全额奖学金的方式录取读研。圈子里的朋友都觉得这孩子太幸运了。而我一点儿也不觉得有什么奇怪，我觉得那种家庭氛围熏陶出品学兼优的孩子，不是幸运，是必然。",model:"掉在地上的饺子\n有一年春节，我和先生到青岛的一位朋友家吃饭。朋友夫妻做生意多年，家里很富裕，有一个十五六岁的女儿。那天的饭菜非常丰盛，大家边吃边聊，十分开心。\n最后上饺子的时候，我不小心把一个饺子掉在了地板上。我很尴尬，捡起来想扔进垃圾桶，女主人却笑着拦住我说：“别扔，给我！”我愣住了：这么有钱的人家，难道还要吃掉在地上的饺子？\n女主人接过饺子，她女儿马上明白了母亲的意思，去拿来一个一次性纸杯。女主人说：“扔了怪可惜的，一会儿拿去喂小猫。”她剥掉沾了灰的面皮，把肉馅放进纸杯，又夹了两块鱼肉，细心地剔了刺，一起放了进去。小姑娘把纸杯放在门口，笑着对我说：“阿姨，小猫可爱吃肉啦！”我问她们家是不是养了猫，女主人说，是小区里没人管的流浪猫，过年了，怪可怜的。\n我和先生都沉默了，觉得自己上了一堂关于节约、珍惜和善良的课。饭后，小姑娘拿着纸杯送我们下楼，一边学猫叫，一边熟练地把杯子放进花坛边的草丛里。\n两年后，这个女孩考上了北京一所重点大学；去年，她又因为品学兼优，拿到全额奖学金去美国读研究生。朋友们都说她运气好，可我觉得，在那样的家庭氛围中长大，她的优秀不是幸运，而是必然。"}},SUM:{words:["嘈杂","莫名其妙","淘汰","不妨","描绘","抚摸","务必","警惕","解除","不得已","暴露","惹祸","祖先","遗留","延续","后代","呼唤","原始","进化","靠拢","神经","配偶","世代","暗示","提示","鉴于","功效","理所当然","疾病","患者","辅助","症状","障碍","给予"],patterns:[["不妨 + V","我们不妨形象地描绘一下。"],["务必（要）+ V","务必要提高警惕了。"],["鉴于……，……","鉴于白噪音有这样的功效，它理所当然地成了医生的好帮手。"],["不论是……，还是……，都……","不论是鸟叫，还是虫叫，都是……不得已而采取的危险举动。"],["既要……，又要……，那就只有……","既要延续后代，又要保护自己，那就只有用最大的声音拼命呼唤。"]],diff:["不得已：tính từ — + danh từ (不得已的办法), 是不得已, 出于不得已, đứng riêng — 不得不：chỉ + động từ","暗示 (ngầm báo) ≠ 提示 (nhắc rõ) · 给予 jǐ · 暴露 lù · 配偶 = vợ/chồng (văn viết) · 愈 = khỏi bệnh (治愈 · 痊愈)"],sentences:["没有学会在白噪音减退时闭嘴的人，在自然界早已被淘汰掉了。","鸟在叫，说明没有危险，鸟叫停止，意味着有了险情，务必要提高警惕了。","白噪音实际上是大自然给予我们的声音暗示。"],hw:["Học thuộc 44 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 12, gồm đề 缩写 “掉在地上的饺子” (400 chữ).","Ôn tập Chủ đề 3 (bài 9–12) · Đọc trước bài 13 — mở đầu Chủ đề 4 走遍天下."]}});
