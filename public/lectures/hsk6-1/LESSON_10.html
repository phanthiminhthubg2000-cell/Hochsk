<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 10 · 全球化视野中的中国饮食 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

phá bí ẩn của vũ trụ.",["探索奥秘","……的奥秘"],"SBT nghe 6–10: <span class='zh'>喝水的奥秘</span>."]],extra:[["魅力","mèilì","sức hấp dẫn"],["吸收","xīshōu","hấp thụ, tiếp thu"],["核心","héxīn","cốt lõi"],["折中","zhézhōng","dung hòa"],["引进","yǐnjìn","du nhập"],["物产","wùchǎn","sản vật"],["原料","yuánliào","nguyên liệu"],["异域","yìyù","nước ngoài, xứ lạ"],["合餐制","hécānzhì","chế độ ăn chung"],["胡床","húchuáng","ghế xếp (thời cổ)"],["认同","rèntóng","tán đồng"],["中华","Zhōnghuá","Trung Hoa"],["中原","Zhōngyuán","Trung Nguyên"]],T:[{zh:"任何一个民族的饮食都不仅仅为饮食，它蕴藏着这个民族的精神与特征，传达着这个民族的文化传统。中国的饮食文化历经数千年，始终具有魅力，是因为它不仅民族特性鲜明，而且善于吸收不同国家、不同区域、不同民族的优异之处，以至辉煌至今。",vn:"Ẩm thực của bất kỳ dân tộc nào cũng không chỉ đơn thuần là ăn uống; nó chứa đựng tinh thần và đặc trưng của dân tộc ấy, truyền đạt truyền thống văn hóa của dân tộc ấy. Văn hóa ẩm thực Trung Hoa trải qua mấy nghìn năm vẫn luôn hấp dẫn, là vì nó không chỉ mang đậm bản sắc dân tộc, mà còn giỏi hấp thu những điểm ưu tú của các quốc gia, khu vực, dân tộc khác nhau, đến nỗi rực rỡ cho tới tận ngày nay.",idea:"Luận điểm: ẩm thực TQ hấp dẫn vì bản sắc rõ + giỏi tiếp thu.",q:["中国的饮食文化为什么始终具有魅力？"],note:[["不仅仅为饮食","<span class='zh'>为</span> = <span class='zh'>是</span> (văn viết)."],["是因为……不仅……而且……，以至……","Câu giải thích nguyên nhân → kết quả. Xem <b>Bài tập 4①</b>."],["辉煌至今","<span class='zh'>至今</span> = đến nay."]]},{zh:"中国文化的核心是一个“和”字。“和”包含“中和”“和谐”之意。“中和”的意思就是折中、调和性质不同的事物。",vn:"Cốt lõi của văn hóa Trung Hoa là một chữ “和”. “和” bao hàm ý “trung hòa” và “hài hòa”. “Trung hòa” nghĩa là dung hòa, điều hòa những sự vật có tính chất khác nhau.",idea:"Cốt lõi: chữ “和”.",q:["中国文化的核心是什么？“中和”是什么意思？"],note:[["……之意","<span class='zh'>之</span> = <span class='zh'>的</span> (văn viết): <span class='zh'>和谐之意</span> = ý hài hòa."]]},{zh:"原本中华饮食中的大量食物来自辽阔的土地，高山上的飞禽走兽，湖泊、小溪中的一条鱼，丘陵上种植的一棵菜，经过精心构思，巧妙烹饪，即便仅为一餐素食，也可以让你尽享人间美味。汉唐以后，中亚及东南亚的食物进入了中华饮食体系，极大地丰富了中国食物的品种；近代，西方饮食思想与方式得到认可，具有现代特征的中华饮食形态逐渐形成。",vn:"Thuở ban đầu, phần lớn thực phẩm trong ẩm thực Trung Hoa đến từ vùng đất bao la: chim thú trên núi cao, con cá trong hồ, trong suối, cây rau trồng trên đồi — qua sự sắp đặt dày công, chế biến khéo léo, cho dù chỉ là một bữa chay cũng có thể khiến bạn tận hưởng hương vị nhân gian. Sau thời Hán – Đường, thực phẩm Trung Á và Đông Nam Á đi vào hệ thống ẩm thực Trung Hoa, làm phong phú rất nhiều chủng loại thực phẩm; thời cận đại, tư tưởng và phương thức ẩm thực phương Tây được chấp nhận, hình thái ẩm thực Trung Hoa mang đặc trưng hiện đại dần hình thành.",idea:"Lịch sử: bản địa → Hán Đường → cận đại.",q:["中华饮食经历了哪几个发展阶段？"],note:[["即便仅为一餐素食，也可以……","<span class='zh'>即便……也……</span>. Xem Ngữ pháp 2."],["原本……；汉唐以后……；近代……","Ba mốc thời gian — dàn ý cho Bài tập 5."]]},{zh:"在食材栽培方面，中华饮食坚持以本国物产为基本原料，同时合理引进、培育外来品种，比如咖啡、柠檬、芒果等，凡是历史不够悠久的外来食品，人们一般从食物名称上就能立即清晰地分辨出它的洋身份。至于中餐中使用频率最高的葱、姜、蒜等调料，因其进入中华饮食年代久远，许多中国人甚至把它当成了正宗的中国食材。在加工过程中，中国人照样可以用中国方式烹饪外来食材，使它美味诱人。而这一切得力于中国人能够充分认识异域食物的内在价值，以开放性的思维和灵感，创新式地把外来食物改变为中国饮食成分。",vn:"Về trồng trọt nguyên liệu, ẩm thực Trung Hoa kiên trì lấy sản vật trong nước làm nguyên liệu cơ bản, đồng thời hợp lý du nhập, ươm trồng giống ngoại như cà phê, chanh, xoài…; hễ là thực phẩm ngoại lai có lịch sử chưa lâu, người ta thường nhìn tên gọi là nhận ra ngay “thân phận ngoại”. Còn hành, gừng, tỏi — những gia vị được dùng nhiều nhất trong món Trung — vì đã vào ẩm thực Trung Hoa từ rất lâu, nhiều người Trung Quốc thậm chí coi chúng là nguyên liệu Trung Quốc chính gốc. Trong quá trình chế biến, người Trung Quốc vẫn có thể nấu nguyên liệu ngoại theo cách Trung Quốc, khiến chúng thơm ngon hấp dẫn. Tất cả điều này là nhờ người Trung Quốc nhận thức đầy đủ giá trị nội tại của thực phẩm xứ lạ, với tư duy cởi mở và cảm hứng, sáng tạo biến thực phẩm ngoại thành thành phần của ẩm thực Trung Hoa.",idea:"Nguyên liệu & chế biến: giữ gốc + tiếp thu + biến đổi sáng tạo.",q:["人们怎样分辨外来食品？","为什么许多中国人把葱、姜、蒜当成正宗的中国食材？"],note:[["坚持以……为……，同时……，比如……，凡是……","Xem <b>Bài tập 4②</b>."],["洋身份","<span class='zh'>洋</span> = ngoại quốc: <span class='zh'>洋葱 · 洋芋 · 西红柿 · 胡萝卜</span> — tên có <span class='zh'>洋 / 西 / 胡 / 番</span> thường là đồ ngoại."],["至于……，因其……，甚至……","<span class='zh'>至于</span> chuyển ý; <span class='zh'>其</span> = nó (văn viết)."],["照样 · 得力于","Xem Bài tập 2⑤⑥."]]},{zh:"在就餐方式上，中华饮食文化同样显示着不排斥异域文化的态度，比如中餐“合餐制”的形成。先秦至唐代，中国采用分餐式方式就餐。南北朝时期，一种可随意折起来、称作胡床的坐具和一种较大的餐桌开始在中原地区流行，这些器具的推广，打破了跪坐而食的局限，形成了围坐合餐的形式。当然，对“合餐制”的全面接受与文化认同，根本上与“和”文化是相通的。",vn:"Về cách dùng bữa, văn hóa ẩm thực Trung Hoa cũng thể hiện thái độ không bài xích văn hóa xứ lạ, ví dụ sự hình thành “chế độ ăn chung” của món Trung. Từ thời Tiên Tần đến đời Đường, người Trung Quốc ăn theo kiểu chia phần riêng. Thời Nam Bắc triều, một loại ghế có thể tùy ý gấp lại, gọi là “hồ sàng”, và một loại bàn ăn khá lớn bắt đầu thịnh hành ở vùng Trung Nguyên; việc phổ biến những dụng cụ này đã phá vỡ giới hạn quỳ ngồi mà ăn, hình thành kiểu ngồi quây quần ăn chung. Đương nhiên, việc tiếp nhận toàn diện và đồng thuận văn hóa với “chế độ ăn chung” về căn bản là tương thông với văn hóa “和”.",idea:"Cách ăn: từ ăn riêng → ăn chung.",q:["中国的“合餐制”是怎样形成的？"],note:[["胡床","<span class='zh'>胡</span> = các dân tộc phương Bắc / phương Tây thời cổ → ghế xếp là đồ <b>ngoại lai</b>."],["跪坐而食","<span class='zh'>而</span> nối cách thức với hành động (văn viết)."],["与……是相通的","= có điểm chung, thông với nhau."]]},{zh:"可以说，中华饮食文化自诞生之日起，就面向世界，边继承，边改革，不断引进新元素，这也是其充满活力的奥秘所在。",vn:"Có thể nói, văn hóa ẩm thực Trung Hoa từ ngày ra đời đã hướng ra thế giới, vừa kế thừa vừa cải cách, không ngừng du nhập yếu tố mới — đó cũng chính là bí quyết khiến nó tràn đầy sức sống.",idea:"Kết luận: hướng ra thế giới, vừa kế thừa vừa cải cách.",q:["中华饮食文化充满活力的奥秘是什么？"],note:[["自……之日起，就……","= ngay từ ngày… đã…"],["……的奥秘所在","<span class='zh'>所在</span> = chỗ, nơi (văn viết). Xem Ngữ pháp 3."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ vựng địa lý",G:[{id:"g1",grp:0,word:"以至",zh:"以至（于）",py:"yǐzhì (yú)",tag:"Chú thích 1 · liên từ",mean:"Liên từ, đứng <b>đầu vế sau</b>, biểu thị vì tình huống ở vế trước <b>ở mức độ rất sâu</b> nên dẫn đến kết quả nào đó — “đến nỗi, đến mức”. Cũng nói <span class='zh'>以至于</span>.",forms:["A（mức độ cao），以至（于）+ kết quả"],ex:[["中国的饮食文化……善于吸收不同国家、不同区域、不同民族的优异之处，以至辉煌至今。","",1],["那个电影她看了十来遍，以至许多台词都能背诵下来。","Bộ phim đó cô ấy xem cả chục lần, đến nỗi thuộc lòng được nhiều lời thoại."],["著名作家纪伯伦曾说：“我们已经走得太远，以至于忘了为什么出发。”","Nhà văn Gibran từng nói: “Chúng ta đã đi quá xa, đến nỗi quên mất vì sao mình khởi hành.”"]],tips:["Phân biệt <span class='zh'>以致</span> (bài 5): <span class='zh'>以致</span> thường dẫn <b>kết quả xấu</b>; <span class='zh'>以至</span> trung tính.","<span class='zh'>以至</span> còn nghĩa “cho đến”: <span class='zh'>一年、两年以至十年</span>."],practice:{q:"用“以至”完成句子",type:"complete",items:[["朋友告诉我，这所商学院在北美有相当的知名度，________。","朋友告诉我，这所商学院在北美有相当的知名度，以至每年都有成千上万的人申请。"],["科学技术的发展实在是太快了，________如今变为了现实。","科学技术的发展实在是太快了，以至很多过去只在科幻小说里出现的东西如今变为了现实。"],["走在路上，他脑子里一直在想别的事，________。","走在路上，他脑子里一直在想别的事，以至走过了家门都没发现。"]]}},{id:"g2",grp:0,word:"即便",zh:"即便……，也……",py:"jíbiàn … yě …",tag:"Chú thích 2 · liên từ",mean:"Liên từ, biểu thị <b>giả thiết kiêm nhượng bộ</b>, nghĩa là <span class='zh'>就是 / 即使</span> — “cho dù”. Vế sau thường có <span class='zh'>也 · 还是 · 都</span>.",forms:["即便 + giả thiết，(chủ ngữ) + 也 / 还是 + kết quả không đổi"],ex:[["她最近心情不好，即便有些不讲理，你也要原谅她。","Dạo này cô ấy tâm trạng không tốt, cho dù có hơi vô lý, cậu cũng nên tha thứ."],["我喜欢那个工作，即便薪水低，我还是要去。","Tôi thích công việc đó, dù lương thấp tôi vẫn muốn đi."],["……经过精心构思，巧妙烹饪，即便仅为一餐素食，也可以让你尽享人间美味。","",1]],tips:["<span class='zh'>即便</span> = <span class='zh'>即使</span>, sắc thái văn viết hơn; khẩu ngữ: <span class='zh'>就是 · 哪怕</span>.","Bài tập 2②."],practice:{q:"完成句子",type:"complete",items:[["即便我们拿了冠军，________。","即便我们拿了冠军，也不能骄傲。"],["大家________，即便说错了也没关系。","大家大胆地说出自己的想法，即便说错了也没关系。"],["即便________，你也应该严格要求自己。","即便没有人监督，你也应该严格要求自己。"]]}},{id:"g3",grp:1,word:"凡是",zh:"凡是 / 所有",py:"fánshì / suǒyǒu",tag:"Xem 辨析 bên dưới",mean:"Đều biểu thị <b>không có ngoại lệ</b>; vế sau thường có <span class='zh'>都 · 一律 · 没有不……</span>.",forms:["凡是 + N/cụm từ có tính chất đặc định，都……","所有（的）+ N"],ex:[["凡是历史不够悠久的外来食品，人们一般从食物名称上就能立即清晰地分辨出它的洋身份。","",1],["凡是见过她的人，没有不称赞她漂亮的。","Hễ ai từng gặp cô ấy, không ai không khen cô ấy đẹp."]],tips:["Bài tập 2③."]},{id:"g4",grp:1,word:"照样",zh:"照样",py:"zhàoyàng",tag:"Phó từ · Bài tập 2⑤",mean:"Phó từ: sự việc <b>vẫn như cũ</b>, không thay đổi dù điều kiện thay đổi — “vẫn (như thường)”. Hay đi sau vế nhượng bộ <span class='zh'>虽然 / 即便 / 没有……</span>.",forms:["(虽然 / 即便) A，(chủ ngữ) + 照样 + V"],ex:[["在加工过程中，中国人照样可以用中国方式烹饪外来食材，使它美味诱人。","",1],["虽然不是上下班高峰期，这里照样堵车。","Dù không phải giờ cao điểm, chỗ này vẫn tắc như thường."],["牛奶照样不能多喝。","Sữa cũng vậy, không thể uống nhiều. (SBT)"]],tips:["Còn là cụm động từ = làm theo mẫu: <span class='zh'>照着样子画</span>.","Gần nghĩa: <span class='zh'>仍然 · 依然 · 还是</span>; <span class='zh'>照样</span> khẩu ngữ hơn."]},{id:"g5",grp:1,word:"得力",zh:"得力于",py:"délì yú",tag:"Bài tập 2⑥",mean:"<span class='zh'>得力于 + N</span> = <b>nhờ vào</b>, được lợi từ… — giải thích nguyên nhân của một kết quả <b>tốt</b> (trang trọng hơn <span class='zh'>是因为</span>).",forms:["Kết quả tốt + 得力于 + nguyên nhân","这一切（都）得力于……"],ex:[["而这一切得力于中国人能够充分认识异域食物的内在价值。","",1],["他能取得这么好的成绩，得力于平时的勤学苦练。","Cậu ấy đạt thành tích tốt như vậy là nhờ ngày thường chăm học khổ luyện."]],tips:["Đồng nghĩa: <span class='zh'>归功于 · 多亏了</span>.","<span class='zh'>得力</span> làm tính từ = đắc lực: <span class='zh'>得力助手</span>."]},{id:"g6",grp:2,word:"",zh:"所在",py:"suǒzài",tag:"Chú thích 3 · danh từ (văn viết)",mean:"Danh từ, chỉ <b>nơi chốn, chỗ tồn tại</b>. Dùng trong văn viết. Rất hay gặp sau danh từ trừu tượng: <span class='zh'>问题所在 · 原因所在 · 希望所在 · 奥秘所在 · 力量所在</span> = chính là chỗ / nằm ở….",forms:["N + 所在（问题所在 · 希望所在）","……是 / 这就是 + N + 所在"],ex:[["他选择了风景秀美、气候宜人的所在，盖了房子，安下了家。","Ông chọn một nơi phong cảnh đẹp, khí hậu dễ chịu, cất nhà, an cư."],["培养人是教育的立足点，是教育价值的根本所在，是教育的本体功能。","Bồi dưỡng con người là điểm tựa của giáo dục, là chỗ căn bản của giá trị giáo dục."],["……不断引进新元素，这也是其充满活力的奥秘所在。","",1]],tips:["Bài tập 2④: <span class='zh'>青少年是一个国家的希望所在。</span>","SBT câu 1: <span class='zh'>这就是这款产品广受欢迎之所在吧。</span>"],practice:{q:"为“所在”选择适当的位置",type:"pos",items:[["大家的支持A是我们的力量B，我们一定会尽心尽力做好C工作，不辜负大家的期望D。","B","大家的支持是我们的力量所在，……"],["找不到问题A在哪儿，解决问题B就无从谈起，只有找到问题C，才谈得上解决问题D。","C","……只有找到问题所在，才谈得上解决问题。"],["给A孩子们B创造幸福美好的生活C，是父亲一生为之奋斗的动力D。","D","……是父亲一生为之奋斗的动力所在。"]]}}],BX:{grp:1,word:"凡是",cols:["凡是","所有"],pair:"凡是 — 所有",same:["Đều biểu thị <b>không có ngoại lệ</b>.","凡是 / 所有参加会议的人，都要自带笔记本电脑。"],diff:[["Nhấn mạnh <b>phạm vi đặc định</b>: không đứng trước danh từ chung chung, chỉ đứng trước danh từ / cụm từ có <b>tính chất cụ thể</b>.","凡是教师，都有国家认定的资格证书。（√）<br>凡是东西都放在这里。（×）","Đứng thẳng trước <b>danh từ chung</b> được.<div class='zh' style='margin-top:4px'>所有东西都放在这里。（√）</div>"],["Là <b>phó từ</b>, đứng trước <b>động từ</b> được.","小王酷爱美术，市里凡是有画展，再远他也要去参观学习。","Là <b>tính từ</b>, chỉ bổ nghĩa cho danh từ, <b>không</b> đứng trước động từ.<div class='zh' style='margin-top:4px'>所有问题都解决了。</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["凡是建筑工人，一律都要穿工作服上班。",0,"Phạm vi cụ thể (công nhân xây dựng) → đúng."],["凡是人才，都要让他们有发挥自己才能的机会。",0,"Đúng."],["所有从那个地区来的人，都要接受检查。",0,"<span class='zh'>所有</span> + cụm danh từ → đúng."],["所有收到这个标题的邮件，请不要打开，已经证实这是个病毒。",1,"Đứng trước động từ <span class='zh'>收到</span> → phải dùng <span class='zh'>凡是</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["就<u>餐</u>","合餐 · 分餐 · 餐桌 · 餐厅"],items:[["<u>优</u>异","优","优秀 · 优良 · 优美 · 优质"],["品<u>种</u>","种","物种 · 种类 · 种子 · 种族"],["形<u>态</u>","态","状态 · 气态 · 固态 · 态度"],["调<u>料</u>","料","颜料 · 材料 · 预料 · 料想"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ / cấu trúc trong ngoặc.",items:[["她的变化太大了，我跟她面对面都没认出来。→ ________","以至","她的变化太大了，以至我跟她面对面都没认出来。"],["就是我们的工作取得了很大的成绩，也不能骄傲。→ ________","即便……也……","即便我们的工作取得了很大的成绩，也不能骄傲。"],["所有见过她的人，没有不称赞她漂亮的。→ ________","凡是","凡是见过她的人，没有不称赞她漂亮的。"],["一个国家的希望都在青少年身上。→ ________","所在","青少年是一个国家的希望所在。"],["虽然不是上下班高峰期，这里还是堵车。→ ________","照样","虽然不是上下班高峰期，这里照样堵车。"],["他能取得这么好的成绩，是因为平时的勤学苦练。→ ________","得力于","他能取得这么好的成绩，得力于平时的勤学苦练。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["正宗","凡是","烹饪","就餐","创新"],text:"妈妈是个{烹饪}高手，能做出各种各样的美味佳肴。不管多么普通的食材，只要经过妈妈的手，都能变成人间美味，{凡是}吃过的人没有不称赞的。妈妈是山东人，不但能做出{正宗}的传统鲁菜，更能{创新}式地发明新的吃法，让我们全家人在{就餐}时，常常充满了惊喜。"},{bank:["区域","局限","品种","辽阔","鲜明"],text:"中国历史悠久，土地{辽阔}，不同{区域}，不同民族的饮食不但特色{鲜明}，而且{品种}丰富。比如：南方人爱吃米饭，北方人爱吃面食；山西人喜欢吃醋，四川人喜欢辣椒，等等，不过，随着各地人员流动的增加，这种{局限}逐渐被打破了。在全国各地的大小城市，你都能吃到来自各处的各种美食。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"中国的饮食文化历经数千年，始终具有魅力，<u>是因为</u>它<u>不仅</u>民族特性鲜明，<u>而且</u>善于吸收不同国家、不同区域、不同民族的优异之处，<u>以至</u>辉煌至今。",task:"他们两个人结婚三十多年，始终相亲相爱，是因为他们不仅____，而且____，以至____。",model:"他们两个人结婚三十多年，始终相亲相爱，是因为他们不仅兴趣爱好相同，而且懂得互相理解、互相包容，以至很多年轻人都把他们当作学习的榜样。"},{src:"在食材栽培方面，中华饮食<u>坚持</u>以本国物产为基本原料，<u>同时</u>合理引进、培育外来品种，<u>比如</u>咖啡、柠檬、芒果等，<u>凡是</u>历史不够悠久的外来食品，人们一般从食物名称上就能立即清晰地分辨出它的洋身份。",task:"在学习汉语方面，我坚持____，同时____，比如____，凡是____。",model:"在学习汉语方面，我坚持每天读一篇中文文章，同时利用各种机会和中国人聊天儿，比如参加语言交换活动、在网上和中国朋友视频，凡是遇到不认识的词语，我都会马上记下来。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["中国饮食文化为什么具有魅力？","不仅……，而且……，以至……","因为它不仅民族特性鲜明，而且善于吸收不同国家、不同区域、不同民族的优异之处，以至辉煌至今。"],["中国文化的核心是什么？","“和”","中国文化的核心是“和”，包含“中和”“和谐”之意，就是折中、调和性质不同的事物。"],["中华饮食的发展历程 · 食物","原本 / 汉唐以后 / 近代","原本食物来自辽阔的土地；汉唐以后，中亚及东南亚的食物进入中华饮食体系；近代，西方饮食思想与方式得到认可，现代中华饮食形态逐渐形成。"],["中华饮食的发展历程 · 食材","以……为基本原料 / 同时 / 凡是 / 至于……，因其……，甚至……","以本国物产为基本原料，同时引进、培育外来品种；凡是历史不久的外来食品，从名称上就能分辨出来；至于葱、姜、蒜，因其进入中国年代久远，许多人甚至把它们当成了正宗的中国食材。"],["中华饮食的发展历程 · 加工过程","……照样……，得力于……","中国人照样可以用中国方式烹饪外来食材，这得力于中国人能认识异域食物的内在价值，创新式地把它们变为中国饮食成分。"],["中华饮食的发展历程 · 就餐方式","先秦至唐代 / 南北朝时期","先秦至唐代采用分餐式；南北朝时期胡床和大餐桌流行，打破了跪坐而食的局限，形成了围坐合餐的形式。"],["总结","面向……，边……边……","中华饮食文化自诞生之日起就面向世界，边继承，边改革，不断引进新元素，这是其充满活力的奥秘所在。"]]},DP:[{title:"词汇：熟悉下列地理方面的词语 · 术语",vn:"Thuật ngữ địa lý.",items:[["边界","biānjiè","biên giới (đường ranh giới)","","两国边界已经划定。"],["地势","dìshì","địa thế","","这里地势很高，不怕洪水。"],["地质","dìzhì","địa chất","","他是一位地质学家。"],["经纬","jīngwěi","kinh tuyến và vĩ tuyến","","用经纬度可以确定位置。"]]},{title:"地貌",vn:"Địa mạo — các dạng địa hình.",items:[["盆地","péndì","bồn địa, lòng chảo","","四川盆地气候湿润。"],["沼泽","zhǎozé","đầm lầy","","沼泽里生活着很多鸟类。"],["海滨","hǎibīn","bờ biển","","夏天我们去海滨度假。"],["支流","zhīliú","sông nhánh, chi lưu","","这条河有很多支流。"],["坡","pō","dốc","","骑车下坡要小心。"]]},{title:"分区",vn:"Phân vùng.",items:[["温带","wēndài","ôn đới","","这里属于温带气候，四季分明。"],["省会","shěnghuì","tỉnh lỵ, thủ phủ tỉnh","","成都是四川的省会。"],["边疆","biānjiāng","biên cương","","他大学毕业后去边疆工作了。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"台湾一家食品公司根据消费者的不同需求和中秋节期间暑气未消的特点，创新推出了中秋雪月饼。何为雪月饼？雪月饼就是冰淇淋月饼，清凉降温，口感滑爽。此款月饼还精心采用具有保温作用的包装盒，保证雪月饼在一定时间内不融化。这就是这款产品广受欢迎之所在吧。",o:["台湾一家食品公司生产传统月饼","雪月饼是清凉降温的冰淇淋月饼","雪月饼是在下雪的时候吃的月饼","雪月饼是根据天气变凉的特点设计的"],a:1,why:"“雪月饼就是冰淇淋月饼，清凉降温”. D sai: thiết kế vì <span class='zh'>暑气未消</span> (vẫn còn nóng)."},{n:2,say:"中国古老的养生之道最注重季节气候变化，季节不同，饮食起居随之变化。立秋以后气温由热转凉，人体的消耗也逐渐减少，食欲开始增加。这时候就要科学地摄取营养和调整饮食，以补充夏季的消耗，并为越冬做准备。",o:["中国古老养生之道注重季节变化","季节不同，饮食起居可随意变化","立秋之后，人体的消耗逐渐加大","立秋之后，人们的食欲开始减少"],a:0,why:"“最注重季节气候变化”. C, D ngược: tiêu hao <b>giảm</b>, khẩu vị <b>tăng</b>."},{n:3,say:"2000多年前的农历五月初五，著名诗人屈原跳入汨罗江而死。老百姓立刻划龙船去寻找屈原，并将粮食、肉粒用竹叶包裹后给鱼虾投入江水中，以防止其吞食屈原。这个传统延续至今，也就有了今天的端午节赛龙舟和吃粽子的风俗习惯。",o:["屈原出生于农历五月初五","老百姓划龙船是去捉鱼虾","端午节要赛龙舟、吃粽子","屈原是被鱼虾吞食而死的"],a:2,why:"“端午节赛龙舟和吃粽子的风俗习惯”. A: mùng 5/5 là ngày <b>mất</b>."},{n:4,say:"这家胡同深处小饭馆的主人，是一位英文流利的有国际视野的老北京人。每逢周末，她就会办起烹饪课堂，教客人包饺子，做正宗的中国菜。她还兼营茶叶生意，所以这里的品茶课堂自然也不能少，让喝惯了红茶加柠檬的外国人，也尝尝中国辽阔的土地上栽培出的白茶的醇厚与绿茶的清香。",o:["小饭馆的主人是位英国人","饭馆主人每天都有烹饪课","这家饭馆的主人还卖茶叶","品茶课上主要喝柠檬红茶"],a:2,why:"“她还兼营茶叶生意”. A: người Bắc Kinh nói giỏi tiếng Anh; B: chỉ cuối tuần."},{n:5,say:"看似简单的就餐中蕴含着很多学问，进食时要专心致志，不要边吃边讲话，也不要边吃边看书报或电视，以免妨碍消化。同时要细嚼慢咽，千万不要狼吞虎咽。进食之后不能做剧烈运动，也不可立即躺下休息。可以缓步行走，也可以擦热双手后按摩肚子数百遍以助消化。",o:["进食时最好边吃边看书报或电视","进食时边吃边讲话不会妨碍消化","进食后不能剧烈运动，要立即卧床休息","进食后可以慢慢行走或按摩肚子助消化"],a:3,why:"“可以缓步行走，也可以……按摩肚子数百遍以助消化”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：要想身体保持活力，水是必不可少的，可是你会喝水吗？怎样饮水才健康？今天我们请来养生专家吴先生跟大家聊一聊喝水的奥秘。\n男：为了身体更健康，人们常常坚持一些所谓的好习惯，但这些习惯和做法反而给自己的健康埋下了隐患。看看这些习惯，你是不是也在坚持做呢？首先，请大家想一想，你认为每天应该喝几杯水呢？\n女：不是常常说每天要喝八杯水吗？\n男：事实是喝太多的水也会给身体带来麻烦。一个人喝水太多，容易使身体中的电解质失去平衡，一些水溶性维生素也更容易流失。\n女：那么正常成年人每天喝多少水才算适当呢？\n男：一般来说，我们每天需要补充2000ml左右的水分，但这不一定都通过喝水获得，应该把每天吃的食物中的水分算进去。因此，除掉每天食物中获得的1000～1200ml水分，我们每天再喝800～1000ml的水，平均上、下午各两杯就足够了。\n女：那感冒以后是不是应该多喝水啊？\n男：也不是，感冒后如果喝过多的水导致电解质失去平衡，反而会减慢感冒的康复速度。同时，感冒和发烧时也不宜大量进食。要想感冒好得快，最好少食多餐，或者用一杯温水冲泡维生素C，增强抵抗力。\n女：水不能喝太多，那牛奶是不是多多益善呢？\n男：牛奶照样不能多喝，我们常听说多喝牛奶可以补钙，真相却是多喝反而缺钙。正确的做法是一天1～2杯牛奶就可以满足全天所需的钙了。",qs:[{n:6,q:"人体每天需要补充多少水分？",o:["800ml左右","1000ml左右","1200ml左右","2000ml左右"],a:3,why:"“每天需要补充2000ml左右的水分” (gồm cả nước trong thức ăn)."},{n:7,q:"喝水太多会导致什么后果？",o:["电解质失去平衡","蛋白质大量流失","维生素大量流失","钙大量流失"],a:0,why:"“容易使身体中的电解质失去平衡”. C chỉ là “một số vitamin tan trong nước”."},{n:8,q:"感冒后怎么做是正确的？",o:["大量喝水","大量进食","少食多餐","多喝牛奶"],a:2,why:"“最好少食多餐”."},{n:9,q:"每天喝多少牛奶合适？",o:["上下午各两杯","每天1～2杯","每天800～1000ml","每天1000～1200ml"],a:1,why:"“一天1～2杯牛奶就可以满足全天所需的钙了”. A là lượng <b>nước</b>."},{n:10,q:"根据本文，下列哪种做法是正确的？",o:["每天喝两杯水","感冒时多喝水","每天多喝牛奶","感冒时补充维生素"],a:3,why:"“用一杯温水冲泡维生素C，增强抵抗力”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"随着生活水平的提高，中国肥胖儿童越来越多，这并不是因为中国孩子太能吃或玩儿太多电脑游戏，而是与孩子的爷爷奶奶有关。有研究报告显示，虽说爷爷奶奶不是导致中国肥胖现象的唯一原因，但他们绝对是非常特殊的“致胖因素”。\n在中国，几代人住在一起的现象很常见，孩子与爷爷奶奶共同生活十分普遍。很多中国爷爷奶奶认为孩子胖一点儿是健康的表现，只有大人才会因为肥胖得病。爷爷奶奶非常溺爱家中的孩子，凡是孩子喜欢的，就做给孩子吃，即便是垃圾食品也不在乎。他们不仅给孩子吃过多食物，还不让他们动手做家务。\n研究人员发现，一些爷爷奶奶并不认可“孩子应该健康饮食、适量运动”的理论。他们觉得瘦就意味着身体不健康，有这种观点可能是由于他们儿时有过饥饿的经历。",qs:[{n:11,q:"根据本文，为什么中国肥胖儿童越来越多？",o:["中国孩子太能吃了","他们玩儿太多电脑游戏","胖一点儿是健康的表现","爷爷奶奶导致孩子肥胖"],a:3,why:"“这并不是因为……，而是与孩子的爷爷奶奶有关”."},{n:12,q:"爷爷奶奶是怎样关照孩子的？",o:["让孩子随心所欲地吃","不让孩子饥一顿饱一顿","不限制孩子玩儿电脑游戏","让孩子多做家务活动手脚"],a:0,why:"“凡是孩子喜欢的，就做给孩子吃，即便是垃圾食品也不在乎”."},{n:13,q:"为什么爷爷奶奶不想让孩子瘦？",o:["他们觉得垃圾食品对人体无害","他们觉得瘦意味着身体不健康","他们觉得孩子胖一点儿更可爱","他们觉得孩子胖一点儿才聪明"],a:1,why:"“他们觉得瘦就意味着身体不健康”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"西方流行蔬菜生吃，不少人认为，蔬菜中的维生素C和一些生理活性物质在烹饪过程中很容易受到破坏，生吃蔬菜可以最大限度地获得营养。\n其实，蔬菜生吃熟吃各有利弊。虽然生吃蔬菜能使维生素C和一些保健成分一点儿不少地进入人体内，但也有缺点，即吃蔬菜的总量有局限。试想：一棵白菜切完有一脸盆那么多，不可能一次吃完，但炒熟以后，体积只有一盘，吃完它就不成问题了。可见烹调后某些降低了的营养含量，可以利用摄入量的优势来弥补。熟吃蔬菜还有一个重要的好处，有些蔬菜品种，比如胡萝卜，只有熟吃才有营养。因为胡萝卜素是一种脂溶性维生素，只有在加工时放点儿油，人体才能更好地吸收它。",qs:[{n:14,q:"生吃蔬菜有什么优点？",o:["可增加生理活性物质","生蔬菜味道更加鲜美","可最大限度地获得营养","可提高维生素C的含量"],a:2,why:"“生吃蔬菜可以最大限度地获得营养”."},{n:15,q:"生吃蔬菜有什么缺点？",o:["容易降低营养含量","吃蔬菜的总量有限","蔬菜很难清洗干净","维生素C不能吸收"],a:1,why:"“缺点，即吃蔬菜的总量有局限”. A là nhược điểm của ăn <b>chín</b>."},{n:16,q:"为什么熟吃胡萝卜比较好？",o:["生吃不好吃","生吃不容易消化","胡萝卜素是脂溶性的","熟吃胡萝卜摄入量大"],a:2,why:"“胡萝卜素是一种脂溶性维生素”."},{n:17,q:"这篇短文主要讲述了什么？",o:["蔬菜的烹饪方法","熟吃蔬菜的缺点","蔬菜的营养成分和含量","蔬菜生吃熟吃的利与弊"],a:3,why:"Câu chủ đề: “蔬菜生吃熟吃各有利弊”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["那些精微的艺术技巧，很难用话语传达给别人。","大家认为把外国的东西不必直接照搬到中国来。","这件艺术品既传统又现代，具有鲜明的民族特色。","对他来说，当年的辉煌也好，失败也罢，都已经成为历史了。"],a:1,why:"<b>Sai trật tự</b>: phó từ phủ định đứng trước <span class='zh'>把</span> → <span class='zh'>大家认为不必把外国的东西直接照搬到中国来</span>."},{n:19,o:["他离开心爱的岗位，心里怪难受。","你有过单腿跪下求婚的浪漫经历吗？","他没做太长时间的休息，立即构思了一个新电影。","“素质教育”是近年来我国教育界出现频率最高的一个词。"],a:0,why:"<b>Thiếu thành phần</b>: phó từ khẩu ngữ <span class='zh'>怪</span> (= khá, rất) đi theo khung cố định <span class='zh'>怪……的</span> → <span class='zh'>心里怪难受的</span>."},{n:20,o:["所谓规律，就是事物之间内在的必然联系。","近期离婚率急剧上升，以至于离婚还要排队。","那天，广场上人真多，我从来没看那么多的人。","科学知识的继承和发展，必须借助于教育来传递。"],a:2,why:"<b>Thiếu trợ từ</b>: kinh nghiệm “chưa từng” cần <span class='zh'>过</span> → <span class='zh'>我从来没看过那么多的人</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"不同国家的饮食有着明显的区域特征。法国菜的特点是选料广泛，加工___，滋味有浓有淡；意大利菜的特点是原汁原味，以味浓___；英国菜的特点是油少、___；俄罗斯菜口味较重，喜欢用油，制作方法较为简单，热食多，口味以酸、甜、辣、咸为主。",o:["仔细　著名　油腻","精细　著称　清淡","精彩　有名　辛辣","精心　闻名　浓厚"],a:1,why:"<span class='zh'>加工精细</span>; cố định <span class='zh'>以……著称</span>; <span class='zh'>油少、清淡</span> (cùng hướng)."},{n:22,text:"适量喝葡萄酒___可以让人享受到美妙的感觉，还有助于人体健康。葡萄酒的化学___非常丰富，是矿物质营养素和维生素的良好来源。它可以帮你消化鱼、禽、肉类等蛋白质，还能___皮肤和神经健康，___到美容的作用。它的营养价值可以说数不胜数。",o:["尽管　组成　坚持　生","不管　养分　维护　使","即便　构成　保护　做","不仅　成分　维持　起"],a:3,why:"<span class='zh'>不仅……还……</span>; <span class='zh'>化学成分</span>; <span class='zh'>维持健康</span>; <span class='zh'>起到……的作用</span>."},{n:23,text:"泰式饮食是我的至爱。泰式菜肴___了浓郁的异国情调，它不仅让人胃口大开，而且___人赏心悦目。泰国菜式样独特，色彩___，味道浓郁，品种多样，加上各种___的香味，让人回味无穷。",o:["布满　使　鲜明　材料","拥有　让　新鲜　资料","充满　令　鲜艳　调料","充足　叫　艳丽　原料"],a:2,why:"<span class='zh'>充满……情调</span>; <span class='zh'>令人赏心悦目</span>; <span class='zh'>色彩鲜艳</span>; <span class='zh'>调料的香味</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"茶的历史可以说已经非常悠久了。世界上最早发现和利用茶叶的是中国人的祖先，他们不但把茶叶发展为世界上饮用人口最多、保健作用最大的饮料，(24)。\n早在4700多年以前，中国人就发现了茶，只是那时茶被认为是具有解毒作用的药，(25)。开始人们直接含嚼茶叶以获取其中的有益成分，这是茶成为饮品的前奏。(26)，人们逐渐改变了生嚼茶叶的习惯，开始加水煮或烤饮。这样煮出来的茶汁虽然滋味苦涩，(27)。时间长了，人们就形成了煮煎品饮的习惯。\n茶叶的种类不同，种植地不同，泡法也不一样。要泡红茶、青茶，特别是紧压茶，非用滚沸的开水冲泡不可。(28)，特别是龙井等高级绿茶，必须把开水凉到70度左右再泡，而且不能加盖。否则，叶子会闷黄，其味也就香而不清了。",opts:["然而香气浓郁，风味持久，令人陶醉","后来又发现它还有其他一些药用价值","而且创造了丰富多彩的茶文化","然而要泡绿茶，就不能这样了","随着人类生活的进化"],ans:{24:2,25:1,26:4,27:0,28:3}},read4:[{ins:"第29–32题：请选出正确答案。",text:"我们每天需要的主要食物共分五类：谷类、蔬菜和水果、鱼肉蛋、奶类和豆类、油脂类。为了获得健康又营养的膳食，这几类食物每日的摄取量要有所区分，以便提供人体的正常需要。按照每日摄取量从多到少的顺序，依次为谷类、蔬菜和水果、鱼肉蛋、奶类和豆类、油脂类。\n谷类主要提供碳水化合物、蛋白质等供能物质，是膳食的基础。多种谷类调和起来吃比单吃好。蔬菜水果中富含维生素和膳食纤维等，每天应当大量摄取。但蔬菜和水果终究是两类食物，各有优势，不能完全相互替代。尤其是儿童，不可只吃水果不吃蔬菜。鱼肉蛋主要提供动物性蛋白质和重要的矿物质和维生素，在吃的时候要分别对待。鱼、虾等水产品含脂肪低，可以多吃一些；畜禽类中脂肪含量较高，不应多吃；蛋类最好每天不超过一个。奶类主要包括鲜牛奶和奶粉，有人饮奶后有不同程度的肠胃不适，可试用酸奶或其他奶制品。豆类每天50克。油脂类在每日膳食中占的比重最小，大约25克。",qs:[{n:29,q:"我们每天的食物按照摄取量从少到多应该是？",o:["油脂类、奶类和豆类、蔬菜和水果、鱼肉蛋、谷类","谷类、蔬菜和水果、鱼肉蛋、奶类和豆类、油脂类","油脂类、奶类和豆类、鱼肉蛋、蔬菜和水果、谷类","谷类、奶类和豆类、鱼肉蛋、蔬菜和水果、油脂类"],a:2,why:"Bài cho thứ tự <b>từ nhiều đến ít</b> → đảo ngược lại. Bẫy B: đúng thứ tự trong bài nhưng sai chiều."},{n:30,q:"下列哪种饮食方式是正确的？",o:["谷类单一吃比调和起来吃好","畜禽类食物不应吃太多","可以只吃水果不吃蔬菜","鱼肉蛋每天要大量摄取"],a:1,why:"“畜禽类中脂肪含量较高，不应多吃”."},{n:31,q:"根据本文，下面哪句话是正确的？",o:["蔬菜水果是膳食的基础","蔬菜和水果可以互相代替","鱼、虾等水产品可以多吃一些","鸡蛋最好每天吃两个"],a:2,why:"“鱼、虾等水产品含脂肪低，可以多吃一些”. A: cơ sở là <b>谷类</b>."},{n:32,q:"如果喝牛奶后有肠胃不适，怎么办？",o:["可以喝酸奶","可以吃豆制品","可以吃鸡蛋","可以吃水果"],a:0,why:"“可试用酸奶或其他奶制品”."}]},{ins:"第33–36题：请选出正确答案。",text:"英国科学家最近公布的一项研究结果显示，那些不经常吃水果蔬菜的家长无意中为孩子树立了一个不好的榜样。研究人员表示，虽然孩子对食物的一些天生喜好很难改变，但是大人的饮食习惯对孩子形成自己的饮食习惯有很大的影响。在长期的共同生活中，大人吃什么实际上就预示着孩子今后吃什么。\n根据世界卫生组织的推荐，人们应多吃蔬菜水果，以保持健康，避免肥胖症、心脏病等各种疾病。但他们对英国北部22个幼儿园2～6岁儿童家长的饮食习惯的调查结果显示，有三分之一的家长蔬菜和水果吃得都很少。\n由于家长与自己的孩子基本上是朝夕相处，所以大人对孩子饮食习惯的形成影响最大。餐桌上所摆的食物种类以及所出现的次数都会给孩子留下深刻的印象。如果家长不喜欢素食，餐桌上经常摆着肉类食品，那么孩子就会将肉类食品当作饭食构成的主要标志。如果餐桌上不出现肉类食品，孩子自然会感到，这似乎不是一顿饭。因此，大人饮食习惯的好坏决定了孩子饮食习惯的好坏。\n虽然孩子不会自动喜欢上大人所吃的食物，但是家中大人经常提倡吃什么以及吃的次数却会影响孩子逐渐接受这些食品的程度。因此，大人不要只顾自己喜欢吃什么，而应尽量分辨出饮食习惯的好坏，更多地考虑自己的饮食习惯是否会给孩子今后的饮食习惯带来不良影响。",qs:[{n:33,q:"根据本文，英国科学家的研究结果是：",o:["经常吃肉容易引起肥胖症和心脏病","英国有三分之一的家长蔬菜水果吃得很少","多吃水果蔬菜可以保持健康、避免各种疾病","不常吃蔬菜水果的家长会导致孩子形成不良饮食习惯"],a:3,why:"Câu mở đầu: “不经常吃水果蔬菜的家长无意中为孩子树立了一个不好的榜样”. B chỉ là khảo sát ở <b>miền Bắc</b> nước Anh; C là khuyến nghị của WHO."},{n:34,q:"根据调查结果，父母喜欢吃肉，孩子一般：",o:["长大后也喜欢吃肉","长大后不容易得病","天生也很喜欢吃肉","体重比别的孩子重"],a:0,why:"“孩子就会将肉类食品当作饭食构成的主要标志”. C sai: không phải <span class='zh'>天生</span>."},{n:35,q:"这篇文章的主要内容是什么？",o:["家长的不良饮食习惯对孩子的影响","研究证明多吃蔬菜水果确实有好处","英国北部家庭饮食习惯的调查结果","在喜欢吃肉家庭中孩子的饮食习惯"],a:0,why:"Toàn bài nói ảnh hưởng của thói quen ăn uống của cha mẹ tới con."},{n:36,q:"根据文章内容，下面说法正确的是：",o:["孩子不会喜欢上大人喜欢吃的东西","家长自己吃什么不重要，但要让孩子吃蔬菜","为了不影响孩子，父母不要每天和孩子在一起","父母常吃什么，孩子也会逐渐养成同样的习惯"],a:3,why:"“大人吃什么实际上就预示着孩子今后吃什么”. A: chỉ là “不会<b>自动</b>喜欢上”."}]}]},W:{task:"这篇课文介绍了富有魅力的中国饮食文化，分别从饮食文化的历史发展、食材栽培和选择、就餐方式等几个方面进行了介绍，请参考练习5，把课文缩写成300字左右的短文。",target:300,steps:[["Giữ luận điểm","1–2 câu: ẩm thực TQ hấp dẫn vì <span class='zh'>不仅……而且……，以至……</span>; cốt lõi là “和”."],["Lịch sử (đoạn 3)","Ba mốc <span class='zh'>原本 · 汉唐以后 · 近代</span> — mỗi mốc một vế câu."],["Nguyên liệu & chế biến (đoạn 4)","Giữ khung <span class='zh'>以……为基本原料，同时…… · 照样…… · 得力于……</span>; bỏ ví dụ chi tiết."],["Cách ăn (đoạn 5)","Từ <span class='zh'>分餐</span> → <span class='zh'>合餐</span>; nêu lý do (胡床, bàn lớn)."],["Kết","Giữ gần như nguyên câu kết: <span class='zh'>面向世界，边继承，边改革……奥秘所在</span>."]],outline:[["一 · 总述","饮食蕴藏民族精神；魅力来源；核心是“和”"],["二 · 发展历程","原本 / 汉唐以后 / 近代"],["三 · 食材与加工","本国物产 + 外来品种；照样用中国方式烹饪"],["四 · 就餐方式","分餐 → 合餐制"],["五 · 总结","面向世界，边继承，边改革"]],model:"中国饮食文化的魅力\n任何民族的饮食都蕴藏着这个民族的精神，传达着它的文化传统。中国饮食文化历经数千年始终具有魅力，是因为它不仅民族特性鲜明，而且善于吸收其他国家、区域和民族的优异之处，以至辉煌至今。中国文化的核心是“和”，就是调和性质不同的事物。\n原本，中华饮食的食物来自辽阔的土地；汉唐以后，中亚及东南亚的食物进入中华饮食体系，丰富了食物的品种；近代，西方饮食思想与方式得到认可，现代中华饮食形态逐渐形成。\n在食材方面，中国坚持以本国物产为基本原料，同时引进、培育外来品种。像葱、姜、蒜等调料，因为进入中国很久，许多人甚至把它们当成了正宗的中国食材。中国人还照样用中国方式烹饪外来食材，这得力于他们能认识异域食物的内在价值，并创新式地加以改变。\n在就餐方式上，中国古代采用分餐制，南北朝时胡床和大餐桌开始流行，于是形成了围坐合餐的形式，这与“和”文化是相通的。\n可以说，中华饮食文化面向世界，边继承，边改革，这正是其充满活力的奥秘所在。",check:["Có tiêu đề","Giữ luận điểm và chữ “和”","Đủ 3 khía cạnh: lịch sử · nguyên liệu/chế biến · cách ăn","Có câu kết “边继承，边改革”","Dùng ít nhất 4: 以至 · 即便 · 凡是 · 照样 · 得力于 · 所在","Khoảng 300 chữ (±30)","Không thêm ý kiến cá nhân"]},SUM:{words:["视野","蕴藏","传达","鲜明","区域","优异","辉煌","和谐","调和","辽阔","精心","构思","烹饪","品种","认可","形态","培育","清晰","分辨","频率","正宗","加工","灵感","创新","排斥","局限","诞生","继承","元素","活力","奥秘"],patterns:[["……，以至（于）……","……善于吸收不同国家……的优异之处，以至辉煌至今。"],["即便……，也……","即便仅为一餐素食，也可以让你尽享人间美味。"],["凡是……，都……","凡是历史不够悠久的外来食品，人们一般从食物名称上就能立即清晰地分辨出它的洋身份。"],["……照样……","中国人照样可以用中国方式烹饪外来食材。"],["……得力于……","这一切得力于中国人能够充分认识异域食物的内在价值。"],["……的 N 所在","这也是其充满活力的奥秘所在。"]],diff:["凡是：phó từ, + phạm vi có tính chất cụ thể, đứng trước động từ được — 所有：tính từ, + danh từ chung, không đứng trước động từ","以至 (kết quả, trung tính) ≠ 以致 (kết quả xấu) · 灵感 = cảm hứng ≠ “linh cảm” · 调和 tiáo · 种植 zhòng / 品种 zhǒng · 湖泊 pō · 频率 lǜ"],sentences:["任何一个民族的饮食都不仅仅为饮食，它蕴藏着这个民族的精神与特征，传达着这个民族的文化传统。","中国文化的核心是一个“和”字。","中华饮食文化自诞生之日起，就面向世界，边继承，边改革，不断引进新元素。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 10.","Đọc trước bài 11 《我不在时，猫在干什么？》."]}});
