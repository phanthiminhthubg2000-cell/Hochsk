<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 14 · 背着电饭锅拍北极 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-14",num:14,book:"HSK 标准教程 6（上）",unit:{n:4,zh:"走遍天下",vn:"Đi khắp thế giới"},title:"背着电饭锅拍北极",vn:"Vác nồi cơm điện đi chụp ảnh Bắc Cực",chars:844,source:"改编自《北京晚报》文章《背着电饭锅拍遍北极》，作者：邱伟",goals:["Đọc hiểu bài 844 chữ — một tổng biên tập 50 tuổi bỏ việc ở đỉnh cao sự nghiệp, cùng vợ 17 lần sang Bắc Cực chụp ảnh người Inuit.","Dùng được 50 từ mới, nhất là nhóm <b>quyết định – cảm xúc</b>: <span class='zh'>毅然 · 疲惫 · 力所能及 · 鼓动 · 惊奇 · 冲动 · 在意 · 执着</span> và nhóm <b>chi tiêu</b>: <span class='zh'>支出 · 精打细算 · 开支 · 储蓄 · 将就</span>.","Nắm <b>lặp lượng từ</b> (一拨拨 · 一本本), <span class='zh'>难以 · 免得</span>.","Phân biệt <span class='zh'>鼓动 — 鼓励</span>; mở rộng <b>16 cặp từ trái nghĩa</b>.","Viết tóm tắt (缩写) bài khóa khoảng 400 chữ."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (lặp lượng từ · 鼓动—鼓励) · Bài khóa đoạn 1–3"],["Buổi 2","Nhóm 2–3 (难以 · 免得) · Đoạn 4–8 · Bài tập · Từ trái nghĩa · Luyện đề · Viết 缩写"]],outline:[{tag:"一",name:"Đỉnh cao & rời đi",paras:"Đoạn 1–2",zh:"社长 → 毅然离开 → 一身轻松",vn:"Thành công ở đỉnh cao, ông kiên quyết rời báo, như được cởi trói."},{tag:"二",name:"Đến Bắc Cực",paras:"Đoạn 3–4",zh:"妻子鼓动；因纽特人的传奇",vn:"Vợ khích lệ; truyền thuyết người Inuit là động lực."},{tag:"三",name:"Bắc Cực thật",paras:"Đoạn 5–6",zh:"现实与记载差别竟如此之大；专注人文",vn:"Bắc Cực hiện đại khác xa sách vở → ông chỉ tập trung chụp con người."},{tag:"四",name:"Tiết kiệm & hạnh phúc",paras:"Đoạn 7–8",zh:"精打细算；煮面条；为历史留下印迹",vn:"17 chuyến, chi tiêu chắt bóp, nấu mì bằng nồi cơm điện — vất vả mà hạnh phúc."}],warm1:{q:"你去过北极吗？你印象中北极人的生活是什么样的？请看图片了解一下。",vn:"Bạn đã đến Bắc Cực chưa? Trong ấn tượng của bạn, người Bắc Cực sống thế nào?",items:[["🗺️","白令海峡 Báilìng Hǎixiá · 北极圈 běijíquān","Eo biển Bering · Vòng Bắc Cực"],["🐻‍❄️","北极熊 běijíxióng · 雪屋 xuěwū","Gấu Bắc Cực · Nhà tuyết (igloo)"],["🧑‍🦱","因纽特人 Yīnniǔtèrén · 打猎 dǎliè","Người Inuit · Săn bắn"]],talk:["你觉得现在的因纽特人还住雪屋、打猎吗？","如果你50岁事业成功，你会放下一切去做自己喜欢的事吗？"],link:"Nhân vật trong bài cũng nghĩ người Inuit sống trong nhà tuyết — đến nơi mới <b>kinh ngạc</b> vì sự khác biệt."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"论",rule:"论 = <b>bàn luận; lý luận</b>.",w:[["评论","pínglùn","bình luận (từ mới)"],["言论","yánlùn","ngôn luận"],["谈论","tánlùn","bàn tán"],["议论","yìlùn","nghị luận, bàn ra tán vào"],["讨论","tǎolùn","thảo luận"],["辩论","biànlùn","tranh luận"],["结论","jiélùn","kết luận"],["理论","lǐlùn","lý luận"],["争论","zhēnglùn","tranh cãi"],["论述","lùnshù","luận thuật"],["论文","lùnwén","luận văn"]]},{k:"访",rule:"访 = <b>thăm; hỏi</b>.",w:[["访问","fǎngwèn","phỏng vấn; thăm (từ mới)"],["访友","fǎngyǒu","thăm bạn"],["拜访","bàifǎng","đến thăm"],["出访","chūfǎng","đi thăm nước ngoài"],["回访","huífǎng","thăm đáp lễ"],["来访","láifǎng","đến thăm"],["探访","tànfǎng","thăm dò"],["走访","zǒufǎng","đi thăm hỏi"],["家访","jiāfǎng","thăm nhà (học sinh)"]]},{k:"差 (chā)",rule:"差 đọc <b>chā</b> = <b>chênh lệch, khác biệt</b>.",w:[["差别","chābié","khác biệt (từ mới)"],["差距","chājù","khoảng cách"],["差异","chāyì","sai khác"],["差价","chājià","chênh lệch giá"],["反差","fǎnchā","tương phản"],["色差","sèchā","lệch màu"],["温差","wēnchā","chênh lệch nhiệt độ"],["时差","shíchā","chênh lệch múi giờ"]]},{k:"惊",rule:"惊 = <b>kinh ngạc; sợ hãi</b>.",w:[["惊奇","jīngqí","kinh ngạc (từ mới)"],["惊动","jīngdòng","làm kinh động"],["惊喜","jīngxǐ","bất ngờ vui mừng"],["惊慌","jīnghuāng","hoảng hốt"],["惊吓","jīngxià","sợ hãi"],["惊叫","jīngjiào","la thất thanh"],["惊人","jīngrén","kinh người"],["惊险","jīngxiǎn","mạo hiểm, gay cấn"],["惊心","jīngxīn","giật mình"],["吃惊","chījīng","giật mình"],["震惊","zhènjīng","chấn động"],["受惊","shòujīng","bị hoảng sợ"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–3",sub:"Rời đỉnh cao sự nghiệp",from:1,to:17},{name:"Nhóm 2 · Đoạn 4–6",sub:"Bắc Cực trong sách & ngoài đời",from:18,to:39},{name:"Nhóm 3 · Đoạn 7–8",sub:"Hành trình tằn tiện",from:40,to:50}],V:[[1,"北极","běijí","dt.","Bắc Cực","Bắc Cực",1,"","地轴的北端，北半球的顶点；北冰洋地区。","背着电饭锅拍北极","北极非常寒冷。","Bắc Cực vô cùng lạnh giá.",["北极熊","北极圈"],"Bài tập 1: <span class='zh'>南极 · 极端 · 极限 · 极其</span>."],[2,"评论","pínglùn","đgt.","bình luận","bình luận",1,"","批评或议论。","新闻评论员","网上对这部电影的评论很多。","Trên mạng có rất nhiều bình luận về phim này.",["发表评论","评论员"],"SBT câu 33."],[3,"典型","diǎnxíng","dt.","điển hình","điển hình",1,"","具有代表性的人物或事件。","成为中国报业改革的典型","他是一个典型的北京人。","Anh ấy là một người Bắc Kinh điển hình.",["树立典型","典型例子"],"Còn là tính từ: <span class='zh'>很典型</span>."],[4,"考察","kǎochá","đgt.","khảo sát","khảo sát",1,"","实地观察调查。","前来考察访问","代表团到工厂考察。","Đoàn đại biểu đến nhà máy khảo sát.",["实地考察","考察团"],"SBT câu 33–36."],[5,"访问","fǎngwèn","đgt.","phỏng vấn","thăm; phỏng vấn",1,"","有目的地去探望人并跟他谈话。","前来考察访问","总统对中国进行了国事访问。","Tổng thống có chuyến thăm cấp nhà nước tới Trung Quốc.",["正式访问","访问学者"],"⚠️ Khác “phỏng vấn” tiếng Việt (采访/面试): <span class='zh'>访问</span> chủ yếu = <b>chuyến thăm</b>."],[6,"高峰","gāofēng","dt.","cao phong","đỉnh cao",1,"","高的山峰；比喻事物发展的最高点。","事业达到高峰的时候","上下班高峰时间很堵车。","Giờ cao điểm rất tắc đường.",["高峰期","事业高峰"],"<span class='zh'>高峰期</span> = giờ / mùa cao điểm."],[7,"毅然","yìrán","phó.","nghị nhiên","kiên quyết, dứt khoát",1,"书","坚决地，毫不犹豫地。","他毅然决定离开报社","他毅然放弃了高薪工作。","Anh ấy dứt khoát từ bỏ công việc lương cao.",["毅然决定","毅然离开"],"Bài tập 2①, 3①."],[8,"疲惫","píbèi","tt.","bì bại","mệt mỏi rã rời",1,"书","非常疲乏。","身心疲惫","工作了一天，他感到十分疲惫。","Làm việc cả ngày, anh ấy thấy rã rời.",["身心疲惫","疲惫不堪"],"Bài tập 3①."],[9,"力所能及","lìsuǒnéngjí","thành ngữ","lực sở năng cập","trong khả năng",1,"成","自己的能力所能做到的。","力所能及地开拓新的生活","孩子应该做一些力所能及的家务。","Trẻ nên làm việc nhà trong khả năng.",["力所能及的事"],"Bài tập 2⑥."],[10,"开拓","kāituò","đgt.","khai thác","mở mang, khai phá",1,"","开辟；扩展。","开拓新的生活","公司正在开拓国外市场。","Công ty đang mở rộng thị trường nước ngoài.",["开拓市场","开拓视野"],"Bài tập 1: <span class='zh'>开始 · 开关 · 开端 · 开心</span>."],[11,"职务","zhíwù","dt.","chức vụ","chức vụ",1,"","职位规定应该担任的工作。","没有了职务","他被免去了经理职务。","Ông ấy bị miễn nhiệm chức giám đốc.",["担任职务"],""],[12,"捆绑","kǔnbǎng","đgt.","khổn bảng","trói buộc",1,"","用绳子等捆起来；比喻束缚。","从捆绑状态中被释放出来","不要被别人的看法捆绑住。","Đừng để Khẩu ngữ: <span class='zh'>拉肚子</span>."],[47,"时常","shícháng","phó.","thời thường","thường xuyên",1,"","常常；经常。","时常煮一锅面条","他时常给父母打电话。","Anh ấy thường gọi điện cho bố mẹ.",[],"Bài tập 2④."],[48,"将就","jiāngjiu","đgt.","tương tựu","tạm bợ, chịu tạm",1,"口","勉强适应不很满意的事物或环境。","将就将就就是一餐","房间小了点儿，你将就着住吧。","Phòng hơi nhỏ, bạn ở tạm vậy nhé.",["将就着……","将就将就"],"Bài tập 2⑤. SBT câu 18."],[49,"支配","zhīpèi","đgt.","chi phối","sắp xếp; chi phối",1,"","安排；对人或事物起引导和控制作用。","他愿意自己支配自己的生命","我想自由支配自己的时间。","Tôi muốn tự do sắp xếp thời gian của mình.",["支配时间","受……支配"],"Bài tập 3①."],[50,"执着","zhízhuó","tt.","chấp trước","kiên trì, bền bỉ",1,"","坚持不懈；对某种事物追求不舍。","执着地要为历史留下些印迹","他对音乐的执着让人感动。","Sự bền bỉ của anh với âm nhạc khiến người ta cảm động.",["执着追求"],"Nghĩa tích cực (≠ “cố chấp” tiêu cực của tiếng Việt)."]],extra:[["摄影记者","shèyǐng jìzhě","phóng viên ảnh"],["编辑","biānjí","biên tập viên"],["社长","shèzhǎng","tổng biên tập, giám đốc tòa soạn"],["一拨拨","yì bōbō","từng tốp"],["同行","tóngháng","người cùng nghề"],["跨洋过海","kuàyáng guòhǎi","vượt biển"],["传奇","chuánqí","truyền kỳ"],["围堵","wéidǔ","vây chặn"],["原住民","yuánzhùmín","người bản địa"],["人文","rénwén","nhân văn"],["血统","xuètǒng","huyết thống"],["印迹","yìnjì","dấu vết"]],T:[{zh:"王建男大学毕业做过摄影记者、新闻评论员、编辑，50岁做了社长。追求完美的性格，使他领导的报社成为中国报业改革的典型，每天都会有一拨拨同行前来考察访问。就在王建男事业达到高峰的时候，他毅然决定离开报社：他累了，身心疲惫，他想做自己愿意做的事，力所能及地开拓新的生活。",vn:"Vương Kiến Nam tốt nghiệp đại học từng làm phóng viên ảnh, bình luận viên tin tức, biên tập viên, 50 tuổi làm tổng biên tập. Tính cách cầu toàn khiến tờ báo ông lãnh đạo trở thành điển hình cải cách báo chí Trung Quốc, ngày nào cũng có từng tốp đồng nghiệp đến khảo sát, thăm hỏi. Đúng lúc sự nghiệp lên đỉnh cao, ông dứt khoát rời tòa soạn: ông mệt rồi, thân tâm rã rời, muốn làm việc mình muốn làm, trong khả năng của mình mở ra cuộc sống mới.",idea:"Rời đi ở đỉnh cao sự nghiệp.",q:["王建男为什么在事业高峰时离开报社？"],note:[["一拨拨同行","Lặp lượng từ <span class='zh'>一拨拨</span> — xem Ngữ pháp 1."],["就在……的时候，他毅然……","Nhấn mạnh thời điểm đối lập."],["力所能及地开拓……","Thành ngữ làm trạng ngữ + 地."]]},{zh:"没有了职务，王建男像是从捆绑状态中被释放出来，一身轻松。他先是办了家企业；不久他跨洋过海，到了加拿大；再后来，他恋上了北极。",vn:"Không còn chức vụ, Vương Kiến Nam như được giải thoát khỏi trói buộc, nhẹ nhõm cả người. Đầu tiên ông mở một doanh nghiệp; chẳng bao lâu vượt biển sang Canada; về sau nữa, ông phải lòng Bắc Cực.",idea:"Sau khi nghỉ: doanh nghiệp → Canada → Bắc Cực.",q:["辞职后，王建男有什么经历？"],note:[["先是……；不久……；再后来，……","Trình tự thời gian. Xem <b>Bài tập 4①</b>."],["恋上了北极","<span class='zh'>恋上</span> = phải lòng — nhân hóa."]]},{zh:"以前他一直认为去北极不是普通人的事，记者出身的妻子鼓动他说，年轻人自驾都能去，咱们怎么不行？于是，他们出发了。",vn:"Trước kia ông luôn cho rằng đi Bắc Cực không phải việc của người thường; người vợ xuất thân phóng viên khích lệ ông: thanh niên tự lái xe còn đi được, sao chúng mình lại không? Thế là họ lên đường.",idea:"Vợ khích lệ, hai người lên đường.",q:["是谁鼓动王建男去北极的？"],note:[["记者出身的妻子","<span class='zh'>N + 出身</span> làm định ngữ."],["鼓动","Xem 辨析 鼓动—鼓励."]]},{zh:"因纽特人的传奇，是鼓舞他们夫妇勇闯北极的最大动力。一路上，王建男头脑中全是书本中对北极的描述：大约4000年前，最后一批跨过白令海峡的亚裔族群，向美洲进发，途中遭遇印第安人的围堵，最终退进气候恶劣的北极圈，住雪屋、用长矛打猎，他们遇到过想象中难以度过的灾难，最后在饥饿、风暴、严寒中奇迹般地生存下来，成为北极最大的原住民部族……",vn:"Truyền kỳ về người Inuit là động lực lớn nhất cổ vũ vợ chồng ông dấn thân tới Bắc Cực. Suốt dọc đường, đầu óc Vương Kiến Nam toàn là những miêu tả về Bắc Cực trong sách: khoảng 4000 năm trước, tộc người gốc Á cuối cùng vượt eo biển Bering tiến về châu Mỹ, giữa đường gặp người da đỏ vây chặn, cuối cùng lui vào vòng Bắc Cực khí hậu khắc nghiệt, ở nhà tuyết, săn bằng giáo dài; họ từng gặp những tai họa tưởng như không thể vượt qua, cuối cùng sống sót một cách kỳ diệu trong đói khát, bão tố, giá rét, trở thành tộc người bản địa lớn nhất Bắc Cực…",idea:"Bắc Cực trong sách vở.",q:["书中一般是怎样描述北极的？"],note:[["难以度过的灾难","<span class='zh'>难以</span> + động từ song tiết — xem Ngữ pháp 2."],["奇迹般地生存下来","<span class='zh'>N + 般地</span> = như là…"]]},{zh:"到了北极，他们惊奇地发现，现实和文字记载中因纽特人的生活差别竟是如此之大：因纽特村落家家屋内温暖如春，家电齐全，户户都能上网；连锁超市里卖的是包装食品，年轻人穿着时髦的衣裳，潇洒而快活。记者的职业本能让王建男产生了这样的冲动：用我的照片让世人知道，北极的过去和现在相差多么遥远。老照片已成为了古董，那时的北极已经不复存在。",vn:"Đến Bắc Cực, họ kinh ngạc phát hiện cuộc sống người Inuit ngoài đời thực và trong sách vở khác nhau đến thế: trong làng, nhà nào cũng ấm như mùa xuân, đồ điện đầy đủ, hộ nào cũng lên mạng được; siêu thị chuỗi bán đồ ăn đóng gói, thanh niên mặc quần áo thời thượng, phóng khoáng vui vẻ. Bản năng nghề báo khiến Vương Kiến Nam nảy ra thôi thúc: dùng ảnh của mình cho thế giới biết quá khứ và hiện tại của Bắc Cực cách xa nhau đến nhường nào. Ảnh cũ đã thành đồ cổ, Bắc Cực ngày ấy không còn nữa.",idea:"Bắc Cực thật: hiện đại, khác xa sách vở.",q:["现实的北极是什么样的？","王建男产生了什么冲动？"],note:[["竟是如此之大","<span class='zh'>竟</span> = không ngờ; <span class='zh'>如此之大</span> (văn viết)."],["家家…… · 户户……","Lặp danh từ = mọi nhà."],["不复存在","= không còn tồn tại nữa (văn viết)."]]},{zh:"从此，王建男不再在意自然风光和千奇百怪的动植物，只专注于人文。他的镜头中有捕捉动物的妇人，有赤道血统的北极姑娘……他的采访专题是“北极人文圈”，他知道抢救因纽特人生活中正在消失的东西刻不容缓。",vn:"Từ đó, Vương Kiến Nam không còn bận tâm phong cảnh thiên nhiên và động thực vật muôn hình vạn trạng, chỉ chuyên tâm vào con người. Trong ống kính ông có người phụ nữ bắt thú, có cô gái Bắc Cực mang dòng máu xích đạo… Chuyên đề của ông là “Vòng nhân văn Bắc Cực”; ông biết việc cứu vãn những gì đang biến mất trong đời sống người Inuit là không thể chậm trễ.",idea:"Chuyển sang chụp con người.",q:["现在，王建男专注于什么事情？"],note:[["不再在意……，只专注于……","Đối lập: bỏ cái này, tập trung cái kia."],["抢救……刻不容缓","Chủ ngữ là cụm động từ."]]},{zh:"他和妻子往返北极17次，支出很大，他们处处精打细算，千方百计节省开支，免得多年的储蓄减少得太快，即使穿越辽阔的无人区，他们也只租用最便宜的汽车；发烧、腹泻什么的，也多数是自带药品解决，他们带着饭锅、面条、自制肉酱，时常煮一锅面条，放点儿蔬菜和肉酱，将就将就就是一餐。",vn:"Ông và vợ đi về Bắc Cực 17 lần, chi phí rất lớn; họ chỗ nào cũng tính toán chi li, tìm mọi cách tiết kiệm, kẻo khoản tiết kiệm bao năm hao hụt quá nhanh; dù băng qua vùng hoang vắng mênh mông, họ cũng chỉ thuê xe rẻ nhất; sốt hay tiêu chảy gì đó, phần lớn tự mang thuốc chữa; họ mang theo nồi cơm, mì sợi, tương thịt tự làm, thường nấu một nồi mì, cho chút rau và tương thịt, tạm bợ thế là xong một bữa.",idea:"Tiết kiệm từng đồng.",q:["为了节省开支，王建男夫妇采取了什么措施？"],note:[["处处……，千方百计……，免得……，即使……也……","Xem <b>Bài tập 4②</b>."],["……什么的","= … vân vân (khẩu ngữ)."],["将就将就","Lặp động từ ABAB — làm tạm."]]},{zh:"日子艰苦是艰苦，可是王建男却很有幸福感，他愿意自己支配自己的生命，执着地要为历史留下些印迹。",vn:"Cuộc sống gian khổ thì có gian khổ thật, nhưng Vương Kiến Nam lại thấy rất hạnh phúc; ông muốn tự mình làm chủ cuộc đời, bền bỉ muốn để lại chút dấu vết cho lịch sử.",idea:"Kết: vất vả mà hạnh phúc.",q:["日子艰苦，王建男为什么很有幸福感？"],note:[["A是A，可是……","Nhượng bộ: <span class='zh'>艰苦是艰苦</span> = gian khổ thì có gian khổ, nhưng…"]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ trái nghĩa",G:[{id:"g1",grp:0,word:"",zh:"数量短语的重叠：一拨拨 · 一本本",py:"",tag:"Chú thích 1 · lặp lượng từ",mean:"<span class='zh'>一拨拨</span> là dạng lặp của cụm số lượng <span class='zh'>一拨</span>, miêu tả <b>số lượng nhiều</b>, nhưng sự vật phải hiện ra <b>từng cá thể một</b> — vì vậy khác <span class='zh'>很多</span> về nghĩa và chức năng (gợi hình ảnh nối tiếp nhau). Số từ chỉ dùng <span class='zh'>一</span>; chữ <span class='zh'>一</span> thứ hai có thể lược.",forms:["一 + lượng từ + lượng từ（一拨拨 / 一本本 / 一件件）","一 + lượng từ + 一 + lượng từ（一口一口）"],ex:[["每天都会有一拨拨同行前来考察访问。","",1],["她收集的那一幅幅图片、一本本资料、一盘盘调查录音带，都是不容置疑的铁证。","Từng bức ảnh, từng cuốn tư liệu, từng cuộn băng ghi âm cô thu thập đều là chứng cứ không thể nghi ngờ."],["饭要一口口吃，话要一句句说，事要一件件做。","Cơm phải ăn từng miếng, lời phải nói từng câu, việc phải làm từng việc."]],tips:["Làm định ngữ: miêu tả nhiều; làm trạng ngữ: <b>lần lượt từng cái</b> (<span class='zh'>一个个地检查</span>)."],practice:{q:"在括号里填上适当的数量短语的重叠形式",type:"complete",items:[["他在心里努力搜寻着(____)能够说服妈妈的理由。","他在心里努力搜寻着一个个能够说服妈妈的理由。"],["我很希望知道，学校是如何把(____)十多岁的中学生培养成(____)能够抗击风浪、展翅高飞的山鹰的。","……把一个个十多岁的中学生培养成一只只能够抗击风浪、展翅高飞的山鹰的。"],["他所做的(____)看似平常的小事，感动着身边的每一个人。","他所做的一件件看似平常的小事，感动着身边的每一个人。"]]}},{id:"g2",grp:0,word:"鼓动",zh:"鼓动 / 鼓励",py:"gǔdòng / gǔlì",tag:"Xem 辨析 bên dưới",mean:"Đều là động từ: dùng lời nói, chữ viết <b>khơi dậy cảm xúc</b>, khiến người ta hành động. <span class='zh'>鼓动</span> thiên về <b>phát động, xúi</b> (có thể dẫn đến việc xấu); <span class='zh'>鼓励</span> thiên về <b>khích lệ</b> (chỉ việc tốt).",forms:["在……的鼓动 / 鼓励下，……","鼓动 / 鼓励 + 人 + V"],ex:[["记者出身的妻子鼓动他说，年轻人自驾都能去，咱们怎么不行？","",1]],tips:["Bài tập 1: <span class='zh'>鼓励 · 鼓掌 · 鼓舞 · 鼓吹</span>."]},{id:"g3",grp:0,word:"毅然",zh:"毅然 + V",py:"yìrán",tag:"Bài tập 2①",mean:"Phó từ văn viết: <b>kiên quyết, không chút do dự</b> — thường đi với những quyết định lớn, khó khăn: <span class='zh'>毅然决定 · 毅然离开 · 毅然回国 · 毅然放弃</span>.",forms:["（chủ ngữ）+ 毅然 + 决定 / V"],ex:[["就在王建男事业达到高峰的时候，他毅然决定离开报社。","",1],["看到祖国需要自己，他毅然回国了。","Thấy tổ quốc cần mình, anh dứt khoát về nước."]],tips:["Gần nghĩa: <span class='zh'>果断 · 坚决 · 毫不犹豫地</span>."]},{id:"g4",grp:1,word:"",zh:"难以",py:"nányǐ",tag:"Chú thích 2 · động từ (văn viết)",mean:"Động từ = <span class='zh'>不容易 · 很难</span>. Theo sau thường là <b>động từ / tính từ song tiết hoặc đa tiết</b>, <b>không</b> đi với từ đơn tiết. Dùng trong văn viết.",forms:["难以 + V/Adj song tiết（想象 / 忘怀 / 平静 / 置信）","令人难以 + V"],ex:[["事情已经过去好久了，可是每次回想起当时的情景，心情还是难以平静。","Chuyện đã qua lâu rồi, nhưng mỗi lần nhớ lại cảnh đó, lòng vẫn khó bình tĩnh."],["这样的假话最好不要说，因为你自己都难以自圆其说，别人怎么能够相信呢？","Lời dối như vậy tốt nhất đừng nói, chính bạn còn khó tự bào chữa thì người khác sao tin được?"],["他们遇到过想象中难以度过的灾难……","",1]],tips:["✗ <span class='zh'>难以吃</span> → ✓ <span class='zh'>难吃</span> / <span class='zh'>难以下咽</span>.","Cụm hay gặp: <span class='zh'>难以置信 · 难以想象 · 难以忘怀 · 难以形容</span>."],practice:{q:"为句子选择适当的上句：A 居然发生了这样的事情 · B 虽然他经历了常人难以忍受的痛苦和艰辛 · C 在老家度过的每一天都很愉快",type:"complete",items:[["(____)，至今令人难以忘怀。","C 在老家度过的每一天都很愉快，至今令人难以忘怀。"],["(____)，真是令人难以想象！","A 居然发生了这样的事情，真是令人难以想象！"],["(____)，他却从未退缩过。","B 虽然他经历了常人难以忍受的痛苦和艰辛，他却从未退缩过。"]]}},{id:"g5",grp:2,word:"免得",zh:"……，免得……",py:"miǎnde",tag:"Chú thích 3 · liên từ",mean:"Liên từ: <b>tránh để xảy ra</b> tình huống không mong muốn — “kẻo, để khỏi”. Thường đứng ở <b>vế sau</b>. Cũng nói <span class='zh'>以免</span> (văn viết hơn).",forms:["biện pháp，免得 + điều không mong muốn"],ex:[["今天大家晚点儿走，把活儿都干完，免得明天再来。","Hôm nay mọi người về muộn chút, làm cho xong việc, khỏi mai phải đến nữa."],["自己能做的事就自己做吧，免得麻烦别人。","Việc mình làm được thì tự làm, khỏi phiền người khác."],["他们处处精打细算，千方百计节省开支，免得多年的储蓄减少得太快。","",1]],tips:["Khác <span class='zh'>以便</span> (để tiện, mục đích tích cực): <span class='zh'>免得</span> nêu điều <b>muốn tránh</b>.","Bài tập 2③."],practice:{q:"完成句子",type:"complete",items:[["到了以后来个电话，免得________。","到了以后来个电话，免得家里人担心。"],["小声点儿，大伙儿都睡了，免得________。","小声点儿，大伙儿都睡了，免得把他们吵醒。"],["麻烦你跟他解释清楚，免得________。","麻烦你跟他解释清楚，免得他误会。"]]}},{id:"g6",grp:2,word:"将就",zh:"将就（着）+ V · 将就将就",py:"jiāngjiu",tag:"Bài tập 2⑤ · khẩu ngữ",mean:"Động từ khẩu ngữ: <b>miễn cưỡng chấp nhận</b> điều kiện chưa vừa ý — “tạm, đành chịu”. Gần nghĩa <span class='zh'>凑合</span>.",forms:["将就着 + V（住 / 用 / 吃）","将就将就 / 将就一下"],ex:[["时常煮一锅面条，放点儿蔬菜和肉酱，将就将就就是一餐。","",1],["条件有限，招待不周，你们将就着住两天吧。","Điều kiện có hạn, tiếp đãi không chu đáo, các bạn ở tạm hai hôm nhé."]],tips:["SBT câu 18: <span class='zh'>好马很快就被抢光了，我们只能将就了</span>."]}],BX:{grp:0,word:"鼓动",cols:["鼓动","鼓励"],pair:"鼓动 — 鼓励",same:["Đều là động từ, đều có thể biểu thị dùng lời nói, chữ viết <b>khơi dậy cảm xúc</b>, khiến người ta hành động.","在朋友的鼓动 / 鼓励下，我走上舞台，完成了表演。"],diff:[["Thiên về nghĩa <b>“phát động, xúi giục”</b>. Phía sau có thể là hành vi <b>tiêu cực</b>.","在他的鼓动下，那些人参加了非法组织。","Thiên về nghĩa <b>“khích lệ, động viên”</b>, phía sau đều là hành vi <b>tích cực</b>, không thể là tiêu cực.<div class='zh' style='margin-top:4px'>父母鼓励他坚持下去，最后一定能取得成功。</div>"]],task:{q:"判断正误",cols:["√","×"],sample:!1,items:[["在她的鼓励下，我把唯一的一份工作也丢了。",1,"Kết quả xấu (mất việc) → phải dùng <span class='zh'>鼓动</span>."],["在我快要放弃时，朋友的鼓励给了我勇气。",0,"Hành vi tích cực → đúng."],["他鼓动我买股票，结果赔得干干净净。",0,"Kết quả xấu → <span class='zh'>鼓动</span> đúng."],["如果不是当初他鼓励我，我也不会像现在这么惨。",1,"Kết quả xấu (这么惨) → phải dùng <span class='zh'>鼓动</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["专<u>题</u>","话题 · 主题 · 问题 · 题目"],items:[["北<u>极</u>","极","南极 · 极端 · 极限 · 极其"],["<u>开</u>拓","开","开始 · 开关 · 开端 · 开心"],["释<u>放</u>","放","放假 · 放心 · 开放 · 解放"],["<u>鼓</u>动","鼓","鼓励 · 鼓掌 · 鼓舞 · 鼓吹"]]},EX2:{q:"用所给词语或结构改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["看到祖国需要自己，他毫不犹豫地回国了。→ ________","毅然","看到祖国需要自己，他毅然回国了。"],["走自己的路，别在乎其他人怎么说。→ ________","在意","走自己的路，别在意其他人怎么说。"],["为了不引起误会，我再多说几句。→ ________","免得","我再多说几句，免得引起误会。"],["知道我一个人在异国他乡，他常常打电话问候我。→ ________","时常","知道我一个人在异国他乡，他时常打电话问候我。"],["条件有限，招待不周，你们凑合着住两天吧。→ ________","将就","条件有限，招待不周，你们将就着住两天吧。"],["做点儿你能做的事情吧，难度太大的就不要做了。→ ________","力所能及","做点儿你力所能及的事情吧，难度太大的就不要做了。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["毅然","捆绑","在意","支配","疲惫"],text:"现代人生活、工作压力都很大，被事业、家庭{捆绑}着，身心{疲惫}。但大部分人很{在意}自己已有的一切，没有勇气离开固有的生活圈子。只有少数人会{毅然}决定换一种生活方式，做自己愿意做的事情，自己{支配}自己的时间和生命。"},{bank:["灾难","记载","刻不容缓","抢救","捕捉"],text:"由于环境污染、全球变暖和人类无节制的{捕捉}动物，世界上动物的种类正日益减少，很多动物种群面临{灾难}性的毁灭。有些动物，我们的后代可能只有在文字{记载}中去了解了。因此，{抢救}正在消失的珍稀动物{刻不容缓}。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"他<u>先是</u>办了家企业；<u>不久</u>他跨洋过海，到了加拿大；<u>再后来</u>，他恋上了北极。",task:"大学毕业以后，他先是____；不久____；再后来，____。",model:"大学毕业以后，他先是在一家小公司当翻译；不久他辞了职，自己开了一家咖啡馆；再后来，他爱上了摄影，成了一名自由摄影师。"},{src:"他和妻子往返北极17次，支出很大，他们<u>处处</u>精打细算，<u>千方百计</u>节省开支，<u>免得</u>多年的储蓄减少得太快，<u>即使</u>穿越辽阔的无人区，他们<u>也</u>只租用最便宜的汽车。",task:"因为需要帮助的孩子很多，他们处处____，千方百计____，免得____，即使____，也____。",model:"因为需要帮助的孩子很多，他们处处节约，千方百计筹集资金，免得孩子们因为没钱而失学，即使自己生病了，也舍不得多花一分钱。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["简述一下王建男的工作经历。","①大学毕业做过…… ②领导的报社成为…… ③身心疲惫，毅然决定……","王建男大学毕业后做过摄影记者、新闻评论员、编辑，50岁做了社长；他领导的报社成为中国报业改革的典型；在事业高峰时，他因为身心疲惫，毅然决定离开报社。"],["辞职后，王建男有什么经历？","先是……，不久……，再后来……","他先是办了家企业；不久跨洋过海到了加拿大；再后来，他恋上了北极。"],["书中一般是怎样描述北极的？","大约4000年前……，途中遭遇……，最终退进……，住……，用……，……生存下来","大约4000年前，最后一批跨过白令海峡的亚裔族群向美洲进发，途中遭遇印第安人的围堵，最终退进北极圈，住雪屋、用长矛打猎，在饥饿、风暴、严寒中奇迹般地生存下来。"],["现实的北极是什么样的？","①屋内…… ②连锁超市…… ③年轻人……","屋内温暖如春，家电齐全，户户能上网；连锁超市里卖的是包装食品；年轻人穿着时髦的衣裳，潇洒而快活。"],["现在，王建男专注于什么事情？","不再在意……，只专注于……，采访专题……","他不再在意自然风光和动植物，只专注于人文，采访专题是“北极人文圈”，要抢救因纽特人生活中正在消失的东西。"],["为了节省开支，王建男夫妇采取了什么措施？","处处……，租用……，自带药品，将就将就……","他们处处精打细算，只租用最便宜的汽车，生病了自带药品解决，经常煮一锅面条，将就将就就是一餐。"]]},DP:{title:"词汇：熟悉下列反义词",vn:"16 cặp trái nghĩa — rất hay xuất hiện trong phần chọn từ HSK6.",items:[["贬低","biǎndī","hạ thấp","↔ 抬高","不要贬低别人来抬高自己。"],["贬义","biǎnyì","nghĩa xấu","↔ 褒义","“鼓动”有时带有贬义。"],["稠密","chóumì","dày đặc","↔ 稀疏","这里人口稠密。"],["丑恶","chǒu'è","xấu xa","↔ 美好","我们要揭露社会的丑恶现象。"],["反面","fǎnmiàn","mặt trái","↔ 正面","看问题要看到它的反面。"],["放大","fàngdà","phóng to","↔ 缩小","把这张照片放大一点儿。"],["奉献","fèngxiàn","cống hiến","↔ 索取","人生的价值在于奉献，而不在于索取。"],["宏观","hóngguān","vĩ mô","↔ 微观","政府加强了宏观调控。"],["全局","quánjú","toàn cục","↔ 局部","做事要从全局出发。"],["上级","shàngjí","cấp trên","↔ 下级","这是上级的决定。"],["上游","shàngyóu","thượng lưu","↔ 下游","长江上游的风景很美。"],["压缩","yāsuō","nén, cắt giảm","↔ 扩张","公司压缩了开支。"],["油腻","yóunì","nhiều dầu mỡ","↔ 清淡","生病时少吃油腻的东西。"],["自卑","zìbēi","tự ti","↔ 自信","他从小就很自卑。"],["固体","gùtǐ","chất rắn","↔ 液体","冰是固体，水是液体。"],["外向","wàixiàng","hướng ngoại","↔ 内向","她性格外向，喜欢交朋友。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"在查找资料的过程中，我发现外国人对于经典老车的区分很明确。1919年之前生产的汽车被叫作老爷车，之后生产的汽车叫古董车。单从这一点也可以看出，他们对于这些经典老车常常是怀着一份敬慕之情去看待的。",o:["古董车的历史比老爷车长","外国人对车的评价十分经典","外国人对车怀有尊敬、仰慕之情","老爷车和古董车的区别在资料中有记载"],a:3,why:"“在查找资料的过程中，我发现……区分很明确” → tư liệu có ghi. C: chỉ là với <b>xe cổ kinh điển</b>, không phải mọi xe. (Theo đáp án sách: D)"},{n:2,say:"消费者不应该只把眼睛盯在哪种商品价格升了或是降了，支出多了还是少了，而应用心研究“钱”的购买力、“钱”的潜在价值还有哪些，只有这样，才能真正做到精打细算，花多少钱办多少事。",o:["消费者应该处处精打细算","东西涨价，就会增加支出","钱的潜在价值比商品价格更重要","精明的消费者能够少花钱多办事"],a:2,why:"“不应该只盯在价格……而应用心研究‘钱’的……潜在价值”."},{n:3,say:"对包装，人们提出了“绿色”的要求，希望它在环境保护和资源利用两方面都符合可持续发展的特征。即该种包装源于自然，能与自然融为一体，对生态环境和人类健康无害，能重复使用和再生。",o:["绿色包装对人体健康无害","绿色包装的颜色都很自然","绿色包装不支持重复使用","绿色包装都使用再生资源"],a:0,why:"“对生态环境和人类健康无害”."},{n:4,say:"春节后是员工跳槽的高峰期，也是中国企业招聘的高峰期，一是会有员工离职，二是有些部门对人员有新的需求。作为部门经理，这时就应该对人员变动提前做好预期和准备，以免临时抓瞎。",o:["春节后是公司生产的旺季","春节后单位人员流动很大","很多部门经理工作抓得不够紧","公司应事先掌握人员变动情况"],a:1,why:"“春节后是员工跳槽的高峰期，也是……招聘的高峰期”. D: người cần chuẩn bị là <b>trưởng phòng</b>."},{n:5,say:"我见过许多成就颇高的华人文化艺术家，这些人往往是一袭中式对襟衣裳，神情淡定，举止儒雅。那种气质和风度，令人倾倒。我深信，文化就是蕴含在举手投足之间的秘密，这些生命与文化的密码，是任何形式的全球化都无法改变的。",o:["我访问过许多艺术家","全球化包括文化交流","艺术家的一举一动都有文化烙印","艺术家的气质、风度很令人信任"],a:2,why:"“文化就是蕴含在举手投足之间的秘密”. A: <span class='zh'>见过</span> ≠ <span class='zh'>访问过</span>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：大家好，在热闹的娱乐圈里，陈老师算是位特立独行的人物，演戏之余，往往深居简出，即使不得不参加一些公开的宣传活动，也是惜字如金。于是，一些人说他是典型的“孤芳自赏”“冷漠清高”，不过陈老师本人却觉得自己很委屈，也许是为了证明自己并不那么各色，他同意接受我的访问。您是不是一直有意识地使自己和这个圈子保持一定的距离？\n男：我不是有意识的，在圈子里也有不少谈得来的朋友，但是我不喜欢动不动就上酒桌，我一上这个酒桌就觉得是一种煎熬。\n女：没话说？\n男：没话说，因为我本人不喝酒。尤其有这么一两次，当一个人喝醉酒，一个主题、一句话跟你说五遍的时候，我就感到窝火，头脑就会冲动，心里充满难以抑制的愤怒。\n女：平常的潇洒劲儿也没了，觉得是别人强加给您的？\n男：对。你还得客客气气地对他，好好听着。他跟你说五遍，一个名片递你八张。这时候我就觉得特别烦。\n女：那跟什么样的人说话越来越多呢？\n男：可能跟我自己对话多一些，我经常反问自己一些问题。\n女：问自己什么问题呢？\n男：其实仔细想一想，包括现在社会一天到晚在强调竞争，往往就忽略和忘记了独处的美好。\n女：美好在什么地方？\n男：我觉得是自我净化，自我调教，自我教化，在独处当中我才能够真正安安静静地去思考。我喜欢自己支配自己的时间。\n女：那您靠什么来排解自己的压力和情绪呢？\n男：我有第二支点，就是弹钢琴。我把弹钢琴当作自己情绪的抒发口。\n女：不同情绪的时候弹不同的曲子？\n男：对，我弹钢琴时面对一扇窗，从那扇窗可以望见天空，我经常会坐在钢琴前面，一边弹琴，一边使目光穿越窗口，用心跟一片片白云对话。",qs:[{n:6,q:"男的为什么接受这次采访？",o:["他非常欣赏这位记者","他不想再冷漠下去了","他觉得别人误解他了","他演完戏后有时间了"],a:2,why:"“觉得自己很委屈……为了证明自己并不那么各色”."},{n:7,q:"女的所说的“这个圈子”指什么？",o:["娱乐圈","谈话圈","记者圈","百姓圈"],a:0,why:"“在热闹的娱乐圈里……”."},{n:8,q:"为什么男的一上酒桌就觉得煎熬？",o:["他对喝酒没兴趣","他本来话就不多","他痛恨别人啰唆","他怕自己喝醉了"],a:0,why:"“没话说，因为我本人不喝酒”."},{n:9,q:"男的为什么喜欢独处？",o:["可以赢得竞争","可以静心思考","可以排解压力","可以听钢琴曲"],a:1,why:"“在独处当中我才能够真正安安静静地去思考”. C là tác dụng của <b>đánh đàn</b>."},{n:10,q:"关于男的，下列哪项正确？",o:["他只懂得自我欣赏","他的性格非常冲动","他很冷漠看不起人","他喜欢安静和思考"],a:3,why:"Thích ở một mình, suy nghĩ, đánh đàn. A, C là <b>lời đồn</b> anh ấy phản bác."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"无论是摄影还是旅行圈子，火车迷都为数不少。王嵬对于火车、对于铁路的喜爱，源于小时候家住火车站附近，铁路就从他家楼下经过，趴在阳台上观察来往的火车是小王嵬最喜欢的游戏，后来，他变成了十足的“火车迷”。他观察火车、画火车、研究火车的车型和运动原理、关注铁路的历史和建设，他设想过自己当上了火车司机，也觉得造火车的工作很不错，没想到的是，如今他举办了铁路题材的个人摄影作品展。\n这张拍摄于卓资山的照片是王嵬最喜欢的作品之一。他还记得这里的地形特点是多山、多丘陵、少平川，景色富于变化，非常美丽，火车蜿蜒穿行其间，又给这份景色平添了一份硬朗的动感。\n为了拍出火车经过那里所呈现的大曲线的美感，王嵬多次前往，仔细研究卓资山大曲线的拍摄角度，最终在大曲线北端的高山上将曲线的“S”形整个收入到画面中。后来，随着穿山隧道的投入使用，卓资山大曲线完成了它的历史使命，不再有列车通行。他的这张照片承载的也就不光是一份美，还有着一段沉甸甸的历史了。",qs:[{n:11,q:"王嵬的职业是什么？",o:["摄影家","旅行家","火车司机","火车维修员"],a:0,why:"“举办了铁路题材的个人摄影作品展”. C chỉ là ước mơ."},{n:12,q:"小王嵬成为“火车迷”的原因是什么？",o:["他天天在铁路边玩耍","他爸爸是一个火车迷","他每天观察来往的火车","中国铁路发展史吸引了他"],a:2,why:"“趴在阳台上观察来往的火车是小王嵬最喜欢的游戏”."},{n:13,q:"关于王嵬拍摄于卓资山的照片，下列哪项正确？",o:["王嵬始终拍不全完整的曲线","王嵬的照片被选入了历史书","火车穿越隧道时要走S型线路","卓资山大曲线现在已经废弃了"],a:3,why:"“卓资山大曲线完成了它的历史使命，不再有列车通行”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"从前，森林里生活着一群熊，它们食物充足，无忧无虑。突然有一天，森林着火了，它们的家园被烧光，食物没有了来源。这时，一部分熊说：“我们去北极吧，说不定那里有我们的天地。”另一部分则反对说：“不行，那里气候严寒，说不定我们会冻饿而死。还是找个近点儿的地方吧。”熊们争论到疲惫至极也没有结果。最后，一部分熊去了北极，一部分熊去了四季温暖、草木葱郁的盆地。\n到了北极的熊学会了在冰冷的海水中捕鱼捉虾，甚至和比自己大的海豹搏斗，结果它们进化成高大凶猛的北极熊。到了盆地的熊发现，这里的食肉动物太多了，它们根本抢不到食物，于是它们改吃草；可是，更加意外的是，这里食草动物也多，它们连草也抢不到，于是它们改吃别的动物不吃的食物——竹子，这才勉强生存下来，成了人们天天念叨的濒危动物——熊猫。\n竞争每天都在发生，如果一味地逃避，唯一的结果就是被淘汰出局。因此要勇敢地走在风暴的前面，敢于主动超越自己，只有这样，才能不被别人淘汰，让自己成为那个走在最前面的乘风破浪的勇士。",qs:[{n:14,q:"关于熊，可以知道什么？",o:["它们只会争论，不懂团结","它们只适合在森林中生活","火灾破坏了它们平静的生活","它们本不该把家安在森林里"],a:2,why:"“森林着火了，它们的家园被烧光”."},{n:15,q:"关于北极熊，可以知道什么？",o:["它们打不过海豹","它们变得强悍了","它们爱上了鱼虾","它们改成了吃草"],a:1,why:"“进化成高大凶猛的北极熊”."},{n:16,q:"到了盆地的熊生活得怎样？",o:["它们不断发扬奉献精神","它们和其他动物争夺食物","它们找到了最爱吃的竹子","它们变成了被抢救的濒危物种"],a:3,why:"“成了……濒危动物——熊猫”. C: tre là thứ <b>con khác không ăn</b>, không phải món ưa thích."},{n:17,q:"根据这段话，下列哪项正确？",o:["要敢于迎接挑战","要勇敢面对失败","要慎重做出决定","要保护弱势群体"],a:0,why:"“要勇敢地走在风暴的前面，敢于主动超越自己”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["整部书的完成是我一边采访一边写作的状态下完成的。","旅行团一到，好马很快就被抢光了，我们只能将就了，否则就没马骑。","从纪录片产生到今天，纪录片的资金筹措问题从来就没有得到过解决。","科学地确定发展模式和奋斗目标，是时代向我们提出的刻不容缓的任务。"],a:0,why:"<b>Chủ – vị không hợp + thừa</b>: <span class='zh'>完成……是……完成的</span> lặp → <span class='zh'>整部书是我在一边采访一边写作的状态下完成的</span>."},{n:19,o:["“糖瓜”是这里过年流行的美食。","有人认为，过年觉得没意思也许跟年味逐年冷淡有很大关系。","老汉不善言辞，但讲起制作松鼠鱼繁复的过程，他立刻滔滔不绝。","这个徽州女人和她不太会讲话的儿子，把这家豆腐房经营得红红火火。"],a:1,why:"<b>Kết hợp sai</b>: <span class='zh'>年味</span> đi với <span class='zh'>变淡</span>, không đi với <span class='zh'>冷淡</span> → <span class='zh'>年味逐年变淡</span>."},{n:20,o:["这一改革措施必将引起城市内部一系列的连锁反应。","几年来，他一有机会就鼓动我跳槽，让我辞了现在仍从事的这份工作。","唐朝的很多王公将相，甚至连唐太宗的皇后长孙氏，都出身于少数民族。","当这些美食放大许多倍呈现在大银幕上时，的确产生了震撼的味觉效果。"],a:3,why:"<b>Kết hợp sai</b>: hình ảnh trên màn ảnh tạo hiệu quả <b>thị giác</b> (<span class='zh'>视觉效果</span>), không phải vị giác."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"孩子参加劳动，既是学习过程，又是___过程，在这个过程中自然会有成功和失败。这就要求父母鼓励孩子___困难，建立信心和决心，学会做自己___的事情。",o:["磨炼　打赢　随心所欲","磨合　无视　得心应手","锻炼　战胜　力所能及","练习　克服　无能为力"],a:2,why:"<span class='zh'>锻炼过程</span>; <span class='zh'>战胜困难</span>; <span class='zh'>力所能及的事</span> (từ mới)."},{n:22,text:"表情是___的外部表现，有的表情是人类生物学性质的本能表现。一般婴儿会毫不___地表露自己的情绪，___则根据社会的要求调整其情绪表现方式。儿童从2岁开始就能够用表情手段去___别人，并学会在不同场合用不同方式表达同一种情感。",o:["情绪　保留　以后　影响","心境　保守　后来　管理","感情　在意　然后　感化","心情　保密　往后　感染"],a:0,why:"<span class='zh'>情绪的外部表现</span>; <span class='zh'>毫不保留</span>; <span class='zh'>以后</span> (đối với sau này lớn lên); <span class='zh'>影响别人</span>."},{n:23,text:"我们___会碰到这样的老人：他们总怕儿女不会___自己，要竭尽全力地为他们操劳；他们总要关注家里的大事小情，生怕缺了他们一切变得___。他们以为这就是爱，实际上这种捆绑关系往往会造成灾难性的___，因为孩子往往不喜欢你太多地唠叨。",o:["时常　照顾　一团糟　后果","不时　看护　乱哄哄　结果","曾经　关照　乱糟糟　苦果","迟早　照料　乱腾腾　成果"],a:0,why:"<span class='zh'>时常</span> (từ mới); <span class='zh'>照顾自己</span>; <span class='zh'>一团糟</span>; <span class='zh'>灾难性的后果</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"赤道为低气压区，由赤道两侧吹向赤道的东北信风和东南信风，驱动赤道南北两侧的海水由东向西流动。(24)，南面的称为南赤道暖流。赤道暖流到达大洋西岸时，受陆地阻挡，其中一小股回头向东形成赤道逆流；大部分受地转偏向力的影响，沿海岸向较高的纬度流去，至中纬地区受西风吹动形成西风漂流。(25)，一部分沿大陆西岸折向低纬，成为赤道暖流的补偿流；另一部分沿大陆西岸折向高纬，构成极地环流。\n赤道是物种的制造厂。与其他未能这么幸运地享受到这一地理位置优势的物种相比，(26)，无论从温度、湿度还是从可获取的食物来看，都是如此。生活在这片乐土上的唯一不利因素，(27)！\n在赤道，动植物比其他地方的动植物长得更快、更大，而且外形更怪异。(28)。由于这里的阳光使海洋大量蒸发，这种冲击会在这样一个大范围中形成湿度柱，进而形成风和潜流，而风和潜流随后会最终给位于异常遥远的地方的生命提供能量。",opts:["赤道动物简直是生活在一个近乎完美的环境中","赤道地区的阳光是地球上最强劲的能量","北面的称为北赤道暖流","当它们到达大洋东岸时","就是要与地球上半数以上的物种分享资源"],ans:{24:2,25:3,26:0,27:4,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"上小学的迪士尼是个聪明调皮的小男孩，他在文学和绘画方面有着惊人的天分。不到十岁，他便读完了马克·吐温的《汤姆·索亚历险记》等名著，老师的绘画作业，他每次都能完成得十分出色。\n一次，老师给大家留的作业是画一盆花。在迪士尼手下，不光花朵变成了人脸，花形的人脸还有各种不同的表情，花朵下面的叶子被画成了人手，最下面的花盆变成了一把小椅子。这样，整幅画看上去既像是一盆花，又像是一群坐在小椅子上手舞足蹈的孩子。\n老师看到迪士尼的画儿既惊奇又生气，他不认为这是孩子的开拓性思维，反而认为他是在胡闹，于是当众把迪士尼的画撕得粉碎，还把他批评了一顿。满肚子委屈的迪士尼回到家中，把这件事告诉了父亲。父亲说：“孩子，不能掌握自己命运的人，终生都会是一个奴隶。”幼小的迪士尼不能完全理解父亲的话，却隐约感到父亲是支持自己的。\n迪士尼长大了，一有空闲，他就创作一些画儿寄给杂志，虽然屡屡遭遇退稿，倔强的迪士尼却是屡败屡战。1923年，迪士尼与哥哥毅然合作成立了“迪士尼兄弟公司”，在好莱坞一家房地产公司废弃的仓库里度过了最初的艰难后，他们创作的米老鼠和唐老鸭横空出世，迅速享誉世界。",qs:[{n:29,q:"和第1段画线词语“天分”意思最相近的是：",o:["成绩","想法","能力","天资"],a:3,why:"<span class='zh'>天分 = 天资</span> (năng khiếu bẩm sinh)."},{n:30,q:"迪士尼的老师：",o:["急了就拿孩子撒气","讨厌拿作业开玩笑","不能理解孩子的心灵","鼓励孩子发挥创造性"],a:2,why:"“他不认为这是孩子的开拓性思维，反而认为他是在胡闹”."},{n:31,q:"关于迪士尼，下列哪项正确？",o:["创办过一家美术杂志社","小学老师给他的打击很大","曾经开过一家房地产公司","能捕捉到父亲语言中的积极因素"],a:3,why:"“隐约感到父亲是支持自己的”."},{n:32,q:"上文主要介绍的是：",o:["迪士尼的成长过程","迪士尼的不幸遭遇","迪士尼有个好父亲","“迪士尼兄弟公司”的由来"],a:0,why:"Từ tiểu học → lớn lên → lập công ty: quá trình trưởng thành."}]},{ins:"第33–36题：请选出正确答案。",text:"人们往往容易低估别人的工作难度，以为对方的工作是极易完成的。这往往会体现在一个有多种职务的公司里，员工们的评论总是偏向自己，比如搞技术的可能会埋怨搞销售的没有把自己创造的产品卖得更好，搞销售的会埋怨搞技术的没有设计出更好的产品，他们都觉得和自己比，别人相差太远。\n一位足球教练曾经这样描述一些站着说话不腰疼的球迷：“他们坐在看台上，看着球场里的运动员无法把球传给几米外的队友，会气急败坏地抱怨场上的运动员，因为他们觉得这么轻而易举的事对方都做不到。”是什么导致人们总以为别人的工作比较轻松？有研究显示，这一现象是人的正常心理和生理反应，经考察，其神经学上的根据就是，大脑的运作方式让人们得出了“别人比自己轻松”的判断。\n当人们观察别人做某件事情时，观察者的运动神经系统会仿真对方的行为。这一仿真行为可以帮助观察者理解对方的动作、用意与目标。但这种仿真往往会出现偏差，毕竟观察者是在想象，需要有什么结果，一想就获得了，所以觉得该项工作做起来并不难。然而，如果让观察者去做一件事，他的动作就会干扰自己的大脑产生理解上的差别，认为自己的工作有难度，而且自己既用功又勤奋。最直观的例子就是：假设你是一名工人，整天在生产线上忙碌地装配产品，那么，你肯定看身旁那些在设备旁晃来晃去的技术人员不顺眼，总觉得自己在拼命工作，他们却在混日子。\n这个研究的意义是重大的，它可以促进人们的相互理解，尽量消除自己的大脑对别人工作产生的误解，减少负面情绪的产生和释放。",qs:[{n:33,q:"在有多种职务的公司里，往往会发生什么情况？",o:["员工容易工作偷懒","员工经常互相鼓励","员工工作挑肥拣瘦","员工认为别人不努力"],a:3,why:"“他们都觉得和自己比，别人相差太远”."},{n:34,q:"足球教练的描述说明什么？",o:["看球容易让人生气","教练也常被人误解","腰疼的球迷看不懂球","球迷常低估球员传球的难度"],a:3,why:"“觉得这么轻而易举的事对方都做不到” → đánh giá thấp độ khó. C: <span class='zh'>站着说话不腰疼</span> là thành ngữ (nói thì dễ)!"},{n:35,q:"当我们观察别人做某事时会：",o:["进行仿真的心理体验","充分发挥自己的想象","大脑的理解能力变差","无法摆脱负面情绪的误导"],a:0,why:"“观察者的运动神经系统会仿真对方的行为”."},{n:36,q:"第2段画线词语“轻而易举”的意思是：",o:["只有自己能做","事情很容易做","结果来之不易","稍微用心就行"],a:1,why:"<span class='zh'>轻而易举</span> = rất dễ làm."}]}]},W:{task:"这篇课文讲述了王建男大学毕业以后的经历，从取得事业成功，到毅然辞职离开，再到恋上北极，他的经历很传奇，也带给人们思考：我们究竟为了什么活着？请参考练习5，把课文缩写成400字左右的短文。",target:400,steps:[["Sự nghiệp & quyết định","Giữ các chức vụ, đỉnh cao, <span class='zh'>毅然决定离开</span> + lý do."],["Con đường đến Bắc Cực","<span class='zh'>先是……不久……再后来……</span>; vợ <span class='zh'>鼓动</span>."],["Sách vở vs thực tế","Tóm 1–2 câu Bắc Cực trong sách; 3 chi tiết Bắc Cực ngày nay; thôi thúc chụp ảnh."],["Chuyên tâm & tiết kiệm","<span class='zh'>专注于人文 · 往返17次 · 精打细算 · 将就</span>."],["Kết","<span class='zh'>艰苦是艰苦，可是……支配自己的生命……</span>"]],outline:[["一 · 毅然离开","社长 → 身心疲惫 → 辞职"],["二 · 恋上北极","企业 → 加拿大 → 北极；妻子鼓动"],["三 · 惊奇的发现","书中 vs 现实；用照片记录"],["四 · 艰苦的旅程","17次；精打细算；煮面条"],["五 · 幸福感","自己支配生命，为历史留下印迹"]],model:"背着电饭锅拍北极\n王建男大学毕业后做过摄影记者、新闻评论员和编辑，50岁当上了社长。他领导的报社成了中国报业改革的典型，每天都有一拨拨同行来考察。可就在事业达到高峰的时候，他却毅然决定离开报社，因为他身心疲惫，想做自己愿意做的事。\n辞职以后，他一身轻松。他先是办了一家企业，不久去了加拿大，再后来，他恋上了北极。以前他觉得去北极不是普通人的事，可是记者出身的妻子鼓动他说：“年轻人都能自驾去，我们为什么不行？”于是夫妻俩出发了。\n在书中，因纽特人住雪屋、用长矛打猎，在饥饿和严寒中奇迹般地生存了下来。可是到了北极，他们惊奇地发现，现实和书中的记载差别竟如此之大：家家屋内温暖如春，户户都能上网，超市里卖着包装食品，年轻人穿着时髦的衣服。王建男产生了一个冲动：要用照片让世人知道北极的过去和现在相差多么遥远。从此，他不再在意自然风光，只专注于人文，因为他知道抢救因纽特人正在消失的生活刻不容缓。\n他和妻子往返北极17次，支出很大。为了不让储蓄减少得太快，他们处处精打细算：只租最便宜的汽车，生病了吃自带的药，常常煮一锅面条将就一餐。\n日子虽然艰苦，王建男却很有幸福感。他愿意自己支配自己的生命，执着地为历史留下一些印迹。",check:["Có tiêu đề","Có quyết định rời đỉnh cao + lý do","Có quá trình đến Bắc Cực","Đối chiếu sách vở – thực tế","Có chi tiết tiết kiệm","Có câu kết về hạnh phúc","Dùng ít nhất 4: 毅然 · 鼓动 · 难以 · 免得 · 将就 · 精打细算 · 一拨拨","Khoảng 400 chữ (±40)"]},SUM:{words:["评论","典型","考察","高峰","毅然","疲惫","力所能及","开拓","职务","捆绑","释放","出身","鼓动","遭遇","灾难","饥饿","严寒","惊奇","记载","差别","潇洒","本能","冲动","相差","在意","捕捉","专题","抢救","刻不容缓","支出","精打细算","开支","免得","储蓄","穿越","时常","将就","支配","执着"],patterns:[["一 + lượng từ + lượng từ","每天都会有一拨拨同行前来考察访问。"],["难以 + V song tiết","他们遇到过想象中难以度过的灾难。"],["……，免得……","千方百计节省开支，免得多年的储蓄减少得太快。"],["先是……；不久……；再后来……","他先是办了家企业；不久……到了加拿大；再后来，他恋上了北极。"],["A 是 A，可是……","日子艰苦是艰苦，可是王建男却很有幸福感。"]],diff:["鼓动：phát động, xúi — có thể dẫn đến việc xấu — 鼓励：khích lệ, chỉ việc tốt","差别 chā · 相差 chà · 衣裳 shang · 灾难 = thảm họa ≠ “tai nạn” · 访问 = chuyến thăm · 执着 (tích cực) · 难以 + từ song tiết"],sentences:["就在王建男事业达到高峰的时候，他毅然决定离开报社。","到了北极，他们惊奇地发现，现实和文字记载中因纽特人的生活差别竟是如此之大。","他愿意自己支配自己的生命，执着地要为历史留下些印迹。"],hw:["Học thuộc 50 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài 缩写 khoảng 400 chữ (mục 7).","Làm Sách bài tập bài 14.","Đọc trước bài 15."]}});
