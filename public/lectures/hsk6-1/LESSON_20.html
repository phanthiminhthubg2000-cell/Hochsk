<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 20 · 金鸡窝 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-20",num:20,book:"HSK 标准教程 6（上）",unit:{n:5,zh:"美丽家园",vn:"Ngôi nhà tươi đẹp"},title:"金鸡窝",vn:"Ổ gà vàng",chars:831,source:"改编自《北京青年报》同名文章，作者：寒崖",goals:["Đọc hiểu truyền thuyết dân gian 831 chữ về tảng đá “ổ gà vàng” và bài học <b>đừng tham lam</b>.","Dùng được 51 từ mới, nhất là nhóm <b>miêu tả – kể chuyện</b>: <span class='zh'>镶嵌 · 坚硬 · 别致 · 隐蔽 · 扎 · 拣 · 撇 · 砸 · 拄 · 瘸 · 挖掘 · 坑</span> và nhóm <b>đạo lý</b>: <span class='zh'>废寝忘食 · 勤俭 · 得不偿失 · 告诫 · 欲望 · 贪婪 · 争夺 · 贪污 · 贿赂 · 不择手段</span>.","Nắm <span class='zh'>况且 · 大（+ thời tiết/thời gian） · 倒不如</span>, phó từ <span class='zh'>宁肯 · 分明 · 颇</span>.","Phân biệt <span class='zh'>将近 — 将要</span>; làm quen 8 danh từ mở rộng (<span class='zh'>皮革 · 钻石 · 哨 · 启事……</span>).","Viết bài “争来的东西守不住” ≥400 chữ; luyện đề 缩写 HSK6."],plan:[["Buổi 1","Khởi động · Từ vựng nhóm 1 (况且 · 将近—将要) · Bài khóa đoạn 1–5"],["Buổi 2","Nhóm 2–3 (大 · 倒不如 · 宁肯) · Đoạn 6–10 · Bài tập · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Tảng đá lạ",paras:"Đoạn 1–3",zh:"池塘畔的“金鸡窝”",vn:"Bên ao đầu làng có tảng đá hình bầu dục lõm giữa như ổ gà; trẻ con ngồi lên bị người già mắng → hỏi bà ngoại, biết được truyền thuyết."},{tag:"承",name:"Gà con lạ",paras:"Đoạn 4–6",zh:"捉小鸡 → 变金子 → 被啄伤",vn:"Nhà họ Tống chăm chỉ, khá giả. Ông Ba thấy ổ gà con giữa mùa đông, ném gạch trúng một con → hóa vàng; gà mẹ mổ vào đầu gối, ông khập khiễng về nhà."},{tag:"转",name:"Được một mất mười",paras:"Đoạn 7–8",zh:"挖出石头；金子换钱治腿",vn:"Cả nhà đào tìm chỉ thấy tảng đá; chân ông Ba viêm mãi, tiêu hết số tiền đổi từ vàng mới khỏi — “thà đừng đụng tới ổ gà”."},{tag:"合",name:"Bài học",paras:"Đoạn 9–10",zh:"不要贪婪；心里都有一个“金鸡窝”",vn:"Không phải của mình thì đừng tranh; con cháu họ Tống làm quan không ai dám tham ô."}],warm1:{q:"根据下面这幅图，选择合适的词语在短文中填空。",vn:"Điền 母鸡 · 鸡仔 · 鸡窝 · 找食 · 跟随 vào đoạn văn: <span class='zh'>（鸡窝）旁的草地上，一只（母鸡）正带着一群小（鸡仔）四处（找食）吃，那些小鸡（跟随）妈妈走来走去，可爱极了。</span>",items:[["🐔","母鸡 mǔjī · 鸡仔 jīzǎi","Gà mái · Gà con"],["🪺","鸡窝 jīwō","Ổ gà, chuồng gà"],["🐥","找食 zhǎo shí · 跟随 gēnsuí","Kiếm ăn · Đi theo"]],talk:["你们国家有没有关于“金子”的传说？","你觉得“贪心”会带来什么后果？"],link:"Truyện “ổ gà vàng” giống truyện cổ tích “Ăn khế trả vàng” của Việt Nam — đều dạy: tham thì thâm."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"得",rule:"得 = <b>được, đạt được</b>.",w:[["得知","dézhī","được biết (có trong bài)"],["得到","dédào","nhận được"],["得分","défēn","ghi điểm"],["得力","délì","đắc lực"],["得空","dékòng","rảnh"],["得救","déjiù","được cứu"],["得胜","déshèng","thắng"],["得闲","déxián","rảnh rỗi"],["难得","nándé","hiếm có"],["取得","qǔdé","giành được"],["获得","huòdé","đạt được"],["赢得","yíngdé","giành được"],["求之不得","qiúzhī-bùdé","cầu còn chẳng được"],["一举两得","yìjǔ-liǎngdé","một công đôi việc"]]},{k:"远",rule:"远 = <b>xa (không gian, thời gian)</b>.",w:[["久远","jiǔyuǎn","lâu đời (có trong bài)"],["长远","chángyuǎn","lâu dài"],["深远","shēnyuǎn","sâu xa"],["遥远","yáoyuǎn","xa xôi"],["永远","yǒngyuǎn","mãi mãi"],["远古","yuǎngǔ","thời xa xưa"],["远见","yuǎnjiàn","tầm nhìn xa"],["源远流长","yuányuǎn-liúcháng","lâu đời"],["为期不远","wéiqī-bùyuǎn","sắp đến"]]},{k:"金",rule:"金 = <b>vàng; tiền</b>.",w:[["金子","jīnzi","vàng (có trong bài)"],["金矿","jīnkuàng","mỏ vàng"],["金块","jīnkuài","thỏi vàng"],["金条","jīntiáo","thanh vàng"],["黄金","huángjīn","vàng"],["纯金","chúnjīn","vàng ròng"],["金钱","jīnqián","tiền bạc"],["美金","měijīn","đô-la Mỹ"],["资金","zījīn","vốn"],["礼金","lǐjīn","tiền mừng"],["租金","zūjīn","tiền thuê"],["押金","yājīn","tiền cọc"],["奖金","jiǎngjīn","tiền thưởng"],["现金","xiànjīn","tiền mặt"],["金融","jīnróng","tài chính"]]},{k:"壮",rule:"壮 = <b>khỏe, mạnh</b>.",w:[["身强力壮","shēnqiáng-lìzhuàng","khỏe mạnh cường tráng (có trong bài)"],["壮大","zhuàngdà","lớn mạnh"],["壮实","zhuàngshi","chắc nịch"],["粗壮","cūzhuàng","to khỏe"],["健壮","jiànzhuàng","khỏe mạnh"],["精壮","jīngzhuàng","cường tráng"],["少壮","shàozhuàng","trẻ khỏe"],["壮年","zhuàngnián","tráng niên"],["茁壮","zhuózhuàng","khỏe mạnh (cây, trẻ)"],["兵强马壮","bīngqiáng-mǎzhuàng","binh hùng tướng mạnh"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–5",sub:"Ổ gà vàng & nhà họ Tống",from:1,to:22},{name:"Nhóm 2 · Đoạn 6–7",sub:"Bắt gà con",from:23,to:37},{name:"Nhóm 3 · Đoạn 8–10",sub:"Được một mất mười",from:38,to:51}],V:[[1,"窝","wō","dt.","oa","ổ, tổ",1,"","鸟兽、昆虫住的地方。","金鸡窝","树上有一个鸟窝。","Trên cây có một tổ chim.",["鸡窝","鸟窝"],"Còn là lượng từ: <span class='zh'>一窝小鸡</span> = một ổ gà con."],[2,"畔","pàn","dt.","bạn","bờ, bên (sông, hồ)",1,"书","（江、湖、道路等）旁边；附近。","村东池塘畔","西湖畔有很多游客。","Bên Tây Hồ có rất nhiều du khách.",["湖畔","河畔"],""],[3,"椭圆","tuǒyuán","dt.","thỏa viên","hình bầu dục",1,"","长圆形。","一块椭圆形的大石头","鸡蛋是椭圆形的。","Trứng gà có hình bầu dục.",["椭圆形"],"SBT câu 20."],[4,"外表","wàibiǎo","dt.","ngoại biểu","bề ngoài",1,"","表面；外貌。","金鸡窝外表有些古怪","不能只看人的外表。","Không thể chỉ nhìn bề ngoài con người.",[],""],[5,"镶嵌","xiāngqiàn","đgt.","tương khảm","khảm, nạm",1,"","把一物体嵌入另一物体内。","上面镶嵌着些……小石头","戒指上镶嵌着一颗钻石。","Trên nhẫn nạm một viên kim cương.",[],"SBT câu 22. Mở rộng: <span class='zh'>镶满了钻石</span>."],[6,"坚硬","jiānyìng","tt.","kiên ngạnh","cứng, rắn",1,"","非常硬。","或坚硬或不十分坚硬的小石头","钻石是最坚硬的物质。","Kim cương là chất cứng nhất.",[],""],[7,"工艺品","gōngyìpǐn","dt.","công nghệ phẩm","hàng mỹ nghệ",1,"","手工艺的产品。","像件工艺品","这些工艺品都是手工做的。","Những món đồ mỹ nghệ này đều làm bằng tay.",[],"SBT câu 34."],[8,"美观","měiguān","tt.","mỹ quan","đẹp, xinh xắn",1,"","（形式）好看；漂亮。","很是美观别致","这座建筑既实用又美观。","Tòa nhà này vừa thực dụng vừa đẹp.",["美观大方"],""],[9,"别致","biézhì","tt.","biệt trí","độc đáo, mới lạ",1,"","新奇，跟寻常不同。","很是美观别致","这件衣服的式样很别致。","Kiểu áo này rất độc đáo.",[],"SBT câu 34: <span class='zh'>精巧别致</span>."],[10,"浸泡","jìnpào","đgt.","tẩm phao","ngâm, nhúng",1,"","在液体中放置一段时间。","把脚浸泡在水里","把衣服在水里浸泡半小时。","Ngâm quần áo trong nước nửa tiếng.",[],"SBT nghe câu 13."],[11,"责怪","zéguài","đgt.","trách quái","khiển trách, trách móc",1,"","责备；埋怨。","就会责怪","这件事不能责怪他。","Việc này không thể trách anh ấy.",[],"SBT nghe câu 8."],[12,"嗨","hēi","thán.","hải","này, ấy, nè",1,"口","表示招呼或提起注意。","嗨，坐在金鸡窝上，想干吗呀！","嗨，你怎么在这儿？","Ơ này, sao cậu lại ở đây?",[],""],[13,"祖父","zǔfù","dt.","tổ phụ","ông nội",1,"","父亲的父亲。","姥爷祖父的祖父","我的祖父今年八十岁了。","Ông nội tôi năm nay 80 tuổi.",[],"Bài tập 3①."],[14,"废寝忘食","fèiqǐn-wàngshí","thành ngữ","phế tẩm vong thực","quên ăn quên ngủ",1,"成","顾不得睡觉，忘记了吃饭。形容专心努力。","起早贪黑，废寝忘食","他废寝忘食地研究这个问题。","Anh ấy quên ăn quên ngủ nghiên cứu vấn đề này.",[],"Bài tập 3①. SBT câu 21."],[15,"勤俭","qínjiǎn","tt.","cần kiệm","cần kiệm",1,"","勤劳而节俭。","勤劳加勤俭","勤俭是中华民族的传统美德。","Cần kiệm là truyền thống tốt đẹp của dân tộc Trung Hoa.",["勤俭节约"],"Bài tập 3①."],[16,"富裕","fùyù","tt.","phú dụ","giàu có, sung túc",1,"","（财物）充裕。","日子过得还算富裕","这几年村里人的生活越来越富裕了。","Mấy năm nay đời sống người trong làng ngày càng sung túc.",[],"Bài tập 1: <span class='zh'>富有 · 富翁 · 富商 · 丰富</span>."],[17,"农历","nónglì","dt.","nông lịch","âm lịch",1,"","中国传统历法。","农历年将近","春节是农历正月初一。","Tết là mùng 1 tháng Giêng âm lịch.",[],"SBT câu 20."],[18,"将近","jiāngjìn","phó.","tương cận","sắp tới, gần tới",1,"","（数量等）快要接近。","农历年将近","他将近四十岁了。","Anh ấy gần 40 tuổi rồi.",[],"Xem <b>辨析 将近—将要</b>."],[19,"况且","kuàngqiě","liên.","huống thả","hơn nữa, vả lại",1,"","表示更进一层，补充理由。","况且是乌黑乌黑的身子","这里交通方便，况且房租也不贵。","Chỗ này giao thông thuận tiện, vả lại tiền thuê cũng không đắt.",[],"Xem <b>Ngữ pháp: 况且</b>."],[20,"乌黑","wūhēi","tt.","ô hắc","đen thui, đen sì",1,"","深黑。","乌黑乌黑的身子","她有一头乌黑的长发。","Cô ấy có mái tóc dài đen nhánh.",[],"Láy tăng cấp: <span class='zh'>乌黑乌黑</span>."],[21,"跟随","gēnsuí","đgt.","cân tùy","đi theo sau",1,"","在后面紧接着向同一方向行动。","跟随着母鸡","他从小跟随父亲学医。","Từ nhỏ anh theo cha học y.",[],"SBT câu 34."],[22,"寻觅","xúnmì","đgt.","tầm mịch","tìm kiếm",1,"书","寻找。","四处寻觅","他在人群中寻觅朋友的身影。","Anh tìm bóng dáng bạn mình giữa đám đông.",[],""],[23,"颇","pō","phó.","phả","rất, khá",1,"书","很；相当。","三祖爷颇感诧异","这本书颇受欢迎。","Cuốn sách này khá được ưa chuộng.",["颇感 / 颇为 / 颇受"],"Bài tập 2③. SBT câu 34: <span class='zh'>颇为后人称道</span>."],[24,"分明","fēnmíng","phó.","phân minh","rõ ràng là, hiển nhiên",1,"","明明；显然。","分明不该有这么小的鸡仔呀","他分明知道，却装作不知道。","Anh ta rõ ràng biết mà giả vờ không biết.",[],"Còn là tính từ = rõ ràng: <span class='zh'>黑白分明</span>. Bài tập 2④, 4⑤."],[25,"隐蔽","yǐnbì","đgt.","ẩn tế","ẩn nấp, trốn",1,"","借旁的东西遮掩。","小鸡想隐蔽自己","士兵们隐蔽在树林里。","Binh lính ẩn nấp trong rừng.",[],"Bài tập 1: <span class='zh'>隐藏 · 隐约 · 隐讳 · 隐忍</span>."],[26,"扎","zhā","đgt.","trát","chui vào, lủi vào; đâm",1,"","钻（进去）；刺。","跑着往干草丛里扎","手被针扎破了。","Tay bị kim đâm chảy máu.",[],"Bài tập 3②."],[27,"砖","zhuān","dt.","chuyên","gạch",1,"","用黏土烧成的建筑材料。","拣起一块砖","这面墙是用红砖砌的。","Bức tường này xây bằng gạch đỏ.",[],""],[28,"拣","jiǎn","đgt.","giản","lượm, nhặt",1,"","拾取。","顺手拣起一块砖","他从地上拣起一枚硬币。","Anh ấy nhặt một đồng xu dưới đất.",[],"= <span class='zh'>捡</span>."],[29,"撇","piě","đgt.","phiết","quăng, ném",1,"","平着扔出去。","一块砖撇过去","他把石头撇到河里。","Anh ấy ném hòn đá xuống sông.",[],"⚠️ Đọc <b>piě</b>; <span class='zh'>撇 piē</span> = bỏ mặc (<span class='zh'>撇开</span>)."],[30,"砸","zá","đgt.","tạp","đập, đánh, nện",1,"","用重物对准物体撞击。","一下砸中了一只小鸡","不小心砸破了玻璃。","Lỡ đập vỡ kính.",[],"Khẩu ngữ: <span class='zh'>砸锅</span> = hỏng việc (SBT nghe câu 4)."],[31,"膝盖","xīgài","dt.","tất cái","đầu gối",1,"","大腿和小腿相连的关节的前部。","在三祖爷膝盖下边就是一口","他摔倒了，膝盖破了。","Anh ngã, rách đầu gối.",[],"Bài tập 3②."],[32,"枝","zhī","dt.","chi","nhánh cây, cành cây",1,"","枝子；植物主干上分出来的茎。","拣个树枝","树枝上落满了雪。","Cành cây phủ đầy tuyết.",["树枝"],"Còn là lượng từ: <span class='zh'>一枝花</span>."],[33,"拐杖","guǎizhàng","dt.","quải trượng","gậy, cái nạng",1,"","手拄着走路用的棍子。","拣个树枝当拐杖拄着","爷爷拄着拐杖散步。","Ông chống gậy đi dạo.",[],""],[34,"拄","zhǔ","đgt.","trụ","chống (gậy)",1,"","为了支持身体用拐杖等顶住地面。","当拐杖拄着","他拄着拐杖走了出来。","Anh ấy chống nạng bước ra.",[],""],[35,"瘸","qué","đgt.","què","đi khập khiễng, cà nhắc, què",1,"","腿脚有毛病，走路时身体不平衡。","一瘸一拐地回了家","他的腿瘸了。","Chân anh ấy bị què.",["一瘸一拐"],"Bài tập 3②."],[36,"挖掘","wājué","đgt.","oạt quật","đào, khai quật",1,"","挖；发掘。","大家开始在附近挖掘","要挖掘每个学生的潜力。","Cần khai thác tiềm năng của mỗi học sinh.",["挖掘潜力"],"SBT câu 19: <span class='zh'>考古挖掘</span>."],[37,"坑","kēng","dt.","khanh","lỗ, hố",1,"","洼下去的地方。","挖了个大坑","路上有个大坑，小心！","Trên đường có cái h tranh giành",1,"","争着夺取。","东西不是你的就不要去争夺","两个队正在争夺冠军。","Hai đội đang tranh chức vô địch.",[],"Bài tập 1: <span class='zh'>争取 · 争抢 · 争论 · 争吵</span>. SBT nghe câu 16."],[49,"贪污","tānwū","đgt.","tham ô","tham nhũng, tham ô",1,"","利用职务上的便利非法地取得财物。","没有人敢贪污","他因为贪污被撤职了。","Ông ta bị cách chức vì tham ô.",[],"SBT nghe câu 10."],[50,"贿赂","huìlù","đgt.","hối lộ","hối lộ, đút lót",1,"","用财物买通别人。","贪污、贿赂","他因为贿赂官员被抓了。","Hắn bị bắt vì hối lộ quan chức.",[],""],[51,"不择手段","bùzé-shǒuduàn","thành ngữ","bất trạch thủ đoạn","bất chấp mọi thủ đoạn",1,"成","为了达到目的，什么手段都使得出来。","不择手段","他为了赚钱不择手段。","Hắn bất chấp thủ đoạn để kiếm tiền.",[],"SBT nghe câu 1."]],extra:[["姥姥 / 姥爷","lǎolao / lǎoye","bà ngoại / ông ngoại"],["凹陷","āoxiàn","lõm xuống"],["久远","jiǔyuǎn","lâu đời"],["起早贪黑","qǐzǎo-tānhēi","dậy sớm thức khuya"],["鸡仔","jīzǎi","gà con"],["打滚","dǎ gǔn","lăn lộn"],["身强力壮","shēnqiáng-lìzhuàng","khỏe mạnh cường tráng"],["久病不愈","jiǔbìng-búyù","bệnh lâu không khỏi"],["搭理","dāli","để ý, đếm xỉa"],["和顺","héshùn","hòa thuận"]],T:[{zh:"姥姥住的村东池塘畔有一块椭圆形的大石头。那石头中间凹陷，像个鸡窝，村里人叫它金鸡窝。",vn:"Bên bờ ao phía đông làng bà ngoại ở có một tảng đá lớn hình bầu dục. Giữa tảng đá lõm xuống, giống một cái ổ gà; người trong làng gọi nó là “ổ gà vàng”.",idea:"Tảng đá “金鸡窝”.",q:["姥姥村里的人把什么称为“金鸡窝”？"],note:[["池塘畔","<span class='zh'>畔</span> văn viết = <span class='zh'>旁边</span>."]]},{zh:"金鸡窝外表有些古怪，红色的石头，上面镶嵌着些不同色彩、不同形状、或坚硬或不十分坚硬的小石头，像件工艺品，很是美观别致。",vn:"Bề ngoài ổ gà vàng hơi kỳ lạ: đá màu đỏ, trên khảm những viên đá nhỏ khác màu, khác hình, cứng có mà không cứng lắm cũng có, trông như một món đồ mỹ nghệ, rất đẹp và độc đáo.",idea:"Miêu tả tảng đá.",q:["描述一下金鸡窝的样子。"],note:[["或A或B","Hoặc A hoặc B — liệt kê đa dạng."],["很是 + tt.","Khẩu ngữ = rất."]]},{zh:"我们小时候都喜欢坐在石头上，把脚浸泡在水里。老人们见了，就会责怪：“嗨，坐在金鸡窝上，想干吗呀！”我被说得糊涂，就去问姥姥，这才得知那个久远的传说。",vn:"Hồi nhỏ chúng tôi đều thích ngồi trên tảng đá, ngâm chân xuống nước. Người già thấy là trách: “Này, ngồi lên ổ gà vàng định làm gì hả!” Tôi bị nói đến ngơ ngác, bèn đi hỏi bà ngoại, lúc ấy mới biết truyền thuyết xa xưa kia.",idea:"Vì sao biết truyền thuyết.",q:["“我”是怎么知道这个传说的？"],note:[["被说得糊涂","Bị động + bổ ngữ trạng thái."]]},{zh:"姥爷祖父的祖父宋家有几兄弟，大家起早贪黑，废寝忘食，勤劳加勤俭，日子过得还算富裕。",vn:"Đời ông nội của ông nội ông ngoại tôi, nhà họ Tống có mấy anh em, ai cũng dậy sớm thức khuya, quên ăn quên ngủ, chăm chỉ lại cần kiệm, cuộc sống cũng coi là khá giả.",idea:"Bối cảnh: nhà họ Tống.",q:["故事的背景是什么？"],note:[["勤劳加勤俭","<span class='zh'>A 加 B</span> = A cộng thêm B."]]},{zh:"农历年将近，宋家三祖爷早早下了地，突然看到了一窝小鸡。那小鸡仿佛刚出窝没几天，况且是乌黑乌黑的身子，可爱极了，跟随着母鸡，四处寻觅，像是在找食。",vn:"Gần Tết âm lịch, ông Ba nhà họ Tống ra đồng từ sớm, bỗng thấy một ổ gà con. Đám gà con dường như mới nở được mấy hôm, lại thêm thân mình đen nhánh, đáng yêu vô cùng, theo gà mẹ đi khắp nơi tìm tòi, như đang kiếm ăn.",idea:"Phát hiện ổ gà con.",q:["故事发生在什么时间？三祖爷看到了什么？"],note:[["农历年将近","Xem 辨析 将近—将要."],["况且是……","Xem Ngữ pháp 1."]]},{zh:"三祖爷颇感诧异，大冬天的，这里离村子又远，分明不该有这么小的鸡仔呀！三祖爷去捉小鸡，小鸡想隐蔽自己，跑着往干草丛里扎。三祖爷顺手拣起一块砖撇过去，一下砸中了一只小鸡。小鸡就地打了个滚，瞬间变成了一块金子。这时候，老母鸡急了，跳起来在三祖爷膝盖下边就是一口，三祖爷疼得要命，哼哼着，路也走不动了，只好拣个树枝当拐杖拄着，一瘸一拐地回了家。",vn:"Ông Ba khá ngạc nhiên: giữa mùa đông giá rét, chỗ này lại xa làng, rõ ràng không thể có gà con nhỏ thế này! Ông Ba đi bắt gà con, gà con muốn trốn, chạy lủi vào bụi cỏ khô. Ông tiện tay nhặt một viên gạch ném tới, trúng ngay một con. Gà con lăn một vòng tại chỗ, trong chớp mắt biến thành một cục vàng. Lúc đó gà mẹ cuống lên, nhảy lên mổ ngay một phát dưới đầu gối ông Ba; ông đau muốn chết, rên hừ hừ, không đi nổi nữa, đành nhặt cành cây làm gậy chống, khập khiễng về nhà.",idea:"Gà hóa vàng; ông Ba bị thương.",q:["小鸡变成了什么？三祖爷为什么受伤了？"],note:[["大冬天的","Xem Ngữ pháp 2: <span class='zh'>大</span> + thời tiết / thời gian."],["颇感 · 分明","Phó từ — Bài tập 2③④."],["……就是一口","<span class='zh'>就是 + 一 + lượng từ</span>: hành động dứt khoát, mạnh."],["一瘸一拐","<span class='zh'>一A一B</span> miêu tả dáng đi."]]},{zh:"回到家，三祖爷把事情跟家里人一说，大家赶到地里，可怎么也找不着那窝鸡。大家开始在附近挖掘，挖了个大坑，结果还是没有看到鸡，只是挖出了那块像鸡窝一样的大石头。他们把那石头抬回村里，因为形状不规则，派不上什么用场，最后就扔在了池塘边。",vn:"Về đến nhà, ông Ba vừa kể chuyện cho người nhà, mọi người vội chạy ra đồng, nhưng tìm thế nào cũng không thấy ổ gà. Mọi người bắt đầu đào quanh đó, đào thành một hố lớn, rốt cuộc vẫn không thấy gà, chỉ đào được tảng đá lớn giống ổ gà. Họ khiêng tảng đá về làng, vì hình dạng không đều, chẳng dùng được vào việc gì, cuối cùng vứt bên bờ ao.",idea:"Đào được tảng đá.",q:["大家找到小鸡了吗？"],note:[["派不上用场","Không dùng được vào việc gì."]]},{zh:"三祖爷受伤的腿一直发炎，疼得下不了床。一个身强力壮的小伙子，咋能光躺在床上呢？三祖爷只好用那金子换了钱去看病。还算侥幸，金子换来的钱用完了，三祖爷的腿也好了。三祖爷尝到了久病不愈的滋味，后来逢人就说，真是得不偿失，早知道这样，宁肯当初不搭理那窝小鸡。",vn:"Chân bị thương của ông Ba viêm mãi, đau đến không xuống giường được. Một chàng trai khỏe mạnh cường tráng, sao có thể cứ nằm trên giường? Ông Ba đành đem vàng đổi tiền đi chữa bệnh. Cũng còn may, tiền đổi vàng vừa tiêu hết thì chân ông cũng khỏi. Ông Ba nếm mùi bệnh lâu không khỏi, về sau gặp ai cũng nói: thật là được một mất mười, sớm biết vậy thà lúc đầu đừng đụng tới ổ gà con ấy.",idea:"Được một mất mười.",q:["三祖爷用金子做了什么？他后来怎么想？"],note:[["咋能……呢？","Câu hỏi tu từ, khẩu ngữ."],["宁肯当初不……","Xem Ngữ pháp 4: <span class='zh'>宁肯</span>."]]},{zh:"三祖爷的故事告诫后人，做人不要欲望太多，不要贪婪。东西不是你的就不要去争夺，就是争来，也守不住。倒不如付出一分努力，得到一分收获，过平稳和顺的日子。",vn:"Câu chuyện của ông Ba răn dạy hậu thế: làm người đừng quá nhiều dục vọng, đừng tham lam. Thứ gì không phải của mình thì đừng tranh giành, dù có giành được cũng chẳng giữ nổi. Chẳng bằng bỏ ra một phần công sức, nhận về một phần thành quả, sống những ngày bình ổn hòa thuận.",idea:"Bài học: đừng tham.",q:["这个故事给人们什么启发？"],note:[["就是争来，也守不住","<span class='zh'>就是……也……</span> = dù… cũng…"],["倒不如……","Xem Ngữ pháp 3."]]},{zh:"后来，三祖爷的故事传了一代又一代，宋家的子孙也有做了官的，但没有人敢贪污、贿赂、不择手段，因为他们心里都有一个“金鸡窝”。",vn:"Về sau, câu chuyện của ông Ba truyền từ đời này sang đời khác; con cháu họ Tống cũng có người làm quan, nhưng không ai dám tham ô, hối lộ, bất chấp thủ đoạn, vì trong lòng họ ai cũng có một “ổ gà vàng”.",idea:"Gia phong truyền đời.",q:["为什么宋家的子孙没有人敢贪污？"],note:[["心里都有一个“金鸡窝”","Ẩn dụ kết bài: ổ gà vàng = lời răn trong lòng."]]}]},Object.assign(window.LESSON,{G:[{id:"g1",grp:0,word:"况且",zh:"况且",py:"kuàngqiě",tag:"Chú thích 1 · liên từ",mean:"Liên từ, đứng <b>đầu phân câu sau</b>, biểu thị <b>ngoài lý do đã nêu, bổ sung thêm lý do mới</b> — “hơn nữa, vả lại”. Thường đi với <span class='zh'>又 · 也 · 还</span>.",forms:["lý do 1，况且 + lý do 2（又 / 也 / 还……）"],ex:[["那小鸡仿佛刚出窝没几天，况且是乌黑乌黑的身子，可爱极了。","",1],["这套房子交通方便，附近有书店，况且房租又不贵，真是再合适不过了。","Căn nhà này giao thông thuận tiện, gần hiệu sách, vả lại tiền thuê cũng không đắt, thật không gì hợp hơn."],["……我在石油行业工作了20多年，有份难舍的情感，况且我也热爱自己的专业，还想有所成就。","… tôi làm ngành dầu khí hơn 20 năm, có tình cảm khó rời, hơn nữa tôi cũng yêu chuyên môn của mình, còn muốn làm nên thành tựu."]],tips:["Khác <span class='zh'>何况</span> (huống chi — dùng trong câu phản vấn so sánh mức độ).","Bài tập 2②, 4③."],practice:{q:"为括号里的内容选择适当的位置",type:"pos",items:[["A飞行员驾机到目的地时，B能见度不到500米，C大大低于规定标准，D只有4个马灯照明。（况且该机场没有夜航设备，）","D","……大大低于规定标准，况且该机场没有夜航设备，只有4个马灯照明。"],["这次假期我不想去旅行了，A一来假期短，B二来车票也不好买，C我想好好休息休息，复习复习功课，D也可以在近处玩儿玩儿。（况且假期过后就是考试，）","C","……二来车票也不好买，况且假期过后就是考试，我想好好休息休息……"],["毕竟已年过50，A忙了整整三天，B他突然发现自己双腿已无法站稳，C头痛欲裂，D大家赶紧把他送到了医院。（况且他原本就有心脏病，）","A/B","毕竟已年过50，况且他原本就有心脏病，忙了整整三天，…… (A hoặc B đều được)"]]}},{id:"g2",grp:1,word:"",zh:"大 + thời tiết / thời gian / ngày lễ",py:"dà",tag:"Chú thích 2 · tính từ",mean:"Tính từ <span class='zh'>大</span> đặt trước một số từ chỉ <b>thời tiết, mùa, thời gian, ngày lễ</b> để <b>nhấn mạnh</b> — thường mang ý “đã… như thế (mà còn…)”, hay có <span class='zh'>的</span> theo sau.",forms:["大 + 冬天 / 热天 / 晴天 / 清早 / 周末 / 年初一 + 的，……"],ex:[["他一大清早就不知道忙什么去了。","Mới sáng tinh mơ anh ấy đã đi đâu bận gì không biết."],["大周末的，让人家多睡会儿吧。","Cuối tuần mà, để người ta ngủ thêm chút đi."],["三祖爷颇感诧异，大冬天的，这里离村子又远……","",1]],tips:["Bài tập 4①: <span class='zh'>大晴天，你出门时干吗要带把雨伞呢？</span>"],practice:{q:"下面句子中，指出哪个句子中的“大”和上面讲的意思不一样",type:"pos",items:[["A 大晴天的，带什么雨伞呀！　B 大年初一的，也该好好休息休息啦。　C 哥哥比弟弟大三岁。","C","C — <span class='zh'>大三岁</span> là so sánh tuổi (lớn hơn), không phải nhấn mạnh thời gian."]]}},{id:"g3",grp:2,word:"",zh:"（与其……）倒不如……",py:"dào bùrú",tag:"Chú thích 3",mean:"Biểu thị sau khi <b>so sánh nhiều mặt thì chọn một</b> — “chẳng bằng, thà… còn hơn”. Hay đi với <span class='zh'>与其</span>. <span class='zh'>倒</span> làm ngữ khí nhẹ nhàng, mang ý “trái lại”.",forms:["与其 A，倒不如 B","……，倒不如 B"],ex:[["假期所有的旅游景点都是人山人海，就算能买上车票，也玩儿不好，倒不如在家清清静静看看书，听听音乐。","Kỳ nghỉ điểm du lịch nào cũng đông nghịt, dù mua được vé cũng chơi chẳng vui, chẳng bằng ở nhà yên tĩnh đọc sách nghe nhạc."],["东西不是你的就不要去争夺，就是争来，也守不住。倒不如付出一分努力，得到一分收获，过平稳和顺的日子。","",1],["翻开像册，我不禁肃然起敬，与其说这是一本像册，倒不如说这是他大半生的历史。","Mở cuốn album, tôi không khỏi kính phục: nói đây là cuốn album, chẳng bằng nói đây là lịch sử nửa đời ông."]],tips:["<span class='zh'>与其说A，倒不如说B</span> = nói A chẳng bằng nói B (B chính xác hơn).","Bài 11, 19: <span class='zh'>与其……不如……</span>. Bài tập 4②."],practice:{q:"为句子选择适当的位置：A. 与其说大海是一个安静的少女，　B. 与其天天为钱财奔忙，　C. 你有时间去批评人家，",type:"pos",items:[["（　）倒不如过清贫日子。","B","与其天天为钱财奔忙，倒不如过清贫日子。"],["我渐渐开始明白，要想找出人家的漏洞太容易了，难的是建设一个新的东西出来。（　）倒不如好好琢磨自己能建设什么。","C","你有时间去批评人家，倒不如好好琢磨自己能建设什么。"],["走向大洋深处，我才发现，（　）倒不如说是一只凶猛的怪兽。在看似平静的海面下，时时充满着凶险、恐怖……","A","与其说大海是一个安静的少女，倒不如说是一只凶猛的怪兽。"]]}},{id:"g4",grp:2,word:"宁肯",zh:"宁肯……也（不）……",py:"nìngkěn",tag:"Phó từ · Bài tập 2⑥, 4④",mean:"= <span class='zh'>宁可 · 宁愿</span> (bài 18): <b>thà</b> — sau khi cân nhắc thì chọn cách này.",forms:["宁肯 A，也不 B / 也要 B"],ex:[["早知道这样，宁肯当初不搭理那窝小鸡。","",1],["他宁肯自己吃点儿亏，也不愿让朋友吃亏。","Anh ấy thà mình chịu thiệt chút còn hơn để bạn chịu thiệt."]],tips:["⚠️ 宁 đọc <b>nìng</b>."]},{id:"g5",grp:1,word:"分明",zh:"分明 / 颇",py:"fēnmíng / pō",tag:"Phó từ · Bài tập 2③④",mean:"<span class='zh'>分明</span> = <span class='zh'>明明</span>: <b>rõ ràng là</b> (sự thật hiển nhiên, nhưng…). <span class='zh'>颇</span> = <b>khá, rất</b> (văn viết): <span class='zh'>颇感 · 颇为 · 颇受 · 颇有</span>.",forms:["S + 分明 + V/是……，（怎么 / 却）……","颇 + 感 / 为 / 受 / 有 + ……"],ex:[["三祖爷颇感诧异，大冬天的，……分明不该有这么小的鸡仔呀！","",1],["他分明是朝你这个方向走来的，你怎么没看见他呢？","Rõ ràng anh ấy đi về phía cậu, sao cậu không thấy?"]],tips:["SBT câu 34: <span class='zh'>精美的雕栏分明就是工艺品，施工技巧也颇为后人称道</span>."]},{id:"g6",grp:0,word:"将近",zh:"将近 / 将要",py:"jiāngjìn / jiāngyào",tag:"Xem 辨析 bên dưới",mean:"Đều là phó từ, đều có thể biểu thị <b>sắp đến một thời điểm</b>. <span class='zh'>将近</span> + <b>thời gian / số lượng</b> (gần tới); <span class='zh'>将要</span> + <b>động từ</b> (sắp xảy ra).",forms:["将近 + thời gian / số lượng","将要 + V"],ex:[["农历年将近，宋家三祖爷早早下了地……","",1]],tips:["Bài tập 2①."]}],BX:{grp:0,word:"将近",cols:["将近","将要"],pair:"将近 — 将要",same:["Đều là <b>phó từ</b>, đều có thể biểu thị <b>sắp đến một thời điểm nào đó</b>.","将近 / 将要毕业时，他还没找到工作。"],diff:[["<span class='zh'>将近</span> + <b>từ chỉ thời gian / động từ / tính từ</b>, biểu thị <b>gần tới về thời gian</b>.","将近下午四点时，下了一场大雨。 / 天将近黑了，他怎么还不回来？","<span class='zh'>将要</span> + <b>động từ / cụm động từ / tính từ</b> (rất ít), biểu thị <b>không lâu nữa sẽ xảy ra / thay đổi</b>.<div class='zh' style='margin-top:4px'>下月三号学校将要举办毕业典礼。 / 如果这次不成功，下次将要困难得多。</div>"],["<span class='zh'>将近</span> + <b>cụm số lượng</b>, biểu thị <b>số lượng sắp đạt tới</b>.","这本书将近十万字，不过我一天就看完了。","<b>Không có</b> cách dùng này."]],task:{q:"选择“将近”或“将要”填空",cols:["将近","将要"],sample:!1,items:[["想到今后____在这所名牌大学学习，我心中激动极了。",1,"Trước động từ (学习), việc sắp xảy ra → 将要."],["中国有____四千年的有文字记载的历史。",0,"Trước số lượng (四千年) → 将近."],["他每天都学习到____半夜，真令人佩服。",0,"Gần tới thời điểm (半夜) → 将近."],["如果经济状况不改善，不少工人____面临失业。",1,"Trước động từ (面临) → 将要."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["欲<u>望</u>","愿望 · 希望 · 失望 · 盼望"],items:[["<u>富</u>裕","富","富有 · 富翁 · 富商 · 丰富"],["<u>隐</u>蔽","隐","隐藏 · 隐约 · 隐讳 · 隐忍"],["<u>贪</u>婪","贪","贪污 · 贪欲 · 贪心 · 贪图"],["<u>争</u>夺","争","争取 · 争抢 · 争论 · 争吵"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["他们夫妻快到40岁才有了这个孩子，所以特别疼爱。→ ________","将近","他们夫妻将近40岁才有了这个孩子，所以特别疼爱。"],["上海那么大，再说你又不知道地址，怎么能找到他呢？→ ________","况且","上海那么大，况且你又不知道地址，怎么能找到他呢？"],["他对中国京剧非常感兴趣，所以参加了一个京剧培训班。→ ________","颇","他对中国京剧颇感兴趣，所以参加了一个京剧培训班。"],["很明显他是喜欢你的，你怎么感觉不到呢？→ ________","分明","他分明是喜欢你的，你怎么感觉不到呢？"],["假期我们一起去欧洲玩儿一趟，怎么样？→ ________","咋","假期我们一起去欧洲玩儿一趟，咋样？"],["为了安全，我宁愿绕远儿走大路。→ ________","宁肯","为了安全，我宁肯绕远儿走大路。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["勤俭","将近","祖父","富裕","废寝忘食"],text:"我的{祖父}在{将近}三十岁时才找到第一份工作，他很珍惜这个机会，每天{废寝忘食}地工作。加上祖母很{勤俭}，家里的日子渐渐{富裕}起来。"},{bank:["坑","瘸","膝盖","扎","侥幸"],text:"上周的一个晚上，我骑着自行车回家，不小心掉进了一个大{坑}，爬起来一看，原来是附近种树的人挖的。{膝盖}摔破了，手也被{扎}破了，鲜血直流，还算{侥幸}，骨头没事。我只好推着自行车一{瘸}一拐地走回了家。"}]},EX4:{q:"为括号里的词语选择适当的位置",type:"pos",vn:"Bấm chữ cái A–D chỉ vị trí đúng của từ trong ngoặc.",items:[["A晴天，B你出门时C干吗要D带把雨伞呢？","A","大晴天，你出门时干吗要带把雨伞呢？","大"],["与其A一个人生气，B不如C找个朋友D说出来更好。","B","与其一个人生气，倒不如找个朋友说出来更好。","倒"],["A父亲年龄大了，B身体也不好，C我不放心D他一个人去旅行。","B","父亲年龄大了，况且身体也不好，我不放心他一个人去旅行。","况且"],["他A自己吃点儿亏，B也不愿C让朋友D吃亏。","A","他宁肯自己吃点儿亏，也不愿让朋友吃亏。","宁肯"],["他A朝你这个方向B走来的，C你怎么D没看见他呢？","A","他分明朝你这个方向走来的，你怎么没看见他呢？","分明"]]},EX5:{q:"根据提示，简述课文主要内容",rows:[["姥姥村里的人把什么称为“金鸡窝”？描述一下金鸡窝的样子。","① 大石头、凹陷、鸟窝 ② 古怪、红色、镶嵌……小石头、像……、美观别致","村东池塘畔有一块椭圆形的大石头，中间凹陷，像个鸡窝。它外表古怪，红色的石头上镶嵌着不同色彩、不同形状的小石头，像件工艺品，美观别致。"],["传说 · 背景 / 时间 / 人物","宋家几兄弟、起早贪黑、废寝忘食、勤劳勤俭、日子富裕 · 农历年将近 · 宋家三祖爷","宋家几兄弟起早贪黑、废寝忘食，勤劳勤俭，日子过得还算富裕。农历年将近的时候，宋家三祖爷下了地……"],["传说 · 事情经过 ①②","发现一窝小鸡 / 捉小鸡，小鸡变金子","他突然看到一窝乌黑的小鸡跟着母鸡找食。大冬天的，分明不该有小鸡。他拣起一块砖撇过去，砸中一只小鸡，小鸡瞬间变成了一块金子。"],["传说 · 事情经过 ③④","三祖爷受伤 / 再次找小鸡，没找到，发现大石头","老母鸡在他膝盖下啄了一口，他只好拄着树枝一瘸一拐地回了家。家里人赶到地里挖了个大坑，没找到鸡，只挖出了一块像鸡窝的大石头。"],["传说 · 事情经过 ⑤","三祖爷治疗受伤的腿","三祖爷的腿一直发炎，只好用金子换钱看病。钱用完了，腿也好了。他逢人就说真是得不偿失。"],["这个故事给人们的启发","不要欲望太多，不要贪婪","做人不要欲望太多，不要贪婪。东西不是你的就不要去争夺，就是争来，也守不住。"]]},DP:{title:"词汇：看图片，熟悉下列名词",vn:"8 danh từ thường gặp kèm cách kết hợp.",items:[["皮革","pígé","da thuộc","皮革包","他在皮革厂工作。"],["钻石","zuànshí","kim cương","一颗钻石","这件首饰非常昂贵，上面镶满了钻石。"],["哨","shào","cái còi","吹哨","足球场上裁判员吹哨的动作很帅。"],["启事","qǐshì","thông báo, mẩu tin","寻物启事","墙上贴着一张寻物启事。"],["油漆","yóuqī","sơn","刷油漆","用油漆刷墙。"],["炊烟","chuīyān","khói bếp","升起炊烟","傍晚时，村子里家家升起了炊烟。"],["证书","zhèngshū","giấy chứng nhận","荣誉证书","上学期间他获得了不少荣誉证书。"],["火焰","huǒyàn","ngọn lửa","一团火焰","红色的火焰让人感觉很温暖。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"近日，假冒劣质酱油横行市场，究其原因，酱油的好坏优劣，广大消费者很难辨别，不法分子就利用这一点，不择手段进行非法生产，鱼目混珠，以假充真，坑害消费者。",o:["谁也没本事分辨出酱油的好坏","伪劣酱油进入市场系偶然现象","造假者以劣质酱油冒充好酱油","造假者修改了酱油的技术标准"],a:2,why:"“以假充真” = lấy giả làm thật. A sai: chỉ “很难辨别”."},{n:2,say:"那年，父亲因病医治无效，与世长辞。他在悲痛之余，除发奋读书外，为奉养母亲，还须觅一份工作。适逢邮局登报招考邮递员，他便报名应试，侥幸被录取。于是他一边工作，一边读书，虽然紧张，却也不觉得苦。",o:["父亲得的是不治之症","他一边读书一边工作","他喜欢邮递员的工作","他参加了报社的考试"],a:1,why:"“他一边工作，一边读书”. D: thi vào <b>bưu điện</b>, báo chỉ đăng tin."},{n:3,say:"红灶鸟以搭建奇异的“面包烤炉”而著称。所谓“面包烤炉”并不是真正烤面包的，而是红灶鸟所建的椭圆形鸟巢。鸟巢呈红色，坚硬结实，形状像炉子，当地人称它为“面包烤炉”，红灶鸟也因此得名“面包师”。",o:["红灶鸟也被叫作“面包师”","红灶鸟做的面包烤炉很耐用","红灶鸟住在废弃的面包炉里","红灶鸟喜欢住在面包房附近"],a:0,why:"“红灶鸟也因此得名‘面包师’”."},{n:4,say:"面试官说他们那儿需要的是高级管理人才，问李辉除了自己的本行外，对其他行业还有什么了解？李辉心中暗想，今天面试八成要砸锅。好在平时常看报纸杂志，对当前经济形势、变化趋势略知一二，于是便想到哪儿说到哪儿。",o:["面试官故意给李辉出难题","对经济李辉多少算个内行","李辉估计今天的面试要失败","面试时李辉想说什么就说什么"],a:2,why:"<span class='zh'>八成要砸锅</span> = tám phần sẽ hỏng. D chưa đúng ý: <span class='zh'>想到哪儿说到哪儿</span> là nói ứng biến dựa vào hiểu biết có sẵn, không phải “muốn nói gì thì nói”."},{n:5,say:"他是收藏家。然而，他的收藏品并不是在豪宅密室里，而是在名胜古迹之间、青山绿水之畔。瑞士最好的宾馆是他的，纽约曼哈顿也有摩天写字楼归他所有。他的大名是卡尔·海因茨·基普。",o:["基普非常喜欢旅游","基普的住所很豪华","基普“收藏”建筑","基普的办公室在纽约"],a:2,why:"“Bộ sưu tập” của ông là khách sạn, cao ốc → sưu tầm <b>công trình</b>."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：严老师，“家风”是中国人长久关注的一个话题，今天您能不能在这儿跟我们一起分享一下您的研究成果？\n男：好啊。\n女：还是请您先给我们说说什么是“家风”。\n男：“家风”指一个家庭或家族在长期的生活中，逐步形成的被家庭、家族成员认可，而且共同遵守的生活方式、生活习惯、审美观点、价值取向、精神追求等等方面的总和。\n女：那看来，家风对每个家庭成员的影响都是巨大的。\n男：对，长期生活在一个特定的家庭，耳濡目染，每个家庭成员必然会不知不觉地受到家风的影响，言行举止，性格气质，必定会带有这个家庭家风的特征，也会自觉不自觉地朝着家庭所希望的方向发展。良好的家风可以使家人朝积极的方向发展，不良的家风会引导家人走上邪路。家风对我们每个人都是一种无言的教育，影响每个家庭成员的心灵，特别是孩子。\n女：我们发现，有时候孩子有了问题，家长会责怪孩子、责怪老师，也许家长最应该的是反省一下自己。\n男：您说得没错。\n女：我想，家风对社会的影响也是不可忽视的。\n男：对，因为家庭不是孤立于社会之外的，家庭和社会生活息息相通。家风好，会对良好社会风气的形成发挥积极的作用，家风不好，会给社会风气造成污染。\n女：确实如此。\n男：古人历来重视家风的培养、建设，把家风的延续看作是很严肃的事情。\n女：那古时候家风的传承有什么方式啊？\n男：有的家庭靠言传身教，还有的家庭以“家训”的方式形成文字。比如，宋朝史学家司马光就给儿子写过一篇短文，告诉儿子即使生活富裕了，也要节省，还要把节俭的家风传给子孙后代。宋朝政治家包拯把家风视为家族的头等大事。他的家训只有三十七个字，大意是说“后代子孙为官者中，如有因贪污而撤职的人，死后不许埋入祖坟，如违背了我的志向，就不是我的子孙后代。”\n女：真是旗帜鲜明啊！",qs:[{n:6,q:"以下哪一项是“家风”具有的特点？",o:["在一个家族中世代相传","家庭成员都欣赏的风格","当时社会崇尚的价值观","引导社会发展的审美观"],a:0,why:"“在长期的生活中，逐步形成的……共同遵守”; cổ nhân coi trọng <span class='zh'>延续 · 传承</span>."},{n:7,q:"家风对每个家庭成员的影响是怎样的？",o:["有家庭成员感觉不到家风","有人不想接受家风的影响","无形中就会受到家风影响","家风不能影响年轻人的发展"],a:2,why:"“耳濡目染……不知不觉地受到家风的影响”."},{n:8,q:"家风不好会对家庭成员产生怎样的影响？",o:["没有生活目标","走上错误道路","没有反思精神","有问题怪别人"],a:1,why:"“不良的家风会引导家人走上邪路”."},{n:9,q:"家风与社会风气之间是什么关系？",o:["社会风气好会影响家风传承","家风与社会风气关系不太大","家风好坏是每个家庭的私事","家风会影响社会风气的建设"],a:3,why:"“家风好，会对良好社会风气的形成发挥积极的作用”."},{n:10,q:"关于古代家风，下列哪项正确？",o:["家家都以文字形式的家训传承","司马光很有钱却告诫后代节俭","家训中常提到不可助贿赂之风","宋代包拯把为官不贪作为家训"],a:3,why:"Gia huấn 37 chữ của Bao Chửng: con cháu làm quan tham ô thì không phải con cháu ta."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"亲情在我心中一直占有重要的位置，普天之下唯有父母为子女付出而不求回报。在我成长的过程中，父母给了我很多指导，可当时，我总是不明白他们的苦心。记得小时候，我特别喜欢看动画片，常常窝在家里不出去，一看就是一整天。妈妈在旁边看着心疼，提醒我要爱惜眼睛多运动，把我唠叨烦了，我就会冲妈妈发火，完全不顾妈妈的感受。直到后来戴上了厚厚的眼镜，我才后悔，那时候，咋就不听妈妈的话呢！\n我们就是这样，每逢路走歪了，父母好心来管，就会习惯性地反抗。还有人更过分，把父母的付出当作是理所当然，甚至认为，是父母把自己带到了这个世界上，就应该让自己从小浸泡在幸福之中，生活得无忧无虑，好像是父母该自己的。",qs:[{n:11,q:"关于父母，可以知道什么？",o:["总担心孩子出门会迷路","不懂得管教孩子的方法","没指望将来孩子对自己好","不想明白孩子心里想什么"],a:2,why:"“唯有父母为子女付出而不求回报”."},{n:12,q:"说话人后悔什么？",o:["小时候没有认真学习","小时候不听妈妈的话","小时候没有好好锻炼身体","小时候不明白父母的辛苦"],a:1,why:"“咋就不听妈妈的话呢！”"},{n:13,q:"有人更为过分的行为指什么？",o:["对物质生活要求太高","经济上始终不能独立","总觉得自己生活得不幸福","认为父母为自己做什么都是应该的"],a:3,why:"“把父母的付出当作是理所当然”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"一只兔子常常大晚上的抱着膝盖坐在树下欣赏夜空。月亮圆时，它很快乐：“瞧，月亮像一面镜子，多美啊！”月亮缺时，它也很快乐：“哈，月亮像一只美味的香蕉，真有趣！”月亮隐蔽在乌黑的云团后面，它仍然快乐：“看，星星代替月亮来陪伴我了。”\n神见这只兔子如此爱月亮，就对它说：“既然你喜欢月亮，我就把月亮送给你。”兔子高兴极了：“您是说，从此以后月亮就属于我了？”“对，它只属于你。”兔子高兴得都快哭了。\n然而没有多久，快乐的兔子就变得不快乐了。月亮圆时，它担心月光会招来与它争夺月亮的对手；月亮缺时，它疑惑是否有人偷走了一块；乌云蔽月，它生怕月亮被云夺走。总之，兔子变得心事重重。\n兔子问老树：“为什么我得到了，反而不快乐了呢？”老树回答：“因为你总是在想，这是我的月亮！”“对呀，月亮不属于我的时候，我是真心地欣赏它，我得到了月亮，就有了独占它的欲望，其实，从前的月亮和现在的月亮没什么区别。嗨，这不就是贪婪带来的苦恼吗！”兔子彻底醒悟了。",qs:[{n:14,q:"兔子怎么看待月亮？",o:["月圆时，它像镜子","月缺时，它像云团","星星很听月亮的话","月亮累了星星才来"],a:0,why:"“瞧，月亮像一面镜子”. Bài có <span class='zh'>大晚上的</span> (Ngữ pháp 2!)."},{n:15,q:"神把月亮给了兔子，兔子是什么心情？",o:["开心","烦躁","犹豫","得意"],a:0,why:"“兔子高兴得都快哭了”."},{n:16,q:"得到了月亮的兔子为什么变得不愉快？",o:["有了和它争夺月亮的对手","它每天都生活在不安之中","月亮被偷走的事防不胜防","它害怕自己保护不了月亮"],a:1,why:"Lo đủ thứ → <span class='zh'>心事重重</span>. A sai: chỉ <b>lo</b> có đối thủ."},{n:17,q:"兔子最后悟出了什么道理？",o:["月亮根本不可能属于自己","月亮永远都应该属于天空","害怕失去月亮是贪心使然","明白道理就不会再苦恼了"],a:2,why:"“这不就是贪婪带来的苦恼吗！”"}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["在中国古代诗歌里，“访友”历来就是一个不衰的题材。","过度运动的宽泛定义是，每天进行数小时的高强度运动。","“空间碎片”，即太空垃圾，落到地面，后果将不可思议。","古往今来，从平民百姓到名人大家，粥都被视为很好的营养品。"],a:2,why:"<b>Dùng từ sai</b>: hậu quả “không thể tưởng tượng” (xấu) phải là <span class='zh'>不堪设想</span>; <span class='zh'>不可思议</span> = khó tin (bài 18)."},{n:19,o:["对于城市人的生活，公共汽车仍然是主要的公共交通工具。","每次想到一辈子省吃俭用、日日辛劳的妈妈，心里就不是滋味。","西汉海昏侯墓经过5年的考古挖掘，近日取得了重大阶段性成果。","据说智能拐杖具有收音机、与他人手机连接、实现实时报警等功能。"],a:0,why:"<b>Giới từ dùng sai</b>: → <span class='zh'>对于城市人来说</span> / <span class='zh'>在城市人的生活中</span>."},{n:20,o:["农历是中国汉族传统历法，又有夏历、汉历、华历之称。","他躺在草地上，贪婪地享受着温暖的阳光，一动也不想动。","虽然我还没遇到过这种令人气愤的事，竟然被我妈妈遇到了。","人们很喜欢椭圆形，但并不是每个人都知道在已知的尺寸下椭圆怎么画。"],a:2,why:"<b>Quan hệ từ dùng sai</b>: <span class='zh'>虽然……竟然……</span> không thành cặp → <span class='zh'>我还没遇到过……，这种事竟然被我妈妈遇到了</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"李教授每一___科研成果的取得，大约都要花三四年的时间，___连轴转早已不成“新闻”，靠的就是全身心的___。",o:["个　夜以继日　参加","份　披星戴月　参与","项　废寝忘食　投入","页　不眠不休　加入"],a:2,why:"<span class='zh'>一项成果</span>; <span class='zh'>废寝忘食</span> (từ mới!); <span class='zh'>全身心的投入</span>."},{n:22,text:"女儿在银行有一间___的办公室，房门上镶嵌着印有她的名字和职称的牌子，办公桌上摆放着制作___、印着她的名字和职称的名片牌架，她可以和老板___一个秘书。这一切，都使女儿感到她工作的___。",o:["独自　优美　公用　严肃","单独　精美　共用　庄重","孤立　精良　合用　郑重","孤单　美观　专用　持重"],a:1,why:"<span class='zh'>单独的办公室</span>; <span class='zh'>制作精美</span>; <span class='zh'>共用一个秘书</span>; <span class='zh'>工作的庄重</span>."},{n:23,text:"老年人节约，大多___两个原因：一是多年节省的习惯难以改变，二是___想着造福子孙，为儿女积累未来。表面看，老人的想法也是人之常情，但细细分析___就会明白，老人这样做往往___。",o:["起因　及时　以后　无以回报","渊源　随时　之后　贪小失大","由于　即刻　一遍　因小失大","源于　时刻　一下　得不偿失"],a:3,why:"<span class='zh'>源于……原因</span>; <span class='zh'>时刻想着</span>; <span class='zh'>分析一下</span>; <span class='zh'>得不偿失</span> (từ mới!)."}]},read3:{ins:"第24–28题：选句填空。",text:"从前，有个农民，一辈子以砍柴为生。老人有两个儿子，一天，他把两个儿子叫到跟前，说：“我老了，(24)，以后砍柴卖柴的事就交给你们了。门后有柴刀，你们自己选，然后上山去砍柴吧。”\n哥俩各自挑了把柴刀，准备上山。哥哥边走边想：我宁愿累点儿也要多砍点儿柴，让父亲高兴，也让小弟佩服。弟弟却想：(25)，还净是缺口，我得先磨刀。\n弟弟找了块磨刀石吭哧吭哧地磨起了刀。哥哥走累了，坐在山坡上，自言自语道：“这小子，还不来砍柴，(26)。”\n弟弟磨好了刀，已经是下午了，他想：“我得快点儿了，哥哥可能都砍一大堆了。”弟弟急忙上了山，由于心里着急，干得格外卖力，况且那刀磨了一上午，锋利无比，不一会儿，弟弟就砍了满满两担。(27)，将近傍晚，累得满头大汗，却只砍了一小担柴。\n这就是“磨刀不误砍柴工”的故事，它告诉我们，要办好一件事，就要先做好准备，(28)，但时间不会白花，因为准备得好会大大提高办事效率。",opts:["哥哥却因为刀太钝","体力不支了","真能磨蹭","这刀好久没磨了不说","虽然准备工作也要花费时间"],ans:{24:1,25:3,26:2,27:0,28:4}},read4:[{ins:"第29–32题：请选出正确答案。",text:"你有没有发现一个有意思的现象，大家聚到一起，抱怨的话题是最多的。\n女人凑到一起，有人说孩子不听话，越来越难管，让人烦透了；有人说婆婆难伺候，自己如何付出，总换不来她一个笑脸；有人说丈夫整天在外面瞎忙，连结婚纪念日都忘了，更别说有礼物相送了。男人聚到一块儿抱怨分配不公、空气不好、坑人的领导老不给涨工资，好像没什么顺心事。\n其实，生活根本没那么差劲，只是有些不如意被人们放大了，好比一件光鲜的衣服，外表落上点儿尘土本是常有的事，把尘土掸一掸，怨天尤人一番，减轻了压力，自己心里就舒服了，然后照样开开心心地过日子。一边抱怨，一边热爱，这就是人生。\n不信你看，那些抱怨完的女人马上相约逛街，烦恼立刻撇在了一边，心情瞬间就好了起来。那些抱怨工资少的男人，领导一个电话，立即进入工作状态，全力以赴，没有丝毫迟疑。\n那，既然热爱，为什么还要抱怨呢？其实，每个人的生活都有无法避免的小烦恼，之所以抱怨，只是希望生活会越来越好，越来越接近理想中的样子。抱怨是人的天性，适度抱怨，可以丢掉心中的负能量，让生活变得更快乐。生活就像一件华衣，人们穿在身上，要时不时抖一抖上面的尘土，心灵才不会积累太多的灰色。",qs:[{n:29,q:"第2段画线词语“坑人”的意思是：",o:["擅用欺骗手段发不义之财","不好好经营，致使员工受损","用不光明的手段使人受到损害","对工作不负责任，对员工缺乏爱心"],a:2,why:"<span class='zh'>坑人</span> = dùng thủ đoạn mờ ám làm hại người (<span class='zh'>坑</span> — từ mới bài này!)."},{n:30,q:"关于女人，下列哪项正确？",o:["对孩子期望值过高","常常跟丈夫赌气","每天抱怨后都会去逛街","抱怨过后依然热爱生活"],a:3,why:"“烦恼立刻撇在了一边，心情瞬间就好了起来”; “一边抱怨，一边热爱”."},{n:31,q:"人们为什么会有如此多的抱怨？",o:["适度释放以求减轻压力","生活中不如意的事太多","男人越来越没有责任感","女人对于生活太过挑剔"],a:0,why:"“怨天尤人一番，减轻了压力”; “适度抱怨，可以丢掉心中的负能量”. B sai: “生活根本没那么差劲”."},{n:32,q:"最适合做上文标题的是：",o:["人生多点儿正能量","这是理想的生活吗？","一边抱怨，一边热爱","生活本如此，抱怨也没用"],a:2,why:"Câu chủ đề: “一边抱怨，一边热爱，这就是人生”."}]},{ins:"第33–36题：请选出正确答案。",text:"“工匠精神”包含两层含义，一是世人对工匠精雕细琢、一丝不苟精神的赞美，二是全社会对能工巧匠发自肺腑的敬意。中国历史上不乏能工巧匠，也不缺少工匠精神，比如建造了赵州桥的隋代工匠李春，再比如鲁班。\n赵州桥位于今河北省赵县城南的洨河上，是中国现存最早的大型石拱桥，也是世界上现存最古老、跨度最长的敞肩圆弧拱桥。赵州桥整桥都用石块建成，共用石块1000多块，每块重达1吨，桥上装有精美的石雕栏杆，雄伟壮丽、精巧别致。赵州桥首创了敞肩拱结构形式，精美的雕栏分明就是工艺品，施工技巧也颇为后人称道，在中外建桥史上令人瞩目。\n鲁班称得上是中国尽人皆知的能工巧匠。他出身于世代工匠家庭，从小就跟随家里人参加土木建筑工程，在实践中积累了丰富的经验。鲁班不仅是一位出色的木工，也是一位最负盛名的建筑师，还发明了很多工具。\n传说，一天鲁班到山上去寻找木料，突然脚下一滑，他一把抓住了路旁的一丛草，立时，鲜血流了出来，手被划破了。“这不起眼的草怎会这么锋利！”他不顾伤口的疼痛，拣起一棵草仔细端详起来。他发现小草叶子边缘长着许多锋利的小齿。他用这些密密的小齿在手背上轻轻一划，居然划出了一个口子。他想：我倒不如模仿树叶做个工具，用它切割木头，说不定比现在的斧头好用。于是，鲁班请铁匠打出了边缘带有锋利小齿的铁片，拿到山上一试，果然，很快就把树木切割断了。鲁班给这种新发明的工具起了个名字，叫“锯”。",qs:[{n:33,q:"关于“工匠精神”，下列哪项正确？",o:["中国的能工巧匠太少","世人对工匠表示尊敬","人们只关注工匠的技术","中国工匠精神有待发扬"],a:1,why:"“全社会对能工巧匠发自肺腑的敬意”. A sai: <span class='zh'>不乏</span> = không thiếu."},{n:34,q:"李春建造的赵州桥：",o:["整座桥上没用一块砖","是世界上最古老的桥","施工技巧得到后人的赞美","按工艺品的标准制作雕栏"],a:2,why:"“施工技巧也颇为后人称道”. B: là cầu vòm vai hở cổ nhất (không phải cầu cổ nhất)."},{n:35,q:"第3段画线词语“负”的意思是：",o:["享有","负担","辜负","缺少"],a:0,why:"<span class='zh'>负盛名</span> = hưởng danh tiếng lớn → <span class='zh'>享有</span>."},{n:36,q:"关于“锯”，下列哪项正确？",o:["鲁班看见草想起了要使用锯","鲁班在草的启发下发明了锯","鲁班上山去寻找造锯的思路","鲁班觉得斧头不好用才造锯"],a:1,why:"Lá cỏ có răng sắc → mô phỏng làm cưa. Có <span class='zh'>倒不如</span> (Ngữ pháp 3!)."}]}]},W:{zh:"写作",vn:"Viết văn: 争来的东西守不住",t:"35 phút",min:!0,task:"这篇课文告诉我们这样一个道理“做人不要欲望太多，不要贪婪。东西不是你的就不要去争夺，就是争来，也守不住。倒不如付出一分努力，得到一分收获。”在你们国家也有这样的传说或故事吗？请参照练习5讲一个类似的故事，可以从故事发生的时间、地点、背景、事情经过、给人的启发等几方面来讲述，请以“争来的东西守不住”为题，字数不少于400字。",target:400,steps:[["Chọn truyện","Một truyện dân gian nước bạn về lòng tham — VD: “Ăn khế trả vàng”, “Sự tích con muỗi”…"],["Bối cảnh","Thời gian, địa điểm, nhân vật: <span class='zh'>从前 · 很久以前 · 有一家兄弟俩……</span>"],["Diễn biến","Theo trình tự; dùng <span class='zh'>将近 · 况且 · 分明 · 颇 · 大……的</span>."],["Kết cục","Kẻ tham bị trừng phạt: <span class='zh'>得不偿失 · 宁肯当初……</span>"],["Bài học","<span class='zh'>东西不是你的就不要去争夺……倒不如……</span>"]],outline:[["一 · 背景","时间、地点、人物"],["二 · 起因","好人得到好报"],["三 · 经过","坏人眼红、争夺"],["四 · 结果","贪心的下场"],["五 · 启发","争来的东西守不住"]],model:"争来的东西守不住\n越南有一个流传很久的故事，叫“吃了杨桃还金子”。\n从前，有兄弟俩，父母去世以后，贪婪的哥哥把家里的房子、田地都争夺了过去，只给弟弟留下了一棵杨桃树。弟弟没有抱怨，每天废寝忘食地干活，日子过得虽然不富裕，但很平稳。\n有一年，杨桃将近成熟的时候，飞来了一只大鸟，每天都来吃树上的杨桃。弟弟颇感心疼，对大鸟说：“你吃了我的杨桃，我一家人就没有东西吃了。”没想到大鸟开口说话了：“吃一个杨桃，还你一块金子。你缝一个三拃长的口袋，跟我去拿吧。”弟弟照做了，大鸟把他带到海中的一个小岛上，岛上分明全是金子。弟弟只装满了小小的口袋，就跟着大鸟回家了。从此，他过上了富裕的生活。\n哥哥知道以后，非要用自己的房子和田地换弟弟的杨桃树。大鸟又来了，哥哥缝了一个十二拃长的大口袋，到了岛上，拼命往口袋里装金子，况且他还在衣服里也塞满了金子。大鸟飞到海上，背上太重，翅膀一歪，哥哥连同金子一起掉进了大海。\n这个故事告诉我们，做人不要贪婪。东西不是你的就不要去争夺，就是争来，也守不住，反而得不偿失。倒不如踏踏实实地付出一分努力，得到一分收获，这样的日子才过得安心。",check:["Có tiêu đề “争来的东西守不住”","Có thời gian / địa điểm / nhân vật","Diễn biến rõ ràng theo trình tự","Có kết cục của kẻ tham","Có câu nêu bài học","Dùng ít nhất 4: 将近 · 况且 · 颇 · 分明 · 倒不如 · 得不偿失 · 贪婪 · 争夺","Không ít hơn 400 chữ"],exam:{target:400,ins:["仔细阅读下面这篇文章，时间为10分钟，阅读时不能抄写、记录。","10分钟后，收起阅读材料，请你将这篇文章缩写成一篇短文，时间为35分钟。","标题自拟。只需复述文章内容，不需加入自己的观点。","字数为400左右。"],text:"对于吕重华来说，今天是个特殊的日子，他做梦都没想到，《订单·方圆故事》获得了国际大奖。用吕重华的话说，这实属意外，这书原本就是想传给子孙的。\n《订单·方圆故事》写的是“方圆工艺美术社”自己的故事，该书的作者就是吕重华——这家书店的老板。\n编写这本书的源起要追溯到5年前的北京图书订货会。吕重华的好友张东说他有一个想法：出一本关于吕重华订单的书。\n张东所说的订单，办书店的人天天都要打交道。在互联网与电子邮件还未普及的年代，书店需要购进哪些书的书目，都要以传真的方式给出版社发送订单，告知书名与册数，催促出版社发书。\n出版社发行人员变动很大，对常年与出版社打交道的吕重华来说，总要面对新的发行人员，并要尽快与他们建立关系与信任。对美术，而非经商出身的吕重华来说，这着实是件令他头痛的事。\n吕重华平素爱画速写漫画。一天他突发奇想，签署每一份订单时，在落款处画一幅漫画自画像，以取代图章。吕重华的每一幅自画像都有意注入自己的情绪，如果心情愉悦，纸面上呈现的就是一张笑脸。如果烦心恼怒，眉毛直立、龇牙咧嘴的形象立即活灵活现。这个习惯一坚持就是十几年，吕重华的自画像变成了人见人爱的名片，通过传真发送到各大出版社的发行办公室。有人劝他刻个章，省时省力。他却坚持手绘，以达到每个漫画像都不一样。\n十几年，这个独特的标记在图书发行圈内成了吕重华鲜明的标识。他的传真一传到办公室，大家就都知道是那个家伙又来订单了，还知道他当时心情的好坏。\n十多年下来，吕重华积攒的传真底稿有5000多张，两尺厚，嬉笑怒骂，岁月流逝，在订单中都留下了独有的记忆。\n5000多张，要不是一天一天坚持下来，现在让他画，他肯定不敢接这个活儿，吕重华抚摸着《订单·方圆故事》不禁感叹。\n线装、纸本、书法、印章、竖排、中式漫画……这本书的成功，除了吕重华千姿百态、趣味横生的自画像外，美术编辑极富创意地把这些文化元素巧妙地合成在一本书上，也是它吸引人的关键。\n好书就是这样，它需要一天一天的积累，需要水滴石穿的功夫，积累得足够，它就有了深度，有了超越一切的魅力。其实，做别的事情又何尝不是如此呢！",model:"订单上的自画像\n吕重华是“方圆工艺美术社”书店的老板。他写的《订单·方圆故事》获得了国际大奖，这让他非常意外，因为这本书原本只是想传给子孙的。\n写这本书的想法来自5年前，他的好友张东建议他出一本关于订单的书。在互联网还不普及的年代，书店要用传真给出版社发订单。出版社的发行人员经常变动，吕重华总要和新人建立关系与信任，这让学美术出身的他很头痛。\n吕重华平时爱画漫画。有一天，他突发奇想，在每份订单的落款处画一幅自画像来代替图章。心情好时画一张笑脸，心情不好时画一张生气的脸。这个习惯他坚持了十几年，自画像成了他人见人爱的名片。有人劝他刻个章，他却坚持手绘，让每张画都不一样。时间长了，出版社的人一看到传真，就知道是他来订书了，还能知道他当时的心情。\n十几年下来，他积攒了5000多张传真底稿，记录了他的喜怒哀乐。这本书用线装、书法、印章、竖排等中国文化元素，把这些自画像巧妙地合在了一起，所以受到了大家的欢迎。\n好书需要一天一天的积累，做别的事情也是这样。"}},SUM:{words:["窝","椭圆","镶嵌","坚硬","美观","别致","浸泡","责怪","废寝忘食","勤俭","富裕","将近","况且","跟随","寻觅","颇","分明","隐蔽","扎","拣","砸","膝盖","拐杖","拄","瘸","挖掘","坑","发炎","咋","侥幸","滋味","逢","得不偿失","宁肯","告诫","欲望","贪婪","争夺","贪污","贿赂","不择手段"],patterns:[["……，况且 + lý do bổ sung","那小鸡仿佛刚出窝没几天，况且是乌黑乌黑的身子……"],["大 + 冬天 / 周末…… + 的","大冬天的，这里离村子又远……"],["（与其……）倒不如……","……倒不如付出一分努力，得到一分收获。"],["宁肯……（也不……）","早知道这样，宁肯当初不搭理那窝小鸡。"],["分明 · 颇感","三祖爷颇感诧异……分明不该有这么小的鸡仔呀！"]],diff:["将近 + thời gian / số lượng (gần tới) — 将要 + động từ (sắp xảy ra); 将近 có thể + số lượng, 将要 thì không","撇 piě (ném) · 扎 zhā · 瘸 qué · 咋 zǎ (phương ngữ = 怎么) · 宁肯 nìng · 拣 = 捡 · 不可思议 (khó tin) ≠ 不堪设想 (hậu quả xấu khôn lường)"],sentences:["东西不是你的就不要去争夺，就是争来，也守不住。","倒不如付出一分努力，得到一分收获，过平稳和顺的日子。","宋家的子孙也有做了官的，但没有人敢贪污、贿赂、不择手段，因为他们心里都有一个“金鸡窝”。"],hw:["Học thuộc 51 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “争来的东西守不住” ≥400 chữ (mục 7).","Luyện đề 缩写: đọc bài về Lã Trọng Hoa 10 phút rồi viết lại ~400 chữ.","Làm Sách bài tập bài 20.","Ôn tập toàn bộ HSK6 (上) — bài 1–20."]}});
