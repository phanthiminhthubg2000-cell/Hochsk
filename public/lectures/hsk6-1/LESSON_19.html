<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 19 · 无阳光的深海世界 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

13,"贝壳","bèiké","dt.","bối xác","vỏ sò, ốc xà cừ",1,"","贝类的硬壳。","蛤、蚌、蟹、贝壳","孩子们在海边捡贝壳。","Bọn trẻ nhặt vỏ sò trên bãi biển.",[],""],[14,"诧异","chàyì","tt.","sá dị","rất kinh ngạc",1,"","觉得十分奇怪。","科学家深感诧异","听到这个消息，大家都很诧异。","Nghe tin này, mọi người đều rất ngạc nhiên.",["深感诧异"],"Bài tập 3②."],[15,"样品","yàngpǐn","dt.","dạng phẩm","hàng mẫu, mẫu vật",1,"","作为标准，供人看的物品。","从深海带回的样品","请把样品寄给我们看看。","Hãy gửi mẫu cho chúng tôi xem.",[],""],[16,"刺","cì","đgt.","thứ","đâm, chọc; kích thích",1,"","尖的东西进入或穿过物体；刺激。","刺鼻臭蛋气味","这种气味很刺鼻。","Mùi này rất hắc (xộc mũi).",["刺鼻","刺眼"],""],[17,"气味","qìwèi","dt.","khí vị","mùi",1,"","鼻子可以闻到的味儿。","刺鼻臭蛋气味","房间里有一股奇怪的气味。","Trong phòng có một mùi lạ.",[],""],[18,"恍然大悟","huǎngrán dà wù","thành ngữ","hoảng nhiên đại ngộ","bỗng nhiên tỉnh ngộ",1,"成","形容一下子明白过来。","科学家恍然大悟","听了老师的解释，我才恍然大悟。","Nghe thầy giải thích, tôi mới vỡ lẽ.",[],"Bài tập 3②. SBT câu 17."],[19,"进而","jìn'ér","liên.","tiến nhi","rồi tiến tới, sau đó",1,"书","在已有的基础上进一步。","进而提出了这样的假说","先学好基础，进而深入研究。","Học vững nền tảng rồi tiến tới nghiên cứu sâu.",[],"Xem <b>Ngữ pháp: 进而</b>. SBT nghe câu 1."],[20,"分裂","fēnliè","đgt.","phân liệt","tách rời, chia rẽ",1,"","整体的事物分开。","从地壳分裂而成的裂缝","细胞分裂。","Tế bào phân chia.",["细胞分裂"],""],[21,"渗透","shèntòu","đgt.","thấm thấu","thấm vào",1,"","液体从物体的细小空隙中透过；比喻一种事物或势力逐渐进入。","裂缝渗透到地下","雨水渗透到了地下。","Nước mưa thấm xuống lòng đất.",[],"SBT câu 19."],[22,"细菌","xìjūn","dt.","tế khuẩn","vi khuẩn",1,"","微生物的一大类。","某些细菌借硫化氢代谢变化","饭前洗手可以减少细菌。","Rửa tay trước khi ăn giúp giảm vi khuẩn.",[],""],[23,"过滤","guòlǜ","đgt.","quá lự","lọc",1,"","使流体通过滤纸或其他多孔材料，把所含的固体颗粒或有害成分分离出去。","靠过滤细菌维持生命","自来水要过滤以后才能喝。","Nước máy phải lọc rồi mới uống được.",[],"SBT câu 20."],[24,"来源","láiyuán","dt.","lai nguyên","nguồn gốc, nguồn",1,"","事物所从来的地方；事物的根源。","大动物的食物来源","工资是他唯一的收入来源。","Lương là nguồn thu nhập duy nhất của anh.",["收入来源","食物来源"],""],[25,"合成","héchéng","đgt.","hợp thành","tổng hợp, hợp thành",1,"","由部分组成整体；通过化学反应使成分简单的物质变成成分复杂的物质。","这种程序叫“化学合成”","这张照片是电脑合成的。","Bức ảnh này là ảnh ghép bằng máy tính.",["化学合成"],""],[26,"解放","jiěfàng","đgt.","giải phóng","giải phóng",1,"","解除束缚，得到自由或发展。","要解放思想","洗衣机把人们从家务中解放了出来。","Máy giặt giải phóng con người khỏi việc nhà.",["解放思想"],""],[27,"迈","mài","đgt.","mại","bước",1,"","抬脚向前走；跨。","迈向地球以外","他迈出了人生的第一步。","Anh ấy bước bước đầu tiên của đời mình.",["迈向","迈出"],""],[28,"探索","tànsuǒ","đgt.","thám sách","thám hiểm, tìm kiếm",1,"","多方寻求答案，解决疑问。","探索生命存在的新路","人类一直在探索宇宙的奥秘。","Loài người luôn khám phá bí ẩn vũ trụ.",[],"Khởi động 2: nhóm <span class='zh'>探</span>."],[29,"据悉","jùxī","đgt.","cứ tất","theo nguồn tin",1,"书","根据得到的消息知道。","据悉，这种细菌……","据悉，比赛将于下月举行。","Theo nguồn tin, cuộc thi sẽ tổ chức vào tháng sau.",[],"Thường đứng đầu câu, dùng trong tin tức. Bài tập 4⑤."],[30,"忍受","rěnshòu","đgt.","nhẫn thụ","chịu đựng",1,"","把痛苦、困难、不幸的遭遇等勉强承受下来。","这种细菌忍受高温的本领","我再也忍受不了这里的噪音了。","Tôi không chịu nổi tiếng ồn ở đây nữa.",["忍受不了"],"Bài tập 2②."],[31,"超越","chāoyuè","đgt.","siêu việt","vượt qua",1,"","超出；越过。","远远超越了我们的想象","超越自我。","Vượt qua chính mình.",["超越自我"],"Bài tập 3①. SBT câu 19."],[32,"摄氏度","shèshìdù","lượng.","nhiếp thị độ","độ C",1,"","摄氏温度的单位，符号为℃。","250摄氏度（250℃）","今天最高气温三十五摄氏度。","Hôm nay nhiệt độ cao nhất 35℃.",[],""],[33,"丧失","sàngshī","đgt.","tang thất","mất đi",1,"","失去。","多数细菌会丧失生命","他在事故中丧失了听力。","Anh mất thính lực trong vụ tai nạn.",["丧失信心","丧失能力"],"⚠️ 丧 đọc <b>sàng</b> (mất) — khác <span class='zh'>丧 sāng</span> (tang)."],[34,"偏偏","piānpiān","phó.","thiên thiên","lại, vẫn cứ; riêng",1,"","表示故意跟客观要求或客观情况相反；表示事实跟主观想法恰恰相反。","为什么偏偏这种细菌能够存活下来","大家都劝他别去，他偏偏要去。","Ai cũng khuyên đừng đi, anh ta cứ nhất định đi.",[],"Xem <b>Ngữ pháp: 偏偏</b>."],[35,"真相","zhēnxiàng","dt.","chân tướng","sự thật",1,"","事情的真实情况。","想探究其真相","事情的真相终于大白了。","Sự thật cuối cùng đã sáng tỏ.",["真相大白"],""],[36,"华丽","huálì","tt.","hoa lệ","tráng lệ, lộng lẫy",1,"","美丽而有光彩。","强大而华丽的阵容","她穿着一件华丽的长裙。","Cô ấy mặc một chiếc váy dài lộng lẫy.",[],"SBT câu 18."],[37,"阵容","zhènróng","dt.","trận dung","thế trận, đội hình",1,"","作战队伍的外貌；比喻队伍所显示的力量。","强大而华丽的阵容","这部电影的演员阵容很强大。","Dàn diễn viên của phim này rất hùng hậu.",["演员阵容"],"SBT nghe câu 10."],[38,"有条不紊","yǒutiáo-bùwěn","thành ngữ","hữu điều bất vặn","gọn gàng ngăn nắp, có trật tự",1,"成","形容有条理，有次序，一点儿也不乱。","有条不紊地过着自己的日子","她把家里收拾得有条不紊。","Cô ấy dọn nhà gọn gàng ngăn nắp.",[],"Bài tập 2⑥. SBT câu 22."],[39,"展现","zhǎnxiàn","đgt.","triển hiện","bày ra, hiện ra",1,"","明显地表现出来。","展现着他们独特的精彩","一片美丽的景色展现在我们眼前。","Một cảnh đẹp hiện ra trước mắt chúng tôi.",[],"Bài tập 3②."],[40,"丛","cóng","lượng.","tùng","đống, nhóm, đám, chùm",1,"","用于聚集在一起的草木等。","一丛丛红冠蠕虫","院子里长着一丛竹子。","Trong sân mọc một khóm tre.",["一丛"],""],[41,"体积","tǐjī","dt.","thể tích","thể tích",1,"","物体所占空间的大小。","体积庞大的巨蛤","这个箱子体积太大了。","Cái thùng này thể tích quá lớn.",[],""],[42,"造型","zàoxíng","dt.","tạo hình","kiểu, hình dáng",1,"","创造出来的物体形象。","造型奇特的白蚌","这座建筑造型很独特。","Tòa nhà này có kiểu dáng rất độc đáo.",[],"SBT câu 19."],[43,"迷惑","míhuò","tt.","mê hoặc","mê muội, mơ hồ",1,"","辨不清是非，摸不着头脑。","都使人迷惑不解","他的话让我很迷惑。","Lời anh ấy khiến tôi rất khó hiểu.",["迷惑不解"],"Còn là động từ = làm mê hoặc: <span class='zh'>迷惑敌人</span>."],[44,"广阔","guǎngkuò","tt.","quảng khoát","bao la, rộng lớn",1,"","广大宽阔。","这片神秘而广阔的深海世界","广阔的草原一望无际。","Thảo nguyên bao la bát ngát.",[],"Bài tập 1: <span class='zh'>广大 · 广告 · 广播 · 宽广</span>."],[45,"奇妙","qímiào","tt.","kỳ diệu","kỳ diệu",1,"","稀奇巧妙（多用来形容令人感兴趣的新奇事物）。","奇妙的科学研究基地","大自然真是奇妙。","Thiên nhiên thật kỳ diệu.",[],""],[46,"基地","jīdì","dt.","cơ địa","căn cứ, nền tảng",1,"","作为某种事业基础的地区。","科学研究基地","这里是全国最大的蔬菜基地。","Đây là vùng rau lớn nhất cả nước.",["研究基地","生产基地"],""]],extra:[["质疑","zhìyí","chất vấn, đặt nghi vấn"],["长相","zhǎngxiàng","hình dáng, tướng mạo"],["硫化氢","liúhuàqīng","hydro sunfua (H₂S)"],["假说","jiǎshuō","giả thuyết"],["地壳","dìqiào","vỏ Trái Đất"],["硫酸盐","liúsuānyán","muối sunfat"],["代谢","dàixiè","trao đổi chất"],["食物链","shíwùliàn","chuỗi thức ăn"],["奥秘","àomì","bí ẩn"],["金星","jīnxīng","sao Kim"],["红冠蠕虫","hóngguān rúchóng","giun ống mào đỏ"]],T:[{zh:"俗话说万物生长靠太阳。人们之所以这样说，是因为历来植物生长离不开阳光，而动物又靠植物维持生命，所以没有阳光，就没有万物，这是众所周知的真理。然而科学家们的深海考察，却向人类早已认定为准则的定义提出了质疑。",vn:"Tục ngữ nói vạn vật sinh trưởng nhờ mặt trời. Người ta sở dĩ nói vậy là vì xưa nay thực vật lớn lên không thể thiếu ánh nắng, mà động vật lại dựa vào thực vật để duy trì sự sống; cho nên không có ánh mặt trời thì không có vạn vật — đó là chân lý ai cũng biết. Thế nhưng cuộc khảo sát biển sâu của các nhà khoa học lại đặt dấu hỏi với định nghĩa mà loài người từ lâu đã coi là chuẩn mực.",idea:"Chân lý “vạn vật nhờ mặt trời” bị nghi ngờ.",q:["为什么说万物生长靠太阳？"],note:[["之所以……，是因为……","Nêu kết quả trước, nguyên nhân sau."],["向……提出了质疑","Đặt nghi vấn với…"]]},{zh:"潜水到几千米深海底的科学家发现了一个繁殖生命的场所，那里的生物长相古怪，蛤、蚌、蟹、贝壳、红冠蠕虫等等，什么都有。科学家深感诧异：在没有阳光，没有食物，压力又很大的海底，怎么会有这么多生物？它们靠什么生存呢？",vn:"Các nhà khoa học lặn xuống đáy biển sâu mấy nghìn mét đã phát hiện một nơi sự sống sinh sôi; sinh vật ở đó hình dạng kỳ quái: sò, trai, cua, vỏ ốc, giun ống mào đỏ… thứ gì cũng có. Các nhà khoa học vô cùng kinh ngạc: ở đáy biển không ánh sáng, không thức ăn, áp suất lại rất lớn, sao lại có nhiều sinh vật đến vậy? Chúng sống nhờ vào đâu?",idea:"Đáy biển sâu đầy sinh vật kỳ lạ.",q:["几千米深的海底有生物吗？"],note:[["什么都有","Đại từ nghi vấn + 都 = mọi thứ đều…"],["深感诧异","<span class='zh'>深感 + tt.</span>: 深感遗憾 / 深感不安."]]},{zh:"回到地面后，科学家取出从深海带回的样品，一股带有刺鼻臭蛋气味的硫化氢气体立即冲了出来，科学家恍然大悟，进而提出了这样的假说——当海水从地壳分裂而成的裂缝渗透到地下时，在高温和高压的作用下，水里所含的硫酸盐转化成了硫化氢，某些细菌借硫化氢代谢变化，吸收温泉的热量得以繁殖。一些小动物靠过滤细菌维持生命，而小动物又成了大动物的食物来源，这样，就构成了一个新的“食物链”。它们靠来自地球内部的热能维持生命，这种程序叫“化学合成”，是生物科学史上的第一次发现。它告诉人类，在没有阳光的条件下，也可能有生命；它启发人们，要解放思想，迈向地球以外，探索生命存在的新路。",vn:"Trở lại mặt đất, các nhà khoa học lấy mẫu vật mang về từ biển sâu ra; một luồng khí hydro sunfua mùi trứng thối xộc mũi lập tức bốc lên. Các nhà khoa học bỗng vỡ lẽ, từ đó đưa ra giả thuyết: khi nước biển thấm xuống lòng đất qua các khe nứt do vỏ Trái Đất tách ra, dưới tác dụng của nhiệt độ cao và áp suất cao, muối sunfat trong nước chuyển hóa thành hydro sunfua; một số vi khuẩn nhờ hydro sunfua để trao đổi chất, hấp thu nhiệt của suối nước nóng mà sinh sôi được. Một số động vật nhỏ sống nhờ lọc vi khuẩn, động vật nhỏ lại thành nguồn thức ăn của động vật lớn — như vậy hình thành một “chuỗi thức ăn” mới. Chúng duy trì sự sống nhờ nhiệt năng từ lòng Trái Đất; quá trình này gọi là “hóa tổng hợp”, là phát hiện đầu tiên trong lịch sử sinh học. Nó cho loài người biết: không có ánh mặt trời vẫn có thể có sự sống; nó gợi mở cho con người phải giải phóng tư tưởng, bước ra ngoài Trái Đất, tìm con đường mới cho sự tồn tại của sự sống.",idea:"Giả thuyết hóa tổng hợp & chuỗi thức ăn mới.",q:["深海的生物靠什么生存？"],note:[["恍然大悟，进而提出了……","Xem Ngữ pháp 1: <span class='zh'>进而</span>."],["吸收温泉的热量得以繁殖","Xem Ngữ pháp 2: <span class='zh'>得以</span>."],["它告诉人类……；它启发人们……","Điệp cấu trúc — nêu ý nghĩa phát hiện."]]},{zh:"据悉，这种细菌忍受高温的本领远远超越了我们的想象，它们能在250摄氏度（250℃）的环境下生存。一般情况下，高于40℃，大部分植物和动物就无法成活；高于65℃，多数细菌会丧失生命，可是，为什么偏偏这种细菌能够存活下来？其中的奥秘到底是什么呢？有人迫不及待地想探究其真相，有人却说，与其把精力用来探索耐高温细菌生命存在的秘密，不如去探索高温和高压下的金星或其他星球上，是否也有生物存在。",vn:"Theo nguồn tin, khả năng chịu nhiệt của loại vi khuẩn này vượt xa trí tưởng tượng của chúng ta: chúng có thể sống ở môi trường 250 độ C. Thông thường, trên 40℃ đa số thực vật và động vật không thể sống; trên 65℃ phần lớn vi khuẩn sẽ chết; vậy mà tại sao riêng loại vi khuẩn này lại sống sót được? Bí ẩn trong đó rốt cuộc là gì? Có người nóng lòng muốn tìm hiểu sự thật; lại có người nói, thay vì dồn sức tìm bí mật tồn tại của vi khuẩn chịu nhiệt, chẳng bằng đi khám phá xem trên sao Kim hay các hành tinh khác — nơi nhiệt độ cao, áp suất cao — có sinh vật tồn tại hay không.",idea:"Vi khuẩn chịu được 250℃.",q:["描述一下深海耐高温细菌忍受高温的本领。"],note:[["为什么偏偏这种细菌……","Xem Ngữ pháp 3: <span class='zh'>偏偏</span>."],["与其……不如……","Thay vì… chẳng bằng… (bài 11)."],["有人……，有人却……","Đối lập hai quan điểm."]]},{zh:"不管人类怎么想，这些深海生物依然保持着它们强大而华丽的阵容，有条不紊地过着自己的日子，展现着他们独特的精彩：一丛丛红冠蠕虫，把白色外套管固定在岩石上，保护着自己柔软的身体。它们没有嘴，没有眼，甚至消化系统也不存在，仅靠伸出套管顶端的身体过滤海水中的食物，它们是怎么繁殖后代的呢？体积庞大的巨蛤，造型奇特的白蚌，它们的生理结构，食物基础，甚至它们的门类归属，都使人迷惑不解。这片神秘而广阔的深海世界能为我们提供新的食物资源，成为奇妙的科学研究基地吗？",vn:"Mặc cho loài người nghĩ gì, những sinh vật biển sâu này vẫn giữ đội hình hùng hậu và lộng lẫy của chúng, ung dung có trật tự sống những ngày của mình, phô bày vẻ đặc sắc riêng: từng cụm giun ống mào đỏ gắn ống vỏ trắng lên đá, bảo vệ thân thể mềm mại. Chúng không có miệng, không có mắt, thậm chí không có cả hệ tiêu hóa, chỉ nhờ phần thân thò ra khỏi đầu ống để lọc thức ăn trong nước biển — vậy chúng sinh sản thế nào? Những con sò khổng lồ, những con trai trắng hình dáng kỳ lạ — cấu tạo sinh lý, nguồn thức ăn, thậm chí cả việc chúng thuộc ngành loài nào đều khiến người ta khó hiểu. Thế giới biển sâu bí ẩn và bao la này có thể cung cấp cho chúng ta nguồn thức ăn mới, trở thành căn cứ nghiên cứu khoa học kỳ diệu chăng?",idea:"Thế giới sinh vật biển sâu bí ẩn.",q:["深海中的生物还有什么使人迷惑不解的问题？"],note:[["不管……，依然……","Dù… vẫn…"],["强大而华丽 · 神秘而广阔","<span class='zh'>A 而 B</span>: nối hai tính từ (văn viết)."],["甚至……也不存在","Tăng tiến."]]}]},Object.assign(window.LESSON,{G:[{id:"g1",grp:0,word:"进而",zh:"进而",py:"jìn'ér",tag:"Chú thích 1 · liên từ",mean:"Liên từ, dùng ở <b>vế sau</b>, biểu thị <b>trên cơ sở đã có, tiến thêm một bước</b> — “rồi tiến tới, từ đó”. Dùng trong văn viết.",forms:["A（đã làm được），进而 + B（bước cao hơn）"],ex:[["人是在改造环境的实践中认识环境并接受环境的影响，进而改造自己的。","Con người nhận thức môi trường và chịu ảnh hưởng của nó trong thực tiễn cải tạo môi trường, từ đó cải tạo chính mình."],["想象有减轻心理压力，维持心理平衡，进而促进心理健康的作用。","Tưởng tượng có tác dụng giảm áp lực, giữ cân bằng tâm lý, từ đó thúc đẩy sức khỏe tâm lý."],["科学家恍然大悟，进而提出了这样的假说……","",1]],tips:["Thứ tự logic: bước 1 → <span class='zh'>进而</span> → bước 2 (cao hơn / sâu hơn).","Bài tập 2①, 4②."],practice:{q:"用“进而”改写句子",type:"complete",items:[["新的教学方法要先在个别班级进行实验，之后在全校推广。","新的教学方法要先在个别班级进行实验，进而在全校推广。"],["要先把原著表达的思想弄清楚，在此基础上，很好地去理解原著。","要先把原著表达的思想弄清楚，进而很好地去理解原著。"],["据说，著名画家齐白石画虾数十年，到了七十岁时赶上了古人的水平，后来继续努力，超越了古人。","据说，著名画家齐白石画虾数十年，到了七十岁时赶上了古人的水平，进而超越了古人。"]]}},{id:"g2",grp:1,word:"",zh:"得以",py:"déyǐ",tag:"Chú thích 2 · động từ",mean:"Động từ = “<span class='zh'>借以达到，借此可以；能够</span>” — <b>nhờ (điều kiện) mà được / có thể</b>. Phía trước thường nêu <b>điều kiện</b>, sau <span class='zh'>得以</span> là <b>kết quả đã thực hiện</b> (hoặc dự kiến). Chủ yếu bổ nghĩa cho động từ / cụm động từ. Văn viết.",forms:["（nhờ điều kiện）……，A 得以 + V"],ex:[["……某些细菌借硫化氢代谢变化，吸收温泉的热量得以繁殖。","",1],["……只有自首，才是他和家人得以解脱的唯一途径。","… chỉ có tự thú mới là con đường duy nhất để anh và gia đình được giải thoát."],["幸亏列车上有位经验丰富的医生，使他得以清醒过来。","May mà trên tàu có bác sĩ giàu kinh nghiệm, nhờ vậy anh ấy mới tỉnh lại được."]],tips:["⚠️ Không có dạng phủ định <s>不得以</s> (khác <span class='zh'>不得已</span> = bất đắc dĩ).","Bài tập 4①."],practice:{q:"用“得以”改写句子",type:"complete",items:[["长寿的一生使他有机会见证中国历史上的伟大年代。","长寿的一生使他得以见证中国历史上的伟大年代。"],["大机器代替了手工工场，科学技术在生产上才能广泛运用。","大机器代替了手工工场，科学技术在生产上才得以广泛运用。"],["这个联欢会，希望孩子们能唱的唱，能跳的跳，能写的写，能画的画，就是要让所有孩子的特长都能够发挥出来。","……就是要让所有孩子的特长都得以发挥。"]]}},{id:"g3",grp:1,word:"偏偏",zh:"偏偏",py:"piānpiān",tag:"Chú thích 3 · phó từ",mean:"Phó từ, hai cách dùng chính:<br>① <b>Cố ý làm ngược</b> yêu cầu khách quan / tình hình khách quan — “cứ, lại cứ”. Hay đi với <span class='zh'>要 · 不</span>.<br>② <b>Sự thật trái ngược</b> mong muốn, yêu cầu, lẽ thường — “lại, khéo sao lại”.",forms:["① S + 偏偏 + 要 / 不 + V","② ……，偏偏 + (S) + V"],ex:[["那里太危险了，大家都劝他不要去，他偏偏要去。","Ở đó nguy hiểm lắm, ai cũng khuyên đừng đi, anh ta cứ nhất định đi."],["我爱做的事，偏偏不让我做；我不爱做的事，倒非做不可，真让人生气！","Việc tôi thích thì lại không cho làm; việc tôi không thích thì lại bắt phải làm, thật bực mình!"],["30年前我们班那个最不爱说话、最不起眼儿的女生，今天偏偏最成功。","Cô bạn ít nói nhất, mờ nhạt nhất lớp 30 năm trước, hôm nay lại thành công nhất."],["……可是，为什么偏偏这种细菌能够存活下来？","",1]],tips:["Bài 18: <span class='zh'>愣（是）</span> gần nghĩa ① nhưng khẩu ngữ hơn.","Bài tập 2③, 3②, 4③."],practice:{q:"完成句子",type:"complete",items:[["他从小就喜欢画画儿，也有绘画的天赋，没想到________。","……没想到父母偏偏让他学了经济。"],["去南方旅游的火车票也买了，旅馆也订了，________。","……偏偏这时候公司让我去出差。"],["跟他说好有急事要联系，可他________。","……可他偏偏不接电话。"]]}},{id:"g4",grp:1,word:"据悉",zh:"据悉，……",py:"jùxī",tag:"Văn tin tức · Bài tập 4⑤",mean:"“Theo nguồn tin, được biết” — thường đứng <b>đầu câu</b>, có dấu phẩy, dùng trong tin tức, văn viết. Cùng nhóm: <span class='zh'>据说 · 据报道 · 据统计 · 据了解</span>.",forms:["据悉，+ câu tin tức"],ex:[["据悉，这种细菌忍受高温的本领远远超越了我们的想象。","",1],["据悉，今年入境旅游观光的人数已超过千万。","Theo nguồn tin, năm nay số khách du lịch nhập cảnh đã vượt mười triệu."]],tips:["<span class='zh'>悉</span> = biết (<span class='zh'>熟悉 · 获悉</span>)."]},{id:"g5",grp:0,word:"历来",zh:"历来 / 从来",py:"lìlái / cónglái",tag:"Xem 辨析 bên dưới",mean:"Đều là phó từ “từ trước đến nay đều vậy”. <span class='zh'>历来</span> văn viết, <b>không dùng trong câu phủ định</b>; <span class='zh'>从来</span> <b>chủ yếu dùng trong câu phủ định</b>.",forms:["历来 + (tt./đgt. 2 âm tiết)","从来 + 不 / 没（有）……"],ex:[["人们之所以这样说，是因为历来植物生长离不开阳光……","",1]],tips:["Bài tập 4④."]}],BX:{grp:0,word:"历来",cols:["历来","从来"],pair:"历来 — 从来",same:["Đều là <b>phó từ</b>, đều biểu thị <b>từ quá khứ đến hiện tại đều như vậy</b>.","我跟他下棋历来 / 从来都要输的。"],diff:[["Chủ yếu dùng trong <b>văn viết</b>, <b>không dùng trong câu phủ định</b>.","我们历来提倡艰苦朴素，反对铺张浪费。","Chủ yếu dùng trong <b>câu phủ định</b>.<div class='zh' style='margin-top:4px'>我从来不隐瞒自己的观点。</div>"],["Có thể bổ nghĩa cho <b>một động từ / tính từ hai âm tiết</b> đơn lẻ.","这个人历来忠厚老实，可以信赖。","Trong câu khẳng định, bổ nghĩa cho <b>cụm động từ, cụm tính từ hoặc phân câu</b>; thường không bổ nghĩa cho động từ / tính từ đơn lẻ.<div class='zh' style='margin-top:4px'>川西平原从来就是物产丰富。</div>"]],task:{q:"选择“历来”或“从来”填空",cols:["历来","从来"],sample:!1,items:[["爷爷____没有浪费过一点儿粮食。",1,"Câu phủ định (没有) → 从来."],["中国西北地区雨量____稀少。",0,"Bổ nghĩa tính từ 2 âm tiết đơn lẻ (稀少), văn viết → 历来."],["他____心直口快，有什么说什么。",0,"Trước thành ngữ / tính từ, câu khẳng định → 历来."],["她总是无忧无虑，好像____不知道什么叫烦恼。",1,"Câu phủ định (不知道) → 从来."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["历<u>来</u>","从来 · 本来 · 原来 · 后来"],items:[["维<u>持</u>","持","持续 · 持久 · 坚持 · 主持"],["准<u>则</u>","则","规则 · 法则 · 条则 · 原则"],["<u>场</u>所","场","场地 · 场景 · 广场 · 商场"],["<u>广</u>阔","广","广大 · 广告 · 广播 · 宽广"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Hoàn thành câu với từ trong ngoặc (đáp án tham khảo).",items:[["先提出计划，________。","进而","先提出计划，进而制定具体的实施方案。"],["几十年来，________。","忍受","几十年来，她默默忍受着病痛的折磨，从来没有抱怨过。"],["星期天他来找我，________。","偏偏","星期天他来找我，偏偏我不在家。"],["这个地方________。","广阔","这个地方土地广阔，人口却很少。"],["________闻名世界。","众所周知","众所周知，中国的长城闻名世界。"],["各项工作________。","有条不紊","各项工作都在有条不紊地进行着。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["俗话","历来","超越","真理","众所周知"],text:"{俗话}说：“独木不成林”，这句话告诉我们团结的重要性。{众所周知}，一根筷子很容易折断，可一把筷子就很难折断了，团结能使我们{超越}自身的局限，产生巨大的力量，所以“团结力量大”成为{历来}人们都认可的{真理}。"},{bank:["诧异","偏偏","展现","古怪","恍然大悟"],text:"今天是周末，可经理{偏偏}让我去加班，我满肚子不乐意，却也没有办法。在公司门口，居然遇到了几个同事，我很{诧异}，问：“周末怎么还有这么多人来上班？”而他们看到我，神情都有些{古怪}。直到走进办公室，鲜花和蛋糕{展现}在我眼前，经理和同事们唱起了生日歌，我才{恍然大悟}，原来今天是我的生日，他们为我准备了一个特别的生日晚会。"}]},EX4:{q:"为括号里的词语选择适当的位置",type:"pos",vn:"Bấm chữ cái A–D chỉ vị trí đúng của từ trong ngoặc.",items:[["A只有B不断努力，C梦想才能D实现。","D","只有不断努力，梦想才能得以实现。","得以"],["通过A调查研究B发现问题，C找到D解决问题的方法。","C","通过调查研究发现问题，进而找到解决问题的方法。","进而"],["经过讨论，A大家的意见B都统一了，C可D他不同意。","D","经过讨论，大家的意见都统一了，可偏偏他不同意。","偏偏"],["A老校长B重视C学生们的D素质教育。","B","老校长历来重视学生们的素质教育。","历来"],["A今年B入境旅游观光的C人数已超过D千万。","A","据悉今年入境旅游观光的人数已超过千万。","据悉"]]},EX5:{q:"根据提示，简述课文主要内容",rows:[["为什么说万物生长靠太阳？","① 植物…… ② 动物……","因为历来植物生长离不开阳光，而动物又靠植物维持生命，所以没有阳光，就没有万物。"],["几千米深的海底有生物吗？","① 科学家发现……场所 ② 那里的生物……","有。科学家发现了一个繁殖生命的场所，那里的生物长相古怪，蛤、蚌、蟹、贝壳、红冠蠕虫等等，什么都有。"],["深海的生物靠什么生存？","假说：当……时，在……作用下，……转化成了……，……借……变化，吸收……得以……","当海水从地壳的裂缝渗透到地下时，在高温和高压的作用下，硫酸盐转化成了硫化氢，某些细菌借硫化氢代谢变化，吸收温泉的热量得以繁殖；小动物靠过滤细菌生存，又成了大动物的食物。"],["描述一下深海耐高温细菌忍受高温的本领。","① 这种细菌…… ② 大部分植物和动物…… ③ 多数细菌……","这种细菌能在250℃的环境下生存，而高于40℃大部分植物和动物就无法成活，高于65℃多数细菌会丧失生命。"],["深海中的生物还有什么使人迷惑不解的问题？","① 红冠蠕虫：…… ② 巨蛤、白蚌：……","红冠蠕虫没有嘴、没有眼，也没有消化系统，它们怎么繁殖后代？巨蛤、白蚌的生理结构、食物基础和门类归属都使人迷惑不解。"]]},BJ:{title:"病句类型：歧义句",vn:"Câu sai — loại 9: câu đa nghĩa",intro:"Bình thường mỗi câu chỉ diễn đạt <b>một</b> ý. Nếu một câu có thể hiểu theo <b>hai cách trở lên</b> thì đó là <b>歧义句</b>. Nguyên nhân thường gặp: <b>từ đa nghĩa / đa từ loại</b> (<span class='zh'>前 · 锁 · 借 · 租</span>), <b>phạm vi bổ nghĩa không rõ</b> (định ngữ bổ nghĩa cho từ nào), <b>ngắt nhịp khác nhau</b>. Cách sửa: thêm / đổi từ, đổi trật tự, thêm dấu phẩy.",types:[["“前”多义","Từ đa nghĩa","上面通知说，让您本周五前去汇报。","……让您本周五以前去汇报。 / ……让您本周五去汇报。","<span class='zh'>前</span> = trước (thứ Sáu) hay <span class='zh'>前往</span> (đi vào thứ Sáu)?"],["“租”施受","Từ có nghĩa cho / nhận","那时候我们同在一个城市，我还租了他一套房子呢。","我还跟他租了一套房子呢。 / 我还租给了他一套房子呢。","Tôi <b>thuê của</b> anh ấy hay <b>cho</b> anh ấy thuê?"],["定语范围","Định ngữ bổ nghĩa không rõ","几个海归投资的垃圾发电厂很快将要建成投产。","几个海归投资的一座垃圾发电厂…… / 海归投资的几个垃圾发电厂……","<span class='zh'>几个</span> bổ nghĩa cho <span class='zh'>海归</span> hay <span class='zh'>垃圾发电厂</span>?"],["停顿不同","Ngắt nhịp khác nhau","医生看到我们非常焦急，连忙把病人的病情告诉我们。","医生看到我们非常焦急的样子，…… / 医生非常焦急，看到我们，……","Ai sốt ruột — bác sĩ hay chúng tôi?"],["停顿不同","Ngắt nhịp khác nhau","我们打败了师大女篮得到了冠军。","我们打败了师大女篮，得到了冠军。 / 我们打败了，师大女篮得到了冠军。","Ai vô địch — chúng tôi hay đội nữ ĐHSP?"]],practice:[["他背着爸爸和我买下了那栋房子。","背着","背着爸爸，他和我买下了那栋房子。 / 背着爸爸和我，他买下了那栋房子。","<span class='zh'>背着</span> (giấu) ai — chỉ bố, hay cả bố và tôi?"],["这个精致的玩具将作为今晚最受欢迎的客人的礼品送给他。","最受欢迎的","……将作为礼品送给今晚最受欢迎的客人。 / ……将作为今晚最受欢迎的礼品送给客人。","<span class='zh'>最受欢迎的</span> bổ nghĩa cho <span class='zh'>客人</span> hay <span class='zh'>礼品</span>?"],["我的车没有锁，在教室门口放着呢，你去骑吧。","锁","我的车没有上锁，…… / 我的车没有安锁，……","<span class='zh'>锁</span> là động từ (khóa) hay danh từ (ổ khóa)?"],["我看见她很高兴，就和她聊了起来。","高兴","看见她，我很高兴，…… / 她看上去很高兴，我就……","Ai vui — tôi hay cô ấy?"],["他借了我两本书还没还呢。","借","他向我借的两本书还没还呢。 / 他借给我两本书，我还没还呢。","<span class='zh'>借</span> = mượn hay cho mượn?"]]},DP:{title:"词汇：熟悉下列词语搭配",vn:"12 từ & cách kết hợp thường gặp.",items:[["附属","fùshǔ","trực thuộc","附属中学","这所医院附属于医科大学。"],["杠杆","gànggǎn","đòn bẩy","杠杆作用 / 经济杠杆","应充分发挥金融机构在经济发展中的杠杆作用。"],["疙瘩","gēda","cục u; khúc mắc","面疙瘩 / 线疙瘩","他的眉头皱成了一个大疙瘩。"],["勾结","gōujié","câu kết","暗中勾结","他们勾结在一起，做了不少坏事。"],["贯彻","guànchè","quán triệt","贯彻始终","我们公司一直贯彻公平、公正的原则。"],["混淆","hùnxiáo","lẫn lộn","混淆黑白 / 混淆是非","对和错是不容混淆的。"],["机械","jīxiè","máy móc","机械化","这个人做事太机械了，一点儿灵活性都没有。"],["冷却","lěngquè","làm nguội","自然冷却 / 冷却剂","岩浆冷却后就成了岩石。"],["媒介","méijiè","môi giới, trung gian","传播媒介","苍蝇是传染疾病的媒介。"],["谜语","míyǔ","câu đố","猜谜语","这个谜语我怎么也猜不出来，你快告诉我吧。"],["母语","mǔyǔ","tiếng mẹ đẻ","母语教学","我的母语是汉语，你的母语呢？"],["排练","páiliàn","tập dượt","排练节目","为了这次演出，我们天天认真排练。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"青少年的兴趣爱好若能及早得到培养，就能表现出某一方面的才能。老师根据学生的爱好，有意识地加以引导，就会使学生在自己爱好的活动中发展特长、增长聪明才智，进而具有发现问题、分析问题、解决问题的能力。",o:["每个孩子都有自己的特长","好老师要能发现学生的问题","老师要善于帮学生解决问题","老师要根据学生的特长加以引导"],a:3,why:"“老师根据学生的爱好，有意识地加以引导” — có <span class='zh'>进而</span>!"},{n:2,say:"7月份新疆出现异常高温天气，大部分地区最高气温在35摄氏度以上，一些地区的最高气温为40摄氏度以上。首府乌鲁木齐14日最高气温达到40.6摄氏度，突破近30年来最高气温历史极值，吐鲁番地区最高气温达到46.2摄氏度。",o:["乌鲁木齐是新疆的首府","在新疆40℃高温很普遍","7月份新疆的天气反复无常","乌鲁木齐的气温高于吐鲁番"],a:0,why:"“首府乌鲁木齐”. D sai: Turpan 46.2℃ > Urumqi 40.6℃."},{n:3,say:"随着社会的发展，新事物、新概念不断出现，这些都会向交际提出新的要求，我们翻阅解放前的书报杂志，就会感到有些词语很陌生，有些格式很不习惯。社会的发展变迁必然会在语言的词汇里留下印记。",o:["每个人都向交际提出新要求","历史会记录社会的发展变化","语言会随着社会的变化而变化","书面语和口语有许多不同之处"],a:2,why:"“社会的发展变迁必然会在语言的词汇里留下印记”."},{n:4,say:"今年读到了新近出版的“经济新观察”丛书中的林行止系列和熊秉元系列。林行止读书甚广，读他的文章犹如进入阿里巴巴的山洞，美不胜收。熊秉元善于从一些日常小事中总结出经济学精神，读来有滋有味。",o:["林行止、熊秉元都是小说作家","林行止的书介绍了很多旅游景点","熊秉元的书内容常涉及餐饮美味","“经济新观察”是一套经济学书籍"],a:3,why:"“丛书” = bộ sách; nội dung kinh tế học. C: <span class='zh'>有滋有味</span> là ẩn dụ (đọc thú vị)."},{n:5,say:"从渔猎到农业，人类社会先是出现了半永久性的农牧业村舍，之后有了定居的村庄。但这种状况也未能持久，一旦地力衰竭或人口增长过快，整个村舍就要迁移，或分裂成较小的组团，寻找新的住地，以保证足够的耕地。",o:["人类的定居促进了人口的增长","农业的发展也促进了渔猎文明","人口迁移是为了解决耕地问题","人类定居从渔猎时期就开始了"],a:2,why:"“寻找新的住地，以保证足够的耕地”."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：听说你是个美食家？\n男：美食家谈不上，只能说我是一个对美食没有抵抗力的人，我的优点就是不挑食。\n女：你认为什么是美食？\n男：美食是可以让你身心愉悦的妙药。\n女：能说得具体点儿吗？\n男：在心情好的时候、疲惫的时候或是悠闲的时候，享受一顿可口的饭菜，那一定是最幸福的时刻。\n女：看来吃什么在其次，只要能让你有愉快的感受，什么都是美食？\n男：可以这么说。可是也有例外，对于我来讲，新疆的饭菜都是美味佳肴，因为我是新疆人嘛。还有，南京算是我的第二故乡，我对南京美食也是爱得不得了呀。\n女：对吃你有什么感悟？\n男：俗话说“民以食为天”，吃对于每个人来讲都是生存本能。可是，众所周知，吃给予我们的远不止于此，我更在意的是与家人、友人在“吃”的那个时刻围坐在一起，暂时放下忙碌的工作，忘掉这样那样的烦恼，享受片刻难得的悠闲。\n女：平常你下厨吗？\n男：以前经常下厨，现在因为工作的关系，下厨少了。其实我很享受烹饪的过程，能亲手为家人准备一桌饭菜，是一件非常幸福的事情。虽然做不出用料复杂、精致无比的饭菜，色香味俱佳还是没有问题的。\n女：讲个关于你的吃的故事吧？\n男：要说就说与拍戏有关的吃，那是在拍摄《特种兵》的时候。这部戏主要讲的是女特种兵的故事，拍戏强度很高，体力消耗特别大。我们的阵容中女演员居多，女孩子嘛，本来就喜欢吃一些零食和水果之类的东西，可是在戏里我是教官，总操练她们，尤其不允许她们吃零食。每天女演员们顶着烈日做体能训练，还得忍受我的“训斥”。直到今天，我心里还对她们抱有歉意，觉得当时我丧失了一个男子汉对女士们应有的同情心。",qs:[{n:6,q:"在吃的问题上，男的是个什么样的人？",o:["没有不爱吃的食物","对美食的要求很高","只吃自己喜爱的食物","对美食有奇特的标准"],a:0,why:"“我的优点就是不挑食”."},{n:7,q:"关于男的眼中的美食，下列哪项正确？",o:["美食是可以治病的","口味独特的是美食","家乡的食物是美食","饿了吃什么都是美食"],a:2,why:"“新疆的饭菜都是美味佳肴，因为我是新疆人嘛”. A: <span class='zh'>妙药</span> là ẩn dụ."},{n:8,q:"对于吃，男的有什么感悟？",o:["吃是人生头等大事","吃能解决生存问题","吃能提供营养，保证健康","可以和亲友一起享受悠闲"],a:3,why:"“与家人、友人……围坐在一起……享受片刻难得的悠闲”."},{n:9,q:"在做饭的问题上，下列哪项正确？",o:["男的历来就不愿意做饭","男的太忙，没学过做饭","男的做饭手艺相当不错","男的做饭非常讲究用料"],a:2,why:"“色香味俱佳还是没有问题的”. D sai: “做不出用料复杂……”."},{n:10,q:"关于吃的故事，下列哪项正确？",o:["男的拍戏时经常吃零食","女演员怕胖不敢吃零食","男的看不惯女演员老吃零食","戏中男的不让女演员吃零食"],a:3,why:"“在戏里我是教官……尤其不允许她们吃零食”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"传统密码的缺陷是显而易见的，简单的密码依然是大多数人保护个人隐私的最常见方式。以人体生物特征作为密码，真的可以变为现实吗？回答是肯定的，距离我们越来越近的“眼泪密码”便是如此。由于眼泪作用于角膜的结果无法被复制，因此“眼泪密码”的安全性有了质的提升。\n“眼泪密码”之所以保密性强，是因为每个人的角膜都有独特的图像，扫描仪可据此甄别不同的人。如果黑客偷取并使用某人上次使用过的数据，机器会认定其无效，因为它“懂得”每次扫描结果都应该有细微的变化。这是因为，角膜表面因有泪水而湿润，因此数据是实时改变的。\n还有科学家在探索声音密码，也有银行推出指纹密码。不过，生物密码技术目前并不完全成熟，假如一个人的手指肿了，那么机器则无法识别出指纹密码。",qs:[{n:11,q:"关于传统密码，可以知道什么？",o:["缺点非常明显","简单、可靠、易操作","被黑客偷取后无法使用","比人体生物密码更安全"],a:0,why:"“传统密码的缺陷是显而易见的”."},{n:12,q:"关于眼泪密码，可以知道什么？",o:["安全性有待提升","可复制性差一些","数据会实时改变","黑客破解很容易"],a:2,why:"“数据是实时改变的”. B: <b>không thể</b> sao chép (không phải “kém”)."},{n:13,q:"目前已在银行使用的生物密码是哪一种？",o:["声音密码","眼泪密码","传统密码","指纹密码"],a:3,why:"“也有银行推出指纹密码”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"蛤蜊，身上长着像树木年轮一样的纹路，每成长一年，它就仔细地划上一道完美的圆圈。科学家们数了又数，身上有一百二十多圈的蛤蜊并不稀少，也就是说这些蛤蜊穿越了一个世纪，又健康快乐地生活了二十多年。目前发现的最高龄的蛤蜊为507岁。\n想知道蛤蜊长寿的秘诀吗？夏天对许多动物来说都是最享受的季节，它们大口大口地吃东西，以保持正常的新陈代谢；夏季的美食足够丰盛，它们不担心会没有东西可享用。对于蛤蜊来说，夏季是最幸福的季节，它们要繁殖后代，要承担起做父母的责任和义务，它们没有过多的时间去享用美食，它们的生活简单而快乐。冬天到了，宝宝们长大了，爸爸妈妈也自由了。但这时候草木枯萎、万物藏匿，蛤蜊吃不到多少可口的食物。好在它们习惯了节省而优雅的生活，只要有一些东西吃就足够满意和幸福了。\n正是这些高贵的品质保证了蛤蜊的长寿。也许聪明的人类，这时你恍然大悟了吧，我们总能够从蛤蜊身上想到些什么吧！",qs:[{n:14,q:"目前发现最长寿的蛤蜊多少岁？",o:["二十几岁","一百多岁","五百多岁","一百二十岁左右"],a:2,why:"“最高龄的蛤蜊为507岁”."},{n:15,q:"对许多动物来说，夏天是个怎样的季节？",o:["生儿育女的季节","尽情吃喝的季节","保养身体的季节","享受自由的季节"],a:1,why:"“大口大口地吃东西……美食足够丰盛”. A là của <b>sò</b>."},{n:16,q:"蛤蜊在什么时候繁育后代？",o:["春天","夏天","秋天","冬天"],a:1,why:"“对于蛤蜊来说，夏季……它们要繁殖后代”."},{n:17,q:"人类从蛤蜊身上能悟出什么道理？",o:["一生都要追求优雅","父母必须对孩子负责","父母抚养孩子不容易","简约的生活是最健康的"],a:3,why:"“习惯了节省而优雅的生活……保证了蛤蜊的长寿”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["钟大夫的卫生室是镇里最正规的之一。","在我的记忆里，几乎每一个冬天的晚上，奶奶都在灯下学习。","一个华丽的转身，她在近乎疯狂的掌声中完美地结束了花样滑冰表演。","河水在阳光的照耀下闪闪发光，但河比以前窄了很多，浪也没有以前大。"],a:0,why:"<b>Thiếu thành phần</b>: <span class='zh'>最正规的之一</span> → <span class='zh'>最正规的卫生室之一</span>."},{n:19,o:["他被《时代》杂志将其列入“20世纪最有影响的100个人”。","没有翻不过的高山，没有走不出的沙漠，更没有超越不了的自我。","蔚蓝的天空堆满造型奇异的云朵，有的像人，有的像动物，还有的像花。","含杏仁油的护理液更容易渗透到受损的发丝中，从内部对发丝进行修补。"],a:0,why:"<b>Trộn cấu trúc</b> (bài 17): <span class='zh'>被……</span> và <span class='zh'>……将其……</span> → <span class='zh'>他被《时代》杂志列入……</span> / <span class='zh'>《时代》杂志将他列入……</span>."},{n:20,o:["空气不仅有体积，而且它还有重量。","写论文不仅要驳错误的观点，而且会借助先人的看法。","尽可能少犯错误，这是人的准则；不犯错误，那是天使的梦想。","大雪过后，空气仿佛被过滤得干干净净，一切都变得那么纯洁而美好。"],a:1,why:"<b>Quan hệ / phối hợp không hợp</b>: <span class='zh'>不仅要……而且会……</span> lệch → <span class='zh'>不仅要驳斥错误的观点，而且要借鉴先人的看法</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"板块-地体学说___了地壳运动现象，证明地球是一个生机勃勃的星体，它有着非常___的“新陈代谢”过程，有着___的过去和灿烂的未来。",o:["解释　活跃　辉煌","发现　活泼　惊人","发明　复杂　广阔","展现　古怪　光荣"],a:0,why:"<span class='zh'>学说解释现象</span>; <span class='zh'>活跃的代谢</span>; <span class='zh'>辉煌的过去</span> (đi cặp với 灿烂的未来)."},{n:22,text:"___的采访时间已过大半，桌上的那杯茶未动。我___着周先生。他全神贯注，谈话仍旧有条不紊地进行着，没有___，没有停顿，谁也无法___这位科学家严谨的思维。",o:["打算　注意　迷惑　停止","计划　凝视　混乱　断绝","预测　审视　顾虑　拒绝","预定　注视　跳跃　打断"],a:3,why:"<span class='zh'>预定的时间</span>; <span class='zh'>注视</span>; <span class='zh'>跳跃</span> (nói nhảy cóc); <span class='zh'>打断思维</span>."},{n:23,text:"___不要因为矿物质在人体内含量极小就___它的价值，须知它们对维持人体中的一些决定性的新陈代谢是十分必要的。___缺少了这些必需的微量元素，人体就会出现疾病，___危及生命。",o:["总之　小看　与其　以至","据悉　轻视　果然　乃至","千万　忽视　一旦　甚至","偏偏　漠视　随着　随后"],a:2,why:"<span class='zh'>千万不要</span>; <span class='zh'>忽视价值</span>; <span class='zh'>一旦……就……</span>; <span class='zh'>甚至危及生命</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"苍蝇是声名狼藉的“逐臭之夫”，凡是脏臭污秽的地方，都有它们的踪迹。\n苍蝇的嗅觉特别灵敏，(24)。但是苍蝇并没有“鼻子”，它靠什么来闻呢？原来苍蝇的嗅觉感受器分布在头部的一对触角上，每个触角有一个“鼻孔”与外界相通，内含上百个嗅觉神经细胞。(25)，这些神经会立即把气味刺激转变成神经电脉冲，送往大脑，大脑根据不同气味物质所产生的神经电脉冲的不同，就可区别出不同气味的物质。因此，苍蝇的触角像是一台灵敏的气体分析仪。\n仿生学家由此得到启发，(26)，仿制出一种十分奇特的小型气体分析仪。这种仪器的“探头”不是金属，(27)。就是把非常纤细的微电极插到苍蝇的嗅觉神经上，将引导出来的神经电信号经电子线路放大后，传送给分析器；分析器一经发现气味物质的信号，便能发出警报。这种仪器已经被安装在宇宙飞船的座舱里，(28)。这种小型气体分析仪，也可测量潜水艇和矿井里的有害气体。",opts:["根据苍蝇嗅觉器官的结构和功能","远在几千米外的气味也能嗅到","用来检测舱内气体的成分","而是活的苍蝇","若有气味进入“鼻孔”"],ans:{24:1,25:4,26:0,27:3,28:2}},read4:[{ins:"第29–32题：请选出正确答案。",text:"活化石指先发现化石再发现活体，或活体与确认的化石属同一种且同时存在。于是就有了一些延续了上千万年的古老生物，与其同时代的其他生物早已绝灭，只有它们独自保留下来，适应了现代的环境，生活在一个极其狭小的区域，被称为“活化石”。\n1938年在非洲东南部海中发现的矛尾鱼，是世界闻名的一种活化石。中国的银杏树、水杉，哺乳动物大熊猫、中华鲟，均被世界公认为珍贵的活化石。\n银杏树又名白果树，古又称鸭脚树或公孙树。远在二亿七千多万年前，银杏的祖先就开始出现了。到了一亿七千多万年前，银杏已和当时称霸世界的恐龙一样遍布世界各地，后来，绝大部分银杏像恐龙一样灭绝了，只在中国部分地区保存下来一点点，流传至今，成为稀世之宝。浙江天目山一带尚可见到野生银杏。故银杏有“活化石”、“植物中的熊猫”之称。\n水杉树姿优美，枝叶繁茂，叶色多变而独具一格。它曾广泛分布于北半球。但经过第四纪冰期以后，它们几乎全部绝灭。20世纪40年代，科学家在中国的四川、湖北和湖南均发现水杉尚有留存，其后，这个曾被认为早已在世界上绝迹的树种迅速传播于世。水杉不仅是珍贵的“活化石”，而且它有很强的生命力和广泛的适应性，它生长迅速，是优良的绿化树种，现在不但在中国各地广泛栽培，世界很多国家也争相引种，使这珍贵的树木得以在全球范围内生生不息。",qs:[{n:29,q:"关于“活化石”，下列哪项正确？",o:["先发现化石再发现活体","对生存空间没有特殊要求","化石与活体同时被发现","是活了上千万年的动植物"],a:0,why:"Định nghĩa ngay câu đầu. B sai: “生活在一个极其狭小的区域”. D: là <b>loài</b> kéo dài nghìn vạn năm, không phải cá thể."},{n:30,q:"银杏树古代又称为：",o:["化石树","鸭脚树","公子树","熊猫树"],a:1,why:"“古又称鸭脚树或公孙树” (C là 公<b>子</b> — bẫy!)."},{n:31,q:"银杏树的繁盛时期在：",o:["一千多万年前","恐龙灭绝的时候","二亿七千多万年前","一亿七千多万年前"],a:3,why:"“到了一亿七千多万年前……遍布世界各地”. C chỉ là lúc tổ tiên <b>xuất hiện</b>."},{n:32,q:"水杉的特点是：",o:["适应环境的能力很强","在世界各地均有发现","生长速度慢于其他树","仅可栽种于中国南方"],a:0,why:"“有很强的生命力和广泛的适应性”."}]},{ins:"第33–36题：请选出正确答案。",text:"5年前，一位老人在海边发现了一只浑身覆盖着石油、饿得奄奄一息的企鹅。老人把企鹅带回了家，给它取名Dindim。\nDindim是一只麦哲伦企鹅。之所以叫麦哲伦企鹅，是因为著名航海家麦哲伦于1519年最早发现了它们，后来科学界就以麦哲伦命名该物种了。这种企鹅主要分布于南美洲南端海域的群岛中，是温带地区企鹅类中极具代表性的物种。\n老人给Dindim清理黏附在羽毛上的油渍，使它身上不再有难闻的气味；喂鱼给它吃，让它尽快强壮起来。有了老人的悉心照料，Dindim很快得以康复。老人把它带到海边，想让它回家，Dindim却没有走，它在老人身边整整待了11个月，直到它开始换毛才离开。\n老人本以为这辈子不会再见到Dindim了，令他诧异的是，几个月后，Dindim又回来了，而且大模大样地跟着老人回了家。更为奇妙的是，此后，每年的6月，Dindim都会如期出现，次年的2月再回到阿根廷和智利的海岸。而它每年来看望老人要游行的距离超过3000公里。\n老人说，Dindim与他越来越亲密，每年他们一相见，Dindim就会愉快地摇晃尾巴，发出欢快的叫声，老人也像爱自己的孩子一样爱着Dindim。他相信Dindim也爱他，因为Dindim喜欢待在老人的腿上等着老人给它喂食，还允许老人把它抱起来，除了老人之外，任何人想接近Dindim，都会被啄。\nDindim为什么会和老人这么亲近，还要每年不远万里来和老人团聚，有生物学家认为，可能是企鹅把老人当成了家人，也可能是Dindim认为老人也是一只企鹅。至于真相，只有企鹅能够告诉你。",qs:[{n:33,q:"5年前，老人发现企鹅时，那只企鹅：",o:["饿得没有了呼吸","身上沾满了石油","身上已开始换毛","非常想有一个家"],a:1,why:"“浑身覆盖着石油”. A sai: <span class='zh'>奄奄一息</span> = thoi thóp (vẫn còn thở)."},{n:34,q:"关于“麦哲伦企鹅”名字的来源，下列哪项正确？",o:["救了Dindim的老人给起的","发现这一物种的人给起的","以企鹅栖息地的地名而命名","以最早发现人的名字而命名"],a:3,why:"“科学界就以麦哲伦命名” — giới khoa học đặt theo tên người phát hiện, không phải Magellan tự đặt (B)."},{n:35,q:"老人认为最奇妙的事情是：",o:["Dindim康复之后一直没有离开他","Dindim大大方方跟着老人回了家","每年6月，Dindim都会准时来看他","Dindim居然能够游3000公里的距离"],a:2,why:"“更为奇妙的是，此后，每年的6月，Dindim都会如期出现”."},{n:36,q:"关于企鹅为什么会和老人这么亲近，下列哪项正确？",o:["老人行事风格很像企鹅","老人把企鹅当成了孩子","这个答案只有企鹅知道","别人的亲近让企鹅不愉快"],a:2,why:"“至于真相，只有企鹅能够告诉你”."}]}]},W:{task:"这篇文章给我们描述了一个奇妙的深海世界，在没有阳光、压力很大的海底，生活着一群奇特的生物，它们靠什么生存，它们有什么奇特的本领。还有什么人类未知的领域。请参考练习5把课文缩写成400字左右的短文。",target:400,steps:[["Chân lý cũ","<span class='zh'>俗话说……；历来……；众所周知的真理；然而……提出了质疑</span>."],["Phát hiện","Đáy biển sâu mấy nghìn mét có nhiều sinh vật; <span class='zh'>深感诧异</span>."],["Giải thích","H₂S → <span class='zh'>恍然大悟，进而提出假说</span>; vi khuẩn <span class='zh'>得以繁殖</span>; chuỗi thức ăn; 化学合成."],["Vi khuẩn chịu nhiệt","250℃ vs 40℃ / 65℃; <span class='zh'>偏偏</span>."],["Bí ẩn còn lại","Giun ống mào đỏ, sò khổng lồ, trai trắng; câu hỏi kết."]],outline:[["一 · 万物生长靠太阳？","植物、动物；质疑"],["二 · 深海的生物","繁殖生命的场所"],["三 · 化学合成","硫化氢、细菌、食物链"],["四 · 耐高温细菌","250℃"],["五 · 未解之谜","红冠蠕虫、巨蛤、白蚌"]],model:"无阳光的深海世界\n俗话说万物生长靠太阳。历来植物生长离不开阳光，而动物又靠植物维持生命，所以没有阳光就没有万物，这是众所周知的真理。然而科学家的深海考察却对这一准则提出了质疑。\n科学家潜水到几千米深的海底，发现那里有蛤、蚌、蟹、红冠蠕虫等许多长相古怪的生物。没有阳光、没有食物、压力又很大，它们靠什么生存呢？\n回到地面后，科学家打开样品，闻到一股刺鼻的臭蛋味，恍然大悟，进而提出了假说：海水从地壳的裂缝渗透到地下，在高温高压下，水里的硫酸盐转化成了硫化氢，某些细菌借硫化氢代谢，吸收温泉的热量得以繁殖。小动物靠过滤细菌生存，又成了大动物的食物，这就构成了新的食物链。这种程序叫“化学合成”，它告诉人类，没有阳光也可能有生命。\n据悉，这种细菌能在250℃的环境下生存。一般情况下，高于40℃大部分动植物就无法成活，高于65℃多数细菌会丧失生命，为什么偏偏这种细菌能存活下来呢？这个奥秘至今还没有解开。\n深海中还有很多使人迷惑不解的问题：红冠蠕虫没有嘴、没有眼，也没有消化系统，它们怎么繁殖后代？巨蛤、白蚌的生理结构和食物基础又是怎样的？这片神秘而广阔的深海世界，也许会成为奇妙的科学研究基地。",check:["Có tiêu đề","Có chân lý cũ + nghi vấn","Có phát hiện sinh vật đáy biển","Có giả thuyết hóa tổng hợp + chuỗi thức ăn","Có số liệu 250℃ / 40℃ / 65℃","Có những bí ẩn còn lại","Dùng ít nhất 3: 进而 · 得以 · 偏偏 · 历来 · 众所周知 · 据悉","Khoảng 400 chữ"]},SUM:{words:["俗话","历来","维持","众所周知","真理","认定","准则","定义","繁殖","场所","古怪","诧异","样品","恍然大悟","进而","分裂","渗透","细菌","过滤","来源","合成","解放","探索","据悉","忍受","超越","丧失","偏偏","真相","华丽","阵容","有条不紊","展现","体积","造型","迷惑","广阔","奇妙","基地"],patterns:[["A，进而 B","科学家恍然大悟，进而提出了这样的假说……"],["（条件）……得以 + V","某些细菌……吸收温泉的热量得以繁殖。"],["偏偏 + V","为什么偏偏这种细菌能够存活下来？"],["据悉，……","据悉，这种细菌忍受高温的本领远远超越了我们的想象。"],["与其……不如……","与其把精力用来探索……，不如去探索……"]],diff:["历来：văn viết, không dùng trong câu phủ định; có thể + tt./đgt. 2 âm tiết — 从来：chủ yếu dùng trong câu phủ định (从来不 / 没)","得以 ≠ 不得已 · 丧失 sàng · 地壳 dìqiào · 歧义句: từ đa nghĩa (锁 · 借 · 租 · 前) / định ngữ không rõ / ngắt nhịp khác nhau"],sentences:["没有阳光，就没有万物，这是众所周知的真理。","它告诉人类，在没有阳光的条件下，也可能有生命；它启发人们，要解放思想，迈向地球以外，探索生命存在的新路。","这片神秘而广阔的深海世界能为我们提供新的食物资源，成为奇妙的科学研究基地吗？"],hw:["Học thuộc 46 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết tóm tắt bài khóa ~400 chữ (mục 7).","Sửa 5 câu đa nghĩa ở phần Mở rộng theo hai cách.","Làm Sách bài tập bài 19.","Đọc trước bài 20."]}});
