<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 6 · 当好职场插班生 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

<script>window.LESSON={id:"hsk6-1-06",num:6,book:"HSK 标准教程 6（上）",unit:{n:2,zh:"不甘平庸",vn:"Không cam chịu tầm thường"},title:"当好职场插班生",vn:"Làm tốt vai “người mới” nơi công sở",chars:785,source:"改编自《北京青年报》同名文章，作者：苏小妮",goals:["Đọc hiểu bài 785 chữ — trải nghiệm của hai nhân viên mới bị “ra rìa” và cách họ dùng nỗ lực để được công nhận.","Dùng được 46 từ mới, đặc biệt nhóm từ <b>công sở – thái độ làm việc</b>: <span class='zh'>资深 · 搭档 · 指标 · 敷衍 · 凑合 · 全力以赴 · 敬业 · 兢兢业业 · 施展</span>.","Nắm <span class='zh'>唯独 · 明明 · 大不了</span> và các mẫu <span class='zh'>以为……没想到…… · 从……上讲 · 作为……，正是……的时候</span>.","Phân biệt <span class='zh'>创立 — 创办</span>; mở rộng kết hợp từ (搭配) thường gặp trong HSK6.","Viết bài “初入……” khoảng 300 chữ kể trải nghiệm hòa nhập tập thể mới."],plan:[["Buổi 1","Khởi động · Từ vựng & ngữ pháp nhóm 1–2 (唯独 · 创立—创办 · 明明 · 大不了) · Bài khóa đoạn 1–4"],["Buổi 2","Từ vựng nhóm 3 (作为……正是……) · Đoạn 5–7 · Bài tập · Kết hợp từ · Luyện đề · Viết văn"]],outline:[{tag:"起",name:"Ngày đầu",paras:"Đoạn 1–2",zh:"上任第一天，被老员工冷落、边缘化",vn:"Ngày đầu nhậm chức ở công ty toàn “lão làng”: không ai pha trà cho hai người mới — cảm giác bị gạt ra rìa."},{tag:"承",name:"Bất công",paras:"Đoạn 3–4",zh:"业务难做，原来是资深员工先挑",vn:"Việc của hai người khó nhất vì người cũ được chọn trước; bạn đồng nghiệp đòi “đòi công bằng”, còn “tôi” coi đây là cơ hội."},{tag:"转",name:"Nỗ lực",paras:"Đoạn 5–6",zh:"不计较、全力以赴，最终得到认可",vn:"Không so đo, dốc sức làm — năng lực vượt bậc, được khen thưởng, đàn anh đàn chị cũng niềm nở."},{tag:"合",name:"Bài học",paras:"Đoạn 7",zh:"插班生的经历正是展示人格魅力的时候",vn:"Làm “học sinh chuyển lớp” nơi công sở chính là lúc thể hiện nhân cách và tài năng."}],warm1:{q:"当你到了一个新环境时（比如转学到一个新的班级、刚加入一个新的球队或团体、第一天工作等等），曾经受到热情欢迎还是冷淡对待？具体说一说你当时的感受。",vn:"Khi đến một môi trường mới (chuyển lớp, vào đội bóng / nhóm mới, ngày đầu đi làm…), bạn từng được chào đón nồng nhiệt hay bị đối xử lạnh nhạt? Kể cụ thể cảm nhận của bạn.",items:[["🏫","转学到一个新的班级","Chuyển sang lớp mới"],["⚽","刚加入一个新的球队或团体","Vừa vào đội bóng / nhóm mới"],["💼","第一天工作","Ngày đầu đi làm"]],talk:["你受到的是热情欢迎还是冷淡对待？","你是怎么让大家接受你的？"],link:"<span class='zh'>插班生</span> = học sinh vào lớp giữa chừng. Bài khóa ví người mới vào công ty như “<b>học sinh chuyển lớp</b> nơi công sở”."},warm2:{q:"想一想下列词语之间有什么联系。",vn:"Các từ trong mỗi nhóm có liên hệ gì với nhau?",groups:[{k:"手",rule:"Tính từ / danh từ + 手 → <b>người</b> giỏi / làm một việc gì.",w:[["老手","lǎoshǒu","tay lão luyện (có trong bài)"],["新手","xīnshǒu","người mới (có trong bài)"],["对手","duìshǒu","đối thủ"],["帮手","bāngshou","người giúp việc"],["高手","gāoshǒu","cao thủ"],["巧手","qiǎoshǒu","người khéo tay"],["人手","rénshǒu","nhân lực"],["生手","shēngshǒu","người chưa quen việc"],["歌手","gēshǒu","ca sĩ"],["好手","hǎoshǒu","tay giỏi (có trong bài)"],["快手","kuàishǒu","người nhanh nhẹn"],["能手","néngshǒu","người thạo việc"],["多面手","duōmiànshǒu","người đa năng"]]},{k:"色",rule:"色 = <b>sắc mặt, vẻ mặt</b> (ngoài nghĩa màu sắc).",w:[["脸色","liǎnsè","sắc mặt (có trong bài)"],["面色","miànsè","sắc mặt"],["气色","qìsè","khí sắc"],["神色","shénsè","thần sắc"],["喜色","xǐsè","vẻ vui mừng"],["眼色","yǎnsè","ánh mắt ra hiệu (từ mới)"],["变色","biànsè","biến sắc"],["不动声色","bú dòng shēngsè","không lộ vẻ gì"],["大惊失色","dà jīng shī sè","kinh hãi thất sắc"],["眉飞色舞","méi fēi sè wǔ","mặt mày hớn hở"]]},{k:"化",rule:"N / Adj + 化 → <b>động từ “trở nên…, hóa…”</b>.",w:[["边缘化","biānyuánhuà","bị gạt ra rìa (có trong bài)"],["丑化","chǒuhuà","bôi xấu"],["美化","měihuà","làm đẹp"],["弱化","ruòhuà","làm yếu đi"],["淡化","dànhuà","làm nhạt đi"],["强化","qiánghuà","tăng cường"],["软化","ruǎnhuà","làm mềm"],["硬化","yìnghuà","xơ cứng"],["绿化","lǜhuà","phủ xanh"],["多样化","duōyànghuà","đa dạng hóa"],["大众化","dàzhònghuà","đại chúng hóa"],["现代化","xiàndàihuà","hiện đại hóa"]]},{k:"式",rule:"式 = <b>kiểu, dạng</b>.",w:[["旧式","jiùshì","kiểu cũ"],["老式","lǎoshì","kiểu xưa"],["新式","xīnshì","kiểu mới"],["中式","zhōngshì","kiểu Trung"],["西式","xīshì","kiểu Tây"],["欧式","ōushì","kiểu Âu"],["美式","měishì","kiểu Mỹ"],["飞跃式","fēiyuèshì","kiểu nhảy vọt (có trong bài)"],["花园式","huāyuánshì","kiểu vườn"],["家庭式","jiātíngshì","kiểu gia đình"]]}]},vgroups:[{name:"Nhóm 1 · Đoạn 1–2",sub:"Ngày đầu nhậm chức",from:1,to:11},{name:"Nhóm 2 · Đoạn 3–4",sub:"Công việc khó — bất công",from:12,to:24},{name:"Nhóm 3 · Đoạn 5–7",sub:"Dốc sức và được công nhận",from:25,to:46}],V:[[1,"上任","shàng rèn","đgt.","thượng nhậm","nhậm chức",1,"","（官吏）就职。","到这家公司上任的第一天","新经理上任不到一个月就做了很多改革。","Giám đốc mới nhậm chức chưa đầy một tháng đã cải cách nhiều.",["新官上任","上任以来"],"Đối với chức vụ lãnh đạo/vị trí mới. <span class='zh'>新官上任三把火</span> = quan mới nhậm chức hăng hái."],[2,"职位","zhíwèi","dt.","chức vị","chức vụ, vị trí",1,"","机关或团体中执行一定职务的位置。","我的职位是咨询师","这个职位要求有三年以上工作经验。","Vị trí này yêu cầu trên ba năm kinh nghiệm.",["职位高","申请职位","空缺职位"],"<span class='zh'>职位</span> = vị trí công việc; <span class='zh'>职务</span> = chức vụ, nhiệm vụ."],[3,"资深","zīshēn","tt.","tư thâm","thâm niên, kỳ cựu",1,"书","资格老，资历深。","不少资深员工","他是一位资深记者。","Ông ấy là một phóng viên kỳ cựu.",["资深员工","资深专家","资深记者"],"Chỉ làm định ngữ trước danh từ chỉ người."],[4,"创立","chuànglì","đgt.","sáng lập","sáng lập, thành lập",1,"书","初次建立。","在公司创立之初","这所大学创立于1898年。","Trường đại học này được thành lập năm 1898.",["创立公司","创立学说","创立于……"],"Xem <b>辨析 创立—创办</b>."],[5,"沏","qī","đgt.","thế","pha (trà)",0,"","用开水冲（茶叶等）。","忙着沏茶和咖啡","客人来了，快沏壶茶。","Khách đến rồi, mau pha ấm trà.",["沏茶","沏一壶茶"],"* Ngoài đề cương. Gần nghĩa <span class='zh'>泡（茶）</span>."],[6,"风气","fēngqì","dt.","phong khí","nếp, bầu không khí",1,"","社会上或某个集体中流行的爱好或习惯。","这单位风气真好","我们班学习风气很浓。","Lớp chúng tôi không khí học tập rất sôi nổi.",["社会风气","学习风气","风气好"],""],[7,"唯独","wéidú","phó.","duy độc","chỉ riêng, duy chỉ",1,"","单单，只。","唯独剩下我和我的搭档","大家都来了，唯独他没来。","Mọi người đều đến, chỉ riêng anh ấy không đến.",["唯独……没有……"],"Xem <b>Ngữ pháp 1</b>."],[8,"搭档","dādàng","dt.","đáp đáng","cộng sự, bạn diễn",1,"口","协作的人；也作动词：协作。","我的搭档","他们俩是多年的老搭档了。","Hai người là cộng sự lâu năm.",["老搭档","黄金搭档","跟……搭档"],"Còn là động từ: <span class='zh'>我们俩搭档</span> (hai ta cặp với nhau)."],[9,"就职","jiù zhí","đgt.","tựu chức","nhận chức",1,"书","正式到任（多指较高的职位）。","与我同一天就职的小林","新总统昨天宣誓就职。","Tân tổng thống tuyên thệ nhậm chức hôm qua.",["就职典礼","宣誓就职"],"Văn viết, trang trọng hơn <span class='zh'>上班 / 入职</span>."],[10,"边缘","biānyuán","dt.","biên duyên","rìa, ven",1,"","沿边的部分；靠近界线的。","我也有被边缘化的感觉","他坐在悬崖边缘。","Anh ấy ngồi ở mép vực.",["边缘化","城市边缘"],"<span class='zh'>被边缘化</span> = bị gạt ra lề, không được coi trọng."],[11,"眼色","yǎnsè","dt.","nhãn sắc","ánh mắt ra hiệu",1,"","向人示意的目光；也指见机行事的能力。","向小林使了个眼色","妈妈给我使了个眼色，让我别说话。","Mẹ nháy mắt ra hiệu bảo tôi đừng nói.",["使眼色","看眼色行事"],"<span class='zh'>使（了个）眼色</span> = nháy mắt ra hiệu. <span class='zh'>看眼色</span> = nhìn sắc mặt người khác mà làm."],[12,"指标","zhǐbiāo","dt.","chỉ tiêu","chỉ tiêu",1,"","计划中规定达到的目标。","有时候还完不成指标","今年的销售指标已经完成了。","Chỉ tiêu doanh số năm nay đã hoàn thành.",["完成指标","经济指标","硬指标"],""],[13,"成天","chéngtiān","phó.","thành thiên","suốt ngày",1,"口","整天。","几乎成天聊天儿、上网、吹牛","他成天玩儿游戏，不学习。","Cậu ta suốt ngày chơi game, không học.",["成天……"],"Khẩu ngữ = <span class='zh'>整天</span>, thường mang ý chê."],[14,"吹牛","chuī niú","đgt.","xuy ngưu","khoác lác, ba hoa",1,"口","说大话；夸口。","上网、吹牛","他就爱吹牛，别信他的话。","Hắn chỉ thích khoác lác, đừng tin.",["爱吹牛","吹牛大王"],"Từ ly hợp: <span class='zh'>吹了半天牛</span>."],[15,"溜","liū","đgt.","lựu","chuồn, lẻn",1,"口","偷偷地走开；滑行。","还有人溜出去逛街","上课时他偷偷溜出了教室。","Trong giờ học cậu ấy lén chuồn ra khỏi lớp.",["溜出去","溜走","溜冰"],"<span class='zh'>溜冰</span> = trượt băng."],[16,"等级","děngjí","dt.","đẳng cấp","cấp bậc, đẳng cấp",1,"","按质量、程度、地位等的差异而作出的区别。","和他们根本就不是一个等级","这些茶叶分为五个等级。","Số trà này chia làm năm hạng.",["等级制度","分等级","不是一个等级"],""],[17,"公道","gōngdao","dt.","công đạo","lẽ công bằng",1,"","公正的道理；也作形容词：公平合理。","小林要去找领导讨公道","这家店的价格很公道。","Giá của cửa hàng này rất phải chăng.",["讨公道","主持公道","价格公道"],"Danh từ <b>gōngdao</b> (thanh nhẹ) = lẽ phải; tính từ = công bằng, phải chăng."],[18,"哼","hng","thán.","hanh","hừ",1,"口","表示不满意或不相信。","哼，太不像话了","哼，我才不信呢！","Hừ, tôi chẳng tin đâu!",["哼，……"],"Đọc <b>hng</b> (âm mũi). Biểu thị bực bội, coi thường."],[19,"不像话","búxiànghuà","tt.","bất tượng thoại","quá đáng, chẳng ra sao",1,"口","（言语行动）不合理；坏得很。","太不像话了","这么晚才回家，真不像话！","Muộn thế này mới về, thật chẳng ra sao!",["太不像话了","真不像话"],"Khẩu ngữ, phê phán hành vi ai đó."],[20,"明明","míngmíng","phó.","minh minh","rõ ràng",1,"口","显然如此。","明明是在欺负人","明明是你错了，还不承认。","Rõ ràng là cậu sai, còn không nhận.",["明明是……，还……"],"Xem <b>Ngữ pháp 2</b>."],[21,"欺负","qīfu","đgt.","khi phụ","bắt nạt, ăn hiếp",1,"","用蛮横无理的手段侵犯、压迫或侮辱。","明明是在欺负人","大孩子不应该欺负小孩子。","Trẻ lớn không nên bắt nạt trẻ nhỏ.",["欺负人","受欺负"],"Đọc <b>qīfu</b> (thanh nhẹ)."],[22,"大不了","dàbuliǎo","phó.","—","cùng lắm thì",1,"口","表示最坏也不过如此。","大不了辞职","大不了从头再来。","Cùng lắm thì làm lại từ đầu.",["大不了……"],"Xem <b>Ngữ pháp 3</b>. Cũng là tính từ: <span class='zh'>没什么大不了的</span> = chẳng có gì to tát."],[23,"展示","zhǎnshì","đgt.","triển thị","thể hiện, trưng bày",1,"","清楚地摆出来；明显地表现出来。","展示自己才干的好机会","这次比赛让他展示了自己的实力。","Cuộc thi này giúp anh ấy thể hiện thực lực.",["展示才华","展示成果","展示自己"],""],[24,"才干","cáigàn","dt.","tài cán","tài năng, năng lực",1,"","办事的能力。","展示自己才干","他很有才干，领导很重视他。","Anh ấy rất có năng lực, sếp rất coi trọng.",["有才干","施展才干"],"Gần nghĩa <span class='zh'>才能 · 才华</span>."],[25,"计较","jìjiào","đgt.","kế giảo","so đo, tính toán",1,"","计算比较；争论。","决定不和他们计较","他从不计较个人得失。","Anh ấy chưa bao giờ so đo được mất cá nhân.",["跟……计较","斤斤计较","不计较"],"<span class='zh'>斤斤计较</span> = tính toán chi li."],[26,"全力以赴","quánlìyǐfù","thành ngữ","toàn lực dĩ phó","dốc toàn lực",1,"成","把全部力量都投入进去。","全力以赴投入工作","为了这次考试，他全力以赴。","Vì kỳ thi này, anh ấy dốc toàn lực.",["全力以赴地……"],"Bài tập 3②."],[27,"怠慢","dàimàn","đgt.","đãi mạn","lạnh nhạt, thờ ơ",1,"","冷淡；招待不周（客气话）。","不怠慢、不敷衍每一位客户","我们不能怠慢任何一位顾客。","Chúng ta không được thờ ơ với bất kỳ khách hàng nào.",["怠慢客人","不敢怠慢"],"Lời khách sáo của chủ nhà: <span class='zh'>怠慢了</span> = tiếp đón không chu đáo."],[28,"敷衍","fūyǎn","đgt.","phu diễn","qua loa, lấy lệ",1,"","做事不负责或待人不恳切，只是表面应付。","不敷衍每一位客户","他总是敷衍了事。","Anh ta lúc nào cũng làm qua loa cho xong.",["敷衍了事","敷衍别人"],""],[29,"想方设法","xiǎngfāng-shèfǎ","thành ngữ","tưởng phương thiết pháp","tìm đủ mọi cách",1,"成","想尽各种办法。","想方设法做好每一单业务","他想方设法帮助困难学生。","Anh ấy tìm đủ mọi cách giúp học sinh khó khăn.",["想方设法地……"],"Bài tập 2⑥, 3②."],[30,"凑合","còuhe","đgt.","thấu hợp","tạm bợ, làm cho có",1,"口","将就；勉强适应不很满意的事物。","多忙都不凑合","这件衣服旧是旧了，还能凑合穿。","Áo này cũ thì cũ, vẫn mặc tạm được.",["凑合着用","凑合一下"],"Khẩu ngữ, đọc <b>còuhe</b>. Nghĩa khác: tụ tập; tạm được (<span class='zh'>还凑合</span>)."],[31,"忙碌","mánglù","tt.","mang lục","bận rộn",1,"书","忙着做各种事情。","忙碌中，时光过得飞快","他每天都很忙碌。","Ngày nào anh ấy cũng bận rộn.",["忙忙碌碌","忙碌的生活"],"Văn viết của <span class='zh'>忙</span>. Bài tập 3②."],[32,"时光","shíguāng","dt.","thời quang","thời gian, quãng thời gian",1,"书","时间；光阴；日子。","时光过得飞快","我很怀念大学时光。","Tôi rất nhớ quãng thời đại học.",["美好时光","时光飞逝"],""],[33,"飞跃","fēiyuè","đgt.","phi dược","nhảy vọt, bứt phá",1,"","比喻突飞猛进。","飞跃式的提高","中国经济取得了飞跃式的发展。","Kinh tế TQ đạt bước phát triển nhảy vọt.",["飞跃发展","质的飞跃"],"Mở rộng: <span class='zh'>飞跃式</span> (Khởi động 2)."],[34,"投诉","tóusù","đgt.","đầu tố","khiếu nại, phàn nàn",1,"","向有关部门申诉。","客户投诉赵姐了","顾客向经理投诉服务员态度不好。","Khách khiếu nại với quản lý rằng phục vụ thái độ kém.",["投诉电话","向……投诉"],""],[35,"激情","jīqíng","dt.","kích tình","nhiệt huyết, đam mê",1,"","强烈激动的情感。","充满激情地工作","他对工作充满了激情。","Anh ấy tràn đầy nhiệt huyết với công việc.",["充满激情","工作激情"],"Bài tập 3②."],[36,"年度","niándù","dt.","niên độ","năm (theo kế hoạch)",1,"","根据业务性质和需要而规定的有一定起讫日期的十二个月。","年度考核","公司正在评选年度优秀员工。","Công ty đang bình chọn nhân viên xuất sắc của năm.",["年度考核","年度报告","年度总结"],""],[37,"考核","kǎohé","đgt.","khảo hạch","đánh giá, sát hạch",1,"","考查审核。","年度考核","公司每年都要考核员工的工作表现。","Hằng năm công ty đều đánh giá hiệu quả làm việc của nhân viên.",["考核制度","年终考核"],""],[38,"敬业","jìngyè","đgt.","kính nghiệp","tận tụy với nghề",1,"","专心致力于学业或工作。","敬业精神","他是一个非常敬业的老师。","Ông ấy là một thầy giáo rất tận tụy.",["敬业精神","爱岗敬业"],""],[39,"兢兢业业","jīngjīngyèyè","tt.","căng căng nghiệp nghiệp","cần mẫn, tận tâm",1,"成","形容做事谨慎、勤恳。","兢兢业业的工作态度","他在这个岗位上兢兢业业工作了三十年。","Ông ấy cần mẫn làm ở vị trí này ba mươi năm.",["兢兢业业地工作"],"Làm định ngữ, trạng ngữ, vị ngữ."],[40,"回报","huíbào","đgt.","hồi báo","đền đáp, báo đáp",1,"","报答；也作名词。","得到了丰厚的回报","付出总会有回报。","Có công ắt có đền đáp.",["得到回报","回报社会","丰厚的回报"],"Mở rộng bài 5: <span class='zh'>报答 — 回报</span>."],[41,"当初","dāngchū","dt.","đương sơ","lúc đầu, trước kia",1,"","指过去发生某件事情的时候。","当初对我们不友好的资深前辈们","早知今日，何必当初？","Biết thế này thì lúc đầu làm vậy làm gì?",["当初……","早知今日，何必当初"],""],[42,"技巧","jìqiǎo","dt.","kỹ xảo","kỹ năng, kỹ xảo",1,"","表现在艺术、工艺、体育等方面的巧妙的技能。","我把工作经验和技巧传授给他们","说话也是需要技巧的。","Nói chuyện cũng cần kỹ năng.",["学习技巧","说话技巧","掌握技巧"],""],[43,"传授","chuánshòu","đgt.","truyền thụ","truyền dạy",1,"","把学问、技艺教给别人。","传授给他们，毫无保留","老师傅把手艺传授给了徒弟。","Thầy cả truyền tay nghề cho học trò.",["传授经验","传授知识"],""],[44,"人格","réngé","dt.","nhân cách","nhân cách",1,"","人的性格、气质、能力等特征的总和；个人的道德品质。","展示你人格魅力的时候","我们要尊重每个人的人格。","Chúng ta phải tôn trọng nhân cách của mỗi người.",["人格魅力","尊重人格"],""],[45,"施展","shīzhǎn","đgt.","thi triển","phát huy, thi thố",1,"","发挥（能力）。","施展才能的时机","这个舞台让他充分施展了才华。","Sân khấu này giúp anh ấy phát huy hết tài năng.",["施展才能","施展才华","施展本领"],""],[46,"时机","shíjī","dt.","thời cơ","thời cơ",1,"","具有时间性的客观条件（多指有利的）。","施展才能的时机","现在还不是最好的时机。","Bây giờ chưa phải thời cơ tốt nhất.",["抓住时机","时机成熟","错过时机"],""]],extra:[["咨询师","zīxúnshī","chuyên viên tư vấn"],["老手 / 新手","lǎoshǒu / xīnshǒu","người cũ / người mới"],["就此","jiùcǐ","từ đó, đến đây"],["使眼色","shǐ yǎnsè","nháy mắt ra hiệu"],["边缘化","biānyuánhuà","bị gạt ra rìa"],["讨公道","tǎo gōngdao","đòi công bằng"],["辞职","cí zhí","từ chức, nghỉ việc"],["点名","diǎn míng","điểm danh; chỉ đích danh"],["接手","jiēshǒu","tiếp nhận (công việc)"],["毫无保留","háo wú bǎoliú","không giấu giếm chút nào"],["插班生","chābānshēng","học sinh vào lớp giữa chừng"],["人格魅力","réngé mèilì","sức hút nhân cách"]],T:[{zh:"这天是我到这家公司上任的第一天，我的职位是咨询师。早就听说这里老手多、新手少，不少资深员工在公司创立之初就开始在这里工作了。",vn:"Hôm ấy là ngày đầu tiên tôi nhậm chức ở công ty này, vị trí của tôi là chuyên viên tư vấn. Tôi đã nghe nói từ lâu ở đây người cũ nhiều, người mới ít, không ít nhân viên kỳ cựu đã làm ở đây từ khi công ty mới thành lập.",idea:"Ngày đầu nhậm chức ở công ty toàn người kỳ cựu.",q:["“我”的职位是什么？","这家公司的员工有什么特点？"],note:[["老手多、新手少","Đối xứng <span class='zh'>老手—新手</span> — xem Khởi động 2 (nhóm 手)."],["在公司创立之初","<span class='zh'>……之初</span> = lúc mới… (văn viết). Xem 辨析 创立—创办."]]},{zh:"清早上班，和新同事一一认识后，我以为一天的工作就此开始，没想到赵姐工作的第一件事是忙着沏茶和咖啡，给张哥端一碗，给孙姐送一杯……我想这单位风气真好，明天这事我来做。正想着，赵姐已经坐在那儿开始自己享受，唯独剩下我和我的搭档——与我同一天就职的小林。顿时小林的脸色变了，我也有被边缘化的感觉，不过我还是向小林使了个眼色。屋子里鸦雀无声，第一天就这样开始了。",vn:"Sáng sớm đi làm, làm quen lần lượt với đồng nghiệp mới xong, tôi tưởng một ngày làm việc bắt đầu từ đây, không ngờ việc đầu tiên của chị Triệu là bận rộn pha trà, pha cà phê, bưng cho anh Trương một bát, mang cho chị Tôn một cốc… Tôi nghĩ nếp ở cơ quan này thật tốt, mai việc này để mình làm. Đang nghĩ thì chị Triệu đã ngồi đó bắt đầu thưởng thức, chỉ còn lại tôi và cộng sự của tôi — Tiểu Lâm, người nhận việc cùng ngày với tôi. Lập tức sắc mặt Tiểu Lâm thay đổi, tôi cũng có cảm giác bị gạt ra rìa, nhưng tôi vẫn nháy mắt ra hiệu với Tiểu Lâm. Căn phòng im phăng phắc, ngày đầu tiên đã bắt đầu như thế.",idea:"Mọi người đều có trà, chỉ hai người mới bị bỏ qua.",q:["赵姐上班的第一件事是什么？","“我”和小林为什么有被边缘化的感觉？"],note:[["我以为……，没想到……，我想……","Chuỗi <b>tưởng → không ngờ → nghĩ</b> tạo bước ngoặt hài hước. Xem <b>Bài tập 4①</b>."],["唯独剩下我和我的搭档","<span class='zh'>唯独</span> = chỉ riêng — đối lập với mọi người đều có trà. Xem Ngữ pháp 1."],["向小林使了个眼色","<span class='zh'>使眼色</span> = nháy mắt ra hiệu (ý: bình tĩnh, đừng nói gì)."]]},{zh:"我和小林的业务很难做，件件都让人头痛，有时候还完不成指标，可别人的工作很快就完了，几乎成天聊天儿、上网、吹牛，还有人溜出去逛街。我和小林虽然是新来的，可我们之前在别的公司也是好手呀。",vn:"Việc của tôi và Tiểu Lâm rất khó làm, việc nào cũng khiến người ta đau đầu, có lúc còn không hoàn thành chỉ tiêu; còn việc của người khác thì xong rất nhanh, gần như suốt ngày tán gẫu, lên mạng, khoác lác, có người còn lẻn ra ngoài dạo phố. Tôi và Tiểu Lâm tuy mới đến, nhưng trước đây ở công ty khác cũng là tay giỏi mà.",idea:"Việc của người mới khó, người cũ thì nhàn.",q:["“我”和小林的工作怎么样？别人呢？"],note:[["件件都让人头痛","Lượng từ lặp <span class='zh'>件件</span> = việc nào cũng…"],["几乎成天聊天儿、上网、吹牛，还有人溜出去逛街","Liệt kê nhịp nhanh, giọng mỉa mai."]]},{zh:"后来我发现，领导分配业务时，总是让资深员工先挑，他们挑剩下的才是我和小林的。我们的工作从难度上讲，和他们根本就不是一个等级。小林要去找领导讨公道：“哼，太不像话了，明明是在欺负人，大不了辞职。”我也觉得不像话，可静下来，也觉得没什么不好，应该说这反而是我们可以展示自己才干的好机会。",vn:"Sau này tôi phát hiện, khi phân việc, lãnh đạo luôn để nhân viên kỳ cựu chọn trước, phần họ chọn còn thừa mới đến lượt tôi và Tiểu Lâm. Xét về độ khó, công việc của chúng tôi và của họ hoàn toàn không cùng đẳng cấp. Tiểu Lâm định đi tìm lãnh đạo đòi công bằng: “Hừ, quá đáng thật, rõ ràng là bắt nạt người ta, cùng lắm thì nghỉ việc.” Tôi cũng thấy quá đáng, nhưng bình tĩnh lại thì thấy cũng chẳng có gì không tốt — phải nói đây ngược lại là cơ hội tốt để chúng tôi thể hiện năng lực.",idea:"Biết nguyên nhân bất công; “tôi” coi đó là cơ hội.",q:["为什么“我”和小林的业务那么难？","小林和“我”的态度有什么不同？"],note:[["从难度上讲","<span class='zh'>从……上讲 / 来说</span> = xét về mặt… Xem Ngữ pháp."],["哼，太不像话了，明明是在欺负人，大不了辞职","Một câu gom ba từ khẩu ngữ: <span class='zh'>不像话 · 明明 · 大不了</span>."],["这反而是……的好机会","<span class='zh'>反而</span> = ngược lại (trái với dự đoán)."]]},{zh:"我和小林决定不和他们计较，全力以赴投入工作，不怠慢、不敷衍每一位客户，想方设法做好每一单业务，多忙都不凑合。",vn:"Tôi và Tiểu Lâm quyết định không so đo với họ, dốc toàn lực vào công việc, không lạnh nhạt, không qua loa với bất kỳ khách hàng nào, tìm mọi cách làm tốt từng đơn việc, bận mấy cũng không làm cho có.",idea:"Không so đo, dốc sức làm tốt từng việc.",q:["“我”和小林是怎样对待工作的？"],note:[["不怠慢、不敷衍……，想方设法……，多忙都不凑合","Chuỗi phủ định <span class='zh'>不…不…</span> + <span class='zh'>多 + Adj + 都……</span> = dù… đến mấy cũng…"]]},{zh:"忙碌中，时光过得飞快，我们的业务能力得到了飞跃式的提高，点名找我们的客户越来越多。有时领导会说，服务对象对张哥不满意，活儿你们接手吧；客户投诉赵姐了，你们处理一下吧。我们每天都充满激情地工作，享受着工作的快乐。年度考核，我和小林的敬业精神、兢兢业业的工作态度受到了表扬，经济上也得到了丰厚的回报。当初对我们不友好的资深前辈们也变得热情起来。再后来，公司来了新人，领导让我带他们，我把工作经验和技巧传授给他们，毫无保留。",vn:"Trong bận rộn, thời gian trôi rất nhanh, năng lực nghiệp vụ của chúng tôi tiến bộ vượt bậc, khách hàng chỉ đích danh tìm chúng tôi ngày càng nhiều. Có lúc lãnh đạo nói: khách không hài lòng với anh Trương, việc này các cậu nhận đi; khách khiếu nại chị Triệu rồi, các cậu xử lý giúp. Ngày nào chúng tôi cũng làm việc đầy nhiệt huyết, tận hưởng niềm vui công việc. Đánh giá cuối năm, tinh thần tận tụy, thái độ làm việc cần mẫn của tôi và Tiểu Lâm được khen ngợi, về kinh tế cũng được đền đáp hậu hĩnh. Những đàn anh đàn chị kỳ cựu trước kia không thân thiện với chúng tôi cũng trở nên nhiệt tình. Sau nữa, công ty có người mới, lãnh đạo bảo tôi kèm họ, tôi truyền lại kinh nghiệm và kỹ năng cho họ, không giấu giếm chút nào.",idea:"Năng lực vượt bậc, được công nhận, rồi trở thành người kèm người mới.",q:["“我们”在公司的处境有了什么变化？","“我”是怎样对待新人的？"],note:[["得到了飞跃式的提高","<span class='zh'>得到 + 了 + 定语 + 提高 / 回报 / 表扬</span> — bị động ý nghĩa."],["我把……传授给他们，毫无保留","Đối lập với cách người cũ đối xử với “tôi” — chi tiết thể hiện nhân cách."]]},{zh:"其实，进入新单位，作为一个职场插班生，这个过程，正是展示你人格魅力的时候，遇到困难，也是你施展才能的时机。",vn:"Thật ra, vào một cơ quan mới, với tư cách một “học sinh chuyển lớp” nơi công sở, quá trình này chính là lúc thể hiện sức hút nhân cách của bạn; gặp khó khăn cũng là thời cơ để bạn phát huy tài năng.",idea:"Bài học: khó khăn ở môi trường mới là cơ hội thể hiện mình.",q:["作者认为“职场插班生”应该怎样看待困难？"],note:[["进入……，作为……，这个过程，正是……的时候，遇到……，也是……的时机","Khung câu kết luận — xem <b>Bài tập 4②</b>."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: kết hợp từ",G:[{id:"g1",grp:0,word:"",zh:"以为……，没想到……，我想……",py:"",tag:"Mẫu kể chuyện (Bài tập 4①)",mean:"Kể diễn biến tâm lý: <b>tưởng</b> (<span class='zh'>以为</span>) → <b>không ngờ</b> (<span class='zh'>没想到</span>) → <b>suy nghĩ / phản ứng</b> (<span class='zh'>我想</span>). Ôn lại <span class='zh'>以为……不料……</span> ở bài 5.",forms:["我以为 + dự đoán，没想到 + sự thật，我想 + phản ứng"],ex:[["我以为一天的工作就此开始，没想到赵姐工作的第一件事是忙着沏茶和咖啡……我想这单位风气真好，明天这事我来做。","",1],["我以为手机丢在了出租车上，没想到它一直在我的包里，我想以后可得细心点儿了。","Tôi tưởng điện thoại rơi trên taxi, không ngờ nó vẫn nằm trong túi, tôi nghĩ sau này phải cẩn thận hơn."]],tips:["<span class='zh'>没想到</span> (khẩu ngữ) ≈ <span class='zh'>不料</span> (văn viết)."]},{id:"g2",grp:0,word:"唯独",zh:"唯独",py:"wéidú",tag:"Chú thích 1 · phó từ",mean:"Phó từ, nghĩa là <span class='zh'>只是、单单</span> — <b>chỉ riêng, duy chỉ</b>. Phía trước thường có nội dung <b>đối lập</b> (mọi người / mọi thứ đều…).",forms:["（大家 / 什么都）……，唯独 + N / mệnh đề + ……"],ex:[["那次旅行大家都去了，唯独你没有去成。","Chuyến đi ấy mọi người đều đi, chỉ riêng cậu không đi được."],["中国的传统节日都是喜气洋洋的，唯独清明节，庄严而伤感。","Lễ truyền thống TQ đều tưng bừng, riêng Thanh minh thì trang nghiêm và buồn thương."],["正想着，赵姐已经坐在那儿开始自己享受，唯独剩下我和我的搭档——与我同一天就职的小林。","",1]],tips:["Đồng nghĩa: <span class='zh'>只有 · 惟有</span>.","Vế trước thường có <span class='zh'>都 · 什么都 · 哪……都</span>."],practice:{q:"用“唯独”完成句子",type:"complete",items:[["我上学的时候，哪门功课都好，________。","我上学的时候，哪门功课都好，唯独数学总是不及格。"],["说理、鼓励、引导、表扬，什么样的教育方式都可以尝试，________。","说理、鼓励、引导、表扬，什么样的教育方式都可以尝试，唯独打骂孩子不行。"],["他对什么都不在意，________，他格外用心。","他对什么都不在意，唯独对自己的工作，他格外用心。"]]}},{id:"g3",grp:1,word:"明明",zh:"明明",py:"míngmíng",tag:"Chú thích 2 · phó từ",mean:"Phó từ, biểu thị <b>rõ ràng, hiển nhiên là như vậy</b>. Trước hoặc sau vế có <span class='zh'>明明</span> thường là <b>câu hỏi tu từ</b> hoặc <b>vế chuyển ý</b>. Dùng nhiều trong khẩu ngữ.",forms:["明明 + sự thật，（却 / 还 / 怎么）+ hành động trái ngược？"],ex:[["你唱的明明是流行歌曲，哪里是京剧啊？","Cậu hát rõ ràng là nhạc pop, kinh kịch chỗ nào?"],["明明是你把书弄丢了，还说不知道，真不像话！","Rõ ràng cậu làm mất sách còn bảo không biết, thật quá đáng!"],["哼，太不像话了，明明是在欺负人。","",1]],tips:["Giọng <b>trách móc, bất bình</b>.","Vị trí: trước động từ / trước cả câu."],practice:{q:"用“明明”完成句子",type:"complete",items:[["________，却不承认，真不讲理！","明明是他先动手打人的，却不承认，真不讲理！"],["你________，这样做不对，为什么还要坚持呢？","你明明知道，这样做不对，为什么还要坚持呢？"],["________，怎么非说没看见？","你明明看见他进了办公室，怎么非说没看见？"]]}},{id:"g4",grp:1,word:"大不了",zh:"大不了",py:"dàbuliǎo",tag:"Chú thích 3 · phó từ",mean:"Phó từ, nghĩa là <span class='zh'>最坏也不过</span> — <b>cùng lắm thì</b>. Biểu thị tuy có khó khăn nhưng cuối cùng vẫn giải quyết được, giọng <b>xem nhẹ</b>. Dùng trong khẩu ngữ.",forms:["（没关系 / 不要紧），大不了 + V（giải pháp xấu nhất）"],ex:[["小林要去找领导讨公道：“哼，太不像话了，明明是在欺负人，大不了辞职。”","",1],["失败了不要紧，大不了从头再来。","Thất bại không sao, cùng lắm làm lại từ đầu."],["别难过了，不就是衣服丢了吗，大不了再买一件。","Đừng buồn nữa, chẳng qua mất cái áo thôi mà, cùng lắm mua cái khác."]],tips:["Còn là <b>tính từ</b> trong phủ định: <span class='zh'>这有什么大不了的？</span> = có gì to tát đâu.","Hay đi với <span class='zh'>不就是……吗</span>."],practice:{q:"用“大不了”改写句子",items:[["坐错车没关系，最多就是坐回去。","坐错车没关系，大不了再坐回去。"],["别难过了，不过就是画儿湿了，我再给你画一张就完了。","别难过了，不就是画儿湿了吗，大不了我再给你画一张。"],["少一个座位？没关系，最多就是少去一个人。","少一个座位？没关系，大不了少去一个人。"]]}},{id:"g5",grp:1,word:"",zh:"从……上讲 / 来说",py:"",tag:"Mẫu nêu góc độ (đoạn 4)",mean:"Nêu <b>góc độ / phương diện</b> để đánh giá: <b>xét về…, nói về…</b>.",forms:["从 + N（难度 / 价格 / 质量……）+ 上讲 / 来说 / 来看，……"],ex:[["我们的工作从难度上讲，和他们根本就不是一个等级。","Xét về độ khó, việc của chúng tôi và của họ không cùng đẳng cấp.",1],["从价格上来说，这款手机比那款便宜多了。","Xét về giá, chiếc điện thoại này rẻ hơn nhiều."]],tips:["Biến thể: <span class='zh'>从……的角度看 · 就……而言</span> (văn viết)."]},{id:"g6",grp:2,word:"",zh:"进入……，作为……，正是……的时候，……也是……的时机",py:"",tag:"Khung kết luận (Bài tập 4②)",mean:"<span class='zh'>作为</span> = <b>với tư cách là</b>; <span class='zh'>正是</span> = <b>chính là</b> (nhấn mạnh). Khung dùng để <b>khái quát bài học</b> ở cuối bài văn.",forms:["进入 + môi trường，作为 + thân phận，这个过程，正是 + V 的时候，遇到 + khó khăn，也是 + V 的时机"],ex:[["其实，进入新单位，作为一个职场插班生，这个过程，正是展示你人格魅力的时候，遇到困难，也是你施展才能的时机。","",1],["其实，进入大学，作为一名新生，这个过程，正是锻炼独立能力的时候，遇到挫折，也是你成长的时机。","Thật ra, vào đại học, với tư cách tân sinh viên, đây chính là lúc rèn tính tự lập; gặp vấp ngã cũng là thời cơ để trưởng thành."]],tips:["<span class='zh'>时候</span> (lúc) — <span class='zh'>时机</span> (thời cơ, mang nghĩa tích cực)."]}],BX:{grp:0,word:"创立",cols:["创立","创办"],pair:"创立 — 创办",same:["Đều là <b>động từ</b>, đều có nghĩa <b>lần đầu, bắt đầu làm</b> (thành lập).","这所女子职业学校于1985年创立 / 创办。"],diff:[["Nhấn ý <b>khai sáng, thành lập</b> (lập nên cái mới).","这个组织创立于1942年。","Nhấn ý <b>mở ra và kinh doanh, vận hành</b>.<div class='zh' style='margin-top:4px'>他们几个人一起创办了一家民营企业。</div>"],["Dùng được cho <b>chính đảng, quốc gia, học thuyết, lý luận</b>.","这个政党刚创立时，参加人员并不多。/ 创立一个新的学术体系是个复杂的过程。","<b>Không</b> dùng cho chính đảng, quốc gia, học thuyết, lý luận."]],task:{q:"选择“创立”或“创办”填空",cols:["创立","创办"],sample:!1,items:[["他们夫妻俩一手____起这家汽车修理厂。",1,"Mở và kinh doanh xưởng sửa xe → 创办."],["这个学说____于18世纪中期，开始时遭到许多质疑。",0,"Học thuyết → chỉ dùng 创立."],["近年来，一些地方相继____了各种以营利为目的的服务中心。",1,"Trung tâm dịch vụ kinh doanh sinh lời → 创办."],["新理论____初期，遇到很多困难和挑战。",0,"Lý luận → 创立."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["就<u>职</u>","辞职 · 兼职 · 职业 · 职务"],items:[["职<u>位</u>","位","岗位 · 座位 · 地位 · 位置"],["<u>唯</u>独","唯","唯一 · 唯心 · 唯美 · 唯利是图"],["<u>才</u>干","才","才华 · 才力 · 才学 · 人才"],["敬<u>业</u>","业","职业 · 工业 · 农业 · 业务"]]},EX2:{q:"用所给词语完成句子",type:"complete",vn:"Sách không có đáp án cố định — câu mẫu chỉ để tham khảo.",items:[["别的事还可以放一放，________。","唯独","别的事还可以放一放，唯独这件事必须今天办完。"],["爸爸________，从来没有闲下来的时候。","成天","爸爸成天忙着工作和家务，从来没有闲下来的时候。"],["失业了也没什么，________。","大不了","失业了也没什么，大不了再找一份新工作。"],["我的笔________，怎么一转眼不见了呢？","明明","我的笔明明刚才还放在桌子上，怎么一转眼不见了呢？"],["没有床，只有一张沙发，你________。","凑合","没有床，只有一张沙发，你就凑合着睡一晚吧。"],["每当我遇到困难时，他________。","想方设法","每当我遇到困难时，他总是想方设法地帮助我。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["搭档","创立","资深","风气","计较"],text:"上个星期，我加入了学校篮球队，跟球队的{搭档}们一一认识之后，我的训练生活就此开始。张教练在球队{创立}之初就在这儿了，他是一位富有经验的{资深}篮球教练。我们球队的{风气}非常好，大家互相帮助，训练刻苦认真，没人喊累，没人抱怨，训练中受点儿伤也都不{计较}，我很喜欢这个集体。"},{bank:["激情","想方设法","凑合","全力以赴","忙碌"],text:"同事小张非常敬业，他对待工作充满{激情}，总是{想方设法}出色完成每一项任务，从来不{凑合}。最近，他接到一个新任务，为一个新项目做前期准备。小张带领他们部门的员工{全力以赴}投入工作，虽然很{忙碌}，却享受到了工作的快乐。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"清早上班，和新同事一一认识后，我<u>以为</u>一天的工作就此开始，<u>没想到</u>赵姐工作的第一件事是忙着沏茶和咖啡，给张哥端一碗，给孙姐送一杯……<u>我想</u>这单位风气真好，明天这事我来做。",task:"今天在办公室，我怎么也找不到自己的手机了，我以为______，没想到______，我想______。",model:"今天在办公室，我怎么也找不到自己的手机了，我以为是丢在出租车上了，没想到同事把它放进了我的抽屉里，我想以后一定要把东西放好。"},{src:"其实，<u>进入</u>新单位，<u>作为</u>一个职场插班生，这个过程，<u>正是</u>展示你人格魅力的时候，<u>遇到</u>困难，<u>也是</u>你施展才能的时机。",task:"其实，进入______，作为______，这个过程，正是______的时候，遇到______，也是______的时机。",model:"其实，进入一个新的球队，作为一名新队员，这个过程，正是锻炼自己的时候，遇到挫折，也是你证明自己实力的时机。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["说说“我”在这家公司的职位以及公司的人员构成情况。","咨询师、老手、新手、资深员工","“我”的职位是咨询师。公司里老手多、新手少，不少资深员工在公司创立之初就在这里工作了。"],["上班第一天，其他老员工对“我”和小林的态度如何？","①给……沏茶/咖啡 ②唯独剩下 ③边缘化","赵姐给张哥、孙姐等老员工沏茶、沏咖啡，唯独剩下“我”和小林，我们有被边缘化的感觉。"],["“我”和小林在公司的工作与别人有何不同？为什么？","①“我”和小林的业务……，件件……，有时候…… ②别人的工作……，成天……，还有人…… ③我发现，领导分配业务时，……","“我”和小林的业务很难做，件件都让人头痛，有时候还完不成指标；别人的工作很快就完了，成天聊天儿、上网、吹牛，还有人溜出去逛街。原来领导分配业务时，总是让资深员工先挑。"],["“我”和小林如何对待自己的工作？","不计较、全力以赴、不怠慢、不敷衍、想方设法、不凑合","我们决定不和他们计较，全力以赴投入工作，不怠慢、不敷衍每一位客户，想方设法做好每一单业务，多忙都不凑合。"],["“我们”在公司的处境有了什么变化？","①业务能力…… ②客户…… ③接手…… ④年度考核…… ⑤……热情起来 ⑥新人……","我们的业务能力得到了飞跃式的提高，点名找我们的客户越来越多，领导还让我们接手别人的业务；年度考核受到表扬，得到了丰厚的回报；资深前辈们也热情起来；后来领导还让“我”带新人。"],["通过“职场插班生”的经历，“我”有什么收获？","①展示……魅力 ②施展才能","“我”明白了，作为职场插班生，这个过程正是展示人格魅力的时候，遇到困难也是施展才能的时机。"]]},DP:{title:"词汇：熟悉下列词语搭配",items:[["性感","xìnggǎn","gợi cảm","身材性感","她是一位性感明星。"],["澄清","chéngqīng","làm rõ, đính chính","澄清事实","他决心一定要澄清事情的真相。"],["奠定","diàndìng","đặt nền móng","奠定基础","他数年来的刻苦训练为赢得今天的大赛奠定了基础。"],["动机","dòngjī","động cơ","没有动机 / 动机不纯","即便动机是好的，如果方法不对，也会把事情办坏。"],["断绝","duànjué","cắt đứt","断绝来往","和他那样的人断绝往来绝对是明智的。"],["见闻","jiànwén","điều tai nghe mắt thấy","旅游见闻 / 增长见闻","旅游不光使我们增长见闻，还能让我们认识更多的朋友。"],["章程","zhāngchéng","điều lệ","公司章程","员工们都应该熟悉本公司的章程。"],["周年","zhōunián","tròn năm, kỷ niệm năm","结婚周年 / 周年庆典","明天是我们公司成立十周年庆典。"],["起草","qǐcǎo","soạn thảo","起草文件","我起草了一个俱乐部章程，你再修改一下。"],["无赖","wúlài","kẻ vô lại; ăn vạ","耍无赖","谁都不喜欢毫不讲理的无赖。"],["暧昧","àimèi","mập mờ, ám muội","态度暧昧 / 关系暧昧","你有没有发现，咱们办公室的小王和小李关系有点儿暧昧。"],["后顾之忧","hòugù zhī yōu","nỗi lo về sau","—","只有不断完善社会保障制度，才能让人民生活没有后顾之忧。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"走出学校七年，张越住过地下室，被人炒过鱿鱼，为事业押上过全部财产，也曾经山穷水尽。如今，他从一个冒冒失失的青年成长为颇具头脑的公司高管，全力以赴地干着他最喜欢的工作。",o:["张越曾经很敬业","张越很喜欢旅游","张越家有地下室","张越渐渐成熟了"],a:3,why:"“从一个冒冒失失的青年成长为颇具头脑的公司高管”."},{n:2,say:"知名医学杂志《柳叶刀》几年前就发表了一系列综述文章，指出身体活动水平低下是当今人类健康的第四大杀手。世界卫生组织的数据显示，全球每年死亡的人群中，有10%直接源自身体活动水平低下。",o:["《柳叶刀》是一本生活杂志","《柳叶刀》传授一系列保健知识","生活水平低仍然在威胁人类健康","人类死亡原因之一是身体活动水平低下"],a:3,why:"“10%直接源自身体活动水平低下”. (C: “生活水平” ≠ “身体活动水平”.)"},{n:3,say:"菊花经过人工栽培，由野生变为家菊。据北宋《宣和画谱》记载，菊花作为绘画的表现对象是从唐朝末年开始的，可惜作品无传。中国最早的菊花邮票，是1958年发行的，也是我国第一套花卉邮票。",o:["菊花原本是野生植物","很多家庭都喜欢种菊花","资深画家都喜欢画菊花","中国出过很多菊花邮票"],a:0,why:"“由野生变为家菊”."},{n:4,say:"每次与朋友说起非洲的撒哈拉沙漠，大家都会想起《撒哈拉的故事》，自然又都会讲起书的作者三毛。当我也来到三毛随丈夫荷西居住的西属撒哈拉那座城市时，我对40年前三毛选择在这里生活有点儿肃然起敬。",o:["我的朋友很喜欢讲故事","40年前三毛就想去非洲","三毛是我40年前认识的朋友","《撒哈拉的故事》的作者是三毛"],a:3,why:"“书的作者三毛”."},{n:5,say:"现今不少人喜欢用简练、时尚的网络语言进行交流，无论是在虚拟世界还是现实世界。我们不能说这不是社会发展的正常现象，但我们仍需思考语言如何变化才能更适应社会的发展，而不是向原始时代的简单符号倒退。",o:["网络语言不适用于严肃场合","原始语言被边缘化是必然的","网络语言已经步入了现实生活","网络语言在现实世界不受欢迎"],a:2,why:"“无论是在虚拟世界还是现实世界” → đã đi vào đời thực."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：大家好。今天我们请李总跟我们说说他的创业故事。李总，我们很想知道，当初您怎么就选择了美容行业？\n男：我选择了一个自己从未涉足过的行业作为事业的起点。当时就想：爱美，是人的天性，只要人类存在，这个行业就会存在；其次，美容业也存在薄弱环节，超过别人的成绩很难，而超越别人的弱点就比较容易了；另外呢，我以前没有接触过这个行业，所以就不会有什么约束，就更有可能超越别人。\n女：您就是抱着这样的想法开始在美容行业施展才能的？\n男：对。我认为干哪行要研究透哪行。比如，我们的公司创立不久，我就跑遍了全国各地的美容院，一方面取经，学习别人的优点，另一方面就是发现别人的弱点，并且想方设法克服这些弱点，结果我的企业就得到了飞跃式的发展。\n女：您觉得目前中国的美容业存在哪些问题？\n男：从业人员钻研能力不强，文化素质不是很高，缺乏工作激情，人员流动性又很大，这是美容业面临的共同问题。有些店铺装潢前卫，收费也高，顾客的需求却得不到很好的满足。还有，整个行业的店铺使用的产品大多雷同，技术也缺乏特色。\n女：所有这些问题不在您身上发生，您就成功了。\n男：当然。\n女：听说您店里的员工个个都有才干，做事兢兢业业，从不敷衍凑合。\n男：用我的话说，我重视的是“态度”。我把“态度”看成是人的第一能力，这种能力比职业技能本身更重要。我注重员工们的心态培养，我坚信人有好的心态，才能把事情做好，美容技术是其次的事情。我觉得自己的成就之一就是改造了我的员工的思想和观念，从我手下走出去的年轻人，回到家乡后，他们的彬彬有礼，常让家人惊叹，他们做事的干练有素也令人折服。这种从精神层面改变人的管理风格，也许就是我成功的原因之一吧。",qs:[{n:6,q:"李总为什么选择了美容业？",o:["他以前做过美容","美容业比较落后","美容行业很开放","人类天生就爱美"],a:3,why:"“爱美，是人的天性”. (A sai: “从未涉足过”.)"},{n:7,q:"李总创立公司后做了什么事？",o:["努力学习美容技术","到全国各地去旅行","克服自己公司的弱点","吸取其他公司的优点"],a:3,why:"“跑遍了全国各地的美容院……学习别人的优点”. (C: khắc phục điểm yếu <i>của người khác</i>.)"},{n:8,q:"以下哪一项是美容业存在的问题？",o:["从业人员不稳定","从业人员收入低","从业人员不爱读书","美容业收费不公道"],a:0,why:"“人员流动性又很大” → không ổn định."},{n:9,q:"李总企业的管理特点是什么？",o:["注重员工技能的考核","注重员工心态的培养","注重员工的工作效率","培养员工的做事能力"],a:1,why:"“我注重员工们的心态培养”."},{n:10,q:"关于李总，下列哪项正确？",o:["虚心做人，认真做事","对自己的缺点零容忍","有自己独特的经营之道","对美容业改革情有独钟"],a:2,why:"Chọn ngành chưa từng làm, học ưu điểm – vượt điểm yếu người khác, coi trọng “thái độ” → cách kinh doanh riêng."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"我最敬佩的人是医生。医生是忘我的，当他看到病人，从不想自己也有可能被传染，只希望尽快为病人解除病痛；医生是坚强的，当他们看到在生死线上犹豫的病人，心里只有一个念头，就是让病人赶快转危为安；医生是勇敢的，那些大大小小的手术，对医生来说，每次都是挑战；医生是强大的，他们用自己的聪明才智，为无数人撑起一片蓝天。\n敬佩不是虚假的，我的理想就是做一名令人敬佩的医生，我要坚持自己的理想，并让理想变成现实！",qs:[{n:11,q:"医生具备什么样的精神特质？",o:["公而忘私","人格独立","敢于冒险","真诚善良"],a:0,why:"“医生是忘我的……从不想自己也有可能被传染” → quên mình vì người."},{n:12,q:"面对病人，医生是怎样做的？",o:["保证自己不被传染","传授病人生存技巧","鼓励病人战胜疾病","一心想把病人治好"],a:3,why:"“心里只有一个念头，就是让病人赶快转危为安”."},{n:13,q:"根据这段话可以知道什么？",o:["做医生非常辛苦","想做医生的人很少","说话人也想做医生","医生都是有理想的"],a:2,why:"“我的理想就是做一名令人敬佩的医生”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"这是一家著名的公司，本次招聘一个人，报名应聘的却有600多人。小路通过了初试、笔试，顺利进入了复试阶段。公司老总将亲自出马，在5人中确定一名最终人选。\n复试的内容普通得不能再普通了：上午参观公司，下午两点谈观后感。5个人都不敢松懈，希望抓住在老总面前表现的好时机。下午两点，5个人准时来到会议室，等待老总的出现。\n两点半，老总姗姗来迟，却没有半句道歉的话。受尽怠慢的应聘者心里虽然不高兴，脸上却不敢表现出来，只是针对上午参观的情况争相发言。有的建议公司强化企业文化，有的说公司的环境卫生不可忽视。\n小路最后一个发言，他只说了一句：“老总，您今天迟到了半小时。”话一出口，满座皆惊，众人认为他无异于主动放弃了这次机会。小路却觉得：作为一个以管理严格著称的公司的老总，无故迟到半小时很不像话。大不了就是不被录用，真话总是要讲的，再说了，这样下去，肯定不利于公司的发展。\n谁都没有料到的是，当天晚上，小路就接到了公司的录用通知。原来，迟半小时到场，正是老总的有意安排。",qs:[{n:14,q:"关于这家公司，可以知道什么？",o:["这次要招5个人","不太重视应聘者","以管理严格闻名","复试内容非常难"],a:2,why:"“以管理严格著称的公司”."},{n:15,q:"关于小路以外的应聘者，可以知道什么？",o:["很愿意与老总交流","各个修养都非常好","发言特别能打动老总","不敢指出老总的过错"],a:3,why:"“心里虽然不高兴，脸上却不敢表现出来”."},{n:16,q:"关于老总可以知道什么？",o:["不懂得尊重别人","迟到是他的习惯","特别设计了复试题目","不爱听别人的批评意见"],a:2,why:"“迟半小时到场，正是老总的有意安排”."},{n:17,q:"关于小路可以知道什么？",o:["不珍惜这次招聘机会","受不了别人怠慢自己","认为是对的就去坚持","认为公司的风气不好"],a:2,why:"“大不了就是不被录用，真话总是要讲的”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["这座古老的磨坊完好地保存着昔日的工作景象。","挫折与苦涩的道路，使他变得超乎常人的坚强。","我一直觉得蜻蜓是很美的，和蝴蝶一样，是大自然的精灵。","世界上最公平的事在于：聪明人洋洋自得，糊涂人也不认为自己差多少。"],a:1,why:"<b>Kết hợp sai</b>: <span class='zh'>挫折……的道路</span> không hợp — phải là <span class='zh'>挫折与苦涩的经历</span>, hoặc <span class='zh'>坎坷与苦涩的道路</span>."},{n:19,o:["我的生活中有很多令我满意的事情，我现在很满足。","这是我第一次面对这么多人演讲，坦率地说，非常紧张。","她的表演感染了观众，她的声音也像她的穿戴一样，银铃般美丽。","成功人士都会告诉你，什么时候都不能没有梦想，没有梦想就不会成功。"],a:2,why:"<b>So sánh không cùng loại</b>: “银铃般” chỉ âm thanh, không thể nói quần áo “như tiếng chuông bạc” → <span class='zh'>她的声音像银铃般美丽</span>."},{n:20,o:["对新事物渴望的反面，便是对旧事物的厌弃。","聚会时我认识了一对男女，大家越聊越有相见恨晚之感。","我坐在街角的咖啡馆，一边饮咖啡，一边观赏着形形色色的行人。","你有发现一个有意思的现象吗？大家聚到一起，抱怨的话题总是最多的。"],a:3,why:"<span class='zh'>有 + 发现</span> (有 + động từ) không chuẩn trong tiếng phổ thông → <span class='zh'>你发现了一个有意思的现象吗？/ 你发现没有？</span>"}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"随着受教育者学习自觉性和知识、能力的___，他们可以在越来越大的___上，主动自觉___知识。",o:["增长　程度　获取","增进　范围　记取","扩大　水平　学习","扩充　领域　获得"],a:0,why:"<span class='zh'>知识、能力的增长</span>; <span class='zh'>在……程度上</span>; <span class='zh'>获取知识</span> (chủ động tìm lấy)."},{n:22,text:"科学的发展史，也是一___思维的发展史。在人类的社会实践中，正是思维___了客观世界的真实情况，从而___了科学的发展。而科学的发展，对人类的思维提出了更高的要求。这就是人类的思维从低级到高级、从简单到复杂、从具体到抽象的发展___。",o:["段　展示　促进　经过","本　显示　促成　过程","部　提供　推动　历程","篇　体现　鼓励　进程"],a:2,why:"<span class='zh'>一部……史</span>; <span class='zh'>提供……情况</span>; <span class='zh'>推动……发展</span>; <span class='zh'>发展历程</span>."},{n:23,text:"三元桥___于1984年，初建时称牛王庙桥。___后来改称三元桥的原因，如今已是说法各异。一说是因挨着三元庵，故名；也有人说三元桥___水源八厂，在三条路的___处，便叫“三元桥”了。",o:["建筑　以至　左近　交接","始建　至于　临近　交会","建立　至今　相近　连接","创建　倒是　靠近　相连"],a:1,why:"<span class='zh'>始建于……</span> (công trình); <span class='zh'>至于</span> = còn về (chuyển đề tài); <span class='zh'>临近</span>; <span class='zh'>交会处</span>."}]},read3:{ins:"第24–28题：选句填空。",text:"管宁和华歆年轻的时候是一对非常要好的朋友。他俩整天同吃同住，形影不离。一次，两人一起在菜园里翻地，管宁翻出一块硬东西，仔细一看，是一块闪闪发光的金子。管宁自言自语道：“(24)，原来是块金子。”接着，就继续干他的活儿去了。“什么？金子！”不远处的华歆立刻跑了过来，捡起金块拿在手里舍不得放下。管宁劝华歆说：“(25)，不应该不劳而获。”华歆听了，说：“这个道理我也懂。”可还是拿着金子不放手。\n又有一次，他们两人坐在一张席子上读书。正看得入神，外面热闹起来，(26)，管宁却像什么都没听到一样，继续读书。原来外面有位大官乘着豪华的车子从这里经过。华歆完全被吸引住了，他觉得在屋里看不清楚，(27)。\n看到华歆的所作所为，管宁再也忍不住了。等华歆回来以后，管宁拿出刀子把他们二人的席子从中间划开，一分为二，并对华歆说：“(28)。从今以后，我们就像这草席一样，再也不是朋友了。”",opts:["钱财应该靠自己的劳动获得","我们两人的志向和情趣太不一样了","干脆跑到街上去看","我当是什么东西呢","华歆走到窗前去看究竟发生了什么事"],ans:{24:3,25:0,26:4,27:2,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"王大海认为自己是个不走寻常路的人，他只选择自己感兴趣的东西。因为父母都经商，他从小受家庭影响，最大的愿望就是快速进入社会。他喜欢跳跃的生活方式，按部就班的高中生活不适合他。职业高中对他来说是最合心意的乐土：专业是他喜欢的计算机，有一群动手能力强又好玩儿的朋友，连老师都是朋友式的，完全没有高中那种紧张的气氛。\n毕业时，王大海已经拿到了IBM网络工程师资格证书。但求职时，应聘单位只让他做销售，拿着证书的王大海觉得这些单位简直就是欺负人，心里说：“我是IBM工程师啊！”他根本看不上销售工作。于是，他和几个同学一商量，决定开家网络工作室。可是短短三个月工作室就经营不下去了。因为五个人个性都很强，他们的意见常常无法统一。这时王大海才明白，他们和社会离得还太远。\n再次进入公司，王大海明白自己该做什么了。为了尽快熟悉业务，他加班加点，成天在公司忙碌，他勤奋努力，凭自己的能力解决问题，很快就成了部门负责人，一路顺风做到主管。之后，他跳槽到了一家更好的公司，不久就成了公司最优秀的人才。再次求职，王大海的目标是他向往已久的某知名企业。经过不懈的努力，王大海如愿成为公司最年轻的副总。就在别人看来他正如鱼得水的时候，王大海却决定辞职，因为他的梦想一直是有一家属于自己的公司。",qs:[{n:29,q:"关于王大海，下列哪项正确？",o:["与一般人不太一样","做选择时听父母的","希望社会快速发展","从小就很希望读书"],a:0,why:"“是个不走寻常路的人”."},{n:30,q:"适合王大海的学校有什么特点？",o:["学生们体育都是强项","老师和同学都爱聊天儿","天天都能玩儿计算机","不同于规规矩矩的高中"],a:3,why:"“完全没有高中那种紧张的气氛”, khác với <span class='zh'>按部就班</span>."},{n:31,q:"刚毕业时的王大海：",o:["没拿到资格证书","看不上销售工作","与搭档们合不来","不懂看眼色行事"],a:1,why:"“他根本看不上销售工作”."},{n:32,q:"根据最后一段可以知道：",o:["王大海天生就是当领导的材料","王大海工作努力，不计较时间","王大海干不下去了，就换公司","王大海想开办一家养鱼的公司"],a:1,why:"“加班加点，成天在公司忙碌”. (D: <span class='zh'>如鱼得水</span> là thành ngữ, không phải nuôi cá!)"}]},{ins:"第33–36题：请选出正确答案。",text:"某日无聊，我在电脑中搜索自己的姓名，结果吓了一跳，居然有160万条！母亲说，当年她给我哥起名的时候，头脑中闪过“光明磊落”这个成语，就用了其中的“磊”字；四年之后，轮到给我起名，就用了“明”字。母亲唯独没有想到，我的名字会这么受欢迎。\n参加工作不久，另一个单位招聘，举行公开录用考试。新单位职位好，有前途。我考试成绩优秀，只等喜讯传来，走马上任。可时间一天天溜走，好消息却迟迟不来，直到发现成绩不如我的人都报到了，我才打听到，领导研究录取名单时，发现单位中现有的一人与我重名，担心在以后的工作中会带来不便，说了句：“年轻人，机会多得是，让他等下次吧。”我的美好前程就这样付之东流了。\n又一次，我调动工作，所有的手续都办完了，发工资的日子，却发现工资卡上没有钱。我跑去责问会计，她满脸委屈，说我的工资明明转入了银行账户，半点儿差错都不会有。再去银行查对，老半天才找出原因，原来工作人员忙中出错，将我的钱转入了另一个人的工资账户。那人的名字与我音同字同，不差分毫。\n女儿出生时，深受同名之苦的我决心给她起个与众不同的名字。我绞尽了脑汁，找到两个读音优美、有意境、笔画也不复杂的汉字：珮沨。上户口的时候，户籍警察在电脑里翻找了半天，告诉我这是两个冷字，字库里没有，打不出来。我犹豫再三，只好改用两个常见的同音字来代替：佩风。女儿长大了，无数次质问我，她的名字为什么如此奇怪，两个字的组合毫无意义，我敷衍地笑笑，懒得旧事重提。不过，这个名字也有好处，起码到现在，我还没发现有同名者。",qs:[{n:33,q:"我没被新单位录用的原因是：",o:["160万人和我名字相同","我上班的第一天迟到了","领导担心重名会带来麻烦","录用指标希望留给年轻人"],a:2,why:"“与我重名，担心在以后的工作中会带来不便”."},{n:34,q:"根据第3段可以知道：",o:["调动工作的手续很复杂","我的工资错给了重名者","我的工资的确没有发错","忙不是工作出错的理由"],a:1,why:"“将我的钱转入了另一个人的工资账户。那人的名字与我音同字同”."},{n:35,q:"我原本给女儿起的名字：",o:["遭到户籍警察的投诉","有意境但读者不美","字少见，电脑里没有","我喜欢，女儿不喜欢"],a:2,why:"“这是两个冷字，字库里没有，打不出来”."},{n:36,q:"上文主要谈的是：",o:["起个好名字不容易","名字不好就应该改","我的名字起得太草率","重名给我带来的烦恼"],a:3,why:"Cả bài kể những phiền toái do trùng tên."}]}]},W:{zh:"写作",vn:"Viết văn: 初入……",task:"这篇课文通过“我”进入职场初期的经历，告诉我们在刚进入职场时可能会遇到一些不公平的对待，可是如果我们不放弃，坚持努力，一定会得到大家的认可。你在进入一个新的团体时（比如：公司、球队、班级、乐队等等），是否也遇到过类似的情况，你是怎样做的？最后的结果如何？参考课文以“初入……”为题，写一篇300字左右的短文。",target:300,steps:[["Đặt tiêu đề","<span class='zh'>初入职场 / 初入球队 / 初入大学 / 初入乐队</span>…"],["Tình huống ban đầu","Bạn bị đối xử thế nào? Dùng <span class='zh'>以为……，没想到……</span>, <span class='zh'>唯独</span>, <span class='zh'>被边缘化</span>."],["Phản ứng & cách làm","Bạn nghĩ gì, làm gì? <span class='zh'>不计较 · 全力以赴 · 想方设法 · 不凑合</span>."],["Kết quả","Sự thay đổi: được công nhận, mọi người nhiệt tình hơn…"],["Bài học","Kết bằng khung <span class='zh'>进入……，作为……，正是……的时候</span>."]],outline:[["起 · Mở đầu","Thời gian, nơi mới; mong đợi ban đầu (以为……)"],["承 · Khó khăn","Bị lạnh nhạt / bất công (没想到…… · 唯独…… · 明明……)"],["转 · Nỗ lực","Quyết định và hành động (不计较 · 全力以赴 · 想方设法)"],["合 · Kết quả – bài học","Được công nhận; khái quát bài học (作为……正是……)"]],model:"初入球队\n上大学后，我加入了学校的足球队。我以为大家会热情地欢迎新队员，没想到第一次训练，老队员们只顾自己练球，唯独把我和另一个新生晾在一边。教练分组比赛时，我们也总是坐在场边，有被边缘化的感觉。\n同伴有点儿生气，说：“明明是看不起新人，大不了不练了。”我也觉得不像话，可冷静下来想一想，作为新人，技术确实不如他们，抱怨是没有用的。于是我们决定不计较，每天提前一个小时到球场练习，训练时全力以赴，从不凑合。遇到不会的动作，就想方设法向老队员请教。\n半年过去了，我们的球技有了飞跃式的提高。在一次校际比赛中，我踢进了关键的一球，队友们一下子把我围了起来。从那以后，老队员们对我们热情多了，还常常一起吃饭聊天儿。\n现在想来，进入一个新集体，作为一个新成员，被冷落的时候，正是锻炼自己的时候，遇到困难，也是证明自己的时机。",check:["Tiêu đề dạng “初入……”","Có tình huống bị đối xử chưa công bằng","Có cách bạn ứng xử","Có kết quả và sự thay đổi","Có câu khái quát bài học","Dùng ít nhất 2 trong: 唯独 · 明明 · 大不了","Khoảng 300 chữ (±30)"]},SUM:{words:["上任","职位","资深","创立","风气","唯独","搭档","指标","成天","不像话","明明","欺负","大不了","展示","才干","计较","全力以赴","怠慢","敷衍","想方设法","凑合","忙碌","飞跃","投诉","激情","考核","敬业","兢兢业业","传授","施展","时机"],patterns:[["以为……，没想到……，我想……","我以为一天的工作就此开始，没想到……"],["唯独 + ……","唯独剩下我和我的搭档。"],["明明 + sự thật（+ phản vấn）","明明是在欺负人。"],["……，大不了 + V","大不了辞职。"],["从……上讲","从难度上讲，……不是一个等级。"],["作为……，正是……的时候","作为一个职场插班生，这个过程，正是展示你人格魅力的时候。"]],diff:["创立：nhấn khai sáng, thành lập; dùng cho chính đảng, quốc gia, học thuyết — 创办：nhấn mở ra và vận hành (trường, công ty, xưởng…)","怠慢 (lạnh nhạt với người) · 敷衍 (làm lấy lệ) · 凑合 (tạm bợ, làm cho có) · 计较 (so đo) — đều là thái độ tiêu cực; 敬业 · 兢兢业业 · 全力以赴 — thái độ tích cực"],sentences:["我和小林决定不和他们计较，全力以赴投入工作，不怠慢、不敷衍每一位客户，想方设法做好每一单业务，多忙都不凑合。","我把工作经验和技巧传授给他们，毫无保留。","其实，进入新单位，作为一个职场插班生，这个过程，正是展示你人格魅力的时候，遇到困难，也是你施展才能的时机。"],hw:["Học thuộc 46 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “初入……” khoảng 300 chữ (mục 7).","Làm Sách bài tập bài 6 (nghe 1–17, đọc 18–36).","Đọc trước bài 7 《我的人生我做主》."]}});
