<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 3 · 一盒月饼 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

lòng tự trọng, muốn được người khác coi trọng</b> (nghĩa tích cực). Bài nghe SBT 6–10 bàn về 面子."],[43,"辜负","gūfù","đgt.","cô phụ","phụ lòng",1,"","对不住（别人的好意、期望或帮助）。","从来没有辜负过我的期望","我一定不辜负大家的期望。","Tôi nhất định không phụ kỳ vọng của mọi người.",["辜负期望","辜负好意","辜负信任"],"Tân ngữ: <span class='zh'>期望 · 信任 · 好意 · 一片心意</span>."],[44,"期望","qīwàng","đgt.","kỳ vọng","kỳ vọng, mong đợi",1,"书","对未来的事物或人的前途有所希望和等待。","辜负过我的期望","父母对孩子总是有很高的期望。","Cha mẹ luôn kỳ vọng nhiều ở con cái.",["寄予期望","期望很高","达到期望"],"Hay làm danh từ: <span class='zh'>父母的期望</span>."]],extra:[["农民工","nóngmíngōng","lao động từ nông thôn ra thành phố"],["到嘴边的话","dào zuǐbiān de huà","lời đã ra đến miệng"],["轮到","lúndào","đến lượt"],["代收","dàishōu","nhận hộ"],["半开玩笑","bàn kāi wánxiào","nửa đùa nửa thật"],["硕士","shuòshì","thạc sĩ"],["算得上","suàndeshàng","có thể coi là"],["名片","míngpiàn","danh thiếp"],["发件人","fājiànrén","người gửi"],["音信","yīnxìn","tin tức, thư từ"],["工地","gōngdì","công trường"],["满脸慈爱","mǎnliǎn cí'ài","mặt đầy trìu mến"]],T:[{zh:"清晨上班，走到公司楼下，迎面站着一位农民工模样的男人，他打量了我一番，到嘴边的话又不说了。我停住脚步，疑惑地问：“您有事吗？”他搓着手，迟疑地说：“有件事想拜托你。”",vn:"Sáng sớm đi làm, đến dưới tòa nhà công ty, trước mặt tôi có một người đàn ông trông như công nhân từ quê ra. Ông nhìn tôi từ đầu đến chân một lượt, lời đã ra đến miệng lại thôi không nói. Tôi dừng bước, ngờ vực hỏi: “Bác có việc gì ạ?” Ông xoa xoa tay, ngập ngừng nói: “Có chút việc muốn nhờ cô.”",idea:"Gặp người đàn ông lạ, ngập ngừng muốn nhờ việc.",q:["“我”在哪儿遇到了那个男人？","从哪些动作可以看出他不好意思开口？"],note:[["他打量了我一番，到嘴边的话又不说了","<span class='zh'>V + 了 + O + 一番</span>: hành động tốn thời gian. <span class='zh'>到嘴边的话又不说了</span> = định nói lại thôi — thể hiện sự ngại ngùng."],["他搓着手，迟疑地说","Chuỗi cử chỉ <span class='zh'>打量 → 搓手 → 迟疑</span> khắc họa người chất phác, ngại phiền người khác."]]},{zh:"“您说吧，只要能帮的，我一定帮。”这回轮到我打量他了：饱经沧桑的脸上流露出朴实；一双过于操劳的大手；胡须起码一个星期没刮了；南方口音。",vn:"“Bác cứ nói đi, chỉ cần giúp được là cháu nhất định giúp.” Lần này đến lượt tôi quan sát ông: gương mặt dãi dầu sương gió toát lên vẻ chất phác; đôi bàn tay to đã lao lực quá nhiều; bộ râu ít nhất một tuần chưa cạo; giọng miền Nam.",idea:"“Tôi” quan sát ông: chất phác, vất vả, giọng miền Nam.",q:["这个男人长什么样？请用课文中的词语描述。"],note:[["这回轮到我打量他了：……；……；……；……。","Dấu hai chấm + bốn cụm danh từ ngăn bằng dấu chấm phẩy — kiểu <b>miêu tả liệt kê</b> rất gọn. Đối xứng với đoạn 1: ông 打量 tôi → tôi 打量 ông."],["只要能帮的，我一定帮","<span class='zh'>只要……，就/一定……</span> = chỉ cần… thì nhất định…"]]},{zh:"果然，他来自南方的一个乡镇，原先是裁缝，现在在我们旁边的港口干活。他女儿在上海，中秋节快到了，要给他寄盒月饼，可他白天在工地，地址没法写，想请我帮他代收一下。",vn:"Quả nhiên, ông đến từ một thị trấn nhỏ ở miền Nam, trước kia làm thợ may, giờ làm việc ở cảng cạnh công ty chúng tôi. Con gái ông ở Thượng Hải, Trung thu sắp đến, muốn gửi cho ông một hộp bánh, nhưng ban ngày ông ở công trường, không có địa chỉ để ghi, nên muốn nhờ tôi nhận hộ.",idea:"Lời nhờ: nhận hộ hộp bánh Trung thu con gái gửi.",q:["他为什么要请“我”代收月饼？"],note:[["果然，他来自南方的一个乡镇","<span class='zh'>果然</span> = quả nhiên — khớp với suy đoán ở đoạn 2 (<span class='zh'>南方口音</span>)."],["可他白天在工地，地址没法写","<span class='zh'>没法 + V</span> = không có cách nào… (khẩu ngữ)."]]},{zh:"“这个忙好帮，您不怕我把收到的月饼给吃了？”我半开玩笑地说。他笑着说：“不会，你和我女儿一样，斯斯文文的，一看就读过书，心眼儿好，守信誉，怎么会欺骗我呢？”他说女儿念了硕士，有学位，在一家一流的公司上班，是个主管，还有助手，怎么也算得上是公司的骨干。说起女儿，他满脸的骄傲。",vn:"“Việc này dễ thôi, bác không sợ cháu ăn mất hộp bánh nhận được à?” tôi nửa đùa nửa thật. Ông cười: “Không đâu, cô giống con gái tôi, nho nhã, nhìn là biết người có học, tốt bụng, giữ chữ tín, sao lại lừa tôi được?” Ông kể con gái học thạc sĩ, có bằng cấp, làm ở một công ty hàng đầu, là trưởng bộ phận, còn có trợ lý, dù thế nào cũng được coi là nòng cốt của công ty. Nhắc đến con gái, mặt ông đầy vẻ tự hào.",idea:"Ông tin “tôi” và tự hào kể về con gái.",q:["他为什么相信“我”？","他的女儿工作怎么样？"],note:[["您不怕我把收到的月饼给吃了？","<span class='zh'>把 + O + 给 + V</span>: <span class='zh'>给</span> nhấn mạnh, khẩu ngữ, thường với kết quả không mong muốn. Xem Ngữ pháp."],["怎么也算得上是公司的骨干","<span class='zh'>怎么也</span> = dù sao cũng; <span class='zh'>算得上</span> = có thể coi là. Xem Ngữ pháp."],["说起女儿，他满脸的骄傲","<span class='zh'>满脸的 + N cảm xúc</span>: <span class='zh'>满脸的骄傲 / 笑容 / 疑惑</span>."]]},{zh:"我记下了他的电话，给了他一张我的名片。他小心翼翼地收起来，满怀喜悦地走了。",vn:"Tôi ghi lại số điện thoại của ông, đưa ông một tấm danh thiếp. Ông cẩn thận cất đi, rồi vui mừng ra về.",idea:"Trao đổi liên lạc; ông vui vẻ ra về.",q:["他拿到名片后有什么表现？"],note:[["他小心翼翼地收起来，满怀喜悦地走了","Hai trạng ngữ bốn chữ song song: <span class='zh'>小心翼翼地 · 满怀喜悦地</span>."]]},{zh:"第三天中午，我收到了一个重重的包裹，发件人叫“张心悦”。我马上拨打张师傅的电话，却无人接听，给他发短信，他也不回，直到下班，仍旧没有音信。",vn:"Trưa ngày thứ ba, tôi nhận được một bưu kiện nặng trịch, người gửi tên “Trương Tâm Duyệt”. Tôi lập tức gọi cho bác Trương nhưng không ai nghe máy, nhắn tin cho ông cũng không trả lời, đến tận lúc tan làm vẫn bặt tin.",idea:"Nhận bưu kiện nhưng không liên lạc được.",q:["“我”收到包裹后做了什么？结果怎么样？"],note:[["却无人接听，……他也不回，直到下班，仍旧没有音信","Chuỗi <span class='zh'>却 · 也 · 直到 · 仍旧</span> tăng dần sự lo lắng — xem <b>Bài tập 4①</b>."]]},{zh:"我心里隐约有些不安，抱着包裹就往工地跑，找了一位工人，请他帮忙找张师傅。一会儿，浑身汗水的张师傅来了。他见了我又是道歉又是感谢，说今天特别忙，手机没电了都不知道。说着就要拆包裹，非要请我吃月饼不可。我说家里什么馅儿的月饼都有，还是赶快给女儿打电话吧。",vn:"Lòng tôi thấp thỏm không yên, ôm bưu kiện chạy ra công trường, tìm một công nhân nhờ gọi bác Trương. Một lúc sau, bác Trương mồ hôi nhễ nhại đi tới. Thấy tôi, ông vừa xin lỗi vừa cảm ơn, nói hôm nay bận quá, điện thoại hết pin cũng không biết. Nói rồi ông định mở bưu kiện, nhất quyết mời tôi ăn bánh. Tôi bảo nhà tôi bánh nhân gì cũng có, bác mau gọi cho con gái đi.",idea:"Mang bánh ra công trường; ông vừa xin lỗi vừa cảm ơn.",q:["“我”为什么要去工地？","见到“我”以后，张师傅做了什么？"],note:[["他见了我又是道歉又是感谢","<span class='zh'>又是……又是……</span>: liệt kê nhiều hành động cùng lúc, giọng sinh động. Xem Ngữ pháp."],["非要请我吃月饼不可","<span class='zh'>非……不可</span> = nhất định phải… Xem Ngữ pháp."],["手机没电了都不知道","<span class='zh'>……都不知道</span> = đến… cũng không biết (nhấn mạnh mức độ bận)."]]},{zh:"电话通了，张师傅满脸慈爱，笑得别提多灿烂了：“心心，月饼爸爸收到了，……我身体好着呢，别惦记，好好工作，别给爸爸丢人啊……”讲完电话，张师傅还没忘了向我炫耀他的女儿，“要面子着呢，从来没有辜负过我的期望。”",vn:"Điện thoại thông, mặt bác Trương đầy trìu mến, cười rạng rỡ khỏi nói: “Tâm Tâm à, bố nhận được bánh rồi… Bố khỏe lắm, đừng lo, làm việc cho tốt, đừng làm bố mất mặt nhé…” Nghe điện xong, bác Trương vẫn không quên khoe con gái với tôi: “Nó trọng thể diện lắm, chưa bao giờ phụ lòng tôi.”",idea:"Ông gọi cho con gái, rạng rỡ, tự hào.",q:["张师傅跟女儿说了什么？","“要面子着呢”在这里是什么意思？"],note:[["笑得别提多灿烂了","<span class='zh'>别提多……了</span> (bài 1) làm bổ ngữ trạng thái sau <span class='zh'>得</span>."],["我身体好着呢 / 要面子着呢","<span class='zh'>Adj + 着呢</span>: mức độ cao, khẩu ngữ, phóng đại. Xem Ngữ pháp."]]},{zh:"看得出，女儿是他的幸福。",vn:"Có thể thấy, con gái chính là hạnh phúc của ông.",idea:"Câu kết chủ đề: con gái là hạnh phúc của người cha.",q:["这句话表达了作者怎样的感受？"],note:[["看得出，……","Một câu ngắn làm đoạn kết — <b>điểm nhãn</b> (点题) cho cả bài."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: câu sai & từ vựng",G:[{id:"g1",grp:0,word:"番",zh:"番",py:"fān",tag:"Chú thích 1 · lượng từ",mean:"Lượng từ, có ba cách dùng chính.",forms:["① V + 一番：động tác tốn thời gian, công sức, quá trình dài (= 遍、回)","② 一 / 几 + 番 + N（心思、言语、过程）：chỉ số lần — số từ chỉ là 一 hoặc 几","③ 翻 + 一番 / 两番：gấp đôi (tăng một lần trên cơ số)"],ex:[["他打量了我一番，到嘴边的话又不说了。","Ông nhìn tôi một lượt, lời ra đến miệng lại thôi.",1],["那只小鸟做了一番最后的挣扎，慢慢地，躺在那里不动了。","Chú chim vùng vẫy một hồi cuối, rồi từ từ nằm im."],["他总在提醒自己不要辜负了父母的一番期望。","Anh luôn nhắc mình đừng phụ tấm lòng kỳ vọng của cha mẹ."],["经过了几番风雨，他才懂得人生的价值。","Trải qua mấy phen sóng gió, anh mới hiểu giá trị cuộc đời."],["和五年前比，多数人的工资已经翻番了。","So với năm năm trước, lương của đa số người đã tăng gấp đôi."]],tips:["Cách ③: 1 <span class='zh'>翻一番</span> → 2; <span class='zh'>翻两番</span> → 4 (không phải 3!).","Danh từ hay đi với <span class='zh'>一番</span>: <span class='zh'>一番话 · 一番心意 · 一番努力 · 一番功夫 · 一番道理</span>.","Văn viết; khẩu ngữ dùng <span class='zh'>一下 · 一遍 · 一阵子</span>."],practice:{q:"用“番”改写句子",items:[["经理说，如今确定下来的改革方向，是经过了长时间认真考虑的。","经理说，如今确定下来的改革方向，是经过了一番认真考虑的。"],["他汉字写得好，也是经过了好长时间艰苦付出的。","他汉字写得好，也是经过了一番艰苦付出的。"],["他把我从上到下好好打量了一阵子，还是有些疑惑，仿佛不敢确定我是谁。","他把我从上到下好好打量了一番，还是有些疑惑，仿佛不敢确定我是谁。"]]}},{id:"g2",grp:0,word:"过于",zh:"过于",py:"guòyú",tag:"Chú thích 2 · phó từ",mean:"Phó từ, biểu thị <b>vượt quá giới hạn nhất định, quá mức</b>. Thường mang ý <b>không hay</b>.",forms:["过于 + Adj / V（多为双音节）"],ex:[["他出来得过于匆忙，居然忘了带手机，对于现在的年轻人，没有手机的日子，一天也是难熬的。","Anh ấy đi vội quá, quên cả điện thoại — với người trẻ bây giờ, một ngày không điện thoại cũng khó chịu đựng."],["进了山才发现，这里人烟过于稀少了，车开上好一阵子都见不到一个人。","Vào núi mới thấy nơi đây quá vắng người, xe chạy một hồi lâu chẳng gặp ai."],["这回轮到我打量他了：饱经沧桑的脸上流露出朴实；一双过于操劳的大手；……","",1]],tips:["Khác <span class='zh'>太</span>: <span class='zh'>过于</span> văn viết, không dùng cảm thán ✗<span class='zh'>过于好了！</span>","Phủ định: <span class='zh'>不必过于担心</span> (không cần quá lo).","Thường đi với từ hai âm tiết: <span class='zh'>过于紧张 / 自信 / 匆忙 / 复杂</span>."],practice:{q:"用“过于”完成句子",type:"complete",items:[["有的登山爱好者遇险，是因为________。","有的登山爱好者遇险，是因为过于相信自己的能力。"],["不要________，世间有很多东西比金钱更宝贵。","不要过于看重金钱，世间有很多东西比金钱更宝贵。"],["你把他看得________，其实他是个又简单又纯朴的人。","你把他看得过于复杂了，其实他是个又简单又纯朴的人。"]]}},{id:"g3",grp:1,word:"",zh:"算得上",py:"suàndeshàng",tag:"Bài tập 2③",mean:"<b>Có thể coi là, xứng đáng được gọi là</b> — đánh giá đạt tới một tiêu chuẩn nào đó. Phủ định: <span class='zh'>算不上</span>.",forms:["S + 算得上（是）+ N / Adj","S + 算不上 + N"],ex:[["他说女儿……是个主管，还有助手，怎么也算得上是公司的骨干。","…dù sao cũng được coi là nòng cốt của công ty.",1],["他在北京居住了40多年，算得上是个地道的北京人了。","Ông sống ở Bắc Kinh hơn 40 năm, coi như người Bắc Kinh chính gốc rồi."],["这点儿小事算不上什么困难。","Chuyện nhỏ này chẳng đáng gọi là khó khăn."]],tips:["Hay đi với <span class='zh'>怎么也 · 也 · 可以</span>.","Gần nghĩa: <span class='zh'>可以说是 · 称得上</span>."]},{id:"g4",grp:1,word:"",zh:"把……给……",py:"",tag:"Bài tập 2② · khẩu ngữ",mean:"Trong câu chữ <span class='zh'>把</span>, thêm <span class='zh'>给</span> trước động từ để <b>nhấn mạnh hành động / kết quả</b>, giọng khẩu ngữ. Hay dùng với kết quả ngoài ý muốn.",forms:["S + 把 + O + 给 + V + bổ ngữ / 了"],ex:[["您不怕我把收到的月饼给吃了？","Bác không sợ cháu ăn mất hộp bánh à?",1],["那个好心人把我的自行车给修好了。","Người tốt bụng ấy đã sửa xong xe đạp cho tôi."],["我不小心把杯子给打破了。","Tôi lỡ tay làm vỡ cái cốc."]],tips:["<span class='zh'>给</span> ở đây <b>không có nghĩa “cho”</b>, bỏ đi câu vẫn đúng.","Cũng gặp trong câu bị động: <span class='zh'>钱包被小偷给偷了</span>."]},{id:"g5",grp:2,word:"",zh:"着呢",py:"zhe ne",tag:"Chú thích 3 · trợ từ khẩu ngữ",mean:"Trợ từ, biểu thị <b>mức độ cao</b>, mang giọng <b>phóng đại</b>. Chỉ dùng trong khẩu ngữ.",forms:["Adj / động từ tâm lý + 着呢"],ex:[["别看我已经年过七旬，我身体好着呢。","Đừng thấy tôi đã ngoài bảy mươi, sức khỏe tôi tốt lắm đấy."],["他肯定发烧了，身上烫着呢。","Chắc chắn nó sốt rồi, người nóng hầm hập."],["（我女儿）要面子着呢，从来没有辜负过我的期望。","Con gái tôi trọng thể diện lắm, chưa bao giờ phụ lòng tôi.",1]],tips:["Không dùng thêm phó từ mức độ: ✗<span class='zh'>很好着呢</span>.","Không dùng trong câu so sánh, câu phủ định.","Phân biệt: <span class='zh'>他吃着饭呢</span> = đang ăn (tiếp diễn) ≠ <span class='zh'>好着呢</span> = tốt lắm."],practice:{q:"用“着呢”改写句子",items:[["不行，干不动了，今天不干了，我太累了。","不行，干不动了，今天不干了，我累着呢。"],["天天上下班的时候，公共汽车特别挤。","天天上下班的时候，公共汽车挤着呢。"],["注意点儿，最近感冒的人多，医院里都是人。","注意点儿，最近感冒的人多，医院里人多着呢。"]]}},{id:"g6",grp:2,word:"",zh:"又是……又是…… / 非……不可",py:"",tag:"Bài tập 2④⑤ · Bài tập 4②",mean:"<b>又是 A 又是 B</b>: liệt kê nhiều hành động / sự vật cùng xuất hiện, giọng sinh động (thường ngụ ý “nhiều, dồn dập”). <b>非 A 不可</b>: nhất định phải A — biểu thị <b>ý chí kiên quyết</b> hoặc <b>tất yếu</b>.",forms:["S + 又是 + V₁ + 又是 + V₂","S + 非（要）+ V + 不可"],ex:[["他见了我又是道歉又是感谢，……说着就要拆包裹，非要请我吃月饼不可。","Gặp tôi, ông vừa xin lỗi vừa cảm ơn… nhất quyết mời tôi ăn bánh.",1],["晚餐会上，又是中餐，又是西餐，丰盛极了。","Tiệc tối nào món Trung, nào món Tây, thịnh soạn vô cùng."],["要学好汉语，非努力不可，除此以外，没有别的好方法。","Muốn học giỏi tiếng Trung thì nhất định phải cố gắng, ngoài ra không có cách nào khác."]],tips:["<span class='zh'>非……不可</span> có ba nghĩa: ý muốn (<span class='zh'>我非去不可</span>), tất yếu (<span class='zh'>不努力非失败不可</span>), dự đoán (<span class='zh'>不然她非疯了不可</span> — bài 2 SBT).","Khẩu ngữ có thể bỏ <span class='zh'>不可</span>: <span class='zh'>他非要去</span>."]}],BX:{grp:0,word:"起码",cols:["起码","至少"],pair:"起码 — 至少",same:["Đều biểu thị <b>giới hạn thấp nhất</b> (tối thiểu).","小孩子每天起码 / 至少要睡九个小时。"],diff:[["<b>Tính từ</b>, có thể làm <b>định ngữ</b> trước danh từ.","按时上课，这是对学生起码的要求。","<b>Phó từ</b>, không làm định ngữ.<div class='zh' style='margin-top:4px'>✗这是至少的要求。</div>"],["Trước có thể thêm <span class='zh'>最</span> để nhấn mạnh mức thấp nhất.","我一个月的电话费最起码也要100块钱。","Không thêm <span class='zh'>最</span>.<div class='zh' style='margin-top:4px'>✗最至少要100元。</div>"]],task:{q:"判断正误",cols:["√ 对","× 错"],sample:!1,items:[["我们一个星期起码要上16个小时的课。",0,"起码 làm trạng ngữ — đúng."],["记住每天学过的生词，这是对学生至少的要求。",1,"至少 không làm định ngữ → <span class='zh'>起码的要求</span>."],["人家帮了这么多忙，你最起码要说声谢谢吧？",0,"<span class='zh'>最起码</span> — đúng."],["我看那箱苹果最至少也有十公斤。",1,"至少 không đi với 最 → <span class='zh'>最起码 / 至少</span>."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["口<u>音</u>","声音 · 录音 · 拼音 · 音乐"],items:[["朴<u>实</u>","实","事实 · 充实 · 实际 · 实在"],["<u>过</u>于","过","过分 · 过程 · 过错 · 经过"],["一<u>流</u>","流","水流 · 电流 · 河流 · 流利"],["惦<u>记</u>","记","牢记 · 日记 · 记忆 · 记录"]]},EX2:{q:"用所给词语或结构改写句子",items:[["我花了三天时间，把那篇文章从头到尾研究了一遍。","番","我花了三天时间，把那篇文章从头到尾研究了一番。"],["那个好心人修好了我的自行车。","把……给……","那个好心人把我的自行车给修好了。"],["他在北京居住了40多年，可以说是个地道的北京人了。","算得上","他在北京居住了40多年，算得上是个地道的北京人了。"],["晚餐会上，有中餐，有西餐，丰盛极了。","又是……又是……","晚餐会上，又是中餐，又是西餐，丰盛极了。"],["要学好汉语，一定得努力，除此以外，没有别的好方法。","非……不可","要学好汉语，非努力不可，除此以外，没有别的好方法。"],["别烦我，我太忙了，让我安静一会儿吧。","着呢","别烦我，我忙着呢，让我安静一会儿吧。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["操劳","骨干","辜负","月饼","期望"],text:"大学毕业后，我到了一家贸易公司，工作努力勤奋，现在也算得上是公司的{骨干}了。中秋节快到了，我打算给父母送盒{月饼}表达心意，因为父母为我们{操劳}了半辈子，现在也该享享福了。我努力工作就是为了不{辜负}父母对我的{期望}。"},{bank:["拨","起码","隐约","仍旧","拜托"],text:"昨天我{拨}打好朋友小王的电话，却一直无人接听，直到今天早上{仍旧}没有他的音信。我心中{隐约}有种不安的感觉，便给小王单位打了个电话，想{拜托}他的同事查看一下小王的情况，同事告诉我，小王的手机坏了，{起码}要一个星期才能修好，知道小王没事，我就放心了。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"我马上拨打张师傅的电话，<u>却</u>无人接听，给他发短信，他<u>也</u>不回，<u>直到</u>下班，<u>仍旧</u>没有音信。",task:"我______，却______，______，他也______，直到______，仍旧______。",model:"我给他发了好几封邮件，却一封回信也没收到，又给他打电话，他也不接，直到周末，仍旧没有他的消息。"},{src:"他见了我<u>又是</u>道歉<u>又是</u>感谢，说今天特别忙，手机没电了都不知道。说着就要拆包裹，<u>非</u>要请我吃月饼<u>不可</u>。",task:"上个星期我帮了同学一个忙，他见了我又是______又是______，说如果没有我，他真不知道该怎么办好了。说着还递给我一个包装很漂亮的礼物，非______不可。",model:"上个星期我帮了同学一个忙，他见了我又是握手又是道谢，说如果没有我，他真不知道该怎么办好了。说着还递给我一个包装很漂亮的礼物，非要我收下不可。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["“我”在公司楼下遇到的那个男人是什么样的？","①……模样 ②脸： ③手： ④胡须： ⑤口音：","他是一个农民工模样的男人：饱经沧桑的脸上流露出朴实，一双过于操劳的大手，胡须起码一个星期没刮了，说话带着南方口音。"],["这个男人想拜托“我”做什么？","①女儿在……工作，……节快到了，女儿想给……寄…… ②可……白天在……，地址…… ③……请我代收……","他女儿在上海工作，中秋节快到了，女儿想给他寄盒月饼，可他白天在工地，地址没法写，所以想请我帮他代收一下。"],["他为什么找到“我”帮忙？","斯斯文文、心眼儿、信誉","他觉得我和他女儿一样斯斯文文的，一看就读过书，心眼儿好，守信誉，不会欺骗他。"],["他的女儿工作怎么样？","硕士、学位、一流、主管、骨干","他女儿念了硕士，有学位，在一家一流的公司当主管，还有助手，算得上是公司的骨干。"],["“我”收到包裹后，做了什么？","拨打、发短信、不安、往工地跑、找到","我马上拨打他的电话，却无人接听，发短信他也不回。我心里隐约有些不安，就抱着包裹往工地跑，请工人帮忙找到了张师傅。"],["他跟“我”见面后，做了什么？","又是……又是……、非……不可、给女儿打电话","他见了我又是道歉又是感谢，非要请我吃月饼不可。给女儿打电话时，他满脸慈爱，笑得特别灿烂，还向我炫耀女儿从没辜负过他的期望。"]]},BJ:{title:"病句类型：词语误用（二）",vn:"Câu sai — loại 1 (tiếp): dùng sai từ",intro:"Ngoài lỗi đã học ở bài 1, còn có: <b>dùng sai giữa các thực từ</b>, giữa <b>thực từ và hư từ</b>, <b>dùng sai / lạm dụng hư từ</b>; và sai <b>sắc thái tình cảm (khen–chê)</b>, <b>sắc thái phong cách (văn viết–khẩu ngữ, kính ngữ)</b> — lỗi người nước ngoài rất hay mắc.",types:[["实词误用","Dùng sai thực từ","整整一夜，我几乎没睡，一直在回想他的话，可是不管他说什么，我也<u>想</u>自己没有错误。","想 → 认为 / 觉得","<span class='zh'>想</span> = suy nghĩ / phỏng đoán; nêu <b>nhận định chắc chắn</b> của mình phải dùng <span class='zh'>认为 / 觉得</span>."],["语体词误用","Sai phong cách (kính ngữ)","咱们毕业都25年了，一直没见你，你下次给我写信时，随信<u>奉上</u>你的照片。","奉上 → 寄上","<span class='zh'>奉</span> là kính từ, chỉ dùng cho <b>dưới đối với trên</b>; bạn bè ngang hàng dùng <span class='zh'>寄上</span>."],["副词误用","Dùng sai phó từ","我<u>大概</u>每天下班后都要去书店买书，然后再回家。","大概 → 几乎","<span class='zh'>大概</span> = ước chừng / phỏng đoán; ý “gần như ngày nào cũng” là <span class='zh'>几乎</span>."],["关联词固定搭配误用","Sai cặp quan hệ từ","大企业招聘主要看实力，没有实力的话，<u>无论</u>来自很有名的大学，人家也不要你。","无论来自多么有名的大学","<span class='zh'>无论 / 不管</span> phải đi với <span class='zh'>多 / 多么</span> hoặc từ nghi vấn."],["成语误用","Dùng sai thành ngữ","这个酒店服务质量之差<u>有口皆碑</u>，可是天晚了，我们无处可去，只好硬着头皮住进去。","有口皆碑 → 尽人皆知","<span class='zh'>有口皆碑</span> là từ <b>khen</b> (ai cũng ca ngợi); điều xấu ai cũng biết → <span class='zh'>尽人皆知</span>."]],practice:[["因为是冬天，没有什么人到山上来玩儿。我站在山顶上，空气很清凉。","清凉","清新","Thực từ: <span class='zh'>清凉</span> = mát mẻ (mùa hè); không khí trong lành → <span class='zh'>清新</span>."],["我的腿受伤了，不能去滑雪，我很眼红我的朋友们。","眼红","羡慕","Phong cách / sắc thái: <span class='zh'>眼红</span> = đỏ mắt ghen tị (khẩu ngữ, nghĩa xấu); ở đây là <span class='zh'>羡慕</span>."],["到北京来的时候，我带来一个好玩儿的U盘，偶然，我的同屋也带来一个。","偶然","而且","Quan hệ từ: hai vế quan hệ tăng tiến → <span class='zh'>而且</span>; <span class='zh'>偶然</span> là tính từ “ngẫu nhiên”."],["有一天在书店，我看了一个小偷，偷了本书。","看","看到","Thực từ: <span class='zh'>看</span> = xem (chủ động); bắt gặp → <span class='zh'>看到 / 看见</span>."],["如果不修建这些水利工程，遇到严重的水旱灾害，其后果不可思议。","不可思议","不堪设想","Thành ngữ: <span class='zh'>不可思议</span> = khó tin, kỳ lạ; hậu quả nghiêm trọng không dám nghĩ tới → <span class='zh'>不堪设想</span>."]]},DP:[{title:"词汇（1）：看图片，熟悉下列表示动作的词语",vn:"Động từ chỉ động tác tay — tiếp nối bài 2.",items:[["搂","lǒu","ôm (vào lòng)","搂着 / 搂在怀里","孩子亲热地搂着妈妈。"],["拾","shí","nhặt","拾起来 / 拾金不昧","把地上的纸拾起来。"],["拧","nǐng","vắt, vặn","拧干 / 拧开","把毛巾拧干。"],["投掷","tóuzhì","ném, phóng","投掷铅球","他正在准备投掷铅球。"],["飘扬","piāoyáng","tung bay","迎风飘扬","红旗迎风飘扬。"],["绣","xiù","thêu","绣花儿 / 刺绣","她很喜欢绣花儿。"],["泼","pō","hắt, tạt (nước)","泼水 / 泼冷水","泼水节时人们会互相泼水表示祝福。"],["牵","qiān","dắt, nắm","手牵手 / 牵着狗","两个人手牵手。"],["掐","qiā","ngắt, véo","掐花儿 / 掐断","请不要掐花儿。"],["削","xiāo","gọt","削皮 / 削铅笔","吃苹果时最好削皮。"]]},{title:"词汇（2）：熟悉下列表示亲属称谓的词语",vn:"Cách xưng hô họ hàng — cột cuối là câu hỏi trong sách.",items:[["伯母","bómǔ","bác gái (vợ anh của bố)","伯父 — 伯母","父亲的哥哥称为伯父，伯父的妻子怎样称呼？"],["嫂子","sǎozi","chị dâu","哥哥 — 嫂子","哥哥的妻子怎样称呼？"],["岳母","yuèmǔ","mẹ vợ","岳父 — 岳母","妻子的母亲怎样称呼？"],["侄子","zhízi","cháu trai (con anh em trai)","侄子 / 侄女","弟兄或其他同辈男性亲属的儿子怎样称呼？"],["叔叔 · 婶婶","shūshu · shěnshen","chú · thím","叔叔 — 婶婶","父亲的弟弟和他的妻子。"],["舅舅 · 舅妈","jiùjiu · jiùmā","cậu · mợ","舅舅 — 舅妈","母亲的兄弟和他的妻子。"],["公公 · 婆婆","gōnggong · pópo","bố chồng · mẹ chồng","公公 — 婆婆","丈夫的父亲和母亲。"]]}],HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"表面看，它是一个普通得不能再普通的包裹，里面装的是家乡的土特产，但在我的眼里，它珍贵着呢。它经过了母亲的双手，又途经千里，来到了我的面前。它沾染着故乡的气息，满载着母亲无声的爱意。",o:["母亲常常给我寄包裹","包裹里的东西很值钱","包裹是母亲亲手打理的","母亲亲自给我带了包裹"],a:2,why:"“它经过了母亲的双手” → mẹ tự tay chuẩn bị. (B sai: quý về tình cảm, không phải giá trị tiền.)"},{n:2,say:"清晨，梦中的我被父亲叫醒，“走，晨练去！”我和父亲并排跑着，一抬头发现父亲竟然有了一丝白发。我有些心酸。他总是那么勤奋，那么忙碌，为家庭、为单位操劳。作为女儿，我懂得父亲的付出、父亲的期望。",o:["我特别不喜欢晨练","我胃有点儿不舒服","父亲的胡须都白了","我理解勤奋的父亲"],a:3,why:"“我懂得父亲的付出、父亲的期望”. (B: <span class='zh'>心酸</span> = chạnh lòng, không phải đau dạ dày.)"},{n:3,say:"家是什么？家是一个可以放松的地方，说话做事都不必小心；家是一个可以疗伤的地方，伤了痛了都可以在家中得以缓解。回到家，可以听几首音乐，可以饮一杯清茶，让心情重归舒畅。",o:["出门在外都应该惦记家","回家时心中会充满喜悦","受了伤还是回家休息好","在家中可以改变坏心情"],a:3,why:"“让心情重归舒畅” → ở nhà tâm trạng xấu được cải thiện."},{n:4,say:"“诚”指诚实诚恳，“信”即信用信任。“诚”主要指“内诚于心”，“信”主要指“外信于人”。“诚”“信”组合在一起，就形成了一个内外兼备，具有丰富内容的词汇，即诚实无欺，讲求信用。",o:["“信”主要指对人要诚恳","“诚”主要指对人要守信","“诚”和“信”是同义词","“诚信”指不欺骗，守信誉"],a:3,why:"“诚实无欺，讲求信用” = không lừa dối, giữ chữ tín. (A, B đảo nghĩa hai chữ.)"},{n:5,say:"老张做月饼的手艺是一流的，那是他父亲的父亲传下来的。老张做月饼不喜欢别人看，可他也不特别防范，一来是人来人往地不好防；二来是老张不好意思跟人急，真翻脸。邻居们也很自觉，老张养活着一大家人，不容易。",o:["有人来时老张不做月饼馅儿","老张做月饼的手艺是家传的","老张着急时，脸色就很难看","老张家人多，邻居们常帮忙"],a:1,why:"“那是他父亲的父亲传下来的” → nghề gia truyền."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：赵老师，今天跟您探讨一下“面子”问题。您能不能确切点儿说说，到底什么是面子？\n男：按词典的解释，就是“表面上的形象；虚荣”。\n女：这个解释挺负面的哈。中国人常说“死要面子活受罪”，可大家还是觉得面子不能不要。\n男：也有人说，面子是每一个社会成员想为自己挣得的一种在公众中的个人形象。\n女：这个解释我觉得更好。\n男：仔细想想，其实咱们都挺顾面子的，比如说，在公众场合要干净、整洁、文明，给别人留下个好印象，不能丢人。\n女：没错。\n男：咱们中国人还认为有面子就有尊严，没面子就被人看不起，这是积极的一面。面子会使我们约束自己，规范自己，注意维护自己的形象。但因为要面子而使自己受委屈，甚至骗别人，就不好了。\n女：您举个例子？\n男：有这样一个故事。从前，有一个人，每次出去，都是酒足饭饱以后回来。妻子问他和什么人一起吃的饭？他说是朋友，大官，有钱人。妻子奇怪，家里从来没来过这样的客人呀。妻子想把这件事搞清楚。第二天丈夫出门后，她就跟上了。丈夫走遍全城也没有一个人和他说话，最后丈夫来到城东边安葬死人的地方，走到祭祀的人跟前，跟人家要剩下的食物。妻子看了很生气，心想：“丈夫是自己终身依靠的人，现在竟然这样。”一会儿，丈夫又高高兴兴地回来了，仍旧对妻子摆出一脸的高傲。这个故事没有讲结局，但我们可以想象，不管在什么时代，这个丈夫一定没有好前途。\n女：这个故事像一幅画，给我们画出了一类人，他们不想劳动，只想过安闲舒适的生活，这种人还有个更大的问题，就是他们还想要面子。\n男：对。\n女：我觉得我们说的面子有时候还指公共面子，比如，我们都希望中国队在国际比赛中得到冠军，为国家争光。\n男：没错。",qs:[{n:6,q:"女的认为哪种“面子”的解释更好？",o:["一个人天生的模样","实际不存在的光荣","努力取得的个人的公众形象","即使倒霉也得保持的好形象"],a:2,why:"“面子是每一个社会成员想为自己挣得的一种在公众中的个人形象。”——“这个解释我觉得更好。”"},{n:7,q:"面子的积极意义是什么？",o:["希望别人留下好印象","看不起不爱面子的人","在公共场合不能受委屈","为面子规范自己的行为"],a:3,why:"“面子会使我们约束自己，规范自己”."},{n:8,q:"以下哪一项符合故事的情节？",o:["夫妻二人从来不和人来往","这个故事没有讲事情的结果","丈夫每天和达官贵人一起吃饭","丈夫自己在外吃饭妻子很生气"],a:1,why:"“这个故事没有讲结局” = không kể kết quả."},{n:9,q:"这个故事表现了一类人的什么特点？",o:["他们的生活像一张画儿","他们过着安闲舒适的生活","他们有比较大的心理问题","他们不想付出还想要面子"],a:3,why:"“他们不想劳动……还想要面子”. (B sai: họ chỉ <i>muốn</i> sống nhàn hạ.)"},{n:10,q:"人们常说的面子还包括什么？",o:["集体、公众的面子","每个人的言行举止","不能让别人看不起","有自尊心不做丢脸事"],a:0,why:"“面子有时候还指公共面子……为国家争光”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"41岁的男子伊尔雅特只读过三年小学，却在35岁时重拾书本，苦读六年后取得了律师资格。你相信吗？\n伊尔雅特3岁时，父母离异，他和母亲一起生活。看着常年有病的母亲异常艰难，伊尔雅特8岁离开学校，担起了家庭的重担。他开始卖报、卖糖果和一些小商品，和母亲过着半饥半饱的日子。伊尔雅特35岁成了一名公交司机，一天一位女士在车上听着伊尔雅特风趣幽默的谈吐，忍不住大笑，对他说：“你是一个有能力的人，应该继续去读书，然后做律师。”伊尔雅特流露出一脸的迟疑，小声说：“我这么大年龄了，能行吗？”女士鼓励他：“起码要尝试一下，不然你怎么知道自己不行？记住一句话——要相信自己，你是最棒的！”伊尔雅特接受了女士的建议，经过六年的艰苦努力，终于改变了自己的人生。",qs:[{n:11,q:"以下哪一项符合伊尔雅特的经历？",o:["他总共就读过六年书","他8岁就特别会做买卖","小时候他和妈妈每天都吃不饱","长大后他坐车遇到了一位女士"],a:2,why:"“和母亲过着半饥半饱的日子” = ăn không đủ no. (D sai: anh là tài xế, không phải ngồi xe.)"},{n:12,q:"是什么促使伊尔雅特继续读书？",o:["女士的一番话","当律师挣钱多","他想改变工作","他口才特别好"],a:0,why:"“伊尔雅特接受了女士的建议” — <span class='zh'>一番话</span> (Ngữ pháp 番)."},{n:13,q:"根据这段话，可以知道什么？",o:["伊尔雅特非常同情母亲","伊尔雅特是一名好司机","伊尔雅特幽默且肯付出","伊尔雅特相信自己最棒"],a:2,why:"“风趣幽默的谈吐” + “六年的艰苦努力”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"在很多孩子心中，爸爸是严厉的，而我正好相反。在我的记忆中，爸爸总是斯斯文文的，从来不会给人威严的感觉。我很喜欢亲近爸爸，年龄绝对不会阻挡我们之间的友谊。我小的时候，爸爸只要一有空就会和我做游戏；晚上，数着天上的星星，说着白马王子的故事。每每和爸爸在一起，我总能感觉到温暖。\n其实玩儿是次要的，爸爸的魅力主要表现在他有渊博的知识和无限的爱心。\n也许是学有家传，爸爸懂的特别多，在我的眼里他绝对是本百科全书。上至天文，下至地理，早到人类的起源，迟到人类的未来，他都知道。我有时候会边打量他边问自己：“爸爸的脑袋里怎么能装那么多知识？”并暗暗下决心，我也要像爸爸那般有学问。\n爸爸的职业是医生，他的超级爱心还表现在他热爱他的职业、关爱他的每一位病人上。他医术高明，为病人着想。当年爸爸在日本读书，带回来一笔钱，很多人都以为我们家要发财了，可爸爸把大部分钱捐给了他住在大山中的病人家乡的一所小学，他说这笔钱花在那里更值。",qs:[{n:14,q:"在“我”的心中，爸爸是个什么样的人？",o:["非常严厉","十分斯文","很有童心","年龄太大"],a:1,why:"“爸爸总是斯斯文文的”."},{n:15,q:"“我”为什么说爸爸很有魅力？",o:["他关爱每一位病人","他比一般人会讲故事","他是医院的骨干医生","他没有辜负长辈的期望"],a:0,why:"“魅力主要表现在……无限的爱心……关爱他的每一位病人”."},{n:16,q:"关于爸爸知识渊博，下列哪项正确？",o:["爸爸最喜欢读百科全书","爸爸的大脑和别人不同","爸爸最喜欢天文和地理","可以说爸爸什么都知道"],a:3,why:"“他绝对是本百科全书……他都知道”."},{n:17,q:"对医生爸爸的评价，下列哪项正确？",o:["爸爸爱病人超过爱家人","爸爸从不认为钱很有用","爸爸是个敬业的好医生","爸爸想改行当小学老师"],a:2,why:"“热爱他的职业……医术高明，为病人着想”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["清晨的第一缕阳光照在妈妈的脸上，显得光彩照人。","秋冬季节，除了适合喝红茶，发酵的黑茶也是不错的选择。","正常人每天保证肉蛋奶和豆制品的摄入，没必要再补充蛋白质。","不同于戴先生，作为公司主管的诗女士对自己的职业规划始终非常明确。"],a:0,why:"<b>Thiếu chủ ngữ</b> cho vế sau: ai <span class='zh'>显得光彩照人</span>? → <span class='zh'>……照在妈妈的脸上，妈妈显得光彩照人</span>."},{n:19,o:["一望无际的海，让我思绪如潮，瞬间有了想抒发情感的欲望。","我最喜欢去的地方是博物馆，在那里可以与历史和艺术对话。","明晚8点，我们班在会议室进行新年联欢会，望同学们准时参加。","狗是第一种人类驯养的动物，最初并不是宠物，而是人类狩猎的助手。"],a:2,why:"<b>Kết hợp sai</b>: <span class='zh'>进行</span> + động từ hai âm tiết (进行讨论); với <span class='zh'>联欢会</span> phải dùng <span class='zh'>举行 / 举办</span>."},{n:20,o:["小时候，父亲在我心中的模样很模糊，只记得是很严肃的人。","钟连盛是国家级非物质文化遗产传承人，已经和景泰蓝打了37年交道。","圣贝纳迪诺市位于洛杉矶以东96公里，是一个有着20多万人口的小城。","教练喜欢他，因为他有天赋，有渴望，有拼劲，欠缺的只是训练和机会。"],a:0,why:"<b>Thiếu thành phần</b>: <span class='zh'>只记得（他）是（个）很严肃的人</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"一个醉汉躺在街头，警察___起他，发现他是当地的富翁。警察要送他回家，他却说：“我没有家。”警察指着不远处灯光灿烂的居所问：“那是什么？”富翁说：“那是房子。你们都___房子就是家。可是，在你的亲人搬___以后，那儿还是家吗？”",o:["抱　觉得　离","扶　认为　走","喊　以为　远","叫　感觉　家"],a:1,why:"<span class='zh'>扶起</span> người say (đỡ dậy); <span class='zh'>认为</span> nêu quan điểm (C <span class='zh'>以为</span> = tưởng nhầm, cũng có thể nhưng <span class='zh'>喊起他</span> sai); <span class='zh'>搬走</span>."},{n:22,text:"在中西方文化中，“面子”___不同的文化特征。探讨和对比不同文化背景下的语言和行为___出的面子文化的差异，___消除东西方___在交往中的障碍，从而有效促进跨文化交流。",o:["具备　表达　有益于　人民","含有　再现　有利于　人员","具有　体现　有助于　人士","富有　展现　有待于　百姓"],a:2,why:"<span class='zh'>具有……特征</span>; <span class='zh'>体现出</span>; <span class='zh'>有助于</span> + V; <span class='zh'>东西方人士</span>."},{n:23,text:"我醒来发现自己躺在医院的病床上，右腿裹着厚厚的纱布，疼得心___发抖，慢慢地，我___起，清晨，上学的路上，我被车撞了。看看床边，___我的是爸爸。他的眼睛布满了血丝，___刚刚哭过，眼角还存留着未擦干的泪水。",o:["都　回忆　陪着　好像","在　记忆　看着　如同","还　追忆　伴随　倒是","仍　回想　护理　曾经"],a:0,why:"<span class='zh'>疼得心都发抖</span>; <span class='zh'>回忆起</span>; <span class='zh'>陪着我</span>; <span class='zh'>好像刚刚哭过</span> (phỏng đoán)."}]},read3:{ins:"第24–28题：选句填空。",text:"从前，有个人叫伯乐，(24)。楚王派他去买一匹日行千里的好马。伯乐说：“良马世间少有，大王要耐心等待。”伯乐走了很多地方，没发现一匹中意的马。一天，伯乐走在山间，迎面过来一辆运盐的车，(25)，吃力地走着。马累得呼呼喘气，每迈一步都很艰难。伯乐走到马跟前。马见伯乐走近，突然昂起头来，瞪大眼睛，大声嘶叫，好像要对伯乐诉说什么。伯乐立即从声音中判断出，(26)。伯乐对驾车人说：“如果上战场，这是一匹好马，用来拉车可惜了，你把它卖给我吧。”驾车人想：普普通通一匹马，拉车没气力，吃得又多，骨瘦如柴，还上战场呢！(27)。\n伯乐回到楚国，把马交给了楚王。楚王有点儿不高兴，说：“这马走路都困难，能上战场吗？”伯乐说：“这确实是匹千里马，只是拉了一段车，(28)，才这么瘦。只要喂得好，很快就能恢复体力。”楚王将信将疑，命马夫精心喂养。不久，马变得精壮神勇，跑起路来像风一样快。",opts:["这是一匹难得的好马","又没有好好喂养","因会挑马而远近闻名","二话没说就同意了","一匹瘦弱的马拉着车"],ans:{24:2,25:4,26:0,27:3,28:1}},read4:[{ins:"第29–32题：请选出正确答案。",text:"“哗啦”！客厅里不寻常的声响把我从熟睡中惊醒，不过迷迷糊糊中我又安下心来，有爸爸呢。没等我睡着，又是“哗啦”一声，这下我彻底醒了，努力睁开眼睛，想起我现在独自一人身在澳洲。我壮着胆子爬起来，没敢开灯，一步步蹭到门边，把门拉开一条缝，看到地上的世界地图，心踏实下来，是风把墙上的地图吹到地上了。放好地图，重新躺下，却再也睡不着了，脑海中出现的全是爸爸忙碌的画面。\n小时候，我很淘气，虽然是个女孩子，可天天疯跑，比男孩子还淘。天不怕地不怕的我只怕一个人——爸爸。只要他冲我一瞪眼，我立刻就老实了，变成了乖乖女。\n爸爸心灵手巧，木工、电工、修理工，样样精通，什么活儿都难不倒他，因此找他帮忙的人特别多，他也总是二话不说，高高兴兴地就去给人家忙活去了。我这个女儿却不像他，除了学习还说得过去之外，干别的都笨手笨脚，爸爸常常在一边急得摇头。\n爸爸有个很大的优点就是不重男轻女，这在我们农村显得可特别了。我家只有我和妹妹两个孩子，爸爸总是开心地看着我俩说，没有男孩儿又怎样，我们的女儿也可以干得和他们一样好！爸爸要强，他知道我们姐妹书读得好，一心一意要培养我们上大学。\n我考上了大学，爸爸高兴得像个孩子。他满面春风，见人就炫耀。我明白了，我就是他的骄傲。",qs:[{n:29,q:"“我”熟睡时发生了什么事？",o:["梦见我已身在国外","爸爸守在我的身旁","爸爸仍然在忙他的事","墙上的地图掉了下来"],a:3,why:"“是风把墙上的地图吹到地上了”."},{n:30,q:"“我”小时候：",o:["不怕所有的人","只怕爸爸一个人","是个听话的女孩儿","喜欢跟男孩子一起玩儿"],a:1,why:"“天不怕地不怕的我只怕一个人——爸爸”."},{n:31,q:"以下哪一项符合爸爸的特点？",o:["没什么本领","不喜欢男孩儿","越难的活越爱干","一心要培养好孩子"],a:3,why:"“一心一意要培养我们上大学”. (B sai: “不重男轻女” = không trọng nam khinh nữ, không phải ghét con trai.)"},{n:32,q:"最适合做上文标题的是：",o:["我的爸爸","我的学习经历","爸爸呵护我成长","我是爸爸的骄傲"],a:0,why:"Cả bài miêu tả nhiều mặt của người bố. (D chỉ là ý cuối bài.)"}]},{ins:"第33–36题：请选出正确答案。",text:"由于眼睛患有先天性残疾，三个月大的陈燕被父母遗弃，是姥姥把她捡回来，将她抚养成人。\n姥姥知道陈燕无法重见光明，就想方设法开发陈燕的听觉和触觉。在陈燕刚会走路的时候，姥姥就教她靠听觉走路。为了培养陈燕辨别声音变化的能力，姥姥把五分硬币丢到地上让陈燕去找，但不许她在地上摸。还把一分、二分、五分硬币分别丢到地上，让她用耳朵来辨别币值。为锻炼小陈燕的触觉，姥姥要她练习穿针引线。对于一个盲童，穿针引线怕是过于艰难了。陈燕左手捏着针眼，右手捏着线头，往针眼里一次次不停地穿。起初半个小时穿一根，熟练之后两秒钟就可以穿一根了。正是这种不可思议的听觉和触觉训练，使陈燕与一般盲人相比，有了许多过人之处：她会游泳，会骑自行车，甚至骑独轮车……\n陈燕自小对音乐感兴趣，学过很多乐器。自打学调琴开始，她每天总是十三四个小时泡在钢琴边，仔细摸，用心记。学调律还必须会修琴，一个盲人手拿锤子钉钉子、用刨子刨木头，受伤总是难免的。那段时间，她手上就没有一块好肉。\n四年学习，陈燕掌握了最先进的钢琴调律技术，但满怀信心的她马上遭遇了残酷的现实，当时国内的人还无法接受盲人调琴师。几经周折，一家琴行才经过重重考核后同意录用她。\n如今陈燕靠技术已经在调琴这个圈子里闯出了名气。她将8000多个钢琴零件熟记于心，并能及时发现影响音准的零件，调出正确的音律。到目前，她已给上万个家庭的钢琴做过调音，她用自己的行动实现了她的理想——让全国人都知道，盲人完全可以从事钢琴调律工作。",qs:[{n:33,q:"姥姥为什么要努力开发陈燕的听觉和触觉？",o:["陈燕离开了父母","陈燕的身体不好","陈燕永远看不到光明","陈燕和姥姥生活在一起"],a:2,why:"“姥姥知道陈燕无法重见光明”."},{n:34,q:"姥姥是怎样训练陈燕的？",o:["让她专门去捡地上的钱","让她天天骑自行车上学","让她从小就学习做针线活","一开始就让她靠听觉走路"],a:3,why:"“在陈燕刚会走路的时候，姥姥就教她靠听觉走路”. (C sai: xâu kim chỉ để luyện xúc giác, không phải học may vá.)"},{n:35,q:"为了学钢琴调律，陈燕：",o:["先学会了修琴","整整学了13年","手经常会受伤","渐渐喜欢上了音乐"],a:2,why:"“受伤总是难免的……手上就没有一块好肉”."},{n:36,q:"根据上文，下列哪项正确？",o:["陈燕身残志不残","陈燕是个音乐天才","姥姥从不为陈燕着想","姥姥的方法有些过头"],a:0,why:"Khuyết tật nhưng ý chí kiên cường, thành công trong nghề."}]}]},W:{task:"这篇课文讲述了发生在中秋节前的一个感人的故事，请参考练习5，把课文缩写成300字左右的短文。缩写时请注意写清楚时间，地点，人物（“我”、男人、女儿）的特点和性格，事情的发生、发展和结局。",target:300,steps:[["Giữ 6 yếu tố","Thời gian (中秋节前, 清晨, 第三天) – địa điểm (公司楼下, 工地) – nhân vật – nguyên nhân – diễn biến – kết quả."],["Giữ nét tính cách","Người cha: chất phác, vất vả, tin người, tự hào về con. “Tôi”: nhiệt tình, có trách nhiệm. Con gái: giỏi giang, hiếu thảo."],["Rút gọn miêu tả","Đoạn 2 chỉ cần một câu: <span class='zh'>他饱经沧桑，十分朴实，带着南方口音</span>."],["Chuyển lời thoại","Đổi thoại trực tiếp sang gián tiếp: <span class='zh'>他说我和他女儿一样斯文，心眼儿好，不会欺骗他。</span>"],["Giữ câu kết","Kết bằng câu chủ đề: <span class='zh'>看得出，女儿是他的幸福。</span>"]],model:"一盒月饼\n中秋节前的一个清晨，我在公司楼下遇到一位农民工模样的男人。他饱经沧桑，十分朴实，带着南方口音。他迟疑地告诉我，女儿在上海工作，要给他寄一盒月饼，可他白天在港口的工地干活，没有地址，想拜托我帮他代收一下。\n我半开玩笑地问他，不怕我把月饼吃了吗？他说我和他女儿一样斯斯文文的，心眼儿好，守信誉，不会欺骗他。说起念了硕士、在一流公司当主管的女儿，他满脸骄傲。我们互留了电话，他小心翼翼地收起我的名片，高兴地走了。\n第三天，我收到了包裹，可是打电话、发短信，他都没有回音。我隐约有些不安，就抱着包裹跑到工地去找他。浑身汗水的张师傅见了我又是道歉又是感谢，非要请我吃月饼不可。我让他赶快给女儿打电话。电话里，他笑得非常灿烂，让女儿别惦记自己。挂了电话，他还向我炫耀，女儿从来没有辜负过他的期望。看得出，女儿是他的幸福。",check:["Có tiêu đề","Có thời gian, địa điểm rõ ràng","Thể hiện được tính cách người cha (朴实、信任别人、为女儿骄傲)","Có đủ mở đầu – phát triển – kết thúc","Lời thoại đã chuyển sang gián tiếp (giữ tối đa 1–2 câu trực tiếp)","Dùng ít nhất 6 từ mới","Khoảng 300 chữ (±30)"]},SUM:{words:["迎面","模样","打量","迟疑","拜托","饱经沧桑","流露","朴实","过于","操劳","起码","斯文","信誉","欺骗","骨干","小心翼翼","喜悦","仍旧","隐约","浑身","惦记","炫耀","辜负","期望"],patterns:[["V + 了 + O + 一番","他打量了我一番。"],["过于 + Adj / V","一双过于操劳的大手"],["Adj + 着呢","我身体好着呢。"],["算得上（是）……","怎么也算得上是公司的骨干。"],["又是……又是……","他见了我又是道歉又是感谢。"],["非……不可","非要请我吃月饼不可。"],["把 + O + 给 + V","您不怕我把收到的月饼给吃了？"]],diff:["起码：tính từ, làm định ngữ được (起码的要求), thêm 最 được (最起码) — 至少：phó từ, không làm định ngữ, không thêm 最","掩饰 ≠ 隐瞒 (bài 2) · 原先 ≈ 原来 · 仍旧 ≈ 仍然 · 流露 (vô ý) ≠ 表达 (chủ ý) · 炫耀 (thường nghĩa chê) · 面子: 要面子 / 爱面子 / 丢面子"],sentences:["这回轮到我打量他了：饱经沧桑的脸上流露出朴实；一双过于操劳的大手；胡须起码一个星期没刮了；南方口音。","我马上拨打张师傅的电话，却无人接听，给他发短信，他也不回，直到下班，仍旧没有音信。","看得出，女儿是他的幸福。"],hw:["Học thuộc 44 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 3 không nhìn đáp án.","Viết bài 缩写 khoảng 300 chữ (mục 7), nộp bản viết tay.","Làm Sách bài tập bài 3 (nghe 1–17, đọc 18–36).","Đọc trước bài 4 《完美的胜利》."]}});
