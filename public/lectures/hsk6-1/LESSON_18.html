<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK6 · Bài 18 · 神奇的丝瓜 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--main:#5b2c4f;--deep:#3e1c36;--accent:#b8793a;--soft:#f5edf3;--cream:#fffbfd;--line:#e7d7e2;--ink:#2b1a27;--muted:#7a6274;--ok:#2f7d4f;--okbg:#e4f3ea;--no:#b23b32;--nobg:#fbe6e3;--gold:#c99b42;--hl:#fff1c9;--fs:19px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration:none;border-bottom:2px dotted var(--accent)}
b{font-weight:700}
/* ---------- khung ---------- */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1320px;margin:0 auto}
@media(max-width:1060px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 20px;border-right:1px solid var(--line)}
.toc .lt{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.toc h2{margin:4px 0 2px;font-size:22px;line-height:1.3}
.toc .tvn{font-size:14px;color:var(--muted);margin-bottom:14px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--main);color:#fff}
.toc a i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.toc a.on i{background:rgba(255,255,255,.2);color:#fff}
.toc .buoi{font-size:12px;font-weight:800;color:var(--accent);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
main{padding:0 28px 120px;min-width:0}
@media(max-width:640px){main{padding:0 14px 120px}:root{--fs:17px}}
/* mobile nav */
.mnav{display:none;position:sticky;top:0;z-index:50;background:rgba(255,251,253,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 10px;margin:0 -14px}
@media(max-width:1060px){.mnav{display:block}}
.mnav a{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--main);text-decoration:none}
.mnav a.on{background:var(--main);color:#fff}
/* ---------- hero ---------- */
.hero{margin:22px 0 10px;border-radius:26px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero .num{position:absolute;right:22px;top:-18px;font-size:170px;font-weight:900;opacity:.12;line-height:1}
.hero .unit{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:44px;margin:6px 0 2px;line-height:1.2;font-weight:900}
.hero .vn{font-size:20px;font-weight:600;opacity:.95}
.hero .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
@media(max-width:640px){.hero{padding:22px 18px}.hero h1{font-size:32px}.hero .num{font-size:110px}}
/* ---------- section ---------- */
section.sec{padding-top:34px}
.sh{display:flex;gap:14px;align-items:flex-end;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:18px}
.sh .no{font-size:15px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;padding:4px 10px;align-self:center}
.sh h2{margin:0;font-size:28px;line-height:1.2}
.sh .vn{font-size:16px;color:var(--muted);font-weight:600}
.sh .time{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
@media(max-width:640px){.sh h2{font-size:23px}.sh .time{display:none}}
h3{font-size:21px;margin:26px 0 10px;color:var(--main)}
h3 .zh{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.lead{color:var(--muted);font-size:.92em}
.goal li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tagbox{border-radius:16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line)}
.tagbox .t{font-size:30px;font-weight:900;color:var(--main);line-height:1}
.tagbox .n{font-weight:800}
.small{font-size:.86em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--main)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:var(--soft);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;vertical-align:middle;flex:none}
.say:hover{background:var(--line)}
.ok{color:var(--ok)}.no{color:var(--no)}
/* ---------- khởi động ---------- */
.sit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.sit{grid-template-columns:1fr}}
.sit .s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.sit .e{font-size:34px}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-weight:700}
.yn button.on{background:var(--main);color:#fff;border-color:var(--main)}
.fam{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:10px 0}
.fam .k{display:grid;place-items:center;font-size:34px;background:var(--soft);color:var(--main);font-weight:900}
.fam .b{padding:12px 14px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:3px;background:var(--cream);cursor:pointer;line-height:1.3}
.wchip .h{font-size:20px;font-weight:700}
.wchip .p,.wchip .m{font-size:12px;color:var(--muted);display:none}
.wchip.open .p,.wchip.open .m{display:block}
.wchip.open{background:#fff;border-color:var(--accent)}
.trap{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 10px;font-size:.88em}
/* ---------- từ vựng ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.filters button.on{background:var(--main);color:#fff;border-color:var(--main)}
.vg h3{display:flex;align-items:baseline;gap:10px}
.vg h3 small{font-size:14px;color:var(--muted);font-weight:600}
.vw{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.vw .top{display:grid;grid-template-columns:34px minmax(110px,auto) 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.vw .idx{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.vw .hz{font-size:30px;font-weight:700;line-height:1.1}
.vw .py{font-size:15px;color:var(--main);font-weight:700}
.vw .hv{font-size:12px;color:var(--muted);font-style:italic}
.vw .mn{font-size:16px}
.vw .pos{font-size:12px;font-weight:800;color:var(--accent);margin-right:4px}
.vw .badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.b-gram{background:var(--main);color:#fff}
.gram-in{margin:14px 0 26px;padding:14px 16px 4px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.gram-title{font-weight:900;color:var(--main);font-size:17px}
.gram-in .gp{margin:12px 0}
.b-书{background:#e9e2f5;color:#4b2a8a}.b-口{background:#fde9d9;color:#8a4a12}.b-成{background:#e2f1ea;color:#1e6a44}
.vw .acts{display:flex;gap:4px;align-items:center}
.star{border:none;background:none;font-size:22px;line-height:1;color:#cbb9c6;padding:2px}
.star.on{color:var(--gold)}
.vw .det{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px 60px;font-size:.93em}
.vw.open .det{display:block}
.vw .det .lb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.coll span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 8px;margin:2px;font-size:15px;background:var(--cream)}
.vw .note{background:var(--hl);border-radius:10px;padding:6px 10px;margin-top:8px}
.quiz .vw .mn,.quiz .vw .hv{filter:blur(6px);transition:filter .2s}
.quiz .vw.peek .mn,.quiz .vw.peek .hv{filter:none}
@media(max-width:640px){.vw .top{grid-template-columns:26px auto 1fr auto;gap:8px;padding:8px 10px}.vw .hz{font-size:24px}.vw .det{padding-left:16px}}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.extra div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.extra .h{font-size:19px;font-weight:700}
/* ---------- bài khóa ---------- */
.ttools{position:sticky;top:0;z-index:20;background:rgba(255,251,253,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media(max-width:1060px){.ttools{top:46px}}
@media(max-width:640px){.ttools{flex-wrap:nowrap;overflow-x:auto}.ttools .btn{white-space:nowrap}.ttools>span{display:none}}
.para{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:18px 0}
.para .pn{font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:9px;height:26px;display:grid;place-items:center;margin-top:8px}
.ptext{font-size:1.32em;line-height:2.05;letter-spacing:.02em}
.ptext .w{border-bottom:2px solid var(--accent);cursor:pointer;padding:0 1px}
.ptext .w:hover{background:var(--hl)}
.ptext ruby rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.42em;color:var(--main);font-weight:600}
.nopy .ptext rt{display:none}
.pvn{display:none;margin-top:6px;padding:10px 14px;border-left:4px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;color:#43343f}
.showvn .pvn,.para.vnopen .pvn{display:block}
.pside{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pidea{font-size:.88em;color:var(--muted);margin-top:4px}
.pidea b{color:var(--main)}
.hidebox{display:none}
.para.more .hidebox{display:block}
.cq{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92em}
.cq .s{font-size:1.1em}
.bigq{font-size:1.1em}
.src{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
/* popup từ */
.pop{position:fixed;z-index:300;width:min(370px,calc(100vw - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(46,20,40,.22);padding:14px 16px;display:none;font-size:15px}
.pop.on{display:block}
.pop .hz{font-size:36px;font-weight:700;line-height:1.1}
.pop .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:20px;color:var(--muted)}
/* ---------- ngữ pháp ---------- */
.gp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
.gp .gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gp .gh .zh{font-size:30px;font-weight:900;color:var(--main)}
.gp .gh .tag{font-size:12px;font-weight:800;border-radius:6px;background:var(--soft);color:var(--main);padding:2px 8px}
.form{display:inline-block;background:var(--main);color:#fff;border-radius:10px;padding:4px 12px;margin:4px 6px 4px 0;font-weight:600}
.exl{list-style:none;padding:0;margin:10px 0}
.exl li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li .zh{font-size:1.15em}
.exl li.fromtext .zh{background:var(--hl)}
.tips{margin:8px 0 0;padding-left:18px;font-size:.92em}
.pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.pr{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 12px;background:#fff;font-size:20px}
.pr b{color:var(--main)}.pr .ar{color:var(--muted);font-size:14px}
.vtab{border-collapse:collapse;margin:8px 0}
.vtab td,.vtab th{border:1px solid var(--line);padding:4px 14px;text-align:center}
.vtab th{background:var(--soft);font-size:14px}
.vtab td{font-size:20px;background:#fff}
.bx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.bx th,.bx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.bx th{background:var(--soft)}
.bx td.l{font-weight:800;color:var(--main);width:90px}
/* ---------- bài tập ---------- */
.ex{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:16px 0}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .eh .n{background:var(--accent);color:#fff;font-weight:900;border-radius:9px;padding:2px 10px;font-size:14px}
.ex .eh .q{font-weight:700}
.ex .score{margin-left:auto;font-size:14px;font-weight:800;color:var(--main)}
.ans{display:none;margin-top:6px;background:var(--okbg);color:#1d4f33;border-radius:10px;padding:6px 10px}
.ans.on{display:block}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it .zh{font-size:1.12em}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;background:var(--cream);resize:vertical}
.fill{font-size:1.18em;line-height:2.3}
.fill select{font:inherit;font-size:.9em;border:1px solid var(--accent);border-radius:8px;padding:0 4px;background:#fff;margin:0 2px}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bank span{border:1px dashed var(--accent);border-radius:8px;padding:0 10px;font-size:1.1em;background:var(--cream)}
.mcq{margin:12px 0;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mcq .qq{font-weight:600}
.mcq .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media(max-width:640px){.mcq .opts{grid-template-columns:1fr}}
.mcq .opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:1.02em}
.opt b{color:var(--main);margin-right:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.why{display:none;margin-top:6px;font-size:.9em;background:var(--soft);border-radius:10px;padding:6px 10px}
.why.on{display:block}
.tick{width:100%;border-collapse:collapse;background:#fff}
.tick td,.tick th{border:1px solid var(--line);padding:8px;text-align:center}
.tick td.s{text-align:left}
.tick button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}
.tick button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tick button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bj{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.bj td,.bj th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.bj th{background:var(--main);color:#fff;font-size:14px}
.bjw{cursor:pointer;border-bottom:2px dotted var(--muted)}
.bjw.hit{background:var(--nobg);border-bottom-color:var(--no)}
.listen-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.script{display:none;white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98em}
.script.on{display:block}
.passage{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.08em;line-height:1.95}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--main)}
.hsktabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hsktabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.hsktabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tot{position:sticky;bottom:12px;z-index:10;display:flex;justify-content:center}
.tot div{background:var(--deep);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* viết */
.wbox textarea{min-height:260px;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.9}
.cnt{font-size:14px;font-weight:800}
.model{white-space:pre-wrap;font-size:1.08em;line-height:2}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.grid-paper{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;line-height:34px}
/* ghi chú */
.note-box{margin:14px 0 0;border:1px dashed var(--accent);border-radius:14px;background:#fffdf6}
.note-box summary{cursor:pointer;padding:8px 14px;font-weight:800;font-size:15px;color:#7a4f14;list-style:none}
.note-box summary::-webkit-details-marker{display:none}
.note-box textarea{border:none;border-top:1px dashed var(--accent);border-radius:0 0 14px 14px;background:transparent;min-height:90px}
.pnote{display:none;margin-top:6px}
.para.noting .pnote{display:block}
.hasnote{color:var(--accent)!important}
/* thanh công cụ nổi */
.fab{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.fab button{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(46,20,40,.12)}
.fab button.on{background:var(--main);color:#fff}
@media(max-width:640px){.fab .dk,.fab .lbl{display:none}.fab{right:10px;bottom:10px}.fab button{padding:8px 11px}}
.fab .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:12px}
/* sổ tay */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:400;background:#fff;box-shadow:-20px 0 50px rgba(46,20,40,.2);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .sw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawer .sw .h{font-size:22px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(20,10,18,.35);z-index:390;display:none}
.dim.on{display:block}
/* chế độ chiếu */
body.proj{--fs:24px}
body.proj .toc,body.proj .note-box,body.proj .pnote{display:none}
body.proj .wrap{grid-template-columns:1fr;max-width:1500px}
body.proj .ptext{font-size:1.45em}

","几粒丝瓜种子","妈妈做了丝瓜鸡蛋汤。","Mẹ nấu canh mướp trứng.",[],"Từ có dấu * (không bắt buộc HSK)."],[3,"随即","suíjí","phó.","tùy tức","ngay sau đó",1,"书","随后就；立刻。","随即种上了一棵树","他接到电话，随即出了门。","Nhận điện thoại xong, anh ấy liền ra khỏi nhà.",[],"Xem <b>Ngữ pháp: 随即</b>."],[4,"株","zhū","lượng.","chu","cây, gốc (lượng từ)",1,"","用于植物。","几株花","院子里种了两株桃树。","Trong sân trồng hai cây đào.",["一株"],""],[5,"粒","lì","lượng.","lạp","hạt, viên",1,"","用于小圆珠形或小碎块形的东西。","几粒丝瓜种子","碗里还有几粒米。","Trong bát còn mấy hạt gạo.",["一粒米","一粒种子"],"Bài tập 3①."],[6,"土壤","tǔrǎng","dt.","thổ nhưỡng","đất (trồng trọt)",1,"","地球陆地表面能生长植物的疏松表层。","土壤不是很肥沃","这里的土壤很适合种水稻。","Đất ở đây rất hợp trồng lúa.",["肥沃的土壤"],"Bài tập 3①."],[7,"肥沃","féiwò","tt.","phì ốc","màu mỡ",1,"","（土地）含有较多的适合植物生长的养分、水分。","土壤不是很肥沃","湄公河三角洲土地肥沃。","Đồng bằng sông Cửu Long đất đai màu mỡ.",["土地肥沃"],""],[8,"滋润","zīrùn","đgt.","tư nhuận","làm ẩm, tưới mát",1,"","增添水分，使不干枯。","有水的滋润","春雨滋润着大地。","Mưa xuân tưới mát mặt đất.",[],"Còn là tính từ = ẩm, dễ chịu: <span class='zh'>日子过得很滋润</span>. Bài tập 3①."],[9,"照耀","zhàoyào","đgt.","chiếu diệu","chiếu rọi",1,"","（强烈的光线）照射。","阳光的照耀","阳光照耀着大地。","Nắng chiếu rọi mặt đất.",[],"Bài tập 1: <span class='zh'>照射 · 照亮 · 照明 · 光照</span>. Bài tập 3①."],[10,"惊讶","jīngyà","tt.","kinh nhạ","kinh ngạc",1,"","感到很奇怪。","我惊讶地发现","听到这个消息，大家都很惊讶。","Nghe tin này, mọi người đều kinh ngạc.",["感到惊讶"],"Bài tập 3②."],[11,"愣","lèng","phó.","lăng","cứ (khăng khăng)",1,"口","偏偏；硬是。","愣是编出个拔苗助长的故事来","我告诉他别去，他愣要去。","Tôi bảo đừng đi, anh ta cứ nhất định đi.",["愣是"],"Bài tập 2②. Còn là động từ = sững sờ: <span class='zh'>他愣住了</span>."],[12,"拔苗助长","bámiáo-zhùzhǎng","thành ngữ","bạt miêu trợ trưởng","kéo mạ cho lớn (nóng vội hỏng việc)",1,"成","比喻违反事物发展的客观规律，急于求成，反而坏事。","愣是编出个拔苗助长的故事来","教育孩子不能拔苗助长。","Dạy con không thể nóng vội “kéo mạ cho lớn”.",[],"Điển tích người nước Tống kéo cây mạ lên cho mau lớn → mạ chết. SBT câu 21."],[13,"宁愿","nìngyuàn","phó.","ninh nguyện","thà",1,"","表示比较了利害得失之后选取一种做法。","宁愿用别的比喻","我宁愿走路，也不想挤公交车。","Tôi thà đi bộ còn hơn chen xe buýt.",["宁愿……也……"],"⚠️ 宁 đọc <b>nìng</b>. Xem <b>Ngữ pháp: 宁愿</b>."],[14,"疲倦","píjuàn","tt.","bì quyện","mệt mỏi",1,"","疲乏；困倦。","我每天工作疲倦了","他疲倦地躺在沙发上。","Anh ấy mệt mỏi nằm trên sofa.",[],"Bài tập 1: <span class='zh'>疲惫 · 疲劳 · 疲软 · 疲乏</span>. Bài tập 3②."],[15,"茎","jīng","dt.","hành","thân cây",1,"","植物体的一部分，有支持、输送养料和水分等作用。","瓜茎已经爬上了……楼墙","这种植物的茎很粗。","Thân loài cây này rất to.",["瓜茎"],""],[16,"幢","zhuàng","lượng.","tràng","tòa, căn (nhà)",1,"","用于房屋。","我们这幢楼","这儿新建了几幢高楼。","Ở đây mới xây mấy tòa nhà cao.",["一幢楼"],"Đồng nghĩa: <span class='zh'>栋</span>."],[17,"陡峭","dǒuqiào","tt.","đẩu tiễu","dốc đứng",1,"","（山势等）坡度很大，直上直下的。","陡峭的楼墙","这座山非常陡峭。","Ngọn núi này vô cùng dốc đứng.",[],""],[18,"挺拔","tǐngbá","tt.","đĩnh bạt","thẳng tắp, cao vút",1,"","直立而高耸。","使得瓜茎挺拔","路两旁是挺拔的白杨树。","Hai bên đường là hàng bạch dương thẳng tắp.",[],"SBT câu 29–32."],[19,"茂盛","màoshèng","tt.","mậu thịnh","xanh tốt, um tùm",1,"","（植物）生长得多而茁壮。","叶子茂盛","院子里的草长得很茂盛。","Cỏ trong sân mọc rất um tùm.",["枝叶茂盛"],""],[20,"覆盖","fùgài","đgt.","phúc cái","che phủ",1,"","遮盖。","覆盖在水泥墙面上的一片浓绿","大雪覆盖了整个村庄。","Tuyết lớn phủ kín cả làng.",[],"Còn dùng nghĩa bóng: <span class='zh'>网络覆盖</span> = phủ sóng."],[21,"水泥","shuǐní","dt.","thủy nê","xi măng",1,"","一种建筑材料。","水泥墙面","这条路是水泥路。","Con đường này là đường xi măng.",[],"SBT câu 20."],[22,"朝气蓬勃","zhāoqì péngbó","thành ngữ","triêu khí bồng bột","tràn đầy sức sống",1,"成","形容充满了生气和活力。","显得朝气蓬勃","年轻人总是朝气蓬勃的。","Người trẻ luôn tràn đầy sức sống.",[],"⚠️ 朝 đọc <b>zhāo</b>. SBT câu 22."],[23,"生机","shēngjī","dt.","sinh cơ","sức sống",1,"","生命力；活力。","充满了生机与活力","春天的田野充满生机。","Cánh đồng mùa xuân tràn đầy sức sống.",["充满生机","生机勃勃"],""],[24,"花瓣","huābàn","dt.","hoa biện","cánh hoa",1,"","组成花冠的各片。","黄色的花瓣","风一吹，花瓣落了一地。","Gió thổi, cánh hoa rụng đầy đất.",[],"Bài tập 3①."],[25,"点缀","diǎnzhuì","đgt.","điểm chuế","tô điểm",1,"","加以衬托或装饰，使原有事物更加美好。","黄色的花瓣点缀在绿叶之间","几朵小花点缀在草地上。","Mấy bông hoa nhỏ điểm xuyết trên bãi cỏ.",[],""],[26,"协调","xiétiáo","tt.","hiệp điều","hài hòa",1,"","配合得适当。","颜色协调","这两种颜色很协调。","Hai màu này rất hài hòa.",["颜色协调"],"Còn là động từ = điều phối. Bài tập 1: <span class='zh'>调理 · 调味 · 调整 · 调节</span>."],[27,"柔和","róuhé","tt.","nhu hòa","dịu dàng, êm dịu",1,"","温和而不强烈。","柔和精致","她的声音很柔和。","Giọng cô ấy rất dịu dàng.",["灯光柔和"],""],[28,"分量","fènliàng","dt.","phận lượng","trọng lượng",1,"","重量。","分量也越来越重","这包东西分量不轻。","Gói đồ này nặng không nhẹ.",["有分量"],"⚠️ 分 đọc <b>fèn</b>. Nghĩa bóng: <span class='zh'>他的话很有分量</span>."],[29,"悬挂","xuánguà","đgt.","huyền quải","treo lơ lửng",1,"","挂。","它悬挂在空中","墙上悬挂着一幅画。","Trên tường treo một bức tranh.",[],""],[30,"负担","fùdān","đgt.","phụ đảm","gánh vác, chịu",1,"","承当（责任、工作、费用等）。","负担不起瓜的重量","他一个人负担全家的生活。","Một mình anh gánh cả nhà.",["负担不起"],"Còn là danh từ = gánh nặng. Bài tập 3②."],[31,"坠","zhuì","đgt.","trụy","rơi",1,"","落；掉。","时刻都要坠落下来","苹果从树上坠落下来。","Quả táo rơi xuống từ trên cây.",["坠落"],"SBT câu 18."],[32,"沉重","chénzhòng","tt.","trầm trọng","nặng nề",1,"","分量大；（心情）忧郁不愉快。","我的心也变得沉重起来","听到这个消息，他的心情很沉重。","Nghe tin, lòng anh ấy nặng trĩu.",["心情沉重"],""],[33,"节制","jiézhì","đgt.","tiết chế","tiết chế, có chừng mực",1,"","限制或控制。","最初长出来的瓜好像很有节制","饮食要有节制。","Ăn uống phải có chừng mực.",["有节制","毫无节制"],"SBT câu 19."],[34,"辫子","biànzi","dt.","biện tử","bím tóc",1,"","把头发分股交叉编成的条条儿。","小姑娘的辫子","她扎着两条长辫子。","Cô bé tết hai bím tóc dài.",[],"SBT câu 20."],[35,"臂","bì","dt.","tý","cánh tay",1,"","胳膊。","小孩胳膊一般粗","他张开双臂迎接我。","Anh ấy dang rộng hai tay đón tôi.",["手臂"],""],[36,"呵","hē","thán.","ha","ồ, ôi (ngạc nhiên)",1,"","表示惊讶。","呵，这两个瓜加起来恐怕有五六斤了","呵，这么多人啊！","Ồ, đông người thế!",[],""],[37,"与日俱增","yǔrì-jùzēng","thành ngữ","dữ nhật câu tăng","tăng lên từng ngày",1,"成","随着时间一天天地增长。","我的担心与日俱增","他对中国的兴趣与日俱增。","Hứng thú của anh với Trung Quốc tăng lên từng ngày.",[],"Bài tập 3②. SBT nghe câu 4."],[38,"梢","shāo","dt.","sao","ngọn",1,"","条状物较细的一头。","瓜茎末梢上","树梢上站着一只鸟。","Trên ngọn cây có một con chim.",["树梢","末梢"],""],[39,"垂直","chuízhí","đgt.","thùy trực","thẳng đứng, vuông góc",1,"","两条直线相交成直角。","垂直地吊在那里","这两条线互相垂直。","Hai đường thẳng này vuông góc nhau.",[],"SBT câu 19."],[40,"吊","diào","đgt.","điếu","treo",1,"","悬挂。","吊在那里","天花板上吊着一盏灯。","Trên trần treo một ngọn đèn.",[],""],[41,"晃","huàng","đgt.","hoảng","lắc lư",1,"","摇动；摆动。","在风中晃来晃去","别晃桌子！","Đừng lắc bàn!",["晃来晃去"],"⚠️ Đọc <b>huàng</b> (khác <span class='zh'>晃 huǎng</span> = lóa mắt; vụt qua)."],[42,"断定","duàndìng","đgt.","đoán định","khẳng định, kết luận",1,"","下结论。","我断定","我断定他明天不会来。","Tôi khẳng định mai anh ta không đến.",[],"Bài tập 2④, 3②."],[43,"连同","liántóng","liên.","liên đồng","cùng với, kể cả",1,"","连；和。","连同上面的两个大瓜一起坠落到地上","请把钥匙连同这封信交给他。","Hãy giao chìa khóa cùng bức thư này cho anh ấy.",["连同……一起 / 一并"],"Xem <b>辨析 连同—一起</b>."],[44,"凹凸","āotū","tt.","ao đột","lồi lõm",1,"","高低不平。","一个凹凸不平的台子","这条路凹凸不平。","Con đường này gồ ghề lồi lõm.",["凹凸不平"],"SBT câu 19."],[45,"修建","xiūjiàn","đgt.","tu kiến","xây dựng",1,"","施工建造。","加固墙体时修建的","这里正在修建一座大桥。","Ở đây đang xây một cây cầu lớn.",[],""],[46,"不可思议","bùkě-sīyì","thành ngữ","bất khả tư nghị","không thể tưởng tượng nổi",1,"成","不可想象，不能理解。","真是不可思议！","这件事太不可思议了。","Chuyện này thật không thể tưởng tượng nổi.",[],"Bài tập 2②."],[47,"徘徊","páihuái","đgt.","bồi hồi","đi đi lại lại; lưỡng lự",1,"","在一个地方来回地走；比喻犹豫不决。","我徘徊在丝瓜下面","他在门口徘徊了很久。","Anh ấy quanh quẩn trước cửa rất lâu.",[],"⚠️ ≠ “bồi hồi” tiếng Việt (xúc động): <span class='zh'>徘徊</span> = đi lại quanh quẩn."],[48,"一如既往","yìrú-jìwǎng","thành ngữ","nhất như ký vãng","như trước nay",1,"成","完全跟过去一样。","丝瓜却一如既往地含笑面对秋阳","希望大家一如既往地支持我们。","Mong mọi người tiếp tục ủng hộ chúng tôi như trước.",[],"Bài tập 2⑥. SBT câu 23."]],extra:[["空地","kòngdì","bãi đất trống"],["冒","mào","nhú ra"],["转眼间","zhuǎnyǎn jiān","trong chớp mắt"],["输送","shūsòng","vận chuyển"],["养料","yǎngliào","chất dinh dưỡng"],["浓绿","nónglǜ","xanh đậm"],["承担","chéngdān","đảm đương, chịu"],["窗台","chuāngtái","bậu cửa sổ"],["加固","jiāgù","gia cố"],["糊涂","hútu","mơ hồ, lú lẫn"],["秋阳","qiūyáng","nắng thu"]],T:[{zh:"春天，孩子们在楼旁空地上开出一个小小的花园，随即种上了一棵树、几株花和几粒丝瓜种子。土壤不是很肥沃，但有水的滋润，阳光的照耀，没几天，丝瓜就从土里冒了出来，接着我惊讶地发现，它好像每时每刻都在长大。看着丝瓜，我心中难免不解：古人是怎么想的，愣是编出个拔苗助长的故事来？要是我，宁愿用别的比喻。",vn:"Mùa xuân, bọn trẻ vỡ một khu vườn nho nhỏ trên bãi đất trống cạnh tòa nhà, rồi liền trồng một cây, mấy gốc hoa và vài hạt mướp. Đất không màu mỡ lắm, nhưng có nước tưới mát, có nắng chiếu rọi, chẳng mấy ngày mướp đã nhú lên khỏi mặt đất; rồi tôi kinh ngạc phát hiện, dường như nó lớn lên từng giờ từng phút. Nhìn mướp, lòng tôi không khỏi thắc mắc: người xưa nghĩ gì mà cứ phải bịa ra câu chuyện “kéo mạ cho lớn”? Nếu là tôi, tôi thà dùng một phép so sánh khác.",idea:"Gieo hạt; mướp lớn nhanh đến kinh ngạc.",q:["描述一下丝瓜生长的环境。","为什么“我”觉得“拔苗助长”的比喻不合适？"],note:[["随即种上了……","<span class='zh'>随即</span> — xem Ngữ pháp 1."],["一棵树、几株花和几粒丝瓜种子","Ba lượng từ khác nhau: <span class='zh'>棵 · 株 · 粒</span>."],["愣是……","Khẩu ngữ = cứ nhất định (bướng)."],["宁愿用别的比喻","Xem Ngữ pháp 2."]]},{zh:"不解归不解，我每天工作疲倦了，都要去看看那几棵丝瓜。丝瓜长得很快，转眼间，瓜茎已经爬上了我们这幢楼陡峭的楼墙。接着，它从一楼爬上了二楼，又从二楼爬上了三楼。瓜茎只有细绳一般粗，却能输送足够的水分和养料，使得瓜茎挺拔，叶子茂盛。那覆盖在水泥墙面上的一片浓绿显得朝气蓬勃，充满了生机与活力。",vn:"Thắc mắc thì thắc mắc, mỗi ngày làm việc mệt mỏi, tôi đều ra ngắm mấy cây mướp ấy. Mướp lớn rất nhanh, chớp mắt dây mướp đã bò lên bức tường dốc đứng của tòa nhà chúng tôi. Rồi nó bò từ tầng một lên tầng hai, lại từ tầng hai lên tầng ba. Dây mướp chỉ to bằng sợi dây nhỏ mà vận chuyển đủ nước và dinh dưỡng, khiến thân mướp thẳng vươn, lá xanh tốt. Mảng xanh đậm phủ trên bức tường xi măng trông tràn trề sức sống.",idea:"Dây mướp leo lên tầng ba.",q:["说一说丝瓜生长的过程。"],note:[["不解归不解，……","<span class='zh'>A归A</span> — xem Ngữ pháp 3."],["细绳一般粗","<span class='zh'>N + 一般 + Adj</span> = to/như… (so sánh)."],["只有……，却能……，使得……","Xem <b>Bài tập 4②</b>."]]},{zh:"又过了几天，丝瓜开花了，黄色的花瓣点缀在绿叶之间，颜色协调，柔和精致。再过几天，黄花变成了小小的丝瓜。瓜越长越长，分量也越来越重。它悬挂在空中，细细的瓜茎好像负担不起瓜的重量，时刻都要坠落下来，我的心也变得沉重起来。不久就证明，我的担心是多余的。最初长出来的瓜好像很有节制，长到一定程度就不长了，而三楼那家的窗外，又长出来两个瓜。这两个瓜开始只有小姑娘的辫子一般粗细，不久就长得如小孩胳膊一般粗了。呵，这两个瓜加起来恐怕有五六斤了，那一根细细的茎怎么承担得住呢？我的担心与日俱增。没过几天，我发现我又错了，两个瓜不知什么时候弯了起来，舒舒服服地躺在了那家的窗台上。没几天，那两个大瓜下面的瓜茎末梢上，又长出来一个瓜，垂直地吊在那里，在风中晃来晃去。我断定：这个瓜上面够不到窗台，下面也是空的，总有一天，瓜茎会禁不住瓜的分量，连同上面的两个大瓜一起坠落到地上。这天一早，我却看到了奇迹，那个我断定会坠落下来的瓜，已经躺在了一个凹凸不平的台子上，那个台子是加固墙体时修建的。",vn:"Mấy hôm sau, mướp ra hoa, cánh hoa vàng điểm xuyết giữa lá xanh, màu sắc hài hòa, dịu dàng tinh tế. Mấy hôm nữa, hoa vàng thành những quả mướp nhỏ xíu. Quả càng lớn càng dài, cũng càng lúc càng nặng. Nó treo lơ lửng giữa không trung, dây mướp mảnh mai như không chịu nổi sức nặng, lúc nào cũng như sắp rơi, lòng tôi cũng nặng trĩu. Chẳng bao lâu đã chứng minh nỗi lo của tôi là thừa. Quả mọc ra đầu tiên dường như rất biết chừng mực, lớn đến mức nhất định thì thôi; còn ngoài cửa sổ nhà tầng ba lại mọc ra hai quả. Hai quả ban đầu chỉ to như bím tóc cô bé, ít lâu sau đã to như cánh tay đứa trẻ. Ôi, hai quả cộng lại chắc phải năm sáu cân, sợi dây mảnh thế làm sao chịu nổi? Nỗi lo của tôi tăng lên từng ngày. Mấy hôm sau, tôi phát hiện mình lại sai: chẳng biết từ lúc nào hai quả đã cong lại, nằm thoải mái trên bậu cửa sổ nhà ấy. Ít hôm nữa, ở ngọn dây phía dưới hai quả to lại mọc thêm một quả, treo thẳng đứng, đung đưa trong gió. Tôi khẳng định: quả này trên không với tới bậu cửa, dưới cũng trống không, sớm muộn gì dây cũng không chịu nổi sức nặng, kéo theo cả hai quả to phía trên rơi xuống đất. Sáng hôm ấy, tôi lại thấy kỳ tích: quả mà tôi khẳng định sẽ rơi đã nằm trên một bệ lồi lõm — cái bệ xây lúc gia cố tường.",idea:"Ba lần lo lắng — ba lần sai.",q:["描述一下“我”对丝瓜担心的过程。"],note:[["越长越长 · 越来越重","Chú ý <span class='zh'>长 zhǎng</span> (lớn) và <span class='zh'>长 cháng</span> (dài)."],["负担不起 · 承担得住 · 禁不住","Bổ ngữ khả năng — “chịu nổi / không chịu nổi”."],["连同……一起","Xem 辨析 连同—一起."],["舒舒服服地躺在了……","Nhân hóa: quả mướp “nằm”."]]},{zh:"真是不可思议！我徘徊在丝瓜下面，我觉得丝瓜有思想，能考虑问题，而且还有行动。它能让大瓜停止生长；它能给瓜找到承担重量的地方。如果真是这样，丝瓜用什么来思考呢？丝瓜靠什么来指导自己的行动呢？我想了又想，越想越糊涂，而丝瓜却一如既往地含笑面对秋阳。",vn:"Thật không thể tưởng tượng nổi! Tôi đi đi lại lại dưới giàn mướp, cảm thấy mướp có tư duy, biết suy nghĩ, lại còn biết hành động. Nó có thể khiến quả to ngừng lớn; có thể tìm cho quả chỗ đỡ sức nặng. Nếu quả thật như vậy, mướp dùng gì để nghĩ? Mướp dựa vào gì để điều khiển hành động của mình? Tôi nghĩ đi nghĩ lại, càng nghĩ càng rối, còn mướp thì vẫn như mọi khi mỉm cười trước nắng thu.",idea:"Suy ngẫm: mướp có tư duy?",q:["丝瓜给“我”什么感觉？"],note:[["想了又想，越想越糊涂","Lặp động từ + <span class='zh'>越……越……</span>."],["一如既往地含笑面对秋阳","Nhân hóa kết bài — nhẹ nhàng, hóm hỉnh."]]}]},Object.assign(window.LESSON,{extVn:"Mở rộng: từ gần nghĩa",G:[{id:"g1",grp:0,word:"随即",zh:"随即",py:"suíjí",tag:"Chú thích 1 · phó từ",mean:"Phó từ: <b>ngay sau đó liền xảy ra</b> — “liền, lập tức”. Đứng trước động từ của hành động thứ hai.",forms:["V₁……，随即 + V₂"],ex:[["缺乏父母之爱的孩子，不安全感也会随即产生。","Trẻ thiếu tình thương cha mẹ, cảm giác bất an cũng liền nảy sinh."],["……总经理更是信心百倍，随即开始制定市场开拓方案。","… tổng giám đốc càng tự tin gấp bội, liền bắt đầu lập phương án mở rộng thị trường."],["春天，孩子们在楼旁空地上开出一个小小的花园，随即种上了一棵树、几株花和几粒丝瓜种子。","",1]],tips:["Gần nghĩa: <span class='zh'>立即 · 马上 · 随后</span>; <span class='zh'>随即</span> văn viết hơn.","Bài tập 2①."],practice:{q:"为“随即”选择适当的位置",type:"pos",items:[["他答应A了B一声，C把手里的东西D递给我。","C","他答应了一声，随即把手里的东西递给我。"],["他匆匆进了屋，A说完必要的话之后B转身离去，C根本不顾及对方究竟D听懂了多少。","B","……说完必要的话之后随即转身离去，……"],["……将它C扔进池塘，D又飞回原地。","D","……将它扔进池塘，随即又飞回原地。"]]}},{id:"g2",grp:0,word:"宁愿",zh:"宁愿……也要 / 也不……",py:"nìngyuàn",tag:"Chú thích 2 · phó từ",mean:"Phó từ dùng trong câu phức <b>lựa chọn</b>: sau khi cân nhắc lợi hại, <b>chọn một cách làm</b> — “thà…”. Hay đi với <span class='zh'>宁愿……也要 / 也不……</span>. Cũng nói <span class='zh'>宁可 · 宁肯</span>.",forms:["宁愿 A，也要 B（chấp nhận A để được B）","宁愿 A，也不 B（thà A chứ không B）"],ex:[["要是我，宁愿用别的比喻。","",1],["咱们宁愿多花点儿钱，也要买个质量好的。","Mình thà tốn thêm tiền cũng phải mua cái chất lượng tốt."],["他就是这样，宁愿吃苦受累，也决不求人。","Anh ấy là vậy, thà chịu khổ chịu mệt chứ nhất quyết không cầu xin ai."]],tips:["⚠️ 宁 đọc <b>nìng</b>.","Bài tập 2③."],practice:{q:"用带“宁愿”的句子回答问题",type:"complete",items:[["一个房子条件不错，但到学校需要一个小时；另一个房子条件差些，但五分钟就能走到学校。你选择哪个房子？","我宁愿住条件差些的房子，也不想每天花两个小时在路上。"],["坐公共汽车比较舒服，但是路上会堵车，时间没有保证；坐地铁很挤，但是时间有保证。你怎么去？","我宁愿挤地铁，也要保证准时到。"],["少睡会儿觉，把作文写完；该睡觉就睡觉，作文不写了。你会怎样？","我宁愿少睡会儿觉，也要把作文写完。"]]}},{id:"g3",grp:1,word:"",zh:"A归A",py:"A guī A",tag:"Chú thích 3 · khẩu ngữ",mean:"Mẫu khẩu ngữ: A là từ đã xuất hiện (hoặc khái quát ý) ở phía trước. <span class='zh'>A归A</span> <b>tăng ý nhượng bộ</b> — “A thì A thật”, vế sau là <b>ý ngược lại / tương ứng</b>.",forms:["A归A，（但 / 可）+ ý ngược lại"],ex:[["不解归不解，我每天工作疲倦了，都要去看看那几棵丝瓜。","",1],["不满归不满，老张也只能去，谁让他是长辈呢！","Bất mãn thì bất mãn, ông Trương cũng đành đi, ai bảo ông là bậc trên!"],["朋友之间，开玩笑归开玩笑，但千万别过了头。","Giữa bạn bè, đùa thì đùa, nhưng đừng quá trớn."]],tips:["Bài 14: <span class='zh'>A是A，可是……</span> (<span class='zh'>艰苦是艰苦</span>) — cùng chức năng."],practice:{q:"完成句子",type:"complete",items:[["咱们好归好，你要是做事不公平________。","咱们好归好，你要是做事不公平，我也会批评你的。"],["生气归生气，你________，我还是会帮你的。","生气归生气，你要是真遇到困难，我还是会帮你的。"],["喜欢归喜欢，价格那么贵，他还是决定________。","喜欢归喜欢，价格那么贵，他还是决定不买了。"]]}},{id:"g4",grp:0,word:"愣",zh:"愣（是）+ V",py:"lèng",tag:"Phó từ khẩu ngữ · Bài tập 2②",mean:"Phó từ khẩu ngữ = <span class='zh'>偏偏 · 硬是 · 就是</span> — “cứ, nhất định” (bất chấp lẽ thường hoặc mong muốn).",forms:["愣（是）+ V / 不 + V"],ex:[["古人是怎么想的，愣是编出个拔苗助长的故事来？","",1],["这种产品一再降价，可愣是卖不动，让人觉得不可思议。","Sản phẩm này hạ giá mãi mà cứ không bán được, thật khó tin."]],tips:["Động từ <span class='zh'>愣</span> = sững người: <span class='zh'>他一下子愣住了</span>."]},{id:"g5",grp:2,word:"连同",zh:"连同 / 一起",py:"liántóng / yìqǐ",tag:"Xem 辨析 bên dưới",mean:"Đều có nghĩa A và B <b>cùng nhau</b>, nhưng <span class='zh'>连同</span> là <b>liên từ</b> (nối hai danh từ), <span class='zh'>一起</span> là <b>phó từ</b> (trước động từ) — không thay nhau được. Hay dùng <span class='zh'>连同……一起 / 一并</span>.",forms:["A 连同 B + 一起 / 一并 + V","（和……）一起 + V"],ex:[["瓜茎会禁不住瓜的分量，连同上面的两个大瓜一起坠落到地上。","",1]],tips:["Bài tập 2⑤."]}],BX:{grp:2,word:"连同",cols:["连同","一起"],pair:"连同 — 一起",same:["Đều có nghĩa A và B <b>cùng nhau</b>, nhưng <span class='zh'>连同</span> là liên từ, <span class='zh'>一起</span> là phó từ, <b>không thay nhau được</b>.","—"],diff:[["<b>Liên từ</b>, nghĩa “<span class='zh'>连、和</span>”. Thường đứng <b>giữa hai danh từ</b>.","货物连同清单一并送过去。","<b>Phó từ</b>, đứng <b>trước động từ</b>.<div class='zh' style='margin-top:4px'>明天你把作业和考试成绩一起带给他吧。</div>"]],task:{q:"选择“连同”或“一起”填空",cols:["连同","一起"],sample:!1,items:[["他把上衣____裤子都弄脏了。",0,"Giữa hai danh từ → 连同."],["下个星期小王去上海出差，你跟他____去吧。",1,"Trước động từ (去) → 一起."],["我跟朋友____住在一所离学校很近的公寓里。",1,"Trước động từ (住) → 一起."],["到期后，请把借款____利息一并还给我。",0,"Giữa hai danh từ → 连同."]]}},EX1:{q:"模仿例子，写出更多的词语",vn:"Tìm thêm từ có chứa chữ được đánh dấu.",ex:["负<u>担</u>","承担 · 担任 · 担当 · 分担"],items:[["随<u>即</u>","即","即将 · 即刻 · 即时 · 立即"],["<u>照</u>耀","照","照射 · 照亮 · 照明 · 光照"],["<u>疲</u>倦","疲","疲惫 · 疲劳 · 疲软 · 疲乏"],["协<u>调</u>","调","调理 · 调味 · 调整 · 调节"]]},EX2:{q:"用所给词语改写句子",type:"complete",vn:"Viết lại câu với từ trong ngoặc.",items:[["时间紧迫，你们先走，然后我马上动身。→ ________","随即","时间紧迫，你们先走，我随即动身。"],["这种产品一再降价，可就是卖不动，让人觉得不可思议。→ ________","愣","这种产品一再降价，可愣是卖不动，让人觉得不可思议。"],["让我嫁给他，还不如让我一辈子不结婚。→ ________","宁愿","我宁愿一辈子不结婚，也不嫁给他。"],["我敢说这件事肯定是他干的，因为别人没有这个机会。→ ________","断定","我断定这件事肯定是他干的，因为别人没有这个机会。"],["妈妈把午饭和课本一起放进我的书包里了。→ ________","连同","妈妈把午饭连同课本一起放进我的书包里了。"],["希望你像以前一样继续关心支持我们。→ ________","一如既往","希望你一如既往地关心支持我们。"]]},EX3:{q:"选择合适的词语填空",parts:[{bank:["土壤","照耀","花瓣","粒","滋润"],text:"找个空闲时间，找一块空地，种上几{粒}种子。只要有肥沃的{土壤}，水的{滋润}，阳光的{照耀}，很快就能发芽开花了。红色的{花瓣}点缀在绿叶之间，让人看了心情愉快。"},{bank:["断定","负担","与日俱增","惊讶","疲倦"],text:"这个孩子已经连续十几天没来上课了，我的担心{与日俱增}，{断定}他一定是出什么事了。放学后，我来到男孩儿的家，看到了满脸{疲倦}的妈妈，她刚看到我时，很{惊讶}，随即抱歉地说：“最近孩子的父亲因为交通事故去世了，由于{负担}不起学费，孩子只好退学去打工。”听到这个消息，我的心沉重起来，真希望大家都能伸出温暖的手帮助这个孩子渡过难关。"}]},EX4:{q:"阅读语段，模仿造句",items:[{src:"我心中<u>难免</u>不解：古人是怎么想的，<u>愣是</u>编出个拔苗助长的故事来？<u>要是我</u>，<u>宁愿</u>用别的比喻。<u>不解归不解</u>，我每天工作疲倦了，都要去看看那几棵丝瓜。",task:"我心中难免生气：妈妈是怎么想的，愣是不让我____，要是我，宁愿____。生气归生气，我还是____。",model:"我心中难免生气：妈妈是怎么想的，愣是不让我一个人去旅行，要是我，宁愿让孩子出去锻炼锻炼。生气归生气，我还是理解妈妈是为我好。"},{src:"丝瓜长得很快，<u>转眼间</u>，瓜茎已经爬上了我们这幢楼陡峭的楼墙。<u>接着</u>，它从一楼爬上了二楼……瓜茎<u>只有</u>细绳一般粗，<u>却能</u>输送足够的水分和养料，<u>使得</u>瓜茎挺拔，叶子茂盛。",task:"孩子长得很快，转眼间，他已经____，接着，他又____。虽然他只有____，却能____，使得____。",model:"孩子长得很快，转眼间，他已经上小学了，接着，他又学会了游泳和骑车。虽然他只有七岁，却能自己做饭、洗衣服，使得妈妈轻松了很多。"}]},EX5:{q:"根据提示，简述课文主要内容",rows:[["描述一下丝瓜生长的环境。","土壤、水、阳光","丝瓜种在楼旁空地上的小花园里，土壤不是很肥沃，但有水的滋润和阳光的照耀。"],["说一说丝瓜生长的过程。","种子→从土里冒出来 / 瓜茎爬楼 / 开花→丝瓜→最初的瓜→后来的两个瓜→最下面的瓜","种子很快从土里冒了出来；转眼间瓜茎爬上了楼墙，从一楼爬到三楼；然后开了黄花，结出了丝瓜：先是最初的瓜，然后是三楼窗外的两个瓜，最后是最下面的一个瓜。"],["描述一下“我”对丝瓜担心的过程。","最初长出来的瓜： / 三楼那家窗外的两个瓜： / 两个大瓜瓜茎末梢上长出来的瓜：","我担心最初的瓜太重会坠落，可它长到一定程度就不长了；我担心三楼窗外的两个大瓜，可它们弯起来躺在了窗台上；我断定最下面的瓜会连同大瓜一起掉下来，可它躺在了一个台子上。"],["丝瓜给“我”什么感觉？","有思想、有行动 / 靠什么……","我觉得丝瓜有思想、有行动，可它靠什么思考、靠什么指导行动呢？我越想越糊涂。"]]},DP:{title:"词汇：熟悉下列近义词",vn:"16 cặp gần nghĩa — cột “搭配” là từ đối ứng.",items:[["简化","jiǎnhuà","đơn giản hóa","↔ 精简","政府简化了办事程序。"],["觉悟","juéwù","giác ngộ","↔ 觉醒","他终于觉悟了。"],["结局","jiéjú","kết cục","↔ 结果","这个故事的结局很感人。"],["救济","jiùjì","cứu tế","↔ 救助","政府救济了受灾群众。"],["局面","júmiàn","cục diện","↔ 局势","比赛出现了新的局面。"],["廉洁","liánjié","liêm khiết","↔ 清廉","他是一位廉洁的官员。"],["牵连","qiānlián","liên lụy","↔ 牵扯","这件事牵连了很多人。"],["废除","fèichú","bãi bỏ","↔ 作废","这项规定已经废除了。"],["让步","ràngbù","nhượng bộ","↔ 妥协","双方都做出了让步。"],["擅自","shànzì","tự ý","↔ 私自","不得擅自离开岗位。"],["生效","shēngxiào","có hiệu lực","↔ 有效","合同从签字之日起生效。"],["盛情","shèngqíng","thịnh tình","↔ 热情","感谢你们的盛情款待。"],["瓦解","wǎjiě","tan rã","↔ 分解","敌人的防线瓦解了。"],["慰问","wèiwèn","thăm hỏi, an ủi","↔ 安慰","领导到医院慰问病人。"],["支援","zhīyuán","chi viện","↔ 援助","各地都来支援灾区。"],["资助","zīzhù","tài trợ","↔ 赞助","他资助了十个贫困学生。"]]},HSK:{listen:[{part:"第一部分",ins:"第1–5题：请选出与所听内容一致的一项。",qs:[{n:1,say:"人，还是要接地气。想归想，生活是另外一回事，要是始终追求感觉和完美会很累。有些事偶尔想想挺好，可做事还是要踏实些，该是啥样人就过啥样的日子，这样最舒服。",o:["做人不要脱离实际","生活不需要想象力","要精心安排好生活","完美的东西追求不到"],a:0,why:"“人，还是要接地气” — <span class='zh'>想归想</span> (A归A của bài này!)."},{n:2,say:"在众多的连锁药店当中，有企业自身创建的，也有许多加盟的。由于数量增长过快，出现鱼目混珠的现象也在所难免，这就要求我们做好企业管理，防备出现轰轰烈烈开张，随即偃旗息鼓的局面。",o:["连锁企业很受欢迎","鱼店的生意都很好","商店开张搞得很热闹","连锁药店应加强管理"],a:3,why:"“这就要求我们做好企业管理”. B: <span class='zh'>鱼目混珠</span> là thành ngữ (vàng thau lẫn lộn)!"},{n:3,say:"学术界可以断定，孔子是中国历史上第一个以私人身份教了大量学生的人。照传统说法，他有几千个学生，其中有几十人成为著名的思想家和学者。前一个数目无疑有夸大成分，但毫无问题的是，他是个很有影响的教师。",o:["孔子的学生成千上万","孔子说话常用夸张的方法","孔子的学生都很有影响力","孔子是中国的第一位私学教师"],a:3,why:"“第一个以私人身份教了大量学生的人”."},{n:4,say:"近年来世界经济形势变化多端，公司面临的各种风险与日俱增，因此，适时地评估内部控制指引的适当性，并及时地予以修订尤其必要，这既可以及时引导公司关注各种新的风险，也可以防止因指引过时而形同虚设。",o:["公司必须重新编写内部规则","公司面临的风险每天都在增加","所有公司都能及时关注各种风险","出版公司要不断修订过时的出版物"],a:1,why:"<span class='zh'>与日俱增</span> = tăng từng ngày."},{n:5,say:"海兴的苹果很有名，他们曾把该县产的“红富士”与中国最有名的“红富士”混到一起，请专家品尝，愣是弄得许多专家分不清伯仲。海兴昼夜温差大，降水适中，气候条件与“红富士”的故乡日本富士岛非常相近，这就难怪海兴“富士”难住了专家。",o:["海兴是红富士的故乡","海兴很适合栽种苹果","专家看着苹果一直发愣","专家弄不清海兴的位置"],a:1,why:"Khí hậu giống quê hương táo Fuji → hợp trồng táo. C: <span class='zh'>愣是</span> = cứ thế (không phải “ngẩn người”)."}]},{part:"第二部分",ins:"第6–10题：请选出正确答案。（根据一段采访）",say:"女：各位听众朋友晚上好，今天我们非常荣幸地请到亿利资源集团董事长王文彪先生做客本台。您能不能先简单介绍一下您的经历。\n男：我生于沙漠，长于沙漠，每日所见都是漫漫黄沙，这是我29岁前的生活。挑战沙漠，改造沙漠，把死亡之海变成沙漠绿洲，这是我现在和以后的目标。\n女：您开始从事治沙这项工作以来，最困难的是什么时候？\n男：1988年，我作为沙漠盐厂厂长走马上任，盐厂生产蒸蒸日上，却因为黄沙堵路，盐产品经常运不出去，我们的盐厂不得不先修公路。沙漠公路不比咱们一般的公路，要解决流沙覆盖公路的问题。65公里的沙漠公路一修就是3年，我们经历了一次又一次的失败，被流沙搞得焦头烂额。\n女：你们是在失败和奋斗中趟出了一条科学治沙之路？\n男：是啊，我们走了很多弯路，深深地感到要想治沙，前提是科学、是技术。比如，我们通过飞播技术，在打好的格子上种草，等生长出来的草控制住沙丘，再大面积种植沙柳和杨树，这些改善沙漠生态的办法，都是从实践中探索出来的，否则你一棵树也种不出来。\n女：听说您还获得了联合国环境与发展大奖，您所在的库布齐沙漠已经变得生机勃勃，沙漠经济也搞得有声有色。\n男：库布齐沙漠是中国第七大沙漠，总面积1.86万平方公里。我们通过28年的坚守，创造了6000多平方公里沙漠绿洲，如今我们要向沙漠要效益，发展沙漠经济，把生态当生意做，把保护生态变成一项可持续发展的事业。\n女：28年是一个漫长的过程。现在您已经被业内看作是我国生态产业的领军人物了，您感受如何？\n男：沙漠治理、保护生态不是一个人的事业，也不是一朝一夕的事情，它需要成千上万的人共同奋斗，需要更多的人把最美好、最青春的年华献给沙漠。",qs:[{n:6,q:"男的29岁前的生活，下列哪项正确？",o:["制定治沙目标","在沙漠中修路","开始挑战沙漠","生长在沙漠中"],a:3,why:"“我生于沙漠，长于沙漠……这是我29岁前的生活”."},{n:7,q:"1988年发生了什么事情？",o:["男的当了盐厂的厂长","沙漠公路终于通车了","发现了沙漠中的盐矿","土地沙漠化更严重了"],a:0,why:"“1988年，我作为沙漠盐厂厂长走马上任”."},{n:8,q:"为了在沙漠中种树，人们做了哪些努力？",o:["不怕失败，努力探索","大量种树，少量种草","去国外学习科学技术","尝试种植不同的树种"],a:0,why:"“都是从实践中探索出来的”, trải qua thất bại."},{n:9,q:"关于库布齐沙漠，下列哪项正确？",o:["是世界有名的沙漠","正计划搞沙漠经济","沙漠改造很见成效","得到联合国的支持"],a:2,why:"“变得生机勃勃”, tạo 6000 km² ốc đảo. D: được <b>giải thưởng</b>, không phải hỗ trợ."},{n:10,q:"男的有什么感受？",o:["28年一晃就过去了","保护生态是长期任务","生态产业缺少领头人","年轻人应该献身沙漠"],a:1,why:"“不是一朝一夕的事情”."}]},{part:"第三部分",ins:"第11–13题：请选出正确答案。（根据一段话）",say:"中药主要由植物药、动物药和矿物药组成，植物药指植物的根、茎、叶、果，动物药包括动物的内脏、皮、骨、器官等。因植物药占中药的大多数，所以中药也称中草药。\n中国是中草药的发源地，目前中国大约有12000种药用植物。中药应用理论比较独特，讲究四气五味。四气又称四性，是指药性的寒、热、温、凉。五味指药物的辛、酸、甘、苦、咸。中草药的气、味不同，针对的病症也各异。\n中草药的应用形式多种多样，有用药物加水煎熟后去渣留汁而成的汤剂，还有制成了成药的丸剂、膏剂、片剂、冲剂、注射剂等等。很多患者偏爱中成药，认为服用方便，不像汤药，煎制过程太麻烦。但是从治疗的角度来讲，汤剂却是更好的，因为中医强调个体化治疗，并随时根据病情的变化调整药物的搭配，因此，汤剂更易取得最佳疗效。",qs:[{n:11,q:"为什么中药又叫中草药？",o:["中药是中国生长的植物","中药是中医才用的草药","中药中大部分为植物药","中国可入药的植物最多"],a:2,why:"“因植物药占中药的大多数”."},{n:12,q:"关于四气五味，可以知道什么？",o:["四气与四季的气候有关","中药味道好疗效也会好","中草药也讲究烹饪技术","气、味不同的药治不同的病"],a:3,why:"“气、味不同，针对的病症也各异”."},{n:13,q:"根据这段话，可以知道什么？",o:["多数患者更喜欢汤剂","中成药比汤药的疗效好","中成药更强调个体化治疗","汤剂可随时针对病人情况调整"],a:3,why:"“随时根据病情的变化调整药物的搭配”."}]},{part:"第三部分",ins:"第14–17题：请选出正确答案。（根据一段话）",say:"1999年中国就有了“太空蔬菜”的报道，那时所谓的“太空蔬菜”是指将植物种子搭载飞船飞越太空，重返地球后，再经过农业专家培育种植出的蔬菜。严格来讲，它们仍然是地球上生长的蔬菜。实验的目的是检测种子经过太空失重、缺氧等特殊环境变化后，内部结构是否会发生激变。实验证明，这种种子种出的“太空蔬菜”的维生素含量高于普通蔬菜，对人体有益的微量元素含量也有所提高。\n2015年“太空蔬菜”又一次成为新闻报道的热点。这次所说的“太空蔬菜”与前次提到的不同，是将种子带到太空中，由生活在国际空间站的宇航员在太空微重力环境下种植而成的。它标志着该空间站蔬菜培育试验取得了阶段性的成功，也可看作是载人飞船在前往火星的行程中又迈出了重要一步。\n太空种植食材，长期而言，将能很好地解决长途太空旅行无法供给新鲜食物的难题；短期而言，能起到降低成本的作用，因为当前每运送1公斤食物到国际空间站，要花费近14万元人民币。所以通常运送的都是些高热量并能长期存放的食品，新鲜食物尤其是蔬菜水果非常有限。",qs:[{n:14,q:"1999年“太空蔬菜”的概念是什么？",o:["种子曾到太空一游","农业专家去过太空","从太空带回的蔬菜","在太空生长的蔬菜"],a:0,why:"Hạt giống bay vào vũ trụ rồi về trồng ở Trái Đất."},{n:15,q:"把种子带上太空的目的是什么？",o:["增加蔬菜维生素含量","改变蔬菜的营养成分","促使种子内部结构发生变化","观察特殊环境对种子的影响"],a:3,why:"“检测种子经过……特殊环境变化后，内部结构是否会发生激变”."},{n:16,q:"2015年“太空蔬菜”的概念是什么？",o:["种子是在太空培育的","宇航员在太空种植的","在模拟太空环境下种的","飞船前往火星途中种的"],a:1,why:"“由……宇航员在太空微重力环境下种植而成”."},{n:17,q:"根据这段话，可以知道什么？",o:["每株太空蔬菜都很贵","飞船带食物成本很高","飞船食品供应品种很丰富","带种子会增加飞船的负担"],a:1,why:"“每运送1公斤食物……要花费近14万元人民币”."}]}],read1:{ins:"第18–20题：请选出有语病的一项。",qs:[{n:18,o:["我不喜欢父亲为自己安排的生活。","一道亮光划破了夜空，准是一颗流星坠落到了地球上。","峰峦叠嶂之间，依山傍水之处，矗立着一幢幢古朴雄奇的土楼。","大多数种子植物茎的外形为圆柱形，也有少数植物的茎有其他形状。"],a:0,why:"<b>Biểu ý không rõ</b> (bài 11): <span class='zh'>自己</span> là bố hay là tôi?"},{n:19,o:["如果饮食毫无节制，就容易生病。","那条凹凸不平的小路上，布满了来来往往行人的脚印。","一只小鸟在空中玩耍，忽而垂直下落，忽而盘旋而上，真是美极了！","他建议公司的企业文化有待进一步深化，并建议公司搞好环境卫生。"],a:3,why:"<b>Trộn cấu trúc</b> (bài 17): <span class='zh'>建议……有待……</span> không hợp → <span class='zh'>他认为……有待进一步深化</span>."},{n:20,o:["医生这个伟大的职业，可以让病人从病痛中走出来。","进了校门，绕过圆形花坛，穿过笔直的水泥路，就是教学楼。","我希望每个孩子都像一粒种子，扎根在肥沃的土壤中，生根、发芽、结果。","春天来了，柳树吐出点点嫩芽，像是摇着又细又长的大辫子欢迎春的到来。"],a:0,why:"<b>Chủ – vị không hợp</b>: “nghề nghiệp” không thể giúp người bệnh → <span class='zh'>医生……可以让病人……</span>."}]},read2:{ins:"第21–23题：选词填空。",qs:[{n:21,text:"___体操运动员是需要时间的，短则七八年，长则十几年，同时还要___训练的科学性，要练好基本功，不能求成心切。可有的教练___加大训练强度、难度，拔苗助长，结果只能毁苗。",o:["培养　讲究　一味","培育　要求　一直","发展　提倡　宁愿","训练　依照　执着"],a:0,why:"<span class='zh'>培养运动员</span> (người — <span class='zh'>培育</span> dùng cho cây giống); <span class='zh'>讲究……科学性</span>; <span class='zh'>一味</span> = cứ khăng khăng (nghĩa xấu) + <span class='zh'>拔苗助长</span>!"},{n:22,text:"人们常说：“一年之计在于春”。___，现实生活中，我们有的人___缺乏一种与春天气息___的朝气蓬勃、奋发进取、只争朝夕的热情，结果___了大好春光，真的有些可惜呀！",o:["果真　竟然　相协调　失去","居然　较为　相联系　浪费","随即　果然　相配合　放任","然而　往往　相适应　辜负"],a:3,why:"<span class='zh'>然而</span> chuyển ý; <span class='zh'>往往缺乏</span>; <span class='zh'>与……相适应</span>; <span class='zh'>辜负春光</span>."},{n:23,text:"___就到春节了。今年的冬天特别冷，地面一直___着厚厚的冰，树枝光秃秃的。外面行人稀少，车子___地来往。太阳依然一如既往地照耀着我们，天空依然蔚蓝，白云依然在___。而我，依然喜欢这里。",o:["瞬间　冻　缓慢　徘徊","转眼　积　单调　漂浮","刹那　留　疲倦　游荡","立刻　有　枯燥　行走"],a:1,why:"<span class='zh'>转眼就到……</span>; <span class='zh'>积着冰</span>; <span class='zh'>单调地来往</span>; <span class='zh'>白云漂浮</span> (bài 15)."}]},read3:{ins:"第24–28题：选句填空。",text:"向日葵又名朝阳花，(24)。\n向日葵的种植四季皆可，主要以夏、冬两季为宜，花期可达两周以上。向日葵分为“普通观赏用”和“食用”两个品种。观赏用品种特点为植株较矮小，个别不超过半米。食用品种植株较为高大，(25)。\n向日葵为世界四大油料作物之一，其生长与温度、水分、光照、土壤等因素关系密切。向日葵除了外形酷似太阳以外，它的花朵明亮大方，种子更具经济价值，不但可做成受人喜爱的葵瓜子，(26)。\n向日葵的野生种主要分布在北纬30°～52°之间的北美洲南部、西部及秘鲁和墨西哥北部地区。哥伦布发现新大陆时，(27)，开始在西班牙的马德里植物园种植观赏。\n向日葵约自明朝传入中国。中国向日葵主产区分布在东北、西北和华北地区，(28)，可向西南、中南和华东地区扩种。",opts:["向日葵的生产潜力很大","因其花常朝着太阳而得名","还可榨出低胆固醇的高级食用葵花油","可长至两米以上","航行到美洲的西班牙人把向日葵带到欧洲"],ans:{24:1,25:3,26:2,27:4,28:0}},read4:[{ins:"第29–32题：请选出正确答案。",text:"春天的树花耐人寻味。开头和中间的那些，都是在光秃秃的树枝上点缀着红的粉的花朵。这时候，懒冬翻身打了个哈欠，伸了个懒腰，在沉睡里尚未大醒，干渴的季节，忽然有鲜艳的花朵次第开放，滋润着人们的心田，接着是花瓣飘落，似五彩缤纷的花雨，令人惊讶春的神奇。\n清明过后春渐晚，杂树新绿渐生，这时候树上白花多，绿叶里的白花似一夜飞雪，季节仿佛一下子又回到了冬天。洋槐花坐的就是这班车。\n槐树有洋槐、国槐之分。洋槐，又名刺槐。树皮灰褐色，原生于北美洲，现被广泛引种到亚洲、欧洲等地。顾名思义，刺槐生有尖利的刺，白色的花很香，还能食用。刺槐花产的蜂蜜很甜，蜂蜜产量也高。\n国槐是中国的本土树种，现南北各省区广泛栽培。日本、越南也有分布，欧洲、美洲各国均有引种。国槐树型高大，树干说不上挺拔，树冠却很庞大，枝繁叶茂，绿荫如盖。花为淡黄色，可烹调食用，也可做中药或染料。花期在7～8月，和其他树种花期不同，是一种重要的蜜源植物。",qs:[{n:29,q:"文中所说“春天的树花”有什么特点？",o:["花谢得很快","都同时开放","只开花不长叶","花朵香味浓郁"],a:2,why:"“在光秃秃的树枝上点缀着红的粉的花朵” → có hoa chưa có lá. B sai: <span class='zh'>次第开放</span> = lần lượt nở."},{n:30,q:"洋槐花的特点是：",o:["晚春开放","冬天开放","花上有刺","花呈黄色"],a:0,why:"“清明过后春渐晚……洋槐花坐的就是这班车”."},{n:31,q:"关于国槐，下列哪项正确？",o:["是引自欧洲的树种","更适合在北方生长","树叶可以用来治病","花可以吃和做染料"],a:3,why:"“可烹调食用，也可做中药或染料”. C: là <b>hoa</b>, không phải lá."},{n:32,q:"国槐、刺槐的共同点是：",o:["故乡在中国","受蜜蜂欢迎","开白色的花","栽培不容易"],a:1,why:"Cả hai đều cho mật (<span class='zh'>蜂蜜产量高 · 蜜源植物</span>)."}]},{ins:"第33–36题：请选出正确答案。",text:"伴着柔和的夕阳，我漫步在胡杨林深处，一页一页地翻阅胡杨的故事，陶醉于胡杨林呈献给我们的一片金黄，感动于胡杨送给寂寞沙海的繁华与辉煌。在新疆，百姓称胡杨为“英雄树”，赞其“生而不死一千年，死而不倒一千年，倒而不朽一千年”，细细观赏胡杨，从她的树干、枝叶间，读出的满是胡杨生命中那不可思议的坚毅不屈与悲壮。\n胡杨是第三世纪残余的古老树种，6000多万年前就在地球上生存了。胡杨喜欢沙质土壤，它的主根可入土10米，侧根则如章鱼的手臂，伸长范围可远达30米，胡杨还可从自己的根部直接生出幼苗，不断扩大自己的疆域。胡杨的根随着水走，沙漠河流流向哪里，她就跟随到哪里，在茫茫沙海中顽强地生存着。\n胡杨喜光，喜土壤湿润，耐干旱，对温度大幅度变化的适应能力很强。它的根可以扎到20米以下的地层中吸取地下水，体内还能贮存大量的水分。胡杨有较强的耐盐碱能力，它不仅能够不受碱水的伤害，还能不断地从含有盐碱的地下水中吸取水分和养料。人们发现，若是将胡杨的树枝折断，从断口处流出的树液蒸发后，就会留下生物碱，因此胡杨又被称为“眼泪树”。\n胡杨叶子特别懂得水的可贵，它不想多占去一点点水资源。在树梢处，它用大叶子吸收更多的阳光给枝干；在中下层，用小叶子减少水分的散失。也就是说，一棵胡杨树上会生出三种不同形状的叶子，一种又细又长，类似柳树叶，一种和槐树的叶子差不多，另外一种形状独特，有点儿像枫叶。胡杨叶子的表面还有一层蜡质，这样就可以锁住水分，让每滴水都用在树的枝干上。",qs:[{n:33,q:"作者陶醉于：",o:["胡杨树生命中的悲壮","夕阳下美丽的胡杨林","新疆今日呈现的繁华","胡杨不可思议的故事"],a:1,why:"“伴着柔和的夕阳……陶醉于胡杨林呈献给我们的一片金黄”."},{n:34,q:"根据第2段可以知道：",o:["胡杨根逐水而生","胡杨树能活6000年","胡杨与章鱼习性相近","胡杨主要生长在海边"],a:0,why:"“胡杨的根随着水走”. B: tồn tại 6000 <b>vạn</b> năm (loài), không phải tuổi cây."},{n:35,q:"怎样理解胡杨有较强的耐盐碱能力？",o:["胡杨可通过眼泪排出盐碱","胡杨能够不受盐碱水的伤害","胡杨能够转换盐碱的成分","盐碱可通过胡杨树枝蒸发掉"],a:1,why:"“不仅能够不受碱水的伤害……”."},{n:36,q:"胡杨树叶的特点是：",o:["尽量把水留给枝干","树叶长得非常整齐","用叶子遮挡阳光，减少水分蒸发","随着树长大，树叶的形态会发生变化"],a:0,why:"“让每滴水都用在树的枝干上”."}]}]},W:{zh:"写作",vn:"Viết văn: 我养过的……",t:"35 phút",min:!0,task:"你自己养过花或别的植物吗？请根据自己的经历描述一种植物生长的过程，比如植物的生长环境、生长过程（种下种子、发芽、开花、结果）、植物带给你的感受或启发等。请以“我养过的……”为题，字数不少于400字。",target:400,steps:[["Mở bài","Vì sao bạn trồng cây này; <span class='zh'>随即</span> gieo hạt / mua về."],["Môi trường","<span class='zh'>土壤 · 水的滋润 · 阳光的照耀</span>."],["Quá trình lớn","Theo trình tự <span class='zh'>发芽 → 长叶 → 开花 → 结果</span>; dùng <span class='zh'>转眼间 · 接着 · 又过了几天</span>."],["Sự cố & cảm xúc","Một lần lo lắng / bất ngờ: <span class='zh'>担心与日俱增 · 断定 · 没想到 · 不可思议</span>."],["Cảm nhận / bài học","<span class='zh'>A归A</span>, <span class='zh'>宁愿……也……</span>, <span class='zh'>一如既往</span>."]],outline:[["一 · 缘起","为什么养它"],["二 · 生长环境","土壤、水、阳光"],["三 · 生长过程","发芽、长叶、开花、结果"],["四 · 意外与担心","一件难忘的事"],["五 · 感受与启发","植物教给我的"]],model:"我养过的薄荷\n去年春天，朋友送给我一小盆薄荷，说它很好养，叶子还可以泡茶。我把它放在阳台上，随即又买了一包土，给它换了一个大一点儿的花盆。\n阳台上阳光充足，我每隔两三天浇一次水。没过几天，我惊讶地发现，薄荷长出了很多嫩绿的新叶。转眼间，原来只有几根细茎的薄荷已经长得又高又密，整个花盆都被绿色覆盖了，显得朝气蓬勃。每天下班回家，不管多么疲倦，我都要先去阳台看看它，闻一闻那股清凉的香味。\n夏天的时候，我出差了一个星期，走之前忘了请邻居帮忙浇水。在外地的那几天，我的担心与日俱增，我断定薄荷一定已经干死了。回到家一看，叶子果然都垂了下来，颜色也变黄了。我心里很难过，但还是抱着试试看的心情给它浇了一大杯水。没想到第二天早上，那些叶子竟然又一片片挺了起来，真是不可思议！\n到了秋天，薄荷开出了一串串淡紫色的小花，点缀在绿叶之间，非常好看。我把叶子摘下来泡茶，送给朋友，大家都说味道比买的还好。\n养薄荷之前，我总觉得自己没时间照顾植物。忙归忙，每天花几分钟浇浇水其实并不难。这盆小小的薄荷让我明白，生命比我们想象的更顽强，只要给它一点点阳光和水，它就会一如既往地努力生长。",check:["Có tiêu đề “我养过的……”","Có môi trường sống","Có quá trình lớn theo trình tự","Có một sự việc / cảm xúc cụ thể","Có cảm nhận / bài học","Dùng ít nhất 4: 随即 · 宁愿 · A归A · 与日俱增 · 断定 · 不可思议 · 一如既往","Không ít hơn 400 chữ"]},SUM:{words:["神奇","随即","株","粒","土壤","肥沃","滋润","照耀","惊讶","愣","拔苗助长","宁愿","疲倦","茎","幢","陡峭","挺拔","茂盛","覆盖","朝气蓬勃","生机","花瓣","点缀","协调","柔和","分量","悬挂","负担","坠","沉重","节制","与日俱增","垂直","断定","连同","凹凸","不可思议","徘徊","一如既往"],patterns:[["……，随即 + V","孩子们……开出一个小小的花园，随即种上了一棵树……"],["宁愿……（也……）","要是我，宁愿用别的比喻。"],["A归A，……","不解归不解，我每天工作疲倦了，都要去看看那几棵丝瓜。"],["愣是 + V","古人……愣是编出个拔苗助长的故事来？"],["A 连同 B 一起 + V","瓜茎会……连同上面的两个大瓜一起坠落到地上。"]],diff:["连同：liên từ, giữa hai danh từ (A连同B一并……) — 一起：phó từ, trước động từ","宁 nìng · 分量 fèn · 晃 huàng · 朝气 zhāo · 长 zhǎng / cháng · 徘徊 = đi quanh quẩn ≠ “bồi hồi” · 株 (cây) · 粒 (hạt) · 幢 (tòa nhà)"],sentences:["瓜茎只有细绳一般粗，却能输送足够的水分和养料，使得瓜茎挺拔，叶子茂盛。","那覆盖在水泥墙面上的一片浓绿显得朝气蓬勃，充满了生机与活力。","我想了又想，越想越糊涂，而丝瓜却一如既往地含笑面对秋阳。"],hw:["Học thuộc 48 từ mới — ưu tiên các từ trong bảng tổng kết.","Làm lại Bài tập 2 và 4 vào vở.","Viết bài “我养过的……” ≥400 chữ (mục 7).","Làm Sách bài tập bài 18.","Đọc trước bài 19."]}});
