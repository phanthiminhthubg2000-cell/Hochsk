<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 35 · 植物会出汗 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

越出范围；操纵。","……植物是怎么控制这些成分……","你太激动了，最好控制一下你的情绪。","Bạn kích động quá rồi, tốt nhất nên kiềm chế cảm xúc một chút.",["控制情绪","控制成分"],"“控制” kiểm soát, kiềm chế (情绪, 速度); “限制” hạn chế phạm vi, số lượng. (练习 2)"],["成分","chéngfèn","名","thành phần",1,"指构成事物的各种不同的物质或因素。","……植物是怎么控制这些成分……","这种药的主要成分是什么？","Thành phần chính của loại thuốc này là gì?",["主要成分","控制这些成分"],""],["梢","shāo","名","ngọn (cây)",0,"条状物较细的一头。","……把它们运输到十几米甚至上百米的树梢的呢？",null,null,["树梢"],""],["管子","guǎnzi","名","ống, ống dẫn",0,"圆而细长中间空的东西。","……就是水会顺着很细很细的管子向上“爬”……",null,null,["一根管子"],""],["玻璃","bōli","名","pha-lê, thủy tinh, kính",1,"一种质地硬而脆的透明物体。","……我们在家可以用一个比较细的玻璃管体验一下。","窗户上的玻璃被风吹破了。","Kính cửa sổ bị gió thổi vỡ rồi.",["玻璃管","一块玻璃"],""],["测验","cèyàn","动／名","kiểm tra",1,"用仪器或其他办法检验；考查学习成绩等。","可是，经过测验计算发现……","一位心理学家找来两个7岁的孩子进行一项心理测验。","Một nhà tâm lý học tìm hai đứa trẻ 7 tuổi làm một bài trắc nghiệm tâm lý.",["经过测验","心理测验"],""],["根本","gēnběn","名／形／副","(thường dùng trong câu phủ định) tuyệt nhiên, không hề",1,"事物最重要的部分；主要的；从头到尾、始终；彻底。","……根本无法把水分送到几十米高的地方。","其实他是位盲人，根本看不见你的动作。","Thật ra ông ấy là người mù, hoàn toàn không nhìn thấy động tác của bạn.",["根本无法","从根本上"],"见“注释”：根本。"],["枝干","zhīgàn","名","cành cây",0,"枝条和主干。","实际上，大树利用的是枝干顶端的那些叶片。",null,null,["枝干顶端"],""],["释放","shìfàng","动","phóng thích, tỏa ra",0,"把所含的物质或能量放出来。","叶子通过不停地向空气中释放水汽……",null,null,["释放水汽"],""],["自动","zìdòng","副／形","tự động, tự",1,"自己主动；不凭借人力而用机械装置直接操作的。","……迫使树干中的水分自动前来补充……","楼下新装了一台自动售货机。","Dưới nhà mới lắp một máy bán hàng tự động.",["自动补充","自动售货机"],"“自动” tự động (máy, hoặc tự diễn ra); “主动” chủ động (người tự giác làm): 是他主动提出的. (练习 2)"],["补充","bǔchōng","动","cung cấp thêm, bổ sung",1,"原来不足或有损失时，增加一部分。","……迫使树干中的水分自动前来补充……","运动以后要多喝水，补充身体流失的水分。","Sau khi vận động phải uống nhiều nước, bổ sung lượng nước cơ thể mất đi.",["补充水分","补充营养"],""],["抽","chōu","动","rút ra, hút, bơm",0,"吸；把夹在中间的东西取出。","……就像是把树根吸收的水分给抽了上来。",null,null,["抽上来","抽水"],""],["蒸腾","zhēngténg","动","bốc hơi",0,"（气体）上升。","因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。",null,null,["蒸腾作用","蒸腾拉力"],""],["特殊","tèshū","形","đặc biệt, đặc thù",1,"不同于同类的事物或平常的情况的。","因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。","Vì liên quan đến tác dụng thoát hơi nước, lực nâng đặc biệt này được gọi là “lực kéo thoát hơi nước”.",["特殊的提升力","情况特殊"],"辨析：特殊—特别。见“搭配 · 辨析”。"],["内部","nèibù","名","nội bộ, bên trong",1,"某一范围以内。","……这个大树内部的供水系统具体的运转状况是怎么样的……","这是我们公司内部的问题，我们自己来解决吧。","Đây là vấn đề nội bộ công ty chúng tôi, để chúng tôi tự giải quyết.",["大树内部","公司内部"],""],["系统","xìtǒng","名","hệ thống",1,"同类事物按一定的关系组成的整体。","……这个大树内部的供水系统具体的运转状况是怎么样的……","你的电脑太慢了，应该去给系统做一下升级。","Máy tính của bạn chậm quá, nên nâng cấp hệ thống đi.",["供水系统","系统升级"],""],["状况","zhuàngkuàng","名","tình hình, tình trạng",1,"情形。","……这个大树内部的供水系统具体的运转状况是怎么样的……","最近他的身体状况不太好。","Dạo này tình trạng sức khỏe của ông ấy không được tốt.",["运转状况","身体状况"],""],["秩序","zhìxù","名","trật tự",1,"有条理、不混乱的情况。","……它们遵守的是一种什么样的秩序……","今天的比赛秩序良好，没有球迷闹事。","Trận đấu hôm nay trật tự tốt, không có cổ động viên gây rối.",["遵守秩序","秩序良好"],"“秩序” trật tự (tình trạng ngăn nắp); “规则” quy tắc (điều phải tuân theo). (练习 2)"]],"WARM":[{"tab":"看图找词","title":"找出本课跟图片有关的生词","type":"words","task":"图（1）上，十字路口中间，交通警察正在站台上指挥来往的车辆；图（2）上，实验室的架子上插着一排玻璃试管。请试着找出本课跟它们有关的生词。（例：秩序）","task_vn":"Sách dùng hai ảnh: (1) cảnh sát giao thông đứng trên bục giữa ngã tư chỉ huy xe cộ; (2) một hàng ống nghiệm thủy tinh cắm trên giá trong phòng thí nghiệm. Tìm các từ mới liên quan.","groups":[{"title":"图（1）","given":1,"items":[["秩序","trật tự"],["指挥","chỉ huy"],["控制","kiểm soát"]]},{"title":"图（2）","given":0,"items":[["玻璃","thủy tinh"],["管子","ống"],["测验","kiểm tra, thí nghiệm"]]}]},{"tab":"怎样降温","title":"炎热的夏天运动之后，常常用什么办法给自己降温？","type":"discuss","q":"请问问你的同学或朋友，他们在炎热的夏天运动之后，常常用什么办法给自己降温？这些办法是否有效？有什么优点和缺点？（例：吃冰激凌——有效——感觉降温很快——可能对健康不利）","vn":"Hỏi bạn học hoặc bạn bè: sau khi vận động trong ngày hè nóng nực, họ thường làm gì để hạ nhiệt? Cách đó có hiệu quả không? Ưu, nhược điểm là gì? (Ví dụ: ăn kem — hiệu quả — hạ nhiệt nhanh — có thể không tốt cho sức khỏe.)","answer_zh":"我的朋友常常洗冷水澡，降温很快，可是马上洗冷水澡容易感冒。还有人喜欢开空调，很舒服，但是一冷一热对身体不好。我觉得最好的办法是在树下歇一歇，喝点儿凉开水。","answer_vn":"Từ hữu ích: 降温 (hạ nhiệt), 冷水澡 (tắm nước lạnh), 空调 (điều hòa), 冰激凌 (kem), 凉开水 (nước sôi để nguội), 有效 (hiệu quả), 优点 / 缺点 (ưu / nhược điểm)."}],"GAME":{"fill":[["如果这个时候，能到大树下{}一歇……","歇",["歇","喝","坐","睡"]],["放松放松{}，缓解一下疲劳……","肌肉",["肌肉","皮肤","肥肉","心情"]],["可以很快{}活力。","恢复",["恢复","回复","反复","答复"]],["大脑就会{}我们的身体赶快出汗……","指挥",["指挥","发挥","指导","挥手"]],["植物的根会{}养分和水分……","吸收",["吸收","吸取","吸引","收集"]],["植物是怎么{}这些成分……","控制",["控制","限制","制作","制定"]],["{}无法把水分送到几十米高的地方。","根本",["根本","本来","基本","根据"]],["迫使树干中的水分{}前来补充……","自动",["自动","主动","运动","移动"]],["这种{}的提升力就被称为“蒸腾拉力”。","特殊",["特殊","特色","特点","殊不知"]],["它们遵守的是一种什么样的{}……","秩序",["秩序","顺序","程序","规则"]]],"order":[["每个队员|都已经是|汗如雨下。"],["大树|在“出汗”|呢！"],["汗水就从|毛孔里|冒了出来。"],["玻璃管越细，|水爬升的高度|就越高。"],["这种特殊的提升力|就被称为|“蒸腾拉力”。"],["到目前|还是|个谜。"]]},"GOOD":[{"zh":"我们之所以能在大树下享受这种湿润荫凉，也是因为大树在“出汗”呢","vn":"sở dĩ chúng ta được hưởng sự ẩm mát, râm mát này dưới gốc cây, cũng là vì cây đang “đổ mồ hôi” đấy","why":"Giải thích nguyên nhân bất ngờ <b>……之所以……，也是因为……<\/b>; trợ từ <b>呢<\/b> tạo giọng thú vị.","frame":"……之所以……，是因为……","apply":"我之所以喜欢这个城市，是因为这里的人特别热情。","apply_vn":"Sở dĩ tôi thích thành phố này là vì người ở đây đặc biệt nhiệt tình."},{"zh":"这种“出汗”可不是为了降低温度，而是为了运输养分","vn":"việc “đổ mồ hôi” này đâu phải để hạ nhiệt độ, mà là để vận chuyển chất dinh dưỡng","why":"Phủ định – khẳng định <b>不是为了……，而是为了……<\/b>; <b>可<\/b> nhấn mạnh.","frame":"……可不是为了……，而是为了……","apply":"我学汉语可不是为了考试，而是为了了解中国文化。","apply_vn":"Tôi học tiếng Trung đâu phải để thi, mà là để hiểu văn hóa Trung Quốc."},{"zh":"玻璃管越细，水爬升的高度就越高","vn":"ống thủy tinh càng nhỏ thì độ cao nước leo lên càng cao","why":"Quan hệ tỉ lệ <b>A越……，B就越……<\/b> — mô tả quy luật khoa học.","frame":"……越……，……就越……","apply":"天气越热，人出的汗就越多。","apply_vn":"Trời càng nóng, người đổ mồ hôi càng nhiều."},{"zh":"叶子通过不停地向空气中释放水汽，迫使树干中的水分自动前来补充","vn":"lá cây thông qua việc không ngừng thải hơi nước vào không khí, buộc nước trong thân cây tự động lên bổ sung","why":"Cơ chế <b>A通过……，迫使B……<\/b> — văn phong khoa học, giải thích quá trình.","frame":"……通过……，迫使……","apply":"公司通过降低价格，迫使对手也开始改善服务。","apply_vn":"Công ty bằng cách giảm giá đã buộc đối thủ cũng bắt đầu cải thiện dịch vụ."}],"GRAMMAR":[{"word":"赶快","py":"gǎnkuài","pos":"副词","forms":["赶快 + 动词（抓紧时间、加快速度）"],"vn":"<b>赶快<\/b> (phó từ): <b>mau, nhanh lên, tranh thủ<\/b> — nắm chặt thời gian, tăng tốc độ: 赶快找房子, 赶快出汗.","text":"一旦温度上升，大脑就会指挥我们的身体赶快出汗","ex":[["我下个月要搬家，得赶快找房子。","Tháng sau tôi phải chuyển nhà, phải mau tìm nhà."],["这份材料下午开会要用，你赶快把它复印一下。","Tài liệu này chiều họp phải dùng, bạn mau photo nó đi."]],"book_title":"练一练：完成句子或对话（赶快）","book":[["______________，要不该赶上堵车了。","","我们赶快出发吧，要不该赶上堵车了"],["A：______________。<br>B：好，我马上就收拾好了。","","车马上就要开了，你赶快收拾一下吧"],["A：你怎么还在玩儿游戏？火车票预定了吗？<br>B：______________。","","还没呢，我这就赶快去订"]],"drill":[["选择：快下雨了，我们____回家吧。",["赶快","赶到"],0,"Mau về nhà → 赶快."],["“赶快”的意思是：",["抓紧时间、加快速度","慢慢地"],0,"Nhanh lên."]]},{"word":"片","py":"piàn","pos":"名词／量词","forms":["名词：平而薄的东西，一般不是太大（叶片、玻璃碎片、切成片）","量词：用于成片的东西（一片面包、一片药）；也用于声音、景色等（一片欢呼声、一片树林）"],"vn":"<b>片<\/b>: ① danh từ — <b>miếng, mảnh<\/b> (vật mỏng, phẳng): 叶片, 玻璃碎片; ② lượng từ — dùng cho vật thành miếng (一片面包, 一片药), cũng dùng cho âm thanh, cảnh sắc (一片欢呼声, 一片树林).","text":"大树出的“汗”，通常是从叶片的气孔里冒出来的","ex":[["瓶子里装着满满的石头、玻璃碎片和沙子。","Trong chai đựng đầy đá, mảnh thủy tinh vụn và cát."],["窗外有一棵大树，秋风中，叶子一片片地掉落下来。","Ngoài cửa sổ có một cây lớn, trong gió thu, lá rụng xuống từng chiếc từng chiếc."],["同学们听了，发出一片热烈的欢呼声。","Các bạn nghe xong, reo hò vang dậy."]],"book_title":"练一练：完成句子或对话（片）","book":[["A：我来切菜吧，土豆怎么切？<br>B：______________。（片—名词）","","切成薄片吧"],["今天早上我吃了______________。（片—量词）","","今天早上我吃了两片面包"],["A：这药怎么吃？<br>B：______________。（片—量词）","","一天三次，每次两片"]],"drill":[["“一片热烈的欢呼声”中，“片”是：",["量词","名词"],0,"Lượng từ cho âm thanh."],["选择：远处有一____树林。",["片","张"],0,"一片树林."]]},{"word":"根本","py":"gēnběn","pos":"名词／形容词／副词","forms":["名词：事物最重要的部分（教育是国家的根本；从根本上解决）","形容词：主要的、最重要的、起决定作用的（根本的问题）","副词：从头到尾、始终，多用于否定句（根本无法、根本读不懂）；还表示彻底、完全（根本解决）"],"vn":"<b>根本<\/b>: ① danh từ — <b>gốc rễ<\/b>: 从根本上解决问题; ② tính từ — <b>cơ bản, then chốt<\/b>: 根本的问题; ③ phó từ — <b>hoàn toàn, căn bản (không)<\/b>, hay dùng trong câu phủ định: 根本无法; cũng có nghĩa <b>triệt để<\/b>: 已经根本解决了.","text":"以大树输送管道的尺寸产生的毛细作用，根本无法把水分送到几十米高的地方","ex":[["教育是国家的根本。","Giáo dục là gốc rễ của quốc gia."],["谈判还算顺利，一些根本的问题都谈好了。","Đàm phán khá thuận lợi, một số vấn đề cơ bản đã bàn xong."],["有时候我会梦见参加考试，可是却发现自己根本读不懂考试的题目。","Có lúc tôi mơ thấy đi thi, nhưng lại phát hiện mình hoàn toàn không hiểu đề."]],"book_title":"练一练：完成句子或对话（根本）","book":[["A：你觉得他说的话有道理吗？<br>B：______________。","","我觉得他根本就是在胡说"],["搬家要整理的东西太多了，______________。","","搬家要整理的东西太多了，我一个人根本忙不过来"],["秦国人在赵国四处散布谣言，说秦军最怕赵括，______________。","","秦国人在赵国四处散布谣言，说秦军最怕赵括，赵王竟然相信了，根本没想到这是秦国的计策"]],"drill":[["“从根本上解决问题”中，“根本”是：",["名词","副词"],0,"Sau 从……上 → danh từ."],["选择：他是位盲人，____看不见你的动作。",["根本","本来"],0,"Hoàn toàn không → 根本."]]}],"HSK":{"r1":[{"text":["夏天，很多人运动以后喜欢马上喝冰水、吹空调。其实，{36}。运动以后，身体的温度很高，{37}，很容易感冒。专家建议，运动以后应该先找个荫凉的地方歇一歇，{38}，等身体慢慢恢复以后再洗澡。"],"qs":[{"n":36,"o":["这样能很快恢复活力","这样做对身体并不好","这是最好的办法","大家都应该这样做"],"a":1,"why":"“其实”表示转折，后文说明坏处。"},{"n":37,"o":["如果一下子遇到很冷的东西","只要多吃冰激凌","因为天气很热","所以要多运动"],"a":0,"why":"冷热变化 → 感冒。"},{"n":38,"o":["喝点儿温开水补充水分","马上去跑步","吃很多冰激凌","立刻洗冷水澡"],"a":0,"why":"与“慢慢恢复”一致。"}]},{"text":["人们常说“人往高处走，水往低处流”。可是在大树身上，{39}。树根吸收的水分，可以一直被送到几十米高的树梢。科学家发现，{40}。叶子不停地向空气中释放水汽，{41}。不过，关于大树内部的供水系统，{42}。"],"qs":[{"n":39,"o":["根本没有水","水是从天上来的","水只往低处流","水却能往高处“走”"],"a":3,"why":"与常识相反。"},{"n":40,"o":["这和叶子有很大的关系","这是因为下雨","树干会自己喝水","这和树根没有关系"],"a":0,"why":"后文说明叶子的作用。"},{"n":41,"o":["因此树会死","所以叶子越来越干","迫使下面的水分不断地补充上来","然后水就停住了"],"a":2,"why":"蒸腾拉力的原理。"},{"n":42,"o":["还有很多问题到目前是个谜","它非常简单","人们已经全部了解了","没有人研究过"],"a":0,"why":"与课文结尾一致。"}]}],"r2":[{"start":46,"paras":["最初人们认为大树是通过毛细作用来提水的。","植物的根会吸收水分，可是水是怎么到达树梢的呢？","可是经过测验发现，毛细作用根本无法把水送到那么高。","原来，是叶子释放水汽，产生了“蒸腾拉力”。","不过，这种拉力为什么这么大，到目前还是个谜。"],"ans":["B","A","C","D","E"],"why":"提出问题（B）→ 最初的看法（A）→ 否定（C）→ 真正的原因（D）→ 还没解决的问题（E）。"}],"r3":[{"text":["很多人喜欢在家里养几盆绿色植物，觉得它们不但好看，还能让空气更新鲜。那么，植物真的能净化空气吗？","研究发现，有些植物确实能吸收空气中的一些有害成分，比如吊兰、芦荟等。白天，植物通过光合作用吸收二氧化碳，释放氧气，让人感觉更舒服。另外，植物“出汗”释放的水汽，还能让房间里的空气更湿润。","不过，专家也提醒，<u><b>靠几盆植物来净化空气，效果是很有限的<\/b><\/u>。一个房间如果装修以后有害气体很多，最好的办法还是经常开窗通风。","还有，有些植物晚上也会吸收氧气，所以卧室里的植物不要放得太多。"],"qs":[{"n":56,"s":"根据第二段，植物“出汗”可以：","o":["让房间里的空气更湿润","让房间更热","吸引很多昆虫","让人更累"],"a":0,"why":"第二段最后一句。"},{"n":57,"s":"画线句子说明：","o":["植物净化空气的能力不大","植物能完全净化空气","不应该养植物","植物会产生有害气体"],"a":0,"why":"“效果很有限”。"},{"n":58,"s":"房间装修以后，最好的办法是：","o":["经常开窗通风","多买几盆植物","关紧窗户","多开空调"],"a":0,"why":"第三段。"},{"n":59,"s":"为什么卧室里的植物不要放得太多？","o":["有些植物晚上也会吸收氧气","植物太贵了","植物会出很多汗","植物晚上会长大"],"a":0,"why":"最后一段。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，讲一讲小明发现的秘密。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể về bí mật mà Tiểu Minh phát hiện.","panels":[["⚽","炎热的夏天，小明和同学们踢完一场球赛，每个人都汗如雨下。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><defs><linearGradient id=\"sk26345_1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffe9b8\"/><stop offset=\"1\" stop-color=\"#fff6dc\"/><\/linearGradient><\/defs><rect width=\"320\" height=\"240\" fill=\"url(#sk26345_1)\"/><g transform=\"translate(270.0,40.0) scale(1.1,1.1)\"><g stroke=\"#f5b82e\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M22.0 0.0 L30.0 0.0\"/><path d=\"M15.6 15.6 L21.2 21.2\"/><path d=\"M0.0 22.0 L0.0 30.0\"/><path d=\"M-15.6 15.6 L-21.2 21.2\"/><path d=\"M-22.0 0.0 L-30.0 0.0\"/><path d=\"M-15.6 -15.6 L-21.2 -21.2\"/><path d=\"M-0.0 -22.0 L-0.0 -30.0\"/><path d=\"M15.6 -15.6 L21.2 -21.2\"/><\/g><circle r=\"16\" fill=\"#ffd34d\"/><\/g><rect y=\"190\" width=\"320\" height=\"50\" fill=\"#bfe3a3\"/><g transform=\"translate(100.0,214.0) scale(0.612,0.612)\"><path d=\"M-4 -62 L-18 -36 L-28 -18 M4 -62 L16 -30 L14 -4\" stroke=\"#3d4a66\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#5f8a1e\"/><path d roke-linejoin=\"round\"/><circle cx=\"44\" cy=\"-112\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M-18 -132 q0 -20 18 -20 q18 0 18 20 l2 26 q-8 4 -14 0 l-4 -18 h-4 l-4 18 q-6 4 -14 0z\" fill=\"#3a2a22\"/><circle cx=\"-16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"-130\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -133 q2 -16 17 -16 q15 0 17 16 q-10 -6 -17 -9 q-6 6 -17 9z\" fill=\"#3a2a22\"/><circle cx=\"-5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-5 -124 q5 5 10 0\" stroke=\"#3b2f2f\" stroke-width=\"1.7\" fill=\"none\" stroke-linecap=\"round\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><g fill=\"none\" stroke=\"#3b2f2f\" stroke-width=\"1.3\"><circle cx=\"-6\" cy=\"-131\" r=\"4.6\"/><circle cx=\"6\" cy=\"-131\" r=\"4.6\"/><path d=\"M-1.4 -131 h2.8\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: đá bóng mồ hôi nhễ nhại → nghỉ dưới gốc cây thấy mát → hỏi thầy → thầy giải thích cây “đổ mồ hôi”.","Có thể dùng: 炎热、歇、肌肉、恢复、湿润、吸收、根本、自动、补充、特殊."],"sample":"一个炎热的下午，小明和同学们踢完一场球赛，每个人都汗如雨下。他们赶快跑到操场边的一棵大树下歇一歇，喝了几口凉开水，放松放松肌肉，很快就恢复了活力。小明觉得很奇怪：为什么大树下比别的地方凉快这么多呢？他去问老师。老师笑着说：“因为大树也在‘出汗’呀！树根吸收的水分被送到叶子上，叶子不停地向空气中释放水汽，所以大树周围的空气又湿润又荫凉。”小明这才明白，原来植物身上有这么多秘密。","svn":"Ngày hè nóng, Tiểu Minh cùng bạn đá bóng mồ hôi nhễ nhại; nghỉ dưới gốc cây, uống nước thấy rất mát; hỏi thầy vì sao dưới gốc cây mát hơn; thầy giải thích cây cũng “đổ mồ hôi”, lá thải hơi nước làm không khí ẩm mát."},"w72":{"prompt":"有人说：“城市里应该多种树，少盖楼。”也有人说：“城市需要发展，盖楼比种树更重要。”你怎么看？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói thành phố nên trồng nhiều cây, ít xây nhà; có người nói thành phố cần phát triển, xây nhà quan trọng hơn trồng cây. Bạn nghĩ sao? Viết bài không ít hơn 200 chữ.","min":200,"title":"城市需要更多的树","tips":["Mở bài: hai quan điểm → quan điểm của bạn (cần nhiều cây hơn) → 首先 cây làm không khí ẩm mát, giảm nhiệt → 其次 quang hợp, cải thiện không khí → 当然 thành phố cũng cần phát triển → 总之.","Dùng: 之所以……是因为……；可不是为了……而是为了……；越……越……；如果没有……将无法……."],"sample":"有人说城市里应该多种树、少盖楼，也有人说盖楼比种树更重要。我认为，城市需要发展，但更需要树。\n首先，树能让城市更舒适。炎热的夏天，我们之所以能在大树下享受湿润荫凉，是因为大树在“出汗”。树越多，城市的温度就越低，人们就不需要整天开空调。\n其次，树能让空气更新鲜。植物通过光合作用吸收二氧化碳，释放氧气，有些植物还能吸收空气中的有害成分。如果没有植物，我们将无法生存。\n当然，我并不是说城市不需要盖楼。城市的人口越来越多，需要更多的房子和办公楼。但是，盖楼的时候应该留出足够的地方种树、建公园。\n总之，发展城市可不是为了盖更多的楼，而是为了让人们生活得更好。所以，城市里一定要多种树。","svn":"Nghị luận: thành phố cần phát triển nhưng càng cần cây → 首先 cây làm thành phố mát mẻ → 其次 cây làm không khí trong lành → 当然 vẫn cần xây nhà nhưng phải chừa chỗ cho cây → 总之."}},"PRACTICE":{"ex1":{"bank":["测验","根本","内部","疲劳","系统","自动"],"items":[["有时候，睡觉并不一定能缓解{}。",["疲劳"]],["你的电脑太慢了，应该去给{}做一下升级。",["系统"]],["其实他是位盲人，{}看不见你的动作。",["根本"]],["楼下新装了一台{}售货机。",["自动"]],["一位心理学家找来两个7岁的孩子进行一项心理{}。",["测验"]],["这是我们公司{}的问题，我们自己来解决吧。",["内部"]]]},"ex2":[["这是你第几次错了？！怎么不____教训呢？",["吸取","吸收"],0,"吸取教训 = rút ra bài học."],["你太激动了，最好____一下你的情绪。",["限制","控制"],1,"Kiềm chế cảm xúc → 控制情绪."],["是他____提出要去参加这次比赛的。",["自动","主动"],1,"Người tự giác đưa ra → 主动."],["今天的比赛____良好，没有球迷闹事。",["秩序","规则"],0,"秩序良好 = trật tự tốt."]],"ex3":[],"ex3match":{"groups":[[["一壶","开水"],["一根","管子"],["一块","玻璃"],["一片","天空"]],[["恢复","疲劳"],["了解","状况"],["补充","水分"],["遵守","秩序"]]]},"ex4":[["运动之后","歇、肌肉、恢复、湿润","炎热的夏天踢完球，到大树下歇一歇，喝口凉开水，放松放松肌肉，可以很快恢复活力。我们能享受大树下的湿润荫凉，是因为大树在“出汗”。"],["人出汗与大树“出汗”","指挥、赶快、片、运输","人体温度上升时，大脑会指挥身体赶快出汗，汗水从毛孔里冒出来。大树的“汗”从叶片的气孔里冒出来，不是为了降温，而是为了运输养分。"],["大树怎么“出汗”","吸收、控制、管子、根本、自动、特殊、状况、秩序","树根吸收水分后，人们以为是毛细作用让水顺着细管子向上爬，但毛细作用根本无法把水送到几十米高。其实是叶子释放水汽，迫使水分自动补充，这种特殊的提升力叫“蒸腾拉力”。大树内部供水系统的状况和秩序还是个谜。"]],"ext":{"title":"扩展 · 话题：动物 · 植物","words":[["老鼠","lǎoshǔ","con chuột"],["蜜蜂","mìfēng","con ong"],["蛇","shé","con rắn"],["狮子","shīzi","sư tử"],["兔子","tùzi","con thỏ"],["大象","dàxiàng","con voi"],["猴子","hóuzi","con khỉ"],["猪","zhū","con lợn"],["蝴蝶","húdié","con bướm"],["昆虫","kūnchóng","côn trùng"],["小麦","xiǎomài","lúa mì"],["竹子","zhúzi","cây tre"],["根","gēn","rễ"],["果实","guǒshí","quả, trái"]],"items":[["猫和{}是天敌。","老鼠"],["“蜂拥而至”这个成语是形容很多人像{}似的一拥而来。","蜜蜂"],["冬天，一位农夫在路边看到一条快要冻死的{}，觉得它很可怜。","蛇"],["{}是世界上产量第二的粮食，仅次于玉米。","小麦"]]}},"TEXT":[{"title":"大树下的荫凉","sub":"大树在“出汗”呢！","paras":["炎热的夏天，踢完一场球赛，每个队员都已经是汗如雨下。如果这个时候，能到大树下歇一歇，喝口凉开水，吃个冰激凌，放松放松肌肉，缓解一下疲劳，那一定是件美事，可以很快恢复活力。不过，你知道吗，我们之所以能在大树下享受这种湿润荫凉，也是因为大树在“出汗”呢！"],"idea":"Mùa hè <b>nóng bức<\/b>, đá xong một trận bóng, cầu thủ nào cũng mồ hôi như mưa. Nếu lúc này được ra gốc cây <b>nghỉ<\/b> một chút, uống ngụm <b>nước sôi<\/b> để nguội, ăn cây <b>kem<\/b>, thả lỏng <b>cơ bắp<\/b>, giảm mệt mỏi thì thật là chuyện tuyệt, có thể nhanh chóng <b>lấy lại<\/b> sức sống. Nhưng bạn có biết, sở dĩ ta được hưởng sự <b>ẩm mát<\/b>, <b>râm mát<\/b> dưới gốc cây cũng là vì cây đang “đổ mồ hôi” đấy!","qs":[["“汗如雨下”的意思是：",["出了很多汗","下了很大的雨","很冷"],0],["我们能在大树下享受湿润荫凉，是因为：",["大树在“出汗”","大树下有空调","大树下有冰激凌"],0]]},{"title":"人和树出汗","sub":"为了运输养分","paras":["人体要保持相对稳定的温度，一旦温度上升，大脑就会指挥我们的身体赶快出汗，这时所有汗腺开始工作，汗水就从毛孔里冒了出来。大树出的“汗”，通常是从叶片的气孔里冒出来的，不过，这种“出汗”可不是为了降低温度，而是为了运输养分。"],"idea":"Cơ thể người phải giữ nhiệt độ tương đối ổn định; một khi nhiệt độ tăng, não sẽ <b>ra lệnh<\/b> cho cơ thể <b>mau chóng<\/b> đổ mồ hôi, các <b>tuyến mồ hôi<\/b> bắt đầu làm việc, mồ hôi <b>toát<\/b> ra từ <b>lỗ chân lông<\/b>. “Mồ hôi” của cây thường toát ra từ khí khổng trên <b>phiến<\/b> lá, nhưng việc “đổ mồ hôi” này không phải để hạ nhiệt mà là để vận chuyển chất dinh dưỡng.","qs":[["人为什么会出汗？",["为了保持相对稳定的温度","为了运输养分","为了喝更多的水"],0],["大树出“汗”是为了：",["运输养分","降低温度","吸引昆虫"],0],["大树的“汗”通常是从哪里冒出来的？",["叶片的气孔","树根","树干"],0]]},{"title":"毛细作用？","sub":"根本无法把水分送到几十米高的地方","paras":["我们都知道这样的常识——植物的根会吸收养分和水分，但是你有没有想过，植物是怎么控制这些成分，把它们运输到十几米甚至上百米的树梢的呢？","最初人们认为大树是通过毛细作用来提水的。所谓“毛细作用”，简单来说，就是水会顺着很细很细的管子向上“爬”，我们在家可以用一个比较细的玻璃管体验一下。玻璃管越细，水爬升的高度就越高。可是，经过测验计算发现，以大树输送管道的尺寸产生的毛细作用，根本无法把水分送到几十米高的地方。"],"idea":"Ta đều biết <b>kiến thức thông thường<\/b>: <b>rễ<\/b> cây <b>hút<\/b> chất dinh dưỡng và nước. Nhưng bạn đã nghĩ chưa, cây <b>điều khiển<\/b> các <b>thành phần<\/b> này thế nào để đưa lên <b>ngọn<\/b> cây cao hơn chục mét, thậm chí cả trăm mét? Ban đầu người ta cho rằng cây hút nước nhờ hiện tượng mao dẫn: nước men theo những <b>ống<\/b> rất nhỏ mà “bò” lên — ở nhà có thể thử bằng một ống <b>thủy tinh<\/b> nhỏ, ống càng nhỏ nước lên càng cao. Nhưng qua <b>kiểm tra<\/b>, tính toán, với kích thước mạch dẫn của cây, mao dẫn <b>hoàn toàn không thể<\/b> đưa nước lên cao vài chục mét.","qs":[["“毛细作用”简单来说就是：",["水顺着很细的管子向上“爬”","树根吸收水分","叶子释放水汽"],0],["玻璃管越细，水爬升的高度：",["越高","越低","不变"],0],["经过测验计算，人们发现毛细作用：",["根本无法把水分送到几十米高的地方","可以把水送到树梢","比蒸腾拉力更大"],0]]},{"title":"蒸腾拉力","sub":"到目前还是个谜","paras":["实际上，大树利用的是枝干顶端的那些叶片。叶子通过不停地向空气中释放水汽，迫使树干中的水分自动前来补充，这样节节传递，就像是把树根吸收的水分给抽了上来。因为跟蒸腾作用有关，这种特殊的提升力就被称为“蒸腾拉力”。不过，这个大树内部的供水系统具体的运转状况是怎么样的，它们遵守的是一种什么样的秩序，为什么会产生如此巨大的拉力，到目前还是个谜。"],"idea":"Thật ra cây lợi dụng những phiến lá ở đầu <b>cành<\/b>. Lá không ngừng <b>thải<\/b> hơi nước vào không khí, buộc nước trong thân cây <b>tự động<\/b> lên <b>bổ sung<\/b>, cứ thế truyền từng đoạn, giống như <b>hút<\/b> nước rễ cây hấp thu lên trên. Vì liên quan đến tác dụng <b>thoát hơi nước<\/b>, lực nâng <b>đặc biệt<\/b> này gọi là “lực kéo thoát hơi nước”. Nhưng <b>hệ thống<\/b> cấp nước <b>bên trong<\/b> cây vận hành cụ thể ra sao (<b>tình trạng<\/b>), tuân theo <b>trật tự<\/b> nào, vì sao sinh ra lực kéo lớn đến vậy — đến nay vẫn là một bí ẩn.","qs":[["大树是靠什么把水分送到高处的？",["叶片释放水汽产生的“蒸腾拉力”","毛细作用","树根的力量"],0],["“蒸腾拉力”这个名字和什么有关？",["蒸腾作用","毛细作用","光合作用"],0],["关于大树内部的供水系统，下面哪一项是对的？",["很多问题到目前还是个谜","人们已经完全了解了","它不遵守任何秩序"],0],["这篇课文主要介绍的是：",["大树“出汗”和运输水分的原理","怎样在夏天降温","怎样做玻璃管实验"],0]]}],"TEXT_EXTRA":{"bg":"植物在我们的生活中十分常见，也十分重要，花草树木，让我们的世界变得更美丽、更舒适。更重要的是，植物具有一种叫作“光合作用”的能力——它可以借助光能及我们人类和动物体内所不具备的叶绿素，利用水、无机盐和二氧化碳进行作用，释放出氧气。如果没有植物，我们将无法生存。","bg_vn":"Thực vật rất phổ biến và quan trọng trong đời sống; hoa cỏ cây cối làm thế giới đẹp hơn, dễ chịu hơn. Quan trọng hơn, thực vật có khả năng gọi là “quang hợp”: nhờ năng lượng ánh sáng và chất diệp lục (叶绿素) mà người và động vật không có, dùng nước, muối vô cơ (无机盐) và khí CO₂ (二氧化碳) để tạo ra khí ô-xy (氧气). Nếu không có thực vật, chúng ta sẽ không thể sinh tồn.","bg_qs":[["植物通过“光合作用”释放出：",["氧气","二氧化碳","水"],0],["根据短文，人类和动物体内不具备：",["叶绿素","水","肌肉"],0]]},"APPLY":{"theme":"植物的功能","topic":"植物的功能：在你的生活中，植物起了什么作用？","topic_vn":"Chức năng của thực vật: trong cuộc sống của bạn, thực vật có tác dụng gì? (nói 1–1,5 phút): loài cây bạn thích → đặc điểm → tác dụng → kết luận.","qs":[["你喜欢什么样的植物？","Bạn thích loại cây nào?","我喜欢竹子。竹子长得又高又直，一年四季都是绿色的，看起来非常有精神。而且竹子很有用，可以做家具，竹笋还可以吃。",["竹子","四季","有用"]],["在你的国家最常见或最有名的植物是什么？","Ở nước bạn loài cây phổ biến hoặc nổi tiếng nhất là gì?","在越南，最有名的植物是莲花和竹子。莲花是越南的国花，它从泥里长出来，可是一点儿也不脏，代表着纯洁。竹子在越南农村随处可见。",["莲花","国花","代表"]],["在你的生活中，植物起了什么作用？","Trong cuộc sống của bạn, thực vật có tác dụng gì?","植物的作用很多。我在房间里养了几盆绿植，它们可以让空气更湿润、更新鲜；看书累了，看看绿色的叶子，眼睛的疲劳也能得到缓解。",["湿润","疲劳","缓解"]]],"vocab":[["光合作用","guānghé zuòyòng","quang hợp"],["氧气","yǎngqì","khí ô-xy"],["叶子","yèzi","lá"],["开花","kāi huā","nở hoa"],["结果","jiē guǒ","ra quả"],["浇水","jiāo shuǐ","tưới nước"],["绿植","lǜzhí","cây xanh trồng chậu"],["莲花","liánhuā","hoa sen"],["竹子","zhúzi","cây tre"],["四季常青","sìjì chángqīng","xanh tốt bốn mùa"]],"build_title":"选一个话题，拼出你的回答","build_lead":"Chọn hướng trả lời, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 观点","② 理由","③ 举例","④ 结论"],"build":{"A · 我喜欢的植物":[["我最喜欢的植物是竹子。","在所有的植物中，我特别喜欢莲花。"],["竹子长得又高又直，一年四季都是绿色的，看起来很有精神。","莲花从泥里长出来，可是一点儿也不脏，代表着纯洁。"],["小时候，我家后院有一片竹林，夏天我常在竹林里歇一歇，特别荫凉。","每年夏天，我都和家人去湖边看莲花，那里的空气又湿润又新鲜。"],["所以，竹子在我的成长过程中充当着很重要的角色。","总之，莲花是我心中最美的花。"]],"B · 植物的作用":[["我认为，植物在我们的生活中十分重要。","植物的作用很多，没有植物，我们将无法生存。"],["植物可以通过光合作用释放出氧气，让空气更新鲜。","大树会“出汗”，可以让周围的空气更湿润、更荫凉。"],["我在房间里养了几盆绿植，看书累了，看看绿叶，疲劳就缓解了。","夏天的时候，大树下比别的地方凉快多了，这就是大树在“出汗”。"],["所以，我们应该爱护植物，多种树。","总之，植物是人类最好的朋友。"]],"C · 植物的秘密":[["植物身上有很多秘密，到目前还有很多是个谜。","学了这篇课文，我才知道植物也会“出汗”。"],["大树出“汗”可不是为了降低温度，而是为了运输养分。","树根吸收的水分，是靠叶子的“蒸腾拉力”抽上去的。"],["比如有些大树有一百多米高，水分也能自动补充到树梢。","以前我以为是毛细作用，可是毛细作用根本无法把水送到那么高。"],["我觉得，大自然真是太神奇了！","所以，我们要多观察、多了解身边的植物。"]]},"patterns":[["① 观点","我最喜欢的植物是……","Loài cây tôi thích nhất là…"],["② 理由","……之所以……，是因为……","Sở dĩ…, là vì…"],["② 理由","……可不是为了……，而是为了……","… đâu phải để…, mà là để…"],["③ 举例","……越……，……就越……","… càng…, … càng…"],["④ 结论","如果没有植物，我们将无法生存。","Nếu không có thực vật, chúng ta sẽ không thể sinh tồn."],["④ 结论","……到目前还是个谜。","… đến nay vẫn là bí ẩn."]],"legend":["① Quan điểm","② Lý do","③ Ví dụ","④ Kết luận"],"w5":["歇","肌肉","恢复","湿润","指挥","赶快","常识","吸收","控制","成分","玻璃","测验","根本","自动","补充","特殊","内部","系统","状况","秩序"],"samples":[{"who":"我喜欢的植物","meta":"Bài nói ~1 phút","p":["我最喜欢的植物是竹子。","竹子长得又高又直，一年四季都是绿色的，看起来很有精神。","小时候，我家后院有一片竹林，夏天我常在竹林里歇一歇，特别荫凉。","所以，竹子在我的成长过程中充当着很重要的角色。"],"good":["夏天我常在竹林里歇一歇"],"vi":"Loài cây tôi thích nhất là tre. Tre mọc vừa cao vừa thẳng, bốn mùa đều xanh, trông rất có tinh thần. Hồi nhỏ sau nhà tôi có một bụi tre, mùa hè tôi hay nghỉ trong bụi tre, mát lắm. Vì vậy tre đóng vai trò quan trọng trong quá trình trưởng thành của tôi."},{"who":"植物的作用","meta":"Bài nói ~1 phút","p":["我认为，植物在我们的生活中十分重要。","大树会“出汗”，可以让周围的空气更湿润、更荫凉。","我在房间里养了几盆绿植，看书累了，看看绿叶，疲劳就缓解了。","所以，我们应该爱护植物，多种树。"],"good":["可以让周围的空气更湿润、更荫凉"],"vi":"Tôi cho rằng thực vật rất quan trọng trong cuộc sống. Cây lớn biết “đổ mồ hôi”, làm không khí xung quanh ẩm và mát hơn. Tôi trồng vài chậu cây xanh trong phòng, đọc sách mệt thì nhìn lá xanh là đỡ mỏi. Vì vậy ta nên yêu quý thực vật, trồng nhiều cây."}]},"WRITE":{"topic":"我所知道的一种植物","topic_vn":"Viết bài với đầu đề “Một loài thực vật mà tôi biết”, nói về hiểu biết của bạn về thực vật. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","开头","Mở bài: giới thiệu loài cây.","我所知道的一种植物是……"],["②","特征","Đặc điểm: hình dáng, màu sắc, nơi mọc…","它的特征是……"],["③","作用 · 秘密","<b>Trọng tâm.<\/b> Tác dụng / điều thú vị (ví dụ: cách cây hút nước).","……可不是为了……，而是为了……"],["④","结尾","Kết: ý nghĩa của nó với bạn / với con người.","如果没有……，我们……"]],"samples":[{"who":"范文 1 · 竹子","title":"我所知道的一种植物","p":["我所知道的一种植物是竹子。竹子长得非常快，有的竹子一天能长一米。它的根在地下长得很远，所以竹林常常一大片一大片的。竹子的作用很多：可以做家具、做筷子，竹笋还可以吃。夏天在竹林里歇一歇，又湿润又荫凉，特别舒服。"],"vi":"Khoảng 115 chữ: dùng 根、歇、湿润."},{"who":"范文 2 · 仙人掌","title":"我所知道的一种植物","p":["我所知道的一种植物是仙人掌。它生活在沙漠等干燥的地方，叶子变成了刺，这样可以减少水分的蒸发。它的茎很粗，里面能保存很多水分。所以，仙人掌很长时间不浇水也不会死。我觉得仙人掌很了不起，在那么特殊的环境里也能生存下来。"],"vi":"Khoảng 115 chữ: dùng 干燥、水分、特殊."},{"who":"范文 3 · 课本命题写作","title":"我所知道的一种植物","p":["我所知道的一种植物是大树。大树我们每天都能看到，可是关于它的秘密，你知道多少呢？","炎热的夏天，我们之所以能在大树下享受湿润荫凉，是因为大树在“出汗”。大树的“汗”是从叶片的气孔里冒出来的，这种“出汗”可不是为了降低温度，而是为了运输养分。","大树有几十米高，树根吸收的水分是怎么送到树梢的呢？以前人们以为是毛细作用，可是经过测验，毛细作用根本无法把水送到那么高的地方。原来，是叶子不停地释放水汽，迫使水分自动前来补充，这就是“蒸腾拉力”。","大自然真是太神奇了。大树不但给我们带来荫凉，还让我们的空气更新鲜。如果没有植物，我们将无法生存。"],"good":["我们之所以能在大树下享受湿润荫凉，是因为大树在“出汗”","这种“出汗”可不是为了降低温度，而是为了运输养分","如果没有植物，我们将无法生存"],"vi":"Khoảng 240 chữ. Ba chỗ gạch chân dùng lại khung câu của bài: 之所以……是因为…… · 可不是为了……而是为了…… · 如果没有……."}],"tpl":"我所知道的一种植物\n我所知道的一种植物是【……】。它的特征是【……】。它的作用很多：【……】。【一个有趣的知识 / 经历】。如果没有【……】，【……】。","chk":[["topic","Bám đề: có tên loài cây / 植物","植物|树|竹|花|草"],["desc","Có đặc điểm (长得 · 叶子 · 颜色 · 根)","长得|叶|颜色|根|高"],["use","Có tác dụng / điều thú vị (作用 · 可以 · 为了)","作用|可以|为了|原来"],["end","Có kết (所以 · 如果没有 · 我觉得)","所以|如果没有|我觉得|总之|真是"]],"w5":["歇","肌肉","恢复","湿润","指挥","赶快","常识","吸收","控制","成分","玻璃","测验","根本","自动","补充","特殊","内部","系统","状况","秩序"],"wmin":100,"wmax":200,"traps":"<b>Bắt buộc có:<\/b> tên loài cây, đặc điểm cụ thể, tác dụng hoặc một hiểu biết thú vị, và câu kết. Mượn ít nhất một khung 好句 — xem 范文 3.","hw_note":"Đọc xong phần 背景 (quang hợp), quay lại mục 4 để viết bài “我所知道的一种植物”."}};</script>
