<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 21 · 汉字叔叔：一个美国人的汉字情缘 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

{"tab":"汉字的演变","title":"说说你的母语文字和中文有什么不同","type":"discuss","lead":"Sách có hình chữ <b>水<\/b> biến đổi qua 5 thời kỳ: <span class='zh'>甲骨文 → 金文 → 小篆 → 隶书 → 楷书<\/span> — từ hình vẽ dòng nước thành chữ vuông như ngày nay.","q":"说说你母语所使用的文字和中文有什么不同。简单介绍一下你在学习汉字时，遇到了哪些困难或问题，你是怎么解决的。","vn":"Chữ viết tiếng mẹ đẻ của bạn khác chữ Hán thế nào? Khi học chữ Hán bạn gặp khó khăn gì, giải quyết ra sao?","answer_zh":"越南语现在用拉丁字母，看到一个词就能读出来；汉字却要一个一个地记，笔画也很多。刚开始我只能死记硬背，后来我学了汉字的来源，比如“休”是一个人靠在树旁边休息，这样就容易记多了。","answer_vn":"Từ hữu ích: 拉丁字母 (chữ La-tinh), 笔画 (nét chữ), 部首 (bộ thủ), 来源 (nguồn gốc), 死记硬背 (học vẹt), 演变 (diễn biến)."},{"tab":"繁体与简体","title":"找出与繁体字对应的简体写法","type":"reveal","lead":"Chữ Hán thay đổi theo thời gian. Tìm trong bảng từ mới cách viết <b>giản thể<\/b> tương ứng với các từ <b>phồn thể<\/b> dưới đây (ví dụ: 儘快 → 尽快).","items":[["邏輯","逻辑","lô-gích"],["儘快","尽快","càng sớm càng tốt"],["輸入","输入","nhập (vào máy tính)"],["稱讚","称赞","khen ngợi"],["開放","开放","mở cửa"],["夢想","梦想","ước mơ"]],"note":"<span class='zh'>汉字叔叔的网站里，每个汉字都有繁体字形和简体字形。<\/span>"}],"GAME":{"fill":[["汉字的一笔一画没有任何{}，只能死记硬背。","逻辑",["逻辑","道理","规律","理由"]],["一个{}的机会，他发现如果了解汉字的来源和演变过程……","偶然",["偶然","偶尔","突然","当然"]],["但是他{}地发现，几乎没有一本英文书能充分解释汉字的字源。","遗憾",["遗憾","后悔","可惜","抱歉"]],["那时，他开始{}自己的人生……","思考",["思考","考虑","考试","参考"]],["我要抓紧时间{}把《说文解字》电脑化。","尽快",["尽快","赶快","愉快","凉快"]],["战胜疾病的他决定把自己创办的网站{}……","公开",["公开","公平","公布了","离开"]],["打开汉字叔叔{}种种困难、花光全部积蓄创办的网站……","克服",["克服","服务","佩服","说服"]],["被网友{}为“有图有真相”。","称赞",["称赞","称呼","赞成","表扬了"]],["更让人{}的是，汉字叔叔将网站上的内容全部开放给网友免费下载。","佩服",["佩服","克服","舒服","说服"]],["我还要继续{}我的梦想……","追求",["追求","要求","请求","需求"]]],"order":[["理查德|得了|心脏病。"],["他也因此|被网友亲切地|称呼为|“汉字叔叔”。"],["他除了|教物理，|还有充分的时间|继续研究他的汉字"],["在中国，|60多岁|已经是|退休的年纪了。"],["汉字叔叔|每天的日程|却安排得|很满。"],["我要|‘活到老，|学到老’。"]]},"GOOD":[{"zh":"一个偶然的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易","vn":"một dịp tình cờ, ông phát hiện nếu hiểu nguồn gốc và quá trình biến đổi của chữ Hán thì học nó sẽ trở nên nhẹ nhàng, dễ dàng","why":"Kể bước ngoặt: <b>一个偶然的机会，……发现……<\/b> + điều kiện <b>如果……，再……就……<\/b>.","frame":"一个偶然的机会，A 发现如果……，再……就变得……","apply":"一个偶然的机会，我发现如果每天听中文歌，再学习生词就变得轻松多了。","apply_vn":"Một dịp tình cờ, tôi phát hiện nếu ngày nào cũng nghe nhạc tiếng Trung thì học từ mới nhẹ nhàng hơn nhiều."},{"zh":"如果只能活24小时，我会打电话和朋友们说再见；如果我还能活一年，我要抓紧时间尽快把《说文解字》电脑化","vn":"nếu chỉ sống được 24 giờ, tôi sẽ gọi điện chào tạm biệt bạn bè; nếu còn sống được một năm, tôi sẽ tranh thủ số hóa 《说文解字》 càng sớm càng tốt","why":"Hai vế giả thiết song song <b>如果……，我会……；如果……，我要……<\/b> — thể hiện suy nghĩ, quyết tâm.","frame":"如果……，我会……；如果……，我要抓紧时间尽快……","apply":"如果只有一个月的假期，我会回家陪父母；如果有一年的时间，我要抓紧时间尽快去中国留学。","apply_vn":"Nếu chỉ có một tháng nghỉ, tôi sẽ về nhà với bố mẹ; nếu có một năm, tôi sẽ tranh thủ đi du học Trung Quốc sớm nhất."},{"zh":"我不会退休，我还要继续追求我的梦想，我要‘活到老，学到老’","vn":"tôi sẽ không nghỉ hưu, tôi còn tiếp tục theo đuổi ước mơ, tôi muốn “sống đến già, học đến già”","why":"Câu kết mạnh: <b>我不会……，我还要继续追求……<\/b> + thành ngữ <b>活到老，学到老<\/b>.","frame":"我不会……，我还要继续追求……，我要“活到老，学到老”","apply":"我不会放弃学汉语，我还要继续追求我的梦想，我要“活到老，学到老”。","apply_vn":"Tôi sẽ không bỏ học tiếng Trung, tôi còn theo đuổi ước mơ, tôi muốn “sống đến già, học đến già”."}],"GRAMMAR":[{"word":"硬","py":"yìng","pos":"副词","forms":["硬 + 动词：坚决或固执地做某事（硬说、硬要）","硬 + 动词：能力不够却仍然尽力去做（硬挺、硬喝下去）"],"vn":"<b>硬<\/b> (phó từ) ① <b>khăng khăng, cố chấp<\/b> làm việc gì: 硬说 (khăng khăng nói), 死记硬背 (học vẹt máy móc); ② <b>cố gượng<\/b> làm dù sức không đủ: 硬挺过来 (gắng gượng vượt qua), 硬把药喝下去.","text":"只能死记硬背。","ex":[["在中国历史故事“指鹿为马”中，赵高把鹿硬说成马。","Trong điển tích “chỉ hươu bảo ngựa”, Triệu Cao khăng khăng nói hươu là ngựa."],["你不知道这一年我是怎么硬挺过来的。","Bạn không biết năm nay tôi đã gắng gượng vượt qua thế nào đâu."]],"book_title":"练一练：完成句子或对话（硬）","book":[["明明是他忘了，他却______________。","","明明是他忘了，他却硬说是我没告诉他"],["快递员的工作很辛苦，______________。","","快递员的工作很辛苦，但他硬是坚持了三年"],["A：谢谢你的好意，饭就不吃了，早点儿回去还要收拾行李呢。<br>B：既然你还有事，______________。","","既然你还有事，我就不硬留你了"]],"drill":[["“他把鹿硬说成马”中的“硬”表示：",["固执地","很结实"],0,"Khăng khăng, cố chấp."],["“虽然很累，他还是硬坚持跑完了。”中的“硬”表示：",["能力不够仍尽力做","坚决地说"],0,"Cố gượng làm."]]},{"word":"偶然","py":"ǒurán","pos":"形容词／副词","forms":["偶然（形）：事情发生在预料之外 — 一个偶然的机会","偶然（副）= 偶尔，有时候 — 偶然也会……"],"vn":"<b>偶然<\/b> ① <b>tính từ<\/b>: <b>tình cờ, ngẫu nhiên<\/b>, xảy ra ngoài dự đoán — 一个偶然的机会, 并非偶然; ② <b>phó từ<\/b>: <b>thỉnh thoảng<\/b> (= 偶尔) — 偶然也会抬眼看一下.","text":"一个偶然的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易。","ex":[["虽然桂花偶然也能长成18米高的大树，但是绝大多数情况下它们都很矮。","Dù hoa quế thỉnh thoảng cũng thành cây cao 18 mét, nhưng phần lớn chúng đều thấp."],["她专心地织着毛衣，偶然也会抬眼看一下墙上的挂钟。","Cô ấy chăm chú đan áo, thỉnh thoảng ngẩng lên nhìn đồng hồ trên tường."]],"book_title":"练一练：完成句子或对话（偶然）","book":[["______________彻底改变了他的命运。（偶然—形）","","一次偶然的机会彻底改变了他的命运"],["A：你是怎么知道那家时装店在招聘的？<br>B：______________。（偶然—形）","","我是偶然在报纸上看到他们的招聘广告的"],["A：你不是不喜欢吃方便面吗？<br>B：______________。（偶然—副）","","是不太喜欢，不过忙的时候偶然也会吃一次"]],"drill":[["“一个偶然的机会”中的“偶然”是：",["形容词","副词"],0,"Làm định ngữ → tính từ."],["选择：李阳喜欢画画儿并非____，他父亲就是画家。",["偶然","偶尔"],0,"Làm vị ngữ (并非偶然) → chỉ dùng 偶然."]]},{"word":"尽快","py":"jǐnkuài","pos":"副词","forms":["尽快 + 动词（尽量加快）","尽快完成 · 尽快回复 · 尽快商量"],"vn":"<b>尽快<\/b> (phó từ): <b>càng sớm càng tốt, nhanh nhất có thể<\/b> — dùng cho việc <b>có kế hoạch<\/b>, cần làm sớm. Khác <b>赶快<\/b> (mau lên!) dùng khi <b>gấp gáp, khẩn cấp<\/b> ngay lúc đó.","text":"如果我还能活一年，我要抓紧时间尽快把《说文解字》电脑化","ex":[["新产品出了点儿问题，你和严经理尽快商量一下这事。","Sản phẩm mới có chút vấn đề, anh bàn với giám đốc Nghiêm sớm nhất có thể."],["趁这两天天气好，你尽快把过季的衣服洗一洗，收起来。","Nhân mấy hôm trời đẹp, con giặt sớm quần áo trái mùa rồi cất đi."]],"book_title":"练一练：完成句子或对话（尽快）","book":[["下个月就开会讨论计划了，我______________。","","下个月就开会讨论计划了，我得尽快把计划写好"],["病人的情况很危险，______________。","","病人的情况很危险，必须尽快做手术"],["A：小刘已经联系好了客人，就等你这边安排酒店了。<br>B：______________。","","好的，我尽快把酒店订好"]],"drill":[["选择：什么？小明受伤了，那____送医院呀！",["尽快","赶快"],1,"Khẩn cấp ngay lúc đó → 赶快 (课本练习2)."],["选择：收到邮件后请____回复。",["尽快","赶快"],0,"Yêu cầu làm sớm nhất có thể → 尽快."]]}],"HSK":{"r1":[{"text":["玛丽来中国已经三年了。刚来的时候，她一句汉语也不会说，{36}。为了尽快学好汉语，她每天早上都去公园跟老人们聊天儿。老人们都很热情，{37}。现在，玛丽的汉语说得非常流利，{38}，大家都以为她是中国人。"],"qs":[{"n":36,"o":["每天都很开心","买东西都很困难","已经有很多朋友","不想学习"],"a":1,"why":"一句汉语也不会说，生活中会遇到困难。"},{"n":37,"o":["只会说英语","都不愿意跟她说话","常常耐心地纠正她的发音","很快就离开了"],"a":2,"why":"老人们很热情，所以会帮助她。"},{"n":38,"o":["看电视的时候","考试的时候","打电话的时候","写汉字的时候"],"a":2,"why":"看不见人，只听声音，才会“以为她是中国人”。"}]},{"text":["汉字是世界上最古老的文字之一，{39}。最早的汉字是刻在龟甲和兽骨上的，叫“甲骨文”。那时候的汉字{40}，比如“日”就像一个太阳，“山”就像三座山峰。后来，汉字经历了金文、小篆、隶书、楷书等阶段，{41}。了解汉字的演变过程，{42}，还能感受到中国文化的魅力。"],"qs":[{"n":39,"o":["现在已经不用了","是最近才出现的","只有中国人使用","已经有三千多年的历史了"],"a":3,"why":"古老的文字，所以历史很长。"},{"n":40,"o":["很像图画","都是数字","没有意义","非常复杂"],"a":0,"why":"后文举例“日”像太阳，说明像图画。"},{"n":41,"o":["完全没有变化","越来越难写","字形越来越方便书写","数量越来越少"],"a":2,"why":"从甲骨文到楷书，字形变得更容易写。"},{"n":42,"o":["不但能帮助我们记住汉字","会觉得很痛苦","就不用学习了","一定能当老师"],"a":0,"why":"与后面的“还能……”搭配：不但……还……"}]}],"r2":[{"start":46,"paras":["后来，她偶然在网上看到一个讲汉字故事的视频，觉得非常有意思。","安娜刚开始学汉语时，最头疼的就是汉字。","从那以后，她每天都看一个汉字故事，再也不觉得汉字难记了。","她觉得每个汉字都像一幅画，只能死记硬背，常常写了就忘。","现在，她还在网上开了自己的账号，给外国朋友讲汉字故事。"],"ans":["B","D","A","C","E"],"why":"最头疼汉字（B）→ 死记硬背（D）→ 偶然看到视频（A）→ 不再觉得难（C）→ 现在开账号（E）。"}],"r3":[{"text":["很多人觉得，学外语是年轻人的事，年纪大了记忆力不好，学不会。可是，北京的刘奶奶却不这么认为。","刘奶奶今年72岁，退休以后，她开始学习英语。最初，她连26个字母都记不住，孙子笑她说：“奶奶，您这么大年纪了，学英语干什么？”刘奶奶说：“我想以后去国外旅行的时候，能自己问路、点菜。”","为了学好英语，刘奶奶每天的日程都安排得满满的：早上听英语广播，下午去社区的英语班上课，晚上还要复习。<u><b>遇到不会的单词，她就请孙子帮忙，孙子成了她的“小老师”<\/b><\/u>。","五年过去了，刘奶奶不但能用英语进行简单的对话，还和孙子一起去欧洲旅行了一次。她说：“学习没有年龄限制，活到老，学到老嘛！”"],"qs":[{"n":56,"s":"刘奶奶为什么要学英语？","o":["为了找工作","为了去国外旅行时能自己问路、点菜","为了当老师","因为孙子要求"],"a":1,"why":"第二段刘奶奶的话。"},{"n":57,"s":"第三段说明刘奶奶：","o":["学习很努力","不喜欢上课","常常生病","没有时间学习"],"a":0,"why":"每天的日程都安排得满满的。"},{"n":58,"s":"画线句子中，孙子成了“小老师”是因为：","o":["孙子在学校当老师","孙子常常帮奶奶解决不会的单词","孙子年纪比奶奶大","孙子不会英语"],"a":1,"why":"画线句：遇到不会的单词，她就请孙子帮忙。"},{"n":59,"s":"这篇文章主要想告诉我们：","o":["学外语很难","年轻人才能学外语","学习没有年龄限制","旅行很重要"],"a":2,"why":"最后一句。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小李学汉字的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể chuyện Tiểu Lý học chữ Hán.","panels":[["😫","小李觉得汉字太难了，每天死记硬背，还是记不住。","<svg xmlns=\"http://www.w3 "1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-1\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-6 5 q6 8 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><g transform=\"translate(280.0,226.0) scale(0.6,0.6)\"><circle cx=\"-16\" cy=\"1\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"1\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"0\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -1 q-1 -19 17 -19 q18 0 17 19 q-4 -9 -10 -10 q-10 3 -24 10z\" fill=\"#2b2420\"/><circle cx=\"-5.5\" cy=\"-1\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-1\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-5 6 q5 5 10 0\" stroke=\"#3b2f2f\" stroke-width=\"1.7\" fill=\"none\" stroke-linecap=\"round\"/><ellipse cx=\"-10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><g fill=\"none\" stroke=\"#3b2f2f\" stroke-width=\"1.3\"><circle cx=\"-6\" cy=\"-1\" r=\"4.6\"/><circle cx=\"6\" cy=\"-1\" r=\"4.6\"/><path d=\"M-1.4 -1 h2.8\"/><\/g><\/g><g transform=\"translate(70.0,80.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><polygon points=\"0.0,-10.0 2.5,-3.4 9.5,-3.1 4.0,1.3 5.9,8.1 0.0,4.2 -5.9,8.1 -4.0,1.3 -9.5,-3.1 -2.5,-3.4\" fill=\"#f5b82e\"/><\/g><\/g><g transform=\"translate(250.0,70.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><polygon points=\"0.0,-10.0 2.5,-3.4 9.5,-3.1 4.0,1.3 5.9,8.1 0.0,4.2 -5.9,8.1 -4.0,1.3 -9.5,-3.1 -2.5,-3.4\" fill=\"#f5b82e\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: học vẹt khổ sở → tình cờ thấy web → học thú vị → đạt giải.","Có thể dùng: 死记硬背、偶然、演变、逻辑、克服、佩服."],"sample":"小李刚开始学汉语的时候，觉得汉字太难了。汉字的一笔一画好像没有任何逻辑，他每天死记硬背，可还是常常写了就忘，学得很痛苦。一次偶然的机会，他在网上发现了一个讲汉字来源的网站，上面有每个汉字演变的全部字形。从那以后，他每天都学几个汉字的故事，越学越有兴趣，汉字也记得越来越牢了。半年后，他参加了学校的汉字比赛，还得了第一名，同学们都很佩服他。","svn":"Tiểu Lý thấy chữ Hán khó, học vẹt vẫn quên; tình cờ thấy trang web giải thích nguồn gốc chữ; mỗi ngày học vài câu chuyện chữ, càng học càng thích; nửa năm sau đoạt giải nhất cuộc thi chữ Hán, bạn bè khâm phục."},"w72":{"prompt":"有人认为，在电脑和手机越来越普及的今天，学生已经没有必要练习手写汉字了。你同意这种看法吗？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người cho rằng ngày nay máy tính, điện thoại phổ biến, học sinh không cần luyện viết tay chữ Hán nữa. Bạn có đồng ý không? Viết bài không ít hơn 200 chữ.","min":200,"title":"手写汉字还有必要吗","tips":["Hiện tượng → quan điểm (vẫn cần) → lý do 1 (viết tay giúp nhớ chữ) → lý do 2 (thư pháp, văn hóa) → lý do 3 (thi cử, cuộc sống) → kết.","Dùng: 毫无疑问；不但……而且……；如果……就……；尽快"],"sample":"现在电脑和手机越来越普及，很多人打字多、写字少，于是有人认为学生已经没有必要练习手写汉字了。我不同意这种看法。\n首先，手写汉字能帮助我们记住汉字。打字的时候，我们只要会读就能找到这个字，可是时间长了，很多人提笔就忘字。只有经常写，才能真正记住每个字的笔画。\n其次，汉字不但是一种文字，而且是一门艺术。书法是中国传统文化的重要部分，练习写汉字可以让我们感受到汉字的美和中国文化的魅力。\n另外，在生活中，填表、签名、写贺卡等，还是需要手写。\n总之，电脑和手机虽然方便，但不能完全代替手写。学生还是应该坚持练习写汉字。","svn":"Nghị luận: không đồng ý → 首先 viết tay giúp nhớ chữ → 其次 chữ Hán là nghệ thuật (thư pháp) → 另外 cuộc sống vẫn cần viết tay → 总之 nên kiên trì luyện viết."}},"PRACTICE":{"ex1":{"bank":["收集","克服","追求","公开","佩服","抓紧"],"items":[["这点儿困难不算什么，我一定可以{}的。",["克服"]],["其实，林峰与刘医生的恋情，在医院里已经是{}的秘密了。",["公开"]],["我们是大学同学，那时候他就有了这个{}老报纸的爱好。",["收集"]],["你{}准备一下，争取下周把这个项目谈下来。",["抓紧"]],["她对工作认真负责的态度很让人{}。",["佩服"]],["爸爸平时常提醒我，生活上不要过于{}享受。",["追求"]]]},"ex2":[["买车的事我还没想好，你让我再____几天。",["思考","考虑"],1,"Cân nhắc để quyết định → 考虑; 思考 là suy ngẫm sâu về vấn đề."],["令人____的是，中国至今还没有自己的国花。",["遗憾","后悔"],0,"令人遗憾 = đáng tiếc; 后悔 là hối hận về việc mình đã làm."],["什么？小明受伤了，那____送医院呀！",["尽快","赶快"],1,"Tình huống khẩn cấp → 赶快."],["有文字学家指出，____的文字就是可以读出来的图画。",["最初","当初"],0,"最初的文字 = chữ viết thời kỳ đầu tiên; 当初 = hồi đó (trong quá khứ của một người/việc cụ thể)."]],"ex3":[],"ex3match":{"groups":[[["追求","梦想"],["公开","秘密"],["收集","雨水"],["完善","制度"]],[["提上","日程"],["符合","逻辑"],["受到","称赞"],["下载","资料"]]]},"ex4":[["理查德学汉字的经验","笔画、逻辑、死记硬背、偶然","理查德22岁爱上了中文，但他觉得汉字的笔画没有逻辑，只能死记硬背。一个偶然的机会，他发现了解汉字的来源和演变，学起来就容易了。"],["理查德的汉字网站","抓紧、尽快、资料、输入、公开、收集、克服、包含、开放、下载","得了心脏病以后，他决定抓紧时间尽快把《说文解字》电脑化。他用8年把资料输入电脑，2002年把网站公开。他克服种种困难，收集了近10万个汉字，网站包含繁体、简体和方言读音，全部开放给网友免费下载。"],["理查德现在的工作情况","单位、查询、物理、完善、追求、梦想、日程","很多单位请他工作，他选择去北师大，因为那里有人研究汉字识别查询。他除了教物理，还继续完善网站。他每天的日程很满，还要继续追求自己的梦想。"]],"ext":{"title":"扩展 · 话题：学科 / 电脑","words":[["哲学","zhéxué","triết học"],["化学","huàxué","hóa học"],["物理","wùlǐ","vật lý"],["政治","zhèngzhì","chính trị"],["粘贴","zhāntiē","dán (paste)"],["复制","fùzhì","sao chép (copy)"],["浏览","liúlǎn","xem lướt, duyệt"],["删除","shānchú","xóa"],["搜索","sōusuǒ","tìm kiếm"],["文件","wénjiàn","tệp, văn bản"]],"items":[["昨天我把电脑好好整理了一下，把没用的文件、照片都{}了。","删除"],["据调查，有70%的网民经常在网上{}信息、找资料。","搜索"],["老年人喜欢读报，而年轻人现在大都是在网上{}新闻了。","浏览"],["你把他们送来的广告设计方案{}一份到移动硬盘里。","复制"]]}},"TEXT":[{"title":"学汉字的困难","sub":"死记硬背与字源","paras":["1972年，22岁的理查德·希尔斯爱上了中文，但是他感觉汉字很复杂，汉字的一笔一画没有任何逻辑，只能死记硬背。一个偶然的机会，他发现如果了解汉字的来源和演变过程，再学习它就变得轻松、容易。但是他遗憾地发现，几乎没有一本英文书能充分解释汉字的字源。"],"idea":"Năm 1972, <b>Richard Sears<\/b> 22 tuổi yêu tiếng Trung nhưng thấy chữ Hán phức tạp, từng nét <b>chẳng có lô-gích<\/b>, chỉ có thể <b>học vẹt<\/b>. Một <b>dịp tình cờ<\/b>, ông phát hiện nếu hiểu <b>nguồn gốc và quá trình biến đổi<\/b> của chữ thì học dễ hơn hẳn. Nhưng <b>đáng tiếc<\/b> là hầu như không có cuốn sách tiếng Anh nào giải thích đầy đủ nguồn gốc chữ.","qs":[["理查德最初觉得汉字怎么样？",["很简单","很复杂，没有逻辑","很漂亮"],1],["他偶然发现了什么？",["了解汉字的来源和演变，学起来就容易了","汉字没有必要学","英文书能解释汉字"],0],["他为什么感到遗憾？",["没有人教他中文","几乎没有英文书能充分解释汉字的字源","他得了心脏病"],1]]},{"title":"汉字网站","sub":"心脏病 · 8年 · 公开","paras":["1994年，理查德得了心脏病，当时医生说他剩下的时间可能不多了。那时，他开始思考自己的人生，“我该怎么办？我该做什么？”“如果只能活24小时，我会打电话和朋友们说再见；如果我还能活一年，我要抓紧时间尽快把《说文解字》电脑化。”就这样，一部部古汉字经典进入他的资料库，仅仅复印、整理和把这些资料输入电脑就用了8年。2002年元旦，战胜疾病的他决定把自己创办的网站公开，让更多喜欢中文的人在学习汉字时，不再像他最初那样学得那么痛苦。"],"idea":"Năm 1994 ông bị <b>bệnh tim<\/b>, bác sĩ nói thời gian còn lại không nhiều. Ông bắt đầu <b>suy ngẫm<\/b> về cuộc đời: “Nếu còn sống một năm, tôi sẽ <b>tranh thủ<\/b> số hóa <b>《说文解字》 càng sớm càng tốt<\/b>.” Chỉ riêng việc photo, sắp xếp và <b>nhập<\/b> tài liệu vào máy đã mất <b>8 năm<\/b>. <b>Tết Dương lịch 2002<\/b>, chiến thắng bệnh tật, ông quyết định <b>công khai<\/b> trang web mình lập, để người học chữ Hán không còn <b>khổ sở<\/b> như ông <b>lúc đầu<\/b>.","qs":[["1994年发生了什么事？",["理查德得了心脏病","理查德来到中国","理查德创办了网站"],0],["理查德想在剩下的时间里做什么？",["和朋友们说再见","尽快把《说文解字》电脑化","回美国休息"],1],["他为什么要公开自己的网站？",["为了挣钱","让学汉字的人不再像他最初那样痛苦","因为医生要求"],1]]},{"title":"汉字叔叔","sub":"有图有真相","paras":["2011年，有人把他的故事放到微博上，引起了广泛关注，他也因此被网友亲切地称呼为“汉字叔叔”。","打开汉字叔叔克服种种困难、花光全部积蓄创办的网站，可以看到他收集整理的近10万个汉字，包含了它们演变的全部字形，当然也包括繁体字形和简体字形，还有普通话和部分方言读音、英文释义等内容，被网友称赞为“有图有真相”。更让人佩服的是，汉字叔叔将网站上的内容全部开放给网友免费下载。"],"idea":"Năm 2011 câu chuyện được đăng lên <b>Weibo<\/b>, ông được cư dân mạng thân mật <b>gọi<\/b> là “<b>汉字叔叔<\/b>”. Trang web ông <b>khắc phục<\/b> bao khó khăn, tiêu hết tiền tiết kiệm để lập có gần <b>10 vạn chữ Hán<\/b> ông <b>thu thập<\/b>: đủ các dạng chữ qua từng thời kỳ, <b>phồn thể và giản thể<\/b>, cách đọc phổ thông và <b>phương ngữ<\/b>, giải nghĩa tiếng Anh — được <b>khen<\/b> là “<b>có hình có sự thật<\/b>”. Đáng <b>khâm phục<\/b> hơn, ông <b>mở<\/b> toàn bộ cho mọi người <b>tải miễn phí<\/b>.","qs":[["网友为什么称他为“汉字叔叔”？",["因为他的故事被放到微博上，引起了广泛关注","因为他是中国人","因为他是语文老师"],0],["他的网站上没有提到哪项内容？",["繁体字形和简体字形","方言读音","汉字的价格"],2],["最让人佩服的是什么？",["网站很漂亮","网站内容全部免费下载","网站有10万个用户"],1]]},{"title":"汉字叔叔的梦想","sub":"活到老，学到老","paras":["现在，有很多单位向理查德发出了工作邀请，而理查德选择了去北京师范大学教书，因为那里也有人在做汉字识别查询的研究。在北师大，他除了教物理，还有充分的时间继续研究他的汉字，完善他的网站。","在中国，60多岁已经是退休的年纪了。但汉字叔叔每天的日程却安排得很满。他说：“我不会退休，我还要继续追求我的梦想，我要‘活到老，学到老’。”"],"idea":"Nhiều <b>đơn vị<\/b> mời ông làm việc, ông chọn dạy ở <b>ĐH Sư phạm Bắc Kinh<\/b> vì ở đó có người nghiên cứu <b>nhận dạng và tra cứu<\/b> chữ Hán. Ngoài dạy <b>vật lý<\/b>, ông còn thời gian nghiên cứu chữ và <b>hoàn thiện<\/b> trang web. Ở tuổi ngoài 60 — tuổi <b>nghỉ hưu<\/b> — <b>lịch<\/b> mỗi ngày của ông vẫn kín: “Tôi sẽ không nghỉ hưu, tôi còn <b>theo đuổi ước mơ<\/b>, <b>sống đến già, học đến già<\/b>.”","qs":[["理查德为什么选择去北京师范大学？",["那里工资最高","那里也有人在做汉字识别查询的研究","那里离家近"],1],["理查德在北师大教什么？",["汉语","物理","英语"],1],["“活到老，学到老”说明理查德：",["不想工作了","要一直学习，追求梦想","准备退休了"],1]]}],"TEXT_EXTRA":{"bg":"现在全世界学习汉语的人越来越多，学汉语的目的也多种多样，有的为了工作，有的为了求学，还有的只是出于兴趣，但有一点是共同的，那就是他们希望了解中国、走近中国。作家王蒙先生说得好，“多学一种语言，不仅是多打开一扇窗子，多一种获得知识的桥梁（qiáoliáng），而且是多一个世界，多一个头脑，多一重生命”。希望借助汉语的学习，可以开阔（kāikuò）你的眼界和思路，丰富你的知识和生活。","bg_vn":"Người học tiếng Trung trên thế giới ngày càng nhiều, mục đích đa dạng: vì công việc, du học hay chỉ vì thích — điểm chung là muốn hiểu và đến gần Trung Quốc. Nhà văn Vương Mông nói: “Học thêm một ngôn ngữ không chỉ là mở thêm một cánh cửa sổ, thêm một nhịp cầu tri thức, mà còn là thêm một thế giới, một bộ óc, một cuộc đời.”","bg_qs":[["学汉语的人有什么共同点？",["都是为了工作","都希望了解中国、走近中国","都是年轻人"],1],["王蒙认为多学一种语言就是：",["多一个世界，多一个头脑","多一份工作","多一次旅行"],0]]},"APPLY":{"theme":"学汉语","topic":"说说你学汉语的原因、困难和收获","topic_vn":"Nói về lý do học tiếng Trung, khó khăn đã gặp và điều thu hoạch được (1–1,5 phút): vì sao học → khó khăn → cách khắc phục → thay đổi, ước mơ.","qs":[["出于什么目的或原因，你做出了学汉语的决定？","Vì mục đích hay lý do gì bạn quyết định học tiếng Trung?","我学汉语一开始是出于兴趣。我很喜欢看中国电视剧，想听懂演员说的话。后来我发现会说汉语找工作也更容易，所以就决定认真学下去。",["出于兴趣","为了工作","为了留学","偶然的机会"]],["你在学习过程中遇到过什么困难？你是怎么克服的？","Trong quá trình học bạn gặp khó khăn gì? Khắc phục thế nào?","我觉得最难的是汉字。刚开始我只能死记硬背，常常记住了又忘了。后来我学习了汉字的来源，还每天写日记，慢慢地就克服了这个困难。",["汉字","声调","死记硬背","克服"]],["学汉语给你的生活带来了哪些改变？从中你得到了哪些收获？","Học tiếng Trung đem lại thay đổi gì? Bạn thu hoạch được gì?","学汉语以后，我交了很多中国朋友，也更了解中国文化了。现在我在一家中国公司工作，我的梦想是以后当一名翻译。",["收获","朋友","文化","梦想"]]],"vocab":[["出于","chūyú","xuất phát từ"],["兴趣","xìngqù","hứng thú"],["声调","shēngdiào","thanh điệu"],["笔画","bǐhuà","nét chữ"],["收获","shōuhuò","thu hoạch"],["坚持","jiānchí","kiên trì"],["翻译","fānyì","phiên dịch"],["留学","liúxué","du học"],["眼界","yǎnjiè","tầm mắt"],["活到老，学到老","huó dào lǎo, xué dào lǎo","sống đến già, học đến già"]],"build_title":"选一个方向，拼出你的“学汉语”","build_lead":"Chọn hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 原因","② 困难","③ 怎么克服","④ 收获 · 梦想"],"build":{"A · 出于兴趣":[["我学汉语是出于兴趣，一个偶然的机会，我看了一部中国电视剧，就爱上了中文。","我从小就喜欢中国文化，所以上大学时选择了汉语专业。"],["但是我很快发现，汉字很复杂，一笔一画好像没有任何逻辑。","最初，我觉得声调特别难，常常把“买”说成“卖”。"],["后来我了解了汉字的来源和演变，再学习就变得轻松、容易多了。","我每天抓紧时间听中文歌、跟读课文，慢慢地克服了这个困难。"],["现在我能看懂没有字幕的电视剧了，我还要继续追求我的梦想，“活到老，学到老”。","学汉语让我多打开了一扇窗子，看到了一个新的世界。"]],"B · 为了工作":[["我学汉语是为了工作，我们公司和中国的合作越来越多。","毕业以后，我在一家中国公司工作，所以必须学好汉语。"],["我每天工作很忙，日程安排得很满，学习时间很少。","刚开始，我听不懂同事说的话，开会的时候常常很着急。"],["所以我每天早上抓紧时间学一个小时，周末还去上汉语课。","我请中国同事帮我，有不懂的地方就尽快问清楚。"],["现在我可以用汉语和客户谈业务了，同事们都很佩服我。","我的梦想是以后能去中国工作，当一名真正的“中国通”。"]],"C · 汉字叔叔给我的启发":[["我学汉语已经两年了，最初是为了去中国留学。","学了《汉字叔叔》这篇课文以后，我想起了自己学汉语的经历。"],["最初我也跟理查德一样，觉得汉字只能死记硬背，学得很痛苦。","我最大的困难是汉字，常常记住了又忘了。"],["后来我在网上收集了很多汉字演变的图片，了解了字源以后就容易记了。","我开始每天写汉字日记，遇到不会的字就上网查询。"],["汉字叔叔60多岁还在追求梦想，我也要“活到老，学到老”。","如果有机会，我也想像汉字叔叔一样，为学汉语的人做点儿事情。"]]},"patterns":[["① 原因","我学汉语是出于……","Tôi học tiếng Trung xuất phát từ…"],["① 原因","一个偶然的机会，我……","Một dịp tình cờ, tôi…"],["② 困难","最初，我觉得……特别难。","Lúc đầu tôi thấy… đặc biệt khó."],["③ 克服","后来我……，慢慢地克服了这个困难。","Sau đó tôi…, dần dần khắc phục được khó khăn này."],["④ 收获","学汉语给我的生活带来了……","Học tiếng Trung đem lại cho cuộc sống của tôi…"],["④ 梦想","我还要继续追求我的梦想，……","Tôi còn tiếp tục theo đuổi ước mơ…"]],"legend":["① Lý do","② Khó khăn","③ Khắc phục","④ Thu hoạch · ước mơ"],"w5":["逻辑","死记硬背","偶然","遗憾","思考","抓紧","尽快","公开","最初","痛苦","克服","收集","称赞","佩服","完善","日程","追求","梦想","查询","演变"],"samples":[{"who":"出于兴趣","meta":"Bài nói ~1 phút","p":["我学汉语是出于兴趣，一个偶然的机会，我看了一部中国电视剧，就爱上了中文。","但是我很快发现，汉字很复杂，一笔一画好像没有任何逻辑。","后来我了解了汉字的来源和演变，再学习就变得轻松、容易多了。","现在我能看懂没有字幕的电视剧了，我还要继续追求我的梦想，“活到老，学到老”。"],"good":["一个偶然的机会","我还要继续追求我的梦想，“活到老，学到老”"],"vi":"Tôi học tiếng Trung vì thích: một dịp tình cờ xem phim Trung Quốc rồi mê luôn. Nhưng tôi nhanh chóng thấy chữ Hán phức tạp, từng nét như chẳng có lô-gích. Sau khi tìm hiểu nguồn gốc và sự biến đổi của chữ, học dễ hơn nhiều. Giờ tôi xem phim không cần phụ đề, tôi còn theo đuổi ước mơ — sống đến già, học đến già."},{"who":"为了工作","meta":"Bài nói ~1 phút","p":["我学汉语是为了工作，我们公司和中国的合作越来越多。","刚开始，我听不懂同事说的话，开会的时候常常很着急。","所以我每天早上抓紧时间学一个小时，周末还去上汉语课，有不懂的地方就尽快问清楚。","现在我可以用汉语和客户谈业务了，同事们都很佩服我。"],"good":[],"vi":"Tôi học tiếng Trung vì công việc, công ty hợp tác với Trung Quốc ngày càng nhiều. Ban đầu tôi không nghe hiểu đồng nghiệp, họp hành rất sốt ruột. Vì vậy sáng nào tôi cũng tranh thủ học một tiếng, cuối tuần đi học thêm, chỗ nào không hiểu là hỏi ngay. Giờ tôi bàn công việc với khách bằng tiếng Trung được rồi, đồng nghiệp đều khâm phục."}]},"WRITE":{"topic":"我为什么学汉语","topic_vn":"Viết bài với đầu đề “Vì sao tôi học tiếng Trung”, nói suy nghĩ và trải nghiệm của bạn. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","原因","Mở bài: vì sao học (hứng thú / công việc / du học…).","我学汉语是出于……"],["②","经历 · 困难","Một khó khăn cụ thể khi học.","最初，我觉得……"],["③","克服","<b>Trọng tâm.<\/b> Bạn đã làm gì để vượt qua.","后来我……，慢慢地克服了……"],["④","收获 · 梦想","Kết: thay đổi, ước mơ.","我还要继续追求我的梦想……"]],"samples":[{"who":"范文 1 · 出于兴趣","title":"我为什么学汉语","p":["我学汉语是出于兴趣。一个偶然的机会，我看了一部中国电视剧，就爱上了中文。最初，我觉得汉字很复杂，只能死记硬背。后来我了解了汉字的来源，学习就变得容易多了。现在，我还要继续追求我的梦想。"],"vi":"Khoảng 90 chữ: lý do → khó khăn (死记硬背) → khắc phục → ước mơ."},{"who":"范文 2 · 为了工作","title":"我为什么学汉语","p":["我学汉语是为了工作。我们公司和中国的合作越来越多，可是我刚开始连同事的话都听不懂。于是，我每天抓紧时间学习，有不懂的地方就尽快问清楚。现在我能用汉语谈业务了，同事们都很佩服我。"],"vi":"Khoảng 90 chữ: dùng 抓紧、尽快、佩服."},{"who":"范文 3 · 课本命题写作","title":"我为什么学汉语","p":["三年前，一个偶然的机会，我在网上看到了一部中国电影，从那以后我就爱上了中文。出于兴趣，我决定学习汉语。","最初，我觉得汉字很复杂，一笔一画好像没有任何逻辑，只能死记硬背，学得很痛苦。后来我在网上收集了很多汉字演变的资料，发现如果了解汉字的来源，再学习它就变得轻松、容易多了。","现在，我不但能看懂中国电影，还交了很多中国朋友。学汉语让我多打开了一扇窗子，看到了一个更大的世界。","我不会放弃学汉语，我还要继续追求我的梦想，我要“活到老，学到老”。"],"good":["一个偶然的机会","发现如果了解汉字的来源，再学习它就变得轻松、容易多了","我还要继续追求我的梦想，我要“活到老，学到老”"],"vi":"Khoảng 180 chữ. Ba chỗ gạch chân dùng lại khung 好句 của bài khóa: 一个偶然的机会 · 如果……，再……就变得…… · 我还要继续追求……，活到老，学到老."}],"tpl":"我为什么学汉语\n我学汉语是出于【原因】。最初，我觉得【困难】。后来我【怎么做】，慢慢地克服了这个困难。现在，【收获】。我还要继续追求我的梦想，【……】。","chk":[["topic","Bám đề: có nói 学汉语 / 中文","汉语|中文"],["why","Có lý do (因为 · 为了 · 出于 · 兴趣)","因为|为了|出于|兴趣"],["hard","Có khó khăn và cách khắc phục (困难 · 克服 · 最初 · 后来)","困难|克服|最初|后来"],["end","Có thu hoạch / ước mơ (梦想 · 现在 · 收获)","梦想|现在|收获|希望"]],"w5":["逻辑","死记硬背","偶然","遗憾","思考","抓紧","尽快","公开","最初","痛苦","克服","收集","称赞","佩服","完善","日程","追求","梦想","查询","演变"],"wmin":100,"wmax":200,"traps":"<b>Bắt buộc có:<\/b> lý do học, một khó khăn cụ thể, cách khắc phục, thu hoạch hoặc ước mơ. Mượn ít nhất một khung 好句 — xem 范文 3.","hw_note":"Đọc xong phần 背景, quay lại mục 4 để viết bài “我为什么学汉语”."}};</script>
