<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 24 · 支教行动 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

着我们操心。","毕业后我希望回去建设我的国家。","Tốt nghiệp xong tôi mong được về xây dựng đất nước mình.",["建设家乡","经济建设"],""],["操心","cāo xīn","动","bận tâm, lo nghĩ",1,"费心考虑和料理。","学生们说：“以前，我们总认为建设家乡是大人的事，用不着我们操心。","父母为我们操心了一辈子，现在该享福了。","Bố mẹ đã lo lắng cho chúng ta cả đời, giờ nên được hưởng phúc rồi.",["别操心","操了一辈子心"],"离合词：别瞎操心了、操了很多心。"],["承担","chéngdān","动","gánh vác, đảm nhận",1,"担负；担当。","不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","这次活动的费用将由学校统一承担。","Chi phí hoạt động lần này sẽ do nhà trường thống nhất chi trả.",["承担责任","承担义务"],""],["义务","yìwù","名／形","nghĩa vụ; không thù lao",1,"在法律上或道德上应负的责任；不要报酬的。","不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","参与社会事务和促进社会进步是每个人的权利，也是每个人的义务和责任。","Tham gia công việc xã hội và thúc đẩy xã hội tiến bộ là quyền lợi, cũng là nghĩa vụ và trách nhiệm của mỗi người.",["承担义务","义务劳动","义务教育"],"见“注释”：义务。"],["艰巨","jiānjù","形","gian khổ, nặng nề",1,"（任务等）困难而繁重。","这个任务很艰巨，我们要尽自己最大的力量。”","这个任务很艰巨，我们要尽自己最大的力量。","Nhiệm vụ này rất nặng nề, chúng ta phải dốc hết sức mình.",["艰巨的任务"],""],["力量","lìliàng","名","lực lượng, sức mạnh, sức lực",1,"力气；能力；作用，效力。","这个任务很艰巨，我们要尽自己最大的力量。”","表面上弱小的人，很可能拥有你想象不到的巨大力量。","Người bề ngoài yếu ớt rất có thể sở hữu sức mạnh to lớn bạn không ngờ tới.",["尽最大的力量"],"“力量” nói chung về sức mạnh, năng lực; “精力” là tinh thần và sức lực của con người. (练习 2)"],["收获","shōuhuò","名／动","thu hoạch, thành quả",1,"比喻心得、成果等；取得成熟的农作物。","郝琳硕觉得自己的收获远多于给孩子们的。","这次旅行我的收获很大。","Chuyến đi lần này tôi thu hoạch được rất nhiều.",["收获很大","意外的收获"],""],["云南","Yúnnán","专名","Vân Nam (một tỉnh của Trung Quốc)",0,"中国西南部的一个省。","来云南支教一年多，郝琳硕老师自己也记不清有多少次家访了。",null,null,[],""],["郝琳硕","Hǎo Línshuò","专名","Hách Lâm Thạc (tên người)",0,"人名。","来云南支教一年多，郝琳硕老师自己也记不清有多少次家访了。",null,null,[],""],["赵福根","Zhào Fúgēn","专名","Triệu Phúc Căn (tên người)",0,"人名。","刚到时，一位叫赵福根的男生引起了她的注意。",null,null,[],""]],"WARM":[{"tab":"看图找生词","title":"看图片，找出跟它们有关的生词","type":"reveal","lead":"Sách dùng 2 bức ảnh; ở đây thay bằng mô tả. Đoán từ mới tương ứng, rồi bấm để xem đáp án.","items":[["🏆 (1) 一个女孩儿举着奖杯，旁边的人都在为她拍手","冠军 guànjūn","quán quân"],["👏 (1) 大家一起拍手表示祝贺","鼓掌 gǔ zhǎng","vỗ tay"],["🙋 (2) 教室里，一个学生举手要说话","发言 fā yán","phát biểu"],["👩‍🏫 (2) 年轻的老师在山区学校上课","支教 zhī jiào","dạy học tình nguyện"]],"note":"<span class='zh'>“支教”是指到经济不太发达的地区去支援那里的教育工作。<\/span>"},{"tab":"说说志愿者","title":"你对志愿者有什么看法？","type":"discuss","q":"中国有这样一些志愿者，他们会去经济不太发达的地区或农村的学校当老师，帮助那里的孩子学习。你听说过没有？你对志愿者有什么看法？","vn":"Ở Trung Quốc có những tình nguyện viên đến vùng kinh tế kém phát triển hoặc trường nông thôn làm giáo viên, giúp trẻ em học tập. Bạn đã nghe nói chưa? Bạn nghĩ gì về họ?","answer_zh":"我听说过。我觉得这些志愿者很了不起。他们离开城市，到条件很艰苦的地方去教书，不但帮助孩子们学习知识，还给了他们勇气和希望。如果有机会，我也想去做志愿者。","answer_vn":"Từ hữu ích: 志愿者 (tình nguyện viên), 了不起 (giỏi, đáng nể), 艰苦 (gian khổ), 农村 (nông thôn), 勇气 (dũng khí), 希望 (hy vọng)."}],"GAME":{"fill":[["他上课从不{}，很多课不及格……","发言",["发言","发表","发现","发展"]],["平时也几乎不和同学{}。","交往",["交往","交换","往来","来往"]],["还得帮着妈妈做家务，是个{}孝顺的孩子。","体贴",["体贴","体会","体育","体验"]],["之后，赵福根学习{}了，成绩也逐渐进步。","用功",["用功","成功","功夫","有用"]],["我永远都忘不了那{}的掌声……","热烈",["热烈","热情","热闹","激烈"]],["我感觉在学校也有人爱我了，我开始有{}……","勇气",["勇气","勇敢","力气","生气"]],["山里的青壮年都出去{}世界……","闯",["闯","看","走","过"]],["她和其他志愿者{}午休、周末等空闲时间……","利用",["利用","使用","作用","应用"]],["我们也要{}这个义务。","承担",["承担","担心","负担","承认"]],["这个任务很{}，我们要尽自己最大的力量。","艰巨",["艰巨","巨大","艰苦","困难"]]],"order":[["他上课|从不发言"],["我觉得|这是|个机会！"],["之后，|赵福根|学习用功了"],["我开始|有勇气……"],["建设家乡，|人人有责"],["因为他们是|国家的|未来与希望。"]]},"GOOD":[{"zh":"我永远都忘不了那热烈的掌声和同学们送我的糖","vn":"em mãi mãi không quên được tràng vỗ tay nhiệt liệt và những viên kẹo các bạn tặng","why":"Bày tỏ kỷ niệm sâu sắc: <b>我永远都忘不了……<\/b> + chi tiết cụ thể (âm thanh, hương vị) — làm bài văn kể chuyện sinh động.","frame":"我永远都忘不了……","apply":"我永远都忘不了第一次站在台上演讲时同学们的笑脸。","apply_vn":"Tôi mãi không quên gương mặt tươi cười của các bạn khi lần đầu tôi đứng lên bục diễn thuyết."},{"zh":"以前，我们总认为建设家乡是大人的事，用不着我们操心","vn":"trước đây chúng em luôn cho rằng xây dựng quê hương là việc của người lớn, không cần chúng em bận tâm","why":"Đối lập quá khứ — hiện tại: <b>以前，我们总认为……，不过，现在我们明白了……<\/b> — kể sự thay đổi nhận thức.","frame":"以前，我们总认为……，不过，现在我们明白了，……","apply":"以前，我总认为学习是为了父母，不过，现在我明白了，学习是为了自己的未来。","apply_vn":"Trước đây tôi luôn nghĩ học là vì bố mẹ, nhưng giờ tôi hiểu học là vì tương lai của chính mình."},{"zh":"不管以后在哪儿，我都会继续用我的力量影响山里的孩子们","vn":"dù sau này ở đâu, tôi vẫn sẽ tiếp tục dùng sức mình để ảnh hưởng tới trẻ em vùng núi","why":"Lời hứa / quyết tâm: <b>不管……，我都会继续……<\/b> — dùng làm câu kết.","frame":"不管……，我都会继续……","apply":"不管工作多忙，我都会继续学习汉语。","apply_vn":"Dù công việc bận đến đâu, tôi vẫn sẽ tiếp tục học tiếng Trung."}],"GRAMMAR":[{"word":"行动","py":"xíngdòng","pos":"动词／名词","forms":["动词：行走、活动身体（行动不便）","动词：为了某种目的而进行活动（提前行动）","名词：活动、行为（支教行动、采取行动）"],"vn":"<b>行动<\/b>: ① động từ — <b>đi lại, cử động<\/b> (行动不便: đi lại bất tiện); ② động từ — <b>hành động<\/b> nhằm một mục đích (提前行动); ③ danh từ — <b>hoạt động, hành vi<\/b> (支教行动, 采取行动).","text":"郝老师到云南参加支教行动","ex":[["他运动时受伤了，行动不便。","Anh ấy bị thương khi chơi thể thao, đi lại bất tiện."],["做什么事他都喜欢提前行动，早做准备。","Làm gì anh ấy cũng thích hành động sớm, chuẩn bị trước."],["我们应该勇敢面对困难，迅速采取行动，主动承担责任。","Chúng ta nên dũng cảm đối mặt khó khăn, nhanh chóng hành động, chủ động gánh trách nhiệm."]],"book_title":"练一练：完成句子或对话（行动）","book":[["A：小赵呢？他今天怎么没来上班？<br>B：______________。","","他昨天打球的时候脚受伤了，行动不便，请假了"],["A：好久不见了，你最近在忙什么呢？<br>B：______________。","","我参加了一个保护环境的行动，每个周末都去河边捡垃圾"],["______________，避免不必要的浪费。","","我们应该早点儿行动起来，节约用水，避免不必要的浪费"]],"drill":[["“支教行动”中的“行动”是：",["名词，表示活动","动词，表示走路"],0,"支教行动 = hoạt động dạy học tình nguyện (danh từ)."],["选择：他腿受伤了，____不方便。",["行动","运动"],0,"行动不便 = đi lại bất tiện."]]},{"word":"义务","py":"yìwù","pos":"名词／形容词","forms":["名词：法律上或道德上应负的责任（承担义务、有义务……）","形容词：不收报酬的（义务劳动、义务教育）"],"vn":"<b>义务<\/b>: ① danh từ — <b>nghĩa vụ<\/b>, trách nhiệm phải gánh về pháp luật hoặc đạo đức: 承担义务, 有义务…; ② tính từ — <b>không lấy thù lao, tự nguyện<\/b>: 义务劳动 (lao động tình nguyện), 义务教育 (giáo dục bắt buộc miễn phí).","text":"不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。","ex":[["参与社会事务和促进社会进步是每个人的权利，也是每个人的义务和责任。","Tham gia công việc xã hội, thúc đẩy xã hội tiến bộ là quyền và cũng là nghĩa vụ, trách nhiệm của mỗi người."],["我们每个学期都要至少参加三次义务劳动。","Mỗi học kỳ chúng tôi phải tham gia ít nhất ba lần lao động tình nguyện."],["中国有关于九年制义务教育的法律。","Trung Quốc có luật về giáo dục bắt buộc 9 năm."]],"book_title":"练一练：完成句子或对话（义务）","book":[["A：父母对子女有哪些义务？<br>B：______________。","","父母有义务照顾子女的生活，让他们接受教育"],["学校有义务______________。","","学校有义务保护学生的安全"],["A：______________？（义务—形容词）<br>B：对，今天来参加演出的演员都不要钱。","","今天的演出是义务演出吗"]],"drill":[["“义务劳动”中的“义务”表示：",["不收报酬的","法律上的责任"],0,"Tính từ: không lấy thù lao."],["选择：保护环境是每个人的____。",["义务","任务"],0,"Trách nhiệm đạo đức chung → 义务."]]}],"HSK":{"r1":[{"text":["小王大学毕业后，没有留在大城市，而是去了西部的一个小山村支教。刚去的时候，{36}，连电脑都没有。孩子们很害羞，上课{37}。小王就利用空闲时间带他们唱歌、做游戏。慢慢地，孩子们变得开朗了，{38}。"],"qs":[{"n":36,"o":["老师特别多","孩子们都很有钱","学校的条件很差","学校非常漂亮"],"a":2,"why":"后面说“连电脑都没有”，说明条件差。"},{"n":37,"o":["几乎不发言","常常打架","喜欢唱歌","总是抢着回答"],"a":0,"why":"“害羞”的孩子上课不发言。"},{"n":38,"o":["不想上学了","开始讨厌小王","成绩也逐渐进步了","都去城市打工了"],"a":2,"why":"变化是积极的，与前文一致。"}]},{"text":["现在，很多农村的青壮年都去城市打工了，{39}。这些留守儿童一年只能见父母一两次，{40}。为了帮助他们，很多大学生利用假期去农村当志愿者，{41}。志愿者们说，{42}，因为孩子们的笑容让他们明白了自己的价值。"],"qs":[{"n":39,"o":["孩子们都跟着去了城市","孩子们只能和老人留在家里","老人们也去打工了","村子里的人越来越多"],"a":1,"why":"“这些留守儿童”承上。"},{"n":40,"o":["每天都很快乐","生活特别热闹","不需要照顾","很缺少父母的关心"],"a":3,"why":"见不到父母 → 缺少关心。"},{"n":41,"o":["去城市旅游","给孩子们辅导功课","找工作挣钱","在农村买房子"],"a":1,"why":"志愿者去农村的目的。"},{"n":42,"o":["孩子们不需要帮助","自己的收获比付出的还多","这个工作没有意义","他们再也不想去了"],"a":1,"why":"后文“明白了自己的价值”说明收获很大。"}]}],"r2":[{"start":46,"paras":["后来，老师鼓励他参加学校的舞蹈比赛，每周带他去排练。","小明以前上课从不发言，也不爱和同学交往。","比赛那天，他跳得非常好，得了冠军，同学们热烈地鼓起掌来。","老师去他家家访，才知道他特别喜欢跳舞。","从那以后，小明有了勇气，学习也越来越用功了。"],"ans":["B","D","A","C","E"],"why":"以前的情况（B）→ 家访知道喜欢跳舞（D）→ 鼓励参加比赛（A）→ 比赛得冠军（C）→ 从那以后（E）。"}],"r3":[{"text":["“美丽中国”是一个教育公益组织，它每年都会招募一批优秀的大学毕业生，送他们到中国农村地区的学校教书两年。","这些年轻人大多毕业于名牌大学，他们本来可以在大城市找到很好的工作。可是，他们选择了去条件艰苦的山区。他们说：<u><b>“比起我们给孩子们的，孩子们给我们的更多。”<\/b><\/u>","在两年的时间里，志愿者们不但给孩子们上课，还组织各种活动，比如读书会、艺术节、研究型学习等，帮助孩子们打开眼界，找到自信。","两年结束以后，有的志愿者继续留在农村工作，有的进入了公司或政府部门。但不管在哪儿，他们都会继续关心农村的教育。"],"qs":[{"n":56,"s":"“美丽中国”的志愿者要去农村教书多长时间？","o":["半年","一年","两年","四年"],"a":2,"why":"第一段：教书两年。"},{"n":57,"s":"画线句子的意思是：","o":["志愿者的收获很大","孩子们给志愿者很多钱","志愿者不喜欢孩子","孩子们什么都不需要"],"a":0,"why":"孩子们给志愿者的更多，指志愿者收获大。"},{"n":58,"s":"志愿者们组织活动是为了：","o":["让孩子打开眼界，找到自信","让孩子去城市","挣更多的钱","让家长满意"],"a":0,"why":"第三段。"},{"n":59,"s":"两年结束以后，志愿者们：","o":["都留在了农村","都不再关心农村教育","不管在哪儿都会继续关心农村教育","都进入了政府部门"],"a":2,"why":"最后一段。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出发生在一位支教老师和学生之间的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể câu chuyện giữa một cô giáo tình nguyện và học sinh.","panels":[["🏫","一位年轻的老师来到山区学校支教，发现一个男孩儿上课从不发言。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><rect width=\"320\" height=\"240\" fill=\"#f4f1e8\"/><rect y=\"185\" width=\"320\" height=\"55\" fill=\"#d9cbb3\"/><path d=\"M0 185 H320\" stroke=\"#d2b48c\" stroke-width=\"2\"/><g transform=\"translate(150.0,22.0)\"><rect width=\"150\" height=\"70\" rx=\"3\" fill=\"#2f5d50\" stroke=\"#a7784c\" stroke-width=\"5\"/><\/g><text x=\"225\" y=\"57\" font-size=\"16\" font-weight=\"500\" fill=\"#fff\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"'Noto Sans SC','PingFang SC',sans-serif\">你们好！<\/text><g transform=\"translate(95.0,214.0)\"><path d=\"M-7 -62 L-8 -4 M7 -62 L8 -4\" stroke=\"#4a5060\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M-14 -2 h10 M5 -2 h10\" stroke=\"#2d2626\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#3c8a4a\"/><path d=\"M-14 -106 L-22 -66\" stroke=\"#3c8a4a\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-22\" cy=\"-66\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M14 -106 L32 -110 L32 -140\" stroke=\"#3c8a4a\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"32\" cy=\"-140\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M-18 -132 q0 -20 18 -20 q18 0 18 20 l2 26 "#3b2f2f\" stroke-width=\"1.7\" fill=\"none\" stroke-linecap=\"round\"/><ellipse cx=\"-10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><\/g><g transform=\"translate(230.0,80.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><path d=\"M0 6 q-14 -10 -10 -18 q4 -6 10 0 q6 -6 10 0 q4 8 -10 18z\" fill=\"#e5534b\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: phát hiện cậu bé im lặng → thăm nhà, biết sở thích → biểu diễn, được vỗ tay → tiến bộ, đọc bài văn.","Có thể dùng: 支教、发言、家访、体贴、冠军、鼓掌、勇气、用功、朗读."],"sample":"李老师大学毕业后，来到一个山区学校支教。她发现班上有个男孩儿叫小明，上课从不发言，也不爱和同学交往。李老师去小明家家访，才知道他爸爸去世了，家里很困难，但他是个体贴的孩子，而且特别喜欢跳舞。于是，李老师鼓励他参加学校的艺术节。表演那天，小明跳了一个蝴蝶舞，同学们热烈地鼓起掌来。从那以后，小明有了勇气，学习也越来越用功。后来，他在班上朗读了自己写的作文，题目是《那天的掌声》。","svn":"Cô giáo trẻ dạy tình nguyện ở vùng núi thấy một cậu bé không bao giờ phát biểu; đến thăm nhà mới biết nhà khó khăn nhưng cậu thích nhảy; cô khuyến khích cậu biểu diễn, cả trường vỗ tay; từ đó cậu tự tin, chăm học, đọc bài văn trước lớp."},"w72":{"prompt":"很多年轻人愿意去农村或山区当志愿者。你觉得年轻人做志愿者有什么意义？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Nhiều người trẻ sẵn lòng làm tình nguyện viên ở nông thôn, vùng núi. Theo bạn làm tình nguyện viên có ý nghĩa gì với người trẻ? Viết bài không ít hơn 200 chữ.","min":200,"title":"做志愿者的意义","tips":["Mở bài: hiện tượng → 首先 giúp đỡ người khác (trẻ em vùng núi) → 其次 bản thân trưởng thành, thu hoạch nhiều → 另外 trách nhiệm với xã hội → 总之.","Dùng: 收获远多于……；建设家乡，人人有责；不管……都……；承担义务."],"sample":"现在，越来越多的年轻人愿意去农村或山区当志愿者。我认为，做志愿者有很大的意义。\n首先，志愿者可以帮助需要帮助的人。在很多山区，学校的条件很差，老师也不够。志愿者去那里教书，能让孩子们学到更多的知识，也让他们感受到关心和爱。\n其次，做志愿者对年轻人自己也有很大的帮助。在艰苦的环境里，他们学会了承担责任，变得更加成熟。就像课文里的郝老师说的，自己的收获远多于给孩子们的。\n另外，建设国家，人人有责。年轻人是国家的未来，承担一些社会义务是应该的。\n总之，做志愿者既能帮助别人，又能让自己成长。我希望将来也有机会去做志愿者。","svn":"Nghị luận: có ý nghĩa lớn → 首先 giúp người cần giúp → 其次 bản thân trưởng thành, thu hoạch nhiều hơn cho đi → 另外 trách nhiệm xã hội → 总之 vừa giúp người vừa giúp mình."}},"PRACTICE":{"ex1":{"bank":["闯","操心","承担","勇气","建设","温柔"],"items":[["别怕困难，鼓起{}，你一定能成功！",["勇气"]],["大家都很羡慕他有个{}体贴的妻子。",["温柔"]],["昨天开车时精力不集中，{}了红灯。",["闯"]],["父母为我们{}了一辈子，现在该享福了。",["操心"]],["毕业后我希望回去{}我的国家。",["建设"]],["这次活动的费用将由学校统一{}。",["承担"]]]},"ex2":[["该准备的我们都已经准备了，你这么做完全是____的。",["多余","过分"],0,"Không cần thiết, thừa → 多余; 过分 là quá đáng."],["表面上弱小的人，很可能拥有你想象不到的巨大____。",["精力","力量"],1,"巨大的力量 = sức mạnh to lớn; 精力 là sức lực tinh thần của người."],["心理学家发现，性格____的人的生活比其他人更丰富。",["热烈","热情"],1,"Tính cách → 热情; 热烈 dùng cho không khí, tiếng vỗ tay."],["我觉得他这并不是对你好，只是____你。",["用","利用"],1,"利用 + người = lợi dụng (nghĩa xấu)."]],"ex3":[["我都已经<u>A<\/u>安排<u>B<\/u>好了，你别<u>C<\/u>瞎<u>D<\/u>了！","操心",3,"我都已经安排好了，你别瞎操心了！"],["看了她的舞蹈，大家都<u>A<\/u>鼓<u>B<\/u>起<u>C<\/u>来<u>D<\/u>。","掌",2,"看了她的舞蹈，大家都鼓起掌来。"],["<u>A<\/u>他<u>B<\/u>下班后的<u>C<\/u>时间参加<u>D<\/u>专业培训。","利用",1,"他利用下班后的时间参加专业培训。"],["我会<u>A<\/u>最大的<u>B<\/u>力量<u>C<\/u>来<u>D<\/u>帮助你。","尽",0,"我会尽最大的力量来帮助你。"]],"ex4":[["赵福根的故事","发言、及格、家务、冠军、鼓掌、进步、题目","赵福根上课从不发言，很多课不及格。他家里很穷，还得帮妈妈做家务。郝老师鼓励他表演，他的蝴蝶舞得了冠军，同学们鼓起掌来。之后他学习用功，成绩逐渐进步，题目为《那天的舞蹈和掌声》的作文得了最高分。"],["研究型学习活动","闯、主题、采访、利用、操心、义务","山里的青壮年都出去闯世界了。郝老师组织了研究型学习活动，主题是“让家乡的明天更美好”，学生们采访老人、小组讨论。老师们利用空闲时间指导学生。学生们明白了建设家乡不只是大人操心的事，他们也要承担这个义务。"],["郝老师的想法","收获、力量","郝老师觉得自己的收获远多于给孩子们的，她会继续用自己的力量影响山里的孩子们，因为他们是国家的未来与希望。"]],"ext":{"title":"扩展 · 话题：教学 2","words":[["测验","cèyàn","kiểm tra"],["实验","shíyàn","thí nghiệm"],["抄","chāo","chép"],["试卷","shìjuàn","bài thi"],["夏令营","xiàlìngyíng","trại hè"],["操场","cāochǎng","sân trường"],["用功","yònggōng","chăm chỉ"],["辅导","fǔdǎo","phụ đạo, kèm"],["收获","shōuhuò","thu hoạch"],["铃","líng","chuông"],["退步","tuìbù","thụt lùi"],["改正","gǎizhèng","sửa chữa"]],"items":[["暑假时很多中小学生去外地或外国参加{}，又可以旅游又可以交朋友。","夏令营"],["这是上次考试的{}，请大家认真看一看错在哪儿。","试卷"],["我想请一个家教，下课后{}我学习汉语。","辅导"],["预习生词时，我会把不认识的字{}三遍。","抄"]]}},"TEXT":[{"title":"家访","sub":"一个不爱说话的男孩儿","paras":["来云南支教一年多，郝琳硕老师自己也记不清有多少次家访了。刚到时，一位叫赵福根的男生引起了她的注意。他上课从不发言，很多课不及格，平时也几乎不和同学交往。","郝老师家访后得知，赵福根的父亲去世了，姐姐在外打工，他家里很穷，还得帮着妈妈做家务，是个体贴孝顺的孩子。“和他妈妈聊天才知道他很喜欢跳舞，”郝老师说，“我觉得这是个机会！”她鼓励福根在学校艺术节上表演，每周二带着他一起去找音乐老师排练。表演时，福根的蝴蝶舞得了舞蹈组的冠军，台下的同学们鼓起掌来，齐声地喊着“福根”的名字……"],"idea":"Đến <b>Vân Nam<\/b> <b>dạy học tình nguyện<\/b> hơn một năm, cô Hách Lâm Thạc không nhớ nổi đã bao nhiêu lần <b>đến thăm nhà<\/b> học sinh. Cậu bé Triệu Phúc Căn gây chú ý: không bao giờ <b>phát biểu<\/b>, nhiều môn <b>không đạt<\/b>, hầu như không <b>giao du<\/b> với bạn. Đến nhà mới biết: bố mất, chị đi làm xa, nhà nghèo, cậu phải giúp mẹ làm <b>việc nhà<\/b> — một đứa trẻ <b>chu đáo<\/b>, hiếu thảo, và rất thích nhảy. Cô khuyến khích cậu biểu diễn ở hội diễn văn nghệ, mỗi thứ Ba dẫn cậu đi <b>tập<\/b>. Điệu múa <b>bươm bướm<\/b> giành <b>giải nhất<\/b> nhóm <b>múa<\/b>, cả trường <b>vỗ tay<\/b> gọi tên “Phúc Căn”.","qs":[["赵福根刚开始是一个什么样的学生？",["上课常常发言","从不发言，很多课不及格","成绩是全班第一"],1],["郝老师家访以后知道了什么？",["福根家很有钱","福根喜欢跳舞，是个体贴孝顺的孩子","福根不喜欢上学"],1],["福根的蝴蝶舞表演得怎么样？",["得了舞蹈组的冠军","没有人鼓掌","表演失败了"],0]]},{"title":"那天的舞蹈和掌声","sub":"我开始有勇气","paras":["之后，赵福根学习用功了，成绩也逐渐进步。他写了一篇题目为《那天的舞蹈和掌声》的作文，得了全班最高分，他朗读了自己的作文：“郝老师来到我家，那是第一次有老师来。她非常温柔……我永远都忘不了那热烈的掌声和同学们送我的糖，甜甜的。我感觉在学校也有人爱我了，我开始有勇气……”"],"idea":"Từ đó Phúc Căn học <b>chăm chỉ<\/b>, thành tích dần <b>tiến bộ<\/b>. Bài văn có <b>đầu đề<\/b> “Điệu múa và tràng pháo tay hôm ấy” được điểm cao nhất lớp, cậu <b>đọc to<\/b> trước lớp: “Cô Hách đến nhà em, đó là lần đầu có giáo viên đến. Cô rất <b>dịu dàng<\/b>… Em mãi không quên tràng vỗ tay <b>nhiệt liệt<\/b> và những viên kẹo ngọt các bạn tặng. Em thấy ở trường cũng có người thương em, em bắt đầu có <b>can đảm<\/b>…”","qs":[["跳舞得了冠军以后，福根有什么变化？",["学习用功了，成绩逐渐进步","不想上学了","每天都去跳舞"],0],["福根的作文里说，他永远忘不了什么？",["老师的批评","热烈的掌声和同学们送的糖","家里的困难"],1]]},{"title":"研究型学习","sub":"让家乡的明天更美好","paras":["郝老师发现，山里的青壮年都出去闯世界，只有老人、孩子留守，“他们出去了还回来吗？大山以后谁来负责”？于是，郝老师组织了一个8周的研究型学习活动，主题是“让家乡的明天更美好”。她鼓励学生寻找村子的问题，通过了解历史地理情况、采访村里的老人、小组讨论等，最终提出解决方案。她和其他志愿者利用午休、周末等空闲时间给学生们指导和培训。","学生们说：“以前，我们总认为建设家乡是大人的事，用不着我们操心。不过，现在我们明白了，建设家乡，人人有责，我们也要承担这个义务。这个任务很艰巨，我们要尽自己最大的力量。”"],"idea":"Cô nhận ra <b>thanh niên, trai tráng<\/b> trong núi đều đi <b>bươn chải<\/b>, chỉ còn người già, trẻ em <b>ở lại<\/b>: “Họ đi rồi có về không? Sau này ai chịu trách nhiệm cho vùng núi?” Cô tổ chức hoạt động học tập nghiên cứu 8 tuần, <b>chủ đề<\/b> “Làm cho ngày mai của quê hương tươi đẹp hơn”: tìm vấn đề của làng, tìm hiểu lịch sử <b>địa lý<\/b>, <b>phỏng vấn<\/b> người già, thảo luận nhóm, đề ra giải pháp; cô và các tình nguyện viên <b>tận dụng<\/b> giờ nghỉ trưa, cuối tuần <b>rảnh rỗi<\/b> để <b>hướng dẫn<\/b>, <b>đào tạo<\/b>. Học sinh nói: trước đây nghĩ <b>xây dựng<\/b> quê hương là việc của người lớn, không cần mình <b>bận tâm<\/b>; giờ hiểu ai cũng có trách nhiệm, các em cũng phải <b>gánh vác<\/b> <b>nghĩa vụ<\/b> này — nhiệm vụ <b>nặng nề<\/b>, phải dốc hết <b>sức<\/b>.","qs":[["郝老师发现山里有什么问题？",["青壮年都出去了，只有老人、孩子留守","孩子们都不上学","老人都去城市了"],0],["研究型学习活动的主题是什么？",["让家乡的明天更美好","那天的舞蹈和掌声","怎样考上大学"],0],["参加活动以后，学生们明白了什么？",["建设家乡是大人的事","建设家乡，人人有责","不用操心家乡的事"],1]]},{"title":"收获","sub":"未来与希望","paras":["郝琳硕觉得自己的收获远多于给孩子们的。“不管以后在哪儿，我都会继续用我的力量影响山里的孩子们，因为他们是国家的未来与希望。”"],"idea":"Cô Hách thấy <b>những gì mình nhận được<\/b> còn nhiều hơn những gì đã cho các em: “Dù sau này ở đâu, tôi vẫn sẽ tiếp tục dùng <b>sức<\/b> mình ảnh hưởng tới trẻ em vùng núi, vì các em là tương lai và hy vọng của đất nước.”","qs":[["郝琳硕觉得自己的收获怎么样？",["比给孩子们的少","远多于给孩子们的","没有收获"],1],["为什么郝老师要继续影响山里的孩子们？",["因为他们是国家的未来与希望","因为她想当校长","因为工作很轻松"],0]]}],"TEXT_EXTRA":{"bg":"就像课文中所说，现在中国的很多农村、山村里，青壮年都出去打工闯世界了，只有老人和孩子留守在家中。根据新闻报道，2013年，中国农民工增至2.69亿，其中，有超过1.6亿人是在外地打工，而且大部分集中在经济比较发达的中国东部地区。这种现象引起了很多人的思考。","bg_vn":"Như bài khóa nói, ở nhiều làng quê, vùng núi Trung Quốc, thanh niên trai tráng đều đi làm ăn xa, chỉ còn người già và trẻ em ở nhà. Theo tin tức, năm 2013 số lao động nông thôn đi làm thuê (农民工) tăng lên 269 triệu người, trong đó hơn 160 triệu làm việc xa quê, phần lớn tập trung ở miền Đông phát triển. Hiện tượng này khiến nhiều người suy nghĩ.","bg_qs":[["2013年，中国农民工有多少人？",["1.6亿","2.69亿","3亿"],1],["在外地打工的农民工大部分集中在哪儿？",["中国东部地区","中国西部山区","国外"],0]]},"APPLY":{"theme":"外出的农民工","topic":"青壮年外出打工，会对农村和城市产生什么影响？","topic_vn":"Thanh niên đi làm ăn xa sẽ ảnh hưởng thế nào đến nông thôn và thành phố? (nói 1–1,5 phút): quan điểm → ảnh hưởng → ví dụ → đề xuất / kết luận.","qs":[["青壮年外出打工对农村可能产生什么影响？","Thanh niên đi làm ăn xa có thể ảnh hưởng gì đến nông thôn?","好的影响是，他们能挣更多的钱，家里的生活条件会变好。不好的影响是，村子里只剩下老人和孩子，地没人种，孩子也缺少父母的照顾。",["挣钱","留守","老人","孩子"]],["青壮年外出打工对城市可能产生什么影响？","Ảnh hưởng gì đến thành phố?","城市的建设需要很多工人，农民工为城市的发展贡献了很大的力量。不过，城市里的人口越来越多，交通、住房等问题也越来越严重。",["建设","力量","人口","交通"]],["你认为，政府应该怎么帮助这些老人、孩子和农民工？","Theo bạn, chính phủ nên giúp đỡ người già, trẻ em và lao động xa quê thế nào?","我认为政府应该在农村多建一些学校和医院，让留守的老人和孩子得到照顾；也可以为农民工提供培训，帮助他们在家乡找到工作。",["培训","照顾","学校","家乡"]]],"vocab":[["农民工","nóngmíngōng","lao động nông thôn ra thành phố"],["打工","dǎgōng","làm thuê"],["闯世界","chuǎng shìjiè","đi bươn chải"],["留守儿童","liúshǒu értóng","trẻ em ở lại quê"],["青壮年","qīng-zhuàngnián","thanh niên trai tráng"],["建设","jiànshè","xây dựng"],["贡献","gòngxiàn","cống hiến"],["培训","péixùn","đào tạo"],["政府","zhèngfǔ","chính phủ"],["照顾","zhàogù","chăm sóc"]],"build_title":"选一个话题，拼出你的回答","build_lead":"Chọn hướng trả lời, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 观点","② 影响","③ 举例","④ 建议 · 结论"],"build":{"A · 对农村的影响":[["我认为，青壮年外出打工对农村的影响有好有坏。","我觉得青壮年都出去闯世界，农村会面临很大的问题。"],["一方面，他们能挣更多的钱，家里的生活变好了；另一方面，村子里只剩下老人和孩子。","孩子们缺少父母的照顾，很多孩子上课从不发言，也不爱和同学交往。"],["就像课文里的赵福根，父亲去世了，姐姐在外打工，他还得帮妈妈做家务。","我老家的村子也是这样，过年的时候才热闹几天。"],["所以，建设家乡需要大家一起承担这个义务。","我希望更多的年轻人能回到家乡，让家乡的明天更美好。"]],"B · 对城市的影响":[["我认为，农民工为城市的建设贡献了很大的力量。","青壮年外出打工，对城市也有很大的影响。"],["城市里的很多工作都需要他们，比如建房子、送快递。","不过，城市里的人口越来越多，交通、住房等问题也越来越严重。"],["我住的小区里，很多保安和清洁工都是从农村来的。","他们工作很辛苦，可是收入不高，孩子也不能在身边。"],["所以，城市应该更多地关心和帮助农民工。","我们应该尊重每一个为城市付出的人。"]],"C · 政府应该怎么做":[["我认为，政府应该多帮助这些老人、孩子和农民工。","我觉得解决这个问题，政府的作用很重要。"],["政府可以在农村多建学校和医院，让留守的老人和孩子得到照顾。","政府还可以为农民工提供免费的培训，提高他们的能力。"],["比如很多地方组织了支教行动，志愿者利用空闲时间给孩子们指导和培训。","如果家乡的经济发展了，青壮年就不用离开家乡了。"],["这个任务很艰巨，但是只要大家尽最大的力量，就一定能做好。","总之，孩子们是国家的未来与希望，我们不能忘了他们。"]]},"patterns":[["① 观点","我认为，……的影响有好有坏。","Tôi cho rằng ảnh hưởng của… có tốt có xấu."],["② 影响","一方面，……；另一方面，……","Một mặt…; mặt khác…"],["③ 举例","就像课文里的……","Giống như … trong bài khóa"],["③ 举例","以前，我们总认为……，不过，现在我们明白了……","Trước đây chúng ta luôn cho rằng…, nhưng giờ hiểu rằng…"],["④ 结论","这个任务很艰巨，我们要尽自己最大的力量。","Nhiệm vụ này nặng nề, chúng ta phải dốc hết sức."],["④ 结论","不管……，我都会继续……","Dù…, tôi vẫn sẽ tiếp tục…"]],"legend":["① Quan điểm","② Ảnh hưởng","③ Ví dụ","④ Kết luận"],"w5":["行动","发言","交往","体贴","用功","温柔","热烈","勇气","闯","利用","指导","培训","建设","操心","承担","义务","艰巨","力量","收获"],"samples":[{"who":"对农村的影响","meta":"Bài nói ~1 phút","p":["我认为，青壮年外出打工对农村的影响有好有坏。","一方面，他们能挣更多的钱，家里的生活变好了；另一方面，村子里只剩下老人和孩子。","就像课文里的赵福根，父亲去世了，姐姐在外打工，他还得帮妈妈做家务。","所以，建设家乡需要大家一起承担这个义务。"],"good":["建设家乡需要大家一起承担这个义务"],"vi":"Tôi cho rằng việc thanh niên đi làm xa ảnh hưởng đến nông thôn có tốt có xấu. Một mặt họ kiếm được nhiều tiền hơn, đời sống gia đình khá lên; mặt khác làng chỉ còn người già và trẻ em. Như Triệu Phúc Căn trong bài: bố mất, chị đi làm xa, cậu phải giúp mẹ làm việc nhà. Vì vậy xây dựng quê hương cần mọi người cùng gánh vác."},{"who":"政府应该怎么做","meta":"Bài nói ~1 phút","p":["我认为，政府应该多帮助这些老人、孩子和农民工。","政府可以在农村多建学校和医院，让留守的老人和孩子得到照顾。","如果家乡的经济发展了，青壮年就不用离开家乡了。","这个任务很艰巨，但是只要大家尽最大的力量，就一定能做好。"],"good":["这个任务很艰巨"],"vi":"Tôi cho rằng chính phủ nên giúp đỡ người già, trẻ em và lao động xa quê nhiều hơn: xây thêm trường, bệnh viện ở nông thôn để người già và trẻ em ở lại được chăm sóc. Nếu kinh tế quê nhà phát triển, thanh niên không cần rời quê. Nhiệm vụ này rất nặng nề, nhưng chỉ cần mọi người dốc hết sức thì nhất định làm được."}]},"WRITE":{"topic":"大山的未来谁负责","topic_vn":"Viết bài với đầu đề “Ai chịu trách nhiệm cho tương lai của vùng núi”, nêu suy nghĩ của bạn. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","现象","Mở bài: hiện tượng thanh niên rời núi, chỉ còn người già, trẻ em.","现在，山里的青壮年都出去闯世界了……"],["②","观点","Ai nên chịu trách nhiệm? (mỗi người /
