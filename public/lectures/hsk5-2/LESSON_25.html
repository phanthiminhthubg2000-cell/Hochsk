<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 25 · 给自己加满水 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

位经验丰富的老船长，一次返航中，天气恶劣，他们的船遇到了可怕的巨大风浪。","昨天晚上我做了一个可怕的梦。","Đêm qua tôi gặp một giấc mơ đáng sợ.",["可怕的风浪"],"“可怕” = đáng sợ (tính từ); “恐怕” = e rằng (phó từ, phỏng đoán). (练习 2)"],["风浪","fēnglàng","名","sóng gió",0,"水面上的风和波浪。","有一位经验丰富的老船长，一次返航中，天气恶劣，他们的船遇到了可怕的巨大风浪。",null,null,["巨大风浪"],""],["慌张","huāngzhāng","形","luống cuống, hoảng hốt",1,"不沉着，动作忙乱。","正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","李岩之所以那么慌张地返回北京，是因为得知了这个坏消息。","Lý Nham sở dĩ hoảng hốt quay về Bắc Kinh như vậy là vì biết được tin xấu này.",["慌张得不知如何是好"],"“慌张” nhấn mạnh hành động luống cuống; “紧张” nhấn mạnh tâm lý căng thẳng. (练习 2)"],["舱","cāng","名","khoang, buồng",0,"船或飞机中分隔开来载人或装东西的部分。","正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。",null,null,["货舱"],""],["使劲","shǐ jìn","动","cố gắng, gắng sức",1,"用力。","正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","大家一起使劲儿，终于把车推了出来。","Mọi người cùng dồn sức, cuối cùng đẩy được xe ra.",["使劲儿推"],"离合词：使了很大的劲儿。"],["朝","cháo","介／动","về phía, hướng về",1,"表示动作的方向；面对着。","正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","我们学校的正门坐西朝东。","Cổng chính trường chúng tôi quay mặt về hướng đông.",["朝里面放水","朝东"],"见“注释”：朝。"],["简直","jiǎnzhí","副","quả là, thật là",1,"表示完全如此或差不多如此，有夸张、强调的语气。","“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”","昨晚的比赛太精彩了，林丹简直太厉害了！","Trận đấu tối qua quá hay, Lâm Đan quả là quá giỏi!",["简直太……了"],"见“注释”：简直。"],["沉","chén","动","chìm, lặn",0,"在水中往下落。","“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”",null,null,["下沉"],""],["严肃","yánsù","形","nghiêm túc, nghiêm nghị",1,"（神情、气氛等）使人感到敬畏的；（作风、态度等）认真。","看着船长严肃的表情，水手们还是照做了。","小林这件事影响恶劣，我们对他一定要严肃批评。","Việc này của Tiểu Lâm ảnh hưởng xấu, chúng ta nhất định phải phê bình nghiêm khắc.",["严肃的表情","严肃对待"],"辨析：严肃—严格。见“搭配 · 辨析”。"],["猛烈","měngliè","形","mạnh, dữ dội",0,"气势大，力量大。","……船一点一点地下沉，狂风巨浪依然猛烈……",null,null,[],""],["狂","kuáng","形","mạnh, điên cuồng",0,"猛烈；任性，没有拘束。","……船一点一点地下沉，狂风巨浪依然猛烈……",null,null,["狂风巨浪"],""],["威胁","wēixié","动／名","uy hiếp, đe dọa",1,"用武力或权势逼迫使人屈服；使遭遇危险。","……对船的威胁却减小了……","在人口压力面前，经济发展、社会进步都受到了巨大威胁。","Trước áp lực dân số, phát triển kinh tế, tiến bộ xã hội đều bị đe dọa lớn.",["威胁安全","受到威胁"],""],["平衡","pínghéng","形／名","thăng bằng, cân bằng",1,"对立的各方面在数量或质量上相等或相抵。","……船也渐渐取得了平衡。","初学骑自行车最重要的是注意保持平衡。","Mới tập đi xe đạp quan trọng nhất là giữ thăng bằng.",["保持平衡","取得平衡","营养平衡"],""],["吨","dūn","量","tấn",0,"重量单位，1吨等于1000公斤。","……“几万吨的钢铁巨轮很少有被打翻的……",null,null,["几万吨"],""],["钢铁","gāngtiě","名","sắt thép",0,"钢和铁的合称。","……“几万吨的钢铁巨轮很少有被打翻的……",null,null,["钢铁巨轮"],""],["根基","gēnjī","名","nền tảng, nền móng",0,"基础。","……被打翻的常常是根基很轻的小船。",null,null,[],""],["重量","zhòngliàng","名","trọng lượng",1,"物体所受重力的大小。","船在有一定重量的时候是最安全的，在空的时候则是最危险的。”","这个箱子的重量超过了二十公斤。","Trọng lượng chiếc va li này vượt quá 20 kg.",["有一定重量"],""],["相似","xiāngsì","形","tương tự, giống nhau",1,"相像。","另一个相似的故事发生在某一著名风景区……","这两个地方的气候很相似。","Khí hậu hai nơi này rất giống nhau.",["相似的故事","形状相似"],""],["风景","fēngjǐng","名","phong cảnh, cảnh vật",0,"一定地域内由山水、花草、树木、建筑物以及某些自然现象形成的可供人观赏的景象。","另一个相似的故事发生在某一著名风景区……",null,null,["风景区"],""],["窄","zhǎi","形","chật, hẹp",1,"横的距离小（跟“宽”相对）。","……那里有一段被当地人称为“鬼谷”的最危险的路段，山路非常窄……","这条路太窄了，两辆车不能同时通过。","Con đường này quá hẹp, hai xe không thể cùng đi qua.",["山路很窄"],""],["万丈","wànzhàng","数","cao ngất, muôn trượng",0,"形容极高或极深。","……山路非常窄，两边是万丈深渊。",null,null,["万丈深渊"],""],["深渊","shēnyuān","名","vực sâu, vực thẳm",0,"很深的水；比喻危险的境地。","……山路非常窄，两边是万丈深渊。",null,null,[],""],["游览","yóulǎn","动","tham quan, dạo chơi",1,"从容行走观看（名胜、风景）。","每当导游们带队来这里游览时，一定要让游客们背点或者拿点什么东西。","每年都有很多游客来这里游览名胜古迹。","Hằng năm có rất nhiều du khách đến đây thăm danh lam thắng cảnh.",["游览名胜"],""],["发抖","fādǒu","动","run, run rẩy",1,"由于害怕、生气或受到寒冷等原因而身体颤动。","“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”","外面太冷了，他冻得直发抖。","Bên ngoài quá lạnh, cậu ấy rét run cầm cập.",["两腿发抖"],""],["负重","fùzhòng","动","vác nặng",0,"背着沉重的东西。","“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”",null,null,["负重前行"],""],["摔倒","shuāidǎo","动","ngã, té",0,"身体失去平衡而倒下。","“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”",null,null,["摔倒在地"],""],["妇女","fùnǚ","名","phụ nữ",0,"成年女子的通称。","一位妇女不解地问。",null,null,[],""],["起","qǐ","量","vụ (việc)",0,"用于事件、案件等。","……“这里以前发生过好几起意外……",null,null,["一起意外"],""],["丝毫","sīháo","形","chút nào, tí nào",1,"极少或很少，一点儿（多用于否定式）。","……都是迷路的游客在丝毫没有感觉到压力的情况下……","他对这件事丝毫不感兴趣。","Anh ấy không hề hứng thú chút nào với việc này.",["丝毫没有","丝毫不……"],""],["滚","gǔn","动","lăn, lộn",0,"（圆球等）滚动；翻转。","……都是迷路的游客在丝毫没有感觉到压力的情况下，一不小心滚下去的。",null,null,["滚下去"],""],["风险","fēngxiǎn","名","sự mạo hiểm, rủi ro",1,"可能发生的危险。","假如你感觉到了有风险，谨慎地负重前行，反而会更安全。”","你决定在海外投资，有没有考虑到风险？","Bạn quyết định đầu tư ở nước ngoài, đã tính đến rủi ro chưa?",["有风险","冒风险"],""],["谨慎","jǐnshèn","形","cẩn thận, thận trọng",1,"（对外界事物或自己的言行）密切注意，以免发生不利或不幸的事情。","假如你感觉到了有风险，谨慎地负重前行，反而会更安全。”","这毕竟是高考择校，我们必须谨慎对待。","Dù sao đây cũng là chọn trường thi đại học, chúng ta phải thận trọng.",["谨慎地负重前行","谨慎对待"],""],["效应","xiàoyìng","名","tác động, hiệu ứng",0,"泛指某个人物的言行或某种事物的发生、发展在社会上所引起的反应和效果。","这就是“压力效应”。",null,null,["压力效应"],""],["胸","xiōng","名","ngực, lòng",0,"躯干的一部分；指心里。","那些胸怀理想、肩上有责任感的人……",null,null,["胸怀理想"],""],["承受","chéngshòu","动","chịu đựng, chấp nhận",1,"接受，禁受。","那些胸怀理想、肩上有责任感的人，才能承受住压力……","我实在承受不了这么大的压力。","Tôi thật sự không chịu nổi áp lực lớn như vậy.",["承受压力","承受住"],"“承受” = chịu đựng (áp lực, đau khổ); “接受” = nhận, tiếp nhận (quà, ý kiến). (练习 2)"],["和尚","héshang","名","hòa thượng",0,"出家修行的男佛教徒。","……做一天和尚撞一天钟的人……",null,null,["做一天和尚撞一天钟"],"俗语：做一天和尚撞一天钟 = làm ngày nào biết ngày ấy, làm cho xong chuyện."],["钟","zhōng","名","chuông",0,"金属制成的响器，中空，敲时发声。","……做一天和尚撞一天钟的人……",null,null,["撞钟"],""],["彻底","chèdǐ","形","triệt để, hoàn toàn",1,"一直到底；深而透。","……往往一场人生的狂风巨浪便会把他们彻底地打翻在地。","你的病好得不彻底，还应该再休息几天。","Bệnh của bạn chưa khỏi hẳn, nên nghỉ thêm vài ngày.",["彻底地打翻","彻底解决"],""]],"WARM":[{"tab":"有压力才有动力？","title":"你同意“有压力才会有动力”吗？","type":"discuss","q":"你听说过“有压力才会有动力”这句话吗？你是否同意这种观点？为什么？","vn":"Bạn đã nghe câu “có áp lực mới có động lực” chưa? Bạn có đồng ý không? Vì sao?","answer_zh":"我基本同意这种观点。比如考试以前，我会更努力地复习；工作有了目标，做事也会更有效率。不过，压力太大也不好，会让人紧张、睡不着觉。所以，适当的压力才能变成动力。","answer_vn":"Từ hữu ích: 压力 (áp lực), 动力 (động lực), 适当 (thích hợp), 紧张 (căng thẳng), 效率 (hiệu suất), 承受 (chịu đựng)."},{"tab":"看图找词","title":"找出与图片内容有关的词语","type":"words","task":"图片上，一艘大船在大海上航行，天空很暗，海上的浪很大。请从生词中找出与图片内容有关的词语，写在表格中。（例：返航）","task_vn":"Sách dùng ảnh một con tàu lớn giữa biển động, trời tối, sóng to. Tìm trong bảng từ mới những từ liên quan, xếp vào bảng.","groups":[{"title":"形容词","given":0,"items":[["恶劣","tồi tệ (thời tiết)"],["可怕","đáng sợ"],["猛烈","dữ dội"],["狂","điên cuồng"]]},{"title":"动词","given":1,"items":[["返航","quay về"],["沉","chìm"],["威胁","đe dọa"]]},{"title":"名词","given":0,"items":[["风浪","sóng gió"],["舱","khoang"],["钢铁","sắt thép"]]}]}],"GAME":{"fill":[["一次返航中，天气{}……","恶劣",["恶劣","恶心","可恶","厉害"]],["正当水手们{}得不知如何是好时……","慌张",["慌张","紧张","夸张","扩张"]],["使劲儿{}里面放水。","朝",["朝","从","在","离"]],["船长{}是疯了……","简直",["简直","简单","一直","直接"]],["看着船长{}的表情……","严肃",["严肃","严格","严重","认真"]],["对船的{}却减小了……","威胁",["威胁","危险","威风","伤害"]],["船也渐渐取得了{}。","平衡",["平衡","平静","平安","平等"]],["另一个{}的故事发生在某一著名风景区……","相似",["相似","相同","似乎","类似"]],["都是迷路的游客在{}没有感觉到压力的情况下……","丝毫",["丝毫","稍微","毫无","多少"]],["才能{}住压力……","承受",["承受","接受","感受","享受"]]],"order":[["天气恶劣，|他们的船|遇到了|可怕的巨大风浪。"],["船也渐渐|取得了|平衡。"],["山路|非常窄，|两边是|万丈深渊。"],["却从来|没人|出事。"],["反而会|更安全。"],["这就是|“压力效应”。"]]},"GOOD":[{"zh":"船在有一定重量的时候是最安全的，在空的时候则是最危险的","vn":"tàu có một trọng lượng nhất định thì an toàn nhất, còn lúc rỗng lại là nguy hiểm nhất","why":"Câu đối lập <b>……的时候是最……的，……的时候则是最……的<\/b> — rút ra đạo lý từ hình ảnh cụ thể.","frame":"……的时候是最……的，……的时候则是最……的","apply":"人在有目标的时候是最有动力的，在没有目标的时候则是最容易放弃的。","apply_vn":"Con người có mục tiêu thì có động lực nhất, không có mục tiêu thì dễ bỏ cuộc nhất."},{"zh":"假如你感觉到了有风险，谨慎地负重前行，反而会更安全","vn":"nếu bạn cảm thấy có rủi ro, thận trọng mang vác mà đi, ngược lại sẽ an toàn hơn","why":"Kết quả trái với suy nghĩ thông thường: <b>假如……，……反而会更……<\/b>.","frame":"假如……，……反而会更……","apply":"假如你每天给自己一点儿压力，学习反而会更有效率。","apply_vn":"Nếu mỗi ngày bạn tự tạo chút áp lực, việc học ngược lại sẽ hiệu quả hơn."},{"zh":"那些胸怀理想、肩上有责任感的人，才能承受住压力","vn":"những người mang lý tưởng trong lòng, có tinh thần trách nhiệm trên vai, mới chịu được áp lực","why":"Câu nêu luận điểm <b>那些……的人，才能……；而那些……的人，就像……<\/b> — đối lập hai kiểu người.","frame":"那些……的人，才能……；而那些……的人，……","apply":"那些有明确目标的人，才能坚持到最后；而那些没有目标的人，往往半途而废。","apply_vn":"Những người có mục tiêu rõ ràng mới kiên trì tới cùng; còn những người không có mục tiêu thường bỏ dở giữa chừng."}],"GRAMMAR":[{"word":"朝","py":"cháo","pos":"动词／介词","forms":["动词：面对着、向（坐西朝东、脸朝里）","介词：朝 + 方向／人 + 动词（表示动作的方向，不能做补语）"],"vn":"<b>朝<\/b>: ① động từ — <b>quay mặt về, hướng về<\/b> (坐西朝东: quay về hướng đông); ② giới từ — <b>về phía<\/b>, chỉ hướng của động tác: 朝 + phương hướng / người + động từ. Khác <b>向<\/b>: 朝 <b>không làm bổ ngữ<\/b> (走向未来 ✓, ×走朝未来).","text":"老船长命令水手们立刻打开货舱，使劲儿朝里面放水","ex":[["我们学校的正门坐西朝东。","Cổng chính trường chúng tôi quay về hướng đông."],["我进去时，他正脸朝里和李主任商量着什么，没注意到我的到来。","Khi tôi vào, anh ấy đang quay mặt vào trong bàn bạc gì đó với chủ nhiệm Lý, không để ý tôi đến."],["我仿佛看到胜利正朝我们走来。","Tôi như thấy chiến thắng đang tiến về phía chúng ta."]],"book_title":"练一练：完成句子或对话（朝）","book":[["小林，我进你们家的小区了，你住的5号楼______________？","","小林，我进你们家的小区了，你住的5号楼朝哪个方向走"],["______________，别跟孩子发脾气。","","有什么不满就朝我来，别跟孩子发脾气"],["A：请问，去国家图书馆______________？<br>B：没错，大概过两个路口就到了。","","请问，去国家图书馆是朝这个方向走吗"]],"drill":[["Câu nào đúng?",["他朝我笑了笑。","他笑朝我了。"],0,"朝 + người + động từ; không làm bổ ngữ."],["选择：这个房间____南，阳光很好。",["朝","往"],0,"Động từ: quay về hướng nam → 朝南."]]},{"word":"简直","py":"jiǎnzhí","pos":"副词","forms":["简直 + 动词／形容词（+ 了）","表示接近完全是这样，带有夸张、强调的语气"],"vn":"<b>简直<\/b> (phó từ): <b>quả là, thật là, gần như<\/b> — gần như hoàn toàn như vậy (nhưng không hẳn), mang <b>giọng cường điệu, nhấn mạnh<\/b>. Hay đi với 太……了, 像……一样, 不敢 / 不能….","text":"“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”","ex":[["听到刘方离婚的消息时，我简直不敢相信自己的耳朵。","Nghe tin Lưu Phương ly hôn, tôi gần như không dám tin vào tai mình."],["这次张小姐变得格外客气、礼貌，与从前相比，简直像换了个人。","Lần này cô Trương khách sáo, lễ phép lạ thường, so với trước đây cứ như thành người khác."]],"book_title":"练一练：完成句子或对话（简直）","book":[["眼前的情景让在场的所有人都惊呆了，______________。","","眼前的情景让在场的所有人都惊呆了，简直不敢相信这是真的"],["返城的车在高速路上排起几公里的长队，______________。","","返城的车在高速路上排起几公里的长队，简直像一个大停车场"],["A：今天，老板要跟我们商量下半年的计划，我得去一趟。<br>B：你病成这样还要去上班，______________。","","你病成这样还要去上班，简直是不要命了"]],"drill":[["选择：这里的风景太美了，____像一幅画。",["简直","简单"],0,"Cường điệu: 简直像…."],["“简直”表达的语气是：",["夸张、强调","怀疑、不肯定"],0,"Giọng cường điệu, nhấn mạnh."]]}],"HSK":{"r1":[{"text":["有个年轻人觉得工作压力太大，就辞职回了老家。刚开始，他每天睡到中午，{36}。可是过了一个月，他发现自己越来越没有精神，{37}。后来，他找了一份新工作，虽然很忙，{38}。他说：“原来没有压力的生活并不轻松。”"],"qs":[{"n":36,"o":["觉得非常轻松","常常加班","工作特别忙","每天都很紧张"],"a":0,"why":"辞职回家、睡到中午，开始时觉得轻松。"},{"n":37,"o":["做什么都没有兴趣","朋友越来越多","身体越来越好","工作越来越忙"],"a":0,"why":"与“没有精神”一致。"},{"n":38,"o":["所以他又辞职了","而且工资很低","但是每天都很充实","因此他很失望"],"a":2,"why":"“虽然……，但是……”，转折。"}]},{"text":["心理学家发现，适当的压力能让人的注意力更集中，{39}。比如，考试前一周，很多学生的学习效率会特别高。但是，{40}，人就会变得慌张、焦虑，甚至生病。所以，{41}。当你感到压力太大时，可以做做运动、听听音乐，{42}。"],"qs":[{"n":39,"o":["变得很懒","睡得更多","更容易生病","做事的效率也更高"],"a":3,"why":"后文举例：考试前效率高。"},{"n":40,"o":["虽然没有压力","因为压力很小","只要有压力","如果压力太大"],"a":3,"why":"与“慌张、焦虑、生病”对应。"},{"n":41,"o":["不用在意压力","压力越大越好","最好不要有压力","我们要学会控制压力"],"a":3,"why":"总结：压力要适当，要会控制。"},{"n":42,"o":["让自己放松下来","让压力变得更大","一个人生闷气","多加几天班"],"a":0,"why":"减轻压力的方法。"}]}],"r2":[{"start":46,"paras":["老船长却命令水手们打开货舱，往里面放水。","一次，一艘船在海上遇到了巨大的风浪，水手们都很慌张。","水手们虽然不理解，但还是照做了。","结果，船慢慢下沉，却渐渐取得了平衡，最后安全地回到了港口。","船长说：“空船最容易被打翻，有一定重量的船才最安全。”"],"ans":["B","A","C","D","E"],"why":"遇到风浪（B）→ 船长命令放水（A）→ 水手照做（C）→ 结果（D）→ 船长解释（E）。"}],"r3":[{"text":["很多人都有这样的经历：越是轻松的时候，越容易出错。比如，走在平路上，有人会不小心摔倒；考试时觉得题目很简单，反而会粗心做错。","专家把这种现象叫做“压力效应”。他们认为，人在感觉到危险或压力时，会变得更加谨慎，注意力也更集中；相反，<u><b>当人丝毫感觉不到压力的时候，往往最容易放松警惕<\/b><\/u>。","不过，压力并不是越大越好。研究发现，压力过大，人会紧张、慌张，做事的效率反而会降低。只有适当的压力，才能给人带来动力。","所以，我们既不要害怕压力，也不要给自己太大的压力，关键是找到一个平衡点。"],"qs":[{"n":56,"s":"第一段举的例子说明：","o":["越轻松的时候越容易出错","平路很危险","考试题目都很难","粗心的人很多"],"a":0,"why":"第一段第一句。"},{"n":57,"s":"画线句子中“放松警惕”的意思是：","o":["不再小心","很紧张","认真工作","感到害怕"],"a":0,"why":"感觉不到压力 → 不小心。"},{"n":58,"s":"根据第三段，压力过大会怎么样？","o":["效率反而降低","效率更高","更加谨慎","更有动力"],"a":0,"why":"第三段。"},{"n":59,"s":"作者认为面对压力的关键是：","o":["完全没有  30 0 L18 -60 q-18 5 -36 0z\" fill=\"#2f6fd6\"/><path d=\"M-14 -106 L-30 -126 L-26 -150\" stroke=\"#2f6fd6\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-26\" cy=\"-150\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M14 -106 L22 -66\" stroke=\"#2f6fd6\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"22\" cy=\"-66\" r=\"4\" fill=\"#f6d1b1\"/><circle cx=\"-16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"-130\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -131 q-1 -19 17 -19 q18 0 17 19 q-4 -9 -10 -10 q-10 3 -24 10z\" fill=\"#2b2420\"/><circle cx=\"-5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-6 -125 q6 8 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><path d=\"M88.0 69 L240 96 L102.0 69z\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.5\"/><rect x=\"20\" y=\"20\" width=\"150\" height=\"50\" rx=\"10\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.5\"/><path d=\"M89.0 68.5 h12\" stroke=\"#fff\" stroke-width=\"3\"/><g transform=\"translate(95.0,45.0)\"><text x=\"0\" y=\"1\" font-size=\"14\" font-weight=\"600\" fill=\"#333\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"'Noto Sans SC','PingFang SC',sans-serif\">空船是最危险的<\/text><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: gặp sóng gió → lệnh bơm nước → tàu cân bằng → về an toàn, rút ra đạo lý.","Có thể dùng: 恶劣、风浪、慌张、朝、简直、平衡、重量、承受."],"sample":"有一次，一艘船在返航的路上遇到了恶劣的天气，海上的风浪特别大，水手们都慌张得不知道该怎么办。这时，老船长命令大家打开货舱，朝里面放水。一个年轻的水手说：“船长简直疯了！”可是看着船长严肃的表情，大家还是照做了。没想到，船慢慢下沉以后，反而取得了平衡，在风浪中稳稳地前进。最后，船安全地回到了港口。船长对水手们说：“船在有一定重量的时候才是最安全的，空船是最危险的。”","svn":"Tàu gặp bão khi trở về, thủy thủ hoảng loạn; thuyền trưởng ra lệnh bơm nước vào khoang; tàu chìm xuống nhưng lấy lại thăng bằng, vững vàng tiến lên; về cảng an toàn, thuyền trưởng nói tàu rỗng mới nguy hiểm nhất."},"w72":{"prompt":"有人说：“没有压力的生活才是幸福的生活。”你同意这种看法吗？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói “cuộc sống không áp lực mới là cuộc sống hạnh phúc”. Bạn có đồng ý không? Viết bài không ít hơn 200 chữ.","min":200,"title":"压力与幸福","tips":["Không đồng ý → 首先 áp lực thích hợp tạo động lực (tàu có trọng lượng) → 其次 không áp lực dễ mất mục tiêu (做一天和尚撞一天钟) → 当然 áp lực quá lớn thì có hại → 总之 tìm cân bằng.","Dùng: ……的时候是最……的；那些……的人，才能承受住压力；平衡."],"sample":"有人说：“没有压力的生活才是幸福的生活。”我不同意这种看法。\n首先，适当的压力能给人带来动力。就像课文里的船，在有一定重量的时候是最安全的，在空的时候则是最危险的。人也是一样，有了压力，我们才会努力学习、认真工作，生活也才会更充实。\n其次，没有压力的人往往没有目标，常常做一天和尚撞一天钟。这样的生活看起来很轻松，其实很无聊，一遇到困难就很容易被打倒。\n当然，压力也不能太大。长期承受过大的压力，会影响人的健康。所以，我们要学会减轻压力，保持生活的平衡。\n总之，幸福的生活不是没有压力的生活，而是能够承受住压力、并把压力变成动力的生活。","svn":"Nghị luận: không đồng ý → 首先 áp lực thích hợp tạo động lực (ví dụ con tàu) → 其次 không áp lực thì không mục tiêu → 当然 quá lớn thì hại sức khỏe → 总之 hạnh phúc là biết biến áp lực thành động lực."}},"PRACTICE":{"ex1":{"bank":["风险","谨慎","平衡","威胁","简直","恶劣"],"items":[["对这种行为{}的队员只能让他离开球队。",["恶劣"]],["在人口压力面前，经济发展、社会进步都受到了巨大{}。",["威胁"]],["这毕竟是高考择校，我们必须{}对待。",["谨慎"]],["初学骑自行车最重要的是注意保持{}。",["平衡"]],["你决定在海外投资，有没有考虑到{}？",["风险"]],["昨晚的比赛太精彩了，林丹{}太厉害了！",["简直"]]]},"ex2":[["不是你努力得不够，____是努力的方向错了。",["可怕","恐怕"],1,"Phỏng đoán “e rằng” → 恐怕; 可怕 là tính từ “đáng sợ”."],["李岩之所以那么____地返回北京，是因为得知了这个坏消息。",["慌张","紧张"],0,"Hành động vội vã, luống cuống → 慌张地返回."],["你的病好得不____，还应该再休息几天。",["彻底","完全"],0,"好得不彻底 = khỏi chưa dứt điểm."],["我实在不敢____这么贵重的礼物。",["承受","接受"],1,"Nhận quà → 接受; 承受 là chịu đựng (áp lực)."]],"ex3":[],"ex3match":{"groups":[[["冒","风险"],["游览","名胜"],["承受","压力"],["威胁","生命"]],[["形状","相似"],["气候","恶劣"],["营养","平衡"],["态度","严肃"]]]},"ex4":[["返航途中遇险的经历","恶劣、风浪、慌张、沉、威胁、平衡、翻","老船长返航时天气恶劣，船遇到了巨大风浪。水手们很慌张，船长却让他们朝货舱里放水。船慢慢下沉，对船的威胁却减小了，船取得了平衡。船长说，被打翻的常常是根基很轻的小船。"],["“鬼谷”的故事","窄、游览、发抖、摔、滚、风险、谨慎、安全","“鬼谷”的山路很窄，两边是深渊。导游带游客游览时，一定让他们背点东西。一位妇女怕摔倒，导游解释说，以前的游客没有压力，不小心滚了下去；感觉到风险、谨慎地负重前行，反而更安全。"],["压力效应","责任感、承受、压力","这就是压力效应：有理想、有责任感的人，才能承受住压力；没有一点压力的人，就像风暴中的空船，很容易被打翻。"]],"ext":{"title":"扩展 · 话题：度量单位 · 学习用具","words":[["厘米","límǐ","xăng-ti-mét"],["克","kè","gam"],["平方","píngfāng","mét vuông"],["吨","dūn","tấn"],["尺子","chǐzi","thước kẻ"],["胶水","jiāoshuǐ","keo dán"],["文具","wénjù","văn phòng phẩm"]],"items":[["你这儿有{}吗？报名表上要贴张照片。","胶水"],["这些{}是寄到地震灾区给那里的孩子们用的。","文具"],["新城的街区就像用{}画出的格子一样的整齐。","尺子"],["这个最小的房间只有12个{}，我想当作书房。","平方"]]}},"TEXT":[{"title":"风浪中的船","sub":"朝货舱里放水","paras":["有一位经验丰富的老船长，一次返航中，天气恶劣，他们的船遇到了可怕的巨大风浪。正当水手们慌张得不知如何是好时，老船长命令水手们立刻打开货舱，使劲儿朝里面放水。","“船长简直是疯了，这样做只会增加船的压力，船就会下沉得更快，这不是找死吗？”一个年轻的水手骂道。","看着船长严肃的表情，水手们还是照做了。随着货舱里的水位越升越高，船一点一点地下沉，狂风巨浪依然猛烈，对船的威胁却减小了，船也渐渐取得了平衡。"],"idea":"Một lần <b>trở về<\/b>, thời tiết <b>tồi tệ<\/b>, con tàu của vị thuyền trưởng già gặp <b>sóng gió<\/b> <b>khủng khiếp<\/b>. Khi thủy thủ <b>luống cuống<\/b> không biết làm gì, ông ra lệnh mở <b>khoang<\/b> hàng, <b>ra sức<\/b> bơm nước <b>vào<\/b> trong. Một thủy thủ trẻ mắng: “Thuyền trưởng <b>quả là<\/b> điên rồi, làm vậy chỉ tăng áp lực, tàu sẽ <b>chìm<\/b> nhanh hơn!” Nhưng thấy vẻ mặt <b>nghiêm nghị<\/b> của ông, họ vẫn làm theo. Mực nước trong khoang càng cao, tàu chìm dần, gió bão vẫn <b>dữ dội<\/b> nhưng <b>mối đe dọa<\/b> giảm, tàu dần <b>lấy lại thăng bằng<\/b>.","qs":[["遇到巨大风浪时，老船长让水手们做什么？",["马上弃船","打开货舱，朝里面放水","把货物扔进海里"],1],["年轻的水手为什么骂船长？",["他觉得放水会让船沉得更快","船长不让他休息","船长返航太晚了"],0],["放水以后，船怎么样了？",["沉下去了","威胁减小，渐渐取得了平衡","被打翻了"],1]]},{"title":"船长的话","sub":"空船最危险","paras":["船长望着松了一口气的水手们说：“几万吨的钢铁巨轮很少有被打翻的，被打翻的常常是根基很轻的小船。船在有一定重量的时候是最安全的，在空的时候则是最危险的。”"],"idea":"Thuyền trưởng nói với các thủy thủ vừa thở phào: “Tàu thép mấy vạn <b>tấn<\/b> hiếm khi bị lật, bị lật thường là thuyền nhỏ <b>nền móng<\/b> nhẹ. Tàu có một <b>trọng lượng<\/b> nhất định thì an toàn nhất, lúc rỗng lại là nguy hiểm nhất.”","qs":[["船长认为，船在什么时候最安全？",["空的时候","有一定重量的时候","停在港口的时候"],1],["被打翻的常常是什么样的船？",["几万吨的钢铁巨轮","根基很轻的小船","装满货物的船"],1]]},{"title":"鬼谷","sub":"负重前行反而更安全","paras":["另一个相似的故事发生在某一著名风景区，那里有一段被当地人称为“鬼谷”的最危险的路段，山路非常窄，两边是万丈深渊。每当导游们带队来这里游览时，一定要让游客们背点或者拿点什么东西。","“这么危险的地方，我不拿东西两腿都发抖，再负重前行，那不是更容易摔倒吗？”一位妇女不解地问。","导游小姐解释道：“这里以前发生过好几起意外，都是迷路的游客在丝毫没有感觉到压力的情况下，一不小心滚下去的。当地人每天都从这条路上背着东西来来往往，却从来没人出事。假如你感觉到了有风险，谨慎地负重前行，反而会更安全。”"],"idea":"Một câu chuyện <b>tương tự<\/b> ở một khu <b>danh thắng<\/b>: đoạn đường người địa phương gọi là “Quỷ Cốc”, đường núi rất <b>hẹp<\/b>, hai bên là <b>vực thẳm<\/b> <b>muôn trượng<\/b>. Mỗi lần dẫn đoàn <b>tham quan<\/b>, hướng dẫn viên đều bắt du khách mang vác chút đồ. Một <b>người phụ nữ<\/b> không hiểu: “Không cầm gì đã <b>run<\/b> chân, còn <b>vác nặng<\/b> thì chẳng dễ <b>ngã<\/b> hơn sao?” Hướng dẫn viên giải thích: mấy <b>vụ<\/b> tai nạn trước đây đều do du khách lạc đường, <b>không hề<\/b> cảm thấy áp lực, sơ ý <b>lăn<\/b> xuống; người dân ngày nào cũng vác đồ qua lại mà chưa ai gặp chuyện. Nếu cảm thấy có <b>rủi ro<\/b>, <b>thận trọng<\/b> mang vác mà đi lại an toàn hơn.","qs":[["“鬼谷”是一段什么样的路？",["又宽又平","山路很窄，两边是万丈深渊","风景最美的路"],1],["导游为什么让游客背点或拿点东西？",["东西太多了","有一定压力，走路会更谨慎、更安全","想让游客累一点儿"],1],["以前的意外是怎么发生的？",["游客背的东西太重","游客没有感觉到压力，不小心滚下去","当地人推了他们"],1]]},{"title":"压力效应","sub":"做一天和尚撞一天钟","paras":["这就是“压力效应”。那些胸怀理想、肩上有责任感的人，才能承受住压力，从历史的风雨中走过“鬼谷”；而那些没有理想，没有一点压力，做一天和尚撞一天钟的人，就像一艘风暴中的空船，往往一场人生的狂风巨浪便会把他们彻底地打翻在地。"],"idea":"Đó là “<b>hiệu ứng<\/b> áp lực”. Người <b>mang<\/b> lý tưởng <b>trong lòng<\/b>, có tinh thần trách nhiệm trên vai mới <b>chịu<\/b> được áp lực, vượt qua “Quỷ Cốc” giữa gió mưa lịch sử; còn người không lý tưởng, không chút áp lực, “làm <b>hòa thượng<\/b> ngày nào gõ <b>chuông<\/b> ngày ấy” thì như con tàu rỗng giữa bão — một trận sóng gió cuộc đời có thể lật nhào họ <b>hoàn toàn<\/b>.","qs":[["什么样的人才能承受住压力？",["没有理想的人","胸怀理想、有责任感的人","做一天和尚撞一天钟的人"],1],["“做一天和尚撞一天钟”的意思最可能是：",["工作非常认真","没有目标，只是应付着过日子","每天早上起得很早"],1],["这篇课文主要想告诉我们：",["适当的压力能让人更安全、更坚强","坐船很危险","不要去风景区游览"],0]]}],"TEXT_EXTRA":{"bg":"课文中老船长有句话，“船在有一定重量的时候是最安全的，在空的时候则是最危险的”。事实证明，加水后的巨轮最终承受住了风浪的考验。人的一生也会遇到许多压力和挑战。如果把人生比作这艘船，在人生的旅途中，我们应该给自己加点什么呢？学业、事业、理想，还有亲人、朋友、爱好、健康、快乐……太多的目标，也就难免有太多的责任和压力。你该如何面对呢？","bg_vn":"Thuyền trưởng nói: “Tàu có trọng lượng nhất định thì an toàn nhất, lúc rỗng là nguy hiểm nhất.” Thực tế con tàu được bơm nước đã vượt qua thử thách của sóng gió. Đời người cũng gặp nhiều áp lực, thử thách. Nếu ví đời người như con tàu, ta nên “chất” thêm gì cho mình? Học hành, sự nghiệp, lý tưởng, người thân, bạn bè, sở thích, sức khỏe, niềm vui… Quá nhiều mục tiêu thì khó tránh quá nhiều trách nhiệm và áp lực. Bạn đối mặt thế nào?","bg_qs":[["加水后的巨轮最后怎么样了？",["沉下去了","承受住了风浪的考验","返航失败了"],1],["作者认为太多的目标会带来什么？",["太多的责任和压力","太多的快乐","太多的钱"],0]]},"APPLY":{"theme":"如何面对压力","topic":"你怎么看待压力？压力太大时你怎么办？","topic_vn":"Bạn nhìn nhận áp lực thế nào? Khi áp lực quá lớn bạn làm gì? (nói 1–1,5 phút): quan điểm → áp lực đến từ đâu → lợi / hại → cách giảm áp lực.","qs":[["目前，你遇到的最大的压力来自哪方面？说说你的情况。","Hiện tại áp lực lớn nhất của bạn đến từ đâu? Kể tình hình của bạn.","我现在最大的压力来自学习。下个月我要参加HSK五级考试，每天都要背很多生词，做很多练习，有时候紧张得睡不着觉。",["学习","考试","紧张","睡不着"]],["你觉得压力给你带来了什么影响？有什么好处和坏处？","Áp lực mang lại ảnh hưởng gì? Có lợi và hại gì?","好处是，有了压力，我会更努力，效率也更高；坏处是，压力太大的时候，我会很慌张，身体也不舒服。所以压力要适当。",["好处","坏处","效率","适当"]],["如果你觉得压力过大时，你有什么好的减轻压力的办法吗？","Khi áp lực quá lớn, bạn có cách giảm áp lực nào hay?","压力大的时候，我会去跑步或者听音乐，也会和朋友聊聊天。另外，把大目标分成一个个小目标，一步一步完成，压力就没那么大了。",["跑步","听音乐","聊天","小目标"]]],"vocab":[["压力","yālì","áp lực"],["动力","dònglì","động lực"],["承受","chéngshòu","chịu đựng"],["减轻","jiǎnqīng","giảm nhẹ"],["放松","fàngsōng","thả lỏng"],["适当","shìdàng","thích hợp"],["挑战","tiǎozhàn","thử thách"],["责任感","zérèngǎn","tinh thần trách nhiệm"],["焦虑","jiāolǜ","lo âu"],["效率","xiàolǜ","hiệu suất"]],"build_title":"选一个观点，拼出你的回答","build_lead":"Chọn quan điểm, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 观点","② 理由","③ 举例","④ 结论"],"build":{"A · 我喜欢压力":[["我喜欢压力，因为有压力才会有动力。","我觉得适当的压力对人有好处。"],["就像课文里的船，在有一定重量的时候是最安全的，在空的时候则是最危险的。","没有一点压力的人，很容易做一天和尚撞一天钟。"],["去年准备考试的时候，压力很大，但正是这种压力，让我每天都坚持学习。","我工作的时候，如果有一个清楚的目标，效率就会特别高。"],["所以，我们不应该害怕压力，而应该把压力变成动力。","总之，胸怀理想、有责任感的人，才能承受住压力。"]],"B · 我不喜欢压力":[["我不喜欢压力，因为压力太大会影响人的健康。","我觉得现在很多人的压力太大了。"],["压力太大的时候，人会变得很慌张，做什么事都做不好。","长期承受很大的压力，身体和心理都会出问题。"],["我的一个朋友工作压力很大，每天加班，后来生了一场大病。","考试前我常常紧张得睡不着，第二天反而考得不好。"],["所以，我们要学会给自己减轻压力，保持生活的平衡。","总之，压力太大不是好事，健康才是最重要的。"]],"C · 怎样减轻压力":[["压力过大的时候，我们一定要想办法减轻压力。","我有几个减轻压力的好办法。"],["首先，可以做做运动，比如跑步、游泳，让身体放松下来。","首先，要把大目标分成小目标，一步一步地完成。"],["其次，可以和朋友聊聊天，把心里的话说出来。","其次，要合理安排时间，保证足够的睡眠。"],["只要方法正确，压力就能变成我们前进的动力。","这样，我们就能谨慎地负重前行，走过人生的“鬼谷”。"]]},"patterns":[["① 观点","我喜欢／不喜欢压力，因为……","Tôi thích / không thích áp lực vì…"],["② 理由","……的时候是最……的，……的时候则是最……的。","Khi… là… nhất, còn khi… lại là… nhất."],["② 理由","假如……，反而会更……","Nếu…, ngược lại sẽ… hơn."],["③ 举例","就像课文里的……","Giống như … trong bài khóa"],["④ 结论","那些……的人，才能承受住压力。","Những người… mới chịu được áp lực."],["④ 结论","我们应该把压力变成动力。","Chúng ta nên biến áp lực thành động lực."]],"legend":["① Quan điểm","② Lý do","③ Ví dụ","④ Kết luận"],"w5":["恶劣","可怕","慌张","使劲","朝","简直","严肃","威胁","平衡","重量","相似","窄","游览","发抖","丝毫","风险","谨慎","承受","彻底"],"samples":[{"who":"我喜欢压力","meta":"Bài nói ~1 phút","p":["我喜欢压力，因为有压力才会有动力。","就像课文里的船，在有一定重量的时候是最安全的，在空的时候则是最危险的。","去年准备考试的时候，压力很大，但正是这种压力，让我每天都坚持学习。","所以，我们不应该害怕压力，而应该把压力变成动力。"],"good":["在有一定重量的时候是最安全的，在空的时候则是最危险的"],"vi":"Tôi thích áp lực, vì có áp lực mới có động lực. Như con tàu trong bài: có trọng lượng nhất định thì an toàn nhất, lúc rỗng là nguy hiểm nhất. Năm ngoái ôn thi áp lực rất lớn, nhưng chính áp lực đó giúp tôi ngày nào cũng kiên trì học. Vì vậy không nên sợ áp lực mà nên biến nó thành động lực."},{"who":"怎样减轻压力","meta":"Bài nói ~1 phút","p":["压力过大的时候，我们一定要想办法减轻压力。","首先，可以做做运动，比如跑步、游泳，让身体放松下来。","其次，可以和朋友聊聊天，把心里的话说出来。","只要方法正确，压力就能变成我们前进的动力。"],"good":["压力就能变成我们前进的动力"],"vi":"Khi áp lực quá lớn nhất định phải tìm cách giảm nhẹ. Trước hết, có thể tập thể thao như chạy bộ, bơi để cơ thể thả lỏng. Sau đó, trò chuyện với bạn bè, nói ra điều trong lòng. Chỉ cần đúng cách, áp lực có thể thành động lực tiến lên."}]},"WRITE":{"topic":"我喜欢／不喜欢压力","topic_vn":"Viết bài với đầu đề “Tôi thích / không thích áp lực”, nêu suy nghĩ của bạn. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","观点","Mở bài: bạn thích hay không thích áp lực.","我喜欢／不喜欢压力，因为……"],["②","理由","Lý do (có thể mượn hình ảnh con tàu trong bài).","就像课文里的船，……"],["③","例子","<b>Trọng tâm.<\/b> Một trải nghiệm cụ thể của bạn với áp lực.","去年……的时候，……"],["④","结论","Kết: nên đối mặt với áp lực thế nào.","所以，我们应该……"]],"samples":[{"who":"范文 1 · 我喜欢压力","title":"我喜欢压力","p":["我喜欢压力，因为有压力才会有动力。就像课文里的船，在有一定重量的时候是最安全的，在空的时候则是最危险的。去年准备HSK考试的时候，我的压力很大，但正是这种压力，让我每天都坚持学习，最后考出了好成绩。所以，我们不应该害怕压力。"],"vi":"Khoảng 115 chữ: dùng khung 好句 ……的时候是最……的，……则是最……的."},{"who":"范文 2 · 我不喜欢压力","title":"我不喜欢压力","p":["我不喜欢压力。压力太大的时候，我会变得很慌张，简直什么事都做不好。上个月公司的任务特别多，我每天加班，最后病倒了。我觉得，健康比什么都重要。我们应该学会减轻压力，保持工作和生活的平衡。"],"vi":"Khoảng 100 chữ: dùng 慌张、简直、平衡."},{"who":"范文 3 · 课本命题写作","title":"我喜欢压力","p":["很多人不喜欢压力，可是我却喜欢压力，因为我相信：有压力才会有动力。","课文里的老船长说：“船在有一定重量的时候是最安全的，在空的时候则是最危险的。”人也是一样。没有一点压力的人，常常做一天和尚撞一天钟，一遇到困难就被打翻了。","去年我准备考研究生，压力非常大，有时候紧张得睡不着觉。但是正是这种压力，让我每天都谨慎地安排时间，坚持学习。最后，我考上了理想的大学。","当然，压力也不能太大。所以我觉得，那些胸怀理想、有责任感的人，才能承受住压力，把压力变成前进的动力。"],"good":["船在有一定重量的时候是最安全的，在空的时候则是最危险的","做一天和尚撞一天钟","那些胸怀理想、有责任感的人，才能承受住压力"],"vi":"Khoảng 220 chữ. Ba chỗ gạch chân dùng lại câu của bài: ……的时候是最……的 · 做一天和尚撞一天钟 · 那些……的人，才能承受住压力."}],"tpl":"我喜欢／不喜欢压力\n我【喜欢／不喜欢】压力，因为【理由】。就像课文里的船，……。【一次经历】。所以，我们应该【……】。","chk":[["topic","Bám đề: có nói 压力","压力"],["view","Có quan điểm (喜欢 · 不喜欢 · 我觉得)","喜欢|我觉得|我认为"],["why","Có lý do / ví dụ (因为 · 就像 · 比如)","因为|就像|比如|去年|有一次|上个月"],["end","Có kết luận (所以 · 总之 · 应该)","所以|总之|应该"]],"w5":["恶劣","可怕","慌张","使劲","朝","简直","严肃","威胁","平衡","重量","相似","窄","游览","发抖","丝毫","风险","谨慎","承受","彻底"],"wmin":100,"wmax":200,"traps":"<b>Bắt buộc có:<\/b> quan điểm (thích hay không thích áp lực), lý do, một trải nghiệm cụ thể và câu kết. Mượn ít nhất một khung 好句 — xem 范文 3.","hw_note":"Đọc xong phần 背景, quay lại mục 4 để viết bài “我喜欢／不喜欢压力”."}};</script>
<script>
(function(){
"use strict";
var D=window.LESSON;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.style.cssText=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function han(s){return (String(s).match(/[一-鿿]/g)||[]).length;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var CIRC="①②③④⑤⑥⑦⑧⑨⑩";
/* theme */
(function(){var t=D.META.theme,r=document.documentElement.style;for(var k in t)r.setProperty("--"+k,t[k]);})();

var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){alert("Trình duyệt này không hỗ trợ đọc tiếng Trung.");return;}
  speechSynthesis.cancel();if(curBtn)curBtn.classList.remove("playing");
  var u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,"").replace(/【[^】]*】/g,"").replace(/_+|＿+|\{\d?\}/g,""));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=0.85;
  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}
  speechSynthesis.speak(u);
}
function spk(text,label){var b=el("button",{class:"spk",type:"button","aria-label":label||"Nghe"},SPK);b.addEventListener("click",function(e){e.stopPropagation();say(text,b);});return b;}
function spkHTML(text){return '<button class="spk" type="button" aria-label="Nghe" data-say="'+esc(text)+'">'+SPK+'</button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.getAttribute("data-say"),b);}},true);

/* ---------- generic MC ---------- */
function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};
Score.prototype.reset=function(){this.r=0;this.d=0;this.show();if(this.onchange)this.onchange();};
Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
  opts.forEach(function(o,i){var b=el("button",{class:"op",type:"button"},(opts.length>2||cls==="lab"?String.fromCharCode(65+i)+". ":"")+o);
    b.addEventListener("click",function(){if(q.classList.contains("done"))return;q.classList.add("done");
      $$(".op",q).forEach(function(x,j){if(j===ans)x.classList.add("ok");else if(j===i)x.classList.add("no");});
      if(score)score.hit(i===ans);});ops.appendChild(b);});
  q.appendChild(ops);if(ex)q.appendChild(el("div",{class:"ex"},"💡 "+ex));if(score)score.add();return q;}

var NL=D.NOLINK||[];var VORDER=V.filter(function(v){return NL.indexOf(v.hz)<0;}).map(function(v){return{hz:v.hz,i:v.i};});var AL=D.ALIAS||{};Object.keys(AL).forEach(function(k){var t=V.find(function(v){return v.hz===AL[k];});if(t)VORDER.push({hz:k,i:t.i});});VORDER.sort(function(a,b){return b.hz.length-a.hz.length;});
function linkVocab(text){var out="",i=0;while(i<text.length){var hit=null;for(var k=0;k<VORDER.length;k++){var w=VORDER[k].hz;if(text.substr(i,w.length)===w){hit=VORDER[k];break;}}
  if(hit){out+='<span class="vlink" data-v="'+hit.i+'">'+esc(hit.hz)+'</span>';i+=hit.hz.length;}else{out+=esc(text[i]);i++;}}return out;}
function linkText(text){var goods=(D.GOOD||[]).map(function(g,i){return{i:i,zh:g.zh};});var out="",i=0;
  while(i<text.length){var g=null;for(var k=0;k<goods.length;k++){if(text.substr(i,goods[k].zh.length)===goods[k].zh){g=goods[k];break;}}
    if(g){out+='<span class="good" data-g="'+g.i+'">'+linkVocab(g.zh)+'</span>';i+=g.zh.length;continue;}
    var j=text.length;goods.forEach(function(gg){var p=text.indexOf(gg.zh,i);if(p>=0&&p<j)j=p;});
    out+=linkVocab(text.slice(i,j));i=j;}return out;}
