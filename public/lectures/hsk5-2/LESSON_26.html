<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 26 · 你属于哪一种“忙”？ · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

,"nô lệ",0,"为奴隶主劳动而没有人身自由的人；比喻完全被某种事物控制的人。","……人几乎成了工作的奴隶……",null,null,["工作的奴隶"],""],["虚伪","xūwèi","形","giả dối, không thật",0,"不真实，不实在；作假。","……第三种忙，忙得有些虚伪……",null,null,[],""],["思想","sīxiǎng","名","ý nghĩ, tư tưởng",0,"念头，想法。","……因为在他们的思想中……",null,null,[],""],["反省","fǎnxǐng","动","tự kiểm điểm, tự xét lại",1,"回想自己的思想行为，检查其中的错误。","……我们不一定知道正确的道路是什么，但时时反省、总结……","做错了事，要好好反省一下。","Làm sai thì phải tự kiểm điểm cho nghiêm túc.",["时时反省"],""],["据说","jùshuō","动","nghe nói, nghe đồn",1,"根据别人说，据别人说。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。","据说这家饭馆的菜特别好吃。","Nghe nói món ăn ở quán này đặc biệt ngon.",[],""],["个性","gèxìng","名","cá tính",1,"在一定的社会条件和教育影响下形成的一个人比较固定的特性。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。","她是一个很有个性的女孩儿。","Cô ấy là một cô gái rất có cá tính.",["很有个性"],""],["冒险","mào xiǎn","动","mạo hiểm",1,"不顾危险地进行某种活动。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。","我找刘明天来当导演，其实是有点儿冒险的。","Tôi tìm Lưu Minh Thiên làm đạo diễn, thật ra hơi mạo hiểm.",["爱冒险","冒险的事"],""],["丛林","cónglín","名","rừng cây, rừng rậm",0,"茂密的树林。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。",null,null,["南美丛林"],""],["文明","wénmíng","名","nền văn minh",0,"文化。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。",null,null,["印加文明"],""],["纪录","jìlù","名／动","tài liệu ghi tại chỗ; ghi lại",0,"记载；在一定时期、一定范围以内记载下来的最高成绩。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。",null,null,["纪录片"],""],["雇","gù","动","thuê, mướn",0,"出钱让人给自己做事。","他雇了20来个当地人为他带路和搬运行李。",null,null,["雇人"],""],["来","lái","助","khoảng (sau số từ)",1,"用在“十、百、千”等数词或数量词后表示概数。","他雇了20来个当地人为他带路和搬运行李。","按照老人教的方法，他几乎每天都能钓到5斤来重的大鱼。","Theo cách ông lão dạy, hầu như ngày nào anh ấy cũng câu được con cá to nặng khoảng 5 cân.",["20来个","一来……，二来……"],"见“注释”：来。"],["批","pī","量","tốp, nhóm, đợt",0,"用于大宗的货物或数量较多的人。","这批当地人个个都表现出色，尽管他们背着重重的行李，但他们的脚力过人，健步如飞。",null,null,["这批当地人","一批货"],""],["出色","chūsè","形","xuất sắc",1,"特别好，超出一般的。","这批当地人个个都表现出色，尽管他们背着重重的行李，但他们的脚力过人，健步如飞。","他顶住了压力，出色地发挥了自己的水平，打败了强敌。","Anh ấy chịu được áp lực, phát huy xuất sắc trình độ, đánh bại đối thủ mạnh.",["表现出色","出色地完成"],"“出色” có thể làm trạng ngữ (出色地完成); “优秀” chủ yếu làm định ngữ, vị ngữ. (练习 2)"],["健步如飞","jiànbù-rúfēi","成","bước đi mạnh mẽ, thoăn thoắt",0,"脚步矫健，走得飞快。","这批当地人个个都表现出色，尽管他们背着重重的行李，但他们的脚力过人，健步如飞。",null,null,[],""],["一连","yìlián","副","liên tiếp, liền",1,"表示动作连续不断或情况连续发生。","一连三天，他们都很顺利地实现了原定的计划。","一连下了三天雨，衣服都干不了。","Mưa liền ba ngày, quần áo không khô được.",["一连三天"],""],["耽误","dānwu","动","làm chậm trễ, để lỡ",1,"因拖延或错过时机而误事。","……一来，耽误了时间……","因为有大雾，飞机不能起飞。耽误了您的宝贵时间，非常抱歉！","Vì sương mù, máy bay không cất cánh được. Làm lỡ thời gian quý báu của quý khách, thành thật xin lỗi!",["耽误时间","耽误工作"],""],["至于","zhìyú","动／介","đến mức; còn (về)",1,"表示达到某种程度；表示另提一事。","……至于这部影片的投资人……","我只知道他是六班的学生，至于住在哪儿，我就不清楚了。","Tôi chỉ biết cậu ấy là học sinh lớp 6, còn ở đâu thì tôi không rõ.",["至于……"],"见“注释”：至于。"],["投资","tóu zī","动／名","đầu tư",1,"为达到一定目的而投入资金；投入的资金。","……会因为费用增加而让投资人不高兴……","很多公司都在这个城市投资。","Nhiều công ty đều đầu tư vào thành phố này.",["投资人","长期投资"],""],["人物","rénwù","名","nhân vật, người có vai vế",0,"在某方面有代表性或具有突出特点的人。","……至于这部影片的投资人，可是一位大人物……",null,null,["大人物"],""],["得罪","dézuì","动","làm phật lòng, xúc phạm",1,"使人不快或怀恨。","……可是一位大人物，他可不敢得罪。","他说话太直，常常得罪人。","Anh ấy nói chuyện quá thẳng, hay làm mất lòng người khác.",["不敢得罪"],""],["总算","zǒngsuàn","副","cuối cùng, nói chung",1,"表示经过相当长的时间以后某种愿望终于实现；表示大体上还过得去。","……大导演总算搞明白了……","总算把活儿干完了，可把我累坏了。","Cuối cùng cũng làm xong việc, mệt rã rời.",["总算搞明白了","总算不错"],"辨析：总算—终于。见“搭配 · 辨析”。"],["搞","gǎo","动","làm, tạo ra",1,"做；干；从事；设法获得。","……大导演总算搞明白了……","你怎么搞的？不是说好了周末和小丽见面的吗？","Bạn làm sao vậy? Chẳng phải đã hẹn cuối tuần gặp Tiểu Lệ sao?",["搞明白","搞错了"],""],["习俗","xísú","名","tập tục",0,"习惯和风俗。","……当地人自古就有一种习俗……",null,null,[],""],["灵魂","línghún","名","linh hồn, tâm hồn",0,"心灵，思想。","“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”",null,null,[],""],["疲劳","píláo","形","mệt mỏi, mệt nhọc",1,"因体力或脑力消耗过多而需要休息。","“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”","连续工作了十几个小时，他感到非常疲劳。","Làm việc liên tục hơn chục tiếng, anh ấy thấy vô cùng mệt mỏi.",["疲劳的身体"],""],["哲理","zhélǐ","名","triết lý",0,"关于宇宙和人生的原理。","多么富有哲理的话！",null,null,["富有哲理"],""],["提倡","tíchàng","动","đề xướng, chủ trương",1,"指出事物的优点鼓励大家使用或实行。","在这个提倡和鼓励竞争的时代……","现在饭馆都提倡节约，不浪费食物。","Hiện nay các nhà hàng đều khuyến khích tiết kiệm, không lãng phí thức ăn.",["提倡节约","大力提倡"],""],["步骤","bùzhòu","名","bước",0,"事情进行的程序。","……少了思考、总结这一重要的步骤。",null,null,["重要的步骤"],""],["闭关","bìguān","动","bế quan, tĩnh cư",0,"闭门谢客，断绝与外界的交往。","从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。",null,null,[],""],["一律","yílǜ","副","nhất loạt, hết thảy",1,"适用于全体，无例外。","……包括家人在内的任何人他都一律不见……","按规定，小动物一律不准带上飞机。","Theo quy định, động vật nhỏ nhất loạt không được mang lên máy bay.",["一律不见"],"“一律” nhấn mạnh không có ngoại lệ (theo quy định); “都” chỉ bao quát chung. (练习 2)"],["寂寞","jìmò","形","cô đơn, cô độc",1,"孤单冷清。","盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式。","她有些寂寞，想让我到她那儿陪她聊聊天。","Cô ấy hơi cô đơn, muốn tôi đến chỗ cô ấy trò chuyện cùng.",["寂寞难耐","寂寞的心情"],""],["效率","xiàolǜ","名","năng suất, hiệu suất",1,"单位时间内完成的工作量。","盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式。","他做事效率很高，一个上午就完成了。","Anh ấy làm việc năng suất rất cao, một buổi sáng đã xong.",["高效率","效率很高"],""],["印加","Yìnjiā","专名","đế chế Inca",0,"美洲古代国家。","据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。",null,null,[],""],["比尔·盖茨","Bǐ'ěr Gàicí","专名","Bill Gates",0,"人名。","从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。",null,null,[],""]],"WARM":[{"tab":"图片说什么","title":"你觉得这幅图片想告诉我们什么？","type":"discuss","q":"图片上，一个戴眼镜的男人坐在电脑前，两只手各拿着一个电话，嘴里还在大声说话，看起来忙得不得了。你觉得这幅图片想告诉我们什么？说说你对这幅图片的理解。","vn":"Sách dùng một bức tranh: người đàn ông đeo kính ngồi trước máy tính, hai tay cầm hai chiếc điện thoại, miệng nói to, trông bận tối mắt. Theo bạn bức tranh muốn nói gì?","answer_zh":"我觉得这幅图片想告诉我们，现代人的工作太忙了，常常被事情追着跑，几乎成了工作的奴隶。这样忙下去，不但效率不高，身体也会受不了。我们应该学会安排时间，忙而不乱。","answer_vn":"Từ hữu ích: 忙碌 (bận rộn), 被动 (bị động), 奴隶 (nô lệ), 效率 (hiệu suất), 忙而不乱 (bận mà không rối), 安排时间 (sắp xếp thời gian)."},{"tab":"出行词语","title":"找出跟“出行”有关的词语","type":"words","task":"请试着找出本课跟“出行”有关的词语，并说说这些词之间有什么关系。其他你知道的词也可以写下来。（例：行李）","task_vn":"Tìm trong bài những từ liên quan đến “đi lại, du hành” và nói chúng liên quan với nhau thế nào; có thể thêm các từ khác bạn biết.","groups":[{"title":"本课生词中的","given":0,"items":[["冒险","mạo hiểm"],["丛林","rừng rậm"],["健步如飞","bước đi thoăn thoắt"],["一连","liên tiếp"],["疲劳","mệt mỏi"]]},{"title":"其他你知道的","given":1,"items":[["行李","hành lý"],["导游","hướng dẫn viên"],["地图","bản đồ"],["护照","hộ chiếu"],["日程","lịch trình"]]}]}],"GAME":{"fill":[["工作中的{}大概可以分为三种……","忙碌",["忙碌","辛苦","紧张","劳动"]],["第一种忙，忙得很{}……","被动",["被动","主动","活动","感动"]],["但时时{}、总结……","反省",["反省","反对","反应","省略"]],["曾经有一位很有{}、极爱冒险的大导演……","个性",["个性","性格","个人","性别"]],["这批当地人个个都表现{}……","出色",["出色","颜色","特色","优秀"]],["{}三天，他们都很顺利地实现了原定的计划。","一连",["一连","一直","连续","一起"]],["一来，{}了时间……","耽误",["耽误","错误","误会","拖延"]],["他可不敢{}。","得罪",["得罪","犯罪","得到","罪人"]],["大导演{}搞明白了……","总算",["总算","总是","计算","打算"]],["包括家人在内的任何人他都{}不见……","一律",["一律","规律","一直","法律"]]],"order":[["你属于|哪种|忙呢？"],["然而，|当地人|却拒绝行动。"],["多么|富有哲理的|话！"],["他会把自己|关在|一所房子里"],["忙碌的人们，|请多给自己|一点思考的时间吧。"],["人是|工作的|主人"]]},"GOOD":[{"zh":"我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远","vn":"chúng ta không nhất định biết con đường đúng là gì, nhưng thường xuyên tự xét lại, tổng kết thì có thể giúp ta không đi quá xa trên con đường sai","why":"Câu đạo lý <b>……不一定……，但……，却可以使……<\/b> — thừa nhận hạn chế rồi đưa ra giải pháp.","frame":"我们不一定……，但……，却可以使我们……","apply":"我们不一定能改变环境，但改变自己的态度，却可以使我们生活得更快乐。","apply_vn":"Chúng ta không nhất định thay đổi được hoàn cảnh, nhưng thay đổi thái độ của mình thì có thể giúp ta sống vui hơn."},{"zh":"当大导演进一步询问原因时，当地人的回答令他受益终生","vn":"khi đại đạo diễn hỏi kỹ thêm nguyên nhân, câu trả lời của người địa phương khiến ông được lợi suốt đời","why":"Câu dẫn tới đạo lý: <b>当……时，……令……受益终生<\/b> — tạo sự tò mò trước khi nêu bài học.","frame":"当……时，……令……受益终生","apply":"当我遇到困难时，老师的一句话令我受益终生。","apply_vn":"Khi tôi gặp khó khăn, một câu nói của thầy giáo khiến tôi được lợi suốt đời."},{"zh":"我们常常只顾低头拉车，却少了抬头看路","vn":"chúng ta thường chỉ cắm đầu kéo xe mà thiếu ngẩng đầu nhìn đường","why":"Ẩn dụ <b>只顾低头拉车，却少了抬头看路<\/b> — chỉ biết làm mà không nghĩ về phương hướng.","frame":"只顾……，却少了……","apply":"很多学生只顾做题，却少了总结方法的时间。","apply_vn":"Nhiều học sinh chỉ lo làm bài, mà thiếu thời gian tổng kết phương pháp."},{"zh":"盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式","vn":"kiểu “bế quan” cô đơn khó chịu nổi này của Gates không chỉ là một cách nghỉ ngơi, mà còn là một cách làm việc hiệu quả cao","why":"Tăng tiến <b>……不只是……，更是……<\/b> — nâng ý nghĩa của sự việc.","frame":"……不只是……，更是……","apply":"读书不只是一种爱好，更是一种生活方式。","apply_vn":"Đọc sách không chỉ là một sở thích, mà còn là một lối sống."}],"GRAMMAR":[{"word":"来","py":"lái","pos":"助词","forms":["数词（十、百、千……）+ 来 + 量词：表示概数（20来个人）","一来……，二来……：列出理由"],"vn":"<b>来<\/b> (trợ từ): ① đặt sau số <b>十, 百, 千<\/b>… hoặc số + lượng từ, chỉ <b>số ước lượng — khoảng, chừng<\/b>: 20来个人 (khoảng 20 người), 5斤来重 (nặng chừng 5 cân); ② <b>一来……，二来……<\/b>: một là…, hai là… — liệt kê lý do.","text":"他雇了20来个当地人为他带路和搬运行李。","ex":[["按照老人教的方法，他几乎每天都能钓到5斤来重的大鱼。","Theo cách ông lão dạy, hầu như ngày nào anh ấy cũng câu được cá to nặng chừng 5 cân."],["今天是大年三十，我们来看看大家，一来是给大家送水果，二来是看看大家过节还有什么难处。","Hôm nay là đêm Ba mươi, chúng tôi đến thăm mọi người, một là tặng hoa quả, hai là xem mọi người đón Tết còn khó khăn gì."],["我对上海很有感情，一来上大学时在那里住过几年，二来我太太也是上海人。","Tôi có tình cảm với Thượng Hải, một là hồi đại học từng sống ở đó vài năm, hai là vợ tôi cũng là người Thượng Hải."]],"book_title":"练一练：完成句子或对话（来）","book":[["这所学校是小班上课，每个班______________。","","这所学校是小班上课，每个班只有十来个学生"],["四川好玩儿的地方可多了，去旅游______________。","","四川好玩儿的地方可多了，去旅游至少要十来天"],["A：你下班走路回家？为什么不坐车呢？<br>B：______________。（一来……，二来……）","","一来走路可以锻炼身体，二来下班的时候路上太堵了"]],"drill":[["Câu nào đúng?",["他买了十来本书。","他买了十本来书。"],0,"Số + 来 + lượng từ."],["“一来……，二来……”用来：",["列出理由","表示时间先后"],0,"Liệt kê lý do."]]},{"word":"至于","py":"zhìyú","pos":"动词／介词","forms":["动词：（不）至于 + ……：表示达到某种程度，多用于反问句","介词：（A）……，至于（B）……：表示另提一事"],"vn":"<b>至于<\/b>: ① động từ — <b>đến mức<\/b>, thường dùng trong câu hỏi tu từ: 你至于生那么大的气吗？(Có đến mức phải giận thế không?); ② giới từ — <b>còn (về)<\/b>: A……，至于 B…… — chuyển sang nhắc một chuyện khác.","text":"至于这部影片的投资人，可是一位大人物，他可不敢得罪。","ex":[["我只是和你开个玩笑，你至于生那么大的气吗？","Tôi chỉ đùa với bạn thôi, có đến mức giận thế không?"],["什么？一件衬衫要一千来块钱。哪至于那么贵呢？","Gì cơ? Một chiếc áo sơ mi khoảng nghìn tệ. Đâu đến mức đắt thế?"],["我只知道他是六班的学生，至于住在哪儿，我就不清楚了。","Tôi chỉ biết cậu ấy là học sinh lớp 6, còn ở đâu thì tôi không rõ."]],"book_title":"练一练：完成句子或对话（至于）","book":[["我只记得他说过要去买礼物，______________。","","我只记得他说过要去买礼物，至于买什么，他没告诉我"],["我刚毕业，现在最重要的是找到工作，______________。","","我刚毕业，现在最重要的是找到工作，至于工资多少，我不太在意"],["A：听说李阳病了，明天的活动他恐怕参加不了了。<br>B：______________。","","只是感冒，不至于那么严重吧"]],"drill":[["选择：你们两口子吵架归吵架，不____要闹离婚吧？",["至于","关于"],0,"不至于 = không đến mức."],["“至于住在哪儿，我就不清楚了”中，“至于”表示：",["另提一事","达到某种程度"],0,"Giới từ: còn về…."]]},{"word":"总算","py":"zǒngsuàn","pos":"副词","forms":["总算 + 动词：经过相当长的时间以后，某种愿望终于实现","总算 + 形容词／动词：大体上还过得去"],"vn":"<b>总算<\/b> (phó từ): ① <b>cuối cùng thì (cũng)<\/b> — sau một thời gian khá dài, điều mong muốn đã thành hiện thực; ② <b>xem như, cũng tạm<\/b> — nhìn chung cũng tạm được.","text":"经过沟通，大导演总算搞明白了","ex":[["总算把活儿干完了，可把我累坏了。","Cuối cùng cũng làm xong việc, mệt rã rời."],["虽然我对这家宾馆不太满意，但总算有个睡觉的地方了。","Tuy không hài lòng khách sạn này lắm, nhưng xem như cũng có chỗ ngủ."],["临走前能和你见上一面，这趟总算没有白来！","Trước khi đi được gặp bạn một lần, chuyến này xem như không uổng công!"]],"book_title":"练一练：完成句子或对话（总算）","book":[["______________，但没有选择回老家，而是留在这里打工。","","他总算找到了一份工作，但没有选择回老家，而是留在这里打工"],["A：李强的咖啡馆准备了半年，又是装修，又是办各种手续，真不容易。<br>B：是啊！______________。","","是啊！现在总算开业了"],["A：琳琳这次化学考了78分，比期中考试提高了10分呢。<br>B：化学是她最头疼的科目了，______________。","","化学是她最头疼的科目了，这次总算有进步了"]],"drill":[["选择：等了两个小时，公共汽车____来了。",["总算","总是"],0,"Cuối cùng cũng đến → 总算."],["“总算”后面的结果一般是：",["希望发生的","不希望发生的"],0,"总算 thường là kết quả mong muốn."]]}],"HSK":{"r1":[{"text":["小刘是公司里最忙的人，每天第一个来，最后一个走。可是一年下来，{36}。经理找他谈话，发现他每天都在做一些不重要的事，{37}。经理建议他每天上班前先花十分钟想一想今天最重要的三件事。{38}，小刘的工作效率提高了很多。"],"qs":[{"n":36,"o":["他升职了","他的业绩却很一般","他变得很轻松","他得了很多奖"],"a":1,"why":"“可是”表示转折：很忙，但结果不好。"},{"n":37,"o":["真正重要的工作反而被耽误了","而且做得很出色","因此同事们都很佩服他","所以经理很满意"],"a":0,"why":"做不重要的事 → 重要的事被耽误。"},{"n":38,"o":["一年以前","从来","当时","一个月以后"],"a":3,"why":"建议实行后一段时间的结果。"}]},{"text":["现在很多人都说自己“忙”，{39}。有人忙着工作，有人忙着学习，还有人每天忙着看手机。专家认为，{40}。真正会安排时间的人，{41}。他们会在忙碌中给自己留一点思考的时间，想一想自己做的事是不是有价值。所以，{42}。"],"qs":[{"n":39,"o":["但是大家都很闲","因此很快乐","好像不忙就是失败","所以没有人工作"],"a":2,"why":"与课文“把闲与失败联系到一起”一致。"},{"n":40,"o":["忙并不等于有效率","越忙越好","看手机最重要","人应该少工作"],"a":0,"why":"后文说会安排时间的人忙而不乱。"},{"n":41,"o":["从来不休息","总是很被动","往往忙而不乱","常常耽误事情"],"a":2,"why":"会安排时间 → 忙而不乱。"},{"n":42,"o":["我们应该更忙一点","思考是浪费时间","忙碌的人都会成功","我们不能只顾忙，还要学会思考"],"a":3,"why":"总结全文。"}]}],"r2":[{"start":46,"paras":["可是到了第四天，他们却拒绝继续往前走。","一位导演雇了一批当地人帮他搬运行李。","导演问为什么，他们说：“我们要让灵魂追上我们的身体。”","前三天，他们背着重重的行李，走得非常快。","导演听了，觉得这句话很有哲理。"],"ans":["B","D","A","C","E"],"why":"雇人（B）→ 前三天（D）→ 第四天拒绝（A）→ 询问原因（C）→ 导演的感受（E）。"}],"r3":[{"text":["你有没有这样的经历：一整天都很忙，可是晚上回想起来，却不知道自己到底做了什么？心理学家把这种情况叫做“虚假忙碌”。","研究发现，很多人习惯同时做好几件事，比如一边开会一边回邮件，一边写报告一边看手机。他们觉得这样可以节省时间，<u><b>其实却是在浪费时间<\/b><\/u>。因为人的注意力是有限的，不断地在几件事之间换来换去，反而会让每件事都做不好。","专家建议，每天开始工作以前，先花几分钟列出最重要的几件事，然后一件一件地完成。另外，每工作一段时间，就停下来休息一会儿，反省一下自己的工作方法。","这样做，虽然看起来没有以前那么忙了，但工作效率会提高很多。"],"qs":[{"n":56,"s":"“虚假忙碌”指的是：","o":["很忙却不知道自己做了什么","假装很忙","一点儿也不忙","忙着休息"],"a":0,"why":"第一段。"},{"n":57,"s":"为什么说同时做几件事“其实却是在浪费时间”？","o":["注意力有限，换来换去反而做不好","开会没有用","邮件太多","手机太贵"],"a":0,"why":"第二段最后一句。"},{"n":58,"s":"专家建议开始工作以前先：","o":["列出最重要的几件事","看看手机","休息一个小时","开一个会"],"a":0,"why":"第三段。"},{"n":59,"s":"这篇文章主要告诉我们：","o":["忙不等于高效率，要学会安排和反省","要同时做很多事","工作越忙越好","不要工作"],"a":0,"why":"全文主旨。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出小王的变化。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể về sự thay đổi của Tiểu Vương.","panels":[["📞","小王每天都很忙，一边打电话一边看电脑，桌子上的文件堆得像山一样。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><rect width=\"320\" height=\"240\" fill=\"#f3efe6\"/><rect y=\"185\" width=\"320\" height=\"55\" fill=\"#d9c7aa\"/><path d=\"M0 185 H320\" stroke=\"#d2b48c\" stroke-w idth=\"2\" fill=\"none\"/><path d=\"M0 -4 h10\" stroke=\"#999\" stroke-width=\"1.5\"/><path d=\"M-10 4 l3 3 l5 -6\" stroke=\"#3aa35b\" stroke-width=\"2\" fill=\"none\"/><path d=\"M0 5 h10\" stroke=\"#999\" stroke-width=\"1.5\"/><\/g><g transform=\"translate(240.0,214.0) scale(-1.0,1.0)\"><path d=\"M-4 -62 L-14 -4 M4 -62 L12 -4\" stroke=\"#3d4a66\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M-20 -2 h9 M10 -2 h10\" stroke=\"#2d2626\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#ffffff\"/><path d=\"M-14 -106 L-32 -110 L-32 -140\" stroke=\"#ffffff\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-32\" cy=\"-140\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M14 -106 L20 -88 L26 -84\" stroke=\"#ffffff\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"26\" cy=\"-84\" r=\"4\" fill=\"#f6d1b1\"/><circle cx=\"-16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"-129\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"-130\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -131 q-1 -19 17 -19 q18 0 17 19 q-4 -9 -10 -10 q-10 3 -24 10z\" fill=\"#2b2420\"/><circle cx=\"-5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-131\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-6 -125 q6 8 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"-126\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><g fill=\"none\" stroke=\"#3b2f2f\" stroke-width=\"1.3\"><circle cx=\"-6\" cy=\"-131\" r=\"4.6\"/><circle cx=\"6\" cy=\"-131\" r=\"4.6\"/><path d=\"M-1.4 -131 h2.8\"/><\/g><g transform=\"translate(26,-84)\"><g transform=\"translate(0.0,0.0)\"><path d=\"M-6 -8 q6 -10 12 0\" stroke=\"#2f6fd6\" stroke-width=\"2\" fill=\"none\"/><rect x=\"-11\" y=\"-8\" width=\"22\" height=\"16\" rx=\"3\" fill=\"#2f6fd6\"/><\/g><\/g><\/g><g transform=\"translate(270.0,70.0)\"><g transform=\"translate(0.0,0.0)\"><path d=\"M0 0 v-16 l10 -3 v14\" stroke=\"#7c5cd6\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"-2.5\" cy=\"0\" r=\"3.3\" fill=\"#7c5cd6\"/><circle cx=\"7.5\" cy=\"-5\" r=\"3.3\" fill=\"#7c5cd6\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: bận rối → hiệu suất thấp, bị phê bình → ngồi suy nghĩ, tự xét lại → thay đổi cách làm, bận mà không rối.","Có thể dùng: 忙碌、被动、奴隶、耽误、反省、总结、效率、忙而不乱."],"sample":"小王在一家公司工作，每天都非常忙碌。他常常一边打电话一边看电脑，桌子上的文件堆得像山一样，几乎成了工作的奴隶。虽然他每天都加班到很晚，可是工作效率却很低，常常耽误事情，还被经理批评了好几次。一个周末，他一个人坐在公园里，安静地反省自己的工作方法。他发现，自己每天都在做很多不重要的事。从那以后，小王每天上班前都先列出最重要的几件事，一件一件地完成。现在，他忙而不乱，每天都能按时下班去运动了。","svn":"Tiểu Vương bận rối, vừa gọi điện vừa xem máy tính, giấy tờ chất đống; tăng ca mà hiệu suất thấp, bị phê bình; cuối tuần ngồi ở công viên tự xét lại cách làm; sau đó mỗi ngày liệt kê việc quan trọng trước, bận mà không rối, đúng giờ tan làm đi tập thể thao."},"w72":{"prompt":"有人说：“越忙越成功。”你同意这种看法吗？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói “càng bận càng thành công”. Bạn có đồng ý không? Viết bài không ít hơn 200 chữ.","min":200,"title":"忙与成功","tips":["Không đồng ý → 首先 có ba kiểu bận, bận bị động không thành công → 其次 cần thời gian suy nghĩ (Bill Gates bế quan) → 另外 cần nghỉ ngơi (người địa phương nghỉ ngày thứ tư) → 总之.","Dùng: 只顾……却少了……；不一定……但……却可以使……；不只是……更是……"],"sample":"有人说：“越忙越成功。”我不同意这种看法。\n首先，忙有很多种。有的人忙得很被动，总是被事情追着跑，几乎成了工作的奴隶；有的人只是想让别人觉得自己很忙。这样的忙碌，并不能带来成功。\n其次，成功需要思考。比尔·盖茨每年都要“闭关”两次，专门用来思考。他的“闭关”不只是一种休息方式，更是一种高效率的工作方式。如果我们只顾低头拉车，却少了抬头看路，就很容易在错误的道路上越走越远。\n另外，人也需要休息。就像课文里的当地人，每走三天就要休息一天，让灵魂追得上疲劳的身体。\n总之，成功的关键不是忙，而是会安排、会思考。忙而不乱的人，才更容易成功。","svn":"Nghị luận: không đồng ý → 首先 có nhiều kiểu bận, bận bị động không mang lại thành công → 其次 thành công cần suy nghĩ (Bill Gates) → 另外 cần nghỉ ngơi (người địa phương) → 总之 then chốt là biết sắp xếp, biết suy nghĩ."}},"PRACTICE":{"ex1":{"bank":["寂寞","至于","耽误","提倡","一律","出色"],"items":[["现在饭馆都{}节约，不浪费食物，“光盘”的意思就是把点的菜吃光。",["提倡"]],["上次约刘经理见面，路上堵车，{}了很长时间，这次可别再出问题了。",["耽误"]],["按规定，小动物{}不准带上飞机。",["一律"]],["她有些{}，想让我到她那儿陪她聊聊天。",["寂寞"]],["他顶住了压力，{}地发挥了自己的水平，打败了强敌。",["出色"]],["你们两口子吵架归吵架，不{}要闹离婚吧？",["至于"]]]},"ex2":[["为了保证病人的休息，午饭后____不准探视。",["一律","都"],0,"Quy định không ngoại lệ → 一律."],["你怎么____的？不是说好了周末和小丽见面的吗？怎么又不去了？",["搞","做"],0,"怎么搞的 = làm sao vậy (cách nói khẩu ngữ cố định)."],["因为有大雾，飞机不能起飞。____了您的宝贵时间，非常抱歉！",["耽误","影响"],0,"耽误时间 = làm lỡ thời gian."],["马向阳在那儿当县长时，____地完成了任务。",["出色","优秀"],0,"Làm trạng ngữ: 出色地完成."]],"ex3":[["看到房间满是灰尘，他发起<u>A<\/u>了愁，刚<u>B<\/u>坐了十<u>C<\/u>个<u>D<\/u>小时火车，实在没力气收拾了。","来",2,"看到房间满是灰尘，他发起了愁，刚坐了十来个小时火车，实在没力气收拾了。"],["我<u>A<\/u>找刘明天来<u>B<\/u>当导演，其实是<u>C<\/u>有点儿<u>D<\/u>的。","冒险",3,"我找刘明天来当导演，其实是有点儿冒险的。"],["<u>A<\/u>按学校<u>B<\/u>规定，缺课60节以上的学生<u>C<\/u>不允许<u>D<\/u>参加考试。","一律",2,"按学校规定，缺课60节以上的学生一律不允许参加考试。"],["小丽<u>A<\/u>地完成了<u>B<\/u>比赛的各项动作，<u>C<\/u>取得了第一名<u>D<\/u>的好成绩。","出色",0,"小丽出色地完成了比赛的各项动作，取得了第一名的好成绩。"]],"ex4":[["三种“忙”","被动、奴隶、主动、虚伪","第一种忙很被动，人成了工作的奴隶；第二种忙很主动，人是工作的主人；第三种忙有些虚伪，他们把忙和成功联系在一起，总想办法让自己忙。"],["大导演的拍摄经历","纪录片、雇、出色、一连、耽误、投资、沟通、灵魂","一位大导演到南美丛林拍纪录片，雇了20来个当地人。他们表现出色，一连三天都很顺利。第四天他们拒绝行动，导演怕耽误时间、让投资人不高兴。经过沟通才知道，他们每走三天要休息一天，为了让灵魂追上疲劳的身体。"],["比尔·盖茨的“闭关”","为期、一律、寂寞、效率、思考","比尔·盖茨每年进行两次为期一周的“闭关”，任何人都一律不见。这种寂寞的“闭关”不只是休息，更是一种高效率的工作方式。我们也应该多给自己一点思考的时间。"]],"ext":{"title":"扩展 · 话题：社会关系 · 婚恋","words":[["演讲","yǎnjiǎng","diễn thuyết"],["发言","fāyán","phát biểu"],["宴会","yànhuì","yến tiệc"],["嘉宾","jiābīn","khách mời"],["证件","zhèngjiàn","giấy tờ"],["名片","míngpiàn","danh thiếp"],["嫁","jià","lấy chồng"],["娶","qǔ","lấy vợ"],["分手","fēn shǒu","chia tay"],["怀孕","huái yùn","mang thai"],["吻","wěn","hôn"]],"items":[["这是我的{}，我们保持联系，希望将来有机会一起合作。","名片"],["明天，希望公司的总裁刘明先生来学校{}，你想去听听吗？","演讲"],["老师，请问我报名时，都需要带什么{}啊？","证件"],["出席开幕式的{}都联系好了。","嘉宾"]]}},"TEXT":[{"title":"三种忙","sub":"你属于哪种忙呢？","paras":["工作中的忙碌大概可以分为三种：第一种忙，忙得很被动，总是被事情追着、赶着，人几乎成了工作的奴隶；第二种忙，忙得很主动，忙而不乱，人是工作的主人；第三种忙，忙得有些虚伪，因为在他们的思想中，已经把忙与成功、闲与失败联系到一起，所以，这样的人总是想办法让自己忙。","你属于哪种忙呢？","我有一个体会：现实中，我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远。"],"idea":"Sự <b>bận rộn<\/b> trong công việc chia làm ba kiểu: ① bận <b>bị động<\/b> — luôn bị công việc đuổi theo, người gần như thành <b>nô lệ<\/b> của công việc; ② bận chủ động — bận mà không rối, người là chủ của công việc; ③ bận hơi <b>giả tạo<\/b> — trong <b>suy nghĩ<\/b> đã gắn bận với thành công, nhàn với thất bại, nên luôn tìm cách làm mình bận. Tác giả rút ra: ta không chắc biết con đường đúng là gì, nhưng thường xuyên <b>tự xét lại<\/b>, tổng kết thì sẽ không đi quá xa trên con đường sai.","qs":[["第一种忙是什么样的？",["忙而不乱，人是工作的主人","很被动，人几乎成了工作的奴隶","想办法让自己忙"],1],["第三种人为什么总是想办法让自己忙？",["因为工作太多","因为他们把忙与成功联系到一起","因为他们喜欢工作"],1],["作者认为时时反省、总结有什么好处？",["能找到正确的道路","可以不在错误的道路上走得太远","能让人更忙"],1]]},{"title":"丛林里的故事","sub":"当地人拒绝行动","paras":["据说，曾经有一位很有个性、极爱冒险的大导演到南美丛林拍有关古代印加文明的纪录片。他雇了20来个当地人为他带路和搬运行李。这批当地人个个都表现出色，尽管他们背着重重的行李，但他们的脚力过人，健步如飞。一连三天，他们都很顺利地实现了原定的计划。到了第四天，大导演一早醒来就催着大家上路。然而，当地人却拒绝行动。大导演非常着急，一来，耽误了时间，日程就得重新安排；二来，会因为费用增加而让投资人不高兴，至于这部影片的投资人，可是一位大人物，他可不敢得罪。经过沟通，大导演总算搞明白了，当地人自古就有一种习俗：在赶路时，用尽全力地向前冲，但每走上三天，便要休息一天。当大导演进一步询问原因时，当地人的回答令他受益终生。"],"idea":"<b>Nghe nói<\/b> có một đại đạo diễn rất <b>cá tính<\/b>, thích <b>mạo hiểm<\/b>, đến <b>rừng rậm<\/b> Nam Mỹ quay phim <b>tài liệu<\/b> về <b>nền văn minh<\/b> Inca cổ. Ông <b>thuê<\/b> <b>khoảng<\/b> 20 người địa phương dẫn đường, khuân hành lý. <b>Tốp<\/b> người này ai cũng làm <b>xuất sắc<\/b>, vác nặng mà vẫn <b>đi thoăn thoắt<\/b>; <b>liền<\/b> ba ngày đều đúng kế hoạch. Sáng ngày thứ tư, đạo diễn giục lên đường thì họ từ chối. Ông rất sốt ruột: một là <b>lỡ<\/b> thời gian, phải xếp lại lịch; hai là chi phí tăng khiến nhà <b>đầu tư<\/b> không vui — <b>còn<\/b> nhà đầu tư lại là một <b>nhân vật<\/b> lớn, ông không dám <b>làm phật lòng<\/b>. Sau khi trao đổi, ông <b>cuối cùng<\/b> cũng <b>hiểu<\/b> ra: người địa phương có <b>tập tục<\/b> từ xưa — đi đường thì dốc hết sức, nhưng cứ đi ba ngày phải nghỉ một ngày.","qs":[["大导演到南美丛林去做什么？",["旅游","拍有关古代印加文明的纪录片","找工作"],1],["第四天，当地人为什么拒绝行动？",["他们累病了","他们有一种习俗：每走三天就要休息一天","导演没给他们钱"],1],["大导演为什么着急？",["耽误时间，费用增加，怕投资人不高兴","当地人都走了","他找不到路"],0]]},{"title":"灵魂与身体","sub":"多么富有哲理的话！","paras":["“那是为了让我们的灵魂，能够追得上我们赶了三天路的疲劳的身体。”","多么富有哲理的话！在这个提倡和鼓励竞争的时代，我们常常只顾低头拉车，却少了抬头看路，少了思考、总结这一重要的步骤。"],"idea":"Người địa phương đáp: “Đó là để <b>linh hồn<\/b> chúng tôi kịp đuổi theo cơ thể <b>mệt mỏi<\/b> đã đi ba ngày đường.” Một câu nói đầy <b>triết lý<\/b>! Trong thời đại <b>khuyến khích<\/b> cạnh tranh, ta thường chỉ cắm đầu kéo xe mà thiếu ngẩng lên nhìn đường — thiếu <b>bước<\/b> quan trọng là suy nghĩ, tổng kết.","qs":[["当地人为什么每走三天要休息一天？",["为了让灵魂追得上疲劳的身体","因为天气不好","因为行李太重"],0],["“只顾低头拉车，却少了抬头看路”的意思是：",["只知道忙，不思考方向","拉车很累","走路要小心"],0]]},{"title":"闭关","sub":"一种高效率的工作方式","paras":["从20世纪80年代起，比尔·盖茨每年都要进行两次为期一周的“闭关”。在这一周的时间里，他会把自己关在一所房子里，包括家人在内的任何人他都一律不见，使自己完全不受日常工作的打扰。盖茨的这种令人寂寞难耐的“闭关”不只是一种休息方式，更是一种高效率的工作方式。","忙碌的人们，请多给自己一点思考的时间吧。"],"idea":"Từ thập niên 80 thế kỷ XX, mỗi năm <b>Bill Gates<\/b> đều “<b>bế quan<\/b>” hai lần, mỗi lần một tuần: ông tự đóng cửa trong một ngôi nhà, <b>bất kỳ ai<\/b> kể cả người nhà cũng không gặp, để hoàn toàn không bị công việc hằng ngày quấy rầy. Kiểu “bế quan” <b>cô đơn<\/b> khó chịu nổi này không chỉ là cách nghỉ ngơi, mà còn là cách làm việc <b>năng suất<\/b> cao. Những người bận rộn ơi, hãy dành cho mình chút thời gian suy nghĩ.","qs":[["比尔·盖茨每年“闭关”几次？",["一次","两次","三次"],1],["“闭关”的时候，盖茨见什么人？",["只见家人","任何人都一律不见","只见同事"],1],["作者认为盖茨的“闭关”是：",["浪费时间","不只是休息，更是高效率的工作方式","很轻松的事"],1]]}],"TEXT_EXTRA":{"bg":"学会思考，是一个人成熟的标志。思考，让我们透过现象，弄清事情的本质，发现工作中存在的问题，找到最好的工作方法；思考，让我们少走弯路，有比较、有选择地处理和解决问题，以较小的付出，换来最理想的效果；思考，让我们分清主次、突出重点，做到有的放矢。如果我们能够做到冷静思考、善于思考，相信你一定会更容易成功。","bg_vn":"Biết suy nghĩ là dấu hiệu trưởng thành. Suy nghĩ giúp ta nhìn qua hiện tượng để hiểu bản chất, phát hiện vấn đề trong công việc, tìm ra cách làm tốt nhất; giúp ta ít đi đường vòng, so sánh và lựa chọn khi giải quyết vấn đề, bỏ ít công mà đạt hiệu quả lý tưởng; giúp ta phân rõ chính phụ, làm có mục tiêu (有的放矢). Nếu biết suy nghĩ bình tĩnh, giỏi suy nghĩ, bạn sẽ dễ thành công hơn.","bg_qs":[["根据短文，学会思考是什么的标志？",["一个人成熟","一个人忙碌","一个人成功"],0],["“少走弯路”的意思是：",["少犯错误，少浪费时间","少走路","多运动"],0]]},"APPLY":{"theme":"学会思考","topic":"思考和行动，哪个更重要？","topic_vn":"Suy nghĩ và hành động, cái nào quan trọng hơn? (nói 1–1,5 phút): quan điểm → lý do → ví dụ bản thân / bài khóa → kết luận.","qs":[["你是一个平时爱思考的人吗？当你遇到不顺利的情况时，你通常会怎么做？","Bạn có hay suy nghĩ không? Khi gặp chuyện không thuận lợi, bạn thường làm gì?","我算是一个爱思考的人。遇到不顺利的情况时，我会先让自己冷静下来，想一想问题出在哪儿，然后再决定下一步怎么做。",["冷静","问题","下一步"]],["请以学习或工作中一次经历为例，说说思考对你有哪些帮助。","Lấy một trải nghiệm trong học tập / công việc, nói suy nghĩ giúp ích gì cho bạn.","上学期我的汉语成绩一直不好。后来我反省了一下，发现自己只顾做题，却从来不总结。改变方法以后，我的学习效率提高了很多。",["反省","总结","效率"]],["思考和行动，两者哪个更重要？你怎么看这个问题？","Suy nghĩ và hành động, cái nào quan trọng hơn? Bạn nghĩ sao?","我觉得两者都很重要。只思考不行动，什么事也做不成；只行动不思考，就容易在错误的道路上走得太远。最好的办法是一边行动一边思考。",["行动","思考","错误的道路"]]],"vocab":[["思考","sīkǎo","suy nghĩ"],["反省","fǎnxǐng","tự xét lại"],["总结","zǒngjié","tổng kết"],["冷静","lěngjìng","bình tĩnh"],["效率","xiàolǜ","hiệu suất"],["弯路","wānlù","đường vòng"],["本质","běnzhì","bản chất"],["有的放矢","yǒu dì fàng shǐ","làm có mục tiêu"],["忙而不乱","máng ér bú luàn","bận mà không rối"],["劳逸结合","láo yì jiéhé","kết hợp làm và nghỉ"]],"build_title":"选一个观点，拼出你的回答","build_lead":"Chọn quan điểm, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 观点","② 理由","③ 举例","④ 结论"],"build":{"A · 思考更重要":[["我认为，思考比行动更重要。","我觉得在行动以前，一定要先好好思考。"],["我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远。","如果只顾低头拉车，却少了抬头看路，就很容易走弯路。"],["比如比尔·盖茨，他每年都要“闭关”两次，专门用来思考。","上学期我只顾做题，从来不总结，成绩一直没有进步。"],["所以，忙碌的人们，请多给自己一点思考的时间吧。","总之，会思考的人，才能忙而不乱。"]],"B · 行动更重要":[["我认为，行动比思考更重要。","我觉得想得再多，不行动也没有用。"],["很多人总是想得太多，却一直不敢开始，结果耽误了很多机会。","只有在行动中，我们才能发现问题、解决问题。"],["我的一个朋友想开咖啡馆，想了三年也没开始，现在机会已经没有了。","我学游泳的时候，看了很多书都学不会，下水练了几次就会了。"],["所以，与其一直想，不如马上行动起来。","总之，行动是成功的第一步。"]],"C · 两者都重要":[["我觉得思考和行动都很重要，不能只要一个。","我的看法是：一边行动，一边思考。"],["只思考不行动，什么事也做不成；只行动不思考，就容易在错误的道路上越走越远。","就像课文里的当地人，赶路时用尽全力，每走三天就休息一天。"],["我工作的时候，每天下班前都会花十分钟总结一下今天做了什么，明天要做什么。","这样做，我的工作效率提高了很多，也不那么疲劳了。"],["总之，要劳逸结合，让灵魂追得上身体。","所以，既要低头拉车，也要抬头看路。"]]},"patterns":[["① 观点","我认为，……比……更重要。","Tôi cho rằng… quan trọng hơn…"],["② 理由","我们不一定……，但……，却可以使我们……","Ta không nhất định…, nhưng… thì có thể giúp ta…"],["② 理由","只顾……，却少了……","Chỉ lo…, mà thiếu…"],["③ 举例","比如比尔·盖茨，……","Ví dụ Bill Gates…"],["③ 举例","一来……，二来……","Một là…, hai là…"],["④ 结论","……不只是……，更是……","… không chỉ là…, mà còn là…"]],"legend":["① Quan điểm","② Lý do","③ Ví dụ","④ Kết luận"],"w5":["忙碌","被动","反省","据说","个性","冒险","来","出色","一连","耽误","至于","投资","得罪","总算","搞","疲劳","提倡","一律","寂寞","效率"],"samples":[{"who":"思考更重要","meta":"Bài nói ~1 phút","p":["我认为，思考比行动更重要。","我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远。","比如比尔·盖茨，他每年都要“闭关”两次，专门用来思考。","所以，忙碌的人们，请多给自己一点思考的时间吧。"],"good":["时时反省、总结，却可以使我们不会在错误的道路上走得太远"],"vi":"Tôi cho rằng suy nghĩ quan trọng hơn hành động. Ta không chắc biết con đường đúng là gì, nhưng thường xuyên tự xét lại, tổng kết thì sẽ không đi quá xa trên con đường sai. Ví dụ Bill Gates mỗi năm “bế quan” hai lần chỉ để suy nghĩ. Vì vậy, những người bận rộn hãy dành cho mình chút thời gian suy nghĩ."},{"who":"两者都重要","meta":"Bài nói ~1 phút","p":["我觉得思考和行动都很重要，不能只要一个。","只思考不行动，什么事也做不成；只行动不思考，就容易在错误的道路上越走越远。","我工作的时候，每天下班前都会花十分钟总结一下今天做了什么，明天要做什么。","所以，既要低头拉车，也要抬头看路。"],"good":["既要低头拉车，也要抬头看路"],"vi":"Tôi thấy suy nghĩ và hành động đều quan trọng. Chỉ nghĩ mà không làm thì chẳng làm được gì; chỉ làm mà không nghĩ thì dễ càng đi càng xa trên đường sai. Mỗi ngày trước khi tan làm tôi dành mười phút tổng kết hôm nay đã làm gì, mai làm gì. Vì vậy vừa phải cắm đầu kéo xe, vừa phải ngẩng lên nhìn đường."}]},"WRITE":{"topic":"认真思考，轻松生活","topic_vn":"Viết bài với đầu đề “Suy nghĩ nghiêm túc, sống nhẹ nhàng”, nói về cách bạn đối mặt với các khó khăn trong cuộc sống. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","开头","Mở bài: cuộc sống luôn có khó khăn / bận rộn.","生活中，我们难免会遇到各种困难……"],["②","观点","Quan điểm: gặp khó khăn nên dừng lại suy nghĩ.","我觉得，遇到困难时，……"],["③","例子","<b>Trọng tâm.<\/b> Một lần bạn suy nghĩ / tự xét lại và giải quyết được khó khăn.","有一次，……后来我反省了一下……"],["④","结论","Kết: suy nghĩ giúp sống nhẹ nhàng hơn.","认真思考，才能……"]],"samples":[{"who":"范文 1 · 停下来想一想","title":"认真思考，轻松生活","p":["生活中，我们难免会遇到各种困难。以前，我一遇到困难就很着急，忙得像工作的奴隶，效率却很低。后来我学会了停下来想一想：问题到底出在哪儿？有没有更好的办法？总算，我变得忙而不乱了。认真思考，生活才能轻松。"],"vi":"Khoảng 105 chữ: dùng 难免、奴隶、效率、总算、忙而不乱."},{"who":"范文 2 · 一次考试","title":"认真思考，轻松生活","p":["上学期，我的汉语成绩一直不好，每天学到很晚，非常疲劳。后来我反省了一下，发现自己只顾做题，却从来不总结。改变方法以后，我每天少学一个小时，成绩反而提高了。我明白了：认真思考，才能轻松生活。"],"vi":"Khoảng 100 chữ: dùng 疲劳、反省、只顾……却……."},{"who":"范文 3 · 课本命题写作","title":"认真思考，轻松生活","p":["现代人的生活越来越忙碌，很多人总是被事情追着、赶着，几乎成了工作的奴隶。我以前也是这样。","去年我刚开始工作，每天加班到很晚，一连几个月都没有休息过，可是工作效率却很低，常常耽误事情，还得罪了不少同事。","后来，我读到了比尔·盖茨“闭关”的故事，开始每周花半天时间反省、总结。我发现，很多事情是可以提前安排的，有些事情根本不用我亲自做。慢慢地，我变得忙而不乱，生活也轻松多了。","我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远。认真思考，才能轻松生活。"],"good":["几乎成了工作的奴隶","一连几个月都没有休息过","我们不一定知道正确的道路是什么，但时时反省、总结，却可以使我们不会在错误的道路上走得太远"],"vi":"Khoảng 220 chữ. Ba chỗ gạch chân dùng lại câu / từ của bài: 成了工作的奴隶 · 一连…… · ……不一定……，但……却可以使……."}],"tpl":"认真思考，轻松生活\n生活中，【困难 / 忙碌】。以前，我【……】。后来，我【反省 / 思考】，发现【……】。现在，【变化】。认真思考，才能【……】。","chk":[["topic","Bám đề: có nói 思考 / 想","思考|想一想|反省|总结"],["past","Có tình huống khó khăn (以前 · 有一次 · 去年)","以前|有一次|去年|上学期"],["change","Có thay đổi (后来 · 改变 · 发现)","后来|改变|发现|慢慢地"],["end","Có kết (才能 · 所以 · 轻松)","才能|所以|轻松|总之"]],"w5":["忙碌","被动","反省","据说","个性","冒险","来","出色","一连","耽误","至于","投资","得罪","总算","搞","疲劳","提倡","一律","寂寞","效率"],"wmin":100,"wmax":200,"traps":"<b>Bắt buộc có:<\/b> một khó khăn cụ thể, việc bạn dừng lại suy nghĩ / tự xét lại, kết quả thay đổi và câu kết. Mượn ít nhất một khung 好句 — xem 范文 3.","hw_note":"Đọc xong phần 背景 (学会思考), quay lại mục 4 để viết bài “认真思考，轻松生活”."}};</script>
<script>
(function(){

var zhVoice=null,curBtn=null;
function pickVoice(){if(!("speechSynthesis" in window))return;var v=speechSynthesis.getVoices();zhVoice=v.find(function(x){return /zh[-_]CN/i.test(x.lang)})||v.find(function(x){return /^zh/i.test(x.lang)})||null;}

  if(btn){btn.classList.add("playing");curBtn=btn;u.onend=u.onerror=function(){btn.classList.remove("playing");};}

}

/* ---------- generic MC ---------- */
function Score(node){this.node=node;this.r=0;this.d=0;this.n=0;}
Score.prototype.add=function(){this.n++;this.show();};
Score.prototype.hit=function(ok){this.d++;if(ok)this.r++;this.show();if(this.onchange)this.onchange();};

Score.prototype.show=function(){if(this.node)this.node.textContent=this.zh?("答对 "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · 完成！":"")):("Đúng "+this.r+" / "+this.n+(this.d===this.n&&this.n?" · hoàn thành!":""));};
function mc(stem,opts,ans,ex,score,cls){
  var q=el("div",{class:"q"+(cls?" "+cls:"")});q.appendChild(el("div",{class:"stem"},stem));
  var ops=el("div",{class:"ops"});
