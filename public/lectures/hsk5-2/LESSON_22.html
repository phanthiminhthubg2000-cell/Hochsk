<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LESSON 22 · 阅读与思考 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

分强调阅读的作用，觉得多读书就能够把作文写得特别好。",null,null,["写作文"],""],["观点","guāndiǎn","名","quan điểm",1,"观察事物时所处的位置或采取的态度。","这个观点是不客观、不全面的，我们需要转变自己的观念。","我不同意你的观点，我觉得这部电影很不错。","Tôi không đồng ý quan điểm của bạn, tôi thấy bộ phim này rất hay.",["同意……的观点"],"“观点”指对某个问题的看法；“观念”指长期形成的思想、意识。"],["客观","kèguān","形","khách quan",1,"按照事物的本来面目去考察，不加个人偏见的。","这个观点是不客观、不全面的，我们需要转变自己的观念。","人都是有感情甚至自私的，很难做到任何时候都很客观。","Con người đều có tình cảm, thậm chí ích kỷ, khó lúc nào cũng khách quan.",["客观地评价"],""],["全面","quánmiàn","形","toàn diện, mọi mặt",0,"各个方面的总和；照顾到各个方面的。","这个观点是不客观、不全面的，我们需要转变自己的观念。",null,null,["全面地了解"],""],["转变","zhuǎnbiàn","动","thay đổi, chuyển biến",1,"由一种情况变到另一种情况。","这个观点是不客观、不全面的，我们需要转变自己的观念。","你可以试着转变一下思路，可能会快一点解决问题。","Bạn thử thay đổi cách nghĩ xem, có thể giải quyết vấn đề nhanh hơn.",["转变观念","转变态度"],"“转变”多指思想、态度、方式等的改变，常带宾语；“变化”多做名词或不带宾语。"],["观念","guānniàn","名","quan niệm, tư tưởng",0,"思想意识。","这个观点是不客观、不全面的，我们需要转变自己的观念。",null,null,["转变观念"],""],["火柴","huǒchái","名","diêm quẹt",0,"用细小的木条蘸上药物制成，摩擦能生火。","比如，他们讨论过《卖火柴的小女孩儿》是写给谁看的，还讨论过灰姑娘的故事。",null,null,[],""],["灰","huī","名／形","tro; xám",0,"物质燃烧后剩下的粉末；尘土；像草木灰的颜色。","比如，他们讨论过《卖火柴的小女孩儿》是写给谁看的，还讨论过灰姑娘的故事。",null,null,["灰色"],""],["一旦","yídàn","副","một khi",1,"不确定的时间，表示有一天或假如有这么一天。","……灰姑娘一旦进了这个王宫……","所谓私人空间，一旦有人闯入这个空间，我们就会感觉不舒服。","Gọi là không gian riêng, một khi có người xâm nhập, ta sẽ thấy khó chịu.",["一旦……就……"],"见“注释”：一旦。"],["王宫","wánggōng","名","hoàng cung",0,"国王居住的地方。","……灰姑娘一旦进了这个王宫……",null,null,[],""],["王子","wángzǐ","名","hoàng tử",0,"国王的儿子。","……灰姑娘一旦进了这个王宫，成为王子的心上人……",null,null,[],""],["属于","shǔyú","动","thuộc về",1,"归某一方面或为某一方所有。","……一切幸福都属于她之后……","这个世界是属于我们的。","Thế giới này thuộc về chúng ta.",["属于我们"],""],["对待","duìdài","动","đối xử",1,"以某种态度或行为加之于人或事物。","……这时她应该怎样对待她的继母……","我们应该客观、公平地对待每一个人。","Chúng ta nên đối xử khách quan, công bằng với mỗi người.",["平等地对待","认真对待"],""],["交换","jiāohuàn","动","trao đổi",1,"各自把自己的给对方。","因为这是一种情感交换。","会议上大家交换了意见。","Trong cuộc họp mọi người đã trao đổi ý kiến.",["交换意见","交换位置"],""],["拥有","yōngyǒu","动","có",0,"领有，具有（大量的土地、人口、财产等）。","……一个已经拥有巨大幸福的人……",null,null,[],""],["巨大","jùdà","形","to lớn",0,"（规模、数量等）很大。","……一个已经拥有巨大幸福的人……",null,null,["巨大的幸福"],""],["承认","chéngrèn","动","thừa nhận, chấp nhận",1,"表示肯定，同意，认可。","另外还要承认人性中一些先天的不完美……","虽然这次的错误有点儿严重，但你应该勇敢地承认。","Dù lần này lỗi hơi nghiêm trọng, bạn nên dũng cảm thừa nhận.",["承认错误","承认事实"],""],["人性","rénxìng","名","bản tính con người",0,"人所具有的正常的感情和理性。","另外还要承认人性中一些先天的不完美……",null,null,[],""],["完美","wánměi","形","hoàn hảo, hoàn mỹ",1,"完备美好，没有缺点。","另外还要承认人性中一些先天的不完美……","世界上没有完美的人。","Trên đời không có người hoàn hảo.",["完美的计划","不完美"],""],["难免","nánmiǎn","形","khó tránh",1,"不容易避免的，避免不了的。","……难免会更疼爱自己亲生的女儿……","刚开始工作，这样的错误是难免的。","Mới bắt đầu làm việc, lỗi như vậy là khó tránh.",["难免会……"],"见“注释”：难免。"],["疼爱","téng'ài","动","thương yêu",0,"关切喜爱。","……难免会更疼爱自己亲生的女儿……",null,null,[],""],["平等","píngděng","形","bình đẳng",1,"人们在社会、政治、经济、法律等方面享有相等待遇。","……很难完全平等地对待她们。","法律面前人人平等。","Mọi người bình đẳng trước pháp luật.",["平等地对待","平等的地位"],"辨析：平等—公平。见“搭配 · 辨析”。"],["自私","zìsī","形","ích kỷ",0,"只顾自己的利益，不顾别人。","可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。",null,null,["自私的人"],""],["倾向","qīngxiàng","动／名","nghiêng về; khuynh hướng",0,"偏于赞成（对立的事物中的一方）；发展的方向。","可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。",null,null,["自然倾向"],""],["理由","lǐyóu","名","lý do",1,"事情为什么这样做或那样做的道理。","可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。","希望你能给我一个好的理由，解释清楚你为什么这么做。","Mong bạn cho tôi một lý do hợp lý, giải thích rõ vì sao bạn làm vậy.",["有理由","一个好的理由"],"“理由”指为自己的做法所说的道理；“原因”指造成某种结果的条件。"],["道德","dàodé","名","đạo đức",0,"社会意识形态之一，是人们共同生活及其行为的准则和规范。","可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。",null,null,[],""],["自从","zìcóng","介","từ lúc",1,"表示从过去某个时间开始。","自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。","自从有了长大后成为作家这个理想之后，他每天都坚持写作。","Từ khi có ước mơ lớn lên làm nhà văn, ngày nào cậu ấy cũng kiên trì viết.",["自从……以后"],"见“注释”：自从。"],["童话","tónghuà","名","truyện cổ tích",0,"儿童文学的一种，通过丰富的想象、幻想和夸张来编写的适合于儿童欣赏的故事。","你看这个老师在讲童话的时候……",null,null,[],""],["价值","jiàzhí","名","giá trị",1,"积极作用；体现在商品里的社会必要劳动。","……甚至把人性的价值判断……","你的这个建议很有 an riêng là khoảng quanh cơ thể; một khi có người xâm nhập, ta thấy khó chịu, không thoải mái."]],"book_title":"练一练：完成句子或对话（一旦）","book":[["A：明年就要毕业了，你有什么计划？<br>B：______________。","","我想去中国工作，一旦找到合适的工作，我就留在那儿"],["A：我每天都听中文广播，但感觉听力水平还是没有提高。<br>B：______________。","","别着急，一旦你的词汇量增加了，听力水平自然就会提高"],["天冷了，多穿点儿，______________。","","天冷了，多穿点儿，一旦感冒了就麻烦了"]],"drill":[["选择：____你答应了别人，就一定要做到。",["一旦","一直"],0,"一旦……就…… = một khi… thì…."],["“一旦”后面常常跟哪个词搭配？",["就","才"],0,"一旦……，就……"]]},{"word":"难免","py":"nánmiǎn","pos":"形容词","forms":["……是难免的","难免 + 会 / 要 + 动词"],"vn":"<b>难免<\/b> (tính từ): <b>khó tránh, khó tránh khỏi<\/b>. Hai cách dùng: ① làm vị ngữ: <b>……是难免的<\/b> (là điều khó tránh); ② làm trạng ngữ: <b>难免会……<\/b> (khó tránh sẽ…).","text":"作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿","ex":[["刚开始工作，这样的错误是难免的。","Mới đi làm, lỗi như vậy là khó tránh."],["朋友间难免会产生矛盾、误会甚至是伤害。","Giữa bạn bè khó tránh khỏi mâu thuẫn, hiểu lầm, thậm chí tổn thương."]],"book_title":"练一练：完成句子或对话（难免）","book":[["A：这孩子真是太淘气了！<br>B：______________。","","孩子嘛，淘气是难免的，长大就好了"],["刚刚退休的老人______________。","","刚刚退休的老人难免会觉得孤单"],["A：马上就要考试了，我觉得很紧张。<br>B：______________。","","考试前紧张是难免的，放松一点儿就好了"]],"drill":[["Câu nào đúng?",["第一次做饭，做得不好是难免的。","第一次做饭，难免是做得不好的。"],0,"……是难免的 làm vị ngữ."],["“难免”的意思是：",["不容易避免","一定不会","非常困难"],0,"Khó tránh."]]},{"word":"自从","py":"zìcóng","pos":"介词","forms":["自从 + 时间／事件（+ 以后／之后），……","表示从过去某个时间开始"],"vn":"<b>自从<\/b> (giới từ): <b>từ khi, từ lúc<\/b> — chỉ mốc bắt đầu <b>trong quá khứ<\/b>, thường đi với <b>以后 / 之后<\/b>, vế sau nói tình hình kéo dài từ đó: 自从……以后，就…….","text":"自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。","ex":[["自从城市出现后，它就成为人类生活的中心。","Từ khi thành phố xuất hiện, nó trở thành trung tâm đời sống loài người."],["自从有了长大后成为作家这个理想之后，他每天都坚持写作。","Từ khi có ước mơ lớn lên làm nhà văn, ngày nào cậu ấy cũng kiên trì viết."]],"book_title":"练一练：完成句子或对话（自从）","book":[["自从我来中国以后，______________。","","自从我来中国以后，我的汉语水平提高了很多"],["______________，我的观念就转变了。","","自从读了这本书，我的观念就转变了"],["A：你跟你同屋现在的关系怎么样？<br>B：______________。","","自从上次吵架以后，我们就很少说话了"]],"drill":[["Câu nào đúng?",["自从上大学以后，我就开始住校了。","自从明年开始，我要住校。"],0,"自从 chỉ mốc trong quá khứ."],["选择：____认识了她，我的生活就变了。",["自从","从来"],0,"Từ khi quen cô ấy → 自从."]]}],"HSK":{"r1":[{"text":["我女儿今年十岁，非常喜欢看书，每个月都要读好几本。可是她的作文写得并不好，{36}。后来我发现，她读书的时候只看故事，{37}。于是，每次她读完一本书，我都会和她聊一聊：你最喜欢哪个人物？为什么？{38}，她的作文进步了很多。"],"qs":[{"n":36,"o":["她每次都得第一","她不喜欢看书","老师常常表扬她","我觉得很奇怪"],"a":3,"why":"读书很多，作文却不好，所以觉得奇怪。"},{"n":37,"o":["从来不思考","喜欢和同学讨论","每天都写日记","常常问问题"],"a":0,"why":"只看故事，不思考，所以作文不好。"},{"n":38,"o":["半年以后","从来","以前","一开始"],"a":0,"why":"表示经过一段时间以后的结果。"}]},{"text":["很多童话故事的结尾都是“从此，他们幸福地生活在一起”。{39}，有人认为这样的结尾太简单了。在现实生活中，{40}，结婚以后还会遇到各种各样的问题。不过，也有人认为，童话是写给孩子看的，{41}，没有必要把生活中的困难都告诉他们。其实，{42}，关键是要引导孩子思考。"],"qs":[{"n":39,"o":["因此","而且","于是","然而"],"a":3,"why":"前后意思转折。"},{"n":40,"o":["结婚就是结束","没有完美的生活","童话都是真的","大家都很幸福"],"a":1,"why":"说明现实生活不像童话那么简单。"},{"n":41,"o":["应该让孩子相信美好","应该让孩子早点儿长大","应该写得更长","孩子都不喜欢看"],"a":0,"why":"与后文“没有必要把困难都告诉他们”一致。"},{"n":42,"o":["结尾越长越好","孩子不应该看童话","两种看法都有道理","童话没有价值"],"a":2,"why":"“关键是……”前面是总结两种看法。"}]}],"r2":[{"start":46,"paras":["但是有一天，老师让我们讨论：灰姑娘进了王宫以后，应该怎样对待继母？","小时候，我读《灰姑娘》，觉得继母是一个很坏的人。","同学们的看法很不一样，有的说应该原谅，有的说应该报复。","那次讨论让我第一次开始思考故事背后的问题。","从那以后，我读书的时候总会问自己：如果是我，我会怎么做？"],"ans":["B","A","C","D","E"],"why":"小时候的看法（B）→ 老师让讨论（A）→ 同学看法不同（C）→ 开始思考（D）→ 从那以后（E）。"}],"r3":[{"text":["现在，很多家长都非常重视孩子的阅读，给孩子买了很多书，每天要求孩子读够一个小时。可是，有些孩子虽然读了很多书，却并没有从中得到多少收获。","教育专家认为，阅读不是简单地“看完”一本书。<u><b>读书不思考，就像吃饭不消化<\/b><\/u>。如果孩子只是记住了故事的内容，而没有自己的想法，那么读再多的书也没有多大用处。","那么，家长应该怎么做呢？专家建议，家长可以和孩子一起读书，读完以后问孩子一些问题，比如“如果你是书中的人物，你会怎么做？”“你同意他的做法吗？为什么？”这样，孩子就会慢慢养成边读边想的习惯。","另外，家长还可以让孩子把自己的想法写下来，这样不但能提高思考能力，还能提高写作水平。"],"qs":[{"n":56,"s":"第一段中，有些孩子的问题是：","o":["不喜欢读书","读了很多书却没有多少收获","家里没有书","读书时间太短"],"a":1,"why":"第一段最后一句。"},{"n":57,"s":"画线句子的意思是：","o":["读书前要先吃饭","读书不思考就没有真正的收获","读书和吃饭一样重要","读书会让人吃不下饭"],"a":1,"why":"比喻：吃饭不消化没有营养，读书不思考也没有收获。"},{"n":58,"s":"专家建议家长：","o":["多给孩子买书","和孩子一起读书，读完后问问题","让孩子每天读三个小时","不要让孩子读童话"],"a":1,"why":"第三段。"},{"n":59,"s":"这篇文章最合适的题目是：","o":["家长的烦恼","读书要会思考","怎样买书","孩子的作文"],"a":1,"why":"全文强调阅读时要思考。"}]}],"w71":{"prompt":"请根据下面四个画面，写一篇不少于100字的作文，写出一堂讨论课的故事。","vn":"Dựa vào 4 khung tranh, viết bài không ít hơn 100 chữ kể về một giờ học thảo luận.","panels":[["👩‍🏫","老师给同学们讲了《灰姑娘》的故事。","<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" role=\"img\"><rect width=\"320\" height=\"240\" fill=\"#f4f1e8\"/><rect y=\"185\" width=\"320\" height=\"55\" fill=\"#d9cbb3\"/><path d=\"M0 185 H320\" stroke=\"#d2b48c\" stroke-width=\"2\"/><g transform=\"translate(150.0,20.0)\"><rect width=\"150\" height=\"80\" rx=\"3\" fill=\"#2f5d50\" stroke=\"#a7784c\" stroke-width=\"5\"/><text x=\"75.0\" y=\"40.0\" font-size=\"18\" font-weight=\"500\" fill=\"#fff\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"'Noto Sans SC','PingFang SC',sans-serif\">灰姑娘<\/text><\/g><g transform=\"translate(190.0,88.0)\"><g transform=\"translate(0.0,0.0) scale(1.4,1.4)\"><path d=\"M-12 0 h22 q4 0 4 -4 l-10 -6 q-6 -8 -14 -6z\" fill=\"#bfe6ff\" stroke=\"#6fa8d6\" stroke-width=\"1.5\"/><path d=\"M10 0 v6\" stroke=\"#6fa8d6\" stroke-width=\"2\"/><\/g><\/g><g transform=\"translate(270.0,86.0)\"><g transform=\"translate(0.0,0.0) scale(1.1,1.1)\"><path d=\"M-12 0 v-12 l6 6 l6 -10 l6 10 l6 -6 v12z\" fill=\"#f5b82e\" stroke=\"#d39a10\"/><\/g><\/g><g transform=\"translate(90.0,200.0) scale(0.9,0.9)\"><path d=\"M-7 -62 L-8 -4 M7 -62 L8 -4\" stroke=\"#4a5060\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M-14 -2 h10 M5 -2 h10\" stroke=\"#2d2626\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M-15 -112 q15 -6 30 0 L18 -60 q-18 5 -36 0z\" fill=\"#5aa08a\"/><path d=\"M-14 -106 L-22 -66\" stroke=\"#5aa08a\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"-22\" cy=\"-66\" r=\"4\" fill=\"#f6d1b1\"/><path d=\"M14 -106 L34 -92\" stroke=\"#5aa08a\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"34\" cy=\"-92\" r=\"4\" fill=\"#f6d1b1\"/><path 17 -1 q-1 -19 17 -19 q18 0 17 19 q-4 -9 -10 -10 q-10 3 -24 10z\" fill=\"#2b2420\"/><path d=\"M-8.5 -1 q3 -3 6 0 M2.5 -1 q3 -3 6 0\" stroke=\"#3b2f2f\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M-6 5 q6 9 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><rect x=\"196\" y=\"222\" width=\"28\" height=\"30\" rx=\"8\" fill=\"#5b8def\"/><g transform=\"translate(280.0,210.0) scale(0.75,0.75)\"><circle cx=\"-17\" cy=\"2\" r=\"6\" fill=\"#4a3226\"/><circle cx=\"17\" cy=\"2\" r=\"6\" fill=\"#4a3226\"/><circle cx=\"-16\" cy=\"1\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"16\" cy=\"1\" r=\"3.5\" fill=\"#e8b48f\"/><circle cx=\"0\" cy=\"0\" r=\"16.5\" fill=\"#f6d1b1\"/><path d=\"M-17 -3 q2 -16 17 -16 q15 0 17 16 q-10 -6 -17 -9 q-6 6 -17 9z\" fill=\"#4a3226\"/><circle cx=\"-5.5\" cy=\"-1\" r=\"1.9\" fill=\"#3b2f2f\"/><circle cx=\"5.5\" cy=\"-1\" r=\"1.9\" fill=\"#3b2f2f\"/><path d=\"M-6 5 q6 8 12 0 z\" fill=\"#b5483f\"/><ellipse cx=\"-10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><ellipse cx=\"10\" cy=\"4\" rx=\"3.3\" ry=\"2\" fill=\"#f19a9a\" opacity=\".45\"/><\/g><rect x=\"266\" y=\"222\" width=\"28\" height=\"30\" rx=\"8\" fill=\"#9b6bd6\"/><g transform=\"translate(290.0,40.0)\"><g transform=\"translate(0.0,0.0) scale(0.6,0.6)\"><polygon points=\"0.0,-10.0 2.5,-3.4 9.5,-3.1 4.0,1.3 5.9,8.1 0.0,4.2 -5.9,8.1 -4.0,1.3 -9.5,-3.1 -2.5,-3.4\" fill=\"#f5b82e\"/><\/g><\/g><\/svg>"]],"min":100,"tips":["Kể theo 4 tranh: kể chuyện → câu hỏi → thảo luận hai nhóm → kết luận.","Có thể dùng: 一旦、对待、交换、承认、原谅、结论."],"sample":"今天的语文课上，老师给我们讲了《灰姑娘》的故事。讲完以后，老师问我们：灰姑娘一旦进了王宫，成了王子的心上人，她应该怎样对待继母和两个姐姐呢？同学们分成了两组，进行了热烈的讨论。一组认为灰姑娘应该报复她们，因为她们以前对灰姑娘太过分了；另一组认为应该原谅她们。经过讨论，大家最后得出了结论：一个已经拥有巨大幸福的人，应该学会原谅和理解别人。这堂课让我明白了，读书的时候一定要多思考。","svn":"Giờ văn, cô kể chuyện Lọ Lem rồi hỏi Lọ Lem nên đối xử với dì ghẻ thế nào; lớp chia hai nhóm tranh luận sôi nổi — trả thù hay tha thứ; kết luận: người hạnh phúc nên biết tha thứ; bài học: đọc phải suy nghĩ."},"w72":{"prompt":"有人说：“读书越多，作文就写得越好。”你同意这种看法吗？请写一篇不少于200字的作文，谈谈你的看法。","vn":"Có người nói “đọc càng nhiều sách, viết văn càng hay”. Bạn có đồng ý không? Viết bài không ít hơn 200 chữ.","min":200,"title":"读书与写作","tips":["Nêu quan điểm (không hoàn toàn đồng ý) → đọc giúp tích lũy → nhưng phải suy nghĩ → còn phải luyện viết → kết luận.","Dùng: 这个观点是不……的；如果只是单纯地……那是片面的；自从……"],"sample":"有人说：“读书越多，作文就写得越好。”我认为这个观点是不全面的。\n首先，我承认读书对写作有很大的帮助。通过读书，我们可以积累很多好词好句，了解不同的写作方法，还能增长知识。\n但是，只读书是不够的。如果只是单纯地读书而不思考，那么读得再多，也只是记住了别人的想法，写不出自己的观点。所以读书的时候，我们应该多问几个“为什么”，形成自己的看法。\n另外，写作水平的提高还需要大量的练习。自从我开始每天写日记，我的作文就进步了很多。\n总之，读书、思考和练习，三者缺一不可。只有这样，我们才能真正写出好文章。","svn":"Nghị luận: quan điểm không toàn diện → 首先 đọc giúp tích lũy → 但是 đọc mà không nghĩ thì không có quan điểm riêng → 另外 cần luyện viết → 总之 đọc, nghĩ, luyện đều cần."}},"PRACTICE":{"ex1":{"bank":["承认","过分","价值","客观","理由","主张"],"items":[["虽然这次的错误有点儿严重，但你应该勇敢地{}。",["承认"]],["人都是有感情甚至自私的，很难做到任何时候都很{}。",["客观"]],["你的这个建议很有{}，我马上告诉总裁。",["价值"]],["他{}将会议地点改在上海，因为这次的合作伙伴对我们来说非常重要。",["主张"]],["你这种做法太{}了，我不能接受！",["过分"]],["希望你能给我一个好的{}，解释清楚你为什么这么做。",["理由"]]]},"ex2":[["你可以试着____一下思路，可能会快一点解决问题。",["变化","转变"],1,"转变 + tân ngữ (思路、观念、态度); 变化 thường không mang tân ngữ."],["我不同意你的____，我觉得这部电影很不错。",["观点","观念"],0,"Ý kiến về một vấn đề cụ thể → 观点; 观念 là tư tưởng hình thành lâu dài."],["这次新产品销售得不好的____是宣传推广做得不够。",["原因","理由"],0,"Nguyên nhân dẫn đến kết quả → 原因; 理由 là lý lẽ để giải thích hành động của mình."],["他太____了，这样很容易被人骗。",["单调","单纯"],1,"Ngây thơ, đơn giản (tính cách) → 单纯; 单调 là đơn điệu."]],"ex3":[],"ex3match":{"groups":[[["交换","意见"],["转变","观念"],["属于","我们"],["承认","错误"]],[["完美的","计划"],["自私的","行为"],["全面地","了解"],["平等地","对待"]]]},"ex4":[["一些家长的观念","过分、作文、客观、转变","很多家长过分强调阅读的作用，觉得多读书就能把作文写好。作者认为这个观点不客观、不全面，我们需要转变观念。"],["关于《灰姑娘》的讨论","一旦、对待、交换、承认、难免、平等、理由","美国的一位老师问学生：灰姑娘一旦进了王宫，应该怎样对待继母和姐姐？这是一种情感交换。结论是：拥有幸福的人应该原谅伤害过自己的人；还要承认人性的不完美，母亲难免更疼爱亲生女儿，很难平等地对待她们，这有自然倾向的理由。"],["作者的思考","自从、价值、单纯","自从听说了这件事，作者就开始思考应该如何阅读。老师把情感影响和价值判断都给了孩子们。如果只是单纯地主张阅读而不强调思考，那是片面的。"]],"ext":{"title":"扩展 · 话题：写作表达","words":[["作文","zuòwén","bài văn"],["论文","lùnwén","luận văn"],["主题","zhǔtí","chủ đề"],["题目","tímù","đề bài, đầu đề"],["话题","huàtí","chủ đề nói chuyện"],["目录","mùlù","mục lục"],["提纲","tígāng","dàn ý"],["标点","biāodiǎn","dấu câu"],["废话","fèihuà","lời vô ích"],["胡说","húshuō","nói bậy"]],"items":[["买书的时候我一般会先看看前面的{}，这样可以了解书的大概内容。","目录"],["这不是一篇研究型的文章，算不上是一篇{}。","论文"],["这个地方的{}用错了，这是书的名字，应该用书名号。","标点"],["你现在完全是在说{}，解决不了问题！","废话"]]}},"TEXT":[{"title":"家长的观念","sub":"多读书就能写好作文吗？","paras":["很多家长可能过分强调阅读的作用，觉得多读书就能够把作文写得特别好。这个观点是不客观、不全面的，我们需要转变自己的观念。"],"idea":"Nhiều phụ huynh có thể <b>quá nhấn mạnh<\/b> tác dụng của việc đọc, cho rằng đọc nhiều sách là viết văn sẽ rất hay. Tác giả cho rằng quan điểm này <b>không khách quan, không toàn diện<\/b> — chúng ta cần <b>thay đổi quan niệm<\/b>.","qs":[["很多家长觉得怎样就能把作文写好？",["多读书","多上课","多玩儿"],0],["作者认为家长的这个观点怎么样？",["非常正确","不客观、不全面","很有价值"],1]]},{"title":"关于灰姑娘的讨论","sub":"情感交换","paras":["我曾经听一位美国的小学老师说，他们十分重视和学生一起讨论问题。比如，他们讨论过《卖火柴的小女孩儿》是写给谁看的，还讨论过灰姑娘的故事。老师讲完故事之后，问同学们：灰姑娘一旦进了这个王宫，成为王子的心上人，她的梦想实现了，一切幸福都属于她之后，这时她应该怎样对待她的继母，应该怎样对待她的两个姐姐？","为什么要讨论这个问题呢？因为这是一种情感交换。老师和学生通过讨论得出的结论是：一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人。另外还要承认人性中一些先天的不完美，就是说作为一个母亲，在自己的亲生女儿和不是亲生的灰姑娘之间，难免会更疼爱自己亲生的女儿，很难完全平等地对待她们。可能你觉得继母很自私，但这种行为有自然倾向的理由，与道德没有必然的关系。"],"idea":"Một thầy giáo tiểu học Mỹ rất coi trọng <b>thảo luận cùng học sinh<\/b>. Sau khi kể chuyện <b>Lọ Lem<\/b>, thầy hỏi: <b>một khi<\/b> Lọ Lem vào cung, thành người trong mộng của hoàng tử, mọi hạnh phúc <b>thuộc về<\/b> cô, thì cô nên <b>đối xử<\/b> với dì ghẻ và hai chị thế nào? Đây là một sự <b>trao đổi tình cảm<\/b>. Kết luận: người <b>có<\/b> hạnh phúc <b>to lớn<\/b> nên tha thứ, thông cảm cho người từng làm hại mình; và phải <b>thừa nhận<\/b> <b>bản tính con người<\/b> vốn <b>không hoàn hảo<\/b> — người mẹ <b>khó tránh<\/b> thương con đẻ hơn, khó đối xử <b>bình đẳng<\/b>. Có thể thấy dì ghẻ <b>ích kỷ<\/b>, nhưng đó là <b>khuynh hướng<\/b> tự nhiên, không tất yếu liên quan đến <b>đạo đức<\/b>.","qs":[["老师讲完灰姑娘的故事以后，问了什么问题？",["灰姑娘长得漂亮吗？","灰姑娘应该怎样对待继母和姐姐？","王子为什么喜欢灰姑娘？"],1],["讨论得出的结论是什么？",["拥有巨大幸福的人应该原谅伤害过自己的人","灰姑娘应该报复继母","继母是坏人"],0],["作者认为继母更疼爱亲生女儿是：",["不道德的","有自然倾向的理由","完全不能理解的"],1]]},{"title":"阅读与思考","sub":"知识 = 知 + 识","paras":["自从我听说了这件事，就开始思考应该如何阅读，除了阅读还应该做什么。你看这个老师在讲童话的时候，已经在有意识地把这种情感影响，甚至把人性的价值判断，都给了孩子们。如果只是单纯地主张阅读而不强调思考，那是片面的。","“知识”两个字我始终认为它是要分开来谈的，“知”就是知感，“识”就是认识。所谓“知感”就是别人告诉你、说给你听、要求你记住的那一部分。但只有这一部分是不够的，还要有认识、思考。"],"idea":"<b>Từ khi<\/b> nghe chuyện này, tác giả bắt đầu nghĩ nên đọc thế nào, ngoài đọc còn phải làm gì. Khi kể <b>truyện cổ tích<\/b>, thầy giáo đã có ý thức truyền cho trẻ ảnh hưởng tình cảm, thậm chí cả phán đoán <b>giá trị<\/b> về nhân tính. Nếu chỉ <b>đơn thuần chủ trương<\/b> đọc mà không nhấn mạnh <b>suy nghĩ<\/b> thì là phiến diện. “<b>知识<\/b>” nên tách ra: <b>知<\/b> là <b>tri giác<\/b> (điều người khác bảo ta nhớ), <b>识<\/b> là nhận thức — chỉ có phần “知” thì chưa đủ, còn phải nhận thức, suy nghĩ.","qs":[["作者认为只主张阅读而不强调思考是：",["全面的","片面的","完美的"],1],["“知感”指的是什么？",["别人告诉你、要求你记住的那一部分","自己的思考","自己的感情"],0],["这篇文章主要想告诉我们：",["阅读没有用","阅读的同时还要思考","作文不重要"],1]]}],"TEXT_EXTRA":{"bg":"《灰姑娘》是众所周知的童话。它原来是欧洲很多国家都在讲述的民间故事，后来由法国作家夏尔·佩罗（Charles Perrault）和德国的格林兄弟（Jacob and Wilhelm Grimm）采集编写而成。目前大家熟知的有两个版本，并被翻译成多种文字，在全世界流传。“灰”这个词，在汉语中既可以指尘土（chéntǔ），也可以指颜色，形象地描写出了灰姑娘生活的环境。","bg_vn":"“Cô bé Lọ Lem” là truyện cổ tích ai cũng biết, vốn là chuyện dân gian ở nhiều nước châu Âu, sau được Charles Perrault (Pháp) và anh em Grimm (Đức) sưu tầm, biên soạn. Hiện có hai phiên bản quen thuộc, được dịch ra nhiều thứ tiếng. Chữ “灰” vừa chỉ bụi tro, vừa chỉ màu xám — gợi tả môi trường sống của Lọ Lem.","bg_qs":[["《灰姑娘》原来是：",["法国作家写的小说","欧洲很多国家讲述的民间故事","中国的童话"],1],["“灰”在汉语中可以指：",["尘土和颜色","火和水","王宫和王子"],0]]},"APPLY":{"theme":"灰姑娘应该怎么做","topic":"如果你是灰姑娘，你会怎么对待继母和姐姐？","topic_vn":"Nếu bạn là Lọ Lem, bạn sẽ đối xử với dì ghẻ và hai chị thế nào? (nói 1–1,5 phút): quan điểm → lý do → ví dụ / so sánh với đời thực → kết luận.","qs":[["你读过《灰姑娘》这篇童话吗？简单地讲讲这个故事。","Bạn đã đọc truyện “Lọ Lem” chưa? Kể ngắn câu chuyện.","灰姑娘的妈妈去世以后，继母和两个姐姐对她很不好，每天让她干很多活儿。后来，在仙女的帮助下，她参加了王宫的舞会，王子爱上了她。最后，王子找到了她，他们幸福地生活在一起。",["继母","姐姐","舞会","王子","幸福"]],["如果你是灰姑娘，成为王子的心上人并进入王宫以后，你会怎么对待继母和姐姐？","Nếu là Lọ Lem, sau khi vào cung bạn sẽ đối xử với dì ghẻ và các chị thế nào?","我会原谅她们。一个已经拥有巨大幸福的人，没有必要再去报复别人。不过，我也会跟她们保持一点儿距离。",["原谅","报复","保持距离","对待"]],["作者认为应该承认人性中一些先天的不完美，你同意他的看法吗？","Tác giả cho rằng nên thừa nhận bản tính con người vốn không hoàn hảo, bạn có đồng ý không?","我同意。人都是有感情的，难免会更疼爱自己的孩子。承认人性不完美，我们才能更客观、更全面地看问题。",["同意","难免","客观","全面"]]],"vocab":[["原谅","yuánliàng","tha thứ"],["报复","bàofù","trả thù"],["善良","shànliáng","lương thiện"],["宽容","kuānróng","khoan dung"],["距离","jùlí","khoảng cách"],["继母","jìmǔ","mẹ kế"],["伤害","shānghài","làm tổn thương"],["结论","jiélùn","kết luận"],["片面","piànmiàn","phiến diện"],["以德报怨","yǐ dé bào yuàn","lấy đức báo oán"]],"build_title":"选一个观点，拼出你的回答","build_lead":"Chọn quan điểm, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại không nhìn.","step_names":["① 观点","② 理由","③ 举例 · 联系生活","④ 结论"],"build":{"A · 原谅她们":[["如果我是灰姑娘，我会原谅继母和两个姐姐。","假如我是灰姑娘，我一旦进了王宫，就不会再计较过去的事。"],["一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人。","继母更疼爱自己亲生的女儿，这是难免的，有自然倾向的理由。"],["生活中也是这样，朋友之间难免会产生误会，如果总是想着报复，自己也不会快乐。","我会请她们来王宫做客，平等地对待她们，让她们明白我已经不生气了。"],["我觉得，宽容是一种很有价值的品质。","所以，以德报怨才是最好的选择。"]],"B · 原谅但保持距离":[["如果我是灰姑娘，我会原谅她们，但是不会和她们走得太近。","我的观点是：可以原谅，但不能忘记。"],["原谅别人是为了让自己快乐，但这不代表她们的做法是对的。","她们曾经那么过分地对待我，我很难马上转变自己的感情。"],["我会给她们一些帮助，比如帮她们找工作，但是不会请她们住进王宫。","就像生活中，有些人伤害过你，你可以不恨他，但也没有必要和他做好朋友。"],["我觉得，这样做对大家都比较公平。","总之，原谅和保持距离并不矛盾。"]],"C · 阅读要有思考":[["读了这篇课文以后，我觉得阅读的时候一定要多思考。","我同意作者的观点：只读书不思考是不够的。"],["以前我读《灰姑娘》，只觉得继母很坏，从来没有想过她为什么这么做。","如果只是单纯地主张阅读而不强调思考，那是片面的。"],["现在我明白了，人性中有一些先天的不完美，我们应该客观、全面地看问题。","比如，那位美国老师通过讨论，把情感和价值判断都给了孩子们。"],["所以，读书的时候，我们不但要“知”，还要“识”。","我们需要转变自己的观念，读书的同时一定要思考。"]]},"patterns":[["① 观点","如果我是……，我会……","Nếu tôi là…, tôi sẽ…"],["① 观点","我同意／不同意作者的观点。","Tôi đồng ý / không đồng ý quan điểm của tác giả."],["② 理由","一个已经……的人，应该……","Một người đã…, nên…"],["② 理由","……是难免的。","… là khó tránh."],["③ 举例","就像生活中，……","Giống như trong cuộc sống…"],["④ 结论","如果只是单纯地……而不……，那是片面的。","Nếu chỉ đơn thuần… mà không… thì là phiến diện."]],"legend":["① Quan điểm","② Lý do","③ Ví dụ","④ Kết luận"],"w5":["过分","客观","全面","转变","观念","一旦","属于","对待","交换","承认","完美","难免","平等","自私","理由","自从","价值","单纯","主张","拥有"],"samples":[{"who":"原谅她们","meta":"Bài nói ~1 phút","p":["如果我是灰姑娘，我会原谅继母和两个姐姐。","一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人。而且，继母更疼爱自己亲生的女儿，这是难免的。","我会请她们来王宫做客，平等地对待她们，让她们明白我已经不生气了。","我觉得，宽容是一种很有价值的品质。"],"good":["一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人"],"vi":"Nếu là Lọ Lem, tôi sẽ tha thứ cho dì ghẻ và hai chị. Người đã có hạnh phúc lớn nên tha thứ và thông cảm cho người từng làm tổn thương mình; vả lại dì ghẻ thương con đẻ hơn là khó tránh. Tôi sẽ mời họ vào cung chơi, đối xử bình đẳng, để họ hiểu tôi không còn giận. Khoan dung là phẩm chất rất có giá trị."},{"who":"阅读要有思考","meta":"Bài nói ~1 phút","p":["读了这篇课文以后，我觉得阅读的时候一定要多思考。","以前我读《灰姑娘》，只觉得继母很坏，从来没有想过她为什么这么做。","现在我明白了，人性中有一些先天的不完美，我们应该客观、全面地看问题。","如果只是单纯地主张阅读而不强调思考，那是片面的。"],"good":["如果只是单纯地主张阅读而不强调思考，那是片面的"],"vi":"Đọc bài này xong, tôi thấy khi đọc nhất định phải suy nghĩ nhiều. Trước đây đọc “Lọ Lem” tôi chỉ thấy dì ghẻ xấu, chưa từng nghĩ vì sao bà làm vậy. Giờ tôi hiểu bản tính con người vốn không hoàn hảo, nên nhìn vấn đề khách quan, toàn diện. Chỉ chủ trương đọc mà không suy nghĩ là phiến diện."}]},"WRITE":{"topic":"假如我是灰姑娘","topic_vn":"Viết bài với đầu đề “Nếu tôi là Lọ Lem”, nêu suy nghĩ của bạn. Cố gắng dùng từ mới của bài, không ít hơn 100 chữ.","steps":[["①","观点","Mở bài: nếu là Lọ Lem, bạn sẽ làm gì.","假如我是灰姑娘，我会……"],["②","理由","Vì sao (đạo lý, bản tính con người).","一个已经……的人，应该……"],["③","具体做法","<b>Trọng tâm.<\/b> Bạn sẽ đối xử cụ thể thế nào.","我会……，平等地对待……"],["④","结论","Kết: điều bài học / câu chuyện dạy ta.","我觉得……"]],"samples":[{"who":"范文 1 · 原谅","title":"假如我是灰姑娘","p":["假如我是灰姑娘，我一旦进了王宫，就会原谅继母和两个姐姐。一个已经拥有巨大幸福的人，没有必要再去报复别人。继母更疼爱自己亲生的女儿，这是难免的。我会平等地对待她们，因为宽容是一种很有价值的品质。"],"vi":"Khoảng 95 chữ: dùng 一旦、拥有、难免、平等、价值."},{"who":"范文 2 · 保持距离","title":"假如我是灰姑娘","p":["假如我是灰姑娘，我会原谅她们，但是不会和她们走得太近。她们曾经那么过分地对待我，我很难马上转变自己的感情。我会给她们一些帮助，但不会请她们住进王宫。我觉得，这样做对大家都比较公平。"],"vi":"Khoảng 90 chữ: quan điểm cân bằng, dùng 过分、对待、转变、公平."},{"who":"范文 3 · 课本命题写作","title":"假如我是灰姑娘","p":["小时候读《灰姑娘》，我只觉得继母和姐姐很坏。读了这篇课文以后，我开始思考：假如我是灰姑娘，一旦进了王宫，我应该怎样对待她们呢？","我想，我会原谅她们。一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人。而且我们要承认人性的不完美，继母更疼爱自己亲生的女儿，这是难免的，有自然倾向的理由。","我会请她们来王宫做客，平等地对待她们。当然，如果她们还想伤害别人，我也不会同意。","我觉得，读童话也要多思考。如果只是单纯地看故事而不思考，那是片面的。"],"good":["一个已经拥有巨大幸福的人，应该原谅和理解那些伤害过自己的人","这是难免的","如果只是单纯地看故事而不思考，那是片面的"],"vi":"Khoảng 190 chữ. Ba chỗ gạch chân dùng lại khung 好句 / ngữ pháp của bài khóa: 一个已经……的人，应该…… · ……是难免的 · 如果只是单纯地……而不……，那是片面的."}],"tpl":"假如我是灰姑娘\n假如我是灰姑娘，一旦进了王宫，我会【怎么做】。因为【理由】。我会【具体做法】。我觉得，【结论】。","chk":[["topic","Bám đề: có nói 灰姑娘","灰姑娘"],["view","Có quan điểm (我会 · 原谅 · 不会)","我会|原谅|不会"],["why","Có lý do (因为 · 应该 · 难免)","因为|应该|难免|所以"],["end","Có kết luận (我觉得 · 总之 · 思考)","我觉得|总之|思考|所以"]],"w5":["过分","客观","全面","转变","观念","一旦","属于","对待","交换","承认","完美","难免","平等","自私","理由","自从","价值","单纯","主张","拥有"],"wmin":100,"wmax":200,"traps":"<b>Bắt buộc có:<\/b> quan điểm rõ ràng (tha thứ / giữ khoảng cách / …), lý do, cách làm cụ thể và một câu kết luận. Mượn ít nhất một khung 好句 — xem 范文 3.","hw_note":"Đọc xong phần 背景, quay lại mục 4 để viết bài “假如我是灰姑娘”."}};</script>
