<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK4 · 第2课 真正的朋友 · HSK GARDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --sheet:#FFFFFF; --ink:#14213D; --ink2:#4A5672; --rule:#C9D1DC;
  --l1:#D7263D; --l2:#E8871E; --l3:#1B998B; --l4:#3F7CC5; --l5:#7E52A0; --lx:#5B6B82; --cu:#B07A12;
  --ok:#14866D; --bad:#C2273A;
  --zh:'Noto Sans SC','PingFang SC',sans-serif; --zhs:'Noto Serif SC','Songti SC',serif; --ui:'Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);overflow:hidden}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.zh{font-family:var(--zh)}
#vp{position:fixed;inset:0;overflow:hidden}
#deck{width:1600px;height:900px;position:absolute;left:50%;top:calc(50% - 32px);transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--sheet);border-radius:22px;box-shadow:0 1px 0 var(--rule),0 30px 60px -30px rgba(20,33,61,.35);overflow:hidden;display:none;--c:var(--ink)}
.slide.on{display:block}
/* đường tàu: cột trái thể hiện vị trí trong bài */
.rail{position:absolute;left:0;top:0;bottom:0;width:132px;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:34px 0 26px}
.rail .lno{font:800 15px var(--ui);color:var(--ink2)}
.rail .lno b{display:block;font:900 46px/1 var(--zhs);color:var(--ink);margin-top:2px}
.rail ol{list-style:none;flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:28px;position:relative;width:100%}
.rail ol::before{content:'';position:absolute;left:50%;top:8px;bottom:8px;width:6px;margin-left:-3px;border-radius:3px;background:var(--grad);opacity:.35}
.rail li{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
.rail li i{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--s);display:block}
.rail li span{font:700 11.5px var(--ui);color:var(--ink2);background:#fff;padding:0 4px;white-space:nowrap}
.rail li.here i{width:30px;height:30px;background:var(--s);box-shadow:0 0 0 5px #fff,0 0 0 7px var(--s)}
.rail li.here span{color:var(--ink);font-weight:800}
.rail li.done i{background:var(--s)}
.main{position:absolute;left:132px;right:0;top:0;bottom:0;padding:52px 72px 48px 64px;display:flex;flex-direction:column}
.kick{display:flex;align-items:center;gap:14px;font:700 17px var(--ui);color:var(--c)}
.kick .pill{background:var(--c);color:#fff;border-radius:999px;padding:5px 14px;font-weight:700}
.kick .zh{font-weight:700}
h2{font:900 52px/1.15 var(--zhs);margin-top:10px;letter-spacing:.5px}
h2 small{display:block;font:500 22px/1.4 var(--ui);color:var(--ink2);margin-top:8px;letter-spacing:0}
.body{flex:1;min-height:0;margin-top:22px;display:flex;flex-direction:column}
.py{font:500 .55em var(--ui);color:var(--ink2);display:block;margin-top:.15em}
.vn{color:var(--ink2);font-family:var(--ui)}
body.hide-py .py{display:none} body.hide-vn .vn{visibility:hidden}
body.hide-vn .vn.col{display:none}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--rule);flex:none}
.say:hover{border-color:var(--c)}
.say svg{width:20px;height:20px}
.say.on{background:var(--c);border-color:var(--c);color:#fff}

/* cover */
.cover .main{padding:0;left:0}
.cv{position:absolute;inset:0;display:grid;grid-template-columns:1fr 560px}
.cv-l{padding:70px 0 60px 90px;display:flex;flex-direction:column}
.cv-tag{font:700 18px var(--ui);color:var(--ink2)}
.cv-n{font:900 260px/0.8 var(--zhs);color:var(--l1);margin:22px 0 0 -10px;letter-spacing:-6px}
.cv-t{font:900 104px/1.05 var(--zhs);margin-top:26px}
.cv-py{font:500 30px var(--ui);color:var(--ink2);margin-top:14px}
.cv-vn{font:600 26px var(--ui);margin-top:6px}
.cv-r{background:var(--ink);color:#fff;padding:64px 56px;display:flex;flex-direction:column}
.cv-r h3{font:700 20px var(--ui);color:#AEB8CC}
.route{list-style:none;margin-top:26px;position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.route::before{content:'';position:absolute;left:15px;top:14px;bottom:14px;width:6px;border-radius:3px;background:#34405E}
.route li{position:relative;padding-left:58px;display:flex;align-items:baseline;gap:14px;cursor:pointer}
.route li i{position:absolute;left:4px;top:3px;width:28px;height:28px;border-radius:50%;background:var(--ink);border:6px solid var(--s)}
.route li b{font:700 26px var(--zh);white-space:nowrap;min-width:86px}
.route li span{font:500 17px var(--ui);color:#AEB8CC}
.route li:hover b{text-decoration:underline;text-underline-offset:6px}

.cv-facts{margin-top:auto;display:flex;gap:44px;border-top:2px solid var(--ink);padding-top:20px;margin-right:60px}
.cv-facts span{font:500 17px var(--ui);color:var(--ink2)}
.cv-facts b{display:block;font:900 40px var(--zhs);color:var(--ink)}
/* mục tiêu */
.goals{display:grid;grid-template-columns:1fr;gap:0;border-top:2px solid var(--ink)}
.goals div{display:grid;grid-template-columns:220px 1fr;padding:22px 0;border-bottom:1px solid var(--rule);font-size:24px;line-height:1.5}
.goals b{font-weight:800}

/* khởi động */
.films{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.film{border:2px solid var(--ink);border-radius:16px;padding:22px 24px;text-align:left;min-height:170px;display:flex;flex-direction:column;position:relative;background:#fff}
.film .vnt{font:700 24px var(--ui)}
.film .yr{position:absolute;right:20px;top:20px;font:600 15px var(--ui);color:var(--ink2)}
.film .ans{margin-top:auto;font:700 38px var(--zh);color:var(--c);opacity:0;transform:translateY(6px);transition:.25s}
.film .ans .py{font-size:18px}
.film.open .ans{opacity:1;transform:none}
.film:not(.open)::after{content:'Bấm để xem tên tiếng Trung';position:absolute;bottom:22px;left:24px;font:500 16px var(--ui);color:var(--ink2)}
.ask{margin-top:auto;padding-top:26px;font:700 34px var(--zh);display:flex;gap:18px;align-items:center}
.ask .vn{font:500 20px var(--ui);display:block}

/* mở đầu bài khoá */
.tintro{display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1}
.scene{font:700 40px/1.4 var(--zh)}
.scene .vn{display:block;font:500 22px/1.5 var(--ui);margin-top:10px}
.gq{list-style:none;counter-reset:q;display:flex;flex-direction:column;gap:20px}
.gq li{counter-increment:q;display:grid;grid-template-columns:52px 1fr;font:500 28px/1.45 var(--zh)}
.gq li::before{content:counter(q);width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 20px var(--ui);margin-top:2px}
.gq .vn{display:block;font:500 18px var(--ui)}
.wchips{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.wchips span{border:2px solid var(--c);color:var(--ink);border-radius:999px;padding:6px 18px;font:600 24px var(--zh)}
.lbl{font:700 18px var(--ui);color:var(--ink2);margin-bottom:12px}

/* từ mới */
.words{display:grid;grid-template-columns:330px 1fr;gap:40px;flex:1;min-height:0}
.wlist{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:6px}
.wbtn{display:grid;grid-template-columns:96px 1fr;align-items:center;text-align:left;padding:10px 16px;border-radius:12px;border:2px solid transparent}
.wbtn b{font:700 32px var(--zh)}
.wbtn span{font:500 17px var(--ui);color:var(--ink2)}
.wbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.wcard{border:2px solid var(--ink);border-radius:20px;padding:36px 44px;display:flex;flex-direction:column;position:relative;min-height:0}
.wcard .hz{font:900 120px/1 var(--zhs);display:flex;align-items:flex-end;gap:28px}
.wcard .hz .meta{font:600 30px var(--ui);color:var(--ink2);padding-bottom:12px}
.wcard .hz .meta em{font-style:normal;display:block;font-size:20px;color:var(--c);font-weight:700}
.wcard .mean{font:700 30px var(--ui);margin-top:22px}
.wcard .exs{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);font:500 32px/1.5 var(--zh)}
.wcard .exs .vn{display:block;font:500 20px var(--ui)}
.colloc{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:18px}
.colloc span{background:var(--paper);border-radius:8px;padding:6px 14px;font:500 22px var(--zh)}
.wnote{margin-top:12px;font:600 19px var(--ui);color:var(--bad)}
.wcard .say{position:absolute;right:30px;top:30px}

/* ngữ pháp */
.gr{display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:1;min-height:0}
.use{font:500 23px/1.6 var(--ui)}
.rules{margin-top:22px;border-top:2px solid var(--ink)}
.rules div{display:grid;grid-template-columns:210px 1fr;gap:6px 18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.rules b{font:700 19px var(--ui)}
.rules span{font:500 19px var(--ui);color:var(--ink2)}
.rules p{grid-column:1/3;font:500 28px var(--zh)}
u{text-decoration:none;box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--c) 28%,transparent);font-weight:700}
.exlist{display:flex;flex-direction:column;gap:18px}
.ex{display:flex;gap:16px;align-items:flex-start;font:500 28px/1.45 var(--zh)}
.ex .vn{display:block;font:500 18px var(--ui)}
.chk{margin-top:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.pick{border:2px solid var(--rule);border-radius:14px;padding:14px 18px;text-align:left;font:500 24px/1.4 var(--zh);background:#fff}
.pick:hover{border-color:var(--ink)}
.pick.ok{border-color:var(--ok);background:#E7F5F0}
.pick.no{border-color:var(--bad);background:#FCEBED}
.why{font:500 18px var(--ui);color:var(--ink2);min-height:26px;margin-top:8px}

/* đọc hội thoại */
.read{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:10px}
.ln{display:grid;grid-template-columns:96px 1fr 48px;gap:16px;align-items:start;padding:8px 14px;border-radius:14px}
.ln .who{font:700 22px var(--zh);padding-top:6px;color:var(--c)}
.ln .who.f2{color:var(--ink)}
.ln .tx{font:500 27px/1.45 var(--zh)}
.ln .tx .vn{display:block;font:500 17px/1.4 var(--ui);margin-top:1px}
.ln.on{background:color-mix(in srgb,var(--c) 9%,#fff)}
.nw{border-bottom:3px solid var(--c);cursor:help}
.tools{display:flex;gap:12px;align-items:center}
.tbtn{border:2px solid var(--ink);border-radius:999px;padding:8px 20px;font:700 17px var(--ui)}
.tbtn.solid{background:var(--ink);color:#fff}

/* đúng sai */
.tfl{display:flex;flex-direction:column;gap:16px}
.tf{display:grid;grid-template-columns:48px 1fr 92px 92px;gap:16px;align-items:center;border-bottom:1px solid var(--rule);padding:14px 0;font:500 30px var(--zh)}
.tf .k{font:800 22px var(--ui);color:var(--ink2)}
.tf button{height:58px;border-radius:14px;border:2px solid var(--rule);font:800 28px var(--ui)}
.tf button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tf button.no{background:var(--bad);border-color:var(--bad);color:#fff}

/* phân biệt */
.bx{width:100%;border-collapse:collapse;font-size:21px}
.bx th{font:900 46px var(--zhs);padding:6px 16px 14px;text-align:left;border-bottom:3px solid var(--ink)}
.bx th small{font:600 18px var(--ui);color:var(--ink2);margin-left:10px}
.bx td{padding:16px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.5}
.bx td:first-child{font-weight:800;width:190px}
.bxq{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 30px;margin-top:26px}
.fq{font:500 26px var(--zh);display:flex;flex-direction:column;gap:8px}
.fq .opts{display:flex;gap:10px}
.fq .opts button{border:2px solid var(--rule);border-radius:10px;padding:4px 16px;font:600 24px var(--zh)}
.fq .opts button.ok{border-color:var(--ok);background:#E7F5F0}
.fq .opts button.no{border-color:var(--bad);background:#FCEBED}
.fq .why{font-size:16px}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--ink);text-align:center;margin:0 4px;color:var(--c);font-weight:700}

/* mở rộng */
.gan{display:grid;grid-template-columns:420px 1fr;gap:56px;flex:1}
.ganc{display:flex;flex-direction:column;align-items:flex-start}
.ganc .big{font:900 220px/1 var(--zhs);color:var(--c)}
.ganc .note{font:500 22px/1.5 var(--ui);margin-top:16px}
.gwords{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;width:100%}
.gwords div{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font:700 28px var(--zh)}
.gwords div small{display:block;font:500 16px var(--ui);color:var(--ink2)}
.fill{display:flex;flex-direction:column;gap:20px}
.fill .fq{font-size:25px;line-height:1.5}

/* đề thi */
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;flex:1;min-height:0}
.eq{border:2px solid var(--ink);border-radius:18px;padding:16px 22px;display:flex;flex-direction:column;gap:9px;position:relative}
.eq .no{font:800 18px var(--ui);display:flex;justify-content:space-between;align-items:center}
.eq .no em{font-style:normal;font:600 15px var(--ui);color:var(--c);border:2px solid var(--c);border-radius:999px;padding:2px 10px}
.eq .scr{font:500 21px/1.5 var(--zh);color:var(--ink)}
.eq .scr.hid{filter:blur(7px);user-select:none}
.eq .q{font:700 22px var(--zh)}
.eq .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.eq .rq .ops,.rq .ops{grid-template-columns:1fr 1fr}
.eq .ops button{border:2px solid var(--rule);border-radius:10px;padding:6px 12px;text-align:left;font:500 22px var(--zh)}
.eq .ops button b{font-family:var(--ui);margin-right:8px}
.eq .ops button.ok{border-color:var(--ok);background:#E7F5F0}
.eq .ops button.no{border-color:var(--bad);background:#FCEBED}
.eq .row{display:flex;gap:10px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.tiles button{border:2px solid var(--ink);border-radius:10px;padding:6px 16px;font:600 26px var(--zh);background:#fff}
.tiles button.used{opacity:.25}
.built{min-height:62px;border-bottom:2px dashed var(--ink2);font:600 28px var(--zh);padding:8px 0}

/* vận dụng */
.sp{display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1}
.spq{font:900 54px/1.3 var(--zhs)}
.spq .vn{display:block;font:500 24px var(--ui);margin-top:14px}
.steps{list-style:none;display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.steps li{display:grid;grid-template-columns:44px 1fr;padding:18px 0;border-bottom:1px solid var(--rule)}
.steps li i{font:800 22px var(--ui);color:var(--c);font-style:normal}
.steps li b{font:700 19px var(--ui);color:var(--ink2);display:block}
.steps li span{font:500 30px var(--zh)}
.timer{margin-top:22px;display:flex;align-items:center;gap:16px;font:800 44px var(--ui)}

/* thanh điều khiển */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px}
#bar button{height:42px;min-width:42px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--rule);font:600 15px var(--ui);display:inline-flex;align-items:center;gap:6px}
#bar button.off{opacity:.45;text-decoration:line-through}
#cnt{font:700 15px var(--ui);color:var(--ink2);min-width:64px;text-align:center}
@media (max-width:700px){#bar .tg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* thẻ từ v2 */
.wbtn span i{font-style:normal;font:700 13px var(--zh);color:var(--c);margin-left:8px;border:1.5px solid var(--c);border-radius:6px;padding:0 5px}
.wcard{padding:26px 34px 22px;overflow:hidden}
.wtop{display:flex;align-items:center;gap:30px;padding-bottom:18px;border-bottom:2px solid var(--ink);padding-right:70px}
.wtop .hz{font:900 104px/1 var(--zhs);flex:none}
.wtop .wm{display:flex;flex-direction:column;gap:6px;min-width:0}
.wtop .meta{font:600 26px var(--ui);color:var(--ink2)}
.wtop .meta em{font-style:normal;font-size:17px;color:var(--c);font-weight:700;margin-left:14px;text-transform:uppercase;letter-spacing:.06em}
.wtop .mean{font:700 26px/1.3 var(--ui);margin:0}
.wtop .colloc{margin:4px 0 0;padding:0}
.wtop .colloc span{font-size:19px;padding:4px 12px}
.wtop .say{position:absolute;right:30px;top:30px}
.wtabs{display:flex;gap:8px;margin:16px 0 14px}
.wtabs button{padding:8px 18px;border-radius:999px;border:2px solid var(--rule);font:600 17px var(--ui);color:var(--ink2);background:#fff;display:flex;gap:8px;align-items:baseline}
.wtabs button b{font:700 21px var(--zh);color:var(--ink)}
.wtabs button.on{border-color:var(--c);background:var(--c);color:#fff}
.wtabs button.on b{color:#fff}
.wpanes{flex:1;min-height:0;position:relative}
.wpane{display:none;height:100%;overflow:auto;padding-right:8px}
.wpane.on{display:flex;flex-direction:column}
.exl{display:flex;flex-direction:column}
.ex1{display:grid;grid-template-columns:40px 1fr 48px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.ex1 .k{font:800 18px var(--ui);color:var(--c)}
.ex1 .zh{font:500 31px/1.45 var(--zh)}
.ex1 .say,.wr1 .pex .say{position:static!important;width:42px;height:42px}
.ex1 b{color:var(--c);font-weight:700}
.wr{display:flex;flex-direction:column;gap:12px}
.wr1{display:grid;grid-template-columns:330px 1fr;gap:4px 24px;padding:12px 18px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 6%,#fff);border-radius:0 12px 12px 0}
.wr1 .pat{font:700 25px var(--zh)}
.wr1 .pvn{font:500 17px var(--ui);color:var(--ink2);grid-column:1;grid-row:2}
.wr1 .pex{grid-column:2;grid-row:1/3;font:500 25px/1.45 var(--zh);display:flex;gap:12px;align-items:center;justify-content:space-between}
.wr1 .pex .say{position:static;width:40px;height:40px;flex:none}
.gm{display:grid;grid-template-columns:1.1fr 1fr;gap:34px}
.gm .gt,.df .gt{font:800 26px var(--zh);color:var(--c);margin-bottom:6px}
.gm .use{font-size:19px;line-height:1.55}
.gm .rules{margin-top:12px}
.gm .rules div{grid-template-columns:1fr;padding:10px 0}
.gm .rules p{font-size:24px;grid-column:1}
.gm .rules u,.gm .use b{color:var(--c)}
.gm .chk,.wpane>.chk{margin-top:0}
.wpane>.chk{margin-top:18px}
.gm .pick,.wpane .pick{font-size:21px;padding:10px 14px}
.gm .why,.wpane .why{font-size:16px;min-height:22px}
.df .df1{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid var(--rule);font:500 21px/1.55 var(--ui)}
.df .df1 b{font:800 30px var(--zh)}
.df .df1 i{font-style:normal;font:500 25px var(--zh);color:var(--ink);display:block;margin-top:4px}
.ln .tx{font-size:31px;line-height:1.55}
.ln{padding:11px 14px}

/* bài tập về nhà */
.hw{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.hw section{border:2px solid var(--c);border-radius:20px;padding:0 0 18px;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.hw header{background:var(--c);color:#fff;padding:16px 26px;display:flex;align-items:baseline;gap:14px}
.hw header b{font:800 28px var(--ui)}
.hw header span{font:700 22px var(--zh);opacity:.9}

function addReview(pool,errs,rangeTxt,st,col,label){
  var head0=head;head=function(a,b,c,d){return head0(a,b,c,d).replace('>'+ST[a][0]+'<','>复习<');};
  var KEY='hsk4_roster',roster=[];try{roster=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
  function saveR(){try{localStorage.setItem(KEY,JSON.stringify(roster));}catch(e){}}
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
  // Trang 1: từ vựng
  add(st,col,head(st,label+' · Từ vựng'.replace('',''),'复习 · 词语听写',rangeTxt+' · '+pool.length+' từ · gọi từng bạn, giáo viên chấm đúng/sai')+'<div class="body"><div class="rv">'+
    '<div class="rvl"><div class="lbl">Danh sách lớp</div><div class="chips"></div><div class="addrow"><input class="nm" placeholder="Nhập tên học sinh rồi Enter"><button class="tbtn sm" data-add>Thêm</button></div><details><summary>Dán cả danh sách</summary><textarea class="bulk" placeholder="Mỗi dòng một tên"></textarea><button class="tbtn sm" data-bulk>Nhập</button></details>'+

    '<div class="rvc"><div class="who">Chọn một bạn để bắt đầu</div><div class="card"><div class="q"></div><div class="a"></div></div><div class="ctl"><span class="cnt"></span><button class="tbtn" data-show>Hiện đáp án</button><button class="tbtn okb" data-ok>✓ Đúng</button><button class="tbtn nob" data-no>✗ Sai</button></div></div>'+
    '<div class="rvr"><div class="lbl">Báo cáo · chép phạt</div><div class="rep"><p class="empty">Chưa có kết quả.</p></div><div class="rrow"><button class="tbtn sm" data-copy>Sao chép báo cáo</button><button class="tbtn sm" data-clear>Xoá kết quả</button></div></div>'+
    '</div></div>','',function(el){

  add(7,'--lx',head(7,'Sách bài tập · 听力 第二部分','第6–12题','Nghe đoạn hội thoại ngắn rồi chọn đáp án')+'<div class="body"><div class="lgrid l2 l4">'+W.listen2.map(function(q,i){return '<div class="mq lb" data-a="'+q.a+'"><div class="lbh"><i class="qn">'+(i+6)+'</i><button class="say" data-pl="'+i+'">'+SPK+'</button><span class="zh st">'+q.q+'</span><button class="tbtn sm" data-show>Lời</button></div><div class="scr hid zh">'+q.lines.map(function(l){return l[0]+'：'+l[1];}).join('<br>')+'</div>'+ops(q.o)+'</div>';}).join('')+'</div></div>','',function(el){bindOps(el);bindPlay(el,function(i){var q=W.listen2[+i];return [q.lines,'问：'+q.q];});});
  // Nghe 3 (13–18)
  var d3=W.listen3.filter(function(q){return q.lines;}),p3=W.listen3.filter(function(q){return q.passage;});
  add(7,'--lx',head(7,'Sách bài tập · 听力 第三部分','第13–18题','Hội thoại dài hơn: 4–5 lượt lời')+'<div class="body"><div class="lgrid l2">'+d3.map(function(q,i){return '<div class="mq lb" data-a="'+q.a+'"><div class="lbh"><i class="qn">'+(i+13)+'</i><button class="say" data-pl="'+i+'">'+SPK+'</button><span class="zh st">'+q.q+'</span><button class="tbtn sm" data-show>Lời</button></div><div class="scr hid zh">'+q.lines.map(function(l){return l[0]+'：'+l[1];}).join('<br>')+'</div>'+ops(q.o)+'</div>';}).join('')+'</div></div>','',function(el){bindOps(el);bindPlay(el,function(i){var q=d3[+i];return [q.lines,'问：'+q.q];});});
  add(7,'--lx',head(7,'Sách bài tập · 听力 第三部分','第19–22题','Nghe một đoạn văn, trả lời hai câu hỏi')+'<div class="body"><div class="pgrid">'+p3.map(function(p,i){return '<div class="pp"><div class="lb"><div class="lbh"><i class="qn">'+(19+i*2)+'–'+(20+i*2)+'</i><button class="say" data-pl="'+i+'">'+SPK+'</button><span class="st">Nghe đoạn văn</span><button class="tbtn sm" data-show>Lời</button></div><div class="scr hid zh">'+p.passage+'</div></div>'+p.qs.map(function(q,k){return '<div class="mq" data-a="'+q.a+'"><div class="q zh"><i class="qn">'+(19+i*2+k)+'</i>'+q.q+'</div>'+ops(q.o)+'</div>';}).join('')+'</div>';}).join('')+'</div></div>','',function(el){bindOps(el);bindPlay(el,function(i){return [[['',p3[+i].passage]],''];});});
  // Đọc 1: chọn từ
  add(7,'--lx',head(7,'Sách bài tập · 阅读 第一部分','选词填空 · 第23–30题')+'<div class="body"><div class="rf">'+W.fill.map(function(g,gi){return '<div class="rfg"><div class="bank zh">'+g.opts.map(function(o,j){return '<span><b>'+AB[j]+'</b>'+o+'</span>';}).join('')+'</div>'+g.items.map(function(it,k){return '<div class="fq" data-a="'+it[1]+'" data-why=""><span class="zh"><i class="qn">'+(23+gi*4+k)+'</i>'+it[0].replace('____','<span class="blank">　</span>')+'</span><div class="opts">'+g.opts.map(function(o,j){return '<button data-j="'+j+'">'+AB[j]+'</button>';}).join('')+'</div><div class="why"></div></div>';}).join('')+'</div>';}).join('')+'</div></div>','',quizBind);
  // Đọc 2: sắp xếp
  add(7,'--lx',head(7,'Sách bài tập · 阅读 第二部分','排列顺序 · 第31–34题','Bấm lần lượt các câu theo đúng thứ tự')+'<div class="body"><div class="og">'+W.order.map(function(q,i){return '<div class="oq" data-i="'+i+'"><div class="oh"><i class="qn">'+(31+i)+'</i><span class="seq"></span><button class="tbtn sm" data-reset>Làm lại</button></div>'+q.p.map(function(p,j){return '<button class="ob zh" data-j="'+j+'"><b>'+AB[j]+'</b>'+p+'</button>';}).join('')+'<div class="why"></div></div>';}).join('')+'</div></div>','',function(el){
    el.querySelectorAll('.oq').forEach(function(box){var q=W.order[+box.dataset.i],seq=[];var sq=box.querySelector('.seq'),why=box.querySelector('.why');
      box.addEventListener('click',function(e){var b=e.target.closest('.ob');if(b&&!b.classList.contains('used')&&seq.length<3){b.classList.add('used');b.dataset.n=seq.length+1;seq.push(AB[+b.dataset.j]);sq.textContent=seq.join(' ');if(seq.length===3){var ok=seq.join('')===q.a;why.textContent=ok?'Đúng!':'Chưa đúng. Đáp án: '+q.a.split('').join(' ');why.style.color=ok?'var(--ok)':'var(--bad)';}}
        if(e.target.closest('[data-reset]')){seq=[];sq.textContent='';why.textContent='';box.querySelectorAll('.ob').forEach(function(x){x.classList.remove('used');delete x.dataset.n;});}});});
  });
  // Đọc 3: đọc hiểu
  var n=35,M=W.mc.map(function(p){var r={t:p.t,qs:p.qs.map(function(q){return {q:q.q,o:q.o,a:q.a,n:n++};})};return r;});
  [M.slice(0,5),M.slice(5)].forEach(function(part,pi){
    add(7,'--lx',head(7,'Sách bài tập · 阅读 第三部分','请选出正确答案 · '+(pi?'第40–43题':'第35–39题'))+'<div class="body"><div class="mcg'+(pi?' two':'')+'">'+part.map(function(p){return '<div class="mcp"><div class="scr zh">'+p.t+'</div>'+p.qs.map(function(q){return '<div class="mq" data-a="'+q.a+'"><div class="q zh"><i class="qn">'+q.n+'</i>★ '+q.q+'</div>'+ops(q.o)+'</div>';}).join('')+'</div>';}).join('')+'</div></div>','',bindOps);
  });
  // Viết
  add(7,'--lx',head(7,'Sách bài tập · 书写 第一部分','完成句子 · 第44–48题','Bấm các từ theo đúng thứ tự để tạo thành câu')+'<div class="body"><div class="wl one">'+W.write.map(function(q,i){return '<div class="eq wq" data-i="'+i+'"><div class="no">第 '+q.n+' 题</div><div class="tiles">'+q.parts.map(function(p,j){return '<button data-j="'+j+'">'+p+'</button>';}).join('')+'</div><div class="built"></div><div class="row"><button class="tbtn sm" data-reset>Làm lại</button><span class="why"></span></div></div>';}).join('')+'</div></div>','',function(el){
    el.querySelectorAll('.wq').forEach(function(box){var q=W.write[+box.dataset.i],seq=[],built=box.querySelector('.built'),why=box.querySelector('.why');
      function upd(){built.textContent=seq.map(function(j){return q.parts[j];}).join('');if(seq.length===q.parts.length){var s=built.textContent;var ok=q.ans.some(function(a){return a.replace(/[。？！，]/g,'')===s;});s=q.ans[0];why.textContent=ok?'Đúng!':'Đáp án: '+q.ans[0];why.style.color=ok?'var(--ok)':'var(--bad)';}}
      box.querySelector('.tiles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.classList.contains('used'))return;b.classList.add('used');seq.push(+b.dataset.j);upd();});
      box.querySelector('[data-reset]').onclick=function(){seq=[];box.querySelectorAll('.tiles button').forEach(function(x){x.classList.remove('used');});built.textContent='';why.textContent='';};});
  });
  add(7,'--lx',head(7,'Sách bài tập · 书写 第二部分','看图，用词造句 · 第49–50题','Mỗi bạn nói/viết một câu có từ cho sẵn, rồi xem câu mẫu')+'<div class="body"><div class="wpics big">'+W.pic.map(function(p){return '<div class="wp"><img src="'+p.img+'" alt=""><div><div class="no">第 '+p.n+' 题 · dùng từ <b class="zh">'+p.w+'</b></div><div class="sam zh">'+p.sample+'</div><button class="tbtn sm" data-sam>Câu mẫu</button></div></div>';}).join('')+'</div></div>','',function(el){
    el.querySelectorAll('[data-sam]').forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle('open');};});
  });
})();

(function(){var G=L.kz;if(!G)return;var opts=G.words.map(function(w){return w[0];});
  add(8,'--lx',head(8,'Mở rộng · '+G.kind,G.title)+'<div class="body"><div class="gan"><div class="ganc"><div class="big zh'+(G.big.length>2?' sm':'')+'">'+G.big+'</div><p class="note">'+G.note+'</p><div class="gwords">'+G.words.map(function(w){return '<div>'+w[0]+'<small>'+w[1]+' · '+w[2]+'</small></div>';}).join('')+'</div></div>'+
  '<div class="fill'+(G.items.length>3?' lx kz5':'')+'">'+G.items.map(function(it){return '<div class="fq" data-a="'+opts.indexOf(it[1])+'" data-why=""><span class="zh">'+it[0].replace('____','<span class="blank">　</span>')+'</span><div class="opts">'+opts.map(function(o,j){return '<button data-j="'+j+'">'+o+'</button>';}).join('')+'</div><div class="why"></div></div>';}).join('')+'</div></div></div>','',quizBind);
})();
// Đề HSK4
(function(){var X=L.exam;
  add(9,'--lx',head(9,'Đề thật '+X.code+' · Nghe','听力','Giáo viên bấm loa để máy đọc đoạn hội thoại; chữ được làm mờ cho đến khi bấm “Hiện lời”.')+'<div class="body"><div class="exgrid">'+X.listen.map(function(q,i){
    return '<div class="eq" data-i="'+i+'"><div class="no">第 '+q.n+' 题 · '+q.kind+'<em>'+q.link+'</em></div><div class="row"><button class="say" data-ex="'+i+'">'+SPK+'</button><button class="tbtn" data-show>Hiện lời</button></div><div class="scr hid">'+q.lines.map(function(l){return (l[0]?l[0]+'：':'')+l[1];}).join('<br>')+'</div><div class="q">'+q.q+'</div>'+
      (q.o?'<div class="ops">'+q.o.map(function(o,j){return '<button data-j="'+j+'"><b>'+'ABCD'[j]+'</b>'+o+'</button>';}).join('')+'</div>':'<div class="ops"><button data-j="1"><b>√</b>Đúng</button><button data-j="0"><b>×</b>Sai</button></div>')+'</div>';}).join('')+'</div></div>','',function(el){
    el.querySelectorAll('.eq').forEach(function(box){var q=X.listen[+box.dataset.i];
      box.querySelector('[data-ex]').onclick=function(){stop();var k=0;(function nx(){if(k>=q.lines.length){say(q.q.replace('★',''));return;}var l=q.lines[k++];say(l[1],l[0],nx);})();};
      box.querySelector('[data-show]').onclick=function(){box.querySelector('.scr').classList.toggle('hid');};
      box.querySelector('.ops').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||box.dataset.done)return;box.dataset.done=1;var a=q.o?q.a:(q.tf?1:0);box.querySelectorAll('.ops button').forEach(function(x){if(+x.dataset.j===a)x.classList.add('ok');else if(x===b)x.classList.add('no');});box.querySelector('.scr').classList.remove('hid');});
    });
  });
  add(9,'--lx',head(9,'Đề thật '+X.code+' · Đọc và Viết','阅读 · 书写')+'<div class="body"><div class="exgrid">'+X.read.map(function(q,i){
    return '<div class="eq rq" data-i="'+i+'"><div class="no">第 '+q.n+' 题 · đọc hiểu<em>'+q.link+'</em></div><div class="scr">'+q.text+'</div><div class="q">★ '+q.q+'</div><div class="ops">'+q.o.map(function(o,j){return '<button data-j="'+j+'"><b>'+'ABCD'[j]+'</b>'+o+'</button>';}).join('')+'</div></div>';}).join('')+
    X.write.map(function(q,i){return '<div class="eq wq" data-i="'+i+'"><div class="no">第 '+q.n+' 题 · sắp xếp thành câu<em>'+q.link+'</em></div><div class="tiles">'+q.parts.map(function(p,j){return '<button data-j="'+j+'">'+p+'</button>';}).join('')+'</div><div class="built"></div><div class="row"><button class="tbtn" data-reset>Làm lại</button><span class="why"></span></div></div>';}).join('')+'</div></div>','',function(el){
    el.querySelectorAll('.rq').forEach(function(box){var q=X.read[+box.dataset.i];box.querySelector('.ops').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||box.dataset.done)return;box.dataset.done=1;box.querySelectorAll('.ops button').forEach(function(x){if(+x.dataset.j===q.a)x.classList.add('ok');else if(x===b)x.classList.add('no');});});});
    el.querySelectorAll('.wq').forEach(function(box){var q=X.write[+box.dataset.i],seq=[],built=box.querySelector('.built'),why=box.querySelector('.why');
      function upd(){built.textContent=seq.map(function(j){return q.parts[j];}).join('');if(seq.length===q.parts.length){var s=built.textContent;var ok=q.ans.some(function(a){return a.replace(/[。？！，]/g,'')===s;});s=q.ans[0];why.textContent=ok?'Đúng: '+s:'Chưa đúng. Đáp án: '+q.ans[0];why.style.color=ok?'var(--ok)':'var(--bad)';}}
      box.querySelector('.tiles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.classList.contains('used'))return;b.classList.add('used');seq.push(+b.dataset.j);upd();});
      box.querySelector('[data-reset]').onclick=function(){seq=[];box.querySelectorAll('.tiles button').forEach(function(x){x.classList.remove('used');});built.textContent='';why.textContent='';};
    });
  });
})();
// Vận dụng
(function(){(L.yy||[]).forEach(function(Y,yi){
  if(Y.kind==='table')add(10,'--lx',head(10,'Vận dụng '+(yi+1)+' · '+Y.vn,Y.zh,Y.task)+'<div class="body"><table class="yyt"><tr>'+Y.cols.map(function(c){return '<th class="zh">'+c+'</th>';}).join('')+'</tr>'+Y.rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td>'+r.map(function(c,j){return '<td class="zh">'+c+(j===0&&c?'<button class="say" data-say="'+esc(c.replace(/（.*?）/,''))+'">'+SPK+'</button>':'')+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>');
  else add(10,'--lx',head(10,'Vận dụng '+(yi+1)+' · '+Y.vn,Y.zh)+'<div class="body"><div class="sp"><div><div class="spq sm zh">'+Y.task+'<span class="vn">'+Y.taskvn+'</span></div><div class="timer"><button class="tbtn solid" data-t>▶ Bấm giờ 2 phút</button><span data-c>2:00</span></div></div><ol class="steps st8">'+Y.items.map(function(s,i){return '<li><i>'+(Y.letters?'abcdefghij'[i]:(i+1))+'</i><div><span class="zh">'+s+'</span></div></li>';}).join('')+'</ol></div></div>','',function(el){
    var tm=null;el.querySelector('[data-t]').onclick=function(){clearInterval(tm);var n=120,c=el.querySelector('[data-c]');tm=setInterval(function(){n--;c.textContent=Math.floor(Math.max(n,0)/60)+':'+String(Math.max(n,0)%60).padStart(2,'0');if(n<=0){clearInterval(tm);c.textContent='Hết giờ';}},1000);};
  });
});})();

// Bài tập về nhà
add(11,'--lx',head(11,'Bài tập về nhà','作业','Bài 1 học trong 2 buổi · nộp trước buổi học tiếp theo')+'<div class="body"><div class="hw">'+L.hw.map(function(b){return '<section style="--c:var('+b.col+')"><header><b>'+b.s+'</b><span class="zh">'+b.zh+'</span><em class="zh">'+b.range+'</em></header>'+
  b.tasks.map(function(k,i){return '<div class="hwt"><div class="hwh"><i>'+(i+1)+'</i><b>'+k.t+'</b><span class="tag">'+k.kind+'</span></div><ul>'+k.req.map(function(r){return '<li>'+r.replace(/([\u4e00-\u9fa5][^a-zA-Zà-ỹ0-9]*[\u4e00-\u9fa5？。])/g,'<span class="zh">$1</span>')+'</li>';}).join('')+'</ul>'+(k.kw?'<div class="kw">'+k.kw.map(function(x){return '<div><b class="zh">'+x[0]+'</b><span class="zh">'+x[1]+'</span></div>';}).join('')+'</div>':'')+'</div>';}).join('')+'</section>';}).join('')+'</div></div>');

// ---------- dựng và điều hướng ----------
slides.forEach(function(s,i){var el=document.createElement('section');el.className='slide '+s.cls;el.style.setProperty('--c','var('+s.c+')');
  el.innerHTML=(s.st>=0?rail(s.st)+'<div class="main">'+s.html+'</div>':'<div class="main">'+s.html+'</div>');deck.appendChild(el);s.el=el;if(s.init)s.init(el);});
var cur=0;
function go(i){i=Math.max(0,Math.min(slides.length-1,i));stop();slides[cur].el.classList.remove('on');cur=i;slides[cur].el.classList.add('on');document.getElementById('cnt').textContent=(cur+1)+' / '+slides.length;try{history.replaceState(null,'','#'+(cur+1));}catch(e){}}
deck.addEventListener('click',function(e){
  var s=e.target.closest('[data-say]');if(s){stop();say(s.dataset.say);s.classList.add('on');setTimeout(function(){s.classList.remove('on');},900);}
  var f=e.target.closest('.film');if(f)f.classList.add('open');
  var r=e.target.closest('[data-go]');if(r){var st=+r.dataset.go;var k=slides.findIndex(function(x){return x.st===st;});if(k>=0)go(k);}
  var l=e.target.closest('[data-line]');if(l){e.stopPropagation();}
});
document.getElementById('prev').onclick=function(){go(cur-1);};
document.getElementById('next').onclick=function(){go(cur+1);};
document.getElementById('fs').onclick=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();};
function tog(id,cls){var b=document.getElementById(id);b.onclick=function(){var on=document.body.classList.toggle(cls);b.classList.toggle('off',on);};}
tog('tpy','hide-py');tog('tvn','hide-vn');
document.addEventListener('keydown',function(e){if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}});
var tx=null;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});document.addEventListener('touchend',function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(cur+(d<0?1:-1));tx=null;});
function fit(){var w=innerWidth,h=innerHeight-64;var s=Math.min(w/1600,h/900)*.97;deck.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
var start=parseInt((location.hash||'#1').slice(1),10)-1;go(isNaN(start)?0:start);
})();
</script>
