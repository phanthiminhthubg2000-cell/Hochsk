 自己</h3>\n  <div class="ex-list">${A("为什么想去西安？","Wèi shénme xiǎng qù Xī'ān?","Sao muốn đi Tây An?")}${A("对了，我们去西安旅游，怎么样？","Duìle, wǒmen qù Xī'ān lǚyóu, zěnmeyàng?","À đúng rồi, mình đi Tây An du lịch nhé?")}${A("就在桌子上，你自己拿。","Jiù zài zhuōzi shang, nǐ zìjǐ ná.","Ở ngay trên bàn, em tự lấy nhé.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：昨天你在家吗？ B：我有点儿事，＿＿了一下。 → ${i("我有点儿事，出去了一下。")}</div>\n  <div class="qa">2. A：你的手机是不是在桌子上？ B：我在桌子上＿＿，但没有。 → ${i("我在桌子上找了找，但没有。")}</div>\n  <div class="qa">3. A：昨天下午你做什么了？ B：我在房间＿＿书，＿＿字。 → ${i("我在房间看了看书，写了写字。")}</div>\n</div>`,t4:`\n<div class="gram-card"><h3><span class="no">1</span>Ôn tổng hợp trong bài khoá 4</h3>\n  <table class="compare"><tr><th>Điểm ngữ pháp</th><th>Câu trong bài</th></tr>\n    <tr><td>Bổ ngữ kết quả</td><td class="zh">送完孩子回家后……</td></tr>\n    <tr><td>Câu kiêm ngữ 让 (bài 1)</td><td class="zh">让他回去上班。</td></tr>\n    <tr><td>Lặp động từ ABAB</td><td class="zh">真想让他休息休息。</td></tr>\n    <tr><td>每……都……</td><td class="zh">他这个月每天都很累。</td></tr></table>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>回来 · 回去 · 送</h3>\n  <table class="compare"><tr><th>回来 — về phía người nói</th><th>回去 — rời xa người nói</th></tr>\n    <tr><td class="zh">你什么时候回来？ (mẹ ở nhà hỏi)</td><td class="zh">医院让他回去上班。</td></tr></table>\n  <div class="ex-list">${A("刘明开车送孩子去学校。","Liú Míng kāichē sòng háizi qù xuéxiào.","Lưu Minh lái xe đưa con đến trường.")}${A("这是朋友送我的书。","Zhè shì péngyou sòng wǒ de shū.","Đây là sách bạn tặng mình.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ Kiểm tra nhanh</div>\n  <div class="qa">1. Mình làm xong bài tập rồi. → ${i("我做完作业了。")}</div>\n  <div class="qa">2. Ngày nào mẹ cũng rất mệt. → ${i("妈妈每天都很累。")}</div>\n  <div class="qa">3. Bạn nghĩ thử xem. → ${i("你想一想。/ 你想想。")}</div>\n</div>`}),LESSON.pron={toneWords:[["回来","huílái","2 + 2"],["一起","yìqǐ","4 + 3"],["出去","chūqù","1 + 4"],["自己","zìjǐ","4 + 3"],["不错 Đường, nơi lưu giữ kinh Phật do Đường Tăng mang về.</td></tr>\n      <tr><td class="zh">西安城墙 Chéngqiáng</td><td>Tường thành cổ còn nguyên vẹn nhất Trung Quốc — có thể đạp xe trên mặt thành.</td></tr>\n      <tr><td class="zh">回民街 Huímín Jiē</td><td>Phố ẩm thực: 肉夹馍 (bánh kẹp thịt), 羊肉泡馍 (canh bánh thịt cừu), 凉皮 (bánh cuốn lạnh).</td></tr></table>\n    <p class="hint">Tên các danh thắng và món ăn chỉ là mở rộng, không bắt buộc học thuộc.</p>\n  </div>\n</div>\n<div class="sub-content" id="c2">\n  <div class="gram-card"><h3><span class="no">★</span>课堂活动 · 双人活动 (Hoạt động cặp đôi)</h3>\n    <p>Hai người một nhóm, hỏi nhau: <b>có muốn đi du lịch không? Đã nghĩ ra đi đâu chưa? Tại sao chọn nơi đó?</b>… Dùng càng nhiều từ mới và ngữ pháp của bài càng tốt (为什么, bổ ngữ kết quả, lặp động từ).</p>\n    <div class="check"><div class="check-title">💬 小语的例子 · Mẫu của Tiểu Ngữ</div>\n      <p class="zh" style="font-size:20px;line-height:1.9">A：你想去旅游吗？<br>B：我想去旅游。<br>A：你想好去哪儿了吗？<br>B：想好了，我想去西安。<br>A：为什么想去西安？<br>B：我看了看网上的介绍，西安的兵马俑很不错！<br>A：我也想去看看，我们一起去吧！</p>\n    </div>\n  </div>\n</div>'};</script>

<script id="vx-js">/* ============================================================
   HSK GARDEN · PHÂN TÍCH TỪ VỰNG (bố cục mới, HSK1–2)
   Dựng lại tab 生词 thành: dải từ mới · thẻ phân tích từ · luyện viết lồng ghép.
   Nội dung lấy NGUYÊN từ bài: thẻ từ, cửa sổ chi tiết (vd), thẻ viết chữ (char-card).
   Tab 写字 riêng được gộp vào đây (nét cơ bản · quy tắc · bộ thủ đặt trong mục mở rộng).
   ============================================================ */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var CACHE = {};

  /* Lấy nội dung chi tiết của một từ bằng chính cửa sổ chi tiết của bài (không viết lại nội dung). */
  function detailOf(word, srcEl) {
    if (CACHE[word]) return CACHE[word];
    var modal = $("#vocabDetailModal"), body = $("#vdBody");
    var info = { word: word, py: "", tags: [], mean: "", note: "", exHTML: "" };
    if (!modal || !body || !srcEl) return info;
    srcEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    var pyEl = $("#vdPy");
    if (pyEl) { var c = pyEl.cloneNode(true); $$(".spk", c).forEach(function (b) { b.remove(); }); info.py = c.textContent.trim(); }
    $$(".vd-row .vd-tag", body).forEach(function (t) { info.tags.push({ hv: t.classList.contains("hv"), html: t.innerHTML }); });
    var m = $(".vd-mean", body); if (m) info.mean = m.innerHTML;
    var n = $(".vd-note", body); if (n) info.note = n.innerHTML;
    var ex = $(".ex-list", body); if (ex) info.exHTML = ex.innerHTML;
    var close = $("[data-vd-close]", modal);
    if (close) close.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
    if (!$(".big-modal.open")) document.body.classList.remove("modal-open");
    CACHE[word] = info;
    return info;
  }

  function build(sec) {
    var id = sec.id.replace(/-vocab$/, "");
    var modalBody = sec.closest(".modal-body") || sec.parentElement;
    var writeSec = document.getElementById(id + "-write");
    var writeBtn = $('.sub-tab-btn[data-sub="' + id + '-write"]', modalBody);

    /* ---- 1. Danh sách từ (giữ thứ tự & nhóm như bài) ---- */
    var items = [];
    var groups = $$(".vgroup", sec);
    if (groups.length) {
      groups.forEach(function (g) {
        var head = $(".vgroup-head", g);
        $$(".vocab-card[data-vocab]", g).forEach(function (card, i) { items.push({ card: card, group: i === 0 && head ? head.innerHTML : null }); });
      });
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { if (!items.some(function (x) { return x.card === card; })) items.push({ card: card }); });
    } else {
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { items.push({ card: card }); });
    }

".hx-opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.hx-opt{border:2px solid var(--line,#d8dfcc);background:#fff;border-radius:12px;padding:8px 14px;font-size:22px;cursor:pointer;font-family:var(--zh)}"+
".hx-opt img{display:block;width:140px;height:105px;object-fit:cover;border-radius:8px}.hx-opt.imgopt{padding:6px}.hx-opt b{font-family:var(--vi);margin-right:6px;color:var(--gold,#b8862f)}"+
".hx-opt.right{background:var(--green,#2e6b52);border-color:var(--green,#2e6b52);color:#fff}.hx-opt.right b{color:#fff}.hx-opt.wrong{background:#f3d3cd;border-color:#d69a8f}.hx-q.done .hx-opt{cursor:default}"+
".hx-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 6px}.hx-legend figure{margin:0;border:1px solid var(--line,#d8dfcc);border-radius:12px;background:#fff;padding:6px;text-align:center}"+
".hx-legend img{width:100%;height:110px;object-fit:cover;border-radius:8px}.hx-legend figcaption{font-weight:800;font-size:18px;color:var(--gold,#b8862f)}"+
".hx-bank{display:flex;flex-wrap:wrap;gap:8px;font-size:22px;padding:10px 14px;border-radius:12px;background:var(--gold2,#f6ecd6);margin:6px 0 4px;font-family:var(--zh)}.hx-bank span b{font-family:var(--vi);color:var(--gold,#b8862f);margin-right:4px}"+
".hx-text{font-size:22px;font-family:var(--zh);line-height:1.7}.hx-qs{font-size:19px;color:var(--deep,#1f4a3a);margin-top:4px;font-family:var(--zh)}"+
".hx-script{display:none;margin-top:8px;font-size:18px;color:var(--muted,#66705f);font-family:var(--zh);border-left:3px solid var(--gold,#b8862f);padding-left:10px}.hx-q.done .hx-script{display:block}"+
".hx-in{font-size:24px;width:70px;text-align:center;border:2px solid var(--line,#d8dfcc);border-radius:10px;padding:4px;font-family:var(--zh)}.hx-in.right{border-color:var(--green,#2e6b52);background:#e6f1ea}.hx-in.wrong{border-color:#d69a8f;background:#f3d3cd}"+
".hx-ok{color:var(--green,#2e6b52);font-weight:800}.hx-no{color:var(--red,#b8483a);font-weight:800}"+
".hx-tr{margin-top:14px;border:1px dashed var(--gold,#b8862f);background:#fffdf7;border-radius:14px;padding:12px 16px}"+
".hx-tr h4{margin:0 0 4px;font-size:19px;color:var(--deep,#1f4a3a)}.hx-tr .req{color:var(--muted,#66705f);font-size:15px;margin-bottom:6px}"+
".hx-tr ol{margin:0;padding-left:26px}.hx-tr li{padding:6px 0;font-size:18px;border-bottom:1px solid #f1ede2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 14px;align-items:center}@media(max-width:700px){.hx-tr li{grid-template-columns:1fr}}.hx-tr li:last-child{border-bottom:0}"+
".hx-tr li .ans{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hx-tr li .reveal{font-family:var(--zh);font-size:21px}.hx-tr li .hx-say{display:none;border:0;background:var(--mint2,#eef3e6);border-radius:8px;padding:2px 8px;cursor:pointer}.hx-tr li.shown .hx-say{display:inline-block}"+
".hx-tools{display:flex;gap:8px;margin-top:8px}";
document.head.appendChild(css);

/* ================= LUYỆN DỊCH NGỮ PHÁP ================= */
(X.tr||[]).forEach(function(g,gi){
  var card=$$(".gram-card").find(function(c){var h=c.querySelector("h3");return h&&h.textContent.indexOf(g.m)>=0;});
  if(!card)return;
  var box=document.createElement("div");box.className="hx-tr";
  box.innerHTML='<h4>🔁 练习翻译 · Luyện dịch Việt → Trung</h4><div class="req">Dịch 10 câu sau sang tiếng Trung (viết vào vở hoặc nói to), dùng đúng cấu trúc vừa học. Bấm ô để xem đáp án tham khảo, bấm 🔊 để nghe.</div><ol>'+
    g.items.map(function(it){return '<li><span class="vi">'+esc(it[0])+'</span><div class="ans"><button type="button" class="reveal" data-ans="'+esc(it[1])+'"></button><button type="button" class="hx-say" data-hxsay="'+esc(it[1])+'" aria-label="Nghe">🔊</button></div></li>';}).join("")+
    '</ol><div class="hx-tools"><button type="button" data-hxall>Hiện tất cả đáp án</button></div>';
  card.appendChild(box);
});

/* ================= ĐỀ LUYỆN HSK 3.0 ================= */
var T=X.test;var h2=$("#h2"),h3=$("#h3");
if(T&&h2&&h3){
  var IMGS=poolImgs().filter(function(k){return img(k);});
  var useImg=IMGS.length>=3;
  var Q=[];/* {el, ok} */
  function scoreUpd(){var done=Q.filter(function(q){return q.d;}),ok=done.filter(function(q){return q.ok;});
    $$(".hx-score .t").forEach(function(e){e.textContent="Đúng "+ok.length+" / "+Q.length+" câu · đã làm "+done.length;});
    $$(".hx-score .bar i").forEach(function(e){e.style.width=(Q.length?ok.length/Q.length*100:0)+"%";});}
  function reg(el){var q={el:el,d:false,ok:false};Q.push(q);return q;}
  function mark(q,ok){q.d=true;q.ok=ok;q.el.classList.add("done");scoreUpd();}
  function playBtn(text){return '<button type="button" class="hx-play" data-hxsay="'+esc(text)+'">▶ Nghe</button>';}
  function head(n,inner){return '<div class="hd"><span class="num">'+n+'</span>'+inner+'</div>';}
  var num=0;
  /* chọn 1 đáp án */
  function choice(host,n,headHtml,opts,right,script,imgMode){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+opts.map(function(o,i){return '<button type="button" class="hx-opt'+(imgMode?" imgopt":"")+'" data-i="'+i+'"><b>'+LET[i]+'</b>'+(imgMode?'<img src="'+img(o)+'" alt="Tranh '+LET[i]+'">':esc(o))+'</button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  /* nối với chữ cái (tranh / câu trả lời) */
  function letters(host,n,headHtml,count,right,script){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+LET.slice(0,count).split("").map(function(c,i){return '<button type="button" class="hx-opt" data-i="'+i+'"><b style="margin:0">'+c+'</b></button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  function block(host,title,req){var b=document.createElement("div");b.className="hw-block";b.innerHTML='<h3>'+title+'</h3><div class="req">'+req+'</div>';host.appendChild(b);return b;}
  function legend(b,keys){var g=document.createElement("div");g.className="hx-legend";g.innerHTML=keys.map(function(k,i){return '<figure><img src="'+img(k)+'" alt="Tranh '+LET[i]+'"><figcaption>'+LET[i]+'</figcaption></figure>';}).join("");b.appendChild(g);}
  function dlg(s){return esc(s).split("|").join("<br>");}
  function legendFor(items,extra){var keys=[];items.forEach(function(it){if(keys.indexOf(it[1])<0)keys.push(it[1]);});
    (extra||[]).forEach(function(k){if(keys.indexOf(k)<0&&img(k))keys.push(k);});return shuf(keys);}
  var lv=X.lv||1;
  /* ---- dựng tab ---- */
  function scoreBar(host){var s=document.createElement("div");s.className="hx-score";s.innerHTML='<span>📝 Đề luyện HSK '+lv+' (dạng đề 3.0)</span><span class="t"></span><div class="bar"><i></i></div><button type="button" data-hxreset>↻ Làm lại</button>';host.appendChild(s);}
  function build(){
    Q=[];num=0;h2.innerHTML="";h3.innerHTML="";
    scoreBar(h2);
    var intro=document.createElement("div");intro.className="hw-block";intro.innerHTML='<h3>综合练习 · Đề luyện HSK '+lv+' (dạng đề HSK 3.0)</h3><div class="req">Câu hỏi soạn theo đúng các phần của đề thi HSK '+lv+' 3.0, dùng từ vựng và mẫu câu của bài này. Phần nghe dùng giọng đọc tự động: bấm <b>▶ Nghe</b> (có thể nghe lại). Chọn đáp án là chấm ngay; lời thoại hiện ra sau khi trả lời. Phần 阅读'+(lv>1?" và 书写":"")+' ở tab tiếp theo.</div>';h2.appendChild(intro);
    var band=document.createElement("div");band.className="hx-band";band.textContent="听力 · NGHE HIỂU";h2.appendChild(band);
    var pi=0;function pn(){return "第"+"一二三四五六"[pi++]+"部分";}
    /* nghe chọn tranh */
    if(useImg&&T.li&&T.li.length){var b=block(h2,pn()+" · Nghe, chọn tranh đúng","听录音，选出对应的图片。");
      T.li.forEach(function(it){var others=it[2]||shuf(IMGS.filter(function(k){return k!==it[1];})).slice(0,2);var opts=shuf([it[1]].concat(others));choice(b,++num,playBtn(it[0]),opts,opts.indexOf(it[1]),dlg(it[0]),true);});}
    /* HSK1: nghe câu chọn từ xuất hiện */
    if(lv===1&&T.lw&&T.lw.length){var b2=block(h2,pn()+" · Nghe câu, chọn từ có trong câu","听句子，选出句子中出现的词语。");
      T.lw.forEach(function(it){choice(b2,++num,playBtn(it[0]),it[1],it[2],dlg(it[0]));});}
    /* nghe hội thoại, nối tranh */
    if(useImg&&T.lm&&T.lm.length){var b3=block(h2,pn()+" · Nghe hội thoại, chọn tranh (mỗi tranh dùng 1 lần)","听对话，选出对应的图片。");var keys=legendFor(T.lm,T.lmx);legend(b3,keys);
      T.lm.forEach(function(it){letters(b3,++num,playBtn(it[0]),keys.length,keys.indexOf(it[1]),dlg(it[0]));});}
    /* nghe đoạn / hội thoại + câu hỏi */
    if(T.lq&&T.lq.length){var b4=block(h2,pn()+" · Nghe "+(lv===1?"một đoạn ngắn":"hội thoại")+" và câu hỏi, chọn đáp án","听"+(lv===1?"一段话":"对话")+"和问题，选出正确答案。");
      T.lq.forEach(function(it){choice(b4,++num,playBtn(it[0]+"|"+it[1]),it[2],it[3],dlg(it[0])+"<br><b>"+esc(it[1])+"</b>");});}
    /* ---------- 阅读 ---------- */
    scoreBar(h3);
    var bandR=document.createElement("div");bandR.className="hx-band";bandR.textContent="阅读 · ĐỌC HIỂU";h3.appendChild(bandR);pi=0;
    function rm(){if(useImg&&T.rm&&T.rm.length){var b=block(h3,pn()+" · Đọc câu, chọn tranh (mỗi tranh dùng 1 lần)","读句子，选出对应的图片。");var keys=legendFor(T.rm,T.rmx);legend(b,keys);
      T.rm.forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',keys.length,keys.indexOf(it[1]));});}}
    function rt(){if(T.rt&&T.rt[1].length){var b=block(h3,pn()+" · Chọn câu trả lời phù hợp","选择合适的答句。");var bk=document.createElement("div");bk.className="hx-bank";bk.style.flexDirection="column";bk.innerHTML=T.rt[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("");b.appendChild(bk);
      T.rt[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',T.rt[0].length,it[1]);});}}
    function rf(){if(T.rf&&T.rf[1].length){var b=block(h3,pn()+" · Chọn từ điền vào chỗ trống","选词填空。");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.rf[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");b.appendChild(bk);
      T.rf[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0]).replace("（ ）","（　）").split("|").join("<br>")+'</span>',T.rf[0].length,it[1]);});}}
    function rp(){if(T.rp&&T.rp.length){var b=block(h3,pn()+" · Đọc đoạn văn, chọn đáp án đúng","读一段话，选择正确答案。");
      T.rp.forEach(function(it){choice(b,++num,'<div><div class="hx-text">'+esc(it[0])+'</div><div class="hx-qs">'+esc(it[1])+'</div></div>',it[2],it[3]);});}}
    if(lv===1){rm();rt();rf();rp();}else{rm();rf();rt();rp();}
    /* ---------- 书写 (HSK2+) ---------- */
    if(lv>=2&&((T.wr&&T.wr[1].length)||(T.wc&&T.wc.length))){
      var bandW=document.createElement("div");bandW.className="hx-band";bandW.textContent="书写 · VIẾT";h3.appendChild(bandW);pi=0;
      if(T.wr&&T.wr[1].length){var bw=block(h3,pn()+" · Chọn bộ phận còn thiếu của chữ","选择合适的部件，组成正确的词语。(Mỗi từ có một chữ bị thiếu một bộ phận.)");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.wr[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");bw.appendChild(bk);
        T.wr[1].forEach(function(it){letters(bw,++num,'<span class="hx-text">'+esc(it[0])+'</span> <small style="color:var(--muted)">'+esc(it[1])+'</small>',T.wr[0].length,it[2],"→ "+esc(it[3]));});}
      if(T.wc&&T.wc.length){var bc=block(h3,pn()+" · Viết chữ Hán còn thiếu","写汉字。(Gõ chữ còn thiếu vào ô rồi bấm Kiểm tra.)");
        T.wc.forEach(function(it){var el=document.createElement("div");el.className="hx-q";var n=++num;
          el.innerHTML=head(n,'<div><div class="hx-text">'+esc(it[0]).replace("（ ）",'（<input class="hx-in" maxlength="2" aria-label="Chữ còn thiếu">）')+'</div>'+(it[2]?'<div style="font-size:15px;color:var(--muted)">'+esc(it[2])+'</div>':"")+'</div> <button type="button" class="hx-play" data-hxchk>Kiểm tra</button> <span class="res"></span>');
          bc.appendChild(el);var q=reg(el);var inp=$("input",el);
          $("[data-hxchk]",el).addEventListener("click",function(){if(q.d||!inp.value.trim())return;var ok=inp.value.trim()===it[1];inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".res",el).innerHTML=ok?'<span class="hx-ok">✓ Đúng</span>':'<span class="hx-no">✗ Đáp án: '+esc(it[1])+'</span>';mark(q,ok);});});}
    }
    scoreUpd();
  }
  build();
  var b2=$('.sub-tab-btn[data-sub="h2"]'),b3=$('.sub-tab-btn[data-sub="h3"]');
  if(b2)b2.textContent="2 · Đề HSK: 听力";if(b3)b3.textContent="3 · Đề HSK: 阅读"+(lv>1?" & 书写":"");
  document.addEventListener("click",function(e){var r=e.target.closest&&e.target.closest("[data-hxreset]");if(r){speechSynthesis&&speechSynthesis.cancel();build();}});
}
/* ---------- chung ---------- */
document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-hxsay]");if(s){e.stopPropagation();speak(s.getAttribute("data-hxsay"),s.classList.contains("hx-play")?s:null);return;}
  var a=e.target.closest&&e.target.closest("[data-hxall]");if(a){var box=a.closest(".hx-tr");var any=$$(".reveal:not(.shown)",box).length>0;$$(".reveal",box).forEach(function(r){if(any!==r.classList.contains("shown"))r.click();});a.textContent=any?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";return;}
  var rv=e.target.closest&&e.target.closest(".hx-tr .reveal");if(rv){var li=rv.closest("li");setTimeout(function(){li.classList.toggle("shown",rv.classList.contains("shown"));},0);}
},true);
})();
</script>
</body></html>
