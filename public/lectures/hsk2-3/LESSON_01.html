1 bài 15 (去机场接人). Mở rộng: 接电话 = nghe điện thoại.",ex:[["让我来接你们。","Ràng wǒ lái jiē nǐmen.","Bảo chị đến đón các em."],["是您姐姐来接的我们。","Shì nín jiějie lái jiē de wǒmen.","Là chị gái cô đến đón chúng em."]]},"次":{sgk:5,link:"第一次 · 三次",py:"cì",pos:"m.",posVi:"lượng từ",vi:"lần",hv:"thứ",en:"time; occurrence",note:"Lượng từ chỉ số lần: <b>第 + số + 次</b> = lần thứ mấy: 第一次 (lần đầu). <b>số + 次</b> = mấy lần: 去过三次.",ex:[["你们是第一次来北京吗？","Nǐmen shì dì-yī cì lái Běijīng ma?","Các em đến Bắc Kinh lần đầu à?"],["这已经是我第三次来北京了。","Zhè yǐjīng shì wǒ dì-sān cì lái Běijīng le.","Đây đã là lần thứ ba mình đến Bắc Kinh."]]},"旅游":{sgk:6,link:"来旅游 · 去旅游",py:"lǚyóu",pos:"v.",posVi:"động từ",vi:"du lịch",hv:"lữ du",en:"travel; make a tour",note:"旅 (lữ — đi xa) + 游 (du — chơi). Chú ý <b>lǚ</b> có ü: môi tròn như khi nói “uy” mà không đổi khẩu hình.",ex:[["我们是来旅游的。","Wǒmen shì lái lǚyóu de.","Chúng em đến để du lịch."]]},"帮忙":{sgk:7,link:"帮个忙 · 帮我的忙",py:"bāngmáng",pos:"v.",posVi:"động từ (ly hợp)",vi:"giúp đỡ",hv:"bang mang",en:"help",note:"<b>Từ ly hợp</b>: có thể tách ra — 帮<b>个</b>忙, 帮<b>我的</b>忙. Không nói <s>帮忙我</s> → 帮我 / 帮我的忙.",ex:[["我想请你帮个忙。","Wǒ xiǎng qǐng nǐ bāng ge máng.","Mình muốn nhờ bạn giúp một việc."],["你可以叫李文帮忙。","Nǐ kěyǐ jiào Lǐ Wén bāngmáng.","Bạn có thể nhờ Lý Văn giúp."]]},"不好意思":{sgk:8,link:"≈ 对不起 (nhẹ hơn)",py:"bù hǎoyìsi",pos:"",posVi:"cụm từ",vi:"ngại quá, xin lỗi",hv:"bất hảo ý tư",en:"find it embarrassing (to do sth)",note:"Dùng khi từ chối, làm phiền hay xin lỗi nhẹ nhàng — mềm hơn 对不起. Đọc <b>bù hǎoyìsi</b> (思 thanh nhẹ).",ex:[["不好意思，我已经到北京了。","Bù hǎoyìsi, wǒ yǐjīng dào Běijīng le.","Ngại quá, mình đến Bắc Kinh rồi."]]},"已经":{sgk:9,link:"已经……了",py:"yǐjīng",pos:"adv.",posVi:"phó từ",vi:"đã, rồi",hv:"dĩ kinh",en:"already",note:"Thường đi với <b>了</b> cuối câu: <b>已经 + động từ + 了</b>.",ex:[["我已经到北京了。","Wǒ yǐjīng dào Běijīng le.","Mình đã đến Bắc Kinh rồi."],["我们已经到北京了。","Wǒmen yǐjīng dào Běijīng le.","Chúng em đã đến Bắc Kinh rồi."]]},"那":{sgk:10,link:"那 + kết luận", /td></tr></table>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>给 + người + động từ · 让 + người + động từ</h3>\n  <table class="compare"><tr><th>给 (HSK 1) — động từ</th><th>给 (HSK 2) — giới từ</th></tr>\n    <tr><td class="zh">给我一杯茶。</td><td class="zh">一飞给我打电话了。</td></tr><tr><td>đưa cho</td><td>(làm gì) cho / đến ai</td></tr></table>\n  <div class="ex-list">${A("一飞给我打电话了，让我来接你们。","Yīfēi gěi wǒ dǎ diànhuà le, ràng wǒ lái jiē nǐmen.","Nhất Phi gọi điện cho chị, bảo chị đến đón các em.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：这是＿＿？ B：对，是我的手机，谢谢你！ → ${i("这是你的手机吧？")}</div>\n  <div class="qa">2. A：你＿＿？认识你很高兴。 B：是。认识你，我也很高兴。 → ${i("你是李文吧？")}</div>\n  <div class="qa">3. A：很晚了，老师＿＿？ B：那我们明天再去学校找她。 → ${i("老师已经回家了吧？")}</div>\n</div>`,t2:`\n<div class="gram-card"><h3><span class="no">2</span>“是……的”句 · Câu 是……的 <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <p>Dùng để <b>nhấn mạnh</b> thời gian, địa điểm, cách thức, người làm, mục đích… của một việc <b>đã xảy ra</b>. Câu khẳng định và câu hỏi có thể bỏ 是; <b>câu phủ định không được bỏ 是</b> (不是……的).</p>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">(是)</span><span class="plus">+</span><span class="slot">thời gian / nơi / cách / mục đích</span><span class="plus">+</span><span class="slot">động từ</span><span class="plus">+</span><span class="slot fix">的</span></div>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("我们是来旅游的。","Wǒmen shì lái lǚyóu de.","Chúng em đến để du lịch. (mục đích)")}${A("苹果在哪儿买的？","Píngguǒ zài nǎr mǎi de?","Táo mua ở đâu thế? (nơi chốn – bỏ 是)")}${A("我们不是坐出租车去的。","Wǒmen bú shì zuò chūzūchē qù de.","Chúng tôi không đi bằng taxi. (cách thức – phủ định giữ 是)")}</div></div>\n  <table class="compare"><tr><th>Nhấn mạnh</th><th>Ví dụ trong bài</th></tr>\n    <tr><td>thời gian</td><td class="zh">我是今天早上到的。</td></tr>\n    <tr><td>mục đích</td><td class="zh">你们是来学中文的吗？</td></tr>\n    <tr><td>người làm</td><td class="zh">是您姐姐来接的我们。</td></tr></table>\n  <div class="warn">⚠️ Việc <b>đã xảy ra</b> mới dùng 是……的. Không nói <s>我明天是去的</s>.</div>\n</div>\n<div class="gram-card"><h3><span class="no">★</span>第一次 · 有事就找我</h3>\n  <div class="ex-list">${A("你们是第一次来北京吗？","Nǐmen shì dì-yī cì lái Běijīng ma?","Các em đến Bắc Kinh lần đầu à?")}${A("你们有事就找我。","Nǐmen yǒu shì jiù zhǎo wǒ.","Có việc gì các em cứ tìm chị.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：你是坐车来学校的吗？ B：＿＿。 → ${i("是的，我是坐公交车来的。/ 不是，我是走路来的。")}</div>\n  <div class="qa">2. A：你今天是几点到学校的？ B：＿＿。 → ${i("我是八点到的。")}</div>\n  <div class="qa">3. A：＿＿？ B：我是在书店看见安妮的。 → ${i("你是在哪儿看见安妮的？")}</div>\n</div>`,t3:`\n<div class="gram-card"><h3><span class="no">3</span>兼语句 · Câu kiêm ngữ với 请 / 让 / 叫 <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <p>Vị ngữ gồm <b>hai cụm động từ</b>; tân ngữ của động từ thứ nhất đồng thời là chủ ngữ của động từ thứ hai. Khi động từ thứ nhất là <b>请、让、叫</b> → nhờ / bảo / mời ai làm gì.</p>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">请 / 让 / 叫</span><span class="plus">+</span><span class="slot">Tân ngữ (→ chủ ngữ)</span><span class="plus">+</span><span class="slot">Động từ (cụm)</span></div>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("我想请你帮个忙。","Wǒ xiǎng qǐng nǐ bāng ge máng.","Mình muốn nhờ bạn giúp một việc.")}${A("王老师让我们说中文。","Wáng lǎoshī ràng wǒmen shuō Zhōngwén.","Cô Vương bảo chúng em nói tiếng Trung.")}${A("妈妈叫孩子们回家。","Māma jiào háizimen huí jiā.","Mẹ gọi bọn trẻ về nhà.")}</div></div>\n  <table class="compare"><tr><th>请 qǐng</th><th>让 ràng</th><th>叫 jiào</th></tr>\n    <tr><td>mời, nhờ — <b>lịch sự</b></td><td>bảo, để cho</td><td>gọi, bảo — <b>khẩu ngữ</b></td></tr>\n    <tr><td class="zh">她请我们吃了北京烤鸭。</td><td class="zh">一飞让我来接你们。</td><td class="zh">你可以叫李文帮忙。</td></tr></table>\n</div>\n<div class="gram-card"><h3><span class="no">★</span>帮忙 là từ ly hợp · 不好意思 · 那</h3>\n  <p>帮忙 có thể tách: 帮<b>个</b>忙, 帮<b>我的</b>忙. Không nói <s>帮忙我</s> → <b>帮我</b> hoặc <b>帮我的忙</b>.</p>\n  <div class="ex-list">${A("不好意思，我已经到北京了。","Bù hǎoyìsi, wǒ yǐjīng dào Běijīng le.","Ngại quá, mình đến Bắc Kinh rồi.")}${A("好的，那我给他打个电话。","Hǎo de, nà wǒ gěi tā dǎ ge diànhuà.","Được, vậy mình gọi cho cậu ấy.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：明天我想请＿＿来＿＿。 B：好的，我下班后去买点儿菜。 → ${i("明天我想请朋友来家里吃饭。")}</div>\n  <div class="qa">2. A：家月，王老师让＿＿去＿＿。 B：好的，我现在就去找她。 → ${i("王老师让你去她的办公室。")}</div>\n  <div class="qa">3. A：小雪，你去哪儿？ B：我去超市。妈妈叫＿＿。 → ${i("妈妈叫我去买些水果。")}</div>\n</div>`,t4:`\n<div class="gram-card"><h3><span class="no">1</span>已经……了 · 有时 · 懂……的意思</h3>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">已经</span><span class="plus">+</span><span class="slot">động từ</span><span class="plus">+</span><span class="slot fix">了</span></div>\n  <div class="ex-list">${A("我们已经到北京了。","Wǒmen yǐjīng dào Běijīng le.","Chúng em đã đến Bắc Kinh rồi.")}${A("有时不太懂她的意思。","Yǒushí bú tài dǒng tā de yìsi.","Đôi khi không hiểu lắm ý chị ấy.")}</div>\n  <table class="compare"><tr><th>不太 + tính từ / động từ</th><th>Nghĩa</th></tr>\n    <tr><td class="zh">我们的中文不太好。</td><td>Tiếng Trung chưa tốt lắm.</td></tr>\n    <tr><td class="zh">不太懂</td><td>không hiểu lắm</td></tr></table>\n</div>\n<div class="gram-card"><h3><span class="no">2</span>Ôn tổng hợp trong một tin nhắn</h3>\n  <p>Đoạn tin nhắn dùng cả 3 điểm ngữ pháp của bài: <b>是</b>您姐姐来接<b>的</b>我们 (是……的), 她<b>请</b>我们吃了北京烤鸭 (câu kiêm ngữ), 还<b>给</b>我们介绍了很多东西 (giới từ 给).</p>\n  <div class="ex-list">${A("她请我们吃了北京烤鸭，还给我们介绍了很多东西。","Tā qǐng wǒmen chīle Běijīng Kǎoyā, hái gěi wǒmen jièshàole hěn duō dōngxi.","Chị ấy mời chúng em ăn vịt quay, còn giới thiệu cho chúng em nhiều thứ.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ Kiểm tra nhanh</div>\n  <div class="qa">1. Mình đã ăn cơm rồi. → ${i("我已经吃饭了。")}</div>\n  <div class="qa">2. Đôi khi mình đi bộ đến trường. → ${i("我有时走路去学校。")}</div>\n  <div class="qa">3. Bạn hiểu ý cô giáo không? → ${i("你懂老师的意思吗？")}</div>\n</div>`}),LESSON.pron={toneWords:[["旅游","lǚyóu","3 + 2"],["帮忙","bāngmáng","1 + 2"],["已经","yǐjīng","3 + 1"],["介绍","jièshào","4 + 4"],["有时","yǒushí","3 + 2"],["烤鸭","kǎoyā","3 + 1"]],changes:[{title:"① Biến điệu của 不",desc:"不 đứng trước <b>thanh 4</b> đọc thành <b>bú</b>; trước thanh 1, 2, 3 giữ <b>bù</b>.",drills:[["不客气","bú kèqi","không có gì"],["不是","bú shì","không phải"],["不太好","bú tài hǎo","không tốt lắm"],["不好意思","bù hǎoyìsi","ngại quá"],["不忙","bù máng","không bận"]]},{title:"② Biến điệu của 一",desc:"一 trước thanh 4 đọc <b>yí</b>; trong số thứ tự (第一) giữ <b>yī</b>.",drills:[["一下","yíxià","một chút"],["第一次","dì-yī cì","lần đầu","dì-yí cì"],["一个","yí ge","một cái"]]},{title:"③ Thanh 3 + Thanh 3",desc:"Thanh 3 đứng trước thanh 3 đọc thành thanh 2.",drills:[["你好","ní hǎo","xin chào","nǐ hǎo"],["我想","wó xiǎng","tôi muốn","wǒ xiǎng"],["你懂","ní dǒng","bạn hiểu","nǐ dǒng"]]}],neutral:{title:"Thanh nhẹ trong bài",desc:"思 trong 意思, 气 trong 客气, trợ từ 吧, 的, 了 và 个 trong 帮个忙.",drills:[["意思","yìsi","ý nghĩa"],["客气","kèqi","khách sáo"],["学生吧","xuésheng ba","học sinh nhỉ"],["帮个忙","bāng ge máng","giúp một tay"]]},sounds:[["l + ü","","旅 lǚ: môi tròn ü, viết đủ hai chấm vì đi với l. Phân biệt lǚ (旅) – lù (路).",[["旅","lǚ"]]],["j","","就 jiù · 介 jiè · 经 jīng: mặt lưỡi, không bật hơi.",[["就","jiù"],["介","jiè"],["经","jīng"]]],["sh","","绍 shào: uốn lưỡi, không nhầm với x.",[["绍","shào"]]],["r","","让 ràng: uốn lưỡi, rung nhẹ — không đọc thành “d” hay “z”.",[["让","ràng"]]],["c","","次 cì: đầu lưỡi thẳng + bật hơi, khác ch. khéo.","我想请你帮个忙。—— 不好意思，我明天没有时间。"],["Giới thiệu bạn mới.","我给你介绍一下，这是我的朋友……"]],summaryTitle:"Tự đánh giá bài 1",summaryHead:"学习小结 · Tự đánh giá bài 1",summary:[["Trợ từ 吧 (2) — phỏng đoán","你们就是她的学生吧？"],["Câu 是……的 — nhấn mạnh thời gian, nơi chốn, cách thức","我是今天早上到的。"],["Câu kiêm ngữ 请 / 让 / 叫","一飞让我来接你们。"],["Giới từ 给 + người + động từ","一飞给我打电话了。"],["已经……了 · 有时 · 不太懂","有时不太懂她的意思。"],["Văn hoá: vịt quay Bắc Kinh và cách ăn","北京烤鸭"]]},LESSON.extraBodies={cultureBody:'\n<div class="sub-tabs"><button class="sub-tab-btn active" data-sub="c1" type="button"><span class="cn">文化</span>Vịt quay Bắc Kinh</button><button class="sub-tab-btn" data-sub="c2" type="button"><span class="cn">课堂活动</span>Đóng vai</button></div>\n<div class="sub-content active" id="c1">\n  <div class="gram-card"><h3><span class="no">★</span>小语的彩蛋 · 北京烤鸭的吃法 (Cách ăn vịt quay Bắc Kinh)</h3>\n    <p><b>北京烤鸭</b> (Běijīng Kǎoyā) là món ăn nổi tiếng nhất Bắc Kinh, có lịch sử hàng trăm năm. Vịt được quay trong lò đến khi da vàng óng, giòn rụm; đầu bếp lạng ngay tại bàn thành những lát mỏng có cả da và thịt.</p>\n    <table class="compare"><tr><th>Bước</th><th>Cách làm</th></tr>\n      <tr><td>1 · 薄饼 báobǐng</td><td>Trải một lá bánh tráng mỏng ra tay.</td></tr>\n      <tr><td>2 · 甜面酱 tiánmiànjiàng</td><td>Chấm vài lát vịt vào tương ngọt, đặt lên bánh.</td></tr>\n      <tr><td>3 · 葱 · 黄瓜</td><td>Thêm hành lá (葱 cōng) và dưa chuột (黄瓜 huángguā) thái sợi.</td></tr>\n      <tr><td>4 · 卷 juǎn</td><td>Cuộn lại rồi ăn. Phần da giòn còn có thể chấm đường.</td></tr></table>\n    <p>Hai nhà hàng nổi tiếng: <b>全聚德</b> (Quánjùdé, từ 1864) và <b>便宜坊</b> (Biànyífāng). Người Bắc Kinh hay nói: “不到长城非好汉，不吃烤鸭真遗憾” — chưa đến Trường Thành chưa phải hảo hán, chưa ăn vịt quay thật đáng tiếc!</p>\n    <p class="hint">Các từ 薄饼, 甜面酱, 葱, 黄瓜, 全聚德 chỉ là mở rộng, không bắt buộc học thuộc.</p>\n  </div>\n</div>\n<div class="sub-content" id="c2">\n  <div class="gram-card"><h3><span class="no">★</span>课堂活动 · 角色扮演 (Đóng vai)</h3>\n    <p>Hai người một nhóm: một người ra <b>ga tàu đón bạn</b>, một người vừa ra khỏi ga. Người đón hỏi bạn đến để làm gì, bây giờ muốn đi đâu… Dùng càng nhiều từ mới và ngữ pháp của bài càng tốt (吧, 是……的, 请 / 让 / 叫).</p>\n    <div class="check"><div class="check-title">💬 小语的例子 · Mẫu của Tiểu Ngữ</div>\n      <p class="zh" style="font-size:20px;line-height:1.9">A：你是第一次来北京吗？<br>B：不是，已经是第二次来北京了。<br>A：你是来旅游的吧？<br>B：是的。我是坐火车来的，昨天晚上从上海出发的。<br>A：你现在想去哪儿？我请你吃北京烤鸭吧！<br>B：太好了，谢谢你！</p>\n    </div>\n  </div>\n</div>'};</script>

<script id="vx-js">/* ============================================================
   HSK GARDEN · PHÂN TÍCH TỪ VỰNG (bố cục mới, HSK1–2)
   Dựng lại tab 生词 thành: dải từ mới · thẻ phân tích từ · luyện viết lồng ghép.
   Nội dung lấy NGUYÊN từ bài: thẻ từ, cửa sổ chi tiết (vd), thẻ viết chữ (char-card).
   Tab 写字 riêng được gộp vào đây (nét cơ bản · quy tắc · bộ thủ đặt trong mục mở rộng).
   ============================================================ */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var CACHE = {};

  /* Lấy nội dung chi tiết của một từ bằng chính cửa sổ chi tiết của bài (không viết lại nội dung). */
  function detailOf(word, srcEl) {
    if (CACHE[word]) return CACHE[word];
    var modal = $("#vocabDetailModal"), body = $("#vdBody");
    var info = { word: word, py: "", tags: [], mean: "", note: "", exHTML: "" };
    if (!modal || !body || !srcEl) return info;
    srcEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    var pyEl = $("#vdPy");
    if (pyEl) { var c = pyEl.cloneNode(true); $$(".spk", c).forEach(function (b) { b.remove(); }); info.py = c.textContent.trim(); }
    $$(".vd-row .vd-tag", body).forEach(function (t) { info.tags.push({ hv: t.classList.contains("hv"), html: t.innerHTML }); });
    var m = $(".vd-mean", body); if (m) info.mean = m.innerHTML;
    var n = $(".vd-note", body); if (n) info.note = n.innerHTML;
    var ex = $(".ex-list", body); if (ex) info.exHTML = ex.innerHTML;
    var close = $("[data-vd-close]", modal);
    if (close) close.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
    if (!$(".big-modal.open")) document.body.classList.remove("modal-open");
    CACHE[word] = info;
    return info;
  }

  function build(sec) {
    var id = sec.id.replace(/-vocab$/, "");
    var modalBody = sec.closest(".modal-body") || sec.parentElement;
    var writeSec = document.getElementById(id + "-write");
    var writeBtn = $('.sub-tab-btn[data-sub="' + id + '-write"]', modalBody);

    /* ---- 1. Danh sách từ (giữ thứ tự & nhóm như bài) ---- */
    var items = [];
    var groups = $$(".vgroup", sec);
    if (groups.length) {
      groups.forEach(function (g) {
        var head = $(".vgroup-head", g);
        $$(".vocab-card[data-vocab]", g).forEach(function (card, i) { items.push({ card: card, group: i === 0 && head ? head.innerHTML : null }); });
      });
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { if (!items.some(function (x) { return x.card === card; })) items.push({ card: card }); });
    } else {
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { items.push({ card: card }); });
    }
    $$(".proper-chip[data-vocab]", sec).forEach(function (chip, i) { items.push({ card: chip, proper: true, group: i === 0 ? '<span class="cn">专名</span><b>Tên riêng</b>' : null }); });
    if (!items.length) return;
    items.forEach(function (it) {
      var c = it.card;
      it.word = c.dataset.vocab;
      if (it.proper) {
        it.py = ($("span", c) || {}).textContent || ""; it.vi = ($("em", c) || {}).innerHTML || ""; it.pos = "tên riêng";
      } else {
        it.py = ($(".py", c) || {}).textContent || "";
        it.pos = ($(".pos", c) || {}).textContent || "";
        it.vi = ($(".vi", c) || {}).innerHTML || "";
        it.link = (($(".vlink", c) || {}).innerHTML || "").replace(/^\s*🔗\s*/, "");
        var sgk = $(".sgk", c); it.sgk = sgk ? sgk.textContent : "";
      }
    });

    /* ---- 2. Thẻ viết chữ của đoạn ---- */
    var charCards = {};
    if (writeSec) $$(".char-card", writeSec).forEach(function (cc) { var m = $(".mizi[data-char]", cc); if (m && !charCards[m.dataset.char]) charCards[m.dataset.char] = cc; });
    var used = {};
    items.forEach(function (it) { it.chars = Array.from(it.word).filter(function (ch) { return charCards[ch]; }); it.chars.forEach(function (ch) { used[ch] = 1; }); });
    var extra = Object.keys(charCards).filter(function (ch) { return !used[ch]; });
    if (extra.length) items.push({ word: extra.join(""), extraChars: true, chars: extra, group: '<span class="cn">写字</span><b>Chữ luyện thêm</b>' });

    /* ---- 3. Khung mới ---- */
    var toolbar = $(".toolbar", sec);
    var store = document.createElement("div"); store.hidden = true; store.className = "vx-store";
    Object.keys(charCards).forEach(function (ch) { store.appendChild(charCards[ch]); });

    var more = null;
    if (writeSec) {
      var rest = $$(":scope > *", writeSec).filter(function (e) { return !e.classList.contains("char-grid") && !(e.classList.contains("section-title") && /写汉字/.test(e.textContent)) && !(e.matches("p.hint") && /Xem viết/.test(e.textContent)); });
      if (rest.length) {
        more = document.createElement("details"); more.className = "vx-more";
        more.innerHTML = "<summary>📘 Kiến thức viết chữ của đoạn · <span>nét cơ bản · quy tắc thứ tự nét · bộ thủ</span></summary>";
        var box = document.createElement("div"); box.className = "vx-more-body";
        rest.forEach(function (e) { box.appendChild(e); });
        more.appendChild(box);
      }
      var hint = $$(":scope > p.hint", writeSec).filter(function (p) { return /Xem viết/.test(p.textContent); })[0];
      var hintHTML = hint ? hint.innerHTML : "";
    }

    var oldNodes = $$(":scope > *", sec);
    var wrap = document.createElement("div"); wrap.className = "vx";
    wrap.innerHTML =
      '<div class="vx-panel">' +
        '<div class="vx-head"><div class="vx-title"><span class="vx-ic">📖</span><b>Từ mới trong đoạn</b><span class="vx-sub">' + items.filter(function (x) { return !x.extraChars; }).length + ' từ · bấm từ hoặc dùng nút chuyển để xem từng từ</span></div>' +
          '<div class="vx-nav"><button type="button" class="vx-prev">‹ Từ trước</button><span class="vx-count"></span><button type="button" class="vx-next">Từ tiếp ›</button></div></div>' +
        '<div class="vx-tools"></div>' +

(X.tr||[]).forEach(function(g,gi){
  var card=$$(".gram-card").find(function(c){var h=c.querySelector("h3");return h&&h.textContent.indexOf(g.m)>=0;});
  if(!card)return;
  var box=document.createElement("div");box.className="hx-tr";
  box.innerHTML='<h4>🔁 练习翻译 · Luyện dịch Việt → Trung</h4><div class="req">Dịch 10 câu sau sang tiếng Trung (viết vào vở hoặc nói to), dùng đúng cấu trúc vừa học. Bấm ô để xem đáp án tham khảo, bấm 🔊 để nghe.</div><ol>'+
    g.items.map(function(it){return '<li><span class="vi">'+esc(it[0])+'</span><div class="ans"><button type="button" class="reveal" data-ans="'+esc(it[1])+'"></button><button type="button" class="hx-say" data-hxsay="'+esc(it[1])+'" aria-label="Nghe">🔊</button></div></li>';}).join("")+
    '</ol><div class="hx-tools"><button type="button" data-hxall>Hiện tất cả đáp án</button></div>';
  card.appendChild(box);
});

/* ================= ĐỀ LUYỆN HSK 3.0 ================= */
var T=X.test;var h2=$("#h2"),h3=$("#h3");
if(T&&h2&&h3){
  var IMGS=poolImgs().filter(function(k){return img(k);});
  var useImg=IMGS.length>=3;
  var Q=[];/* {el, ok} */
  function scoreUpd(){var done=Q.filter(function(q){return q.d;}),ok=done.filter(function(q){return q.ok;});
    $$(".hx-score .t").forEach(function(e){e.textContent="Đúng "+ok.length+" / "+Q.length+" câu · đã làm "+done.length;});
    $$(".hx-score .bar i").forEach(function(e){e.style.width=(Q.length?ok.length/Q.length*100:0)+"%";});}
  function reg(el){var q={el:el,d:false,ok:false};Q.push(q);return q;}
  function mark(q,ok){q.d=true;q.ok=ok;q.el.classList.add("done");scoreUpd();}
  function playBtn(text){return '<button type="button" class="hx-play" data-hxsay="'+esc(text)+'">▶ Nghe</button>';}
  function head(n,inner){return '<div class="hd"><span class="num">'+n+'</span>'+inner+'</div>';}
  var num=0;
  /* chọn 1 đáp án */
  function choice(host,n,headHtml,opts,right,script,imgMode){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+opts.map(function(o,i){return '<button type="button" class="hx-opt'+(imgMode?" imgopt":"")+'" data-i="'+i+'"><b>'+LET[i]+'</b>'+(imgMode?'<img src="'+img(o)+'" alt="Tranh '+LET[i]+'">':esc(o))+'</button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  /* nối với chữ cái (tranh / câu trả lời) */
  function letters(host,n,headHtml,count,right,script){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+LET.slice(0,count).split("").map(function(c,i){return '<button type="button" class="hx-opt" data-i="'+i+'"><b style="margin:0">'+c+'</b></button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  function block(host,title,req){var b=document.createElement("div");b.className="hw-block";b.innerHTML='<h3>'+title+'</h3><div class="req">'+req+'</div>';host.appendChild(b);return b;}
  function legend(b,keys){var g=document.createElement("div");g.className="hx-legend";g.innerHTML=keys.map(function(k,i){return '<figure><img src="'+img(k)+'" alt="Tranh '+LET[i]+'"><figcaption>'+LET[i]+'</figcaption></figure>';}).join("");b.appendChild(g);}
  function dlg(s){return esc(s).split("|").join("<br>");}
  function legendFor(items,extra){var keys=[];items.forEach(function(it){if(keys.indexOf(it[1])<0)keys.push(it[1]);});
    (extra||[]).forEach(function(k){if(keys.indexOf(k)<0&&img(k))keys.push(k);});return shuf(keys);}
  var lv=X.lv||1;
  /* ---- dựng tab ---- */
  function scoreBar(host){var s=document.createElement("div");s.className="hx-score";s.innerHTML='<span>📝 Đề luyện HSK '+lv+' (dạng đề 3.0)</span><span class="t"></span><div class="bar"><i></i></div><button type="button" data-hxreset>↻ Làm lại</button>';host.appendChild(s);}
  function build(){
    Q=[];num=0;h2.innerHTML="";h3.innerHTML="";
    scoreBar(h2);
    var intro=document.createElement("div");intro.className="hw-block";intro.innerHTML='<h3>综合练习 · Đề luyện HSK '+lv+' (dạng đề HSK 3.0)</h3><div class="req">Câu hỏi soạn theo đúng các phần của đề thi HSK '+lv+' 3.0, dùng từ vựng và mẫu câu của bài này. Phần nghe dùng giọng đọc tự động: bấm <b>▶ Nghe</b> (có thể nghe lại). Chọn đáp án là chấm ngay; lời thoại hiện ra sau khi trả lời. Phần 阅读'+(lv>1?" và 书写":"")+' ở tab tiếp theo.</div>';h2.appendChild(intro);
    var band=document.createElement("div");band.className="hx-band";band.textContent="听力 · NGHE HIỂU";h2.appendChild(band);
    var pi=0;function pn(){return "第"+"一二三四五六"[pi++]+"部分";}
    /* nghe chọn tranh */
    if(useImg&&T.li&&T.li.length){var b=block(h2,pn()+" · Nghe, chọn tranh đúng","听录音，选出对应的图片。");
      T.li.forEach(function(it){var others=it[2]||shuf(IMGS.filter(function(k){return k!==it[1];})).slice(0,2);var opts=shuf([it[1]].concat(others));choice(b,++num,playBtn(it[0]),opts,opts.indexOf(it[1]),dlg(it[0]),true);});}
    /* HSK1: nghe câu chọn từ xuất hiện */
    if(lv===1&&T.lw&&T.lw.length){var b2=block(h2,pn()+" · Nghe câu, chọn từ có trong câu","听句子，选出句子中出现的词语。");
      T.lw.forEach(function(it){choice(b2,++num,playBtn(it[0]),it[1],it[2],dlg(it[0]));});}
    /* nghe hội thoại, nối tranh */
    if(useImg&&T.lm&&T.lm.length){var b3=block(h2,pn()+" · Nghe hội thoại, chọn tranh (mỗi tranh dùng 1 lần)","听对话，选出对应的图片。");var keys=legendFor(T.lm,T.lmx);legend(b3,keys);
      T.lm.forEach(function(it){letters(b3,++num,playBtn(it[0]),keys.length,keys.indexOf(it[1]),dlg(it[0]));});}
    /* nghe đoạn / hội thoại + câu hỏi */
    if(T.lq&&T.lq.length){var b4=block(h2,pn()+" · Nghe "+(lv===1?"một đoạn ngắn":"hội thoại")+" và câu hỏi, chọn đáp án","听"+(lv===1?"一段话":"对话")+"和问题，选出正确答案。");
      T.lq.forEach(function(it){choice(b4,++num,playBtn(it[0]+"|"+it[1]),it[2],it[3],dlg(it[0])+"<br><b>"+esc(it[1])+"</b>");});}
    /* ---------- 阅读 ---------- */
    scoreBar(h3);
    var bandR=document.createElement("div");bandR.className="hx-band";bandR.textContent="阅读 · ĐỌC HIỂU";h3.appendChild(bandR);pi=0;
    function rm(){if(useImg&&T.rm&&T.rm.length){var b=block(h3,pn()+" · Đọc câu, chọn tranh (mỗi tranh dùng 1 lần)","读句子，选出对应的图片。");var keys=legendFor(T.rm,T.rmx);legend(b,keys);
      T.rm.forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',keys.length,keys.indexOf(it[1]));});}}
    function rt(){if(T.rt&&T.rt[1].length){var b=block(h3,pn()+" · Chọn câu trả lời phù hợp","选择合适的答句。");var bk=document.createElement("div");bk.className="hx-bank";bk.style.flexDirection="column";bk.innerHTML=T.rt[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("");b.appendChild(bk);
      T.rt[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',T.rt[0].length,it[1]);});}}
    function rf(){if(T.rf&&T.rf[1].length){var b=block(h3,pn()+" · Chọn từ điền vào chỗ trống","选词填空。");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.rf[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");b.appendChild(bk);
      T.rf[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0]).replace("（ ）","（　）").split("|").join("<br>")+'</span>',T.rf[0].length,it[1]);});}}
    function rp(){if(T.rp&&T.rp.length){var b=block(h3,pn()+" · Đọc đoạn văn, chọn đáp án đúng","读一段话，选择正确答案。");
      T.rp.forEach(function(it){choice(b,++num,'<div><div class="hx-text">'+esc(it[0])+'</div><div class="hx-qs">'+esc(it[1])+'</div></div>',it[2],it[3]);});}}
    if(lv===1){rm();rt();rf();rp();}else{rm();rf();rt();rp();}
    /* ---------- 书写 (HSK2+) ---------- */
    if(lv>=2&&((T.wr&&T.wr[1].length)||(T.wc&&T.wc.length))){
      var bandW=document.createElement("div");bandW.className="hx-band";bandW.textContent="书写 · VIẾT";h3.appendChild(bandW);pi=0;
      if(T.wr&&T.wr[1].length){var bw=block(h3,pn()+" · Chọn bộ phận còn thiếu của chữ","选择合适的部件，组成正确的词语。(Mỗi từ có một chữ bị thiếu một bộ phận.)");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.wr[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");bw.appendChild(bk);
        T.wr[1].forEach(function(it){letters(bw,++num,'<span class="hx-text">'+esc(it[0])+'</span> <small style="color:var(--muted)">'+esc(it[1])+'</small>',T.wr[0].length,it[2],"→ "+esc(it[3]));});}
      if(T.wc&&T.wc.length){var bc=block(h3,pn()+" · Viết chữ Hán còn thiếu","写汉字。(Gõ chữ còn thiếu vào ô rồi bấm Kiểm tra.)");
        T.wc.forEach(function(it){var el=document.createElement("div");el.className="hx-q";var n=++num;
          el.innerHTML=head(n,'<div><div class="hx-text">'+esc(it[0]).replace("（ ）",'（<input class="hx-in" maxlength="2" aria-label="Chữ còn thiếu">）')+'</div>'+(it[2]?'<div style="font-size:15px;color:var(--muted)">'+esc(it[2])+'</div>':"")+'</div> <button type="button" class="hx-play" data-hxchk>Kiểm tra</button> <span class="res"></span>');
          bc.appendChild(el);var q=reg(el);var inp=$("input",el);
          $("[data-hxchk]",el).addEventListener("click",function(){if(q.d||!inp.value.trim())return;var ok=inp.value.trim()===it[1];inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".res",el).innerHTML=ok?'<span class="hx-ok">✓ Đúng</span>':'<span class="hx-no">✗ Đáp án: '+esc(it[1])+'</span>';mark(q,ok);});});}
    }
    scoreUpd();
  }
  build();
  var b2=$('.sub-tab-btn[data-sub="h2"]'),b3=$('.sub-tab-btn[data-sub="h3"]');
  if(b2)b2.textContent="2 · Đề HSK: 听力";if(b3)b3.textContent="3 · Đề HSK: 阅读"+(lv>1?" & 书写":"");
  document.addEventListener("click",function(e){var r=e.target.closest&&e.target.closest("[data-hxreset]");if(r){speechSynthesis&&speechSynthesis.cancel();build();}});
}
/* ---------- chung ---------- */
document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-hxsay]");if(s){e.stopPropagation();speak(s.getAttribute("data-hxsay"),s.classList.contains("hx-play")?s:null);return;}
  var a=e.target.closest&&e.target.closest("[data-hxall]");if(a){var box=a.closest(".hx-tr");var any=$$(".reveal:not(.shown)",box).length>0;$$(".reveal",box).forEach(function(r){if(any!==r.classList.contains("shown"))r.click();});a.textContent=any?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";return;}
  var rv=e.target.closest&&e.target.closest(".hx-tr .reveal");if(rv){var li=rv.closest("li");setTimeout(function(){li.classList.toggle("shown",rv.classList.contains("shown"));},0);}
},true);
})();
</script>
</body></html>
