 suīrán qùguo yí cì, dànshì hěn xiǎng zài qù yí cì.","Em muốn đi Trung Quốc, tuy đã đi một lần nhưng rất muốn đi thêm lần nữa.")}${A("安妮去过一次北京。","Ānnī qùguo yí cì Běijīng.","Annie đã đến Bắc Kinh một lần. (địa danh sau 次)")}${A("李文见了杨同乐两次。","Lǐ Wén jiànle Yáng Tónglè liǎng cì.","Lý Văn đã gặp Dương Đồng Lạc hai lần. (tên người trước 次)")}</div></div>\n  <table class="compare"><tr><th>Tân ngữ là tên người / địa danh</th><th>Ví dụ</th></tr>\n    <tr><td>Sau bổ ngữ</td><td class="zh">去过一次北京 · 见了两次杨同乐</td></tr>\n    <tr><td>Trước bổ ngữ</td><td class="zh">去过北京一次 · 见了杨同乐两次</td></tr></table>\n  <div class="warn">⚠️ Phân biệt: <b>一次</b> (một lần — bổ ngữ, sau động từ) ↔ <b>第一次</b> (lần thứ nhất — trước động từ, bài 1): 我第一次去北京。</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：你去过＿＿上海，觉得怎么样？ B：很不错，吃得好，玩得好。 → ${i("你去过几次上海？/ 你去过一次上海")}</div>\n  <div class="qa">2. A：安妮来过＿＿我们家，她知道怎么走。 B：好，我跟安妮一起过去。 → ${i("安妮来过两次我们家")}</div>\n  <div class="qa">3. A：你吃过北京烤鸭吗？ B：我吃过＿＿，很好吃。 → ${i("我吃过一次")}</div>\n</div>`,t2:`\n<div class="gram-card"><h3><span class="no">2</span>动量补语（2）· Bổ ngữ động lượng (2): tân ngữ sự vật / đại từ <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <table class="compare"><tr><th>Tân ngữ là…</th><th>Vị trí</th><th>Ví dụ</th></tr>\n    <tr><td><b>Danh từ chỉ sự vật</b></td><td>Thường <b>sau</b> bổ ngữ</td><td class="zh">再吃一次烤鸭 · 再喝一次奶茶</td></tr>\n    <tr><td><b>Đại từ</b> (我, 他, 这儿…)</td><td><b>Trước</b> bổ ngữ</td><td class="zh">找他一次 · 来过这儿两次</td></tr></table>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("因为我想再吃一次烤鸭，再喝一次奶茶。","Yīnwèi wǒ xiǎng zài chī yí cì kǎoyā, zài hē yí cì nǎichá.","Vì mình muốn ăn vịt quay thêm lần nữa, uống trà sữa thêm lần nữa.")}${A("我想找他一次。","Wǒ xiǎng zhǎo tā yí cì.","Mình muốn tìm anh ấy một lần.")}${A("安妮来过这儿两次。","Ānnī láiguo zhèr liǎng cì.","Annie đã đến đây hai lần.")}</div></div>\n  <div class="warn">⚠️ <s>我想找一次他</s> → 我想找他一次 (đại từ đứng trước 次).</div>\n</div>\n<div class="gram-card"><h3><span class="no">★</span>出国 · 门票 · 多个朋友多条路</h3>\n  <div class="ex-list">${A("我还在网上买好颐和园的门票了呢。","Wǒ hái zài wǎngshang mǎihǎo Yíhé Yuán de ménpiào le ne.","Mình còn mua sẵn vé Di Hoà Viên trên mạng rồi.")}${A("出门旅游，多个朋友多条路。","Chūmén lǚyóu, duō ge péngyou duō tiáo lù.","Đi xa, thêm một người bạn là thêm một con đường.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：你们去北京的时候见到一雪姐姐了吗？ B：我们见了＿＿两次，还去了一次她家。 → ${i("我们见了她两次")}</div>\n  <div class="qa">2. A：＿＿？ B：我每个星期给家里打两次电话。 → ${i("你每个星期给家里打几次电话？")}</div>\n  <div class="qa">3. A：＿＿？ B：就下过一次雪。我觉得今年没有去年冷。 → ${i("今年下过几次雪？")}</div>\n</div>`,t3:`\n<div class="gram-card"><h3><span class="no">3</span>“有”字句（2）· Câu chữ 有 (2): 有 + số lượng <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <p><b>有 + cụm số lượng</b> cho biết đã <b>đạt tới</b> một số lượng nhất định (thời gian, tuổi, giá tiền…) — “đã được…”, “có tới…”.</p>\n  <div class="formula"><span class="slot">Chủ ngữ</span><span class="plus">+</span><span class="slot fix">有</span><span class="plus">+</span><span class="slot">số lượng</span><span class="plus">(+ …)</span></div>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("你有一年没回国了吧？","Nǐ yǒu yì nián méi huí guó le ba?","Cậu chưa về nước được một năm rồi nhỉ?")}${A("你女儿今年有10岁了吗？","Nǐ nǚ'ér jīnnián yǒu shí suì le ma?","Con gái chị năm nay được 10 tuổi chưa?")}${A("我有一个月没给家里打电话了。","Wǒ yǒu yí ge yuè méi gěi jiā li dǎ diànhuà le.","Mình đã một tháng chưa gọi điện về nhà.")}</div></div>\n  <table class="compare"><tr><th>有 (1) — sở hữu (HSK 1)</th><th>有 (2) — đạt tới số lượng (bài 15)</th></tr>\n    <tr><td class="zh">我有一个哥哥。</td><td class="zh">我哥哥有一米八。 (cao tới 1m80)</td></tr></table>\n</div>\n<div class= 240 giờ.</td></tr>\n      <tr><td>Cửa khẩu & khu vực quy định</td><td>Nhập cảnh, xuất cảnh qua các cửa khẩu được chỉ định và chỉ đi lại trong khu vực cho phép.</td></tr></table>\n    <div class="warn">⚠️ Danh sách nước, cửa khẩu và điều kiện có thể thay đổi — trước khi đi cần kiểm tra thông báo mới nhất của Cục Quản lý Xuất nhập cảnh Trung Quốc (国家移民管理局) hoặc Đại sứ quán.</div>\n    <p class="hint">Các từ 过境, 免签, 政策 chỉ là mở rộng, không bắt buộc học thuộc.</p>\n  </div>\n</div>\n<div class="sub-content" id="c2">\n  <div class="gram-card"><h3><span class="no">★</span>课堂活动 · 双人活动 (Hoạt động cặp đôi)</h3>\n    <p>Hai người một nhóm, nói về <b>kinh nghiệm du lịch</b>: đã đi đâu, đi mấy lần, ăn uống thế nào, chơi thế nào, cảm nhận về chuyến đi… Dùng càng nhiều từ mới và ngữ pháp của bài càng tốt.</p>\n    <div class="check"><div class="check-title">💬 小语的例子 · Mẫu của Tiểu Ngữ</div>\n      <p class="zh" style="font-size:20px;line-height:1.9">A：你去过北京吗？<br>B：去过。<br>A：去过几次？<br>B：去过两次。我吃了三次烤鸭，还去了一次颐和园。<br>A：你有多长时间没去了？<br>B：有一年多没去了。我很想再去一次！<br>A：下次我们一起去吧。出门旅游，多个朋友多条路！</p>\n    </div>\n  </div>\n</div>'};</script>

<script id="vx-js">/* ============================================================
   HSK GARDEN · PHÂN TÍCH TỪ VỰNG (bố cục mới, HSK1–2)
   Dựng lại tab 生词 thành: dải từ mới · thẻ phân tích từ · luyện viết lồng ghép.
   Nội dung lấy NGUYÊN từ bài: thẻ từ, cửa sổ chi tiết (vd), thẻ viết chữ (char-card).
   Tab 写字 riêng được gộp vào đây (nét cơ bản · quy tắc · bộ thủ đặt trong mục mở rộng).
   ============================================================ */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var CACHE = {};

  /* Lấy nội dung chi tiết của một từ bằng chính cửa sổ chi tiết của bài (không viết lại nội dung). */
  function detailOf(word, srcEl) {
    if (CACHE[word]) return CACHE[word];
    var modal = $("#vocabDetailModal"), body = $("#vdBody");
    var info = { word: word, py: "", tags: [], mean: "", note: "", exHTML: "" };
    if (!modal || !body || !srcEl) return info;
    srcEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    var pyEl = $("#vdPy");
    if (pyEl) { var c = pyEl.cloneNode(true); $$(".spk", c).forEach(function (b) { b.remove(); }); info.py = c.textContent.trim(); }
    $$(".vd-row .vd-tag", body).forEach(function (t) { info.tags.push({ hv: t.classList.contains("hv"), html: t.innerHTML }); });
    var m = $(".vd-mean", body); if (m) info.mean = m.innerHTML;
    var n = $(".vd-note", body); if (n) info.note = n.innerHTML;
    var ex = $(".ex-list", body); if (ex) info.exHTML = ex.innerHTML;
    var close = $("[data-vd-close]", modal);
    if (close) close.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
    if (!$(".big-modal.open")) document.body.classList.remove("modal-open");
    CACHE[word] = info;
    return info;
  }

  function build(sec) {
    var id = sec.id.replace(/-vocab$/, "");
    var modalBody = sec.closest(".modal-body") || sec.parentElement;
    var writeSec = document.getElementById(id + "-write");
    var writeBtn = $('.sub-tab-btn[data-sub="' + id + '-write"]', modalBody);

    /* ---- 1. Danh sách từ (giữ thứ tự & nhóm như bài) ---- */
    var items = [];
    var groups = $$(".vgroup", sec);
    if (groups.length) {
      groups.forEach(function (g) {
        var head = $(".vgroup-head", g);
        $$(".vocab-card[data-vocab]", g).forEach(function (card, i) { items.push({ card: card, group: i === 0 && head ? head.innerHTML : null }); });
      });
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { if (!items.some(function (x) { return x.card === card; })) items.push({ card: card }); });
    } else {
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { items.push({ card: card }); });
    }
    $$(".proper-chip[data-vocab]", sec).forEach(function (chip, i) { items.push({ card: chip, proper: true, group: i === 0 ? '<span class="cn">专名</span><b>Tên riêng</b>' : null }); });
    if (!items.length) return;
    items.forEach(function (it) {
      var c = it.card;
      it.word = c.dataset.vocab;
      if (it.proper) {
        it.py = ($("span", c) || {}).textContent || ""; it.vi = ($("em", c) || {}).innerHTML || ""; it.pos = "tên riêng";
      } else {
        it.py = ($(".py", c) || {}).textContent || "";
        it.pos = ($(".pos", c) || {}).textContent || "";
        it.vi = ($(".vi", c) || {}).innerHTML || "";
        it.link = (($(".vlink", c) || {}).innerHTML || "").replace(/^\s*🔗\s*/, "");
        var sgk = $(".sgk", c); it.sgk = sgk ? sgk.textContent : "";
      }
    });

    /* ---- 2. Thẻ viết chữ của đoạn ---- */
    var charCards = {};
    if (writeSec) $$(".char-card", writeSec).forEach(function (cc) { var m = $(".mizi[data-char]", cc); if (m && !charCards[m.dataset.char]) charCards[m.dataset.char] = cc; });
    var used = {};
    items.forEach(function (it) { it.chars = Array.from(it.word).filter(function (ch) { return charCards[ch]; }); it.chars.forEach(function (ch) { used[ch] = 1; }); });
    var extra = Object.keys(charCards).filter(function (ch) { return !used[ch]; });
    if (extra.length) items.push({ word: extra.join(""), extraChars: true, chars: extra, group: '<span class="cn">写字</span><b>Chữ luyện thêm</b>' });

    /* ---- 3. Khung mới ---- */
    var toolbar = $(".toolbar", sec);
    var store = document.createElement("div"); store.hidden = true; store.className = "vx-store";
    Object.keys(charCards).forEach(function (ch) { store.appendChild(charCards[ch]); });

    var more = null;
    if (writeSec) {
      var rest = $$(":scope > *", writeSec).filter(function (e) { return !e.classList.contains("char-grid") && !(e.classList.contains("section-title") && /写汉字/.test(e.textContent)) && !(e.matches("p.hint") && /Xem viết/.test(e.textContent)); });
      if (rest.length) {
        more = document.createElement("details"); more.className = "vx-more";
        more.innerHTML = "<summary>📘 Kiến thức viết chữ của đoạn · <span>nét cơ bản · quy tắc thứ tự nét · bộ thủ</span></summary>";
        var box = document.createElement("div"); box.className = "vx-more-body";
        rest.forEach(function (e) { box.appendChild(e); });
        more.appendChild(box);
      }
      var hint = $$(":scope > p.hint", writeSec).filter(function (p) { return /Xem viết/.test(p.textContent); })[0];
      var hintHTML = hint ? hint.innerHTML : "";
    }

    var oldNodes = $$(":scope > *", sec);
    var wrap = document.createElement("div"); wrap.className = "vx";
    wrap.innerHTML =
      '<div class="vx-panel">' +
        '<div class="vx-head"><div class="vx-title"><span class="vx-ic">📖</span><b>Từ mới trong đoạn</b><span class="vx-sub">' + items.filter(function (x) { return !x.extraChars; }).length + ' từ · bấm từ hoặc dùng nút chuyển để xem từng từ</span></div>' +
          '<div class="vx-nav"><button type="button" class="vx-prev">‹ Từ trước</button><span class="vx-count"></span><button type="button" class="vx-next">Từ tiếp ›</button></div></div>' +
        '<div class="vx-tools"></div>' +
        '<div class="vx-chips" role="tablist">' + items.map(function (it, i) {
          return (it.group ? '<span class="vx-group">' + it.group + "</span>" : "") +
            '<button type="button" role="tab" class="vx-chip' + (it.proper ? " proper" : "") + (it.extraChars ? " extra" : "") + '" data-i="' + i + '"><b>' + esc(it.word) + "</b>" + (it.extraChars ? "<small>✍ viết</small>" : "<small>" + esc(it.py) + "</small>") + "</button>";
        }).join("") + "</div>" +
        '<div class="vx-main"><div class="vx-left"></div><div class="vx-right"></div></div>' +
      "</div>";
    var old = document.createElement("div"); old.hidden = true; old.className = "vx-old";
    oldNodes.forEach(function (n) { if (n !== toolbar) old.appendChild(n); });
    sec.appendChild(wrap); sec.appendChild(old);
    if (toolbar) { $(".hint", toolbar) && ($(".hint", toolbar).textContent = "Ẩn nghĩa để cả lớp đoán · Nghe lần lượt cả danh sách."); $(".vx-tools", wrap).appendChild(toolbar); }
    if (more) wrap.appendChild(more);
    wrap.appendChild(store);
    /* ẩn/hiện nghĩa: nút cũ trỏ tới id đoạn → giữ hoạt động trên khung mới */
    sec.classList.add("vx-host");

    if (writeSec) { writeSec.remove(); }
    if (writeBtn) { writeBtn.remove(); }

    var cur = -1;
    function initWriter(card) {
      var r = $('[data-w="reset"]', card);
      if (r) requestAnimationFrame(function () { r.dispatchEvent(new MouseEvent("click", { bubbles: true })); });
    }
    function show(i) {
      if (i < 0 || i >= items.length) return;
      // trả thẻ viết cũ về kho
      $$(".vx-right .char-card", wrap).forEach(function (cc) { store.appendChild(cc); });
      cur = i; var it = items[i];
      $$(".vx-chip", wrap).forEach(function (b) { var on = +b.dataset.i === i; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
      var realCount = items.filter(function (x) { return !x.extraChars; }).length;
      $(".vx-count", wrap).innerHTML = it.extraChars ? "✍" : "<b>" + (i + 1) + "</b> / " + realCount;
      $(".vx-prev", wrap).disabled = i === 0; $(".vx-next", wrap).disabled = i === items.length - 1;
      var L = $(".vx-left", wrap), R = $(".vx-right", wrap);

      if (it.extraChars) {
        L.innerHTML = '<div class="vx-card"><div class="vx-word kai">' + esc(it.word) + '</div><div class="vx-pos">Chữ Hán cần viết trong đoạn</div><p class="vx-hint">Những chữ này có trong bài khoá nhưng không thuộc từ mới của đoạn. Bấm từng chữ bên phải để luyện viết.</p></div>';
      } else {
        var d = detailOf(it.word, it.card);
        var hv = d.tags.filter(function (t) { return t.hv; }).map(function (t) { return t.html.replace(/^Hán Việt:\s*/, ""); })[0] || "";
        var tags = d.tags.filter(function (t) { return !t.hv; }).map(function (t) { return '<span class="vx-tag">' + t.html + "</span>"; }).join("");
        L.innerHTML =
          '<div class="vx-card">' +
            '<div class="vx-meta">' + (it.sgk ? '<span class="vx-sgk">' + esc(it.sgk) + "</span>" : "") + (it.proper ? '<span class="vx-sgk">Tên riêng</span>' : "") + "</div>" +
            '<button type="button" class="vx-word kai" data-say="' + esc(it.word) + '" title="Bấm để nghe">' + esc(it.word) + "</button>" +
            '<div class="vx-py">' + esc(d.py || it.py) + "</div>" +
            (hv ? '<div class="vx-hv">Hán Việt: <b>' + hv + "</b></div>" : "") +
            '<div class="vx-mean vi-hideable">' + (d.mean || it.vi) + "</div>" +
            (tags ? '<div class="vx-tags">' + tags + "</div>" : (it.pos ? '<div class="vx-tags"><span class="vx-tag">' + esc(it.pos) + "</span></div>" : "")) +
            '<div class="vx-btns"><button type="button" class="vx-btn" data-say="' + esc(it.word) + '">🔊 Phát âm</button>' +
            (it.chars.length ? '<button type="button" class="vx-btn vx-practice">✍ Tập viết nét</button>' : "") + "</div>" +
          "</div>" +
          ((d.note || it.link) ? '<div class="vx-box vx-use"><div class="vx-lbl">💡 Cách dùng</div>' + (it.link ? '<div class="vx-link">🔗 ' + it.link + "</div>" : "") + (d.note ? '<div class="vx-note">' + d.note + "</div>" : "") + "</div>" : "") +
          (d.exHTML ? '<div class="vx-box vx-ex"><div class="vx-lbl">💬 Ví dụ đặt câu</div><div class="ex-list">' + d.exHTML + "</div></div>" : "");
      }

      if (it.chars.length) {

  function block(host,title,req){var b=document.createElement("div");b.className="hw-block";b.innerHTML='<h3>'+title+'</h3><div class="req">'+req+'</div>';host.appendChild(b);return b;}
  function legend(b,keys){var g=document.createElement("div");g.className="hx-legend";g.innerHTML=keys.map(function(k,i){return '<figure><img src="'+img(k)+'" alt="Tranh '+LET[i]+'"><figcaption>'+LET[i]+'</figcaption></figure>';}).join("");b.appendChild(g);}
  function dlg(s){return esc(s).split("|").join("<br>");}
  function legendFor(items,extra){var keys=[];items.forEach(function(it){if(keys.indexOf(it[1])<0)keys.push(it[1]);});
    (extra||[]).forEach(function(k){if(keys.indexOf(k)<0&&img(k))keys.push(k);});return shuf(keys);}
  var lv=X.lv||1;
  /* ---- dựng tab ---- */
  function scoreBar(host){var s=document.createElement("div");s.className="hx-score";s.innerHTML='<span>📝 Đề luyện HSK '+lv+' (dạng đề 3.0)</span><span class="t"></span><div class="bar"><i></i></div><button type="button" data-hxreset>↻ Làm lại</button>';host.appendChild(s);}
  function build(){
    Q=[];num=0;h2.innerHTML="";h3.innerHTML="";
    scoreBar(h2);
    var intro=document.createElement("div");intro.className="hw-block";intro.innerHTML='<h3>综合练习 · Đề luyện HSK '+lv+' (dạng đề HSK 3.0)</h3><div class="req">Câu hỏi soạn theo đúng các phần của đề thi HSK '+lv+' 3.0, dùng từ vựng và mẫu câu của bài này. Phần nghe dùng giọng đọc tự động: bấm <b>▶ Nghe</b> (có thể nghe lại). Chọn đáp án là chấm ngay; lời thoại hiện ra sau khi trả lời. Phần 阅读'+(lv>1?" và 书写":"")+' ở tab tiếp theo.</div>';h2.appendChild(intro);
    var band=document.createElement("div");band.className="hx-band";band.textContent="听力 · NGHE HIỂU";h2.appendChild(band);
    var pi=0;function pn(){return "第"+"一二三四五六"[pi++]+"部分";}
    /* nghe chọn tranh */
    if(useImg&&T.li&&T.li.length){var b=block(h2,pn()+" · Nghe, chọn tranh đúng","听录音，选出对应的图片。");
      T.li.forEach(function(it){var others=it[2]||shuf(IMGS.filter(function(k){return k!==it[1];})).slice(0,2);var opts=shuf([it[1]].concat(others));choice(b,++num,playBtn(it[0]),opts,opts.indexOf(it[1]),dlg(it[0]),true);});}
    /* HSK1: nghe câu chọn từ xuất hiện */
    if(lv===1&&T.lw&&T.lw.length){var b2=block(h2,pn()+" · Nghe câu, chọn từ có trong câu","听句子，选出句子中出现的词语。");
      T.lw.forEach(function(it){choice(b2,++num,playBtn(it[0]),it[1],it[2],dlg(it[0]));});}
    /* nghe hội thoại, nối tranh */
    if(useImg&&T.lm&&T.lm.length){var b3=block(h2,pn()+" · Nghe hội thoại, chọn tranh (mỗi tranh dùng 1 lần)","听对话，选出对应的图片。");var keys=legendFor(T.lm,T.lmx);legend(b3,keys);
      T.lm.forEach(function(it){letters(b3,++num,playBtn(it[0]),keys.length,keys.indexOf(it[1]),dlg(it[0]));});}
    /* nghe đoạn / hội thoại + câu hỏi */
    if(T.lq&&T.lq.length){var b4=block(h2,pn()+" · Nghe "+(lv===1?"một đoạn ngắn":"hội thoại")+" và câu hỏi, chọn đáp án","听"+(lv===1?"一段话":"对话")+"和问题，选出正确答案。");
      T.lq.forEach(function(it){choice(b4,++num,playBtn(it[0]+"|"+it[1]),it[2],it[3],dlg(it[0])+"<br><b>"+esc(it[1])+"</b>");});}
    /* ---------- 阅读 ---------- */
    scoreBar(h3);
    var bandR=document.createElement("div");bandR.className="hx-band";bandR.textContent="阅读 · ĐỌC HIỂU";h3.appendChild(bandR);pi=0;
    function rm(){if(useImg&&T.rm&&T.rm.length){var b=block(h3,pn()+" · Đọc câu, chọn tranh (mỗi tranh dùng 1 lần)","读句子，选出对应的图片。");var keys=legendFor(T.rm,T.rmx);legend(b,keys);
      T.rm.forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',keys.length,keys.indexOf(it[1]));});}}
    function rt(){if(T.rt&&T.rt[1].length){var b=block(h3,pn()+" · Chọn câu trả lời phù hợp","选择合适的答句。");var bk=document.createElement("div");bk.className="hx-bank";bk.style.flexDirection="column";bk.innerHTML=T.rt[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("");b.appendChild(bk);
      T.rt[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',T.rt[0].length,it[1]);});}}
    function rf(){if(T.rf&&T.rf[1].length){var b=block(h3,pn()+" · Chọn từ điền vào chỗ trống","选词填空。");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.rf[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");b.appendChild(bk);
      T.rf[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0]).replace("（ ）","（　）").split("|").join("<br>")+'</span>',T.rf[0].length,it[1]);});}}
    function rp(){if(T.rp&&T.rp.length){var b=block(h3,pn()+" · Đọc đoạn văn, chọn đáp án đúng","读一段话，选择正确答案。");
      T.rp.forEach(function(it){choice(b,++num,'<div><div class="hx-text">'+esc(it[0])+'</div><div class="hx-qs">'+esc(it[1])+'</div></div>',it[2],it[3]);});}}
    if(lv===1){rm();rt();rf();rp();}else{rm();rf();rt();rp();}
    /* ---------- 书写 (HSK2+) ---------- */
    if(lv>=2&&((T.wr&&T.wr[1].length)||(T.wc&&T.wc.length))){
      var bandW=document.createElement("div");bandW.className="hx-band";bandW.textContent="书写 · VIẾT";h3.appendChild(bandW);pi=0;
      if(T.wr&&T.wr[1].length){var bw=block(h3,pn()+" · Chọn bộ phận còn thiếu của chữ","选择合适的部件，组成正确的词语。(Mỗi từ có một chữ bị thiếu một bộ phận.)");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.wr[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");bw.appendChild(bk);
        T.wr[1].forEach(function(it){letters(bw,++num,'<span class="hx-text">'+esc(it[0])+'</span> <small style="color:var(--muted)">'+esc(it[1])+'</small>',T.wr[0].length,it[2],"→ "+esc(it[3]));});}
      if(T.wc&&T.wc.length){var bc=block(h3,pn()+" · Viết chữ Hán còn thiếu","写汉字。(Gõ chữ còn thiếu vào ô rồi bấm Kiểm tra.)");
        T.wc.forEach(function(it){var el=document.createElement("div");el.className="hx-q";var n=++num;
          el.innerHTML=head(n,'<div><div class="hx-text">'+esc(it[0]).replace("（ ）",'（<input class="hx-in" maxlength="2" aria-label="Chữ còn thiếu">）')+'</div>'+(it[2]?'<div style="font-size:15px;color:var(--muted)">'+esc(it[2])+'</div>':"")+'</div> <button type="button" class="hx-play" data-hxchk>Kiểm tra</button> <span class="res"></span>');
          bc.appendChild(el);var q=reg(el);var inp=$("input",el);
          $("[data-hxchk]",el).addEventListener("click",function(){if(q.d||!inp.value.trim())return;var ok=inp.value.trim()===it[1];inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".res",el).innerHTML=ok?'<span class="hx-ok">✓ Đúng</span>':'<span class="hx-no">✗ Đáp án: '+esc(it[1])+'</span>';mark(q,ok);});});}
    }
    scoreUpd();
  }
  build();
  var b2=$('.sub-tab-btn[data-sub="h2"]'),b3=$('.sub-tab-btn[data-sub="h3"]');
  if(b2)b2.textContent="2 · Đề HSK: 听力";if(b3)b3.textContent="3 · Đề HSK: 阅读"+(lv>1?" & 书写":"");
  document.addEventListener("click",function(e){var r=e.target.closest&&e.target.closest("[data-hxreset]");if(r){speechSynthesis&&speechSynthesis.cancel();build();}});
}
/* ---------- chung ---------- */
document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-hxsay]");if(s){e.stopPropagation();speak(s.getAttribute("data-hxsay"),s.classList.contains("hx-play")?s:null);return;}
  var a=e.target.closest&&e.target.closest("[data-hxall]");if(a){var box=a.closest(".hx-tr");var any=$$(".reveal:not(.shown)",box).length>0;$$(".reveal",box).forEach(function(r){if(any!==r.classList.contains("shown"))r.click();});a.textContent=any?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";return;}
  var rv=e.target.closest&&e.target.closest(".hx-tr .reveal");if(rv){var li=rv.closest("li");setTimeout(function(){li.classList.toggle("shown",rv.classList.contains("shown"));},0);}
},true);
})();
</script>
</body></html>
