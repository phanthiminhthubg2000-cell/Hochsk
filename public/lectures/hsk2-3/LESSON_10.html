class="no">★</span>呢 · 帮 + người</h3>\n  <div class="ex-list">${A("书在哪儿呢？笔呢？","Shū zài nǎr ne? Bǐ ne?","Sách ở đâu nhỉ? Còn bút đâu?")}${A("这次爸爸帮你，下次你自己准备。","Zhè cì bàba bāng nǐ, xià cì nǐ zìjǐ zhǔnbèi.","Lần này bố giúp con, lần sau con tự chuẩn bị.")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：刘明工作忙吗？ B：＿＿。 → ${i("刘明工作很忙。")}</div>\n  <div class="qa">2. A：你知道哪个电影好看吗？ B：这个电影＿＿，很好看。 → ${i("这个电影我看过，很好看。")}</div>\n  <div class="qa">3. A：陈天中学习怎么样？ B：＿＿。 → ${i("陈天中学习很好。")}</div>\n</div>`,t2:`\n<div class="gram-card"><h3><span class="no">2</span>选择问句 · Câu hỏi lựa chọn <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <p>Liên từ <b>还是</b> dùng trong câu hỏi để người nghe <b>chọn một</b> trong các khả năng. Cấu trúc: <b>(是) A 还是 B？</b> Câu hỏi lựa chọn <b>không thêm 吗</b>.</p>\n  <div class="formula"><span class="slot fix">(是)</span><span class="plus">+</span><span class="slot">A</span><span class="plus">+</span><span class="slot fix">还是</span><span class="plus">+</span><span class="slot">B</span><span class="plus">？</span></div>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("妈妈，是您准备考试还是我准备考试？","Māma, shì nín zhǔnbèi kǎoshì háishi wǒ zhǔnbèi kǎoshì?","Mẹ ơi, là mẹ chuẩn bị thi hay con chuẩn bị thi?")}${A("你更喜欢打篮球、踢足球还是游泳？","Nǐ gèng xǐhuan dǎ lánqiú, tī zúqiú háishi yóuyǒng?","Bạn thích chơi bóng rổ, đá bóng hay bơi hơn?")}${A("我们什么时候去看电影？今天还是明天？","Wǒmen shénme shíhou qù kàn diànyǐng? Jīntiān háishi míngtiān?","Khi nào mình đi xem phim? Hôm nay hay mai?")}</div></div>\n  <table class="compare"><tr><th>还是 — câu hỏi lựa chọn</th><th>或者 (sẽ học) — câu trần thuật</th><th>还是……吧 (bài 2)</th></tr>\n    <tr><td class="zh">你喝茶还是喝咖啡？</td><td class="zh">我喝茶或者喝咖啡都可以。</td><td class="zh">我还是喝茶吧。</td></tr></table>\n  <div class="warn">⚠️ Không nói <s>你喝茶还是喝咖啡吗？</s> — câu hỏi lựa chọn không có 吗.</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：你吃＿＿？ B：饺子，我觉得饺子比包子更好吃。 → ${i("你吃饺子还是吃包子？")}</div>\n  <div class="qa">2. A：你想＿＿？ B：打车吧，坐公交车没有打车快。 → ${i("你想坐公交车还是打车？")}</div>\n  <div class="qa">3. A：你喝＿＿？ B：奶茶吧，我觉得奶茶比茶和咖啡好喝。 → ${i("你喝茶、咖啡还是奶茶？")}</div>\n</div>`,t3:`\n<div class="gram-card"><h3><span class="no">3</span>固定格式“要/快/快要/就要……了” · Sắp… rồi <span class="badge-extra" style="font-size:13px">小语讲堂</span></h3>\n  <p>Cho biết một việc <b>sắp xảy ra</b>. Nếu trong câu có <b>trạng ngữ thời gian</b> (明天, 下星期, 8点…) thì thường dùng <b>就要……了</b>.</p>\n  <div class="formula"><span class="slot fix">要 / 快 / 快要 / 就要</span><span class="plus">+</span><span class="slot">động từ / tính từ</span><span class="plus">+</span><span class="slot fix">了</span></div>\n  <div class="check" style="margin-top:8px"><div class="check-title">📢 大声朗读 · Đọc to (theo sách)</div>\n    <div class="ex-list">${A("饭菜快要做好了。","Fàncài kuàiyào zuòhǎo le.","Cơm nước sắp xong rồi.")}${A("火车快开了。","Huǒchē kuài kāi le.","Tàu sắp chạy rồi.")}${A("我们下星期就要考试了。","Wǒmen xià xīngqī jiù yào kǎoshì le.","Tuần sau chúng mình thi rồi.")}</div></div>\n  <table class="compare"><tr><th>Có thời gian cụ thể</th><th>Không có thời gian</th></tr>\n    <tr><td class="zh">明天<b>就要</b>开学了。</td><td class="zh"><b>快要</b>开学了。 / <b>快</b>开学了。</td></tr></table>\n  <div class="warn">⚠️ Có thời gian cụ thể <b>không dùng 快 / 快要</b>: <s>明天快要考试了</s> → 明天<b>就要</b>考试了.</div>\n</div>\n<div class="gram-card"><h3><span class="no">★</span>考试考得怎么样 · 洗得真快</h3>\n  <p>Ôn bổ ngữ trạng thái (bài 7): từ ly hợp 考试 phải lặp động từ <b>考</b>.</p>\n  <div class="ex-list">${A("今天考试考得怎么样？","Jīntiān kǎoshì kǎo de zěnmeyàng?","Hôm nay thi thế nào?")}${A("你洗得真快啊！","Nǐ xǐ de zhēn kuài a!","Con rửa nhanh thật!")}</div>\n</div>\n<div class="check"><div class="check-title">✅ 完成对话 · Hoàn thành hội thoại (theo sách)</div>\n  <div class="qa">1. A：＿＿，你别出去吃了。 B：那不好，小王还在饭馆等我呢。 → ${i("饭快要做好了。")}</div>\n  <div class="qa">2. A：＿＿，陈天中怎么还没来？ B：他说今天不舒服，不来上课了。 → ${i("快要上课了 / 就要上课了")}</div>\n  <div class="qa">3. A：儿子10号过生日，今天都7号了。 B：是啊，＿＿。(3天) → ${i("再过三天就要过生日了。/ 还有三天就要过生日了。")}</div>\n</div>`,t4:`\n<div class="gram-card"><h3><span class="no">1</span>Ôn tổng hợp trong nhật ký</h3>\n  <table class="compare"><tr><th>Điểm ngữ pháp</th><th>Câu trong bài</th></tr>\n    <tr><td>快要……了</td><td class="zh">快要开学了。</td></tr>\n    <tr><td>就要……了</td><td class="zh">我就要考试了。</td></tr>\n    <tr><td>Câu kiêm ngữ 让 (bài 1)</td><td class="zh">妈妈让我看书。</td></tr>\n    <tr><td>比……还 (bài 8)</td><td class="zh">爸爸、妈妈比我们还忙。</td></tr>\n    <tr><td>Câu hỏi lựa chọn</td><td class="zh">是我和弟弟上学还是你们上学？</td></tr></table>\n</div>\n<div class="check"><div class="check-title">✅ Kiểm tra nhanh</div>\n  <div class="qa">1. Tàu sắp chạy rồi. → ${i("火车快要开了。/ 火车快开了。")}</div>\n  <div class="qa">2. Thứ hai tuần sau là khai giảng rồi. → ${i("下星期一就要开学了。")}</div>\n  <div class="qa">3. Bạn đi hôm nay hay ngày mai? → ${i("你今天去还是明天去？")}</div>\n  <div class="qa">4. Anh ấy học hành rất giỏi. → ${i("他学习很好。")}</div>\n</div>`}),LESSON.pron={toneWords:[["开学","kāixué","1 + 2"],["后面","hòumiàn","4 + 4"],["考试","kǎoshì","3 + 4"],["本子","běnzi","3 + nhẹ"],["快要","kuàiyào","4 + 4"],["还是","háishi","2 + nhẹ"]],changes:[{title:"① Thanh 3 + Thanh 3",desc:"Thanh 3 đứng trước thanh 3 đọc thành thanh 2.",drills:[["好好","háohǎo","kỹ lưỡng","hǎohǎo"],["洗手","xíshǒu","rửa tay","xǐshǒu"],["我也","wó yě","tôi cũng","wǒ yě"]]},{title:"② Biến điệu của 一 và 不",desc:"第一名: <b>yī</b> (số thứ tự) · 看一看: 一 đọc nhẹ <b>yi</b> · 不错: <b>bú</b>cuò.",drills:[["第一名","dì-yī míng","hạng nhất"],["看一看","kàn yi kàn","xem thử"],["真不错","zhēn búcuò","giỏi lắm","zhēn bùcuò"]]}],neutral:{title:"Thanh nhẹ",desc:"是 trong 还是, 子 trong 本子, 呢, 了, 得.",drills:[["还是","háishi","hay là"],["本子","běnzi","quyển vở"],["考得","kǎo de","thi (thế nào)"],["笔呢","bǐ ne","bút đâu"]]},sounds:[["c – t","","词 cí (đầu lưỡi, bật hơi, xát) ↔ 题 tí (bật hơi, không xát).",[["词","cí"],["题","tí"]]],["x + -i <script id="vx-js">/* ============================================================
   HSK GARDEN · PHÂN TÍCH TỪ VỰNG (bố cục mới, HSK1–2)
   Dựng lại tab 生词 thành: dải từ mới · thẻ phân tích từ · luyện viết lồng ghép.
   Nội dung lấy NGUYÊN từ bài: thẻ từ, cửa sổ chi tiết (vd), thẻ viết chữ (char-card).
   Tab 写字 riêng được gộp vào đây (nét cơ bản · quy tắc · bộ thủ đặt trong mục mở rộng).
   ============================================================ */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var CACHE = {};

  /* Lấy nội dung chi tiết của một từ bằng chính cửa sổ chi tiết của bài (không viết lại nội dung). */
  function detailOf(word, srcEl) {
    if (CACHE[word]) return CACHE[word];
    var modal = $("#vocabDetailModal"), body = $("#vdBody");
    var info = { word: word, py: "", tags: [], mean: "", note: "", exHTML: "" };
    if (!modal || !body || !srcEl) return info;
    srcEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    var pyEl = $("#vdPy");
    if (pyEl) { var c = pyEl.cloneNode(true); $$(".spk", c).forEach(function (b) { b.remove(); }); info.py = c.textContent.trim(); }
    $$(".vd-row .vd-tag", body).forEach(function (t) { info.tags.push({ hv: t.classList.contains("hv"), html: t.innerHTML }); });
    var m = $(".vd-mean", body); if (m) info.mean = m.innerHTML;
    var n = $(".vd-note", body); if (n) info.note = n.innerHTML;
    var ex = $(".ex-list", body); if (ex) info.exHTML = ex.innerHTML;
    var close = $("[data-vd-close]", modal);
    if (close) close.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
    if (!$(".big-modal.open")) document.body.classList.remove("modal-open");
    CACHE[word] = info;
    return info;
  }

  function build(sec) {
    var id = sec.id.replace(/-vocab$/, "");
    var modalBody = sec.closest(".modal-body") || sec.parentElement;
    var writeSec = document.getElementById(id + "-write");
    var writeBtn = $('.sub-tab-btn[data-sub="' + id + '-write"]', modalBody);

    /* ---- 1. Danh sách từ (giữ thứ tự & nhóm như bài) ---- */
    var items = [];
    var groups = $$(".vgroup", sec);
    if (groups.length) {
      groups.forEach(function (g) {
        var head = $(".vgroup-head", g);
        $$(".vocab-card[data-vocab]", g).forEach(function (card, i) { items.push({ card: card, group: i === 0 && head ? head.innerHTML : null }); });
      });
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { if (!items.some(function (x) { return x.card === card; })) items.push({ card: card }); });
    } else {
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { items.push({ card: card }); });
    }
    $$(".proper-chip[data-vocab]", sec).forEach(function (chip, i) { items.push({ card: chip, proper: true, group: i === 0 ? '<span class="cn">专名</span><b>Tên riêng</b>' : null }); });
    if (!items.length) return;
    items.forEach(function (it) {
      var c = it.card;
      it.word = c.dataset.vocab;
      if (it.proper) {
        it.py = ($("span", c) || {}).textContent || ""; it.vi = ($("em", c) || {}).innerHTML || ""; it.pos = "tên riêng";
      } else {
        it.py = ($(".py", c) || {}).textContent || "";
        it.pos = ($(".pos", c) || {}).textContent || "";
        it.vi = ($(".vi", c) || {}).innerHTML || "";
        it.link = (($(".vlink", c) || {}).innerHTML || "").replace(/^\s*🔗\s*/, "");
        var sgk = $(".sgk", c); it.sgk = sgk ? sgk.textContent : "";
      }
    });

    /* ---- 2. Thẻ viết chữ của đoạn ---- */
    var charCards = {};
    if (writeSec) $$(".char-card", writeSec).forEach(function (cc) { var m = $(".mizi[data-char]", cc); if (m && !charCards[m.dataset.char]) charCards[m.dataset.char] = cc; });
    var used = {};
    items.forEach(function (it) { it.chars = Array.from(it.word).filter(function (ch) { return charCards[ch]; }); it.chars.forEach(function (ch) { used[ch] = 1; }); });
    var extra = Object.keys(charCards).filter(function (ch) { return !used[ch]; });
    if (extra.length) items.push({ word: extra.join(""), extraChars: true, chars: extra, group: '<span class="cn">写字</span><b>Chữ luyện thêm</b>' });

    /* ---- 3. Khung mới ---- */
    var toolbar = $(".toolbar", sec);
    var store = document.createElement("div"); store.hidden = true; store.className = "vx-store";
    Object.keys(charCards).forEach(function (ch) { store.appendChild(charCards[ch]); });

    var more = null;
    if (writeSec) {
      var rest = $$(":scope > *", writeSec).filter(function (e) { return !e.classList.contains("char-grid") && !(e.classList.contains("section-title") && /写汉字/.test(e.textContent)) && !(e.matches("p.hint") && /Xem viết/.test(e.textContent)); });
      if (rest.length) {
        more = document.createElement("details"); more.className = "vx-more";
        more.innerHTML = "<summary>📘 Kiến thức viết chữ của đoạn · <span>nét cơ bản · quy tắc thứ tự nét · bộ thủ</span></summary>";
        var box = document.createElement("div"); box.className = "vx-more-body";
        rest.forEach(function (e) { box.appendChild(e); });
        more.appendChild(box);
      }
      var hint = $$(":scope > p.hint", writeSec).filter(function (p) { return /Xem viết/.test(p.textContent); })[0];
      var hintHTML = hint ? hint.innerHTML : "";
    }

    var oldNodes = $$(":scope > *", sec);
    var wrap = document.createElement("div"); wrap.className = "vx";
    wrap.innerHTML =
      '<div class="vx-panel">' +
        '<div class="vx-head"><div class="vx-title"><span class="vx-ic">📖</span><b>Từ mới trong đoạn</b><span class="vx-sub">' + items.filter(function (x) { return !x.extraChars; }).length + ' từ · bấm từ hoặc dùng nút chuyển để xem từng từ</span></div>' +
          '<div class="vx-nav"><button type="button" class="vx-prev">‹ Từ trước</button><span class="vx-count"></span><button type="button" class="vx-next">Từ tiếp ›</button></div></div>' +
        '<div class="vx-tools"></div>' +
        '<div class="vx-chips" role="tablist">' + items.map(function (it, i) {
          return (it.group ? '<span class="vx-group">' + it.group + "</span>" : "") +
            '<button type="button" role="tab" class="vx-chip' + (it.proper ? " proper" : "") + (it.extraChars ? " extra" : "") + '" data-i="' + i + '"><b>' + esc(it.word) + "</b>" + (it.extraChars ? "<small>✍ viết</small>" : "<small>" + esc(it.py) + "</small>") + "</button>";
        }).join("") + "</div>" +
        '<div class="vx-main"><div class="vx-left"></div><div class="vx-right"></div></div>' +
      "</div>";
    var old = document.createElement("div"); old.hidden = true; old.className = "vx-old";
    oldNodes.forEach(function (n) { if (n !== toolbar) old.appendChild(n); });
    sec.appendChild(wrap); sec.appendChild(old);
    if (toolbar) { $(".hint", toolbar) && ($(".hint", toolbar).textContent = "Ẩn nghĩa để cả lớp đoán · Nghe lần lượt cả danh sách."); $(".vx-tools", wrap).appendChild(toolbar); }
    if (more) wrap.appendChild(more);
    wrap.appendChild(store);
    /* ẩn/hiện nghĩa: nút cũ trỏ tới id đoạn → giữ hoạt động trên khung mới */
    sec.classList.add("vx-host");

    if (writeSec) { writeSec.remove(); }
    if (writeBtn) { writeBtn.remove(); }

    var cur = -1;
    function initWriter(card) {
      var r = $('[data-w="reset"]', card);
      if (r) requestAnimationFrame(function () { r.dispatchEvent(new MouseEvent("click", { bubbles: true })); });
    }
    function show(i) {
      if (i < 0 || i >= items.length) return;
      // trả thẻ viết cũ về kho
      $$(".vx-right .char-card", wrap).forEach(function (cc) { store.appendChild(cc); });
      cur = i; var it = items[i];
      $$(".vx-chip", wrap).forEach(function (b) { var on = +b.dataset.i === i; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
      var realCount = items.filter(function (x) { return !x.extraChars; }).length;
      $(".vx-count", wrap).innerHTML = it.extraChars ? "✍" : "<b>" + (i + 1) + "</b> / " + realCount;
      $(".vx-prev", wrap).disabled = i === 0; $(".vx-next", wrap).disabled = i === items.length - 1;
      var L = $(".vx-left", wrap), R = $(".vx-right", wrap);

      if (it.extraChars) {
        L.innerHTML = '<div class="vx-card"><div class="vx-word kai">' + esc(it.word) + '</div><div class="vx-pos">Chữ Hán cần viết trong đoạn</div><p class="vx-hint">Những chữ này có trong bài khoá nhưng không thuộc từ mới của đoạn. Bấm từng chữ bên phải để luyện viết.</p></div>';
      } else {
        var d = detailOf(it.word, it.card);
        var hv = d.tags.filter(function (t) { return t.hv; }).map(function (t) { return t.html.replace(/^Hán Việt:\s*/, ""); })[0] || "";
        var tags = d.tags.filter(function (t) { return !t.hv; }).map(function (t) { return '<span class="vx-tag">' + t.html + "</span>"; }).join("");
        L.innerHTML =
          '<div class="vx-card">' +
            '<div class="vx-meta">' + (it.sgk ? '<span class="vx-sgk">' + esc(it.sgk) + "</span>" : "") + (it.proper ? '<span class="vx-sgk">Tên riêng</span>' : "") + "</div>" +
            '<button type="button" class="vx-word kai" data-say="' + esc(it.word) + '" title="Bấm để nghe">' + esc(it.word) + "</button>" +
            '<div class="vx-py">' + esc(d.py || it.py) + "</div>" +
            (hv ? '<div class="vx-hv">Hán Việt: <b>' + hv + "</b></div>" : "") +
            '<div class="vx-mean vi-hideable">' + (d.mean || it.vi) + "</div>" +
            (tags ? '<div class="vx-tags">' + tags + "</div>" : (it.pos ? '<div class="vx-tags"><span class="vx-tag">' + esc(it.pos) + "</span></div>" : "")) +
            '<div class="vx-btns"><button type="button" class="vx-btn" data-say="' + esc(it.word) + '">🔊 Phát âm</button>' +
            (it.chars.length ? '<button type="button" class="vx-btn vx-practice">✍ Tập viết nét</button>' : "") + "</div>" +
          "</div>" +
          ((d.note || it.link) ? '<div class="vx-box vx-use"><div class="vx-lbl">💡 Cách dùng</div>' + (it.link ? '<div class="vx-link">🔗 ' + it.link + "</div>" : "") + (d.note ? '<div class="vx-note">' + d.note + "</div>" : "") + "</div>" : "") +
          (d.exHTML ? '<div class="vx-box vx-ex"><div class="vx-lbl">💬 Ví dụ đặt câu</div><div class="ex-list">' + d.exHTML + "</div></div>" : "");
      }

      if (it.chars.length) {
        R.innerHTML = '<div class="vx-write"><div class="vx-wh"><div class="vx-lbl">✍️ Luyện viết' + (it.chars.length > 1 ? " · chọn chữ" : "") + "</div>" +
          '<div class="vx-ctabs">' + it.chars.map(function (ch, k) { return '<button type="button" class="vx-ctab kai' + (k ? "" : " on") + '" data-ch="' + esc(ch) + '">' + esc(ch) + "</button>"; }).join("") + "</div></div>" +
          (hintHTML ? '<p class="vx-whint">' + hintHTML + "</p>" : "") + '<div class="vx-cslot"></div></div>';
        var slot = $(".vx-cslot", R);
        var put = function (ch) {
          $$(".vx-cslot .char-card", R).forEach(function (cc) { store.appendChild(cc); });
          slot.appendChild(charCards[ch]); initWriter(charCards[ch]);
          $$(".vx-ctab", R).forEach(function (b) { b.classList.toggle("on", b.dataset.ch === ch); });
        };
        put(it.chars[0]);
        $$(".vx-ctab", R).forEach(function (b) { b.addEventListener("click", function () { put(b.dataset.ch); }); });
      } else {
        R.innerHTML = '<div class="vx-write vx-nowrite"><div class="vx-lbl">✍️ Luyện viết</div><p class="vx-hint">Các chữ của từ này đã luyện ở bài trước hoặc không nằm trong phần viết chữ của đoạn.</p></div>';
      }
      var pr = $(".vx-practice", L);
      if (pr) pr.addEventListener("click", function () {
        var card = $(".vx-cslot .char-card", R); if (!card) return;
        var q = $('[data-w="quiz"]', card); if (q) q.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }
    wrap.addEventListener("click", function (e) {
      var b = e.target.closest(".vx-chip"); if (b) { show(+b.dataset.i); return; }
      if (e.target.closest(".vx-prev")) show(cur - 1);
      if (e.target.closest(".vx-next")) show(cur + 1);
    });
    sec.addEventListener("keydown", function (e) {
      if (e.target.closest("input,textarea")) return;
      if (e.key === "ArrowRight") { show(Math.min(items.length - 1, cur + 1)); e.preventDefault(); }
      if (e.key === "ArrowLeft") { show(Math.max(0, cur - 1)); e.preventDefault(); }
    });
    sec.tabIndex = -1;
    show(0);
    /* khi mở lại tab / cửa sổ, vẽ lại ô viết đang hiện */
    var obs = new MutationObserver(function () { if (sec.classList.contains("active") && sec.offsetParent) { var c = $(".vx-cslot .char-card", wrap); if (c) initWriter(c); } });
    obs.observe(sec, { attributes: true, attributeFilter: ["class"] });
    var mod = sec.closest(".big-modal"); if (mod) obs.observe(mod, { attributes: true, attributeFilter: ["class"] });
  }

  function run() { $$('.sub-content[id$="-vocab"]').forEach(function (s) { try { build(s); } catch (e) { console.error("vx", e); } }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script></body></html>
