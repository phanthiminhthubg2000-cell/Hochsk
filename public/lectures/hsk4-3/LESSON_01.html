<script>window.LESSON={"theme":{"--green":"#3f7d3a","--deep":"#24521f","--mint":"#e3efd9","--mint2":"#f0f6ea","--gold":"#c0702a","--gold2":"#f7e8d8","--line":"#d5e4c8","--ink":"#25331f","--muted":"#5f6f57","--bg1":"rgba(220,236,206,.9)","--bg2":"rgba(192,112,42,.12)","--bg3":"#f9fcf5","--bg4":"#f1f6ea","--bg5":"#fdf9f3","--head1":"#e6f1dc","--head2":"#f8ebdd","--tip":"#f3f8ee","--soft":"#f4f9ef","--softline":"#d9e8cd","--soft2":"#fbfdf8","--softline2":"#e3eed9","--miziline":"#c0702a","--mizibg":"#fffaf4","--radbg":"#fbeee0","--radline":"#e6c29c","--chipbg":"#f6faf2","--grid":"#e0b78d","--av3":"#c0702a","--bubble2":"#fbeee0","--bubble2line":"#ebcaa6"},"vocab":{"签证":{"sgk":1,"link":"办签证 · 学生签证","py":"qiānzhèng","pos":"n.","posVi":"danh từ","vi":"thị thực, visa","hv":"thiêm chứng","en":"visa","note":"签 (ký) + 证 (giấy chứng nhận). Động từ đi kèm: <b>办签证<\/b> (làm visa), <b>申请签证<\/b> (xin visa).","ex":[["请把护照、签证和入学通知书给我。","Qǐng bǎ hùzhào, qiānzhèng hé rùxué tōngzhīshū gěi wǒ.","Hãy đưa hộ chiếu, visa và giấy báo nhập học cho cô."],["我的签证下个月就到期了。","Wǒ de qiānzhèng xià ge yuè jiù dàoqī le.","Visa của tôi tháng sau là hết hạn."]]},"入学":{"sgk":2,"link":"入学手续 · 入学通知书","py":"rùxué","pos":"v.","posVi":"động từ","vi":"nhập học, vào trường","hv":"nhập học","en":"enter a school/college","note":"Hán Việt trùng nghĩa: <b>nhập học<\/b>. Hay đi thành cụm: 入学手续 (thủ tục nhập học), 入学通知书 (giấy báo nhập học).","ex":[["白家月和陈天中在办理入学手续。","Bái Jiāyuè hé Chén Tiānzhōng zài bànlǐ rùxué shǒuxù.","Bạch Gia Nguyệt và Trần Thiên Trung đang làm thủ tục nhập học."],["我是2024年入学的，学的是国际经济专业。","Wǒ shì 2024 nián rùxué de, xué de shì guójì jīngjì zhuānyè.","Tôi nhập học năm 2024, học ngành kinh tế quốc tế."]]},"通知":{"sgk":3,"link":"通知书 · 学校的通知","py":"tōngzhī","pos":"v./n.","posVi":"động từ / danh từ","vi":"thông báo","hv":"thông tri","en":"notify; notice","note":"Vừa là động từ (通知大家 — báo cho mọi người) vừa là danh từ (一个通知 — một thông báo). 通知书 = giấy báo.","ex":[["学校有任何通知，我都会第一时间告诉你。","Xuéxiào yǒu rènhé tōngzhī, wǒ dōu huì dì-yī shíjiān gàosu nǐ.","Trường có thông báo gì, tôi sẽ báo bạn ngay lập tức."],["他正在看学校的通知。","Tā zhèngzài kàn xuéxiào de tōngzhī.","Cậu ấy đang xem thông báo của trường."]]},"证件":{"sgk":4,"link":"证件和材料","py":"zhèngjiàn","pos":"n.","posVi":"danh từ","vi":"giấy tờ (tùy thân)","hv":"chứng kiện","en":"papers","note":"Chỉ chung các loại giấy tờ: hộ chiếu, thẻ sinh viên, chứng minh thư… Đi đôi với 材料 trong bài: 证件和材料.","ex":[["好的。这是我们的证件和材料。","Hǎo de. Zhè shì wǒmen de zhèngjiàn hé cáiliào.","Vâng. Đây là giấy tờ và hồ sơ của chúng em."],["到中国留学，需要准备什么证件？","Dào Zhōngguó liúxué, xūyào zhǔnbèi shénme zhèngjiàn?","Du học Trung Quốc cần chuẩn bị giấy tờ gì?"]]},"材料":{"sgk":5,"link":"准备材料","py":"cáiliào","pos":"n.","posVi":"danh từ","vi":"tài liệu, hồ sơ; vật liệu","hv":"tài liệu","en":"reference material; material","note":"Hán Việt <b>tài liệu<\/b>. Nghĩa 1: hồ sơ, giấy tờ cần nộp (申请材料). Nghĩa 2: vật liệu (建筑材料 — vật liệu xây dựng).","ex":[["这是我们的证件和材料。","Zhè shì wǒmen de zhèngjiàn hé cáiliào.","Đây là giấy tờ và hồ sơ của chúng em."],["申请奖学金要准备哪些材料？","Shēnqǐng jiǎngxuéjīn yào zhǔnbèi nǎxiē cáiliào?","Xin học bổng cần chuẩn bị những hồ sơ gì?"]]},"证":{"sgk":6,"link":"学生证 · 工作证","py":"zhèng","pos":"n.","posVi":"danh từ","vi":"giấy chứng nhận, thẻ","hv":"chứng","en":"certificate","note":"Hậu tố chỉ các loại thẻ / giấy chứng nhận: <b>学生证<\/b> (thẻ sinh viên), 工作证 (thẻ nhân viên), 出生证 (giấy khai sinh).","ex":[["办好了，这是你们的学生证。","Bànhǎo le, zhè shì nǐmen de xuéshēngzhèng.","Xong rồi, đây là thẻ sinh viên của các em."]]},"任何":{"sgk":7,"link":"任何 + danh từ + 都 / 也","py":"rènhé","pos":"pron.","posVi":"đại từ chỉ thị","vi":"bất kỳ, bất cứ","hv":"nhậm hà","en":"any","note":"Bổ nghĩa cho danh từ, thường <b>không cần 的<\/b>, phía sau hay có <b>都 / 也<\/b>. Xem 小语讲堂 1.","ex":[["你们以后有任何问题都可以来找我。","Nǐmen yǐhòu yǒu rènhé wèntí dōu kěyǐ lái zhǎo wǒ.","Sau này các em có bất kỳ vấn đề gì cũng có thể đến tìm cô."],["明天我们8点出发，任何人也不能迟到。","Míngtiān wǒmen 8 diǎn chūfā, rènhé rén yě bùnéng chídào.","Mai 8 giờ chúng ta xuất phát, bất kỳ ai cũng không được đến muộn."]]},"食堂":{"sgk":8,"link":"学校食堂","py":"shítáng","pos":"n.","posVi":"danh từ","vi":"nhà ăn, căng tin","hv":"thực đường","en":"dining hall","note":"食 (ăn) + 堂 (phòng lớn). 咱们学校有好几个食堂 — trường mình có mấy nhà ăn liền.","ex":[["校园里有图书馆、体育馆、超市，还有好几个食堂。","Xiàoyuán lǐ yǒu túshūguǎn, tǐyùguǎn, chāoshì, háiyǒu hǎo jǐ ge shítáng.","Trong khuôn viên có thư viện, nhà thi đấu, siêu thị, còn có mấy nhà ăn."],["咱们晚上别去食堂吃饭了，我请你出去吃饭吧。","Zánmen wǎnshang bié qù shítáng chī fàn le, wǒ qǐng nǐ chūqù chī fàn ba.","Tối nay mình đừng ăn ở căng tin nữa, mình mời bạn ra ngoài ăn."]]},"座":{"sgk":9,"link":"一座城市 · 一座山","py":"zuò","pos":"m.","posVi":"lượng từ","vi":"(lượng từ cho núi, nhà, thành phố…)","hv":"tọa","en":"for mountains, buildings, and other immovable objects","note":"Lượng từ cho vật <b>to, cố định<\/b>: 一座山 (núi), 一座楼 (tòa nhà), 一座桥 (cây cầu), 一座城市.","ex":[["我觉得学校就像一座小城市，什么都有。","Wǒ juéde xuéxiào jiù xiàng yí zuò xiǎo chéngshì, shénme dōu yǒu.","Mình thấy trường như một thành phố nhỏ, cái gì cũng có."],["这座楼是我们的图书馆。","Zhè zuò lóu shì wǒmen de túshūguǎn.","Tòa nhà này là thư viện của chúng tôi."]]},"申请":{"sgk":10,"link":"申请奖学金 · 申请读研究生","py":"shēnqǐng","pos":"v.","posVi":"động từ","vi":"xin, đăng ký, nộp đơn","hv":"thân thỉnh","en":"apply for","note":"<b>申请 + việc muốn xin<\/b>: 申请奖学金, 申请签证, 申请读硕士. Danh từ: 入学申请 (đơn xin nhập học).","ex":[["刚才老师说，咱们可以申请奖学金。","Gāngcái lǎoshī shuō, zánmen kěyǐ shēnqǐng jiǎngxuéjīn.","Vừa rồi cô nói chúng ta có thể xin học bổng."],["她正在写入学申请。","Tā zhèngzài xiě rùxué shēnqǐng.","Cô ấy đang viết đơn xin nhập học."]]},"奖学金":{"sgk":11,"link":"获得奖学金","py":"jiǎngxuéjīn","pos":"n.","posVi":"danh từ","vi":"học bổng","hv":"tưởng học kim","en":"scholarship","note":"奖 (thưởng) + 学 + 金 (tiền) = tiền thưởng cho việc học. Động từ đi kèm: 申请 / 获得 / 拿到奖学金.","ex":[["好像成绩好、表现好的学生都有机会获得奖学金。","Hǎoxiàng chéngjì hǎo, biǎoxiàn hǎo de xuésheng dōu yǒu jīhuì huòdé jiǎngxuéjīn.","Hình như sinh viên điểm tốt, biểu hiện tốt đều có cơ hội nhận học bổng."],["她获得了三年的奖学金，高兴极了。","Tā huòdé le sān nián de jiǎngxuéjīn, gāoxìng jí le.","Cô ấy nhận được học bổng ba năm, vui vô cùng."]]},"表现":{"sgk":12,"link":"表现好 · 好的表现","py":"biǎoxiàn","pos":"v./n.","posVi":"động từ / danh từ","vi":"thể hiện, biểu hiện","hv":"biểu hiện","en":"perform; behave","note":"Chỉ cách cư xử, kết quả làm việc / học tập: 他在学校表现很好. Cũng làm danh từ: 他的表现 (biểu hiện của cậu ấy).","ex":[["成绩好、表现好的学生都有机会获得奖学金。","Chéngjì hǎo, biǎoxiàn hǎo de xuésheng dōu yǒu jīhuì huòdé jiǎngxuéjīn.","Sinh viên điểm tốt, biểu hiện tốt đều có cơ hội nhận học bổng."],["这次比赛他表现得非常好。","Zhè cì bǐsài tā biǎoxiàn de fēicháng hǎo.","Lần thi này cậu ấy thể hiện rất tốt."]]},"获得":{"sgk":13,"link":"获得奖学金 · 获得机会","py":"huòdé","pos":"v.","posVi":"động từ","vi":"giành được, đạt được","hv":"hoạch đắc","en":"win; obtain","note":"Văn viết hơn 得到. Tân ngữ thường trừu tượng hoặc có giá trị: 获得奖学金 / 机会 / 成功 / 第一名.","ex":[["表现好的学生都有机会获得奖学金。","Biǎoxiàn hǎo de xuésheng dōu yǒu jīhuì huòdé jiǎngxuéjīn.","Sinh viên biểu hiện tốt đều có cơ hội nhận học bổng."],["她获得了三年的奖学金。","Tā huòdé le sān nián de jiǎngxuéjīn.","Cô ấy giành được học bổng ba năm."]]},"要是":{"sgk":14,"link":"要是……，就……","py":"yàoshi","pos":"conj.","posVi":"liên từ","vi":"nếu, nếu như","hv":"yếu thị","en":"if; suppose","note":"= 如果, nhưng khẩu ngữ hơn. Mẫu: <b>要是……，就……<\/b>. Xem 小语讲堂 2.","ex":[["要是申请到奖学金，就能减轻不少经济压力。","Yàoshi shēnqǐng dào jiǎngxuéjīn, jiù néng jiǎnqīng bù shǎo jīngjì yālì.","Nếu xin được học bổng thì có thể giảm bớt nhiều áp lực kinh tế."],["你要是明天有时间，就跟我一起去爬山吧。","Nǐ yàoshi míngtiān yǒu shíjiān, jiù gēn wǒ yìqǐ qù páshān ba.","Nếu mai bạn rảnh thì đi leo núi với mình nhé."]]},"减轻":{"sgk":15,"link":"减轻压力 · 减轻负担","py":"jiǎnqīng","pos":"v.","posVi":"động từ","vi":"giảm nhẹ, giảm bớt","hv":"giảm khinh","en":"ease; lighten","note":"减 (giảm) + 轻 (nhẹ). Hay đi với: 减轻压力, 减轻经济压力, 减轻工作.","ex":[["要是申请到奖学金，就能减轻不少经济压力。","Yàoshi shēnqǐng dào jiǎngxuéjīn, jiù néng jiǎnqīng bù shǎo jīngjì yālì.","Nếu xin được học bổng thì có thể giảm bớt nhiều áp lực kinh tế."],["多做运动也能减轻压力。","Duō zuò yùndòng yě néng jiǎnqīng yālì.","Vận động nhiều cũng giảm được áp lực."]]},"经济":{"sgk":16,"link":"经济压力 · 国际经济","py":"jīngjì","pos":"n.","posVi":"danh từ","vi":"kinh tế; tình hình tài chính","hv":"kinh tế","en":"financial condition; economy","note":"Hán Việt <b>kinh tế<\/b>. Nghĩa 1: nền kinh tế (中国经济). Nghĩa 2: tình hình tiền bạc của một người (经济压力 — áp lực tiền bạc).","ex":[["要是申请到奖学金，就能减轻不少经济压力。","Yàoshi shēnqǐng dào jiǎngxuéjīn, jiù néng jiǎnqīng bù shǎo jīngjì yālì.","Nếu xin được học bổng thì có thể giảm bớt nhiều áp lực kinh tế."],["陈天中想选择跟经济有关的专业。","Chén Tiānzhōng xiǎng xuǎnzé gēn jīngjì yǒuguān de zhuānyè.","Trần Thiên Trung muốn chọn ngành liên quan đến kinh tế."]]},"压力":{"sgk":17,"link":"压力很大 · 减轻压力","py":"yālì","pos":"n.","posVi":"danh từ","vi":"áp lực","hv":"áp lực","en":"pressure","note":"Hán Việt <b>áp lực<\/b>. 压力很大 (áp lực lớn), 有压力, 工作压力, 学习压力.","ex":[["他最近工作压力很大。","Tā zuìjìn gōngzuò yālì hěn dà.","Dạo này anh ấy áp lực công việc rất lớn."],["有时候她学习的时间很长，也会觉得有一些压力。","Yǒu shíhou tā xuéxí de shíjiān hěn cháng, yě huì juéde yǒu yìxiē yālì.","Có lúc cô ấy học rất lâu, cũng thấy hơi áp lực."]]},"加油":{"sgk":18,"link":"一起加油吧！","py":"jiāyóu","pos":"v.","posVi":"động từ (ly hợp)","vi":"cố lên; cổ vũ","hv":"gia du","en":"cheer; step up efforts","note":"Nghĩa gốc: đổ xăng (加 thêm + 油 dầu). Nghĩa thường dùng: <b>cố lên!<\/b>, cổ vũ: 给同学加油 (cổ vũ bạn học).","ex":[["没错，我们一起加油吧！","Méi cuò, wǒmen yìqǐ jiāyóu ba!","Đúng vậy, chúng ta cùng cố gắng nhé!"],["我们要去给参加比赛的同学加油。","Wǒmen yào qù gěi cānjiā bǐsài de tóngxué jiāyóu.","Chúng tôi đi cổ vũ các bạn tham gia cuộc thi."]]},"随着":{"sgk":19,"link":"随着 + sự thay đổi","py":"suízhe","pos":"prep.","posVi":"giới từ","vi":"cùng với, theo (sự thay đổi)","hv":"tùy trước","en":"along with","note":"Sau 随着 là cụm chỉ <b>sự thay đổi<\/b> (发展, 提高, 越来越……), vế sau là kết quả kéo theo. Xem 小语讲堂 3.","ex":[["随着中国的发展，越来越多的外国学生来到中国的大学学习。","Suízhe Zhōngguó de fāzhǎn, yuè lái yuè duō de wàiguó xuésheng láidào Zhōngguó de dàxué xuéxí.","Cùng với sự phát triển của Trung Quốc, ngày càng nhiều sinh viên nước ngoài đến học tại các trường đại học Trung Quốc."],["随着中文水平的提高，我现在能看懂中文报纸了。","Suízhe Zhōngwén shuǐpíng de tígāo, wǒ xiànzài néng kàn dǒng Zhōngwén bàozhǐ le.","Cùng với trình độ tiếng Trung được nâng lên, giờ tôi đã đọc hiểu báo tiếng Trung."]]},"课程":{"sgk":20,"link":"中文课程 · 本科课程","py":"kèchéng","pos":"n.","posVi":"danh từ","vi":"chương trình học, khóa học, môn học","hv":"khóa trình","en":"course","note":"课 (bài, tiết) + 程 (trình tự). Lượng từ: <b>门<\/b> — 一门课程 (một môn học).","ex":[["他们可以先上一年的中文课程。","Tāmen kěyǐ xiān shàng yì nián de Zhōngwén kèchéng.","Họ có thể học trước một năm chương trình tiếng Trung."],["你为什么选择这门课程？","Nǐ wèishénme xuǎnzé zhè mén kèchéng?","Vì sao bạn chọn môn học này?"]]},"专业":{"sgk":21,"link":"选择专业 · 很专业","py":"zhuānyè","pos":"n./adj.","posVi":"danh từ / tính từ","vi":"ngành học, chuyên ngành; chuyên nghiệp","hv":"chuyên nghiệp","en":"major; professional","note":"Danh từ: <b>ngành học<\/b> (你学什么专业？). Tính từ: <b>chuyên nghiệp<\/b> (他做得很专业). Chú ý: Hán Việt “chuyên nghiệp” nhưng nghĩa chính là “chuyên ngành”.","ex":[["你打算学习什么专业？为什么？","Nǐ dǎsuàn xuéxí shénme zhuānyè? Wèishénme?","Bạn định học ngành gì? Vì sao?"],["安妮要选择国际中文教育专业。","Ānnī yào xuǎnzé guójì Zhōngwén jiàoyù zhuānyè.","Annie sẽ chọn ngành giáo dục tiếng Trung quốc tế."]]},"本科":{"sgk":22,"link":"读本科 · 本科课程","py":"běnkē","pos":"n.","posVi":"danh từ","vi":"đại học (hệ chính quy, cử nhân)","hv":"bản khoa","en":"undergraduate course","note":"Bậc đại học 4 năm (cử nhân). Thứ tự bậc học: 本科 → 硕士 → 博士.","ex":[["除了读本科课程，他们还可以申请读硕士研究生。","Chúle dú běnkē kèchéng, tāmen hái kěyǐ shēnqǐng dú shuòshì yánjiūshēng.","Ngoài học chương trình đại học, họ còn có thể xin học thạc sĩ."],["李雪还有一年就本科毕业了。","Lǐ Xuě háiyǒu yì nián jiù běnkē bìyè le.","Lý Tuyết còn một năm nữa là tốt nghiệp đại học."]]},"硕士":{"sgk":23,"link":"硕士研究生","py":"shuòshì","pos":"n.","posVi":"danh từ","vi":"thạc sĩ","hv":"thạc sĩ","en":"master","note":"Hán Việt trùng nghĩa: <b>thạc sĩ<\/b>. 读硕士 = học thạc sĩ; 硕士研究生 = nghiên cứu sinh bậc thạc sĩ.","ex":[["她决定参加硕士研究生考试。","Tā juédìng cānjiā shuòshì yánjiūshēng kǎoshì.","Cô ấy quyết định thi cao học (thạc sĩ)."],["他们还可以申请读硕士研究生或者博士研究生。","Tāmen hái kěyǐ shēnqǐng dú shuòshì yánjiūshēng huòzhě bóshì yánjiūshēng.","Họ còn có thể xin học thạc sĩ hoặc tiến sĩ."]]},"研究生":{"sgk":24,"link":"考研究生 · 读研究生","py":"yánjiūshēng","pos":"n.","posVi":"danh từ","vi":"học viên sau đại học, nghiên cứu sinh","hv":"nghiên cứu sinh","en":"postgraduate; graduate","note":"Ở Trung Quốc chỉ chung người học <b>sau đại học<\/b> (cả thạc sĩ và tiến sĩ). 考研究生 (thi cao học) hay nói tắt là 考研.","ex":[["我打算考研究生，提高自己的专业水平。","Wǒ dǎsuàn kǎo yánjiūshēng, tígāo zìjǐ de zhuānyè shuǐpíng.","Tôi định thi cao học, nâng cao trình độ chuyên môn."],["她希望拿到研究生的入学通知书。","Tā xīwàng nádào yánjiūshēng de rùxué tōngzhīshū.","Cô ấy mong nhận được giấy báo nhập học cao học."]]},"博士":{"sgk":25,"link":"博士研究生","py":"bóshì","pos":"n.","posVi":"danh từ","vi":"tiến sĩ","hv":"bác sĩ","en":"doctor","note":"⚠️ Bẫy Hán Việt: 博士 đọc là “bác sĩ” nhưng nghĩa là <b>tiến sĩ<\/b>! Bác sĩ chữa bệnh là <b>医生<\/b>.","ex":[["他们还可以申请读博士研究生。","Tāmen hái kěyǐ shēnqǐng dú bóshì yánjiūshēng.","Họ còn có thể xin học tiến sĩ."],["王老师是北京大学的博士。","Wáng lǎoshī shì Běijīng Dàxué de bóshì.","Thầy Vương là tiến sĩ của Đại học Bắc Kinh."]]},"研究":{"sgk":26,"link":"做研究 · 研究文化","py":"yánjiū","pos":"v.","posVi":"động từ","vi":"nghiên cứu, tìm hiểu kỹ","hv":"nghiên cứu","en":"study; research","note":"Hán Việt trùng nghĩa: <b>nghiên cứu<\/b>. 做研究 (làm nghiên cứu), 研究中国文化.","ex":[["外国学生可以和中国学生一起学习、做研究。","Wàiguó xuésheng kěyǐ hé Zhōngguó xuésheng yìqǐ xuéxí, zuò yánjiū.","Sinh viên nước ngoài có thể cùng sinh viên Trung Quốc học tập, làm nghiên cứu."],["因为我想认真研究中国的历史和文化。","Yīnwèi wǒ xiǎng rènzhēn yánjiū Zhōngguó de lìshǐ hé wénhuà.","Vì tôi muốn nghiên cứu nghiêm túc lịch sử và văn hóa Trung Quốc."]]},"活动":{"sgk":27,"link":"校园活动 · 参加活动","py":"huódòng","pos":"n./v.","posVi":"danh từ / động từ","vi":"hoạt động; vận động","hv":"hoạt động","en":"activity; move about","note":"Danh từ: 参加活动 (tham gia hoạt động). Động từ: 活动活动 (vận động một chút).","ex":[["外国学生可以和中国学生一起参加校园活动。","Wàiguó xuésheng kěyǐ hé Zhōngguó xuésheng yìqǐ cānjiā xiàoyuán huódòng.","Sinh viên nước ngoài có thể cùng sinh viên Trung Quốc tham gia hoạt động trong trường."],["今天下午公司有活动，我晚点儿回家。","Jīntiān xiàwǔ gōngsī yǒu huódòng, wǒ wǎn diǎnr huíjiā.","Chiều nay công ty có hoạt động, anh về muộn chút."]]},"通过":{"sgk":28,"link":"通过 + cách thức · 通过考试","py":"tōngguò","pos":"prep./v.","posVi":"giới từ / động từ","vi":"thông qua; vượt qua (kỳ thi)","hv":"thông qua","en":"through; pass","note":"Giới từ: <b>通过 + phương tiện / cách thức<\/b> (通过这些交流). Động từ: 通过考试 (thi đỗ), 通过马路 (đi qua đường).","ex":[["通过这些交流，外国学生能更快地适应中国的大学生活。","Tōngguò zhèxiē jiāoliú, wàiguó xuésheng néng gèng kuài de shìyìng Zhōngguó de dàxué shēnghuó.","Thông qua những giao lưu này, sinh viên nước ngoài có thể thích nghi nhanh hơn với đời sống đại học Trung Quốc."],["陈天中希望通过学习，了解更多国际贸易方面的知识。","Chén Tiānzhōng xīwàng tōngguò xuéxí, liǎojiě gèng duō guójì màoyì fāngmiàn de zhīshi.","Trần Thiên Trung mong thông qua việc học hiểu thêm kiến thức về thương mại quốc tế."]]},"交流":{"sgk":29,"link":"跟……交流","py":"jiāoliú","pos":"v.","posVi":"động từ","vi":"giao lưu, trao đổi","hv":"giao lưu","en":"exchange","note":"Hán Việt <b>giao lưu<\/b>. Mẫu: <b>跟 / 和 + người + 交流<\/b>. Danh từ: 文化交流 (giao lưu văn hóa).","ex":[["通过这些交流，外国学生能更快地适应中国的大学生活。","Tōngguò zhèxiē jiāoliú, wàiguó xuésheng néng gèng kuài de shìyìng Zhōngguó de dàxué shēnghuó.","Thông qua những giao lưu này, sinh viên nước ngoài thích nghi nhanh hơn."],["要想学好中文，一方面要多读书，另一方面要多和中国人交流。","Yào xiǎng xuéhǎo Zhōngwén, yì fāngmiàn yào duō dúshū, lìng yì fāngmiàn yào duō hé Zhōngguórén jiāoliú.","Muốn học giỏi tiếng Trung, một mặt phải đọc nhiều, mặt khác phải giao lưu nhiều với người Trung Quốc."]]},"适应":{"sgk":30,"link":"适应生活 · 适应环境","py":"shìyìng","pos":"v.","posVi":"động từ","vi":"thích ứng, thích nghi","hv":"thích ứng","en":"adapt to","note":"Hán Việt <b>thích ứng<\/b>. Tân ngữ: 生活, 环境, 天气, 工作. 我还不太适应北京的天气.","ex":[["外国学生能更快地适应中国的大学生活。","Wàiguó xuésheng néng gèng kuài de shìyìng Zhōngguó de dàxué shēnghuó.","Sinh viên nước ngoài có thể thích nghi nhanh hơn với đời sống đại học Trung Quốc."],["刚来的时候，我不太适应这里的天气。","Gāng lái de shíhou, wǒ bú tài shìyìng zhèli de tiānqì.","Lúc mới đến, tôi chưa quen lắm với thời tiết ở đây."]]},"将来":{"sgk":31,"link":"将来想做什么？","py":"jiānglái","pos":"n.","posVi":"danh từ","vi":"tương lai, sau này","hv":"tương lai","en":"future","note":"Hán Việt trùng nghĩa: <b>tương lai<\/b>. Làm trạng ngữ thời gian: 你将来想做什么工作？","ex":[["有人对经济感兴趣，希望将来在国际公司工作。","Yǒurén duì jīngjì gǎn xìngqù, xīwàng jiānglái zài guójì gōngsī gōngzuò.","Có người hứng thú với kinh tế, mong sau này làm ở công ty quốc tế."],["你将来想做什么工作？","Nǐ jiānglái xiǎng zuò shénme gōngzuò?","Sau này bạn muốn làm công việc gì?"]]},"国际":{"sgk":32,"link":"国际公司 · 国际贸易","py":"guójì","pos":"adj./n.","posVi":"tính từ / danh từ","vi":"quốc tế","hv":"quốc tế","en":"international; world","note":"Hán Việt trùng nghĩa: <b>quốc tế<\/b>. 国际公司, 国际贸易, 国际中文教育, 国际学生.","ex":[["希望将来在国际公司工作。","Xīwàng jiānglái zài guójì gōngsī gōngzuò.","Mong sau này làm việc ở công ty quốc tế."],["我是2024年入学的，学的是国际经济专业。","Wǒ shì 2024 nián rùxué de, xué de shì guójì jīngjì zhuānyè.","Tôi nhập học năm 2024, học ngành kinh tế quốc tế."]]},"当":{"sgk":33,"link":"当 + nghề nghiệp","py":"dāng","pos":"v.","posVi":"động từ","vi":"làm, đảm nhiệm (nghề)","hv":"đương","en":"work as","note":"<b>当 + nghề / chức vụ<\/b>: 当医生, 当老师, 当翻译. Gần nghĩa 成为 nhưng khẩu ngữ hơn.","ex":[["有人喜欢学医，打算回国后当一名医生。","Yǒurén xǐhuan xué yī, dǎsuàn huí guó hòu dāng yì míng yīshēng.","Có người thích học y, định về nước làm bác sĩ."],["我小时候想当老师。","Wǒ xiǎoshíhou xiǎng dāng lǎoshī.","Hồi nhỏ tôi muốn làm cô giáo."]]},"教育":{"sgk":34,"link":"国际中文教育 · 教育孩子","py":"jiàoyù","pos":"n./v.","posVi":"danh từ / động từ","vi":"giáo dục","hv":"giáo dục","en":"education; educate","note":"Hán Việt trùng nghĩa: <b>giáo dục<\/b>. Danh từ: 对教育有热情. Động từ: 教育孩子.","ex":[["还有人对教育有热情，想要成为一名教师。","Háiyǒu rén duì jiàoyù yǒu rèqíng, xiǎngyào chéngwéi yì míng jiàoshī.","Còn có người có nhiệt huyết với giáo dục, muốn trở thành giáo viên."],["安妮要选择国际中文教育专业。","Ānnī yào xuǎnzé guójì Zhōngwén jiàoyù zhuānyè.","Annie sẽ chọn ngành giáo dục tiếng Trung quốc tế."]]},"成为":{"sgk":35,"link":"成为 + danh từ","py":"chéngwéi","pos":"v.","posVi":"động từ","vi":"trở thành","hv":"thành vi","en":"become","note":"Sau 成为 luôn là <b>danh từ<\/b>: 成为一名教师, 成为好朋友. Không nói <s>成为漂亮<\/s> → 变得漂亮.","ex":[["还有人对教育有热情，想要成为一名教师。","Háiyǒu rén duì jiàoyù yǒu rèqíng, xiǎngyào chéngwéi yì míng jiàoshī.","Còn có người có nhiệt huyết với giáo dục, muốn trở thành giáo viên."],["我们很快就成为了好朋友。","Wǒmen hěn kuài jiù chéngwéi le hǎo péngyou.","Chúng tôi nhanh chóng trở thành bạn tốt."]]},"教师":{"sgk":36,"link":"一名教师","py":"jiàoshī","pos":"n.","posVi":"danh từ","vi":"giáo viên","hv":"giáo sư","en":"teacher","note":"Văn viết, trang trọng hơn 老师. ⚠️ Hán Việt “giáo sư” nhưng nghĩa là <b>giáo viên<\/b>; giáo sư đại học là <b>教授<\/b>.","ex":[["想要成为一名教师。","Xiǎngyào chéngwéi yì míng jiàoshī.","Muốn trở thành một giáo viên."],["我妈妈是一名中学教师。","Wǒ māma shì yì míng zhōngxué jiàoshī.","Mẹ tôi là giáo viên trung học."]]},"贸易":{"sgk":37,"link":"国际贸易","py":"màoyì","pos":"n.","posVi":"danh từ","vi":"thương mại, mậu dịch","hv":"mậu dịch","en":"trade","note":"Hán Việt <b>mậu dịch<\/b>. 国际贸易 (thương mại quốc tế), 贸易公司.","ex":[["希望通过学习，了解更多国际贸易方面的知识。","Xīwàng tōngguò xuéxí, liǎojiě gèng duō guójì màoyì fāngmiàn de zhīshi.","Mong thông qua học tập hiểu thêm kiến thức về thương mại quốc tế."],["我哥哥在一家贸易公司工作。","Wǒ gēge zài yìjiā màoyì gōngsī gōngzuò.","Anh tôi làm ở một công ty thương mại."]]},"方面":{"sgk":38,"link":"……方面 · 一方面","py":"fāngmiàn","pos":"n.","posVi":"danh từ","vi":"phương diện, mặt","h thân sang năm muốn du học Trung Quốc; gọi video giới thiệu thủ tục, đời sống và cho lời khuyên.","你要先申请学校，拿到入学通知书以后再办签证。到了学校，要把护照、签证和入学通知书给老师……要是有任何问题，都可以问我！"],["Hỏi bạn: 到中国留学，需要准备什么证件和材料？","需要准备护照、签证、入学通知书，还有一些申请材料。"],["Nói về ngành học muốn chọn và lý do (一方面……，另一方面……).","我想学国际贸易专业，一方面因为我对经济感兴趣，另一方面将来想在国际公司工作。"],["Nói về một thay đổi của bản thân với 随着.","随着中文水平的提高，我现在能看懂很多中文电影了。"]],"summaryTitle":"Tự đánh giá bài 1","summaryHead":"学习小结 · Tự đánh giá (theo sách)","summary":[["Dùng các từ 入学、奖学金、课程、专业、研究、活动、教育 để nói về chủ đề du học.","能使用本课“入学、奖学金、课程、专业、研究、活动、教育”等词语，谈论留学话题。"],["Hiểu và vận dụng 任何 · 要是……，就…… · 随着 · 一方面……，另一方面…….","能理解并运用“任何”“要是……，就……”“随着”“一方面……，另一方面……”等语言点。"],["Giới thiệu được thủ tục nhập học, xin học bổng.","能介绍办理入学手续、申请奖学金等信息。"],["Nói được lý do chọn ngành và hướng phát triển nghề nghiệp.","能表达自己选择专业的理由和未来职业发展方向。"]],"blocks":[{"tab":"h3","title":"Bài 3d. 选择合适的内容完成短文 Chọn nội dung hoàn thành đoạn văn (theo sách)","req":"A 也会觉得有一些压力　B 她除了复习大学学过的课程　C 她决定参加硕士研究生考试　D 希望拿到研究生的入学通知书<br>李雪还有一年就本科毕业 (bìyè — tốt nghiệp) 了，＿(1)＿。为了准备考试，＿(2)＿，还读了一些新的专业书，希望更多地了解这方面的知识。有时候她学习的时间很长，＿(3)＿，但是她还是坚持每天学习。随着考试的时间越来越近，李雪也更努力地复习，＿(4)＿，在新的学校里继续学习更多知识。","items":[["(1)","C 她决定参加硕士研究生考试"],["(2)","B 她除了复习大学学过的课程"],["(3)","A 也会觉得有一些压力"],["(4)","D 希望拿到研究生的入学通知书"]]}]},"extraBodies":{"cultureBody":"\n<div class=\"sub-tabs\"><button class=\"sub-tab-btn active\" data-sub=\"c1\" type=\"button\"><span class=\"cn\">角色扮演<\/span>Đóng vai<\/button><button class=\"sub-tab-btn\" data-sub=\"c2\" type=\"button\"><span class=\"cn\">写作<\/span>Viết đoạn văn<\/button><button class=\"sub-tab-btn\" data-sub=\"c3\" type=\"button\"><span class=\"cn\">文化<\/span>Du học Trung Quốc<\/button><\/div>\n<div class=\"sub-content active\" id=\"c1\">\n  <div class=\"gram-card\"><h3><span class=\"no\">★<\/span>任务活动 · 角色扮演 (Đóng vai)<\/h3>\n    <p class=\"zh\" style=\"font-size:19px\">你的好朋友计划明年也来中国留学，但他/她对留学手续以及在中国的学习和生活还有很多不了解的地方。今天你们视频通话时，请你根据自己的经历向他/她介绍相关情况并给出建议。<\/p>\n    <p>Bạn thân sang năm cũng định du học Trung Quốc nhưng còn nhiều điều chưa rõ về thủ tục và việc học, cuộc sống. Hôm nay hai bạn gọi video — hãy dựa vào trải nghiệm của mình để giới thiệu và cho lời khuyên. Cố dùng: <b>签证、入学通知书、申请、奖学金、任何、要是……就……、一方面……另一方面……<\/b>.<\/p>\n    <div class=\"check\"><div class=\"check-title\">💬 小语的例子 · Mẫu của Tiểu Ngữ<\/div>\n      <p class=\"zh\" style=\"font-size:20px;line-height:1.9\">A：我明年想去中国留学，要准备什么？<br>B：你先申请学校，拿到入学通知书以后，再去办学生签证。<br>A：到了学校以后呢？<br>B：要把护照、签证和入学通知书给老师，办好学生证。先上一年中文课程，然后选专业。<br>A：我听说可以申请奖学金？<br>B：对，要是成绩好、表现好，就有机会获得奖学金。有任何问题都可以问我！<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"sub-content\" id=\"c2\">\n  <div class=\"gram-card\"><h3><span class=\"no\">✍<\/span>写作 · “留学中国”宣讲会<\/h3>\n    <p class=\"zh\" style=\"font-size:19px\">学校即将举办“留学中国”宣讲会。为了让外国学生更好地了解他们在中国大学的学习和生活，请根据上面谈论的内容，写一段介绍，不少于120字。<\/p>\n    <p>Trường sắp tổ chức buổi giới thiệu “Du học Trung Quốc”. Viết một đoạn giới thiệu (≥ 120 chữ) về việc học và cuộc sống của sinh viên quốc tế ở đại học Trung Quốc.<\/p>\n    <table class=\"compare\"><tr><th>Bước<\/th><th>Gợi ý<\/th><\/tr>\n      <tr><td>1 · 开头<\/td><td class=\"zh\">随着中国的发展，越来越多的外国学生……<\/td><\/tr>\n      <tr><td>2 · 入学<\/td><td class=\"zh\">来中国以前，要先……；到了学校，要……<\/td><\/tr>\n      <tr><td>3 · 学习<\/td><td class=\"zh\">可以先上……，然后选择……；除了……，还可以……<\/td><\/tr>\n      <tr><td>4 · 生活<\/td><td class=\"zh\">校园像一座小城市……；要是……，就……<\/td><\/tr>\n      <tr><td>5 · 结尾<\/td><td class=\"zh\">来中国留学，一方面……，另一方面……<\/td><\/tr><\/table>\n    <div class=\"check\"><div class=\"check-title\">📄 范文 · Bài mẫu (khoảng 190 chữ)<\/div>\n      <p class=\"zh\" style=\"font-size:19px;line-height:1.9\">随着中国的发展，越来越多的外国学生来到中国的大学学习。来中国以前，你要先申请学校，拿到入学通知书以后再办签证。到了学校，把护照、签证和入学通知书交给老师，就能拿到学生证了。<br>刚开始，你可以先上一年的中文课程，然后根据自己的兴趣选择专业。除了读本科，你还可以申请读硕士或者博士。要是成绩好、表现好，还有机会获得奖学金，减轻经济压力。<br>中国的大学校园很大，有图书馆、体育馆、超市和食堂，就像一座小城市。你可以和中国学生一起学习、参加活动，这样能更快地适应这里的生活。来中国留学，一方面能学习语言和知识，另一方面也能为将来的工作做准备。欢迎你来中国！<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"sub-content\" id=\"c3\">\n  <div class=\"gram-card\"><h3><span class=\"no\">★<\/span>小语的彩蛋 · 来中国留学 (Du học Trung Quốc)<\/h3>\n    <p>Trung Quốc hiện là một trong những điểm đến du học lớn của châu Á. Sinh viên quốc tế thường đi theo lộ trình:<\/p>\n    <table class=\"compare\"><tr><th>Giai đoạn<\/th><th>Nội dung<\/th><\/tr>\n      <tr><td>语言进修 (yǔyán jìnxiū)<\/td><td>Học tiếng 1 năm (chương trình 中文课程) để đạt HSK 4–5.<\/td><\/tr>\n      <tr><td>本科 · 4 năm<\/td><td>Học ngành bằng tiếng Trung; nhiều trường yêu cầu <b>HSK 4<\/b> trở lên.<\/td><\/tr>\n      <tr><td>硕士 · 2–3 năm<\/td><td>Thường yêu cầu <b>HSK 5<\/b>; có thể xin học bổng chính phủ.<\/td><\/tr>\n      <tr><td>博士 · 3–4 năm<\/td><td>Làm nghiên cứu (做研究) cùng giáo sư hướng dẫn (导师 dǎoshī).<\/td><\/tr><\/table>\n    <p>Học bổng phổ biến: <b>中国政府奖学金<\/b> (học bổng Chính phủ Trung Quốc), <b>国际中文教师奖学金<\/b> (học bổng giáo viên tiếng Trung quốc tế — đúng ngành của Annie!), học bổng của tỉnh / thành phố và của trường.<\/p>\n    <p class=\"hint\">Các từ 进修, 导师, 政府 chỉ là mở rộng, không bắt buộc học thuộc.<\/p>\n  <\/div>\n<\/div>"}};LESSON.grammar=({ex:A,rv:i,spk:h})=>({t1:`

   Tab 写字 riêng được gộp vào đây (nét cơ bản · quy tắc · bộ thủ đặt trong mục mở rộng).
   ============================================================ */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var CACHE = {};

  /* Lấy nội dung chi tiết của một từ bằng chính cửa sổ chi tiết của bài (không viết lại nội dung). */
  function detailOf(word, srcEl) {
    if (CACHE[word]) return CACHE[word];
    var modal = $("#vocabDetailModal"), body = $("#vdBody");
    var info = { word: word, py: "", tags: [], mean: "", note: "", exHTML: "" };
    if (!modal || !body || !srcEl) return info;
    srcEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    var pyEl = $("#vdPy");
    if (pyEl) { var c = pyEl.cloneNode(true); $$(".spk", c).forEach(function (b) { b.remove(); }); info.py = c.textContent.trim(); }
    $$(".vd-row .vd-tag", body).forEach(function (t) { info.tags.push({ hv: t.classList.contains("hv"), html: t.innerHTML }); });
    var m = $(".vd-mean", body); if (m) info.mean = m.innerHTML;
    var n = $(".vd-note", body); if (n) info.note = n.innerHTML;
    var ex = $(".ex-list", body); if (ex) info.exHTML = ex.innerHTML;
    var close = $("[data-vd-close]", modal);
    if (close) close.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
    if (!$(".big-modal.open")) document.body.classList.remove("modal-open");
    CACHE[word] = info;
    return info;
  }

  function build(sec) {
    var id = sec.id.replace(/-vocab$/, "");
    var modalBody = sec.closest(".modal-body") || sec.parentElement;
    var writeSec = document.getElementById(id + "-write");
    var writeBtn = $('.sub-tab-btn[data-sub="' + id + '-write"]', modalBody);

    /* ---- 1. Danh sách từ (giữ thứ tự & nhóm như bài) ---- */
    var items = [];
    var groups = $$(".vgroup", sec);
    if (groups.length) {
      groups.forEach(function (g) {
        var head = $(".vgroup-head", g);
        $$(".vocab-card[data-vocab]", g).forEach(function (card, i) { items.push({ card: card, group: i === 0 && head ? head.innerHTML : null }); });
      });
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { if (!items.some(function (x) { return x.card === card; })) items.push({ card: card }); });
    } else {
      $$(".vocab-card[data-vocab]", sec).forEach(function (card) { items.push({ card: card }); });
    }
    $$(".proper-chip[data-vocab]", sec).forEach(function (chip, i) { items.push({ card: chip, proper: true, group: i === 0 ? '<span class="cn">专名</span><b>Tên riêng</b>' : null }); });
    if (!items.length) return;
    items.forEach(function (it) {
      var c = it.card;
      it.word = c.dataset.vocab;
      if (it.proper) {
        it.py = ($("span", c) || {}).textContent || ""; it.vi = ($("em", c) || {}).innerHTML || ""; it.pos = "tên riêng";
      } else {
        it.py = ($(".py", c) || {}).textContent || "";
        it.pos = ($(".pos", c) || {}).textContent || "";
        it.vi = ($(".vi", c) || {}).innerHTML || "";
        it.link = (($(".vlink", c) || {}).innerHTML || "").replace(/^\s*🔗\s*/, "");
        var sgk = $(".sgk", c); it.sgk = sgk ? sgk.textContent : "";
      }
    });

    /* ---- 2. Thẻ viết chữ của đoạn ---- */
    var charCards = {};
    if (writeSec) $$(".char-card", writeSec).forEach(function (cc) { var m = $(".mizi[data-char]", cc); if (m && !charCards[m.dataset.char]) charCards[m.dataset.char] = cc; });
    var used = {};
    items.forEach(function (it) { it.chars = Array.from(it.word).filter(function (ch) { return charCards[ch]; }); it.chars.forEach(function (ch) { used[ch] = 1; }); });
    var extra = Object.keys(charCards).filter(function (ch) { return !used[ch]; });
    if (extra.length) items.push({ word: extra.join(""), extraChars: true, chars: extra, group: '<span class="cn">写字</span><b>Chữ luyện thêm</b>' });

    /* ---- 3. Khung mới ---- */
    var toolbar = $(".toolbar", sec);
    var store = document.createElement("div"); store.hidden = true; store.className = "vx-store";
    Object.keys(charCards).forEach(function (ch) { store.appendChild(charCards[ch]); });

    var more = null;
    if (writeSec) {
      var rest = $$(":scope > *", writeSec).filter(function (e) { return !e.classList.contains("char-grid") && !(e.classList.contains("section-title") && /写汉字/.test(e.textContent)) && !(e.matches("p.hint") && /Xem viết/.test(e.textContent)); });
      if (rest.length) {
        more = document.createElement("details"); more.className = "vx-more";
        more.innerHTML = "<summary>📘 Kiến thức viết chữ của đoạn · <span>nét cơ bản · quy tắc thứ tự nét · bộ thủ</span></summary>";
        var box = document.createElement("div"); box.className = "vx-more-body";
        rest.forEach(function (e) { box.appendChild(e); });
        more.appendChild(box);
      }
      var hint = $$(":scope > p.hint", writeSec).filter(function (p) { return /Xem viết/.test(p.textContent); })[0];
      var hintHTML = hint ? hint.innerHTML : "";
    }

    var oldNodes = $$(":scope > *", sec);
    var wrap = document.createElement("div"); wrap.className = "vx";
    wrap.innerHTML =
      '<div class="vx-panel">' +
        '<div class="vx-head"><div class="vx-title"><span class="vx-ic">📖</span><b>Từ mới trong đoạn</b><span class="vx-sub">' + items.filter(function (x) { return !x.extraChars; }).length + ' từ · bấm từ hoặc dùng nút chuyển để xem từng từ</span></div>' +
          '<div class="vx-nav"><button type="button" class="vx-prev">‹ Từ trước</button><span class="vx-count"></span><button type="button" class="vx-next">Từ tiếp ›</button></div></div>' +
        '<div class="vx-tools"></div>' +
        '<div class="vx-chips" role="tablist">' + items.map(function (it, i) {
          return (it.group ? '<span class="vx-group">' + it.group + "</span>" : "") +
            '<button type="button" role="tab" class="vx-chip' + (it.proper ? " proper" : "") + (it.extraChars ? " extra" : "") + '" data-i="' + i + '"><b>' + esc(it.word) + "</b>" + (it.extraChars ? "<small>✍ viết</small>" : "<small>" + esc(it.py) + "</small>") + "</button>";
        }).join("") + "</div>" +
        '<div class="vx-main"><div class="vx-left"></div><div class="vx-right"></div></div>' +
      "</div>";
    var old = document.createElement("div"); old.hidden = true; old.className = "vx-old";
    oldNodes.forEach(function (n) { if (n !== toolbar) old.appendChild(n); });
    sec.appendChild(wrap); sec.appendChild(old);
    if (toolbar) { $(".hint", toolbar) && ($(".hint", toolbar).textContent = "Ẩn nghĩa để cả lớp đoán · Nghe lần lượt cả danh sách."); $(".vx-tools", wrap).appendChild(toolbar); }
    if (more) wrap.appendChild(more);
    wrap.appendChild(store);
    /* ẩn/hiện nghĩa: nút cũ trỏ tới id đoạn → giữ hoạt động trên khung mới */
    sec.classList.add("vx-host");

    if (writeSec) { writeSec.remove(); }
    if (writeBtn) { writeBtn.remove(); }

    var cur = -1;
    function initWriter(card) {
      var r = $('[data-w="reset"]', card);
      if (r) requestAnimationFrame(function () { r.dispatchEvent(new MouseEvent("click", { bubbles: true })); });
    }
    function show(i) {
      if (i < 0 || i >= items.length) return;
      // trả thẻ viết cũ về kho
      $$(".vx-right .char-card", wrap).forEach(function (cc) { store.appendChild(cc); });
      cur = i; var it = items[i];
      $$(".vx-chip", wrap).forEach(function (b) { var on = +b.dataset.i === i; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
      var realCount = items.filter(function (x) { return !x.extraChars; }).length;
      $(".vx-count", wrap).innerHTML = it.extraChars ? "✍" : "<b>" + (i + 1) + "</b> / " + realCount;
      $(".vx-prev", wrap).disabled = i === 0; $(".vx-next", wrap).disabled = i === items.length - 1;
      var L = $(".vx-left", wrap), R = $(".vx-right", wrap);

      if (it.extraChars) {
        L.innerHTML = '<div class="vx-card"><div class="vx-word kai">' + esc(it.word) + '</div><div class="vx-pos">Chữ Hán cần viết trong đoạn</div><p class="vx-hint">Những chữ này có trong bài khoá nhưng không thuộc từ mới của đoạn. Bấm từng chữ bên phải để luyện viết.</p></div>';
      } else {
        var d = detailOf(it.word, it.card);
        var hv = d.tags.filter(function (t) { return t.hv; }).map(function (t) { return t.html.replace(/^Hán Việt:\s*/, ""); })[0] || "";
        var tags = d.tags.filter(function (t) { return !t.hv; }).map(function (t) { return '<span class="vx-tag">' + t.html + "</span>"; }).join("");
        L.innerHTML =
          '<div class="vx-card">' +
            '<div class="vx-meta">' + (it.sgk ? '<span class="vx-sgk">' + esc(it.sgk) + "</span>" : "") + (it.proper ? '<span class="vx-sgk">Tên riêng</span>' : "") + "</div>" +
            '<button type="button" class="vx-word kai" data-say="' + esc(it.word) + '" title="Bấm để nghe">' + esc(it.word) + "</button>" +
            '<div class="vx-py">' + esc(d.py || it.py) + "</div>" +
            (hv ? '<div class="vx-hv">Hán Việt: <b>' + hv + "</b></div>" : "") +
            '<div class="vx-mean vi-hideable">' + (d.mean || it.vi) + "</div>" +
            (tags ? '<div class="vx-tags">' + tags + "</div>" : (it.pos ? '<div class="vx-tags"><span class="vx-tag">' + esc(it.pos) + "</span></div>" : "")) +
            '<div class="vx-btns"><button type="button" class="vx-btn" data-say="' + esc(it.word) + '">🔊 Phát âm</button>' +
            (it.chars.length ? '<button type="button" class="vx-btn vx-practice">✍ Tập viết nét</button>' : "") + "</div>" +
          "</div>" +
          ((d.note || it.link) ? '<div class="vx-box vx-use"><div class="vx-lbl">💡 Cách dùng</div>' + (it.link ? '<div class="vx-link">🔗 ' + it.link + "</div>" : "") + (d.note ? '<div class="vx-note">' + d.note + "</div>" : "") + "</div>" : "") +
          (d.exHTML ? '<div class="vx-box vx-ex"><div class="vx-lbl">💬 Ví dụ đặt câu</div><div class="ex-list">' + d.exHTML + "</div></div>" : "");
      }

      if (it.chars.length) {
        R.innerHTML = '<div class="vx-write"><div class="vx-wh"><div class="vx-lbl">✍️ Luyện viết' + (it.chars.length > 1 ? " · chọn chữ" : "") + "</div>" +
          '<div class="vx-ctabs">' + it.chars.map(function (ch, k) { return '<button type="button" class="vx-ctab kai' + (k ? "" : " on") + '" data-ch="' + esc(ch) + '">' + esc(ch) + "</button>"; }).join("") + "</div></div>" +
          (hintHTML ? '<p class="vx-whint">' + hintHTML + "</p>" : "") + '<div class="vx-cslot"></div></div>';
        var slot = $(".vx-cslot", R);
        var put = function (ch) {
          $$(".vx-cslot .char-card", R).forEach(function (cc) { store.appendChild(cc); });
          slot.appendChild(charCards[ch]); initWriter(charCards[ch]);
          $$(".vx-ctab", R).forEach(function (b) { b.classList.toggle("on", b.dataset.ch === ch); });
        };
        put(it.chars[0]);
        $$(".vx-ctab", R).forEach(function (b) { b.addEventListener("click", function () { put(b.dataset.ch); }); });
      } else {
        R.innerHTML = '<div class="vx-write vx-nowrite"><div class="vx-lbl">✍️ Luyện viết</div><p class="vx-hint">Các chữ của từ này đã luyện ở bài trước hoặc không nằm trong phần viết chữ của đoạn.</p></div>';
      }
      var pr = $(".vx-practice", L);
      if (pr) pr.addEventListener("click", function () {
        var card = $(".vx-cslot .char-card", R); if (!card) return;
        var q = $('[data-w="quiz"]', card); if (q) q.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }
    wrap.addEventListener("click", function (e) {
      var b = e.target.closest(".vx-chip"); if (b) { show(+b.dataset.i); return; }
      if (e.target.closest(".vx-prev")) show(cur - 1);
      if (e.target.closest(".vx-next")) show(cur + 1);
    });
    sec.addEventListener("keydown", function (e) {
      if (e.target.closest("input,textarea")) return;
      if (e.key === "ArrowRight") { show(Math.min(items.length - 1, cur + 1)); e.preventDefault(); }
      if (e.key === "ArrowLeft") { show(Math.max(0, cur - 1)); e.preventDefault(); }
    });
    sec.tabIndex = -1;
    show(0);
    /* khi mở lại tab / cửa sổ, vẽ lại ô viết đang hiện */
    var obs = new MutationObserver(function () { if (sec.classList.contains("active") && sec.offsetParent) { var c = $(".vx-cslot .char-card", wrap); if (c) initWriter(c); } });
    obs.observe(sec, { attributes: true, attributeFilter: ["class"] });
    var mod = sec.closest(".big-modal"); if (mod) obs.observe(mod, { attributes: true, attributeFilter: ["class"] });
  }

  function run() { $$('.sub-content[id$="-vocab"]').forEach(function (s) { try { build(s); } catch (e) { console.error("vx", e); } }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();

  function letters(host,n,headHtml,count,right,script){
    var el=document.createElement("div");el.className="hx-q";
    el.innerHTML=head(n,headHtml)+'<div class="hx-opts">'+LET.slice(0,count).split("").map(function(c,i){return '<button type="button" class="hx-opt" data-i="'+i+'"><b style="margin:0">'+c+'</b></button>';}).join("")+'</div>'+(script?'<div class="hx-script">'+script+'</div>':"");
    host.appendChild(el);var q=reg(el);
    $$(".hx-opt",el).forEach(function(b){b.addEventListener("click",function(){if(q.d)return;var i=+b.dataset.i;$$(".hx-opt",el)[right].classList.add("right");if(i!==right)b.classList.add("wrong");mark(q,i===right);});});
  }
  function block(host,title,req){var b=document.createElement("div");b.className="hw-block";b.innerHTML='<h3>'+title+'</h3><div class="req">'+req+'</div>';host.appendChild(b);return b;}
  function legend(b,keys){var g=document.createElement("div");g.className="hx-legend";g.innerHTML=keys.map(function(k,i){return '<figure><img src="'+img(k)+'" alt="Tranh '+LET[i]+'"><figcaption>'+LET[i]+'</figcaption></figure>';}).join("");b.appendChild(g);}
  function dlg(s){return esc(s).split("|").join("<br>");}
  function legendFor(items,extra){var keys=[];items.forEach(function(it){if(keys.indexOf(it[1])<0)keys.push(it[1]);});
    (extra||[]).forEach(function(k){if(keys.indexOf(k)<0&&img(k))keys.push(k);});return shuf(keys);}
  var lv=X.lv||1;
  /* ---- dựng tab ---- */
  function scoreBar(host){var s=document.createElement("div");s.className="hx-score";s.innerHTML='<span>📝 Đề luyện HSK '+lv+' (dạng đề 3.0)</span><span class="t"></span><div class="bar"><i></i></div><button type="button" data-hxreset>↻ Làm lại</button>';host.appendChild(s);}
  function build(){
    Q=[];num=0;h2.innerHTML="";h3.innerHTML="";
    scoreBar(h2);
    var intro=document.createElement("div");intro.className="hw-block";intro.innerHTML='<h3>综合练习 · Đề luyện HSK '+lv+' (dạng đề HSK 3.0)</h3><div class="req">Câu hỏi soạn theo đúng các phần của đề thi HSK '+lv+' 3.0, dùng từ vựng và mẫu câu của bài này. Phần nghe dùng giọng đọc tự động: bấm <b>▶ Nghe</b> (có thể nghe lại). Chọn đáp án là chấm ngay; lời thoại hiện ra sau khi trả lời. Phần 阅读'+(lv>1?" và 书写":"")+' ở tab tiếp theo.</div>';h2.appendChild(intro);
    var band=document.createElement("div");band.className="hx-band";band.textContent="听力 · NGHE HIỂU";h2.appendChild(band);
    var pi=0;function pn(){return "第"+"一二三四五六"[pi++]+"部分";}
    /* nghe chọn tranh */
    if(useImg&&T.li&&T.li.length){var b=block(h2,pn()+" · Nghe, chọn tranh đúng","听录音，选出对应的图片。");
      T.li.forEach(function(it){var others=it[2]||shuf(IMGS.filter(function(k){return k!==it[1];})).slice(0,2);var opts=shuf([it[1]].concat(others));choice(b,++num,playBtn(it[0]),opts,opts.indexOf(it[1]),dlg(it[0]),true);});}
    /* HSK1: nghe câu chọn từ xuất hiện */
    if(lv===1&&T.lw&&T.lw.length){var b2=block(h2,pn()+" · Nghe câu, chọn từ có trong câu","听句子，选出句子中出现的词语。");
      T.lw.forEach(function(it){choice(b2,++num,playBtn(it[0]),it[1],it[2],dlg(it[0]));});}
    /* nghe hội thoại, nối tranh */
    if(useImg&&T.lm&&T.lm.length){var b3=block(h2,pn()+" · Nghe hội thoại, chọn tranh (mỗi tranh dùng 1 lần)","听对话，选出对应的图片。");var keys=legendFor(T.lm,T.lmx);legend(b3,keys);
      T.lm.forEach(function(it){letters(b3,++num,playBtn(it[0]),keys.length,keys.indexOf(it[1]),dlg(it[0]));});}
    /* nghe đoạn / hội thoại + câu hỏi */
    if(T.lq&&T.lq.length){var b4=block(h2,pn()+" · Nghe "+(lv===1?"một đoạn ngắn":"hội thoại")+" và câu hỏi, chọn đáp án","听"+(lv===1?"一段话":"对话")+"和问题，选出正确答案。");
      T.lq.forEach(function(it){choice(b4,++num,playBtn(it[0]+"|"+it[1]),it[2],it[3],dlg(it[0])+"<br><b>"+esc(it[1])+"</b>");});}
    /* ---------- 阅读 ---------- */
    scoreBar(h3);
    var bandR=document.createElement("div");bandR.className="hx-band";bandR.textContent="阅读 · ĐỌC HIỂU";h3.appendChild(bandR);pi=0;
    function rm(){if(useImg&&T.rm&&T.rm.length){var b=block(h3,pn()+" · Đọc câu, chọn tranh (mỗi tranh dùng 1 lần)","读句子，选出对应的图片。");var keys=legendFor(T.rm,T.rmx);legend(b,keys);
      T.rm.forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',keys.length,keys.indexOf(it[1]));});}}
    function rt(){if(T.rt&&T.rt[1].length){var b=block(h3,pn()+" · Chọn câu trả lời phù hợp","选择合适的答句。");var bk=document.createElement("div");bk.className="hx-bank";bk.style.flexDirection="column";bk.innerHTML=T.rt[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("");b.appendChild(bk);
      T.rt[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0])+'</span>',T.rt[0].length,it[1]);});}}
    function rf(){if(T.rf&&T.rf[1].length){var b=block(h3,pn()+" · Chọn từ điền vào chỗ trống","选词填空。");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.rf[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");b.appendChild(bk);
      T.rf[1].forEach(function(it){letters(b,++num,'<span class="hx-text">'+esc(it[0]).replace("（ ）","（　）").split("|").join("<br>")+'</span>',T.rf[0].length,it[1]);});}}
    function rp(){if(T.rp&&T.rp.length){var b=block(h3,pn()+" · Đọc đoạn văn, chọn đáp án đúng","读一段话，选择正确答案。");
      T.rp.forEach(function(it){choice(b,++num,'<div><div class="hx-text">'+esc(it[0])+'</div><div class="hx-qs">'+esc(it[1])+'</div></div>',it[2],it[3]);});}}
    if(lv===1){rm();rt();rf();rp();}else{rm();rf();rt();rp();}
    /* ---------- 书写 (HSK2+) ---------- */
    if(lv>=2&&((T.wr&&T.wr[1].length)||(T.wc&&T.wc.length))){
      var bandW=document.createElement("div");bandW.className="hx-band";bandW.textContent="书写 · VIẾT";h3.appendChild(bandW);pi=0;
      if(T.wr&&T.wr[1].length){var bw=block(h3,pn()+" · Chọn bộ phận còn thiếu của chữ","选择合适的部件，组成正确的词语。(Mỗi từ có một chữ bị thiếu một bộ phận.)");var bk=document.createElement("div");bk.className="hx-bank";bk.innerHTML=T.wr[0].map(function(o,i){return '<span><b>'+LET[i]+'</b>'+esc(o)+'</span>';}).join("　");bw.appendChild(bk);
        T.wr[1].forEach(function(it){letters(bw,++num,'<span class="hx-text">'+esc(it[0])+'</span> <small style="color:var(--muted)">'+esc(it[1])+'</small>',T.wr[0].length,it[2],"→ "+esc(it[3]));});}
      if(T.wc&&T.wc.length){var bc=block(h3,pn()+" · Viết chữ Hán còn thiếu","写汉字。(Gõ chữ còn thiếu vào ô rồi bấm Kiểm tra.)");
        T.wc.forEach(function(it){var el=document.createElement("div");el.className="hx-q";var n=++num;
          el.innerHTML=head(n,'<div><div class="hx-text">'+esc(it[0]).replace("（ ）",'（<input class="hx-in" maxlength="2" aria-label="Chữ còn thiếu">）')+'</div>'+(it[2]?'<div style="font-size:15px;color:var(--muted)">'+esc(it[2])+'</div>':"")+'</div> <button type="button" class="hx-play" data-hxchk>Kiểm tra</button> <span class="res"></span>');
          bc.appendChild(el);var q=reg(el);var inp=$("input",el);
          $("[data-hxchk]",el).addEventListener("click",function(){if(q.d||!inp.value.trim())return;var ok=inp.value.trim()===it[1];inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".res",el).innerHTML=ok?'<span class="hx-ok">✓ Đúng</span>':'<span class="hx-no">✗ Đáp án: '+esc(it[1])+'</span>';mark(q,ok);});});}
    }
    scoreUpd();
  }
  build();
  var b2=$('.sub-tab-btn[data-sub="h2"]'),b3=$('.sub-tab-btn[data-sub="h3"]');
  if(b2)b2.textContent="2 · Đề HSK: 听力";if(b3)b3.textContent="3 · Đề HSK: 阅读"+(lv>1?" & 书写":"");
  document.addEventListener("click",function(e){var r=e.target.closest&&e.target.closest("[data-hxreset]");if(r){speechSynthesis&&speechSynthesis.cancel();build();}});
}
/* ---------- chung ---------- */
document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-hxsay]");if(s){e.stopPropagation();speak(s.getAttribute("data-hxsay"),s.classList.contains("hx-play")?s:null);return;}
  var a=e.target.closest&&e.target.closest("[data-hxall]");if(a){var box=a.closest(".hx-tr");var any=$$(".reveal:not(.shown)",box).length>0;$$(".reveal",box).forEach(function(r){if(any!==r.classList.contains("shown"))r.click();});a.textContent=any?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";return;}
  var rv=e.target.closest&&e.target.closest(".hx-tr .reveal");if(rv){var li=rv.closest("li");setTimeout(function(){li.classList.toggle("shown",rv.classList.contains("shown"));},0);}
},true);
})();
</script>
<script>(function(){var W=window.__H4W||{};function put(){Object.keys(W).forEach(function(id){var sec=document.getElementById(id+"-vocab");if(!sec)return;var old=sec.querySelector(":scope > .txt-audio");if(old)old.remove();if(sec.querySelector(".vx .txt-audio"))return;var box=document.createElement("div");box.className="txt-audio";box.innerHTML="<b>🎧 生词录音 · Nghe từ mới (audio của sách)</b><audio controls preload=\"none\" src=\""+W[id]+"\"></audio>";var host=sec.querySelector(".vx")||sec;host.insertBefore(box,host.firstChild);});}put();setInterval(put,700);setTimeout(function(){var M={hb2:"2 · Chọn câu đáp",hb3:"3 · 综合练习 (sách)",h4:"4 · Viết chữ Hán",h5:"5 · Luyện nói",h2:"6 · Đề HSK: 听力",h3:"7 · Đề HSK: 阅读 & 书写",h6:"8 · Tự đánh giá"};document.querySelectorAll("#hwBody .sub-tab-btn").forEach(function(b){if(M[b.dataset.sub])b.textContent=M[b.dataset.sub];});},400);})();</script>
