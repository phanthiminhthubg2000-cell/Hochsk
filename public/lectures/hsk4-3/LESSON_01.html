<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK 4 · Bài 1 · 我们来中国学习了</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#a8433a;--deep:#6e2a24;--accent:#d9895b;--soft:#fbeee8;--cream:#fffaf6;--line:#ecd3c8;--ink:#3d2420;--muted:#86685f;--ok:#2f7d4f;--okbg:#e5f3ea;--no:#b23b32;--nobg:#fbe4e1;--gold:#c99b42}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream) 0%,var(--soft) 55%,#f7efe4 100%);min-height:100vh;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased}
.zh,.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
/* ---------- topbar ---------- */
.topbar{position:fixed;bottom:16px;right:18px;z-index:400;display:flex;gap:8px}
.topbar button{border:1px solid var(--line);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.topbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(18px,3vh,36px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.home-box{width:100%;max-width:1560px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.55);padding:clamp(24px,4vh,48px) clamp(24px,3vw,56px) 22px;box-shadow:0 20px 60px rgba(110,42,36,.08)}
.home-top{text-align:center;margin-bottom:clamp(18px,4vh,44px)}
.kicker{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--main);margin-bottom:6px}
.home h1{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(48px,7.4vw,112px);line-height:1.12;color:var(--ink)}
.home h1 .t2{color:var(--main);border-bottom:6px solid var(--accent);padding:0 6px;margin-left:10px}
.tagline{font-family:"Noto Serif SC",serif;font-size:clamp(20px,2vw,30px);letter-spacing:.12em;color:var(--muted);margin-top:14px}
.vnline{font-size:17px;color:var(--muted);margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}
.home-card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-top:5px solid var(--deep);background:rgba(255,255,255,.88);border-radius:20px;padding:18px 20px 16px;transition:transform .18s,box-shadow .18s,border-color .18s}
.home-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(110,42,36,.14);border-color:var(--accent)}
.home-card:after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--soft)}
.home-card .ic{font-size:30px;position:relative;z-index:1}
.home-card .no{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--main);margin-top:4px}
.home-card .tt{font-family:"Noto Serif SC",serif;font-size:clamp(24px,2vw,32px);font-weight:900;color:var(--ink)}
.home-card .st{font-size:15px;color:var(--muted);line-height:1.4}
.home-card.star .tt:after{content:" ★";color:var(--gold);font-size:.7em}
.home-foot{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:18px}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(61,36,32,.42);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.modal.open{display:flex}
.panel{width:min(1560px,97vw);height:94vh;background:#fffdfb;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mhead{position:relative;padding:18px 90px 0 40px;background:linear-gradient(90deg,var(--soft),#fff8ef);border-bottom:1px solid var(--line)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--main)}
.mtitle{font-family:"Noto Serif SC",serif;font-size:clamp(30px,3vw,44px);font-weight:900;color:var(--deep);line-height:1.2;margin:2px 0 10px}
.close{position:absolute;right:26px;top:22px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--main);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
.mbody{flex:1;overflow:auto;padding:28px clamp(20px,4vw,70px) 60px}
.sec{display:none;max-width:1320px;margin:0 auto}
.sec.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h3.h{font-family:"Noto Serif SC",serif;font-size:30px;color:var(--deep);margin:0 0 14px}
h4.h{font-size:22px;color:var(--main);margin:26px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:#fff6e6;border-left:5px solid var(--gold);padding:12px 18px;border-radius:12px;margin:16px 0;font-size:18px}
.vn{color:#5b4a44}
body.hide-vn .vn{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
body.hide-vn .vn.peek{filter:none}
.btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:12px;font-weight:600;font-size:16px}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--main);flex:0 0 auto;vertical-align:middle;padding:0;margin:0 4px}
.spk svg{width:17px;height:17px}.spk.playing{background:var(--main);color:#fff}
.score{display:inline-block;font-weight:800;color:var(--deep);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:16px}
/* reveal */
.rv{border:1px dashed var(--accent);background:transparent;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:17px;text-align:left}
.rv.shown{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
/* MC */
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.q .stem{font-size:22px;font-weight:600;margin-bottom:8px}
.q .ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:8px 18px;font-size:20px;text-align:left;font-family:"Noto Serif SC",serif}
.op.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.op.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .ex{display:none;margin-top:10px;font-size:17px;color:var(--muted)}
.q.done .ex{display:block}
.q.vert .ops{flex-direction:column}
/* vocab grid */
.vgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fffaf5;padding:14px 16px;min-height:118px;transition:.15s}
.vcard:hover{border-color:var(--main);transform:translateY(-2px)}
.vcard .n{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--main)}
.vcard .hz{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.3}
.vcard .py{font-size:16px;color:var(--muted)}
.vcard .st{position:absolute;right:12px;top:8px;color:var(--gold);font-size:20px}
.vcard .mv{font-size:14px;margin-top:2px}
.hide-py .py{visibility:hidden}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 18px}
table.t th{background:var(--soft);color:var(--deep);padding:12px 14px;font-size:19px;text-align:left}
table.t td{border-top:1px solid var(--line);padding:12px 14px;font-size:20px;vertical-align:top}
table.t.c th,table.t.c td{text-align:center}
/* detail */
.dmodal{z-index:200}
.dpanel{width:min(1080px,95vw);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:24px;padding:30px 40px 34px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dword{font-family:"Noto Serif SC",serif;font-size:66px;font-weight:900;color:var(--deep);line-height:1.15}
.dpy{font-size:28px;color:var(--main);margin-right:10px}
.dpos{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;padding:2px 10px;font-size:17px;font-weight:700;vertical-align:middle}
.dstar{color:var(--gold);font-weight:800;font-size:18px;margin-left:8px}
.dlab{font-size:17px;letter-spacing:.12em;font-weight:800;color:var(--main);margin:20px 0 6px;text-transform:uppercase}
.dgloss{font-family:"Noto Serif SC",serif;font-size:27px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:14px;padding:10px 16px}
.dvn{font-size:26px;font-weight:700}
.dsent{font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.7}
.dsent mark{background:none;color:var(--main);font-weight:900;border-bottom:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:20px;font-family:"Noto Serif SC",serif}
.dnav{display:flex;justify-content:space-between;margin-top:24px}
/* text */
.para{font-family:"Noto Serif SC",serif;font-size:30px;line-height:2.05;margin:0 0 20px;text-indent:2em}
.vlink{color:var(--main);font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer}
.good{font-weight:900;color:var(--deep);background:linear-gradient(transparent 62%,rgba(217,137,91,.32) 62%);cursor:pointer;border-radius:3px}
.good .vlink{color:inherit}
.idea{background:var(--soft);border-radius:14px;padding:12px 18px;margin:0 0 20px;font-size:19px}
.idea b.k{color:var(--main)}
.legend{font-size:16px;color:var(--muted);margin-bottom:14px}
.legend .vlink,.legend .good{cursor:default}
/* popover */
.pop{position:fixed;z-index:300;max-width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:none;font-size:18px}
.pop.open{display:block}
.pop .ph{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;color:var(--deep)}
.pop .pg{font-family:"Noto Serif SC",serif;font-size:21px;margin:6px 0}
.pop .fr{font-family:"Noto Serif SC",serif;background:var(--soft);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--deep);margin:6px 0}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--muted)}
/* good list */
.gcard{border-left:6px solid var(--accent)}
.gcard .gz{font-family:"Noto Serif SC",serif;font-size:25px;font-weight:900;color:var(--deep)}
.gcard .fr{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--soft);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--deep);margin:6px 0}
.gcard .ap{font-family:"Noto Serif SC",serif;font-size:21px}
/* grammar */
.form{font-family:"Noto Serif SC",serif;display:inline-block;background:var(--deep);color:#fff;border-radius:12px;padding:6px 16px;margin:4px 6px 4px 0;font-size:21px}
.exl{font-family:"Noto Serif SC",serif;font-size:23px;margin:6px 0}
.err{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:"Noto Serif SC",serif;font-size:21px}
.err .why{grid-column:1/-1;font-family:"Be Vietnam Pro",sans-serif;font-size:16px;color:var(--muted);margin-top:-4px}
.err .b{color:var(--no)}.err .g{color:var(--ok);font-weight:700}
.bk{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1.8}
.hint{font-size:16px;color:var(--muted)}
/* practice */
.pitem{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2.1;padding:10px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff}
select.sel{font:inherit;font-size:21px;border:2px solid var(--accent);border-radius:10px;padding:0 6px;background:#fffaf5;color:var(--deep);margin:0 4px}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}select.sel.no{border-color:var(--no);background:var(--nobg)}
.bank{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;letter-spacing:.2em;background:var(--soft);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pos{display:inline-flex;gap:6px;margin-left:8px}
.pos button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fffaf7;font-weight:700}
.pos button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.pos button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tag{display:inline-block;background:var(--deep);color:#fff;border-radius:8px;padding:0 10px;font-size:18px;margin-left:6px}
.totalbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"Noto Serif SC",serif;font-size:21px;line-height:1.9;background:#fff;color:var(--ink);resize:vertical}
/* svg body */
.bodywrap{display:grid;grid-template-columns:420px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.bodywrap{grid-template-columns:1fr}}
.bodysvg{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:20px}
.bl .num{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
/* games */
.fc{perspective:1200px;width:min(640px,90%);height:340px;margin:10px auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .f{background:#fff}
.fc .b{background:var(--deep);color:#fff;transform:rotateY(180deg);gap:8px}
.fc .hz{font-family:"Noto Serif SC",serif;font-size:76px;font-weight:900}
.fc .py{font-size:26px;color:var(--muted)}
.fc .b .vn{color:#ffe1cf;font-size:30px;font-weight:700}
.fc .b .g{font-family:"Noto Serif SC",serif;font-size:22px;color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:22px;min-height:62px;text-align:left;transition:.15s}
.mi.zhc{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:800;text-align:center}
.mi.sel{border-color:var(--main);background:var(--soft)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .3s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;color:var(--deep)}
.ord .ans{min-height:64px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fffaf5}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-family:"Noto Serif SC",serif;font-size:24px;box-shadow:0 2px 0 var(--line)}
.ord.ok .ans{border-color:var(--ok);background:var(--okbg)}.ord.no .ans{border-color:var(--no);background:var(--nobg)}
.ord .res{font-size:17px;margin-top:4px}
/* HSK */
.passage{font-family:"Noto Serif SC",serif;font-size:26px;line-height:2.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;text-indent:2em}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:3px solid var(--accent);font-weight:800;color:var(--main);text-indent:0;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wwords{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.wwords span{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:4px 16px;background:#fff}
.wwords span.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;margin-top:3px}
.chk li.ok .bx{background:var(--ok);border-color:var(--ok)}.chk li.ok{color:var(--ok)}
.sample{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sample .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sample .who{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--deep)}
.sample .meta{color:var(--muted);font-size:15px}
.sample .ttl{text-align:center;font-family:"Noto Serif SC",serif;font-size:24px;font-weight:800;letter-spacing:.25em;margin:4px 0 8px}
.sample .txt{font-family:"Noto Serif SC",serif;font-size:24px;line-height:2}
.sample .tr{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:17px}
.sample.showtr .tr{display:block}
.mk{border-radius:4px;padding:1px 2px}
.mark .p1{background:#efe4dc;box-shadow:inset 0 -3px 0 #a08a7d}
.mark .p2{background:#f8e9d2;box-shadow:inset 0 -3px 0 var(--gold)}
.mark .p3{background:#f9e1db;box-shadow:inset 0 -3px 0 var(--main)}
.mark .p4{background:#e3efe6;box-shadow:inset 0 -3px 0 var(--ok)}
.w5{color:var(--no);font-weight:800}
.gd{font-weight:900;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin:6px 0 14px}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step{border-top:6px solid #a08a7d}
.step .num{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;color:#a08a7d}
.step.s2{border-color:var(--gold)}.step.s2 .num{color:var(--gold)}
.step.s3{border-color:var(--main)}.step.s3 .num{color:var(--main)}
.step.s4{border-color:var(--ok)}.step.s4 .num{color:var(--ok)}

。","<b>书面<\/b>，强调“变成、结果”：成为朋友、成为中心。"],["不同点 2","宾语一般是职业、职务。","宾语范围更大，可以是关系、地位：<span class='zh'>我们<b>成为<\/b>了好朋友<\/span>（不说 <s>当了好朋友<\/s>）。"]],"opts":["当","成为"],"quiz":[["我们很快就____了好朋友。",1,"关系 → 只能用“成为”。"],["他打算回国后____一名医生。",0,"做某种工作，口语 → 当（课文）。"],["这座城市已经____了国际贸易中心。",1,"变成某种地位 → 成为。"],["小时候我想____老师。",0,"口语，职业 → 当。"]]},{"pair":"交流 — 沟通","book":false,"head":["","交流","沟通"],"rows":[["共同点","都可以表示人和人互相说想法。<br><span class='zh'>我们要多<b>交流／沟通<\/b>。<\/span>",null],["不同点 1","重在<b>互相分享<\/b>经验、文化、信息：文化交流、学术交流。<br><span class='zh'>外国学生和中国学生一起学习，互相<b>交流<\/b>。<\/span>","重在<b>让对方理解<\/b>、解决误会和问题。<br><span class='zh'>他和父母<b>沟通<\/b>以后，父母同意了。<\/span>"]],"opts":["交流","沟通"],"quiz":[["两国之间的文化____越来越多。",0,"分享文化 → 交流。"],["你们有误会，最好坐下来好好儿____一下。",1,"解决误会 → 沟通。"],["留学生可以通过各种活动和中国学生____。",0,"互相分享、认识 → 交流（课文）。"],["老师常常和家长____孩子的学习问题。",1,"为了解决问题、取得理解 → 沟通。"]]},{"pair":"表现 — 表示","book":false,"head":["","表现","表示"],"rows":[["共同点","都是动词，都有“显示出来”的意思。",null],["不同点 1","指人在学习、工作中<b>做得怎么样<\/b>，或把能力、特点表现出来；也是名词。<br><span class='zh'>她在学校<b>表现<\/b>很好。<\/span>","指<b>用语言或行动说出<\/b>态度、意思。<br><span class='zh'>他<b>表示<\/b>同意。／我向你<b>表示<\/b>感谢。<\/span>"]],"opts":["表现","表示"],"quiz":[["成绩好、____好的学生都有机会获得奖学金。",0,"做得怎么样 → 表现（课文）。"],["我代表全班向老师____感谢。",1,"说出态度 → 表示。"],["经理对他这个月的____很满意。",0,"名词：工作情况 → 表现。"],["大家都____愿意参加这次活动。",1,"说出意思 → 表示。"]]}],"COLLOC":[["动词","宾语",[["申请","签证／奖学金／学校／读研究生"],["获得","奖学金／机会／成功／好成绩"],["减轻","压力／负担／经济压力"],["适应","环境／生活／天气／新工作"],["研究","问题／文化／历史"],["参加","活动／比赛／考试"]]],["定语","中心语",[["入学","手续／通知书／考试"],["国际","公司／贸易／中文教育／学生"],["专业","知识／水平／书"],["经济","压力／发展／问题"]]],["状语／介词短语","中心语",[["通过 + 学习／交流","了解／提高／适应"],["跟 / 和 + 人","交流"],["对 + 事物","感兴趣／有热情"]]]],"META":{"fmt":2,"num":1,"title":"我们来中国学习了","vn":"Chúng tôi đến Trung Quốc du học","tagline":"来中国留学，一方面是为了学习语言和知识，另一方面也是为将来做准备","editor":"新HSK教程 4上 · HSK4 (3.0)","source":"新HSK教程 4上 · 第1课","theme":{"main":"#3f7d3a","deep":"#24521f","accent":"#c0702a","soft":"#e9f3e2","cream":"#fbfdf8","line":"#d5e4c8","ink":"#1f2d1a"},"cards":{"warm":"Nối từ với tranh · hỏi đáp v hú với văn hóa Trung Quốc."]],"note":"Rất hợp cho <b>câu mở đầu<\/b> bài viết 80–120 chữ. Sau 随着 nên dùng cụm danh từ “……的 + 发展／提高”.","try":["Viết câu mở đầu về Internet (网络) và việc học.","随着网络的发展，越来越多的人在网上学习中文。"]},{"w":"一方面……，另一方面……","use":"nêu hai lý do / hai mặt","frames":["A，一方面是为了……，另一方面也是为了……","……一方面能……，另一方面也能……"],"ex":[["我来中国留学，一方面是为了学好中文，另一方面也是为将来的工作做准备。","Tôi đến Trung Quốc du học, một mặt để học giỏi tiếng Trung, mặt khác để chuẩn bị cho công việc sau này."]],"note":"Dùng ở <b>thân bài<\/b> để trình bày lý do rõ ràng; nhớ thêm <b>也<\/b> ở vế sau.","try":["Viết lý do bạn chọn ngành học của mình.","我选择国际贸易专业，一方面是因为我对经济感兴趣，另一方面是因为这个专业好找工作。"]},{"w":"要是……，就……","use":"đưa ra điều kiện / lời khuyên","frames":["要是 + điều kiện，(chủ ngữ) 就 + kết quả","要是你也想……，就可以……"],"ex":[["要是成绩好、表现好，就有机会获得奖学金。","Nếu điểm tốt, biểu hiện tốt thì có cơ hội nhận học bổng."],["要是你有任何问题，就可以来问我。","Nếu bạn có bất kỳ vấn đề gì thì có thể đến hỏi tôi."]],"note":"Rất hợp cho <b>đoạn khuyên nhủ<\/b> trong bài giới thiệu / bài tư vấn.","try":["Khuyên bạn cách thích nghi nhanh với cuộc sống mới.","要是你多和中国学生交流，就能更快地适应这里的生活。"]},{"w":"通过","use":"nói cách thức → kết quả","frames":["通过 + cách thức（学习／交流／这些活动），chủ ngữ + kết quả"],"ex":[["通过这些交流，外国学生能更快地适应中国的大学生活。","Thông qua những giao lưu này, sinh viên nước ngoài thích nghi nhanh hơn."]],"note":"通过 thường đứng <b>đầu câu<\/b>; phía sau là kết quả tích cực (能更快地……, 了解了……).","try":["Nói kết quả của việc tham gia hoạt động trong trường.","通过参加校园活动，我认识了很多中国朋友。"]},{"w":"对……感兴趣 / 对……有热情","use":"nói sở thích, định hướng nghề","frames":["chủ ngữ + 对 + lĩnh vực + 感兴趣","chủ ngữ + 对 + lĩnh vực + 有热情，想要成为……"],"ex":[["有人对经济感兴趣，希望将来在国际公司工作。","Có người hứng thú với kinh tế, mong sau này làm ở công ty quốc tế."],["还有人对教育有热情，想要成为一名教师。","Còn có người có nhiệt huyết với giáo dục, muốn trở thành giáo viên."]],"note":"Không nói <s>我感兴趣经济<\/s> — phải có <b>对<\/b>: 我<b>对<\/b>经济感兴趣.","try":["Viết về sở thích và nghề bạn muốn làm.","我对教育很有热情，将来想成为一名中文老师。"]},{"w":"除了……，还……","use":"liệt kê thêm thông tin","frames":["除了 + A，(chủ ngữ) 还 + B"],"ex":[["除了读本科课程，他们还可以申请读硕士研究生或者博士研究生。","Ngoài học đại học, họ còn có thể xin học thạc sĩ hoặc tiến sĩ."]],"note":"除了……还…… = thêm vào (bao gồm cả A). Khác 除了……都…… = loại trừ A.","try":["Giới thiệu những nơi có trong trường.","我们学校除了图书馆和体育馆，还有好几个食堂。"]}],"GAME":{"fill":[["请把护照、{}和入学通知书给我。","签证",["签证","证件","签名","保证"]],["你们以后有{}问题都可以来找我。","任何",["任何","如何","什么","为何"]],["我觉得学校就像一{}小城市。","座",["座","个","张","条"]],["咱们可以{}奖学金，你了解过吗？","申请",["申请","请求","邀请","申明"]],["成绩好、{}好的学生都有机会获得奖学金。","表现",["表现","表示","表演","发现"]],["要是申请到奖学金，就能{}不少经济压力。","减轻",["减轻","减少","轻松","降低"]],["{}中国的发展，越来越多的外国学生来到中国学习。","随着",["随着","通过","根据","对于"]],["{}这些交流，外国学生能更快地适应中国的大学生活。","通过",["通过","随着","经过","关于"]],["还有人对教育有热情，想要{}一名教师。","成为",["成为","变成","作为","以为"]],["了解更多国际贸易{}的知识。","方面",["方面","方向","方法","方便"]]],"order":[["你们以后|有任何问题|都可以|来找我。"],["学校|就像|一座|小城市。"],["要是申请到奖学金，|就能减轻|不少|经济压力。"],["外国学生|能更快地|适应|中国的大学生活。"],["安妮|想做|一名|中文老师。"],["一方面是为了学习语言，|另一方面|也是为将来|做准备。"]]},"GOOD":[{"zh":"我觉得学校就像一座小城市，什么都有，方便极了","vn":"mình thấy trường giống như một thành phố nhỏ, cái gì cũng có, tiện vô cùng","why":"So sánh <b>A 就像 一座／一个 B<\/b> + <b>什么都有<\/b> + bổ ngữ mức độ <b>……极了<\/b> — câu miêu tả sinh động cho bài viết.","frame":"……就像一座……，什么都有，……极了","apply":"我们的宿舍就像一个小家，什么都有，舒服极了。","apply_vn":"Ký túc xá của chúng tôi giống như một ngôi nhà nhỏ, cái gì cũng có, thoải mái vô cùng."},{"zh":"要是申请到奖学金，就能减轻不少经济压力","vn":"nếu xin được học bổng thì có thể giảm bớt nhiều áp lực kinh tế","why":"Giả thiết <b>要是……，就能……<\/b> + kết hợp từ <b>减轻……压力<\/b>.","frame":"要是……，就能减轻……压力","apply":"要是每天坚持运动，就能减轻不少学习压力。","apply_vn":"Nếu ngày nào cũng kiên trì vận động thì giảm được nhiều áp lực học tập."},{"zh":"通过这些交流，外国学生能更快地适应中国的大学生活","vn":"thông qua những giao lưu này, sinh viên nước ngoài có thể thích nghi nhanh hơn với đời sống đại học Trung Quốc","why":"<b>通过 + cách thức，……能更快地 + động từ<\/b> — câu kết luận hay dùng trong văn giới thiệu.","frame":"通过……，……能更快地适应……","apply":"通过参加校园活动，新同学能更快地适应大学生活。","apply_vn":"Thông qua tham gia hoạt động, tân sinh viên thích nghi nhanh hơn với đời sống đại học."},{"zh":"来到中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作和生活做准备","vn":"đến Trung Quốc du học, một mặt là để học ngôn ngữ và kiến thức, mặt khác cũng là để chuẩn bị cho công việc và cuộc sống sau này","why":"<b>一方面是为了……，另一方面也是为……做准备<\/b> — trình bày hai mục đích, rất hợp cho câu kết bài.","frame":"……，一方面是为了……，另一方面也是为……做准备","apply":"我每天学习中文，一方面是为了通过HSK考试，另一方面也是为去中国留学做准备。","apply_vn":"Tôi học tiếng Trung mỗi ngày, một mặt để thi đỗ HSK, mặt khác để chuẩn bị đi du học Trung Quốc."}],"GRAMMAR":[{"word":"任何","title":"指示代词“任何”","py":"rènhé","pos":"代词","forms":["任何 + 名词 + 都／也 + 动词","没有任何 + 名词"],"vn":"<b>任何<\/b> = 无论什么 — <b>bất kỳ, bất cứ<\/b>. Bổ nghĩa cho danh từ thường <b>không mang 的<\/b>; phía sau hay có <b>都 / 也<\/b>. Phủ định: <b>没有任何……<\/b> (không có bất kỳ … nào).","text":"不客气，你们以后有任何问题都可以来找我。","ex":[["明天我们8点出发，任何人也不能迟到。","Mai 8 giờ chúng ta xuất phát, bất kỳ ai cũng không được đến muộn."],["学校有任何通知，我都会第一时间告诉你。","Trường có bất kỳ thông báo nào, tôi đều báo bạn ngay."],["这件事我没有告诉任何人。","Việc này tôi chưa nói với bất kỳ ai."]],"err":[["任何的问题都可以问我。","任何问题都可以问我。","任何 + danh từ, không cần 的."],["任何人能参加。","任何人都能参加。","Thường phải có 都 / 也 phối hợp."]],"book_title":"完成对话（课本 · 参考答案）","book":[["A：听说王老师特别热情？<br>B：________________。","","对，我们有任何问题都可以找她。"],["A：外国学生能参加学校运动会吗？<br>B：________________。","","能，任何学生都可以参加。"],["A：明天的会议，不会有变化了吧？<br>B：________________。","","对，不会有任何变化了。"]],"drill":[["Câu nào đúng?",["任何人都不能迟到。","任何的人不能迟到。"],0,"任何 + danh từ (không 的) + 都."],["选择：我没有____问题。",["任何","什么都"],0,"没有任何 + danh từ."]]},{"word":"要是","title":"假设复句“要是……，就……”","py":"yàoshi … jiù …","pos":"连词","forms":["要是 + giả thiết，(chủ ngữ) + 就 + kết quả","主语 + 要是 + giả thiết，就……"],"vn":"Vế trước nêu <b>giả thiết<\/b>, vế sau nêu <b>kết quả<\/b>. 要是 = 如果 nhưng khẩu ngữ hơn; có thể đứng trước hoặc sau chủ ngữ. Khi vế sau có chủ ngữ, <b>就 đứng sau chủ ngữ<\/b>.","text":"那太好了，要是申请到奖学金，就能减轻不少经济压力。","ex":[["你要是明天有时间，就跟我一起去爬山吧。","Nếu mai bạn rảnh thì đi leo núi với mình nhé."],["要是她不愿意参加比赛，我们就再问问别人。","Nếu cô ấy không muốn tham gia, chúng ta hỏi người khác."]],"err":[["要是下雨，就我们不去了。","要是下雨，我们就不去了。","就 đứng sau chủ ngữ của vế sau."]],"book_title":"完成对话（课本 · 参考答案）","book":[["A：你不开心的时候会做什么？<br>B：我要是不开心，________________。","","我要是不开心，就会去找朋友玩。"],["A：________________，咱们就去看电影。<br>B：好啊，没问题。","","要是你明天有时间，咱们就去看电影。"],["A：谢谢你帮助了我。要是________________，________________。<br>B：不客气。","","要是没有你的帮助，我自己一定做不好这件事。"]],"drill":[["选择：____明天下雨，比赛就改到下周。",["要是","虽然"],0,"Giả thiết → 要是."],["Câu nào đúng?",["要是你累了，你就休息吧。","要是你累了，就你休息吧。"],0,"就 sau chủ ngữ."]]},{"word":"随着","title":"介词“随着”","py":"suízhe","pos":"介词","forms":["随着 + ……的发展／提高／变化，……","随着 + 小句（……越来越……），……"],"vn":"Sau <b>随着<\/b> là từ ngữ hoặc câu nhỏ <b>chỉ sự thay đổi<\/b>; cả cụm là điều kiện để việc ở vế sau xảy ra. 随着 thường đứng <b>đầu câu<\/b>.","text":"随着中国的发展，越来越多的外国学生来到中国的大学学习。","ex":[["随着中文水平的提高，我现在能看懂中文报纸了。","Cùng với trình độ tiếng Trung được nâng lên, giờ tôi đọc hiểu được báo tiếng Trung."],["随着小区的环境越来越好，来这里买房子的人也变多了。","Môi trường khu dân cư ngày càng tốt, người đến mua nhà cũng nhiều lên."]],"err":[["随着中国发展很快，……","随着中国的发展，……","Sau 随着 nên là cụm danh từ “……的发展”, hoặc câu chỉ thay đổi có 越来越."]],"book_title":"完成句子（课本 · 参考答案）","book":[["随着________________，人们越来越关注身体健康。（提高）","","随着生活水平的提高，人们越来越关注身体健康。"],["随着来中国留学的人越来越多，________________。（交流）","","随着来中国留学的人越来越多，中国学生和外国学生的交流也越来越多。"],["随着________________，人们都换上了凉快的衣服。（天气）","","随着天气越来越热，人们都换上了凉快的衣服。"]],"drill":[["选择：____年龄的增长，他越来越喜欢安静。",["随着","通过"],0,"Thay đổi theo thời gian → 随着."],["选择：____这次交流，我认识了很多朋友。",["通过","随着"],0,"Cách thức → 通过."]]},{"word":"一方面","title":"并列复句“一方面……，另一方面……”","py":"yì fāngmiàn …, lìng yì fāngmiàn …","pos":"并列复句","forms":["一方面 + A，另一方面（也）+ B"],"vn":"Dùng để nói <b>hai mặt cùng tồn tại<\/b> — hai nguyên nhân, hai mục đích, hai tình huống. Vế sau hay có <b>也<\/b>.","text":"对他们来说，来到中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作和生活做准备。","ex":[["他经常在网上买东西，一方面因为便宜，另一方面因为方便。","Anh ấy hay mua đồ trên mạng, một mặt vì rẻ, mặt khác vì tiện."],["多做运动一方面能让身体更健康，另一方面也能减轻压力。","Vận động nhiều một mặt giúp khỏe hơn, mặt khác cũng giảm áp lực."]],"err":[["一方面他很聪明，另一方面他很懒。","他虽然很聪明，但是很懒。","Hai mặt trái ngược nhau → dùng 虽然……但是……."]],"book_title":"完成句子（课本 · 参考答案）","book":[["我很喜欢旅游，因为________________，________________。","","我很喜欢旅游，因为一方面可以出去玩，另一方面可以了解文化。"],["要想学好中文，________________，________________。","","要想学好中文，一方面要多读中文书，另一方面要多和中国人交流。"],["我每天骑自行车上下班，________________，________________。","","我每天骑自行车上下班，一方面对环境好，另一方面对身体也好。"]],"drill":[["选择：我学中文，一方面为了工作，____也为了旅游。",["另一方面","另外的"],0,"Cặp cố định 一方面……另一方面."],["“一方面……，另一方面……”一般表示：",["同时存在的两个方面","先后发生的两件事"],0,"Hai mặt cùng tồn tại."]]}],"HSK":{"l":[{"n":1,"d":"女：请把护照、签证和入学通知书给我。|男：好的，这是我们的证件和材料。","q":"他们在做什么？","o":["申请奖学金","办理入学手续","选择专业","参加活动"],"a":1,"why":"交护照、签证、入学通知书 → 办理入学手续。"},{"n":2,"d":"男：我们什么时候开始上课？|女：下周一开始，先试听两周，然后在网上选课。","q":"他们怎么选课？","o":["在办公室选","在网上选","老师帮他们选","试听一天后选"],"a":1,"why":"“然后在网上选课”。"},{"n":3,"d":"女：咱们的校园真大，有图书馆、体育馆，还有好几个食堂。|男：是啊，什么都有，就像一座小城市。","q":"男的觉得学校怎么样？","o":["很安静","不太方便","像一座小城市","食堂太少"],"a":2,"why":"“就像一座小城市”。"},{"n":4,"d":"男：要是申请到奖学金，就能减轻不少经济压力。|女：没错，我们一起加油吧！","q":"男的为什么想申请奖学金？","o":["为了减轻经济压力","为了认识朋友","为了让老师高兴","为了出去旅游"],"a":0,"why":"“就能减轻不少经济压力”。"},{"n":5,"d":"女：你将来想做什么？|男：我对经济感兴趣，希望将来在国际公司工作。","q":"男的将来想做什么？","o":["当医生","当老师","在国际公司工作","做研究"],"a":2,"why":"“希望将来在国际公司工作”。"},{"n":6,"d":"男：你为什么来中国留学？|女：一方面是为了学好中文，另一方面也是为将来找工作做准备。","q":"女的来中国留学是为了什么？","o":["只为了旅游","学中文和为找工作做准备","找中国朋友","研究中国历史"],"a":1,"why":"一方面……另一方面……，两个目的。"}],"r1":[{"text":["刚来中国的时候，我对这里的生活一点儿也不{7}，吃不惯，也听不懂。后来，我参加了学校的很多{8}，认识了不少中国朋友。{9}这些交流，我的中文越来越好，现在已经能用中文和朋友聊天了。下个学期，我打算{10}奖学金，减轻父母的经济压力。"],"qs":[{"n":7,"o":["适应","表现","获得","研究"],"a":0,"why":"“对……适应” → 对新生活不适应。"},{"n":8,"o":["活动","材料","证件","知识"],"a":0,"why":"“参加……活动”。"},{"n":9,"o":["通过","随着","要是","任何"],"a":0,"why":"“通过 + 交流” 表示方式。"},{"n":10,"o":["申请","通知","成为","当"],"a":0,"why":"“申请奖学金”。"}]}],"r2":[{"start":11,"paras":["然后根据自己的兴趣选择专业","很多外国学生来中国以后","先上一年的中文课程"],"ans":["B","C","A"],"why":"主语（B）→ 先……（C）→ 然后……（A）。"},{"start":14,"paras":["就能减轻不少经济压力","成绩好、表现好的学生都有机会获得奖学金","要是申请到奖学金"],"ans":["B","C","A"],"why":"先说谁能获得（B），再“要是……（C），就……（A）”。"}],"r3":[{"text":["很多外国学生来中国学习以前，就已经想好了自己的发展方向。陈天中对经济感兴趣，他想选择跟经济有关的专业，希望通过学习，了解更多国际贸易方面的知识，将来在国际公司工作。","安妮对教育很有热情，她以后想做一名中文老师，所以选择了国际中文教育专业。她说，来中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作做准备。"],"qs":[{"n":17,"s":"陈天中希望将来做什么？","o":["当中文老师","在国际公司工作","做研究","当医生"],"a":1,"why":"第一段最后。"},{"n":18,"s":"安妮为什么选择国际中文教育专业？","o":["她对经济感兴趣","她想做中文老师","这个专业容易","她父母要求的"],"a":1,"why":"“她以后想做一名中文老师，所以……”。"},{"n":19,"s":"这段话主要谈的是：","o":["外国学生的专业选择和发展方向","中国的大学食堂","怎么申请签证","怎么减轻压力"],"a":0,"why":"全文都在说选专业和将来的发展。"}]}],"w":{"start":20,"order":["学校|就像|一座|小城市","你们|有任何问题|都可以|来找我","随着中国的发展，|越来越多的|外国学生|来中国学习","我|对经济|很|感兴趣"],"pics":[["img/l01_d1.jpg","申请","她正在写入学申请，希望明年能来中国留学。"],["img/l01_d2.jpg","通知","他在看学校的通知，明天有校园活动。"],["img/l01_d3.jpg","压力","最近工作太多了，他觉得压力很大。"]],"essay":{"prompt":"请以“我的留学打算”为题，写一篇80字左右的短文。（可以用：申请、专业、将来、一方面……另一方面……）","vn":"Viết đoạn văn khoảng 80 chữ với đề “Dự định du học của tôi”.","min":80,"tips":["Nói bạn muốn đi đâu, học ngành gì.","Lý do: dùng 一方面……，另一方面…….","Chuẩn bị gì: 申请学校、签证、奖学金…","Kết: 将来想……"],"sample":"我打算明年去中国留学。我想学习国际贸易专业，一方面是因为我对经济很感兴趣，另一方面是因为将来想在国际公司工作。现在我正在准备申请材料，还想申请奖学金，减轻父母的经济压力。我相信，通过努力学习，我一定能实现自己的梦想。","svn":"Dự định năm sau du học, học thương mại quốc tế vì hứng thú với kinh tế và muốn làm công ty quốc tế; đang chuẩn bị hồ sơ, xin học bổng để giảm áp lực cho bố mẹ."}}},"PRACTICE":{"ex1":[{"bank":["入学","签证","获得","专业","食堂"],"items":[["她{}了三年的奖学金，高兴极了。",["获得"]],["我是2024年{}的，学的是国际经济专业。",["入学"]],["我打算考研究生，提高自己的{}水平。",["专业"]],["咱们晚上别去{}吃饭了，我请你出去吃饭吧。",["食堂"]],["王经理今天下午去办{}了，您明天再来找他吧。",["签证"]]]},{"bank":["加油","研究","活动","任何","将来"],"items":[["A：你{}想做什么工作？ B：我想在国际公司工作，有更多的发展机会。",["将来"]],["A：你为什么选择这门课程？ B：因为我想认真{}中国的历史和文化。",["研究"]],["A：今天下午公司有{}，我晚点儿回家。 B：好。大概几点结束？",["活动"]],["A：你们要去哪儿？ B：我们要去给参加比赛的同学{}，你去吗？",["加油"]],["A：你们这次旅游怎么样？ B：虽然天气不太好，但是和朋友在一起，做{}事情都很有意思。",["任何"]]]}],"ex2":{"title":"选择合适的内容完成短文（课本）","opts":["也会觉得有一些压力","她除了复习大学学过的课程","她决定参加硕士研究生考试","希望拿到研究生的入学通知书"],"text":"李雪还有一年就本科毕业（bìyè, tốt nghiệp）了，{1}。为了准备考试，{2}，还读了一些新的专业书，希望更多地了解这方面的知识。有时候她学习的时间很长，{3}，但是她还是坚持每天学习。随着考试的时间越来越近，李雪也更努力地复习，{4}，在新的学校里继续学习更多知识。","ans":["C","B","A","D"],"why":"(1) “还有一年就毕业了” → quyết định thi thạc sĩ (C). (2) “除了……，还……” (B). (3) “……，但是还是坚持” → có chút áp lực (A). (4) Mục tiêu: lấy giấy báo nhập học (D)."},"ex3":[["img/l01_d1.jpg","申请","她正在写入学申请。"],["img/l01_d2.jpg","通知","他正在看学校的通知。"],["img/l01_d3.jpg","压力","他最近工作压力很大。"]],"ex4":[],"ext":{"title":"","words":[],"items":[]}},"TEXT":[{"title":"办理入学手续","sub":"课文 1 · 对话","audio":"audio/1-1.mp3","scene":"在学院办公室，白家月和陈天中在办理入学手续。","scene_vn":"Ở văn phòng khoa, Bạch Gia Nguyệt và Trần Thiên Trung đang làm thủ tục nhập học.","paras":["老师：你们好，欢迎来到中国留学！请把护照、签证和入学通知书给我。","白家月：好的。这是我们的证件和材料。","（几分钟后。）","老师：办好了，这是你们的学生证，下周一开始上课。先试听两周，然后在网上选课。","白家月、陈天中：谢谢老师。","老师：不客气，你们以后有任何问题都可以来找我。"],"idea":"Cô giáo nhận hộ chiếu, <b>visa<\/b>, giấy báo <b>nhập học<\/b>; làm xong <b>thẻ<\/b> sinh viên. Thứ Hai tuần sau học, học thử hai tuần rồi chọn môn trên mạng. Có <b>bất kỳ<\/b> vấn đề gì cứ tìm cô.","qs":[["老师给白家月什么了？",["护照","签证","学生证","入学通知书"],2],["他们什么时候开始上课？",["今天","明天","下周一","两周后"],2],["他们在哪儿选课？",["在办公室","在网上","在教室","在图书馆"],1]]},{"title":"申请奖学金","sub":"课文 2 · 对话","audio":"audio/1-3.mp3","scene":"在大学校园，白家月和陈天中边逛边聊。","scene_vn":"Trong khuôn viên trường, hai bạn vừa đi dạo vừa trò chuyện.","paras":["陈天中：你看，咱们的校园真大！有图书馆、体育馆、超市，还有好几个食堂。","白家月：是啊，我觉得学校就像一座小城市，什么都有，方便极了。","陈天中：刚才老师说，咱们可以申请奖学金，你了解过吗？","白家月：我听说过一点儿，好像成绩好、表现好的学生都有机会获得奖学金。","陈天中：那太好了，要是申请到奖学金，就能减轻不少经济压力。","白家月：没错，我们一起加油吧！"],"idea":"Trường rộng, có thư viện, nhà thi đấu, siêu thị, mấy <b>nhà ăn<\/b> — như <b>một<\/b> thành phố nhỏ. Có thể <b>xin học bổng<\/b>: sinh viên điểm tốt, <b>biểu hiện<\/b> tốt có cơ hội <b>giành được<\/b>. <b>Nếu<\/b> xin được thì <b>giảm<\/b> nhiều <b>áp lực kinh tế<\/b>. Cùng <b>cố lên<\/b>!","qs":[["白家月觉得学校怎么样？",["不太大","很安静","非常不方便","像座小城市"],3],["陈天中为什么想申请奖学金？",["想提高成绩","想让家人高兴","为了减轻经济压力","为了认识表现好的同学"],2],["什么样的学生有机会获得奖学金？",["家里没钱的学生","成绩好、表现好的学生","中文最好的学生","所有的学生"],1]]},{"title":"外国学生在中国大学的学习和生活","sub":"课文 3 · 短文","audio":"audio/1-5.mp3","paras":["随着中国的发展，越来越多的外国学生来到中国的大学学习。他们可以先上一年的中文课程，然后根据自己的兴趣和需要选择专业。除了读本科课程，他们还可以申请读硕士研究生或者博士研究生。","在大学里，外国学生可以和中国学生一起学习、做研究、参加校园活动。通过这些交流，外国学生能更快地适应中国的大学生活。"],"idea":"<b>Cùng với<\/b> sự phát triển của Trung Quốc, ngày càng nhiều sinh viên nước ngoài sang học: học trước một năm <b>chương trình<\/b> tiếng Trung, rồi chọn <b>ngành<\/b>; ngoài <b>đại học<\/b> còn có thể học <b>thạc sĩ<\/b>, <b>tiến sĩ<\/b>. Cùng sinh viên Trung Quốc học, <b>nghiên cứu<\/b>, tham gia <b>hoạt động<\/b> — <b>thông qua<\/b> <b>giao lưu<\/b> mà <b>thích nghi<\/b> nhanh hơn.","qs":[["外国学生可以根据什么选择专业？",["中文水平","自己的兴趣和需要","学校的要求","家人的需要"],1],["外国学生怎么能更快地适应中国的大学生活？",["多上中文课程","多去图书馆学习","多研究中国文化","多跟中国学生交流"],3],["根据课文，下面哪个说法是对的？",["外国学生只能读本科","外国学生先上一年中文课程","外国学生不能做研究","外国学生不参加校园活动"],1]]},{"title":"专业选择与职业发展","sub":"课文 4 · 短文","audio":"audio/1-7.mp3","paras":["很多外国学生来中国学习以前，就已经想好了自己的发展方向。有人对经济感兴趣，希望将来在国际公司工作；有人喜欢学医，打算回国后当一名医生；还有人对教育有热情，想要成为一名教师。","陈天中想选择跟经济有关的专业，希望通过学习，了解更多国际贸易方面的知识。安妮以后想做一名中文老师，所以要选择国际中文教育专业。对他们来说，来到中国留学，一方面是为了学习语言和知识，另一方面也是为将来的工作和生活做准备。"],"idea":"Nhiều người đã nghĩ sẵn hướng đi: thích kinh tế → <b>sau này<\/b> làm công ty <b>quốc tế<\/b>; thích y → về nước <b>làm<\/b> bác sĩ; yêu <b>giáo dục<\/b> → <b>trở thành<\/b> <b>giáo viên<\/b>. Trần Thiên Trung chọn ngành kinh tế để hiểu kiến thức <b>thương mại<\/b> quốc tế; Annie chọn giáo dục tiếng Trung. Du học <b>một mặt<\/b> để học ngôn ngữ, <b>kiến thức<\/b>, <b>mặt khác<\/b> chuẩn bị cho tương lai.","qs":[["很多外国学生来中国学习以前，做了什么准备？",["学会了中文","找好了工作","想好了发展方向","认识了很多中国朋友"],2],["安妮以后想做什么？",["当医生","成为老师","自己开公司","做国际贸易"],1],["陈天中想了解哪方面的知识？",["国际贸易","中国历史","医学","教育"],0]]}],"TEXT_EXTRA":{"bg":"","bg_vn":""},"APPLY":{"theme":"任务活动 · 角色扮演","topic":"你的好朋友明年也想来中国留学，请你给他／她介绍留学手续和在中国的学习、生活，并给出建议。","topic_vn":"Bạn thân sang năm cũng muốn du học Trung Quốc. Hãy giới thiệu thủ tục, việc học, cuộc sống và cho lời khuyên (đóng vai gọi video, 1–2 phút).","qs":[["来中国留学，要办哪些手续？","Du học Trung Quốc phải làm những thủ tục gì?","你要先申请学校，拿到入学通知书以后，再去办学生签证。到了学校，把护照、签证和入学通知书给老师，就能办好学生证了。",["申请","入学通知书","签证","学生证"]],["在中国的大学，外国学生怎么学习？","Ở đại học Trung Quốc, sinh viên nước ngoài học thế nào?","一般先上一年的中文课程，然后根据自己的兴趣和需要选择专业。除了读本科，还可以申请读硕士或者博士。",["课程","专业","本科","硕士"]],["怎么才能更快地适应那里的生活？","Làm sao thích nghi nhanh với cuộc sống ở đó?","要是你多参加校园活动，多和中国学生交流，就能更快地适应大学生活。有任何问题，都可以找老师或者问我。",["活动","交流","适应","任何"]]],"vocab":[["手续","shǒuxù","thủ tục"],["护照","hùzhào","hộ chiếu"],["入学通知书","rùxué tōngzhīshū","giấy báo nhập học"],["学生证","xuéshēngzhèng","thẻ sinh viên"],["宿舍","sùshè","ký túc xá"],["选课","xuǎnkè","chọn môn"],["试听","shìtīng","học thử"],["建议","jiànyì","lời khuyên"]],"build_title":"选一个角色，拼出你的建议","build_lead":"Chọn một hướng, rồi chọn một câu cho mỗi bước. Bấm <b>Nghe<\/b> để nghe bài ghép, sau đó tự nói lại với bạn cùng bàn.","step_names":["① 开头","② 手续","③ 学习 · 生活","④ 建议"],"build":{"A · 介绍留学手续":[["听说你明年也想来中国留学，太好了！","你想来中国留学？我给你介绍一下吧。"],["你要先申请学校，拿到入学通知书以后再办签证。","来以前要准备好护照、签证和申请材料。"],["到了学校，先上一年中文课程，然后再选专业。","学校像一座小城市，有图书馆、食堂，什么都有。"],["要是有任何问题，就可以来问我。","你一定要早点儿准备，加油！"]],"B · 介绍奖学金":[["我想跟你说说奖学金的事。","你知道吗？在中国留学可以申请奖学金。"],["成绩好、表现好的学生都有机会获得奖学金。","申请奖学金要准备成绩单和申请材料。"],["我去年申请到了，减轻了不少经济压力。","要是申请到奖学金，就能减轻父母的经济压力。"],["所以你现在就要好好儿学习，加油！","你一定要试一试，我相信你可以的。"]],"C · 怎么适应生活":[["刚来的时候，我也不太适应这里的生活。","很多人刚来中国，都会觉得不习惯。"],["后来我参加了很多校园活动。","我常常和中国学生一起学习、做研究。"],["通过这些交流，我很快就适应了。","我的中文越来越好，还交了很多朋友。"],["我建议你也多和中国学生交流。","来中国留学，一方面能学知识，另一方面也能交朋友。"]]},"patterns":[["① 开头","听说你……，我给你介绍一下吧。","Nghe nói bạn…, mình giới thiệu một chút nhé."],["② 手续","你要先……，然后……","Bạn phải … trước, sau đó …"],["③ 学习","除了……，还可以……","Ngoài … còn có thể …"],["③ 生活","通过……，你能更快地适应……","Thông qua …, bạn sẽ thích nghi nhanh hơn với …"],["④ 建议","要是……，就……","Nếu … thì …"],["④ 建议","有任何问题，都可以……","Có bất kỳ vấn đề gì đều có thể …"]],"legend":["① Mở đầu","② Thủ tục","③ Học tập · cuộc sống","④ Lời khuyên"],"w5":["签证","入学","通知","材料","任何","申请","奖学金","表现","获得","要是","减轻","经济","压力","随着","专业","研究","活动","通过","交流","适应","将来","当","教育","成为","方面","知识"],"samples":[{"who":"介绍留学手续","meta":"Đóng vai ~1 phút","p":["听说你明年也想来中国留学，太好了！","你要先申请学校，拿到入学通知书以后再办签证。","到了学校，先上一年中文课程，然后再选专业。","要是有任何问题，就可以来问我。"],"good":["要是有任何问题，就可以来问我"],"vi":"Nghe nói năm sau bạn cũng muốn du học Trung Quốc, tốt quá! Bạn phải xin trường trước, có giấy báo nhập học rồi mới làm visa. Đến trường thì học một năm tiếng Trung trước rồi mới chọn ngành. Có bất kỳ vấn đề gì cứ hỏi mình."},{"who":"怎么适应生活","meta":"Đóng vai ~1 phút","p":["刚来的时候，我也不太适应这里的生活。","后来我参加了很多校园活动。","通过这些交流，我很快就适应了。","来中国留学，一方面能学知识，另一方面也能交朋友。"],"good":["通过这些交流，我很快就适应了"],"vi":"Lúc mới đến mình cũng chưa quen cuộc sống ở đây. Sau đó mình tham gia nhiều hoạt động trong trường. Nhờ giao lưu, mình thích nghi rất nhanh. Du học Trung Quốc một mặt học được kiến thức, mặt khác còn kết bạn được."}]},"SPEAK":{"short":"我为什么学中文","topic":"我为什么学中文？我的留学（学习）计划","topic_vn":"Dựa theo tên bài “我们来中国学习了”: nói 1–2 phút về lý do bạn học tiếng Trung và dự định du học / học tập sắp tới.","req":"📱 <b>Yêu cầu:<\/b> quay video hoặc ghi âm 1–2 phút gửi cô. Dùng ít nhất <b>2 cấu trúc<\/b> của bài (要是……就…… · 随着 · 一方面……另一方面…… · 通过) và <b>6 từ mới<\/b>.","qs":[["你是从什么时候开始学中文的？为什么？","Bạn bắt đầu học tiếng Trung từ khi nào? Vì sao?","我是两年前开始学中文的，一方面是因为我对中国文化感兴趣，另一方面是因为将来想在国际公司工作。",["一方面……另一方面……","感兴趣","将来"]],["学了中文以后，你有什么变化？","Học tiếng Trung rồi bạn có thay đổi gì?","随着中文水平的提高，我现在能看懂中文电影，还交了几个中国朋友。",["随着","提高"]],["你想去中国留学吗？想学什么专业？","Bạn có muốn du học Trung Quốc không? Muốn học ngành gì?","我想去中国读本科，学国际贸易专业。要是能申请到奖学金，就能减轻父母的经济压力。",["本科","专业","要是……就……","奖学金"]],["你觉得怎样才能学好中文？","Theo bạn làm sao học giỏi tiếng Trung?","我觉得要多和中国人交流。通过交流，我们能更快地提高口语水平。",["交流","通过"]]],"steps":[["开头","我叫……，学中文已经……了。"],["原因","我学中文，一方面……，另一方面……"],["变化 · 计划","随着……，我……；我打算……，要是……，就……"],["结尾","通过……，我相信……"]],"sample":["我叫阮明，学中文已经两年了。","我学中文，一方面是因为我对中国文化很感兴趣，另一方面是因为将来想在国际公司工作。","随着中文水平的提高，我现在能看懂中文新闻，还交了几个中国朋友。明年我打算去中国读本科，学习国际贸易专业。要是能申请到奖学金，就能减轻父母的经济压力。","我相信，通过努力学习，我一定能实现自己的梦想。"],"sample_vn":"Tôi tên Nguyễn Minh, học tiếng Trung đã hai năm. Tôi học tiếng Trung một mặt vì hứng thú với văn hóa Trung Quốc, mặt khác vì sau này muốn làm ở công ty quốc tế. Trình độ tăng lên, giờ tôi xem hiểu tin tức tiếng Trung, còn kết bạn với vài người Trung Quốc. Năm sau tôi định sang Trung Quốc học đại học ngành thương mại quốc tế. Nếu xin được học bổng thì giảm được áp lực kinh tế cho bố mẹ. Tôi tin thông qua nỗ lực học tập, tôi nhất định thực hiện được ước mơ.","check":["Nói đủ 4 ý: mở đầu → lý do → thay đổi / kế hoạch → kết","Dùng ít nhất 2 cấu trúc của bài","Dùng ít nhất 6 từ mới","Nói rõ, không đọc giấy, khoảng 1–2 phút"]},"W5":["签证","入学","通知","材料","任何","申请","奖学金","表现","获得","要是","减轻","经济","压力","随着","专业","研究","活动","通过","交流","适应","将来","当","教育","成为","方面","知识"],"WRITE":{"topic":"“留学中国”宣讲会：介绍外国学生在中国大学的学习和生活","topic_vn":"Trường sắp tổ chức buổi giới thiệu “Du học Trung Quốc”. Để sinh viên nước ngoài hiểu rõ hơn việc học và cuộc sống ở đại học Trung Quốc, hãy viết một đoạn giới thiệu, không ít hơn 120 chữ (đề 任务活动 · 写作 của sách).","steps":[["①","开头","Bối cảnh: ngày càng nhiều sinh viên nước ngoài đến Trung Quốc.","随着中国的发展，越来越多的外国学生……"],["②","入学","Thủ tục: xin trường → giấy báo → visa → thẻ sinh viên.","来中国以前，要先……；到了学校，……"],["③","学习","Học tiếng → chọn ngành → bậc học; học bổng.","可以先……，然后……；除了……，还……；要是……，就……"],["④","生活 · 结尾","Cuộc sống, giao lưu; mục đích du học.","通过……，能更快地适应……；一方面……，另一方面……"]],"pats":[["随着……的发展，越来越多的……","Mở bài — nói xu hướng."],["要是成绩好、表现好，就有机会获得奖学金。","Thông tin học bổng (要是……就……)."],["除了读本科，还可以申请读硕士或者博士。","Liệt kê thêm (除了……还……)."],["通过这些交流，……能更快地适应……","Kết quả của giao lưu (通过)."],["来中国留学，一方面是为了……，另一方面也是为……做准备。","Kết bài — hai mục đích."]],"samples":[{"who":"范文 · Bài mẫu","title":"欢迎来中国留学","p":["随着中国的发展，越来越多的外国学生来到中国的大学学习。","来中国以前，你要先申请学校，拿到入学通知书以后再办签证。到了学校，把护照、签证和入学通知书交给老师，就能拿到学生证了。","刚开始，你可以先上一年的中文课程，然后根据自己的兴趣选择专业。除了读本科，你还可以申请读硕士或者博士。要是成绩好、表现好，还有机会获得奖学金，减轻经济压力。","中国的大学校园很大，有图书馆、体育馆、超市和食堂，就像一座小城市。你可以和中国学生一起学习、参加活动，通过这些交流，你能更快地适应这里的生活。来中国留学，一方面能学习语言和知识，另一方面也能为将来的工作做准备。欢迎你来中国！"],"good":["随着中国的发展","要是成绩好、表现好，还有机会获得奖学金","通过这些交流，你能更快地适应这里的生活","一方面能学习语言和知识，另一方面也能为将来的工作做准备"],"vi":"Bố cục 4 đoạn: bối cảnh (随着) → thủ tục → học tập & học bổng (除了……还……, 要是……) → cuộc sống & kết (通过, 一方面……另一方面……)."}],"tpl":"欢迎来中国留学\n随着中国的发展，【……】。来中国以前，你要先【……】；到了学校，【……】。你可以先【……】，然后【……】。除了【……】，还【……】。要是【……】，就【……】。通过【……】，你能更快地适应【……】。来中国留学，一方面【……】，另一方面也【……】。","chk":[["bg","Có câu mở bài về bối cảnh (随着 · 越来越多)","随着|越来越多"],["proc","Có thủ tục (申请 · 签证 · 入学通知书)","申请|签证|入学"],["study","Có việc học (课程 · 专业 · 本科 · 奖学金)","课程|专业|本科|硕士|奖学金"],["end","Có câu kết (一方面……另一方面 · 欢迎)","一方面|另一方面|欢迎"]],"w5":["签证","入学","通知","材料","任何","申请","奖学金","表现","获得","要是","减轻","经济","压力","随着","专业","研究","活动","通过","交流","适应","将来","当","教育","成为","方面","知识"],"wmin":120,"wmax":220,"traps":"<b>Lưu ý:<\/b> 对……感兴趣 (không nói 感兴趣经济) · 成为 + danh từ · 随着 đứng đầu câu · 就 đứng sau chủ ngữ trong câu 要是……就……."}};</script>
