白家月就很喜欢骑车去学校，她觉得这样既方便，又能锻炼身体，还能保护环境。除了骑自行车，人们还会选择骑电动车。电动车速度快，价格不高，充电也很方便，所以越来越流行。陈天中平时也骑自行车，不过为了省力气，他最近打算买一辆电动车。"], ["Câu 2 · 听后复述（bài 7）", "杨同乐的同事刚开始和客户交流时，虽然能把产品说清楚，但是效果不理想，因为她对所有客户介绍的方式都一样。杨同乐告诉她，不同的客户关注点不一样。于是她做了几次市场调查，了解不同客户的想法，后来根据客户的情况介绍产品，效果好了很多，还谈成了一笔生意。", "原文：前段时间，杨同乐的同事谈成了一笔不错的生意。刚开始，这位同事也遇到了一些困难。拿和客户交流来说，虽然她能把产品的优缺点说得很清楚，但实际效果并不理想。杨同乐告诉她，这是因为她介绍的方式都一样。其实，不同年龄、不同性别的客户对产品的关注点是不一样的。于是，这位同事又认真地进行了几次市场调查，了解不同客户的想法。后来她在面对不同客户时，能根据他们的情况介绍产品，效果一下就好了很多。"], ["Câu 3 · 看图说话（看病）", "上个星期，小张感冒了。他一直咳嗽，咳得很厉害，头也很疼，身上一点儿力气都没有。同事看他这么难受，劝他赶快去医院检查一下。到了医院，护士先给他量了体温，发现他发烧了。医生给他做了检查，告诉他得了流行性感冒，让他按时吃药，多喝水，多休息。回到家以后，小张吃了药就上床睡觉了。睡了一觉以后，他觉得舒服多了。他想，以后一定要注意身体，不能再熬夜了。", "Tiểu Trương bị cảm, ho dữ dội → đi viện đo nhiệt độ, bị sốt, bác sĩ dặn uống thuốc đúng giờ, nghỉ ngơi → về nhà ngủ một giấc thấy đỡ hơn, tự nhủ phải chú ý sức khỏe."], ["Câu 4 · 如果你的朋友第一次来你的国家留学，你会给他哪些建议？", "如果我的朋友第一次来越南留学，我会给他三个建议。第一，要提前准备好签证、护照和入学材料，到了以后还要去学校办理入学手续。第二，最好住在学校附近，这样上课方便，也能多认识同学。租房的时候要多看几个地方，比较一下位置和价格。第三，要多和越南人交流，不要怕说错。越南人很热情，只要你主动问，大家都愿意帮助你。另外，越南有的菜比较辣，刚开始可以少吃一点儿，慢慢适应。我相信他很快就能习惯这里的生活。", ""], ["Câu 5 · 有人说“网上购物让生活更方便”，也有人说“网购让人乱花钱”，你怎么看？", "我觉得这两种说法都有道理。一方面，网上购物确实让生活更方便了。不出门就能买到想要的东西，选择多，价格也比较低，而且送货很快。拿我来说，我的衣服、书甚至水果，都是在网上买的。另一方面，网购也容易让人乱花钱。因为付钱太容易了，看到便宜的东西就想买，结果买了很多用不着的东西。所以我认为，问题不在网购本身，而在我们自己。只要买东西之前先想一想是不是真的需要，网购就能给我们带来方便。", ""]], "qMeta": {"1": {"type": "repeat", "question": "Câu 1: 听后复述 · Nghe rồi thuật lại", "images": []}, "2": {"type": "repeat", "question": "Câu 2: 听后复述 · Nghe rồi thuật lại", "images": []}, "3": {"type": "picture", "question": "Câu 3: 看图说话 · Nhìn tranh kể chuyện", "images": ["img/l06_w6.jpg", "img/l06_d2.jpg", "img/l06_d3.jpg"]}, "4": {"type": "answer", "question": "Câu 4: 如果你的朋友第一次来你的国家留学，你会给他哪些建议？", "images": []}, "5": {"type": "answer", "question": "Câu 5: 有人说“网上购物让生活更方便”，也有人说“网购让人乱花钱”，你怎么看？", "images": []}}, "timeline": [{"t": "play", "a": 0, "b": 46.983}, {"t": "win", "d": 40}, {"t": "play", "a": 46.983, "b": 99.597}, {"t": "win", "d": 40}, {"t": "play", "a": 99.597, "b": 10
