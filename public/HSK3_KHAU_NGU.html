<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK（三级） 口语 · Đề thi nói · HSK GARDEN</title><style>:root{--pri:#7a3b2e;--pri2:#a24f3c;--acc:#c98a1b;--bg:#faf6f0;--card:#fff;--ink:#2b2420;--muted:#76685f;--line:#e8ddd0;--soft:#f5ece2;--zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--vi:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(circle at 10% 0,var(--soft),transparent 40%),var(--bg);color:var(--ink);font-family:var(--vi);line-height:1.6;min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(80,50,30,.07);padding:22px 24px}
.brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--acc)}
h1{font-family:var(--zh);font-size:clamp(30px,5vw,46px);margin:4px 0 6px;color:var(--pri);line-height:1.15}h1 small{font-size:.45em;color:var(--muted);margin-left:10px;font-weight:600}
h2{font-size:21px;color:var(--pri);margin:26px 0 8px}
.lead{font-size:17px}.hint{color:var(--muted);font-size:14.5px}
.start{max-width:860px;margin:10px auto}
.struct{width:100%;border-collapse:collapse;margin:12px 0;font-size:15.5px}.struct th,.struct td{border:1px solid var(--line);padding:7px 10px;text-align:left}.struct th{background:var(--soft)}
.form{display:grid;gap:12px;margin:16px 0}.form label{display:grid;gap:4px;font-weight:700}
input[type=text],#nm{font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:500}
.modes{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}.modes>span{font-weight:700;align-self:center}
.mode{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid!important;grid-template-columns:auto 1fr;column-gap:8px;font-weight:500!important}
.mode input{grid-row:span 2;margin-top:5px}.mode small{color:var(--muted)}.mode:has(input:checked){border-color:var(--pri);background:var(--soft)}
.mic{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.meter,.vu{width:160px;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}.meter i,.vu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3c9a5f,#c98a1b,#d64545);transition:width .08s}
.vu{margin:10px auto 0;width:140px}
.tips{color:var(--muted);font-size:14.5px;padding-left:20px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 18px;background:var(--pri);color:#fff;cursor:pointer}.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--pri)}.btn.big{font-size:19px;padding:14px 30px;margin-top:8px}.btn.sm{padding:6px 12px}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;background:rgba(250,246,240,.94);backdrop-filter:blur(6px);padding:10px 4px 12px;margin-bottom:12px;font-size:16px}
.bar b{font-family:var(--zh);color:var(--pri)}.bar .right{display:flex;gap:14px;align-items:center;font-weight:700;color:var(--muted)}
.rec{color:#d64545;font-weight:900;animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}
.prog{flex-basis:100%;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.exam{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.side{position:sticky;top:86px;text-align:center}
.st b{display:block;font-size:19px;margin-top:6px}.st p{margin:6px 0 0;color:var(--muted);font-size:15px}.st .ico{font-size:64px;line-height:1.1;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
.ring{width:150px;height:150px}.ring circle{fill:none;stroke-width:10}.ring .bg{stroke:var(--soft)}.ring .fg{transform:rotate(-90deg);transform-origin:60px 60px;stroke-linecap:round;transition:stroke-dashoffset .2s linear}.ring text{font:800 26px var(--vi);text-anchor:middle;fill:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}.ctrl .btn{padding:8px 12px;font-size:14px}
.chip{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;margin:2px;font-size:13px;font-weight:700;color:var(--pri)}.done-list{margin-top:14px}
.part h3{text-align:center;font-family:var(--zh);letter-spacing:.3em;margin:0 0 10px;font-size:22px}
.ptitle{font-family:var(--zh);font-size:19px;font-weight:700}.ptime{font-family:var(--zh);color:var(--muted);margin-bottom:14px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pics.five{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.pics figure{margin:0;position:relative;border:2px solid var(--line);border-radius:14px;padding:8px;background:#fff;transition:.2s}
.pics img{width:100%;height:auto;max-height:260px;object-fit:contain;display:block;border-radius:8px}
.pics .no{position:absolute;top:6px;left:10px;font:900 20px var(--vi);color:var(--pri);background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px}
.ask{list-style:none;padding:0;margin:0;display:grid;gap:12px}.ask li{font-family:var(--zh);font-size:21px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;transition:.2s}.ask small{color:var(--muted);font-size:.75em}
.cur{border-color:#d64545!important;box-shadow:0 0 0 4px rgba(214,69,69,.15);background:#fff8f7!important}
.pnote{color:var(--muted);font-size:15.5px}
.fin{max-width:900px;margin:10px auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.recrow{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.recrow .qt{font-family:var(--zh);color:var(--muted);font-size:14.5px}.recrow audio{height:36px;max-width:280px}
.rub td:last-child{white-space:nowrap}.star{display:inline-block;margin-right:4px}.star input{display:none}.star span{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;font-weight:800}.star input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.sample{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:#fffdfa}.sample summary{cursor:pointer;font-weight:800;color:var(--pri)}
.sample .zh{font-family:var(--zh);font-size:19px;margin-top:8px;line-height:1.8}.sample .vi{color:var(--muted);margin-top:6px;font-size:15px}
@media(max-width:820px){.exam{grid-template-columns:1fr}.side{position:sticky;top:80px;order:-1;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px}.side .ring{width:84px;height:84px}.st{display:flex;align-items:center;gap:10px}.st .ico{font-size:40px}.recrow{grid-template-columns:60px 1fr;}.recrow audio{grid-column:1/-1;max-width:100%;width:100%}}
.pics.four{grid-template-columns:repeat(2,minmax(0,1fr))}
[hidden]{display:none!important}
@media(max-width:820px){.side{flex-wrap:wrap;justify-content:center}.side .ctrl{flex-basis:100%;margin-top:6px}.side .done-list{display:none}.st b{font-size:17px}}

.submit-box{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border:2px dashed var(--acc);border-radius:16px;background:#fffaf0;margin:14px 0}.submit-box .btn.big{margin:0}
.draft{margin-top:16px;border:2px dashed var(--line);border-radius:16px;padding:10px 12px;background:#fffef9}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.dhead b{color:var(--pri)}
.dtabs{display:inline-flex;gap:4px;margin-left:auto}.dtabs button,.dclear{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--pri)}
.dtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dtext{width:100%;min-height:200px;resize:vertical;font:16px/1.7 var(--zh);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:repeating-linear-gradient(#fffef9 0 27px,#efe6d8 27px 28px);outline:none}
.dcan{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
